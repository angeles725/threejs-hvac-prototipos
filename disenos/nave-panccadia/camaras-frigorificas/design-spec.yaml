# DesignSpec — nave-panccadia: cold-room envelope, cold-room doors and CAD-placed equipment
#
# This design does NOT author a standalone HTML asset. It amends the plant viewer
# that `tools/build-viewer.py` generates, and its deliverable is v21 of that page.
# The generator is the single source of truth: regenerating it from v20's inputs
# reproduced `nave-panccadia-3d-v20.html` byte for byte (358,836 B, empty diff,
# verified 2026-08-09), so hand-editing the HTML would be overwritten.

design: camaras-frigorificas
track: threejs
mode: heavy
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.1 m"

# ---------------------------------------------------------------------------
# Frame convention — the most expensive mistake this corpus ever made
# ---------------------------------------------------------------------------
# Every coordinate below is in the GROUND-FLOOR LOCAL CAD FRAME (origin
# 245.51, 208.10), the same frame every extractor writes. The viewer maps
# CAD (x, y) -> world (x, z) through mapXZ/mapZ ONCE. Blocks 8 and 9 of the
# corpus were both mirrored plans that passed every length, area, count and
# angle check, because reflection preserves all of them. Never author a world
# XZ coordinate here; author CAD and let the existing mapper do the flip.
frame: "ground-floor local CAD (origin 245.51, 208.10); viewer maps (x,y)->(x,z) via mapXZ"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex      # sum 19

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: /home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
    generator: /home/cristian/investigacion/nave-panccadia/tools/build-viewer.py
    corpus: /home/cristian/investigacion/nave-panccadia/corpus
    equipment_masters: /home/cristian/prototipos/three.js/disenos/nave-panccadia/equipos

# ---------------------------------------------------------------------------
