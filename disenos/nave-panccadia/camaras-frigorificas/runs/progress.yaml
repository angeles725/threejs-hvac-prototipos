# P6 blind review, 2026-08-09. The eight gate captures under runs/ were opened and
# READ before the generator was, then every visual suspicion was MEASURED against
# the spec's own material table before being written down here. Two suspicions were
# raised and both survived measurement; one was raised and DISMISSED (see
# dismissed_findings), which is why the two that remain are stated as defects.

captures:
  shots: ../shots.json
  count: 8
  console_clean: 8 of 8      # every *.console.json: console_clean true, issues []

passes:
  structural:
    status: failed
    attempts: 1
    score: 0.72              # threshold 0.78
    action: remediate
    blocking_finding: transom-gap-over-every-cold-door
    what_reads_correctly:
      - "the three rooms are lined and read as a different fabric from the masonry:
         flush pale skin, vertical joint lines at the 1.00 m panel pitch, continuous
         at the corners, doorways left open (cold-envelope.png)"
      - "the panel ceiling is hidden by default, as the operator asked — the lining
         is legible from above instead of sealed (cold-envelope.png)"
      - "the four doorways carry a frame + threshold + gasket bead and no conventional
         brown leaf survives at any of them"
      - "the freezer reads as the freezer without a label: the PVC strip curtain is
         visible through O3 (freezer-door.png)"
      - "the nine machines stand on their footprints; nothing floats and no leaf
         passes through fabric in either door state"
  materials:
    status: failed
    attempts: 1
    score: 0.70              # threshold 0.78
    action: remediate
    blocking_finding: stainless-reads-darker-than-the-masonry
    what_reads_correctly:
      - "painted-metal parts land where the table puts them: frame #d0d0ce measured
         against #dfe3e6 authored"
      - "the same stainless recipe reads correctly on curved and horizontal parts —
         mixer column lum 194, laminadora bench lum 213 against the authored 213"

findings:
  - id: transom-gap-over-every-cold-door
    severity: blocking
    features: [cold-door-identity, insulated-panel-envelope]
    seen_in: [cold-door.png, cold-door-closed.png, freezer-door.png, freezer-door-closed.png]
    measured: >
      buildColdDoor sets the leaf height H = min(2.10, head - 0.10) = 2.100 m and
      stands the frame head at head - FRAME_F = 2.447 - 0.090 = 2.357 m. Nothing
      fills the 0.257 m between them: with the door SHUT the captures see straight
      through the reveal into the room beyond. Four doorways, four gaps.
    why_it_matters: >
      A cold room whose doorway is open by a quarter of a metre above the leaf is not
      a cold room. The envelope critical-feature asks for a continuous lining and the
      door critical-feature asks the doorway to read as closed when it is closed;
      this defeats both, and it is the most visible thing in two of the eight frames.
    fix_direction: >
      A cold door taller than the leaf is normally made up with an insulated OVER-PANEL
      in the frame, not by stretching the leaf. Build a panel-face box spanning the run
      from H to the frame head, in the reveal, same duty thickness as the leaf.

  - id: stainless-reads-darker-than-the-masonry
    severity: blocking
    features: [cold-door-identity, equipment-reads-as-machines]
    seen_in: [cold-door-closed.png, freezer-door-closed.png, ultra.png]
    measured: >
      Authored door-leaf-stainless and equip-stainless are both #d2d6d8 (luminance 213).
      Measured medians over 36x36 px patches:
        leaf, shut, O2 chiller      #555655  lum  86   (40 % of authored)
        leaf, shut, O3 freezer      #545655  lum  86
        leaf, open, seen from ultra #717473  lum 115
        ultracongelador front       #4e504f  lum  80
        ultracongelador return side #2b2c2a  lum  44   (21 % of authored)
      The masonry wall behind them reads lum 191 and the door's own aluminium frame
      reads lum 208. The stainless is therefore DARKER than everything it is set into.
    not_a_rig_fault: >
      The identical recipe (color d2d6d8, metalness 0.90, roughness 0.30,
      envMapIntensity 1.9) reads lum 194 on a mixer column and lum 213 on the
      laminadora bench in the same page and the same rig. The variable is the NORMAL,
      not the material: at metalness 0.90 the surface is almost entirely a mirror of
      the RoomEnvironment IBL, so a large flat face returns whatever single patch of
      that room it happens to point at, while a cylinder averages the whole of it. Two
      faces of the same cabinet differing 80 vs 44 is the signature.
    why_it_matters: >
      The operator has already reported this once as "las puertas se ven negras". That
      report was answered by removing a near-black gasket PANEL, which was a real and
      different defect; the leaf itself was never measured afterwards. It still reads
      dark, so the complaint is not closed.
    fix_direction: >
      Do NOT lower metalness to fake a brighter value — that turns steel into painted
      board and is the move LEARNINGS forbids. Give the flat metal something to
      reflect: lower metalness only to the physical 0.85 band IF paired with a brushed
      roughnessMap, and prefer adding an interior bounce/fill the vertical faces can
      return, then re-measure both faces of the ultracongelador.

dismissed_findings:
  - id: green-boxes-beside-the-laminadora
    seen_in: [laminado.png]
    measured: "two extruded prisms at #0e2c24, lum 37, flanking the modelled sheeter"
    verdict: declared-scope
    reason: >
      Not placeholders for a replaced machine. The generator models 5 of the 35 drawn
      labels and says so in its own comments; the spec's invariant only forbids a green
      box surviving for an item that WAS replaced. These two are unmodelled machines,
      i.e. known remaining scope, not a defect of this pass.

perf:
  budget: {draws: 750, tris: 300000}
  status: not-re-measured
  note: >
    The perf probe was run against v20 (478 draws / 22,843 tris) when the budget was
    set; it was never re-run against v21. Recorded as unmeasured rather than assumed
    green — the envelope, four doors and nine machines are exactly what the budget was
    written to catch.

verdict:
  gate: failed
  reason: >
    Both scored passes are below their 0.78 threshold on one blocking finding each.
    The build's structure, placement, identity and interaction all hold; what fails is
    a missing over-panel and the tonal value of the flat stainless.
  next: >
    v22, in the generator, not in the HTML: (1) over-panel in the four door frames,
    (2) make the flat metal return a plausible value and re-measure it, (3) re-run the
    eight captures and the perf probe.
