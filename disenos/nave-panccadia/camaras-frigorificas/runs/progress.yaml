    structural 0.80 and materials 0.78, both at or over the 0.78 threshold, on v22.
    The one blocking finding is fixed and asserted in the build; the materials finding
    was retracted on measurement and stands as an operator-facing observation, not a
    defect.
  next: >
    ALL THREE closed on 2026-08-10. The stainless VALUE went to the operator with an A/B measurement
    and the operator kept 1.9 (see materials.resolved_2026_08_10). The condensing units now have a
    DesignSpec and a scored pass of their own in equipos/condensadora/, which found and fixed a real
    defect in the BRACKET state. [Block 39]'s z-fighting rule reached the design3d kit as an
    executable detector (coplanarPairs / checkCoplanar in library/harness/geom-verify.mjs), and the
    viewer stopped grading its own coplanarity — it publishes raw boxes via __qaBoxes and the
    numerics run outside the page.
    Still open, and not blocking: the four units INSTALLED in the viewer are a separate artefact from
    the master and were not re-scored.
  review_note: >
    This review raised three visual suspicions and only one of them survived being
    measured. Both casualties died the same way — a patch sampled by eye rather than by
    projected geometry, then compared against the wrong reference (an albedo hex, and a
    painted dielectric mistaken for the steel). The one that survived did so because its
    evidence was the generator's own arithmetic, not a pixel.
