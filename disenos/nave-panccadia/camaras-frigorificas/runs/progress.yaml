    verdict: declared-scope
    reason: >
      Not placeholders for a replaced machine. The generator models 5 of the 35 drawn
      labels and says so in its own comments; the spec's invariant only forbids a green
      box surviving for an item that WAS replaced. These two are unmodelled machines,
      i.e. known remaining scope, not a defect of this pass.

