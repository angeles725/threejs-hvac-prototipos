findings:
  - id: transom-gap-over-every-cold-door
    severity: blocking
    features: [cold-door-identity, insulated-panel-envelope]
    seen_in: [cold-door.png, cold-door-closed.png, freezer-door.png, freezer-door-closed.png]
    measured: >
      buildColdDoor sets the leaf height H = min(2.10, head - 0.10) = 2.100 m and
      stands the frame head at head - FRAME_F = 2.447 - 0.090 = 2.357 m. Nothing
      fills the 0.257 m between them: with the door SHUT the captures see straight
      through the reveal into the room beyond. Four doorways, four gaps.
    why_it_matters: >
      A cold room whose doorway is open by a quarter of a metre above the leaf is not
      a cold room. The envelope critical-feature asks for a continuous lining and the
      door critical-feature asks the doorway to read as closed when it is closed;
      this defeats both, and it is the most visible thing in two of the eight frames.
    fix_direction: >
      A cold door taller than the leaf is normally made up with an insulated OVER-PANEL
      in the frame, not by stretching the leaf. Build a panel-face box spanning the run
      from H to the frame head, in the reveal, same duty thickness as the leaf.

  - id: flat-vertical-stainless-is-at-target-but-reads-dark-in-a-pale-interior
    severity: observation           # was written up as blocking; SEE retraction below
    features: [cold-door-identity, equipment-reads-as-machines]
    seen_in: [cold-door-closed.png, freezer-door-closed.png, ultra.png]
    retraction: >
      The first version of this row called the stainless a blocking defect for measuring
      lum 86 against "the authored 213". That comparison was WRONG twice over and the
      row is corrected rather than deleted, because the mistake is the instructive part.
      (a) 213 is the ALBEDO hex #d2d6d8. The kit's own brushed-stainless recipe states in
      capitals that the gate target is the RENDERED value, sRGB (86,92,97), NOT the albedo
      — so the leaf at lum 86 is ON target, not at 40 % of it.
      (b) The supporting claim "the same recipe reads 194 on a mixer column" was a
      WRONG-MATERIAL sample: that column is `EQ.enamel` (#b9bfc4, metalness 0.0), a
      painted dielectric, not the steel. Measured by eye-picked patch, not by projected
      geometry — the exact trap the ledger already records.
      Cross-check that settles it: the ultracongelador's OWN gated master capture, which
      passed its materials gate at 0.76-0.80, measures lum 54-55 on the same faces. The
      value in the viewer is not a regression; it is brighter than the master's.
    what_survives_measurement: >
      One claim does survive, on a same-material comparison: `EQ.steel` spans lum 44 to
      213 across this one page by ORIENTATION alone — 213 on the laminadora bench (a
      horizontal face returning the bright top of the RoomEnvironment IBL), 86 on a
      vertical door leaf, 44 on the ultracongelador's return side. At metalness 0.90 a
      large flat face mirrors whichever single patch of the IBL it points at.
      And the viewer's rig omits recipe rule 2: there is no FRONTAL fill (positive Z)
      — only HemisphereLight 0.35 and a DirectionalLight sun. The recipe names that fill
      as the thing that saves vertical faces, and the standalone masters all carry it.
    why_it_still_matters_to_the_operator: >
      The target itself was calibrated on the masters' DARK background, where lum 86
      reads as satin. Here the same value sits against masonry at lum 191, so a
      physically on-target leaf still reads as a dark door — which is what the operator
      described. That is a CONTEXT decision, not a material defect, and it is his to
      make; the pass no longer claims it as a failure.
    fix_direction: >
      If the operator wants the leaves lighter, add the recipe's missing frontal fill and
      re-measure, or re-derive a colorTarget for a PALE interior instead of inheriting one
      measured against a dark background. Never lower metalness to fake the value.

dismissed_findings:
  - id: green-boxes-beside-the-laminadora
    seen_in: [laminado.png]
    measured: "two extruded prisms at #0e2c24, lum 37, flanking the modelled sheeter"
    verdict: declared-scope
    reason: >
      Not placeholders for a replaced machine. The generator models 5 of the 35 drawn
      labels and says so in its own comments; the spec's invariant only forbids a green
      box surviving for an item that WAS replaced. These two are unmodelled machines,
      i.e. known remaining scope, not a defect of this pass.

perf:
  budget: {draws: 750, tris: 300000}
  status: not-re-measured
  note: >
    The perf probe was run against v20 (478 draws / 22,843 tris) when the budget was
    set; it was never re-run against v21. Recorded as unmeasured rather than assumed
    green — the envelope, four doors and nine machines are exactly what the budget was
    written to catch.

verdict:
  gate: failed
  reason: >
    ONE blocking finding, in structural: the 0.257 m opening left above every cold-door
    leaf. Materials passes at threshold — its finding was retracted on measurement (see
    the retraction field) and downgraded to an operator-facing observation.
  next: >
    v22, in the generator, not in the HTML: (1) an insulated over-panel in the four door
    frames, (2) re-run the eight captures, (3) run the perf probe against v21/v22 instead
    of inheriting v20's numbers. The stainless value is NOT queued as a fix; it is queued
    as a question for the operator.
  review_note: >
    This review raised three visual suspicions and only one of them survived being
    measured. Both casualties died the same way — a patch sampled by eye rather than by
    projected geometry, then compared against the wrong reference (an albedo hex, and a
    painted dielectric mistaken for the steel). The one that survived did so because its
    evidence was the generator's own arithmetic, not a pixel.
