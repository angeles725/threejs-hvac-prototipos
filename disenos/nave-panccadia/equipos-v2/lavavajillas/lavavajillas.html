<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavavajillas tipo campana — nave Panccadia</title>
<link rel="icon" href="data:,">                     <!-- favicon 404 pollutes the console sidecar -->
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)}
  #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0f1622;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:5px 8px;cursor:pointer}
  #panel button.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Lavavajillas tipo campana</div>
  <div><span class="pass">PASS: materials</span> <span class="dim">· pass-through hood dishwasher</span></div>
  <div class="dim">0.95 × 0.54 × 1.42 m (campana abajo)</div>
</div>
<div id="panel">
  <button id="btn-rot">AUTO-ROTATE</button>
  <button id="btn-hood" class="on">HOOD UP-DOWN</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 24);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;   // attempt2: faces read underexposed; small lift for satin-metal read
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

// hero camera: az42 el22 fov40 (spec camera)
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
const R = 3.1, AZ = 42*Math.PI/180, EL = 22*Math.PI/180, TY = 0.72;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TY + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TY, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TY, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;   // OFF by default (gate captures need a settled frame)

// ---- IBL + house rig + brushed-stainless recipe (env 2.15 + frontal fill) ----
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;   // bright IBL so bare metal has something to reflect (else stainless reads black)

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5, 2.5); sun.castShadow = true;   // attempt2: lower key elevation grazes the vertical faces (recipe under-specified the key elevation)
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2; sun.shadow.camera.right=2; sun.shadow.camera.top=2.5; sun.shadow.camera.bottom=-2.5;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));   // lifts upward-facing stainless
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7);
fill.position.set(1.5, 2.0, 5); scene.add(fill);                // frontal: lights the VERTICAL faces the top rig misses

// ---- brushed-stainless roughness map (shared recipe) ----
function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });
const matBezel = new THREE.MeshStandardMaterial({ color:0x14181c, metalness:0.0, roughness:0.5 });
const matDisplay = new THREE.MeshStandardMaterial({ color:0x0a1a14, metalness:0.0, roughness:0.4,
  emissive:0x18e08a, emissiveIntensity:0.9 });

// ---- ground plane ----
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({ color:0x0c1016, metalness:0, roughness:0.95 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ---- lavavajillas geometry (from design-spec: 0.95 x 0.54 x 1.42 m hood-down) ----
const LX = 0.95, LZ = 0.54, legH = 0.13;
const root = new THREE.Group(); scene.add(root);

// legs (short adjustable)
const legGeo = new THREE.CylinderGeometry(0.022, 0.022, legH, 14);
const legX = LX/2 - 0.10, legZ = LZ/2 - 0.09;
for (const sx of [-1,1]) for (const sz of [-1,1]){
  const leg = new THREE.Mesh(legGeo, matSteel);
  leg.position.set(sx*legX, legH/2, sz*legZ); leg.castShadow = true; root.add(leg);
}

// lower wash body (tank + base): full footprint, y 0.13..0.98
const bodyH = 0.85, bodyY0 = legH;
const body = new THREE.Mesh(new THREE.BoxGeometry(LX, bodyH, LZ), matSteel);
body.position.y = bodyY0 + bodyH/2; body.castShadow = body.receiveShadow = true; root.add(body);

// wash-chamber front opening: recessed dark rectangle on the +Z face
const opening = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.42, 0.03), matDark);
opening.position.set(-0.08, bodyY0 + 0.30, LZ/2 - 0.005); root.add(opening);

// control panel on front face, operator height ~0.62: dark bezel + emissive display + 3 buttons
const panel = new THREE.Group();
const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.20, 0.03), matBezel);
bezel.position.set(0.28, 0.66, LZ/2 + 0.006); panel.add(bezel);
const disp = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.07, 0.01), matDisplay);
disp.position.set(0.28, 0.72, LZ/2 + 0.021); panel.add(disp);
for (let i=0;i<3;i++){ const b = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.012,16), matSteel);
  b.rotation.x = Math.PI/2; b.position.set(0.22 + i*0.06, 0.61, LZ/2 + 0.021); panel.add(b); }
root.add(panel);

// square lift-hood (the signature raising cover), hinged at back, modelled closed
const hood = new THREE.Group();
const hoodW = 0.66, hoodD = 0.50, hoodH = 0.58;
const hoodBox = new THREE.Mesh(new THREE.BoxGeometry(hoodW, hoodH, hoodD), matSteel);
hoodBox.castShadow = hoodBox.receiveShadow = true; hood.add(hoodBox);
// front handle bar
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,hoodW*0.7,14), matSteel);
handle.rotation.z = Math.PI/2; handle.position.set(0, -hoodH/2 + 0.10, hoodD/2 + 0.03); hood.add(handle);
hood.position.set(0.02, 0.84 + hoodH/2, -0.02);   // overlaps body top by ~0.14 (comes down over wash chamber)
root.add(hood);

// ---- interaction ----
let hoodUp = false;
const hoodBaseY = hood.position.y;
document.getElementById('btn-rot').addEventListener('click', (e)=>{
  controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); });
document.getElementById('btn-hood').addEventListener('click', (e)=>{
  hoodUp = !hoodUp; hood.position.y = hoodBaseY + (hoodUp ? 0.35 : 0);
  e.target.classList.toggle('on', !hoodUp); renderer.shadowMap.needsUpdate = true; });

// ---- render loop + shadow bake ----
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); });
let baked = false;
function animate(){ requestAnimationFrame(animate); controls.update();
  renderer.render(scene, camera);
  if(!baked){ renderer.shadowMap.needsUpdate = true; baked = true;
    document.documentElement.setAttribute('data-app-ready','true'); } }
animate();
globalThis.__lavavajillasApp = { runtime: { scene, camera, renderer } };
</script>
</body>
</html>
