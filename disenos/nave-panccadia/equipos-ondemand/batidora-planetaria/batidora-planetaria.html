<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batidora planetaria — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Batidora planetaria — acero inox + esmalte</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· batidor globo + tazón</span></div>
  <div class="dim">alto 1.38 m · tazón Ø0.46 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnMix">MIX</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 6, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
const R = 3.0;
camera.position.set(R*Math.cos(0.7)*Math.cos(0.35), 0.9 + R*Math.sin(0.35), R*Math.sin(0.7)*Math.cos(0.35));
camera.lookAt(0, 0.75, 0.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.75, 0.05);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-1.5; sun.shadow.camera.right=1.5; sun.shadow.camera.top=2.4; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(16,16),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matEnamel= new THREE.MeshStandardMaterial({ color:0xe8e6e0, metalness:0.0, roughness:0.45 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });

const cyl=(rt,rb,h,mat,seg=28)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const BZ = 0.10;   // bowl/beater z offset (forward)

// base (heavy, enamel)
const base = cyl(0.30,0.34,0.20,matEnamel,32); base.position.set(0,0.10,-0.06); unit.add(base);
const baseSkirt = box(0.56,0.10,0.5,matEnamel); baseSkirt.position.set(0,0.05,-0.02); unit.add(baseSkirt);
// column (curved enamel) — a vertical rounded column at the back
const column = cyl(0.17,0.19,0.95,matEnamel,28); column.position.set(0,0.20+0.475,-0.16); unit.add(column);
// head (cantilevered forward)
const head = new THREE.Group();
const headBody = cyl(0.16,0.16,0.5,matEnamel,28); headBody.rotation.z=Math.PI/2; headBody.position.set(0,1.16,-0.02); head.add(headBody);
const headFront = cyl(0.15,0.16,0.2,matEnamel,28); headFront.rotation.x=Math.PI/2; headFront.position.set(0,1.16,BZ); head.add(headFront);
const headNose = cyl(0.11,0.13,0.12,matSteel,24); headNose.position.set(0,1.03,BZ); head.add(headNose);
unit.add(head);
// speed lever
const lever = cyl(0.012,0.012,0.14,matDark,10); lever.rotation.z=0.5; lever.position.set(0.18,1.02,-0.02); unit.add(lever);
const leverKnob = new THREE.Mesh(new THREE.SphereGeometry(0.03,16,12),matDark); leverKnob.position.set(0.24,1.06,-0.02); unit.add(leverKnob);

// bowl (rounded stainless) in a yoke
const bowl = new THREE.Group();
const bwall = new THREE.Mesh(new THREE.CylinderGeometry(0.23,0.14,0.34,40,1,true),matSteel); bwall.castShadow=bwall.receiveShadow=true; bowl.add(bwall);
const bbottom = new THREE.Mesh(new THREE.SphereGeometry(0.155,28,18,0,Math.PI*2,0,Math.PI/2),matSteel); bbottom.rotation.x=Math.PI; bbottom.position.y=-0.17; bowl.add(bbottom);
const brim = new THREE.Mesh(new THREE.TorusGeometry(0.23,0.011,8,40),matSteel); brim.rotation.x=Math.PI/2; brim.position.y=0.17; bowl.add(brim);
bowl.position.set(0,0.62,BZ); unit.add(bowl);
// yoke arms
for(const sx of [-1,1]){ const arm=cyl(0.018,0.018,0.4,matSteel,12); arm.position.set(sx*0.25,0.55,BZ); arm.rotation.z=sx*0.12; unit.add(arm); }
const yokeBase = box(0.5,0.04,0.18,matSteel); yokeBase.position.set(0,0.36,BZ); unit.add(yokeBase);

// balloon whisk beater (multiple curved wire loops) — spins
const beater = new THREE.Group();
class Wire extends THREE.Curve{ constructor(r,h){super();this.r=r;this.h=h;}
  getPoint(t,tv=new THREE.Vector3()){ const y=this.h*(0.5-t); const bulge=Math.sin(t*Math.PI)*this.r; return tv.set(bulge,y,0); } }
const NW=7;
for(let i=0;i<NW;i++){ const w=new THREE.Mesh(new THREE.TubeGeometry(new Wire(0.13,0.30),40,0.006,6,false),matSteel);
  w.castShadow=true; w.rotation.y=(i/NW)*Math.PI*2; beater.add(w); }
const bshaft = cyl(0.015,0.015,0.16,matSteel,12); bshaft.position.y=0.22; beater.add(bshaft);
const bhub = cyl(0.03,0.03,0.05,matSteel,16); bhub.position.y=0.15; beater.add(bhub);
beater.position.set(0,0.86,BZ); unit.add(beater);

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); requestRender(); };
let mixing=false; const btnMix=document.getElementById('btnMix');
btnMix.onclick=()=>{ mixing=!mixing; btnMix.classList.toggle('on',mixing); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

globalThis.__batidoraApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){ requestAnimationFrame(animate);
  if(mixing){ beater.rotation.y += 0.08; needsRender=true; }
  controls.update(); if(needsRender){ renderer.render(scene,camera); needsRender=false; } }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
