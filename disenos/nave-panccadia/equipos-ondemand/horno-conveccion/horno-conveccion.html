<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horno de convección — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Horno de convección — acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· puerta de vidrio + ventilador</span></div>
  <div class="dim">~0.92 × 0.85 m · alto 1.55 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnFan">FAN</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 6, 24);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const R = 3.4;
camera.position.set(R*Math.cos(0.73)*Math.cos(0.35), 1.1 + R*Math.sin(0.35), R*Math.sin(0.73)*Math.cos(0.35));
camera.lookAt(0, 0.95, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.9, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.5, 6, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2; sun.shadow.camera.right=2; sun.shadow.camera.top=2.6; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(18,18),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matRack  = new THREE.MeshStandardMaterial({ color:0x9aa0a4, metalness:0.85, roughness:0.45 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });
const matGlass = new THREE.MeshStandardMaterial({ color:0x1a2426, metalness:0.0, roughness:0.12, transparent:true, opacity:0.42 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=20)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const W=0.92, D=0.85, STAND=0.62, BODY=0.78;

// stand (open frame: 4 legs + a lower shelf)
for(const sx of [-1,1]) for(const sz of [-1,1]){ const l=box(0.05,STAND,0.05,matSteel); l.position.set(sx*(W/2-0.06),STAND/2,sz*(D/2-0.06)); unit.add(l);
  const f=cyl(0.03,0.024,0.03,matDark,10); f.position.set(sx*(W/2-0.06),0.015,sz*(D/2-0.06)); unit.add(f); }
const shelf=box(W-0.1,0.03,D-0.1,matSteel); shelf.position.y=0.22; unit.add(shelf);

// oven body shell (front open for door)
const cy = STAND + BODY/2;
const wt=0.05;
unit.add((()=>{const b=box(W,BODY,wt,matSteel); b.position.set(0,cy,-D/2+wt/2); return b;})()); // back
unit.add((()=>{const b=box(wt,BODY,D,matSteel); b.position.set(-W/2+wt/2,cy,0); return b;})());
unit.add((()=>{const b=box(wt,BODY,D,matSteel); b.position.set(W/2-wt/2,cy,0); return b;})());
unit.add((()=>{const b=box(W,wt,D,matSteel); b.position.set(0,STAND+BODY-wt/2,0); return b;})()); // top of oven cavity
unit.add((()=>{const b=box(W,wt,D,matSteel); b.position.set(0,STAND+wt/2,0); return b;})()); // floor of cavity
// front frame around the door
unit.add((()=>{const b=box(0.10,BODY,0.06,matSteel); b.position.set(W/2-0.05,cy,D/2-0.03); return b;})()); // right jamb (hinge/handle side)
unit.add((()=>{const b=box(0.06,BODY,0.06,matSteel); b.position.set(-W/2+0.03,cy,D/2-0.03); return b;})());

// racks + fan inside (visible through glass)
for(let i=0;i<5;i++){ const r=box(W-0.2,0.012,D-0.18,matRack); r.position.set(0,STAND+0.12+i*0.13,-0.02); unit.add(r); }
const fan=new THREE.Group();
const fanHub=cyl(0.05,0.05,0.03,matDark,16); fanHub.rotation.x=Math.PI/2; fan.add(fanHub);
for(let i=0;i<5;i++){ const bl=box(0.16,0.006,0.05,matRack); bl.position.set(0.09,0,0); const g=new THREE.Group(); g.add(bl); g.rotation.z=(i/5)*Math.PI*2; fan.add(g); }
const fanRing=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.012,8,28),matRack); fan.add(fanRing);
fan.position.set(0, cy, -D/2+0.10); unit.add(fan);

// glass door + handle
const door=new THREE.Group();
const glass=box(W-0.18,BODY-0.1,0.02,matGlass); glass.position.set(-0.02,cy,D/2-0.02); door.add(glass);
const gfTop=box(W-0.12,0.05,0.04,matSteel); gfTop.position.set(-0.02,cy+BODY/2-0.06,D/2-0.02); door.add(gfTop);
const gfBot=box(W-0.12,0.05,0.04,matSteel); gfBot.position.set(-0.02,cy-BODY/2+0.06,D/2-0.02); door.add(gfBot);
const handle=cyl(0.018,0.018,BODY-0.16,matSteel,12); handle.position.set(0.34,cy,D/2+0.05); door.add(handle);
for(const yy of [cy-0.28,cy+0.28]){ const br=cyl(0.01,0.01,0.06,matSteel,8); br.rotation.x=Math.PI/2; br.position.set(0.34,yy,D/2+0.02); door.add(br); }
unit.add(door);

// control panel strip on top-front
const cpanel=box(W,0.14,0.06,matDark); cpanel.position.set(0, STAND+BODY+0.07, D/2-0.04); unit.add(cpanel);
const disp=new THREE.Mesh(new THREE.PlaneGeometry(0.22,0.08), new THREE.MeshStandardMaterial({color:0x0a1a14,emissive:0x00d4aa,emissiveIntensity:0.9,roughness:0.4}));
disp.position.set(-0.2, STAND+BODY+0.07, D/2-0.005); disp.rotation.y=0; unit.add(disp);
for(let i=0;i<3;i++){ const k=cyl(0.022,0.022,0.03,matSteel,14); k.rotation.x=Math.PI/2; k.position.set(0.12+i*0.11, STAND+BODY+0.07, D/2-0.005); unit.add(k); }

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); requestRender(); };
let fanning=false; const btnFan=document.getElementById('btnFan');
btnFan.onclick=()=>{ fanning=!fanning; btnFan.classList.toggle('on',fanning); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

globalThis.__hornoConvApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){ requestAnimationFrame(animate);
  if(fanning){ fan.rotation.z += 0.25; needsRender=true; }
  controls.update(); if(needsRender){ renderer.render(scene,camera); needsRender=false; } }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
