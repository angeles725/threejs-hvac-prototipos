# DesignSpec — ultracongelador (blast freezer / abatidor)
design: ultracongelador
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    Blast freezer: a thick-insulated brushed-stainless cabinet with a heavy solid insulated door,
    a chunky lever LATCH handle, a small viewing window, and a control panel with a cold (cyan)
    temperature display. Heavy latch + insulated door = identity (distinct from the glass proofers).

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    insulated_cabinet: "disenos/nave-panccadia/equipos/camara-fermentacion/camara-fermentacion.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'ultracongelador' block"
    evidences: "footprint 2.18 x 1.02 m [CERT] (wide roll-in blast freezer / includes door clearance)"
    suitability: pass
  - source: "Blast freezer standard class (Irinox/Foster blast chiller-freezer, brand-neutral)"
    evidences: "thick-insulated cabinet, heavy solid door with a lever latch + gasket, small window, digital controller showing sub-zero temp, roll-in or reach-in racks"
    suitability: pass

dimensions_real:
  length_m: {value: 1.30, confidence: med}   # body width (front)
  width_m:  {value: 1.00, confidence: med}   # depth
  height_m: {value: 2.00, confidence: med}
  door_edge_m: {value: 0.10, confidence: med}  # insulated door thickness

hierarchy:
  - name: root
    children:
      - name: cabinet
        pivot: [0, 0, 0]
        animation: none
      - name: insulated_door
        pivot: [-0.55, 1.0, 0.5]
        animation: open_hinge
      - name: latch_handle
        pivot: [0.4, 1.0, 0.55]
        animation: none
      - name: control_panel
        pivot: [0.0, 1.75, 0.5]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-window
    family: glass
    color: "#132024"
    metalness: 0.0
    roughness: 0.12
    evidence: "small door window, transparent opacity"
    source: table
    confidence: 0.8
  - id: latch-dark
    family: plastic
    color: "#26292d"
    metalness: 0.0
    roughness: 0.5
    evidence: "latch handle + gasket, dielectric"
    source: table
    confidence: 0.8
  - id: cold-display
    family: plastic
    color: "#04141a"
    metalness: 0.0
    roughness: 0.4
    evidence: "controller display; cyan = cold setpoint (ISA-101 uses color for meaning)"
    source: estimated
    confidence: 0.75

critical_features:
  - id: insulated-door-latch
    desc: "A heavy solid insulated door (thick edge) with a chunky vertical LEVER latch handle + gasket — the blast-freezer signature, unmistakably not a glass proofer door."
    threshold: 0.75
  - id: cold-controls
    desc: "A control panel with a cyan/cold digital display reads as a freezer controller (sub-zero setpoint), distinct from the green proofer displays."
    threshold: 0.72
  - id: insulated-cabinet-scale
    desc: "A thick-insulated brushed-stainless cabinet at floor scale reads as a blast freezer beside a 1.8 m person."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 26
    tris: 90000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "DOOR (open)"
