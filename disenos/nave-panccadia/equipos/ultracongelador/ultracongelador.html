<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultracongelador — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Ultracongelador (blast freezer) — acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· puerta aislada + palanca</span></div>
  <div class="dim">~1.30 × 1.00 m · alto 2.00 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">DOOR</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 6, 24);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const Rr = 4.0;
camera.position.set(Rr*Math.cos(0.73)*Math.cos(0.33), 1.25 + Rr*Math.sin(0.33), Rr*Math.sin(0.73)*Math.cos(0.33));
camera.lookAt(0, 1.05, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.0, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.5, 6.5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2; sun.shadow.camera.right=2; sun.shadow.camera.top=2.8; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(18,18),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matDoor  = new THREE.MeshStandardMaterial({ color:0xc4c8ca, metalness:0.9, roughness:0.34 });
const matLatch = new THREE.MeshStandardMaterial({ color:0x26292d, metalness:0.0, roughness:0.5 });
const matGasket= new THREE.MeshStandardMaterial({ color:0x14161a, metalness:0.0, roughness:0.8 });
const matWin   = new THREE.MeshStandardMaterial({ color:0x132024, metalness:0.0, roughness:0.12, transparent:true, opacity:0.5 });
const matCold  = new THREE.MeshStandardMaterial({ color:0x04141a, emissive:0x22c7ff, emissiveIntensity:0.9, roughness:0.4 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=16)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const W=1.30, D=1.00, H=2.00;

// legs + plinth
for(const sx of [-1,1]) for(const sz of [-1,1]){ const l=cyl(0.028,0.028,0.13,matLatch,10); l.position.set(sx*(W/2-0.1),0.065,sz*(D/2-0.1)); unit.add(l); }
// thick insulated cabinet body (front recessed for the door)
const body = box(W, H-0.13, D, matSteel); body.position.set(0, 0.13+(H-0.13)/2, -0.03); unit.add(body);
// door opening frame (gasket)
const gasket = box(W-0.14, H-0.4, 0.03, matGasket); gasket.position.set(0, 0.13+(H-0.4)/2, D/2-0.06); unit.add(gasket);

// heavy insulated door (thick), hinged left — opens
const door = new THREE.Group();
const dpanel = box(W-0.18, H-0.42, 0.10, matDoor); dpanel.position.set(0,0,0); door.add(dpanel);
// door bevelled edge trim
const dtrimT = box(W-0.18,0.04,0.11,matSteel); dtrimT.position.set(0,(H-0.42)/2-0.02,0); door.add(dtrimT);
const dtrimB = box(W-0.18,0.04,0.11,matSteel); dtrimB.position.set(0,-(H-0.42)/2+0.02,0); door.add(dtrimB);
// small viewing window
const win = box(0.34,0.30,0.02,matWin); win.position.set(-0.1,0.35,0.06); door.add(win);
const winFrame = box(0.4,0.36,0.03,matSteel); winFrame.position.set(-0.1,0.35,0.045); door.add(winFrame);
// chunky lever latch handle (vertical bar + lever)
const latchBar = cyl(0.028,0.028,0.55,matLatch,12); latchBar.position.set(0.46,0.0,0.09); door.add(latchBar);
const latchLever = box(0.14,0.05,0.06,matLatch); latchLever.position.set(0.42,-0.28,0.11); door.add(latchLever);
const latchPlate = box(0.1,0.7,0.03,matSteel); latchPlate.position.set(0.46,0.0,0.055); door.add(latchPlate);
// door pivot group at left hinge
const doorPivot = new THREE.Group();
doorPivot.position.set(-W/2+0.09, 0.13+(H-0.13)/2, D/2-0.03);
door.position.set((W-0.18)/2 - 0.0, 0, 0.08);
doorPivot.add(door);
unit.add(doorPivot);

// hinges
for(const yy of [-0.7,0.7]){ const hg=cyl(0.03,0.03,0.12,matSteel,10); hg.position.set(-W/2+0.06,0.13+(H-0.13)/2+yy,D/2-0.02); unit.add(hg); }

// control panel with COLD cyan display (top)
const cpanel = box(0.4,0.24,0.05,matLatch); cpanel.position.set(0.0, H-0.15, D/2-0.02); unit.add(cpanel);
const disp = new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.14), matCold);
disp.position.set(0.0, H-0.13, D/2+0.008); unit.add(disp);
for(let i=0;i<3;i++){ const b=cyl(0.014,0.014,0.012,matSteel,10); b.rotation.x=Math.PI/2; b.position.set(-0.12+i*0.12, H-0.24, D/2+0.008); unit.add(b); }

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };
let doorOpen=false, doorT=0; const btnDoor=document.getElementById('btnDoor');
btnDoor.onclick=()=>{ doorOpen=!doorOpen; btnDoor.classList.toggle('on',doorOpen); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__ultraApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate);
  const target = doorOpen? -1.9 : 0; doorT += (target-doorT)*0.12;
  doorPivot.rotation.y = doorT;
  if(Math.abs(target-doorT)>0.001) renderer.shadowMap.needsUpdate = true;
  controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
