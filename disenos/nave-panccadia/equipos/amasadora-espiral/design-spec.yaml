# DesignSpec — amasadora espiral (spiral dough mixer)
design: amasadora-espiral
track: threejs
gate_passes: [materials]   # flat-catalog subset
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 2, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 2}
  tier: moderate
  notes: >
    Spiral mixer: angled stainless motor body at the back, an overhead head projecting forward,
    a large rotating stainless bowl at the front, a helical spiral dough hook + central breaker
    bar descending into the bowl. The spiral hook is the identity feature.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html (env 2.15 + hemi + frontal fill for vertical faces)"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Amasadora' block"
    evidences: "footprint 0.95 x 0.76 m [CERT]"
    suitability: pass
  - source: "Spiral mixer standard class (Sancassiano / Sottoriva / VMI spiral, brand-neutral)"
    evidences: "angled body ~0.9-1.1 m high, fixed spiral hook + central breaker bar in a ~0.45-0.55 m dia bowl, bowl rim ~0.55 m off floor, forward overhang head"
    suitability: pass

dimensions_real:
  length_m: {value: 0.95, confidence: high}   # [CERT] CAD
  width_m:  {value: 0.76, confidence: high}   # [CERT] CAD (depth)
  height_m: {value: 1.05, confidence: med}
  bowl_dia_m: {value: 0.52, confidence: med}
  bowl_h_m:   {value: 0.34, confidence: med}
  hook_turns: {value: 2.2, confidence: low}

hierarchy:
  - name: root
    children:
      - name: body
        pivot: [0, 0, 0]
        animation: none
      - name: head_arm
        pivot: [0, 0.9, -0.2]
        animation: none
      - name: bowl
        pivot: [0, 0.2, 0.18]
        animation: spin_y
      - name: spiral_hook
        pivot: [0.09, 0.55, 0.18]
        animation: spin_y
      - name: breaker_bar
        pivot: [0, 0.55, 0.18]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: painted-body
    family: painted-metal
    color: "#3a4048"
    metalness: 0.0
    roughness: 0.5
    evidence: "some spiral mixers have a painted lower body; graphite grey after ACES"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: spiral-hook
    desc: "A helical (spiral) stainless dough hook descends into the bowl beside a central breaker bar — the single feature that says SPIRAL MIXER and not a planetary mixer or a pot."
    threshold: 0.75
  - id: mixing-bowl
    desc: "A large open stainless bowl (~0.5 m dia) sits at the front in its cradle at working height, reading as the rotating mixing bowl."
    threshold: 0.75
  - id: body-head
    desc: "An angled stainless motor body with a forward overhead head/arm carrying the hook reads as the mixer's drive, at correct proportion beside a 1.8 m person."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 24
    tris: 90000

camera:
  azimuth_deg: 40
  elevation_deg: 22
  fov: 40

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "MIX (spin bowl+hook)"
colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "600x300+1140+930"
