<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laminadora — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Laminadora reversible — acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· cabezal de rodillos + 2 mesas de banda</span></div>
  <div class="dim">~3.30 × 1.00 m · banda a 0.90 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnWheel">WHEEL</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
const Rr = 5.2;
camera.position.set(Rr*Math.cos(0.72)*Math.cos(0.36), 1.3 + Rr*Math.sin(0.36), Rr*Math.sin(0.72)*Math.cos(0.36));
camera.lookAt(0, 0.8, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.75, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 7, 3.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2.6; sun.shadow.camera.right=2.6; sun.shadow.camera.top=2.4; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(24,24),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matRoll  = new THREE.MeshStandardMaterial({ color:0xb7bcbf, metalness:0.88, roughness:0.32 });
const matBelt  = new THREE.MeshStandardMaterial({ color:0x3a3d42, metalness:0.0, roughness:0.85 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=20)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const BELT_Y=0.90, D=0.9, TABLE=1.25, HEADW=0.66;

// leg frame (central + table supports)
for(const sx of [-1,1]) for(const sz of [-1,1]){ const l=box(0.05,0.86,0.05,matSteel); l.position.set(sx*0.28,0.43,sz*(D/2-0.08)); unit.add(l);
  const f=cyl(0.03,0.024,0.03,matDark,10); f.position.set(sx*0.28,0.015,sz*(D/2-0.08)); unit.add(f); }
// outer table legs
for(const sx of [-1,1]){ for(const sz of [-1,1]){ const l=box(0.04,0.84,0.04,matSteel); l.position.set(sx*(TABLE+0.1),0.42,sz*(D/2-0.1)); unit.add(l);
  const f=cyl(0.026,0.02,0.03,matDark,10); f.position.set(sx*(TABLE+0.1),0.015,sz*(D/2-0.1)); unit.add(f); } }
// cross brace
const brace=box(2*TABLE+0.4,0.03,0.04,matSteel); brace.position.set(0,0.25,D/2-0.1); unit.add(brace);

// central roller head housing
const head = box(HEADW, 0.5, D-0.05, matSteel); head.position.set(0, BELT_Y+0.05, 0); unit.add(head);
// two rollers (visible at the gap, front)
for(const yy of [BELT_Y-0.02, BELT_Y+0.10]){ const r=cyl(0.05,0.05,HEADW-0.06,matRoll,18); r.rotation.z=Math.PI/2; r.position.set(0,yy,D/2-0.06); unit.add(r); }
// guard hoop over the head
const guard = new THREE.Mesh(new THREE.TorusGeometry(0.28,0.012,8,24,Math.PI), matRoll); guard.position.set(0, BELT_Y+0.30, 0); unit.add(guard);

// thickness handwheel on the front of the head — spins
const wheel = new THREE.Group();
const wr = new THREE.Mesh(new THREE.TorusGeometry(0.13,0.014,8,28), matRoll); wheel.add(wr);
for(let i=0;i<4;i++){ const sp=cyl(0.008,0.008,0.24,matRoll,8); sp.rotation.z=(i/4)*Math.PI; wheel.add(sp); }
const knob=cyl(0.018,0.018,0.05,matDark,10); knob.position.set(0.13,0,0.02); wheel.add(knob);
wheel.position.set(0, BELT_Y+0.06, D/2+0.02); unit.add(wheel);

// two belt tables (slightly inclined up at the far ends)
function beltTable(dir){
  const t = new THREE.Group();
  // frame rails
  for(const sz of [-1,1]){ const rail=box(TABLE,0.04,0.03,matSteel); rail.position.set(dir*(HEADW/2+TABLE/2),0,sz*(D/2-0.06)); t.add(rail); }
  // belt surface
  const belt=box(TABLE-0.02,0.02,D-0.14,matBelt); belt.position.set(dir*(HEADW/2+TABLE/2),0.0,0); t.add(belt);
  // end roller
  const er=cyl(0.035,0.035,D-0.12,matRoll,14); er.rotation.x=Math.PI/2; er.position.set(dir*(HEADW/2+TABLE-0.02),0,0); t.add(er);
  // raised lip guard at outer end
  const lip=box(0.04,0.10,D-0.12,matSteel); lip.position.set(dir*(HEADW/2+TABLE),0.05,0); t.add(lip);
  t.position.set(0, BELT_Y, 0);
  t.rotation.z = -dir*0.06; // slight incline
  return t;
}
unit.add(beltTable(1)); unit.add(beltTable(-1));

// control box on the front of the head
const cbox = box(0.16,0.2,0.04,matDark); cbox.position.set(HEADW/2-0.1, BELT_Y+0.28, D/2-0.02); unit.add(cbox);
const disp = new THREE.Mesh(new THREE.PlaneGeometry(0.1,0.06), new THREE.MeshStandardMaterial({color:0x0a1a14,emissive:0x00d4aa,emissiveIntensity:0.9,roughness:0.4}));
disp.position.set(HEADW/2-0.1, BELT_Y+0.33, D/2+0.001); unit.add(disp);

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };
let spin=false; const btnWheel=document.getElementById('btnWheel');
btnWheel.onclick=()=>{ spin=!spin; btnWheel.classList.toggle('on',spin); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__laminadoraApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate);
  if(spin){ wheel.rotation.z += 0.1; }
  controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
