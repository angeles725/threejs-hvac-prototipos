# DesignSpec — laminadora (reversible dough sheeter)
design: laminadora
track: threejs
gate_passes: [materials]   # flat-catalog subset
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 2}
  tier: complex
  notes: >
    Reversible dough sheeter: a central stainless roller head with two rollers and a thickness
    handwheel, flanked by two long fold-down belt/canvas tables running left and right on a leg
    frame at working height, scrapers + a control. Two long belt tables + central roller head =
    the unmistakable sheeter silhouette.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'LAMINADORA' block"
    evidences: "footprint 3.321 x 1.057 m [CERT] — the largest equipment; long due to the two belt tables"
    suitability: pass
  - source: "Reversible sheeter standard class (Rondo/Fritsch/Rollmatic, brand-neutral)"
    evidences: "central roller head with a thickness handwheel, two flanking belt conveyors (~1.0-1.3 m each) on a leg frame, working belt height ~0.85-0.95 m, scrapers, foot/hand control"
    suitability: pass

dimensions_real:
  length_m: {value: 3.30, confidence: high}  # [CERT] overall (head + two tables)
  width_m:  {value: 1.00, confidence: high}  # [CERT] depth
  height_m: {value: 1.15, confidence: med}   # to top of head; belt ~0.9
  belt_h_m: {value: 0.90, confidence: med}
  table_len_m: {value: 1.25, confidence: med}

hierarchy:
  - name: root
    children:
      - name: leg_frame
        pivot: [0, 0, 0]
        animation: none
      - name: roller_head
        pivot: [0, 0.9, 0]
        animation: none
      - name: thickness_wheel
        pivot: [0, 0.98, 0.55]
        animation: spin_z
      - name: belt_tables    # two tables — one semantic system
        pivot: [0, 0.9, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: belt-canvas
    family: rubber
    color: "#3a3d42"
    metalness: 0.0
    roughness: 0.85
    evidence: "canvas/PVC conveyor belt, dielectric matte"
    source: table
    confidence: 0.8
  - id: roller-steel
    family: bare-metal
    color: "#b7bcbf"
    metalness: 0.88
    roughness: 0.35
    evidence: "chromed rollers + handwheel"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: dual-belt-tables
    desc: "Two long belt/canvas conveyor tables extend left and right from the central head on the leg frame — the reversible-sheeter signature (a long low machine, not a box)."
    threshold: 0.75
  - id: roller-head-wheel
    desc: "A central stainless roller head with visible rollers and a round thickness-adjustment handwheel on the front reads as the sheeting head."
    threshold: 0.75
  - id: stainless-frame-scale
    desc: "Brushed-stainless machine on a leg frame at ~0.9 m belt height, ~3.3 m long — reads at real scale beside a 1.8 m person."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 32
    tris: 120000

camera:
  azimuth_deg: 40
  elevation_deg: 20
  fov: 46

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "WHEEL (spin)"
colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "600x300+1140+930"
