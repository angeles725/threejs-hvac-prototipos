# DesignSpec — silla + lavabo (office/washroom archetypes)
design: silla-lavabo
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Two reusable archetypes in one asset: a stainless hand-wash lavabo (basin + gooseneck faucet +
    backsplash on legs) and an office task chair (upholstered seat + backrest on a gas column + 5-star
    caster base). Covers the office/washroom furniture the plant needs.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia — rooms.json baños + furniture.json MOBILIARIO"
    evidences: "the plant has restrooms + office furniture (chairs) on MOBILIARIO [CERT]; these archetypes populate them"
    suitability: conditional
  - source: "Standard washroom + office furniture class (hand-wash basin + task chair, brand-neutral)"
    evidences: "wall/leg-mounted stainless hand basin ~0.4-0.5 m with gooseneck faucet; office task chair ~0.65 m seat height on a 5-star caster base"
    suitability: pass

dimensions_real:
  lavabo_w_m: {value: 0.50, confidence: med}
  lavabo_h_m: {value: 0.85, confidence: med}
  chair_seat_h_m: {value: 0.48, confidence: med}
  chair_total_h_m: {value: 1.05, confidence: med}

hierarchy:
  - name: root
    children:
      - name: lavabo
        pivot: [-0.7, 0, 0]
        animation: none
      - name: task_chair
        pivot: [0.7, 0, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe (basin + faucet)"
    source: table
    confidence: 0.85
  - id: upholstery
    family: rubber
    color: "#2a2f36"
    metalness: 0.0
    roughness: 0.85
    evidence: "chair seat/back fabric, matte dielectric"
    source: table
    confidence: 0.8
  - id: chair-plastic
    family: plastic
    color: "#16181c"
    metalness: 0.0
    roughness: 0.5
    evidence: "chair base + column + casters, dark plastic"
    source: table
    confidence: 0.8

critical_features:
  - id: wash-basin-faucet
    desc: "A stainless hand-wash basin with a gooseneck faucet + backsplash reads as a washroom lavabo."
    threshold: 0.72
  - id: task-chair
    desc: "An office task chair — upholstered seat + backrest on a gas column with a 5-star caster base — reads unmistakably as a chair."
    threshold: 0.72
  - id: archetype-scale
    desc: "Both archetypes read at correct human scale side by side (a 1.8 m person sits in the chair, washes at the basin)."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 30
    tris: 110000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 46

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"

colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "260x80+1040+790"   # stainless basin front face (chair is fabric/plastic, not anchored); measured dE00 1.52 vs canonical
