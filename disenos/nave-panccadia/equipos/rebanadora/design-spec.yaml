# DesignSpec — rebanadora de pan (bread slicer)
design: rebanadora
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    Bread slicer: a brushed-stainless body with a front cutting chamber holding a gang of parallel
    vertical slicing blades, a receiving tray in front, a top safety guard/hood, a push handle, on a
    base. The gang of parallel blades is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — 'Rebanadora' (unplaced_labels, ground)"
    evidences: "two Rebanadora labels near the ovens [CERT]; footprint not resolved to a block — bread slicer standard envelope used"
    suitability: conditional
  - source: "Bread slicer standard class (gravity/reciprocating gang slicer, brand-neutral)"
    evidences: "~0.5-0.7 m body, a chamber with a gang of parallel blades, receiving tray, top safety guard, push plate, ~0.6-0.7 m tall on a base"
    suitability: pass

dimensions_real:
  length_m: {value: 0.60, confidence: low}
  width_m:  {value: 0.62, confidence: low}
  height_m: {value: 0.70, confidence: low}
  blade_count: {value: 14, confidence: low}

hierarchy:
  - name: root
    children:
      - name: body
        pivot: [0, 0, 0]
        animation: none
      - name: blade_gang     # gang of blades — one semantic system
        pivot: [0, 0.4, 0]
        animation: none
      - name: receiving_tray
        pivot: [0, 0.4, 0.35]
        animation: none
      - name: top_guard
        pivot: [0, 0.68, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: blade-steel
    family: bare-metal
    color: "#cdd1d4"
    metalness: 0.92
    roughness: 0.22
    evidence: "polished slicing blades, brighter/sharper metal"
    source: table
    confidence: 0.8
  - id: tray-plate
    family: bare-metal
    color: "#c4c8ca"
    metalness: 0.88
    roughness: 0.36
    evidence: "receiving tray + push plate"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control button / motor housing"
    source: table
    confidence: 0.8

critical_features:
  - id: blade-gang
    desc: "A gang of many parallel vertical slicing blades fills the cutting chamber — the single feature that says BREAD SLICER."
    threshold: 0.75
  - id: tray-guard
    desc: "A receiving tray in front + a top safety guard/hood over the blades reads as the slicer's bread path + guard."
    threshold: 0.72
  - id: stainless-body
    desc: "A brushed-stainless slicer body on a base at counter/working height reads at real scale."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 26
    tris: 90000

camera:
  azimuth_deg: 42
  elevation_deg: 22
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
