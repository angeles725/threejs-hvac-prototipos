# DesignSpec — mesa de trabajo de acero inoxidable (bakery prep table)
# Foundation asset for the nave-panccadia equipment library: establishes the brushed-304
# stainless material + tubular-leg-frame vocabulary reused by most other assets.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: mesa-trabajo
track: threejs
mode: standard                    # single asset; part of a heavy multi-asset library run
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # legs are ~0.04 m — 0.1 m voxel cannot resolve them

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 6 -> simple (0-6).
  scores: {silhouette: 1, components: 1, hierarchy: 1, repetition: 1,
           material_layers: 1, detail: 1, occlusion: 0, action_readiness: 0}
  tier: simple
  notes: >
    A commercial stainless prep bench: flat top with turned-down edges, 4 tubular legs,
    an undershelf, adjustable feet. Genuinely simple geometry — its whole identity is the
    BRUSHED-304 material read and correct proportion, not part count. No moving parts.

environment:                      # P0 discovery output — paths, never copies
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
    learnings_ledger: /home/cristian/.claude/skills/design3d/LEARNINGS.md
  reuse_pointers:
    prim_helpers: "library/parts/... (box/panel/cyl/tube one-liners) — check before authoring primitives"
    stainless_palette: "research/HANDBOOK.md §3.1 (bare-metal metalness 0.9-1.0)"

references:
  # Driving footprint is CAD-measured [CERT]; height/build from commercial-equipment standards.
  - source: "disenos/nave-panccadia/equipment.json — CAD 'mesa 3x1' block (AutoCAD 2007 DWG)"
    evidences: "top footprint 3.009 x 1.009 m [CERT]; also instanced as 2x1 (2.0x1.0) and 2x0.7 (2.0x0.7)"
    suitability: pass
  - source: "NSF/commercial stainless work-table standard class (Advance Tabco / Eagle / John Boos worktable envelope, brand-neutral)"
    evidences: "work-surface height 0.86-0.91 m; 14-16 ga 304 top with turned-down front edge + optional rear upstand; 1.625 in (0.041 m) tubular legs; adjustable bullet feet; undershelf ~0.20 m off floor"
    suitability: pass
  - source: "HANDBOOK.md §3.0 scale table + §3.1 PBR palette + §3.3 light rig"
    evidences: "1 unit = 1 m; brushed stainless = bare-metal metalness 0.9-1.0; house key/fill/rim rig"
    suitability: pass

dimensions_real:
  # Master sized to the CAD 3x1 bench; parametric length/depth for the 2x1 and 2x0.7 instances.
  length_m: {value: 3.00, confidence: high}     # [CERT] CAD 3.009
  width_m:  {value: 1.00, confidence: high}     # [CERT] CAD 1.009 (depth along Z)
  height_m: {value: 0.90, confidence: med}      # work-surface top; commercial standard (not in CAD)
  top_thickness_m:   {value: 0.045, confidence: med}   # 16-ga skin + turned-down edge apron
  edge_downturn_m:   {value: 0.040, confidence: med}   # marine/square down-turn depth
  leg_tube_dia_m:    {value: 0.041, confidence: med}   # 1.625 in tubular leg
  undershelf_h_m:    {value: 0.20,  confidence: med}   # underside height off floor
  foot_height_m:     {value: 0.03,  confidence: low}   # adjustable bullet foot — low = P4 refine-spec amendable

hierarchy:                        # animation-ready; a prep table has NO moving parts (action_readiness 0)
  - name: root
    children:
      - name: top
        pivot: [0, 0.90, 0]
        animation: none
        # flat 304 skin + turned-down edge apron on all four sides; NO rear backsplash (island bench)
      - name: leg_frame
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: legs            # 4 tubular legs — one semantic system, not leg_1/2/3/4
            pivot: [0, 0, 0]
            animation: none
          - name: undershelf
            pivot: [0, 0.20, 0]
            animation: none
          - name: feet            # adjustable bullet feet — appendage on each leg tip
            pivot: [0, 0, 0]
            animation: none
            attachment:
              parent_socket: leg_bottom
              local_start: [0, 0.03, 0]   # foot spans leg-tip down to floor; build root->tip
              local_end:   [0, 0.0,  0]
              length_confidence: low
              contact_type: socket        # foot cup receives the leg tube
              embed_depth: 0.02
              gap_tolerance: 0.0

materials:                        # near-binary metalness — the FOUNDATION palette other assets reuse
  - id: stainless-brushed-top
    family: bare-metal
    color: "#c6cacc"              # neutral steel; reads mid-grey after ACESFilmic (not chrome-white)
    metalness: 0.95
    roughness: 0.34               # brushed satin — not mirror (0.05) nor matte (0.6); directional hint at surface pass
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0; brushed 304 satin finish, single-image cap"
    source: table
    confidence: 0.85
  - id: stainless-satin-legs
    family: bare-metal
    color: "#bcc0c2"
    metalness: 0.95
    roughness: 0.40               # legs slightly rougher/duller than the polished top
    evidence: "HANDBOOK §3.1 bare-metal; tubular leg satin"
    source: table
    confidence: 0.85
  - id: foot-poly
    family: plastic
    color: "#2b2f33"              # dark grey adjustable foot
    metalness: 0.0
    roughness: 0.7
    evidence: "HANDBOOK §3.1 dielectric plastic metalness 0"
    source: table
    confidence: 0.8

critical_features:                # 3 gates, each fails a pass ALONE (threshold default 0.75)
  - id: brushed-stainless-read
    desc: "The top reads as BRUSHED 304 stainless — satin directional sheen, mid-grey value, soft (not sharp) reflections; NOT chrome/mirror, NOT flat plastic. The turned-down edge apron catches a highlight."
    threshold: 0.78
  - id: tubular-leg-frame
    desc: "Four round stainless tubular legs of correct slim gauge (~0.04 m) with a visible undershelf tying them, and adjustable feet at the floor — reads as a commercial welded frame, not solid slab legs."
    threshold: 0.75
  - id: proportion-scale
    desc: "At 0.90 m work height and a 3.0 x 1.0 m top, a 1.8 m person would read correct beside it — a large prep BENCH, not a small side table; top is thin (skin+apron), not a thick block."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:                    # per-asset budget: this master is instanced ~5x in the plant
    draws: 12                     # merge legs+shelf+feet; top separate — single-digit draws per table
    tris: 30000

camera:
  azimuth_deg: 42                 # house diagonal grammar
  elevation_deg: 24
  fov: 38                         # equipment hero band

lighting: house-rig               # DirectionalLight softbox — avoids the RectAreaLight SwiftShader stall
                                  # (studio RectAreaLight reserved for optional P7 hero only)

ui_controls:
  - "AUTO-ROTATE"
  - "UNDERSHELF ON-OFF"
