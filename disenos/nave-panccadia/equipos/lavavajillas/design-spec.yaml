# DesignSpec — lavavajillas comercial tipo campana (pass-through hood dishwasher)
design: lavavajillas
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    Commercial pass-through hood dishwasher: stainless lower wash body + a square lift-hood on top
    (the signature raising cover), a front control panel, wash-chamber opening, short legs. Reuses
    the stainless material vocabulary from mesa-trabajo.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/mesa-trabajo/mesa-trabajo.html (env 1.9 + hemi + brushed roughness)"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Lavavajillas' block"
    evidences: "footprint 0.95 x 0.54 m [CERT]"
    suitability: pass
  - source: "Commercial hood-type dishwasher standard class (Hobart AM/Winterhalter PT, brand-neutral)"
    evidences: "lower body ~0.85 m high, square lift hood ~0.55-0.65 m raising the wash chamber, front control panel, ~1.4 m hood-down height, short adjustable legs"
    suitability: pass

dimensions_real:
  length_m: {value: 0.95, confidence: high}   # [CERT] CAD
  width_m:  {value: 0.54, confidence: high}   # [CERT] CAD (depth)
  height_m: {value: 1.42, confidence: med}    # hood down; body 0.85 + hood 0.57
  body_h_m: {value: 0.85, confidence: med}
  hood_m:   {value: 0.58, confidence: med}
  leg_h_m:  {value: 0.13, confidence: low}

hierarchy:
  - name: root
    children:
      - name: body
        pivot: [0, 0.13, 0]
        animation: none
      - name: control_panel
        pivot: [0, 0.9, 0]
        animation: none
      - name: hood            # the lift-hood CAN raise (pass-through); modelled closed, pivot at its hinge line
        pivot: [0, 0.98, -0.27]
        animation: "slide_y 0..0.35 (lift)"
      - name: legs
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "mesa-trabajo proven recipe; HANDBOOK §3.1 bare-metal"
    source: table
    confidence: 0.85
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control panel bezel, dielectric"
    source: table
    confidence: 0.8
  - id: display-emissive
    family: plastic
    color: "#0a1a14"
    metalness: 0.0
    roughness: 0.4
    evidence: "small status display; ISA-101 green only when on"
    source: estimated
    confidence: 0.75

critical_features:
  - id: lift-hood
    desc: "A square stainless lift-hood sits on top of the body, reading as the raising wash-chamber cover of a pass-through dishwasher — the one feature that says 'commercial dishwasher' and not 'cabinet'."
    threshold: 0.75
  - id: stainless-body-read
    desc: "Body + hood read as brushed 304 stainless (satin, not dark matte, not chrome), with a visible wash-chamber front opening."
    threshold: 0.75
  - id: control-panel
    desc: "A front control panel with buttons and a small status display reads as the machine's control interface, at operator height."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 20
    tris: 60000

camera:
  azimuth_deg: 42
  elevation_deg: 22
  fov: 40

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "HOOD UP-DOWN"
