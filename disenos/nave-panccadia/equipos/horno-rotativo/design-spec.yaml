# DesignSpec — horno rotativo (rotary rack oven)
design: horno-rotativo
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex
  notes: >
    Rotary rack oven (hero): large brushed-stainless cabinet, a full-height glass door showing a
    rotating rack trolley of ~12 tray levels inside, a steam hood/canopy + chimney on top, a side
    control panel. The glass door + visible rotating rack is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'horno rotativo' block"
    evidences: "footprint 2.066 x 2.054 m [CERT] (includes service clearance; body ~1.5 m)"
    suitability: pass
  - source: "Rotary rack oven standard class (Revent/Wachtel/Bongard rotary, brand-neutral)"
    evidences: "~1.4-1.6 m body footprint, ~2.0-2.3 m tall, full glass door, single/double rack trolley of 15-18 trays, steam hood + extraction chimney on top, side control panel"
    suitability: pass

dimensions_real:
  length_m: {value: 1.50, confidence: med}   # body width (front)
  width_m:  {value: 1.45, confidence: med}   # depth
  height_m: {value: 2.05, confidence: med}   # body; hood adds ~0.4
  door_w_m: {value: 1.05, confidence: med}
  door_h_m: {value: 1.55, confidence: med}
  rack_levels: {value: 12, confidence: low}

hierarchy:
  - name: root
    children:
      - name: cabinet
        pivot: [0, 0, 0]
        animation: none
      - name: glass_door
        pivot: [-0.55, 1.0, 0.72]
        animation: none
      - name: rack_trolley
        pivot: [0, 0.9, 0.0]
        animation: spin_y
      - name: hood
        pivot: [0, 2.05, 0]
        animation: none
      - name: control_panel
        pivot: [0.62, 1.4, 0.72]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-glass
    family: glass
    color: "#1a2426"
    metalness: 0.0
    roughness: 0.12
    evidence: "tinted oven-door glass; transparent MeshStandard (opacity), NOT transmission (SwiftShader stall, LEARNINGS)"
    source: table
    confidence: 0.8
  - id: rack-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.85
    roughness: 0.45
    evidence: "rack trolley + trays, darker satin steel inside the chamber"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: glass-door-rack
    desc: "A full-height glass door reveals a rotating rack trolley of ~12 tray levels inside the chamber — the single feature that says ROTARY RACK OVEN."
    threshold: 0.75
  - id: stainless-cabinet-hood
    desc: "A large brushed-stainless cabinet with a steam hood/canopy + extraction chimney on top reads as a floor bakery oven at real scale (a 1.8 m person reaches the mid door)."
    threshold: 0.75
  - id: control-panel
    desc: "A side control panel with display and buttons reads as the bake controller beside the door."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40
    tris: 160000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "BAKE (spin rack)"
