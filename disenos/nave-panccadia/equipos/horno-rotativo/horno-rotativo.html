<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horno rotativo — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Horno rotativo de carros — acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· puerta de vidrio + rack rotativo</span></div>
  <div class="dim">~1.50 × 1.45 m · alto 2.05 m + campana</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnBake">BAKE</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const R = 4.6;
camera.position.set(R*Math.cos(0.73)*Math.cos(0.32), 1.3 + R*Math.sin(0.32), R*Math.sin(0.73)*Math.cos(0.32));
camera.lookAt(0, 1.1, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.05, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 7, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2.5; sun.shadow.camera.right=2.5; sun.shadow.camera.top=3.2; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(22,22),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matRack  = new THREE.MeshStandardMaterial({ color:0x9aa0a4, metalness:0.85, roughness:0.45 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });
const matGlass = new THREE.MeshStandardMaterial({ color:0x1a2426, metalness:0.0, roughness:0.12, transparent:true, opacity:0.42 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=20)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const W=1.50, H=2.05, D=1.45;

// plinth
unit.add((()=>{ const p=box(W,0.12,D,matDark); p.position.y=0.06; return p; })());
// cabinet shell (with a front opening for the door): build 4 walls + top + back
const wallT=0.06;
const back = box(W,H-0.12,wallT,matSteel); back.position.set(0,0.12+(H-0.12)/2,-D/2+wallT/2); unit.add(back);
const left = box(wallT,H-0.12,D,matSteel); left.position.set(-W/2+wallT/2,0.12+(H-0.12)/2,0); unit.add(left);
const right= box(wallT,H-0.12,D,matSteel); right.position.set(W/2-wallT/2,0.12+(H-0.12)/2,0); unit.add(right);
const top  = box(W,wallT,D,matSteel); top.position.set(0,H-wallT/2,0); unit.add(top);
// front pilaster (right side of door, holds controls) + top lintel + left jamb
const pilaster = box(0.34,H-0.12,0.1,matSteel); pilaster.position.set(W/2-0.17,0.12+(H-0.12)/2,D/2-0.05); unit.add(pilaster);
const jamb = box(0.12,H-0.12,0.1,matSteel); jamb.position.set(-W/2+0.06,0.12+(H-0.12)/2,D/2-0.05); unit.add(jamb);
const lintel = box(W,0.16,0.1,matSteel); lintel.position.set(0,H-0.20,D/2-0.05); unit.add(lintel);
const sill = box(W,0.16,0.1,matSteel); sill.position.set(0,0.20,D/2-0.05); unit.add(sill);

// rack trolley INSIDE (visible through the glass) — spins
const rack = new THREE.Group();
for(const sx of [-1,1]) for(const sz of [-1,1]){ const u=cyl(0.02,0.02,1.55,matRack,10); u.position.set(sx*0.42,0.9,sz*0.42); rack.add(u); }
for(let i=0;i<12;i++){ const tray=box(0.86,0.015,0.86,matRack); tray.position.set(0,0.28+i*0.12,0); rack.add(tray); }
// wheels
for(const sx of [-1,1]) for(const sz of [-1,1]){ const wl=cyl(0.05,0.05,0.03,matDark,12); wl.rotation.x=Math.PI/2; wl.position.set(sx*0.42,0.16,sz*0.42); rack.add(wl); }
rack.position.set(0,0,-0.02); unit.add(rack);

// glass door (transparent, in front of the rack) + stainless frame + handle
const door = new THREE.Group();
const glass = box(1.02,1.5,0.02,matGlass); glass.position.set(-0.06,1.05,D/2-0.02); door.add(glass);
const fTop=box(1.12,0.06,0.05,matSteel); fTop.position.set(-0.06,1.83,D/2-0.02); door.add(fTop);
const fBot=box(1.12,0.06,0.05,matSteel); fBot.position.set(-0.06,0.30,D/2-0.02); door.add(fBot);
const fL=box(0.06,1.56,0.05,matSteel); fL.position.set(-0.60,1.05,D/2-0.02); door.add(fL);
const fR=box(0.06,1.56,0.05,matSteel); fR.position.set(0.47,1.05,D/2-0.02); door.add(fR);
const handle=cyl(0.02,0.02,1.2,matSteel,12); handle.position.set(0.40,1.05,D/2+0.06); door.add(handle);
for(const yy of [0.5,1.6]){ const br=cyl(0.012,0.012,0.08,matSteel,8); br.rotation.x=Math.PI/2; br.position.set(0.40,yy,D/2+0.03); door.add(br); }
unit.add(door);

// steam hood + chimney
const hood = box(W+0.2,0.36,D+0.1,matSteel); hood.position.set(0,H+0.18,0); unit.add(hood);
const hoodLip = box(W+0.28,0.05,D+0.16,matSteel); hoodLip.position.set(0,H+0.02,0); unit.add(hoodLip);
const chimney = cyl(0.13,0.13,0.5,matSteel,20); chimney.position.set(0.3,H+0.6,-0.3); unit.add(chimney);

// control panel on the pilaster
const cpanel = box(0.26,0.7,0.04,matDark); cpanel.position.set(W/2-0.17,1.45,D/2+0.02); unit.add(cpanel);
const disp = new THREE.Mesh(new THREE.PlaneGeometry(0.2,0.12), new THREE.MeshStandardMaterial({color:0x0a1a14,emissive:0x00d4aa,emissiveIntensity:0.9,roughness:0.4}));
disp.position.set(W/2-0.17,1.68,D/2+0.045); unit.add(disp);
for(let i=0;i<4;i++){ const b=cyl(0.02,0.02,0.012,matSteel,12); b.rotation.x=Math.PI/2; b.position.set(W/2-0.25+ (i%2)*0.16, 1.4-Math.floor(i/2)*0.12, D/2+0.045); unit.add(b); }

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };
let baking=false; const btnBake=document.getElementById('btnBake');
btnBake.onclick=()=>{ baking=!baking; btnBake.classList.toggle('on',baking); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__hornoApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate);
  if(baking){ rack.rotation.y += 0.02; }
  controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
