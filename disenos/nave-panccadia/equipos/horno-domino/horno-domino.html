<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horno dominó (deck) — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Horno dominó de piso — 3 decks · acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· decks apilados + visores</span></div>
  <div class="dim">~1.35 × 1.20 m · alto 1.85 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 7, 26);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const Rr = 4.2;
camera.position.set(Rr*Math.cos(0.73)*Math.cos(0.30), 1.2 + Rr*Math.sin(0.30), Rr*Math.sin(0.73)*Math.cos(0.30));
camera.lookAt(0, 1.0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.0, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 6.5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-2.4; sun.shadow.camera.right=2.4; sun.shadow.camera.top=2.8; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });
const matGlow  = new THREE.MeshStandardMaterial({ color:0x0a1a14, emissive:0x00d4aa, emissiveIntensity:0.8, roughness:0.4 });
const matGlass = new THREE.MeshStandardMaterial({ color:0x141c1e, metalness:0.0, roughness:0.12, transparent:true, opacity:0.5 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=18)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const W=1.35, D=1.20, BASE=0.50, DECK=0.38, NDECK=3;

// base cabinet on legs (proofer-ish)
for(const sx of [-1,1]) for(const sz of [-1,1]){ const l=cyl(0.03,0.03,0.14,matDark,10); l.position.set(sx*(W/2-0.1),0.07,sz*(D/2-0.1)); unit.add(l); }
const base = box(W, BASE-0.14, D, matSteel); base.position.set(0,0.14+(BASE-0.14)/2,0); unit.add(base);
const baseDoor = box(W-0.3,0.34,0.02,matDark); baseDoor.position.set(0,0.32,D/2+0.001); unit.add(baseDoor);
const baseHandle = cyl(0.014,0.014,0.4,matSteel,10); baseHandle.rotation.z=Math.PI/2; baseHandle.position.set(0,0.42,D/2+0.02); unit.add(baseHandle);

// deck stack
for(let d=0; d<NDECK; d++){
  const y0 = BASE + d*DECK;
  const cyd = y0 + DECK/2;
  // deck chamber shell
  const deck = box(W, DECK, D, matSteel); deck.position.set(0,cyd,0); unit.add(deck);
  // separating seam (recessed dark line between decks)
  const seam = box(W+0.01, 0.02, D+0.01, matDark); seam.position.set(0, y0, 0); unit.add(seam);
  // door face (front): a slightly proud stainless door with a glass viewing strip
  const door = box(W-0.22, DECK-0.08, 0.03, matSteel); door.position.set(-0.05, cyd, D/2+0.02); unit.add(door);
  const glass = box(W-0.5, 0.12, 0.02, matGlass); glass.position.set(-0.05, cyd+0.04, D/2+0.04); unit.add(glass);
  // interior glow behind glass (oven light)
  const glow = box(W-0.5, 0.10, 0.005, matGlow); glow.position.set(-0.05, cyd+0.04, D/2-0.02); unit.add(glow);
  // full-width handle
  const handle = cyl(0.016,0.016,W-0.30,matSteel,10); handle.rotation.z=Math.PI/2; handle.position.set(-0.05, cyd-0.12, D/2+0.06); unit.add(handle);
  // per-deck control cluster on the right
  const cl = box(0.2, DECK-0.08, 0.03, matDark); cl.position.set(W/2-0.11, cyd, D/2+0.02); unit.add(cl);
  const dial = cyl(0.05,0.05,0.02,matSteel,20); dial.rotation.x=Math.PI/2; dial.position.set(W/2-0.11, cyd+0.06, D/2+0.045); unit.add(dial);
  const dcenter = cyl(0.012,0.012,0.025,matDark,10); dcenter.rotation.x=Math.PI/2; dcenter.position.set(W/2-0.11, cyd+0.06, D/2+0.05); unit.add(dcenter);
  for(let k=0;k<2;k++){ const lev=cyl(0.01,0.01,0.06,matSteel,8); lev.position.set(W/2-0.16+k*0.09, cyd-0.08, D/2+0.05); lev.rotation.z=0.4; unit.add(lev); }
}

// top canopy / steam hood
const canopyY = BASE + NDECK*DECK;
const canopy = box(W+0.14, 0.16, D+0.08, matSteel); canopy.position.set(0, canopyY+0.08, 0); unit.add(canopy);
const flue = cyl(0.09,0.09,0.35,matSteel,16); flue.position.set(0.35, canopyY+0.35, -0.35); unit.add(flue);

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__hornoDominoApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
