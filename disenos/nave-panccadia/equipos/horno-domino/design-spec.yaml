# DesignSpec — horno dominó / de piso (deck oven, stacked decks)
design: horno-domino
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Deck oven: a stack of 3 independent baking decks, each a wide brushed-stainless chamber with
    its own hinged door (glass viewing strip + handle) and per-deck controls (round thermometer
    dial + steam levers), on a base cabinet/stand, with a top canopy. Stacked decks = identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'horno dominó' block"
    evidences: "footprint 1.631 x 1.632 m [CERT]"
    suitability: pass
  - source: "Deck oven standard class (Salva/Wachtel/Bongard modular deck, brand-neutral)"
    evidences: "1-4 stacked decks, each ~0.30-0.42 m chamber with an independent door, glass viewing strip, per-deck steam + thermometer, on a base/proofer, ~1.3-1.5 m wide"
    suitability: pass

dimensions_real:
  length_m: {value: 1.35, confidence: med}   # width (front)
  width_m:  {value: 1.20, confidence: med}   # depth
  height_m: {value: 1.85, confidence: med}   # base + 3 decks + canopy
  deck_h_m: {value: 0.38, confidence: med}
  base_h_m: {value: 0.50, confidence: med}

hierarchy:
  - name: root
    children:
      - name: base_cabinet
        pivot: [0, 0, 0]
        animation: none
      - name: deck_stack     # 3 decks — one semantic system, not deck_1/2/3
        pivot: [0, 0.5, 0]
        animation: none
      - name: doors_controls
        pivot: [0, 1.0, 0.6]
        animation: none
      - name: canopy
        pivot: [0, 1.85, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-glass
    family: glass
    color: "#1a2426"
    metalness: 0.0
    roughness: 0.12
    evidence: "tinted viewing strip, transparent opacity (no transmission)"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control cluster bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: stacked-decks
    desc: "Three independent baking decks stacked vertically, each a distinct chamber with its own door and separating seams — the deck-oven signature, not one tall box."
    threshold: 0.75
  - id: deck-doors-controls
    desc: "Each deck has a hinged door with a horizontal glass viewing strip + a full-width handle, and a per-deck control cluster (round thermometer dial + steam levers) beside it."
    threshold: 0.72
  - id: stainless-scale
    desc: "Wide brushed-stainless unit on a base cabinet at floor scale, reading as a real bakery deck oven beside a 1.8 m person."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 34
    tris: 130000

camera:
  azimuth_deg: 42
  elevation_deg: 16
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"

colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "420x100+1150+560"   # top stainless face (right side in shadow); measured dE00 0.77 vs canonical
