# DesignSpec — cámara de fermentación (proofing chamber / retarder-proofer)
design: camara-fermentacion
track: threejs
gate_passes: [materials]   # flat-catalog subset
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    Double-door proofing cabinet: tall insulated brushed-stainless body with panel ribs/seams, two
    full-height glass doors revealing rack trolleys of dough trays inside, a top control panel with
    humidity + temperature display. Two glass doors + visible racks = identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"
    glass_rack: "disenos/nave-panccadia/equipos/horno-rotativo/horno-rotativo.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'cámara de fermentación' block"
    evidences: "footprint 2.33 x 2.24 m [CERT] (double-rack proofer / small walk-in)"
    suitability: pass
  - source: "Proofing chamber standard class (Bongard/Panem retarder-proofer, brand-neutral)"
    evidences: "tall insulated cabinet ~2.0-2.3 m, one or two full glass doors, rack trolleys of trays inside, top control with humidity + temperature, insulated panel construction"
    suitability: pass

dimensions_real:
  length_m: {value: 1.62, confidence: med}   # width (front, 2 doors)
  width_m:  {value: 1.45, confidence: med}   # depth
  height_m: {value: 2.05, confidence: med}
  door_w_m: {value: 0.74, confidence: med}
  rack_levels: {value: 14, confidence: low}

hierarchy:
  - name: root
    children:
      - name: cabinet
        pivot: [0, 0, 0]
        animation: none
      - name: glass_doors    # two doors — one semantic system
        pivot: [0, 1.05, 0.72]
        animation: none
      - name: rack_trolleys  # two trolleys of trays
        pivot: [0, 0.9, 0]
        animation: none
      - name: control_panel
        pivot: [0, 1.95, 0.72]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-glass
    family: glass
    color: "#16201f"
    metalness: 0.0
    roughness: 0.12
    evidence: "tinted glass door, transparent opacity (no transmission)"
    source: table
    confidence: 0.8
  - id: rack-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.85
    roughness: 0.45
    evidence: "rack trolleys + trays"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: glass-doors-racks
    desc: "Two full-height glass doors reveal rack trolleys of dough trays inside the insulated chamber — the proofer identity, distinct from a solid oven."
    threshold: 0.75
  - id: insulated-cabinet
    desc: "A tall insulated brushed-stainless cabinet with visible panel ribs/seams and a top humidity+temperature control panel reads as a proofing/fermentation chamber."
    threshold: 0.72
  - id: proofer-scale
    desc: "Tall floor unit at real scale — a 1.8 m person reaches the top control; two full-height doors span the front."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40
    tris: 170000

camera:
  azimuth_deg: 42
  elevation_deg: 16
  fov: 44

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the good render, catches a regression to dark
  crop: "400x80+1300+560"          # verified clean-stainless region (body/door/top)
