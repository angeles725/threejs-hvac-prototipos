# DesignSpec — freidora (deep fryer)
design: freidora
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Commercial deep fryer: a brushed-stainless body on legs with an oil tank recess on top holding a
    wire fry basket + long handle, a front control (thermostat dial + display), a rear splash. The
    wire fry basket in the oil tank is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'freidora' block"
    evidences: "footprint 0.825 x 0.921 m [CERT]"
    suitability: pass
  - source: "Commercial fryer standard class (Pitco/Frymaster floor fryer, brand-neutral)"
    evidences: "~0.4-0.5 m wide body on legs, oil vat with a wire fry basket + handle, front thermostat/control, rear splash, ~0.9 m top height"
    suitability: pass

dimensions_real:
  length_m: {value: 0.45, confidence: med}
  width_m:  {value: 0.75, confidence: med}
  height_m: {value: 0.88, confidence: med}
  tank_dia_m: {value: 0.34, confidence: med}

hierarchy:
  - name: root
    children:
      - name: body
        pivot: [0, 0, 0]
        animation: none
      - name: oil_tank
        pivot: [0, 0.86, 0]
        animation: none
      - name: fry_basket
        pivot: [0, 0.86, 0.05]
        animation: none
      - name: control_panel
        pivot: [0, 0.7, 0.38]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: basket-wire
    family: bare-metal
    color: "#c4c8ca"
    metalness: 0.88
    roughness: 0.4
    evidence: "chromed wire fry basket"
    source: table
    confidence: 0.8
  - id: oil
    family: glass
    color: "#3a2c10"
    metalness: 0.0
    roughness: 0.25
    evidence: "frying oil, dark amber dielectric; transparent-ish"
    source: estimated
    confidence: 0.72
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel + thermostat"
    source: table
    confidence: 0.8

critical_features:
  - id: fry-basket-tank
    desc: "An oil tank recessed in the top holds a wire fry basket with a long forward handle — the deep-fryer identity."
    threshold: 0.75
  - id: fryer-controls
    desc: "A front control panel with a thermostat dial + display reads as the fryer's temperature control."
    threshold: 0.72
  - id: stainless-fryer
    desc: "A narrow brushed-stainless fryer body on legs at ~0.9 m top height reads at real scale."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 26
    tris: 90000

camera:
  azimuth_deg: 42
  elevation_deg: 22
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"

colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "240x200+1650+590"   # rear splashguard stainless panel (front face in shadow); measured dE00 1.33 vs canonical
