# DesignSpec — báscula de piso (platform floor scale)
design: bascula-piso
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 1, detail: 1, occlusion: 1, action_readiness: 0}
  tier: simple
  notes: >
    Platform floor scale: a low stainless weighing platform on feet, a column rising at one end, and
    an indicator head (numeric display + keypad) at the top. Platform + column + display head = the
    scale identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Báscula' block"
    evidences: "footprint 1.23 x 0.401 m [CERT] (platform + column reach)"
    suitability: pass
  - source: "Platform scale standard class (bench/floor platform scale, brand-neutral)"
    evidences: "low stainless weighing platform on feet, a column at one end, a digital indicator head with numeric display + keypad at ~1.1 m"
    suitability: pass

dimensions_real:
  length_m: {value: 0.85, confidence: med}   # platform length
  width_m:  {value: 0.55, confidence: med}   # platform depth
  height_m: {value: 1.15, confidence: med}   # to indicator head
  platform_h_m: {value: 0.10, confidence: med}

hierarchy:
  - name: root
    children:
      - name: platform
        pivot: [0, 0.05, 0]
        animation: none
      - name: column
        pivot: [0, 0.1, -0.2]
        animation: none
      - name: indicator_head
        pivot: [0, 1.05, -0.2]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: platform-plate
    family: bare-metal
    color: "#c4c8ca"
    metalness: 0.88
    roughness: 0.36
    evidence: "checker/plain stainless weighing plate"
    source: table
    confidence: 0.8
  - id: head-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "indicator head enclosure"
    source: table
    confidence: 0.8

critical_features:
  - id: indicator-column-display
    desc: "A column rises from the platform to an indicator head with a numeric display + keypad — the reading head that says SCALE, not just a plate."
    threshold: 0.75
  - id: platform-plate
    desc: "A low stainless weighing platform on feet at floor level reads as the load plate."
    threshold: 0.72
  - id: stainless-scale
    desc: "Brushed-stainless finish at correct small scale — a 1.8 m person reads the display at chest/eye height."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 20
    tris: 60000

camera:
  azimuth_deg: 42
  elevation_deg: 20
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"

colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "400x140+1000+1500"   # flat stainless platform face; measured dE00 3.86 vs canonical
