# DesignSpec — estantería / anaquel comercial (wire shelving unit)
design: estanteria
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 1, components: 1, hierarchy: 1, repetition: 3,
           material_layers: 1, detail: 1, occlusion: 0, action_readiness: 0}
  tier: simple
  notes: >
    Commercial wire shelving unit: 4 corner posts on levelling feet carrying 4 wire shelves
    (perimeter frame + grid bars). A reusable furniture archetype for the plant. Stacked wire
    shelves on posts = the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/furniture.json — MOBILIARIO layer (shelving/storage archetype)"
    evidences: "60 furniture footprints on MOBILIARIO; shelving is a common bakery storage archetype [CERT]"
    suitability: conditional
  - source: "Commercial wire shelving standard class (Metro/chrome wire shelving, brand-neutral)"
    evidences: "4 posts on levelling feet, 4-5 wire shelves (perimeter frame + welded grid), ~1.2 m wide x 0.45 m deep x 1.8 m tall"
    suitability: pass

dimensions_real:
  length_m: {value: 1.20, confidence: med}
  width_m:  {value: 0.45, confidence: med}
  height_m: {value: 1.80, confidence: med}
  shelves: {value: 4, confidence: med}

hierarchy:
  - name: root
    children:
      - name: posts       # 4 posts — one semantic system
        pivot: [0, 0, 0]
        animation: none
      - name: shelves      # 4 wire shelves — one semantic system
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#cfd3d5"
    metalness: 0.9
    roughness: 0.32
    evidence: "chrome/stainless wire shelving"
    source: table
    confidence: 0.85
  - id: foot-dark
    family: plastic
    color: "#24282c"
    metalness: 0.0
    roughness: 0.7
    evidence: "levelling feet, dielectric"
    source: table
    confidence: 0.8

critical_features:
  - id: shelf-tiers
    desc: "Four wire shelves (perimeter frame + grid bars) stacked at even heights on the posts — the shelving identity."
    threshold: 0.75
  - id: post-frame
    desc: "Four corner posts on levelling feet carry the shelves, reading as a rigid rack."
    threshold: 0.72
  - id: stainless-wire
    desc: "Chrome/stainless wire finish at correct scale (a 1.8 m person reads the top shelf at reach)."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 24
    tris: 90000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 44

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
