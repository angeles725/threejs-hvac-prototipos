# DesignSpec — estufa / rango comercial (commercial range)
design: estufa-rango
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Commercial range: a brushed-stainless body with 4 open gas burners under cast-iron grates on
    top, an oven below with a handled door + window, a front row of control knobs, on legs.
    Burners + grates on top = the range identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'estufa' block"
    evidences: "footprint 0.823 x 0.913 m [CERT]"
    suitability: pass
  - source: "Commercial range standard class (Vulcan/Garland 4-burner range, brand-neutral)"
    evidences: "~0.8 m wide body, 4-6 open burners under cast-iron grates, oven below with a handled door, front knob row, ~0.9 m cooking height, legs"
    suitability: pass

dimensions_real:
  length_m: {value: 0.80, confidence: med}
  width_m:  {value: 0.85, confidence: med}
  height_m: {value: 0.90, confidence: med}   # cooking surface; backguard adds
  burner_pitch_m: {value: 0.36, confidence: med}

hierarchy:
  - name: root
    children:
      - name: body
        pivot: [0, 0, 0]
        animation: none
      - name: burners_grates   # 4 burners — one semantic system
        pivot: [0, 0.9, 0]
        animation: none
      - name: oven_door
        pivot: [0, 0.45, 0.42]
        animation: none
      - name: knob_row
        pivot: [0, 0.82, 0.42]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: cast-iron
    family: painted-metal
    color: "#1c1e22"
    metalness: 0.0
    roughness: 0.7
    evidence: "cast-iron grates + burner caps, matte dark dielectric"
    source: table
    confidence: 0.8
  - id: knob-dark
    family: plastic
    color: "#26292d"
    metalness: 0.0
    roughness: 0.5
    evidence: "control knobs"
    source: table
    confidence: 0.8
  - id: oven-glass
    family: glass
    color: "#141c1e"
    metalness: 0.0
    roughness: 0.12
    evidence: "oven door window, transparent opacity"
    source: table
    confidence: 0.8

critical_features:
  - id: burner-grates
    desc: "Four open gas burners, each a burner cap under a cast-iron grate, arranged on the cooking top — the single feature that says commercial RANGE."
    threshold: 0.75
  - id: oven-door-knobs
    desc: "An oven below with a handled door (+ window) and a front row of control knobs reads as the range's oven + controls."
    threshold: 0.72
  - id: stainless-range
    desc: "A brushed-stainless range body on legs at ~0.9 m cooking height reads at real scale."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 30
    tris: 110000

camera:
  azimuth_deg: 42
  elevation_deg: 24
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
