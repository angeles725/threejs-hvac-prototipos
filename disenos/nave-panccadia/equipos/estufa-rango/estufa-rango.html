<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estufa / rango — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Estufa / rango comercial — acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· 4 quemadores + horno</span></div>
  <div class="dim">~0.80 × 0.85 m · alto 0.90 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 20);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const Rr = 2.9;
camera.position.set(Rr*Math.cos(0.7)*Math.cos(0.4), 0.95 + Rr*Math.sin(0.4), Rr*Math.sin(0.7)*Math.cos(0.4));
camera.lookAt(0, 0.6, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.6, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5.5, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-1.6; sun.shadow.camera.right=1.6; sun.shadow.camera.top=2; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(16,16),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matIron  = new THREE.MeshStandardMaterial({ color:0x1c1e22, metalness:0.0, roughness:0.72 });
const matKnob  = new THREE.MeshStandardMaterial({ color:0x26292d, metalness:0.0, roughness:0.5 });
const matGlass = new THREE.MeshStandardMaterial({ color:0x141c1e, metalness:0.0, roughness:0.12, transparent:true, opacity:0.5 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=16)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();
const W=0.80, D=0.85, H=0.86;

// legs + feet
for(const sx of [-1,1]) for(const sz of [-1,1]){ const l=box(0.05,0.16,0.05,matSteel); l.position.set(sx*(W/2-0.07),0.08,sz*(D/2-0.07)); unit.add(l);
  const f=cyl(0.03,0.024,0.03,matKnob,10); f.position.set(sx*(W/2-0.07),0.015,sz*(D/2-0.07)); unit.add(f); }
// body
const body = box(W, H-0.16, D, matSteel); body.position.set(0,0.16+(H-0.16)/2,0); unit.add(body);
// cooking top plate
const topPlate = box(W, 0.03, D, matSteel); topPlate.position.set(0,H,0); unit.add(topPlate);
// backguard
const back = box(W,0.18,0.05,matSteel); back.position.set(0,H+0.09,-D/2+0.03); unit.add(back);

// 4 burners with cast-iron grates (2x2)
function burner(x,z){
  const cap = cyl(0.055,0.07,0.03,matIron,18); cap.position.set(x,H+0.03,z); unit.add(cap);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.06,0.01,8,20),matIron); ring.rotation.x=Math.PI/2; ring.position.set(x,H+0.045,z); unit.add(ring);
  // grate: radial bars
  for(let i=0;i<4;i++){ const bar=box(0.22,0.012,0.02,matIron); bar.position.set(x,H+0.06,z); bar.rotation.y=(i/4)*Math.PI; unit.add(bar); }
  const grRing = new THREE.Mesh(new THREE.TorusGeometry(0.11,0.012,8,24),matIron); grRing.rotation.x=Math.PI/2; grRing.position.set(x,H+0.06,z); unit.add(grRing);
}
for(const sx of [-1,1]) for(const sz of [-1,1]) burner(sx*0.18, sz*0.18);

// oven door (front) + window + handle
const door = box(W-0.12, 0.5, 0.03, matSteel); door.position.set(0,0.42,D/2-0.01); unit.add(door);
const win = box(W-0.34,0.22,0.02,matGlass); win.position.set(0,0.5,D/2+0.01); unit.add(win);
const handle = cyl(0.016,0.016,W-0.2,matSteel,10); handle.rotation.z=Math.PI/2; handle.position.set(0,0.66,D/2+0.05); unit.add(handle);
for(const sx of [-1,1]){ const br=cyl(0.01,0.01,0.06,matSteel,8); br.rotation.x=Math.PI/2; br.position.set(sx*(W/2-0.14),0.66,D/2+0.02); unit.add(br); }

// front control knob row (upper front strip)
const strip = box(W-0.06,0.1,0.03,matSteel); strip.position.set(0,0.78,D/2-0.005); unit.add(strip);
for(let i=0;i<4;i++){ const k=cyl(0.03,0.03,0.035,matKnob,16); k.rotation.x=Math.PI/2; k.position.set(-0.27+i*0.18,0.78,D/2+0.02); unit.add(k);
  const m=box(0.006,0.03,0.006,matSteel); m.position.set(-0.27+i*0.18,0.795,D/2+0.038); unit.add(m); }

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__estufaApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
