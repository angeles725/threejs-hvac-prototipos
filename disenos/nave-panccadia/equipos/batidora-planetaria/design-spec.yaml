# DesignSpec — batidora planetaria (planetary/vertical mixer)
design: batidora-planetaria
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 2}
  tier: moderate
  notes: >
    Floor planetary mixer: heavy base + a curved column, a cantilevered planetary head projecting
    forward, a balloon-whisk beater descending into a rounded stainless bowl held in a yoke.
    The whisk + cantilevered head is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Batidora' block"
    evidences: "footprint 1.016 x 1.124 m [CERT]"
    suitability: pass
  - source: "Planetary mixer standard class (Hobart H600/L800 floor mixer, brand-neutral)"
    evidences: "curved column on a base, cantilevered planetary head, balloon whisk / flat beater / dough hook, rounded bowl ~40-60 qt in a lift yoke, ~1.3-1.5 m tall"
    suitability: pass

dimensions_real:
  length_m: {value: 0.70, confidence: med}    # machine body (CAD footprint 1.0x1.1 includes bowl reach/clearance)
  width_m:  {value: 0.62, confidence: med}
  height_m: {value: 1.38, confidence: med}
  bowl_dia_m: {value: 0.46, confidence: med}
  bowl_h_m:   {value: 0.40, confidence: med}

hierarchy:
  - name: root
    children:
      - name: base
        pivot: [0, 0, 0]
        animation: none
      - name: column
        pivot: [0, 0, -0.15]
        animation: none
      - name: head
        pivot: [0, 1.1, -0.1]
        animation: none
      - name: beater_whisk
        pivot: [0, 0.95, 0.12]
        animation: spin_y
      - name: bowl
        pivot: [0, 0.45, 0.12]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: painted-body
    family: painted-metal
    color: "#e8e6e0"
    metalness: 0.0
    roughness: 0.45
    evidence: "classic planetary mixers are enamel white/grey painted; light warm grey after ACES"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel / speed lever knob"
    source: table
    confidence: 0.8

critical_features:
  - id: whisk-beater
    desc: "A balloon-whisk beater (multiple curved wire loops meeting top and bottom) hangs from the cantilevered head into the bowl — the recognizable planetary-mixer tool."
    threshold: 0.75
  - id: bowl-yoke
    desc: "A rounded stainless mixing bowl sits in a yoke/cradle at the front below the head, at working height."
    threshold: 0.75
  - id: column-head
    desc: "A curved painted column rises from a heavy base and cantilevers a planetary head forward over the bowl — the unmistakable planetary-mixer silhouette."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 26
    tris: 110000

camera:
  azimuth_deg: 40
  elevation_deg: 20
  fov: 40

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "MIX (spin whisk)"
