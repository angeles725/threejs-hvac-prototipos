<!doctype html>
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentalitros — nave Panccadia</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700} #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Cuentalitros — dosificador de agua · acero inox 304</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· cabezal + pico dispensador</span></div>
  <div class="dim">~0.45 × 0.45 m · alto 1.35 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 20);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const Rr = 3.0;
camera.position.set(Rr*Math.cos(0.72)*Math.cos(0.34), 1.0 + Rr*Math.sin(0.34), Rr*Math.sin(0.72)*Math.cos(0.34));
camera.lookAt(0, 0.75, 0.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.72, 0.05);
controls.autoRotate = false; controls.autoRotateSpeed = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.15;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5.5, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0003;
sun.shadow.camera.left=-1.3; sun.shadow.camera.right=1.3; sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-1;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));
const fill = new THREE.DirectionalLight(0xf4f7ff, 0.7); fill.position.set(1.5, 2.0, 5); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(16,16),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function brushedRoughTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#565656'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ const y=Math.random()*512,len=40+Math.random()*180,x=Math.random()*512,v=120+(Math.random()*40-20);
    g.strokeStyle=`rgba(${v},${v},${v},0.16)`; g.lineWidth=Math.random()<0.5?1:0.6;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y+(Math.random()*2-1)); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const roughMap = brushedRoughTex();
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30, roughnessMap: roughMap });
const matPipe  = new THREE.MeshStandardMaterial({ color:0xbcc0c2, metalness:0.9, roughness:0.32 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x1f2327, metalness:0.0, roughness:0.6 });
const matValve = new THREE.MeshStandardMaterial({ color:0x7a2420, metalness:0.0, roughness:0.5 });

const box=(w,h,d,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; };
const cyl=(rt,rb,h,mat,seg=18)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=m.receiveShadow=true; return m; };
const unit = new THREE.Group();

// base + column
const base = box(0.42,0.06,0.42,matSteel); base.position.y=0.03; unit.add(base);
for(const sx of [-1,1]) for(const sz of [-1,1]){ const f=cyl(0.028,0.022,0.03,matDark,10); f.position.set(sx*0.15,0.015,sz*0.15); unit.add(f); }
const column = box(0.24,1.05,0.22,matSteel); column.position.set(0,0.06+0.525,-0.02); unit.add(column);

// control head (display + keypad) near the top, facing +Z
const head = box(0.3,0.34,0.14,matDark); head.position.set(0,1.05,0.06); unit.add(head);
const bezel = box(0.32,0.36,0.05,matSteel); bezel.position.set(0,1.05,0.02); unit.add(bezel);
const disp = new THREE.Mesh(new THREE.PlaneGeometry(0.22,0.12), new THREE.MeshStandardMaterial({color:0x04141a,emissive:0x22c7ff,emissiveIntensity:0.95,roughness:0.4}));
disp.position.set(0,1.12,0.131); unit.add(disp);
for(let r=0;r<2;r++) for(let c=0;c<3;c++){ const b=cyl(0.014,0.014,0.01,matSteel,10); b.rotation.x=Math.PI/2; b.position.set(-0.07+c*0.07,1.0-r*0.06,0.131); unit.add(b); }

// swan-neck dispensing spout (quarter torus curving forward-down) from the head bottom
const spout = new THREE.Group();
const arc = new THREE.Mesh(new THREE.TorusGeometry(0.14,0.014,10,20,Math.PI/2), matPipe);
arc.position.set(0,0,0); spout.add(arc);
const tip = cyl(0.014,0.012,0.12,matPipe,12); tip.position.set(0.14,-0.06,0); spout.add(tip);
// riser from head to spout
const riser = cyl(0.014,0.014,0.16,matPipe,12); riser.position.set(0,0.08,0); spout.add(riser);
spout.position.set(0,0.86,0.14); spout.rotation.y=Math.PI/2; unit.add(spout);

// hot/cold inlet pipes at the base + valve
for(let i=0;i<2;i++){ const p=cyl(0.018,0.018,0.4,matPipe,12); p.position.set(-0.06+i*0.12,0.28,-0.14); unit.add(p); }
const manifold = box(0.2,0.05,0.05,matPipe); manifold.position.set(0,0.1,-0.14); unit.add(manifold);
const valveBody = cyl(0.03,0.03,0.06,matPipe,12); valveBody.rotation.z=Math.PI/2; valveBody.position.set(0.14,0.1,-0.14); unit.add(valveBody);
const valveH = box(0.02,0.1,0.02,matValve); valveH.position.set(0.14,0.16,-0.14); unit.add(valveH);
// hose coil (a torus)
const hose = new THREE.Mesh(new THREE.TorusGeometry(0.1,0.012,8,24), matDark); hose.position.set(-0.18,0.5,-0.05); hose.rotation.y=0.6; unit.add(hose);

scene.add(unit);
renderer.shadowMap.needsUpdate = true;

const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

globalThis.__cuentalitrosApp = { runtime:{ scene, renderer, camera, unit } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
