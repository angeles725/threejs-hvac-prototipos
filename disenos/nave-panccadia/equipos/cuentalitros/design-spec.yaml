# DesignSpec — cuentalitros (water meter / doser-mixer)
design: cuentalitros
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Bakery water meter/doser-mixer: a stainless column on a base with a control head (digital display
    + keypad) near the top, a swan-neck dispensing spout curving forward, and hot/cold inlet pipes +
    a valve at the base. The control-head display + swan-neck spout is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Cuentalitros' block"
    evidences: "footprint 1.001 x 2.001 m [CERT] (floor unit + spout reach)"
    suitability: pass
  - source: "Bakery water doser-mixer standard class (temperature water meter, brand-neutral)"
    evidences: "stainless column/head with a digital liters+temperature display + keypad, a dispensing swan-neck spout, hot/cold inlets, ~1.2-1.5 m tall on a stand or wall bracket"
    suitability: pass

dimensions_real:
  length_m: {value: 0.45, confidence: med}   # body width
  width_m:  {value: 0.45, confidence: med}   # depth
  height_m: {value: 1.35, confidence: med}   # to head top
  spout_reach_m: {value: 0.35, confidence: low}

hierarchy:
  - name: root
    children:
      - name: base_column
        pivot: [0, 0, 0]
        animation: none
      - name: control_head
        pivot: [0, 1.1, 0.1]
        animation: none
      - name: swan_spout
        pivot: [0, 0.9, 0.2]
        animation: none
      - name: inlet_pipes
        pivot: [0, 0.2, -0.15]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: pipe-steel
    family: bare-metal
    color: "#bcc0c2"
    metalness: 0.9
    roughness: 0.35
    evidence: "chromed spout + inlet pipes"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control head enclosure"
    source: table
    confidence: 0.8
  - id: valve-red
    family: plastic
    color: "#7a2420"
    metalness: 0.0
    roughness: 0.5
    evidence: "inlet valve handle; color = actionable (ISA-101)"
    source: estimated
    confidence: 0.72

critical_features:
  - id: doser-head-display
    desc: "A control head with a digital display (liters + temperature) + keypad reads as the water-dosing controller — the identity."
    threshold: 0.75
  - id: spout-pipes
    desc: "A swan-neck dispensing spout curves forward from the head, and hot/cold inlet pipes + a valve sit at the base — the water path."
    threshold: 0.72
  - id: stainless-column
    desc: "A brushed-stainless column on a base/stand at working height reads at real scale."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 22
    tris: 70000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
