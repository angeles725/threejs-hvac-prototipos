# DesignSpec — horno de convección (convection oven on stand)
design: horno-conveccion
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    Convection oven: a brushed-stainless oven body on an open stand, a side-hinged glass door
    showing horizontal wire racks and a circular convection fan on the back wall, a top control
    panel. Glass door + racks + fan is the identity.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    stainless_recipe: "disenos/nave-panccadia/equipos/lavavajillas/lavavajillas.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'Horno convección' block"
    evidences: "footprint 1.156 x 1.285 m [CERT]"
    suitability: pass
  - source: "Convection oven standard class (Unox/Rational/Blodgett, brand-neutral)"
    evidences: "oven body ~0.8-0.9 m wide on an open stand, side-hinged full glass door, 4-10 horizontal racks, circular convection fan on the back wall, top or side control panel"
    suitability: pass

dimensions_real:
  length_m: {value: 0.92, confidence: med}
  width_m:  {value: 0.85, confidence: med}
  height_m: {value: 1.55, confidence: med}   # body on stand
  body_h_m: {value: 0.78, confidence: med}
  stand_h_m:{value: 0.62, confidence: med}

hierarchy:
  - name: root
    children:
      - name: stand
        pivot: [0, 0, 0]
        animation: none
      - name: oven_body
        pivot: [0, 0.62, 0]
        animation: none
      - name: glass_door
        pivot: [-0.42, 1.0, 0.43]
        animation: none
      - name: fan
        pivot: [0, 1.0, -0.3]
        animation: spin_z
      - name: control_panel
        pivot: [0, 1.44, 0.4]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-glass
    family: glass
    color: "#1a2426"
    metalness: 0.0
    roughness: 0.12
    evidence: "tinted glass, transparent opacity (no transmission)"
    source: table
    confidence: 0.8
  - id: rack-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.85
    roughness: 0.45
    evidence: "wire racks + fan"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: glass-door-fan
    desc: "A glass door reveals horizontal wire racks AND a circular convection fan on the back wall — the fan is what distinguishes a convection oven from a plain box."
    threshold: 0.75
  - id: oven-on-stand
    desc: "A brushed-stainless oven body sits on an open stand at working height, reading as a floor convection oven beside a 1.8 m person."
    threshold: 0.72
  - id: control-panel
    desc: "A control panel (knobs/display) at the top of the oven reads as the bake controller."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 30
    tris: 120000

camera:
  azimuth_deg: 42
  elevation_deg: 20
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"
  - "FAN (convection)"
