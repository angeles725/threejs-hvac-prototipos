# DesignSpec — fermentadora (single-door proofer cabinet)
design: fermentadora
track: threejs
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 1, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    Compact single-door proofer cabinet: insulated brushed-stainless body, one full-height glass
    door revealing a single rack trolley of dough trays, a side control panel with humidity display.
    The smaller sibling of camara-fermentacion.

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
  reuse_pointers:
    proofer: "disenos/nave-panccadia/equipos/camara-fermentacion/camara-fermentacion.html"

references:
  - source: "disenos/nave-panccadia/equipment.json — CAD 'fermentadora' block"
    evidences: "footprint 2.2 x 1.2 m [CERT] (includes door swing / trolley clearance; body ~0.9 m wide)"
    suitability: pass
  - source: "Single-rack proofer standard class (roll-in single-trolley proofer, brand-neutral)"
    evidences: "reach-in / roll-in proofer ~0.8-1.0 m wide body, one full glass door, one rack trolley of trays, side control with humidity + temperature"
    suitability: pass

dimensions_real:
  length_m: {value: 0.90, confidence: med}   # body width (front)
  width_m:  {value: 0.95, confidence: med}   # depth
  height_m: {value: 1.95, confidence: med}
  rack_levels: {value: 14, confidence: low}

hierarchy:
  - name: root
    children:
      - name: cabinet
        pivot: [0, 0, 0]
        animation: none
      - name: glass_door
        pivot: [-0.4, 1.0, 0.47]
        animation: none
      - name: rack_trolley
        pivot: [0, 0.9, 0]
        animation: none
      - name: control_panel
        pivot: [0.4, 1.5, 0.47]
        animation: none

materials:
  - id: stainless-brushed
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.9
    roughness: 0.30
    evidence: "proven stainless recipe"
    source: table
    confidence: 0.85
  - id: door-glass
    family: glass
    color: "#16201f"
    metalness: 0.0
    roughness: 0.12
    evidence: "tinted glass door, transparent opacity"
    source: table
    confidence: 0.8
  - id: rack-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.85
    roughness: 0.45
    evidence: "rack + trays"
    source: table
    confidence: 0.8
  - id: control-dark
    family: plastic
    color: "#1f2327"
    metalness: 0.0
    roughness: 0.6
    evidence: "control bezel"
    source: table
    confidence: 0.8

critical_features:
  - id: glass-door-rack
    desc: "One full-height glass door reveals a single rack trolley of dough trays inside — the compact proofer identity."
    threshold: 0.75
  - id: insulated-proofer
    desc: "An insulated brushed-stainless cabinet with a side humidity+temperature control panel reads as a proofer, not a plain locker."
    threshold: 0.72
  - id: proofer-scale
    desc: "Floor cabinet at real scale — a 1.8 m person reaches the top; the door spans most of the front height."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 28
    tris: 110000

camera:
  azimuth_deg: 42
  elevation_deg: 18
  fov: 42

lighting: house-rig

ui_controls:
  - "AUTO-ROTATE"

colorTarget:            # objective material-read anchor (design3d v1.10 / block53)
  srgb: [86, 92, 97]     # canonical satin-304 rendered value under the house rig
  deltaE00Max: 8       # passes the current good render, catches a regression to dark (benchmark dark-fail was ~11.7)
  crop: "240x40+990+432"   # top-front stainless rail (side/top faces sit in shadow); measured dE00 2.42 vs canonical
