<!DOCTYPE html>

<head>

</style>
<script>
// Inyección dinámica de importmap (evita el mangling de package@version por Cloudflare)
(function(){
  if (typeof document === 'undefined') return;
  var AT = String.fromCharCode(64);
  var base = 'https://unpkg.com/three' + AT + '0.160.0/';
  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': base + 'build/three.module.js',
    'three/addons/': base + 'examples/jsm/'
  }});
  document.head.appendChild(im);
})();
</script>

<body>

  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="module" id="app">
// ============================================================================
// UPS 40 kVA + BANCO DE BATERÍAS · Voxel Art 3D (estilo datacenter dark)
//
// SCALE: 1 voxel = 0.025 m
//   Gabinete UPS:      0.60 × 1.75 × 0.85 m  = 24 × 70 × 34 vox
//   Gabinete baterías: 0.60 × 1.75 × 0.85 m  = 24 × 70 × 34 vox (contiguo)
//   Eje X = ancho · Y = alto · Z = fondo (cara frontal en z máx)
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas (ventiladores,
// mímico del display, LEDs, medidor, puerta) en Groups THREE separados.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  FLOOR:   { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D: { c:0x1a1e25, r:0.90, m:0.05 },
  BASE:    { c:0x0d0f13, r:0.85, m:0.10 },
  CAB:     { c:0x1a1e25, r:0.55, m:0.35 },   // gris muy oscuro datacenter (no negro puro)
  CAB_D:   { c:0x14171d, r:0.60, m:0.30 },
  CAB_L:   { c:0x232a33, r:0.50, m:0.40 },
  MET:     { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:   { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:   { c:0xbcc4cc, r:0.30, m:0.90 },
  FIN:     { c:0x3b434e, r:0.42, m:0.85 },
  GALV:    { c:0xb7c0c7, r:0.30, m:0.95 },
  GALV_D:  { c:0x87919a, r:0.40, m:0.90 },
  COPPER:  { c:0xc4793c, r:0.35, m:1.00 },
  COPPER_D:{ c:0x9a5f30, r:0.40, m:1.00 },
  BATT:    { c:0x2a2f38, r:0.60, m:0.25 },   // baterías VRLA gris oscuro
  BATT_D:  { c:0x20242c, r:0.65, m:0.20 },
  BATT_L:  { c:0x333a44, r:0.55, m:0.30 },
  TERMR:   { c:0xc22233, r:0.50, m:0.40 },   // borne positivo (+)
  TERMK:   { c:0x0b0d11, r:0.60, m:0.40 },   // borne negativo (−)
  BLK:     { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:     { c:0xe8edf2, r:0.60, m:0.10 },
  WHTP:    { c:0xcfd6dd, r:0.55, m:0.30 },
  YEL:     { c:0xffc400, r:0.75, m:0.00 },
  TEAL:    { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  DISP:    { c:0x04060a, r:0.95, m:0.00 },
  GRN_B:   { c:0x0f8a4f, r:0.50, m:0.10, e:0x0f8a4f, ei:0.35 },
  RED_B:   { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.35 },
  AMBER:   { c:0xffb300, r:0.50, m:0.20, e:0xffb300, ei:0.50 },
  BLUEB:   { c:0x3aa0ff, r:0.50, m:0.20, e:0x3aa0ff, ei:0.50 },
  GRAYK:   { c:0x555e69, r:0.50, m:0.60 },
  BUS:     { c:0x3b434e, r:0.50, m:0.70 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// ====== GEOMETRÍA GENERAL ======
const Y0 = 0, Y1 = 69, Z0 = 1, Z1 = 34;          // alto / fondo comunes
const AX0 = 4,  AX1 = 27;                          // gabinete UPS
const BX0 = 28, BX1 = 51;                          // gabinete baterías

// ====== PISO (baldosas de piso técnico elevado) ======
for (let x = -10; x <= 62; x++) {
  for (let z = -6; z <= 46; z++) {
    let c = (hash2(x, z) % 100 < 16) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 2) % 12 === 0 || (z + 2) % 12 === 0) c = 'FLOOR_D';  // juntas de baldosa (0.3 m)
    vox(x, -1, z, c);
  }
}

// ====== SHELL DE GABINETE (común) ======
function shell(x0, x1) {
  fill(x0, x1, Y0,   Y0 + 2, Z0, Z1, 'BASE');      // plinto
  fill(x0, x1, Y0+3, Y1, Z0, Z0, 'CAB_D');         // fondo
  fill(x0, x0, Y0+3, Y1, Z0, Z1, 'CAB');           // lateral izq
  fill(x1, x1, Y0+3, Y1, Z0, Z1, 'CAB');           // lateral der
  fill(x0, x1, Y1,   Y1, Z0, Z1, 'CAB_L');         // techo
  fill(x0, x1, Y0+3, Y0+3, Z0, Z1, 'CAB_D');       // piso interior
  // aristas frontales resaltadas
  fill(x0, x0, Y0+3, Y1, Z1, Z1, 'CAB_L');
  fill(x1, x1, Y0+3, Y1, Z1, Z1, 'CAB_L');
}
shell(AX0, AX1);   // UPS
shell(BX0, BX1);   // baterías

// -- Marco frontal UPS (borde; el hueco queda para la puerta dinámica + interior)
fill(AX0, AX1, Y1-1, Y1,   Z1, Z1, 'CAB');         // borde superior
fill(AX0, AX1, Y0+3, Y0+4, Z1, Z1, 'CAB');         // borde inferior
fill(AX0, AX0+1, Y0+3, Y1, Z1, Z1, 'CAB');         // borde izq
fill(AX1-1, AX1, Y0+3, Y1, Z1, Z1, 'CAB');         // borde der

// -- Marco frontal BATERÍAS (frente abierto: baterías visibles tras postes/rieles)
fill(BX0,   BX0+1, Y0+3, Y1, Z1, Z1, 'CAB');
fill(BX1-1, BX1,   Y0+3, Y1, Z1, Z1, 'CAB');
fill(BX0, BX1, Y1-1, Y1,   Z1, Z1, 'CAB');
fill(BX0, BX1, Y0+3, Y0+4, Z1, Z1, 'CAB');

// ====== REJILLAS DE VENTILACIÓN SUPERIORES (aperturas para ventiladores en techo) ======
const FANS = [
  { cx: 10, cz: 17, r: 4.0, spd: 9  },   // UPS izq
  { cx: 21, cz: 17, r: 4.0, spd: 9  },   // UPS der
  { cx: 39, cz: 17, r: 4.0, spd: 6  }    // baterías
];
function fanOpeningTop(cx, cz, r) {
  const gx0 = Math.floor(cx - r) - 1, gx1 = Math.ceil(cx + r) + 1;
  const gz0 = Math.floor(cz - r) - 1, gz1 = Math.ceil(cz + r) + 1;
  for (let x = gx0; x <= gx1; x++) {
    for (let z = gz0; z <= gz1; z++) {
      const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
      if (d <= r) {
        if (z % 2 === 0) vox(x, Y1, z, 'FIN');      // barras de rejilla
        else cells.delete(K(x, Y1, z));              // apertura
        cells.delete(K(x, Y1 - 1, z));               // cavidad
        vox(x, Y1 - 2, z, 'CAB_D');                  // placa/plenum
      }
    }
  }
}
FANS.forEach(f => fanOpeningTop(f.cx, f.cz, f.r));

// ====== INTERIOR UPS (visible en modo CORTE / puerta oculta) ======
// Módulos de potencia con cara frontal en z=24..31 (detrás de la puerta z=34).
function moduleBlock(x0, x1, y0, y1, base, pilot) {
  fill(x0, x1, y0, y1, 24, 31, base);
  fill(x0, x1, y1, y1, 31, 31, 'CAB_L');           // capó superior
  // aletas de disipador en la cara frontal
  for (let x = x0 + 1; x <= x1 - 1; x += 2) fill(x, x, y0 + 1, y1 - 1, 31, 31, 'FIN');
  vox(x0 + 1, y0 + 1, 31, pilot);                  // piloto de módulo
}
moduleBlock(6, 14, 6, 22,  'MET_D', 'GRN_B');      // RECTIFICADOR (AC->DC)
moduleBlock(6, 14, 26, 42, 'MET_D', 'GRN_B');      // INVERSOR (DC->AC)
moduleBlock(16, 25, 6, 22, 'CAB_L', 'GRN_B');      // CARGADOR de baterías
moduleBlock(16, 25, 26, 42,'CAB_L', 'BLUEB');      // BYPASS ESTÁTICO + control
// -- Banco de capacitores DC (parte superior interior)
for (let cx = 7; cx <= 24; cx += 3) {
  fill(cx, cx + 1, 46, 60, 26, 29, 'CAB_D');
  vox(cx, 61, 27, 'TERMR'); vox(cx + 1, 61, 27, 'TERMK');
}
// -- Barras de bus de cobre verticales (interior)
for (const bx of [9, 12, 20, 23]) fill(bx, bx, 6, 64, 27, 27, 'COPPER');
fill(6, 25, 44, 45, 27, 27, 'COPPER');             // barra horizontal (link DC)
// -- Enlace de cobre UPS -> gabinete de baterías (a través del tabique)
fill(26, 29, 19, 22, 23, 25, 'COPPER_D');

// ====== INTERIOR BATERÍAS (filas de VRLA visibles con bornes +/−) ======
const SHELVES = [6, 20, 34, 48];
for (const sy of SHELVES) {
  fill(BX0 + 1, BX1 - 1, sy - 1, sy - 1, Z0, Z1 - 2, 'MET_D');   // riel/estante
  fill(BX0, BX1, sy - 1, sy - 1, Z1, Z1, 'CAB');                 // travesaño frontal (jaula)
  for (let i = 0; i < 5; i++) {
    const bx = BX0 + 2 + i * 4;                                  // 5 baterías por estante
    fill(bx, bx + 2, sy, sy + 9, 24, 32, 'BATT');                // cuerpo VRLA
    fill(bx, bx + 2, sy, sy + 9, 32, 32, 'BATT_L');              // cara frontal
    fill(bx, bx + 2, sy + 9, sy + 9, 24, 32, 'BATT_D');          // tapa
    vox(bx, sy + 10, 31, 'TERMR');                                // borne +
    vox(bx + 2, sy + 10, 31, 'TERMK');                            // borne −
    if (i > 0) vox(bx - 1, sy + 10, 31, 'BLK');                   // interconector
  }
}

// ====== INTERRUPTORES (entrada / salida / bypass) — caja en lateral izq. del UPS ======
fill(2, 3, 30, 50, 20, 28, 'CAB_L');               // envolvente de interruptores (protruye)
fill(2, 3, 30, 30, 20, 28, 'CAB_D');
const BREAKERS = [
  { y: 45, top: 'AMBER' },   // ENTRADA
  { y: 40, top: 'GRN_B'  },  // SALIDA
  { y: 35, top: 'BLUEB'  }   // BYPASS
];
for (const b of BREAKERS) {
  fill(2, 2, b.y, b.y + 2, 29, 29, 'MET_D');        // cuerpo del interruptor
  vox(2, b.y + 2, 29, b.top);                        // palanca (ON)
}

// ====== BANDEJA PORTACABLES SUPERIOR + CONDUITS (estructura externa) ======
fill(-8, 54, 73, 74, 4, 6, 'MET_D');               // fondo de bandeja
fill(-8, 54, 74, 74, 4, 4, 'MET_D');               // pared bandeja
fill(-8, 54, 74, 74, 6, 6, 'MET_D');
for (let x = -6; x <= 52; x += 8) fill(x, x, 72, 72, 4, 6, 'GALV_D');   // ménsulas
// bajada de entrada AC a la parte superior del UPS
fill(9, 10, 70, 73, 5, 6, 'GALV');
// conduit de salida por el piso hacia la derecha
fill(14, 16, Y0, Y0 + 1, 30, 31, 'GALV');
fill(14, 16, -1, -1, 30, 31, 'GALV_D');

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 220, 520);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(120, 180, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -120; sc.right = 120; sc.top = 140; sc.bottom = -40; sc.near = 5; sc.far = 520;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(28, 34, 12);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-80, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(40, 60, -120);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
}

// ====== ESTADO ======
// mode: 0=ONLINE · 1=EN BATERÍA · 2=BYPASS
const state = { mode: 0, corte: false, falla: false, cutaway: false, rot: true };
function onBattery() { return state.corte || state.mode === 1; }   // corte de red => siempre batería
function onBypass()  { return state.mode === 2 && !state.corte; }
function onLine()    { return !onBattery() && !onBypass(); }

// ====== HELPERS DINÁMICOS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}

// -- Displays 7 segmentos (dígitos 3×5) para la placa de datos
const SEG_CELLS = {
  a: [[0, 4], [1, 4], [2, 4]], b: [[2, 3]], c: [[2, 1]],
  d: [[0, 0], [1, 0], [2, 0]], e: [[0, 1]], f: [[0, 3]],
  g: [[0, 2], [1, 2], [2, 2]]
};
const CHAR_SEGS = {
  '0': 'abcdef', '1': 'bc', '2': 'abgde', '3': 'abgcd', '4': 'fgbc',
  '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abfgcd',
  'F': 'aefg', ' ': ''
};
function buildDigits(str, mat, ox, oy, oz) {
  const g = new THREE.Group();
  let cx = ox;
  for (const ch of str) {
    for (const s of (CHAR_SEGS[ch] || '')) {
      for (const cell of SEG_CELLS[s]) {
        g.add(dynBox(mat, cx + cell[0] + 0.5, oy + cell[1] + 0.5, oz, 0.9, 0.9, 0.4));
      }
    }
    cx += 4;
  }
  return g;
}

// -- Ventiladores (aspas de cajas con pitch) — SIEMPRE visibles en techo
const matBlade = new THREE.MeshStandardMaterial({ color: 0x7d8894, roughness: 0.35, metalness: 0.85, envMapIntensity: 0.5 });
const matHub   = new THREE.MeshStandardMaterial({ color: 0x1a1e25, roughness: 0.5, metalness: 0.6 });
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 1.3, 1.3, 0.7));
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.55, 0, 0.85, r, 0.4);
    b.rotation.y = 0.55;
    arm.add(b);
    arm.rotation.z = i * Math.PI / 2;
    g.add(arm);
  }
  return g;
}
const fanRigs = [];
for (const f of FANS) {
  const fan = buildFan(f.r);
  const mount = new THREE.Group();
  mount.add(fan);
  mount.position.set(f.cx, Y1 + 0.6, f.cz);
  mount.rotation.x = Math.PI / 2;             // eje vertical (extracción por techo)
  scene.add(mount);
  fanRigs.push({ fan: fan, spd: f.spd });
}

// ====== PUERTA FRONTAL UPS + HMI (Group dinámico · se oculta en modo CORTE) ======
const doorGroup = new THREE.Group();
scene.add(doorGroup);
const ZF = 34.5;                              // plano de la puerta
const matDoor  = new THREE.MeshStandardMaterial({ color: 0x1d222b, roughness: 0.5, metalness: 0.35 });
const matBezel = new THREE.MeshStandardMaterial({ color: 0x0b0d11, roughness: 0.6, metalness: 0.3 });
const matScreen= emat(0x0a1a12, 0x04060a, 0.35);
const matPlate = new THREE.MeshStandardMaterial({ color: 0x2a313b, roughness: 0.45, metalness: 0.6 });
const matTeal  = emat(0x00d4aa, 0x02120e, 0.6);

// panel de puerta (una sola losa escalada)
doorGroup.add(dynBox(matDoor, 15.5, 36.5, ZF, 20, 62, 1));
// manija
doorGroup.add(dynBox(matBezel, 24, 34, ZF + 0.6, 1, 8, 0.8));
// franja de marca teal (cabecera)
doorGroup.add(dynBox(matTeal, 15.5, 64, ZF + 0.4, 17, 2, 0.5));
// bisel + pantalla LCD
doorGroup.add(dynBox(matBezel, 15.5, 50, ZF + 0.3, 17, 20, 0.6));
doorGroup.add(dynBox(matScreen, 15.5, 50, ZF + 0.6, 15, 18, 0.4));
// rejilla de ventilación decorativa (inferior de la puerta)
for (let yy = 8; yy <= 12; yy++) doorGroup.add(dynBox(matBezel, 15.5, yy, ZF + 0.35, 15, 0.5, 0.4));

// -- MÍMICO DE FLUJO DE ENERGÍA en la LCD (entrada->rectificador->inversor->salida)
const MZ = ZF + 0.75;
function mkSeg(coords, hex) {
  const mat = emat(hex, 0x05070a, 1.0);
  const g = new THREE.Group();
  for (const c of coords) g.add(dynBox(mat, c[0] + 0.5, c[1] + 0.5, MZ, 0.85, 0.85, 0.4));
  doorGroup.add(g);
  return { g: g, mat: mat };
}
// ENTRADA AC -> RECTIFICADOR (línea + bloque)
const segIn = mkSeg([[9,50],[10,50],[11,50],[12,50],[13,50],[14,50],
                     [11,49],[11,51],[12,49],[12,51]], 0xffb300);
// INVERSOR -> SALIDA AC (línea + bloque)
const segInv = mkSeg([[15,50],[16,50],[17,50],[18,50],[19,50],[20,50],[21,50],
                      [17,49],[17,51],[18,49],[18,51]], 0x0f8a4f);
// RAMA DE BATERÍA (bus DC hacia abajo -> icono batería)
const segBatt = mkSeg([[15,49],[15,48],[15,47],[15,46],[15,45],
                       [14,44],[15,44],[16,44],[14,43],[15,43],[16,43]], 0xc22233);
// RUTA DE BYPASS ESTÁTICO (entrada arriba -> a través -> salida)
const segBypass = mkSeg([[9,51],[9,52],[9,53],[9,54],
                         [10,54],[11,54],[12,54],[13,54],[14,54],[15,54],[16,54],[17,54],[18,54],[19,54],[20,54],[21,54],
                         [21,53],[21,52],[21,51]], 0x3aa0ff);
// nodo de SALIDA (siempre con energía)
const segOut = mkSeg([[22,50],[22,49],[22,51]], 0x0f8a4f);

// -- LEDs de estado: ONLINE / BATERÍA / BYPASS / FALLA
function mkLed(x, hex) {
  const bez = dynBox(matBezel, x + 0.5, 38.5, MZ, 1.4, 1.4, 0.5);
  doorGroup.add(bez);
  const mat = emat(hex, 0x05070a, 0.1);
  doorGroup.add(dynBox(mat, x + 0.5, 38.5, MZ + 0.2, 1.1, 1.1, 0.5));
  return mat;
}
const ledOnline = mkLed(9,  0x00ff66);
const ledBatt   = mkLed(13, 0xffb300);
const ledBypass = mkLed(17, 0x3aa0ff);
const ledFalla  = mkLed(21, 0xff2233);

// -- MEDIDOR DE CARGA % (barra horizontal de 10 segmentos)
const meterSegs = [];
for (let i = 0; i < 10; i++) {
  const mat = emat(0x11151b, 0x05070a, 0.05);
  const seg = dynBox(mat, 8.5 + i * 1.4 + 0.5, 32, MZ, 1.1, 1.6, 0.4);
  doorGroup.add(seg);
  meterSegs.push(seg);
}

// -- PLACA DE DATOS: 'UPS 40 kVA · 3Ø 480V' (nº en 7-seg, texto sugerido)
doorGroup.add(dynBox(matPlate, 15.5, 18, ZF + 0.3, 16, 8, 0.5));
const matNum = emat(0x00d4aa, 0x02120e, 0.9);
doorGroup.add(buildDigits('40', matNum, 12, 15, ZF + 0.7));
for (const ly of [21, 13]) doorGroup.add(dynBox(matBezel, 15.5, ly, ZF + 0.7, 12, 0.5, 0.4)); // líneas de texto grabado

// -- Luz de acento del HMI
const hmiLight = new THREE.PointLight(0x00ff66, 1.4, 26, 2);
hmiLight.position.set(15.5, 46, ZF + 6);
scene.add(hmiLight);

// ====== PARTÍCULAS DE FLUJO POR RUTA (gateadas por estado) ======
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 7));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.68, 0.68, 0.68);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [
  // ENTRADA AC (ámbar): bandeja superior -> bajada al UPS
  { f: makeFlow([[-8, 73.5, 5], [9.5, 73.5, 5], [9.5, 70, 5]], 0xffb300, 14), gate: () => !onBattery() },
  // DC BATERÍA (rojo): gabinete de baterías -> UPS (descarga)
  { f: makeFlow([[39, 30, 8], [39, 20, 6], [27, 20, 6]], 0xc22233, 12), gate: () => onBattery() },
  // SALIDA AC (verde): base del UPS -> piso -> a la carga
  { f: makeFlow([[15, 1, 30.5], [15, -0.5, 30.5], [58, -0.5, 30.5]], 0x0f8a4f, 14), gate: () => true },
  // CONTROL (azul): lazo vertical en el costado de la puerta
  { f: makeFlow([[6.5, 58, 35.4], [6.5, 40, 35.4]], 0x3aa0ff, 7), gate: () => true }
];
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function setRole(role, ei) { role.mat.emissiveIntensity = ei; }
function tick(dt) {
  tNow += dt;
  const battery = onBattery(), bypass = onBypass(), online = onLine();
  const pulse = 0.55 + 0.45 * Math.abs(Math.sin(tNow * 3));

  // -- ventiladores (giran salvo falla que los ralentiza)
  for (const fr of fanRigs) fr.fan.rotation.z += dt * fr.spd * (state.falla ? 0.25 : 1);

  // -- mímico del display
  setRole(segIn,     (online ? 1.4 * pulse : 0.06));                       // red -> rectificador
  setRole(segInv,    (!bypass ? 1.4 * pulse : 0.08));                      // inversor -> salida
  setRole(segBatt,   (battery ? 1.5 * pulse : (online ? 0.20 : 0.06)));    // descarga / carga tenue
  setRole(segBypass, (bypass ? 1.4 * pulse : 0.05));                       // ruta de bypass
  setRole(segOut,    1.2 * pulse);                                         // salida siempre viva

  // -- LEDs de estado
  ledOnline.emissiveIntensity = (online && !state.falla) ? 1.6 : 0.08;
  ledBatt.emissiveIntensity   = battery ? 1.5 : 0.08;
  ledBypass.emissiveIntensity = bypass ? 1.5 : 0.08;
  ledFalla.emissiveIntensity  = state.falla ? (0.3 + 1.4 * Math.abs(Math.sin(tNow * 8))) : 0.06;

  // -- luz de acento del HMI
  if (state.falla) { hmiLight.color.setHex(0xff2233); hmiLight.intensity = 0.6 + 1.2 * Math.abs(Math.sin(tNow * 8)); }
  else if (battery) { hmiLight.color.setHex(0xffb300); hmiLight.intensity = 1.4; }
  else if (bypass)  { hmiLight.color.setHex(0x3aa0ff); hmiLight.intensity = 1.4; }
  else { hmiLight.color.setHex(0x00ff66); hmiLight.intensity = 1.4; }

  // -- medidor de carga %
  const load = state.falla ? 0.99 : (battery ? 0.66 : 0.56) + 0.05 * Math.sin(tNow * 1.4);
  const nlit = Math.round(load * meterSegs.length);
  for (let i = 0; i < meterSegs.length; i++) {
    const m = meterSegs[i].material;
    if (i < nlit) {
      const frac = i / meterSegs.length;
      let hex = frac < 0.7 ? 0x0f8a4f : (frac < 0.85 ? 0xffb300 : 0xc22233);
      if (state.falla) hex = 0xc22233;
      m.color.setHex(hex); m.emissive.setHex(hex); m.emissiveIntensity = 1.2;
    } else {
      m.color.setHex(0x11151b); m.emissiveIntensity = 0.05;
    }
  }

  // -- puerta: oculta en modo CORTE (ver interior)
  doorGroup.visible = !state.cutaway;

  // -- flujos
  for (const o of flows) o.f.update(dt, o.gate());
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, onBattery: onBattery, onBypass: onBypass, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(120, 84, 128);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(28, 36, 8);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const modeNames = ['ONLINE', 'EN BATERÍA', 'BYPASS'];
  const modeCls = ['on', 'amber', 'blue'];
  function refreshUI() {
    const bM = document.getElementById('bMode');
    bM.textContent = modeNames[state.mode];
    bM.className = modeCls[state.mode];
    const setBtn = (id, on, alarm) => {
      const b = document.getElementById(id);
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? (alarm ? 'alarm' : 'on') : 'off';
    };
    setBtn('bCorte', state.corte, false);
    setBtn('bFalla', state.falla, true);
    setBtn('bCut', state.cutaway, false);
    setBtn('bRot', state.rot, false);
  }
  document.getElementById('bMode').addEventListener('click', () => { state.mode = (state.mode + 1) % 3; refreshUI(); });
  document.getElementById('bCorte').addEventListener('click', () => { state.corte = !state.corte; refreshUI(); });
  document.getElementById('bFalla').addEventListener('click', () => { state.falla = !state.falla; refreshUI(); });
  document.getElementById('bCut').addEventListener('click', () => { state.cutaway = !state.cutaway; refreshUI(); });
  document.getElementById('bRot').addEventListener('click', () => { state.rot = !state.rot; refreshUI(); });
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
