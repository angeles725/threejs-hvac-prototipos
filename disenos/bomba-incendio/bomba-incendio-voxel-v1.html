<script type="module" id="app">
// ============================================================================
// SISTEMA DE BOMBA CONTRA INCENDIO SOBRE SKID · Voxel Art 3D (estilo SCADA dark)
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Skid:  2.50 m largo × 1.20 m ancho × 1.50 m alto  = 100 × 48 × 60 vox
//   Bomba principal horizontal + motor eléctrico con guarda-acoplamiento (gira),
//   bomba jockey, cabezal de descarga (gate/check/manómetros), tablero de control
//   contra incendio rojo, tubería roja de succión/descarga con bridas, válvula de
//   alivio, sensor de presión y base con anclas.
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  FLOOR:  { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D:{ c:0x1c2028, r:0.90, m:0.05 },
  BASE:   { c:0x14171d, r:0.85, m:0.10 },
  RED:    { c:0xc4241f, r:0.55, m:0.10 },    // rojo bombero
  RED_D:  { c:0x991915, r:0.60, m:0.10 },
  RED_L:  { c:0xe23a2c, r:0.48, m:0.10 },
  MOTOR:  { c:0x3a4048, r:0.45, m:0.80 },    // motor gris oscuro
  MOTOR_D:{ c:0x2a2f36, r:0.52, m:0.75 },
  MOTOR_L:{ c:0x4c545e, r:0.40, m:0.82 },
  MET:    { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:  { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:  { c:0xbcc4cc, r:0.30, m:0.90 },
  GALV:   { c:0xb7c0c7, r:0.30, m:0.95 },
  GALV_D: { c:0x87919a, r:0.40, m:0.90 },
  COPPER: { c:0xc4793c, r:0.35, m:1.00 },
  BRASS:  { c:0xcaa04a, r:0.35, m:0.95 },
  BLK:    { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:    { c:0xe8edf2, r:0.60, m:0.10 },
  WHTP:   { c:0xcfd6dd, r:0.55, m:0.30 },
  GFACE:  { c:0xeef2e0, r:0.55, m:0.05 },    // carátula manómetro
  BFACE:  { c:0x1a3a5a, r:0.55, m:0.10 },    // carátula compuesto (succión)
  RFACE:  { c:0x5a1416, r:0.55, m:0.10 },    // carátula descarga
  TEAL:   { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  YEL:    { c:0xffc400, r:0.75, m:0.00 },
  GRN_B:  { c:0x0f8a4f, r:0.50, m:0.10, e:0x0f8a4f, ei:0.30 },
  RED_B:  { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.30 },
  AMBER:  { c:0xffb300, r:0.50, m:0.20, e:0xffb300, ei:0.45 },
  BLUEB:  { c:0x3aa0ff, r:0.50, m:0.20, e:0x3aa0ff, ei:0.45 },
  DISP:   { c:0x04060a, r:0.95, m:0.00 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// -- cilindros voxelizados (ejes X / Y / Z) para bombas y tubería
function cylX(x0, x1, cy, cz, r, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++)
        if (Math.hypot(y + 0.5 - cy, z + 0.5 - cz) <= r) vox(x, y, z, c);
}
function cylY(y0, y1, cx, cz, r, c) {
  for (let y = y0; y <= y1; y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
      for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++)
        if (Math.hypot(x + 0.5 - cx, z + 0.5 - cz) <= r) vox(x, y, z, c);
}
function cylZ(z0, z1, cx, cy, r, c) {
  for (let z = z0; z <= z1; z++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
      for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
        if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= r) vox(x, y, z, c);
}
// -- aro (anillo) en plano X-Z (volante de válvula) y plano Y-Z (hoop de guarda)
function ringXZ(cx, cz, y, ro, ri, c) {
  for (let x = Math.floor(cx - ro); x <= Math.ceil(cx + ro); x++)
    for (let z = Math.floor(cz - ro); z <= Math.ceil(cz + ro); z++) {
      const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
      if (d <= ro && d >= ri) vox(x, y, z, c);
    }
}
function ringYZ(x, cy, cz, ro, ri, c) {
  for (let y = Math.floor(cy - ro); y <= Math.ceil(cy + ro); y++)
    for (let z = Math.floor(cz - ro); z <= Math.ceil(cz + ro); z++) {
      const d = Math.hypot(y + 0.5 - cy, z + 0.5 - cz);
      if (d <= ro && d >= ri) vox(x, y, z, c);
    }
}
// -- manómetro: carátula (disco) en plano X-Y a una profundidad z, con bisel y aguja
function gauge(cx, cy, z, r, faceC) {
  for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d <= r) vox(x, y, z, d <= r - 1 ? faceC : 'MET_D');
    }
  vox(Math.round(cx - 0.5), Math.round(cy - 0.5), z + 1, 'BLK');       // eje aguja
  vox(Math.round(cx - 0.5) + 1, Math.round(cy - 0.5) + 1, z + 1, 'RED_D'); // aguja
}

// ====== PISO (y = -1) con juntas ======
for (let x = -8; x <= 108; x++) {
  for (let z = -8; z <= 56; z++) {
    let c = (hash2(x, z) % 100 < 18) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 60) % 24 === 0) c = 'FLOOR_D';
    vox(x, -1, z, c);
  }
}
// línea amarilla de seguridad frente al skid
for (let x = 4; x <= 96; x++) if (x % 6 < 4) vox(x, -1, 52, 'YEL');

// ====== SKID (base rojo con rieles tipo canal, largueros y anclas) ======
const SX0 = 2, SX1 = 98, SZ0 = 4, SZ1 = 44;
fill(SX0, SX1, 0, 5, SZ0, SZ0 + 5, 'RED');        // riel largo frontal
fill(SX0, SX1, 0, 5, SZ1 - 5, SZ1, 'RED');        // riel largo posterior
fill(SX0, SX0 + 5, 0, 5, SZ0, SZ1, 'RED');        // travesaño izq
fill(46, 54, 0, 4, SZ0, SZ1, 'RED');              // travesaño centro
fill(SX1 - 5, SX1, 0, 5, SZ0, SZ1, 'RED');        // travesaño der
// nervaduras de canal (alma de la viga, más oscuro)
for (let x = SX0; x <= SX1; x++) { vox(x, 2, SZ0 + 2, 'RED_D'); vox(x, 2, SZ1 - 2, 'RED_D'); }
// placa de piso del skid (antiderrapante, checker)
for (let x = SX0; x <= SX1; x++)
  for (let z = SZ0; z <= SZ1; z++)
    if ((x + z) % 3 === 0) vox(x, 5, z, 'RED_D'); else vox(x, 5, z, 'RED');
// bancada mecanizada (bedplate) para motor + bomba
fill(12, 90, 6, 7, 14, 34, 'MET_D');
// anclas de fijación al piso (pads + pernos)
[[6, 8], [6, 40], [96, 8], [96, 40], [50, 8], [50, 40]].forEach(p => {
  fill(p[0] - 2, p[0] + 2, -1, -1, p[1] - 2, p[1] + 2, 'BASE');
  vox(p[0], 0, p[1], 'GALV_D'); vox(p[0], 1, p[1], 'GALV');
});

// ====== MOTOR ELÉCTRICO (cilindro horizontal gris, eje X) ======
const MOT_CY = 16, MOT_CZ = 24;
cylX(16, 45, MOT_CY, MOT_CZ, 8, 'MOTOR');
for (let x = 18; x <= 44; x += 2) cylX(x, x, MOT_CY, MOT_CZ, 8.6, 'MOTOR_D'); // aletas de refrigeración
cylX(14, 15, MOT_CY, MOT_CZ, 7.4, 'MOTOR_D');    // tapa lado ventilador
cylX(46, 47, MOT_CY, MOT_CZ, 6.5, 'MOTOR_D');    // brida lado acople
cylX(11, 13, MOT_CY, MOT_CZ, 8.4, 'MET_D');      // cárter del ventilador (cowl)
for (let a = 0; a < 8; a++) {                     // ranuras del cowl
  const ax = 13, ay = MOT_CY + Math.cos(a / 8 * 6.283) * 7, az = MOT_CZ + Math.sin(a / 8 * 6.283) * 7;
  vox(ax, Math.round(ay), Math.round(az), 'BLK');
}
// caja de bornes (terminal box) arriba
fill(24, 34, 23, 28, 19, 29, 'MOTOR_D');
fill(25, 33, 28, 28, 20, 28, 'MOTOR_L');
vox(29, 27, 29, 'COPPER');
// placa de datos
fill(20, 23, 17, 21, 32, 32, 'MET_L');
// patas del motor a la bancada
fill(19, 23, 7, 8, 15, 33, 'MOTOR_D');
fill(39, 43, 7, 8, 15, 33, 'MOTOR_D');

// ====== BOMBA PRINCIPAL (carcasa bipartida horizontal, eje X, gran caudal) ======
const P_CY = 15, P_CZ = 24;
cylX(58, 78, P_CY, P_CZ, 10, 'RED');
cylX(57, 57, P_CY, P_CZ, 10.6, 'RED_D');          // brida trasera
cylX(79, 80, P_CY, P_CZ, 8, 'RED_D');             // tapa delantera / cojinete
// junta de la carcasa bipartida (línea de partición) + pernos
for (let x = 58; x <= 78; x++) { vox(x, P_CY, 13, 'RED_D'); vox(x, P_CY, 35, 'RED_D'); }
for (let x = 60; x <= 76; x += 4) { vox(x, P_CY, 13, 'GALV_D'); vox(x, P_CY, 35, 'GALV_D'); }
// alojamiento de cojinete delantero
cylX(80, 84, P_CY, P_CZ, 5, 'MET_D');
for (let x = 81; x <= 83; x += 1) cylX(x, x, P_CY, P_CZ, 5.4, 'MET');
// BRIDA DE SUCCIÓN (boquilla lateral frontal, hacia -Z)
cylZ(0, 15, 67, 11, 5, 'RED');
cylZ(-1, 0, 67, 11, 6.4, 'MET_D');                 // cara de brida (bridas)
ringXZ(67, 0, 11, 6.4, 4, 'GALV_D');               // (no aplica) -> pernos brida abajo
for (let a = 0; a < 8; a++) {                       // pernos de la brida de succión
  const by = 11 + Math.cos(a / 8 * 6.283) * 5.6, bx = 67 + Math.sin(a / 8 * 6.283) * 5.6;
  vox(Math.round(bx), Math.round(by), 0, 'GALV_D');
}
// BOQUILLA DE DESCARGA (hacia arriba, +Y)
cylY(24, 26, 70, P_CZ, 5, 'RED');
cylY(26, 27, 70, P_CZ, 6.4, 'MET_D');              // brida de descarga

// ====== GUARDA-ACOPLAMIENTO (jaula estática roja entre motor y bomba) ======
for (const gx of [47, 51, 56]) ringYZ(gx, 16, 24, 7, 6, 'RED');   // hoops
for (let a = 0; a < 6; a++) {                                       // barras longitudinales
  const ay = 16 + Math.cos(a / 6 * 6.283) * 6.5, az = 24 + Math.sin(a / 6 * 6.283) * 6.5;
  for (let x = 47; x <= 56; x++) vox(x, Math.round(ay), Math.round(az), 'RED_D');
}
fill(47, 56, 8, 9, 18, 30, 'RED');                                 // faldón inferior de la guarda

// ====== BOMBA JOCKEY (vertical multietapa pequeña, atrás) ======
const J_CX = 88, J_CZ = 12;
fill(J_CX - 5, J_CX + 5, 6, 8, J_CZ - 5, J_CZ + 5, 'MET_D');       // base jockey
cylY(9, 24, J_CX, J_CZ, 4, 'RED');                                 // columna de etapas
for (let y = 11; y <= 23; y += 3) cylY(y, y, J_CX, J_CZ, 4.5, 'RED_D'); // juntas de etapa
cylY(25, 26, J_CX, J_CZ, 4.6, 'MET_D');                            // linterna / acople
cylY(27, 38, J_CX, J_CZ, 4.5, 'MOTOR');                            // motor jockey
for (let y = 29; y <= 37; y += 2) cylY(y, y, J_CX, J_CZ, 4.9, 'MOTOR_D');
cylY(39, 40, J_CX, J_CZ, 3.5, 'MOTOR_D');                          // tapa ventilador jockey
fill(J_CX - 2, J_CX + 2, 40, 42, J_CZ - 2, J_CZ + 2, 'MOTOR_D');
// tubería jockey de descarga hacia el cabezal
cylY(24, 42, J_CX, J_CZ, 2, 'RED');
cylZ(J_CZ, 24, J_CX, 42, 2, 'RED');
cylX(J_CX, 94, 42, 24, 2, 'RED');

// ====== CABEZAL / TUBERÍA DE DESCARGA (roja gruesa con válvulas y manómetros) ======
cylY(27, 42, 70, 24, 4, 'RED');                    // riser de descarga
cylX(68, 96, 42, 24, 4, 'RED');                    // cabezal horizontal
// CHECK VALVE (cerca de la bomba)
cylX(71, 76, 42, 24, 5.2, 'RED_D');
for (let x = 72; x <= 75; x += 1) cylX(x, x, 42, 24, 5.6, 'MET_D');
fill(73, 74, 47, 48, 23, 25, 'BRASS');             // tapa del clapet
// GATE VALVE OS&Y (vástago ascendente + volante)
cylX(82, 87, 42, 24, 5.2, 'RED');
for (let x = 83; x <= 86; x += 1) cylX(x, x, 42, 24, 5.6, 'MET_D');
cylY(47, 56, 84, 24, 1.5, 'MET');                  // bonete + vástago
ringXZ(84, 24, 57, 4.5, 3, 'MET_D');               // volante (aro)
for (let a = 0; a < 4; a++) {                       // rayos del volante
  const dx = Math.round(Math.cos(a / 4 * 6.283) * 3.5), dz = Math.round(Math.sin(a / 4 * 6.283) * 3.5);
  vox(84 + dx, 57, 24 + dz, 'MET_D');
}
vox(84, 57, 24, 'RED_D');                          // cubo del volante
// VÁLVULA DE ALIVIO (tee hacia +Z con cono de descarga)
cylZ(28, 34, 78, 42, 2, 'RED');
cylZ(34, 35, 78, 42, 3, 'MET_D');
fill(76, 80, 40, 46, 35, 36, 'BRASS');             // cuerpo de alivio
vox(78, 47, 35, 'MET_L');                          // resorte/tapa
// MANÓMETROS (carátulas de color): succión (compuesto), descarga (rojo), cabezal (blanco)
gauge(67, 20, -1, 4, 'BFACE');                     // manómetro de succión (azul)
gauge(70, 51, 30, 4, 'RFACE');                     // manómetro de descarga (rojo)
gauge(90, 49, 27, 3, 'GFACE');                     // manómetro del cabezal (blanco)
// SENSOR DE PRESIÓN (presostato con línea sensora a tablero)
fill(64, 67, 44, 49, 24, 26, 'MET_D');
fill(65, 66, 49, 50, 24, 25, 'BRASS');
cylX(20, 64, 45, 24, 1, 'COPPER');                 // línea sensora (cobre) al tablero
// salida final DESCARGA (a red de rociadores) subiendo
cylY(42, 58, 94, 24, 4, 'RED');
cylY(58, 59, 94, 24, 5, 'MET_D');                  // brida superior
ringXZ(94, 24, 59, 5, 3, 'GALV_D');

// ====== TABLERO DE CONTROL CONTRA INCENDIO (gabinete NEMA rojo) ======
const TZ0 = 30, TZ1 = 46;
fill(2, 18, 0, 3, TZ0, TZ1, 'BASE');               // base / patas
fill(2, 18, 3, 44, TZ0, TZ1, 'RED');               // cuerpo
fill(3, 17, 5, 42, TZ1, TZ1, 'RED_D');             // panel de puerta (frente +Z)
fill(3, 3, 5, 42, TZ0 + 1, TZ1, 'RED_D');          // costado
fill(2, 18, 44, 44, TZ0, TZ1, 'MET');              // techo
// ranuras de ventilación laterales
for (let y = 10; y <= 20; y += 2) fill(2, 2, y, y, TZ0 + 2, TZ1 - 2, 'RED_D');
// ventana del display
fill(4, 16, 26, 35, TZ1, TZ1, 'DISP');
fill(3, 17, 25, 36, TZ1 - 1, TZ1 - 1, 'MET_D');    // bisel del display
// biseles de lámparas piloto (POWER / RUN / ALARM)
vox(5, 19, TZ1, 'BLK'); vox(9, 19, TZ1, 'BLK'); vox(13, 19, TZ1, 'BLK');
// amperímetro (manómetro reutilizado, carátula blanca)
gauge(13, 12, TZ1, 3, 'GFACE');
// selector AUTO/MAN/OFF
fill(5, 7, 10, 13, TZ1, TZ1, 'BLK');
vox(6, 12, TZ1 + 1, 'MET_L');
// manija de la puerta
fill(16, 16, 20, 26, TZ1, TZ1, 'BLK');
// rótulo superior
fill(4, 16, 39, 41, TZ1, TZ1, 'RED_L');

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 200, 480);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 170, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -40; sc.near = 5; sc.far = 480;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(50, 20, 24);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(40, 60, -120);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  if (def.t) { mat.transparent = true; mat.opacity = def.t; mat.depthWrite = false; mat.side = THREE.DoubleSide; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = !def.t;
  im.receiveShadow = true;
  if (def.t) im.renderOrder = 2;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
}

// ====== ESTADO ======
const state = { main: false, jky: false, alm: false, rot: false };
const running = () => state.main;

// ====== PARTES DINÁMICAS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}

// -- Displays 7 segmentos (dígitos 3×5)
const SEG_CELLS = {
  a: [[0, 4], [1, 4], [2, 4]], b: [[2, 3]], c: [[2, 1]],
  d: [[0, 0], [1, 0], [2, 0]], e: [[0, 1]], f: [[0, 3]],
  g: [[0, 2], [1, 2], [2, 2]]
};
const CHAR_SEGS = {
  '0': 'abcdef', '1': 'bc', '2': 'abgde', '3': 'abgcd', '4': 'fgbc',
  '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abfgcd',
  ' ': ''
};
function buildDigits(str, mat, ox, oy, oz) {
  const g = new THREE.Group();
  let cx = ox;
  for (const ch of str) {
    for (const s of (CHAR_SEGS[ch] || '')) {
      for (const cell of SEG_CELLS[s]) {
        g.add(dynBox(mat, cx + cell[0] + 0.5, oy + cell[1] + 0.5, oz, 0.92, 0.92, 0.5));
      }
    }
    cx += 4;
  }
  return g;
}

// -- Ventiladores (aspas de cajas con pitch)
const matBlade = new THREE.MeshStandardMaterial({ color: 0x7d8894, roughness: 0.35, metalness: 0.85, envMapIntensity: 0.5 });
const matHub = new THREE.MeshStandardMaterial({ color: 0x1a1e25, roughness: 0.5, metalness: 0.6 });
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 1.3, 1.3, 0.7));
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.55, 0, 0.85, r, 0.4);
    b.rotation.y = 0.55;
    arm.add(b);
    arm.rotation.z = i * Math.PI / 2;
    g.add(arm);
  }
  return g;
}

// -- ACOPLAMIENTO (spider) que GIRA entre motor y bomba
const matCplHub = new THREE.MeshStandardMaterial({ color: 0x2a2f36, roughness: 0.5, metalness: 0.85 });
const matCplLug = new THREE.MeshStandardMaterial({ color: 0xcaa04a, roughness: 0.4, metalness: 0.9 });
function buildCoupling() {
  const g = new THREE.Group();
  g.add(dynBox(matCplHub, -2, 0, 0, 3, 8, 8));
  g.add(dynBox(matCplHub, 2, 0, 0, 3, 8, 8));
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    arm.add(dynBox(matCplLug, 0, 3.2, 0, 5, 2.2, 2.2));
    arm.rotation.x = i * Math.PI / 2;
    g.add(arm);
  }
  return g;
}
const coupling = buildCoupling();
const couplingMount = new THREE.Group();
couplingMount.add(coupling);
couplingMount.position.set(51.5, 16, 24);
scene.add(couplingMount);

// -- Ventilador del motor (gira sobre eje X)
const motorFan = buildFan(6.5);
const motorFanMount = new THREE.Group();
motorFanMount.add(motorFan);
motorFanMount.position.set(12, MOT_CY, MOT_CZ);
motorFanMount.rotation.y = Math.PI / 2;
scene.add(motorFanMount);

// -- Ventilador del jockey (gira sobre eje Y)
const jkyFan = buildFan(3.4);
const jkyFanMount = new THREE.Group();
jkyFanMount.add(jkyFan);
jkyFanMount.position.set(J_CX, 40.5, J_CZ);
jkyFanMount.rotation.x = Math.PI / 2;
scene.add(jkyFanMount);

// -- Display del tablero (presión) + lámparas piloto + luces
const dispMat = emat(0x00ff88, 0x06140c, 1.35);
const runG = buildDigits('000', dispMat, 5, 27, TZ1 + 0.9);
scene.add(runG);

const lampPwrMat = emat(0x00ff66, 0x062a12, 1.6);   // POWER (siempre)
const lampRunMat = emat(0x00ff66, 0x062a12, 0.12);  // RUN (bomba principal)
const lampAlmMat = emat(0xff2233, 0x2a0708, 0.12);  // ALARM
scene.add(dynBox(lampPwrMat, 5.5, 19.5, TZ1 + 0.3, 0.85, 0.85, 0.75));
scene.add(dynBox(lampRunMat, 9.5, 19.5, TZ1 + 0.3, 0.85, 0.85, 0.75));
scene.add(dynBox(lampAlmMat, 13.5, 19.5, TZ1 + 0.3, 0.85, 0.85, 0.75));
const panelLight = new THREE.PointLight(0x00ff66, 1.0, 20, 2);
panelLight.position.set(10, 22, TZ1 + 4);
scene.add(panelLight);

// -- Baliza de ALARMA sobre el tablero (parpadea)
const beaconMat = emat(0xff2233, 0x2a0708, 0.15);
scene.add(dynBox(beaconMat, 10, 46, 38, 3, 2.5, 3));
const beaconLight = new THREE.PointLight(0xff2233, 0.0, 40, 2);
beaconLight.position.set(10, 49, 38);
scene.add(beaconLight);

// -- Partículas de flujo (agua) por tubería, gateadas por estado
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 6));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.7, 0.7, 0.7);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [
  { f: makeFlow([[67, 11, -3], [67, 11, 14], [70, 24, 24], [70, 41, 24]], 0x3aa0ff, 14), gate: () => running() },      // succión -> bomba
  { f: makeFlow([[70, 42, 24], [96, 42, 24], [94, 42, 24], [94, 58, 24]], 0x00d4ff, 16), gate: () => running() },      // cabezal -> descarga
  { f: makeFlow([[88, 24, 12], [88, 42, 12], [94, 42, 24], [94, 56, 24]], 0x2ec96b, 10), gate: () => state.jky }        // jockey -> descarga
];
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  const on = running();
  // giro del acoplamiento + ventilador motor + vibración
  if (on) {
    coupling.rotation.x += dt * 14;
    motorFan.rotation.z += dt * 16;
    const vb = Math.sin(tNow * 60) * 0.18;
    couplingMount.position.y = 16 + vb;
    couplingMount.position.z = 24 + Math.cos(tNow * 55) * 0.18;
  } else {
    couplingMount.position.set(51.5, 16, 24);
  }
  if (state.jky) { jkyFan.rotation.z += dt * 18; jkyFanMount.position.x = J_CX + Math.sin(tNow * 50) * 0.12; }
  else jkyFanMount.position.x = J_CX;
  // display de presión (solo se reconstruye al cambiar el valor)
  const psi = on ? '150' : (state.jky ? '120' : '000');
  if (psi !== lastPsi) {
    scene.remove(runGRef);
    runGRef = buildDigits(psi, dispMat, 5, 27, TZ1 + 0.9);
    scene.add(runGRef);
    lastPsi = psi;
  }
  dispMat.emissiveIntensity = (on || state.jky) ? 1.35 : 0.5;
  // lámparas piloto
  lampRunMat.emissiveIntensity = on ? 1.6 : 0.12;
  const alm = state.alm;
  const blink = 0.3 + 1.5 * Math.abs(Math.sin(tNow * 7));
  lampAlmMat.emissiveIntensity = alm ? blink : 0.12;
  beaconMat.emissiveIntensity = alm ? blink : 0.15;
  beaconLight.intensity = alm ? 0.6 + 1.4 * Math.abs(Math.sin(tNow * 7)) : 0.0;
  panelLight.color.setHex(alm ? 0xff2233 : 0x00ff66);
  panelLight.intensity = alm ? blink : 1.0;
  // flujos
  for (const o of flows) o.f.update(dt, o.gate());
}
let runGRef = runG;
let lastPsi = '000';

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, running: running, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(150, 88, 140);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(50, 22, 20);
  controls.autoRotate = state.rot;   // arranca en OFF
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bMain', 'main'], ['bJky', 'jky'], ['bAlm', 'alm'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? (bs[1] === 'alm' ? 'alarm' : 'on') : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
