critical_features:
  # 3-5, hard max 5. Each judged INDEPENDENTLY. Chosen adversarially (what a lazy model would skip).
  - id: airend-screw-block
    desc: "recognizable lubricated SCREW AIREND: a machined/cast finned block with suction+discharge flanges and an oil sight glass — not a bare smooth cylinder or a generic pump body"
    threshold: 0.78            # FINAL gate (structural onward): flanges + oil sight + rotor profile, achievable with parametric geometry
    blockout_threshold: 0.72   # MASSING gate (voxel 0.1 m): a correctly-proportioned block, clearly differentiated from the motor and in the right position — fine screw identity is validated at structural, not at voxel resolution (per-pass calibration, refine-spec 2026-07-22, user-authorized)
  - id: acoustic-canopy
    desc: "sheet-metal acoustic canopy with real ventilation LOUVER banks + a hinged access door with visible panel gaps — reads as an enclosed compressor cabinet, not a plain painted box"
    threshold: 0.75
  - id: air-train-coherence
    desc: "coherent air path airend -> air/oil SEPARATOR vessel -> AFTERCOOLER -> outlet valve, connected by piping that actually joins the ports in the right order"
    threshold: 0.75
  - id: aftercooler-fan
    desc: "aftercooler/oil-cooler radiator block with a visibly SPINNING axial fan behind a guard grille at the end panel"
    threshold: 0.75
  - id: hmi-control-panel
    desc: "front HMI panel with a readable emissive display and a red mushroom E-STOP button on the canopy face"
    threshold: 0.75

important_features:
  # optional, max 3 — reviewed AVERAGE must be >= 0.65
  - id: electric-motor
    desc: "finned TEFC electric motor with a terminal box, coupled to the airend through a guarded coupling"
  - id: oil-copper-lines
    desc: "copper/rubber oil + air lines routed root->tip between airend, separator and cooler (no floating stubs)"
  - id: neutral-nameplate
    desc: "brand-neutral 'AIRTECH' data plate (CanvasTexture) reads as printed spec text — no real-brand logo"

quality_contract:
  global_min: 0.75
  perf_budget:                     # threejs realistic single-equipment hero, desktop integrated-GPU band (HANDBOOK §3.2)
    draws: 500
    tris: 1500000

camera:
  azimuth_deg: 42                  # diagonal grammar 40-45
  elevation_deg: 24                # 20-28
  fov: 36                          # equipment hero 32-42

lighting: house-rig               # sun key 1.5 + blue fill 0.4 + teal rim 0.2 + ambient 0.25 + RoomEnvironment IBL

ui_controls:
  - "COMPRESOR ON-OFF (arranca/detiene ventilador aftercooler + vibración sutil + LEDs HMI)"
  - "ABRIR CANOPY (puerta de acceso -> revela tren de aire: airend/motor/separador/cooler)"
  - "VER TREN DE AIRE (resalta el path airend->separador->cooler->salida)"
  - "AUTO-ROTATE"
