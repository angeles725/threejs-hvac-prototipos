<title>Compresor de Tornillo · Aire — Blockout Voxel</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #info .pass { color:#ffb454; letter-spacing:0.12em; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; color:#c8d2da; }

  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }

  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>

<body>
<div id="info">
  <b>COMPRESOR DE TORNILLO · AIRE</b><br>
  <span>AIRTECH · <span class="pass">Pase BLOCKOUT</span> · <span id="vcount"></span></span><br>
  <span>Massing voxel · 2.0 × 1.20 × 1.70 m · 1 voxel = 0.1 m</span>
</div>
<div id="legend">
  <div><i style="background:#33506e"></i> Canopy acústico</div>
  <div><i style="background:#6b7683"></i> Airend (tornillo)</div>
  <div><i style="background:#2c2c32"></i> Motor eléctrico</div>
  <div><i style="background:#c0552e"></i> Separador aire/aceite</div>
  <div><i style="background:#c0c4c8"></i> Aftercooler</div>
  <div><i style="background:#b87333"></i> Tuberías / aceite</div>
  <div><i style="background:#1c1d20;box-shadow:0 0 5px #00d4aa"></i> HMI (display)</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>COMPRESOR</label><button id="bRun" class="off">OFF</button></div>
  <div class="row"><label>ABRIR CANOPY</label><button id="bDoor" class="off">OFF</button></div>
  <div class="row"><label>VER TREN DE AIRE</label><button id="bTrain" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== ESCALA ======
// SCALE: 1 voxel = 0.1 m  (1 world unit = 1 m; el modelo voxel se construye en
// coordenadas de voxel enteras y se escala x0.1 -> mundo en metros)
// Canopy: 2.0 m (X, -1.0..1.0) · 1.20 m (Z, -0.6..0.6) · 1.70 m (Y, 0..17 vx)

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 9, 34);

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.05, 200);
// azimuth 42°, elevación 24°, mirando al centro del equipo (y=0.85)
const TARGET = new THREE.Vector3(0, 0.85, 0);
(function placeCam(){
  const r=4.0, az=42*Math.PI/180, el=24*Math.PI/180;
  camera.position.set(
    TARGET.x + r*Math.cos(el)*Math.sin(az),
    TARGET.y + r*Math.sin(el),
    TARGET.z + r*Math.cos(el)*Math.cos(az)
  );
})();

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(TARGET);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 1.8;
controls.maxDistance = 12;

// ====== LIGHT RIG (casa) ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.6, 5.0, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-2.6; sc.right=2.6; sc.top=2.6; sc.bottom=-2.6; sc.near=0.5; sc.far=16;
sun.shadow.bias = -0.0004;
sun.target.position.copy(TARGET);
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-2.4, 2.6, -2.0);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(0, 1.8, -4.0);
scene.add(rim);

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 80, 0x00d4aa, 0x142028);
grid.material.opacity = 0.10;
grid.material.transparent = true;
grid.position.y = 0.001;
scene.add(grid);

// ====== MODELO (escala voxel->metros) ======
const model = new THREE.Group();
model.scale.setScalar(0.1);          // 1 voxel = 0.1 m
scene.add(model);

// ====== VOXEL STORE ======
const store = { data:{}, seen:new Set() };
function addVox(x,y,z,color){
  x=Math.round(x); y=Math.round(y); z=Math.round(z);
  const key = x+','+y+','+z;
  if (store.seen.has(key)) return;   // dedupe -> sin z-fighting
  store.seen.add(key);
  const k = color.toString();
  if (!store.data[k]) store.data[k] = { color, positions:[] };
  store.data[k].positions.push([x,y,z]);
}
// box inclusivo en coords de voxel
function box(x0,x1,y0,y1,z0,z1,color){
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) for (let z=z0;z<=z1;z++) addVox(x,y,z,color);
}
// tubería tipo escalera (Manhattan) por waypoints
function pipe(points, color, r=0){
  for (let i=0;i<points.length-1;i++){
    let [x,y,z]=points[i]; const [tx,ty,tz]=points[i+1];
    const step=(a,b)=>a<b?1:(a>b?-1:0);
    while (x!==tx){ x+=step(x,tx); plug(x,y,z,color,r); }
    while (y!==ty){ y+=step(y,ty); plug(x,y,z,color,r); }
    while (z!==tz){ z+=step(z,tz); plug(x,y,z,color,r); }
  }
}
function plug(x,y,z,color,r){
  for (let dx=-r;dx<=r;dx++) for (let dy=-r;dy<=r;dy++) for (let dz=-r;dz<=r;dz++) addVox(x+dx,y+dy,z+dz,color);
}

const COL = {
  CANOPY:0x33506e,   // azul-gris — gabinete acústico
  TRIM:0x22303f,     // oscuro — skid, marcos, base
  AIREND:0x6b7683,   // gris-acero medio — bloque de tornillo (distinto del cooler blanco)
  MOTOR:0x2c2c32,    // oscuro — motor eléctrico
  SEPARATOR:0xc0552e,// naranja — vaso separador aire/aceite
  COOLER:0xc0c4c8,   // aluminio — radiador aftercooler
  COPPER:0xb87333,   // cobre — líneas de aceite/aire
  STEEL:0x8a949c,    // gris metal — bridas/válvulas/coupling
  GRILLE:0x0d0f12,   // rejilla/recesos oscuros
  HMI:0x1c1d20,      // bezel HMI
  SCREEN:0x0a1a14,   // display emisivo
  ESTOP:0xcc2222,    // paro de emergencia
  PLATE:0xd9d4c0,    // placa de datos (nameplate)
};

// ===================== CANOPY (gabinete) =====================
// Marco X -10..10, Y 0..17, Z -6..6. Frente = +Z (z=6). Aftercooler = -X (x=-10). Motor = +X.
// Skid / base
box(-10,10, 0,1, -6,6, COL.TRIM);
// Pies antivibración en esquinas
[[-10,-6],[-10,6],[10,-6],[10,6]].forEach(([fx,fz])=>{
  const sx=fx<0?fx:fx-1, sz=fz<0?fz:fz-1;
  box(sx,sx+1, 0,0, sz,sz+1, COL.STEEL);
});
// Techo
box(-10,10, 16,17, -6,6, COL.CANOPY);
// Pared trasera (-Z)
box(-10,10, 1,16, -6,-5, COL.CANOPY);
// Postes verticales de esquina (silueta)
box(-10,-9, 1,16, -6,6, COL.CANOPY);   // arista trasera-izq / cara -X frame
box( 9,10, 1,16, -6,6, COL.CANOPY);    // extremo motor (+X)
// -- carve rejilla del ventilador del motor en la pared +X --
box( 9,10, 4,7, -1,2, COL.GRILLE);
// Cara frontal (+Z, z=5..6): marco + panel derecho con louvers + apertura izq (puerta)
box(-10,10, 14,16, 5,6, COL.CANOPY);   // cabezal superior
box(-10,10, 1,3,  5,6, COL.CANOPY);    // zócalo inferior
box(-1,0,  3,14,  5,6, COL.CANOPY);    // montante central
// Banco de louvers (izquierda del panel derecho; el HMI ocupa x 5..8)
box(0,4, 3,14, 5,5, COL.GRILLE);       // receso oscuro de fondo
for (let y=4;y<=13;y+=2) box(0,4, y,y, 6,6, COL.TRIM);   // láminas de louver
// Louvers de admisión también en la cara -Z superior (banco secundario)
for (let x=-8;x<=8;x+=1) for (let y=12;y<=15;y+=2) addVox(x,y,-6,COL.TRIM);

// Rejilla-guarda del aftercooler en la cara -X (x=-10) con patrón de dedos
for (let y=4;y<=13;y++) for (let z=-4;z<=4;z++){
  const d=Math.hypot(y-8.5, z);
  if (d<=4.6 && ((y+z)%2===0)) addVox(-10,y,z,COL.GRILLE);
}

// ===================== TREN DE AIRE (interior — se juzga en cutaway ?train=1) =====================
// --- AIREND: bloque de TORNILLO horizontal, perfil ESCALONADO de 2 lóbulos ---
box(-1,5, 4,6, 0,3, COL.AIREND);                 // lóbulo inferior (rotor macho)
box(-1,4, 6,8, 1,3, COL.AIREND);                 // lóbulo superior escalonado (rotor hembra)
box(0,4,  6,6, 0,0, COL.STEEL);                  // línea de junta entre lóbulos (costado)
// muñones de brida LEGIBLES en los extremos (2-3 voxels, no 1)
box(-3,-1, 4,7, 0,3, COL.STEEL);                 // brida/tobera de SUCCIÓN (extremo -X)
box(5,5,   3,8, -1,4, COL.STEEL);                // brida de DESCARGA / acople (extremo +X, marcada)
box(3,4,   8,9, 1,2, COL.STEEL);                 // puerto de descarga (sube a la tubería)
box(0,1,   5,5, 4,4, COL.STEEL);                 // mirilla de nivel de aceite (costado +Z)

// --- COUPLING GUARD entre airend y motor ---
box(6,6, 4,7, 0,3, COL.GRILLE);                  // ventana de rejilla del guard

// --- MOTOR eléctrico TEFC (oscuro, uniforme), acoplado al airend en +X ---
box(7,9, 4,7, 0,3, COL.MOTOR);                   // carcasa cilíndrica uniforme (contrasta con airend escalonado)
for (let x=7;x<=9;x+=1){                          // aletas de enfriamiento TEFC (crestas)
  addVox(x,8,1,COL.MOTOR); addVox(x,8,2,COL.MOTOR);       // cresta superior
  addVox(x,5,-1,COL.MOTOR); addVox(x,6,-1,COL.MOTOR);     // cresta lateral -Z
  addVox(x,5,4,COL.MOTOR);  addVox(x,6,4,COL.MOTOR);      // cresta lateral +Z
}
box(7,8, 8,9, 1,2, COL.MOTOR);                   // CAJA DE BORNES en el tope
addVox(8,10,1,COL.STEEL);                        // cáncamo de izaje

// --- SEPARADOR aire/aceite: vaso vertical (naranja) atrás-izquierda ---
box(-7,-4, 2,12, -5,-2, COL.SEPARATOR);
box(-7,-4, 12,12, -5,-2, COL.STEEL);             // tapa superior (puerto de entrada/salida)
box(-7,-4, 2,2, -5,-2, COL.STEEL);               // falda inferior

// --- AFTERCOOLER: radiador (aluminio) + FAN axial tras rejilla, extremo -X ---
box(-8,-7, 4,13, -4,4, COL.COOLER);              // slab radiador (dentro de la envolvente)
for (let z=-4;z<=4;z+=2) box(-8,-7, 4,13, z,z, COL.STEEL);  // aletas verticales
// disco de VENTILADOR axial estático en x=-9 (hub + aspas)
for (let y=4;y<=13;y++) for (let z=-4;z<=4;z++){
  const dy=y-8.5, d=Math.hypot(dy,z), a=Math.atan2(z,dy);
  if (d>4.3) continue;
  if (d<=1.3) addVox(-9,y,z,COL.STEEL);                          // hub
  else if (Math.abs(Math.sin(a*3))>0.68) addVox(-9,y,z,COL.STEEL); // aspas radiales
  else addVox(-9,y,z,COL.GRILLE);                                // fondo oscuro
}
// (la rejilla-guarda del extremo -X en x=-10 ya se construyó en la sección del canopy)

// ===================== TUBERÍAS DEL TREN DE AIRE (naranja cobre) =====================
// Cada tubo ARRANCA y TERMINA en el puerto de su parte (con nudo de conexión).
// 1) airend (puerto de descarga) -> separador (tapa/entrada):
//    riser vertical CLARO sobre el puerto (no viga flotante), aterriza en ambos extremos.
box(3,4, 9,10, 1,2, COL.COPPER);                 // codo/nudo GRUESO sobre el puerto de descarga del airend
pipe([[4,10,1],[4,12,1],[-5,12,1],[-5,12,-3]], COL.COPPER);
box(-5,-5, 12,12, -3,-2, COL.COPPER);            // nudo sobre la tapa del separador
// 2) separador (tope) -> aftercooler (entrada superior)
pipe([[-5,12,-3],[-8,12,-3],[-8,12,0]], COL.COPPER);
addVox(-8,12,0, COL.COPPER);
// 3) aftercooler (fondo) -> válvula de salida (baja y sale al frente +Z, BAJO la puerta)
pipe([[-7,4,0],[-7,2,3],[-8,2,6]], COL.COPPER);
addVox(-8,2,6, COL.COPPER);
// retorno de aceite separador -> airend (línea fina)
pipe([[-5,3,-3],[-2,3,0],[1,4,1]], COL.COPPER);
// --- VÁLVULA DE SALIDA anclada a la punta del tubo y unida al canopy ---
box(-9,-7, 1,3, 6,7, COL.STEEL);                 // cuerpo de válvula, sobre la punta del tubo (-8,2,6)
box(-9,-7, 3,3, 5,6, COL.STEEL);                 // ménsula que une la válvula a la cara +Z del canopy
addVox(-8,2,6, COL.STEEL);                        // brida de acople tubo<->válvula
addVox(-8,3,8, COL.STEEL);                        // volante

// ===================== HMI + NAMEPLATE (cara frontal +Z, panel sellado) =====================
box(6,7, 10,11, 6,6, COL.SCREEN);                // display CHICO 2x2 (primero: gana dedupe en z=6)
box(7,7, 9,9,   6,7, COL.ESTOP);                 // e-stop chico (1 voxel, sobresale)
box(5,8, 8,12,  5,6, COL.HMI);                   // bisel SÓLIDO (cara del panel: solo display + e-stop, sin crema)
// placa de datos AIRTECH: bloque LEGIBLE en la cara +Z, justo bajo el HMI
box(5,8, 4,6,   6,6, COL.PLATE);                 // nameplate 4x3, junto al HMI
box(5,8, 3,14,  5,6, COL.CANOPY);                // respaldo de canopy que SELLA el panel derecho

// ===================== BUILD INSTANCED (uno por color) =====================
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const MATP = {
  [COL.CANOPY]:   { rough:0.52, metal:0.0 },
  [COL.TRIM]:     { rough:0.60, metal:0.0 },
  [COL.AIREND]:   { rough:0.42, metal:0.9 },
  [COL.MOTOR]:    { rough:0.55, metal:0.0 },
  [COL.SEPARATOR]:{ rough:0.55, metal:0.0 },
  [COL.COOLER]:   { rough:0.35, metal:0.9 },
  [COL.COPPER]:   { rough:0.32, metal:0.9 },
  [COL.STEEL]:    { rough:0.35, metal:0.9 },
  [COL.GRILLE]:   { rough:0.85, metal:0.0 },
  [COL.HMI]:      { rough:0.42, metal:0.0 },
  [COL.SCREEN]:   { rough:0.25, metal:0.0, emissive:0x0affc0, ei:0.9 },
  [COL.ESTOP]:    { rough:0.50, metal:0.0, emissive:0xcc2222, ei:0.25 },
  [COL.PLATE]:    { rough:0.40, metal:0.2 },
};
// meshes de canopy que se OCULTAN en "VER TREN DE AIRE" (cutaway limpio, sin translucidez)
const CANOPY_COLORS = new Set([COL.CANOPY, COL.TRIM, COL.GRILLE, COL.HMI, COL.SCREEN, COL.ESTOP, COL.PLATE]);
// componentes del tren que se resaltan (emisivo suave)
const TRAIN_COLORS  = new Set([COL.AIREND, COL.SEPARATOR, COL.COOLER, COL.COPPER, COL.STEEL]);

const matByColor = {};
const meshByColor = {};
let totalVox = 0;
const m4 = new THREE.Matrix4();
for (const k in store.data){
  const { color, positions } = store.data[k];
  totalVox += positions.length;
  const p = MATP[color] || {};
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:p.rough ?? 0.5, metalness:p.metal ?? 0.0,
    emissive:p.emissive ?? 0x000000, emissiveIntensity:p.ei ?? 0,
  });
  matByColor[color] = mat;
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = true; mesh.receiveShadow = true;
  positions.forEach((pos,i)=>{ m4.setPosition(pos[0]+0.5,pos[1]+0.5,pos[2]+0.5); mesh.setMatrixAt(i,m4); });
  mesh.instanceMatrix.needsUpdate = true;
  meshByColor[color] = mesh;
  model.add(mesh);
}
document.getElementById('vcount').textContent = totalVox.toLocaleString('es-MX')+' voxeles';

// ===================== PARTES ANIMADAS (Groups separados) =====================
// -- Ventilador aftercooler (giro continuo sobre X) --
const coolerFan = new THREE.Group();
coolerFan.position.set(-9.4, 8.5, 0);   // eje X, entre rejilla (-10) y radiador (-8)
const cfMat = new THREE.MeshStandardMaterial({ color:0x3a3f44, metalness:0.9, roughness:0.4 });
(function(){
  const hub = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.4,1.4), cfMat);
  coolerFan.add(hub);
  for (let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const blade=new THREE.Mesh(new THREE.BoxGeometry(0.35,3.0,1.1), cfMat);
    blade.position.set(0, Math.cos(a)*1.8, Math.sin(a)*1.8);
    blade.rotation.x=a+0.5;   // ligero paso
    blade.castShadow=true;
    coolerFan.add(blade);
  }
})();
model.add(coolerFan);

// -- Ventilador del motor (giro sobre X), tras la rejilla +X --
const motorFan = new THREE.Group();
motorFan.position.set(9.4, 5.5, 0.5);
const mfMat = new THREE.MeshStandardMaterial({ color:0x26262b, metalness:0.6, roughness:0.45 });
(function(){
  const hub=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.0,1.0), mfMat);
  motorFan.add(hub);
  for (let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    const blade=new THREE.Mesh(new THREE.BoxGeometry(0.3,2.2,0.7), mfMat);
    blade.position.set(0, Math.cos(a)*1.4, Math.sin(a)*1.4);
    blade.rotation.x=a;
    motorFan.add(blade);
  }
})();
model.add(motorFan);

// -- Rotores del airend (spin visible con canopy abierto) --
const rotors = new THREE.Group();
rotors.position.set(2.5, 5.5, 1.5);
const rotMat = new THREE.MeshStandardMaterial({ color:0x9aa8b0, metalness:0.95, roughness:0.35 });
(function(){
  const male=new THREE.Mesh(new THREE.BoxGeometry(5.0,1.1,1.1), rotMat);
  male.position.set(0,0.7,0);
  const female=new THREE.Mesh(new THREE.BoxGeometry(5.0,0.9,0.9), rotMat);
  female.position.set(0,-0.6,0.2);
  rotors.add(male); rotors.add(female);
})();
rotors.visible = false;   // solo cuando la puerta abre / cutaway
model.add(rotors);

// -- Puerta de acceso: SELLA por completo la apertura frontal-izquierda (x -9..0,
//    y 3..14). Bisagra en la arista del poste izquierdo. Cerrada -> no se ve interior;
//    ?door=1 la abre y ?train=1 la oculta (cutaway). --
const doorPivot = new THREE.Group();
doorPivot.position.set(-9, 8.5, 6);        // eje de bisagra (arista izq del poste)
const doorMat = new THREE.MeshStandardMaterial({ color:0x33506e, metalness:0.0, roughness:0.52 });
(function(){
  const panel=new THREE.Mesh(new THREE.BoxGeometry(9,11,0.6), doorMat);
  panel.position.set(4.5,0,0.0);           // cubre x -9..0, cara ~z 6
  panel.castShadow=true; panel.receiveShadow=true;
  doorPivot.add(panel);
  // ranuras de louver poco profundas (lectura de panel de servicio)
  const grooveMat=new THREE.MeshStandardMaterial({ color:0x1a2635, metalness:0.0, roughness:0.7 });
  for (let gy=-3; gy<=3; gy+=2){
    const g=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.5,0.2), grooveMat);
    g.position.set(4.5,gy,0.32); doorPivot.add(g);
  }
  // manija en el borde libre (lado +X)
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.8,0.5),
    new THREE.MeshStandardMaterial({ color:0x8a949c, metalness:0.9, roughness:0.35 }));
  handle.position.set(8.2,0,0.5);
  doorPivot.add(handle);
})();
model.add(doorPivot);

// -- Silueta humana de referencia 1.8 m (tenue, opcional) --
(function(){
  const hMat=new THREE.MeshStandardMaterial({ color:0x00d4aa, transparent:true, opacity:0.14, roughness:1, metalness:0 });
  const person=new THREE.Group();
  person.position.set(15, 0, 3);      // a un lado, sobre el piso
  const torso=new THREE.Mesh(new THREE.BoxGeometry(3.2,9,1.8), hMat); torso.position.y=11.5;
  const legs =new THREE.Mesh(new THREE.BoxGeometry(3.0,7,1.6), hMat); legs.position.y=3.5;
  const head =new THREE.Mesh(new THREE.BoxGeometry(2.0,2.2,2.0), hMat); head.position.y=17;
  person.add(torso); person.add(legs); person.add(head);
  model.add(person);
})();

// ===================== ESTADO / UI =====================
const state = { run:false, door:false, train:false };
let rpm = 0;          // 0..1 con inercia
let doorAng = 0;      // 0..1 (0 = cerrada, 1 = 105°)

function applyRun(){
  const on=state.run;
  const s=matByColor[COL.SCREEN];   s.emissiveIntensity = on?1.6:0.9;
  const e=matByColor[COL.ESTOP];    e.emissiveIntensity = on?0.55:0.25;
}
function applyTrain(){
  // OCULTA el canopy (visible=false) para un cutaway limpio y captura rápida a DPR alto
  const showCanopy = !state.train;
  CANOPY_COLORS.forEach(c=>{ if(meshByColor[c]) meshByColor[c].visible=showCanopy; });
  doorPivot.visible = showCanopy;
  const boost=state.train?0.35:0.0;
  TRAIN_COLORS.forEach(c=>{
    const m=matByColor[c]; if(!m) return;
    m.emissive.setHex(c); m.emissiveIntensity=boost;
  });
}
applyRun(); applyTrain();

function bind(id,key,after){
  const btn=document.getElementById(id);
  btn.onclick=()=>{ state[key]=!state[key]; btn.className=state[key]?'on':'off'; btn.textContent=state[key]?'ON':'OFF'; after&&after(); };
}
bind('bRun','run',applyRun);
bind('bDoor','door',()=>{ rotors.visible = state.door || state.train; });
bind('bTrain','train',()=>{ applyTrain(); rotors.visible = state.door || state.train; });
const bRot=document.getElementById('bRot');
bRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; bRot.className=controls.autoRotate?'on':'off'; bRot.textContent=controls.autoRotate?'ON':'OFF'; };

// ===================== INIT POR QUERY PARAM (captura determinista) =====================
// ?door=1 / ?train=1 / ?run=1 (combinables). Bajo cualquier query param la
// animación SALTA al estado final (puerta 100% abierta, opacidades y fans en pose)
// para que la captura de un frame no salga a medias; la interacción humana sigue animada.
(function initFromQuery(){
  const q = new URLSearchParams(location.search);
  const on1 = v => v==='1' || v==='true';
  const hasAny = [...q.keys()].length > 0;
  if (!hasAny) return;

  // Sincroniza un toggle: estado + UI del botón, sin animar
  function setToggle(id, key, val){
    if (val === undefined) return;
    state[key] = val;
    const btn = document.getElementById(id);
    btn.className = val ? 'on' : 'off';
    btn.textContent = val ? 'ON' : 'OFF';
  }
  const dRun   = q.has('run')   ? on1(q.get('run'))   : undefined;
  const dDoor  = q.has('door')  ? on1(q.get('door'))  : undefined;
  const dTrain = q.has('train') ? on1(q.get('train')) : undefined;
  setToggle('bRun','run',dRun);
  setToggle('bDoor','door',dDoor);
  setToggle('bTrain','train',dTrain);

  // Materiales/emisivos a su valor final
  applyRun(); applyTrain();
  rotors.visible = state.door || state.train;

  // SALTO INSTANTÁNEO al estado final (sin transición con inercia)
  rpm     = state.run  ? 1 : 0;          // fans en régimen (o parados)
  doorAng = state.door ? 1 : 0;          // puerta 100% abierta (o cerrada)
  doorPivot.rotation.y = -doorAng*(105*Math.PI/180);

  // Vista del spec: sin auto-rotate bajo query param (respeta az42/el24), salvo ?spin=1
  const wantSpin = q.has('spin') ? on1(q.get('spin')) : false;
  controls.autoRotate = wantSpin;
  bRot.className = wantSpin ? 'on' : 'off';
  bRot.textContent = wantSpin ? 'ON' : 'OFF';

  // ?view=cooler: encuadra la cara -X (disco de fan + guarda del aftercooler),
  // SNAP determinista. Combinable con ?train=1 (cutaway sin canopy).
  const view = q.get('view');
  if (view === 'cooler'){
    const tgt = new THREE.Vector3(-0.7, 0.85, 0);   // hacia el extremo -X (cooler)
    const r=4.2, az=225*Math.PI/180, el=20*Math.PI/180;
    controls.target.copy(tgt);
    camera.position.set(
      tgt.x + r*Math.cos(el)*Math.sin(az),
      tgt.y + r*Math.sin(el),
      tgt.z + r*Math.cos(el)*Math.cos(az)
    );
    camera.lookAt(tgt);
    controls.update();
  }
})();

// ===================== RESIZE / ANIMATE =====================
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // rpm con inercia (arranque rápido, coast-down lento)
  const target=state.run?1:0, k=state.run?1.6:0.6;
  rpm += (target-rpm)*Math.min(1,dt*k);
  if (Math.abs(rpm-target)<0.0015) rpm=target;
  const spin=rpm*14;
  coolerFan.rotation.x -= dt*spin;
  motorFan.rotation.x  -= dt*spin;
  rotors.rotation.x    += dt*spin*1.4;

  // puerta hacia objetivo
  const dTarget=state.door?1:0;
  doorAng += (dTarget-doorAng)*Math.min(1,dt*4);
  doorPivot.rotation.y = -doorAng*(105*Math.PI/180);

  // vibración sutil del gabinete cuando corre
  const amp=state.run?(0.004+0.012*rpm):0;
  model.position.set(Math.sin(t*47)*amp, Math.abs(Math.sin(t*58))*amp*0.5, Math.sin(t*53+1.6)*amp*0.8);

  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
