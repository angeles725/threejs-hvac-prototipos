<script type="module" id="app">
// ============================================================================
// CENTRAL DE REFRIGERACIÓN — Rack de 4 compresores · Voxel Art 3D (SCADA dark)
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Rack real: ~3.0 m largo × 1.0 m ancho × 2.0 m alto
//   Ejes voxel: X = largo (0..~124) · Y = alto (0..~46) · Z = ancho/prof (0..~46)
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas (compresores que
// vibran, LEDs, displays, flujo de refrigerante) en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  FLOOR:   { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D: { c:0x1c2028, r:0.90, m:0.05 },
  PAD:     { c:0x3a3f47, r:0.95, m:0.02 },
  PAD_D:   { c:0x30343b, r:0.95, m:0.02 },
  YEL:     { c:0xffc400, r:0.75, m:0.00 },
  SKID:    { c:0x2b2f36, r:0.60, m:0.72 },
  SKID_D:  { c:0x20242a, r:0.65, m:0.65 },
  DECK:    { c:0x3a4047, r:0.55, m:0.75 },
  DECK_D:  { c:0x30363c, r:0.58, m:0.72 },
  MET:     { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:   { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:   { c:0xbcc4cc, r:0.30, m:0.90 },
  ALU:     { c:0xc8ced4, r:0.35, m:0.90 },
  COPPER:  { c:0xc4793c, r:0.35, m:1.00 },
  COPPER_D:{ c:0x9c5f2e, r:0.42, m:1.00 },
  SUCT:    { c:0x2f7fc4, r:0.45, m:0.50, e:0x1f5f9a, ei:0.12 },
  SUCT_L:  { c:0x4a97d8, r:0.40, m:0.50 },
  DISCH:   { c:0xdd5a2c, r:0.45, m:0.50, e:0x7a2f14, ei:0.14 },
  DISCH_L: { c:0xf07138, r:0.40, m:0.50 },
  LIQ:     { c:0xbe3b2c, r:0.50, m:0.42, e:0x5a1c14, ei:0.10 },
  LIQ_L:   { c:0xd85443, r:0.45, m:0.42 },
  OIL:     { c:0xcf8a2e, r:0.50, m:0.50, e:0x6b4715, ei:0.14 },
  OIL_L:   { c:0xe6a544, r:0.45, m:0.50 },
  CHAR:    { c:0x262b33, r:0.60, m:0.60 },
  CHAR_D:  { c:0x1a1e25, r:0.70, m:0.50 },
  BLK:     { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:     { c:0xe8edf2, r:0.60, m:0.10 },
  WHTP:    { c:0xcfd6dd, r:0.55, m:0.30 },
  GRN_B:   { c:0x0f8a4f, r:0.50, m:0.10, e:0x0f8a4f, ei:0.35 },
  RED_B:   { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.35 },
  TEAL:    { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  GRAYK:   { c:0x555e69, r:0.50, m:0.60 },
  DISP:    { c:0x04060a, r:0.95, m:0.00 },
  PANEL:   { c:0x33383f, r:0.50, m:0.60 },
  PANEL_D: { c:0x282c32, r:0.55, m:0.55 },
  GAUGE:   { c:0xe8edf2, r:0.50, m:0.10 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// ---- TUBERÍA VOXELIZADA (sección circular hecha de cubos) ----
function pipeX(x0, x1, yc, zc, r, c) {
  const rr = (r + 0.4) * (r + 0.4);
  for (let x = x0; x <= x1; x++)
    for (let y = Math.floor(yc - r); y <= Math.ceil(yc + r); y++)
      for (let z = Math.floor(zc - r); z <= Math.ceil(zc + r); z++) {
        const dy = y + 0.5 - yc, dz = z + 0.5 - zc;
        if (dy * dy + dz * dz <= rr) vox(x, y, z, c);
      }
}
function pipeY(y0, y1, xc, zc, r, c) {
  const rr = (r + 0.4) * (r + 0.4);
  for (let y = y0; y <= y1; y++)
    for (let x = Math.floor(xc - r); x <= Math.ceil(xc + r); x++)
      for (let z = Math.floor(zc - r); z <= Math.ceil(zc + r); z++) {
        const dx = x + 0.5 - xc, dz = z + 0.5 - zc;
        if (dx * dx + dz * dz <= rr) vox(x, y, z, c);
      }
}
function pipeZ(z0, z1, xc, yc, r, c) {
  const rr = (r + 0.4) * (r + 0.4);
  for (let z = z0; z <= z1; z++)
    for (let x = Math.floor(xc - r); x <= Math.ceil(xc + r); x++)
      for (let y = Math.floor(yc - r); y <= Math.ceil(yc + r); y++) {
        const dx = x + 0.5 - xc, dy = y + 0.5 - yc;
        if (dx * dx + dy * dy <= rr) vox(x, y, z, c);
      }
}
// disco / anillo plano (cara +Z) para manómetros
function diskZ(xc, yc, z, r, c) {
  const rr = (r + 0.4) * (r + 0.4);
  for (let x = Math.floor(xc - r); x <= Math.ceil(xc + r); x++)
    for (let y = Math.floor(yc - r); y <= Math.ceil(yc + r); y++) {
      const dx = x + 0.5 - xc, dy = y + 0.5 - yc;
      if (dx * dx + dy * dy <= rr) vox(x, y, z, c);
    }
}
function ringZ(xc, yc, z, r0, r1, c) {
  const a = (r0 - 0.4) * (r0 - 0.4), b = (r1 + 0.4) * (r1 + 0.4);
  for (let x = Math.floor(xc - r1); x <= Math.ceil(xc + r1); x++)
    for (let y = Math.floor(yc - r1); y <= Math.ceil(yc + r1); y++) {
      const dx = x + 0.5 - xc, dy = y + 0.5 - yc, d = dx * dx + dy * dy;
      if (d >= a && d <= b) vox(x, y, z, c);
    }
}

// ====== PISO (y = -1) con dithering, junta y línea de seguridad ======
for (let x = -8; x <= 132; x++) {
  for (let z = -6; z <= 46; z++) {
    let c = (hash2(x, z) % 100 < 18) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 80) % 24 === 0 || (z + 60) % 24 === 0) c = 'FLOOR_D';
    vox(x, -1, z, c);
  }
}

// ====== BANCADA / PAD DE CONCRETO (bajo el skid) ======
for (let x = -2; x <= 126; x++) {
  for (let z = 2; z <= 40; z++) {
    const c = (hash2(x + 7, z + 3) % 100 < 22) ? 'PAD_D' : 'PAD';
    vox(x, 0, z, c);
    vox(x, 1, z, c);
  }
}
// franja amarilla de seguridad en el borde del pad
for (let x = -2; x <= 126; x++) { if (x % 6 < 4) { vox(x, 1, 2, 'YEL'); vox(x, 1, 40, 'YEL'); } }
for (let z = 2; z <= 40; z++) { if (z % 6 < 4) { vox(-2, 1, z, 'YEL'); vox(126, 1, z, 'YEL'); } }

// ====== SKID / BASTIDOR DE ACERO ======
const SX0 = 4, SX1 = 104, SZF = 6, SZB = 34;      // largo y bordes de profundidad
// rieles longitudinales (canal C) frente y fondo
fill(SX0, SX1, 2, 5, SZF - 1, SZF + 3, 'SKID');
fill(SX0, SX1, 2, 5, SZB - 3, SZB + 1, 'SKID');
// travesaños
for (const cx of [SX0, 28, 52, 76, 100, SX1]) fill(cx, cx + 2, 2, 5, SZF + 3, SZB - 3, 'SKID_D');
// placa de piso (deck) con textura antiderrapante
for (let x = SX0; x <= SX1; x++)
  for (let z = SZF; z <= SZB; z++)
    vox(x, 6, z, (hash2(x, z) % 100 < 22) ? 'DECK_D' : 'DECK');
// patas de nivelación en esquinas
for (const cx of [SX0, SX1]) for (const cz of [SZF, SZB]) fill(cx, cx + 1, 0, 2, cz - 1, cz + 1, 'SKID_D');
// franja de marca teal en el riel frontal
for (let x = SX0 + 4; x <= SX1 - 4; x++) { if (x % 8 < 5) vox(x, 3, SZF - 1, 'TEAL'); }

// ====== COLECTORES / MANIFOLDS (estáticos) ======
const CX = [20, 44, 68, 92];   // centros de compresores en X
// SUCCIÓN (baja) — tubo grande azul al frente, a media altura
pipeX(6, 122, 15, 32, 3, 'SUCT');
for (let x = 8; x <= 120; x += 2) vox(x, 18, 32, 'SUCT_L');   // brillo superior
// DESCARGA (alta) — cabezal naranja arriba-atrás
pipeX(6, 108, 31, 12, 2, 'DISCH');
for (let x = 8; x <= 106; x += 2) vox(x, 33, 12, 'DISCH_L');
// ramales por compresor
for (const cx of CX) {
  // rama de succión: del compresor (frente) al colector de succión
  pipeZ(28, 33, cx + 5, 16, 1.6, 'SUCT');
  // rama de descarga: de la cabeza del compresor hasta el cabezal (codo)
  pipeY(23, 31, cx - 4, 22, 1.4, 'DISCH');
  pipeZ(12, 22, cx - 4, 31, 1.4, 'DISCH');
}

// ====== SEPARADOR DE ACEITE (tanque vertical ámbar) ======
pipeY(7, 40, 108, 14, 5, 'OIL');
pipeY(40, 42, 108, 14, 4, 'OIL_L');                 // domo superior
fill(103, 113, 6, 7, 9, 19, 'MET_D');               // base
// visor de aceite (banda + mirilla)
for (let a = 0; a < 8; a++) { const g = a / 8 * Math.PI * 2; vox(Math.round(108 + Math.cos(g) * 5), 20, Math.round(14 + Math.sin(g) * 5), 'MET_L'); }
fill(112, 113, 18, 22, 14, 14, 'OIL_L');            // mirilla lateral
// entrada de descarga por arriba (desde cabezal)
pipeZ(12, 14, 108, 31, 1.4, 'DISCH');
pipeY(31, 40, 108, 13, 1.4, 'DISCH');

// ====== RECIBIDOR DE LÍQUIDO (tanque horizontal rojo) ======
pipeX(100, 124, 14, 28, 6, 'LIQ');
pipeX(98, 100, 14, 28, 5, 'LIQ_L');                 // cabeza izq
pipeX(124, 126, 14, 28, 5, 'LIQ_L');                // cabeza der
for (let x = 100; x <= 124; x += 2) vox(x, 19, 28, 'LIQ_L');   // brillo superior
// sillas / saddles
for (const sx of [104, 120]) fill(sx, sx + 2, 6, 9, 24, 32, 'MET_D');
// visor de nivel del recibidor
fill(101, 101, 10, 18, 28, 28, 'GAUGE');

// ====== LÍNEA DE LÍQUIDO (roja fina) con filtro deshidratador + visor ======
pipeX(24, 102, 9, 34, 2, 'LIQ');
pipeY(9, 14, 102, 34, 2, 'LIQ');                    // sube al recibidor
// filtro deshidratador (canister) inline
fill(62, 74, 6, 12, 31, 37, 'MET');
fill(60, 62, 8, 10, 33, 35, 'COPPER');
fill(74, 76, 8, 10, 33, 35, 'COPPER');
fill(66, 70, 12, 13, 34, 34, 'WHT');                // etiqueta
// visor de líquido (sight glass)
fill(52, 54, 8, 10, 33, 35, 'COPPER_D');
vox(53, 9, 36, 'GRN_B');                            // ventana (verde=seco)

// ====== LÍNEA DE ACEITE (ámbar/cobre fina) — retorno a cárteres ======
pipeY(7, 10, 108, 16, 1, 'OIL');
pipeX(18, 108, 6, 16, 1, 'OIL');
for (const cx of CX) pipeY(6, 12, cx + 4, 16, 1, 'COPPER');   // subida a cada cárter

// ====== VÁLVULAS DE SERVICIO ======
function valve(cx, cy, cz, band) {
  fill(cx - 1, cx + 1, cy - 1, cy + 1, cz - 1, cz + 1, 'GRAYK');   // cuerpo
  fill(cx - 2, cx + 2, cy + 2, cy + 3, cz - 2, cz + 2, 'MET_D');   // volante cuadrado
  carve(cx - 1, cx + 1, cy + 2, cy + 3, cz - 1, cz + 1);
  vox(cx, cy + 1, cz + 2, band);                                  // banda de color
}
valve(9, 15, 32, 'SUCT_L');     // succión extremo izq
valve(121, 15, 32, 'SUCT_L');   // succión extremo der
valve(9, 31, 12, 'DISCH_L');    // descarga extremo izq
valve(102, 12, 34, 'LIQ_L');    // salida de líquido del recibidor
for (const cx of CX) valve(cx + 5, 16, 34, 'SUCT_L');   // válvula rotolock de succión por compresor

// ====== MANÓMETROS (alta / baja) sobre un poste ======
fill(97, 98, 6, 30, 36, 37, 'SKID_D');      // poste
// manómetro de ALTA (roja)
ringZ(97, 27, 38, 1.5, 2.6, 'BLK');
diskZ(97, 27, 38, 1.8, 'GAUGE');
vox(97, 28, 39, 'RED_B'); vox(97, 27, 39, 'RED_B');   // aguja
fill(95, 99, 23, 23, 38, 38, 'RED_B');                // etiqueta HP
// manómetro de BAJA (azul)
ringZ(97, 20, 38, 1.5, 2.6, 'BLK');
diskZ(97, 20, 38, 1.8, 'GAUGE');
vox(97, 21, 39, 'SUCT_L'); vox(96, 20, 39, 'SUCT_L'); // aguja
fill(95, 99, 16, 16, 38, 38, 'SUCT');                 // etiqueta LP

// ====== TABLERO DE CONTROL (gabinete estático) ======
const PX0 = 100, PX1 = 118, PY0 = 6, PY1 = 40, PZ0 = 40, PZ1 = 45;
fill(PX0, PX1, PY0, PY1, PZ0, PZ1, 'PANEL');
fill(PX0, PX1, PY0, PY1, PZ1 + 1, PZ1 + 1, 'PANEL_D');    // cara frontal
fill(PX0, PX0, PY0, PY1, PZ0, PZ1 + 1, 'PANEL_D');        // bordes
fill(PX1, PX1, PY0, PY1, PZ0, PZ1 + 1, 'PANEL_D');
fill(PX0, PX1, PY1, PY1, PZ0, PZ1 + 1, 'MET');           // techo
// patas del gabinete
for (const cx of [PX0 + 1, PX1 - 1]) fill(cx, cx, 0, PY0, PZ0 + 1, PZ0 + 3, 'SKID_D');
// franja de marca
fill(PX0 + 1, PX1 - 1, 37, 38, PZ1 + 1, PZ1 + 1, 'TEAL');
// ventana de display (recuadro negro)
fill(103, 115, 26, 34, PZ1 + 1, PZ1 + 1, 'DISP');
// pads de LEDs de estado (uno por compresor) + pad de falla
for (let i = 0; i < 4; i++) fill(102 + i * 4, 103 + i * 4, 29, 31, PZ1 + 1, PZ1 + 1, 'BLK');
fill(115, 116, 29, 31, PZ1 + 1, PZ1 + 1, 'BLK');
// botones arranque/paro + selector HOA
fill(103, 105, 20, 22, PZ1 + 1, PZ1 + 1, 'GRN_B');
fill(108, 110, 20, 22, PZ1 + 1, PZ1 + 1, 'RED_B');
fill(113, 115, 20, 22, PZ1 + 1, PZ1 + 1, 'GRAYK');
vox(114, 22, PZ1 + 1, 'WHT');
// louvers de ventilación laterales
for (const y of [12, 15, 18]) fill(PX0, PX1, y, y, PZ1 + 1, PZ1 + 1, 'PANEL_D');

// ====== ETIQUETAS / PLACAS DE SEGURIDAD ======
function safetyLabel(x0, y0, z) {
  fill(x0, x0 + 3, y0, y0 + 5, z, z, 'YEL');
  fill(x0, x0 + 3, y0 + 5, y0 + 5, z, z, 'BLK');
  vox(x0 + 2, y0 + 4, z, 'BLK'); vox(x0 + 1, y0 + 3, z, 'BLK');
  vox(x0 + 2, y0 + 2, z, 'BLK'); vox(x0 + 1, y0 + 1, z, 'BLK');
}
safetyLabel(6, 8, SZF - 1);
safetyLabel(108, 30, 20);

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 240, 560);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(120, 180, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -130; sc.right = 170; sc.top = 150; sc.bottom = -30; sc.near = 5; sc.far = 600;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(60, 20, 18);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 100);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(50, 60, -120);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
}

// ====== ESTADO ======
const state = { c1: true, c2: true, c3: true, c4: false, falla: false, rot: false };
function running(n) { return state['c' + n] && !(state.falla && n === 2); }
function anyRunning() { return [1, 2, 3, 4].some(running); }

// ====== HELPERS DINÁMICOS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}
function partBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ---- Displays 7 segmentos (dígitos 3×5) ----
const SEG_CELLS = {
  a: [[0, 4], [1, 4], [2, 4]], b: [[2, 3]], c: [[2, 1]],
  d: [[0, 0], [1, 0], [2, 0]], e: [[0, 1]], f: [[0, 3]],
  g: [[0, 2], [1, 2], [2, 2]]
};
const CHAR_SEGS = {
  '0': 'abcdef', '1': 'bc', '2': 'abgde', '3': 'abgcd', '4': 'fgbc',
  '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abfgcd',
  'A': 'abcefg', 'L': 'def', 'F': 'aefg', ' ': ''
};
function buildDigits(str, mat, ox, oy, oz) {
  const g = new THREE.Group();
  let cx = ox;
  for (const ch of str) {
    for (const s of (CHAR_SEGS[ch] || '')) {
      for (const cell of SEG_CELLS[s]) {
        g.add(dynBox(mat, cx + cell[0] + 0.5, oy + cell[1] + 0.5, oz, 0.92, 0.92, 0.5));
      }
    }
    cx += 4;
  }
  return g;
}

// ---- Materiales compartidos de compresores ----
const cBody  = new THREE.MeshStandardMaterial({ color: 0x23272d, roughness: 0.55, metalness: 0.55, envMapIntensity: 0.5 });
const cBodyD = new THREE.MeshStandardMaterial({ color: 0x15181d, roughness: 0.62, metalness: 0.50 });
const cHead  = new THREE.MeshStandardMaterial({ color: 0xc2c8cd, roughness: 0.32, metalness: 0.92, envMapIntensity: 0.6 });
const cMotor = new THREE.MeshStandardMaterial({ color: 0x2b3037, roughness: 0.50, metalness: 0.62 });
const cTerm  = new THREE.MeshStandardMaterial({ color: 0x6b747e, roughness: 0.45, metalness: 0.85 });
const cPlate = new THREE.MeshStandardMaterial({ color: 0xd8dee4, roughness: 0.50, metalness: 0.25 });
const cStubS = new THREE.MeshStandardMaterial({ color: 0x3487cc, roughness: 0.42, metalness: 0.50 });
const cStubD = new THREE.MeshStandardMaterial({ color: 0xe0602f, roughness: 0.42, metalness: 0.50 });

// ---- Construcción de un compresor (Group que vibra al operar) ----
function buildCompressor(cx) {
  const g = new THREE.Group();
  g.position.set(cx, 7, 20);
  const add = (m, x, y, z, sx, sy, sz) => g.add(partBox(m, x, y, z, sx, sy, sz));
  // aisladores / pies de goma
  for (const dx of [-6, 6]) for (const dz of [-7, 7]) add(cStubD, dx, 0, dz, 2, 1, 2);
  add(cBodyD, 0, 1.5, 0, 15, 2, 17);     // brida base
  add(cBody, 0, 4, -1, 13, 4, 13);       // panza del cárter
  add(cBody, 0, 9, -1, 12, 11, 13);      // cuerpo / cárter
  add(cBodyD, 0, 9, 7, 11, 10, 3);       // tapa frontal atornillada
  // anillo de tornillos en la tapa frontal
  for (let a = 0; a < 8; a++) { const ang = a / 8 * Math.PI * 2; add(cPlate, Math.cos(ang) * 4.2, 9 + Math.sin(ang) * 4.2, 8.6, 1, 1, 0.6); }
  add(cMotor, 0, 9, -8, 10, 10, 6);      // barril del motor (trasero)
  for (const fz of [-6.5, -8, -9.5]) add(cBodyD, 0, 9, fz, 11, 11, 0.6);   // aletas de enfriamiento
  add(cHead, 0, 15, 0, 12, 3, 12);       // placa de válvulas (cabezal aluminio)
  add(cHead, -3, 17, 0, 4, 3, 10);       // cabeza 1
  add(cHead, 3, 17, 0, 4, 3, 10);        // cabeza 2
  for (const hx of [-3, 3]) for (const hz of [-4, 4]) add(cPlate, hx, 18.6, hz, 1, 0.8, 1);  // pernos de cabeza
  add(cTerm, 0, 10, 9, 6, 6, 3);         // caja de bornes
  add(cBodyD, 0, 10, 10.7, 5, 5, 1);     // tapa de bornes
  add(cPlate, 0, 12, 8.2, 4, 2, 0.5);    // placa de datos
  add(cStubS, 5, 15, 8, 2.5, 2.5, 4);    // stub de succión (azul, frente)
  add(cStubD, -4, 17, 2, 2.5, 4, 2.5);   // stub de descarga (naranja, arriba)
  scene.add(g);
  return g;
}

// ---- Rigs por compresor: cuerpo vibrante + baliza + PointLight ----
const comps = [];
CX.forEach((cx, i) => {
  const g = buildCompressor(cx);
  const beaconMat = emat(0x00ff66, 0x063016, 1.5);
  const beacon = partBox(beaconMat, cx, 26, 20, 2.4, 2.4, 2.4);
  beacon.castShadow = false;
  scene.add(beacon);
  const light = new THREE.PointLight(0x00ff66, 1.2, 22, 2);
  light.position.set(cx, 31, 26);
  scene.add(light);
  comps.push({ g: g, base: g.position.clone(), beaconMat: beaconMat, beacon: beacon, light: light, seed: i * 1.7 });
});

// ---- LEDs de estado + display del tablero ----
CX.forEach((cx, i) => {
  const m = emat(0x00ff66, 0x063016, 1.5);
  const led = partBox(m, 102.5 + i * 4, 30, 46.5, 1.5, 1.5, 0.8);
  led.castShadow = false;
  scene.add(led);
  comps[i].ledMat = m;
});
const faultLedMat = emat(0xff2233, 0x2a0708, 0.15);
const faultLed = partBox(faultLedMat, 115.5, 30, 46.5, 1.6, 1.6, 0.8);
faultLed.castShadow = false;
scene.add(faultLed);
// display de presión de descarga (verde)
const dispMat = emat(0x00ff88, 0x06140c, 1.35);
scene.add(buildDigits('185', dispMat, 105, 28, 46.6));
// luz suave del tablero
const panelLight = new THREE.PointLight(0x00ff88, 0.6, 20, 2);
panelLight.position.set(109, 30, 50);
scene.add(panelLight);

// ---- Partículas de flujo de refrigerante ----
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 7));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.68, 0.68, 0.68);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [];
// succión (azul) recorriendo el colector — activa si algún compresor opera
flows.push({ f: makeFlow([[10, 15, 32], [122, 15, 32]], 0x3aa0ff, 12), gate: () => anyRunning() });
// descarga (naranja) por compresor: cabeza -> codo -> cabezal
for (const cx of CX) {
  const n = CX.indexOf(cx) + 1;
  flows.push({ f: makeFlow([[cx - 4, 23, 22], [cx - 4, 31, 22], [cx - 4, 31, 12]], 0xff7a30, 14), gate: () => running(n) });
}
// cabezal de descarga -> separador de aceite
flows.push({ f: makeFlow([[8, 31, 12], [108, 31, 12], [108, 39, 14]], 0xff7a30, 14), gate: () => anyRunning() });
// línea de líquido (roja) desde el recibidor
flows.push({ f: makeFlow([[102, 9, 34], [26, 9, 34]], 0xff5540, 10), gate: () => anyRunning() });
// retorno de aceite (ámbar)
flows.push({ f: makeFlow([[108, 6, 16], [18, 6, 16]], 0xffb300, 8), gate: () => anyRunning() });
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  for (let i = 0; i < 4; i++) {
    const n = i + 1, on = running(n), fault = state.falla && n === 2;
    const c = comps[i];
    // vibración sutil del compresor
    if (on) {
      const s = c.seed;
      c.g.position.set(
        c.base.x + Math.sin(tNow * 47 + s) * 0.12,
        c.base.y + Math.sin(tNow * 61 + s) * 0.10,
        c.base.z + Math.cos(tNow * 53 + s) * 0.10
      );
    } else {
      c.g.position.copy(c.base);
    }
    // baliza + luz
    if (fault) {
      const bl = 0.3 + 1.6 * Math.abs(Math.sin(tNow * 8));
      c.beaconMat.color.setHex(0xff2233); c.beaconMat.emissive.setHex(0xff2233); c.beaconMat.emissiveIntensity = bl;
      c.light.color.setHex(0xff2233); c.light.intensity = 0.4 + 1.4 * Math.abs(Math.sin(tNow * 8));
    } else {
      c.beaconMat.color.setHex(on ? 0x00ff66 : 0x0b0d11);
      c.beaconMat.emissive.setHex(0x00ff66);
      c.beaconMat.emissiveIntensity = on ? 1.5 : 0.05;
      c.light.color.setHex(0x00ff66);
      c.light.intensity = on ? 1.2 : 0.0;
    }
    // LED del tablero
    if (c.ledMat) {
      if (fault) {
        c.ledMat.color.setHex(0xff2233); c.ledMat.emissive.setHex(0xff2233);
        c.ledMat.emissiveIntensity = 0.3 + 1.5 * Math.abs(Math.sin(tNow * 8));
      } else {
        c.ledMat.emissive.setHex(on ? 0x00ff66 : 0x111417);
        c.ledMat.emissiveIntensity = on ? 1.5 : 0.08;
      }
    }
  }
  faultLedMat.color.setHex(state.falla ? 0xff2233 : 0x2a0708);
  faultLedMat.emissiveIntensity = state.falla ? 0.3 + 1.5 * Math.abs(Math.sin(tNow * 8)) : 0.12;
  dispMat.emissiveIntensity = 1.1 + 0.25 * Math.abs(Math.sin(tNow * 2));
  for (const o of flows) o.f.update(dt, o.gate());
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, running: running, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(190, 110, 175);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(60, 22, 18);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bC1', 'c1'], ['bC2', 'c2'], ['bC3', 'c3'], ['bC4', 'c4'], ['bF', 'falla'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? (bs[1] === 'falla' ? 'alarm' : 'on') : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
