<!DOCTYPE html>
<html lang="es">
<head>

<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); z-index:5; }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }

  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); z-index:5; color:#aebfd2; }

  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }

  #panel button.off { color:#ff4455; border-color:#ff4455; }

</style>
<script>
// Inyección dinámica de importmap (evita el mangling de package@version por Cloudflare)
(function(){
  if (typeof document === 'undefined') return;
  var AT = String.fromCharCode(64);
  var base = 'https://unpkg.com/three' + AT + '0.160.0/';
  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': base + 'build/three.module.js',
    'three/addons/': base + 'examples/jsm/'
  }});
  document.head.appendChild(im);
})();
</script>
</head>
<body>
<div id="info">
  <b>EVAPORADOR · UNIT COOLER</b><br>
  <span>Voxel Art 3D · Cámara fría · 1 voxel = 0.025 m</span>
</div>
<div id="legend">
  <div><i style="background:#8fdfff"></i> AIRE FRÍO (IMPULSIÓN)</div>
  <div><i style="background:#3aa0ff"></i> SUCCIÓN</div>

</div>
<div id="coord">DRAG: Rotar · WHEEL: Zoom · CLIC: Capturar voxel<br><span id="coordVal">VOX  —</span></div>

  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>VENTILADORES</label><button id="bFan" class="on">ON</button></div>
  <div class="row"><label>DESHIELO</label><button id="bDef" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="module" id="app">
// ============================================================================
// EVAPORADOR — Unit Cooler montado al techo dentro de una cámara fría · Voxel Art 3D
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Unidad:  ~1.40 m largo × 0.55 m fondo × 0.70 m alto = 56 × 22 × 22 vox
//   Cámara:  paneles aislantes blancos (piso, muro trasero, muro lateral, techo)
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  // cámara fría — paneles aislantes claros
  WALL:   { c:0xdfe4e8, r:0.92, m:0.00 },
  WALL_D: { c:0xcbd2d7, r:0.92, m:0.00 },
  WALL_L: { c:0xeef2f5, r:0.90, m:0.00 },
  WALL_J: { c:0xb2bbc2, r:0.92, m:0.00 },
  FLOOR:  { c:0xc4cace, r:0.88, m:0.03 },
  FLOOR_D:{ c:0xb0b7bc, r:0.88, m:0.03 },
  CEIL:   { c:0xe6eaee, r:0.90, m:0.00 },
  CEIL_D: { c:0xd0d6da, r:0.90, m:0.00 },
  // carcasa higiénica blanca/gris
  WHT:    { c:0xeef2f5, r:0.55, m:0.10 },
  WHT_D:  { c:0xd6dde2, r:0.58, m:0.12 },
  WHT_L:  { c:0xffffff, r:0.50, m:0.10 },
  MET:    { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:  { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:  { c:0xbcc4cc, r:0.30, m:0.90 },
  GALV:   { c:0xb7c0c7, r:0.30, m:0.95 },
  GALV_D: { c:0x87919a, r:0.40, m:0.90 },
  // serpentín aletado
  TEAL:   { c:0x00c9b1, r:0.48, m:0.25, e:0x00c9b1, ei:0.14 },
  TEAL_D: { c:0x0b8779, r:0.55, m:0.30 },
  FIN:    { c:0x9fb0b8, r:0.42, m:0.75 },
  FROST:  { c:0xf3f9fc, r:0.72, m:0.00, e:0xdff2ff, ei:0.10 },
  // ventiladores / oscuros
  DARK:   { c:0x2a2f36, r:0.55, m:0.55 },
  BLK:    { c:0x0b0d11, r:0.70, m:0.30 },
  // refrigerante
  COPPER: { c:0xc4793c, r:0.35, m:1.00 },
  INSUL:  { c:0x515b68, r:0.85, m:0.05 },
  BRASS:  { c:0xcaa24a, r:0.35, m:0.95 },
  YEL:    { c:0xffc400, r:0.75, m:0.00 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// ====== CÁMARA FRÍA (paneles aislantes) ======
const RX0 = -12, RX1 = 72, RZ0 = -2, RZ1 = 28, RYT = 46;
// piso (2 capas)
for (let x = RX0; x <= RX1; x++) {
  for (let z = RZ0 - 2; z <= RZ1; z++) {
    let c = (hash2(x, z) % 100 < 14) ? 'FLOOR_D' : 'FLOOR';
    if ((x - RX0) % 20 === 0 || (z - RZ0) % 20 === 0) c = 'FLOOR_D';
    vox(x, 0, z, c); vox(x, -1, z, 'FLOOR_D');
  }
}
// muro trasero (z=RZ0)
for (let x = RX0; x <= RX1; x++) {
  for (let y = 0; y <= RYT; y++) {
    let c = (hash2(x, y) % 100 < 12) ? 'WALL_D' : (hash2(x, y) % 100 >= 90 ? 'WALL_L' : 'WALL');
    if (x % 16 === 0 || y % 16 === 0) c = 'WALL_J';
    vox(x, y, RZ0, c);
  }
}
// muro lateral izquierdo (x=RX0)
for (let z = RZ0; z <= RZ1; z++) {
  for (let y = 0; y <= RYT; y++) {
    let c = (hash2(z, y + 5) % 100 < 12) ? 'WALL_D' : 'WALL';
    if (z % 16 === 0 || y % 16 === 0) c = 'WALL_J';
    vox(RX0, y, z, c);
  }
}
// techo (2 capas)
for (let x = RX0; x <= RX1; x++) {
  for (let z = RZ0; z <= RZ1; z++) {
    let c = (hash2(x, z + 7) % 100 < 12) ? 'CEIL_D' : 'CEIL';
    if (x % 16 === 0 || z % 16 === 0) c = 'CEIL_D';
    vox(x, RYT, z, c); vox(x, RYT + 1, z, 'CEIL_D');
  }
}

// ====== UNIT COOLER (carcasa) ======
const UX0 = 2, UX1 = 58, UY0 = 18, UY1 = 40, UZ0 = 3, UZ1 = 20;
const CZf = UZ1;                                  // cara frontal del serpentín
// carcasa higiénica: techo, fondo, extremos
fill(UX0, UX1, UY1 - 1, UY1, UZ0, UZ1, 'WHT');    // tapa superior
fill(UX0, UX1, UY0, UY1, UZ0, UZ0 + 1, 'WHT');    // fondo trasero
fill(UX0, UX0 + 1, UY0, UY1, UZ0, UZ1, 'WHT');    // extremo izq
fill(UX1 - 1, UX1, UY0, UY1, UZ0, UZ1, 'WHT');    // extremo der
fill(UX0, UX1, UY0, UY0, UZ0, CZf, 'WHT_D');      // riel inferior
// juntas suaves en la tapa
for (let x = UX0 + 6; x < UX1; x += 12) fill(x, x, UY1, UY1, UZ0, UZ1, 'WHT_D');
// esquinas superiores (canto redondeado sugerido)
fill(UX0, UX1, UY1, UY1, UZ0, UZ0, 'WHT_D');
fill(UX0, UX1, UY1, UY1, UZ1, UZ1, 'WHT_D');

// ---- SERPENTÍN ALETADO FRONTAL (celosía teal + escarcha blanca) ----
const CLX0 = UX0 + 2, CLX1 = UX1 - 2, CLY0 = UY0 + 1, CLY1 = UY1 - 2;
for (let x = CLX0; x <= CLX1; x++) {
  for (let y = CLY0; y <= CLY1; y++) {
    if (x % 2 === 0) {                             // aleta
      let c = 'TEAL';
      const fh = hash2(x, y) % 100;
      const frostBias = 16 + (CLY1 - y) * 4;       // más escarcha abajo
      if (fh < frostBias) c = 'FROST';
      vox(x, y, CZf, c);
      vox(x, y, CZf - 1, 'TEAL_D');
    } else {
      vox(x, y, CZf - 1, 'DARK');                  // ranura recesada entre aletas
    }
  }
}
// serpentín (tubos horizontales) + curvas de retorno en cobre
const TUBE_YS = [CLY0 + 1, CLY0 + 5, CLY0 + 9, CLY0 + 13, CLY0 + 17];
for (const ty of TUBE_YS) for (let x = CLX0; x <= CLX1; x++) vox(x, ty, CZf, 'TEAL_D');
for (let i = 0; i < TUBE_YS.length - 1; i++) {
  const endX = (i % 2 === 0) ? CLX1 + 1 : CLX0 - 1;
  for (let y = TUBE_YS[i]; y <= TUBE_YS[i + 1]; y++) vox(endX, y, CZf - 1, 'COPPER');
}

// ---- COFRES DE VENTILADOR (celosías estáticas sobre el serpentín) ----
const FAN_C = [[14, 29], [30, 29], [46, 29]];
const FAN_R = 7;
function fanCowl(cx, cy, r) {
  for (let x = Math.floor(cx - r) - 1; x <= Math.ceil(cx + r) + 1; x++) {
    for (let y = Math.floor(cy - r) - 1; y <= Math.ceil(cy + r) + 1; y++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d <= r + 0.7 && d >= r - 0.7) { vox(x, y, CZf + 1, 'DARK'); vox(x, y, CZf + 2, 'BLK'); }
    }
  }
}
FAN_C.forEach(fc => fanCowl(fc[0], fc[1], FAN_R));

// ---- CHAROLA DE CONDENSADOS ----
const TRY = UY0 - 2;                               // piso de la charola
fill(UX0, UX1, TRY, TRY, UZ0, CZf + 2, 'MET_L');   // piso
fill(UX0, UX1, TRY, TRY + 1, CZf + 2, CZf + 2, 'MET_D');   // labio frontal
fill(UX0, UX1, TRY, TRY + 1, UZ0, UZ0, 'MET_D');          // labio trasero
fill(UX0, UX0, TRY, TRY + 1, UZ0, CZf + 2, 'MET_D');      // tope izq
fill(UX1, UX1, TRY, TRY + 1, UZ0, CZf + 2, 'MET_D');      // tope der
// drenaje de la charola hacia el piso
fill(29, 30, 1, TRY - 1, 13, 14, 'GALV');
fill(29, 34, 1, 1, 13, 14, 'GALV');
fill(32, 36, 0, 0, 12, 15, 'GALV_D');

// ---- SOPORTES DE TECHO (varillas roscadas) ----
const RODS = [[UX0 + 4, UZ0 + 4], [UX1 - 4, UZ0 + 4], [UX0 + 4, CZf - 4], [UX1 - 4, CZf - 4]];
for (const [rx, rz] of RODS) {
  fill(rx, rx, UY1 + 1, RYT - 1, rz, rz, 'GALV');
  vox(rx, RYT - 1, rz, 'GALV_D');
  vox(rx, UY1 + 1, rz, 'GALV_D');
}

// ---- LÍNEAS DE REFRIGERANTE + VÁLVULA DE EXPANSIÓN (extremo izq) ----
// succión (aislada, gruesa) del cabezal del serpentín hacia el techo
fill(-5, UX0 + 1, UY1 - 6, UY1 - 5, UZ0, UZ0 + 1, 'INSUL');
fill(-6, -5, UY1 - 6, RYT - 1, UZ0, UZ0 + 1, 'INSUL');
for (let y = UY1 - 4; y <= RYT - 3; y += 8) fill(-6, -5, y, y, UZ0, UZ0 + 1, 'TEAL');   // bandas ID teal
// línea de líquido (cobre, delgada) del techo a la válvula
fill(-8, -8, UY0 + 3, RYT - 1, UZ0 + 3, UZ0 + 3, 'COPPER');
fill(-8, UX0 - 1, UY0 + 3, UY0 + 3, UZ0 + 3, UZ0 + 3, 'COPPER');
// válvula de expansión termostática (bloque de latón + bulbo)
fill(UX0 - 4, UX0 - 1, UY0 + 2, UY0 + 6, UZ0 + 2, UZ0 + 5, 'BRASS');
vox(UX0 - 2, UY0 + 7, UZ0 + 3, 'MET_L');           // ajuste
fill(UX0 - 1, UX0, UY1 - 6, UY1 - 5, UZ0, UZ0 + 1, 'BRASS');  // bulbo sobre succión

// ---- CAJA DE CONTROL (extremo der) ----
fill(UX1 + 1, UX1 + 3, UY0 + 4, UY0 + 13, UZ0 + 2, UZ0 + 9, 'MET_D');
fill(UX1 + 3, UX1 + 3, UY0 + 5, UY0 + 12, UZ0 + 3, UZ0 + 8, 'MET');   // tapa
vox(UX1 + 3, UY0 + 6, UZ0 + 4, 'BLK');             // bisel piloto (mesh piloto va encima)

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 220, 520);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 170, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -130; sc.right = 130; sc.top = 140; sc.bottom = -40; sc.near = 5; sc.far = 520;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(30, 26, 10);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(40, 60, -120);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  if (def.t) { mat.transparent = true; mat.opacity = def.t; mat.depthWrite = false; mat.side = THREE.DoubleSide; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = !def.t;
  im.receiveShadow = true;
  if (def.t) im.renderOrder = 2;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
}

// ====== ESTADO ======
const state = { fans: true, defrost: false, rot: false };
const fansRunning = () => state.fans && !state.defrost;   // el deshielo detiene los ventiladores
const defrostOn = () => state.defrost;

// ====== PARTES DINÁMICAS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}

// -- Ventiladores axiales (aspas con pitch)
const matBlade = new THREE.MeshStandardMaterial({ color: 0x3a4048, roughness: 0.4, metalness: 0.7, envMapIntensity: 0.5 });
const matHub = new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.5, metalness: 0.6 });
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 1.5, 1.5, 0.8));
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.55, 0, 0.9, r, 0.4);
    b.rotation.y = 0.55;
    arm.add(b);
    arm.rotation.z = i * Math.PI / 2;
    g.add(arm);
  }
  return g;
}
const fans = [];
for (const fc of FAN_C) {
  const fan = buildFan(FAN_R - 1);
  const mount = new THREE.Group();
  mount.add(fan);
  mount.position.set(fc[0] + 0.5, fc[1] + 0.5, CZf + 2.4);
  scene.add(mount);
  fans.push(fan);
}

// -- Resistencias de deshielo (líneas naranjas emisivas)
const heaterMats = [];
function buildHeaterLine(y, z, x0, x1) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x2a1206, emissive: 0xff5a00, emissiveIntensity: 0.05, roughness: 0.5, metalness: 0.3 });
  heaterMats.push(mat);
  const len = x1 - x0;
  scene.add(dynBox(mat, (x0 + x1) / 2 + 0.5, y + 0.5, z + 0.5, len, 0.7, 0.7));
  return mat;
}
buildHeaterLine(TRY + 1, UZ0 + 2, UX0 + 3, UX1 - 3);   // resistencia charola trasera
buildHeaterLine(TRY + 1, CZf, UX0 + 3, UX1 - 3);        // resistencia charola frontal
buildHeaterLine(CLY0 - 1, CZf - 1, UX0 + 3, UX1 - 3);   // resistencia base del serpentín

// -- Piloto de la caja de control
const pilotMat = emat(0x00ff66, 0x062a12, 1.6);
scene.add(dynBox(pilotMat, UX1 + 3.5, UY0 + 10.5, UZ0 + 5.5, 0.9, 0.9, 0.9));
const pilotLight = new THREE.PointLight(0x00ff66, 1.6, 18, 2);
pilotLight.position.set(UX1 + 6, UY0 + 10, UZ0 + 6);
scene.add(pilotLight);
// -- Luz de deshielo (glow naranja bajo el serpentín)
const defrostLight = new THREE.PointLight(0xff6a00, 0.0, 40, 2);
defrostLight.position.set(30, TRY + 1, CZf + 4);
scene.add(defrostLight);

// -- Partículas de flujo (gateadas por estado)
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 6));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.72, 0.72, 0.72);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [];
// aire frío (impulsión) — un chorro por ventilador, cae hacia el piso
for (const fc of FAN_C) {
  flows.push({ f: makeFlow([[fc[0] + 0.5, fc[1] + 0.5, CZf + 4], [fc[0] + 0.5, fc[1] - 3, CZf + 13], [fc[0] + 0.5, fc[1] - 8, CZf + 22]], 0x8fdfff, 24), gate: fansRunning });
}
// succión (del cabezal al techo)
flows.push({ f: makeFlow([[UX0, UY1 - 5, UZ0 + 0.5], [-5, UY1 - 5, UZ0 + 0.5], [-5, RYT - 1, UZ0 + 0.5]], 0x3aa0ff, 9), gate: fansRunning });
// líquido (del techo a la válvula de expansión)
flows.push({ f: makeFlow([[-8, RYT - 1, UZ0 + 3.5], [-8, UY0 + 3, UZ0 + 3.5], [UX0 - 1, UY0 + 3, UZ0 + 3.5]], 0xc4793c, 8), gate: fansRunning });
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  const run = fansRunning(), def = defrostOn();
  for (const f of fans) { if (run) f.rotation.z += dt * 11; }
  // resistencias de deshielo
  const gi = def ? (0.7 + 0.9 * Math.abs(Math.sin(tNow * 3.0))) : 0.05;
  for (const m of heaterMats) m.emissiveIntensity = gi;
  defrostLight.intensity = def ? (0.6 + 0.8 * Math.abs(Math.sin(tNow * 3.0))) : 0.0;
  // piloto de estado
  if (def) {
    pilotMat.emissive.setHex(0xff7a00); pilotMat.emissiveIntensity = 1.6;
    pilotLight.color.setHex(0xff7a00); pilotLight.intensity = 1.4;
  } else if (run) {
    pilotMat.emissive.setHex(0x00ff66); pilotMat.emissiveIntensity = 1.6;
    pilotLight.color.setHex(0x00ff66); pilotLight.intensity = 1.6;
  } else {
    pilotMat.emissiveIntensity = 0.12; pilotLight.intensity = 0.15;
  }
  for (const o of flows) o.f.update(dt, o.gate());
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, fansRunning: fansRunning, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(120, 74, 122);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(30, 26, 10);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bFan', 'fans'], ['bDef', 'defrost'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? (bs[1] === 'defrost' ? 'warn' : 'on') : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
