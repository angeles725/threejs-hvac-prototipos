<script type="module" id="app">
// ============================================================================
// BOMBA DE CALOR aire-agua reversible (exterior) — Voxel Art 3D (SCADA dark)
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Envolvente:  1.30 m (X) × 0.60 m (Z) × 1.40 m (Y) = 52 × 24 × 56 vox
//   Serpentín aletado en caras (izq/der/fondo) · ventiladores axiales arriba
//   Compresor scroll + válvula 4 vías + recibidor + intercambiador de placas
//   en corte (frente seccionado) · tablero eléctrico lateral · patas.
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  GROUND: { c:0x1c2028, r:0.92, m:0.05 },
  GROUND_D:{ c:0x161a21, r:0.92, m:0.05 },
  LEG:    { c:0x2b313c, r:0.65, m:0.55 },
  BASEP:  { c:0x14171d, r:0.85, m:0.20 },
  CAB:    { c:0xc2c8ce, r:0.55, m:0.20 },
  CAB_D:  { c:0xa8afb6, r:0.58, m:0.20 },
  CAB_L:  { c:0xd8dde2, r:0.50, m:0.25 },
  EDGE:   { c:0x8a9198, r:0.45, m:0.70 },
  ALU:    { c:0xd0d6db, r:0.30, m:0.92 },
  ALU_D:  { c:0xaab2ba, r:0.38, m:0.88 },
  FIN:    { c:0xbcc4cc, r:0.34, m:0.90 },
  GRILLE: { c:0x23282f, r:0.55, m:0.55 },
  GRILLE_L:{ c:0x323842, r:0.55, m:0.55 },
  STEEL:  { c:0x9aa3ac, r:0.38, m:0.85 },
  STEEL_D:{ c:0x6f7883, r:0.45, m:0.85 },
  STEEL_L:{ c:0xbcc4cc, r:0.30, m:0.90 },
  COMP:   { c:0x3a4048, r:0.55, m:0.75 },
  COMP_L: { c:0x565d67, r:0.48, m:0.78 },
  COPPER: { c:0xc4793c, r:0.35, m:1.00 },
  COPPER_D:{ c:0x9c5f2e, r:0.42, m:0.95 },
  PANEL:  { c:0x2b3038, r:0.55, m:0.55 },
  PANEL_D:{ c:0x1f242b, r:0.60, m:0.50 },
  DISP:   { c:0x04060a, r:0.95, m:0.00 },
  TEAL:   { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  YEL:    { c:0xffc400, r:0.75, m:0.00 },
  BLK:    { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:    { c:0xe8edf2, r:0.60, m:0.10 },
  GRN_B:  { c:0x0f8a4f, r:0.50, m:0.10, e:0x0f8a4f, ei:0.30 },
  RED_B:  { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.30 },
  BLUEB:  { c:0x3aa0ff, r:0.50, m:0.20, e:0x3aa0ff, ei:0.45 },
  REDB:   { c:0xff3b30, r:0.50, m:0.20, e:0xff3b30, ei:0.45 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }
// cilindros aproximados a cubos (todo sigue siendo voxel)
function cylY(cx, cz, y0, y1, r, c) {
  for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
    for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++)
      if (Math.hypot(x + 0.5 - cx, z + 0.5 - cz) <= r + 0.0001)
        for (let y = y0; y <= y1; y++) vox(x, y, z, c);
}
function cylZ(cx, cy, z0, z1, r, c) {
  for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= r + 0.0001)
        for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function cylX(x0, x1, cy, cz, r, c) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++)
      if (Math.hypot(y + 0.5 - cy, z + 0.5 - cz) <= r + 0.0001)
        for (let x = x0; x <= x1; x++) vox(x, y, z, c);
}

// ====== DIMENSIONES ENVOLVENTE ======
const X0 = 2, X1 = 49;     // 48 vox ancho  (1.20 m entre montantes)
const Z0 = 2, Z1 = 21;     // 20 vox fondo
const YB = 4;              // fondo del cuerpo (sobre patas)
const YCT = 44;            // cima del serpentín / techo del cuerpo

// ====== SUELO (y = -1) ======
for (let x = -14; x <= 63; x++)
  for (let z = -14; z <= 35; z++) {
    let c = (hash2(x, z) % 100 < 20) ? 'GROUND_D' : 'GROUND';
    if ((x + 40) % 16 === 0 || (z + 40) % 16 === 0) c = 'GROUND_D';
    vox(x, -1, z, c);
  }

// ====== PATAS (4 postes) ======
const LEGS = [[X0, Z0], [X1 - 3, Z0], [X0, Z1 - 3], [X1 - 3, Z1 - 3]];
for (const [lx, lz] of LEGS) {
  fill(lx, lx + 3, 0, 3, lz, lz + 3, 'LEG');
  fill(lx, lx + 3, 0, 0, lz, lz + 3, 'BASEP');   // zapata
}
// travesaños del bastidor
fill(X0, X1, 2, 3, Z0, Z0 + 1, 'LEG');
fill(X0, X1, 2, 3, Z1 - 1, Z1, 'LEG');

// ====== BASE / CHAROLA ======
fill(X0, X1, YB, YB + 1, Z0, Z1, 'BASEP');
fill(X0, X1, YB + 1, YB + 1, Z0, Z1, 'STEEL_D');

// ====== MONTANTES DEL GABINETE (4 esquinas) ======
fill(X0, X0 + 1, YB, YCT, Z0, Z0 + 1, 'EDGE');
fill(X1 - 1, X1, YB, YCT, Z0, Z0 + 1, 'EDGE');
fill(X0, X0 + 1, YB, YCT, Z1 - 1, Z1, 'EDGE');
fill(X1 - 1, X1, YB, YCT, Z1 - 1, Z1, 'EDGE');
// rieles superiores
fill(X0, X1, YCT - 1, YCT, Z0, Z0 + 1, 'EDGE');
fill(X0, X1, YCT - 1, YCT, Z1 - 1, Z1, 'EDGE');
fill(X0, X0 + 1, YCT - 1, YCT, Z0, Z1, 'EDGE');
fill(X1 - 1, X1, YCT - 1, YCT, Z0, Z1, 'EDGE');

// ====== SERPENTÍN ALETADO (caras izq / der / fondo) ======
const COY0 = 12, COY1 = YCT - 2;   // rango vertical del serpentín
// aleta vertical + tubo header; 2 capas de aletas que protruyen
function finSlatLeft() {
  for (let z = Z0 + 2; z <= Z1 - 3; z++)
    for (let y = COY0; y <= COY1; y++) {
      vox(X0, y, z, 'ALU_D');                              // cara del serpentín
      vox(X0 - 1, y, z, (z % 2 ? 'ALU' : 'ALU_D'));        // aleta protruye
      if (z % 3 === 0) vox(X0 - 2, y, z, 'FIN');           // punta de aleta
    }
  // tubos de cobre (headers + retornos en U)
  for (let y = COY0; y <= COY1; y += 6) fill(X0 - 1, X0, y, y, Z0 + 2, Z1 - 3, 'COPPER');
  fill(X0 - 1, X0, COY0, COY1, Z0 + 2, Z0 + 2, 'COPPER_D');
  fill(X0 - 1, X0, COY0, COY1, Z1 - 3, Z1 - 3, 'COPPER_D');
}
function finSlatRight() {
  for (let z = Z0 + 2; z <= Z1 - 3; z++)
    for (let y = COY0; y <= COY1; y++) {
      vox(X1, y, z, 'ALU_D');
      vox(X1 + 1, y, z, (z % 2 ? 'ALU' : 'ALU_D'));
      if (z % 3 === 0) vox(X1 + 2, y, z, 'FIN');
    }
  for (let y = COY0; y <= COY1; y += 6) fill(X1, X1 + 1, y, y, Z0 + 2, Z1 - 3, 'COPPER');
  fill(X1, X1 + 1, COY0, COY1, Z0 + 2, Z0 + 2, 'COPPER_D');
  fill(X1, X1 + 1, COY0, COY1, Z1 - 3, Z1 - 3, 'COPPER_D');
}
function finSlatBack() {
  for (let x = X0 + 2; x <= X1 - 2; x++)
    for (let y = COY0; y <= COY1; y++) {
      vox(x, y, Z0, 'ALU_D');
      vox(x, y, Z0 - 1, (x % 2 ? 'ALU' : 'ALU_D'));
      if (x % 3 === 0) vox(x, y, Z0 - 2, 'FIN');
    }
  for (let y = COY0; y <= COY1; y += 6) fill(X0 + 2, X1 - 2, y, y, Z0 - 1, Z0, 'COPPER');
}
finSlatLeft(); finSlatRight(); finSlatBack();

// ====== FRENTE: marco + panel derecho (tablero) + apertura de corte a la izq ======
// marco perimetral del frente (z = Z1)
fill(X0, X1, YB + 2, YB + 3, Z1, Z1, 'EDGE');       // travesaño inferior
fill(X0, X1, YCT - 3, YCT - 2, Z1, Z1, 'EDGE');     // travesaño superior
fill(X0, X0 + 1, YB + 2, YCT - 2, Z1, Z1, 'EDGE');  // montante izq
fill(X1 - 1, X1, YB + 2, YCT - 2, Z1, Z1, 'EDGE');  // montante der
// panel de acceso izquierdo — omitido (CORTE): dejamos ver el interior
fill(X0 + 2, 22, YCT - 4, YCT - 4, Z1, Z1, 'EDGE'); // borde de corte

// ====== COMPRESOR SCROLL (base, en corte) ======
const CPX = 11, CPZ = 12;
cylY(CPX, CPZ, YB + 2, 22, 6, 'COMP');              // carcasa
cylY(CPX, CPZ, 22, 24, 5, 'COMP_L');               // campana / cima scroll
cylY(CPX, CPZ, 24, 25, 3, 'COMP_L');               // tapa scroll
fill(CPX + 4, CPX + 7, 12, 17, CPZ - 2, CPZ + 2, 'COMP_L');  // caja de bornes
fill(CPX + 6, CPX + 7, 13, 16, CPZ + 2, CPZ + 3, 'BLK');
vox(CPX + 5, 14, CPZ + 3, 'GRN_B');                // piloto de marcha
// muñones de succión / descarga (cobre)
fill(CPX - 1, CPX - 1, 22, 26, CPZ, CPZ, 'COPPER'); // succión
fill(CPX + 1, CPX + 1, 24, 27, CPZ, CPZ, 'COPPER'); // descarga
// patas antivibratorias
for (const p of [[CPX - 4, CPZ - 4], [CPX + 4, CPZ - 4], [CPX - 4, CPZ + 4], [CPX + 4, CPZ + 4]])
  fill(p[0], p[0], YB + 1, YB + 2, p[1], p[1], 'BLK');

// ====== RECIBIDOR (acumulador vertical) ======
const RVX = 23, RVZ = 8;
cylY(RVX, RVZ, YB + 2, 24, 3, 'STEEL');
cylY(RVX, RVZ, 24, 25, 2, 'STEEL_L');              // domo superior
fill(RVX + 2, RVX + 3, 8, 10, RVZ, RVZ, 'COPPER'); // conexión

// ====== VÁLVULA DE 4 VÍAS (inversión frío/calor) ======
const VVX0 = 15, VVX1 = 31, VVY = 28, VVZ = 12;
cylX(VVX0, VVX1, VVY, VVZ, 2, 'STEEL');            // cuerpo horizontal
cylX(VVX0 - 1, VVX0 - 1, VVY, VVZ, 2, 'STEEL_L');
cylX(VVX1 + 1, VVX1 + 1, VVY, VVZ, 2, 'STEEL_L');
// 3 muñones inferiores (a compresor / serpentín / intercambiador) + solenoide arriba
fill(18, 19, 24, VVY - 1, VVZ, VVZ + 1, 'COPPER');
fill(23, 24, 24, VVY - 1, VVZ, VVZ + 1, 'COPPER');
fill(28, 29, 24, VVY - 1, VVZ, VVZ + 1, 'COPPER');
fill(VVX0 + 6, VVX0 + 8, VVY + 2, VVY + 5, VVZ, VVZ + 1, 'STEEL_D'); // bobina piloto
vox(VVX0 + 7, VVY + 5, VVZ + 1, 'REDB');

// ====== INTERCAMBIADOR DE PLACAS (lado agua) ======
const HX0 = 31, HX1 = 41, HXY0 = 8, HXY1 = 27, HXZ0 = 7, HXZ1 = 14;
fill(HX0, HX1, HXY0, HXY1, HXZ0, HXZ1, 'STEEL_D');
// líneas de placas (corrugado) en cara frontal
for (let x = HX0; x <= HX1; x++)
  fill(x, x, HXY0, HXY1, HXZ1, HXZ1, (x % 2 ? 'STEEL_L' : 'STEEL_D'));
// pernos de amarre
for (const c of [[HX0, HXY0], [HX1, HXY0], [HX0, HXY1], [HX1, HXY1]]) vox(c[0], c[1], HXZ1, 'BLK');
// conexiones refrigerante (cobre) arriba
fill(HX0 + 1, HX0 + 1, HXY1, HXY1 + 2, HXZ0 + 2, HXZ0 + 3, 'COPPER');
fill(HX1 - 1, HX1 - 1, HXY1, HXY1 + 2, HXZ0 + 2, HXZ0 + 3, 'COPPER');
// conexiones agua (entrada/salida) hacia el frente-abajo — se colorean dinámicas aparte
fill(33, 34, HXY0 - 2, HXY0, HXZ1, HXZ1 + 1, 'STEEL');
fill(38, 39, HXY0 - 2, HXY0, HXZ1, HXZ1 + 1, 'STEEL');

// ====== TABLERO ELÉCTRICO LATERAL (frente-derecha) ======
const PX0 = 39, PX1 = 47, PY0 = 20, PY1 = YCT - 4, PZ = Z1;
fill(PX0, PX1, PY0, PY1, PZ - 3, PZ, 'PANEL');            // cuerpo del gabinete
carve(PX0 + 1, PX1 - 1, PY0 + 1, PY1 - 1, PZ - 2, PZ - 1); // hueco (puerta cerrada al frente)
fill(PX0, PX1, PY0, PY0, PZ - 3, PZ, 'PANEL_D');
fill(PX0, PX1, PY1, PY1, PZ - 3, PZ, 'PANEL_D');
fill(PX0, PX1, PY0, PY1, PZ, PZ, 'PANEL_D');             // puerta
// franja de marca + display + botonera + pilotos
fill(PX0 + 1, PX1 - 1, PY1 - 1, PY1 - 1, PZ, PZ, 'TEAL');
fill(PX0 + 1, PX1 - 1, PY1 - 6, PY1 - 3, PZ, PZ, 'DISP'); // display
fill(PX0 + 1, PX0 + 2, PY0 + 3, PY0 + 4, PZ, PZ, 'GRN_B');
fill(PX0 + 4, PX0 + 5, PY0 + 3, PY0 + 4, PZ, PZ, 'RED_B');
vox(PX1 - 1, PY0 + 3, PZ, 'BLK');                        // seccionador
fill(PX1 - 2, PX1 - 1, PY0 + 4, PY0 + 7, PZ, PZ + 1, 'STEEL_D'); // maneta
// bisagras
vox(PX0, PY0 + 4, PZ, 'STEEL_L'); vox(PX0, PY1 - 4, PZ, 'STEEL_L');
// prensaestopas inferiores
fill(PX0 + 2, PX0 + 3, PY0 - 2, PY0, PZ - 1, PZ, 'BLK');

// ====== TUBERÍA DE COBRE (interconexión visible) ======
// descarga compresor -> válvula 4 vías
fill(CPX + 1, CPX + 1, 27, 28, CPZ, CPZ, 'COPPER');
fill(CPX + 1, 18, 27, 28, CPZ, CPZ, 'COPPER');
// válvula -> intercambiador de placas
fill(29, HX0, 24, 25, VVZ, VVZ, 'COPPER');
// succión: intercambiador/recibidor -> compresor
fill(RVX, RVX, 9, 9, RVZ, CPZ, 'COPPER');
fill(CPX - 1, RVX, 22, 23, CPZ, CPZ, 'COPPER_D');

// ====== TECHO / DECK DE VENTILADORES ======
fill(X0, X1, YCT, YCT + 1, Z0, Z1, 'GRILLE_L');   // placa base del deck
// venturi + rejilla circular por ventilador
function fanTop(cx, cz, r) {
  const y0 = YCT + 1, y1 = YCT + 8;
  const bx0 = Math.floor(cx - r) - 1, bx1 = Math.ceil(cx + r) + 1;
  const bz0 = Math.floor(cz - r) - 1, bz1 = Math.ceil(cz + r) + 1;
  for (let x = bx0; x <= bx1; x++)
    for (let z = bz0; z <= bz1; z++) {
      const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
      if (d <= r && d > r - 1.4) fill(x, x, y0, y1, z, z, 'GRILLE');   // aro venturi
      if (d <= r - 1) {
        carve(x, x, YCT, y1 - 1, z, z);                                // apertura de aire
        if ((x + z) % 2 === 0) vox(x, y1, z, 'GRILLE');                // barras de rejilla
      }
    }
  // araña de soporte de rejilla
  fill(Math.round(cx), Math.round(cx), y1, y1, Math.round(cz - r + 1), Math.round(cz + r - 1), 'GRILLE');
  fill(Math.round(cx - r + 1), Math.round(cx + r - 1), y1, y1, Math.round(cz), Math.round(cz), 'GRILLE');
  vox(Math.round(cx), y1, Math.round(cz), 'GRILLE_L');                 // cubo central
}
const FANS = [{ cx: 14.5, cz: 11.5, r: 9, fr: 8.0 }, { cx: 36.5, cz: 11.5, r: 9, fr: 8.0 }];
FANS.forEach(f => fanTop(f.cx, f.cz, f.r));

// ====== PLACA DE DATOS ======
fill(X1 - 8, X1 - 3, YB + 4, YB + 8, Z1, Z1, 'STEEL_L');
fill(X1 - 7, X1 - 4, YB + 7, YB + 7, Z1, Z1, 'TEAL');

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 160, 420);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(70, 150, 110);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -40; sc.right = 100; sc.top = 110; sc.bottom = -30; sc.near = 5; sc.far = 420;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(25, 20, 8);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-60, 50, 80);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(30, 50, -90);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
}

// ====== ESTADO ======
const state = { mode: 'frio', comp: true, fan: true, rot: false };

// ====== PARTES DINÁMICAS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}

// -- Ventiladores axiales (aspas oscuras con pitch)
const matBlade = new THREE.MeshStandardMaterial({ color: 0x24282f, roughness: 0.5, metalness: 0.55, envMapIntensity: 0.4 });
const matHub = new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.55, metalness: 0.5 });
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 2.4, 2.4, 1.0));
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.55, 0, 1.4, r, 0.55);
    b.rotation.y = 0.5;
    arm.add(b);
    arm.rotation.z = i * (Math.PI * 2 / 5);
    g.add(arm);
  }
  return g;
}
const fanRigs = [];
for (const f of FANS) {
  const fan = buildFan(f.fr);
  const mount = new THREE.Group();
  mount.add(fan);
  mount.position.set(f.cx, YCT + 4.5, f.cz);
  mount.rotation.x = Math.PI / 2;      // eje vertical
  scene.add(mount);
  fanRigs.push(fan);
}

// -- Indicador de la válvula de 4 vías (rota según el modo)
const valveInd = new THREE.Group();
const matValveInd = emat(0x3aa0ff, 0x0a1622, 0.9);
valveInd.add(dynBox(matValveInd, 0, 0, 0, 6.0, 1.0, 1.0));
valveInd.add(dynBox(matValveInd, 0, 0, 0, 1.0, 1.0, 3.0));
valveInd.position.set((VVX0 + VVX1) / 2, VVY, VVZ + 3);
scene.add(valveInd);

// -- LED de marcha del compresor (piloto grande)
const matCompLed = emat(0x00ff66, 0x062a12, 1.6);
scene.add(dynBox(matCompLed, CPX + 5.5, 14.5, CPZ + 3.6, 1.2, 1.2, 0.8));
const compLight = new THREE.PointLight(0x00ff66, 1.4, 24, 2);
compLight.position.set(CPX + 6, 16, CPZ + 8);
scene.add(compLight);

// -- Pilotos del tablero (energizado) + luz
const matPanelG = emat(0x00ff66, 0x062a12, 1.6);
const matPanelM = emat(0x3aa0ff, 0x0a1622, 1.4);   // color según modo
scene.add(dynBox(matPanelG, PX0 + 1.5, PY0 + 3.5, PZ + 0.6, 1.0, 1.0, 0.7));
scene.add(dynBox(matPanelM, PX0 + 4.5, PY0 + 3.5, PZ + 0.6, 1.0, 1.0, 0.7));
const panelLight = new THREE.PointLight(0x3aa0ff, 1.0, 20, 2);
panelLight.position.set(PX0 + 3, PY0 + 6, PZ + 4);
scene.add(panelLight);

// -- Tubería de agua dinámica (recolorable por modo) hacia el frente-abajo
const matWater = new THREE.MeshStandardMaterial({ color: 0x3aa0ff, emissive: 0x3aa0ff, emissiveIntensity: 0.28, roughness: 0.4, metalness: 0.3 });
const waterPipe = new THREE.Group();
function wtube(pts, w) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const steps = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      waterPipe.add(dynBox(matWater, a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, w, w, w));
    }
  }
}
wtube([[33.5, 8, 15], [33.5, 3, 18], [33.5, 3, 24]], 1.6);   // entrada agua
wtube([[38.5, 8, 15], [38.5, 3, 20], [38.5, 3, 24]], 1.6);   // salida agua
scene.add(waterPipe);

// -- Partículas de flujo (gateadas por estado)
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(3, Math.round(L / 5));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.72, 0.72, 0.72);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g, mat: mat,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const fRefr = () => state.comp;                 // refrigerante circula con el compresor
const flows = [
  // descarga (roja): compresor -> válvula 4 vías -> serpentín
  { f: makeFlow([[12, 27.5, 12], [18, 27.5, 12], [24, 27.5, 12]], 0xff3b30, 9), gate: fRefr },
  // válvula -> intercambiador de placas (roja)
  { f: makeFlow([[29, 24.5, 12], [HX0, 24.5, 12], [36, 24.5, 11]], 0xff3b30, 9), gate: fRefr },
  // succión (azul): recibidor -> compresor
  { f: makeFlow([[23, 9, 8], [23, 22.5, 12], [12, 22.5, 12]], 0x3aa0ff, 7), gate: fRefr },
  // agua por el intercambiador (color según modo)
  { f: makeFlow([[33.5, 3, 24], [33.5, 12, 12], [38.5, 22, 12], [38.5, 3, 24]], 0x3aa0ff, 6), gate: () => true, water: true }
];
let waterFlow = null;
flows.forEach(o => { scene.add(o.f.group); if (o.water) waterFlow = o.f; });

// -- Aplicar modo FRÍO/CALOR (invierte válvula + colores del agua)
function applyMode() {
  const cool = state.mode === 'frio';
  const hex = cool ? 0x3aa0ff : 0xff3b30;
  matWater.color.setHex(hex); matWater.emissive.setHex(hex);
  if (waterFlow) { waterFlow.mat.color.setHex(hex); waterFlow.mat.emissive.setHex(hex); }
  matPanelM.emissive.setHex(hex);
  matValveInd.emissive.setHex(hex);
  panelLight.color.setHex(hex);
}
applyMode();

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  // ventiladores
  if (state.fan) for (let i = 0; i < fanRigs.length; i++) fanRigs[i].rotation.z += dt * (10 + i * 0.6);
  // válvula de 4 vías: rota a la posición del modo
  const tgt = state.mode === 'frio' ? 0 : Math.PI;
  valveInd.rotation.z += (tgt - valveInd.rotation.z) * Math.min(1, dt * 4);
  // LED / luz del compresor
  matCompLed.emissiveIntensity = state.comp ? (1.2 + 0.5 * Math.abs(Math.sin(tNow * 3))) : 0.12;
  compLight.color.setHex(state.comp ? 0x00ff66 : 0xff3b30);
  compLight.intensity = state.comp ? 1.4 : 0.5;
  // flujos
  for (const o of flows) o.f.update(dt, o.gate());
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(95, 68, 100);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(25, 26, 9);
  controls.autoRotate = state.rot;   // arranca en OFF
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  function refreshUI() {
    const bM = document.getElementById('bMode');
    const cool = state.mode === 'frio';
    bM.textContent = cool ? 'FRÍO' : 'CALOR';
    bM.className = cool ? 'cool' : 'heat';
    document.getElementById('lgMode').textContent = cool ? 'FRÍO' : 'CALOR';
    document.getElementById('lgW').style.background = cool ? '#3aa0ff' : '#ff3b30';
    for (const bs of [['bComp', 'comp'], ['bFan', 'fan'], ['bRot', 'rot']]) {
      const b = document.getElementById(bs[0]);
      b.textContent = state[bs[1]] ? 'ON' : 'OFF';
      b.className = state[bs[1]] ? 'on' : 'off';
    }
  }
  document.getElementById('bMode').addEventListener('click', () => {
    state.mode = state.mode === 'frio' ? 'calor' : 'frio';
    applyMode(); refreshUI();
  });
  for (const bs of [['bComp', 'comp'], ['bFan', 'fan'], ['bRot', 'rot']]) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
