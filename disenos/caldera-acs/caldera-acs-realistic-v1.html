<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 unidad = 1 m. Spec dimensional/composicion: voxel/caldera-acs-voxel.html (1 voxel = 0.05 m).
// CALDERA pirotubular horizontal (eje X): shell Ø1.30 x 2.10 m + cabezales abombados -> ~2.5 m largo,
//   eje a y=0.80 (top ~1.45, con silletas ~1.5 m alto). Azul pintado, tapa frontal NEGRA abisagrada con
//   mirilla (glow ambar con el quemador). Quemador frontal + tren de gas amarillo. Chimenea vertical trasera.
//   Panel de control con display. CUT-AWAY (CORTE): oculta la media-carcasa frontal (+Z) para revelar el
//   HAZ DE TUBOS DE HUMO + el hogar/camara de combustion (default corte=on -> tubos visibles).
// TANQUE ACS vertical Ø1.0 x ~2.0 m: cuerpo + cupulas + camisa de aislamiento con bandas naranjas,
//   termometro, conexiones bridadas, patas. BOMBA de recirculacion pequena (acople gira). Tuberia de agua
//   caliente NARANJA (correcto: esta caliente) con valvula + check, tuberia de recirculacion.
// FLUJO/HUMO: pluma translucida sobre la chimenea con scroll de CanvasTexture (offset.y) + opacidad; glow de
//   mirilla/hogar por emissiveIntensity; acople por rotacion. Todo el loop solo muta transform/emissive/offset.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 200);
camera.position.set(3.1, 1.95, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // sombras horneadas: un solo horneado tras construir
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 1.4;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0.0, 0.95, 0.55);
// Ground clamp (regla de la casa): ni el target ni la camara bajan del piso
controls.addEventListener('change', () => {
  if (controls.target.y < 0) controls.target.y = 0;
  if (camera.position.y < 0.2) camera.position.y = 0.2;
});

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4.2, 6.2, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -3.4; sun.shadow.camera.right = 3.4;
sun.shadow.camera.top = 3.8; sun.shadow.camera.bottom = -0.6;
sun.shadow.camera.near = 1.5; sun.shadow.camera.far = 20;
sun.shadow.bias = -0.0004;
sun.target.position.set(0, 0.8, 0.5);
scene.add(sun); scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-3.6, 3.0, -2.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-1.8, 1.8, 3.8);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x123f35, 0x0c1d1a);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ====== TEXTURAS PROCEDURALES (CanvasTexture) ======
// Mapas de COLOR: SRGBColorSpace · mapas de datos (roughness/alpha): lineales
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function dataTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// Variacion sutil de rugosidad para la pintura (mapa lineal). roughnessMap MULTIPLICA el escalar:
// escalar 1.0 * mapa (~0.55 medio) deja el producto en la banda de pintura percibida (0.5-0.6).
const paintRoughTex = dataTex(256, 256, (g) => {
  g.fillStyle = '#8c8c8c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++){
    const v = 120 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
});
paintRoughTex.wrapS = paintRoughTex.wrapT = THREE.RepeatWrapping;
paintRoughTex.repeat.set(3, 2);

// Moteado de concreto para la losa (mapa de color)
const concreteTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#9c978b'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1600; i++){
    g.fillStyle = Math.random() < 0.55 ? 'rgba(135,130,111,0.35)' : 'rgba(178,173,158,0.28)';
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  g.strokeStyle = 'rgba(95,91,82,0.5)'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++){
    g.beginPath();
    let x = Math.random() * 256, y = Math.random() * 256;
    g.moveTo(x, y);
    for (let s = 0; s < 5; s++){ x += (Math.random() - 0.5) * 44; y += (Math.random() - 0.5) * 44; g.lineTo(x, y); }
    g.stroke();
  }
});
concreteTex.wrapS = concreteTex.wrapT = THREE.RepeatWrapping;
concreteTex.repeat.set(3, 3);

// Placa de datos generica
function nameplateTex(title, sub, rows){
  return canvasTex(512, 256, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#d8dade'); grad.addColorStop(0.5, '#b8bcc2'); grad.addColorStop(1, '#c8ccd2');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#3a3f46'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
    g.fillStyle = '#22262c';
    g.font = 'bold 30px monospace'; g.textAlign = 'center';
    g.fillText(title, w/2, 54);
    g.font = '20px monospace';
    g.fillText(sub, w/2, 86);
    g.font = '19px monospace'; g.textAlign = 'left';
    rows.forEach((r, i) => g.fillText(r, 40, 128 + i * 30));
    for (const [bx, by] of [[26, 26], [w-26, 26], [26, h-26], [w-26, h-26]]){
      g.beginPath(); g.arc(bx, by, 7, 0, Math.PI*2); g.fillStyle = '#787c82'; g.fill();
    }
  });
}
const plateBoilerTex = nameplateTex('CALDERA PIROTUBULAR', 'TUBOS DE HUMO · GAS', [
  'MODELO      PT-350-3P', 'POTENCIA    350 kW · 10 bar', 'SERV.       VAPOR/AGUA 90 C']);
const plateTankTex = nameplateTex('TANQUE ACS', 'ACUMULACIÓN · AGUA CALIENTE', [
  'MODELO      ACS-500-V', 'VOLUMEN     500 L · 8 bar', 'SERV.       ACS 60 C']);

// Caratula de gauge (fondo segun servicio, escala 270°, aguja horneada)
function gaugeTex(bg, unit, label, frac){
  return canvasTex(256, 256, (g, w, h) => {
    const cx = w/2, cy = h/2;
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#22262c'; g.lineWidth = 8;
    g.beginPath(); g.arc(cx, cy, 118, 0, Math.PI*2); g.stroke();
    const a0 = Math.PI * 0.75, sweep = Math.PI * 1.5;
    for (let i = 0; i <= 30; i++){
      const a = a0 + sweep * i / 30, major = i % 5 === 0;
      const r1 = 108, r0 = major ? 90 : 99;
      g.strokeStyle = '#22262c'; g.lineWidth = major ? 5 : 2;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.stroke();
      if (major){
        g.fillStyle = '#22262c'; g.font = 'bold 20px monospace'; g.textAlign = 'center';
        g.fillText(String(i / 5 * 2), cx + Math.cos(a) * 70, cy + Math.sin(a) * 70 + 7);
      }
    }
    g.fillStyle = '#22262c'; g.font = 'bold 17px monospace'; g.textAlign = 'center';
    g.fillText(unit, cx, cy + 46);
    g.font = '13px monospace';
    g.fillText(label, cx, cy + 66);
    const na = a0 + sweep * frac;
    g.strokeStyle = '#d0242e'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - Math.cos(na) * 18, cy - Math.sin(na) * 18);
    g.lineTo(cx + Math.cos(na) * 92, cy + Math.sin(na) * 92); g.stroke();
    g.fillStyle = '#22262c';
    g.beginPath(); g.arc(cx, cy, 12, 0, Math.PI*2); g.fill();
    g.fillStyle = '#d0242e';
    g.beginPath(); g.arc(cx, cy, 6, 0, Math.PI*2); g.fill();
  });
}
const faceThermoACS = gaugeTex('#f6ddce', 'C',   'ACS 60', 0.62);   // termometro ACS (caliente)
const faceManoBoiler = gaugeTex('#e7edf3', 'bar', 'CALDERA', 0.42);  // manometro de la caldera

// Display del panel de control (verde tipo LCD)
const displayTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#04120e'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#0b3a2c'; g.lineWidth = 3; g.strokeRect(6, 6, w-12, h-12);
  g.fillStyle = '#00e59a'; g.font = 'bold 34px monospace'; g.textAlign = 'left';
  g.fillText('88.6 C', 20, 52);
  g.font = '18px monospace';
  g.fillText('P 8.2 bar', 20, 88);
  g.fillStyle = '#7a8a98'; g.font = '13px monospace';
  g.fillText('QUEMADOR . BOMBA . ACS', 20, 112);
});

// ====== PALETA PBR (metalness 0 = pintado · metalness 1 = metal desnudo) ======
// Leccion documentada (torre/bomba/tanques): gris medio + metalness 1 lee NEGRO en este entorno.
// Caldera azul, tapa negra, aislamiento del tanque, bandas -> metalness 0 con roughnessMap.
// Metal desnudo (tubos de humo, quemador, valvulas de gas, bridas, chimenea, flecha) -> metalness 1.
// Identificacion: GAS = amarillo; AGUA CALIENTE = naranja/rojo; gases de combustion = gris.
const M = {
  SHELL:   new THREE.MeshStandardMaterial({ color:0x24507c, roughness:1.0, metalness:0, roughnessMap:paintRoughTex, side:THREE.DoubleSide }),
  SHELL_D: new THREE.MeshStandardMaterial({ color:0x18365a, roughness:0.6, metalness:0 }),
  FRONT:   new THREE.MeshStandardMaterial({ color:0x16161b, roughness:0.55, metalness:0.1 }),   // tapa frontal negra
  FURN:    new THREE.MeshStandardMaterial({ color:0x6a6f78, roughness:0.5, metalness:0.7, side:THREE.DoubleSide }), // hogar
  TUBE:    new THREE.MeshStandardMaterial({ color:0x828892, roughness:0.42, metalness:1 }),      // tubos de humo
  STEEL:   new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.34, metalness:1 }),      // bridas / metal desnudo
  STEEL_D: new THREE.MeshStandardMaterial({ color:0x5c626b, roughness:0.5, metalness:0.55 }),    // cuerpos de valvula
  CHIM:    new THREE.MeshStandardMaterial({ color:0x6c6c74, roughness:0.5, metalness:1 }),        // chimenea acero desnudo
  GAS:     new THREE.MeshStandardMaterial({ color:0xd8a828, roughness:0.5, metalness:0 }),        // tren de gas amarillo
  HOT:     new THREE.MeshStandardMaterial({ color:0xc0472a, roughness:0.5, metalness:0 }),        // agua caliente naranja/rojo
  REC:     new THREE.MeshStandardMaterial({ color:0xcf7a3a, roughness:0.5, metalness:0 }),        // recirculacion
  INSUL:   new THREE.MeshStandardMaterial({ color:0xd6d0c2, roughness:1.0, metalness:0, roughnessMap:paintRoughTex }), // aislamiento tanque
  BAND:    new THREE.MeshStandardMaterial({ color:0xd96a26, roughness:0.5, metalness:0 }),        // bandas naranjas
  JBAND:   new THREE.MeshStandardMaterial({ color:0xb9c0c8, roughness:0.32, metalness:1 }),       // fleje inox
  BRASS:   new THREE.MeshStandardMaterial({ color:0xb87333, roughness:0.35, metalness:1 }),
  RED:     new THREE.MeshStandardMaterial({ color:0xc22a34, roughness:0.5, metalness:0.2 }),      // volantes
  FRAME:   new THREE.MeshStandardMaterial({ color:0x3a3a3e, roughness:0.6, metalness:0.3 }),      // silletas / patas
  CONCRETE:new THREE.MeshStandardMaterial({ color:0xffffff, map:concreteTex, roughness:0.92, metalness:0 }),
  DARK:    new THREE.MeshStandardMaterial({ color:0x24242a, roughness:0.7, metalness:0 }),
  BOLT:    new THREE.MeshStandardMaterial({ color:0x22242a, roughness:0.4, metalness:1 }),
  GLASS:   new THREE.MeshPhysicalMaterial({ color:0xeef4ff, roughness:0.06, metalness:0,
             transmission:0.92, thickness:0.01, ior:1.45 })
};
// Mirilla (vidrio de la tapa): glow ambar con el quemador (emissive mutado)
const sightMat = new THREE.MeshPhysicalMaterial({ color:0x1a0d08, emissive:0xff8a30, emissiveIntensity:0,
  roughness:0.28, metalness:0.1, transmission:0.35, thickness:0.02, ior:1.45 });
// Camara de combustion (revelada en CORTE): glow ambar con el quemador
const chamberMat = new THREE.MeshStandardMaterial({ color:0x2a1206, emissive:0xff5a1e, emissiveIntensity:0,
  roughness:0.7, metalness:0, side:THREE.DoubleSide });
// Display + LEDs (emissive)
const displayMat = new THREE.MeshStandardMaterial({ map:displayTex, emissiveMap:displayTex,
  emissive:0xffffff, emissiveIntensity:0.7, roughness:0.4, metalness:0 });
const ledQMat = new THREE.MeshStandardMaterial({ color:0xff2233, emissive:0xff2233, emissiveIntensity:1.2, roughness:0.3, metalness:0.2 });
const ledPMat = new THREE.MeshStandardMaterial({ color:0xff2233, emissive:0xff2233, emissiveIntensity:1.2, roughness:0.3, metalness:0.2 });
// Humo de chimenea (gases de combustion) — translucido, scroll + opacidad
const smokeTex = canvasTex(64, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 24; i++){
    const cx = Math.random() * w, cy = Math.random() * h, r = 6 + Math.random() * 14;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(170,176,184,0.5)');
    grad.addColorStop(1, 'rgba(154,160,168,0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
});
smokeTex.wrapS = smokeTex.wrapT = THREE.RepeatWrapping;
smokeTex.repeat.set(2, 1);
const smokeMat = new THREE.MeshBasicMaterial({ color:0x9aa0a8, map:smokeTex, transparent:true,
  opacity:0.0, depthWrite:false, side:THREE.DoubleSide });

// ====== HELPERS DE GEOMETRIA PARAMETRICA ======
const staticG = new THREE.Group();       // todo lo estatico (sombras horneadas)
scene.add(staticG);
const cutGroup = new THREE.Group();       // media-carcasa frontal (+Z) removible de la caldera (toggle CORTE)
staticG.add(cutGroup);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = staticG){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = staticG){
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function cylX(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.z = Math.PI / 2;
  return m;
}
function cylY(r, len, mat, x, y, z, seg = 20, parent = staticG){
  return mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
}
function cylZ(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.x = Math.PI / 2;
  return m;
}
// Cupula semi-elipsoidal (cabezal torisferico simplificado) via lathe: ecuador (R,0) -> polo (0,h)
function domeGeo(R, h, segRad = 32, segArc = 12){
  const pts = [];
  for (let i = 0; i <= segArc; i++){
    const a = i / segArc * Math.PI / 2;
    pts.push(new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * h));
  }
  return new THREE.LatheGeometry(pts, segRad);
}
// Tuberia con codos suavizados
function makePipe(points, r, mat, bend = 0.06, parent = staticG, seg = 12){
  const path = new THREE.CurvePath();
  const P = points.map(p => new THREE.Vector3(...p));
  let prev = P[0];
  for (let i = 1; i < P.length - 1; i++){
    const a = P[i], b = P[i+1];
    const dIn = a.clone().sub(prev).normalize();
    const dOut = b.clone().sub(a).normalize();
    const tIn = a.clone().sub(dIn.clone().multiplyScalar(bend));
    const tOut = a.clone().add(dOut.clone().multiplyScalar(bend));
    path.add(new THREE.LineCurve3(prev, tIn));
    path.add(new THREE.QuadraticBezierCurve3(tIn, a, tOut));
    prev = tOut;
  }
  path.add(new THREE.LineCurve3(prev, P[P.length - 1]));
  const len = path.getLength();
  const g = new THREE.TubeGeometry(path, Math.max(16, Math.round(len * 28)), r, seg);
  return mesh(g, mat, 0, 0, 0, parent);
}

// Pernos / instancias globales (una sola draw call)
const boltMatrices = [];
const _bm = new THREE.Matrix4(), _bs = new THREE.Vector3(1,1,1), _q0 = new THREE.Quaternion();
const AXQ = {
  x: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI/2)),
  y: new THREE.Quaternion(),
  z: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0))
};
function boltRing(cx, cy, cz, axis, radius, n){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + Math.PI / n;
    const u = Math.cos(a) * radius, v = Math.sin(a) * radius;
    let px = cx, py = cy, pz = cz;
    if (axis === 'x'){ py += u; pz += v; }
    else if (axis === 'y'){ px += u; pz += v; }
    else { px += u; py += v; }
    _bm.compose(new THREE.Vector3(px, py, pz), AXQ[axis], _bs);
    boltMatrices.push(_bm.clone());
  }
}
function makeIM(geo, mat, mats, parent = staticG, cast = true){
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = cast; im.receiveShadow = true;
  parent.add(im);
  return im;
}
function tMat(x, y, z, q = _q0, s = _bs){
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), q, s);
}
// Brida a ras + anillo de esparragos (leccion: brida flush, nunca air gap)
function flangeX(R, thick, x, y, z, nBolts, boltR, boltSide = 1, parent = staticG){
  cylX(R, thick, M.STEEL, x, y, z, 24, parent);
  if (nBolts) boltRing(x + boltSide * (thick/2 + 0.006), y, z, 'x', boltR, nBolts);
}
function flangeY(R, thick, x, y, z, nBolts, boltR, boltSide = 1, parent = staticG){
  cylY(R, thick, M.STEEL, x, y, z, 24, parent);
  if (nBolts) boltRing(x, y + boltSide * (thick/2 + 0.006), z, 'y', boltR, nBolts);
}
// Gauge (dial en canvas) mirando a +Z: stub laton + biselado + caratula + lente
function gaugeZ(x, y, z, faceTex, parent = staticG){
  cylZ(0.012, 0.05, M.BRASS, x, y, z - 0.03, 12, parent);
  cylZ(0.058, 0.035, M.DARK, x, y, z, 22, parent);
  mesh(new THREE.TorusGeometry(0.052, 0.007, 8, 26), M.BRASS, x, y, z + 0.02, parent);

  face.castShadow = false;
  const lens = cylZ(0.05, 0.006, M.GLASS, x, y, z + 0.024, 24, parent);
  lens.castShadow = false;
}

    couplingG.add(hub);
  }
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.05, 18), coupMat);
  sleeve.rotation.x = Math.PI / 2;
  couplingG.add(sleeve);
  const key = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.09, 0.06), M.DARK);
  key.position.y = 0.035;
  couplingG.add(key);
  couplingG.traverse(o => { o.castShadow = false; });
  scene.add(couplingG);
}

// ==================================================================
// TUBERIA AGUA CALIENTE (naranja) — caldera -> tanque (con valvula + check + bridas)
// ==================================================================
{
  const rx = 0.30;                                             // salida del lomo trasero de la caldera
  makePipe([
    [rx, BR + BAY - 0.05, 0.10], [rx, 1.55, 0.10],
    [rx, 1.55, 1.0], [TX + 0.30, 1.55, 1.55], [TX + (TR + 0.17), 1.55, TZ]
  ], 0.045, M.HOT, 0.10);
  // valvula de compuerta (cuerpo + volante rojo) en el riser
  cylY(0.075, 0.12, M.STEEL_D, rx, 1.15, 0.10, 20);
  cylY(0.016, 0.10, M.STEEL, rx, 1.24, 0.10, 8);
  const w1 = mesh(new THREE.TorusGeometry(0.065, 0.011, 8, 24), M.RED, rx, 1.30, 0.10);
  w1.rotation.x = Math.PI / 2;
  // valvula check (swing) en el tramo horizontal
  cylZ(0.07, 0.12, M.STEEL_D, rx, 1.55, 0.5, 20);
  cylY(0.03, 0.06, M.BRASS, rx, 1.61, 0.5, 12);
  // soporte del tramo aereo
  box(0.05, 1.5, 0.05, M.FRAME, rx, 0.75, 0.10);
}

// ==================================================================
// TUBERIA RECIRCULACION (naranja claro) — tanque -> bomba -> caldera
// ==================================================================
{
  // succion: fondo del tanque (salida baja -X) -> boca de succion de la bomba (+Z)
  makePipe([
    [TX - (TR + 0.10), 0.55, TZ], [TX - (TR + 0.10), 0.32, TZ],
    [PUMP.x, 0.28, TZ - 0.10], [PUMP.x, 0.28, PUMP.z + 0.34]
  ], 0.035, M.REC, 0.08);
  // descarga: cuello de la bomba -> cuerpo de la caldera (lado -X bajo)
  makePipe([
    [PUMP.x, 0.55, PUMP.z + 0.20], [PUMP.x, 0.65, PUMP.z],
    [PUMP.x, 0.65, 0.28], [-0.55, 0.62, 0.20]
  ], 0.032, M.REC, 0.08);
  // valvula de aislamiento en la succion
  cylZ(0.055, 0.09, M.STEEL_D, PUMP.x, 0.28, PUMP.z + 0.34, 18);
}

// ==================================================================
// INSTANCIADO GLOBAL (esparragos de bridas + anclas) — 1 draw call
// ==================================================================
makeIM(new THREE.CylinderGeometry(0.008, 0.008, 0.02, 6), M.BOLT, boltMatrices, staticG, false);

// ====== FIRELIGHT (glow del hogar, sin sombra) ======
const firelight = new THREE.PointLight(0xff7a2a, 0, 4.0);
firelight.position.set(-0.6, FURN_Y, 0);
firelight.castShadow = false;
scene.add(firelight);

// ====== ESTADO / CONTROL DE EQUIPO ======
const COLOR_ON = 0x00ff66, COLOR_OFF = 0xff2233;
const state = { q:false, p:false, corte:true, rot:true };
let qLevel = 0, pLevel = 0;                                    // 0..1 con inercia asimetrica

function setLed(mat, on){
  mat.color.setHex(on ? COLOR_ON : COLOR_OFF);
  mat.emissive.setHex(on ? COLOR_ON : COLOR_OFF);
  mat.emissiveIntensity = on ? 1.7 : 1.2;
}
function applyState(){
  // Solo cambia emisivos / visibilidad / objetivos: NO se rehornean sombras aqui
  setLed(ledQMat, state.q);
  setLed(ledPMat, state.p);
  const cm = couplingG.userData.mat;
  cm.color.setHex(state.p ? COLOR_ON : COLOR_OFF);
  cm.emissive.setHex(state.p ? COLOR_ON : COLOR_OFF);
  cm.emissiveIntensity = state.p ? 0.65 : 0.4;
  cutGroup.visible = !state.corte;                            // CORTE on = cutaway (media-carcasa frontal oculta)
}

// ====== UI ======
function bind(id, key){
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => {
    state[key] = !state[key];
    btn.className = state[key] ? 'on' : 'off';
    btn.textContent = state[key] ? 'ON' : 'OFF';
    applyState();
  });
}
bind('bQ', 'q');
bind('bP', 'p');
const bCorte = document.getElementById('bCorte');
bCorte.addEventListener('click', () => {
  state.corte = !state.corte;
  bCorte.className = state.corte ? 'on' : 'off';
  bCorte.textContent = state.corte ? 'ON' : 'OFF';
  applyState();
});
const bRot = document.getElementById('bRot');
bRot.addEventListener('click', () => {
  state.rot = !state.rot;
  bRot.className = state.rot ? 'on' : 'off';
  bRot.textContent = state.rot ? 'ON' : 'OFF';
});

applyState();
renderer.shadowMap.needsUpdate = true;          // horneado unico tras construir la escena

// ====== LOOP DE ANIMACION ======
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // inercia asimetrica (arranque rapido, apagado con coast-down)
  const tq = state.q ? 1 : 0, kq = state.q ? 2.0 : 1.2;
  qLevel += (tq - qLevel) * Math.min(1, dt * kq);
  if (Math.abs(qLevel - tq) < 0.0015) qLevel = tq;
  const tp = state.p ? 1 : 0, kp = state.p ? 1.6 : 0.5;
  pLevel += (tp - pLevel) * Math.min(1, dt * kp);
  if (Math.abs(pLevel - tp) < 0.0015) pLevel = tp;

  // BOMBA RECIRC: el acople gira (solo rotacion)
  couplingG.rotation.z += dt * pLevel * 13;

  // QUEMADOR: glow de mirilla / camara + firelight (solo emissive / intensity)
  const flick = 0.85 + Math.sin(t * 17) * 0.25 + Math.sin(t * 29) * 0.12;
  sightMat.emissiveIntensity = qLevel * 1.4 * flick;
  chamberMat.emissiveIntensity = qLevel * 1.1 * flick;
  firelight.intensity = qLevel * 2.2 * (0.9 + Math.sin(t * 19) * 0.25);

  // HUMO de chimenea: scroll + opacidad (allocation-free)
  if (qLevel > 0.03){
    smokePlume.visible = true;
    smokeTex.offset.y -= dt * (0.25 + 0.45 * qLevel);
    smokeMat.opacity = 0.32 * qLevel * (0.7 + 0.3 * Math.sin(t * 3.0));
  } else {
    smokePlume.visible = false;
  }

  controls.autoRotate = state.rot;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
