<!doctype html>
<html lang="es" data-app-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nave-3sistemas — Pase INTERACTION-UI</title>
  <link rel="icon" href="data:,">
  <!--
    LOCAL importmap — three r0.160.0 ships inside this build (vendor/three/), so the design
    runs fully OFFLINE with no CDN dependency at run time. The static form is safe here: the
    local paths carry no '@' for the Cloudflare minifier to mangle (was the reason for the old
    dynamic unpkg block). Retrofit 2026-08-15 per disenos/catalog/EXTERNAL-ASSETS.md §A.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "lil-gui": "./vendor/lil-gui/lil-gui.esm.js"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root">

  <!-- ── KPI band (row 2) ───────────────────────────────────────────────────── -->
  <div class="kpi-band" id="kpi-band">
    <!-- populated by render.mjs renderKpiBand() -->
  </div>

  <!-- ── Main region (row 4): 3D canvas + sidebar ──────────────────────────── -->
  <div class="main">

    <!-- 3D canvas area -->
    <div class="canvas-wrap" id="canvas-wrap">
      <!--
        #hud — the __qaFraming hook queries this element's getBoundingClientRect()
        to return the HUD rect in the framing payload.  ID must remain '#hud'.
        Pass label must read EXACTLY "Pase INTERACTION-UI".
      -->
      <div id="hud">
        <span class="hud-name">nave-3sistemas</span>
        <span class="hud-pass">Pase INTERACTION-UI</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>

    <!-- Right sidebar: three system panels -->
    <div class="sidebar" id="sidebar">
      <!-- populated by render.mjs renderPanels() -->
    </div>

  </div><!-- /.main -->

  <!-- ── Bottom strip (row 6): coupling | trend | controls ─────────────────── -->
  <div class="bottom">

    <!-- Coupling: stacked load bar + flow strip -->
    <div class="bottom-card" id="coupling-panel">
      <div class="panel-hdr">Composición de carga térmica</div>
      <div id="stacked-bar-wrap"></div>
      <div class="panel-hdr" style="margin-top:6px">Cadena energética</div>
      <div id="flow-strip-wrap"></div>
    </div>

    <!-- HVAC kW rolling trend -->
    <div class="bottom-card" id="trend-panel">
      <div class="panel-hdr">HVAC kW — tendencia</div>
      <div id="trend-chart-wrap"></div>
      <div class="panel-hdr" style="margin-top:6px">Presión red — tendencia</div>
      <div id="pressure-chart-wrap"></div>
    </div>

    <!-- What-if controls + alarm list -->
    <div class="bottom-card" id="controls-panel">
      <div class="panel-hdr">Simulación</div>
      <div id="controls-wrap">
        <!-- populated by main.js buildControls() -->
      </div>
      <div class="panel-hdr" style="margin-top:6px">Alarmas activas</div>
      <div id="alarms-wrap"></div>
    </div>

  </div><!-- /.bottom -->

</div><!-- /#root -->

<script type="module" src="main.js"></script>
</body>
</html>
