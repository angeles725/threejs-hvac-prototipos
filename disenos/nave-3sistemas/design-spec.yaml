# DesignSpec — nave-3sistemas
# Authored P2 from P1-RESEARCH.md + P1-AMENDMENT.md. Gated at P3.
# The dashboard is the primary deliverable; the 3D is its evidence surface (see GOAL.md).

design: nave-3sistemas
track: threejs
mode: heavy
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.2 m"

p6_comparison: spec-only          # no photographic reference exists for the composite bay scene
                                  # (P1-RESEARCH.md §6) -> no reference-match camera view

# DECLARED RISK - recorded rather than buried, flagged by the scoped P3 re-gate 2026-08-13.
# The AHU airflow was set to the LOWER bound (20000 m3/h) of P1's inferred 20000-30000 band, and
# the stated reason - that it makes AHU saturation reachable and therefore teachable - is
# outcome-driven selection, not engineering conservatism. Both ends of that band are equally
# inferred; neither is better evidenced. The consequence is load-bearing: at 30000 m3/h capacity
# would be 120.6 kW and saturation would need f_exhaust < 0.255, a near-impossible condition, so
# the teaching moment this design is built around would disappear. P4 must settle it against a
# real datasheet, and if the real unit is the 30000 m3/h class the saturation narrative changes.
risks:
  - id: ahu-airflow-outcome-driven
    severity: med
    detail: "AHU airflow chosen at the low end of an inferred band because it produces the desired saturation behaviour; resolve against a datasheet at P4"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 3, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 3}
  tier: complex                   # sum = 22

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: EQUIPOS-PENDIENTES.md
    qa_tools: research/tools/
    design_dir_root: disenos/
    qa_lock: disenos/catalog/tools/qa-lock.sh
    qa_port: 8137                 # own port, verified 2026-08-13 (own asset 200 / alien path 404)

references:
  - source: disenos/nave-3sistemas/P1-RESEARCH.md
    evidences: "all engineering constants, equipment dimensions and the coupling arithmetic, each with its own citation and certainty marker"
    suitability: pass
  - source: disenos/nave-3sistemas/P1-AMENDMENT.md
    evidences: "compressor-room exhaust model, re-derived load balance, and the 18-fixture 6x3 lighting grid"
    suitability: pass
  - source: disenos/compresor-tornillo-aire/design-spec.yaml
    evidences: "rotary screw compressor cabinet 2.0 x 1.2 x 1.7 m and its material palette, already gated in this repo"
    suitability: pass
  - source: disenos/compresor-tornillo-aire/refs/ref-sala-sistema-1.png
    evidences: "real plant-room layout of compressor plus receiver plus dryer, used for the compressor-room arrangement only"
    suitability: conditional
    assumptions: "used for ARRANGEMENT and relative placement only, never for the bay envelope or the HVAC and lighting systems"
  - source: disenos/ahu/ahu-realistic-v1.html
    evidences: "air handling unit proportions 3.5 x 1.6 x 2.0 m for the 20000 to 30000 m3/h class, repo-gated"
    suitability: pass

dimensions_real:
  # --- bay envelope (P1 §1) ---
  # P1 marks the three envelope dimensions [INFER - from subject brief]. They carry confidence
  # high here because for a SYNTHETIC scene the brief IS the authority: 40 x 20 x 8 m is a
  # design requirement to build to, not a measurement of an existing building. Everything
  # derived from them (areas, volume, loads) inherits that standing.
  bay_length_m: {value: 40.0, confidence: high}
  bay_width_m: {value: 20.0, confidence: high}
  bay_clear_height_m: {value: 8.0, confidence: high}
  bay_floor_area_m2: {value: 800.0, confidence: high}
  bay_volume_m3: {value: 6400.0, confidence: high}
  bay_envelope_area_m2: {value: 1760.0, confidence: high}
  column_bay_spacing_m: {value: 8.0, confidence: med}

  # --- HVAC (P1 §2a, repo-gated AHU) ---
  ahu_length_m: {value: 3.5, confidence: high}
  ahu_width_m: {value: 1.6, confidence: high}
  ahu_height_m: {value: 2.0, confidence: high}
  # P1 §2a gives 20000-30000 m3/h as an [INFER] band from the unit size, so this is a CHOICE
  # within a range, not a measurement. The conservative lower bound is selected deliberately:
  # it is what makes AHU saturation reachable and therefore teachable. At 30000 m3/h capacity
  # would be 120.6 kW and the saturation threshold would move to f ~ 0.78, a different regime.
  # confidence: med keeps it pre-authorised for a P4 refine-spec amendment.
  ahu_airflow_m3h: {value: 20000.0, confidence: med}
  # 5.56 m3/s x 1.2 x 1005 x 12 K. confidence: med, INHERITED - a derived value can never carry
  # more confidence than its least-certain input, and the airflow above is a choice inside an
  # inferred band. P4 must settle both against a real AHU datasheet together.
  ahu_capacity_kw: {value: 80.4, confidence: med}
  ahu_fan_diameter_m: {value: 0.9, confidence: med}

  # --- refrigerant side (SCOPE-AMENDMENT-2, user-requested 2026-08-13) ---
  # The design modelled only the AIR side, so heat entered the plant and stopped existing as a kW
  # figure. A real bay HVAC is a circuit with two ends: an evaporator that picks the heat up inside
  # and a condenser that throws it at the sky. Building both is what lets a viewer FOLLOW the heat
  # instead of taking the dashboard's word for it — the same reason the exhaust louvers were built.
  #
  # Condenser sized against what it must actually reject = cooling load + compressor work:
  #   base case  33.1 + 11.0 =  44 kW
  #   worst case (exhaust off) 100.7 + 33.6 = 134 kW
  # A 60 kW class air-cooled unit covers the base case with headroom and is honestly undersized at
  # the worst case — which is CORRECT and teachable: it is the same saturation story the AHU tells.
  # These are CLASS estimates, not datasheet readings, hence confidence: low (pre-authorised for a
  # P4 amendment against a real unit).
  condenser_length_m: {value: 2.2, confidence: low}
  condenser_width_m: {value: 1.1, confidence: low}
  condenser_height_m: {value: 1.3, confidence: low}
  condenser_capacity_kw: {value: 60.0, confidence: low}
  condenser_fan_count: {value: 2, confidence: low}
  condenser_fan_diameter_m: {value: 0.63, confidence: low}
  evaporator_coil_face_m2: {value: 4.5, confidence: low}
  # Two refrigerant lines. The suction line is larger and insulated (cold gas back to the
  # condenser); the liquid line is smaller and bare. Diameters are class-typical for this capacity.
  suction_line_diameter_m: {value: 0.054, confidence: low}
  liquid_line_diameter_m: {value: 0.022, confidence: low}
  trunk_duct_diameter_m: {value: 0.95, confidence: med} # 5.56 m3/s at 8 m/s face velocity
  diffuser_count: {value: 8, confidence: med}

  # --- lighting (P1 §3, amended) ---
  luminaire_count: {value: 18, confidence: high}
  luminaire_grid_cols: {value: 6, confidence: high}
  luminaire_grid_rows: {value: 3, confidence: high}
  luminaire_spacing_m: {value: 6.67, confidence: high}
  luminaire_mount_height_m: {value: 7.0, confidence: high}
  luminaire_diameter_m: {value: 0.35, confidence: high}
  luminaire_body_height_m: {value: 0.22, confidence: high}
  luminaire_power_w: {value: 200.0, confidence: high}
  luminaire_lumens: {value: 29000.0, confidence: high}

  # --- compressed air (P1 §4) ---
  compressor_room_length_m: {value: 10.0, confidence: med}
  compressor_room_width_m: {value: 6.0, confidence: med}
  compressor_room_height_m: {value: 4.0, confidence: med}
  compressor_lead_cabinet_l_m: {value: 2.0, confidence: high}
  compressor_lead_cabinet_w_m: {value: 1.2, confidence: high}
  compressor_lead_cabinet_h_m: {value: 1.7, confidence: high}
  # The 55 kW lag unit sits in the SAME 45-75 kW cabinet class as the 75 kW lead, for which the
  # cited range is ~1.9-2.4 m long. An earlier 1.8 x 1.1 x 1.6 m was invented and fell BELOW that
  # range - corrected to the range's lower bound, with width and height held at the class values
  # rather than scaled by guesswork. confidence: low, so P4 may amend it against a real datasheet.
  compressor_lag_cabinet_l_m: {value: 1.9, confidence: low}
  compressor_lag_cabinet_w_m: {value: 1.2, confidence: low}
  compressor_lag_cabinet_h_m: {value: 1.7, confidence: low}
  receiver_diameter_m: {value: 0.91, confidence: high}
  receiver_height_m: {value: 2.36, confidence: high}
  receiver_volume_l: {value: 1514.0, confidence: high}
  dryer_length_m: {value: 0.8, confidence: high}
  dryer_width_m: {value: 0.6, confidence: high}
  dryer_height_m: {value: 1.4, confidence: high}
  # TWO louver openings, one per exhaust fan. The pair spans 2.4 m, which is what the
  # exhaust_louvers attachment models; a single 1.2 m width alongside a 2.4 m attachment span was
  # a factor-of-2 incoherence that would have built geometry contradicting this very block.
  exhaust_louver_count: {value: 2, confidence: high}
  exhaust_louver_width_m: {value: 1.2, confidence: med}
  exhaust_louver_pair_span_m: {value: 2.4, confidence: high}
  exhaust_fan_count: {value: 2, confidence: high}
  exhaust_fan_diameter_m: {value: 0.63, confidence: med}
  header_pipe_diameter_m: {value: 0.08, confidence: med}

simulation_constants:
  # Every constant traceable to P1-RESEARCH.md §5 or P1-AMENDMENT.md. The pure sim core
  # (src/sim/constants.mjs) must carry these same values with the same citations in comments.
  cop_hvac: {value: 3.0, source: "P1 §2c", confidence: 0.85}
  supply_air_c: {value: 14.0, source: "P1 §2d", confidence: 0.75}
  return_air_c: {value: 26.0, source: "P1 §2d", confidence: 0.75}
  delta_t_k: {value: 12.0, source: "P1 §2d", confidence: 0.75}
  envelope_u_w_m2k: {value: 0.30, source: "P1 §1 ASHRAE metal building", confidence: 0.85}
  infiltration_ach: {value: 0.5, source: "P1 §5a", confidence: 0.6}
  person_sensible_w: {value: 80.0, source: "P1 §5a ASHRAE Fundamentals", confidence: 0.7}
  air_density_kg_m3: {value: 1.2, source: "standard air", confidence: 0.95}
  air_cp_j_kgk: {value: 1005.0, source: "standard air", confidence: 0.95}
  compressor_lead_rated_kw: {value: 75.0, source: "P1 §4a", confidence: 0.9}
  compressor_lead_fad_cfm: {value: 466.0, source: "P1 §4a", confidence: 0.9}
  compressor_lag_rated_kw: {value: 55.0, source: "P1 §4a", confidence: 0.9}
  compressor_lag_fad_cfm: {value: 357.0, source: "P1 §4a", confidence: 0.9}
  loaded_kw_fraction: {value: 0.98, source: "P1 §4f gobernador", confidence: 0.9}
  unloaded_kw_fraction: {value: 0.30, source: "P1 §4f gobernador", confidence: 0.9}
  vsd_base_fraction: {value: 0.22, source: "P1 §4f gobernador", confidence: 0.9}
  vsd_slope_fraction: {value: 0.78, source: "P1 §4f gobernador", confidence: 0.9}
  band_low_psi: {value: 115.0, source: "GOAL.md + gobernador", confidence: 0.95}
  band_high_psi: {value: 120.0, source: "GOAL.md + gobernador", confidence: 0.95}
  lag_start_hysteresis_psi: {value: 2.0, source: "P1 §5d", confidence: 0.6}
  unload_timer_s: {value: 5.0, source: "P1 §5d gobernador default", confidence: 0.6}
  dryer_kw: {value: 6.0, source: "P1 §4c", confidence: 0.7}
  exhaust_fraction_default: {value: 0.85, source: "P1-AMENDMENT §B", confidence: 0.7}

invariants:
  # Asserted ON LOAD by the test suite (GATES.md: test the load, not just the interaction).
  # The test DERIVES each value from first principles rather than importing the constant it
  # guards - a test that copies its constant cannot catch a wrong constant.
  #
  # Room heat includes the refrigerated dryer: it stands INSIDE the compressor room, so its
  # 6 kW follows the same exhaust path as the compressor packages. Fixed room heat is therefore
  # 133.4 kW at full load, not 127.4 kW.
  #
  # Fixed (non-compressor) load at tout 35 degC, 40 people, closed doors:
  #   lighting 3.60 + envelope 4.752 + people 3.20 + infiltration 9.60 = 21.152 kW

  # (a) BOOT STATE - what a cold page load actually shows. Default inputs: demand 380 cfm, so
  #     only the lead compressor runs (466 cfm FAD covers it); exhaust 85 %.
  boot_cooling_load_kw: {value: 33.08, tolerance: 0.3}
  boot_hvac_draw_kw: {value: 11.03, tolerance: 0.1}
  boot_lighting_kw: {value: 3.60, tolerance: 0.01}
  boot_running_compressors: {value: 1, tolerance: 0}

  # (b) FULL PRODUCTION - both units loaded, the case P1-AMENDMENT §B is written against.
  full_load_cooling_load_kw: {value: 41.16, tolerance: 0.3}
  full_load_hvac_draw_kw: {value: 13.72, tolerance: 0.1}
  worst_case_cooling_load_kw: {value: 154.55, tolerance: 0.5}  # f_exhaust = 0, both loaded

  # (c) The teaching moment: AHU capacity 80.4 kW is exceeded once
  #     21.152 + (1 - f) x 133.4 > 80.4  =>  f < 1 - (80.4 - 21.152) / 133.4 = 0.5559
  ahu_saturates_when_exhaust_below: {value: 0.5559, tolerance: 0.005}

hierarchy:
  - name: root
    children:
      - name: bay_structure
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: floor_slab
            pivot: [0, 0, 0]
            animation: none
          - name: column_grid
            pivot: [0, 0, 0]
            animation: none
          - name: roof_trusses
            pivot: [0, 8.0, 0]
            animation: none
          - name: wall_cladding
            pivot: [0, 0, 0]
            animation: "custom: layer visibility toggle, not a transform"
      - name: hvac_system
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: ahu_rooftop
            pivot: [-12.0, 8.6, 0.0]
            animation: none
          - name: ahu_supply_fan
            pivot: [-13.2, 9.0, 0.0]
            animation: spin_x
          - name: ahu_return_fan
            pivot: [-10.8, 9.0, 0.0]
            animation: spin_x
          - name: supply_riser
            pivot: [-12.0, 8.6, 0.0]   # = local_start (build root->tip)
            animation: none
            attachment:
              parent_socket: ahu_supply_outlet
              local_start: [-12.0, 8.6, 0.0]
              local_end: [-12.0, 6.8, 0.0]
              length_confidence: high
              contact_type: embedded
              embed_depth: 0.12
              gap_tolerance: 0.0
          - name: trunk_duct
            pivot: [-12.0, 6.8, 0.0]
            animation: none
            attachment:
              parent_socket: supply_riser_bottom
              local_start: [-12.0, 6.8, 0.0]
              local_end: [16.0, 6.8, 0.0]
              length_confidence: med
              contact_type: embedded
              embed_depth: 0.10
              gap_tolerance: 0.0
          - name: diffuser_array
            pivot: [-10.0, 6.55, 0.0]  # = local_start, NOT the centre: a codegen that treats the
                                       # pivot as the mesh origin would otherwise shift the whole
                                       # run 10 m along the bay
            animation: none
            attachment:
              parent_socket: trunk_duct_underside
              local_start: [-10.0, 6.55, 0.0]
              local_end: [14.0, 6.55, 0.0]
              length_confidence: med
              contact_type: surface-contact
              overlap: 0.06
              gap_tolerance: 0.0
      - name: lighting_system
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: luminaire_grid
            pivot: [0, 7.0, 0]
            animation: "custom: emissive intensity and PointLight intensity driven by dim fraction"
          - name: luminaire_pendants
            pivot: [0.0, 7.85, 0.0]    # = local_start at the truss, tip hangs down to 7.22
            animation: none
            attachment:
              parent_socket: roof_truss_underside
              local_start: [0.0, 7.85, 0.0]
              local_end: [0.0, 7.22, 0.0]
              length_confidence: high
              contact_type: embedded
              embed_depth: 0.05
              gap_tolerance: 0.0
      - name: compressed_air_system
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: compressor_room_enclosure
            pivot: [14.0, 0.0, -6.0]
            animation: "custom: wall visibility toggle exposing the interior"
          - name: exhaust_louvers
            pivot: [19.0, 2.4, -7.2]   # = local_start; spans the 2.4 m TWO-louver pair
            # CORRECTED 2026-08-13 by the blockout preflight. The louvers were `animation: none`
            # and the exhaust fraction only drove FAN SPIN — which is invisible in a still frame.
            # The contract shot `coupling-exhaust-off` therefore rendered pixel-identical to the
            # default view, and the preflight refused the evidence chain. The deeper problem was
            # not the shot: the single most instructive control in the whole design had NO static
            # visual expression, so a user dragging it would see the dashboard move and the 3D
            # sit still. Motorised damper blades are how a real compressor-room exhaust modulates,
            # so the blades now carry the fraction: fully open at f=0.95, shut at f=0.
            animation: "custom: blade angle 0..90 deg, angle = 90 x exhaust_fraction"
            blades:
              count_per_louver: 6
              blade_pivot_axis: z
              open_angle_deg: 90       # 90 = fully open (blades edge-on, aperture clear)
              shut_angle_deg: 0        # 0 = blades flat, aperture closed, heat stays in the room
            attachment:
              parent_socket: enclosure_exterior_wall
              local_start: [19.0, 2.4, -7.2]
              local_end: [19.0, 3.6, -4.8]
              length_confidence: med
              contact_type: embedded
              embed_depth: 0.08
              gap_tolerance: 0.0
          - name: exhaust_fans
            pivot: [19.05, 3.0, -6.0]
            animation: "custom: spin_x, rate proportional to exhaust fraction, stopped at 0"
          - name: compressor_lead
            pivot: [11.0, 0.0, -7.5]
            animation: "custom: state machine stop | loaded | unloaded | fault"
          - name: compressor_lead_cooling_fan
            pivot: [11.0, 1.5, -7.5]
            animation: spin_y
          - name: compressor_lag
            pivot: [11.0, 0.0, -4.5]
            animation: "custom: state machine stop | loaded | unloaded | fault"
          - name: compressor_lag_cooling_fan
            pivot: [11.0, 1.4, -4.5]
            animation: spin_y
          - name: receiver_tank
            pivot: [15.5, 0.0, -7.5]
            animation: none
          - name: refrigerated_dryer
            pivot: [15.5, 0.0, -5.0]
            animation: none
          - name: air_header_piping
            pivot: [11.0, 1.7, -7.5]
            animation: none
            attachment:
              parent_socket: compressor_lead_discharge
              local_start: [11.0, 1.7, -7.5]
              local_end: [15.5, 2.36, -7.5]
              length_confidence: med
              contact_type: socket
              embed_depth: 0.06
              gap_tolerance: 0.0
          - name: distribution_main
            pivot: [15.5, 2.36, -7.5]
            animation: none
            attachment:
              parent_socket: receiver_outlet
              local_start: [15.5, 2.36, -7.5]
              local_end: [-14.0, 5.5, -7.5]
              length_confidence: low
              contact_type: socket
              embed_depth: 0.05
              gap_tolerance: 0.0
      - name: scale_reference_figure
        pivot: [4.0, 0.0, 2.0]
        animation: none

