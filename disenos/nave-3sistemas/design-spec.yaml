critical_features:
  - id: compressor-room-enclosure
    desc: "the compressor room reads as a WALLED enclosure inside the bay, with exhaust louvers and fans on its exterior wall; it is visibly a boundary heat does or does not cross, not equipment standing loose on the slab"
    threshold: 0.78
  - id: luminaire-grid
    desc: "18 UFO highbay luminaires in a visibly REGULAR 6 by 3 grid at 7 m, each reading as a finned aluminium disc with a lit lens - not emissive boxes, and not a scattered arrangement"
    threshold: 0.75
  - id: ahu-and-duct-run
    desc: "the rooftop AHU connects to the bay through a visible riser and a trunk duct with diffusers; the air path is continuous from unit to space, with no floating duct segments"
    threshold: 0.75
  - id: compressor-skid-identity
    desc: "each compressor reads as a rotary screw package - enclosed canopy with cooling-fan grille - alongside a vertical receiver and a dryer, joined by real piping"
    threshold: 0.75
  - id: bay-structure
    desc: "the bay reads as a real industrial building - column grid, roof trusses, clad walls at 40 by 20 by 8 m - not a hollow box"
    threshold: 0.75

important_features:
  - id: compressed-air-distribution
    desc: "the header rises from the receiver and runs the bay at high level, sensibly routed rather than cutting through structure"
  - id: scale-reference-figure
    desc: "a 1.8 m human figure makes the 8 m clear height and the equipment sizes legible at a glance"

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 800
    tris: 2000000

camera:
  azimuth_deg: 42
  elevation_deg: 24
  fov: 55
  deviation_note: >-
    TRACK-THREEJS prescribes 70-90 for a plant scene and 32-42 for an equipment hero. Neither fits.
    The canvas is not full-screen here - it shares the viewport with the dashboard, which is the
    primary deliverable - so a plant-grade FOV in a narrow canvas would barrel the equipment and a
    hero-grade FOV cannot hold a 40 m bay. 55 keeps the whole bay framed without caricaturing the
    proportions. Recorded as a deliberate deviation, not an oversight.

lighting: house-rig
lighting_notes: >-
  Headless track. No RectAreaLight - it stalls the SwiftShader shader compile and the probe returns
  0 draws (LEARNINGS 2026-07-22). No MeshPhysicalMaterial.transmission for the same reason;
  clearcoat is safe. Bare metal uses material.envMapIntensity 1.9 plus a HemisphereLight and a
  frontal DirectionalLight fill - scene.environmentIntensity does not exist in r160 and is a
  silent no-op. The 18 luminaires do NOT each get a shadow-casting PointLight; a small pool of
  non-shadow PointLights plus emissive lenses carries the read, or the draw budget dies.

ui_controls:
  # Every control is URL-addressable - the capture harness drives states by URL only, never by
  # clicking (GATES.md: the capture URL is a first-class code path).
  - id: dim
    label: "Lighting dimming"
    type: slider
    range: [0, 100]
    unit: "%"
    default: 0
    drives: "Q_light, lighting kW, luminaire emissive and PointLight intensity, cooling load, HVAC kW"
  - id: exhaust
    label: "Compressor-room exhaust"
    type: slider
    range: [0, 95]
    unit: "%"
    default: 85
    drives: "Q_comp_bay, cooling load, HVAC kW, AHU saturation alarm, exhaust fan spin rate"
  - id: demand
    label: "Process air demand"
    type: slider
    range: [0, 800]
    unit: cfm
    default: 380
    drives: "header pressure, compressor load state, compressor kW, Q_comp"
  - id: tout
    label: "Outdoor temperature"
    type: slider
    range: [20, 42]
    unit: "degC"
    default: 35
    drives: "Q_envelope, Q_infiltration, cooling load, HVAC kW"
  - id: people
    label: "Occupancy"
    type: slider
    range: [0, 60]
    unit: persons
    default: 40
    drives: "Q_people, cooling load"
  - id: leadmode
    label: "Lead compressor drive"
    type: toggle
    values: [fixed, vsd]
    default: fixed
    drives: "compressor kW curve, unloaded losses, specific power"
  - id: recovery
    label: "Heat recovery"
    type: toggle
    values: [off, on]
    default: off
    drives: "f_recover, Q_comp_bay, recovered kW readout"
  - id: layers
    label: "Visibility layers"
    type: multi-toggle
    values: [roof, walls, ducts, enclosure, flow]
    # CORRECTED 2026-08-13 after the blockout pre-look. The previous default [ducts, flow] switched
    # OFF walls, roof and the compressor-room enclosure, so the default view showed a floor slab
    # with loose columns and loose boxes: THREE of the five critical features - bay-structure,
    # compressor-room-enclosure and compressor-skid-identity - were invisible in the very shots
    # meant to frame them. A blind judge would have scored absence that was a layer default, not
    # a build defect. Roof stays OFF (open-plan is the digital-twin convention for seeing inside);
    # walls and enclosure must be ON so the bay reads as a building and the compressor room reads
    # as the boundary heat does or does not cross.
    default: [walls, ducts, enclosure, flow]
    drives: "scene visibility only - never a simulation value"
  - id: tick
    label: "Simulation clock"
    type: number
    range: [0, 86400]
    unit: s
    default: 0
    drives: "pins the animation clock so captures never race - deterministic evidence"
  - id: view
    label: "Camera preset"
    type: enum
    # `exhaust-wall` added 2026-08-13: the compressor-room camera sits on the far side of the
    # enclosure, so the damper-open vs damper-shut pair rendered pixel-identical. A feature that
    # no camera frames cannot be evidenced - the answer is another preset, never deleting the
    # geometry standing in the way.
    # `compressor-skid` added 2026-08-13 after the blockout meta-analysis. The packages carry the
    # right surface features, but they sit small in a wide shot and a blind judge reads a
    # DOWNSCALED render, so it reported them absent - twice, and the score FELL while the build
    # improved. A feature whose detail does not survive the resample needs a closer camera, not
    # more geometry (GATES.md: fine detail requires a native-resolution view).
    values: [hero, exterior, compressor-room, compressor-skid, exhaust-wall, luminaire-grid, luminaire-plan, ahu-roof, duct-run]
    default: hero
    drives: "camera only - one preset per critical feature so the gate can frame each one"
