<script type="module" id="app">
// ============================================================================
// RECUPERADOR DE ENERGÍA — RUEDA ENTÁLPICA (ERV/HRV) · Voxel Art 3D (SCADA dark)
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Gabinete: 1.80 × 1.60 × 1.40 m  =  72 × 64 × 56 vox  (X × Y × Z)
//   Rueda entálpica: Ø 1.20 m (R=24 vox) girando en plano XY sobre eje Z.
//   Flujo AXIAL a lo largo de Z; partición Y=32/33 separa el paso superior
//   (aire exterior→suministro) del inferior (retorno→expulsión); ambos
//   cruzan a través de la rueda giratoria (recuperación entálpica).
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  CAB:    { c:0xb8bec6, r:0.72, m:0.20 },   // gabinete gris claro
  CAB_D:  { c:0x9aa1aa, r:0.75, m:0.20 },
  CAB_L:  { c:0xd0d6dc, r:0.68, m:0.15 },
  CAB_J:  { c:0x8a929b, r:0.78, m:0.25 },   // juntas / paneles
  MET:    { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:  { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:  { c:0xbcc4cc, r:0.30, m:0.90 },
  PAN:    { c:0xaeb6bd, r:0.35, m:0.90 },   // charola galvanizada
  BASE:   { c:0x2a2e35, r:0.85, m:0.20 },   // base / patas
  FILT:   { c:0xe8ddc0, r:0.92, m:0.00 },   // filtro crema
  FILT_D: { c:0xcfc3a2, r:0.92, m:0.00 },
  BRZ_L:  { c:0xe0a94f, r:0.42, m:0.70 },   // matriz panal dorado/bronce
  BRZ:    { c:0xc98b3c, r:0.45, m:0.65 },
  BRZ_D:  { c:0x8f5f26, r:0.55, m:0.55 },
  WHEELFR:{ c:0xb0b7be, r:0.32, m:0.90 },   // aro y cubo de la rueda
  HUB:    { c:0x3a3f47, r:0.50, m:0.70 },
  BLK:    { c:0x0b0d11, r:0.80, m:0.20 },
  YEL:    { c:0xffc400, r:0.75, m:0.00 },
  WHT:    { c:0xe8edf2, r:0.60, m:0.10 },
  TEAL:   { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  DISP:   { c:0x04060a, r:0.95, m:0.00 },
  GRN:    { c:0x1f9d55, r:0.50, m:0.20, e:0x1f9d55, ei:0.40 }, // aire exterior
  BLU:    { c:0x3aa0ff, r:0.50, m:0.20, e:0x3aa0ff, ei:0.50 }, // suministro
  ORN:    { c:0xff7a30, r:0.50, m:0.20, e:0xff7a30, ei:0.50 }, // retorno
  GRYX:   { c:0x8892a0, r:0.55, m:0.40, e:0x8892a0, ei:0.18 }  // expulsión
};

// ====== ACUMULADORES DE VOXELES ======
const cells = new Map();     // estructura fija (siempre visible)
const cutCells = new Map();  // pared frontal removible (toggle CORTE)
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function cvox(x, y, z, c) { cutCells.set(K(x, y, z), c); }
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function cfill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cvox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }
function ringZ(x0, x1, y0, y1, z0, z1, c) {
  for (let z = z0; z <= z1; z++) {
    fill(x0, x1, y0, y0, z, z, c); fill(x0, x1, y1, y1, z, z, c);
    fill(x0, x0, y0, y1, z, z, c); fill(x1, x1, y0, y1, z, z, c);
  }
}

// ============================================================================
// GABINETE (X 0..71 = 1.80 m · Y 0..63 = 1.60 m · Z 0..55 = 1.40 m)
// ============================================================================
// -- Base / patas
fill(2, 69, 0, 3, 4, 51, 'BASE');
for (const cx of [4, 66]) for (const cz of [6, 49]) fill(cx - 1, cx + 1, 0, 3, cz - 1, cz + 1, 'BLK');
// -- Piso y charola
fill(2, 69, 4, 5, 2, 53, 'CAB_D');
// -- Techo con dithering
for (let x = 2; x <= 69; x++) for (let z = 2; z <= 53; z++) {
  let c = 'CAB'; const h = hash2(x, z) % 100;
  if (h < 12) c = 'CAB_D'; else if (h >= 88) c = 'CAB_L';
  if (x % 18 === 0 || z % 18 === 0) c = 'CAB_J';
  vox(x, 62, z, c); vox(x, 63, z, c);
}
// -- Pared lateral LEJANA (X 0..1) con juntas de panel
for (let y = 4; y <= 63; y++) for (let z = 0; z <= 55; z++) {
  let c = 'CAB'; const h = hash2(y, z) % 100;
  if (h < 10) c = 'CAB_D'; else if (h >= 90) c = 'CAB_L';
  if (y % 20 === 0 || z % 18 === 0) c = 'CAB_J';
  vox(0, y, z, c); vox(1, y, z, c);
}
// -- Cara EXTERIOR (Z 0..1) y cara INTERIOR (Z 54..55)
fill(2, 69, 4, 63, 0, 1, 'CAB');
fill(2, 69, 4, 63, 54, 55, 'CAB');
// -- Marco / bastidor de aristas (metal)
fill(0, 1, 4, 63, 0, 1, 'MET_D'); fill(0, 1, 4, 63, 54, 55, 'MET_D');
fill(2, 69, 4, 5, 0, 1, 'MET_D'); fill(2, 69, 4, 5, 54, 55, 'MET_D');
fill(2, 69, 62, 63, 0, 1, 'MET_D'); fill(2, 69, 62, 63, 54, 55, 'MET_D');
// -- Franja de marca teal (frontal, cara interior)
fill(6, 65, 60, 60, 55, 55, 'TEAL');

// -- Pared lateral CERCANA (X 70..71) => cutCells (removible con CORTE)
for (let y = 4; y <= 63; y++) for (let z = 0; z <= 55; z++) {
  let c = 'CAB'; const h = hash2(y, z + 7) % 100;
  if (h < 10) c = 'CAB_D'; else if (h >= 90) c = 'CAB_L';
  if (y % 20 === 0 || z % 18 === 0) c = 'CAB_J';
  cvox(70, y, z, c); cvox(71, y, z, c);
}
// manija de panel de acceso + bisagras (en la pared removible)
for (const zz of [10, 27, 44]) cvox(70, 33, zz, 'MET_L');
cfill(60, 63, 30, 33, 55, 55, 'BLK'); // manija exterior

// ============================================================================
// PARTICIÓN horizontal (Y 32..33) — separa paso superior / inferior
// ============================================================================
fill(2, 69, 32, 33, 2, 53, 'MET_D');
carve(12, 60, 32, 33, 24, 30);     // hueco para el paso de la rueda

// -- Charola de condensados bajo la rueda
fill(12, 60, 6, 7, 20, 34, 'PAN');
fill(12, 12, 6, 8, 20, 34, 'PAN'); fill(60, 60, 6, 8, 20, 34, 'PAN');
vox(36, 6, 34, 'BLK'); // dren

// -- Alojamiento de la rueda (aros de metal a los lados del disco)
ringZ(10, 62, 7, 59, 23, 24, 'MET');
ringZ(10, 62, 7, 59, 30, 31, 'MET');

// ============================================================================
// CONEXIONES DE DUCTO (4 collarines) + COMPUERTAS
//   OA aire exterior (verde)  EA expulsión (gris)   -> cara exterior Z0
//   SA suministro   (azul)    RA retorno   (naranja) -> cara interior Z55
// ============================================================================
function ductCollar(x0, x1, y0, y1, side, c) {
  if (side < 0) {                       // cara exterior, protruye -Z
    carve(x0, x1, y0, y1, 0, 1);
    ringZ(x0 - 1, x1 + 1, y0 - 1, y1 + 1, -4, -1, c);
    for (let y = y0 + 2; y <= y1 - 2; y += 5) fill(x0, x1, y, y, 0, 0, 'MET_D'); // compuerta
  } else {                              // cara interior, protruye +Z
    carve(x0, x1, y0, y1, 54, 55);
    ringZ(x0 - 1, x1 + 1, y0 - 1, y1 + 1, 56, 59, c);
    for (let y = y0 + 2; y <= y1 - 2; y += 5) fill(x0, x1, y, y, 55, 55, 'MET_D');
  }
}
ductCollar(24, 48, 38, 58, -1, 'GRN');  // OA  aire exterior (arriba, exterior)
ductCollar(24, 48, 8, 28, -1, 'GRYX');  // EA  expulsión      (abajo,  exterior)
ductCollar(24, 48, 38, 58, +1, 'BLU');  // SA  suministro     (arriba, interior)
ductCollar(24, 48, 8, 28, +1, 'ORN');   // RA  retorno        (abajo,  interior)

// ============================================================================
// BANCOS DE FILTROS (crema, plisados) en las entradas OA y RA
// ============================================================================
// -- Filtro OA (paso superior, junto a la cara exterior)
for (let x = 24; x <= 48; x++) { const c = (x % 2) ? 'FILT' : 'FILT_D'; fill(x, x, 38, 58, 6, 9, c); }
ringZ(23, 49, 37, 59, 5, 5, 'MET'); ringZ(23, 49, 37, 59, 10, 10, 'MET');
// -- Filtro RA (paso inferior, junto a la cara interior)
for (let x = 24; x <= 48; x++) { const c = (x % 2) ? 'FILT' : 'FILT_D'; fill(x, x, 8, 28, 45, 48, c); }
ringZ(23, 49, 7, 29, 44, 44, 'MET'); ringZ(23, 49, 7, 29, 49, 49, 'MET');

// ============================================================================
// SECCIÓN DE VENTILADORES (carcasas estáticas; aspas animadas en Groups)
// ============================================================================
function fanShroud(cx, cy, cz) {
  for (let x = -10; x <= 10; x++) for (let y = -10; y <= 10; y++) {
    const r = Math.hypot(x, y);
    if (r >= 9 && r <= 10) { fill(cx + x, cx + x, cy + y, cy + y, cz - 2, cz + 2, 'MET_D'); }
  }
}
fanShroud(36, 48, 44);   // ventilador de SUMINISTRO (paso superior)
fanShroud(36, 18, 11);   // ventilador de EXPULSIÓN  (paso inferior)

// ============================================================================
// MOTOR + BANDA de la rueda entálpica
// ============================================================================
fill(4, 12, 8, 16, 22, 32, 'MET_D');        // motor
fill(6, 10, 10, 14, 21, 21, 'MET');         // brida
fill(11, 13, 11, 13, 25, 29, 'BLK');        // polea motriz
fill(30, 42, 8, 9, 25, 29, 'BLK');          // banda sobre el aro inferior
fill(13, 30, 9, 10, 26, 28, 'BLK');         // tramo de banda motor->rueda

// ============================================================================
// ESCENA / LUCES
// ============================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 280, 680);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(110, 170, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -110; sc.right = 110; sc.top = 120; sc.bottom = -40; sc.near = 5; sc.far = 520;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(36, 32, 27);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(40, 60, -120);
scene.add(rimL);

// ============================================================================
// INSTANCED MESH POR COLOR (voxeles estáticos)
// ============================================================================
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
function buildInstanced(cellMap, target, collector) {
  const byColor = new Map();
  for (const [k, c] of cellMap) {
    if (!byColor.has(c)) byColor.set(c, []);
    byColor.get(c).push(k);
  }
  for (const [cname, keys] of byColor) {
    const def = PAL[cname];
    const mat = new THREE.MeshStandardMaterial({
      color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
    });
    if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
    if (def.t) { mat.transparent = true; mat.opacity = def.t; mat.depthWrite = false; mat.side = THREE.DoubleSide; }
    const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
    const M = new THREE.Matrix4();
    keys.forEach((key, i) => {
      const p = key.split(',');
      M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
      im.setMatrixAt(i, M);
    });
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = !def.t;
    im.receiveShadow = true;
    if (def.t) im.renderOrder = 2;
    im.name = 'vox_' + cname;
    target.add(im);
    if (collector) collector.push(im);
  }
}
const staticMeshes = [];
buildInstanced(cells, scene, staticMeshes);
// Pared frontal removible (grupo aparte para el CORTE)
const cutGroup = new THREE.Group();
buildInstanced(cutCells, cutGroup, staticMeshes);
scene.add(cutGroup);

// ============================================================================
// ESTADO
// ============================================================================
const state = { wheel: true, fan: true, cut: true, rot: false };

// ============================================================================
// RUEDA ENTÁLPICA (Group giratorio · matriz panal · plano XY sobre eje Z)
// ============================================================================
const WCX = 36, WCY = 33, WCZ = 27, WR = 24, WHUB = 4;
const wheelGroup = new THREE.Group();
wheelGroup.position.set(WCX + 0.5, WCY + 0.5, WCZ + 0.5);

const honeyPos = [], corePos = [], framePos = [];
for (let lx = -WR; lx <= WR; lx++) for (let ly = -WR; ly <= WR; ly++) {
  const r = Math.hypot(lx, ly);
  if (r > WR) continue;
  if (r >= WR - 2) {                       // aro exterior
    framePos.push([lx, ly, -2], [lx, ly, -1], [lx, ly, 1], [lx, ly, 2]);
  } else if (r < WHUB) {                    // zona de cubo (se rellena aparte)
    continue;
  } else {
    corePos.push([lx, ly, -1]);            // placa trasera (celdas del panal)
    const wall = (lx % 3 === 0) || (ly % 3 === 0);
    if (wall) honeyPos.push([lx, ly, 1], [lx, ly, 2]);
    else corePos.push([lx, ly, 0]);
  }
}
// radios (spokes) — refuerzan la lectura del giro
for (let s = 0; s < 8; s++) {
  const a = s * Math.PI / 4;
  for (let t = WHUB; t <= WR - 2; t++) {
    honeyPos.push([Math.round(Math.cos(a) * t), Math.round(Math.sin(a) * t), 2]);
  }
}
// cubo + eje
for (let lx = -WHUB; lx <= WHUB; lx++) for (let ly = -WHUB; ly <= WHUB; ly++) {
  if (Math.hypot(lx, ly) <= WHUB) framePos.push([lx, ly, -2], [lx, ly, 3]);
}
for (let lz = -5; lz <= 6; lz++) framePos.push([0, 0, lz]);

function wheelMesh(list, def) {
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, list.length);
  const M = new THREE.Matrix4();
  list.forEach((p, i) => { M.setPosition(p[0], p[1], p[2]); im.setMatrixAt(i, M); });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  wheelGroup.add(im);
}
wheelMesh(corePos, PAL.BRZ_D);
wheelMesh(honeyPos, PAL.BRZ_L);
wheelMesh(framePos, PAL.WHEELFR);
scene.add(wheelGroup);

// ============================================================================
// VENTILADORES (aspas animadas)
// ============================================================================
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
const matBlade = new THREE.MeshStandardMaterial({ color: 0x7d8894, roughness: 0.35, metalness: 0.85, envMapIntensity: 0.5 });
const matHub = new THREE.MeshStandardMaterial({ color: 0x1a1e25, roughness: 0.5, metalness: 0.6 });
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 2.0, 2.0, 1.0));
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.55, 0, 1.2, r, 0.5);
    b.rotation.y = 0.55;
    arm.add(b);
    arm.rotation.z = i * Math.PI * 2 / 5;
    g.add(arm);
  }
  return g;
}
const supFan = buildFan(8); supFan.position.set(36.5, 48.5, 44.5); scene.add(supFan);
const exhFan = buildFan(8); exhFan.position.set(36.5, 18.5, 11.5); scene.add(exhFan);

// ============================================================================
// PARTÍCULAS DE FLUJO (gateadas por VENTILADORES)
// ============================================================================
function emat(hex) {
  return new THREE.MeshStandardMaterial({ color: 0x05070a, emissive: hex, emissiveIntensity: 1.5, roughness: 0.4, metalness: 0.1 });
}
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = []; let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l }); L += l;
  }
  const mat = emat(hex);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 6));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.9, 0.9, 0.9);
    g.add(m); items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k); return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on; if (!on) return;
      for (const it of items) { it.t = (it.t + dt * speed / L) % 1; at(it.t, it.m.position); }
    }
  };
}
const flows = [
  { f: makeFlow([[36, 48, -3], [36, 48, 7], [36, 48, 24]], 0x1f9d55, 13) }, // OA -> rueda (verde)
  { f: makeFlow([[36, 48, 30], [36, 48, 44], [36, 48, 58]], 0x3aa0ff, 13) }, // rueda -> SA (azul)
  { f: makeFlow([[36, 18, 58], [36, 18, 47], [36, 18, 30]], 0xff7a30, 13) }, // RA -> rueda (naranja)
  { f: makeFlow([[36, 18, 24], [36, 18, 11], [36, 18, -3]], 0x8892a0, 13) }  // rueda -> EA (gris)
];
flows.forEach(o => scene.add(o.f.group));

// ============================================================================
// TICK (node-safe, sin renderer)
// ============================================================================
let tNow = 0;
function tick(dt) {
  tNow += dt;
  if (state.wheel) wheelGroup.rotation.z += dt * 1.2;   // giro lento de la rueda
  if (state.fan) { supFan.rotation.z += dt * 11; exhFan.rotation.z -= dt * 11; }
  for (const o of flows) o.f.update(dt, state.fan);
  cutGroup.visible = !state.cut;
}

// ============================================================================
// STATS + EXPORT (harness headless)
// ============================================================================
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  const all = [cells, cutCells];
  for (const m of all) for (const [k, c] of m) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size + cutCells.size, structural: cells.size, cut: cutCells.size,
           wheelVox: honeyPos.length + corePos.length + framePos.length, overwrites: overwrites,
           colors: colors, bounds: { minX, maxX, minY, maxY, minZ, maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, cells: cells };

// ============================================================================
// INIT (solo navegador)
// ============================================================================
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(126, 84, 128);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(36, 32, 27);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bWheel', 'wheel'], ['bFan', 'fan'], ['bCut', 'cut'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? 'on' : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
</body>
