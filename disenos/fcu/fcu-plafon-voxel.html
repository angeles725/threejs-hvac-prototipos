<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAN COIL Oculto de Plafón · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:240px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:56px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.lo  { color:#00ff66; border-color:#00ff66; background:transparent; box-shadow:0 0 8px #00ff6633; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
</head>
<body>
<div id="info">
  <b>FAN COIL OCULTO DE PLAFÓN · 2 TUBOS</b><br>
  <span>Voxel Art · Corte · 1.10 × 0.60 × 0.30 m · 1 voxel = 2 cm</span>
</div>
<div id="legend">
  <div><i style="background:#66ccff"></i> Agua helada</div>
  <div><i style="background:#ff5533"></i> Aire de retorno</div>
  <div><i style="background:#44bbff"></i> Aire de suministro</div>
  <div><i style="background:#8adcd2"></i> Condensados</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>VENTILADOR</label><button id="bFan" class="off">OFF</button></div>
  <div class="row"><label>CORTE</label><button id="bCut" class="on">ON</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 voxel = 0.02 m (micro-voxel)
// FCU real: 1.10 m largo x 0.60 m fondo x 0.30 m alto = 55 x 30 x 15 voxeles.
// (0.1 m/voxel daria un gabinete de 3 voxeles de alto: imposible el detalle interno.)

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 180, 520);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(102, 58, 98);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(30, 17, 15);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 20;
controls.maxDistance = 420;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(85, 110, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-120; sc.right=120; sc.top=120; sc.bottom=-120; sc.near=1; sc.far=400;
sun.shadow.bias = -0.0003;
sun.target.position.set(30, 12, 15);
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-60, 40, -50);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(30, 25, -90);
scene.add(rim);

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200,1200),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.position.set(30, 0, 15);
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(1200, 200, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.set(30, 0.01, 15);
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}
function pipeRun(a, b, color) {
  const dx=Math.sign(b[0]-a[0]), dy=Math.sign(b[1]-a[1]), dz=Math.sign(b[2]-a[2]);
  const len = Math.max(Math.abs(b[0]-a[0]), Math.abs(b[1]-a[1]), Math.abs(b[2]-a[2]));
  for (let i=0;i<=len;i++)
    vox(a[0]+dx*i, a[1]+dy*i, a[2]+dz*i, color);
}

const COL = {
  GALV:     0xc4c8cc,  // gabinete galvanizado claro (shell, corte)
  GALV_D:   0x9aa0a6,  // seams / ribs de gabinete (shell, corte)
  DARK:     0x2a2a2e,
  FRAME:    0x3a3a3e,
  GRILLE:   0x1a1a1e,
  HOUSING:  0x6a6a72,
  HOUSING_D:0x4a4a52,
  MOTOR:    0x55555c,
  COIL:     0x2f8a86,  // serpentin teal
  COIL_H:   0x49b3ad,  // celosia teal clara
  COPPER:   0xb87333,
  TRAY:     0x23262b,  // charola oscura
  PIPE_B:   0x2f5f96,  // tuberia agua helada
  VALVE:    0xd23c3c,  // volante de valvula
  FILT_A:   0x9aa0aa,  // filtro (pliegue claro)
  FILT_B:   0x6a7078,  // filtro (pliegue oscuro)
  PLAFON:   0xcfcabb,
  PLAFON_D: 0xa39e8e,
  CONCRETE: 0x46464c,
  WALL:     0xbfb9a8,
  CABLE:    0x22262c,
  TSTAT:    0xe8e6df,
  DRAIN:    0xd8d8dc,  // tubito de drenaje
};

// ====== DIMENSIONES ======
const YB = 12;          // altura de montaje del gabinete (suspendido)
const L = 55, D = 30, H = 15;   // 1.10 x 0.60 x 0.30 m
const WCX = [15, 37];   // centros de las dos turbinas
const WCY = 7, WCZ = 8;
const u = (x,y,z,c) => vox(x, y+YB, z, c);  // coords locales del gabinete

// ====== LOSA SUPERIOR + VARILLAS ======
for (let x=-8; x<=66; x++)
  for (let z=-6; z<=36; z++)
    vox(x, 34, z, COL.CONCRETE);
const rods = [[4,4],[4,25],[50,4],[50,25]];
rods.forEach(([rx,rz]) => {
  for (let y=27; y<=33; y++) vox(rx, y, rz, COL.DARK);
  vox(rx, 27, rz-1, COL.FRAME); vox(rx, 27, rz+1, COL.FRAME);  // canal de soporte
});

// ====== PLAFÓN (con rejilla de retorno bajo el filtro) ======
for (let x=-12; x<=66; x++)
  for (let z=-6; z<=36; z++) {
    const inOpening = (x>=6 && x<=48 && z>=3 && z<=12);
    if (inOpening) {
      if ((x+z)%2===0) vox(x, 6, z, COL.GRILLE);   // rejilla de retorno en plafon
    } else {
      const seam = (x%12===0 || z%12===0);
      vox(x, 6, z, seam ? COL.PLAFON_D : COL.PLAFON);
    }
  }

// ====== GABINETE (shell galvanizado, corte) ======
// Pared trasera z=0
for (let x=0; x<=54; x++)
  for (let y=0; y<=14; y++)
    u(x, y, 0, COL.GALV);
// Laterales x=0 y x=54 (con pasos de tuberia en x=54)
for (let z=1; z<=28; z++) {
  const bot = z<=18 ? 0 : Math.round((z-18)*0.5);
  const top = z<=18 ? 14 : 14 - Math.round((z-18)*0.5);
  for (let y=bot; y<=top; y++) {
    u(0, y, z, COL.GALV);
    const pipeHole = (z===16 && (y===3 || y===11));
    if (!pipeHole) u(54, y, z, COL.GALV);
  }
}
// Fondo y=0 con abertura de retorno + filtro plano
for (let x=1; x<=53; x++)
  for (let z=1; z<=18; z++) {
    if (x===51 && z===17) continue;                 // barreno de drenaje
    const inOpening = (x>=6 && x<=48 && z>=3 && z<=12);
    if (inOpening) {
      const isRim = (x===6 || x===48 || z===3 || z===12);
      if (isRim) u(x, 0, z, COL.FRAME);
      else u(x, 0, z, (z%2===0) ? COL.FILT_A : COL.FILT_B);  // pliegues del filtro
    } else {
      const seam = (z===13 || z===18 || x===27);
      u(x, 0, z, seam ? COL.GALV_D : COL.GALV);
    }
  }
// Tapa y=14 + costillas
for (let x=1; x<=53; x++)
  for (let z=1; z<=18; z++)
    u(x, 14, z, COL.GALV);
for (const rx of [9, 18, 27, 36, 45])
  for (let z=1; z<=18; z++)
    u(rx, 15, z, COL.GALV_D);
// Plenum de descarga (paneles inclinados)
for (let x=1; x<=53; x++)
  for (let z=19; z<=28; z++) {
    const bot = Math.round((z-18)*0.5);
    u(x, bot, z, COL.GALV);
    u(x, 14-bot, z, COL.GALV);
  }
// Rejilla lineal de suministro (cara z=29)
for (let x=0; x<=54; x++)
  for (let y=4; y<=10; y++) {
    const isRim = (y===4 || y===10 || x===0 || x===54);
    if (isRim) u(x, y, 29, COL.GALV_D);
    else if (x%2===0) u(x, y, 29, COL.GRILLE);      // barras de la rejilla
  }

// ====== DOBLE TURBINA CENTRÍFUGA (carcasas scroll) ======
WCX.forEach(wc => {
  for (let x=wc-5; x<=wc+5; x++)
    for (let y=1; y<=13; y++)
      for (let z=2; z<=13; z++) {
        const dy=y-WCY, dz=z-WCZ;
        const r2 = dy*dy + dz*dz;
        if (r2 <= 36 && r2 >= 25) {
          if (dy>=0 && dz>=1) continue;             // abertura de descarga (frente-arriba)
          u(x, y, z, COL.HOUSING);
        }
      }
  // Placas laterales con oido de succion
  for (const px of [wc-6, wc+6])
    for (let y=1; y<=13; y++)
      for (let z=2; z<=14; z++) {
        const dy=y-WCY, dz=z-WCZ;
        const r2 = dy*dy + dz*dz;
        if (r2 <= 36 && r2 >= 9) u(px, y, z, COL.HOUSING_D);
        else if (r2 < 9 && r2 >= 5) u(px, y, z, COL.DARK);  // aro de succion
      }
});
// Motor central entre turbinas
for (let x=23; x<=29; x++)
  for (let y=4; y<=10; y++)
    for (let z=5; z<=11; z++) {
      const dy=y-WCY, dz=z-WCZ;
      const d2 = dy*dy + dz*dz;
      if (d2 <= 5) u(x, y, z, d2 >= 2 ? COL.MOTOR : COL.DARK);
    }
for (let x=25; x<=27; x++)
  for (let y=1; y<=3; y++)
    for (let z=7; z<=9; z++)
      u(x, y, z, COL.FRAME);                        // pata del motor

// ====== SERPENTÍN A 2 TUBOS (celosía teal) ======
for (let x=3; x<=51; x++)
  for (let y=2; y<=12; y++)
    for (let z=14; z<=16; z++) {
      const isFrame = (x===3 || x===51 || y===2 || y===12);
      if (isFrame) { u(x, y, z, COL.FRAME); continue; }
      if (z===15) { u(x, y, z, COL.COIL_H); continue; }       // nucleo
      u(x, y, z, ((x+y)%2===0) ? COL.COIL : COL.COIL_H);      // celosia de aletas
    }
// U-bends de cobre (lado izquierdo)
for (const y of [3, 5, 7, 9, 11]) {
  u(2, y, 14, COL.COPPER); u(1, y, 14, COL.COPPER);
  u(1, y, 15, COL.COPPER);
  u(1, y, 16, COL.COPPER); u(2, y, 16, COL.COPPER);
}
// Cabezal de cobre (lado derecho) + espigas al muro
for (let y=3; y<=11; y++) u(52, y, 16, COL.COPPER);
u(53, 3, 16, COL.COPPER); u(53, 11, 16, COL.COPPER);

// ====== CHAROLA DE CONDENSADOS + DRENAJE ======
for (let x=2; x<=52; x++)
  for (let z=13; z<=18; z++) {
    u(x, 1, z, COL.TRAY);
    if (x===2 || x===52 || z===13 || z===18) u(x, 2, z, COL.TRAY);  // ceja
  }
// Tubito de drenaje (baja, corre con pendiente y descarga fuera del plafon)
vox(51, YB-1, 17, COL.DRAIN);
vox(51, YB-2, 17, COL.DRAIN);
pipeRun([51, YB-2, 18], [51, YB-2, 28], COL.DRAIN);
pipeRun([51, YB-3, 29], [51, YB-3, 38], COL.DRAIN);

// ====== TUBERÍA DE AGUA HELADA + VÁLVULAS ======
// Suministro (abajo)
pipeRun([55, YB+3, 16], [63, YB+3, 16], COL.PIPE_B);
pipeRun([63, YB+4, 16], [63, 33, 16], COL.PIPE_B);
// Retorno (arriba, con jog a z=18)
pipeRun([55, YB+11, 16], [58, YB+11, 16], COL.PIPE_B);
vox(59, YB+11, 17, COL.PIPE_B);
pipeRun([59, YB+11, 18], [63, YB+11, 18], COL.PIPE_B);
pipeRun([63, YB+12, 18], [63, 33, 18], COL.PIPE_B);
// Valvulas pequenas (cuerpo + volante)
vox(57, YB+4, 16, COL.DARK); vox(57, YB+5, 16, COL.VALVE);
vox(57, YB+12, 16, COL.DARK); vox(57, YB+13, 16, COL.VALVE);

// ====== CAJA DE CONTROL + CABLEADO AL TERMOSTATO ======
for (let x=55; x<=57; x++)
  for (let y=15; y<=21; y++)
    for (let z=20; z<=24; z++)
      if (x===57 || y===15 || y===21 || z===20 || z===24)
        vox(x, y, z, COL.DARK);
pipeRun([56, 22, 22], [56, 30, 22], COL.CABLE);
pipeRun([57, 30, 22], [67, 30, 22], COL.CABLE);
pipeRun([67, 30, 21], [67, 30, 17], COL.CABLE);
pipeRun([67, 29, 17], [67, 18, 17], COL.CABLE);

// ====== MURETE + TERMOSTATO (pieza aparte) ======
for (let z=6; z<=26; z++)
  for (let y=7; y<=30; y++) {
    if (y===30 && z%3===0) continue;                // borde superior irregular
    if (y===29 && z%5===0) continue;
    vox(68, y, z, COL.WALL);
  }
for (let y=12; y<=17; y++)
  for (let z=13; z<=19; z++)
    vox(67, y, z, COL.TSTAT);                       // cuerpo del termostato
vox(66, 12, 15, COL.DARK); vox(66, 12, 17, COL.DARK);  // botones

// ====== INSTANCED MESHES ======
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const SHELL_COLORS = new Set([COL.GALV, COL.GALV_D]);
const shellMats = [], shellMeshes = [];
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const isShell = SHELL_COLORS.has(color);
  const isWater = (color === COL.PIPE_B);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: isShell ? 0.45 : 0.5,
    metalness: isShell ? 0.55 : (isWater ? 0.4 : 0.55),
    transparent: isShell,
    opacity: isShell ? 0.18 : 1.0,
    depthWrite: !isShell,
    side: isShell ? THREE.DoubleSide : THREE.FrontSide,
  });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !isShell && color !== COL.CONCRETE;   // la losa no bloquea el sol
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
  if (isShell) { shellMats.push(mat); shellMeshes.push(mesh); }
}

// ====== TURBINAS (azules, GIRAN — eje a lo largo de X) ======
const wheelMat = new THREE.MeshStandardMaterial({
  color:0x3a7bd5, roughness:0.4, metalness:0.6,
  emissive:0x1f5fc0, emissiveIntensity:0.15
});
const bladeGeo = new THREE.BoxGeometry(0.5, 1.05, 0.5);
const wheels = [];
WCX.forEach(wc => {
  const g = new THREE.Group();
  g.position.set(wc+0.5, WCY+0.5+YB, WCZ+0.5);
  for (let i=0; i<18; i++) {
    const a = (i/18)*Math.PI*2;
    for (let xOff=-4; xOff<=4; xOff++) {
      const b = new THREE.Mesh(bladeGeo, wheelMat);
      b.position.set(xOff, Math.cos(a)*4.2, Math.sin(a)*4.2);
      b.rotation.x = a;
      b.castShadow = true;
      g.add(b);
    }
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 9, 10), wheelMat);
  hub.rotation.z = Math.PI/2;
  g.add(hub);
  scene.add(g);
  wheels.push(g);
});

// ====== LED DE ESTADO (caja de control) ======
const ledMat = new THREE.MeshStandardMaterial({
  color:0xff2233, emissive:0xff2233, emissiveIntensity:1.3,
  roughness:0.25, metalness:0.3
});
const led = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), ledMat);
led.position.set(56.5, 20, 25.2);
scene.add(led);
const ledLight = new THREE.PointLight(0xff2233, 1.1, 12);
ledLight.position.copy(led.position);
scene.add(ledLight);

// ====== DISPLAY DEL TERMOSTATO (canvas) ======
const tCanvas = document.createElement('canvas');
tCanvas.width = 256; tCanvas.height = 192;
const tCtx = tCanvas.getContext('2d');
const tTex = new THREE.CanvasTexture(tCanvas);
tTex.colorSpace = THREE.SRGBColorSpace;
const tPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 3.4),
  new THREE.MeshBasicMaterial({ map:tTex, toneMapped:false })
);
tPlane.rotation.y = -Math.PI/2;
tPlane.position.set(66.94, 15, 16.5);
scene.add(tPlane);

const FAN_LBL = ['OFF','LO','HI'];
const FAN_TMP = ['26.5','24.0','22.5'];
function drawTstat() {
  const on = state.fan > 0;
  tCtx.fillStyle = '#0b0f14';
  tCtx.fillRect(0,0,256,192);
  tCtx.strokeStyle = '#00d4aa66';
  tCtx.lineWidth = 4;
  tCtx.strokeRect(4,4,248,184);
  tCtx.textAlign = 'center';
  tCtx.fillStyle = on ? '#7fe8ff' : '#54626c';
  tCtx.font = '700 64px "JetBrains Mono", ui-monospace, monospace';
  tCtx.fillText(FAN_TMP[state.fan] + '\u00B0', 128, 84);
  tCtx.font = '600 24px "JetBrains Mono", ui-monospace, monospace';
  tCtx.fillStyle = '#5f7a86';
  tCtx.fillText('SET 23.0\u00B0', 128, 124);
  tCtx.fillStyle = on ? '#00ff66' : '#ff4455';
  tCtx.fillText('VENT: ' + FAN_LBL[state.fan], 128, 162);
  tTex.needsUpdate = true;
}

// ====== MÁQUINA DE ESTADOS ======
const COLOR_ON  = new THREE.Color(0x00ff66);
const COLOR_OFF = new THREE.Color(0xff2233);
const state = { fan: 0, corte: true };            // fan: 0=OFF, 1=LO, 2=HI
const WHEEL_SPD = [0, 6, 13];
const AIR_MULT  = [0, 0.55, 1];

function applyState() {
  const on = state.fan > 0;
  ledMat.color.copy(on ? COLOR_ON : COLOR_OFF);
  ledMat.emissive.copy(on ? COLOR_ON : COLOR_OFF);
  ledMat.emissiveIntensity = on ? 1.7 : 1.3;
  ledLight.color.copy(on ? COLOR_ON : COLOR_OFF);
  ledLight.intensity = on ? 1.5 : 1.0;
  wheelMat.emissiveIntensity = state.fan === 0 ? 0.12 : (state.fan === 1 ? 0.4 : 0.65);
  drawTstat();
}
function applyCorte() {
  shellMats.forEach(m => {
    m.transparent = state.corte;
    m.opacity = state.corte ? 0.18 : 1.0;
    m.depthWrite = !state.corte;
    m.side = state.corte ? THREE.DoubleSide : THREE.FrontSide;
    m.needsUpdate = true;
  });
  shellMeshes.forEach(ms => { ms.castShadow = !state.corte; });
}
applyState();
applyCorte();

const bFan = document.getElementById('bFan');
bFan.onclick = () => {
  state.fan = (state.fan + 1) % 3;

// ====== TRAYECTORIAS ======
function polyline(points) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = []; let total = 0;
  for (let i=0; i<pts.length-1; i++) {
    const l = pts[i].distanceTo(pts[i+1]);
    segs.push({ a:pts[i], b:pts[i+1], l0:total, l });
    total += l;
  }
  const v = new THREE.Vector3();
  return {
    at(t) {
      const d = Math.min(t,1) * total;
      for (const s of segs)
        if (d <= s.l0 + s.l) return v.lerpVectors(s.a, s.b, s.l ? (d-s.l0)/s.l : 0);
      return v.copy(pts[pts.length-1]);
    }
  };
}

// Retorno: cuarto -> rejilla de plafon -> filtro -> succion de turbinas
const retPaths = [[10,15],[22,15],[34,37],[46,37]].map(([lx,wx]) => polyline([
  [lx, 2.5, 7.5], [lx, YB-2, 7.5], [lx, YB+1.5, 7.5],
  [lx, YB+4, 8.5], [wx+0.5, YB+7.5, 8.5]
]));
// Suministro: turbina -> serpentin -> plenum -> rejilla lineal -> cuarto
const supPaths = [6,14,22,30,38,46].map(lx => {
  const wx = lx < 26 ? 15.5 : 37.5;
  return polyline([
    [wx, YB+10, 10.5], [lx, YB+8, 12.5], [lx, YB+7.5, 17.5],
    [lx, YB+7.5, 27], [lx, YB+7, 30.5], [lx, YB+5, 37], [lx, YB+3.5, 42]
  ]);
});
// Agua helada: riser -> valvula -> serpentin (sube por cabezal) -> valvula -> riser
const waterPath = polyline([
  [63.5, 33.5, 16.5], [63.5, YB+3.5, 16.5], [57.5, YB+3.5, 16.5],
  [52.8, YB+3.5, 16.9], [52.8, YB+11.5, 16.9],
  [57.5, YB+11.5, 17.2], [59.5, YB+11.5, 18.5],
  [63.5, YB+11.5, 18.5], [63.5, 33.5, 18.5]

const condPath = polyline([

  [51.5, YB-1.5, 17.5], [51.5, YB-1.5, 24], [51.5, YB-2.5, 33],

// ====== PARTÍCULAS ======
function spawn(n, colorHex, size) {
  const arr = [];
  const geo = new THREE.BoxGeometry(size||0.55, size||0.55, size||0.55);
  for (let i=0; i<n; i++) {
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0 }));
    p.userData = { t: Math.random(), seed: Math.random()*10 };
    scene.add(p);
    arr.push(p);
  }
  return arr;
}
const retP  = retPaths.map(() => spawn(6, 0xff5533));
const supP  = supPaths.map(() => spawn(6, 0x44bbff));
const watP  = spawn(14, 0x66ccff, 0.5);
const conP  = spawn(6, 0x8adcd2, 0.4);

function updateFlow(list, path, speed, active, dt, jit) {
  const j = jit || 0.15;
  for (const p of list) {
    if (!active) { p.material.opacity = 0; continue; }
    p.userData.t += dt * speed;
    if (p.userData.t > 1) p.userData.t -= 1;
    const tt = p.userData.t, s = p.userData.seed;
    const pos = path.at(tt);
    p.position.set(
      pos.x + Math.sin(tt*9 + s)*j,
      pos.y + Math.cos(tt*7 + s)*j,
      pos.z + Math.sin(tt*5 + s)*j
    );
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  }
}

// ====== RESIZE ======
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  const spd = WHEEL_SPD[state.fan];
  wheels.forEach((g, i) => { g.rotation.x -= dt * (spd + i*0.4); });

  const airOn = state.fan > 0;
  const mult = AIR_MULT[state.fan];
  retPaths.forEach((path, i) => updateFlow(retP[i], path, 0.22*mult, airOn, dt, 0.3));
  supPaths.forEach((path, i) => updateFlow(supP[i], path, 0.2*mult, airOn, dt, 0.3));
  updateFlow(watP, waterPath, 0.08, airOn, dt, 0.12);   // valvula abre con demanda
  updateFlow(conP, condPath, 0.05, airOn, dt, 0.08);

  controls.update();
  renderer.render(scene, camera);
}
animate();
