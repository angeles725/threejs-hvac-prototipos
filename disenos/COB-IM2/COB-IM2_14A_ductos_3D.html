<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W = D.w/100, H = D.h/100;                 // metros
const cx = W/2, cy = H/2;

// ---------- escena ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF4F6F5);
scene.fog = new THREE.Fog(0xF4F6F5, 90, 220);

const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 600);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd8d4, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(40, 80, 30);
scene.add(sun);

// piso
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(W*1.6, H*1.6),
  new THREE.MeshLambertMaterial({color:0xE9EDEB})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02;
scene.add(ground);
const grid = new THREE.GridHelper(Math.max(W,H)*1.5, Math.round(Math.max(W,H)*1.5/5), 0xC9D4D2, 0xDDE5E3);
grid.position.y = -0.01; scene.add(grid);

// ---------- plano arquitectónico (líneas planas) ----------
const fPos = new Float32Array(D.F.length/4*6);
for(let i=0,j=0;i<D.F.length;i+=4){
  fPos[j++]=D.F[i]/100-cx;   fPos[j++]=0.02; fPos[j++]=cy-D.F[i+1]/100;
  fPos[j++]=D.F[i+2]/100-cx; fPos[j++]=0.02; fPos[j++]=cy-D.F[i+3]/100;
}
const fGeo = new THREE.BufferGeometry();
fGeo.setAttribute('position', new THREE.BufferAttribute(fPos,3));
const floorLines = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({color:0x93A6AE, transparent:true, opacity:.7}));
scene.add(floorLines);

// ---------- ductos: cintas verticales extruidas ----------
const N = D.S.length/6;
const pos = new Float32Array(N*4*3);
const col = new Float32Array(N*4*3);
const idx = new Uint32Array(N*6);
const cGrad = [[0x2F,0x6D,0xB3],[0x2F,0xA3,0xA0],[0x8F,0xBF,0x4D],[0xE8,0xB6,0x2C],[0xE8,0x84,0x2C]];
function bodColor(z){
  let t = Math.min(1, Math.max(0,(z-3.3)/0.8)) * (cGrad.length-1);
  const a = cGrad[Math.floor(t)], b = cGrad[Math.min(cGrad.length-1, Math.floor(t)+1)];
  t -= Math.floor(t);
  return [ (a[0]+(b[0]-a[0])*t)/255, (a[1]+(b[1]-a[1])*t)/255, (a[2]+(b[2]-a[2])*t)/255 ];
}
let zMin=99, zMax=0;
for(let i=0;i<N;i++){
  const o=i*6;
  const x1=D.S[o]/100-cx,   y1=cy-D.S[o+1]/100;
  const x2=D.S[o+2]/100-cx, y2=cy-D.S[o+3]/100;
  const z =D.S[o+4]/100,    h =Math.max(0.15, D.S[o+5]/100);
  zMin=Math.min(zMin,z); zMax=Math.max(zMax,z);
  const p=i*12;
  pos[p]=x1;  pos[p+1]=z;   pos[p+2]=y1;
  pos[p+3]=x2; pos[p+4]=z;   pos[p+5]=y2;
  pos[p+6]=x2; pos[p+7]=z+h; pos[p+8]=y2;
  pos[p+9]=x1; pos[p+10]=z+h; pos[p+11]=y1;
  const c=bodColor(z);
  for(let k=0;k<4;k++){ col[p+k*3]=c[0]; col[p+k*3+1]=c[1]; col[p+k*3+2]=c[2]; }
  const q=i*6, v=i*4;
  idx[q]=v; idx[q+1]=v+1; idx[q+2]=v+2; idx[q+3]=v; idx[q+4]=v+2; idx[q+5]=v+3;
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
dGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
dGeo.setIndex(new THREE.BufferAttribute(idx,1));
dGeo.computeVertexNormals();
const matColor = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
const matGalv  = new THREE.MeshLambertMaterial({color:0xB8C4C9, side:THREE.DoubleSide});
const ducts = new THREE.Mesh(dGeo, matColor);
scene.add(ducts);

// sombra proyectada de los ductos en el piso (líneas tenues)
const sPos = new Float32Array(N*6);
for(let i=0;i<N;i++){
  const o=i*6, p=i*6;
  sPos[p]=D.S[o]/100-cx;   sPos[p+1]=0.015; sPos[p+2]=cy-D.S[o+1]/100;
  sPos[p+3]=D.S[o+2]/100-cx; sPos[p+4]=0.015; sPos[p+5]=cy-D.S[o+3]/100;
}
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
const ductShadow = new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({color:0x0E7C86, transparent:true, opacity:.18}));
scene.add(ductShadow);

// ---------- etiquetas de equipos ----------
const tagGroup = new THREE.Group(); scene.add(tagGroup);
function makeSprite(txt){
  const c=document.createElement('canvas'); const g=c.getContext('2d');
  g.font='600 26px monospace';
  const w=Math.ceil(g.measureText(txt).width)+22;
  c.width=w; c.height=42;
  g.fillStyle='#20303C'; g.beginPath();
  g.roundRect ? g.roundRect(0,0,w,42,8) : g.rect(0,0,w,42); g.fill();
  g.font='600 26px monospace'; g.fillStyle='#fff'; g.textBaseline='middle';
  g.fillText(txt,11,22);
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false}));
  m.scale.set(w/42*0.9, 0.9, 1);
  return m;
}
D.T.forEach(([x,y,txt])=>{
  const s = makeSprite(txt);
  s.position.set(x/100-cx, 4.45, cy-y/100);
  tagGroup.add(s);
});

// ---------- cámara orbital manual ----------
let theta=-0.9, phi=0.95, dist=Math.max(W,H)*0.85, tx=0, ty=1.8, tz=0;
function applyCam(){
  camera.position.set(
    tx + dist*Math.sin(phi)*Math.cos(theta),
    ty + dist*Math.cos(phi),
    tz + dist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(tx,ty,tz);
}
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.b===2 || drag.sh){
    const s=dist/900;
    tx -= (dx*Math.cos(theta+Math.PI/2))*s - (dy*Math.cos(theta))*s*Math.cos(phi);
    tz -= (dx*Math.sin(theta+Math.PI/2))*s - (dy*Math.sin(theta))*s*Math.cos(phi);
  } else {
    theta += dx*0.005;
    phi = Math.min(1.52, Math.max(0.12, phi - dy*0.005));
  }
  applyCam();
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  dist = Math.min(Math.max(dist*(1+e.deltaY*0.0012), 6), 260);
  applyCam();
},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// pellizco táctil
let pinch=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);} },{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2 && pinch){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    dist=Math.min(Math.max(dist*pinch/d,6),260); pinch=d; applyCam();
  }
},{passive:true});

// ---------- toggles ----------
function chip(id, fn){ const el=document.getElementById(id);
  el.onclick=()=>{ el.classList.toggle('on'); fn(el.classList.contains('on')); }; }
chip('tgFloor', v=>{ floorLines.visible=v; });
chip('tgDuct',  v=>{ ducts.visible=v; ductShadow.visible=v; });
chip('tgTags',  v=>{ tagGroup.visible=v; });
chip('tgColor', v=>{ ducts.material = v?matColor:matGalv; });

// ---------- stats ----------
document.getElementById('stats').textContent =
  `${N.toLocaleString()} segmentos de ducto · ${(D.F.length/4).toLocaleString()} líneas de plano · BOD ${zMin.toFixed(2)}–${zMax.toFixed(2)} m · planta ${W.toFixed(0)}×${H.toFixed(0)} m`;

// ---------- loop ----------
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize(); applyCam();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
</script>
