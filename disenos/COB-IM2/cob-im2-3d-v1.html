<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COB-IM2 · Nivel 4 HVAC — 3D</title>
<style>
  :root { --paper:#f4f1ea; --ink:#1f2a37; --rust:#b5532a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0e1116; font-family:'IBM Plex Sans',system-ui,sans-serif; }
  #hud { position:fixed; top:14px; left:14px; z-index:10; background:rgba(20,26,34,.82);
         color:#e7ecf2; padding:14px 16px; border-radius:10px; font-size:13px; line-height:1.5;
         border:1px solid rgba(255,255,255,.08); max-width:280px; }
  #hud h1 { font-size:15px; letter-spacing:.3px; margin-bottom:6px; color:#fff; }
  #hud .sub { color:#9fb0c3; font-size:11px; margin-bottom:10px; }
  #hud .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #hud .sw { width:14px; height:8px; border-radius:2px; flex:none; }
  #hud .k { color:#9fb0c3; }
  #hud .note { margin-top:10px; font-size:10.5px; color:#8494a6; border-top:1px solid rgba(255,255,255,.08); padding-top:8px; }
  #legend label { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  #legend input { accent-color:var(--rust); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <h1>COB-IM2 · Nivel 4 HVAC</h1>
  <div class="sub">Reconstrucción 3D · INBAS · ejes 1–18 (~152 m)</div>
  <div id="legend">
    <label class="row"><input type="checkbox" id="t_duct" checked><span class="sw" style="background:#37b3c4"></span><span>Ductos (red HVAC)</span></label>
    <label class="row"><input type="checkbox" id="t_round" checked><span class="sw" style="background:#e6a13c"></span><span>Tomas redondas</span></label>
    <label class="row"><input type="checkbox" id="t_term" checked><span class="sw" style="background:#4a86e8"></span><span>Difusores / rejillas</span></label>
    <label class="row"><input type="checkbox" id="t_grid" checked><span class="sw" style="background:#9aa7b4"></span><span>Malla de columnas</span></label>
    <label class="row"><input type="checkbox" id="t_ctx" checked><span class="sw" style="background:#6b7480"></span><span>Contexto trazado <span class="k">(aprox)</span></span></label>
  </div>
  <div class="note" id="stats">cargando…</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 120, 320);

const data = await fetch('./cob-im2-floor.json').then(r => r.json());
const F = data.floor;
const W = F.xmax - F.xmin, D = F.ymax - F.ymin;
const mapX = x => x - F.xmin;
const mapZ = y => F.ymax - y;            // B2/nave-panccadia: flip, do NOT mirror

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(W*0.5, 60, D*1.8);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(W/2, 2, D/2);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2.02;

scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x2a2f38, 1.4));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.4);
sun.position.set(W*0.3, 90, D*0.6); scene.add(sun);

// ---- slab ----
const slab = new THREE.Mesh(
  new THREE.BoxGeometry(W+6, 0.3, D+6),
  new THREE.MeshStandardMaterial({ color:0x20262e, roughness:.95 }));
slab.position.set(W/2, -0.15, D/2); scene.add(slab);

// ---- column grid (certified 9.20 m bays) ----
const gridGroup = new THREE.Group();
const CEIL = 4.2;
const colMat = new THREE.MeshStandardMaterial({ color:0x9aa7b4, roughness:.7 });
for (const gx of Object.values(F.gridX)) {
  const col = new THREE.Mesh(new THREE.BoxGeometry(0.5,CEIL,0.5), colMat);
  col.position.set(mapX(gx), CEIL/2, D/2);
  gridGroup.add(col);
}
scene.add(gridGroup);

// ---- duct network (LineSegments at BOD elevation) ----
const dv = [];
for (const d of data.ducts) {
  const z = d.z, p = d.p;
  for (let i=0;i<p.length-1;i++) {
    dv.push(mapX(p[i][0]), z, mapZ(p[i][1]), mapX(p[i+1][0]), z, mapZ(p[i+1][1]));
  }
}
const dg = new THREE.BufferGeometry();
dg.setAttribute('position', new THREE.Float32BufferAttribute(dv,3));
const ductLines = new THREE.LineSegments(dg, new THREE.LineBasicMaterial({ color:0x37b3c4 }));
scene.add(ductLines);

// ---- round takeoffs (cylinders) ----
const roundGroup = new THREE.Group();
const rMat = new THREE.MeshStandardMaterial({ color:0xe6a13c, roughness:.5, metalness:.3 });
for (const r of data.rounds) {
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r.d/2, r.d/2, 0.5, 12), rMat);
  cyl.position.set(mapX(r.x), r.z-0.25, mapZ(r.y));
  roundGroup.add(cyl);
}
scene.add(roundGroup);

// ---- terminals ----
const supply = new Set(['SD','CD','SR','LD']), ret = new Set(['RR','ER']);
const termGroup = new THREE.Group();
const geoT = new THREE.BoxGeometry(0.6,0.12,0.6);
const matS = new THREE.MeshStandardMaterial({ color:0x4a86e8 });
const matR = new THREE.MeshStandardMaterial({ color:0xd9714a });
const matD = new THREE.MeshStandardMaterial({ color:0x8a929c });
for (const t of data.terminals) {
  const m = supply.has(t.t)?matS : ret.has(t.t)?matR : matD;
  const box = new THREE.Mesh(geoT, m);
  box.position.set(mapX(t.x), CEIL-0.15, mapZ(t.y));
  termGroup.add(box);
}
scene.add(termGroup);

// ---- ghosted architectural context (B10: traced, [INFER]) ----
const cv = [];
for (const c of data.context) {
  const p = c.p;
  for (let i=0;i<p.length-1;i++) {
    cv.push(mapX(p[i][0]), 0.03, mapZ(p[i][1]), mapX(p[i+1][0]), 0.03, mapZ(p[i+1][1]));
  }
}
const cg = new THREE.BufferGeometry();
cg.setAttribute('position', new THREE.Float32BufferAttribute(cv,3));
const ctxLines = new THREE.LineSegments(cg, new THREE.LineBasicMaterial({ color:0x6b7480, transparent:true, opacity:.5 }));
scene.add(ctxLines);

// ---- toggles ----
const bind = (id, obj) => document.getElementById(id).addEventListener('change', e => obj.visible = e.target.checked);
bind('t_duct', ductLines); bind('t_round', roundGroup); bind('t_term', termGroup);
bind('t_grid', gridGroup); bind('t_ctx', ctxLines);

document.getElementById('stats').innerHTML =
  `${data.ducts.length.toLocaleString()} tramos de ducto · ${data.rounds.length} tomas · `+
  `${data.terminals.length} terminales · ${Object.keys(F.gridX).length} ejes<br>`+
  `Piso ${W.toFixed(0)}×${D.toFixed(0)} m · ducto @ BOD ${F.bod_median} m · unidad certificada 1 m`;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
