<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">  <!-- inline empty icon: no /favicon.ico 404 (offline console stays clean) -->
<title>COB-IM2 · Nivel 4 HVAC — 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0e1116; font-family:system-ui,sans-serif; }
  #hud { position:fixed; top:14px; left:14px; z-index:10; background:rgba(20,26,34,.82);
         color:#e7ecf2; padding:14px 16px; border-radius:10px; font-size:13px; line-height:1.5;
         border:1px solid rgba(255,255,255,.08); max-width:280px; }
  #hud h1 { font-size:15px; letter-spacing:.3px; margin-bottom:6px; color:#fff; }
  #hud .sub { color:#9fb0c3; font-size:11px; margin-bottom:10px; }
  #hud .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #hud .sw { width:14px; height:8px; border-radius:2px; flex:none; }
  #hud .k { color:#9fb0c3; }
  #hud .note { margin-top:10px; font-size:10.5px; color:#8494a6; border-top:1px solid rgba(255,255,255,.08); padding-top:8px; }
  #legend label { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  #legend input { accent-color:#b5532a; }
  #views { display:flex; gap:6px; margin-top:10px; }
  #views button { flex:1; background:rgba(255,255,255,.06); color:#cfd8e3; border:1px solid rgba(255,255,255,.12);
    border-radius:5px; padding:5px 0; font-size:11px; cursor:pointer; }
  #views button:hover { background:rgba(181,83,42,.35); }
</style>
</head>
<body>
<div id="hud">
  <h1>COB-IM2 · Nivel 4 HVAC</h1>
  <div class="sub">Reconstrucción 3D · INBAS · ejes 1–18 (~152 m) · offline</div>
  <div id="legend">
    <label class="row"><input type="checkbox" id="t_duct" checked><span class="sw" style="background:#37b3c4"></span><span>Ductos (red HVAC)</span></label>
    <label class="row"><input type="checkbox" id="t_round" checked><span class="sw" style="background:#e6a13c"></span><span>Tomas redondas</span></label>
    <label class="row"><input type="checkbox" id="t_term" checked><span class="sw" style="background:#4a86e8"></span><span>Difusores / rejillas</span></label>
    <label class="row"><input type="checkbox" id="t_grid" checked><span class="sw" style="background:#9aa7b4"></span><span>Malla de columnas</span></label>
    <label class="row"><input type="checkbox" id="t_ahu" checked><span class="sw" style="background:#c23b3b"></span><span>AHU / cuarto de máquinas <span class="k">(aprox)</span></span></label>
    <label class="row"><input type="checkbox" id="t_ctx" checked><span class="sw" style="background:#6b7480"></span><span>Contexto trazado <span class="k">(aprox)</span></span></label>
  </div>
  <div id="views">
    <button data-view="graze">Rasante</button>
    <button data-view="plan">Planta</button>
    <button data-view="iso">Iso</button>
  </div>
  <div class="note" id="stats">cargando…</div>
</div>
