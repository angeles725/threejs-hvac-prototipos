<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }

  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:58px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
  #panel button.standby { color:#06080d; border-color:#3aa6ff; background:#3aa6ff; box-shadow:0 0 12px #3aa6ff55; }
  #panel button.alarm   { color:#06080d; border-color:#ff2233; background:#ff2233; box-shadow:0 0 12px #ff223388; animation:blink 1s infinite; }

<body>
<div id="info">
  <b>CHILLER ENFRIADO POR AIRE</b><br>
  <span>Scroll · Serpentín en V · Estructura abierta · Voxel Art</span>
</div>
<div id="legend">
  <div><i style="background:#55ccff"></i> Aire condensador</div>
  <div><i style="background:#ffb347"></i> Refrigerante</div>

</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>VENTILADORES</label><button id="bFan" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 1</label><button id="bC1" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 2</label><button id="bC2" class="standby">STANDBY</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 150, 380);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 900);
camera.position.set(112, 64, 104);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // perf: static sun -> bake shadows once (B5 §5.4)
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(37, 18, 15);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.28));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(60, 130, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-120; sc.right=120; sc.top=120; sc.bottom=-120; sc.near=1; sc.far=320;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 50));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.18).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 50));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700,700),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(700, 116, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}
function beam(x0,x1,y0,y1,z0,z1,color){
  for(let x=x0;x<x1;x++) for(let y=y0;y<y1;y++) for(let z=z0;z<z1;z++) vox(x,y,z,color);
}
function cylX(x0,x1,cy,cz,r,color){
  for(let x=x0;x<=x1;x++)
    for(let y=cy-r;y<=cy+r;y++)
      for(let z=cz-r;z<=cz+r;z++){ const dy=y-cy,dz=z-cz; if(dy*dy+dz*dz<=r*r) vox(x,y,z,color); }
}
function cylY(cx,cz,y0,y1,r,color){
  for(let y=y0;y<=y1;y++)
    for(let x=cx-r;x<=cx+r;x++)
      for(let z=cz-r;z<=cz+r;z++){ const dx=x-cx,dz=z-cz; if(dx*dx+dz*dz<=r*r) vox(x,y,z,color); }
}

const COL = {
  GALV:    0xb9bdc6,
  GALV_D:  0x9296a0,
  SKID:    0xa8acb2,
  DARK:    0x26282d,
  COIL:    0x9aa0a8,
  COIL_H:  0xb4bac2,
  FRAME:   0x2a2c30,
  COPPER:  0xc0762e,
  COMP_BLUE: 0x2f6bc0,
  COMP_BODY: 0x303338,
  COMP_DK:   0x1d1f24,
  PANEL_W: 0xe6e6e2,
  PANEL_D: 0xb6b6b0,
  PLINTH:  0xcccfca,
  SPRING:  0x3a3d44,
  HUB:     0x55555c,
  INSUL:   0x24272d,   // pipe/evaporator insulation (black foam)
  WATER:   0x2f7fb8,   // chilled water (exposed spool)
  TANK:    0x868c94,   // steel tank / separator
  WARN:    0xf2c200,   // warning label yellow
  HOSE:    0x6a6e74,   // braided flex hose
  NAME:    0xd8d8d2,   // nameplate
};

// ====== DIMENSIONS (voxel units) ======
const W = 30;
const NBAYS = 5;
const FAN_BAY = 15;
const TOTAL = NBAYS * FAN_BAY;
const BASE_Y = 4;
const COMP_BASE = BASE_Y + 2;   // compressors sit on the base mounting pan
const COIL_RIDGE = 22;
const COIL_TOP   = 34;
const H_TOP      = 35;
const FRONT = W - 1;

const compCX = [6, 16, 26, 49, 59, 69];
const compCZ = W - 8;
const RISER_Y0 = COMP_BASE + 11;     // dome top

const fanCX = [];
for (let i=0;i<NBAYS;i++) fanCX.push(Math.round(i*FAN_BAY + FAN_BAY/2));
const fanCZ = Math.floor(W/2);
const boundaries = [];
for (let i=0;i<=NBAYS;i++) boundaries.push(i*FAN_BAY);

// ====== PLINTHS + SPRING ISOLATORS ======
function plinth(cx, cz){
  for (let x=cx-1;x<=cx+2;x++)
    for (let z=cz-1;z<=cz+2;z++)
      for (let y=0;y<BASE_Y-1;y++) vox(x,y,z,COL.PLINTH);
  for (let x=cx;x<=cx+1;x++)
    for (let z=cz;z<=cz+1;z++)
      vox(x,BASE_Y-1,z,COL.SPRING);
}
boundaries.forEach(bx=>{
  const px = Math.min(Math.max(bx-1,0), TOTAL-2);
  plinth(px, 0);
  plinth(px, W-3);
});

// ====== OPEN GALVANIZED FRAME ======
beam(0,TOTAL, BASE_Y,BASE_Y+2, 0,2, COL.GALV);
beam(0,TOTAL, BASE_Y,BASE_Y+2, W-2,W, COL.GALV);
beam(0,TOTAL, H_TOP,H_TOP+2, 0,2, COL.GALV);
beam(0,TOTAL, H_TOP,H_TOP+2, W-2,W, COL.GALV);
beam(0,TOTAL, H_TOP+3,H_TOP+4, 0,1, COL.GALV_D);
boundaries.forEach(bx=>{
  const x = Math.min(bx, TOTAL-1);
  beam(x,x+1, BASE_Y,H_TOP+2, 0,2, COL.GALV);
  beam(x,x+1, BASE_Y,H_TOP+2, W-2,W, COL.GALV);
  beam(x,x+1, BASE_Y,BASE_Y+2, 0,W, COL.GALV);
  beam(x,x+1, H_TOP,H_TOP+2, 0,W, COL.GALV);
});
function endBrace(xc){
  const steps = H_TOP - BASE_Y;
  for (let s=0;s<=steps;s++){
    const y = BASE_Y + s;
    const za = Math.round(2 + (W-5)*s/steps);
    const zb = Math.round((W-3) - (W-5)*s/steps);
    vox(xc, y, za, COL.GALV_D);
    vox(xc, y, zb, COL.GALV_D);
  }
}
endBrace(0); endBrace(TOTAL-1);

// ====== BASE MOUNTING PAN (structural floor that holds the compressors) ======
beam(1, TOTAL, BASE_Y+1, BASE_Y+2, 1, W-1, COL.GALV_D);            // base pan

// ====== V-COIL ZIGZAG (silver finned panels) ======
function coilPanel(xA, xB, yA, yB){
  const n = Math.max(Math.abs(xB-xA), 1);
  for (let s=0;s<=n;s++){
    const f = s/n;
    const x = Math.round(xA + (xB-xA)*f);
    const y = Math.round(yA + (yB-yA)*f);
    for (let th=0; th<2; th++)
      for (let z=3; z<=W-4; z++){
        const edge = (z===3 || z===W-4);
        const fin  = (x % 2 === 0);
        vox(x, y+th, z, edge ? COL.FRAME : (fin ? COL.COIL : COL.COIL_H));
      }
  }
}
for (let b=0;b<NBAYS;b++){
  const x0=b*FAN_BAY, xc=Math.round(x0+FAN_BAY/2), x1=x0+FAN_BAY;
  coilPanel(x0, xc, COIL_TOP, COIL_RIDGE);
  coilPanel(xc, x1, COIL_RIDGE, COIL_TOP);
}
for (const ex of [0, TOTAL-1]){
  for (let y=COIL_RIDGE; y<=COIL_TOP; y++)
    for (let z=3; z<=W-4; z++)
      if (z===3 || z===W-4 || y===COIL_TOP) vox(ex, y, z, COL.FRAME);
}

// ====== SCROLL COMPRESSOR PIPING + POSITIONS ======
// ====== COPPER REFRIGERANT PIPING (prominent zigzag manifold) ======
function coilTopY(x){
  const b = Math.min(Math.floor(x / FAN_BAY), NBAYS-1);
  const x0=b*FAN_BAY, xc=x0+FAN_BAY/2, x1=x0+FAN_BAY;
  if (x<=xc){ const f=(x-x0)/(xc-x0); return COIL_TOP - f*(COIL_TOP-COIL_RIDGE); }
  const f=(x-xc)/(x1-xc); return COIL_RIDGE + f*(COIL_TOP-COIL_RIDGE);
}
// Two parallel zigzag runs following the V profile (the signature copper waves)
for (let x=1; x<TOTAL-1; x++){
  const yT = Math.round(coilTopY(x)) + 2;
  for (const z of [4,6]){
    vox(x, yT,   z, COL.COPPER);
    vox(x, yT+1, z, COL.COPPER);
  }
}
// Peak crossovers + top header (front -> back) at each boundary
boundaries.forEach(bx=>{
  const x = Math.min(bx, TOTAL-1);
  for (let z=4; z<=W-5; z++){ vox(x, COIL_TOP+2, z, COL.COPPER); vox(x, COIL_TOP+3, z, COL.COPPER); }
});
// Distributor drops into each valley (under the fans)
fanCX.forEach(cx=>{
  for (let y=COIL_RIDGE; y<=COIL_RIDGE+3; y++){ vox(cx, y, 5, COL.COPPER); vox(cx, y, 7, COL.COPPER); }
});
// Long suction header linking the compressor risers
for (let x=compCX[0]; x<=compCX[compCX.length-1]; x++) vox(x, COIL_RIDGE+1, compCZ, COL.COPPER);

// ====== SCROLL COMPRESSORS — static parts (base ring + copper riser) ======
function buildScrollBase(cx, cz){
  const r = 2;
  for (let x=cx-r-1;x<=cx+r+1;x++)
    for (let z=cz-r-1;z<=cz+r+1;z++){
      const dx=x-cx, dz=z-cz;
      if (dx*dx+dz*dz <= (r+1)*(r+1)) vox(x, COMP_BASE, z, COL.COMP_DK);
    }
  for (let y=RISER_Y0; y<=COIL_RIDGE+1; y++){
    const c = (y<=RISER_Y0+1) ? COL.HOSE : COL.COPPER;   // flex hose at the base, then rigid copper
    vox(cx, y, cz, c); vox(cx+1, y, cz, c);
  }
}
compCX.forEach(cx => buildScrollBase(cx, compCZ));

// ====== CONTROL PANEL (white box, front-center) ======
beam(31,44, COMP_BASE, COMP_BASE+13, W-3, W, COL.PANEL_W);
for (let y=COMP_BASE+1;y<COMP_BASE+12;y++) vox(37, y, W-1, COL.PANEL_D);
vox(40, COMP_BASE+6, W-1, COL.DARK); vox(41, COMP_BASE+6, W-1, COL.DARK);
for (let y=0; y<COMP_BASE+4; y++){ vox(30, y, W-1, COL.GALV_D); }

// ====== TOP FAN DECK + COWLS + GUARDS + MOTORS ======
// Roof deck plate with circular fan openings
for (let x=1; x<TOTAL; x++)
  for (let z=2; z<=W-2; z++){
    let hole=false;
    for (const cx of fanCX){ const dx=x-cx, dz=z-fanCZ; if (dx*dx+dz*dz <= 6*6){ hole=true; break; } }
    if (!hole) vox(x, H_TOP+2, z, COL.GALV);
  }
function fanTop(cx, cz){
  // raised cowl lip (venturi bell) around the opening
  const ro=7;
  for (let x=cx-ro;x<=cx+ro;x++)
    for (let z=cz-ro;z<=cz+ro;z++){
      const dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;
      if (d2<=ro*ro && d2>6*6) vox(x, H_TOP+3, z, COL.GALV_D);
    }
  // fan motor housing (under the hub)
  for (let x=cx-1;x<=cx+1;x++) for(let z=cz-1;z<=cz+1;z++) vox(x, H_TOP+2, z, COL.COMP_DK);
  // protective guard (spider grille) above the blades
  const gy=H_TOP+6;
  for (let i=-6;i<=6;i++){
    vox(cx+i, gy, cz, COL.GALV_D);
    vox(cx, gy, cz+i, COL.GALV_D);
    vox(cx+i, gy, cz+i, COL.GALV_D);
    vox(cx+i, gy, cz-i, COL.GALV_D);
  }
  for (let x=cx-6;x<=cx+6;x++)
    for (let z=cz-6;z<=cz+6;z++){
      const dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;
      if (d2<=6*6 && d2>=5*5) vox(x, gy, z, COL.GALV_D);
    }
}
fanCX.forEach(cx => fanTop(cx, fanCZ));

// ====== WATER SIDE: EVAPORATOR + CHILLED-WATER PIPING ======
const EVAP_CY = 9, EVAP_CZ = 9, EVAP_R = 3;
cylX(6, TOTAL-6, EVAP_CY, EVAP_CZ, EVAP_R, COL.INSUL);          // insulated evaporator shell
cylX(5, 6, EVAP_CY, EVAP_CZ, EVAP_R-1, COL.TANK);              // exposed steel cap (left)
cylX(TOTAL-6, TOTAL-5, EVAP_CY, EVAP_CZ, EVAP_R-1, COL.TANK);  // exposed steel cap (right)
function waterLine(cy){
  cylX(TOTAL-5, TOTAL+9, cy, EVAP_CZ, 2, COL.INSUL);            // insulated chilled-water pipe
  cylX(TOTAL+4, TOTAL+5, cy, EVAP_CZ, 2, COL.WATER);            // exposed blue spool
  for (let y=cy-3;y<=cy+3;y++) for (let z=EVAP_CZ-3;z<=EVAP_CZ+3;z++){
    const dy=y-cy,dz=z-EVAP_CZ,d2=dy*dy+dz*dz;
    if (d2<=9 && d2>=4) vox(TOTAL+9, y, z, COL.TANK);           // end flange
  }
}
waterLine(EVAP_CY);          // chilled water supply
waterLine(EVAP_CY+7);        // chilled water return
cylY(TOTAL+1, EVAP_CZ, EVAP_CY, EVAP_CY+7, 2, COL.INSUL);       // supply -> return vertical link

// ====== TANKS: OIL SEPARATOR / LIQUID RECEIVER ======
function vTank(cx, cz, h){
  cylY(cx, cz, BASE_Y+2, BASE_Y+2+h, 2, COL.TANK);
  for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++) vox(cx+dx, BASE_Y+3+h, cz+dz, COL.TANK); // dome top
  for (let y=BASE_Y+3+h; y<=COIL_RIDGE; y++) vox(cx, y, cz, COL.COPPER);   // line up to coil
}
vTank(40, 15, 13);   // oil separator (center)
vTank(72, 15, 10);   // liquid receiver (end)

// ====== LIQUID LINE COMPONENTS ======
cylX(64, 70, BASE_Y+8, 14, 1, COL.TANK);     // filter drier (horizontal)
vox(71, BASE_Y+8, 14, 0x66ccff);             // sight glass
vox(72, BASE_Y+8, 14, 0x66ccff);

// ====== NAMEPLATE on control panel ======
beam(33, 41, COMP_BASE+8, COMP_BASE+11, W, W+1, COL.NAME);
for (let x=34; x<40; x++) if (x%2===0) vox(x, COMP_BASE+9, W, COL.DARK);   // data lines

// ====== INSTANCED MESHES ======
const FINISH = {
  [COL.GALV]:   {r:0.42, m:0.82},
  [COL.GALV_D]: {r:0.5,  m:0.78},
  [COL.SKID]:   {r:0.55, m:0.6},
  [COL.COIL]:   {r:0.5,  m:0.55},
  [COL.COIL_H]: {r:0.45, m:0.6},
  [COL.COPPER]: {r:0.34, m:0.92},
  [COL.COMP_DK]:{r:0.55, m:0.4},
  [COL.PANEL_W]:{r:0.6,  m:0.2},
  [COL.PLINTH]: {r:0.95, m:0.02},
  [COL.INSUL]:  {r:0.88, m:0.04},
  [COL.WATER]:  {r:0.4,  m:0.5},
  [COL.TANK]:   {r:0.45, m:0.72},
  [COL.WARN]:   {r:0.6,  m:0.1},
  [COL.HOSE]:   {r:0.5,  m:0.62},
  [COL.NAME]:   {r:0.6,  m:0.2},
};
const cubeGeo = new THREE.BoxGeometry(1,1,1);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const f = FINISH[color] || {r:0.55, m:0.45};
  const mat = new THREE.MeshStandardMaterial({ color, roughness:f.r, metalness:f.m });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ====== ANIMATED AXIAL FANS ======
const fanGroups = [];
const fanMats = [];
function makeAxialFan(cx, cz){
  const g = new THREE.Group();
  g.position.set(cx+0.5, H_TOP + 3.6, cz+0.5);
  const bladeMat = new THREE.MeshStandardMaterial({
    color:0x3aa6ff, roughness:0.45, metalness:0.6,
    emissive:0x3aa6ff, emissiveIntensity:0.45
  });
  for (let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2;
    for (let rr=1; rr<=5; rr++){
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.95,0.4,0.95), bladeMat);
      c.position.set(Math.cos(a)*rr, 0, Math.sin(a)*rr);
      c.rotation.y = a;
      c.castShadow = true;
      g.add(c);
    }
  }
  const hub = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.8,1.6),
    new THREE.MeshStandardMaterial({ color:0x55555c, metalness:0.8 }));
  g.add(hub);
  scene.add(g);
  g.traverse(o => o.castShadow = false); // perf: animated fan excluded from baked shadow map (B5 §5.4)
  fanGroups.push(g);
  fanMats.push(bladeMat);
}
fanCX.forEach(cx => makeAxialFan(cx, fanCZ));

// ====== SCROLL COMPRESSORS — animated body + dome (shimmy + pulse) ======
const compCircuit = ['c1','c1','c1','c2','c2','c2'];
const compressors = [];
function buildScrollCompressor(cx, cz, idx){
  const g = new THREE.Group();
  g.position.set(cx+0.5, 0, cz+0.5);
  const r = 2;
  const bodyMat = new THREE.MeshStandardMaterial({ color:COL.COMP_BODY, roughness:0.5, metalness:0.5 });
  const dkMat   = new THREE.MeshStandardMaterial({ color:COL.COMP_DK,   roughness:0.55, metalness:0.4 });
  const domeMat = new THREE.MeshStandardMaterial({ color:COL.COMP_BLUE, emissive:0x2f6bc0, emissiveIntensity:0.0, roughness:0.3, metalness:0.45 });
  const warnMat = new THREE.MeshStandardMaterial({ color:COL.WARN, roughness:0.6, metalness:0.1 });
  const cube = (lx,ly,lz,mat)=>{ const m=new THREE.Mesh(cubeGeo, mat); m.position.set(lx,ly,lz); m.castShadow=true; g.add(m); };
  // cast body
  for (let y=COMP_BASE+1; y<=COMP_BASE+7; y++)
    for (let dx=-r;dx<=r;dx++) for (let dz=-r;dz<=r;dz++){
      const d2=dx*dx+dz*dz;
      if (d2<=r*r) cube(dx, y, dz, (d2>=(r-1)*(r-1))?bodyMat:dkMat);
    }
  // signature blue dome
  for (let dy=0; dy<=r+1; dy++){
    const rr=Math.sqrt((r+1)*(r+1)-dy*dy);
    for (let dx=-r-1;dx<=r+1;dx++) for (let dz=-r-1;dz<=r+1;dz++){
      const d2=dx*dx+dz*dz;
      if (d2<=rr*rr){ const shell=(d2>=(rr-1)*(rr-1)); if(shell||dy===r+1) cube(dx, COMP_BASE+8+dy, dz, domeMat); }
    }
  }
  // terminal box (front) + warning label
  for (let y=COMP_BASE+3;y<=COMP_BASE+5;y++) for(let dx=-1;dx<=1;dx++) cube(dx, y, r+1, dkMat);
  cube(0, COMP_BASE+6, r+1, warnMat);   // yellow warning label
  scene.add(g);
  compressors.push({ g, domeMat, restX:cx+0.5, restZ:cz+0.5, circuit: compCircuit[idx] });
}
compCX.forEach((cx, idx) => buildScrollCompressor(cx, compCZ, idx));

// ====== LED INDICATORS (per circuit) ======
const ledMats = [];
function makeLed(cx){
  const mat = new THREE.MeshStandardMaterial({
    color:0x3aa6ff, emissive:0x3aa6ff, emissiveIntensity:1.4, roughness:0.25, metalness:0.3 });
  const led = new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1), mat);
  led.position.set(cx+0.5, COMP_BASE+15, FRONT+0.5);
  scene.add(led);
  const pl = new THREE.PointLight(0x3aa6ff, 1.0, 12);
  pl.position.copy(led.position);
  scene.add(pl);
  ledMats.push({ mat, light: pl });
}
makeLed(compCX[1]);
makeLed(compCX[4]);

// ====== STATE MACHINE (independent points) ======
const COLOR_STANDBY = new THREE.Color(0x3aa6ff);
const COLOR_ON      = new THREE.Color(0x00ff66);
const COLOR_ALARM   = new THREE.Color(0xff2233);
const colorFor = s => s==='on' ? COLOR_ON : s==='alarm' ? COLOR_ALARM : COLOR_STANDBY;
const intensityFor = s => s==='on' ? 0.65 : s==='alarm' ? 0.7 : 0.45;
const state = { fan:'standby', c1:'standby', c2:'standby' };

function applyState(){
  // fans follow ONLY the VENTILADORES point (independent of compressors)
  const fc = colorFor(state.fan), fi = intensityFor(state.fan);
  fanMats.forEach(m=>{ m.color.copy(fc); m.emissive.copy(fc); m.emissiveIntensity = fi; });
  // LEDs follow each compressor circuit
  [state.c1, state.c2].forEach((s,i)=>{
    ledMats[i].mat.color.copy(colorFor(s));
    ledMats[i].mat.emissive.copy(colorFor(s));
    ledMats[i].mat.emissiveIntensity = s==='standby' ? 1.2 : 1.7;
    ledMats[i].light.color.copy(colorFor(s));
    ledMats[i].light.intensity = s==='standby' ? 1.0 : 1.5;
  });
}
applyState();

const CYCLE = { standby:'on', on:'alarm', alarm:'standby' };
function bind(id, key){
  const btn = document.getElementById(id);
  btn.onclick = ()=>{ state[key]=CYCLE[state[key]]; btn.className=state[key]; btn.textContent=state[key].toUpperCase(); applyState(); };
}
bind('bFan','fan'); bind('bC1','c1'); bind('bC2','c2');
const bRot = document.getElementById('bRot');
bRot.onclick = ()=>{ controls.autoRotate=!controls.autoRotate; bRot.className=controls.autoRotate?'on':'off'; bRot.textContent=controls.autoRotate?'ON':'OFF'; };

// ====== PARTICLES ======
const pGeo = new THREE.BoxGeometry(0.6,0.6,0.6);
const pGeoS = new THREE.BoxGeometry(0.5,0.5,0.5);
// air exhaust (cyan) — up through fans
const NPF = 16;
const exhaustP = [];
const cyanMat = new THREE.MeshBasicMaterial({ color:0x55ccff, transparent:true, opacity:0.85 });
for (let f=0; f<NBAYS; f++)
  for (let i=0;i<NPF;i++){
    const p = new THREE.Mesh(pGeo, cyanMat.clone());
    p.userData = { t:Math.random(), seed:Math.random()*10, fan:f };
    scene.add(p); exhaustP.push(p);
  }
// refrigerant (amber) — up the copper risers per compressor
const refrigP = [];
const amberMat = new THREE.MeshBasicMaterial({ color:0xffb347, transparent:true, opacity:0.9 });
compCX.forEach((cx, idx)=>{
  for (let i=0;i<4;i++){
    const p = new THREE.Mesh(pGeoS, amberMat.clone());
    p.userData = { t:i/4, cx, cz:compCZ, circuit:compCircuit[idx] };
    scene.add(p); refrigP.push(p);
  }
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  // FANS — spin only with VENTILADORES (independent)
  const fanSpin = state.fan === 'on';
  fanGroups.forEach((g,i)=>{ if (fanSpin) g.rotation.y += dt*(8 + i*0.5); });

  // COMPRESSORS — shimmy body + pulse blue dome when their circuit is ON
  compressors.forEach((c,i)=>{
    const on = state[c.circuit] === 'on';
    if (on){
      c.g.position.x = c.restX + Math.sin(t*26 + i)*0.18;
      c.g.position.z = c.restZ + Math.cos(t*31 + i*1.7)*0.14;
      c.domeMat.emissiveIntensity = 0.45 + 0.32*(0.5 + 0.5*Math.sin(t*6 + i));
    } else {
      c.g.position.x = c.restX;
      c.g.position.z = c.restZ;
      c.domeMat.emissiveIntensity = (state[c.circuit]==='alarm') ? 0.25 : 0.0;
    }
  });

  // air exhaust particles
  exhaustP.forEach((p)=>{
    if (!fanSpin){ p.material.opacity = 0; return; }
    p.userData.t += dt*0.5;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const cx = fanCX[p.userData.fan];
    const ang = seed + tt*2, rad = 1 + tt*4;
    p.position.x = cx + 0.5 + Math.cos(ang)*rad;
    p.position.z = fanCZ + 0.5 + Math.sin(ang)*rad;
    p.position.y = H_TOP + 4 + tt*20;
    p.material.opacity = Math.sin(tt*Math.PI)*0.8;
  });

  // refrigerant flow in copper risers (per circuit)
  refrigP.forEach((p)=>{
    const on = state[p.userData.circuit] === 'on';
    if (!on){ p.material.opacity = 0; return; }
    p.userData.t += dt*0.55;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t;
    p.position.x = p.userData.cx + 0.5;
    p.position.z = p.userData.cz + 0.5;
    p.position.y = (COMP_BASE+11) + tt*(COIL_RIDGE - (COMP_BASE+11));
    p.material.opacity = Math.sin(tt*Math.PI)*0.95;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
