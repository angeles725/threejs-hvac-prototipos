<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXTRACTOR DE AZOTEA (HONGO) · Ø1.2 × 1.1 m · Realistic</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; color:#00d4aa; overflow:hidden; }

<script>

<body>

  <b>EXTRACTOR DE AZOTEA (HONGO)</b><br>
  <span>Ø1.2 × 1.1 m · Realistic PBR · 1 unidad = 1 m</span>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 unidad = 1 m. Spec dimensional: voxel/extractor-hongo-voxel-v1.html (1 voxel = 0.025 m).
// EXTRACTOR CENTRIFUGO TIPO HONGO de azotea Ø1.2 x 1.1 m: campana (bell) de aluminio hilado (LatheGeometry)
//   levantada sobre patas para descarga radial en el borde; garganta con rejilla anti-pajaros (alphaMap);
//   rodete centrifugo AZUL de alabes curvados hacia atras que GIRA con inercia asimetrica, visible por el
//   claro radial bajo la campana; motor aletado bajo la campana + capuchon de intemperie encima del domo;
//   curb gris oscuro con membrana impermeable + counter-flashing; desconectador con palanca y conduit.
// FLUJO: cono translucido rojo en el borde (descarga radial) con textura que hace scroll por .offset.y
//   (sin allocations). El RODETE es el heroe: solo se muta rotacion/offset/opacidad/emisivo en el loop.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 6, 26);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 120);
camera.position.set(1.85, 1.25, 2.0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // sombras horneadas: un solo horneado tras construir
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 0.9;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.55, 0);
// Ground clamp (regla de la casa): ni el target ni la camara bajan del piso
controls.addEventListener('change', () => {
  if (controls.target.y < 0) controls.target.y = 0;
  if (camera.position.y < 0.15) camera.position.y = 0.15;
});

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.6, 4.2, 1.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1.5; sun.shadow.camera.right = 1.5;
sun.shadow.camera.top = 1.7; sun.shadow.camera.bottom = -0.4;
sun.shadow.camera.near = 1.2; sun.shadow.camera.far = 11;
sun.shadow.bias = -0.0004;
sun.target.position.set(0, 0.55, 0);
scene.add(sun); scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-2.6, 2.2, -1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-1.3, 1.3, 2.8);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO (losa de azotea) ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(24, 48, 0x123f35, 0x0c1d1a);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ====== TEXTURAS PROCEDURALES (CanvasTexture) ======
// Mapas de COLOR: SRGBColorSpace · mapas de datos (roughness/alpha): lineales
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function dataTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// Variacion de rugosidad para pintura (mapa lineal). roughnessMap MULTIPLICA el escalar:
// escalar 1.0 * mapa (~0.55 medio) deja el producto en la banda de pintura percibida (curb).
const paintRoughTex = dataTex(256, 256, (g) => {
  g.fillStyle = '#8c8c8c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++){
    const v = 120 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
});
paintRoughTex.wrapS = paintRoughTex.wrapT = THREE.RepeatWrapping;
paintRoughTex.repeat.set(3, 1);

// Rejilla anti-pajaros: alphaMap lineal (blanco = alambre opaco, negro = hueco). Malla cuadrada fina.
const screenTex = dataTex(128, 128, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#fff'; g.lineWidth = 3;
  for (let x = 0; x <= w; x += 16){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y <= h; y += 16){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
});
screenTex.wrapS = screenTex.wrapT = THREE.RepeatWrapping;
screenTex.repeat.set(18, 3);

// Membrana impermeable: fieltro bituminoso con traslapes horizontales marcados (color, sRGB)
const memTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#17191d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++){
    const v = 20 + Math.floor(Math.random() * 26);
    g.fillStyle = `rgba(${v},${v},${v},0.5)`;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  g.strokeStyle = 'rgba(6,7,9,0.9)'; g.lineWidth = 3;
  for (let y = 32; y < h; y += 42){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
});
memTex.wrapS = memTex.wrapT = THREE.RepeatWrapping;
memTex.repeat.set(6, 1);

// Flujo de aire de extraccion: puffs suaves rojos que hacen scroll (offset.y). Fondo transparente.
const flowTex = canvasTex(64, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 26; i++){
    const cx = Math.random() * w, cy = Math.random() * h, r = 5 + Math.random() * 12;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(255,90,100,0.55)');
    grad.addColorStop(1, 'rgba(255,60,72,0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
});
flowTex.wrapS = flowTex.wrapT = THREE.RepeatWrapping;
flowTex.repeat.set(10, 1);

// Placa de datos del equipo
const nameplateTex = canvasTex(512, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#d8dade'); grad.addColorStop(0.5, '#b8bcc2'); grad.addColorStop(1, '#c8ccd2');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3a3f46'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = '#22262c';
  g.font = 'bold 30px monospace'; g.textAlign = 'center';
  g.fillText('EXTRACTOR DE AZOTEA', w/2, 54);
  g.font = '20px monospace';
  g.fillText('CENTRIFUGO · TIPO HONGO', w/2, 86);
  g.font = '19px monospace'; g.textAlign = 'left';
  g.fillText('MODELO      GB-120-UP', 40, 128);
  g.fillText('CAUDAL      1400 m3/h · 1.1 kW', 40, 158);
  g.fillText('DIAM        Ø1.2 m · 1.10 m alt', 40, 188);
  for (const [bx, by] of [[26, 26], [w-26, 26], [26, h-26], [w-26, h-26]]){
    g.beginPath(); g.arc(bx, by, 7, 0, Math.PI*2); g.fillStyle = '#787c82'; g.fill();
  }
});

// Etiqueta del desconectador
const discLabelTex = canvasTex(128, 96, (g, w, h) => {
  g.fillStyle = '#ffc22e'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#141414'; g.lineWidth = 5; g.strokeRect(5, 5, w - 10, h - 10);
  g.fillStyle = '#141414'; g.font = 'bold 17px monospace'; g.textAlign = 'center';
  g.fillText('DESCON.', w/2, 40); g.fillText('480V', w/2, 66);
});

// ====== PALETA PBR (metalness 0 = pintado/asfalto · metalness 1 = metal desnudo) ======
// Leccion documentada: gris medio + metalness 1 lee NEGRO en este entorno oscuro. Por eso:
// - Campana ALUMINIO = metal desnudo pero color CLARO (b9c2cb) -> lee metal correctamente.
// - Metal desnudo (rejilla, garganta, flecha, palanca, pernos) = metalness 1 con tono claro.
// - Curb gris oscuro + membrana = metalness 0 (pintado/asfalto), la campana es la unica pieza "metal".
// - Rodete AZUL pintado = metalness 0.
const M = {
  ALUM:    new THREE.MeshStandardMaterial({ color:0xc2cad2, roughness:0.35, metalness:1 }),   // campana aluminio hilado
  ALUM_D:  new THREE.MeshStandardMaterial({ color:0xa7b0b9, roughness:0.42, metalness:1 }),   // capuchon / labio
  STEEL:   new THREE.MeshStandardMaterial({ color:0xb6bcc4, roughness:0.4,  metalness:1 }),   // garganta / charola galvanizada
  STEEL_D: new THREE.MeshStandardMaterial({ color:0x9aa2ab, roughness:0.48, metalness:1 }),   // aros / bridas
  MESH:    new THREE.MeshStandardMaterial({ color:0xaeb4bc, roughness:0.5,  metalness:1,      // rejilla anti-pajaros
             alphaMap:screenTex, alphaTest:0.5, side:THREE.DoubleSide }),
  CURB:    new THREE.MeshStandardMaterial({ color:0x3a3f46, roughness:1.0,  metalness:0, roughnessMap:paintRoughTex }),
  CURB_D:  new THREE.MeshStandardMaterial({ color:0x2d3138, roughness:0.85, metalness:0 }),
  FLASH:   new THREE.MeshStandardMaterial({ color:0x4a525c, roughness:0.5,  metalness:0.4 }), // counter-flashing (galv. pintado)
  MEMBRANE:new THREE.MeshStandardMaterial({ map:memTex, color:0x1c1e22, roughness:0.95, metalness:0 }),
  DUCT:    new THREE.MeshStandardMaterial({ color:0x7d858e, roughness:0.5,  metalness:0.5 }), // ducto galvanizado corto
  MOTOR:   new THREE.MeshStandardMaterial({ color:0x33383f, roughness:0.6,  metalness:0 }),
  MOTOR_D: new THREE.MeshStandardMaterial({ color:0x24282e, roughness:0.65, metalness:0 }),
  FIN:     new THREE.MeshStandardMaterial({ color:0x3f454c, roughness:0.6,  metalness:0 }),
  BOX:     new THREE.MeshStandardMaterial({ color:0x4a525c, roughness:0.55, metalness:0 }),   // desconectador
  BOX_D:   new THREE.MeshStandardMaterial({ color:0x394049, roughness:0.6,  metalness:0 }),
  RED:     new THREE.MeshStandardMaterial({ color:0xd23434, roughness:0.5,  metalness:0.2 }), // palanca
  COND:    new THREE.MeshStandardMaterial({ color:0xb2b8c0, roughness:0.4,  metalness:1 }),   // conduit EMT desnudo
  SHAFT:   new THREE.MeshStandardMaterial({ color:0xb0b6be, roughness:0.28, metalness:1 }),   // flecha
  BOLT:    new THREE.MeshStandardMaterial({ color:0xaeb2b8, roughness:0.38, metalness:1 }),
  DARK:    new THREE.MeshStandardMaterial({ color:0x1c1e22, roughness:0.7,  metalness:0 })
};
// Rodete centrifugo AZUL (pintado). Group giratorio; color de cubo marca ON/OFF sutilmente.
const wheelMat = new THREE.MeshStandardMaterial({ color:0x1f6fe6, roughness:0.4,  metalness:0 });
const hubMat   = new THREE.MeshStandardMaterial({ color:0x164ea6, roughness:0.45, metalness:0 });
// LED de estado (desconectador)
const ledMat = new THREE.MeshStandardMaterial({ color:0x00ff66, emissive:0x00ff66,
  emissiveIntensity:1.7, roughness:0.3, metalness:0 });
// Cono de aire de extraccion (descarga radial en el borde) — translucido, se anima por offset/opacidad
const flowMat = new THREE.MeshBasicMaterial({ color:0xff3344, map:flowTex, transparent:true,
  opacity:0.0, depthWrite:false, side:THREE.DoubleSide });

// ====== HELPERS DE GEOMETRIA PARAMETRICA ======
const staticG = new THREE.Group();       // todo lo estatico (sombras horneadas)
scene.add(staticG);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = staticG){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = staticG){
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function cylX(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.z = Math.PI / 2;
  return m;
}
function cylY(r, len, mat, x, y, z, seg = 20, parent = staticG){
  return mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
}
function cylZ(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.x = Math.PI / 2;
  return m;
}
// Anillo cuadrado de 4 muros (curb / bandas): centro y, alto h, espesor de muro t
function squareBand(halfOut, y, h, t, mat, parent = staticG){
  const inr = halfOut - t;
  box(2*halfOut, h, t, mat, 0, y, halfOut - t/2, parent);   // frente +Z
  box(2*halfOut, h, t, mat, 0, y, -(halfOut - t/2), parent); // atras -Z
  box(t, h, 2*inr, mat, halfOut - t/2, y, 0, parent);        // der +X
  box(t, h, 2*inr, mat, -(halfOut - t/2), y, 0, parent);     // izq -X
}
// Tuberia con codos suavizados (conduit)
function makePipe(points, r, mat, bend = 0.04, parent = staticG, seg = 12){
  const path = new THREE.CurvePath();
  const P = points.map(p => new THREE.Vector3(...p));
  let prev = P[0];
  for (let i = 1; i < P.length - 1; i++){
    const a = P[i], b = P[i+1];
    const dIn = a.clone().sub(prev).normalize();
    const dOut = b.clone().sub(a).normalize();
    const tIn = a.clone().sub(dIn.clone().multiplyScalar(bend));
    const tOut = a.clone().add(dOut.clone().multiplyScalar(bend));
    path.add(new THREE.LineCurve3(prev, tIn));
    path.add(new THREE.QuadraticBezierCurve3(tIn, a, tOut));
    prev = tOut;
  }
  path.add(new THREE.LineCurve3(prev, P[P.length - 1]));
  const len = path.getLength();
  const g = new THREE.TubeGeometry(path, Math.max(12, Math.round(len * 26)), r, seg);
  return mesh(g, mat, 0, 0, 0, parent);
}

// Pernos / instancias globales (una sola draw call)
const boltMatrices = [];
const _bm = new THREE.Matrix4(), _bs = new THREE.Vector3(1,1,1), _q0 = new THREE.Quaternion();
const AXQ = {
  x: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI/2)),
  y: new THREE.Quaternion(),
  z: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0))
};
function boltRing(cx, cy, cz, axis, radius, n){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + Math.PI / n;
    const u = Math.cos(a) * radius, v = Math.sin(a) * radius;
    let px = cx, py = cy, pz = cz;
    if (axis === 'x'){ py += u; pz += v; }
    else if (axis === 'y'){ px += u; pz += v; }
    else { px += u; py += v; }
    _bm.compose(new THREE.Vector3(px, py, pz), AXQ[axis], _bs);
    boltMatrices.push(_bm.clone());
  }
}
function makeIM(geo, mat, mats, parent = staticG, cast = true){
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = cast; im.receiveShadow = true;
  parent.add(im);
  return im;
}
function tMat(x, y, z, q = _q0, s = _bs){
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), q, s);
}
// Lathe de perfil [ [r,y], ... ]
function latheGeo(prof, seg = 48){
  return new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), seg);
}

// ==================================================================
// COTAS (metros). Eje del extractor en el origen. Azotea en y=0.
// ==================================================================
const CURB_H  = 0.28;                     // altura del curb
const TRAY_Y  = 0.30;                     // charola sobre el curb
const THR_R   = 0.28;                     // radio de la garganta
const THR_Y0  = TRAY_Y, THR_Y1 = 0.55;    // garganta 0.30 -> 0.55
const SCR_Y0  = 0.32,  SCR_Y1 = 0.57;     // rejilla anti-pajaros
const RIM_Y   = 0.66;                     // borde (drip lip) de la campana — levantada sobre patas
const WHEEL_Y = 0.63;                     // centro del rodete (visible en el claro radial)
const HOOD_TOP = RIM_Y + 0.35;            // ~1.01 tope del domo
const LEG_R   = 0.335;                    // radio de las 4 patas de soporte (45 grados)

// ==================================================================
// 1) CURB (gris oscuro pintado) + MEMBRANA + COUNTER-FLASHING + DUCTO
// ==================================================================
{
  // faldon de membrana impermeable sobre la losa (chaflan) + ducto corto bajo el curb
  squareBand(0.52, 0.012, 0.024, 0.11, M.MEMBRANE);          // membrana volteada a la losa
  // muros del curb (opening interior ~0.70 m)
  squareBand(0.425, CURB_H/2, CURB_H, 0.075, M.CURB);
  // membrana bituminosa envolviendo el tercio inferior del curb (traslapes marcados)
  squareBand(0.438, 0.09, 0.18, 0.05, M.MEMBRANE);
  // counter-flashing metalico con vuelo en la corona del curb
  squareBand(0.462, CURB_H + 0.012, 0.024, 0.055, M.FLASH);
  // placa de datos en la cara frontal (+Z)
  const np = mesh(new THREE.PlaneGeometry(0.22, 0.11),
    new THREE.MeshStandardMaterial({ map:nameplateTex, roughness:0.4, metalness:0 }),
    0.0, 0.17, 0.4255);
  np.castShadow = false;
  // ducto corto de conexion visible bajo la charola (dentro del opening)
  cylY(0.28, 0.06, M.DUCT, 0, 0.03, 0, 28);
}

// ==================================================================
// 2) CHAROLA + GARGANTA + VENTURI + REJILLA ANTI-PAJAROS
// ==================================================================
{
  // charola circular (anillo plano) del throat al curb
  const tray = mesh(new THREE.RingGeometry(THR_R, 0.43, 40), M.STEEL, 0, TRAY_Y, 0);
  tray.rotation.x = -Math.PI/2;
  // garganta cilindrica (galvanizada)
  cylY(THR_R, (THR_Y1 - THR_Y0), M.STEEL, 0, (THR_Y0 + THR_Y1)/2, 0, 40);
  // costura vertical + aro venturi (labio de entrada) en el tope
  mesh(new THREE.TorusGeometry(THR_R, 0.016, 10, 40), M.STEEL_D, 0, THR_Y1, 0).rotation.x = Math.PI/2;

  // rejilla anti-pajaros: cilindro con alphaMap de malla, entre las patas
  const scr = cylY(0.30, (SCR_Y1 - SCR_Y0), M.MESH, 0, (SCR_Y0 + SCR_Y1)/2, 0, 44);
  scr.castShadow = false;
  mesh(new THREE.TorusGeometry(0.30, 0.01, 8, 44), M.STEEL_D, 0, SCR_Y0, 0).rotation.x = Math.PI/2; // aro inf
  mesh(new THREE.TorusGeometry(0.30, 0.01, 8, 44), M.STEEL_D, 0, SCR_Y1, 0).rotation.x = Math.PI/2; // aro sup
}

// ==================================================================
// 3) PATAS DE SOPORTE (levantan la campana -> descarga radial en el borde)
// ==================================================================
{
  const legMats = [], footMats = [];
  const legLen = 0.64;   // llegan a la cara inferior del domo en LEG_R (~y0.94), sin flotar bajo la campana
  for (let i = 0; i < 4; i++){
    const a = Math.PI/4 + i * Math.PI/2;
    const x = Math.cos(a) * LEG_R, z = Math.sin(a) * LEG_R;
    legMats.push(tMat(x, TRAY_Y + legLen/2, z));
    footMats.push(tMat(x, TRAY_Y + 0.01, z));
    boltRing(x, TRAY_Y + 0.005, z, 'y', 0.0001, 1);          // perno al pie
  }
  makeIM(new THREE.BoxGeometry(0.028, legLen, 0.028), M.STEEL_D, legMats);
  makeIM(new THREE.BoxGeometry(0.06, 0.02, 0.06), M.STEEL_D, footMats, staticG, false);
}

// ==================================================================
// 4) MOTOR (bajo la campana) + ARANA + CAPUCHON de intemperie (sobre el domo)
// ==================================================================
{
  const MOT_Y0 = 0.75, MOT_Y1 = 0.90;
  // arana de 3 brazos: del aro del venturi (0.57) hacia arriba al motor
  const armGeo = new THREE.BoxGeometry(0.30, 0.02, 0.035);
  armGeo.translate(0.15, 0, 0);
  const armMats = [];
  for (let i = 0; i < 3; i++){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, i * 2*Math.PI/3, 0));
    armMats.push(new THREE.Matrix4().compose(new THREE.Vector3(0, MOT_Y0 - 0.01, 0), q, _bs));
  }
  makeIM(armGeo, M.MOTOR_D, armMats);
  // cuerpo del motor + aletas de enfriamiento (torus instanciados) + tapa
  cylY(0.10, (MOT_Y1 - MOT_Y0), M.MOTOR, 0, (MOT_Y0 + MOT_Y1)/2, 0, 24);
  const finGeo = new THREE.TorusGeometry(0.105, 0.006, 6, 26);
  finGeo.rotateX(Math.PI/2);
  const finMats = [];
  for (let i = 0; i < 5; i++) finMats.push(tMat(0, MOT_Y0 + 0.02 + i * 0.028, 0));
  makeIM(finGeo, M.FIN, finMats, staticG, false);
  cylY(0.085, 0.03, M.MOTOR_D, 0, MOT_Y1 + 0.005, 0, 24);    // campana superior del motor
  box(0.07, 0.05, 0.06, M.MOTOR_D, 0.11, MOT_Y0 + 0.05, 0);  // caja de conexiones del motor

  // capuchon de intemperie sobre el tope del domo (cubre la penetracion de la flecha/izaje)
  const capGeo = latheGeo([[0.0, 0.075], [0.06, 0.07], [0.11, 0.045], [0.135, 0.015], [0.14, 0.0]], 28);
  mesh(capGeo, M.ALUM_D, 0, HOOD_TOP - 0.005, 0);
  cylY(0.05, 0.05, M.ALUM_D, 0, HOOD_TOP - 0.03, 0, 20);      // cuello del capuchon
}

// ==================================================================
// 5) CAMPANA HONGO — DOMO DE ALUMINIO HILADO (LatheGeometry)  +  LABIO ROLADO
// ==================================================================
{
  // perfil del domo (r, y_local) desde el borde (rim, ancho) al tope (angosto). Ø1.2 -> r 0.60.
  const prof = [
    [0.60, 0.00], [0.598, 0.03], [0.585, 0.06], [0.56, 0.11], [0.52, 0.16],
    [0.46, 0.21], [0.38, 0.26], [0.29, 0.30], [0.19, 0.335], [0.11, 0.35]
  ];
  const domeGeo = latheGeo(prof, 56);
  const dome = mesh(domeGeo, M.ALUM, 0, RIM_Y, 0);
  dome.material.side = THREE.DoubleSide;                      // interior visible bajo la campana
  // labio rolado / drip edge en el borde
  mesh(new THREE.TorusGeometry(0.60, 0.02, 10, 56), M.ALUM, 0, RIM_Y, 0).rotation.x = Math.PI/2;
  // tapa superior del domo (cierra el vertice bajo el capuchon)
  cylY(0.11, 0.012, M.ALUM_D, 0, RIM_Y + 0.352, 0, 28);
}

// ==================================================================
// 6) RODETE CENTRIFUGO AZUL (Group animado — alabes curvados hacia atras)
//    Aspira por la garganta (eje abajo) y descarga radial bajo la campana.
// ==================================================================
const wheel = new THREE.Group();
wheel.position.set(0, WHEEL_Y, 0);
scene.add(wheel);
{
  const WR = 0.24;                                            // radio exterior del rodete
  // plato posterior (backplate) superior
  const back = new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, 0.012, 40), wheelMat);
  back.position.y = 0.085; wheel.add(back);
  // shroud de entrada (inlet bell) inferior con ojo de succion (lathe anular)
  const shGeo = latheGeo([[0.13, -0.09], [0.145, -0.07], [0.18, -0.035], [0.22, 0.0], [WR, 0.02]], 40);
  const shroud = new THREE.Mesh(shGeo, wheelMat);
  wheel.add(shroud);
  // 12 alabes curvados hacia atras (instanciados) entre los platos
  const bladeGeo = new THREE.BoxGeometry(0.008, 0.15, 0.11);
  const BN = 12, bladeMats = [];
  for (let i = 0; i < BN; i++){
    const a = i / BN * Math.PI * 2;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI/2 - a + 0.62, 0)); // backward
    bladeMats.push(new THREE.Matrix4().compose(
      new THREE.Vector3(Math.cos(a) * 0.17, 0.0, Math.sin(a) * 0.17), q, _bs));
  }
  const blIM = new THREE.InstancedMesh(bladeGeo, wheelMat, BN);
  bladeMats.forEach((m, i) => blIM.setMatrixAt(i, m));
  blIM.instanceMatrix.needsUpdate = true;
  wheel.add(blIM);
  // cubo (hub) conico + CHAVETA de asimetria (para que el giro SE LEA)
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 0.11, 20), hubMat);
  hub.position.y = 0.03; wheel.add(hub);
  const key = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.09), M.DARK);
  key.position.set(0.045, 0.085, 0); wheel.add(key);          // tab off-center -> rotacion legible
  // flecha hacia el motor (gira con el rodete)
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.16, 12), M.SHAFT);
  shaft.position.y = 0.15; wheel.add(shaft);
  wheel.traverse(o => { o.castShadow = false; });             // animado: excluido del horneado
}

// ==================================================================
// 7) CONO DE AIRE DE EXTRACCION (descarga radial en el borde) — translucido animado
// ==================================================================
const flowCone = mesh(
  new THREE.CylinderGeometry(0.50, 0.66, 0.11, 40, 1, true),  // flare hacia abajo-afuera (open)
  flowMat, 0, RIM_Y - 0.055, 0);
flowCone.castShadow = false; flowCone.receiveShadow = false;
flowCone.renderOrder = 2;
flowCone.visible = false;

// ==================================================================
// 8) DESCONECTADOR ELECTRICO (lado +X del curb) + CONDUIT + PALANCA + LED
// ==================================================================
{
  const DX = 0.55, DZ = 0.16, DY = 0.20;                      // centro del gabinete
  // postes de montaje al curb
  box(0.02, 0.16, 0.02, M.STEEL_D, 0.44, 0.24, DZ - 0.06);
  box(0.02, 0.16, 0.02, M.STEEL_D, 0.44, 0.24, DZ + 0.06);
  // gabinete (cuerpo + puerta biselada + bisagra)
  box(0.10, 0.20, 0.16, M.BOX, DX, DY, DZ);
  box(0.012, 0.185, 0.15, M.BOX_D, DX + 0.052, DY, DZ);       // puerta (cara +X)
  // etiqueta de peligro
  const lbl = mesh(new THREE.PlaneGeometry(0.07, 0.05),
    new THREE.MeshStandardMaterial({ map:discLabelTex, roughness:0.5, metalness:0 }),
    DX + 0.059, DY + 0.04, DZ);
  lbl.rotation.y = Math.PI/2; lbl.castShadow = false;
  // palanca roja (operador lateral, cara +Z)
  box(0.03, 0.09, 0.02, M.RED, DX, DY - 0.02, DZ + 0.09);
  cylZ(0.014, 0.03, M.RED, DX, DY - 0.06, DZ + 0.095, 12);
  // conduit EMT: baja del gabinete, corre por la losa y sube al curb
  makePipe([[DX - 0.03, DY - 0.1, DZ + 0.02], [DX - 0.03, 0.03, DZ + 0.02],
            [0.44, 0.03, DZ + 0.02], [0.44, 0.14, DZ + 0.02]], 0.012, M.COND, 0.03);
  // LED de estado en la cara del gabinete
  const led = cylX(0.012, 0.012, ledMat, DX + 0.056, DY - 0.055, DZ - 0.04, 12);
  led.castShadow = false;
  const ledLight = new THREE.PointLight(0x00ff66, 0.25, 0.4);
  ledLight.position.set(DX + 0.1, DY, DZ - 0.04);
  scene.add(ledLight);
  wheel.userData.ledLight = ledLight;
}

// ==================================================================
// INSTANCIADO GLOBAL (pernos) — 1 draw call
// ==================================================================
makeIM(new THREE.CylinderGeometry(0.006, 0.006, 0.016, 6), M.BOLT, boltMatrices, staticG, false);

// ====== ESTADO / CONTROL DE EQUIPO ======
const state = { ext:true, rot:true };
let rpm = 0;                                     // 0..1 con inercia asimetrica
let simT = 0;
const MAX_SPIN = 15;                             // rad/s a plena marcha

const bExt = document.getElementById('bExt');
const bRot = document.getElementById('bRot');
const modeLbl = document.getElementById('modeLbl');
function setBtn(b, on){ b.className = on ? 'on' : 'off'; b.textContent = on ? 'ON' : 'OFF'; }

function applyState(){
  // Solo cambian emisivos / objetivo de giro / etiqueta: NO se rehornean sombras aqui
  const on = state.ext;
  const c = on ? 0x00ff66 : 0xff2233;
  ledMat.color.setHex(c); ledMat.emissive.setHex(c);
  ledMat.emissiveIntensity = on ? 1.7 : 1.2;
  const ll = wheel.userData.ledLight;
  ll.color.setHex(c); ll.intensity = on ? 0.28 : 0.15;
  modeLbl.innerHTML = 'ESTADO: <b>' + (on ? 'EN MARCHA' : 'DETENIDO') + '</b>';
  modeLbl.className = 'mode' + (on ? '' : ' off');
  controls.autoRotate = state.rot;
}
bExt.addEventListener('click', () => { state.ext = !state.ext; setBtn(bExt, state.ext); applyState(); });
bRot.addEventListener('click', () => { state.rot = !state.rot; setBtn(bRot, state.rot); applyState(); });

applyState();
renderer.shadowMap.needsUpdate = true;           // horneado unico tras construir la escena

// ====== LOOP DE ANIMACION ======
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simT += dt;

  // inercia asimetrica del rodete (arranque rapido, paro con coast-down lento)
  const target = state.ext ? 1 : 0;
  const k = state.ext ? 1.6 : 0.45;
  rpm += (target - rpm) * Math.min(1, dt * k);
  if (Math.abs(rpm - target) < 0.0015) rpm = target;

  wheel.rotation.y += dt * rpm * MAX_SPIN;        // el rodete es el heroe (gira, chaveta -> legible)

  // aire de extraccion: cono translucido en el borde, scroll + opacidad (allocation-free)
  const flow = rpm;
  if (flow > 0.03){
    flowCone.visible = true;
    flowTex.offset.y += dt * (0.35 + 0.9 * flow);  // puffs descienden-afuera = descarga radial
    flowMat.opacity = 0.5 * flow * (0.75 + 0.25 * Math.sin(simT * 4.0));
  } else {
    flowCone.visible = false;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
