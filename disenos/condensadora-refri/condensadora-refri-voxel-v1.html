<!DOCTYPE html>
<html lang="es">

<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); z-index:5; }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#aebfd2; }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); z-index:5; color:#aebfd2; }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; letter-spacing:0.08em; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #coord { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#aebfd2; backdrop-filter: blur(6px); z-index:5; letter-spacing:0.06em; }

  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
<script>

(function(){
  if (typeof document === 'undefined') return;
  var AT = String.fromCharCode(64);
  var base = 'https://unpkg.com/three' + AT + '0.160.0/';
  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': base + 'build/three.module.js',

  }});
  document.head.appendChild(im);
})();
</script>

<body>
<div id="info">
  <b>UNIDAD CONDENSADORA · REFRIGERACIÓN</b><br>
  <span>Voxel Art 3D · Azotea · 1 voxel = 0.025 m · ~1.2 × 1.0 × 1.2 m</span>
</div>
<div id="legend">
  <div><i style="background:#33373d"></i> SUCCIÓN (aislada)</div>
  <div><i style="background:#c4793c"></i> LÍQUIDO (cobre)</div>

</div>
<div id="coord">DRAG: Rotar · WHEEL: Zoom · CLIC: Capturar voxel<br><span id="coordVal">VOX  —</span></div>

  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>VENTILADORES</label><button id="bFan" class="on">ON</button></div>
  <div class="row"><label>COMPRESOR</label><button id="bComp" class="on">ON</button></div>
  <div class="row"><label>CORTE (interior)</label><button id="bCut" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="module" id="app">
// ============================================================================
// UNIDAD CONDENSADORA DE REFRIGERACIÓN (azotea/exterior) · Voxel Art 3D
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Envolvente: 1.20 m (X) × 1.20 m (Y) × 1.00 m (Z)  = 48 × 48 × 40 vox
//   Serpentín condensador aletado en 4 caras (celosía densa fin+tubo cobre)
//   2 ventiladores axiales en el techo (GIRAN con inercia) · rejilla de guarda
//   Compresores scroll + recibidor de líquido visibles en CORTE (panel frontal)
//   Succión aislada gruesa (negra) + línea de líquido fina (cobre) + válvulas
//   Tablero eléctrico lateral con desconectador · patas con anclas
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  FLOOR:   { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D: { c:0x1c2028, r:0.90, m:0.05 },
  CURB:    { c:0x14171d, r:0.85, m:0.10 },
  // --- gabinete gris claro ---
  CAB:     { c:0xc2c8ce, r:0.55, m:0.25 },
  CAB_D:   { c:0x9aa1a8, r:0.60, m:0.30 },
  CAB_L:   { c:0xdadfe4, r:0.50, m:0.20 },
  FRAME:   { c:0x7c848c, r:0.45, m:0.65 },
  BASEM:   { c:0x3a3f46, r:0.70, m:0.35 },
  BASE:    { c:0x24282e, r:0.75, m:0.30 },
  // --- serpentín: aletas aluminio + tubo cobre (caras fijas) ---
  FIN:     { c:0xaeb8c2, r:0.35, m:0.90 },
  FIN_D:   { c:0x8b95a0, r:0.42, m:0.85 },
  FIN_L:   { c:0xccd4db, r:0.30, m:0.92 },
  CU:      { c:0xc4793c, r:0.35, m:1.00 },
  CU_D:    { c:0x9c5c2a, r:0.40, m:0.95 },
  // --- serpentín cara frontal REMOVIBLE en CORTE (prefijo CUT*) ---
  CUTFIN:  { c:0xaeb8c2, r:0.35, m:0.90 },
  CUTFIN_D:{ c:0x8b95a0, r:0.42, m:0.85 },
  CUTFIN_L:{ c:0xccd4db, r:0.30, m:0.92 },
  CUTCU:   { c:0xc4793c, r:0.35, m:1.00 },
  // --- interior ---
  COMP:    { c:0x30353d, r:0.50, m:0.85 },
  COMP_L:  { c:0x474d56, r:0.45, m:0.80 },
  COMP_T:  { c:0x585f69, r:0.40, m:0.80 },
  RECV:    { c:0x6f7883, r:0.40, m:0.85 },
  RECV_D:  { c:0x565d66, r:0.45, m:0.85 },
  // --- refrigerante ---
  SUCT:    { c:0x1a1c21, r:0.85, m:0.10 },
  SUCT_L:  { c:0x2a2d34, r:0.80, m:0.12 },
  LIQ:     { c:0xc4793c, r:0.35, m:1.00 },
  VALVE:   { c:0xb87333, r:0.35, m:1.00 },
  // --- ventiladores / rejilla ---
  FANH:    { c:0x2b2f36, r:0.55, m:0.60 },
  FANH_D:  { c:0x20242a, r:0.60, m:0.55 },
  GRILLE:  { c:0x3c424a, r:0.50, m:0.70 },
  // --- tablero eléctrico ---
  PANEL:   { c:0x8b9299, r:0.50, m:0.60 },
  PANEL_D: { c:0x767d84, r:0.55, m:0.60 },
  CONDUIT: { c:0xb7c0c7, r:0.30, m:0.95 },
  DISC_Y:  { c:0xffc400, r:0.75, m:0.00 },
  DISC_R:  { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.30 },
  // --- accesorios ---
  ANCHOR:  { c:0xb7c0c7, r:0.30, m:0.95 },
  GALV_D:  { c:0x87919a, r:0.40, m:0.90 },
  TEAL:    { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  YEL:     { c:0xffc400, r:0.75, m:0.00 },
  BLK:     { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:     { c:0xe8edf2, r:0.60, m:0.10 },
  CYAN:    { c:0x7fd4e6, r:0.50, m:0.20, e:0x7fd4e6, ei:0.40 },
  PLATE:   { c:0x11141a, r:0.90, m:0.05 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// Dimensiones envolvente (voxeles)
const WX = 48, HY = 48, DZ = 40;

// ====== PISO / AZOTEA (y = -1) con juntas ======
for (let x = -6; x <= WX + 5; x++) {
  for (let z = -6; z <= DZ + 5; z++) {
    let c = (hash2(x, z) % 100 < 18) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 60) % 20 === 0 || (z + 60) % 20 === 0) c = 'FLOOR_D';
    vox(x, -1, z, c);
  }
}
// riel / durmiente bajo la unidad
fill(1, 7, 0, 0, 2, DZ - 3, 'CURB');
fill(WX - 8, WX - 2, 0, 0, 2, DZ - 3, 'CURB');

// ====== PATAS (4) CON ANCLAS ======
const LEGS = [[3, 3], [WX - 7, 3], [3, DZ - 7], [WX - 7, DZ - 7]];
for (const L of LEGS) {
  fill(L[0], L[0] + 3, 0, 4, L[1], L[1] + 3, 'BASE');
  // ancla galvanizada en la base
  vox(L[0] + 1, 0, L[1] + 1, 'ANCHOR'); vox(L[0] + 2, 0, L[1] + 2, 'ANCHOR');
  fill(L[0], L[0] + 3, 0, 0, L[1], L[1] + 3, 'BASEM');
}
// travesaños perimetrales de la base (canal)
fill(3, WX - 4, 2, 4, 3, 5, 'BASEM');
fill(3, WX - 4, 2, 4, DZ - 7, DZ - 5, 'BASEM');
fill(3, 5, 2, 4, 3, DZ - 4, 'BASEM');
fill(WX - 6, WX - 4, 2, 4, 3, DZ - 4, 'BASEM');
// charola de base y piso interior del gabinete
fill(2, WX - 3, 5, 6, 2, DZ - 3, 'BASEM');

// ====== GABINETE: bastidor + rieles ======
const CY0 = 6, CY1 = 43;          // altura del cuerpo
// postes verticales de esquina
for (const p of [[0, 0], [WX - 2, 0], [0, DZ - 2], [WX - 2, DZ - 2]]) {
  fill(p[0], p[0] + 1, CY0, CY1, p[1], p[1] + 1, 'FRAME');
}
// riel inferior y superior perimetral
for (const yy of [[CY0, CY0 + 1], [CY1 - 1, CY1]]) {
  fill(0, WX - 1, yy[0], yy[1], 0, 1, yy === undefined ? 'CAB' : 'CAB_D');
}
fill(0, WX - 1, CY0, CY0 + 1, 0, 1, 'CAB_D');
fill(0, WX - 1, CY1 - 1, CY1, 0, 1, 'CAB');
fill(0, WX - 1, CY0, CY0 + 1, DZ - 2, DZ - 1, 'CAB_D');
fill(0, WX - 1, CY1 - 1, CY1, DZ - 2, DZ - 1, 'CAB');
fill(0, 1, CY0, CY1, 0, DZ - 1, 'CAB_D');
fill(WX - 2, WX - 1, CY0, CY1, 0, DZ - 1, 'CAB_D');

// ====== SERPENTÍN CONDENSADOR ALETADO (celosía densa) ======
// patrón: tubo de cobre horizontal cada 4 filas, aletas de aluminio entre ellos
function coilColor(u, y, yb, cut) {
  const T = cut ? ['CUTFIN', 'CUTFIN_D', 'CUTFIN_L', 'CUTCU'] : ['FIN', 'FIN_D', 'FIN_L', 'CU'];
  if ((y - yb) % 4 === 0) return T[3];              // corrida de tubo cobre
  if (y % 2 === 0) return T[1];                     // junta de aleta
  return (hash2(u, y) % 100 < 25) ? T[2] : T[0];    // dither aluminio
}
// cara FRONTAL (z=0) — REMOVIBLE en CORTE
const FX0 = 2, FX1 = WX - 3, FY0 = 8, FY1 = 41;
for (let x = FX0; x <= FX1; x++)
  for (let y = FY0; y <= FY1; y++) vox(x, y, 0, coilColor(x, y, FY0, true));
fill(FX0, FX0, FY0, FY1, 0, 0, 'CUTCU'); fill(FX1, FX1, FY0, FY1, 0, 0, 'CUTCU');
// cara TRASERA (z=DZ-1)
for (let x = FX0; x <= FX1; x++)
  for (let y = FY0; y <= FY1; y++) vox(x, y, DZ - 1, coilColor(x, y, FY0, false));
fill(FX0, FX0, FY0, FY1, DZ - 1, DZ - 1, 'CU'); fill(FX1, FX1, FY0, FY1, DZ - 1, DZ - 1, 'CU');
// cara IZQUIERDA (x=0)
for (let z = 2; z <= DZ - 3; z++)
  for (let y = FY0; y <= FY1; y++) vox(0, y, z, coilColor(z, y, FY0, false));
// cara DERECHA (x=WX-1) — sólo tramo superior (abajo va el tablero)
for (let z = 2; z <= DZ - 3; z++)
  for (let y = 24; y <= FY1; y++) vox(WX - 1, y, z, coilColor(z, y, 24, false));

// ====== TECHO / PLENUM DE VENTILADORES ======
const DECK = 44;                                  // placa del deck
fill(1, WX - 2, DECK, DECK, 1, DZ - 2, 'FANH');   // placa superior
// dos ventiladores axiales
const FANS = [
  { cx: 13.0, cz: DZ / 2, r: 9.0 },
  { cx: WX - 14.0, cz: DZ / 2, r: 9.0 }
];
function fanGrilleTop(cx, cz, r) {
  const gx0 = Math.floor(cx - r) - 1, gx1 = Math.ceil(cx + r) + 1;
  const gz0 = Math.floor(cz - r) - 1, gz1 = Math.ceil(cz + r) + 1;
  for (let x = gx0; x <= gx1; x++) {
    for (let z = gz0; z <= gz1; z++) {
      const dx = x + 0.5 - cx, dz = z + 0.5 - cz;
      const d = Math.hypot(dx, dz);
      if (d <= r + 1.2 && d > r - 0.2) {
        // aro venturi
        fill(x, x, DECK, DECK + 3, z, z, 'FANH_D');
      }
      if (d <= r) {
        // hueco del ventilador (cavidad hacia el interior)
        cells.delete(K(x, DECK, z));
        // guarda superior: anillos concéntricos + radios
        const ring = (Math.floor(d) % 2 === 0);
        const spoke = (Math.abs(dx) < 0.6) || (Math.abs(dz) < 0.6) ||
                      (Math.abs(dx - dz) < 0.9) || (Math.abs(dx + dz) < 0.9);
        if (ring || spoke) vox(x, DECK + 3, z, 'GRILLE');
      }
    }
  }
}
FANS.forEach(f => fanGrilleTop(f.cx, f.cz, f.r));
// franja de marca teal en el frente del deck
fill(4, WX - 5, DECK - 1, DECK - 1, 0, 0, 'TEAL');

// ====== INTERIOR (visible en CORTE): compresores + recibidor + manifold ======
// dos compresores scroll (columnas octogonales)
function octColumn(cx, cz, r, y0, y1, cBody, cTop) {
  for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
    for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++) {
      const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
      if (d <= r) {
        for (let y = y0; y <= y1; y++) vox(x, y, z, (y >= y1 - 1) ? cTop : cBody);
      }
    }
  }
}
const COMPS = [{ cx: 15, cz: 21, r: 5.2 }, { cx: 33, cz: 21, r: 5.2 }];
for (const c of COMPS) {
  octColumn(c.cx, c.cz, c.r, 7, 21, 'COMP', 'COMP_T');
  // caja de bornes al frente
  fill(Math.round(c.cx) - 2, Math.round(c.cx) + 2, 12, 16, 8, 9, 'COMP_L');
  vox(Math.round(c.cx), 14, 8, 'WHT');
  // pata antivibratoria
  vox(Math.round(c.cx), 6, Math.round(c.cz), 'BLK');
}
// recibidor de líquido (tanque vertical) en el fondo-izquierda
fill(6, 11, 8, 30, DZ - 12, DZ - 7, 'RECV');
fill(6, 11, 8, 8, DZ - 12, DZ - 7, 'RECV_D');
fill(6, 11, 30, 30, DZ - 12, DZ - 7, 'RECV_D');
fill(7, 10, 31, 32, DZ - 11, DZ - 8, 'RECV_D');    // domo superior
vox(11, 12, DZ - 9, 'VALVE');                       // válvula de servicio
// manifold de succión interior (tubo aislado grueso) desde compresores
fill(14, 16, 21, 30, 20, 22, 'SUCT');               // riser comp-1
fill(32, 34, 21, 30, 20, 22, 'SUCT');               // riser comp-2
fill(14, 34, 29, 31, 20, 22, 'SUCT');               // cabezal horizontal
fill(33, 45, 29, 31, 20, 22, 'SUCT');               // hacia salida derecha
// descarga a condensador (cobre fino, sube al plenum)
fill(18, 18, 21, 40, 20, 20, 'CU');
fill(30, 30, 21, 40, 20, 20, 'CU');
// línea de líquido interior (recibidor -> exterior frontal)
fill(9, 9, 8, 12, DZ - 10, DZ - 10, 'LIQ');
fill(9, 43, 11, 12, 4, 5, 'LIQ');

// ====== CONEXIONES DE REFRIGERANTE EXTERIORES (frente-derecha, siempre visibles) ======
// succión aislada gruesa (negra) saliendo del gabinete y bajando
fill(WX - 8, WX - 3, 27, 32, -1, 1, 'SUCT');        // codo de salida
fill(WX - 6, WX - 4, 12, 32, -3, -2, 'SUCT');       // bajante aislado
fill(WX - 7, WX - 3, 24, 26, -4, -2, 'SUCT_L');     // brida/soporte
// válvula de servicio de succión (cobre)
fill(WX - 6, WX - 4, 12, 14, -5, -4, 'VALVE');
vox(WX - 5, 15, -4, 'WHT');
// línea de líquido fina (cobre)
fill(WX - 10, WX - 9, 10, 26, -3, -2, 'LIQ');
fill(WX - 10, WX - 4, 10, 11, -3, -2, 'LIQ');       // hacia válvula
// válvula de servicio de líquido
fill(WX - 6, WX - 5, 8, 10, -5, -4, 'VALVE');
// abrazaderas
vox(WX - 5, 20, -3, 'GALV_D'); vox(WX - 5, 28, -3, 'GALV_D');
vox(WX - 9, 18, -3, 'GALV_D');

// ====== TABLERO ELÉCTRICO LATERAL (derecha, tramo inferior) ======
// caja saliente x = WX-1 .. WX+1
fill(WX - 1, WX + 1, CY0 + 1, 23, 8, 30, 'PANEL');
fill(WX + 1, WX + 1, CY0 + 2, 22, 9, 29, 'PANEL_D');   // puerta
// desconectador (mango) sobre la puerta, posición ON (arriba)
fill(WX + 1, WX + 1, 15, 20, 24, 27, 'DISC_Y');
fill(WX + 2, WX + 2, 18, 21, 25, 26, 'DISC_R');        // palanca ON
vox(WX + 1, 14, 25, 'BLK');                            // eje
// etiqueta de seguridad amarilla
fill(WX + 1, WX + 1, 12, 15, 12, 14, 'YEL');
vox(WX + 1, 14, 13, 'BLK'); vox(WX + 1, 13, 13, 'BLK');
// conducto (conduit) del tablero hacia la base
fill(WX, WX + 1, CY0, CY0 + 1, 27, 28, 'CONDUIT');
fill(WX, WX + 1, 1, CY0, 27, 28, 'CONDUIT');
// bornera piloto (bisel de lámpara "run")
vox(WX + 1, 21, 12, 'BLK');

// ====== PLACA DE DATOS + LOGO FRONTAL (sobre el bastidor) ======
fill(WX - 12, WX - 4, CY1 - 4, CY1 - 2, 0, 0, 'PLATE');
fill(4, 10, CY1 - 4, CY1 - 2, 0, 0, 'PLATE');

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 160, 420);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(80, 150, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -90; sc.right = 90; sc.top = 110; sc.bottom = -40; sc.near = 5; sc.far = 420;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(24, 22, 20);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-60, 50, 80);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(30, 50, -100);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
const cutMeshes = [];
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
  if (cname.indexOf('CUT') === 0) cutMeshes.push(im);
}

// ====== ESTADO ======
const state = { fan: true, comp: true, cut: false, rot: false };
function applyCut() { for (const m of cutMeshes) m.visible = !state.cut; }
applyCut();

// ====== PARTES DINÁMICAS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}

// -- Ventiladores axiales (aspas de cajas con pitch, buje central) --
const matBlade = new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.45, metalness: 0.55, envMapIntensity: 0.5 });
const matHub = new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.5, metalness: 0.7 });
function buildFan(r) {
  const g = new THREE.Group();
  g.add(dynBox(matHub, 0, 0, 0, 2.0, 2.0, 1.2));       // buje
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Group();
    const b = dynBox(matBlade, 0, r * 0.52, 0, r * 0.55, r, 0.5);
    b.rotation.y = 0.6;                                  // pitch de aspa
    arm.add(b);
    arm.rotation.z = i * (Math.PI * 2 / 5);
    g.add(arm);
  }
  return g;
}
const fanRigs = [];
for (const f of FANS) {
  const fan = buildFan(f.r);
  const mount = new THREE.Group();
  mount.add(fan);
  mount.position.set(f.cx, DECK + 1.5, f.cz);
  mount.rotation.x = -Math.PI / 2;                       // acostar el rotor (eje vertical)
  scene.add(mount);
  fanRigs.push({ fan: fan, f: f });
}

// -- Lámpara "RUN" del tablero (verde cuando compresor ON) --
const runMat = emat(0x00ff66, 0x062a12, 1.6);
scene.add(dynBox(runMat, WX + 1.4, 21.5, 12.5, 0.9, 0.9, 0.9));
const runLight = new THREE.PointLight(0x00ff66, 1.0, 14, 2);
runLight.position.set(WX + 4, 21.5, 13);
scene.add(runLight);

// -- Aire de rechazo: partículas ascendentes sobre cada ventilador --
const airMat = emat(0x7fd4e6, 0x0a1c22, 1.4);
const airPuffs = [];
for (const f of FANS) {
  const g = new THREE.Group();
  const items = [];
  for (let i = 0; i < 10; i++) {
    const m = dynBox(airMat, 0, 0, 0, 0.7, 0.7, 0.7);
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * f.r * 0.7;
    m.userData = {
      bx: f.cx + Math.cos(ang) * rad, bz: f.cz + Math.sin(ang) * rad,
      t: Math.random()
    };
    g.add(m); items.push(m);
  }
  scene.add(g);
  airPuffs.push({ group: g, items: items });
}

// -- Flujo de refrigerante (succión + líquido), gateado por COMPRESOR --
function makeFlow(pts, hex, speed, size) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(3, Math.round(L / 6));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, size, size, size);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [
  // succión: compresores -> salida exterior -> bajante (frío, cian)
  { f: makeFlow([[15, 30, 21], [34, 30, 21], [44, 30, 21], [44, 29, 0], [44, 13, -3]], 0x7fd4e6, 9, 0.72) },
  // líquido: recibidor -> salida frontal -> válvula (cobre)
  { f: makeFlow([[9, 22, DZ - 10], [9, 11, 4], [43, 11, 4], [43, 10, -3]], 0xffa04d, 7, 0.55) }
];
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let fanSpeed = 0, tNow = 0;
function tick(dt) {
  tNow += dt;
  // inercia de ventiladores
  const target = state.fan ? 11 : 0;
  fanSpeed += (target - fanSpeed) * Math.min(1, dt * 1.6);
  for (const r of fanRigs) r.fan.rotation.z += fanSpeed * dt;
  // lámpara RUN del compresor
  runMat.emissiveIntensity = state.comp ? 1.6 : 0.1;
  runLight.intensity = state.comp ? 1.0 : 0.0;
  // aire de rechazo (visible si giran los ventiladores)
  const airOn = fanSpeed > 1.5;
  for (const ap of airPuffs) {
    ap.group.visible = airOn;
    if (!airOn) continue;
    for (const m of ap.items) {
      m.userData.t = (m.userData.t + dt * 0.5) % 1;
      const h = m.userData.t;
      m.position.set(m.userData.bx, DECK + 4 + h * 16, m.userData.bz);
      m.scale.setScalar(0.7 * (1 - h) + 0.15);
    }
  }
  // flujo de refrigerante gateado por compresor
  for (const o of flows) o.f.update(dt, state.comp);
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(92, 66, 96);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(24, 22, 20);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bFan', 'fan'], ['bComp', 'comp'], ['bCut', 'cut'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? 'on' : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      if (bs[1] === 'cut') applyCut();
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes.filter(m => m.visible), false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
</body>
</html>
