  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }

  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }

  <div class="pct" id="lvlPct">agua 45% · aire 50%</div>

<script>
// Dynamic importmap injection (avoids CDN "@version" mangling; allows file:// opening)
(function(){
  const AT = String.fromCharCode(64);
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three" + AT + "0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 voxel = 0.05 m  (micro-voxel, 2x densidad vs 0.1 m para alta densidad)
// Expansión: Ø0.60 x 1.50 m = 12 x 30 vox  ·  Buffer: Ø1.20 x 2.00 m = 24 x 40 vox
const EX = -20;   // expansion tank axis X
const BX = 18;    // buffer tank axis X

// ---------------------------------------------------------------- palette
const MATS = {
  PAD:    { c:0x2c3138, r:0.95, m:0.02 },
  STEEL:  { c:0xb9c0c8, r:0.32, m:0.85 },
  STEEL_D:{ c:0x7b828b, r:0.40, m:0.80 },
  BOLT:   { c:0x4c525b, r:0.45, m:0.75 },
  RED:    { c:0xc0392b, r:0.50, m:0.15 },
  RED_D:  { c:0x93251a, r:0.55, m:0.15 },
  REDT:   { c:0xd4453a, r:0.45, m:0.10, t:0.22 },        // transparent shell (cutaway)
  BRASS:  { c:0xcfa22e, r:0.28, m:0.90 },
  BLUE:   { c:0x1f5fa8, r:0.45, m:0.35 },
  BLUE_D: { c:0x174a83, r:0.50, m:0.35 },
  INSUL:  { c:0x9aa3ad, r:0.95, m:0.05 },
  INSUL_D:{ c:0x8a939d, r:0.95, m:0.05 },
  SEAM:   { c:0x646d78, r:0.80, m:0.30 },
  PIPE:   { c:0x2f8fe6, r:0.38, m:0.35 },
  WHEEL:  { c:0xd42a2a, r:0.50, m:0.20 },
  DIAL:   { c:0xf3f5f8, r:0.30, m:0.10, e:0xffffff, ei:0.12 },
  RING:   { c:0x22262e, r:0.60, m:0.50 },
  PLATE:  { c:0xe1e6ec, r:0.30, m:0.65 },
  PTXT:   { c:0x3a4148, r:0.60, m:0.30 },
};

// ---------------------------------------------------------------- vox engine
const voxData = {};            // colorKey -> [[x,y,z],...]
const filled  = new Set();     // dedupe guard: 0 duplicate cells by construction
let   skipped = 0;
function vox(x, y, z, k){
  const key = x + ',' + y + ',' + z;
  if (filled.has(key)) { skipped++; return; }
  filled.add(key);
  (voxData[k] || (voxData[k] = [])).push([x, y, z]);
}
function fillBox(k, x0, x1, y0, y1, z0, z1, skip){
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++){
    if (skip && skip(x, y, z)) continue;
    vox(x, y, z, k);
  }
}
const distE = (x, z) => Math.hypot(x + 0.5 - EX, z + 0.5);
const distB = (x, z) => Math.hypot(x + 0.5 - BX, z + 0.5);
const chk   = (x, y, z, a, b) => (((x + y + z) & 1) ? a : b);

// ================================================================ EXPANSION TANK
// housekeeping pad
fillBox('PAD', -29, -11, 0, 0, -9, 8);

// dome cap radius (bottom cap y=5..9, top cap y=30..34)
function capRE(y){
  let t;
  if (y >= 5  && y <= 9 ) t = (9.5 - y) / 5.2;
  else if (y >= 30 && y <= 34) t = (y - 29.5) / 5.2;
  else return -1;
  return 6 * Math.sqrt(Math.max(1 - t * t, 0));
}
// solid voxelized caps (checker)
for (let y = 5; y <= 34; y++){
  const r = capRE(y);
  if (r < 0) continue;
  for (let x = EX - 7; x <= EX + 6; x++) for (let z = -7; z <= 6; z++)
    if (distE(x, z) <= r) vox(x, y, z, chk(x, y, z, 'RED', 'RED_D'));
}
// transparent cylindrical shell (cutaway) y=10..29, ring 5<d<=6
for (let y = 10; y <= 29; y++)
  for (let x = EX - 7; x <= EX + 6; x++) for (let z = -7; z <= 6; z++){
    const d = distE(x, z);
    if (d > 5 && d <= 6) vox(x, y, z, 'REDT');
  }
// legs (3 @ 120deg) tucked under cap, guarded against cap cells
const legsE = [ {x0:EX-1, z0:4}, {x0:-26, z0:-4}, {x0:-16, z0:-4} ];
for (const L of legsE){
  fillBox('STEEL', L.x0 - 1, L.x0 + 2, 1, 1, L.z0 - 1, L.z0 + 2);        // base plate 4x4
  for (const [bx, bz] of [[L.x0-1,L.z0-1],[L.x0-1,L.z0+2],[L.x0+2,L.z0-1],[L.x0+2,L.z0+2]])
    vox(bx, 2, bz, 'BOLT');                                              // anchor bolts
  for (let y = 2; y <= 8; y++)
    for (let x = L.x0; x <= L.x0 + 1; x++) for (let z = L.z0; z <= L.z0 + 1; z++){
      const r = capRE(y);
      if (r >= 0 && distE(x, z) <= r) continue;                          // never intrude the cap
      vox(x, y, z, 'STEEL_D');
    }
}
// Schrader air valve on top
fillBox('BRASS',   EX - 1, EX, 35, 36, -1, 0);
fillBox('STEEL_D', EX - 1, EX, 37, 37, -1, 0);
// data plate (front, below membrane band travel)
fillBox('PLATE', -22, -19, 10, 13, 6, 6, (x, y) =>
  (y === 12 && x >= -21 && x <= -19) || (y === 11 && x >= -21 && x <= -20));
fillBox('PTXT', -21, -19, 12, 12, 6, 6);
fillBox('PTXT', -21, -20, 11, 11, 6, 6);
// manometer (front, air side)
fillBox('STEEL', -21, -20, 26, 27, 6, 8);
fillBox('RING', -22, -18, 24, 28, 9, 9, (x, y) => x > -22 && x < -18 && y > 24 && y < 28);
fillBox('DIAL', -21, -19, 25, 27, 9, 9);

// ================================================================ BUFFER TANK
fillBox('PAD', 4, 31, 0, 0, -14, 13);

function headRB(y){
  let t;
  if (y >= 6  && y <= 11) t = (11.5 - y) / 6.2;
  else if (y >= 40 && y <= 45) t = (y - 39.5) / 6.2;
  else return -1;
  return 12 * Math.sqrt(Math.max(1 - t * t, 0));
}
// solid voxelized heads (vessel blue, checker)
for (let y = 6; y <= 45; y++){
  const r = headRB(y);
  if (r < 0) continue;
  for (let x = BX - 13; x <= BX + 12; x++) for (let z = -13; z <= 12; z++)
    if (distB(x, z) <= r) vox(x, y, z, chk(x, y, z, 'BLUE', 'BLUE_D'));
}
// insulated jacket y=12..39 (ring 11<d<=12) with seam rings + nozzle apertures
const nozzleWindow = (y, z) => (z === -1 || z === 0) && ((y >= 14 && y <= 15) || (y >= 35 && y <= 36));
for (let y = 12; y <= 39; y++)
  for (let x = BX - 13; x <= BX + 12; x++) for (let z = -13; z <= 12; z++){
    const d = distB(x, z);
    if (d <= 11 || d > 12) continue;
    if (nozzleWindow(y, z)) continue;
    const k = (y === 18 || y === 24 || y === 30) ? 'SEAM'
            : ((((y - 12) / 6) | 0) & 1 ? 'INSUL_D' : 'INSUL');
    vox(x, y, z, k);
  }
// legs (4) with anchor plates, guarded against bottom head
const legsB = [ {x0:10, z0:-8}, {x0:10, z0:6}, {x0:24, z0:-8}, {x0:24, z0:6} ];
for (const L of legsB){
  fillBox('STEEL', L.x0 - 1, L.x0 + 2, 1, 1, L.z0 - 1, L.z0 + 2);
  for (const [bx, bz] of [[L.x0-1,L.z0-1],[L.x0-1,L.z0+2],[L.x0+2,L.z0-1],[L.x0+2,L.z0+2]])
    vox(bx, 2, bz, 'BOLT');
  for (let y = 2; y <= 8; y++)
    for (let x = L.x0; x <= L.x0 + 1; x++) for (let z = L.z0; z <= L.z0 + 1; z++){
      const r = headRB(y);
      if (r >= 0 && distB(x, z) <= r) continue;
      vox(x, y, z, 'STEEL_D');
    }
}
// 4 flanged nozzles (bocas bridadas)
fillBox('PIPE', 0, 7, 14, 15, -1, 0);                                        // N1 low -x (piped)
fillBox('STEEL', 2, 2, 13, 16, -2, 1, (x,y,z) => y>=14 && y<=15 && z>=-1 && z<=0); // flange ring
fillBox('PIPE', 2, 7, 35, 36, -1, 0);                                        // N2 high -x (blind)
fillBox('STEEL', 1, 1, 34, 37, -2, 1);
for (const [by, bz] of [[34,-2],[34,1],[37,-2],[37,1]]) vox(0, by, bz, 'BOLT');
fillBox('PIPE', 28, 33, 14, 15, -1, 0);                                      // N3 low +x (blind)
fillBox('STEEL', 34, 34, 13, 16, -2, 1);
for (const [by, bz] of [[13,-2],[13,1],[16,-2],[16,1]]) vox(35, by, bz, 'BOLT');
fillBox('PIPE', 28, 33, 35, 36, -1, 0);                                      // N4 high +x (blind)
fillBox('STEEL', 34, 34, 34, 37, -2, 1);
for (const [by, bz] of [[34,-2],[34,1],[37,-2],[37,1]]) vox(35, by, bz, 'BOLT');
// thermometers (2, front)
for (const ty of [16, 32]){
  fillBox('STEEL', 17, 18, ty, ty + 1, 12, 13);
  fillBox('RING', 15, 19, ty - 2, ty + 2, 14, 14, (x, y) => x > 15 && x < 19 && y > ty - 2 && y < ty + 2);
  fillBox('DIAL', 16, 18, ty - 1, ty + 1, 14, 14);
}
// data plate (front)
fillBox('PLATE', 15, 20, 19, 24, 12, 12, (x, y) =>
  (y === 23 && x >= 16 && x <= 19) || (y === 21 && x >= 16 && x <= 18) || (y === 20 && x >= 16 && x <= 19));
fillBox('PTXT', 16, 19, 23, 23, 12, 12);
fillBox('PTXT', 16, 18, 21, 21, 12, 12);
fillBox('PTXT', 16, 19, 20, 20, 12, 12);
// manometer on top head
fillBox('BRASS', 21, 21, 46, 47, 0, 0);
fillBox('RING', 19, 23, 48, 52, 0, 0, (x, y) => x > 19 && x < 23 && y > 48 && y < 52);
fillBox('DIAL', 20, 22, 49, 51, 0, 0);

// ================================================================ PIPING (interconnection)
fillBox('PIPE', -2, -1, 0, 15, -1, 0);          // drop column at buffer N1
fillBox('PIPE', -19, -14, 1, 2, -1, 0);         // run segment A (over expansion pad)
fillBox('PIPE', -10, -3, 1, 2, -1, 0);          // run segment B
fillBox('PIPE', -21, -20, 1, 4, -1, 0);         // riser into expansion bottom cap
fillBox('STEEL', -13, -11, 1, 4, -2, 1);        // shut-off valve body (conexion inferior)
fillBox('STEEL_D', -12, -12, 5, 7, -1, -1);     // valve stem
fillBox('WHEEL', -13, -11, 8, 8, -2, 0);        // red handwheel
fillBox('STEEL_D', -10, -9, 0, 0, -1, 0);       // pipe support
fillBox('STEEL_D', -5, -4, 0, 0, -1, 0);        // pipe support

// ================================================================ SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 150, 320);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(62, 44, 66);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// environment IBL
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// light rig
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;   sun.shadow.camera.bottom = -80;
sun.shadow.camera.near = 10;  sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4); fill.position.set(-50, 40, -30); scene.add(fill);
const rim  = new THREE.DirectionalLight(0x00d4aa, 0.2); rim.position.set(0, 25, -70);    scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ground + grid
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(300, 60, 0x0e3b33, 0x0b1620);
grid.position.y = -0.04;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ---------------------------------------------------------------- static InstancedMesh per color
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const M4 = new THREE.Matrix4();
for (const k in voxData){
  const s = MATS[k];
  const mat = new THREE.MeshStandardMaterial({
    color: s.c, roughness: s.r, metalness: s.m,
    ...(s.e ? { emissive: s.e, emissiveIntensity: s.ei } : {}),
    ...(s.t ? { transparent: true, opacity: s.t, depthWrite: false, side: THREE.DoubleSide } : {})
  });
  const arr = voxData[k];
  const im = new THREE.InstancedMesh(cubeGeo, mat, arr.length);
  arr.forEach((p, i) => { M4.setPosition(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5); im.setMatrixAt(i, M4); });
  im.instanceMatrix.needsUpdate = true;
  im.frustumCulled = false;
  im.castShadow = !s.t;
  im.receiveShadow = true;
  if (s.t) im.renderOrder = 2;
  scene.add(im);
}

// ---------------------------------------------------------------- dynamic level system
// interior cells (inside transparent shell): y=10..29, d<=5
const LVL = { mY: [15, 19, 24], names: ['BAJO', 'NORMAL', 'ALTO'], pct: ['agua 25% · aire 70%', 'agua 45% · aire 50%', 'agua 70% · aire 25%'] };
const innerCells = [];
for (let y = 10; y <= 29; y++)
  for (let x = EX - 6; x <= EX + 5; x++) for (let z = -6; z <= 5; z++)
    if (distE(x, z) <= 5) innerCells.push([x, y, z]);

function makeIM(cells, props){
  const mat = new THREE.MeshStandardMaterial({
    color: props.c, roughness: props.r, metalness: props.m ?? 0.1,
    ...(props.e ? { emissive: props.e, emissiveIntensity: props.ei } : {})
  });
  const im = new THREE.InstancedMesh(cubeGeo, mat, Math.max(cells.length, 1));
  cells.forEach((p, i) => { M4.setPosition(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5); im.setMatrixAt(i, M4); });
  im.instanceMatrix.needsUpdate = true;
  im.frustumCulled = false;
  im.castShadow = false; im.receiveShadow = true;
  scene.add(im);
  return im;
}
// water (two tones, sorted bottom-up; count trick shows first N instances)
const waterA = innerCells.filter(p => p[1] <= 23 && ((p[0] + p[1] + p[2]) & 1) === 0).sort((a, b) => a[1] - b[1]);
const waterB = innerCells.filter(p => p[1] <= 23 && ((p[0] + p[1] + p[2]) & 1) === 1).sort((a, b) => a[1] - b[1]);
// air precharge (sorted top-down)
const airC   = innerCells.filter(p => p[1] >= 16).sort((a, b) => b[1] - a[1]);
const wCntA = LVL.mY.map(m => waterA.filter(p => p[1] < m).length);
const wCntB = LVL.mY.map(m => waterB.filter(p => p[1] < m).length);
const aCnt  = LVL.mY.map(m => airC.filter(p => p[1] > m).length);
const waterAIM = makeIM(waterA, { c: 0x2f8fe6, r: 0.35, e: 0x0d3a63, ei: 0.55 });
const waterBIM = makeIM(waterB, { c: 0x55b4ff, r: 0.35, e: 0x11507f, ei: 0.50 });
const airIM    = makeIM(airC,   { c: 0xffd166, r: 0.50, e: 0x8a6414, ei: 0.50 });
// membrane discs + exterior color bands, one set per level (visibility toggled)
const membranes = [], bands = [], memCells = [], bandCells = [];
for (const m of LVL.mY){
  const mc = innerCells.filter(p => p[1] === m);
  memCells.push(mc);
  membranes.push(makeIM(mc, { c: 0x23262e, r: 0.9, m: 0.2 }));
  const bc = [];
  for (let x = EX - 8; x <= EX + 7; x++) for (let z = -8; z <= 7; z++){
    const d = distE(x, z);
    if (d > 6 && d <= 7){ bc.push([x, m, z]); bc.push([x, m + 1, z]); }
  }
  bandCells.push(bc);
  bands.push(makeIM(bc, { c: 0xffd23f, r: 0.4, e: 0xffd23f, ei: 0.55 }));
}
let level = 1;
function setLevel(i){
  level = i;
  waterAIM.count = wCntA[i];
  waterBIM.count = wCntB[i];
  airIM.count    = aCnt[i];
  membranes.forEach((g, j) => g.visible = j === i);
  bands.forEach((g, j) => g.visible = j === i);
  document.getElementById('bLvl').textContent = LVL.names[i];
  document.getElementById('lvlPct').textContent = LVL.pct[i];
}
setLevel(1);

// ---------------------------------------------------------------- gauge needles (animated groups)
const needles = [];
function needle(px, py, pz, color, base, amp, spd, ph){
  const g = new THREE.Group();
  g.position.set(px, py, pz);
  const n = new THREE.Mesh(
    new THREE.BoxGeometry(0.26, 1.9, 0.26),
    new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.3, emissive: color, emissiveIntensity: 0.25 })
  );
  n.position.y = 0.72;
  g.add(n);
  const hub = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.55, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.5, metalness: 0.6 })
  );
  g.add(hub);
  g.rotation.z = base;
  scene.add(g);
  needles.push({ g, base, amp, spd, ph });
}
needle(-19.5, 26.5, 10.2, 0x22262e, -0.60, 0.05, 2.2, 0.0);  // manometer expansion
needle( 21.5, 50.5,  1.2, 0x22262e, -0.40, 0.05, 1.8, 1.3);  // manometer buffer
needle( 17.5, 16.5, 15.2, 0xd42a2a,  0.50, 0.04, 2.6, 2.0);  // thermometer buffer low
needle( 17.5, 32.5, 15.2, 0xd42a2a,  0.35, 0.04, 2.0, 0.7);  // thermometer buffer high

// ---------------------------------------------------------------- controls & UI
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 16, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 20;
controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.495;

document.getElementById('bLvl').onclick = () => setLevel((level + 1) % 3);
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let t = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;
  for (const n of needles) n.g.rotation.z = n.base + Math.sin(t * n.spd + n.ph) * n.amp;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// diagnostics (headless validation)
window.__DIAG = {
  totalStatic: filled.size, skipped, voxData,
  perColor: Object.fromEntries(Object.entries(voxData).map(([k, v]) => [k, v.length])),
  staticKeys: filled,
  dyn: { waterA, waterB, airC, wCntA, wCntB, aCnt, mY: LVL.mY, memCells, bandCells }
};
</script>
