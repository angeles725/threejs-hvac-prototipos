evidence_contract:
  p3: "Fresh-context validator checks DESIGNSPEC rules 1–9, local-coordinate/socket integrity and SDD ID consistency before any geometry."
  common_mechanical:
    server: "serve repository root over localhost; never file://"
    console: "capture sidecar has zero errors, warnings, pageerrors and failed/≥400 requests"
    budget: "probe medians ≤550 draws and ≤750000 tris; fps informational only"
    review: "fresh blind review JSON plus saved capture set before any advance"
  asset_gate_common:
    rule: "For each heavy asset unit, run blockout→structural→materials→surface sequentially; each pass stores its own capture/console/review evidence before the next asset or pass unlocks."
    minimum_views: [asset-neutral, asset-context]
    instance_rule: "Family/device masters may be instanced only after their master asset gate passes."
  blockout:
    required_views: [neutral, facade, engineering-section, complete-network, sala-3]
    required_states:
      - "?state=architecture&roof=on&walls=on&tick=0"
      - "?state=engineering&roof=off&cutaway=on&links=all&tick=0"
    proof: "Flat proxy masses prove plan bands, 2/4/2 room families, front-of-house systems, nineteen endpoint markers, four bus trunks/fourteen drops and both visual states. No final material/fault polish is scored."
  structural:
    required_views: [neutral, engineering-section, kitchen, sala-3, technical, ug67, complete-network]
    required_states:
      - "?state=architecture&roof=off&tick=0"
      - "?state=engineering&roof=off&cutaway=on&links=all&tick=0"
    closeups:
      - "Kitchen hood outlet→extract duct root contact."
      - "Roof supply/return plenum→main duct root contacts, with pivot exactly equal to local_start."
      - "UG67 N-female sockets→two antenna roots."
      - "Each UC100 RS-485 terminal→its bus trunk root and each trunk junction→assigned TC300 drop endpoint."
      - "Rear technical-room rectangles and the 1.5 m service corridor shown together with the separating wall and doors."
    proof: "Every appendage spans true parent-local start→end coordinates, every referenced socket exists under its named owner, no geometry floats, and no technical room overlaps circulation."
  materials:
    required_views: [neutral, grazing, reference-match]
    required_states:
      - "?state=architecture&material_state=neutral&tick=0"
      - "?state=engineering&material_state=neutral&links=all&tick=0"
    proof: "Near-binary materials read correctly in neutral, grazing and reference-match light; network media remain distinct."
  surface:
    required_views: [facade, lobby, concessions, kitchen, auditorium-corridor, sala-3, ug67]
    required_states:
      - "?state=architecture&poster_frame=0&display_frame=0&tick=0"
      - "?state=architecture&poster_frame=1&display_frame=1&tick=0"
      - "?state=engineering&labels=on&links=all&tick=0"
    proof: "Two deterministic surface frames prove abstract poster/menu/display changes; IDs, arrows, acoustic panels, carpet pattern and terminal cues remain generated, readable and free of protected movie imagery."
  lighting-camera:
    required_views: [neutral, grazing, reference-match, facade, lobby, auditorium-corridor, sala-3, complete-network]
    required_states:
      - "?state=architecture&light_state=on&tick=0"
      - "?state=architecture&light_state=off&tick=0"
      - "?state=engineering&light_state=on&links=all&tick=0"
    proof: "Two deterministic light states prove emission channels; all presets preserve intended hierarchy without hiding critical masses/endpoints."
  interaction-ui:
    required_views: [engineering-section, ug67, complete-network]
    required_states:
      - "?state=engineering&links=all&selection=TC300-08&tick=0"
      - "?state=engineering&links=all&selection=TC300-08&tick=30"
      - "?state=fault-tc300&links=all&selection=TC300-08&tick=0"
      - "?state=fault-uc100-b&links=all&tick=0"
      - "?state=fault-internet&links=all&tick=0"
      - "?state=hot-sala-3&links=all&tick=0"
      - "?state=hot-kitchen&links=all&tick=0"
    proof: "Tick 0 and tick 30 captures are the owning-pass two-state evidence for RS-485 arrows, LoRaWAN dashed waves/rings, Ethernet packets and the fixed packet pool. Fault captures prove canonical downstream propagation and restore remains deterministic."
  optimization:
    required_views: [neutral, engineering-section, complete-network, sala-3]
    required_states:
      - "?state=architecture&tick=0"
      - "?state=engineering&links=all&selection=TC300-08&tick=0"
      - "?state=engineering&links=all&selection=TC300-08&tick=30"
    proof: "Before/after comparison keeps every critical proxy/refinement, exact endpoint count, bus drop, selected route and packet/wave position coherent after batching/instancing/culling. Record probe medians, draw/tris utilization, label cap and packet-pool size."
  p6:
    # X4: this design has ZERO photographic references OF THE TARGET — references[] carries
    # datasheets/SDD/P1 notes plus five licensed photos of GENERIC spaces (P1 material/layout
    # evidence, not same-viewpoint references). Per GATES.md "When there are NO reference images": P6 gates on
    # the spec's textual promises + the blockout-vs-final massing strip, never on reference|render
    # pairs. The app's reference-match camera preset remains a lookdev angle, not evidence.
    comparison: spec-only
    required_views: [neutral, grazing, facade, lobby, concessions, kitchen, ticket-checkpoint, auditorium-corridor, sala-3, technical-room, ug67, complete-network, engineering-section]
    required_states:
      - "?state=architecture&roof=on&walls=on&light_state=on&poster_frame=0&tick=0"
      - "?state=engineering&roof=off&cutaway=on&labels=on&links=all&selection=TC300-08&tick=0"
      - "?state=engineering&roof=off&cutaway=on&labels=on&links=all&selection=TC300-08&tick=30"
      - "?state=fault-tc300&links=all&selection=TC300-08&tick=0"
      - "?state=fault-uc100-b&links=all&tick=0"
      - "?state=fault-internet&links=all&tick=0"
      - "?state=hot-sala-3&links=all&tick=0"
      - "?state=hot-kitchen&links=all&tick=0"
    comparison_sheet: "spec-only (X4): blockout-vs-final massing strip + the spec's textual promises (dimensions, part census, materials evidence). No reference|render pairs exist — presenting any capture as reference-matched would be a lie in the evidence set."
    animation_proof: "Repeat deterministic tick 0/tick 30 packet-wave captures and architecture/engineering, light on/off, poster frame 0/1 pairs so every owned animation channel has ≥2 states at its owning pass and P6."

animation_evidence_ownership:
  blockout: [roof_visibility, walls_visibility_and_cutaway, engineering_mode_visibility]
  surface: [abstract_poster_cycle, screen_display_frames, labels_visibility]
  lighting-camera: [screen_emission, aisle_step_leds, exterior_lights]
  interaction-ui: [rs485_data_arrows, lorawan_packets_and_wave_rings, ethernet_packets, selection_highlight, fault_colors, alarm_halos]
