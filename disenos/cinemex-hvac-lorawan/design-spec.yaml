design: cinemex-hvac-lorawan
track: threejs
mode: heavy
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.1 m"

sdd_authority:
  proposal:
    observation_id: 4406
    topic_key: sdd/cinemex-hvac-lorawan/proposal
  specification:
    observation_id: 4409
    topic_key: sdd/cinemex-hvac-lorawan/spec
  contract: "SDD owns behavior, topology, counts, simulation, accessibility, and acceptance; this DesignSpec owns visual/spatial execution and references SDD requirement IDs instead of redefining them."

complexity:
  scores:
    silhouette: 3
    components: 3
    hierarchy: 3
    repetition: 3
    material_layers: 3
    detail: 3
    occlusion: 3
    action_readiness: 3
  total: 24
  tier: complex
  rationale: "A full 60 × 45 m public building, eight auditorium instances, dense fit-out, roof plant, 19 selectable IoT devices, five media/state systems, two visual modes, and sectional/first-person views form a multi-asset scene."

environment:
  overlays:
    handbook: /home/cristian/prototipos/three.js/research/HANDBOOK.md
    house_rules: "/home/cristian/prototipos/three.js/EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    qa_tools: /home/cristian/prototipos/three.js/research/tools
    design_dir_root: /home/cristian/prototipos/three.js/disenos
    research_index: /home/cristian/prototipos/three.js/research/INDEX.md
    research_catalog: /home/cristian/prototipos/three.js/research/CATALOG.md
    technique_skills:
      - /home/cristian/.claude/skills/threejs-fundamentals/SKILL.md
      - /home/cristian/.claude/skills/threejs-geometry/SKILL.md
      - /home/cristian/.claude/skills/threejs-materials/SKILL.md
      - /home/cristian/.claude/skills/threejs-lighting/SKILL.md

references:
  - source: "engram observation #4409 — sdd/cinemex-hvac-lorawan/spec"
    evidences: "Authoritative 60 × 45 m envelope; 4.5 m public and 7–9 m auditorium heights; exact spaces, auditorium families, 14 TC300s, four UC100s, UG67 placement, media semantics, UI states and performance limits."
  - source: "disenos/cinemex-hvac-lorawan/runs/p1-reference-notes.md"
    evidences: "P1 source matrix, image suitability, material evidence, layout fit, licensing and assumptions."
  - source: "https://buildings.honeywell.com/content/dam/hbtbt/en/documents/downloads/hon-ba-bms-tc300-datasheet-3.pdf"
    evidences: "TC300 front dimensions, depth variants, circular glass display/status ring, and RS-485 Modbus RTU/BACnet MS/TP."
  - source: "https://resource.milesight.com/milesight/iot/document/uc100-datasheet-en.pdf"
    evidences: "UC100 70 × 45 × 13 mm, white PC+ABS, one RS-485 terminal, power, LoRaWAN and system LED."
  - source: "https://resource.milesight.com/milesight/iot/document/ug67-datasheet-en.pdf"
    evidences: "UG67 240 × 164 × 90.9 mm, wall mount, two antenna connectors/600 mm antennas, status LEDs, PoE/Ethernet and physical materials."
  - source: "https://www.tridium.com/content/dam/tridium/en/documents/document-lists/niagara/tri-niagara4-supervisor-datasheet-en-2025-0011.pdf"
    evidences: "Niagara browser graphics, analytics, logging/trending, alarms, dashboards and enterprise integration boundary."
  - source: "https://www.ada.gov/law-and-regs/design-standards/2010-stds/"
    evidences: "Conceptual auditorium wheelchair count/dispersion and stadium-style cross-aisle placement reference; not a claim of Mexican code compliance."
  - source: "https://professional.dolby.com/siteassets/cinema/dolby-audio-products/dolby_speaker_system_136_owners_manual_issue_2.pdf"
    evidences: "Typical simplified screen-channel speaker stack behind screen at about two-thirds screen height."
  - source: "https://commons.wikimedia.org/wiki/File:Cinema_seating_Cinema_1_-_105_seats.jpg"
    evidences: "Stepped red seating, aisles, dark enclosure and screen relationship; CC BY-SA 4.0, Iantroberts."
    suitability: pass
  - source: "https://commons.wikimedia.org/wiki/File:A_movie_theater_concession_stand_in_Hiawassee,_Georgia.jpg"
    evidences: "Counter/menu/POS/refrigeration/popcorn arrangement and service-line density; CC BY 4.0, Harrison Keely; visible brands excluded."
    suitability: pass
  - source: "https://commons.wikimedia.org/wiki/File:SIFF_Cinema_lobby_01.jpg"
    evidences: "Lobby circulation, waiting scale, polished floor and lighting; CC BY-SA 3.0, Joe Mabel; older/smaller than target."
    suitability: conditional
  - source: "https://commons.wikimedia.org/wiki/File:January_2014_movie_marquee.jpg"
    evidences: "Projecting marquee depth and entrance emphasis only; CC BY-SA 3.0, Daniel Case; photographed movie titles and exact facade excluded."
    suitability: conditional
  - source: "https://commons.wikimedia.org/wiki/File:Industrial_bakery_kitchen.jpg"
    evidences: "Stainless workline, service aisle and equipment density; CC BY-SA 4.0, Epolk; target kitchen is smaller/enclosed."
    suitability: conditional

