  exterior:
    key: "DirectionalLight white 1.5, static 2048² PCFSoft shadow, tight to building"
    fill: "DirectionalLight 0x88aaff at 0.4"
    rim: "DirectionalLight 0x00d4aa at 0.2"
    ambient: "AmbientLight white 0.24 + RoomEnvironment PMREM 0.04"
  lobby_and_concessions: "Instanced emissive ceiling panels and menu/sign materials supply visible luminance; avoid dozens of shadow-casting point lights."
  corridor: "Low-intensity warm ceiling strips, red/blue accent LEDs and emissive exit signs; no dynamic shadows."
  auditoriums: "Very low neutral ambient, blue step LEDs, green exit signs and controlled screen emission so seating silhouettes remain visible."
  engineering: "Raise neutral fill slightly and reduce shell opacity; network materials remain emissive but do not bloom into unreadable bands."
