            animation: "custom:exterior_camera_visibility_and_tick_pulse"
            count: 14
            rule: "one_per_package_unit"
            read: "Safran-style floating billboard chip above each unit: rounded badge with inverted pointer arrow showing the owning zone's live temperature (es-MX, one decimal, °C); NORMAL = clean badge; ALARM/HOT = red badge WITH the pulsing additive halo (halo only on alarm — 14 simultaneous pulses would be noise); always camera-facing (Sprite); pulse derives from the tick clock, never wall time"
            visibility_contract: "chips render ONLY while the camera is OUTSIDE the building envelope (outside the 60x45 footprint AABB with 2 m margin, OR above roof-plate height + 1 m); inside, chips are fully hidden — deterministic and testable from camera position"
            data_source: "the existing simulation zone temperatures — the same derivation the alarm system reads (two surfaces, one source of truth); hot states recolor their chip automatically"
