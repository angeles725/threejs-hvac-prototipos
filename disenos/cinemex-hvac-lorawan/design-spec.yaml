heavy_build_sequence:
  policy: "Strictly sequential: build and gate exactly one asset unit at a time. Never model or gate two asset units in parallel. A failed unit remains active until its gate passes or reaches the three-attempt stop rule."
  per_asset_ladder: [blockout, structural, materials, surface]
  per_asset_gate: "Every listed pass produces its own mechanical evidence, capture set and blind review before the next pass or asset unit unlocks."
  asset_units:
    - {order: 1, id: shell-circulation-facade, includes: "site, 60 × 45 m shell, facade, public/auditorium/rear bands and circulation volumes"}
    - {order: 2, id: front-of-house, includes: "lobby, ticketing, concessions, kitchen and checkpoint fit-out"}
    - {order: 3, id: auditorium-large-family, includes: "one validated 182-seat large-room family asset; instance only after pass"}
    - {order: 4, id: auditorium-medium-family, includes: "one validated 120-seat medium-room family asset; instance only after pass"}
    - {order: 5, id: auditorium-small-family, includes: "one validated 80-seat small-room family asset; instance only after pass"}
    - {order: 6, id: service-roof-hvac, includes: "disjoint rear corridor/rooms, roof units, supply/return mains and kitchen exhaust"}
    - {order: 7, id: tc300-system, includes: "one evidence-backed TC300 asset, then 14 configured instances and labels"}
    - {order: 8, id: uc100-cabinet-system, includes: "one evidence-backed UC100/cabinet asset, then A–D instances and terminal variants"}
    - {order: 9, id: ug67-network-schematic, includes: "UG67, antennas, four RS-485 buses, LoRaWAN links and external IP/Niagara schematic"}
  scene_assembly:
    unlock_condition: "All nine asset units passed their per-asset ladder."
    gate: "Assemble only passed assets; capture architecture and engineering multi-view states; verify no massing drift or topology shortcuts."
  scene_level_ladder: [lighting-camera, interaction-ui, optimization, p6-final]
  progress_namespace: "runs/assets/<order>-<asset-id>/<pass>-attempt<N>.*; scene-level evidence remains under the canonical pass directories."

critical_feature_scoring:
  rule: "At every gate, score only the expectation declared for that pass. Blockout expectations use flat proxy colors, massing and endpoint markers; later material, surface, lighting, interaction and fault polish MUST NOT lower an earlier-pass score."

critical_features:
  - id: multiplex-plan-grammar
    desc: "A front threshold, long center spine, four room masses on each side and a distinct rear service strip make this read as this eight-screen multiplex rather than a generic box."
    threshold: 0.78
    sdd: [CIN-ARCH-001, CIN-ARCH-002]
    pass_expectations:
      blockout: "Five unmistakable masses/endpoints: red facade threshold proxy; front public band; 7 m center spine; exactly eight numbered room blocks in 4+4 order; rear corridor strip visibly separated from rear room blocks."
      structural: "Openings, doors, roof/wall section pieces and circulation widths are physically coherent; rear technical doors open into the non-overlapping service corridor."
      materials: "Shell, glass, tile, carpet and technical zones separate without changing the accepted massing."
      surface: "Generated signage, generic poster blocks, room numbers and evacuation markings reinforce the plan without protected art."
      lighting-camera: "Facade/public/corridor/auditorium hierarchy remains readable from required presets."
      interaction-ui: "Roof/wall/cutaway toggles reveal the same accepted plan without disappearing zones."
      optimization: "Instancing/merging does not alter room counts, band boundaries or circulation legibility."
      p6-final: "All final views preserve the accepted 60 × 45 m multiplex grammar."
  - id: auditorium-family-massing
    desc: "Three visibly different stepped-room families—large, medium and small—repeat as 2/4/2 and remain recognizably cinema auditoriums."
    threshold: 0.76
    sdd: [CIN-ARCH-003]
    pass_expectations:
      blockout: "Exactly two large, four medium and two small room proxies show distinct width/height/row-density masses, a screen slab, stepped seating blocks, aisle gap and wheelchair-bay gap."
      structural: "Validated family assets contain tiered rows, cross/side aisles, integrated wheelchair bays, screen wall, projection niche, entry/emergency doors, speaker proxies, diffusers and returns."
      materials: "Burgundy seats, charcoal acoustic fabric and dark carpet differentiate auditorium components without flattening steps."
      surface: "Acoustic panel rhythm, aisle marks and abstract screen content add meso detail."
      lighting-camera: "Low-level aisle/exit/screen light reveals silhouettes in every family."
      interaction-ui: "Sala preset and section states keep capacity-family differences visible."
      optimization: "Seat/panel/diffuser instancing preserves exact configured family counts and gaps."
      p6-final: "2×80, 4×120 and 2×182 room families remain independently recognizable."
  - id: front-of-house-sequence
    desc: "Three adjacent proxy systems—entrance/lobby, dominant concession bar with rear kitchen, and accessible ticket checkpoint—read as the cinema's operational front-of-house sequence."
    threshold: 0.75
    sdd: [CIN-ARCH-002]
    pass_expectations:
      blockout: "Facade marquee/sign block, lobby/ticket/kiosk/waiting masses, long concession counter, connected kitchen workline and staffed checkpoint/access lane are all present as distinct flat-color proxies."
      structural: "Counters, glazing, queue rails, kitchen hood/duct, service connection and checkpoint clearances attach and circulate coherently."
      materials: "Red/black/white identity, lobby tile, concession glass/stainless and kitchen steel establish professional commercial hierarchy."
      surface: "Abstract menus/posters, POS faces, snack-machine cues and wayfinding are generated without protected content."
      lighting-camera: "Marquee, menus, glossy floor and counter remain focal without clipping the kitchen/checkpoint."
      interaction-ui: "Facade, lobby, concessions, kitchen and checkpoint presets frame their intended purpose."
      optimization: "Repeated fixtures/people/lights retain recognizable silhouettes after batching."
      p6-final: "The full public sequence reads continuously from exterior entry to ticketed corridor."
  - id: canonical-network-endpoints
    desc: "Nineteen endpoint proxies and three media styles form the exact TC300→UC100→UG67→IP/Niagara chain with no shortcut edge."
    threshold: 0.80
    sdd: [HVAC-IOT-001, HVAC-IOT-002, HVAC-IOT-003, HVAC-IOT-004]
    pass_expectations:
      blockout: "Exactly 14 black/blue TC endpoint markers, four white UC cabinet markers, one elevated two-antenna gateway marker and external router/cloud/server/client blocks are visible; four green bus trunks with 14 drops, four blue dashed UC→UG67 links and one blue solid IP chain terminate on markers."
      structural: "Real-scale devices, owned sockets, true local attachments, four drawable trunks/drops and vertical UG67 antennas are contact-coherent; no UC→UG67 physical tube exists."
      materials: "Device families and green solid/blue dashed/blue solid media remain unambiguous under neutral light."
      surface: "IDs, terminal cues, LEDs, labels and direction arrows are readable at presets, not by inflating device geometry."
      lighting-camera: "Engineering views expose all endpoint groups and the external schematic without occlusion."
      interaction-ui: "Selection highlights one exact end-to-end path; deterministic healthy/fault states alter only canonical downstream reachability."
      optimization: "Line batching, device instancing and packet pooling preserve 14 unique memberships and edge order."
      p6-final: "All required media/count/path invariants are visible across healthy and fault captures."
  - id: architecture-engineering-state-pair
    desc: "The same blockout has two independently capturable states: an opaque architectural massing view and a translucent/sectioned engineering view with zone and endpoint proxies."
    threshold: 0.75
    sdd: [OPS-UI-001, OPS-UI-002, OPS-UI-003]
    pass_expectations:
      blockout: "`state=architecture` shows clean opaque massing; `state=engineering` hides roof/sections walls and reveals colored zone volumes, device markers and link proxies without changing geometry."
      structural: "Both states preserve attachment/circulation context and camera framing."
      materials: "Architectural PBR and engineering translucency/emissive media remain visually distinct."
      surface: "Labels/legend appear only where useful and remain suppressible."
      lighting-camera: "Neutral, grazing, reference-match and engineering-section captures remain legible in their intended state."
      interaction-ui: "Mode/layer/label/selection controls reproduce deterministic query states."
      optimization: "Distance-culling and transparency ordering do not drop selected endpoints or paths."
      p6-final: "Architecture, engineering, selected-path and fault captures preserve a single coherent building."

important_features:
  - id: human-and-device-scale
    desc: "1.8 m people, 2.1 m doors, real-size TC300/UC100/UG67 devices, seating, counters and roof equipment retain coherent relative scale; small devices gain highlights/presets, not false enlargement."
  - id: cinema-lighting-hierarchy
    desc: "Bright exterior/lobby and menus transition through red/white commercial accents into dim carpeted corridors and low-emission auditoriums with readable aisle/exit lights."
  - id: technical-containment
    desc: "RS-485 routes, junction boxes, trays, roof supply/return mains with their 8 auditorium duct branches, kitchen extraction, the 14 rooftop package units (curb-seated on their roof plates, one per TC300 zone, with visible supply drops and condensate drain runs) and service cabinets visibly attach to named sockets/containment without floating tubes or impossible wall cuts."

quality_contract:
  global_min: 0.78
  perf_budget:
    draws: 550
    tris: 750000
  hard_ceiling:
    draws: 800
    tris: 2000000
  runtime_targets:
    primary_device: "office desktop with integrated GPU"
    dpr_cap: 1.5
    repeated_assets: "InstancedMesh/BatchedMesh for seats, acoustic panels, lights, people, diffusers, signs and devices"
    packets: "fixed object pool; no per-frame allocation or material creation"
    labels: "distance/frustum culled with a visible-label cap"
    shadows: "static sun shadow bake; only invalidate on visibility/state changes that affect shadow casters"

