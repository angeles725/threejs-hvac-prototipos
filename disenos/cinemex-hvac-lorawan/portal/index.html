<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angeles Group · Proyectos</title>
<meta name="theme-color" content="#f2f4f8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%233b6ff5%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Light SaaS console vibe (B43): pale ground, floating white cards, one blue accent.
     Signature: the data-driven PROYECTOS card grid — each card is a real link that NAVIGATES to its
     project under /p/, so the address bar shows the full project URL (bookmarkable, open-in-new-tab).
     Each project page carries its own "← Proyectos" back to "/". */
  :root{
    --canvas:#F2F4F8; --card:#FFFFFF; --ink:#1B2430; --dim:#5C6B84; --rule:#E1E6EF;
    --accent:#3B6FF5; --accent-strong:#2E5FE0; --accent-soft:#DCE7FF;
    --sombra:0 8px 24px rgba(20,30,60,.08); --sombra-hover:0 12px 32px rgba(20,30,60,.14);
    --radio:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--canvas);color:var(--ink)}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;min-height:100vh}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header.top{background:var(--card);border-bottom:1px solid var(--rule);box-shadow:var(--sombra);
    padding:16px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header.top .marca{font-weight:700;font-size:19px;letter-spacing:.01em}
  header.top .marca b{color:var(--accent-strong)}
  header.top .sub{font-size:13px;color:var(--dim)}

  main{max-width:1100px;margin:0 auto;padding:32px 24px 56px}
  .intro{margin-bottom:22px}
  .intro h1{font-size:22px;font-weight:600}
  .intro p{color:var(--dim);font-size:14px;margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .proyecto{background:var(--card);border:1px solid var(--rule);border-radius:var(--radio);
    box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column;text-align:left;
    color:inherit;transition:box-shadow .15s ease, transform .15s ease}
  a.proyecto:hover{box-shadow:var(--sombra-hover);transform:translateY(-2px)}
  .proyecto .miniatura{aspect-ratio:16/10;background:#0e2033 center/cover no-repeat;border-bottom:1px solid var(--rule)}
  .proyecto .cuerpo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .proyecto .tag{align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
    text-transform:uppercase;letter-spacing:.05em;color:var(--accent-strong);
    background:var(--accent-soft);border-radius:999px;padding:2px 10px}
  .proyecto h2{font-size:16px;font-weight:600;margin-top:4px}
  .proyecto p{font-size:13px;color:var(--dim);flex:1}
  .proyecto .abrir{margin-top:8px;align-self:flex-start;background:var(--accent-strong);color:#fff;
    font-weight:600;font-size:13px;padding:7px 16px;border-radius:8px}
  a.proyecto:hover .abrir{background:var(--accent)}
  .proyecto.proximo{opacity:.6}
  .proyecto.proximo .abrir{background:var(--rule);color:var(--dim)}

  footer{max-width:1100px;margin:0 auto;padding:0 24px 40px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <span class="marca">Angeles<b>Group</b></span>
  <span class="sub">Visor de proyectos</span>
</header>

<main>
  <div class="intro">
    <h1>Proyectos</h1>
    <p>Diseños 3D y dashboards. Elegí uno para abrirlo.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>Angeles Group · acceso autorizado</footer>

<script>
  // One place to register projects — add a row here as new dashboards/3D designs land.
  // Every project lives under /p/ and is guarded by its own access key (see gate.mjs). Clicking a
  // card NAVIGATES to it (real URL in the address bar); the project's own "← Proyectos" returns here.
  const PROYECTOS = [
    {
      id: 'cinemex',
      titulo: 'Cinemex · Integración HVAC LoRaWAN',
      tag: 'Diseño 3D',
      desc: 'Gemelo 3D del multiplex con telemetría en vivo por zona y cartelera de temperaturas.',
      url: 'p/cinemex/',
      miniatura: 'assets/cinemex-thumb.png',
    },
    {
      id: 'dhl-datacenter',
      titulo: 'DHL – Centro de datos',
      tag: 'DATACENTER · DCIM',
      desc: 'Sala de datos en 3D con telemetría por equipo: racks, CRAC, in-row, UPS, PDU y dry cooler, con vistas de detalle por equipo.',
      url: 'p/dhl/',
      miniatura: 'assets/dhl-thumb.png',
    },
    {
      id: 'datacenter-hotspot',
      titulo: 'Datacenter · Predicción de Hotspot IA',
      tag: 'DATACENTER · Hotspot',
      desc: 'Sala de datos en 3D con predicción de hotspot por IA: navegación por rack y vista de detalle con métricas térmicas en vivo.',
      url: 'p/hotspot/',
      miniatura: 'assets/hotspot-thumb.png',
    },
    {
      id: 'gobernador-aire',
      titulo: 'KALTE · Gobernador de Aire Comprimido',
      tag: 'Diseño 3D · Aire comprimido',
      desc: 'Sala de compresores de tornillo en 3D con gobernador de secuencia: presión de línea, estado por unidad y KPIs de energía en vivo.',
      url: 'p/gobernador/',
      // miniatura pendiente — sin screenshot en este entorno; usa el placeholder hasta agregar assets/gobernador-thumb.png
    },
    // Próximos: { id, titulo, tag, desc, url: 'p/<proyecto>/', miniatura } — o { proximo: true }.
  ];

  const grid = document.getElementById('grid');
  for (const p of PROYECTOS) {
    // A live project is an <a> that navigates; a "próximo" placeholder is an inert <div>.
    const card = document.createElement(p.proximo ? 'div' : 'a');
    card.className = 'proyecto' + (p.proximo ? ' proximo' : '');
    if (!p.proximo) card.href = p.url;
    const mini = p.miniatura
      ? `<div class="miniatura" style="background-image:url('${p.miniatura}')"></div>`
      : '<div class="miniatura"></div>';
    card.innerHTML = `${mini}<div class="cuerpo">
      <span class="tag">${p.tag}</span>
      <h2>${p.titulo}</h2>
      <p>${p.desc}</p>
      <span class="abrir">${p.proximo ? 'Próximamente' : 'Abrir →'}</span>
    </div>`;
    grid.appendChild(card);
  }
</script>
  <script src="./protection.js"></script>
</body>
</html>
