<script>

  var AT = String.fromCharCode(64);

  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {

  }});

})();

<body>

<script type="module" id="app">
// ============================================================================
// TRANSFORMADOR SECO VENTILADO — DISTRIBUCIÓN · Voxel Art 3D (estilo SCADA dark)
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Gabinete:  1.50 m ancho × 1.20 m fondo × 1.80 m alto = 60 × 48 × 72 vox
//   Núcleo:    3 columnas + yugos (acero), bobinas de cobre concéntricas
//   Bujes AT (primario, atrás) · Bujes BT (secundario, frente) en la tapa
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · gabinete en grupo aparte (CORTE)
// · bobinas con glow emisivo animado (ENERGIZADO).
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  // gabinete metálico (gris)
  CAB:    { c:0x8a929c, r:0.40, m:0.80 },
  CAB_D:  { c:0x646c76, r:0.48, m:0.78 },
  CAB_L:  { c:0xa7afb8, r:0.34, m:0.85 },
  CAB_J:  { c:0x545b64, r:0.55, m:0.70 },
  // base / rodaje
  BASE:   { c:0x1b1e24, r:0.80, m:0.25 },
  BASE_L: { c:0x2a2e36, r:0.72, m:0.30 },
  WHEEL:  { c:0x101216, r:0.85, m:0.15 },
  GALV:   { c:0xb7c0c7, r:0.30, m:0.95 },
  GALV_D: { c:0x87919a, r:0.40, m:0.90 },
  // núcleo (acero al silicio)
  STEEL:  { c:0x5a626c, r:0.42, m:0.90 },
  STEEL_D:{ c:0x464d56, r:0.50, m:0.88 },
  STEEL_L:{ c:0x6d7681, r:0.36, m:0.92 },
  // bobinas de cobre (secundario interior + primario exterior) — con glow
  COIL1:  { c:0xc4793c, r:0.35, m:0.85, e:0xff5a1e, ei:0.0 },
  COIL1_D:{ c:0xa5602c, r:0.42, m:0.82, e:0xff5a1e, ei:0.0 },
  COIL2:  { c:0x8a4f28, r:0.45, m:0.70, e:0xff4a12, ei:0.0 },
  COIL2_D:{ c:0x6f3d1e, r:0.52, m:0.66, e:0xff4a12, ei:0.0 },
  // aisladores / bujes (crema + sheds marrón)
  INSUL:  { c:0xe6dcc2, r:0.55, m:0.05 },
  INSUL_D:{ c:0x7a5230, r:0.60, m:0.10 },
  // barras / terminales de cobre
  BUS:    { c:0xc4793c, r:0.30, m:1.00 },
  BUS_L:  { c:0xd68f52, r:0.28, m:1.00 },
  // marcadores de fase / tensión
  MARK_HV:{ c:0xffb300, r:0.45, m:0.20, e:0xffb300, ei:0.35 },
  MARK_LV:{ c:0x3aa0ff, r:0.45, m:0.20, e:0x3aa0ff, ei:0.35 },
  // señalética
  YEL:    { c:0xffc400, r:0.70, m:0.00 },
  BLK:    { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:    { c:0xe8edf2, r:0.60, m:0.10 },
  PLATE:  { c:0xb9c2cb, r:0.35, m:0.85 },
  TEAL:   { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  // piso
  FLOOR:  { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D:{ c:0x1c2028, r:0.90, m:0.05 }
};

// ====== ACUMULADORES DE VOXELES (dos: núcleo/base + gabinete seccionable) ======
const cells = new Map();      // núcleo, base, tapa, bujes, señalética fija (siempre visible)
const shell = new Map();      // paredes del gabinete (se ocultan con CORTE)
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function put(map, x, y, z, c) {
  const k = K(x, y, z);
  if (map.has(k)) overwrites++;
  map.set(k, c);
}
function vox(x, y, z, c) { put(cells, x, y, z, c); }
function svox(x, y, z, c) { put(shell, x, y, z, c); }
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function sfill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) svox(x, y, z, c);
}
function carve(map, x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) map.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// dimensiones generales
const W = 60, D = 48;         // ancho (x), fondo (z)
const CZ = 24;                // eje central de fondo del núcleo

// ====== PISO (y = -1) con dithering y línea amarilla de seguridad ======
for (let x = -10; x <= 70; x++) {
  for (let z = -8; z <= 56; z++) {
    let c = (hash2(x, z) % 100 < 18) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 40) % 22 === 0) c = 'FLOOR_D';
    vox(x, -1, z, c);
  }
}
for (let z = 2; z <= 46; z++) { if (z % 6 < 4) { vox(-6, -1, z, 'YEL'); vox(-5, -1, z, 'YEL'); } }

// ====== BASE / RODAJE (y 0..7) ======
// patines (skids) tipo canal en U bajo el gabinete
fill(4, 12, 4, 7, 2, 45, 'BASE');
fill(47, 55, 4, 7, 2, 45, 'BASE');
fill(4, 55, 4, 7, 4, 8, 'BASE');
fill(4, 55, 4, 7, 39, 43, 'BASE');
fill(2, 57, 6, 7, 2, 45, 'BASE_L');   // plataforma superior de la base
// ruedas en 4 esquinas (bloques de caucho + soporte galvanizado)
function wheel(cx, cz) {
  fill(cx - 2, cx + 1, 0, 3, cz - 1, cz + 1, 'WHEEL');
  fill(cx - 2, cx + 1, 1, 2, cz, cz, 'BASE_L');       // eje
  fill(cx - 2, cx + 1, 4, 5, cz - 1, cz + 1, 'GALV_D'); // horquilla
}
wheel(8, 8); wheel(51, 8); wheel(8, 39); wheel(51, 39);
// anclas (patas de anclaje a piso con perno)
function anchor(cx, cz) {
  fill(cx - 1, cx + 1, 0, 1, cz - 1, cz + 1, 'GALV');
  vox(cx, 0, cz, 'BLK');   // perforación de perno
  fill(cx - 1, cx + 1, 2, 4, cz, cz, 'GALV_D');
}
anchor(4, 24); anchor(55, 24);

// ====== GABINETE / PAREDES VENTILADAS (y 8..63) — en 'shell', seccionable ======
const WY0 = 8, WY1 = 63;
function cabDith(x, y) {
  const h = hash2(x, y) % 100;
  if (h < 14) return 'CAB_D'; if (h >= 86) return 'CAB_L'; return 'CAB';
}
// pared trasera (z 0) y frontal (z 47)
for (let x = 0; x < W; x++) for (let y = WY0; y <= WY1; y++) {
  svox(x, y, 0, cabDith(x, y));
  svox(x, y, D - 1, cabDith(x + 7, y));
}
// paredes laterales (x 0, x 59)
for (let z = 0; z < D; z++) for (let y = WY0; y <= WY1; y++) {
  svox(0, y, z, cabDith(z, y + 3));
  svox(W - 1, y, z, cabDith(z + 5, y + 1));
}
// marco estructural (postes de esquina 2 de profundidad + rieles)
for (const [px, pz] of [[0, 0], [W - 2, 0], [0, D - 2], [W - 2, D - 2]])
  sfill(px, px + 1, WY0, WY1, pz, pz + 1, 'CAB_J');
sfill(0, W - 1, WY0, WY0 + 1, 0, D - 1, 'CAB_J');   // riel inferior
sfill(0, W - 1, WY1 - 1, WY1, 0, D - 1, 'CAB_J');   // riel superior
// rejillas de ventilación (louvers): 3 zonas por cara, slats recesados
function louversFront(z) {
  for (const [ya, yb] of [[14, 24], [30, 40], [46, 55]]) {
    for (let y = ya; y <= yb; y++) if (y % 2 === 0) sfill(7, 52, y, y, z, z, 'CAB_D');
    sfill(6, 6, ya, yb, z, z, 'CAB_J'); sfill(53, 53, ya, yb, z, z, 'CAB_J');
  }
}
louversFront(0); louversFront(D - 1);
function louversSide(x) {
  for (const [ya, yb] of [[16, 26], [34, 44]]) {
    for (let y = ya; y <= yb; y++) if (y % 2 === 0) sfill(x, x, y, y, 8, 40, 'CAB_D');
  }
}
louversSide(0); louversSide(W - 1);
// bisagras y manija de puerta frontal (cara z 47)
for (const y of [16, 30, 44, 58]) sfill(2, 2, y, y + 2, D - 1, D - 1, 'GALV_D');
sfill(55, 55, 32, 40, D - 1, D - 1, 'BLK');           // manija
// placa de peligro (triángulo AT) — cara frontal
function dangerLabel(x0, y0, z) {
  for (let i = 0; i <= 6; i++) sfill(x0 + 3 - i, x0 + 3 + i, y0 + i, y0 + i, z, z, 'YEL');
  sfill(x0 - 4, x0 + 10, y0 + 7, y0 + 7, z, z, 'BLK');  // base del triángulo
  // rayo
  svox(x0 + 4, y0 + 6, z, 'BLK'); svox(x0 + 3, y0 + 5, z, 'BLK');
  svox(x0 + 4, y0 + 4, z, 'BLK'); svox(x0 + 3, y0 + 3, z, 'BLK'); svox(x0 + 2, y0 + 2, z, 'BLK');
}
dangerLabel(30, 50, D - 1);
// placa de datos (nameplate) grabada — cara frontal
sfill(8, 20, 40, 52, D - 1, D - 1, 'PLATE');
sfill(9, 19, 50, 50, D - 1, D - 1, 'BLK');            // título grabado
for (const y of [42, 44, 46, 48]) for (let x = 10; x <= 18; x += 2) svox(x, y, D - 1, 'BLK');
sfill(9, 19, 41, 41, D - 1, D - 1, 'WHT');
// franja de marca teal en el riel superior frontal
sfill(6, 53, WY1 + 1, WY1 + 1, D - 1, D - 1, 'TEAL');

// ====== NÚCLEO 3 COLUMNAS + YUGOS (acero) — siempre visible (dentro) ======
const LIMBS = [15, 30, 45];
const CORE_Y0 = 14, CORE_Y1 = 57, COIL_Y0 = 18, COIL_Y1 = 53;
for (const cx of LIMBS) fill(cx - 2, cx + 2, CORE_Y0, CORE_Y1, CZ - 2, CZ + 2, 'STEEL');
fill(13, 47, CORE_Y0, CORE_Y0 + 3, CZ - 2, CZ + 2, 'STEEL');   // yugo inferior
fill(13, 47, CORE_Y1 - 3, CORE_Y1, CZ - 2, CZ + 2, 'STEEL');   // yugo superior
// laminaciones (líneas verticales alternas en la cara frontal de los yugos)
for (let x = 13; x <= 47; x += 2) {
  fill(x, x, CORE_Y0, CORE_Y0 + 3, CZ + 2, CZ + 2, 'STEEL_D');
  fill(x, x, CORE_Y1 - 3, CORE_Y1, CZ + 2, CZ + 2, 'STEEL_D');
}
// pernos de sujeción (clamps) del núcleo
for (const cx of [13, 47]) { vox(cx, CORE_Y0 + 1, CZ + 2, 'GALV'); vox(cx, CORE_Y1 - 1, CZ + 2, 'GALV'); }

// ====== BOBINAS DE COBRE CONCÉNTRICAS (secundario interior + primario exterior) ======
function coilAt(cx, cz) {
  // anillos de prensado (aislamiento) arriba y abajo
  for (const yy of [COIL_Y0 - 1, COIL_Y1 + 1]) {
    for (let dx = -6; dx <= 6; dx++) for (let dz = -6; dz <= 6; dz++) {
      const ch = Math.max(Math.abs(dx), Math.abs(dz));
      if (ch >= 3 && ch <= 6) vox(cx + dx, yy, cz + dz, 'INSUL_D');
    }
  }
  for (let y = COIL_Y0; y <= COIL_Y1; y++) {
    for (let dx = -6; dx <= 6; dx++) for (let dz = -6; dz <= 6; dz++) {
      const ch = Math.max(Math.abs(dx), Math.abs(dz));
      let c = null;
      if (ch === 3 || ch === 4) c = (y % 3 === 0) ? 'COIL1_D' : 'COIL1';       // secundario (BT, cobre claro)
      else if (ch === 5 || ch === 6) c = (y % 3 === 0) ? 'COIL2_D' : 'COIL2';  // primario (AT, cobre marrón)
      if (c) vox(cx + dx, y, cz + dz, c);
    }
  }
}
LIMBS.forEach(cx => coilAt(cx, CZ));

// ====== TAPA / CUBIERTA (y 64..66) — siempre visible, soporta bujes ======
for (let x = 0; x < W; x++) for (let z = 0; z < D; z++) {
  const c = (hash2(x + 9, z + 3) % 100 < 20) ? 'CAB_D' : 'CAB_L';
  fill(x, x, 64, 65, z, z, c);
  vox(x, 66, z, (hash2(x, z) % 100 < 30) ? 'CAB' : 'CAB_L');
}
// borde / ceja de la tapa
fill(0, W - 1, 64, 66, 0, 0, 'CAB_J'); fill(0, W - 1, 64, 66, D - 1, D - 1, 'CAB_J');
fill(0, 0, 64, 66, 0, D - 1, 'CAB_J'); fill(W - 1, W - 1, 64, 66, 0, D - 1, 'CAB_J');
// orejas de izaje (lifting lugs) en esquinas
for (const [lx, lz] of [[3, 3], [W - 4, 3], [3, D - 4], [W - 4, D - 4]]) {
  fill(lx, lx + 1, 67, 68, lz, lz + 1, 'GALV_D'); vox(lx, 67, lz, 'BLK');
}

// ====== BUJES / AISLADORES + BARRAS DE CONEXIÓN (sobre la tapa) ======
function bushing(cx, cz, height) {
  for (let i = 0; i <= height; i++) {
    const half = (i % 2 === 0) ? 2 : 1;
    const col = (i % 2 === 0) ? 'INSUL_D' : 'INSUL';   // sheds marrón / falda crema
    fill(cx - half, cx + half, 67 + i, 67 + i, cz - half, cz + half, col);
  }
  const ty = 67 + height + 1;
  fill(cx - 1, cx + 1, ty, ty, cz - 1, cz + 1, 'BUS');   // terminal de cobre
  return ty;
}
// Bujes AT (primario) — atrás (z 12), más altos, marcador ámbar
let atTop = 0;
for (const cx of LIMBS) atTop = bushing(cx, 12, 8);
fill(13, 47, atTop, atTop + 1, 11, 13, 'BUS_L');          // barra colectora AT
for (const cx of LIMBS) vox(cx, atTop + 2, 12, 'MARK_HV'); // marcadores de tensión AT (sobre la barra)
// Bujes BT (secundario) — frente (z 36), más bajos, marcador azul
let btTop = 0;
for (const cx of LIMBS) btTop = bushing(cx, 36, 4);
fill(13, 47, btTop, btTop + 1, 35, 37, 'BUS_L');          // barra colectora BT
for (const cx of LIMBS) vox(cx, btTop + 2, 36, 'MARK_LV'); // marcadores de tensión BT (sobre la barra)
// bajantes de barra desde bujes hacia el interior (a través de la tapa)
for (const cx of LIMBS) { fill(cx, cx, 63, 67, 12, 12, 'BUS'); fill(cx, cx, 63, 67, 36, 36, 'BUS'); }

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 180, 460);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 150, 130);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -90; sc.right = 90; sc.top = 120; sc.bottom = -40; sc.near = 5; sc.far = 460;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(30, 36, 24);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(30, 60, -110);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const matByColor = new Map();
function buildInstanced(cellMap) {
  const byColor = new Map();
  for (const [k, c] of cellMap) {
    if (!byColor.has(c)) byColor.set(c, []);
    byColor.get(c).push(k);
  }
  const meshes = [];
  for (const [cname, keys] of byColor) {
    const def = PAL[cname];
    const mat = new THREE.MeshStandardMaterial({
      color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
    });
    if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
    const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
    const M = new THREE.Matrix4();
    keys.forEach((key, i) => {
      const p = key.split(',');
      M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
      im.setMatrixAt(i, M);
    });
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true;
    im.receiveShadow = true;
    im.name = 'vox_' + cname;
    matByColor.set(cname, mat);
    meshes.push(im);
  }
  return meshes;
}
const coreMeshes = buildInstanced(cells);
coreMeshes.forEach(m => scene.add(m));
// gabinete en grupo aparte (toggle CORTE)
const shellGroup = new THREE.Group();
const shellMeshes = buildInstanced(shell);
shellMeshes.forEach(m => shellGroup.add(m));
scene.add(shellGroup);
const staticMeshes = coreMeshes.concat(shellMeshes);

// materiales de bobinas para el glow ENERGIZADO
const coilMats = ['COIL1', 'COIL1_D', 'COIL2', 'COIL2_D']
  .map(n => matByColor.get(n)).filter(Boolean);

// ====== ESTADO ======
const state = { cut: false, energ: true, rot: false };

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  const glow = state.energ ? (0.14 + 0.06 * Math.abs(Math.sin(tNow * 2.2))) : 0.0;
  for (const m of coilMats) m.emissiveIntensity = glow;
  shellGroup.visible = !state.cut;
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  const scan = (map) => {
    for (const [k, c] of map) {
      colors[c] = (colors[c] || 0) + 1;
      const p = k.split(',');
      const x = +p[0], y = +p[1], z = +p[2];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  };
  scan(cells); scan(shell);
  return { total: cells.size + shell.size, core: cells.size, shell: shell.size,
           overwrites: overwrites, colors: colors,
           bounds: { minX, maxX, minY, maxY, minZ, maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats, state, tick, cells, shell };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(120, 92, 120);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(30, 40, 24);
  controls.autoRotate = state.rot;
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bCut', 'cut'], ['bEn', 'energ'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? 'on' : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const pool = staticMeshes.filter(m => m.parent === scene || shellGroup.visible);
    const hits = ray.intersectObjects(pool, false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
</body>
