<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TABLERO GENERAL · Switchgear BT · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); z-index:5; }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#aebfd2; }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); z-index:5; color:#aebfd2; }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; letter-spacing:0.08em; }
  #legend i { width:10px; height:10px; display:inline-block; }

  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }

  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }

  @keyframes blink { 50% { opacity:0.55; } }
</style>
<script>
// Inyección dinámica de importmap (evita el mangling de package@version por Cloudflare)
(function(){
  if (typeof document === 'undefined') return;
  var AT = String.fromCharCode(64);
  var base = 'https://unpkg.com/three' + AT + '0.160.0/';
  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': base + 'build/three.module.js',
    'three/addons/': base + 'examples/jsm/'
  }});
  document.head.appendChild(im);
})();
</script>
</head>
<body>
<div id="info">
  <b>TABLERO GENERAL · SWITCHGEAR BT</b><br>
  <span>Voxel Art 3D · SCADA · 1 voxel = 0.025 m</span>
</div>
<div id="legend">
  <div><i style="background:#ffb300"></i> ALIMENTACIÓN (principal)</div>
  <div><i style="background:#c4793c"></i> BARRAS (bus de cobre)</div>

</div>
<div id="coord">DRAG: Rotar · WHEEL: Zoom · CLIC: Capturar voxel<br><span id="coordVal">VOX  —</span></div>

  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>PRINCIPAL (ACB)</label><button id="bMain" class="on">ON</button></div>
  <div class="row"><label>DERIVACIONES (grupo)</label><button id="bDer" class="on">ON</button></div>
  <div class="row"><label>CORTE · ver barras</label><button id="bCorte" class="off">OFF</button></div>
  <div class="row"><label>FALLA SIMULADA</label><button id="bF" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="module" id="app">
// ============================================================================
// TABLERO GENERAL DE DISTRIBUCIÓN — Switchgear de baja tensión · Voxel Art 3D
//
// SCALE: 1 voxel = 0.025 m  (micro-voxel, alta densidad)
//   Envolvente: 3.00 m largo × 0.80 m fondo × 2.20 m alto = 120 × 32 × 88 vox
//   5 secciones: 1 MAIN (interruptor de bastidor extraíble/ACB) + 4 DERIVACIONES
//   Barras de cobre horizontales (bus) en cámara superior · droppers verticales.
//
// three.js r0.160.0 vía importmap (unpkg) · voxeles estáticos en InstancedMesh
// por color (BoxGeometry(1,1,1) compartida) · partes animadas en Groups aparte.
// ============================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const HEADLESS = (typeof window === 'undefined') || !!globalThis.__HEADLESS__;

// ====== PALETA ======
const PAL = {
  GAB:    { c:0xbcc4cc, r:0.55, m:0.35 },   // gabinete gris claro
  GAB_D:  { c:0x969ea6, r:0.60, m:0.35 },
  GAB_L:  { c:0xd2d9df, r:0.50, m:0.30 },
  DOOR:   { c:0xc2cad1, r:0.52, m:0.35 },   // puertas (aisladas => toggle CORTE)
  FLOOR:  { c:0x22262e, r:0.90, m:0.05 },
  FLOOR_D:{ c:0x1c2028, r:0.90, m:0.05 },
  BASE:   { c:0x14171d, r:0.85, m:0.10 },   // plinto / zócalo
  MET:    { c:0x9aa3ac, r:0.38, m:0.85 },
  MET_D:  { c:0x6f7883, r:0.45, m:0.85 },
  MET_L:  { c:0xbcc4cc, r:0.30, m:0.90 },
  GALV_D: { c:0x87919a, r:0.40, m:0.90 },
  COPPER: { c:0xc4793c, r:0.35, m:1.00 },   // barras de cobre
  COPPER_D:{ c:0x9c5c2a, r:0.42, m:0.95 },
  CHAR:   { c:0x262b33, r:0.60, m:0.60 },   // interruptores negros
  CHAR_D: { c:0x14171d, r:0.70, m:0.50 },
  INSUL:  { c:0x3a4652, r:0.75, m:0.10 },   // aisladores de barra
  TEAL:   { c:0x00d4aa, r:0.50, m:0.20, e:0x00d4aa, ei:0.35 },
  YEL:    { c:0xffc400, r:0.75, m:0.00 },
  BLK:    { c:0x0b0d11, r:0.80, m:0.20 },
  WHT:    { c:0xe8edf2, r:0.60, m:0.10 },
  AMBER:  { c:0xffb300, r:0.50, m:0.20, e:0xffb300, ei:0.45 },
  BLUEB:  { c:0x3aa0ff, r:0.50, m:0.20, e:0x3aa0ff, ei:0.45 },
  ORNG:   { c:0xff7a30, r:0.50, m:0.20, e:0xff7a30, ei:0.45 },
  RED_B:  { c:0xc22233, r:0.50, m:0.10, e:0xc22233, ei:0.35 },
  DISP:   { c:0x04060a, r:0.95, m:0.00 }
};

// ====== ACUMULADOR DE VOXELES (Map => 0 celdas duplicadas por construcción) ======
const cells = new Map();
let overwrites = 0;
const K = (x, y, z) => x + ',' + y + ',' + z;
function vox(x, y, z, c) {
  const k = K(x, y, z);
  if (cells.has(k)) overwrites++;
  cells.set(k, c);
}
function fill(x0, x1, y0, y1, z0, z1, c) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) vox(x, y, z, c);
}
function carve(x0, x1, y0, y1, z0, z1) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) cells.delete(K(x, y, z));
}
function hash2(a, b) { return (((a + 31) * 73856093) ^ ((b + 71) * 19349663)) >>> 0; }

// ====== DIMENSIONES ======
const W = 120, H = 88, DEP = 32;   // x, y, z
const FZ = DEP - 1;                // plano frontal (z=31, puertas)

// ====== PISO (y = -1) con juntas y línea amarilla de seguridad ======
for (let x = -12; x <= W + 12; x++) {
  for (let z = -12; z <= DEP + 12; z++) {
    let c = (hash2(x, z) % 100 < 18) ? 'FLOOR_D' : 'FLOOR';
    if ((x + 60) % 24 === 0) c = 'FLOOR_D';
    vox(x, -1, z, c);
  }
}
for (let x = 4; x <= W - 4; x++) {
  if (x % 6 < 4) { vox(x, -1, FZ + 8, 'YEL'); vox(x, -1, FZ + 9, 'YEL'); }
}

// ====== ENVOLVENTE DEL GABINETE ======
fill(0, W - 1, 0, 5, 0, DEP - 1, 'BASE');                 // plinto macizo
fill(0, W - 1, 0, 1, FZ, FZ, 'CHAR_D');                   // pateral frontal
// franjas de peligro en el plinto (frente)
for (let x = 2; x <= W - 3; x++) vox(x, 3, FZ, ((x >> 1) % 2 === 0) ? 'YEL' : 'BLK');
fill(0, W - 1, 6, H - 1, 0, 0, 'GAB_D');                  // panel trasero
fill(0, 0, 6, H - 1, 0, DEP - 1, 'GAB_D');                // lateral izq
fill(W - 1, W - 1, 6, H - 1, 0, DEP - 1, 'GAB_D');        // lateral der
fill(0, W - 1, H - 2, H - 1, 0, DEP - 1, 'GAB');          // techo
fill(0, W - 1, 6, 6, FZ, FZ, 'GAB');                      // travesaño frontal inferior
fill(0, W - 1, H - 3, H - 3, FZ, FZ, 'GAB');              // travesaño frontal superior

// argollas de izaje en el techo
[[10, 6], [W - 11, 6], [W / 2, 6]].forEach(p => { fill(p[0] - 1, p[0] + 1, H - 1, H - 1, p[1], p[1] + 2, 'MET_L'); });

// dividers de sección (mamparos verticales)
const DIV = [30, 52, 74, 96];
for (const dx of DIV) fill(dx, dx, 6, H - 4, 1, DEP - 2, 'GAB_D');

// ====== CÁMARA DE BARRAS SUPERIOR (y 76..85) ======
const BY0 = 76, BY1 = 85;
// cubierta frontal transparente => barras visibles siempre
fill(1, W - 2, BY0, BY1, FZ, FZ, 'DOOR');
carve(3, W - 4, BY0 + 1, BY1 - 1, FZ, FZ);               // ventana de barras
// 3 fases + neutro: barras horizontales de cobre corriendo a lo largo (x)
const BUS_Y = [78, 80, 82, 84];
for (const by of BUS_Y) fill(4, W - 5, by, by, 8, 11, (by === 84 ? 'COPPER_D' : 'COPPER'));
// aisladores de soporte cada ~16 vox
for (let x = 8; x <= W - 8; x += 16) fill(x, x + 1, BY0, 77, 7, 12, 'INSUL');

// ====== SECCIONES ======
// MAIN: x 1..29 ; DERIVACIONES: 4 columnas entre los dividers
const MAIN = { sx0: 1, sx1: 29, cx: 15 };
const DERIVS = [
  { sx0: 31, sx1: 51, cx: 41 },
  { sx0: 53, sx1: 73, cx: 63 },
  { sx0: 75, sx1: 95, cx: 85 },
  { sx0: 97, sx1: W - 2, cx: 108 }
];
const MCCB_ROWS = [22, 40, 58];           // 3 interruptores caja moldeada por sección
const DOOR_Y0 = 7, DOOR_Y1 = 74;

// -- Dropper vertical de cobre por sección (bus -> interruptores), tras la puerta
function busDropper(cx) {
  fill(cx - 1, cx + 1, 20, 77, 13, 15, 'COPPER');
  fill(cx - 1, cx + 1, 77, 79, 11, 15, 'COPPER_D');       // codo al bus
}

// -- Interruptor de caja moldeada (MCCB) con lugs de cobre
function buildMCCB(sx0, sx1, ry) {
  fill(sx0 + 3, sx1 - 3, ry, ry + 11, 18, 25, 'CHAR');    // cuerpo negro
  fill(sx0 + 3, sx1 - 3, ry, ry + 11, 25, 25, 'CHAR_D');  // frente
  fill(sx0 + 4, sx1 - 4, ry + 10, ry + 11, 15, 17, 'COPPER'); // lug superior
  fill(sx0 + 4, sx1 - 4, ry, ry + 1, 15, 17, 'COPPER');       // lug inferior
  fill(sx0 + 4, sx1 - 4, ry + 5, ry + 6, 25, 25, 'CHAR_D');   // rejilla frontal
}

// -- Construir MAIN (interruptor de bastidor extraíble / ACB)
(function buildMain() {
  const s = MAIN;
  busDropper(s.cx);
  // chasis extraíble (rieles / cassette)
  fill(2, 27, 34, 34, 2, 22, 'MET_L');
  fill(2, 27, 68, 68, 2, 22, 'MET_L');
  fill(2, 2, 34, 68, 2, 22, 'MET_L');
  fill(27, 27, 34, 68, 2, 22, 'MET_L');
  // cuerpo del ACB (bastidor negro)
  fill(3, 26, 36, 66, 3, 20, 'CHAR');
  fill(3, 26, 36, 66, 20, 20, 'CHAR_D');
  // cámaras de arco (aletas superiores)
  for (const yy of [62, 63, 64, 65]) fill(6, 23, yy, yy, 20, 20, 'CHAR_D');
  // terminales de potencia hacia el bus
  fill(6, 10, 66, 76, 6, 9, 'COPPER');
  fill(19, 23, 66, 76, 6, 9, 'COPPER');
  // shutter / boca de racking (extraíble)
  fill(11, 18, 40, 46, 20, 20, 'GAB_D');
  fill(13, 16, 42, 44, 20, 21, 'BLK');
  // barra de estado ON/OFF/TRIP (ventanilla)
  fill(4, 25, 54, 56, 20, 20, 'BLK');
})();

// -- Construir DERIVACIONES
for (const s of DERIVS) {
  busDropper(s.cx);
  for (const ry of MCCB_ROWS) buildMCCB(s.sx0, s.sx1, ry);
  // ducto de cables inferior con hilos
  fill(s.sx0 + 3, s.sx1 - 3, 8, 18, 3, 9, 'GAB_D');
  fill(s.cx - 3, s.cx - 3, 9, 17, 9, 9, 'AMBER');
  fill(s.cx, s.cx, 9, 17, 9, 9, 'BLUEB');
  fill(s.cx + 3, s.cx + 3, 9, 17, 9, 9, 'ORNG');
  // prensaestopas en el plinto
  for (const gx of [s.cx - 4, s.cx, s.cx + 4]) fill(gx, gx + 1, 6, 7, 4, 6, 'BLK');
}

// ====== PUERTAS (color aislado 'DOOR' => se ocultan con CORTE) ======
function buildDoor(sx0, sx1, winX0, winX1, winY0, winY1) {
  fill(sx0, sx1, DOOR_Y0, DOOR_Y1, FZ, FZ, 'DOOR');
  carve(winX0, winX1, winY0, winY1, FZ, FZ);             // ventana del medidor
  // louvers de ventilación (ranuras => interior visible)
  for (const yy of [11, 13, 15, 17]) carve(sx0 + 4, sx1 - 4, yy, yy, FZ, FZ);
  // bisagras
  for (const yy of [DOOR_Y0 + 3, (DOOR_Y0 + DOOR_Y1) >> 1, DOOR_Y1 - 3]) {
    vox(sx0, yy, FZ, 'MET_L'); vox(sx0, yy + 1, FZ, 'MET_L');
  }
}
// puerta MAIN (ventana grande para medición)
buildDoor(MAIN.sx0, MAIN.sx1, 6, 24, 52, 70);
// puertas de derivación (ventana pequeña de relé arriba)
for (const s of DERIVS) buildDoor(s.sx0, s.sx1, s.cx - 6, s.cx + 5, 64, 72);

// ====== ESCENA / LUCES ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 220, 520);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 170, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -120; sc.right = 120; sc.top = 140; sc.bottom = -40; sc.near = 5; sc.far = 520;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
sun.target.position.set(60, 40, 12);
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-70, 60, 90);
scene.add(fillL);
const rimL = new THREE.DirectionalLight(0x00d4aa, 0.2);
rimL.position.set(40, 60, -120);
scene.add(rimL);

// ====== INSTANCED MESH POR COLOR (voxeles estáticos) ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [k, c] of cells) {
  if (!byColor.has(c)) byColor.set(c, []);
  byColor.get(c).push(k);
}
const staticMeshes = [];
let doorMesh = null;
for (const [cname, keys] of byColor) {
  const def = PAL[cname];
  const mat = new THREE.MeshStandardMaterial({
    color: def.c, roughness: def.r, metalness: def.m, envMapIntensity: 0.5
  });
  if (def.e) { mat.emissive = new THREE.Color(def.e); mat.emissiveIntensity = def.ei; }
  if (def.t) { mat.transparent = true; mat.opacity = def.t; mat.depthWrite = false; mat.side = THREE.DoubleSide; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, keys.length);
  const M = new THREE.Matrix4();
  keys.forEach((key, i) => {
    const p = key.split(',');
    M.setPosition(+p[0] + 0.5, +p[1] + 0.5, +p[2] + 0.5);
    im.setMatrixAt(i, M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = !def.t;
  im.receiveShadow = true;
  if (def.t) im.renderOrder = 2;
  im.name = 'vox_' + cname;
  scene.add(im);
  staticMeshes.push(im);
  if (cname === 'DOOR') doorMesh = im;
}

// ====== ESTADO ======
const state = { main: true, der: true, corte: false, falla: false, rot: false };
const mainOn = () => state.main && !state.falla;   // FALLA => dispara el principal
const derOn  = () => mainOn() && state.der;

// ====== PARTES DINÁMICAS (Groups separados del InstancedMesh) ======
const dynGeo = new THREE.BoxGeometry(1, 1, 1);
function emat(hex, base, i) {
  return new THREE.MeshStandardMaterial({
    color: base, emissive: hex, emissiveIntensity: i, roughness: 0.4, metalness: 0.1
  });
}
function dynBox(mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(dynGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  m.castShadow = false;
  return m;
}
const matHub = new THREE.MeshStandardMaterial({ color: 0x1a1e25, roughness: 0.5, metalness: 0.6 });
const matLever = new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.5, metalness: 0.5 });

// -- Displays 7 segmentos (dígitos 3×5)
const SEG_CELLS = {
  a: [[0, 4], [1, 4], [2, 4]], b: [[2, 3]], c: [[2, 1]],
  d: [[0, 0], [1, 0], [2, 0]], e: [[0, 1]], f: [[0, 3]],
  g: [[0, 2], [1, 2], [2, 2]]
};
const CHAR_SEGS = {
  '0': 'abcdef', '1': 'bc', '2': 'abgde', '3': 'abgcd', '4': 'fgbc',
  '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abfgcd',
  'F': 'aefg', 'L': 'fed', ' ': ''
};
function buildDigits(str, mat, ox, oy, oz) {
  const g = new THREE.Group();
  let cx = ox;
  for (const ch of str) {
    for (const s of (CHAR_SEGS[ch] || '')) {
      for (const cell of SEG_CELLS[s]) {
        g.add(dynBox(mat, cx + cell[0] + 0.5, oy + cell[1] + 0.5, oz, 0.92, 0.92, 0.5));
      }
    }
    cx += 4;
  }
  return g;
}

// -- Palanca (pivote que gira con el estado ON/OFF/TRIP)
function buildLever(px, py, scale) {
  const g = new THREE.Group();
  g.position.set(px, py, FZ + 0.5);
  g.add(dynBox(matHub, 0, 0, 0, 2.0 * scale, 2.0 * scale, 1.2 * scale));
  const arm = new THREE.Group();
  arm.add(dynBox(matLever, 0, 2.2 * scale, 0.8 * scale, 1.1 * scale, 4.4 * scale, 1.1 * scale));
  const tipMat = emat(0x00ff66, 0x06140c, 1.3);
  arm.add(dynBox(tipMat, 0, 4.6 * scale, 1.2 * scale, 1.6 * scale, 1.5 * scale, 1.5 * scale));
  g.add(arm);
  scene.add(g);
  return { arm: arm, tipMat: tipMat };
}

// -- Rig del PRINCIPAL: display de medición, palanca grande, lámparas piloto
const mainRig = {};
mainRig.dispMat = emat(0x00ff88, 0x06140c, 1.35);
mainRig.dispBg = dynBox(PAL.DISP.c ? new THREE.MeshStandardMaterial({ color: 0x04060a, roughness: 0.95 }) : matLever, 15, 61, FZ, 19, 18, 0.6);
scene.add(mainRig.dispBg);
mainRig.dispG = buildDigits('400', mainRig.dispMat, 8, 58, FZ + 0.7);
scene.add(mainRig.dispG);
mainRig.faultMat = emat(0xff2233, 0x140607, 1.6);
mainRig.faultG = buildDigits('F', mainRig.faultMat, 13, 58, FZ + 0.7);
mainRig.faultG.visible = false;
scene.add(mainRig.faultG);
// mini barra de LEDs de carga bajo el display
mainRig.barMats = [];
for (let i = 0; i < 5; i++) {
  const m = emat(0x00ff66, 0x062a12, 1.4);
  scene.add(dynBox(m, 8.5 + i * 2, 53.5, FZ + 0.6, 1.2, 1.0, 0.5));
  mainRig.barMats.push(m);
}
mainRig.lever = buildLever(14, 46, 2.1);
// lámparas piloto del principal (verde marcha / rojo falla)
mainRig.lampGmat = emat(0x00ff66, 0x062a12, 1.6);
mainRig.lampRmat = emat(0xff2233, 0x2a0708, 0.12);
scene.add(dynBox(mainRig.lampGmat, 6.5, 72.5, FZ + 0.6, 1.4, 1.4, 0.8));
scene.add(dynBox(mainRig.lampRmat, 10, 72.5, FZ + 0.6, 1.4, 1.4, 0.8));
mainRig.light = new THREE.PointLight(0x00ff66, 1.4, 22, 2);
mainRig.light.position.set(15, 60, FZ + 5);
scene.add(mainRig.light);

// -- Rigs de DERIVACIÓN: relé/medidor en puerta, 3 palancas MCCB, lámpara marcha
const derRigs = [];
DERIVS.forEach((s, si) => {
  const rig = { levers: [], tipMats: [] };
  // relé/medidor emisivo en la puerta (2 dígitos)
  rig.relMat = emat(0x00d4ff, 0x041016, 1.3);
  scene.add(dynBox(new THREE.MeshStandardMaterial({ color: 0x04060a, roughness: 0.95 }), s.cx - 0.5, 68, FZ, 12, 9, 0.5));
  rig.relG = buildDigits(['18', '24', '32', '20'][si], rig.relMat, s.cx - 4, 66, FZ + 0.7);
  scene.add(rig.relG);
  // palancas de los 3 MCCB
  for (const ry of MCCB_ROWS) {
    const lv = buildLever(s.cx, ry + 6, 1.15);
    rig.levers.push(lv);
    rig.tipMats.push(lv.tipMat);
  }
  // lámpara de marcha de sección (en puerta)
  rig.lampGmat = emat(0x00ff66, 0x062a12, 1.6);
  scene.add(dynBox(rig.lampGmat, s.cx + 8, 72, FZ + 0.6, 1.2, 1.2, 0.7));
  derRigs.push(rig);
});

// -- Partes montadas en PUERTA (se ocultan con CORTE junto con doorMesh)
const doorParts = [mainRig.dispBg, mainRig.dispG, mainRig.faultG];
derRigs.forEach(r => { doorParts.push(r.relG); });

// ====== PARTÍCULAS DE FLUJO (energía) por ruta ======
function makeFlow(pts, hex, speed) {
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = [];
  let L = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const l = v[i].distanceTo(v[i + 1]);
    segs.push({ a: v[i], b: v[i + 1], l0: L, l: l });
    L += l;
  }
  const mat = emat(hex, 0x05070a, 1.5);
  const g = new THREE.Group();
  const items = [];
  const count = Math.max(4, Math.round(L / 7));
  for (let i = 0; i < count; i++) {
    const m = dynBox(mat, 0, 0, 0, 0.7, 0.7, 0.7);
    g.add(m);
    items.push({ m: m, t: i / count });
  }
  function at(t, out) {
    const d = t * L;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (d <= s.l0 + s.l || i === segs.length - 1) {
        const k = s.l ? Math.min(Math.max((d - s.l0) / s.l, 0), 1) : 0;
        out.lerpVectors(s.a, s.b, k);
        return;
      }
    }
  }
  return {
    group: g,
    update(dt, on) {
      g.visible = on;
      if (!on) return;
      for (const it of items) {
        it.t = (it.t + dt * speed / L) % 1;
        at(it.t, it.m.position);
      }
    }
  };
}
const flows = [
  // ALIMENTACIÓN: sube del principal hasta el bus
  { f: makeFlow([[15, 8, 8], [15, 74, 8], [15, 80, 9.5]], 0xffb300, 15), gate: () => mainOn() },
  // BARRAS: recorrido horizontal del bus de cobre
  { f: makeFlow([[6, 80, 9.5], [W - 6, 80, 9.5]], 0xc4793c, 13), gate: () => mainOn() },
  // DERIVACIONES: dropper -> interruptores -> salida inferior
  ...DERIVS.map(s => ({
    f: makeFlow([[s.cx, 79, 14], [s.cx, 20, 14], [s.cx, 8, 9], [-8, 8, 9]], 0xff7a30, 16),
    gate: () => derOn()
  }))
];
flows.forEach(o => scene.add(o.f.group));

// ====== TICK (node-safe, sin renderer) ======
let tNow = 0;
function tick(dt) {
  tNow += dt;
  const trip = state.falla;
  const mOn = mainOn();
  // -- PRINCIPAL
  const mTarget = trip ? 0.0 : (mOn ? -0.62 : 0.62);   // TRIP = medio, ON = arriba
  mainRig.lever.arm.rotation.x += (mTarget - mainRig.lever.arm.rotation.x) * Math.min(1, dt * 9);
  mainRig.lever.tipMat.emissive.setHex(trip ? 0xffaa00 : (mOn ? 0x00ff66 : 0xff2233));
  mainRig.lampGmat.emissiveIntensity = mOn ? 1.6 : 0.12;
  mainRig.lampRmat.emissiveIntensity = trip ? 0.3 + 1.5 * Math.abs(Math.sin(tNow * 8)) : 0.12;
  if (trip) {
    mainRig.dispG.visible = false;
    mainRig.faultG.visible = true;
    mainRig.faultMat.emissiveIntensity = 0.35 + 1.5 * Math.abs(Math.sin(tNow * 7));
    mainRig.light.color.setHex(0xff2233);
    mainRig.light.intensity = 0.5 + 1.2 * Math.abs(Math.sin(tNow * 8));
    mainRig.barMats.forEach(m => { m.emissive.setHex(0xff2233); m.emissiveIntensity = 0.2; });
  } else {
    mainRig.faultG.visible = false;
    mainRig.dispG.visible = true;
    mainRig.dispMat.emissiveIntensity = mOn ? 1.35 : 0.12;
    mainRig.light.color.setHex(mOn ? 0x00ff66 : 0xff2233);
    mainRig.light.intensity = mOn ? 1.4 : 0.9;
    const load = mOn ? 3 + 2 * Math.abs(Math.sin(tNow * 1.5)) : 0;
    mainRig.barMats.forEach((m, i) => { m.emissive.setHex(0x00ff66); m.emissiveIntensity = i < load ? 1.4 : 0.12; });
  }
  // -- DERIVACIONES
  const dOn = derOn();
  for (const rig of derRigs) {
    const dTarget = trip ? 0.0 : (dOn ? -0.62 : 0.62);
    for (let i = 0; i < rig.levers.length; i++) {
      const lv = rig.levers[i];
      lv.arm.rotation.x += (dTarget - lv.arm.rotation.x) * Math.min(1, dt * 9);
      lv.tipMat.emissive.setHex(trip ? 0xffaa00 : (dOn ? 0x00ff66 : 0xff2233));
      lv.tipMat.emissiveIntensity = trip ? 0.3 + 1.4 * Math.abs(Math.sin(tNow * 8)) : (dOn ? 1.3 : 0.6);
    }
    rig.lampGmat.emissiveIntensity = dOn ? 1.6 : 0.12;
    rig.relMat.emissiveIntensity = dOn ? 1.3 : 0.12;
  }
  for (const o of flows) o.f.update(dt, o.gate());
}

// ====== STATS + EXPORT (harness headless) ======
function computeStats() {
  const colors = {};
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const [k, c] of cells) {
    colors[c] = (colors[c] || 0) + 1;
    const p = k.split(',');
    const x = +p[0], y = +p[1], z = +p[2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { total: cells.size, overwrites: overwrites, colors: colors,
           bounds: { minX: minX, maxX: maxX, minY: minY, maxY: maxY, minZ: minZ, maxZ: maxZ } };
}
const stats = computeStats();
globalThis.__VOX__ = { stats: stats, state: state, tick: tick, cells: cells };

// ====== INIT (solo navegador) ======
function init() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(150, 118, 178);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(60, 42, 12);
  controls.autoRotate = state.rot;   // arranca en OFF
  controls.autoRotateSpeed = 0.5;

  // ---- UI ----
  const BSPEC = [['bMain', 'main'], ['bDer', 'der'], ['bCorte', 'corte'], ['bF', 'falla'], ['bRot', 'rot']];
  function refreshUI() {
    for (const bs of BSPEC) {
      const b = document.getElementById(bs[0]);
      const on = state[bs[1]];
      b.textContent = on ? 'ON' : 'OFF';
      b.className = on ? (bs[1] === 'falla' ? 'alarm' : 'on') : 'off';
    }
  }
  for (const bs of BSPEC) {
    document.getElementById(bs[0]).addEventListener('click', () => {
      state[bs[1]] = !state[bs[1]];
      refreshUI();
    });
  }
  refreshUI();

  // ---- Captura de coordenadas (raycaster con guard de drag) ----
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshBasicMaterial({ color: 0xffe14d, wireframe: true })));
  marker.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffe14d })));
  marker.visible = false;
  scene.add(marker);
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let pd = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const ok = (dx * dx + dy * dy < 36) && (performance.now() - pd.t < 350);
    pd = null;
    if (!ok) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(staticMeshes.filter(m => m.visible), false);
    if (!hits.length) return;
    const h = hits[0];
    const p = h.point.clone().addScaledVector(h.face.normal, -0.5);
    const vx = Math.floor(p.x), vy = Math.floor(p.y), vz = Math.floor(p.z);
    marker.position.set(vx + 0.5, vy + 0.5, vz + 0.5);
    marker.visible = true;
    const txt = vx + ', ' + vy + ', ' + vz;
    document.getElementById('coordVal').textContent = 'VOX  ' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt);
    // CORTE: oculta puertas y partes de puerta para revelar barras/interruptores
    if (doorMesh) doorMesh.visible = !state.corte;
    for (const p of doorParts) p.visible = !state.corte;
    controls.autoRotate = state.rot;
    controls.update();
    renderer.render(scene, camera);
  });
}
if (!HEADLESS) init();
</script>
