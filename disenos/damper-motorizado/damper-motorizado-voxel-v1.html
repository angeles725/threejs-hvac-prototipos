<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Compuerta Motorizada (Damper) · Voxel Blockout</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:250px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:64px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
  #panel input[type=range] { width:100%; accent-color:#00d4aa; height:14px; cursor:pointer; }
  #panel .val { color:#7fe8ff; min-width:38px; text-align:right; }
</style>
</head>
<body>
<div id="info">
  <b>COMPUERTA MOTORIZADA · 3 ALETAS OPUESTAS</b><br>
  <span>Voxel Blockout · 0.60 × 0.40 × 0.127 m · 1 voxel = 2 cm</span>
</div>
<div id="legend">
  <div><i style="background:#aeb4b8"></i> Marco galvanizado</div>
  <div><i style="background:#c9ccce"></i> Flecha motriz (plated)</div>
  <div><i style="background:#e8620c"></i> Actuador</div>
  <div><i style="background:#33363b"></i> Varillaje / manivelas</div>
  <div><i style="background:#1c1d20"></i> Clamp / sellos / cable</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>APERTURA % (0-100)</label><span class="val" id="vAp">30</span></div>
  <div class="row"><input id="sAp" type="range" min="0" max="100" step="1" value="30"></div>
  <div class="row"><label>MODO</label><button id="bModo" class="off">MANUAL</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 voxel = 0.02 m  (world: 1 unit = 1 m)
// Damper real: 0.60 m ancho (X) x 0.40 m alto (Y) x 0.127 m fondo (Z) = 30 x 20 x ~6 voxeles.
// Pivotes por spec: aletas en y = +0.133 / 0 / -0.133 (eje X); flecha motriz sale por +X
// desde la cara del marco (x=0.30) con >=37 mm de husillo libre antes del clamp del actuador.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 13);

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.02, 60);
// azimuth 42 deg, elevation 24 deg, dist 1.55 m sobre el target
camera.position.set(0.967, 1.050, 1.052);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0.02, 0.42, 0);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 0.4;
controls.maxDistance = 8;

// ====== LIGHTS (house rig) ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.2, 3.0, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-1.3; sc.right=1.3; sc.top=1.3; sc.bottom=-1.3; sc.near=0.1; sc.far=9;
sun.shadow.bias = -0.0003;
sun.target.position.set(0, 0.42, 0);
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-1.6, 1.1, -1.3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(0.5, 0.8, -2.2);
scene.add(rim);

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14,14),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(14, 140, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.001;
scene.add(grid);

// ====== ROOT (centro del damper en y=0 del spec -> elevado 0.42 m) ======
const root = new THREE.Group();
root.position.y = 0.42;
scene.add(root);

// ====== MATERIALES (paleta blockout, flat MeshStandardMaterial) ======
const S = 0.02;                      // 1 voxel = 0.02 m
const COL = {
  GALV:   0xaeb4b8,  // marco / bridas — galvanizado
  GALV_D: 0x8e969b,  // bridas (contraste) / uniones
  BLADE:  0xb8bec2,  // piel de aleta (galvanizado claro)
  PLATED: 0xc9ccce,  // flecha / ejes / pernos plated
  ORANGE: 0xe8620c,  // cuerpo del actuador (Belimo)
  ABLACK: 0x1c1d20,  // clamp / bajos del actuador / cable
  SEAL:   0x101012,  // sellos EPDM (borde de aleta + jambas)
  LINK:   0x33363b,  // manivelas / tirante (varillaje oscuro)
};
const MATP = {  // props PBR por color
  [COL.GALV]:   { m:0.95, r:0.45 }, [COL.GALV_D]: { m:0.95, r:0.50 },
  [COL.BLADE]:  { m:0.95, r:0.42 }, [COL.PLATED]: { m:1.0,  r:0.30 },
  [COL.ORANGE]: { m:0.0,  r:0.55 }, [COL.ABLACK]: { m:0.0,  r:0.60 },
  [COL.SEAL]:   { m:0.0,  r:0.90 }, [COL.LINK]:   { m:0.90, r:0.50 },
};

// Builder generico: celdas -> un InstancedMesh por color, agregado a `parent`.
const cubeGeo = new THREE.BoxGeometry(S, S, S);
function buildVoxels(cells, parent) {
  const byColor = {};
  for (const [x,y,z,c] of cells) {
    (byColor[c] ||= []).push([x,y,z]);
  }
  const m4 = new THREE.Matrix4();
  for (const k in byColor) {
    const c = +k, pos = byColor[k];
    const p = MATP[c] || { m:0.5, r:0.5 };
    const mat = new THREE.MeshStandardMaterial({ color:c, metalness:p.m, roughness:p.r });
    const mesh = new THREE.InstancedMesh(cubeGeo, mat, pos.length);
    pos.forEach((v,i) => { m4.setPosition(v[0], v[1], v[2]); mesh.setMatrixAt(i, m4); });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true; mesh.receiveShadow = true;
    parent.add(mesh);
  }
}
// celda por indices de rejilla (centro en ((i+0.5)S, (j+0.5)S, (k+0.5)S))
const gc = (i,j,k,c) => [(i+0.5)*S, (j+0.5)*S, (k+0.5)*S, c];

// ====== MARCO ESTATICO (canal galvanizado + bridas ambas caras) ======
// Marco exterior: i -15..14 (x +-0.30), j -10..9 (y +-0.20), k -3..2 (z +-0.06, ~0.127 m)
const st = [];
for (let i=-15; i<=14; i++)
  for (let k=-3; k<=2; k++) {
    st.push(gc(i, 9, k, COL.GALV));    // cabezal
    st.push(gc(i,-10, k, COL.GALV));   // umbral
  }
for (let j=-9; j<=8; j++)
  for (let k=-3; k<=2; k++) {
    st.push(gc(-15, j, k, COL.GALV));  // jamba izquierda
    st.push(gc( 14, j, k, COL.GALV));  // jamba derecha
  }
// Bridas (anillo 1 voxel hacia afuera) en AMBAS caras k=-3 y k=2
for (const k of [-3, 2])
  for (let i=-16; i<=15; i++)
    for (let j=-11; j<=10; j++) {
      const onRing = (i===-16 || i===15 || j===-11 || j===10);
      if (onRing) st.push(gc(i, j, k, COL.GALV_D));
    }
// ====== ACTUADOR (estatico, naranja; cuelga de la flecha por spec) ======
// Cuerpo 163x66x61 mm: clamp 0.36..0.38 + cuerpo 0.38..0.42 (=60 mm incl. clamp),
// y -0.14..0.02 (163), z -0.04..0.02 (66). Husillo libre plated visible: 0.30..0.36 (60 mm >= 37).
for (let i=19; i<=20; i++)
  for (let j=-7; j<=0; j++)
    for (let k=-2; k<=0; k++)
      st.push(gc(i, j, k, j===-7 ? COL.ABLACK : COL.ORANGE));
st.push(gc(19, 1, -1, COL.ABLACK));       // boton de override manual
// Cable (catenaria escalonada desde el prensaestopas, cuelga y derrapa +Z)
for (const [i,j,k] of [[19,-8,0],[19,-9,0],[19,-10,0],[19,-11,1],[19,-12,1],[20,-13,2],[20,-14,2],[20,-15,3],[20,-16,3]])
  st.push(gc(i, j, k, COL.ABLACK));

buildVoxels(st, root);

// ====== SELLOS (placeholder blockout: tiras EPDM delgadas en los 4 bordes del claro) ======
const sealMat = new THREE.MeshStandardMaterial({ color:COL.SEAL, metalness:0.0, roughness:0.90 });
for (const sx of [-0.277, 0.277]) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.36, 0.028), sealMat);
  strip.position.set(sx, 0, -0.005);
  strip.castShadow = true;
  root.add(strip);
}
for (const sy of [-0.177, 0.177]) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.006, 0.028), sealMat);
  strip.position.set(0, sy, -0.005);
  strip.castShadow = true;
  root.add(strip);
}

// ====== FLEJE ANTI-ROTACION (placa plana vertical RANURADA, marco -> bajos del actuador) ======
// Distinto del cable: placa delgada en el plano XY (z~0), no escalonada. Spec ~[0.31,-0.14,0].
const strapMat = new THREE.MeshStandardMaterial({ color:0x26282c, metalness:0.85, roughness:0.55 });
const strapParts = [
  [0.088, 0.012, 0.008, 0.342, -0.118, 0],   // riel superior (la ranura queda entre rieles)
  [0.088, 0.012, 0.008, 0.342, -0.152, 0],   // riel inferior
  [0.012, 0.046, 0.008, 0.302, -0.135, 0],   // pata en la cara derecha del marco (x=0.30)
  [0.012, 0.046, 0.008, 0.382, -0.135, 0],   // pata al frente inferior del cuerpo
];
for (const [w,h,d,x,y,z] of strapParts) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), strapMat);
  p.position.set(x,y,z);
  p.castShadow = true;
  root.add(p);
}

// ====== PLACA DE DATOS (placeholder: slab claro plano en cara +Z del actuador) ======
const plate = new THREE.Mesh(
  new THREE.BoxGeometry(0.03, 0.05, 0.004),
  new THREE.MeshStandardMaterial({ color:0xdedbd2, metalness:0.1, roughness:0.6 })
);
plate.position.set(0.40, -0.06, 0.022);
root.add(plate);

// ====== ALETAS (ANIMADAS — Groups separados, pivote exacto del spec) ======
// aleta: perfil airfoil 8 voxeles de cuerda (0.16 m ~ 152 mm), 26 voxeles de claro (0.52 m)
// entre sellos de jamba. Grosor 2 voxeles al centro, 1 en bordes (bordes = sello EPDM).
function bladeCells() {
  const cells = [];
  for (let si=-13; si<=12; si++)
    for (let c=-4; c<=3; c++) {
      const col = (c===-4 || c===3) ? COL.SEAL : COL.BLADE;
      if (c>=-2 && c<=1) { cells.push(gc(si,c,-1,col)); cells.push(gc(si,c,0,col)); }
      else if (c<0)      { cells.push(gc(si,c, 0,col)); }
      else               { cells.push(gc(si,c,-1,col)); }
    }
  return cells;
}
const axleMat  = new THREE.MeshStandardMaterial({ color:COL.PLATED, metalness:1.0, roughness:0.30 });
const linkMat  = new THREE.MeshStandardMaterial({ color:COL.LINK,   metalness:0.9, roughness:0.50 });
const blackMat = new THREE.MeshStandardMaterial({ color:COL.ABLACK, metalness:0.0, roughness:0.60 });

const BLADE_Y = [0.133, 0, -0.133];       // pivotes por spec
const BLADE_SIGN = [ +1, -1, +1 ];        // aletas opuestas: +θ / -θ / +θ
const blades = [];
BLADE_Y.forEach((yb, n) => {
  const g = new THREE.Group();
  g.position.set(0, yb, 0);
  buildVoxels(bladeCells(), g);
  // eje plated: aletas 1/3 -> hasta la cara derecha; aleta 2 (motriz) -> muñon +X hasta 0.36
  // (husillo libre 0.30..0.36 = 60 mm = 3 voxeles a la vista antes del U-clamp)
  const isDrive = (n === 1);
  const len = isDrive ? 0.71 : 0.65;
  const cx  = isDrive ? 0.005 : -0.025;   // extremo izq. en -0.35 (hacia manivelas)
  const thick = isDrive ? 0.028 : 0.024;
  const axle = new THREE.Mesh(new THREE.BoxGeometry(len, thick, thick), axleMat);
  axle.position.set(cx, 0, 0);
  axle.castShadow = true;
  g.add(axle);
  root.add(g);
  blades.push(g);
});

// ====== VARILLAJE LATERAL (lado opuesto al actuador, x -0.33..-0.37) ======
// manivela por aleta (gira con su aleta) + tirante vertical rigido siguiendo los pernos
const R = 0.05;                            // radio de manivela
const cranks = [];
BLADE_Y.forEach((yb, n) => {
  const dir = BLADE_SIGN[n];               // manivelas alternadas: +Z / -Z / +Z
  const g = new THREE.Group();
  g.position.set(-0.33, yb, 0);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.026, 0.07), linkMat);
  arm.position.set(0, 0, dir*0.03);
  arm.castShadow = true;
  g.add(arm);
  const pin = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.018, 0.018), axleMat);
  pin.position.set(-0.015, 0, dir*R);
  pin.castShadow = true;
  g.add(pin);
  root.add(g);
  cranks.push(g);
});
// tirante: pasa por los pernos de aletas 1 y 3 (misma fase) -> traslacion rigida
const rod = new THREE.Group();
rod.position.set(-0.36, 0, R);
const rodBar = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.32, 0.024), linkMat);
rodBar.castShadow = true;
rod.add(rodBar);
root.add(rod);
// eslabon corto: perno de la aleta motriz (z=-R cosθ) -> tirante (z=+R cosθ)
const link2 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 1), linkMat);
link2.position.set(-0.35, 0, 0);
link2.castShadow = true;
root.add(link2);

// ====== CLAMP + INDICADOR (giran 1:1 con la flecha motriz, -θ) ======
// U-clamp en x 0.36..0.38, tras 60 mm de husillo libre expuesto desde la cara del marco.
const clampG = new THREE.Group();
clampG.position.set(0.37, 0, 0);
const collar = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.036, 0.036), blackMat);
collar.castShadow = true;
clampG.add(collar);
const clampBar = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, 0.026), blackMat);
clampBar.castShadow = true;
clampG.add(clampBar);
for (const sy of [1,-1]) {
  const bolt = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.012), axleMat);
  bolt.position.set(-0.013, sy*0.045, 0);
  clampG.add(bolt);
}
root.add(clampG);
// Disco claro coaxial (placeholder del arco 0-90 impreso; el texto es pase surface):
// en la cara exterior +X del cuerpo para que lea desde la camara por defecto.
const disc = new THREE.Mesh(
  new THREE.CylinderGeometry(0.026, 0.026, 0.006, 12),
  new THREE.MeshStandardMaterial({ color:0xd8d6cc, metalness:0.1, roughness:0.55 })
);
disc.rotation.z = Math.PI/2;               // eje del disco a lo largo de X (coaxial flecha)
disc.position.set(0.423, 0, 0);
root.add(disc);
// puntero indicador oscuro, gira 1:1 con la flecha sobre el disco claro
const pointerG = new THREE.Group();
pointerG.position.set(0.428, 0, 0);
const pointer = new THREE.Mesh(
  new THREE.BoxGeometry(0.005, 0.024, 0.008),
  new THREE.MeshStandardMaterial({ color:0x1c1d20, metalness:0.0, roughness:0.55 })
);
pointer.position.set(0, 0.012, 0);
pointerG.add(pointer);
root.add(pointerG);

// ====== ESTADO + UI ======
// Default MANUAL @ 30%: el HUD y el angulo de aletas coinciden en la captura del gate.
const state = { apertura: 30, auto: false };
const sAp = document.getElementById('sAp');
const vAp = document.getElementById('vAp');
const bModo = document.getElementById('bModo');
const bRot = document.getElementById('bRot');

sAp.addEventListener('input', () => {
  state.apertura = +sAp.value;
  if (state.auto) setAuto(false);          // tocar el slider pasa a MANUAL
  vAp.textContent = Math.round(state.apertura);
});
function setAuto(a) {
  state.auto = a;
  bModo.className = a ? 'on' : 'off';
  bModo.textContent = a ? 'AUTO' : 'MANUAL';
}
bModo.onclick = () => setAuto(!state.auto);
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// ====== CINEMATICA ======
// Cierre fisico: con cuerda 0.16 m y paso 0.133 m las aletas opuestas cierran en zigzag
// cuando sus bordes se tocan: cos(θc) = 0.133/0.16 -> θc ≈ 34°. Apertura 0% = θc (cerrado
// real, bordes sellando y sin sobresalir del cabezal); 100% = 90° (paralelas al flujo).
// NOTA divergencia intencional vs spec: la cuerda spec es 0.152 m, pero este pase voxel
// cuantiza a 8 voxeles x 0.02 = 0.16 m; su θc DEBE derivar de la cuerda voxel real o las
// aletas se interpenetran al cerrar. El realistic usa el valor de spec (θc ≈ 29°).
const THC = Math.acos(0.133/0.16);
function applyAngle(apertura01) {
  const theta = THC + (Math.PI/2 - THC) * apertura01;
  blades.forEach((g, n) => { g.rotation.x = BLADE_SIGN[n] * theta; });
  cranks.forEach((g, n) => { g.rotation.x = BLADE_SIGN[n] * theta; });
  const dy = -R * Math.sin(theta), dz = R * Math.cos(theta);
  rod.position.y = dy;
  rod.position.z = dz;
  link2.position.y = dy;
  link2.scale.z = Math.max(2*dz, 0.006);
  clampG.rotation.x   = -(theta - THC);    // 1:1 con la carrera de la flecha
  pointerG.rotation.x = -(theta - THC);    // puntero 1:1 sobre arco 0-90
}

// ====== RESIZE ======
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (state.auto) {                        // demo lenta 0 -> 90 -> 0
    state.apertura = (1 - Math.cos(t*0.45)) * 50;
    sAp.value = Math.round(state.apertura);
    vAp.textContent = Math.round(state.apertura);
  }
  applyAngle(state.apertura/100);
  controls.update();
  renderer.render(scene, camera);
}
applyAngle(state.apertura/100);
animate();
</script>
</body>
</html>
