      qaFraming_extended: >
        __qaFraming now returns `panels` (hud + controls + hotspots) alongside the
        existing `hud` field. A probe checking only #hud would have passed a subject
        buried under the two new panels.
      verified_layout: "at 1600x900, 1440x900 and 1280x800 every panel is on-screen and none overlaps the subject; subject stays fullyVisible"

    probe_api:
      __qaHotspots: >
        Screen rect, a clickable centre, and a REAL occlusion test per hotspot — a ray
        from the camera must actually land on that hotspot for clickable to be true.
      __qaInteract: >
        Performs a named interaction deterministically and returns the resulting state,
        so a probe never has to do pixel arithmetic. A harness that clicks at guessed
        coordinates is the known way to manufacture fake defects.
      guarantee: "when clickable is true, `centre` is a point that actually hits that hotspot"

    verified:                      # headless, with a minimal DOM stub
      hotspots_resolve: "all 5 point at nodes that exist; pointermove/leave/down wired"
      occlusion_discriminates: >
        From the FRONT the mount studs report clickable=false, blockedBy=strip_a — they
        are hidden AND behind the body. From the REAR with mounts on they report
        clickable=true. A hidden strip (feed=a) reports clickable=false rather than
        letting a click land on what nobody can see.
      interactions_drive_real_state: "head toggles the LCD, a strip solos then restores its feed, an unknown id returns ok:false"
      regression: "all 8 prior suites still pass"

    corrections_during_build:
      - "THE PUBLISHED CLICK POINT WAS NOT ON THE OBJECT. mount_buttons is four studs at
         y = +/-0.2 and +/-0.6; its bbox centroid is y = 0, the GAP between them. A probe
         told to click the centroid would sail past the studs and hit the strip body, and
         the hotspot reported itself unreachable from a view where it is plainly visible.
         `centre` is now defined as a point that actually hits."
      - "The first fix was a 7x7 grid over the projected rect, which failed for the same
         reason a blind probe would: the studs are ~5 px discs in a ~500 px column, so a
         coarse grid lands in the gaps every time. Replaced with sampling points taken
         FROM THE GEOMETRY — each mesh's centre and an InstancedMesh's instance
         translations — which is targeted rather than hopeful."

  optimization:
    status: passed
    attempts: 1
    score: 0.86
    action: continue
    review: runs/optimization-attempt1.review.json
    date: 2026-08-15
    note: "last build pass — asset handed to P6 (final review + blockout->final mass-drift strip)" 
    scope: >
      Re-probe against budget, remove real duplication, and change nothing a previous
      pass was judged on. No geometry, materials, lighting, camera or interaction
      behaviour altered — only how many copies of identical things reach the GPU.

    budget:
      draws: "70 / 200  (35%)"
      tris:  "11472 / 350000  (3.3%)"

    what_I_did_NOT_do:
      no_merging: >
        DELIBERATELY did not merge meshes, and this is the main finding of the pass. The
        head bezel is 10 boxes and the strip body 7, all on one material, so merging would
        have cut roughly 30 draws. But we are at 35% of the draw budget — those 30 draws
        buy nothing — and merging destroys the named parts that verifyAttachments, the
        16-part QA assertion, and the raycast hotspots all resolve by name. That is
        trading verifiability for headroom we already have. Optimising a budget you are
        not near is how a later pass loses its ability to prove anything.

    what_I_did:
      geometry_sharing: >
        70 meshes carried 70 UNIQUE geometries. The A and B strips are the same object
        twice, and several shapes repeat within a strip (two rails, three bank rims), so
        every one was built and uploaded separately. Added a keyed geometry cache:
        70 -> 23 unique. Safe because nothing mutates vertex data after construction, and
        InstancedMesh keeps its instance matrices on the mesh, not the geometry.
      artwork_memoised: >
        makeNameplate and makeOutletLegend were called once PER STRIP, so each strip
        carried its own pixel-identical copy. Memoised by argument: nameplate, legend and
        LCD each rasterise exactly once now (asserted via artworkStats, so the check
        proves the cache is hit rather than assuming it).
      texture_memory: "2008 KB -> 1104 KB across 3 textures (nameplate 400, legend 504, LCD 200) — a 904 KB / 45% saving"
      decal_materials_shared: "the nameplate and legend materials were cloned per strip; now one each, cached on the shared palette so the spec traceability check is unaffected"
      stale_log_string: "the build log still said 'blockout built' three passes later — same class of defect as the stale HUD label, fixed"

    verified:                      # headless, with a canvas stub so artwork really rasterises
      budget: "within on both axes"
      geometry_cache: "scene uses 23 geometries and the cache holds 23 — nothing bypasses it"
      artwork_calls: "nameplate 1, legend 1, lcd 1"
      textures: "exactly 3 distinct, ~1104 KB"
      no_duplicate_materials: >
        Compared by full signature, not by name. Two instances may legitimately share a
        spec id when they differ — the QR plate is plain label_print while the nameplate
        is label_print carrying artwork — so a name-only test flags a design decision as
        waste. What the check actually catches is an IDENTICAL material duplicated.
      named_parts_preserved: "16/16 (strip_slab, rails, dividers, cavity floors, bank rims, pin slots, head bands, port floor, jack shells, nameplate, legend, cord, mount studs, LCD, QR)"
      hotspot_groups_intact: "strip_body, head_module, mount_buttons, outlet_column, outlet_legend"
      console: "0 errors during build"
      offline: "no http(s) URL, fetch, XHR, WebSocket or Image().load anywhere in main.js / index.html / src; the importmap resolves only to vendor/"
      regression: "all 9 prior suites still pass"

    corrections_during_build:
      - "The duplicate-material assertion fired on label_print, which is not a defect —
         the QR plate and the nameplate are genuinely different materials sharing one
         spec id by design. Narrowed the assertion to identical signatures."
      - "That in turn failed for the opposite reason: headless there is no DOM, so both
         materials had a null map and looked identical to the check. Gave the check a
         canvas stub so the artwork actually rasterises — which also made the
         texture-memory saving measurable instead of merely claimed."

