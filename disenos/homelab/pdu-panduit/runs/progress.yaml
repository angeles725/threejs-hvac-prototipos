    page_capture_readiness:
      why_it_matters: "this pass is captured with --page, so the DOM is part of the deliverable, and a still frame has no cursor to reveal a hover affordance"
      added: >
        A top-right "Zonas interactivas" legend listing every hotspot, dimmed when a
