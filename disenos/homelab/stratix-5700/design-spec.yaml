# DesignSpec — homelab asset #4: ROCKWELL / ALLEN-BRADLEY STRATIX 5700 (DIN-rail managed switch)
# Authored at P2 (spec-only). See design3d/references/DESIGNSPEC.md for authoring rules.
# Evidence: disenos/homelab/P1-DATASHEETS.md §3 (Stratix 5700 research) + P1-INTAKE.md §1 (inventory).
#
# VARIANT DECLARED: 1783-BMS10CGP (10-port). Chosen because P1 records its dimensions and
# port mix at [CERT-web], and because it is the mid-size body — the 6-port is a shallower
# family (D 116.7) and the 20-port is the wide one (W 127.0). Every dimension below is for
# THIS catalogue number; do not mix in figures from the other two.

design: stratix-5700
track: threejs
mode: heavy                        # multi-asset homelab scene; this asset gated alone
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.01 m" # 10x finer than the PDU: this subject is ~0.13 m, not 1.8 m

complexity:                        # pre-spec assessment — sum 12 -> moderate
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 1}
  tier: moderate
  # note: the silhouette is a plain box and scores low on purpose. The identity is entirely
  #   in the FRONT FACE FURNITURE (port block, diagnostic LED column, livery) and the TOP
  #   terminal blocks — which is why four of the five critical features live there.

environment:                       # P0 discovery OUTPUT — paths only
  overlays:
    handbook: null
    house_rules: null
    qa_tools: research/tools
    design_dir_root: disenos/homelab

references:                        # P1 evidence — no invented dimensions
  - source: "https://www.rockwellautomation.com/en-us/products/details.1783-BMS10CGP.html [CERT-web]"
    evidences: "enclosure 129.5 (H) x 91.4 (W) x 135.8 (D) mm incl. DIN clip; weight 1.38 kg; 8x RJ45 10/100 + 2x combo (RJ45+SFP) 10/100/1000"
  - source: "disenos/homelab/P1-DATASHEETS.md §3 (Stratix 5700 research, this session)"
    evidences: "DIN rail 35 mm top-hat EN 50022 with spring-loaded REAR latch; IP30 open-style housing; no rack or panel option in the 1783-BMS body (ArmorStratix is the NEMA variant); system LED column at the LEFT of the front face (EIP Mod, EIP Net, Setup, DC_A, DC_B, Alarm Out); per-port link/activity LEDs; recessed Express Setup button; SD card slot on the front face; dual DC inputs Pwr A / Pwr B plus a 6-pin alarm relay on the TOP face; dark grey/charcoal enclosure"
  - source: "https://www.manualsdir.com/manuals/579905/rockwell-automation-1783-bmxxx-stratix-5700-ethernet-managed-switches-user-manual.html?page=119 [CERT-a]"
    evidences: "system LED names and their green/red state table; per-port LED states (off / solid green / flashing green / amber / yellow)"
  - source: "https://literature.rockwellautomation.com/idc/groups/literature/documents/in/1783-in016_-en-p.pdf [CERT-doc]"
    evidences: "Express Setup recessed push-button and its press modes"
    suitability: conditional       # PDF returned as binary and was not text-extractable; the
                                   #   claim reaches us through P1's secondary reading of it
  - source: "https://www.rockwellautomation.com/en-us/products/details.1783-BMS20CGL.html [CERT-web]"
    evidences: "20-port body is 127.0 mm wide with 16 RJ45 — used ONLY as an independent cross-check on the port-module derivation below, not as a dimension source for this variant"

dimensions_real:                   # metric; 1 unit = 1 m. All for 1783-BMS10CGP.
  height_m: {value: 0.1295, confidence: high}   # enclosure incl. DIN clip
  width_m:  {value: 0.0914, confidence: high}
  depth_m:  {value: 0.1358, confidence: high}   # depth off the mounting plane
  mass_kg:  {value: 1.38,   confidence: high}

  # --- port block: DERIVED, and the derivation matters --------------------------
  # P1 records "8 RJ45 on the left, 2 combo on the right". Taken literally as one row that
  # is IMPOSSIBLE: a standard RJ45 jack outline is 15.9 mm, so 8 in a row is 127.2 mm in a
  # 91.4 mm body. Industrial switches pack density with 2-HIGH GANGED RJ45 modules — one
  # part, two stacked jacks — so the real layout is 5 columns x 2 rows:
  #   columns 1-4 = 8 RJ45 (the "left" group)   column 5 = 2 combo RJ45/SFP (the "right")
  #   5 x 15.9 = 79.5 mm inside 91.4 mm, ~6 mm margin per side.
  # CROSS-CHECK, independent: the 20-port body is 127.0 mm wide with 16 RJ45. Eight ganged
  # modules = 127.2 mm. The same module hypothesis predicts the other variant's width to
  # 0.2 mm, which is why this is recorded as a reasoned derivation rather than a guess.
  port_cols:      {value: 5,      confidence: low}
  port_rows:      {value: 2,      confidence: low}
  port_col_pitch_m: {value: 0.0160, confidence: low}   # 5 cols across 91.4 mm with margins
  port_row_pitch_m: {value: 0.0150, confidence: low}   # ganged 2-high module
  jack_w_m:       {value: 0.0159, confidence: med}     # standard RJ45 outline, not Rockwell-specific
  jack_h_m:       {value: 0.0135, confidence: med}

  # --- front-face zones: VERTICAL ORDER IS INFERRED ------------------------------
  # Sourced: the system LED column is at the LEFT; terminals are on the TOP face. The
  # vertical stacking below is a layout inference sized to fit 129.5 mm, not a datasheet.
  port_zone_h_m:   {value: 0.040, confidence: low}   # bottom band, holds the 2-row block
  mid_zone_h_m:    {value: 0.042, confidence: low}   # LED column + SD slot + setup button
  livery_zone_h_m: {value: 0.0475, confidence: low}  # top band, logo + product silkscreen
  led_pitch_m:     {value: 0.0060, confidence: low}  # 6 system LEDs down the left edge
  din_clip_h_m:    {value: 0.035, confidence: med}   # EN 50022 top-hat rail is 35 mm across

hierarchy:                         # animation-ready BEFORE geometry
  - name: root
    children:
      - name: housing              # the IP30 enclosure: compact box, vented flanks
        pivot: [0, 0, 0]
        animation: none
      - name: port_block           # SEMANTIC SYSTEM: all 10 jacks as one instanced system
        pivot: [0, 0, 0]
        animation: none
        # build note: 5 cols x 2 rows of RECESSED apertures. Each is a cavity with the RJ45
        # keyway notch — never a painted rectangle (critical feature port-block-10).
      - name: port_leds            # SEMANTIC SYSTEM: per-port link/activity LEDs
        pivot: [0, 0, 0]
        animation: "custom:emissive-state off/green/amber (?leds=on URL state)"
      - name: system_led_bank      # the six named diagnostic LEDs, left edge of the face
        pivot: [0, 0, 0]
        animation: "custom:emissive-state per LED (?leds=on)"
      # AMENDED (P4 refine-spec, 2026-08-15): express_setup and sd_slot were pivoted at
      # y 0.062 / 0.048, which lands them in the LIVERY band — contradicting this spec's
      # own zone description, which puts them in the MID band beside the LED column. Both
      # are confidence: low layout inferences, so the amendment is pre-authorised. Moved to
      # the mid band's right-hand side; the LED column keeps the left.
      - name: express_setup        # recessed push-button
        pivot: [0.028, 0.008, 0.0679]
        animation: none
        attachment:
          parent_socket: front_face
          local_start: [0.028, 0.008, 0.0629]   # seats INTO the face
          local_end:   [0.028, 0.008, 0.0674]   # recessed: stops BELOW the face plane
          length_confidence: low
          contact_type: embedded
          embed_depth: 0.005
          gap_tolerance: 0.0
      - name: sd_slot              # SD card slot; POSITION IS A PHOTO APPROXIMATION (P1 gap)
        pivot: [0.028, -0.012, 0.0679]
        animation: none
        attachment:
          parent_socket: front_face
          local_start: [0.028, -0.012, 0.0639]
          local_end:   [0.028, -0.012, 0.0679]
          length_confidence: low
          contact_type: embedded
          embed_depth: 0.004
          gap_tolerance: 0.0
      - name: top_terminals        # APPENDAGE on the TOP face: Pwr A + Pwr B + 6-pin alarm relay
        pivot: [0, 0.0648, 0]      # = local_start, on the top plane (+height/2)
        animation: none
        attachment:
          parent_socket: top_face
          local_start: [0, 0.0648, 0.0]     # root: seats on the top face — build root->tip
          local_end:   [0, 0.0748, 0.0]     # tip: plugs stand ~10 mm proud
          length_confidence: low
          contact_type: socket
          embed_depth: 0.003               # the block seats INTO its header
          gap_tolerance: 0.0
      - name: din_clip             # APPENDAGE on the REAR face: spring latch for the rail
        pivot: [0, 0, -0.0679]
        animation: none
        attachment:
          parent_socket: rear_face
          local_start: [0, 0.0, -0.0659]   # root: 2 mm INTO the rear wall
          local_end:   [0, -0.020, -0.0759] # tip: the latch tongue hangs down and rearward
          length_confidence: low
          contact_type: embedded
          embed_depth: 0.002
          gap_tolerance: 0.0
      - name: front_livery         # AB logo + "STRATIX 5700" silkscreen; XY is a photo approximation
        pivot: [0, 0.100, 0.0679]
        animation: none
        attachment:
          parent_socket: front_face
          local_start: [-0.030, 0.095, 0.0679]
          local_end:   [ 0.036, 0.112, 0.0681]   # printed, ~0.2 mm proud
          length_confidence: low
          contact_type: surface-contact
          overlap: 0.0002
          gap_tolerance: 0.0
      - name: din_rail_prop        # CONTEXT PROP, default OFF (?rail=on): 35 mm EN 50022 top-hat
        pivot: [0, 0, -0.0759]
        animation: none
        # Not part of the product. It exists so the DIN-rail reading can be judged in
        # context as well as alone, and it is toggleable so it can never be mistaken for
        # the asset. EN 50022 profile is a published standard: 35 mm across, 7.5 mm deep.

materials:                         # near-binary metalness; every entry: evidence + source + confidence
  - id: housing_charcoal
    family: painted-metal          # coated sheet/die-cast enclosure — a dielectric finish
    color: "#3a3d42"
    metalness: 0.0
    roughness: 0.60
    evidence: "P1-DATASHEETS §3: dark grey / charcoal DIN enclosure. NO RAL or Pantone is published, so the exact hex is chosen, not measured."
    source: estimated
    confidence: 0.7
    assumption: "matte grey coating over metal; the hex is chosen, not measured — no RAL/Pantone published"
  - id: port_housing
    family: plastic                # ganged RJ45 module body
    color: "#17181b"
    metalness: 0.0
    roughness: 0.45
    evidence: "RJ45 jack bodies are moulded thermoplastic; industrial switches use black modules"
    source: table
    confidence: 0.78
  - id: port_cavity
    family: plastic                # the recessed jack throat — what makes a port read as an opening
    color: "#0c0d10"
    metalness: 0.0
    roughness: 0.72
    evidence: "jack cavities read near-black; this is what separates a real port from a painted rectangle (critical feature port-block-10)"
    source: estimated
    confidence: 0.75
    assumption: "unlit cavity read, high roughness, no specular return" 
  - id: port_shield
    family: bare-metal             # shielded RJ45 cage
    color: "#9aa0a8"
    metalness: 0.9
    roughness: 0.40
    evidence: "shielded RJ45 cages are nickel-plated steel — bare metal, near-1 metalness"
    source: table
    confidence: 0.82
  - id: led_green
    family: plastic                # link / OK — EMISSIVE, intensity tuned at the lighting pass
    color: "#0a1410"
    metalness: 0.0
    roughness: 0.35
    evidence: "P1-DATASHEETS §3 per-port and system LED state table (solid/flashing green) [CERT-a] user manual p.119-120"
    source: estimated
    confidence: 0.72
    assumption: "green diffuser lens over an unlit dark body; emissive intensity is the lighting pass's dial" 
  - id: led_amber
    family: plastic                # activity / warning state
    color: "#141008"
    metalness: 0.0
    roughness: 0.35
    evidence: "same source: amber / yellow per-port states"
    source: estimated
    confidence: 0.72
    assumption: "amber diffuser lens over an unlit dark body" 
  - id: led_red
    family: plastic                # fault state on the EIP Mod / EIP Net / Alarm LEDs
    color: "#140a0a"
    metalness: 0.0
    roughness: 0.35
    evidence: "same source: red blink = recoverable fault, solid red = non-recoverable"
    source: estimated
    confidence: 0.72
    assumption: "red diffuser lens over an unlit dark body" 
  - id: terminal_block
    family: plastic                # removable screw terminal block, top face
    color: "#1c1d20"
    metalness: 0.0
    roughness: 0.50
    evidence: "P1-DATASHEETS §3 confirms dual DC inputs + a 6-pin alarm relay on the top face. THE BLOCK COLOUR IS NOT SOURCED — no image or datasheet in P1 states it."
    source: estimated
    confidence: 0.7
    assumption: "dark moulded block. THE COLOUR IS UNSOURCED — see open_items" 
  - id: terminal_screw
    family: bare-metal             # the screw heads in the block
    color: "#a8adb4"
    metalness: 0.9
    roughness: 0.45
    evidence: "screw terminals are plated steel — bare metal"
    source: table
    confidence: 0.8
  - id: din_clip_steel
    family: bare-metal             # spring latch
    color: "#8e939a"
    metalness: 0.9
    roughness: 0.50
    evidence: "P1-DATASHEETS §3: spring-loaded rear latch; spring latches are bare spring steel"
    source: table
    confidence: 0.78
  - id: livery_print
    family: plastic                # AB logo + product silkscreen
    color: "#e8e8e4"
    metalness: 0.0
    roughness: 0.60
    evidence: "P1-DATASHEETS §3: Allen-Bradley red logo and product name on the front face"
    source: estimated
    confidence: 0.7
    assumption: "white silkscreen ink on the charcoal coating" 
  - id: livery_red
    family: plastic                # the Allen-Bradley red
    color: "#c8102e"
    metalness: 0.0
    roughness: 0.55
    evidence: "P1-DATASHEETS §3 records a RED Allen-Bradley logo. The exact red is NOT published in any P1 source; this is the widely-used AB red, chosen not measured."
    source: estimated
    confidence: 0.7
    assumption: "the widely-used Allen-Bradley red. UNSOURCED exactly — see open_items"
    realised_as: >
      ARTWORK from the surface pass onward. Blockout and structural rendered the logo as a
      red mass block using this material; surface replaced that with a CanvasTexture in
      which the same #c8102e is drawn. The colour is still governed by this entry — it is
      simply delivered as printed artwork rather than as a surface, which is what a
      silkscreened logo actually is. It is therefore EXPECTED to appear as
      declared-but-not-instantiated in a material traceability sweep, and that is not drift.
  - id: rail_steel
    family: bare-metal             # EN 50022 top-hat rail (context prop, default off)
    color: "#b4b8bd"
    metalness: 0.9
    roughness: 0.55
    evidence: "DIN rail is zinc-plated or galvanised steel"
    source: table
    confidence: 0.8

critical_features:                 # 5 gates (hard max) — each fails a pass ALONE
  - id: din-rail-body
    desc: "Reads as a DIN-RAIL device, not a rack unit: a compact ~130 x 91 x 136 mm box with NO rack ears and NO 19\" face, carrying a spring latch on its REAR wall sized for a 35 mm top-hat rail. A lazy model gives it rack ears or flattens it into a 1U chassis — either is an immediate fail."
    threshold: 0.72
  - id: port-block-10
    desc: "A block of 10 RECESSED jacks in 5 columns x 2 rows on the lower front face — eight RJ45 in the left four columns and two combo RJ45/SFP in the fifth. Each is a dark cavity with a visible keyway, at a regular pitch. A lazy model paints ten rectangles or lines up eight jacks in one impossible row."
    threshold: 0.72
  - id: diagnostic-led-column
    desc: "A distinct vertical column of six labelled system LEDs down the LEFT of the front face (EIP Mod, EIP Net, Setup, DC_A, DC_B, Alarm Out), separate from the per-port link LEDs at the jacks. This is what makes it read as a MANAGED industrial switch rather than an unmanaged box."
    threshold: 0.70
  - id: top-terminal-blocks
    desc: "Removable screw terminal blocks stand proud of the TOP face — dual DC power inputs plus a six-pin alarm relay, with visible screw heads. A lazy model puts a barrel jack, an IEC inlet, or nothing there."
    threshold: 0.70
  - id: allen-bradley-livery
    desc: "Charcoal enclosure carrying the red Allen-Bradley logo and a STRATIX 5700 product silkscreen on the upper front face — the livery that identifies the manufacturer at a glance."
    threshold: 0.70

important_features:                # optional, max 3 — reviewed AVERAGE >= 0.65
  - id: express-setup-recessed
    desc: "A recessed Express Setup push-button sits below the face plane, reading as a protected button rather than a printed dot."
  - id: sd-card-slot
    desc: "An SD card slot opening on the front face, reading as a real aperture."

quality_contract:
  global_min: 0.75
  perf_budget:                     # small subject, modest part count
    draws: 150
    tris: 200000

# p6_comparison: SPEC-ONLY. Site photos are NOT on disk (P1-INTAKE §2 note) and none of
#   them shows this switch anyway — the inventory lists it, the photographs are of the
#   Panduit aisle. Do NOT fake a reference-match.
p6_comparison: spec-only

camera:
  azimuth_deg: 42                  # STANDARD diagonal grammar, and here it is the right call.
                                   #   The PDU was pulled to 34 because a 33:1 bar foreshortens
                                   #   into a smear. This subject is near-cubic (130x91x136), so
                                   #   the 40-45 diagonal actively SERVES it: one shot reveals
                                   #   the front face, the TOP terminal blocks and a flank
                                   #   together, and three of the five critical features live on
                                   #   those two planes. Same rule, opposite answer, because the
                                   #   subject's proportions are opposite.
  elevation_deg: 24                # high enough to see the top terminals, low enough to keep
                                   #   the port block from foreshortening
  fov: 38                          # equipment hero

lighting: house-rig                # note: the rig is now analysed per surface normal
                                   #   (src/scene/lighting.mjs pattern from the PDU). This
                                   #   subject's identity is split between a FRONT plane and a
                                   #   TOP plane, so both must be lit — unlike the PDU, where
                                   #   up-facing light was wasted.

ui_controls:                       # threejs spec-panel toggles; each mirrors a URL state
  - "LEDS ON-OFF"                  # ?leds=on — energise the system + per-port LEDs
  - "DIN RAIL ON-OFF"              # ?rail=on — show the context rail segment
  - "PORT DETAIL VIEW"             # ?cam=port-detail — close on the jack block
  - "AUTO-ROTATE"

# ── Unsourced values, recorded so a later pass can retire them with evidence ──────
open_items:
  - "PORT LAYOUT (5 cols x 2 rows, ganged 2-high modules) is DERIVED, not published. It is
     the only arrangement that fits 10 jacks in a 91.4 mm body, and it predicts the 20-port
     variant's 127.0 mm width to 0.2 mm — but a Rockwell drawing or a product photo would
     retire the inference. Everything downstream of port_cols/port_rows carries confidence: low."
  - "FRONT-FACE VERTICAL ZONES (port band / mid band / livery band) are a layout inference.
     Sourced: the system LED column is at the LEFT and the terminals are on the TOP face.
     The stacking order and band heights are not."
  - "SD SLOT and ALLEN-BRADLEY LOGO positions: P1-DATASHEETS §3 records both as
     'sin datasheet — usar aproximacion de foto'. Their XY here is chosen to fit, not measured."
  - "HOUSING COLOUR: 'dark grey / charcoal' is sourced; the hex is not. No RAL or Pantone
     is published for the 1783-BMS enclosure."
  - "TERMINAL BLOCK COLOUR: entirely unsourced. P1 confirms the blocks exist and what they
     carry, but nothing in it states their colour."
  - "ALLEN-BRADLEY RED: the logo is sourced as red; the exact red is not published in any
     P1 source."
