# progress.yaml — stratix-5700. Churns per pass; design-spec.yaml stays stable.
#
# `passes` is a MAP keyed by pass name (gate-state.mjs reads it that way).
#
# SINGLE WRITER. This file has ONE writer — the builder session. The orchestrator sends
# verdicts by message and they get recorded here. On the previous asset two sessions
# edited one progress.yaml and produced a duplicate key; YAML keeps only the LAST one, so
# the file parsed clean while reporting a judged pass as unjudged and filing another
# pass's evidence under the wrong parent. Validate the SHAPE after editing, not just that
# it parses: count occurrences PER KEY (`rg -o "^  [a-z][\w-]*:" | sort | uniq -d`), since
# a total line count cannot see a repeat.

design: stratix-5700
track: threejs
mode: heavy
variant: "1783-BMS10CGP (10-port). Dimensions and port mix are for THIS catalogue number; the 6-port is a shallower body and the 20-port a wider one."

passes:
  spec:
    status: PASS
    date: 2026-08-15
    notes: >
      design-spec.yaml authored. Validated: 14/14 required keys, 5 critical (hard max) +
      2 important, 13 materials, metalness near-binary with no violations, no estimated
      material below confidence 0.7, no duplicate keys, and no entry lost to parsing.
    key_derivation: >
      CORRECTED AN IMPOSSIBLE READING OF MY OWN P1. P1-DATASHEETS §3 records "8 RJ45 on
      the left, 2 combo on the right". Taken literally as ONE row that cannot exist: a
      standard RJ45 outline is 15.9 mm, so eight in a row is 127.2 mm inside a 91.4 mm
      body. Industrial switches pack density with 2-HIGH GANGED modules, so the layout is
      5 columns x 2 rows — columns 1-4 the eight RJ45, column 5 the two combo ports.
      CROSS-CHECK, independent: the 20-port body is 127.0 mm wide with 16 RJ45, and eight
      ganged modules = 127.2 mm. The same hypothesis predicts the OTHER variant's width to
      0.2 mm. Recorded as a reasoned derivation at confidence low, not as fact.
    flagged:
      - "assumptions were first written as YAML COMMENTS, which vanish on parse and are
         invisible to any machine reading the spec. Promoted to a real `assumption:` field
         on all 8 estimated materials."
      - "while promoting them, an unclosed quote made the file SWALLOW the port_housing
         entry whole — 13 materials in the text, 12 after parsing, and it still parsed
         'clean'. Caught by comparing raw-text ids against parsed ids, not by 'does it
         parse'. Same failure mode as the previous asset's progress.yaml, in a new dress."

  gate:
    status: PASS
    date: 2026-08-15
    gated_by: orchestrator session
    notes: >
      Spec approved. Camera az 42 / el 24 / fov 38 approved as authored — the STANDARD
      diagonal grammar, which is the opposite call from the previous asset and correct for
      the opposite reason: that subject was a 33:1 bar that foreshortens into a smear,
      this one is near-cubic (130x91x136) so one diagonal shot reveals the front face, the
      TOP terminal blocks and a flank together, and three of the five criticals live on
      those two planes.

