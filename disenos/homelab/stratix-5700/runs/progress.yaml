  surface-touchup:
    status: passed
    date: 2026-08-15
    confirmed_by: >
      Orchestrator re-captured the hero at dpr4 and measured with a control: the band that
      held 284 saturated red pixels now holds 0, while the Allen-Bradley logo still holds
      22135 in its own region — so the thread is gone and the artwork it came from is
      intact. surface-attempt1.review.json updated, global 0.82 -> 0.83.
    scope: "the red-thread must-fix, plus two defects it exposed. No dimensions, angles or URL states changed."

    red_thread:
      reported: "a ~7 x 120 px vertical thread at x~1506/3840, colour rgb(165,71,77), isolated on the charcoal face beside the livery slab"
      how_it_was_pinned: >
        I could NOT match the reported coordinates to a specific edge — my camera solve
        differs from the capture's, and all four candidate edges projected near it but none
        onto it. So I pinned it by ELIMINATION instead, which turned out to be decisive:
        after the surface pass there is NO RED GEOMETRY ANYWHERE in this model. Every red
        mass block was replaced by artwork, so the only red that exists lives inside the
        livery CanvasTexture. A red artefact could therefore only ever be that texture
        appearing on a surface it was never meant to reach.
      cause: >
        A BoxGeometry has six material groups, and a single mapped material paints the
        artwork onto ALL of them — including the 0.8 mm side edges, where the red block
        shows as a smeared sliver. Both textured slabs had this. Confirmed by inspection:
        1 material across 6 groups on each.
      fixed: >
        Both slabs now take a six-material array with the map ONLY on group 4 (+z, the
        front); the other five faces take the HOUSING material. That is also the physically
        right answer — this livery is silkscreen printed on the panel, so it has no label
        stock to show a cut edge. Verified the mapped face index is exactly [4] on both.
      guard_added: >
        verifyNoWrapAroundTextures() fails the build if any mapped material is applied to a
        multi-group geometry. This artefact shipped in a delivered hero; it is now checked
        rather than remembered.
      confirm: "needs a hero re-capture to confirm the thread is gone — I cannot capture"

    two_defects_this_exposed:
      livery_red_unrendered: >
        MY OWN REGRESSION, introduced in the surface pass: replacing the red logo block
        with a texture left livery_red declared in the spec with nothing rendering it. The
        spec now records realised_as — the colour is still governed by that entry, it is
        simply delivered as printed artwork rather than as a surface, which is what a
        silkscreened logo actually is.
      my_check_printed_it_and_passed: >
        Worse than the regression: the materials sweep had ALREADY reported
        "declared but not rendered: livery_red" and still exited 0, because that line was a
        console.log and never an assertion. A sweep that names a defect and passes anyway
        is not a check. It now FAILS on any unrendered declaration unless the spec entry
        carries realised_as.
      and_that_assertion_found_its_own_blind_spot: >
        Turned on, it immediately flagged livery_print as unrendered too — a false
        positive, because the sweep collected usage via o.material.name, which is undefined
        for the material ARRAYS the fix had just introduced. Fixed to iterate arrays. Three
        layers deep, and each one only became visible once the layer above it was made
        strict.

    verified:
      mapped_faces: "livery_plate and sys_led_label_strip both map exactly face index [4] (+z front)"
      no_red_geometry: "no mesh in the model has a red base colour — the red exists only as artwork"
      traceability: "13/13, livery_red excused by realised_as, everything else rendered"
      draws: 36
      tris: 1828
      regression: "build, framing, coincident-plane, materials and surface suites all pass"

