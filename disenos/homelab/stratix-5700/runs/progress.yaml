      louvres: "14 blades, reaching x 0.0454 inside the 0.0457 half-width"
      livery_legibility: "product name 22.3 px and brand 15.2 px on the HERO view — readable without the detail shot"
      led_label_legibility: "11.9 px on the hero, fine print by design; port-detail is where they read"
      artwork_cached: "livery and labels rasterise exactly once each"
