      what_happened: >
        The DIN latch reported CLICKABLE from the front view, where it sits entirely behind
        the enclosure. The cause was in my own pick(): it walked the intersection list and
        SKIPPED every hit that belonged to no hotspot, continuing until one turned up. The
        housing belongs to no hotspot, so the ray sailed straight through a solid body and
        found the latch behind it.
      why_it_had_not_shown_before: >
        On the sibling asset every occluder happened to BE a hotspot — one strip blocking
        the other — so blockedBy worked and the bug stayed invisible. It only surfaces when
        the thing in the way is ordinary geometry, which is the common case.
      fix: >
        pick() now stops at the FIRST visible surface, whatever it is. A real click cannot
        pass through a solid body, so neither may this; if the nearest surface is not a
        hotspot, the click lands on nothing. blockedBy now names the occluder — a probe
        told only "not clickable" cannot tell an occluded hotspot from a missing one.
      sibling_asset_note: >
