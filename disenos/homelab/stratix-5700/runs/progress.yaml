    scope: >
      PBR palette verified against spec.materials[], one real gap closed, and the z-fight
      guard rebuilt to measure occupancy instead of object bounds. No dimensions, camera
      angles or URL states changed.

    traceability:
      result: "13/13 spec materials map 1:1 to a live THREE material — colour, metalness and roughness all match"
      contract_drift: "none — no material exists in code that the spec does not declare"
      metalness: "near-binary throughout; no intermediate values"
      envmap: >
        Lifted only where it is physical: port_shield 1.30 and terminal_screw 1.20 and
        din_clip_steel 1.15 are the bare metals, the only surfaces that should mirror the
        room. port_cavity is dropped to 0.30 because a jack throat is an occluded cavity —
        letting it take full room light is what flattens the recess. Every dielectric
        stays at 1.0.

    gap_closed_led_amber:
      found: >
        The traceability check caught what a render never would: led_amber was DECLARED in
        the spec and NEVER INSTANTIATED. Every per-port lens was wired to green, so the
        model could not reach a state its own contract declares — and the spec's evidence
        for amber is the manual's per-port state table, not a guess.
      fixed: >
        The per-port row is now split: 8 green (link) and 2 amber (disabled or faulted).
        A managed switch with all ten ports in an identical state is also the less honest
        picture. This is an ILLUSTRATIVE state, not a measurement — it makes no claim about
        which ports are disabled on any real unit, the same discipline the sibling asset's
        display follows by showing structure without fabricating numbers.
      asserted: "the build now requires exactly 2 amber lenses, so led_amber cannot silently fall out of the render again"

    zfight_guard_rebuilt:
      why: >
        Splitting the LED row made the guard fire on the two halves — correctly by its own
        rule and WRONG in substance. It compared object BOUNDING BOXES, and an
        InstancedMesh's box is the hull of every instance, so two interleaved instanced
        parts look like they share a footprint when their individual lenses never touch.
        A guard that reports a correct model as broken pushes you into a fake fix.
      fix_1: >
        It now expands every instanced object into its PER-INSTANCE boxes and compares
        those. Occupancy, not hulls.
      fix_2: >
        That precision immediately surfaced a second false positive: the vertical and
        horizontal walls of one module grid cross each other by construction and share a
        front plane at the junction. They also share a MATERIAL — and z-fighting is only
        visible when the two surfaces differ in appearance; whichever of two identical +z
        faces wins the depth test, the pixel is the same. Same-material pairs are now
        skipped, with the reason recorded. Noise that trains people to ignore a guard is
        worse than no guard.
      negative_control: >
        Re-verified that the guard still catches the defect it was written for: pushing the
        port block back flush with the housing reproduces the coincident-plane condition
        between two DIFFERENT materials, which is exactly what it flags.

    verified:                    # headless; no server, no capture
      spec_to_code: "13/13, no drift, no unrendered declarations"
      led_states: "off = all three at 0 · on = #3ee07a / #ffb020 / #ff3b30 at 1.3, three distinct colours"
      sfp_collar_contrast: "port_shield luma 0.348 against port_housing 0.009 — a 39x separation, so the plated collar can carry the RJ45/SFP distinction the judge found subtle at blockout exposure"
      coincident_planes: 0
      draws: 42                  # budget 150
      tris: 1744                 # budget 200000
      regression: "geometry, framing, coincident-plane and materials suites all pass"

