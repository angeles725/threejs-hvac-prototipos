      lever: >
        Frontal fill 0.30 -> 0.45. A throat is an occluded cavity, so the only lamp whose
        rays enter it is one pointing down its axis. Not higher, because the counter-risk
        is real: a frontal light strong enough to fill a throat is also strong enough to
        flatten it by reaching the cavity floor as directly as the rim. At 0.45 the
        front/side contrast measured 1.63 -> 1.73, so the recess reading did not degrade.
      honest_limit: >
        This model computes light DIRECTION, not occlusion. It can prove a lamp points into
        the throat; it cannot say how much light survives the trip. The capture is the
        arbiter of that, and if the mouth still reads flat the next lever is the sleeve's
        envMapIntensity — it is bare metal, so it answers to the environment more than to
        any directional lamp.

