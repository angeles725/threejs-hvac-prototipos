resume:
  state: "blockout BUILT and on disk, awaiting capture + judge. Nothing needs rebuilding."
  first_action: >
    Capture the existing blockout and judge it. Do NOT re-launch a modeler to build it —
    index.html, main.js and src/scene/*.mjs are complete and verified headless.
  capture_states:
    - "default            (front, LEDs off, rail off)"
    - "?leds=on           (system + per-port LED banks energised)"
    - "?cam=port-detail   (jack block close-up)"
    - "?cam=rear          (proves the DIN clip)"
    - "?rail=on           (EN 50022 context rail — SCENERY, not the product)"
  framing_caveat: >
    ?cam=port-detail deliberately uses its OWN ndc margin of 0.72 instead of the default
    0.94, because at 16:10 the standard margin pushed the jack block under the controls
    panel. Do NOT fail it against the standard framing rule — it is framed to a tighter
    margin on purpose, and __qaState reports the solved radius for every view so this is
    checkable rather than a claim.

  # HOW TO REACH THE BUILDER SESSION. HANDOFF.md says SendMessage to "ayudante". That is
  # correct as far as this session knows — it was renamed to `ayudante` at startup — BUT
  # the builder cannot verify it: ListAgents does not list the calling session itself, so
  # it cannot see the name peers address it by. If "ayudante" does not resolve, fall back
  # to ListAgents and pick the session working on this asset, or just proceed: everything
  # needed to capture, judge and record is already on disk and needs no live session.
  contacting_the_builder:
    primary: 'SendMessage to: "ayudante"'
    fallback: "ListAgents, then message the session working on stratix-5700"
    if_unreachable: >
      Nothing blocks. The asset is self-contained; the verdict can be written to
      runs/stratix-blockout-attempt1.review.json and this progress.yaml updated by
      whoever takes over sole-writer duty. Record the takeover here if that happens.
