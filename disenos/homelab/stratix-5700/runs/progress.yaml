    louvre_blades:
      built: >
        The vent recesses were already real depressions; what was missing is the ANGLED
        BLADE that throws the hard shadow line down a vented flank. 14 blades, one per
        recess, tilted 0.55 rad.
      formed_inward: >
        The first version stood them 1.7 mm PROUD and the no-rack-ears guard fired. The
        guard was right and so was the physics it encodes: a stamped louvre is pressed OUT
        OF the panel, so the blade lives inside the opening and nothing projects past the
        enclosure. Re-seated inward; the shadow comes from the tilt, not from protrusion.

    livery:
      built: "one textured slab replaces the three placeholder mass blocks — the red Allen-Bradley block, the Stratix 5700 product name and the catalogue number now READ"
      led_labels: >
        One textured strip for all six diagnostic labels instead of six blank plates. It
        spans exactly the lens column, so row i sits over lens i BY CONSTRUCTION and a
        label cannot drift off its lamp. Names are the manual's own state-table labels.
      text_discipline: >
        Everything printed is sourced from P1-DATASHEETS §3: Allen-Bradley, Stratix 5700,
        1783-BMS10CGP, and the six LED names. NO ELECTRICAL RATINGS — P1 carries no
        voltage, current or power figure for this device, only dimensions, port mix and
        mounting. The check asserts the ABSENCE, not just the presence. No port numbering
        either: nothing establishes how Rockwell numbers these, and unlike the PDU there is
        no functional argument forcing it.

    corrections_during_build:
      - "THE LIVERY PLATE WAS FLOATING. I used PlaneGeometry for the texture, and a
         zero-thickness plane 0.3 mm off the face is attached to nothing — the attachment
         guard caught it. Replaced with a 0.8 mm slab straddling the face, which satisfies
         both guards at once: it overlaps the housing AND its front sits 0.4 mm proud, so
