  structural:
    status: passed
    attempts: 2
    score: 0.84
    action: continue
    review: runs/structural-attempt2.review.json
    superseded: "runs/structural-attempt1.review.json (0.82) — attempt2 adds the SFP cages"
    judged_by: "orchestrator session three-js-46, inline"
    date: 2026-08-15
    judge_note: >
      The SFP distinction reads subtle at the flat-charcoal blockout exposure. Geometry and
      guard are in place; the plated collar sharpens it at the materials/surface passes —
      which is a material property, not a massing defect.

    tracked_item_resolution:                # the review left one item to my judgement
      raised: >
        The blockout entry earmarked "SFP cage on the 2 combo ports + ventilation louvre
        profiles" for structural; neither appeared. Non-blocking, neither is a critical or
        important feature, and the review passed without them.
      sfp_cages: >
        DONE, and I do not think this one was optional. The critical feature port-block-10
        names the distinction explicitly — "eight RJ45 in the left four columns and two
        combo RJ45/SFP in the fifth" — and column 5 was pixel-identical to the other four.
        The block was satisfying the COUNT and the RECESS while saying nothing about the
        MIX, which is a feature half-met rather than met. An SFP cage differs from an RJ45
        in three visible ways and all three are now modelled: a wider, flatter opening, a
        plated collar at its mouth, and NO tab slot. Keyways dropped from 10 to 8 for the
        same reason — an SFP has no tab. Asserted in the build: keyways must stop before
        the SFP column, so the two port types can never quietly converge again.
      louvre_profiles: >
        DEFERRED to surface, deliberately. The vents are already real depressions rather
        than stripes; what is missing is the angled blade of a true louvre, which is a
        surface-relief question and appears in no feature. Recording the decision so it is
        a choice rather than a silent gap.
    scope: >
      The two corrections the blockout review asked for. No dimensions, materials, camera
      angles or URL states changed. The third note (livery CanvasTexture) is explicitly a
      SURFACE item and was left alone.

    correction_1_zfight:
      asked: "give the shield / module-wall pair an explicit depth separation to kill the shimmer"
      found: >
        MEASURED BEFORE FIXING, and the dominant offender was NOT that pair. A sweep for
        coincident visible planes over shared footprints found three:
          housing_body / port_module_walls  FRONT planes both at z=0.06790 over 2805 mm2
          housing_body / sd_lip             FRONT planes both at z=0.06790 over   46 mm2
          port_module_walls / port_shields  REAR planes  both at z=0.06340 over 1912 mm2
        The pair the review named is real but its coincidence is on the REAR faces, hidden
        inside the throat. What actually shimmered in the default and detail captures was
        the module block face sitting exactly flush with the housing face over 28 cm2.
      fixed: >
        The port block now stands 0.6 mm PROUD of the housing face. That is the physical
        answer as well as the rendering one — a ganged connector bezel does stand a little
        proud of the panel it is fitted through — so it is a shape decision rather than an
        arbitrary epsilon. The shield got its own 0.4 mm standoff from the cavity floor and
        the SD lip was recessed 0.5 mm. Re-measured: ZERO coincident visible planes.
      guard_added: >
        verifyNoCoincidentPlanes() now runs on every build. Overlapping VOLUMES are fine
        and often required — seated parts are meant to interpenetrate — so it flags only
        two VISIBLE surfaces at the same depth over a shared footprint. A human noticing
        shimmer in a render is a slow and unreliable detector; this is a fast and certain
        one.

    correction_2_din_latch:
      asked: "sculpt the spring latch as a real leaf/hook, not a protruding tab"
      built: >
        A latch is not a tab: it is a fixed hook that catches the rail's upper lip and a
        LEAF SPRING that snaps over the lower one, with a pull tab for a screwdriver. Both
        are now extruded PROFILES — the hook returns forward on itself (that return is what
        makes it a hook rather than a shelf), and the leaf is a spine of five points offset
        to a constant 1.2 mm thickness so it keeps its section through the curl and reads
        as sheet metal, not a wedge.
      measured:
        hook: "0.0260 x 0.0080 x 0.0080 m"
        leaf: "0.0220 x 0.0294 x 0.0099 m — sweeps 9.9 mm in depth and drops 29.4 mm"
        clip_reach: "z -0.0753, behind the -0.0679 rear wall"
      axis_guard: >
        ExtrudeGeometry runs along local +Z and these are rotated to lay that along world
        X. A mis-rotated extrude does not throw — it lays the part along the wrong axis and
        still renders something plausible, which has bitten this project before. The build
        now asserts each extruded part is wider in X than in Z, and the checks additionally
        require the leaf to have real depth and drop so a flat plate cannot pass as a spring.

    verified:                    # headless; no server, no capture
      coincident_planes: 0
      draws: 41                  # budget 150 (38 at blockout, 39 after the latch, 41 with SFP cages)
      tris: 1744                 # budget 200000
      port_differentiation: "8 keyways (RJ45 only) · 8 SFP cage bars · 2 SFP slots; keyways span x[-0.0340,0.0180] and cages x[0.0262,0.0378], so they cannot overlap"
      geometries: "27 unique, cache 25 — the 2 extruded profiles bypass the cache BY DESIGN:
        each is a one-off shape built once, so caching them would gain nothing. A later
        optimization pass should not treat that gap as duplication to remove."
      framing: "front / rear / port-detail all still fullyVisible, no HUD or controls overlap at 16:9 and 16:10"
      regression: "geometry, framing and coincident-plane suites all pass; guard error count 0"

    deferred_confirmed:
      - "livery CanvasTexture (AB logo, STRATIX 5700 wordmark, catalogue number, 6 LED
         labels) stays a SURFACE item as the review said. Text discipline will apply:
         only facts P1 carries, and no invented electrical ratings."

