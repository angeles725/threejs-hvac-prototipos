# Ladder progress — homelab asset #5: AXIS NETWORK CAMERA (indoor fixed mini-dome)
# SINGLE WRITER. This file is written only by the builder session (ayudante). The
# orchestrator records its verdicts by messaging the builder, never by editing here — two
# writers on one YAML is how a duplicate key silently swallowed a judged pass on the PDU.

design: axis-camera
asset_index: 5
variant: >
  GENERIC INDOOR FIXED MINI-DOME. The model is NOT known and cannot be: AC:CC:8E is an OUI
  registered to Axis Communications AB and a single OUI spans every Axis product line. All
  dimensions are the AXIS M3085-V's, used as a declared placeholder. No model number is
  printed on the asset.

ownership:
  writer: "ayudante (builder session)"
  note: "orchestrator three-js-46 owns the QA server, all captures and all gates; the builder runs no server and no capture"

spec:
  status: authored — awaiting P3 gate
  path: design-spec.yaml
  self_check: >
    Headless self-check PASS at authoring time: YAML parses with no key swallowed by a
    quoting error (raw top-level ids compared against parsed ids); the height split closes
    exactly against the published total; the bubble is a true hemisphere; base_h clears an
    8 mm floor rather than merely being positive; the trim ring is wider than the bubble;
    and every interior part (shroud mouth, shroud tip, lens module) fits inside the
    hemisphere AT ITS OWN DEPTH, not merely inside the overall envelope. Contract sanity:
    5 criticals, 2 importants, near-binary metalness, evidence+source+confidence on all 9
    materials, p6_comparison spec-only, camera elevation negative.

passes:
  spec: {status: authored, date: 2026-08-16}
  gate-p3:
    status: passed
    date: 2026-08-16
    judged_by: "orchestrator session three-js-46, inline"
    verdict: "spec validates clean; no duplicate keys; 9 near-binary materials with evidence/source/confidence; 5 criticals + 2 importants, dome-specific; lens_glass metalness 0.0 correct for a dielectric; p6_comparison spec-only"
  blockout:
    status: built — awaiting capture + judge
    date: 2026-08-16
    files: "index.html · main.js · src/scene/{dims,materials,lighting,axis-camera,runtime}.mjs · vendor/ (offline)"
    envelope: "built 0.1010 x 0.0560 x 0.1010 m · spec 0.101 x 0.056 x 0.101 — exact on all three axes"
    budget: "10 meshes / 120 · 4536 tris / 250000 · 8 cached geometries"

    defects_found_and_fixed:
      subject_box_included_a_hidden_prop:
        what: >
          Box3.setFromObject IGNORES `visible`. The ceiling context prop defaults to hidden
          and is 400 mm across, so the subject box came back 0.400 x 0.062 x 0.400 for a
          101 x 56 x 101 device. The camera solve, the framing metric and the containment
          guard would every one of them have measured a tile the viewer cannot see.
        fix: >
          subjectBox(root) — skips hidden meshes and declared props — used in solveCamera,
          __qaFraming and the checks. The coincident-face guard skips props too, since
          scenery legitimately touches the product.
        note: "same class as the UPS floating vent slot: a box describing something other than the object"
      four_coincident_face_pairs:
        what: "status_led, axis_wordmark and inner_shroud all sat flush with the trim ring's underside; the ceiling prop sat flush with the body's top face"
        fix: "seated through the surface (half-in / 0.5 mm embedded) instead of laid on it; prop lifted 0.4 mm"
      retaining_ring_was_a_solid_plug:
        what: "modelled as a SOLID cylinder wider than the lens, so it enclosed the element completely — invisible from every angle"
        fix: "open-ended ring; the element shows through its mouth"
      the_module_occluded_its_own_lens:
        what: >
          A straight 30 mm barrel drops its own rim 15·sin22 = 5.6 mm when tilted, while a
          7 mm lens standing 1.4 mm proud only reaches 4.0 mm — the barrel's edge hung BELOW
          the glass and blocked every oblique sightline to it.
        fix: "barrel tapered 30 -> 19 mm toward the front, and the element now stands 1.5 mm proud of the ring"
        note: "real optical modules taper for exactly this geometric reason"
      the_lens_faced_away_from_the_hero:
        what: >
          THE MOST IMPORTANT ONE. rotateX(+deg) on a down-pointing axis tilts it toward -z,
          and the hero camera stands at +z. The optics were aimed AWAY from the only angle
          the asset is captured from: 0 of 43 sampled points on the front element were even
          camera-facing. Envelope correct, containment correct, tilt magnitude correct, and
          the camera was looking at the back of the lens.
        fix: "tilt sign corrected; lens_pan_deg default 0 -> 35 to match the hero azimuth"
        spec: "reconciled in design-spec.yaml — the value carried confidence: low, which pre-authorises refinement"
        how_it_was_caught: >
          A visibility check that measures the FRONT ELEMENT only. It returned a zero
          DENOMINATOR, which is not a low score but a different diagnosis entirely —
          'occluded' and 'facing away' are distinguishable only by a camera-facing filter.
          Three earlier specimen definitions (ray-to-centre, all vertices, all camera-facing
          normals) averaged the two into a plausible-looking percentage.

    verified:                        # headless; no server, no capture — the orchestrator gates
      struct: >
        envelope exact; hangs below the ceiling plane with the apex at the published total
        height; 11 mm of visible collar; bubble transparent + depthWrite off + DoubleSide;
        4/4 interior parts present; every interior part clears the hemisphere AT ITS OWN
        DEPTH with 10-14 mm of slack; all three declared tilt poses (0/22/45) keep
        containment; dome and ceiling toggles drive real meshes; 0 material drift; 0 guards.
      framing: >
        all four states (hero/under x dome on/off) fully in frame, camera below the bubble
        equator, 55-57% x 74-94% screen coverage, clear of hud/provenance/controls, front
        element 43/43 reachable through transparent surfaces only, shroud 50%.
      lighting: >
        downward normals receive 1.715 against 0.094 upward — ratio 18.2. Four lamps sit
        below the subject. Every critical-bearing normal clears the 0.55 legibility floor;
        flanks keep 0.72 / 0.48 with 0.245 of asymmetry so the cylinder still models.
      boot: >
        the REAL main.js runs: data-app-ready, render loop started, HUD and all five button
        labels written, __qaFraming and __qaState both callable, state agrees with what is
        driven (dome visible, measured tilt 22.0 deg, opacity 0.42), solved radii 0.208 /
        0.222 m — plausible for a 101 mm subject rather than for a 400 mm tile. Console clean.
      harness_note: >
        The boot check exposed a gap in the SIBLING asset's harness, not a product defect:
        __qaFraming uses bare `innerWidth`, a real browser global that the minimal DOM did
        not define. The UPS boot check never called __qaFraming at all, so this went
        unexercised for a whole ladder. Fixed in the harness; the product is unchanged and
        works in a browser, as the UPS captures already demonstrated.

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."

  structural:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "give every part a real support, and prove nothing floats"
    added: "pan_yoke + yoke_arm_l/r + trunnion_l/r (the tilt mechanism) · bubble_gasket (seats the bubble rim)"
    budget: "15 meshes / 120 · 4720 tris / 250000 · 10 cached geometries"

    the_pass_in_one_line: >
      At blockout the lens assembly was parented straight to the root and sat in the middle
      of the shroud touching NOTHING. The cradle was a transform, not a bracket — the module
      hung in mid-air exactly like the sibling asset's vent slot, and for the same reason:
      every check asked "is it inside the envelope?" and none asked "is it attached?".

    defects_found_and_fixed:
      the_module_was_supported_by_nothing:
        fix: "pan_yoke with two arms dropping from the base plate to a pair of trunnions that ARE the tilt axis"
      the_hierarchy_named_a_mechanism_it_did_not_implement:
        what: >
          THE ONE WORTH READING. The new group was called pan_yoke, but setTilt still applied
          BOTH pan and tilt to the cradle. So the support arms stayed put while the module
          swung 35 degrees away from them and the trunnions left their bearings entirely.
          A hierarchy that names a mechanism it does not implement is worse than no
          hierarchy, because the names invite you to assume the behaviour.
        found_by: "the contact graph — trunnions touching the barrel and nothing else"
        fix: "pan on the yoke, tilt on the cradle; verified across pan 0/35/90 x tilt 0/22/45"
      bubble_rim_abutted_the_base_instead_of_joining_it:
        fix: "bubble_gasket hugging the rim 0.4 mm outside it and reaching 2.2 mm up into the ring"
      body_and_ring_merely_touched:
        what: "coincident planes wearing the disguise of a join — no shimmer only because both parts share one material, so nothing would ever have flagged it"
        fix: "seated 1.2 mm in"
      containment_list_had_stopped_covering_the_object:
        what: "verifyInteriorFitsInsideBubble still named only the blockout's four parts after structural added four load-bearing ones inside the bubble"
        fix: "arms and trunnions added; a support punching through the wall is no better than an optic doing it"
      spec_and_code_disagreed_on_a_name:
        what: "the contract said lens_module, the build said lens_cradle — invisible to every check except a traceability sweep, and it breaks any probe addressing parts by their contract name"
        fix: "CODE reconciled to the spec, never the reverse; animation narrowed tilt-pan -> tilt because pan now lives on the yoke"

    the_guard_this_pass_contributes:
      name: verifyNothingFloats
      what: >
        Every part must reach the mount through a chain of real contacts. This is the guard
        the sibling asset did not have when a vent slot hung 18.7 mm below its chassis for
        six passes and three gates.
      why_it_took_three_attempts: >
        Contact is genuinely hard to measure and the two obvious tests fail in OPPOSITE
        directions. Bounding boxes: the AABB of a cone CONTAINS ITS OWN EMPTY INTERIOR, so
        box overlap called a module suspended in mid-air "in contact" with the shroud around
        it — a false negative for floating, on exactly the concave shapes where floating is
        hardest to see. Vertex distance: cannot see interpenetration at all, so a stud
        embedded 0.6 mm into a ring was reported "floating"; and deepening the embed made it
        WORSE, which is the tell that the test measured the wrong property. The answer is
        point-to-SURFACE distance OR ray-parity containment, with containment restricted to
        meshes tagged as closed solids — run on the open shroud it would resurrect the very
        false contact the guard exists to prevent.

    verified:                        # headless; no server, no capture — the orchestrator gates
      contact_graph: "every part reaches trim_ring / base_body; 0 unreachable"
      mechanism: "trunnion_l<->yoke_arm_l and trunnion_r<->yoke_arm_r in contact across all 9 pan x tilt combinations"
      containment: "all 8 interior parts clear the hemisphere at their own depth, at tilt 0/22/45"
      traceability: "every name declared in the spec hierarchy exists in the build; all 9 spec materials instantiated"
      framing: "unchanged — front element still 43/43 reachable in all four capture states"
      lighting: "unchanged — downward normals 1.715 vs 0.094 upward"
      boot: "the real main.js still boots clean; HUD reads Pase STRUCTURAL"
      suites: "6/6 pass (trace, struct, framing, light, boot, float)"

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."

# ── Resolved at the P3 gate (authored as open questions, answered by the gate) ────
  materials:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "make every declared material actually READ, and prove it with a measurement rather than a hex comparison"

    the_instrument: >
      Not a hex diff. Two materials can differ on paper and land on the same luminance once
      the rig, the surface orientation and the albedo are combined — and where two parts
      TOUCH is exactly where a viewer needs the boundary. So the check computes, per part,
      albedo x irradiance at that part's own area-weighted dominant normal (downward, since
      this subject is seen from below), and requires every CONTACT PAIR to separate.

    metric_was_wrong_first:
      what: >
        The first threshold was an ABSOLUTE luminance difference, and it is the wrong
        property for a subject whose interior is deliberately near-black. It flagged
        lens_barrel / lens_glass as indistinguishable at dL 0.011 — two blacks that actually
        differ by a factor of 2.3 — while it would have passed two whites differing by 5%.
      fix: "Weber contrast, |La-Lb| / max(La,Lb). The eye reads ratios, so the check has to. The same pair then reads 65% apart."
      declared_limit: >
        DIFFUSE TERM ONLY. A very smooth dielectric like lens_glass (roughness 0.08) reads
        mainly through a specular highlight, which is a local bright spot rather than a shift
        in mean luminance. This check cannot measure that and says so; the capture arbitrates
        it. Stated so the number is not read as more than it is.

    defects_found_and_fixed:
      a_vacuous_check_passed_over_a_dead_lamp:
        what: >
          THE ONE WORTH READING. The emissive assertion was `emissiveIntensity > 0` — and
          three.js DEFAULTS that to 1 while the emissive COLOUR defaults to black. So the
          check reported every material in the build as emitting, while nothing emitted
          anything at all. It passed over precisely the defect it existed to catch.
        fix: "assert the COLOUR is non-black as well as the intensity, in the material guard, in the materials check and in the boot check"
        related: "the sibling asset shipped a hero whose LEDs rendered black while the state claimed power:on"
      the_status_indicator_emitted_nothing:
        what: "status_led was declared as an indicator since P2 and had no emissive at all"
        fix: "emissive #2fd07a declared at this pass; intensity remains the lighting pass's dial. Exposed in __qaState as ledEmissiveHex AND ledEmissiveIntensity, because intensity alone proves nothing."
      the_subject_camouflaged_into_its_own_backdrop:
        what: "with ?ceiling=on the white body separated from the white tile by only 18% Weber contrast"
        fix: >
          the PROP was darkened #d8d9d5 -> #bcbeba, reaching 40%. The scenery moves, never
          the product: brightening the camera to escape its own backdrop would be changing
          the asset to fix the set.
      glass_and_barrel_are_both_near_black_dielectrics:
        what: "the front element separates from the matte barrel behind it by REFLECTION, not albedo"
        fix: >
          env_map_intensity raised to 1.10 for lens_glass specifically. This is the correct
          lever — raising metalness to buy a highlight would be a lie about the material,
          which the spec forbids and the gate has affirmed twice.

    verified:                        # headless; no server, no capture — the orchestrator gates
      contrast: "every contact pair separates by >= 20% Weber; subject vs ceiling prop 40%"
      emission: "exactly one emitter (status_led #2fd07a x1), asserted by colour not by intensity"
      spec_parity: "9/9 materials match the contract on colour, metalness, roughness, emissive and emissive intensity; metalness still near-binary (0.0 / 0.9 only)"
      dielectrics_untouched: "shroud, barrel and glass all still metalness 0.0 — no metallic shortcut anywhere"
      unchanged: "framing 43/43 front element in all four states · lighting 1.715 vs 0.094 · nothing floats · traceability clean"
      suites: "7/7 pass (trace, struct, framing, light, materials, boot, float)"

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."
      - "STATUS LED colour is a convention, not a datasheet — green now emits, and it is still unsourced."

  surface:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "the printed mark, and nothing else — because nothing else is evidenced"
    files_added: "src/scene/decals.mjs"

    what_is_drawn_and_what_is_not:
      drawn: >
        "AXIS" alone. OUI AC:CC:8E is registered to Axis Communications AB [CERT-a], which is
        the ONE thing about this device that is actually known.
      not_drawn: >
        The model number. A single OUI spans every Axis line, so nothing identifies this unit
        as an M3085-V or as anything else, and the dimensions are already a declared
        placeholder — silkscreening a catalogue number on top of them would turn a labelled
        approximation into a fabricated identity. Also absent: resolution, IP/IK rating, PoE
        class, serial, QR, and any figure at all. P1 records none of them.
      note: >
        This makes for a deliberately thin pass. The Stratix carried livery plus six LED
        labels because its manual documents them; this asset has one defensible string and
        gets one. A fuller-looking surface pass here would be invention.

    defects_found_and_fixed:
      the_mark_straddled_a_rubber_seal:
        what: "the plate sat at r = 34.5 mm, crossing the bubble gasket at r = 39.9 mm"
        fix: >
          moved to a TANGENTIAL plate at r = 45 mm, running along the arc. That also solves a
          fit problem: 18 mm of text does not fit radially in a 10.6 mm annulus, but it fits
          along it.
      a_spec_note_had_become_false:
        what: >
          The axis_wordmark material carried a note saying it would appear as
          declared-but-not-instantiated in a traceability sweep, and that this was not drift.
          After this pass the sweep walks material ARRAYS and matches clones by id prefix, so
          it DOES find it. The note would now excuse real drift.
        fix: "corrected in place rather than left standing — a stale exemption is worse than no note"
      the_traceability_sweep_stopped_seeing_faced_meshes:
        what: >
          A faced mesh carries six materials and `o.material.name` is undefined on it, so a
          single-material sweep silently stopped seeing the artwork material — which had been
          papered over by a hard-coded exception for `axis_wordmark`. An exception is where
          real drift hides.
        fix: "walk arrays, match clones by id prefix, delete the exception"

    right_sizing_by_measurement:
      measured: "the plate renders 254 x 116 px at dpr3 hero and 310 x 330 px at dpr4 under"
      chosen: "144 x 512 portrait canvas — the box's long dimension is z, which maps to V on the -y face"
      reasoning: >
        1.55x over the worst case. The next size down (256 long edge) would sit at 0.78x and
        interpolate the lettering UPWARDS in the near-axial state — the one that exists to
        look the camera in the face. Under-resourcing is as much a sizing defect as
        over-resourcing; the sibling asset had to RAISE a label canvas for the same reason.

    the_guard_this_pass_contributes:
      name: verifyNoWrapAroundTextures
      what: >
        A mapped material must not sit on a multi-group geometry as a SINGLE material.
        BoxGeometry has six groups; one mapped material paints the artwork on every face.
        That is the red thread that ran down the side of the sibling asset's logo plate, and
        it took elimination to find because no count, envelope or contact check can see a
        texture on the wrong face.
      proven: >
        NEGATIVE CONTROL. Reassigning a single mapped material over the six-group geometry
        makes it fire exactly once; as built it reports zero. A guard that has never been
        seen to fail on its own defect is not known to work.

    verified:                        # headless; no server, no capture — the orchestrator gates
      text: "one string, AXIS; model null; no M30-series number, no rating, no numerals"
      artwork: "rasterises exactly once (memoised); no http(s), fetch or Image() anywhere in the factory"
      faces: "6 materials over 6 geometry groups, 2 unique — art on group 3 only"
      guard: "fires 1 on the reintroduced defect, 0 as built"
      traceability: "9/9 spec materials instantiated, with NO hard-coded exception"
      unchanged: "framing 43/43 front element in all four states · lighting 1.715 vs 0.094 · contrast all pairs >= 20% Weber · nothing floats"
      suites: "8/8 pass (trace, struct, framing, light, materials, surface, boot, float)"

    cannot_be_verified_headless:
      - "TEXT ORIENTATION on the plate. There is no canvas under node, so the artwork is
         never rasterised and the lettering's rotation cannot be read. The capture arbitrates
         it; if it reads sideways the fix is one rotate() in decals.mjs."

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."
      - "STATUS LED colour is a convention, not a datasheet."
      - "WORDMARK POSITION chosen to fit, not measured."

  lighting-camera:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "close the LED emissive dial, and judge the rig AFTER the tone curve"

    the_instrument_changed:
      what: >
        Every earlier measurement in this asset compared LINEAR luminance. The renderer
        applies ACES filmic tone mapping at exposure 1.05, which compresses the top end hard
        — so two values far apart in linear can land close together on screen, and a value
        tuned in linear can look nothing like the number suggests. This pass judges the
        Narkowicz ACES fit, the same curve three.js uses.

    defects_found_and_fixed:
      the_lit_indicator_was_darker_than_its_own_bezel:
        what: >
          At emissiveIntensity 1.0 the LIT status LED rendered 0.620 on screen against 0.879
          for the housing around it. An energised lamp darker than its own bezel reads as
          OFF — the linear numbers never showed it, because the collar and the lamp sit on
          opposite sides of the curve's knee.
        fix: "intensity closed at 4.0 -> 0.914 on screen"
        the_ceiling_matters_too: >
          ACES caps the gain: intensity 8 only reaches 1.11x the collar, so pushing past 4
          blows the lamp out without buying separation. The rest of the read comes from hue,
          a saturated green against neutral white, which a luma metric cannot see.
      the_bubble_washed_out_the_optical_cavity:
        what: >
          THE ONE THAT MATTERS. A near-white bubble (#dfe6ea) sitting in E = 1.715
          contributes 1.342 of its OWN linear luminance, which dominates the alpha blend.
          The matte black shroud behind it — 0.002 bare, i.e. black — came through at 0.671
          on screen, 76% of the white collar beside it. The optical cavity stopped reading
          as a cavity and the dome read as a LIGHT FITTING, which is precisely the failure
          the black shroud exists to prevent. The critical feature was being defeated by the
          part in front of it.
        fix: "bubble smoked to #8a949c -> the veiled cavity lands at 0.335, 38% of the collar"
        transmission_unchanged: >
          opacity stays 0.42. The interior is no less visible — the bubble simply stops
          glowing over it. Verified: the front element is still 43/43 reachable in all four
          capture states.
        defensible_not_convenient: >
          Security domes are commonly smoked precisely so the lens direction cannot be read,
          and the spec already recorded the tint as unpublished with clear-vs-smoked called
          out as a real product difference. It remains an open item.

    wordmark_orientation_resolved:
      reported_by: "orchestrator, from the surface capture: lettering running bottom-to-top"
      how_it_was_fixed: >
        SOLVED, not guessed. Which canvas rotation reads upright depends on the UV layout of
        the mapped face, the plate's own orientation and the camera pose — three things that
        compose, where flipping a sign costs a capture round per attempt. The check projects
        the mapped face's U and V axes into screen space and computes the text's advance and
        up directions from them.
      the_finding: >
        The real fault was the GEOMETRY, not the canvas. On the -y face of a BoxGeometry U
        runs along local X and V along local Z; with the plate's length in z the text had to
        be rotated into V, which the solve confirms reads bottom-to-top. Putting the length
        in local X and rotating the whole plate 90 degrees puts the text along U with NO
        canvas rotation. World position and bounding box are unchanged.
      the_criterion_was_wrong_too: >
        The first version demanded a near-vertical `up` as well as a horizontal advance. On a
        plate seen in perspective those two are NOT perpendicular on screen — foreshortening
        shears them — so it rejected orientations that read fine and returned contradictory
        verdicts between the two views. The criterion is about the ADVANCE: left to right,
        within 60 degrees of horizontal, and not upside down. Residual tilt is perspective on
        a tangential plate, not a defect.
      and_it_must_fit: >
        Two rotations can both read upright while one runs the lettering across the canvas's
        SHORT axis, where the text cannot fit. A check returning two valid answers, one of
        them unusable, has not finished answering — so the fit is asserted as well.
      result: "TEXT_ROT 0, canvas 512 x 144 landscape; upright in hero (advance 24 deg) and under (50 deg)"

    verified:                        # headless; no server, no capture — the orchestrator gates
      led: "lit 0.914 on screen vs 0.879 housing; the ceiling of 1.11x at intensity 8 is recorded so nobody re-tunes it upward expecting more"
      cavity: "0.335 vs 0.879 collar — 38%, reading as a cavity again"
      optics: "still 43/43 of the front element reachable through transparent surfaces only, in all four states"
      rig_unchanged: "downward normals 1.715 vs 0.094 upward; four lamps below the subject; no metalness touched anywhere"
      orientation: "text runs along the canvas long axis AND reads upright in every capture state"
      suites: "10/10 pass (trace, struct, framing, light, materials, surface, orient, tonemap, boot, float)"

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."
      - "STATUS LED colour is a convention, not a datasheet."
      - "BUBBLE TINT still unsourced — smoked is now measured-as-necessary, not sourced."

  interaction-ui:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "make the CAMERA clickable, not just the control panel"
    files_added: "src/scene/interaction.mjs · #hotspots legend and #tooltip in index.html"
    hotspots: "lens (cycle tilt) · collar (ceiling prop) · yoke (switch view) · dome (lift the bubble)"

    the_inherited_rule_had_to_change:
      what: >
        pick() stopped at the FIRST VISIBLE SURFACE, whatever it was. That rule exists because
        a click cannot pass through a solid body, and dropping it once let a sibling asset
        report a hotspot behind an enclosure as clickable from the front.
      why_it_is_wrong_here: >
        It is right for solids and WRONG FOR A VEIL. The whole point of this subject is that
        you see THROUGH the bubble — the framing check proves 43/43 of the front element is
        reachable by eye through it. A user looking straight at the lens through clear
        polycarbonate and finding the click blocked by glass they can see through would be
        right to call that broken.
      the_new_rule: >
        A click passes through TRANSPARENT surfaces and stops at the first OPAQUE one —
        exactly the criterion the framing check already uses for visibility, which is the
        point: reachability by eye and reachability by click should agree. The bubble stays a
        hotspot at LOWER PRIORITY, answering only where nothing opaque sits behind the ray.
        Click the glass over empty space and the dome lifts; click the glass over the lens and
        you get the lens.
      proven_by_negative_control: >
        Making the bubble OPAQUE must break lens-reachability, and it does — the click then
        stops at dome_bubble. Without that control the rule would be indistinguishable from
        "the ray happens to reach the lens anyway", and the check would prove nothing.

    defects_found_and_fixed:
      overlapping_hotspot_subtrees:
        what: >
          The yoke hotspot addressed `pan_yoke`, which is ALSO the parent of the cradle — so
          it addressed a node CONTAINING the lens module, and every sampled point landed on
          the optics. It reported unreachable, blocked by `lens`, from every angle. Hotspot
          subtrees that contain one another are ambiguous by construction.
        fix: "the arms moved into their own `yoke_arms` group, declared in the spec hierarchy"
      my_own_criterion_was_wrong:
        what: >
          The check first demanded every hotspot be reachable FROM THE HERO. The yoke arms
          live INSIDE the shroud cone; from the oblique hero the cone hides them, and from the
          near-axial `under` view you look straight up the cone's mouth and they are plainly
          there.
        why_it_matters: >
          Satisfying that criterion would have meant either moving structural parts out of the
          housing that holds them, or declaring a working affordance broken. Neither is true.
          The criterion is: reachable in SOME declared capture state, and the LEGEND DIMS what
          is not reachable right now. That is what a still capture owes the viewer, since no
          cursor exists there to reveal a tooltip.
        measured: >
          lens and collar reachable in all four states; yoke in under/dome=on and
          under/dome=off; dome in hero/dome=on. One dimmed row in the default state, which is
          also the check that the legend is distinguishing anything at all rather than
          lighting every row regardless.

    verified:                        # headless; no server, no capture — the orchestrator gates
      hotspots: "4/4 present; each reachable in at least one declared state"
      transparency_rule: "the lens is clickable THROUGH the bubble, and the ray is confirmed to have passed through it"
      negative_control: "an opaque bubble blocks the lens — the rule is not vacuous"
      solids_still_block: "a click on the collar stops at base_body; nothing is reachable through the housing"
      state_is_driven: "all four interactions change the value they claim to (tilt, ceiling, view, dome), verified by reading the state before and after"
      unknown_ids: "__qaInteract('nope') returns ok:false with an error rather than silently doing nothing"
      legend: "re-derived on every state change and on view change; dims what the module's own occlusion test says is unreachable"
      unchanged: "framing clear of hud/provenance/controls/hotspots · optics 43/43 · lighting 1.715 vs 0.094 · nothing floats"
      suites: "11/11 pass (trace, struct, framing, light, materials, surface, orient, tonemap, interaction, boot, float)"

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."
      - "STATUS LED colour is a convention, not a datasheet."
      - "BUBBLE TINT still unsourced — smoked is measured-as-necessary, not sourced."

  optimization:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "measure, then change only what the measurement asks for"

    the_question_is_different_for_a_curved_subject:
      what: >
        The four box assets spent their triangle budget on PART COUNT, so their optimization
        pass asked "what is duplicated?". This subject spends it on CURVATURE, so the
        question is "at the resolution we are judged at, can you SEE the polygons?" — which
        is computable rather than a matter of taste.
      instrument: >
        Sagitta. A circle of radius R approximated by N segments deviates from the true arc
        by R(1 - cos(pi/N)) at each chord's midpoint; times the on-screen pixels-per-metre
        that is the faceting error in PIXELS. Measured on the tightest capture state (dpr4,
        `under`): the subject spans 19891 px/m.

    the_answer_came_out_backwards:
      found: >
        At 64 segments the trim ring showed 1.21 px of faceting and the body 1.16 px — a
        visibly polygonal silhouette on the two LARGEST circles in the asset — while the whole
        build sat at 1.9% of its triangle budget. There was nothing to reclaim and something
        to spend on.
      done: >
        Segment counts are now SOLVED from radius against a 0.5 px target
        (arcSegments in dims.mjs), not pinned as magic numbers, so the tessellation is a
        consequence of the capture resolution and re-derives if that changes.
      not_a_blind_increase: >
        The same solver LOWERED the small parts — lens element 64 -> 40, barrel 64 -> 56,
        ring 48 kept — while raising ring and body to 104 and the bubble to 96. It
        redistributes toward where the pixels actually are.
      cost: "1.9% -> 3.2% of the triangle budget; draws unchanged at 15 of 120"
      spec_anticipated_this: >
        The P2 perf_budget note already said segments are the thing to protect and that this
        pass must not reclaim them by decimating the bubble. It turned out to need the
        opposite instruction as well.

    real_duplication_removed:
      boxes_bypassed_the_geometry_cache: >
        Only cylinders and the hemisphere went through it, so the two yoke arms — identical
        in every dimension — allocated one BufferGeometry each. Trivial in triangles, but it
        is real duplication and geometry SHARING costs nothing: unlike instancing it does not
        collapse named, individually addressable meshes. Unique geometries 14 -> 13, cache
        now holds all 13.
      materials: "compared by FULL SIGNATURE — type, colour, metalness, roughness, opacity, transparent, emissive, emissiveIntensity, envMapIntensity, side, map — not by name. No duplicates."

    what_I_did_NOT_do:
      no_instancing: >
        There is almost nothing repeated on this subject — two arms, two trunnions — and the
        build sits at 13% of its draw budget. Instancing would buy nothing and would cost
        individually named, addressable meshes, which the interaction hotspots and every
        containment guard depend on. Same call as all four sibling assets.
      no_texture_resize: >
        Right-sizing was already measured in both directions at SURFACE (144x512 -> 512x144
        landscape, 1.55x over the worst render). Nothing changed, so nothing to redo.
      no_decimation_of_the_bubble: "explicitly forbidden by the spec, and the measurement says it would be wrong anyway"

    verified:                        # headless; no server, no capture — the orchestrator gates
      faceting: "worst part now 0.48 px (inner_shroud); every curved part below half a pixel at dpr4"
      budget: "15 draws / 120 · 8048 tris / 250000 (3.2%)"
      geometry: "13 unique, cache holds 13 — nothing bypasses it"
      materials: "9 unique, zero duplicate signatures"
      artwork: "rasterises exactly once"
      unchanged: "framing · optics 43/43 · lighting 1.715 vs 0.094 · contrast · nothing floats · hotspots reachable as before"
      suites: "12/12 pass (trace, struct, framing, light, materials, surface, orient, tonemap, interaction, optimization, boot, float)"

    open_items_carried:
      - "MODEL IDENTITY unknown and unknowable from the available evidence."
      - "MOUNTING HARDWARE NOT MODELLED — P1 records no screw count, type or position."
      - "STATUS LED colour is a convention, not a datasheet."
      - "BUBBLE TINT still unsourced — smoked is measured-as-necessary, not sourced."

  p6-final:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "verify the finished asset against its own CONTRACT; capture is the orchestrator's"
    p6_comparison: spec-only
    references_on_disk: none        # references/ is empty — a reference-match would be fabricated

    envelope:
      built:   "0.1010 x 0.0560 x 0.1010 m"
      spec:    "0.101 x 0.056 x 0.101 m"
      verdict: "exact on all three axes after seven build passes"

    containment:
      measured_as_a_cylinder: >
        Furthest radius 50.50 mm against a 50.5 mm envelope; y span -56.00 .. 0.00 mm against
        the declared [-56.0, 0]. Measured RADIALLY, not as an axis-aligned box — a box around
        a disc leaves the corners free and a part can drift into them unnoticed.
      nothing_grew: "no mass drift at all; unlike the rack-eared siblings, nothing on this device exceeds its own envelope"

    criticals_backed_by_geometry:
      ceiling-dome-form:           "3/3 parts present"
      clear-bubble-reveals-optics: "3/3 parts present"
      tilted-lens-module:          "4/4 parts present"
      black-inner-shroud:          "1/1 part present"
      mount-trim-ring:             "1/1 part present"

    spec_promises:
      materials: "9 declared · 0 drifted · all rendered"
      printed_text: 'AXIS only — model number ABSENT, and no rating, resolution, serial or numeral anywhere'
      ui_controls: "4/4 declared controls have BOTH a DOM button and a URL state, so the gate can capture every one"
      guard_errors: 0

    the_gap_this_pass_closed:
      what: >
        Every earlier framing check ran the DEFAULT tilt. This asset is ARTICULATED and the
        gate captures poses — a lens that reads at 22 degrees and disappears at 45 would have
        shipped. struct proved the poses stay CONTAINED, but containment is not visibility.
      done: >
        The full state matrix: view x dome x tilt = 12 states, measuring the reachable share
        of the front element's own camera-facing surface through transparent surfaces only.
        All 12 report 100%, and the status LED 81%.
      and_the_flat_result_was_distrusted: >
        Twelve states returning EXACTLY 100% could mean the asset is sound in every pose, or
        that the measurement cannot tell poses apart. A check that cannot fail proves nothing,
        so it was made to fail on purpose: an out-of-range tilt of 80 degrees (aimed into the
        shroud wall) drops it to 85%, and an opaque plate 4 mm in front of the element drops
        it to 15%. The plateau is a real result, not a blind metric.

    open_items:                      # DOCUMENTED, and verified still documented
      model_identity: >
        UNKNOWN AND UNKNOWABLE from the available evidence. AC:CC:8E is an OUI registered to
        Axis Communications AB and a single OUI spans every Axis line, so it establishes the
        MANUFACTURER and nothing else — not the model, not even the category. Every dimension
        in this asset is the AXIS M3085-V's, used as a declared placeholder. A site photograph
        is the single highest-value piece of evidence anyone could add.
      mounting_hardware: >
        NOT MODELLED. Fixing screws are visible on real mini-dome trim rings, but P1 records
        neither count, type nor position — so nothing is built. Asserted, not merely claimed:
        the check scans the scene graph for any mesh named screw/bolt/fastener and finds none.
      bubble_tint: >
        SMOKED is measured-as-necessary, NOT sourced. A near-white bubble washed the black
        optical cavity to 76% of the white collar and the dome read as a light fitting.
        Nothing publishes the tint of any specific unit, and clear-vs-smoked remains a real
        product difference.
      status_led_colour: "green is a near-universal convention, not a datasheet"
      wordmark_position: "chosen to fit the collar, not measured"

    verified:                        # headless; no server, no capture — the orchestrator gates
      suites: "13/13 pass (trace, struct, framing, light, materials, surface, orient, tonemap, interaction, optimization, boot, float, p6)"
      boot: "the real main.js boots: data-app-ready, render loop, HUD reads Pase FINAL, all __qa hooks callable, console clean"
      budget: "15 draws / 120 · 8048 tris / 250000 · 13 unique geometries, cache holds 13"
      faceting: "every curved part under half a pixel at dpr4"
      offline: "no http(s) URL, fetch, XHR or Image() in main.js / index.html / src; the importmap resolves only to vendor/"

gate_questions_resolved:
  complexity_tier:
    asked: >
      Scores sum to 14, the highest of the run. I declared `moderate` by precedent because
      I did not know where the 'complex' cut sits, and inventing a threshold that happens
      to make my own number land is how a spec certifies itself.
    answer: "COMPLEX. Applied to design-spec.yaml."
    evidence_check: >
      I verified the cited cut against the gated specs rather than accepting it: rack-cabinet
      sum 15 -> complex, PDU sum 13 -> moderate, Stratix 12 and UPS 9 -> moderate. Stated
      precisely, that BOUNDS the boundary (moderate <= 13, complex >= 15) but does NOT
      determine 14, because no gated spec in this run scores 14. The gate placed it on
      SUBSTANCE — occlusion 3, a new geometric class, a translucent veil, inverted lighting
      — which is the correct basis for a value the data cannot settle.
  negative_elevation:
    asked: "camera.elevation_deg -22, the first negative of the run; confirm the framing convention accepts a contrapicado hero."
    answer: >
      ACCEPTED. The framing convention exists to frame the criticals; for a ceiling-mounted
      dome that means looking UP. The blockout will be judged against that, not against a
      positive elevation.
  lighting_gap:
    asked: "The house rig lights from above; every feature here faces down. max(0, N·L) is zero for a downward normal against any lamp on a ceiling arc."
    answer: >
      ACCEPTED and recorded as EXPECTED, not drift. Add the source from below and prove it
      with the analytic irradiance check. The spec's explicit ban on compensating by raising
      metalness on the shroud or barrel was affirmed: they are matte dielectrics, and a
      metallic shortcut would be a lie about the material to paper over a lighting fault.
  confidence_floor:
    asked: "(raised by the gate, not by me) four estimated materials sit below a 0.7 confidence floor."
    answer: >
      FLOOR YIELDS TO UNKNOWN-MODEL. housing_white 0.55 and dome_clear / status_led /
      ceiling_prop_tile at 0.6 are honestly low because P1 records no colour, no tint, no LED
      colour or position, and the tile is set dressing. Forcing them to 0.7 would inflate
      confidence to pass a gate — the exact dishonesty the split provenance exists to
      prevent. An honest 0.55 is worth more than a fabricated 0.7. Left as authored.

open_items_carried:
  - "MODEL IDENTITY unknown and unknowable from available evidence — the single
     highest-value piece of new evidence for this asset would be a site photograph."
  - "MOUNTING HARDWARE NOT MODELLED: P1 records no screw count, type or position, so
     nothing is built — the same rule that left the UPS rear receptacles unbuilt."
