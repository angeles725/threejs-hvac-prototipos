# DesignSpec — homelab asset #5: AXIS NETWORK CAMERA (indoor fixed mini-dome)
# Authored at P2 (spec-only). See design3d/references/DESIGNSPEC.md for authoring rules.
# Evidence: disenos/homelab/P1-DATASHEETS.md §4 + §6 (research) + P1-INTAKE.md line .31 (inventory).
#
# ── READ THIS BEFORE ANY OTHER LINE ──────────────────────────────────────────────
# THE MODEL IS NOT KNOWN, AND CANNOT BE. The only hard evidence tying this device to a
# product is the MAC prefix AC:CC:8E, which is registered to Axis Communications AB
# [CERT-a]. A single OUI spans every Axis line — domes, PTZ, bullet, fisheye, radar,
# intercoms — so it identifies the MANUFACTURER and nothing else. Not the model. Not even
# the category.
#
# Therefore this asset is declared as a GENERIC INDOOR FIXED MINI-DOME, sized from the AXIS
# M30 family, and NOT as an M3085-V. That distinction governs everything downstream:
#
#   - The dimensions below are [CERT-doc] AS FIGURES FOR THE M3085-V, and low-confidence AS
#     A DESCRIPTION OF THE UNIT ON SITE. A number can be well-sourced and still be the wrong
#     number for this object. Both facts are recorded per dimension; do not collapse them.
#   - NO MODEL NUMBER is printed anywhere on the asset. "AXIS" as a wordmark is defensible
#     because the OUI certifies the manufacturer. "M3085-V" would be a fabricated claim
#     rendered at hundreds of pixels — the same rule that kept ratings off the Stratix
#     nameplate and numerals off the UPS display.
#   - P6 stays spec-only. references/ is empty and the site photographs are of the Panduit
#     aisle, so there is nothing to match against. Do NOT fabricate a reference-match.

design: axis-camera
asset_index: 5
track: threejs
mode: heavy                        # multi-asset homelab scene; this asset gated alone
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.005 m"  # 2x finer than the Stratix: a 0.101 m subject whose
                                     #   identity is a CURVE, and curvature is exactly what a
                                     #   coarse voxel grid destroys first

complexity:                        # pre-spec assessment — sum 14
  scores: {silhouette: 1, components: 1, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex
  # TIER RESOLVED AT THE P3 GATE (was authored `moderate`, deliberately, with the question
  #   flagged rather than answered — inventing a threshold that makes your own number land
  #   is how a spec certifies itself).
  #   The gated specs of this run bound the cut: PDU sum 13 -> moderate, rack-cabinet sum
  #   15 -> complex. Note precisely what that establishes: it BOUNDS the boundary, it does
  #   not determine 14, because no gated spec in this run scores 14. The gate placed it at
  #   complex on SUBSTANCE, which is the right basis — occlusion 3 (the highest in the run),
  #   a new geometric class, a translucent veil, and inverted lighting.
  # occlusion: 3 is the highest score in this spec and it is the real subject of the asset.
  #   A CLEAR BUBBLE THAT MUST BE SEEN THROUGH is the opposite of every previous asset,
  #   where occlusion meant "a cavity reads dark". Here the failure is a veil, not a hole,
  #   and it has two distinct modes: the bubble hides the optics, or the bubble self-occludes
  #   off-axis because a ray crosses its wall twice.
  # silhouette: 1 on purpose. A dome is a SIMPLE shape. It is a NEW shape for this run —
  #   the first non-box of five — but novelty is not complexity and must not be scored as it.

environment:                       # P0 discovery OUTPUT — paths only
  overlays:
    handbook: null
    house_rules: null
    qa_tools: research/tools
    design_dir_root: disenos/homelab

references:                        # P1 evidence — no invented dimensions
  - source: "https://maclookup.app/macaddress/ACCC8E/mac-address-details [CERT-a]"
    evidences: "OUI AC:CC:8E (MA-L) is registered to Axis Communications AB, Lund, Sweden. Corroborated independently by cleancss.com and hwaddress.com."
    suitability: "sole hard link to a manufacturer. Establishes NOTHING about model or category."
  - source: "disenos/homelab/P1-INTAKE.md line .31 (inventory, this session)"
    evidences: "one Axis network camera in the installed inventory"
  - source: "https://www.axis.com/products/axis-m30-series [CERT-web]"
    evidences: "the M30 series is the indoor fixed mini-dome family (M3085-V, M3086-V, M3106-L); ceiling-mounted, compact"
    suitability: conditional       # supports the FORM choice, not this unit's identity
  - source: "https://www.axis.com/dam/public/15/bf/16/datasheet-axis-m3085-v-dome-camera-en-US-378406.pdf [CERT-doc]"
    evidences: "dome body diameter 79 mm; mounting base / cutout diameter 101 mm; height (ceiling to apex) 56 mm; weight ~150 g"
    suitability: conditional       # PLACEHOLDER SIZING. The datasheet is authoritative for
                                   #   the M3085-V; nothing establishes that the installed
                                   #   unit IS an M3085-V. See the header block.
  - source: "disenos/homelab/P1-DATASHEETS.md §4 and §6 (this session)"
    evidences: "explicit research verdict: 'sin datasheet del modelo exacto — usar aproximacion de foto (dome generico)'; §6 gap table records the action as 'model as generic indoor mini-dome (M30 dims)'"

dimensions_real:                   # metric; 1 unit = 1 m.
  # EVERY dimension here carries a SPLIT provenance, and the split is the point:
  #   the figure is [CERT-doc] for the M3085-V · its applicability here is [INFER].
  # confidence records the SECOND of those, because that is what the model is asserting.
  mount_base_dia_m: {value: 0.1010, confidence: low}   # outer trim-ring / ceiling cutout ø
  dome_bubble_dia_m: {value: 0.0790, confidence: low}  # clear bubble ø where it meets the base
  height_m:         {value: 0.0560, confidence: low}   # ceiling plane to bubble apex
  mass_kg:          {value: 0.150,  confidence: low}

  # --- height split: DERIVED, with a positivity guard ----------------------------
  # Published: TOTAL height 56 mm and bubble diameter 79 mm. NOT published: how that 56 mm
  # divides between the base ring and the bubble. Taking the bubble as a TRUE HEMISPHERE is
  # the one assumption that makes the junction tangential — the bubble wall meets the base
  # plane at 90 degrees, which is how a moulded dome actually seats into its ring:
  #     bubble_h = dome_bubble_dia / 2 = 39.5 mm
  #     base_h   = height - bubble_h   = 56.0 - 39.5 = 16.5 mm
  # GUARD (build-time, console.error): base_h must exceed 8 mm, not merely be positive. A
  # subtraction that lands at +0.2 mm still renders a plausible dome while being physically
  # absurd — a ceiling ring thinner than its own mounting flange. Assert a VISIBLE margin.
  base_h_m:   {value: 0.0165, confidence: low}
  bubble_h_m: {value: 0.0395, confidence: low}

  # --- lens module: functionally forced, dimensionally not sourced ---------------
  # A fixed mini-dome's optics sit on a tiltable cradle inside the bubble. That the module
  # EXISTS and is ORIENTABLE is forced by the product category. Its diameter and travel are
  # not published in any P1 source and are sized to sit inside the bubble with clearance.
  lens_module_dia_m: {value: 0.0300, confidence: low}
  lens_glass_dia_m:  {value: 0.0140, confidence: low}
  lens_tilt_deg:     {value: 22,     confidence: low}   # default pose, off-axis on purpose
  # 0 -> 35 at the BLOCKOUT. Refined under the pre-authorisation that `confidence: low`
  # carries, and for a reason the build found rather than a preference: with pan 0 and the
  # tilt applied about +x, the optical axis pointed at -z while the hero camera stands at
  # +z. The lens faced AWAY from the only angle the asset is captured from — 0 of 43 sampled
  # points on the front element were even camera-facing. Aligning pan with the hero azimuth
  # puts the optics where they can be read, and matches what the device does: an indoor dome
  # points down the aisle it watches, and the hero stands in that aisle.
  lens_pan_deg:      {value: 35,     confidence: low}
  shroud_dia_m:      {value: 0.0620, confidence: low}   # black inner cone, inside the bubble

hierarchy:
  - name: camera_root
    pivot: [0, 0, 0]                 # ORIGIN AT THE CEILING PLANE, apex hanging BELOW it.
                                     #   See `orientation` — this is not a product-shot pose.
    children:
      - name: mount_base             # trim ring + body disc that seats against the ceiling
        pivot: [0, 0, 0]
        animation: none
        attachment:
          parent_socket: ceiling_plane
          local_start: [0, 0, 0]
          local_end:   [0, -0.0165, 0]
          length_confidence: low
          contact_type: surface-contact
          overlap: 0.0
          gap_tolerance: 0.0
      - name: inner_shroud           # black anti-reflection cone INSIDE the bubble
        pivot: [0, -0.0165, 0]
        animation: none
        # Functionally forced: without it the clear bubble shows the white body's inside and
        # the camera reads as a light fitting. Every mini-dome has this cone.
        attachment:
          parent_socket: mount_base
          local_start: [0, -0.0165, 0]
          local_end:   [0, -0.0330, 0]
          length_confidence: low
          contact_type: socket
          embed_depth: 0.0015
          gap_tolerance: 0.0
      - name: pan_yoke               # ADDED AT STRUCTURAL: the bracket the module hangs from
        pivot: [0, -0.0250, 0]
        animation: pan
        # At blockout the lens assembly was parented straight to the root and sat in the
        # middle of the shroud touching NOTHING — the cradle was a transform, not a bracket.
        # A fixed dome uses a yoke: two arms dropping from the base plate to a pair of
        # trunnions that ARE the tilt axis. PAN belongs here and TILT belongs to the cradle;
        # applying both to the cradle left the arms behind while the module swung away from
        # them, and the trunnions left their bearings entirely.
        attachment:
          parent_socket: mount_base
          local_start: [0, -0.0160, 0]     # 0.5 mm up into the base plate
          local_end:   [0, -0.0250, 0]     # the tilt axis
          length_confidence: low
          contact_type: embedded
          embed_depth: 0.0005
          gap_tolerance: 0.0
        children:
          - name: yoke_arms            # own group: pan_yoke also parents the cradle, so a
                                       #   hotspot addressing pan_yoke would address a node
                                       #   CONTAINING the optics. Overlapping hotspot
                                       #   subtrees are ambiguous by construction.
            children:
              - name: yoke_arm_l       # x = -16 mm, just outside the barrel
              - name: yoke_arm_r       # x = +16 mm
      - name: lens_module            # ARTICULATED: TILT only — pan moved to pan_yoke
        pivot: [0, -0.0250, 0]       # the tilt axis, not the glass
        animation: tilt
        # NAME RECONCILED AT STRUCTURAL. The build called this group `lens_cradle` while the
        # contract called it `lens_module` — two names for one thing, which is invisible to
        # every check except a traceability sweep and breaks any probe that addresses parts
        # by their contract name. The CODE was reconciled to the spec, not the reverse.
        # `animation` narrows from tilt-pan to tilt because pan now lives on the yoke, which
        # is where the mechanism actually puts it.
        # ARTICULATED ASSETS NEED STATE CAPTURE. The default pose is NOT the only pose the
        # gate must see: a tilt of 0 and a tilt of 22 degrees are different silhouettes
        # through a curved bubble. Every capture state is declared in ui_controls.
        attachment:
          parent_socket: inner_shroud
          local_start: [0, -0.0245, 0]
          local_end:   [0, -0.0355, 0.0]
          length_confidence: low
          contact_type: socket
          embed_depth: 0.002
          gap_tolerance: 0.0
      - name: bubble_gasket          # ADDED AT STRUCTURAL: seats the bubble rim into the base
        pivot: [0, -0.0158, 0]
        animation: none
        # The bubble's rim ended exactly where the base ended — an abutment, not a joint, and
        # the contact check reported the bubble attached to nothing. A real dome seats its
        # bubble in a compressible gasket. This one hugs the rim (0.4 mm outside it) and
        # reaches 2.2 mm up into the ring, so it overlaps BOTH parts it joins.
        attachment:
          parent_socket: mount_base
          local_start: [0, -0.0173, 0]
          local_end:   [0, -0.0143, 0]
          length_confidence: low
          contact_type: embedded
          embed_depth: 0.0022
          gap_tolerance: 0.0
      - name: trunnion_l             # ADDED AT STRUCTURAL: the stubs that MAKE the tilt axis
        pivot: [-0.0156, -0.0250, 0]
        animation: tilt
        # Children of the cradle, not the yoke: a trunnion belongs to the module and turns
        # inside the arm. Verified in contact with its arm across pan 0/35/90 x tilt 0/22/45.
      - name: trunnion_r
        pivot: [0.0156, -0.0250, 0]
        animation: tilt
      - name: dome_bubble            # CLEAR polycarbonate hemisphere — the whole difficulty
        pivot: [0, -0.0165, 0]
        animation: none
        # TOGGLEABLE (?dome=off). Not decoration: it is the only way to judge the optics
        # WITHOUT the veil, and the only way to prove the interior was modelled rather than
        # hidden behind a translucent surface. A sealed enclosure that nothing can look
        # inside is how an empty shell passes a gate.
        attachment:
          parent_socket: mount_base
          local_start: [0, -0.0165, 0]
          local_end:   [0, -0.0560, 0]
          length_confidence: med     # bubble ø and total height are both published
          contact_type: surface-contact
          overlap: 0.0008            # the bubble lip seats INTO the ring, never coplanar
          gap_tolerance: 0.0
      - name: ceiling_prop           # CONTEXT PROP, default OFF (?ceiling=on)
        pivot: [0, 0, 0]
        animation: none
        # Not part of the product. A dome floating in space is ORIENTATION-AMBIGUOUS — it
        # reads equally as a dome sitting on a table, which is the wrong object. A plain
        # ceiling tile plane resolves it and is toggleable so it can never be mistaken for
        # the asset. Same reasoning as the Stratix DIN-rail prop.

orientation:
  # THE FIRST ASSET IN THIS RUN THAT DOES NOT SIT ON A FLOOR OR A RAIL.
  # An indoor mini-dome is CEILING-MOUNTED: the flat base is up, against the ceiling, and
  # the bubble hangs DOWN. Modelling it bubble-up would produce a plausible, well-built,
  # WRONG object — the pose Axis uses for product photography and nobody uses for hardware.
  mounting: ceiling
  base_normal: [0, 1, 0]           # base plate faces UP into the ceiling
  optical_axis_default: [0, -0.927, 0.375]   # down and forward at the 22 deg default tilt
  consequence_for_camera: >
    Every critical feature is on the UNDERSIDE. The hero therefore needs a NEGATIVE
    elevation — see the camera block. Four previous assets were judged from above; this one
    cannot be, and an inherited positive elevation would frame the one face that carries
    nothing.

materials:                         # near-binary metalness; every entry: evidence + source + confidence
  - id: housing_white
    family: plastic                # moulded polycarbonate/ASA body and trim ring
    color: "#eceded"
    metalness: 0.0
    roughness: 0.45
    evidence: "Indoor Axis mini-domes are an off-white body. NOT RECORDED IN P1 — §4 documents form and dimensions and says nothing about colour. This hex is a family convention, not a measurement."
    source: estimated
    confidence: 0.55
    assumption: "off-white moulded plastic; neither the colour nor a code is registered in any P1 source — see open_items"
  - id: dome_clear
    family: plastic                # clear/lightly smoked polycarbonate bubble
    color: "#8a949c"               # SMOKED at LIGHTING-CAMERA, was #dfe6ea. A near-white
                                   #   bubble in E=1.715 contributes 1.342 linear and
                                   #   dominates the alpha blend: the matte black shroud
                                   #   behind it came through at 0.671 on screen, 76% of the
                                   #   white collar, so the optical cavity read as a LIGHT
                                   #   FITTING. Smoked it lands at 0.335 (38%). Transmission
                                   #   unchanged at 0.42.
    metalness: 0.0
    roughness: 0.06
    opacity: 0.42
    transparent: true
    evidence: "A fixed dome's bubble is optical-grade polycarbonate. The category forces a transparent bubble; the DEGREE of tint is not published for any specific unit."
    source: estimated
    confidence: 0.6
    assumption: >
      NO MeshPhysicalMaterial.transmission — it is unavailable under the headless SwiftShader
      renderer this project gates with, so the bubble is a MeshStandardMaterial with
      transparent+opacity and a low roughness for the specular highlight that sells glass.
      The 0.42 opacity is CHOSEN to keep the optics legible through it, not measured. It is
      a composition dial, and the surface pass owns it.
  - id: shroud_black
    family: plastic                # anti-reflection cone inside the bubble
    color: "#0b0c0e"
    metalness: 0.0
    roughness: 0.90
    evidence: "Every fixed dome carries a matte black internal shroud; without it the bubble reflects the body's own white interior back into the lens. Functionally forced by the optics."
    source: table
    confidence: 0.78
    assumption: "deep matte black, maximum roughness, no specular return"
  - id: lens_barrel
    family: plastic                # the module body on its tilt cradle
    color: "#17181a"
    metalness: 0.0
    roughness: 0.55
    evidence: "camera optical modules are black moulded assemblies"
    source: table
    confidence: 0.75
  - id: lens_glass
    family: plastic                # front element — dielectric, so metalness stays 0
    color: "#080b12"
    metalness: 0.0
    roughness: 0.08
    env_map_intensity: 1.10        # RAISED AT MATERIALS, per-material and deliberately:
                                   #   glass separates from the matte barrel behind it by
                                   #   REFLECTION, not albedo. Both are near-black
                                   #   dielectrics. This is the correct lever — raising
                                   #   metalness to get a highlight would be a lie about the
                                   #   material.
    evidence: "GLASS IS A DIELECTRIC. A lens element must not be given a metallic response to make it look shiny — the near-black colour plus very low roughness is what reads as glass."
    source: table
    confidence: 0.82
    assumption: "dark near-specular element; the highlight comes from roughness, never from metalness"
  - id: lens_ring
    family: bare-metal             # retaining ring around the front element
    color: "#a2a7ad"
    metalness: 0.9
    roughness: 0.35
    evidence: "lens retaining rings are machined or plated metal"
    source: table
    confidence: 0.75
  - id: status_led
    family: plastic                # single status indicator — EMISSIVE, tuned at lighting
    color: "#0a1410"
    metalness: 0.0
    roughness: 0.35
    emissive: "#2fd07a"            # ADDED AT MATERIALS
    emissive_intensity: 4.0        # CLOSED at LIGHTING-CAMERA (was 1.0). At 1.0 the LIT
                                   #   lamp rendered 0.620 against 0.879 for its own bezel —
                                   #   darker than the housing, which reads as OFF. ACES
                                   #   compression caps the gain: intensity 8 only reaches
                                   #   1.11x the collar, so 4.0 is the knee.
    evidence: "network cameras carry a status indicator. THE COLOUR AND POSITION ARE NOT SOURCED in P1; green is the near-universal 'operational' convention."
    source: estimated
    confidence: 0.6
    assumption: >
      green diffuser over an unlit dark body. The `color` above is the UNLIT diffuser and
      `emissive` is what makes it a lamp — an indicator that emits nothing is not an
      indicator, and the sibling asset shipped a hero whose LEDs rendered black while the
      state claimed power:on. NOTE that `emissiveIntensity > 0` does NOT prove emission:
      three.js defaults it to 1 while the emissive COLOUR defaults to black, so the obvious
      assertion passes over a dead lamp. The colour is what must be asserted.
  - id: axis_wordmark
    family: plastic                # printed brand mark on the trim ring
    color: "#1a1c1f"
    metalness: 0.0
    roughness: 0.5
    evidence: "OUI AC:CC:8E certifies Axis Communications as the manufacturer [CERT-a]. The WORDMARK is therefore defensible; NO MODEL NUMBER is printed, because none is known."
    source: estimated
    confidence: 0.7
    realised_as: >
      ARTWORK from the surface pass onward — a CanvasTexture drawn with this colour, which is
      what a printed mark actually is. It is applied to ONE face of the plate (BoxGeometry
      group 3, -y) through a six-material array; a single mapped material would paint the
      artwork on all six faces, which is how the sibling asset grew a red thread down the
      edge of its logo plate.
      CORRECTION at SURFACE: an earlier version of this note said the material would show up
      as declared-but-not-instantiated in a traceability sweep and that this was not drift.
      THAT IS NO LONGER TRUE and the note would now excuse real drift — the sweep walks
      material ARRAYS and matches clones by id prefix, so `axis_wordmark_face` is found and
      the material is expected to appear as instantiated like any other.
  - id: ceiling_prop_tile
    family: plastic                # context prop, default OFF
    color: "#bcbeba"               # DARKENED AT MATERIALS from #d8d9d5: the white body
                                   #   separated from the white ceiling by only 18% Weber
                                   #   contrast. The prop exists to clarify the mounting,
                                   #   not to camouflage the subject into it — so the
                                   #   SCENERY moves, never the product.
    metalness: 0.0
    roughness: 0.85
    evidence: "generic suspended-ceiling tile; a neutral plane, deliberately featureless so it cannot be read as part of the product"
    source: estimated
    confidence: 0.6

critical_features:                 # 5 gates (hard max) — each fails a pass ALONE
  - id: ceiling-dome-form
    desc: "Reads as a CEILING-MOUNTED mini-dome: a flat ~101 mm base plate held against a ceiling with a smooth ~79 mm bubble hanging BELOW it, total drop ~56 mm. A lazy model builds it bubble-up like a product photo, or gives it a box body — either is an immediate fail, because a camera mounted the wrong way round is the wrong object."
    threshold: 0.72
  - id: clear-bubble-reveals-optics
    desc: "The bubble is genuinely TRANSPARENT and the optics are legible THROUGH it — not a milky cap, not an opaque lid, not an empty shell. Proving this is the point of the ?dome=off state: the interior must exist and must be visible with the bubble on. A dome you cannot see into is indistinguishable from a smoke detector."
    threshold: 0.72
  - id: tilted-lens-module
    desc: "A distinct lens assembly on a cradle inside the bubble, OFF-AXIS and tilted (~22 deg default), with a dark front element and a retaining ring. The tilt is the identity: a lens pointing straight down at the exact centre reads as a light fitting or a detector. A lazy model puts a flat black circle at the pole."
    threshold: 0.72
  - id: black-inner-shroud
    desc: "A matte black cone fills the bubble's interior around the optics, so light passing through the bubble is absorbed rather than bouncing off a white inner body. This is what makes the interior read as an OPTICAL CAVITY. Without it the dome glows from the inside and looks like a lamp."
    threshold: 0.70
  - id: mount-trim-ring
    desc: "A visible trim ring at the base, larger than the bubble (101 vs 79 mm), seating flush against the mounting plane — the collar that covers the ceiling cutout. A lazy model runs the bubble straight into the ceiling with no ring, which removes the only cue that this is an installed device."
    threshold: 0.70

important_features:                # optional, max 3 — reviewed AVERAGE >= 0.65
  - id: axis-wordmark-no-model
    desc: "The AXIS wordmark printed on the trim ring, and NO model number anywhere — the manufacturer is evidenced by the OUI, the model is not evidenced at all."
  - id: status-indicator
    desc: "A small status LED on the base, reading as an indicator rather than a printed dot."

quality_contract:
  global_min: 0.75
  perf_budget:                     # small subject, but CURVED — segment counts, not part counts
    draws: 120
    tris: 250000
  # The budget shape differs from every previous asset on purpose. Four boxes spent their
  # triangles on PART COUNT; this one spends them on TESSELLATION. A dome with visible
  # faceting fails ceiling-dome-form no matter how many parts it has, so segments are the
  # thing to protect and the optimization pass must not reclaim them by decimating the
  # bubble. Instancing is irrelevant here — there is almost nothing repeated.

p6_comparison: spec-only           # references/ is empty; the site photographs are of the
                                   #   Panduit aisle and none shows this camera. Do NOT
                                   #   fabricate a reference-match.

camera:
  azimuth_deg: 35
  elevation_deg: -22               # NEGATIVE — THE FIRST IN THIS RUN, and not a preference.
                                   #   Every critical feature is on the UNDERSIDE of a
                                   #   ceiling-mounted device. A positive elevation frames
                                   #   the flat base plate, which carries nothing, and hides
                                   #   the bubble, the optics and the shroud behind it. The
                                   #   viewer of a real security camera looks UP at it; so
                                   #   must the hero.
  fov: 40                          # equipment hero, slightly wider than the Stratix's 38 to
                                   #   keep the trim ring's full circle inside the frame at
                                   #   a close working distance
  # FRAMING NOTE FOR THE LIGHTING-CAMERA PASS: solve the radius numerically over the 8 bbox
  #   corners of the BUILT subject, per capture state, and re-solve for the ?dome=off state
  #   as well — removing the bubble changes the bounding box, and a camera solved against
  #   one state and reused for another is how a subject gets cropped. Also verify containment
  #   BEFORE trusting any framing metric derived from that box.

lighting: house-rig                # WITH A DECLARED STRUCTURAL PROBLEM — read before P5a.
  # The house rig lights from ABOVE. This subject's features all face DOWN. That is not a
  # tuning gap, it is a geometric contradiction: a surface whose normal points at the floor
  # cannot catch a key light placed near the ceiling AT ANY POSITION along that arc, and no
  # amount of intensity fixes a max(0, N·L) that is zero.
  #
  # This run has now hit the "inherited rig answers a different subject" trap four times —
  # the PDU wasted up-facing light, the Stratix needed its key RAISED for a top-face
  # critical, the UPS needed it LOWERED off an empty top. Here the answer is different in
  # KIND: the rig needs a source BELOW the subject, which none of the four needed.
  #
  # Required at the lighting pass: add a bounce/fill from below (the light a real ceiling
  # camera receives off the floor), then verify with the analytic irradiance check —
  # E(N) = sum over lamps of max(0, N·L) · intensity · luma(colour) — that the DOWNWARD
  # normals actually receive comparable irradiance to the base plate. Measure it; do not
  # infer it from the render. And do NOT compensate by raising metalness on the shroud or
  # the barrel: both are matte dielectrics and a metallic shortcut would be a lie about the
  # material to paper over a lighting fault.

ui_controls:                       # threejs spec-panel toggles; each mirrors a URL state
  - "DOME ON-OFF"                  # ?dome=off — remove the bubble to judge the optics unveiled
  - "LENS TILT"                    # ?tilt=0|22|45 — the articulated pose; EVERY value captured
  - "CEILING PROP ON-OFF"          # ?ceiling=on — resolve the orientation reading in context
  - "AUTO-ROTATE"

# ── Unsourced values, recorded so a later pass can retire them with evidence ──────
open_items:
  - "MODEL IDENTITY: unknown and unknowable from the available evidence. AC:CC:8E gives the
     manufacturer only. Every dimension in this spec is the AXIS M3085-V's, used as a
     PLACEHOLDER for a generic indoor mini-dome. A site photograph would retire this in one
     step and is the single highest-value piece of evidence anyone could add to this asset."
  - "HEIGHT SPLIT (base 16.5 mm / bubble 39.5 mm) is DERIVED from the published total height
     and bubble diameter by assuming a TRUE HEMISPHERE. Only the 56 mm total and the 79 mm
     diameter are published. A shallower cap would move both numbers."
  - "BODY COLOUR: off-white is a family convention observed on the product line, NOT recorded
     in P1-DATASHEETS §4, which documents form and dimensions only. No code is published."
  - "BUBBLE TINT: RESOLVED TOWARD SMOKED at LIGHTING-CAMERA, and by measurement rather than
     taste — a near-white bubble washed the black optical cavity to 76% of the white collar,
     making the dome read as a light fitting. Still UNSOURCED: nothing publishes the tint of
     any specific unit, and clear vs smoked remains a real product difference. Opacity stays
     0.42, so transmission is unchanged."
  - "LENS MODULE DIMENSIONS AND TILT TRAVEL: the module's existence and orientability are
     forced by the product category; its 30 mm diameter, 14 mm element and 22 deg default
     tilt are sized to fit inside the bubble, not sourced."
  - "STATUS LED colour and position: unsourced. Green is a convention, not a datasheet."
  - "MOUNTING HARDWARE NOT MODELLED. Fixing screws are visible on real mini-dome trim rings,
     but P1 records neither their count, type nor position — so nothing is built, exactly as
     the UPS rear receptacles were left unbuilt rather than invented. Only what is
     functionally forced is modelled."
  - "WORDMARK POSITION on the trim ring is chosen to fit, not measured. Moved at SURFACE from
     r = 34.5 mm to a TANGENTIAL plate at r = 45 mm: the original straddled the bubble gasket
     at r = 39.9 mm, and nobody prints a mark across a rubber seal. Running along the arc also
     fits 18 mm of text in an annulus only 10.6 mm wide radially."
