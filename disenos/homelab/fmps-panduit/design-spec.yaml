# DesignSpec — homelab asset #6: PANDUIT FMPS TRANSMITTER CHASSIS (Fault Managed Power System)
# Authored at P2 (spec-only). See design3d/references/DESIGNSPEC.md for authoring rules.
# Evidence: disenos/homelab/P1-DATASHEETS.md §5 + §6 + P1-INTAKE.md (inventory).
#
# VARIANT DECLARED: PXTC1ARA, the Class 4 Transmitter Chassis. This is the modelable
# variant — P1 records its form factor, dimensions, weight and front-face inventory. The
# receivers and the cabling are a different product and are not in scope.
#
# ── WHAT FMPS ACTUALLY IS, because the acronym invites the wrong model ────────────
# Fault Managed Power System [CERT-web]: Class 4 power distribution (IEC TS 63049 /
# UL TR 63053) that converts AC into pulsed high-voltage DC delivered over multi-conductor
# copper to receivers up to 2 km away. 4.8-6 kW per chassis, SIL3. It is NOT an environmental
# sensor and NOT a SmartZone gateway — P1 says so explicitly, because the name suggests both.
#
# ── PROVENANCE WARNING, carried from P1 ───────────────────────────────────────────
# The dimensions are [CERT-a], NOT [CERT-doc]. Panduit's own installation PDF returned as
# binary and was not text-extractable, so the figures reach us through a distributor listing
# (nassaunationalcable.com). That is weaker evidence than the UPS's installation manual or
# the Stratix's product page, and every dimension below carries it.

design: fmps-panduit
asset_index: 6
track: threejs
mode: heavy                        # multi-asset homelab scene; this asset gated alone
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.01 m"

complexity:                        # pre-spec assessment — sum 13
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 2}
  tier: moderate
  # CALIBRATED AGAINST THE GATED SPECS OF THIS RUN rather than assigned by feel:
  #   components 2 — the front carries 9 module slots, 3 PSU bays, an RJ45 and an alarm
  #     connector. That is the Stratix's league (10 ports, 6 system LEDs, two terminal
  #     blocks, a button and an SD slot), which scored 2.
  #   repetition 2 — twelve repeated elements in two families. The PDU scored 3 with FORTY-TWO
  #     outlets; the Stratix scored 2 with ten ports. Twelve sits with the Stratix.
  #   action_readiness 2 — the PSU LEDs carry real published states (blue standby / green
  #     enabled), so there is a state axis to drive, as on the Axis.
  #   silhouette 1 — a 1U box is the simplest shape in the run, and saying otherwise to
  #     inflate a tier would be the same dishonesty as deflating one.
  # Sum 13 lands on the PDU's number, and the PDU gated as moderate.

environment:                       # P0 discovery OUTPUT — paths only
  overlays:
    handbook: null
    house_rules: null
    qa_tools: research/tools
    design_dir_root: disenos/homelab

references:                        # P1 evidence — no invented dimensions
  - source: "https://www.panduit.com/en/products/featured-products/panduit-fault-managed-power-system.html [CERT-web]"
    evidences: "FMPS = Fault Managed Power System; Class 4 pulsed HVDC over copper to receivers up to 2 km; 4.8-6 kW per chassis; SIL3; applications are small cells, IP cameras, DAS, remote access control"
  - source: "https://www.panduit.com/en/products/power-distribution-environmental-connectivity-hardware/fault-managed-power-systems/fault-managed-power-systems/pxtc1ara.html [CERT-web]"
    evidences: "PXTC1ARA Class 4 Transmitter Chassis: 1RU 19-inch rack-mount (2- or 4-post); 9 transmitter module slots; up to 3 power supply units; 1x RJ45 10/100Base-T for the Network Management Card; 1x remote-alarm dry-contact connector; per-PSU LED blue=standby / green=enabled plus a per-slot module LED"
  - source: "https://nassaunationalcable.com/products/transmitter-chassis-rack-mount-bracket-pxtc1ara [CERT-a]"
    evidences: "17.5 in width -> 445 mm; 1.7 in height -> 43 mm; 22 in depth -> 559 mm; base weight ~5.78 kg"
    suitability: conditional       # DISTRIBUTOR listing, not the manufacturer. It is the only
                                   #   dimensional source that was readable at all.
  - source: "https://www.panduit.com/content/dam/panduit/en/website/support/download-center/documents/panduit-fmps-hardware-installation-guidev3.pdf [CERT-doc]"
    evidences: "the authoritative dimensional source"
    suitability: unusable          # returned as BINARY and was not text-extractable. Recorded
                                   #   so nobody re-cites it as if it had been read.
  - source: "disenos/homelab/P1-DATASHEETS.md §5 and §6 (this session)"
    evidences: "explicit research verdict: 'sin datasheet legible — usar aproximacion de foto'; §6 gap table records the dimensions as distributor-sourced [CERT-a] and calls that acceptable for a 1U chassis, to be refined if the PDF becomes readable"

dimensions_real:                   # metric; 1 unit = 1 m. All for PXTC1ARA.
  body_w_m:  {value: 0.4450, confidence: med}    # 17.5 in — the CHASSIS, without ears
  height_m:  {value: 0.0430, confidence: med}    # 1.7 in — inside the 44.45 mm 1U envelope
  depth_m:   {value: 0.5590, confidence: med}    # 22 in
  mass_kg:   {value: 5.78,   confidence: med}

  # --- rack ears: DERIVED from a published standard, not invented -----------------
  # P1 records "1RU rack-mount, 19-inch (2- or 4-post)" but gives no flange span. EIA-310
  # fixes it: a 19-inch rack's mounting flanges span 482.6 mm, and a 445 mm body is exactly
  # the width that leaves 18.8 mm of flange per side. The ears are not a styling choice —
  # without them the unit cannot mount, and the sibling UPS carries the identical derivation
  # from the identical standard.
  ear_span_m: {value: 0.4826, confidence: high}  # EIA-310, a published standard
  ear_t_m:    {value: 0.0025, confidence: low}

  # --- front-face layout: INFERRED, and the inference is the weakest part of this spec ---
  # SOURCED: nine module slots, up to three PSUs, one RJ45, one alarm connector, per-slot and
  # per-PSU LEDs. NOT SOURCED: how any of it is arranged across 445 mm, how wide a slot is,
  # or which side the PSUs sit on. P1's own modelling note says "NMC approximately 1/9 of the
  # front width", which is the only proportional hint in the evidence and is used as the
  # anchor below. Everything downstream of these values carries confidence: low.
  #   9 slots x 30 mm = 270 · 3 PSU x 45 mm = 135 · NMC 30 · margins ~10  ->  445 exactly
  # That it closes is a consistency check, NOT a confirmation: several other splits also
  # close, and nothing in the evidence chooses between them.
  slot_count:   {value: 9,      confidence: high}   # published
  slot_w_m:     {value: 0.0300, confidence: low}
  slot_h_m:     {value: 0.0330, confidence: low}
  psu_count:    {value: 3,      confidence: high}   # published ("up to 3")
  psu_w_m:      {value: 0.0450, confidence: low}
  psu_h_m:      {value: 0.0330, confidence: low}
  nmc_w_m:      {value: 0.0300, confidence: low}    # ~1/9 of the front, per P1's own note
  rj45_w_m:     {value: 0.0159, confidence: med}    # standard RJ45 outline, not Panduit-specific
  rj45_h_m:     {value: 0.0135, confidence: med}
  led_dia_m:    {value: 0.0030, confidence: low}
  alarm_w_m:    {value: 0.0220, confidence: low}    # pluggable dry-contact terminal block

hierarchy:
  - name: chassis_root
    pivot: [0, 0, 0]
    children:
      - name: chassis_body         # the 1U shell
        pivot: [0, 0, 0]
        animation: none
      - name: rack_ears            # CRITICAL: 19-inch flanges, EIA-310 482.6 mm span
        # ADDED AT STRUCTURAL: two mounting holes per ear at the EIA-310 0.625 in vertical
        # pitch. A flange with no hole cannot take a screw, and taking a screw is the entire
        # claim this critical makes.
        pivot: [0, 0, 0]
        animation: none
        attachment:
          parent_socket: chassis_side
          local_start: [0.2225, 0, 0.2795]   # at the body's flank, front edge
          local_end:   [0.2413, 0, 0.2795]
          length_confidence: high
          contact_type: surface-contact
          overlap: 0.0015
          gap_tolerance: 0.0
      - name: module_bank          # 9 transmitter module slots
        pivot: [0, 0, 0.2795]
        animation: none
        # ADDED AT STRUCTURAL, all FUNCTIONALLY FORCED rather than itemised by the evidence:
        #   module_handle_0..8 — a hot-swap module has to come OUT; with no grip there is no
        #     way to withdraw it, so the handle is what makes a bay a bay rather than a
        #     rectangle drawn on a plate.
        #   bay_divider_0..7   — the chassis wall between bays. Without them the nine slots
        #     are nine faces on one continuous plate.
        # Neither invents a COUNT or a TYPE the evidence is silent about, which is the line
        # that separates this from the UPS rear receptacles (both unknown, nothing built).
      - name: psu_bank             # 3 power supply bays
        pivot: [0, 0, 0.2795]
        animation: none
        # ADDED AT STRUCTURAL: psu_handle_0..2 and psu_divider_0..1, same reasoning.
      - name: nmc_zone             # RJ45 + per-card LEDs + the dry-contact connector
        pivot: [0, 0, 0.2795]
        animation: none

orientation:
  mounting: rack
  front_normal: [0, 0, 1]
  consequence_for_camera: >
    EVERY critical feature is on the FRONT face, and the front is 445 x 43 mm while the top
    is 445 x 559 mm — THIRTEEN TIMES the area. See the camera block; this is the sibling
    UPS's framing problem taken to an extreme, and it is being solved before the blockout
    rather than discovered at its gate.

materials:                         # near-binary metalness; every entry: evidence + source + confidence
  - id: chassis_black
    family: painted-metal
    color: "#41454b"
    metalness: 0.0
    roughness: 0.55
    evidence: "Panduit FMPS chassis appear as a dark powder-coated rack enclosure. NO RAL or Pantone is published, and P1 records no colour at all — the hex is chosen, not measured. SOLVED at MATERIALS from the exposure target: the blockout value (#26282c) rendered 0.042 of 1.0 through the tone curve, on the floor of the curve where nothing reads. #41454b is charcoal, still 'dark', and lands 0.189."
    source: estimated
    confidence: 0.6
    assumption: "matte dark coating over steel; the coating makes it a DIELECTRIC despite being metal underneath — see open_items"
  - id: ear_steel
    family: bare-metal             # the 19-inch mounting flanges
    color: "#a8adb4"
    metalness: 0.9
    roughness: 0.42
    evidence: "rack ears are plated or brushed steel; the sibling UPS uses the same finish for the same part"
    source: table
    confidence: 0.8
  - id: module_face
    family: painted-metal          # a transmitter module's own front plate
    color: "#5f656e"
    metalness: 0.0
    roughness: 0.50
    evidence: "hot-swap module faces are coated metal, slightly lighter than the chassis so the bays read as separate parts"
    source: estimated
    confidence: 0.65
  - id: slot_cavity
    family: plastic                # the recess behind a module face — what makes a bay read as a bay
    color: "#0b0c0e"
    metalness: 0.0
    roughness: 0.80
    evidence: "an unlit recess reads near-black; this is what separates a real bay from a painted rectangle (critical feature nine-module-slots)"
    source: estimated
    confidence: 0.7
    assumption: "unlit cavity read, high roughness, no specular return"
  - id: psu_face
    family: painted-metal
    color: "#4e535a"
    metalness: 0.0
    roughness: 0.52
    evidence: "PSU faceplates are coated metal; distinguished from module faces so the two banks do not merge"
    source: estimated
    confidence: 0.65
  - id: led_blue
    family: plastic                # PSU standby — EMISSIVE
    color: "#0a1014"
    metalness: 0.0
    roughness: 0.35
    emissive: "#3aa0ff"
    emissive_intensity: 2.0
    evidence: "P1-DATASHEETS §5: per-PSU LED, blue = standby [CERT-web]"
    source: estimated
    confidence: 0.7
    assumption: >
      blue diffuser over an unlit dark body. `color` is the UNLIT lens and `emissive` is what
      makes it a lamp. Intensity seeded at 4.0 from the sibling Axis measurement — at 1.0 a
      LIT indicator rendered DARKER than the housing around it once ACES tone mapping was
      applied. To be re-measured against THIS asset's rig and housing at the lighting pass.
  - id: led_green
    family: plastic                # PSU enabled, and per-slot module LED — EMISSIVE
    color: "#0a1410"
    metalness: 0.0
    roughness: 0.35
    emissive: "#2fd07a"
    emissive_intensity: 2.0
    evidence: "P1-DATASHEETS §5: per-PSU LED green = enabled, plus a per-slot module LED [CERT-web]"
    source: estimated
    confidence: 0.7
    assumption: "green diffuser over an unlit dark body; same intensity note as led_blue"
  - id: port_shield
    family: bare-metal             # shielded RJ45 cage
    color: "#9aa0a8"
    metalness: 0.9
    roughness: 0.40
    evidence: "shielded RJ45 cages are nickel-plated steel — bare metal, near-1 metalness"
    source: table
    confidence: 0.82
  - id: port_cavity
    family: plastic
    color: "#0c0d10"
    metalness: 0.0
    roughness: 0.72
    evidence: "jack cavities read near-black; the same material the sibling Stratix uses for the same feature"
    source: estimated
    confidence: 0.75
  - id: terminal_block
    family: plastic                # pluggable dry-contact connector
    color: "#2a2c30"
    metalness: 0.0
    roughness: 0.50
    evidence: "P1 confirms a remote-alarm connector exists; pluggable terminal blocks are moulded thermoplastic. THE COLOUR IS UNSOURCED."
    source: estimated
    confidence: 0.65
  - id: panduit_livery
    family: plastic                # printed manufacturer mark
    color: "#e8e8e4"
    metalness: 0.0
    roughness: 0.50
    evidence: "the manufacturer is established for this catalogue number [CERT-web]"
    source: estimated
    confidence: 0.75
    realised_as: >
      ARTWORK from the surface pass onward — a CanvasTexture drawn with this colour, applied
      to group 4 (+z, the front of a rack chassis) through a six-material array. A single
      mapped material on a BoxGeometry paints all six groups, which is how a sibling asset
      grew a red thread down the edge of its logo plate. The traceability sweep walks material
      ARRAYS and matches clones by id prefix, so `panduit_livery_face` is found and this
      material is expected to appear as instantiated like any other.
    strings: >
      PANDUIT + PXTC1ARA only. The catalogue number IS printed here, unlike the sibling Axis
      where the model was unknowable from an OUI — P1 names this variant explicitly, and a
      part number that is evidenced is exactly what a rack chassis carries on its face.
      NOT printed: any electrical rating. P1 does record "4.8-6 kW per chassis" for the FMPS
      system, so the figure EXISTS in the research — but that is not the same as it being
      SILKSCREENED HERE. Printing a rating is a claim about what the LABEL says, and nothing
      in the evidence describes this unit's label. Also absent: bay numbering, because the
      existence of a numbering convention is not knowledge of WHICH convention.

critical_features:                 # 5 gates (hard max) — each fails a pass ALONE
  - id: rack-1u-chassis-ears
    desc: "Reads as a 1U 19-inch rack chassis: a 445 x 43 x 559 mm body carrying mounting flanges that span 482.6 mm, so it is unmistakably rack-mounted and unmistakably ONE rack unit tall. A lazy model makes it 2U, drops the ears, or gives it a depth it does not have — 559 mm is more than TWELVE times its own height and that proportion is the silhouette."
    threshold: 0.72
  - id: nine-module-slots
    desc: "Nine transmitter module bays across the front, each a RECESSED opening with a visible module face and its own status LED, at a regular pitch. A lazy model paints nine rectangles on a flat panel or loses count — the number nine is published and is checkable."
    threshold: 0.72
  - id: three-psu-bays
    desc: "Three power-supply bays, visually distinct from the module bank (different face width and shade), each carrying its own indicator. This is what makes it read as a redundant-power CHASSIS rather than a patch panel."
    threshold: 0.70
  - id: nmc-rj45-and-alarm
    desc: "A real RJ45 opening for the Network Management Card — a dark cavity with a visible keyway and shielded cage, not a printed rectangle — beside a pluggable dry-contact alarm connector."
    threshold: 0.70
  - id: panduit-livery-no-ratings
    desc: "The Panduit manufacturer mark on the front panel, and NO electrical ratings printed anywhere. P1 carries no voltage, current, wattage or PoE figure for this unit; a plausible wrong rating silkscreened at 12 px is worse than a missing line."
    threshold: 0.70

important_features:                # optional, max 3 — reviewed AVERAGE >= 0.65
  - id: per-slot-status-leds
    desc: "Each module bay carries its own LED, so the bank reads as monitored rather than as blank plates."
  - id: psu-state-colours
    desc: "PSU indicators show the published state pair — blue standby, green enabled — rather than one generic colour."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 200
    tris: 350000
  # Sized like the PDU rather than the Axis: the cost here is PART COUNT (nine bays, three
  # PSUs, twelve LEDs, a jack) and not tessellation. Almost nothing on this subject is curved.

# p6_comparison: SPEC-ONLY. references/ is empty and the site photographs are of the Panduit
#   aisle rather than this chassis. Do NOT fabricate a reference-match.
p6_comparison: spec-only

camera:
  azimuth_deg: 26
  elevation_deg: 3                 # THE LOWEST IN THE RUN, and solved before the blockout.
  fov: 40
  # SOLVED ANALYTICALLY AT P2, because this is the sibling UPS's framing failure taken to an
  # extreme and there is no reason to rediscover it at a gate.
  #
  # Every critical is on the FRONT face. Front area 20752 mm^2; TOP area 269773 mm^2 — the
  # featureless top is THIRTEEN TIMES the face that carries the whole identity. Projected
  # face shares over the built envelope:
  #     az 26 / el 8  ->  front 28%  top 57%  side 16%   (the top dominates outright)
  #     az 26 / el 5  ->  front 35%  top 45%  side 20%   (the top still leads)
  #     az 26 / el 3  ->  front 43%  top 33%  side 24%   (the front leads, side keeps depth)
  # The UPS needed elevation 8 for a top face 5x its front. At 13x, 5 is not enough and 3 is
  # the working answer. RE-SOLVE against the BUILT bounding box at the lighting pass — the
  # UPS's angle was tuned against a box inflated by a floating part, and the lesson is that a
  # framing metric is only as good as the containment guard underneath it.

lighting: house-rig                # WITH THE SAME DECLARED PROBLEM AS THE UPS, worse.
  # The top face is 13x the front and carries NOTHING. Light spent on up-facing normals is
  # light not spent on the five criticals. The rig's key must rake the FRONT panel rather
  # than wash the lid, and the analytic irradiance check must show downward-of-horizontal and
  # front-facing normals ahead of up-facing ones.
  #
  # AND JUDGE IT THROUGH THE TONE CURVE. On the sibling Axis, two defects were invisible in
  # linear luminance and obvious once ACES at the renderer's exposure was applied — a LIT
  # indicator rendering darker than its own bezel, and a translucent part washing out the
  # feature behind it. This asset has twelve emissive indicators; they get measured on screen,
  # not in linear.

ui_controls:                       # threejs spec-panel toggles; each mirrors a URL state
  - "PSU STATE"                    # ?psu=standby|enabled — blue/green, the published state pair
  - "MODULES POPULATED"            # ?modules=all|partial — occupied bays vs blanking plates
  - "FRONT DETAIL VIEW"            # ?cam=front-detail — close on the NMC and the bay pitch
  - "AUTO-ROTATE"

# ── Unsourced values, recorded so a later pass can retire them with evidence ──────
open_items:
  - "DIMENSIONS ARE [CERT-a], NOT [CERT-doc]. Panduit's own installation PDF returned as
     binary and was not text-extractable, so 445 x 43 x 559 mm reaches us through a
     distributor listing. This is weaker evidence than any other asset in this run had, and a
     readable manufacturer drawing would retire it in one step."
  - "FRONT-FACE LAYOUT is the weakest inference in this spec. Sourced: nine module slots,
     three PSUs, an RJ45, an alarm connector, per-slot and per-PSU LEDs. NOT sourced: how any
     of it is arranged across 445 mm, how wide a slot is, or which side the PSUs sit on. The
     split below closes to 445 mm exactly, but SEVERAL OTHER SPLITS ALSO CLOSE and nothing in
     the evidence chooses between them. A product photograph would settle it."
  - "CHASSIS COLOUR entirely unsourced. P1 records form factor, dimensions, weight and front
     inventory, and says nothing about finish."
  - "TERMINAL BLOCK COLOUR unsourced — P1 confirms the connector exists and what it does."
  - "LED PHYSICAL SIZE AND POSITION inferred. The STATES are published (blue standby, green
     enabled, per-slot module LED); their geometry is not."
  - "NO DISPLAY is modelled, and that is a SOURCED absence: P1 records the chassis as managed
     via the NMC web interface and SNMP, with no local display. Recorded here so a later pass
     does not add one for visual interest."
  - "EMISSIVE INTENSITY RE-MEASURED at MATERIALS and closed at 2.0, not the 4.0 seeded from
     the Axis. The two disagree because the Axis lamp sat on a WHITE collar (0.879) while this
     one sits on charcoal bay faces (0.29-0.43), so it clears its surround at intensity 1. The
     binding constraint here is CHROMA, not luminance: tone mapping is per-channel, so an
     over-driven emissive washes toward white — 87%/92% saturation at 2, falling to 72%/82%
     at 4. `psu-state-colours` is a critical about HUE, so that trade is one-sided."
