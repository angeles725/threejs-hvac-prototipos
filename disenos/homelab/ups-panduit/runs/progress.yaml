  p6-final:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "verify the finished asset against its own contract; capture is the orchestrator's"
    p6_comparison: spec-only
    references_on_disk: none        # references/ is empty — a reference-match would be fabricated

    envelope:
      built:   "0.4400 x 0.1310 x 0.6665 m"
      spec:    "0.44 x 0.131 x 0.6665 m"
      verdict: "exact on all three axes"

    mass_drift_explained:            # the full subject box is larger than the chassis, on purpose
      full_subject: "0.4826 x 0.1310 x 0.6802"
      x_plus_42.6mm: "the 19-inch rack ears — a CRITICAL feature, not drift"
      y_plus_0mm:    "nothing exceeds the 3U height in either direction"
      z_plus_13.7mm: "the 6 mm front bezel and the seated rear service panel, both by design"

    criticals_backed_by_geometry:
      ups-3u-rack-chassis-ears:     "3/3 parts present"
      ups-front-panel-touchdisplay: "3/3 parts present"
      ups-power-button-led-array:   "4/4 parts present"
      ups-ventilation-grilles:      "5/5 parts present"

    spec_promises:
      materials: "7 declared · 0 drifted · all actually rendered"
      screen_text: "PANDUIT / INPUT / OUTPUT / BATTERY — no numerals, no units, no fabricated readings"
      guard_errors: 0

    defect_found_and_fixed_at_p6:
      what: >
        The third front ventilation slot was hanging 18.7 mm BELOW the chassis floor,
        floating in mid-air. Three 18 mm slots at a 22 mm pitch need ~66 mm of face and the
        space under the display block is 32.5 mm, so the third one never fit. It has been
        there since the BLOCKOUT and survived six passes and three gates.
      why_nothing_caught_it: >
        verifyVentsAreRecessed only measured depth in z — a slot at the right depth in the
        wrong place is still recessed. Every framing and containment check boxed the WHOLE
        subject without ever asking whether that box describes one object. A detached part
        simply enlarged the box and was judged as part of the subject.
      fix: "VENT_H 0.018 -> 0.009, VENT_PITCH 0.0105, VENT_Y_START 0.028 — three slots that fit"
      new_guard: >
        verifyPartsAreOnTheDevice(root) — every named part must lie inside the chassis
        envelope. Y is absolute (a 3U unit that pokes out fouls its neighbours in a rack),
        X allows exactly one exception (the rack ears), Z is unchecked because the bezel and
        service panel protrude by design. A negative control confirms it fires when the
        floating slot is reintroduced.

    camera_changed_at_p6:            # FLAGGED FOR THE ORCHESTRATOR — read this before re-judging
      change: "elevation_deg 10 -> 8 (azimuth unchanged at 24); rear view 204/10 -> 204/8"
      cause: >
        Not a preference. The 10 was chosen by measuring each face's projected share of the
        silhouette, and that measurement uses the SUBJECT BOUNDING BOX — which was 18.7 mm
        too tall because of the floating vent slot. Removing the stray part shrank the box
        from 0.1497 to 0.1310 in y, and the same angle then reported front 38% / top 38%:
        the featureless top face getting equal billing with the face carrying all four
        criticals. The previously reported "front 40%" was inflated by the defect.
      after: "front 41% · top 33% · side 26% — front leads again, side keeps the 666 mm depth read"
      implication: >
        Every earlier UPS framing judgement was made against a subject box that included a
        part which should not exist. The hero angle moves by 2 degrees as a consequence.

    open_items:
      rear_receptacles: >
        STILL UNBUILT AND UNSOURCED, deliberately. P1-DATASHEETS §2 covers this unit's form
        factor, dimensions, rating and FRONT face and says nothing about the rear layout.
        rear_panel renders only what is functionally forced: rear_service_panel,
        rear_fan_bore, rear_fan_ring. A specific receptacle array would be a claim, not a
        model.

