# DesignSpec — homelab asset #3: Panduit SmartZone UPS (3U, 5 kVA)
# Authored at P2 (spec-only). See design3d/references/DESIGNSPEC.md for authoring rules.
# Evidence: disenos/homelab/P1-DATASHEETS.md §2 (Panduit UPS SmartZone — CERT-doc + CERT-web).

design: ups-panduit
track: threejs
mode: heavy                        # multi-asset homelab scene; gated alone
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.1 m"

complexity:                        # pre-spec assessment — sum 9 -> moderate
  scores: {silhouette: 1, components: 1, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 0, action_readiness: 1}
  tier: moderate

environment:
  overlays:
    handbook: null
    house_rules: null
    qa_tools: research/tools
    design_dir_root: disenos/homelab/ups-panduit

references:
  - source: "disenos/homelab/P1-DATASHEETS.md §2 (Panduit UPS SmartZone Installation Manual V2.3)"
    evidences: "3U (5–10 kVA): 440 × 666.5 × 131 mm (W×D×H). Front: 3.5-inch color touch screen (rotatable), Power ON/OFF button + LED indicators."
    suitability: pass
  - source: "panduit.com SmartZone UPS product page [CERT-web]"
    evidences: "Online double conversion, single-phase; dark-gray/black bezel inferred from product renders. Rack/Tower 3U form factor confirmed."
    suitability: conditional   # bezel color is [INFER]; proceed with dark-gray assumption

declared_variant: "U05N11V — 5 kVA / 5 kW, VRLA, single-phase 120 V, 3U rack/tower"

dimensions_real:                   # metric; 1 unit = 1 m. Source: CERT-doc (Install Manual V2.3)
  width_m:   {value: 0.440, confidence: high}   # 440 mm — standard 19" rack width [CERT-doc]
  height_m:  {value: 0.131, confidence: high}   # 131 mm ≈ 3U (3 × 44.45 = 133 mm slot); actual measured [CERT-doc]
  depth_m:   {value: 0.6665, confidence: high}  # 666.5 mm — VRLA 3U battery bay [CERT-doc]
  rack_ear_w_m:      {value: 0.0213, confidence: med}  # [INFER] (482.6 mm 19" face – 440 mm chassis) / 2 ≈ 21.3 mm per side
  front_panel_w_m:   {value: 0.398, confidence: med}   # [INFER] front face within ears: 440 – 2×21 ≈ 398 mm
  lcd_diagonal_in:   {value: 3.5,   confidence: high}  # 3.5-inch color touch screen [CERT-doc]
  lcd_w_m:           {value: 0.077, confidence: med}   # [INFER] 3.5" landscape ~77×46 mm active area
  lcd_h_m:           {value: 0.046, confidence: med}   # [INFER] derived from 3.5" diagonal, 5:3 aspect

hierarchy:
  - name: root
    children:
      - name: ups_chassis            # main rectangular body: painted-steel box
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: rack_ears          # left + right 19" mounting tab brackets (static, bolted)
            pivot: [0, 0, 0]
            animation: none
          - name: front_panel        # entire front face assembly
            pivot: [0, 0, 0]
            animation: none
            children:
              - name: touch_display  # 3.5" color touch screen centered upper-left on faceplate
                pivot: [0, 0, 0]
                animation: none
              - name: power_button   # power ON/OFF button, right of display
                pivot: [0, 0, 0]
                animation: none
              - name: led_indicators # bank of status LEDs (online/battery/fault/load)
                pivot: [0, 0, 0]
                animation: none
              - name: vent_grille    # horizontal ventilation slots on lower front face
                pivot: [0, 0, 0]
                animation: none
          - name: side_vents         # left + right side ventilation grille arrays
            pivot: [0, 0, 0]
            animation: none
          - name: rear_panel         # fan exhaust grid + IEC outlets (not visible from hero)
            pivot: [0, 0, 0]
            animation: none

# No attachment blocks: no cylinder/tube/curve appendages; rack ears and front panel
# are flush-mounted stamped/molded parts, not cantilevered appendages. (DESIGNSPEC.md rule 4)

materials:
  - id: chassis_steel
    slot: ups_chassis
    color: "#1c1d22"                 # dark charcoal painted-steel body
    metalness: 0.0                   # near-binary: powder-coat dielectric
    roughness: 0.55
    evidence: "Panduit.com renders show dark gray/charcoal UPS body [INFER from product images]; typical powder-coat painted steel for rack-mount power equipment"
    source: estimated
    confidence: 0.72

  - id: front_bezel
    slot: front_panel
    color: "#101115"                 # matte black ABS faceplate
    metalness: 0.0
    roughness: 0.65
    evidence: "Typical rack UPS front: molded ABS bezel, dark/black; SmartZone renders show dark faceplate [INFER-web]"
    source: estimated
    confidence: 0.72

  - id: lcd_glass
    slot: touch_display
    color: "#07090f"                 # dark LCD panel (off/standby state)
    metalness: 0.0
    roughness: 0.05                  # glass surface
    evidence: "3.5-inch color touch screen; typical TFT glass face, smooth, near-specular [INFER]"
    source: estimated
    confidence: 0.70

  - id: rack_ears_metal
    slot: rack_ears
    color: "#8a8e95"                 # bare galvanized/zinc stamped steel
    metalness: 0.90                  # near-binary: unpainted stamped steel
    roughness: 0.42
    evidence: "19\" mounting ears are typically bare zinc-plated stamped steel [INFER from EIA-310 practice]"
    source: estimated
    confidence: 0.72

  - id: power_button_plastic
    slot: power_button
    color: "#141519"                 # dark ABS button cap
    metalness: 0.0
    roughness: 0.55
    evidence: "Standard rack UPS power button: molded ABS plastic cap, dark [INFER]"
    source: estimated
    confidence: 0.70

  # ADDED (P5a materials, 2026-08-15). This material was introduced by the STRUCTURAL pass
  # and existed in code without a spec entry for one whole pass — contract drift I created
  # by not running a traceability sweep before shipping. Declared now, with its evidence.
  #
  # It is the interior seen through every ventilation slot, front and side. The critical
  # feature calls for slots, and a slot without a dark throat is a darker bar: this
  # material is what makes an opening read as an opening.
  - id: vent_cavity
    family: plastic
    color: "#0b0c0e"
    metalness: 0.0
    roughness: 0.78
    evidence: "interior of the ventilation openings described by critical feature ups-ventilation-grilles; an unlit enclosure interior reads near-black"
    source: estimated
    confidence: 0.75
    assumption: "unlit interior, high roughness, no specular return"

  - id: led_status
    slot: led_indicators
    color: "#060810"                 # unlit LED body
    metalness: 0.0
    roughness: 0.45
    evidence: "Status LEDs: small diffuse plastic lenses; green when online (normal operation) [INFER from product family]"
    source: estimated
    confidence: 0.70

critical_features:
  - id: ups-3u-rack-chassis-ears
    desc: "Reads as a 3U rack-mount UPS chassis (440×666×131 mm): horizontal box narrower than it is deep, with visible 19\" mounting ears protruding ~21 mm on each side. Chassis is 131 mm tall — reads as 3U (≈ 3 × 44 mm), NOT a 1U or 2U appliance. A lazy blockout omits the ears or uses 1U proportions."
    threshold: 0.72
  - id: ups-front-panel-touchdisplay
    desc: "Front face shows a 3.5-inch color touch-screen display as its dominant panel element — a landscape-format rectangle with a glass-smooth face, centered or offset-left on the bezel, visually distinct from the surrounding matte faceplate. Must NOT read as a mere slit or slot."
    threshold: 0.75
  - id: ups-power-button-led-array
    desc: "A distinct power ON/OFF button and a row/column of status LED indicators are visible on the front faceplate beside the display. LEDs read as individual emissive dots (not a single strip), button reads as a discrete recessed cap. Together they communicate 'rack UPS control panel'."
    threshold: 0.72
  - id: ups-ventilation-grilles
    desc: "Horizontal ventilation slots or perforated grille area is visible on the lower front face and/or side faces — communicating active thermal management for a 5-kVA online-conversion power device. Must NOT read as a sealed smooth box."
    threshold: 0.70

important_features:
  - id: ups-depth-proportion
    desc: "Device reads as deep (666 mm ≈ 1.5× width), consistent with a VRLA battery bay behind the power module — not a shallow 1U slab."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 250
    tris: 400000

p6_comparison: spec-only   # no reference photos on disk; per GATES.md do NOT fake reference-match

# AMENDED after blockout attempt 1 FAILED on framing (orchestrator-directed, 2026-08-15).
# `r_m` HAS BEEN STRUCK, not corrected. A camera radius is a property of the geometry that
# gets built, not a value a spec can declare: this one was computed from the 440 x 131 mm
# front face while the unit is 666 mm DEEP, so it framed roughly a third of the real
# 0.4826 x 0.1485 x 0.6805 m subject and cropped it. The radius is now solved numerically
# against the built bounding box at runtime (src/scene/runtime.mjs solveRadius), which
# cannot drift from the model the way a written constant can.
#
# ANGLES amended too, on measurement rather than taste. All four critical features involve
# the FRONT face, but at 666 mm deep the TOP face has five times its area — at the declared
# az 35 / el 20 the top took 51% of the projected silhouette and the front only 25%.
# Lowering elevation alone is not enough: at az 35 / el 12 the top still leads 37% to 31%.
# At az 24 / el 10 the front leads with 40%, top 35%, side 25% — the criticals win the
# frame while the side still carries the depth read that makes this a deep rack UPS.
camera:
  azimuth_deg: 24                  # was 35
  elevation_deg: 8                 # was 20, then 10
  # AMENDED AGAIN at P6. The 10 was measured against a subject bounding box that was
  # 18.7 mm too tall, because a ventilation slot was hanging below the chassis in mid-air
  # since the blockout. With that fixed the same angle put the featureless TOP face level
  # with the front face that carries all four criticals (38% each). At 8 the front leads
  # again with 41% against 33%, and the side keeps 26% for the 666 mm depth read.
  fov: 40
  radius: solved-at-runtime        # was r_m: 0.8 — see above

lighting: house-rig          # horizontal appliance: key from right-front; top fill for top face

ui_controls:
  - id: power
    label: "POWER STATE ON/OFF"    # toggle LCD + LED emissive (on/off)
    values: [on, off]
    default: on
    url_param: power
  - id: autorotate
    label: "AUTO-ROTATE"
    values: [yes, no]
    default: no
    url_param: autorotate
