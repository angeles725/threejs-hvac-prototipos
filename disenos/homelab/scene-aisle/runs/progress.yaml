# Ladder progress — homelab asset #7: SCENE ASSEMBLY (Panduit experience-centre aisle)
# SINGLE WRITER. Written only by the builder session (ayudante). The orchestrator records its
# verdicts by messaging the builder, never by editing here — two writers on one YAML is how a
# duplicate key silently swallowed a judged pass on the PDU.

design: scene-aisle
asset_index: 7
variant: >
  The composition, not a device. SIX 19-inch cabinets — three a side, facing each other across
  a 2 m aisle inside an office corridor — one of them populated with the real modelled
  equipment, the Axis on the ceiling above. Its subject is the RELATIONSHIP between six assets
  that already exist and are already gated.
  (Authored first as "three in a row" from a written description; the photographs showed two
  facing rows. See spec-reauthored below.)

ownership:
  writer: "ayudante (builder session)"
  note: "orchestrator three-js-46 owns the QA server, all captures and all gates; the builder runs no server and no capture"

spec:
  status: authored · P3 passed · re-authored reference-backed
  path: design-spec.yaml
  self_check: >
    Headless self-check PASS at authoring time. YAML parses with no key swallowed. The
    MOUNTING ARITHMETIC — the part that is not inferred — holds: 1U is the EIA-310 44.45 mm;
    the 131 mm UPS fits its 3U with 2.4 mm slack and the 43 mm FMPS its 1U with 1.5 mm; the
    two do not overlap (UPS U8-U11, FMPS U12-U13) and both sit inside the 42U rail; the rack
    pitch clears the cabinet body; the aisle is longer than its row; the ceiling clears the
    measured 2.076 m cabinet. Contract sanity: 5 criticals, 2 importants, near-binary
    metalness, evidence+source+confidence on all 7 materials, every emissive declares a
    COLOUR, and NO device material is redeclared here. p6_comparison was spec-only at
    authoring and is now reference-match — see spec-reauthored.

passes:
  spec: {status: authored, date: 2026-08-16}
  gate-p3:
    status: passed
    date: 2026-08-16
    judged_by: "orchestrator session three-js-46, inline"
    verdict: "spec validates clean; 7 near-binary environment materials with provenance; 5 composition/context criticals; no device material redeclared; measured budget 1200/200k; mounting arithmetic verified"
    tier_ratified: "complex at sum 16 — hierarchy 3 justified as the only asset nesting other complete assets"
  spec-reauthored:
    status: done
    date: 2026-08-16
    why: >
      The eight site photographs landed on disk immediately after the gate, so the composition
      was re-authored against them and p6_comparison flipped from spec-only to a REAL
      reference-match. The images were read DIRECTLY, not taken from the manifest summary.
    what_the_photographs_corrected: >
      Six things, every one of which the written description had conveyed accurately in words
      while building the wrong picture:
        - cabinets stand on BOTH SIDES of the aisle, not in a single row
        - the aisle is ~2 m face to face, not the 3.6 m inferred
        - the ceiling deck is ~2.7 m, not 2.9
        - the floor is LIGHT grey-beige plank, not the warm brown that "wood-look" suggested
        - LED edge-strips read predominantly BLUE, with green on some frames
        - the PDU pair is mounted SIDE BY SIDE in the cabinet's interior plane, revealed when
          the front door opens — not on opposite rear posts
    the_lesson: >
      A description can be accurate and still mislead. Every one of those values was authored
      in good faith from words that were not wrong; the picture they built was. That is the
      argument for reference-backed authoring, and it is why both states are kept in the spec
      rather than the inferred one being overwritten.
  blockout:
    status: attempt 2 — corrected after a FAIL, awaiting capture + judge
    attempt_1: "FAILED at 0.55 — not for the assembly, which was verified, but because two criticals could not be SEEN"

    what_the_gate_caught_and_my_checks_did_not:
      hero_rack_camera_aimed_out_of_the_building: >
        ?cam=hero-rack rendered a flat grey plane. Diagnosed: the solver used the SAME framing
        subject for both views — all six cabinets — so the detail view backed off far enough to
        contain the whole row, put the eye at x=5.30 when the corridor ends at 2.44, and landed
        its centre pixel on the exterior wall. A view is defined by what it must SHOW, not by
        the scene it happens to live in.
      office_context_behind_the_lens: >
        The aisle camera sat at azimuth 12, which placed it at the LOUNGE end looking the other
        way: the lounge was behind the camera (dot -0.89) and the frame ended on a blank wall.
        Corrected to 192 — standing at the closed end looking toward the glass door, which is
        the viewpoint both site photographs are taken from.
      why_nothing_of_mine_saw_either: >
        Every check verified that the subject FIT THE FRAME. Not one asked what the frame
        SHOWED. Both cameras framed their bounding box perfectly while pointing at a wall.

    three_more_defects_found_while_fixing_those:
      fov_belongs_to_the_view: >
        The equipment stack is ~2 m tall and a 2 m corridor gives ~1 m of standoff. At fov 50
        the near corners need 2.7 m, which is inside the opposite cabinet — the solver found no
        radius, fell back to r=12 and put the eye through the far wall. Each view now carries
        its own fov: 50 for the aisle, 75 for the detail. A photographer in a narrow corridor
        reaches for a wide lens; the geometry left no other move.
      the_solver_could_walk_through_walls: >
        Nothing capped the radius, so "fit the subject" was allowed to place the camera
        outdoors. Detail views are now capped at 2.4 m.
      my_own_guard_had_the_same_bug_it_was_written_to_catch: >
        verifyCriticalsAreVisible first tested only whether a RAY REACHED each critical. It
        fired correctly on the hero view aimed through a wall and stayed SILENT on the aisle
        view aimed away from the lounge — because a ray to an object BEHIND the camera arrives
        perfectly well. Nothing was in the way; it was simply not in shot. REACHABILITY IS NOT
        FRAMING. The test now requires both: inside the frustum AND unobstructed.

    the_guard_this_attempt_contributes:
      name: verifyCriticalsAreVisible
      what: "for each declared critical, from the SOLVED eye of the view that must show it: in frustum AND not occluded, with transparent surfaces passed through"
      list_derived_from_the_contract: >
        The MUST_SHOW list is written from the declared criticals, not from what looked good.
        Writing it that way immediately removed two entries I had added by taste: the glass
        partition (transparent BY DESIGN — demanding its surface be visible asks a window to be
        opaque) and the ceiling daylight panels (real, photographed, and not a declared
        critical; they fall outside the aisle camera's upward field of view, and the honest
        response is to stop asserting what the contract never asked for rather than tilt the
        hero shot until a non-critical fits).
      proven: >
        NEGATIVE CONTROL against BOTH original defects. Restoring azimuth 12 reports the lounge
        OUT OF FRAME; restoring azimuth 68 reports four mounted devices blocked by wall_right.
        As built, zero. A guard that has never been seen to fail is not known to work — and
        this one had to be corrected before it could catch the second defect at all.

    verified_after_the_fix:
      aisle_view: "cabinets 95% visible · figure 100% · LOUNGE 88% — the office context is in shot"
      hero_view: "UPS 56% · FMPS 100% · PDU pair 81% · Stratix 100% — every mounted device visible, eye at x=-0.32 inside the corridor"
      boot: "the real main.js boots clean; the visibility guard runs after the solve and reports nothing"
      unchanged: "6 cabinets · 569 draws · equipment at whole-U positions · 0 assembly guard failures"

    original_status_of_attempt_1: built — awaiting capture + judge
    date: 2026-08-16
    files: "index.html · main.js · src/scene/{dims,corridor,aisle,runtime}.mjs · vendor/ (offline)"
    measured: "6 cabinets · 569 draws / 1200 (47%) · 33780 tris / 200000 (17%)"
    states: "?doors=open|closed · ?led=blue|white|green · ?figure=on|off · ?cam=aisle|hero-rack"

    how_the_devices_are_nested: >
      Each device is imported from ITS OWN folder by relative path, never copied — one source
      of truth per device, and a fix in a device reaches the scene automatically. The importmap
      resolves `three` once from this folder's vendor, so all six builders share a single
      three.js instance; two copies would make instanceof checks fail silently across the
      boundary.

    three_divergences_only_ASSEMBLY_could_reveal:
      builder_convention:
        what: >
          The six do not share one. FOUR are SCENE-ADDING — build(scene) creates a root and
          calls scene.add internally (rack, ups, stratix, pdu). TWO are ROOT-RETURNING —
          build(mats) adds nothing and returns { root } (fmps, axis).
        why_it_survived_six_gates: "nothing before now had to call more than one of them"
        handled_by: >
          Two NAMED helpers rather than one that papers over it. A single clever mount() would
          have hidden the divergence; a reader integrating a seventh asset needs to know both
          shapes exist.
      origin_convention:
        what: >
          Nor do they share an origin. Measured: rack and ups put their BASE at y=0; fmps and
          stratix are CENTRED in y; axis puts the ceiling plane at y=0 and hangs below; pdu
          carries a -108 mm y offset and a 21 mm x offset. Every one is reasonable for the
          asset that chose it.
        why_it_matters: >
          "Mount at rack unit N" means putting a device's BOTTOM at that height. A caller
          assuming the origin IS the bottom floats three of the six.
        handled_by: >
          seat() measures the visible bounding box of what it is placing and aligns THAT,
          so no convention has to be agreed or remembered.
      the_cabinet_is_not_centred_on_its_own_origin:
        what: >
          Its local box runs x[-310, 310] but z[-510, 636] — the door reaches 63 mm further one
          way. Treating local x=0 as "the middle of the rack" pushed the whole equipment stack
          643 mm out through the cabinet's side.
        handled_by: "the rail centreline is MEASURED off the cabinet's own box, not assumed"

    a_bug_in_my_own_helper:
      what: >
        seat() first measured the holder's WORLD box and corrected holder.position, which is
        LOCAL to its parent. That works only while no rotation sits between the two — and the
        hero cabinet is turned 90 degrees to face the aisle, so a +x local nudge moved the
        device along world -z and the correction landed sideways.
      fix: "measure in the space you are about to correct in — world matrices brought back through the holder's inverse"
      lesson: "the rack's box came out 1789 mm wide where the cabinet is 1146; the number was visible, the cause was not"

    guards_this_pass_contributes:
      verifyEquipmentIsInsideItsRack: "the assembly-specific failure — a device correct in its OWN frame, placed wrong in the scene's. No device suite can see it, because each runs in the local space where it has always been right."
      verifyScaleCoherence: "six assets built separately, each declaring 1u=1m. A scale error here makes every OTHER asset look wrong at the same time, which is why it is a critical in this asset and nowhere else. Also asserts the relationship the eye reads: a 3U device is ~3x a 1U one."
      verifyAisleIsClear: "nothing may intrude into the walkable corridor"
      verifyCorridorEnclosesTheAisle: "every cabinet stands ON the floor and UNDER the ceiling — the enclosure check a device can never make, because a device has no room around it"
      visibleBox_everywhere: >
        Box3.setFromObject IGNORES `visible`, and two assets carry hidden state geometry (the
        dome's 400 mm ceiling prop, the FMPS's blanking plates). Measuring with them included
        reported a 101 mm camera as 400 mm and called it a scale error. Carried from the dome;
        it cost nothing here and would have cost a false alarm not to.

    verified:                        # headless; no server, no capture — the orchestrator gates
      assembly: "6 cabinets, equipment seated at whole-U positions, 0 guard failures"
      placement: "UPS y 411..542 (3U from U8) · FMPS y 589..632 (1U from U12) · PDU pair y 100..2095 vertical · camera y 2644..2700 at the 2.7 m ceiling"
      containment: "rack_equipment x[1100, 1938] inside a cabinet at x[1000, 2146]"
      scale: "the 3U UPS reads ~3x the 1U FMPS; the ceiling camera measures 101 x 56 x 101 mm in the scene, matching its own spec"
      boot: "the real main.js boots: data-app-ready, render loop, HUD and all five buttons written, both __qa hooks callable, doors complementary (glass on / mesh off), LED #2f6bff, radii 4.88 / 5.80 m. Console clean."
      budget: "569 draws of 1200, 33780 tris of 200000 — the measurement that made instancing unnecessary"

    not_in_this_pass:
      pdu_pick_fix: "due at INTERACTION-UI, where hotspots exist to be occluded"
      transparency_pick_rule: "same pass — the glass partition and glass doors are what make it load-bearing"


