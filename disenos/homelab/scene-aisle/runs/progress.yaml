carried_forward_from_closed_assets:
  pdu_pick_fix:
    source: "pdu-panduit/runs/DEFERRED-CORRECTIONS.md"
    what: >
      MANDATORY HERE. The original pick() skipped non-hotspot hits and walked on, so a ray
      passed through solid geometry. On the standalone PDU every occluder was itself a
      hotspot so it never manifested; in an aisle the rack frame, doors and neighbouring
      equipment are NON-hotspot occluders — the exact case. Port the corrected logic verbatim
      from stratix-5700.
  transparency_pick_rule:
    source: "axis-camera/src/scene/interaction.mjs"
    what: >
      A click passes through TRANSPARENT surfaces and stops at the first OPAQUE one. Load
      bearing here: the scene has glass partitions and glass cabinet doors, and a user looking
      at a UPS through a glass door must be able to click it.
  visibility_not_presence:
    source: "fmps-panduit — the defining lesson of the run"
    what: >
      Assert that criticals are VISIBLE by ray, not merely present. The FMPS spent three gates
      with its whole front buried while every count, envelope and contact check passed. A
      scene has far more occluders than a device, so this check matters more here, not less.
  rack_cabinet_is_not_headless_safe:
    what: >
      It calls document.createElement without a hasDOM() guard, so any headless check that
      loads it needs a canvas stub. Recorded as a fact about integration, not a defect to fix
      — the asset is closed.






