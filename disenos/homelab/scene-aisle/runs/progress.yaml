  materials:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "surface the environment; devices are closed and untouched"
    budget: "612 draws / 1200 (51%) · 33.9k tris / 200000 (17%)"

    method: >
      Values were SOLVED by inverting the tone curve, not picked by eye: choose the pixel the
      photograph shows, then search for the albedo that lands there. The curve was TRANSCRIBED
      OUT OF THE VENDORED r160 BUNDLE rather than recalled — it is ACES in its RRT/ODT MATRIX
      form, not the widely-quoted Narkowicz fit, which is a different and brighter curve.
      Also read out rather than assumed: BRDF_Lambert = albedo/PI, and _useLegacyLights = false
      (line 28543), so there is NO PI factor on light intensity. Every result is checked across
      a SWEPT environment irradiance (0.15 / 0.35 / 0.60), because the PMREM'd RoomEnvironment
      term is not analytic — a value that only works at one env level is fitted, not solved.

    what_the_measurement_found:
      dark_surfaces_were_holes: >
        stool, ceiling_deck and pendant_lamp_black rendered at rgb(1..3) — below the absolute
        exposure floor and DARKER THAN THE SCENE BACKGROUND, so a stool was subtracting from
        the image rather than appearing in it. Solved to ~34. Not a brightening of the design:
        real black plastic sits near 0.04-0.05 linear albedo and 0x18191c is far below even that.
      the_three_whites_cannot_be_separated_by_colour: >
        Asked for luma 96/132/158, the solver returned #fafaf5, #fffffc and #fffcf5 — all
        pinned against the top of the albedo range — and all three still landed within 3 luma.
        There is no headroom above white. THE SOLVER PROVING THE REQUEST IMPOSSIBLE IS ITSELF
        THE RESULT: they are now separated by ROUGHNESS (semi-matte steel beam, flat
        plasterboard ceiling, glossy moulded detector), which moves the specular term the
        diffuse solver cannot reach.
      amber_survives_by_losing_intensity: >
        The pendant at 0xffd9a0 x2.0 rendered rgb(243,236,221) — a warm-white lamp with no
        amber left, because a high emissive pushes all three channels into the top of the curve
        where they converge. Saturating the colour and LOWERING the intensity (0xff9a30 x1.25)
        gives rgb(243,192,90), stable across the whole sweep. How much intensity a lamp
        tolerates depends on how saturated its emissive already is: 0xffd9a0 is dead by x1.25
        (warmth 35), 0xff9a30 survives to x4 (75) and only collapses at x8 (38).
      a_flat_plane_is_not_a_view: >
        The skyline was one flat blue-grey plane — the same failure the unmullioned pane had.
        Replaced with two depths of tower against a LIGHTER emissive haze, so the silhouette
        reads by contrast rather than by lighting the towers up. Fixed table, not random: a
        view that reshuffles between captures cannot be compared to the previous attempt.

    a_suspicion_that_did_not_survive_measurement:
      claim: "glass_partition, wall_neutral and floor_wood_tile tonemap within 16 luma — the glass reads as wall"
      why_it_was_dropped: >
        The instrument could not support it. The model is DIFFUSE, and a roughness-0.05 pane is
        defined by the specular term it omits. Worked through: a clean pane seen head-on
        reflects about 4% (F0 = 0.04) and shows what is BEHIND it — so measuring it against the
        wall and finding them similar is the glass WORKING. What identifies it is the mullions
        added at structural, the frame, and the grazing-angle reflection, so envMapIntensity was
        raised to 2.2 rather than the opacity. Fifth time this pass that the criterion, not the
        design, was what needed fixing.

    guards_added:
      verifyNoSurfaceRendersAsAHole: "judges the tone-mapped PIXEL; deliberately conservative — evaluated at the BEST-oriented normal, since a surface facing away from every lamp is dark by geometry and failing those would flag correct work"
      verifySkylineReadsAsSilhouette: "the sky must be BRIGHTER than the towers; asserting the hex values differ would be vacuous, since two colours can tonemap to the same pixel"
      verifyLuminairesKeepTheirOwnHue: "declared warm/cool identity must survive to the pixel, and the three lamps must stay distinguishable"

    two_guards_were_born_dead_and_the_negative_control_is_what_found_them:
      nan_passes_every_comparison: >
        verifySkylineReadsAsSilhouette was handed the SCALAR env term where the per-channel
        irradiance belongs. irr[k] returned undefined, every result was NaN, and `NaN < 8` is
        FALSE — so the guard reported success on a skyline with no silhouette. A comparison
        cannot detect its own bad input; tonemappedChannels now THROWS on a non-finite
        irradiance, where the value is still inspectable.
      the_guard_modelled_a_different_rig: >
        The first version used only the env term as the whole irradiance and read every surface
        ~30x too dark, condemning six correct materials. LIGHT_RIG is now EXPORTED AS DATA from
        runtime.mjs and consumed by both the renderer and the guards — a guard that models a
        different rig than the renderer measures a fiction, not the image.
      my_criterion_was_wrong_again: >
        The first luminaire guard demanded every lamp carry a strong tint, which would have
        failed the warm-white downlight and the near-neutral daylight panel — both correct by
        design — to catch the one that was wrong. Reformulated as SEPARATION plus surviving
        identity. And the x4.0 negative-control case I expected to fire correctly did not:
        measured, the amber holds at warmth 75. The guard was right and the expectation wrong.

    verified:
      headless: "0 guard failures · boot clean on the real main.js · visibility unchanged (cabinets 95%, figure 100%, lounge 83%, FMPS/Stratix 100%)"
      negative_control: "9/9 — every guard fires on the value that actually shipped before this pass, and stays silent on correct work"
      note: "no server, no captures — the orchestrator gates"

  surface:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "surface detail for the environment; the six devices stay closed and untouched"
    budget: "612 draws / 1200 (51%) · 33.9k tris / 200000 (17%)"

    textures: >
      DataTexture, not CanvasTexture: a canvas needs a DOM and these have to be generatable in
      the headless suite as well as in the browser. Nothing downloaded, nothing read from disk
      — the offline-first rule applies to textures exactly as it applies to geometry. All
      deterministic via an integer hash rather than a stateful PRNG, so a texel's value does
      not depend on the order texels happen to be visited in, and two attempts stay comparable.

    what_the_reference_corrected:
      the_floor_is_wood_plank_not_access_tile: >
        I was about to model 600 mm raised-floor tiles because that is what a datacentre has.
        site-01 and site-05 both show LONG LIGHT WOOD BOARDS running down the corridor with
        grain and dark seams — it is an office fit-out. Modelling the tile would have imported
        a convention the photographs plainly contradict. Checked the photograph BEFORE building
        the texture, which is the only reason the wrong one was never built.
      the_ceiling_panels_are_warm_not_cool: >
        Declared 0xa8c8e8 cool daylight (warmth -17). Both photographs show the translucent
        panels reading WARM — filtered sunlight, golden where the sun strikes them. Now
        0xffe4b8 x1.15 (warmth +19).
      the_door_leds_are_not_all_one_colour: >
        The dominant visual in both frames, and the reference shows green-cyan strips beside
        blue and white ones. Driven through the rack's own LED_COLORS + ledMat/ledGlowMat —
        same reasoning as the frame variant: the asset already declares this axis, so selecting
        a value on it uses its contract rather than writing a second one.

    a_guard_of_mine_was_defending_a_wrong_decision:
      what: >
        verifyLuminairesKeepTheirOwnHue asserted sign -1 on ceiling_daylight — it ENFORCED the
        cool panel the reference contradicts. The guard's shape was right and its declared
        identity was false.
      why_it_matters: >
        A guard defends a mistaken decision exactly as loyally as a correct one, and it cannot
        detect that its own premise is wrong — it has no access to the reference. Every green
        run was the guard confirming my error back to me. Only the photograph could break the
        loop.
      also_reformulated: >
        Its pairwise separation rule demanded all three luminaires differ, which would have
        failed the aisle ceiling panel against a lounge downlight it is never seen beside —
        both warm in the reference. Separation is now a ZONE property: two luminaires in
        different rooms are allowed to be the same colour. Sixth time this run that the
        criterion, not the design, was the thing that needed fixing.

    a_texture_changes_what_the_pixel_guard_must_measure: >
      A colour map MULTIPLIES the material colour, so verifyNoSurfaceRendersAsAHole judging
      m.color alone would read every textured surface as brighter than it renders — the guard
      would have gone quietly optimistic the moment this pass landed. Each generator now
      records its meanFactor (plank 0.850, carpet 0.825, ceiling panel 0.956) and the guard
      applies it. Verified it is not decorative: forcing the floor map to 0.03 makes the guard
      fire at luma 4.6.

    also_added:
      skirting: "site-05 — a wall and a floor sharing a light neutral tone merge at the join without it; brighter and glossier than the wall, since a skirting that matches the wall is one nobody can see"
      corrugated_ceiling_panel: "ribs are what read as a panel rather than a light box"
      carpet_pile_and_bands: "site-01 shows a loop pile in broad directional bands, not a flat colour"

    verified:
      headless: "0 guard failures · boot clean · visibility unchanged · 9/9 negative control"
      note: "no server, no captures — the orchestrator gates"

  lighting-camera:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "make the rig agree with the room; verify each view frames its subject inside its cap"
    budget: "612 draws / 1200 (51%) · 33.9k tris / 200000 (17%)"

    the_rig_was_contradicting_its_own_practicals:
      measured: >
        Per-channel irradiance by normal. A surface facing straight UP — directly at the golden
        ceiling panels the surface pass had just corrected — was receiving BLUE light: warmth
        -0.098, because hemi.sky was still 0xdbe8f2. And hemi.ground was 0x2a2a28, a near-black
        that models a dark floor, when the floor is LIGHT WOOD PLANK; anything facing down was
        being lit by a room that does not exist.
      solved: >
        sky 0xffe4c4, ground 0x7d6f5e, intensity 0.50. Chosen to HOLD THE EXPOSURE while
        reversing the tint — front-face luma moves only 0.90 -> 0.92 — because the materials
        pass resolved every albedo against this exposure, and shifting the level would have
        silently invalidated that entire pass. Up-facing warmth -0.098 -> +0.225, floor bounce
        0.36 -> 0.43 and warm.
      why_it_had_survived: >
        Nothing related the rig to the practicals. Both were individually defensible and
        together described two different rooms.

    a_guard_that_relates_two_parts_of_the_model_cannot_go_stale:
      what: >
        verifyRigAgreesWithItsPracticals compares the hemisphere sky against the CEILING PANEL
        EMISSIVE, and the ground bounce against the FLOOR ALBEDO — model against model, not
        model against a constant I typed.
      why_this_shape: >
        The direct answer to last pass's failure. A guard checking work against a declared
        constant will defend that constant after it turns out to be wrong — that is exactly how
        verifyLuminairesKeepTheirOwnHue came to enforce a cool ceiling the photographs show as
        warm. A relational guard follows the model: change the panel and the requirement on the
        rig changes with it, so it cannot end up defending an obsolete premise.

    a_latent_defect_in_the_camera_solver:
      what: "when no radius within maxRadius framed the subject, the fallback returned r=12 — IGNORING the cap"
      why_it_matters: >
        The cap exists precisely so the camera does not walk out through a corridor wall, and
        the fallback defeated it, framing the outside of the room. NOT firing today (aisle
        solves at 4.88 of 40, hero-rack at 1.86 of 2.4) but latent: the first pass to grow a
        subject would have hit it silently.
      fix: >
        Clamp to maxRadius and report. A partially cropped subject is a reportable defect; a
        camera outside the building is a confusing one. Found by asking what the solver does
        when it FAILS, not by watching it succeed.

    framing_measured:
      aisle: "r 4.88 of cap 40 · ndc |x| 0.829 |y| 0.934 · subject 4.29 x 2.09 x 3.39"
      hero-rack: "r 1.86 of cap 2.4 · ndc |x| 0.153 |y| 0.927 · subject 0.84 x 1.99 x 0.54"
      note: >
        hero-rack fills only 15% of the width, and that is correct rather than a defect: the
        subject is a 2 m vertical stack 0.84 m wide, so the frame is bound by Y. Maximising the
        NDC box for a long thin subject rewards a steep diagonal that reads worse.

    verified:
      headless: "0 guard failures · boot clean · visibility unchanged · framing pass"
      negative_control: "13/13 — 9 material, 4 lighting; each fires on the value that shipped and stays silent on correct work"
      note: "no server, no captures — the orchestrator gates"

  interaction-ui:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "the two mandatory carry-overs, where both are load-bearing for the first time"
    budget: "612 draws / 1200 (51%) · 33.9k tris / 200000 (17%)"

    the_two_carried_rules:
      pick_stops_at_the_first_opaque_surface: >
        Ported from stratix-5700 as required. The obvious loop — walk the hit list until a
        hotspot turns up — defeats occlusion whenever the occluder is not itself a hotspot. On
        the standalone PDU every occluder WAS a hotspot, so the defect could not manifest; in
        an aisle the neighbouring cabinets, frames and panels are all non-hotspot occluders, so
        the case that was impossible in isolation is the normal case here.
      click_passes_through_transparent_surfaces: >
        Someone looking at the UPS through a glass door would be right to call a blocked click
        broken. The glass stays pickable at LOWER priority — it answers only where nothing
        opaque and interactive lies behind the ray.

    making_the_transparency_rule_load_bearing: >
      The hero cabinet now shows the rack's Variant B glass door (which the asset already
      builds and leaves hidden), with the mesh door turned off — two doors in one plane is one
      door too many. site-05 shows glass-fronted cabinets beside mesh ones, so it is
      reference-backed; but the reason it matters is that with every door opaque there was NO
      PANE IN FRONT OF ANY DEVICE, and the carried rule would have shipped untested. A rule
      nothing exercises is not known to work.

    the_negative_control_first_reported_the_guard_DEAD_and_was_wrong: >
      Rebuilding the original defective pick and running it from the HERO-RACK view fired zero
      times, which reads exactly like a useless guard. It was the SPECIMEN: from that view the
      only thing between the camera and the UPS is the glass door, which the correct and the
      defective pick both pass through, so the scenario could not contain the defect. Run from
      the AISLE view it fires 4 times — "ups reports as clickable although side_panels is
      opaque and in front of it". A control proves an instrument on the case it was built from,
      and the case has to actually be present.

    reached_by_ray_is_not_clickable: >
      The hotspot probe reported the ceiling camera clickable at (3383, -5553) in a 1600x900
      viewport: nothing opaque stood in front of it so the ray arrived, but no user can put a
      cursor there. A point outside the frame is not a place anyone can click, and a probe
      returning one hands its consumer a coordinate that silently misses. Now counted as
      offscreen and skipped.

    a_constant_that_nothing_validated:
      what: >
        PASSES validated the QUERY PARAM but never CURRENT_PASS. 'LIGHTING-CAMERA' sat in that
        constant for a whole pass without being a member of the list.
      severity: "the HUD label DID render ('Pase LIGHTING-CAMERA') — this was an internal inconsistency, not a visible defect"
      why_it_matters: >
        The externally-supplied value was guarded and the locally-authored one was trusted,
        which is backwards: the local one is what gets edited every single pass. A plain typo
        would have been just as silent. Now asserted.
      process_note: >
        It surfaced only because the boot check ran AFTER the edit this time. In the previous
        pass CURRENT_PASS was changed during the write-up, after the suite had already run —
        a verification that precedes the edit it was meant to cover verifies nothing.

    guards_added:
      verifyPickCannotReachThroughSolids: "states the property of the RESULT rather than of the loop, so it stays true however the pick is rewritten"
      verifyClickAgreesWithSight: >
        RELATIONAL, in the shape established last pass: it compares what the PICK does against
        what the VISIBILITY check does, so the two cannot drift into disagreeing about the same
        pane of glass. It also fails when the scene contains NO visible transparent surface,
        because then the rule is untested.

    verified:
      headless: "0 guard failures · boot clean · visibility pass · framing pass · interaction pass from both views"
      negative_control: "13/13 material+lighting, plus the reconstructed PDU defect caught 4 times"
      note: "no server, no captures — the orchestrator gates"

  optimization:
    status: built — awaiting capture + judge
    date: 2026-08-16
    scope: "measure the spend; cut only what measurement says is worth cutting"
    headline: "the honest result is that this scene does not need optimising — but the COUNTER did"

    the_budget_figure_was_wrong_and_i_reported_it_four_times:
      what: >
        The counter used a plain traverse and called every mesh a draw call: 610 where the
        renderer issues 523. Eighty-seven meshes in this graph are HIDDEN — the six cabinets'
        unused door variants plus the hero's switched-off mesh door — and a hidden mesh is
        skipped by the renderer entirely.
      impact: "'612 draws (51%)' went out in four consecutive pass reports; the real load is 523 (44%)"
      root_cause: >
        Counting the thing that is easy to count instead of the thing being budgeted. A mesh is
        not a draw call, and nothing in the pipeline was ever going to notice, because the
        wrong number was comfortably under budget too — an error that only shows up when it
        crosses a threshold is invisible until the day it matters.
      fixed: "verifyBudget now counts visible meshes as draws and reports hidden geometry separately"

    a_1_68x_discrepancy_between_two_of_my_own_counters:
      what: "the pass counter said 32156 triangles and the profiling script said 19164, over the same graph"
      cause: >
        InstancedMesh. Several closed assets use it internally for wheels, side panels and fork
        parts — 12992 triangles of instances. 19164 + 12992 = 32156 exactly. An InstancedMesh is
        ONE draw call but N instances of triangles, so the draw figure is right to count it once
        and the triangle figure is not.
      note: >
        This does not contradict the run-wide 'no instancing' rule: that applies to the SCENE's
        three cabinets per side, which are six separate objects. Instancing inside a closed
        asset is the asset's own business.
      discipline: "I had just criticised a counter that did not reconcile; reconciling my own before reporting was the same standard applied to myself"

    faceting_measured_in_pixels:
      method: "sagitta = R * (1 - cos(pi/N)), converted to px at dpr 3 and the distance each camera actually stands"
      result: >
        Every curved piece of ENVIRONMENT geometry is under 1 px of sagitta — pendant shades
        0.52, smoke detectors 0.76, stool legs 0.45. With 84% of the triangle budget unspent
        the right question was whether to RAISE tessellation, and the measurement says no: the
        flat spots are already invisible. Spending budget just because it is available buys
        nothing.
      one_finding_in_a_closed_asset: >
        rear_fan_ring (UPS, N=8, r=36 mm) shows 2.11 px of sagitta from the hero view — visible
        faceting. The UPS is closed, so this is reported, not touched.

    the_optimisation_i_measured_and_then_did_not_do:
      finding: "52% of raycast time is spent on invisible geometry — 0.341 ms/pick vs 0.162 with hidden subtrees pruned"
      why_it_is_real: >
        three r160 does NOT test `visible` when raycasting, only `layers` (intersectObject in
        the vendored bundle). So every hidden mesh is genuinely intersected on each pointer move
        and then discarded by the pick.
      why_i_left_it: >
        0.341 ms against a 16.7 ms frame, on a pointer event. The 52% is a large fraction of
        something that does not matter. The available fix — mirroring `visible` into `layers`,
        or caching a pickable set — introduces state that must be resynchronised at every
        toggle, and a stale cache is exactly the silent-failure class this run has spent seven
        passes eliminating. A remedy more fragile than the problem is not an optimisation.

    what_the_spend_buys:
      aisle_right: "339 draws / 19332 tris — the populated hero cabinet and its five devices"
      ceiling_camera: "14 draws / 8036 tris — 25% of the scene's triangles for one 101 mm device (Axis, closed)"
      sharing: "140 unique materials across 523 meshes (3.7 each); 151 meshes reuse a geometry"

    final_numbers: "523 draws / 1200 (44%) · 32156 tris / 200000 (16.1%) · 87 hidden meshes costing no draw call"

    verified:
      headless: "0 guard failures · boot clean · visibility · framing · interaction from both views"
      negative_control: "13/13 plus the reconstructed PDU defect caught 4 times"
      note: "no server, no captures — the orchestrator gates"

  p6:
    status: self-check complete — awaiting the orchestrator's capture and verdict
    date: 2026-08-16
    comparison: reference-match
    final_numbers: "523 draws / 1200 (44%) · 32156 tris / 200000 (16.1%) · 87 hidden meshes costing no draw call"

    critical_features_measured:                # measured against the spec's own wording, not judged by eye
      aisle-of-racks:
        threshold: 0.72
        evidence: "6 cabinets, 3 per side, pitch 0.620 / 0.620 m — spread 0.0 mm"
      hero-rack-populated:
        threshold: 0.72
        evidence: "UPS 2.95U, FMPS 0.97U, boxes do not intersect, PDU pair present at the rear posts"
      cross-asset-scale-coherence:
        threshold: 0.75
        evidence: "UPS/FMPS height ratio 3.05 (spec says 3), ceiling camera 101 mm at y 2.70 m, hero cabinet 2.095 m"
      dual-feed-pdu-pair:
        threshold: 0.70
        evidence: "18 red-dominant and 20 blue-dominant saturated meshes — an A/B feed, not two of one colour"
      office-corridor-context:
        threshold: 0.70
        evidence: "floor (plank_floor map), glass partition, pendant shades, sky haze, ceiling daylight panel, lounge carpet — all present and visible"

    a_defect_i_nearly_reported_that_did_not_exist: >
      The context check first came back MISSED on the ceiling panel. The panel is there; my
      script looked for "ceiling_daylight_0" and the node is "ceiling_daylight". Verified the
      name before concluding, which is the only reason a fabricated defect did not go into a
      P6 report. The failing half was the instrument, again.

    deferred_correction_filed_not_fixed:
      where: "ups-panduit/runs/DEFERRED-CORRECTIONS.md"
      what: "rear_fan_ring at radialSegments 8, r 36 mm — 2.11 px of sagitta from the hero view, visible faceting"
      why_not_fixed_here: >
        The UPS is P6-complete. The scene may SELECT from an asset's declared options — it does
        exactly that for FRAME_VARIANTS, LED_COLORS and the door variants — but it does not
        alter an asset's geometry. A scene that edits its devices stops being evidence that
        those devices work.

    verification_state_at_close:
      guards: "0 failures across every guard in the asset, run at boot"
      boot: "clean console on the real main.js; HUD reads Pase FINAL"
      visibility: "every critical visible from the view that must show it"
      framing: "both views fit their subject inside their radius cap"
      interaction: "pick passes from both views; both carried rules hold"
      p6_self_check: "5 of 5 critical features met by measurement"
      negative_control: "13/13, plus the reconstructed PDU pick defect caught 4 times"
      ordering: "the pass label was changed BEFORE this suite ran, not during the write-up — the correction from interaction-ui applied to the process, not just the code"

    what_this_scene_cost_the_run_in_findings:
      - "a guard that was born dead (NaN passes every comparison — the failure direction is always the favourable one)"
      - "a guard that fired correctly on a premise the photographs contradict, confirming my own error back to me with every green run"
      - "a rig that contradicted its own practicals because nothing related the two"
      - "a camera solver whose failure path ignored the cap that existed to constrain it"
      - "a budget counter that called a mesh a draw call, reported four times before it was caught"
      - "an optimisation that was real, measured, and correctly declined"


measured_budget:
  what: >
    Every perf_budget in this project has been a CEILING nobody approached, so this asset's
    was DERIVED from loading all six assets headless and counting.
  per_asset: "pdu 70 draws/2232 tris · ups 45/1180 · stratix 36/596 · axis 15/8048 · fmps 91/2248 · rack 48/1220"
  one_populated_rack: "305 draws · 15524 tris"
  aisle: "3 racks 915 draws / 46572 tris (comfortable) · 5 racks 1525 (tight) · 8 racks 2440 (over)"
  the_governing_fact: >
    THE SCENE IS DRAW-CALL BOUND, NOT TRIANGLE BOUND. 124k triangles at eight racks is
    nothing; 2440 draws is a problem. That measurement is what allowed instancing to be
    DECLINED: six cabinets with one populated is 545 draws against a 1200 ceiling, so every
    cabinet stays individually addressable.
  meta_finding: >
    The rack declared 250 draws / 400000 tris and uses 48 / 1220 — a factor of 5 in draws and
    328 in TRIANGLES. The project's budgets have never informed a design decision. Not
    changing them now (nothing is blocked and every asset is comfortably inside), but this is
    the first real figure we have.

# ── Resolved at the P3 gate ───────────────────────────────────────────────────────
gate_questions_resolved:
  photographs_not_on_disk:
    answer: >
      RESOLVED BY ARRIVAL. The photographs are on disk as references/site-01..08.jpeg with a
      MANIFEST, so the composition is re-authored reference-backed and p6_comparison is a real
      reference-match. Nothing was fabricated in the interim.
    what: >
      The seven site photographs are the ONLY evidence for the corridor, and they are not on
      disk — P1-INTAKE §2 says so and references/ carries a NEEDED.md. So aisle length, width,
      ceiling height, partition and lamp placement and the skyline are inferred from a WRITTEN
      DESCRIPTION, and every one of those dimensions is confidence: low.
    asking: >
      Confirm the plan: author the composition inferred NOW so the photo-independent work
      (equipment mounting, hero/background topology, the pick() fix, the procedural scaffold)
      proceeds, and re-author the corridor against the images when they land, flipping
      p6_comparison to reference-match. I am NOT fabricating a reference-match before then.
  instancing_reverses_a_run_wide_call:
    answer: >
      NOT BOUGHT. The orchestrator ruled against buying it before it buys anything, and the
      measurement agrees: six cabinets of which ONE carries equipment costs 6 x 48 + 257 = 545
      draws against a 1200 ceiling. Every cabinet stays individually addressable, the run's
      no-instancing consistency holds, and all six remain inspectable. Revisit only if a deeper
      aisle is needed — as a measured decision, not a precaution.
    what: >
      Every asset in this run declined instancing, correctly: per-asset it bought nothing and
      cost named, addressable meshes that the guards and hotspots depend on. This spec ACCEPTS
      it for background_racks.
    asking: >
      Confirm the line I drew — instancing only where addressability is NOT needed, which is
      exactly the boundary between hero_rack and background_racks. If you would rather keep
      three fully addressable racks, the measurement allows it at 915 draws; the instancing is
      headroom for going to five, not a necessity at three.
  device_materials_are_NOT_redeclared:
    answer: >
      CONFIRMED as the convention, with the corollary ratified: if a device reads wrong IN
      CONTEXT that is a defect in the asset that owns it, and since all six are closed it would
      mean reopening that asset with the orchestrator's approval — never patching in the scene.
    what: >
      This spec authors only ENVIRONMENT materials. Each device brings its own gated contract
      and the scene does not restate or override any of them.
    asking: >
      Confirm that is the convention you want. A scene that redeclares a device's colours
      becomes a second source of truth, and the first drift lands there — but it also means
      the scene cannot tune a device that reads wrong in context. If one does, my position is
      that it is a defect in the asset that owns it, not scene work.

