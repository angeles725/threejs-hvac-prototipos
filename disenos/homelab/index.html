<!doctype html>
<html lang="es" data-app-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack-cabinet — Pase OPTIMIZATION</title>
  <link rel="icon" href="data:,">
  <!--
    LOCAL importmap — three r0.160.0 vendored inside this build (vendor/three/).
    Fully OFFLINE: no CDN dependency at run time.
    Per disenos/catalog/EXTERNAL-ASSETS.md §A.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #06080d;
      color: #d0d4da;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      overflow: hidden;
    }
    #canvas-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD — top-left pass label; __qaFraming reads its BoundingClientRect */
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(6, 8, 13, 0.72);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 4px;
      padding: 6px 12px;
      pointer-events: none;
      z-index: 10;
    }
    #hud .hud-name {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #7a8494;
      text-transform: uppercase;
    }
    #hud .hud-pass {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e0e6f0;
      margin-top: 2px;
    }
    #hud .hud-state {
      display: block;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #5a8aff;
      margin-top: 4px;
      white-space: nowrap;
    }
    /* Controls panel — bottom-right */
    #controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(6, 8, 13, 0.80);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      z-index: 10;
    }
    #controls .ctrl-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #7a8494;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #controls button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: #c8d0dc;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    #controls button:hover { background: rgba(255,255,255,0.12); }
    #controls button.active {
      background: rgba(47, 107, 255, 0.22);
      border-color: #2f6bff;
      color: #a0c4ff;
    }
    #controls .ctrl-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 2px 0;
    }
    #controls .ctrl-hint {
      font-size: 9px;
      letter-spacing: 0.05em;
      color: #3c4860;
      text-align: center;
      padding-top: 2px;
    }
    /* Tooltip that follows the pointer over 3D hotspots */
    #hotspot-tip {
      position: fixed;
      background: rgba(6, 8, 13, 0.85);
      border: 1px solid rgba(47, 107, 255, 0.40);
      color: #8ab0ff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
      z-index: 20;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="canvas-wrap">
  <!--
    #hud — the __qaFraming hook queries this element's getBoundingClientRect()
    to return the HUD rect in the framing payload. ID must remain '#hud'.
    Pass label must read EXACTLY "Pase OPTIMIZATION".
    hud-state is updated by JS — initial text is the default state.
  -->
  <div id="hud">
    <span class="hud-name">rack-cabinet</span>
    <span class="hud-pass">Pase OPTIMIZATION</span>
    <span class="hud-state" id="hud-state">MESH · CERRADA · AZUL · —</span>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Controls panel (spec ui_controls) -->
  <div id="controls">
    <div class="ctrl-label">Controles</div>
    <button id="btn-frame-color">GABINETE: BLANCO</button>
    <hr class="ctrl-divider">
    <button id="btn-door-type">PUERTA: MESH</button>
    <button id="btn-open-door">ABRIR PUERTA: NO</button>
    <hr class="ctrl-divider">
    <button id="btn-led-color">LED COLOR: AZUL</button>
    <hr class="ctrl-divider">
    <button id="btn-autorotate">AUTO-ROTAR: NO</button>
    <div class="ctrl-hint">CLICK EN PUERTA · PALANCA · LEDs</div>
  </div>

  <!-- Floating tooltip shown on 3D hotspot hover -->
  <div id="hotspot-tip"></div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
