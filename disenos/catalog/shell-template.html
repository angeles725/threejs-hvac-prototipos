<!doctype html>
<!--
  CATALOG SHELL TEMPLATE — canonical starting point for every catalog asset.
  Copy this file to  disenos/catalog/<family>/<slug>/<slug>.html  and fill the 3 marked zones.
  It already bakes in the project QA contract, so a headless probe can read it and the gate can score it:
    · globalThis.__APP.runtime = { scene, renderer, camera, root }   (rename __APP → __<slug>App)
    · globalThis.__qaRenderInfo = ()=>renderer.info.render
    · <html data-app-ready> flips to "true" after the first frame
    · render-on-demand (block56): renderer.render() is gated behind needsRender; rAF + controls.update()
      stay every frame for damping/autoRotate; EVERY scene/camera change must call requestRender()
    · shadow map 1024 (block54 §5-d), DPR capped at 2, shadows frozen (autoUpdate=false)
  Authoring standards (READ BEFORE BUILDING):
    · ~/.claude/skills/design3d/references/DESIGNSPEC.md   (spec authoring)
    · research/HANDBOOK.md §3 (materials — brushed 304 stainless: metalness 0.9-1.0)
    · EQUIPOS-PENDIENTES.md §REGLAS DE CASA (house rules)
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASSET NAME — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">ASSET NAME — material</div>
  <div><span class="dim">W × D × H m</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <!-- add asset-specific toggles here; EACH handler must call requestRender() -->
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 26);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 4.4;
camera.position.set(R*Math.cos(0.73)*Math.cos(0.42), 0.5 + R*Math.sin(0.42), R*Math.sin(0.73)*Math.cos(0.42));
camera.lookAt(0, 0.42, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.42, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
// NO-OP en three r160: scene.environmentIntensity NO EXISTE hasta r163 (aquí usamos three@0.160.0), así que
// esta asignación se fija en silencio y el renderer NUNCA la lee. La perilla viva en r160 es material.envMapIntensity
// (POR material, y solo si hay scene.environment/PMREM). La receta de inox cepillado del kit que prescribe
// environmentIntensity ~2.15 nunca se aplicó por esta vía: los assets se iluminan por las luces explícitas
// (Hemisphere + Directional del recipe design3d), no por env boost. Dejado documentado en vez de borrado para que
// nadie lo reintroduzca creyendo que hace algo. NO reactivar sin recalibrar TODO el catálogo.
// scene.environmentIntensity = 1.9;   // muerto en r160

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 6, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0003;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-3; sun.shadow.camera.right=3; sun.shadow.camera.top=3; sun.shadow.camera.bottom=-3;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. Follow HANDBOOK.md §3. Bare stainless: metalness ~0.9, roughness 0.30-0.34.
//          Declare a colorTarget in design-spec.yaml so the ΔE00 gate can score the material read.
// ============================================================================
const matSteel = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.9, roughness:0.30 });

// ============================================================================
// ZONE 2 — GEOMETRY. Build the asset under `root`. Set castShadow/receiveShadow on solids.
//          Keep it inside the block54 budget: aim < ~100 draw calls (one mesh = one draw).
// ============================================================================
const root = new THREE.Group();
// … build here …
scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. Wire every toggle. render is GATED, so EACH handler MUST call requestRender().
//          For a per-frame animation, gate it on a state flag and set needsRender=true while active.
// ============================================================================
const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  // if(<state>){ /* mutate root */ needsRender = true; }   // per-frame animation goes here
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
// HYPHENATED slug → camelCase global (mi-asset → __miAssetApp); __mi-assetApp is not a valid
// identifier. The QA probe finds any globalThis /^__.*App$/ with .runtime.renderer, so camelCase
// works; optionally also alias the exact slug: globalThis['__mi-assetApp'] = globalThis.__miAssetApp;
globalThis.__APP = { runtime:{ scene, renderer, camera, root } };   // rename __APP → __<slug>App
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
