# DesignSpec — General Assembly station on a skillet conveyor
# Dimensional evidence: research/threejs-block63.md §63.5. This asset is anchored on an ERGONOMICS
# number, not a machine number: no conveyor maker publishes a canonical station height because the
# correct height is set by the task, and CCOHS publishes it as a task function.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: estacion-linea-ensamble
family: automotriz
track: needs-research        # research closed by [Block 63]; build is procedural
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 16 -> complex.
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 1}
  tier: complex
  notes: >
    A station is a RELATIONSHIP, not an object: platform height, product height, bin distance and
    tool drop must agree or the asset is just industrial scenery. Every one of those four is driven
    by a published number here. repetition 2: the bins are instanced; the rack bays and gantry posts
    are too few to justify it.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block63.md
  reuse_pointers:
    product_massing: "disenos/catalog/automotriz/carroceria/ — the modelled shell; here it is a massing"
    instancing_rule: "block54 §2.3 — 8 identical bins are instanced; the 3 rack bays are not"

references:
  - source: "sources/web-snapshots/www.ccohs.ca_oshanswers_ergonomics_conveyor_ergonomics.html.md:130-168,192"
    evidences: >
      "A height range of 65 to 120 cm can accommodate the majority of the workforce"; conveyor height
      for HEAVY work requiring large downward or sideward forces should be 91 cm (36 in), about
      20-40 cm below elbow height; LIGHT work 107 cm (42 in); tasks requiring large upward forces
      81 cm (32 in); precision work 95-120 cm. "The reaching distance for repetitive movements is
      within 45 cm (18 in)" [CERT-web].
    suitability: pass
  - source: "sources/web-snapshots/centralconveyor.com_automotive_skillet-conveyor_.md:621-633"
    evidences: >
      "The Skillet system is normally used in General Assembly operations"; skillets are PLATFORMS
      that transport the product while the operator travels with it; "adjustable height skillet allows
      the skillet to be raised or lowered"; the three GA carrier families are skillet, skid and pallet
      [CERT-web].
    suitability: pass
  - source: "research/threejs-block63.md §63.2"
    evidences: >
      The carried product's envelope (4284 x 1789 x 1456 mm, C-segment) and the constant-width warning
      that makes the greenhouse a separate, narrower extrusion here too.
    suitability: pass

dimensions_real:
  # CONFIDENCE DISCIPLINE (Block 63 §63.5): the task heights and the reach limit are published; the
  # station plan, skillet size and pitch are not.
  work_height_heavy_m:  {value: 0.91,  confidence: high}   # [CERT-web] the height this station is built to
  work_height_light_m:  {value: 1.07,  confidence: high}   # [CERT-web]
  work_height_upward_m: {value: 0.81,  confidence: high}   # [CERT-web]
  work_height_range_m:  {value: [0.65, 1.20], confidence: high}  # [CERT-web]
  repetitive_reach_m:   {value: 0.45,  confidence: high}   # [CERT-web] bin face is inside this
  decking_y_m:          {value: 0.12,  confidence: low}    # [INFER] the operator's floor level
  skillet_l_m:          {value: 5.20,  confidence: low}    # [INFER] must carry a 4.284 m car
  skillet_w_m:          {value: 2.40,  confidence: low}    # [INFER]
  skillet_pitch_m:      {value: 5.75,  confidence: low}    # [INFER]
  gantry_beam_y_m:      {value: 2.90,  confidence: low}    # [INFER] clears the 2.17 m roof line
  bin_count:            {value: 8,     confidence: low}    # [INFER]

hierarchy:
  - name: root
    children:
      - name: decking         # fixed walkway either side of the moving platforms + floor markings
        pivot: [0, 0.06, 0]
        animation: none
      - name: skillets        # this station's platform + the leading edge of the next one
        children:
          - name: platform    # deck flush with the walkway: the operator travels WITH the product
            pivot: [0, 0.06, 0]
            animation: translate_x
          - name: scissor     # adjustable-height skillet [CERT-web]: 4 bars + lift table + drive column
            pivot: [0, 0.34, 0]
            animation: lift_y
          - name: cradles     # 4 posts + pads; their TOP is what sets the 910 mm work height
            pivot: [0, 0.82, 0]
            animation: none
            attachment: {parent_socket: lift_table, contact_type: bolted, gap_tolerance: 0.002}
      - name: bodies          # the carried product: 2 extrusions (body 1.789 wide, greenhouse 1.30)
        pivot: [0, 1.03, 0]
        animation: none
      - name: rack            # 3-bay flow rack; bin face sits inside the 450 mm repetitive reach
        pivot: [0, 0.92, 1.551]
        animation: none
      - name: tooling         # gantry, runway beam, trolley, spring balancer, DC nutrunner, torque arm
        pivot: [0, 2.90, 0]
        animation: none
      - name: andon           # 3-stack light column + operator terminal
        pivot: [3.05, 1.22, 1.851]
        animation: none
      - name: ergo            # the 3 CCOHS task-height reference planes (off by default)
        pivot: [0, 1.03, 0]
        animation: none

materials:
  - id: body-clearcoat
    family: painted-metal
    color: "#1d4d8f"
    metalness: 0.0             # solid automotive paint under clearcoat -> dielectric, very low roughness
    roughness: 0.18
    evidence: "HANDBOOK §3.1 painted/coated 0.0-0.05; a GA product is POST paint shop, unlike `carroceria`"
    confidence: 0.75
  - id: glazing
    family: glass
    color: "#18242f"
    metalness: 0.0
    roughness: 0.08
    evidence: "[INFER] greenhouse massing stands in for windscreen + backlight + roof"
    confidence: 0.55
  - id: station-frame
    family: painted-metal
    color: "#2f4a63"
    metalness: 0.0
    roughness: 0.58
    evidence: "[INFER] painted structural steel — gantry, rack, cradles, scissor"
    confidence: 0.65
  - id: deck-steel
    family: painted-metal
    color: "#353b41"
    metalness: 0.0
    roughness: 0.72
    evidence: "[INFER] walkable decking, matte and worn"
    confidence: 0.6
  - id: safety-yellow
    family: painted-metal
    color: "#d9a527"
    metalness: 0.0
    roughness: 0.62
    evidence: "[INFER] platform border + walkway marking"
    confidence: 0.7
  - id: bin-teal
    family: plastic
    color: "#1f6b6a"
    metalness: 0.0
    roughness: 0.68
    evidence: "[INFER] moulded parts bin; dielectric"
    confidence: 0.65

critical_features:
  - id: work-height-is-the-design
    desc: >
      The carried body's underbody sits exactly 910 mm above the platform the operator stands on —
      the CCOHS heavy-work height — and the cradle posts exist to put it there. Turning ALTURAS CCOHS
      on shows the 810 / 910 / 1070 mm planes and the product landing on the middle one.
    threshold: 0.80
  - id: operator-travels-with-the-product
    desc: >
      The platform is FLUSH with the walkway and wide enough to stand on, because a skillet carries
      the operator as well as the product. A belt or roller bed the operator stands beside would be a
      different carrier family (skid or pallet).
    threshold: 0.75
  - id: bins-inside-the-reach
    desc: >
      The flow-rack bin faces sit ~350 mm from the platform edge, inside the 450 mm repetitive-reach
      limit. Parts stacked out of reach is the single most common way a station drawing is wrong.
    threshold: 0.75
  - id: tool-drops-to-the-work
    desc: >
      The DC nutrunner hangs from a spring balancer on a runway beam, at hand height over the product
      — not stowed on a bench. Overhead gantry, trolley, balancer, tool and torque arm read as one
      system.
    threshold: 0.70

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80
    tris: 12000

camera:
  azimuth_deg: 56
  elevation_deg: 19.5
  fov: 38
  target_y_m: 1.20
  radius_m: 11.4

lighting: house-rig + vertical-subject fill
  # DOCUMENTED DEVIATION (Block 63 §63.7): the body flank, the rack uprights and the gantry posts are
  # vertical planes that read flat under the stock rig. Two DirectionalLights are aimed along their
  # normals (+Z 0.95, -Z 0.70) and environmentIntensity goes 1.9 -> 2.1. Materials are UNCHANGED.

ui_controls:
  - "AUTO-ROTATE"
  - "CARROCERÍA"      # the carried product off -> the scissor lift and cradle posts are exposed
  - "HERRAMIENTA"     # gantry + balancer + nutrunner + torque arm
  - "ALTURAS CCOHS"   # the 810 / 910 / 1070 mm task-height planes over the platform

colorTarget:
  # MEASURED from the rendered body flank (headless SwiftShader capture at 1280x800), then frozen as
  # the regression anchor. Not a guessed value.
  srgb: [19, 106, 197]
  deltaE00Max: 8
  crop: "24x8+420+350"   # clean painted quarter-panel flank, above the rear arch, at 1280x800
