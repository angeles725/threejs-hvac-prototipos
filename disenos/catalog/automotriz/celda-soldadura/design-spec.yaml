# DesignSpec — robotic spot-weld cell (2 x ABB IRB 6700-235/2.65 + fixture + ISO 13857 mesh guard)
# Dimensional evidence: research/threejs-block63.md §63.4. This asset carries the most CERTIFIED
# numbers of the family: the robot envelope comes from the ABB product specification and the guard
# from ISO 13857 plus a commercial panel datasheet.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: celda-soldadura
family: automotriz
track: needs-research        # research closed by [Block 63]; build is procedural
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 19 -> complex.
  scores: {silhouette: 2, components: 3, hierarchy: 3, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 2}
  tier: complex
  notes: >
    hierarchy 3 and action_readiness 2: the arm is a REAL joint chain (j1 -> j2 -> j3 -> j5), so the
    pose is produced by rotating joints, not by placing parts — the tool orientation follows from the
    chain and a wrong link length shows up immediately as a tool that misses the part. repetition 3:
    the guard is 21 identical bays plus 22 posts, which is the only genuine instancing case here.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block63.md
  reuse_pointers:
    instancing_rule: "block54 §2.3 — 21 guard bays + 22 posts are real repetition; the 2 robots are not"
    render_on_demand: "block56 — render gated behind needsRender"

references:
  - source: "sources/B63-automotriz-dims/abb-irb6700-omnicore-ps.pdf (extracted/abb-irb6700-omnicore-ps.txt:384-402,428-446,566-575,757-758,976-1056)"
    evidences: >
      IRB 6700-235/2.65: handling capacity 235 kg, reach 2.65 m, robot weight 1250 kg [CERT-doc];
      radius ax1 FRONT 532 mm and BACK 633 mm for this variant [CERT-doc]; "IRB 6700 are designed for
      floor mounting (no tilting allowed around X-axis or Y-axis)" [CERT-doc]; option base plate with
      12 x M24 in an ~800 x 540 mm bolt field [CERT-doc]; the manual also documents §1.3.4
      "Mechanically restricting the working range of axis 1" — the mechanism that lets a real cell be
      smaller than the full 2.65 m envelope.
    suitability: pass
  - source: "sources/web-snapshots/robot-safety.net_en_dimensions-and-fastening-of-robot-safety-fences_.md:64-74"
    evidences: >
      Per ISO 13857 the minimum height against climbing over is 1400 mm; robot safety fences are
      "usually 2000 mm high or higher"; at 2700 mm the over-reach term disappears; the gap at the
      bottom edge of the fence panel shall not exceed 180 mm [CERT-web].
    suitability: pass
  - source: "sources/web-snapshots/www.axelent.com_en_safety-solutions_protect_machinery-and-robots_machine-guardin.md:220-222,328,423"
    evidences: >
      X-Guard mesh panels are supplied at 2200 mm height (part numbers W322-2200xx); mesh Premium
      50 x 20 mm or Classic 50 x 30 mm, and "the Classic 50x30 mesh requires a minimum distance of
      200 mm"; 30 x 20 mm panel frame; standard colour black RAL 9011 [CERT-web].
    suitability: pass
  - source: "sources/web-snapshots/en.wikipedia.org_wiki_Spot_welding.md:595,600-611"
    evidences: >
      The C-type gun has COLLINEAR electrodes and is used "due to the high applying forces"; the
      X-type moves its electrodes on non-collinear, scissor-like paths; electrodes are copper alloy
      and water-cooled through "coolant holes in the center of the electrodes" [CERT-web].
    suitability: pass

dimensions_real:
  # CONFIDENCE DISCIPLINE (Block 63 §63.4): robot envelope and guard rules are published; the cell
  # plan, the gun body and the fixture are not.
  robot_reach_m:      {value: 2.65,  confidence: high}   # [CERT-doc] IRB 6700-235/2.65
  robot_payload_kg:   {value: 235,   confidence: high}   # [CERT-doc]
  robot_mass_kg:      {value: 1250,  confidence: high}   # [CERT-doc]
  ax1_radius_front_m: {value: 0.532, confidence: high}   # [CERT-doc]
  ax1_radius_back_m:  {value: 0.633, confidence: high}   # [CERT-doc]
  base_bolts:         {value: 12,    confidence: high}   # [CERT-doc] 12 x M24
  guard_panel_h_m:    {value: 2.20,  confidence: high}   # [CERT-web] supplied panel height
  guard_min_h_m:      {value: 1.40,  confidence: high}   # [CERT-web] ISO 13857 anti-climb minimum
  guard_floor_gap_m:  {value: 0.18,  confidence: high}   # [CERT-web] maximum
  mesh_cell_m:        {value: [0.050, 0.030], confidence: high}  # [CERT-web] Classic 50 x 30 mm
  guard_frame_m:      {value: [0.030, 0.020], confidence: high}  # [CERT-web] 30 x 20 mm tube
  guard_panel_w_m:    {value: 1.20,  confidence: low}    # [INFER] width not decoded from the part numbers
  cell_x_m:           {value: 7.20,  confidence: low}    # [INFER] derived, not published
  cell_z_m:           {value: 6.00,  confidence: low}    # [INFER]
  link2_m:            {value: 1.05,  confidence: low}    # [INFER] chosen inside the 2.65 m reach
  link3_m:            {value: 1.00,  confidence: low}    # [INFER]
  fixture_h_m:        {value: 0.90,  confidence: low}    # [INFER]
  fixture_plan_m:     {value: [1.90, 1.15], confidence: low}   # [INFER]

hierarchy:
  - name: root
    children:
      - name: pad             # cell floor slab
        pivot: [0, 0, 0]
        animation: none
      - name: fence           # 22 instanced posts + 21 instanced bays (frame bars + alpha mesh) + 1 gate
        pivot: [0, 1.28, 0]
        animation: none
      - name: jig             # fixture frame, legs, sub-plate, 4 locating pins, 4 toggle clamps, workpiece
        pivot: [0, 0.90, 0]
        animation: none
      - name: robots
        children:
          - name: robot       # ONE per arm, FLOOR MOUNTED on the certified base plate
            children:
              - name: j1      # axis 1 turret. Base casting plan = 532 mm front + 633 mm back
                pivot: [0, 0.405, 0]
                animation: revolute_y
              - name: j2      # axis 2 shoulder — lower arm extends along local +Y
                pivot: [0, 0.500, 0]
                animation: revolute_z
              - name: j3      # axis 3 elbow — upper arm extends along local +X
                pivot: [0, 1.050, 0]
                animation: revolute_z
              - name: j5      # axis 5 wrist bend — carries the flange and the gun
                pivot: [1.000, 0, 0]
                animation: revolute_z
              - name: gun     # C-type weld gun; electrode axis at gun-local x = 0.42
                pivot: [0.200, 0, 0]
                animation: linear_electrode
                attachment: {parent_socket: tool_flange, contact_type: bolted, gap_tolerance: 0.001}
      - name: reachRings      # the THEORETICAL 2.65 m envelope, off by default
        pivot: [0, 0.012, 0]
        animation: none
      - name: cabinets        # 2 controllers + 1 weld timer, all OUTSIDE the guard
        pivot: [-4.35, 0.55, 0]
        animation: none

materials:
  - id: robot-orange
    family: painted-metal
    color: "#d9610f"
    metalness: 0.0             # painted arm casting -> dielectric (HANDBOOK §3.1)
    roughness: 0.48
    evidence: "[INFER] ABB house colour; coated => metalness 0"
    confidence: 0.7
  - id: robot-graphite
    family: painted-metal
    color: "#484f56"
    metalness: 0.0
    roughness: 0.55
    evidence: "[INFER] base casting / wrist housing"
    confidence: 0.7
  - id: guard-ral9011
    family: painted-metal
    color: "#1a1c1f"
    metalness: 0.0
    roughness: 0.65
    evidence: "[CERT-web] Axelent standard panel colour black RAL 9011; coated => metalness 0"
    confidence: 0.8
  - id: electrode-copper
    family: bare-metal
    color: "#b1642c"
    metalness: 0.90
    roughness: 0.30
    evidence: "[CERT-web] electrodes are 'a low resistance alloy, usually copper'. This is the ONLY copper in the scene — clamp pads are urethane so the weld point is unambiguous."
    confidence: 0.85
  - id: fixture-blue
    family: painted-metal
    color: "#2f4a63"
    metalness: 0.0
    roughness: 0.58
    evidence: "[INFER] painted tooling steel"
    confidence: 0.6
  - id: biw-steel
    family: bare-metal
    color: "#9aa1a6"
    metalness: 0.75
    roughness: 0.55
    evidence: "Block 63 §63.6 — same bare unpainted body steel as the `carroceria` asset"
    confidence: 0.75

critical_features:
  - id: collinear-electrodes
    desc: >
      The gun is unmistakably a C-TYPE: both electrodes sit on ONE vertical axis, the moving tip
      directly above the fixed tip, with the C-arm reaching UNDER the workpiece to carry the lower
      one. Scissor-like, non-collinear tips would make it an X-type — a different tool.
    threshold: 0.80
  - id: guard-proportions
    desc: >
      The guard reads as 2200 mm mesh panels in a 30 x 20 mm frame on posts, standing off the floor by
      no more than 180 mm, with fine 50 x 30 mm mesh you can see through. A solid or waist-high fence
      is wrong; so is a mesh that disappears at viewing distance.
    threshold: 0.80
  - id: robot-is-floor-mounted
    desc: >
      Each arm sits DIRECTLY on the floor on its circular base plate with a 12-bolt ring — no pedestal
      — because the product specification allows only floor mounting for this variant.
    threshold: 0.75
  - id: reach-vs-guard
    desc: >
      With ALCANCE on, the 2.65 m envelope visibly crosses the guard line. That is not an error: a real
      cell restricts axis 1 mechanically (IRB 6700 PS §1.3.4) instead of pushing the fence out to the
      full theoretical envelope. The asset shows the difference rather than hiding it.
    threshold: 0.70
  - id: tool-clears-the-fixture
    desc: >
      The weld points sit just outboard of the fixture sub-plate so the C-arm's lower leg passes UNDER
      it to reach the panel underside. A gun buried in the fixture is the failure this constraint exists
      to prevent.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 140
    tris: 12000

camera:
  azimuth_deg: 74.5          # deliberately NOT along the robot-to-robot axis, which would hide one arm
  elevation_deg: 21
  fov: 38
  target_y_m: 1.15
  radius_m: 12.2

lighting: house-rig + vertical-subject fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DOCUMENTED DEVIATION (Block 63 §63.7): the guard is a 2.2 m tall vertical plane and the cabinets
  # are vertical painted metal, so they read flat under the stock rig. Two DirectionalLights are aimed
  # along their normals (+Z 0.95, -Z 0.75) and environmentIntensity goes 1.9 -> 2.2.
  # Second deviation, mesh infill: the guard uses a BLENDED alphaMap, not alphaTest. At 12 m the
  # mipmapped wire coverage averages ~14 %, which alphaTest 0.30 discards outright — the guard would
  # disappear exactly where it must read. Blending keeps it as a veil far away and as wires up close.

known_view_limit:
  # State audit against the ONBOARD gotcha list. Same call as robotica/celda-robotizada: the guard really
  # does occlude the machine it guards, and that is what a guard is for.
  - "the perimeter mesh overlays both arms from every exterior angle; use VALLA to inspect the machine"
  - "the far-side panels read through the near-side mesh; this is the real moire of a mesh guard, not aliasing"
  - "ALCANCE draws the THEORETICAL 2.65 m axis-1 envelope, which crosses the guard line on purpose. It is a
     reach annotation, not a swept volume: a real cell restricts axis 1 mechanically (IRB 6700 PS 1.3.4).
     See the reach-vs-guard critical_feature."
  - "UTILLAJE off leaves both guns closed on empty air. Inspection state: it exposes the approach paths and
     the C-arm clearance under the sub-plate, and must not be graded as a weld the robots are performing."

ui_controls:
  - "AUTO-ROTATE"
  - "VALLA"          # the mesh guard
  - "ALCANCE 2.65 m" # theoretical axis-1 envelope of each arm (off by default)
  - "UTILLAJE"       # fixture + workpiece, so the arms and their approach paths are exposed

colorTarget:
  # MEASURED from the rendered robot lower arm (headless SwiftShader capture at 1280x800), then frozen
  # as the regression anchor. Not a guessed value.
  srgb: [247, 157, 62]
  deltaE00Max: 8
  crop: "20x8+440+355"   # flat lit face of the left arm's lower link, at 1280x800
