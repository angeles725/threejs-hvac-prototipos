# DesignSpec — C-segment hatchback BODY IN WHITE on a body-shop skid
# Dimensional evidence: research/threejs-block63.md §63.2 — the Volkswagen Golf Mk8 exterior envelope
# (preserved Wikipedia infobox snapshot) plus the BIW definition itself, which is what decides what
# must NOT be in this asset.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: carroceria
family: automotriz
track: needs-research        # research closed by [Block 63]; build is procedural
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # panel gauge (~1 mm) is material, not a voxel

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 17 -> complex.
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 1,
           material_layers: 1, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex
  notes: >
    The hardest asset of the family. silhouette 3: a BIW is recognised by its APERTURES, so the
    negative space carries the identity. occlusion 3: with the closures absent you see straight
    through the shell into the floor pan, tunnel and wheel houses, so interior structure that would
    normally be hidden is on show and cannot be faked. repetition 1: left/right is MIRROR SYMMETRY,
    not repetition — geometries are shared between the two sides, and InstancedMesh is deliberately
    NOT used (block54 §2.3 applies to real repeats).

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block63.md
  reuse_pointers:
    holed_polygon: "block47 — the wheel-arch cut is an ExtrudeGeometry from a Shape (earcut path)"
    render_on_demand: "block56 — render gated behind needsRender"

references:
  - source: "sources/web-snapshots/en.wikipedia.org_wiki_Body_in_white.md:585-590"
    evidences: >
      BIW is the stage "before painting and before the motor, chassis sub-assemblies, or trim (glass,
      door locks/handles, seats, upholstery, electronics, etc.)" are fitted [CERT-web]. Therefore:
      no glass, no trim, no lamps, no seats, no paint — and the apertures are HOLES.
    suitability: pass
  - source: "sources/web-snapshots/en.wikipedia.org_wiki_Volkswagen_Golf_Mk8.md:416 (infobox)"
    evidences: >
      Length 4284 mm (hatchback), width 1789 mm, height 1456 mm, wheelbase 2636 mm [CERT-web] —
      C-segment, MQB Evo, 5-door.
    suitability: pass
  - source: "research/threejs-block63.md §63.2"
    evidences: >
      The derived numbers and the failure mode: overhang split ~53/47, roof-rail width ~1.25 m against
      a 1789 mm shoulder. "A BIW modelled as a constant-width box is the single most recognisable
      error" — the greenhouse must be markedly narrower than the body sides.
    suitability: pass
  - source: "research/threejs-block63.md §63.5"
    evidences: >
      The skid is one of the three named General Assembly / body-shop carrier families (skillet, skid,
      pallet), which is why the BIW is presented on one rather than floating.
    suitability: pass

dimensions_real:
  # CONFIDENCE DISCIPLINE (Block 63 §63.2): the finished-car envelope is published; the sheet-metal
  # topology inside it is not. Pillar sections, beading and rail sections are all `low`.
  length_m:        {value: 4.284, confidence: high}   # [CERT-web] hatchback
  width_m:         {value: 1.789, confidence: high}   # [CERT-web]
  height_m:        {value: 1.456, confidence: high}   # [CERT-web] hatchback
  wheelbase_m:     {value: 2.636, confidence: high}   # [CERT-web]
  front_overhang_m: {value: 0.870, confidence: med}   # [INFER] 53/47 split of the 1648 mm of overhang
  rear_overhang_m: {value: 0.780, confidence: med}    # [INFER]
  roof_rail_z_m:   {value: 0.600, confidence: low}    # [INFER] half-width; ~1.25 m greenhouse
  beltline_y_m:    {value: 0.950, confidence: low}    # [INFER]
  underbody_y_m:   {value: 0.320, confidence: low}    # [INFER] rocker underside at ride height
  wheel_arch_r_m:  {value: 0.415, confidence: low}    # [INFER]
  rocker_section_m: {value: 0.095, confidence: low}   # [INFER] closed box section width
  panel_gauge_m:   {value: 0.020, confidence: low}    # [INFER] modelled gauge, not sheet gauge
  skid_length_m:   {value: 3.900, confidence: low}    # [INFER] carrier, not published

hierarchy:
  - name: root
    children:
      - name: quarters        # rear quarter panels, ONE ExtrudeGeometry shared L/R, wheel-arch cut in the outline
        pivot: [0, 0.32, 0]
        animation: none
      - name: rockers         # closed box sections, the lower edge of both door apertures
        pivot: [0, 0.40, 0]
        animation: none
      - name: floor           # pan, centre tunnel, 2 seat crossmembers, rear load floor, seat-pan riser
        pivot: [0, 0.345, 0]
        animation: none
      - name: front           # longitudinal rails, strut towers, apron rails, radiator support FRAME,
        pivot: [1.0, 0.60, 0] # bumper beam, dash/firewall, cowl top. NO outer fender: it is a bolt-on part.
        animation: none
      - name: rear            # rear rails, rear panel, bumper beam, parcel shelf + its crossmember
        pivot: [-1.7, 0.55, 0]
        animation: none
      - name: houses          # 4 half-shell wheel houses (DoubleSide — an open shell, own material)
        pivot: [0, 0.32, 0]
        animation: none
      - name: greenhouse      # A / B / D pillars with real tumblehome, roof rails, headers
        pivot: [-0.6, 1.20, 0]
        animation: none
      - name: roofPanel
        pivot: [-0.64, 1.45, 0]
        animation: none
      - name: skid            # body-shop carrier: 2 side beams, 3 cross beams, 4 locator posts + pads
        pivot: [0, 0.20, 0]
        animation: none
        attachment: {parent_socket: rocker_underside, contact_type: locator_pad, gap_tolerance: 0.003}

materials:
  - id: biw-steel
    family: bare-metal
    color: "#9aa1a6"
    metalness: 0.75            # zinc-coated, UNPAINTED and un-primed: duller and greyer than 304
    roughness: 0.55
    evidence: "Block 63 §63.6; the BIW definition forbids paint, and the stainless read (0.9/0.30) would make it a chrome show car"
    confidence: 0.75
  - id: biw-structure
    family: bare-metal
    color: "#8e9599"
    metalness: 0.75
    roughness: 0.60            # rails, towers, crossmembers — same steel, more textured/stamped
    evidence: "[INFER] same coating, heavier forming"
    confidence: 0.7
  - id: skid-paint
    family: painted-metal
    color: "#c27a2a"
    metalness: 0.0             # painted carrier steel -> dielectric (HANDBOOK §3.1)
    roughness: 0.62
    evidence: "[INFER] plant carriers are painted a high-visibility colour; coated => metalness 0"
    confidence: 0.6
  - id: locator-pad
    family: rubber
    color: "#1d2124"
    metalness: 0.0
    roughness: 0.88
    evidence: "[INFER] non-marking pad between carrier and rocker; dielectric"
    confidence: 0.6

critical_features:
  - id: apertures-are-holes
    desc: >
      Door, windscreen, backlight and tailgate openings are EMPTY. You see through the shell into the
      floor pan, tunnel and wheel houses. Any glazing, door skin, bonnet or tailgate present would
      disqualify the asset as a body in white.
    threshold: 0.85
  - id: tumblehome
    desc: >
      The greenhouse is markedly narrower than the body sides: pillars run from a ~0.88 m half-width
      base to a ~0.60 m half-width roof rail. A constant-width box reads instantly wrong.
    threshold: 0.80
  - id: front-is-framework
    desc: >
      Forward of the hinge pillar the BIW is open structure — longitudinal rails, strut towers, apron
      rails, a radiator support FRAME, a bumper beam and the wheel house — with NO outer fender skin,
      because the fender is a bolt-on panel and not part of the body in white.
    threshold: 0.75
  - id: on-a-carrier
    desc: >
      The shell rests on a body-shop skid via four locator pads under the rockers, not on wheels and
      not floating. A BIW has no suspension yet.
    threshold: 0.70

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80
    tris: 12000

camera:
  azimuth_deg: 50
  elevation_deg: 19
  fov: 38
  target_y_m: 0.85
  radius_m: 6.4

lighting: house-rig + vertical-subject fill
  # DOCUMENTED DEVIATION (Block 63 §63.7, inherited from Block 57): the quarter panels, rear panel and
  # firewall are large VERTICAL bare-steel planes and read flat grey under the stock rig. Two
  # DirectionalLights are aimed along their normals (+Z 1.05, -Z 0.80) and environmentIntensity goes
  # 1.9 -> 2.2. Metalness/roughness are UNCHANGED.

known_view_limit:
  # State audit against the ONBOARD gotcha list. A BIW has no suspension yet, so every state that
  # removes its carrier is an inspection state by construction.
  - "SKID off leaves the shell unsupported in mid-air. A body in white ALWAYS sits on a carrier at this
     stage — it has no wheels and no suspension — so this state exists to inspect the underbody and must
     not be graded as a physical configuration."
  - "PISO off removes the floor pan, tunnel and crossmembers to expose the underbody structure. Inspection
     only: a shell with no floor pan is not a stage any body shop produces."
  - "You see straight through the shell to the far body side. That is CORRECT and is the identity of the
     asset (the closures are absent), not a missing-geometry defect."

ui_controls:
  - "AUTO-ROTATE"
  - "TECHO"     # roof panel off -> the roof rails, headers and pillar ring are exposed
  - "PISO"      # floor pan + tunnel + crossmembers off -> the underbody structure reads
  - "SKID"      # the body-shop carrier

colorTarget:
  # MEASURED from the rendered rear quarter panel (headless SwiftShader capture at 1280x800), then
  # frozen as the regression anchor. Not a guessed value.
  srgb: [132, 142, 154]
  deltaE00Max: 8
  crop: "30x10+300+380"   # clean rear quarter skin, above the wheel arch, at 1280x800
