# DesignSpec — ribbon blender (double helical ribbon agitator in a U-trough), ~1 m3
# Evidence: research/sources/B59-proceso-dims/ribbon-blender-proportions.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# Third asset in this group whose sources give PROPORTIONS rather than metres — and the third time
# that turns out to be the stronger kind of evidence, because the proportions are what make the
# machine work. Here one of them is not even a number: it is which way the two helices are wound.

design: mezcladora-industrial
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 3, occlusion: 3, action_readiness: 2}
  tier: complex
  notes: >
    The agitator is four counter-wound helical ribbons on one shaft, each a swept band rather than a
    tube, so they are generated as parametric strips. Occlusion 3: the agitator lives inside a closed
    trough, so TAPA and CORTE carry the asset exactly as PANELES carries compresor-tornillo.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/ribbon-blender-proportions.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3 — brushed 304 stainless 0.9-1.0 / 0.30-0.34"
    sibling_spec: "disenos/catalog/proceso/tolva-dosificador/design-spec.yaml — same swept-helix technique"
    lighting_note: "memory: downward-facing-metal — the trough's inner surface faces UP, so it lights well"

references:
  - source: "research/sources/B59-proceso-dims/ribbon-blender-proportions.md (mixers.com scale-up + destomy design guide)"
    evidences: >
      Ribbon pitch : agitator diameter = 1:1. Outer ribbon width ~10 % of diameter. Inner ribbon
      wider in proportion and positioned "about halfway between the outer ribbon and the center
      shaft". Ribbon-to-trough clearance 3-5 mm for standard powders. U-shaped trough with a
      horizontal agitator.
    suitability: pass
  - source: "same file (chemicalprocessing.com) — the counter-pitch rule"
    evidences: >
      "The Outer Ribbon is pitched to move the material from the ends of the trough toward the
      center discharge valve, while the Inner Ribbon is pitched in the opposite direction, moving
      the material from the center back toward the ends." Two consequences that drive the geometry:
      the OUTER ribbon must reverse hand at mid-length so both halves drive inward, and the INNER
      ribbon must be wound against it. Four ribbon segments, not two.
    suitability: pass
  - source: "absolute sizing — chosen, not measured"
    evidences: >
      Trough Ø1.10 m x 1.80 m long, shaft Ø90 mm, drive, discharge valve and bearing/seal
      arrangement are all [INFER], scaled to roughly a 1 m3 working volume. No source fixes them.
    suitability: partial

dimensions_real:
  trough_d_m:        {value: 1.100, confidence: low}    # [INFER] design choice
  trough_len_m:      {value: 1.800, confidence: low}    # [INFER]
  pitch_m:           {value: 1.100, confidence: high}   # [CERT-web] pitch : diameter = 1:1
  outer_ribbon_w_m:  {value: 0.110, confidence: high}   # [CERT-web] ~10 % of diameter
  outer_ribbon_r_m:  {value: 0.546, confidence: high}   # [CERT-web] derived from the 4 mm clearance
  clearance_m:       {value: 0.004, confidence: high}   # [CERT-web] 3-5 mm for standard powders
  inner_ribbon_w_m:  {value: 0.120, confidence: med}    # [CERT-web] proportionally wider than outer
  inner_ribbon_r_m:  {value: 0.270, confidence: high}   # [CERT-web] "halfway between outer and shaft"
  shaft_d_m:         {value: 0.090, confidence: low}    # [INFER]
  axis_y_m:          {value: 1.050, confidence: low}    # [INFER] trough centreline height

hierarchy:
  - name: root
    children:
      - name: frame        # legs, base rails
        pivot: [0, 0, 0]
        animation: none
      - name: trough       # U-shell, end walls, discharge valve
        pivot: [0, 1.05, 0]
        animation: none
      - name: lid          # top cover with inspection hatches — removable (TAPA)
        pivot: [0, 1.35, 0]
        animation: none
      - name: agitator     # shaft + 4 counter-wound ribbons + support arms; spins when MEZCLANDO
        pivot: [0, 1.05, 0]
        animation: spin-x
      - name: drive        # gearmotor, coupling guard, bearings and shaft seals
        pivot: [-1.15, 1.05, 0]
        animation: none

materials:
  - id: shell-stainless
    family: bare-metal
    color: "#c6cbcd"
    metalness: 0.92
    roughness: 0.32
    evidence: "HANDBOOK §3 brushed 304 stainless — product contact"
    confidence: 0.85
  - id: ribbon-stainless
    family: bare-metal
    color: "#b8bec1"
    metalness: 0.92
    roughness: 0.34
    evidence: "ribbons and shaft, same 304, marginally duller so they separate from the trough"
    confidence: 0.85
  - id: drive-grey
    family: painted-metal
    color: "#4e565c"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted gearmotor and bearing housings — dielectric"
    confidence: 0.8
  - id: frame-dark
    family: painted-metal
    color: "#343b40"
    metalness: 0.0
    roughness: 0.6
    evidence: "painted support frame"
    confidence: 0.75
  - id: guard-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0
    roughness: 0.6
    evidence: "coupling guard — a rotating coupling must be guarded; house convention"
    confidence: 0.75

critical_features:
  - id: ribbons-counter-wound
    desc: >
      THE feature. Outer ribbon drives material from both ends toward the centre discharge; inner
      ribbon drives it back out toward the ends. That means the outer helix reverses hand at
      mid-length and the inner is wound against it — four segments in total. Two same-hand helices
      look completely plausible and would just auger everything to one end.
    threshold: 0.85
  - id: pitch-equals-diameter
    desc: >
      One full ribbon turn per 1.10 m of shaft, matching the 1:1 pitch-to-diameter rule. A visibly
      tighter or looser helix is a different machine.
    threshold: 0.75
  - id: ribbon-sweeps-the-trough
    desc: >
      The outer ribbon runs 4 mm off the trough wall over the whole U. A visible gap means dead
      product on the wall, which is the failure the tight clearance exists to prevent.
    threshold: 0.80
  - id: ribbons-are-bands-not-rods
    desc: >
      Ribbons read as flat radial BANDS on support arms, not as round bar or tube. Section shape is
      what makes it a ribbon blender rather than a paddle or auger mixer.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 65          # measured 59 (double-start ribbons add 4 draws over the single-start build)
    tris: 260000       # measured 2,154

camera:
  azimuth_deg: 46
  elevation_deg: 16
  fov: 38
  target_y_m: 1.00
  radius_m: 4.60

lighting: house-rig-plus-fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # Camera-side fill + environmentIntensity 2.4. Note the contrast with tolva-dosificador: the
  # trough's working surface is concave and faces UP, so it catches the key and does not hit the
  # downward-facing-metal limit recorded there.

ui_controls:
  - "AUTO-ROTATE"
  - "MEZCLANDO"                # spins the agitator
  - "TAPA"                     # lid on/off — the state the asset exists for
  - "CORTE"                    # translucent trough to show the ribbons sweeping the U

colorTarget:
  # MEASURED from the rendered trough shell (headless SwiftShader capture at 1280x800).
  srgb: [71, 77, 81]
  deltaE00Max: 8
  crop: "24x24+640+300"   # lid, default camera at 1280x800 — with the machine closed the lid is
  # the largest continuous stainless surface in frame.
  # CROSS-CHECK from the lid-off capture, and it corroborates tolva-dosificador from the other side:
  #   trough INNER face (concave, faces UP)   91,96,99  <- brightest, as the spec predicted
  #   trough OUTER face (convex, faces DOWN)  56,60,62  <- the downward-face limit again
  # Same material, same rig, 35 sRGB apart purely by face orientation.
