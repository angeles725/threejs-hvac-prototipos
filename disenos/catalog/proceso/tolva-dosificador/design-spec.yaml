# DesignSpec — mass-flow hopper with loss-in-weight screw feeder
# Evidence: research/sources/B59-proceso-dims/mass-flow-hopper-screw-feeder.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# Like tanque-agitador, the sources fix GEOMETRY RULES rather than absolute dimensions — but here
# the governing rule is an ANGLE and a screw profile, not a ratio. The metre values are a design
# choice and are labelled as such.

design: tolva-dosificador
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 1, detail: 2, occlusion: 2, action_readiness: 2}
  tier: moderate
  notes: >
    The silhouette is the asset: a converging transition from a square section to a long narrow slot
    is not a cone, and building it as a cone would break the one thing the evidence actually pins
    down. The screw flighting is the only real repetition and is built as a swept helix.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/mass-flow-hopper-screw-feeder.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3 — brushed 304 stainless 0.9-1.0 / 0.30-0.34"
    sibling_spec: "disenos/catalog/proceso/tanque-agitador/design-spec.yaml — same 'ratios not metres' pattern"

references:
  - source: "research/sources/B59-proceso-dims/mass-flow-hopper-screw-feeder.md (hopper wall angle)"
    evidences: >
      "Walls sloped 15 to 20 degrees from vertical are usually sufficient to allow mass flow even if
      the bulk material has high wall friction" — i.e. 70-75 degrees from horizontal. BOTH converging
      directions of the transition are held at or above 70 degrees here (76.8 along the slot, 70.0 across it — the across wall governs), so the criterion is met on the axis facing away from the camera too.
    suitability: pass
  - source: "same file (KWS mass-flow screw feeder geometry)"
    evidences: >
      "a combination of variable pitch and tapered inside diameter, with a tapered cone located on
      the center pipe of the screw from the rear of the inlet opening to approximately the center of
      the inlet opening"; "material must be drawn down evenly along the entire length of the inlet
      opening". This is a SHAPE fact: a constant-pitch auger under a long slot draws only from the
      back of the opening, so a uniform screw here is not a simplification, it is a different and
      non-functioning machine.
    suitability: pass
  - source: "absolute sizing — chosen, not measured"
    evidences: >
      Hopper 0.90 m square by 0.55 m straight plus a 0.96 m transition to a 0.45 x 0.20 m slot,
      screw 160 mm diameter, trough 1.12 m, and the loss-in-weight load cells are all [INFER],
      sized as a plausible small dosing unit. No source in reach fixes them.
    suitability: partial

dimensions_real:
  hopper_top_m:      {value: [0.900, 0.900], confidence: low}   # [INFER] design choice
  hopper_straight_m: {value: 0.550, confidence: low}            # [INFER]
  transition_h_m:    {value: 0.960, confidence: med}            # [INFER] set BY the angle rule below
  outlet_slot_m:     {value: [0.450, 0.200], confidence: med}   # [INFER] long slot, per the feeder rule
  wall_angle_along_deg:  {value: 76.8, confidence: high}        # [CERT-web] >= 70 from horizontal
  wall_angle_across_deg: {value: 70.0, confidence: high}        # [CERT-web] the GOVERNING wall: shallowest
  screw_od_m:        {value: 0.160, confidence: low}            # [INFER]
  screw_pitch_m:     {value: [0.060, 0.150], confidence: med}   # [CERT-web] VARIABLE along the inlet
  trough_len_m:      {value: 1.120, confidence: low}            # [INFER]
  screw_axis_y_m:    {value: 0.520, confidence: low}            # [INFER]

hierarchy:
  - name: root
    children:
      - name: frame          # 4 legs, base plates, load cells
        pivot: [0, 0, 0]
        animation: none
      - name: hopper         # straight section + the square-to-slot transition
        pivot: [0, 0, 0]
        animation: none
      - name: trough         # feeder tube, inlet slot, discharge spout
        pivot: [0, 0.52, 0]
        animation: none
      - name: screw          # centre pipe, taper cone, variable-pitch flighting; spins when DOSIFICANDO
        pivot: [0, 0.52, 0]
        animation: spin-x
      - name: drive          # gearmotor at the tail end
        pivot: [-0.70, 0.52, 0]
        animation: none

materials:
  - id: shell-stainless
    family: bare-metal
    color: "#c6cbcd"
    metalness: 0.92
    roughness: 0.32
    evidence: "HANDBOOK §3 brushed 304 stainless — hopper and trough are food/bulk contact"
    confidence: 0.85
  - id: screw-stainless
    family: bare-metal
    color: "#b6bcbf"
    metalness: 0.92
    roughness: 0.36
    evidence: "screw flighting and centre pipe, same 304, slightly duller"
    confidence: 0.85
  - id: drive-grey
    family: painted-metal
    color: "#4e565c"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted gearmotor housing — dielectric"
    confidence: 0.8
  - id: frame-dark
    family: painted-metal
    color: "#343b40"
    metalness: 0.0
    roughness: 0.6
    evidence: "painted support frame, darker so the stainless reads against it"
    confidence: 0.75
  - id: loadcell-steel
    family: bare-metal
    color: "#9aa0a3"
    metalness: 0.88
    roughness: 0.40
    evidence: "load cells and their mounts — the loss-in-weight principle made visible"
    confidence: 0.7

critical_features:
  - id: walls-steep-enough-on-both-axes
    desc: >
      Every converging wall stands at 70 degrees or more from horizontal. Meeting the angle on the
      visible face while letting the hidden face flatten out would look identical from the spec
      camera and be wrong.
    threshold: 0.80
  - id: outlet-is-a-slot-not-a-cone
    desc: >
      The hopper converges to a LONG NARROW SLOT matching the feeder inlet, not to a round or square
      spout. The slot is what lets the screw draw along the whole opening.
    threshold: 0.80
  - id: variable-pitch-over-the-inlet
    desc: >
      Flight pitch increases from the rear of the inlet to its front, over a tapered cone on the
      centre pipe. Constant pitch draws only from the back of the slot and ratholes the hopper —
      the machine would be wrong even though it would render fine.
    threshold: 0.80
  - id: weighed-not-just-supported
    desc: >
      The unit stands on load cells, not plain feet — that is what makes it loss-in-weight rather
      than a plain volumetric feeder.
    threshold: 0.70

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 45          # measured 38
    tris: 200000       # measured 4,550

camera:
  azimuth_deg: 46
  elevation_deg: 12
  fov: 38
  target_y_m: 1.05
  radius_m: 4.30

lighting: house-rig-plus-fill
  # Deviation as for the other stainless vessels: large bright metal planes, camera-side fill and
  # environmentIntensity 2.5. metalness unchanged.

ui_controls:
  - "AUTO-ROTATE"
  - "DOSIFICANDO"              # spins the screw
  - "CORTE"                    # translucent trough + hopper to expose the screw and the taper cone
  - "COTAS"                    # marks the 70 deg wall angle

colorTarget:
  # MEASURED from the rendered stainless hopper wall (headless SwiftShader capture at 1280x800).
  srgb: [95, 101, 105]
  deltaE00Max: 8
  crop: "24x24+470+180"   # straight hopper section at 1280x800, default camera
  # The anchor is on the STRAIGHT section, not the cone, and that choice is the finding: the
  # converging walls measure 59,63,67 / 43,46,49 because their normals point DOWNWARD (measured
  # y = -0.34, -0.23) and a metal is lit by what it reflects. A camera above the horizon can never
  # see the key reflected off a downward face. Extra fills gained +7 sRGB; a bounce card in the
  # PMREM scene did nothing (RoomEnvironment occludes it) or blew out the map. Recorded as a
  # measured limit rather than papered over by lowering metalness.
  screw_tube_reference: [181, 185, 188]   # same material, cylindrical — proves the rig is fine
