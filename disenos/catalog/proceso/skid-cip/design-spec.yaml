# DesignSpec — CIP skid (Clean-In-Place station), 2-tank LINEAR format, 600 L class
# Catalog family `proceso`. Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# WHY THE 600 L CLASS, AND WHY LINEAR — this is the load-bearing decision of the spec.
# The sources publish TWO distinct skid formats, not one:
#   · LINEAR (Suncombe, Ullmer): tanks in a row, L 3.2-4.5 m, W 1.0-1.25 m, H 1.8-2.2 m, H/L 0.45-0.57
#   · TOWER  (Sartorius, Marlo): one tank over a pump bay, L ~= W ~= 1.2-2.7 m, H 2.2-2.8 m, H/L ~= 1.0
# The linear 600 L row (3.200 x 1.000 x 1.800 m) is the only PUBLISHED envelope that CLOSES
# arithmetically with two vertical tanks over an under-deck pump bay:
#     barrel 1.057 + Klopper head 0.164 + 15 deg cone 0.114 = 1.335 m tank
#     upper deck 0.450 + 1.335                              = 1.785 m <= 1.800 m published  OK
# The 1000 L row of the SAME table does NOT close: 1000 L at D 0.93 needs a 1.472 m barrel, so the
# tank alone is ~1.8 m and leaves zero height for the pump bay under it. Modelling that row would
# have produced a physically impossible arrangement that no gate, count or screenshot can detect
# (ONBOARD-SESSION.md: "DISPOSICION fisicamente imposible pasa sin que nada la detecte").
# The check is one line of arithmetic and it is recorded here so the next session does not redo it.

design: skid-cip
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 3, detail: 3, occlusion: 2, action_readiness: 1}
  tier: complex
  notes: >
    Scored 19 = complex, and the drivers are honest ones. COMPONENTS and MATERIAL_LAYERS are 3
    because a CIP skid is a plant in miniature: two vessels, three pump sets, a valve train, an
    instrument set and a control cabinet, across brushed stainless / painted motor / EPDM / glass.
    OCCLUSION is 2 because the pump bay lives UNDER the tank deck and is shadowed by it — the
    house camera looks down at 14-18 deg, so the bay needs standoff or it reads as a dark slot.
    REPETITION is only 2: the 8 adjustable feet and the tri-clamp collars are the sole instanced
    runs; every vessel, pump and valve body is a unique mesh.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    onboard: disenos/catalog/ONBOARD-SESSION.md
    dimensional_evidence: research/sources/B101-cip-dims/
    # Block B101 assigned by session-A from the proceso range B100-B119 (B100 went to
    # empacadora-flowwrap). The 9 manufacturer PDFs + the measured photograph were COPIED into that
    # folder BEFORE this path was written here. That order is the point: a spec that cites a
    # sources/ path which was never promoted leaves every citation resolving to a file that does not
    # exist, and nothing in the gate can see it.
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — brushed 304/316L bare metal 0.9-1.0; PAINTED motor = dielectric 0.0"
    stainless_recipe: "~/.claude/skills/design3d/library/materials-textures/brushed-stainless-recipe.md — env 2.15 + HemisphereLight + frontal fill; bare metal reads BLACK without it"
    sibling_spec: "disenos/catalog/fluidos/bomba-centrifuga/design-spec.yaml — painted-casting-vs-bare-metal framing and the per-dimension confidence convention"
    head_solver: "disenos/catalog/proceso/tanque-agitador/design-spec.yaml — DIN 28011 Klopper head profile, REUSED here (see references: it was validated on a different vessel, so it is carried at med, not presented as new evidence)"

references:
  - source: "research/sources/B101-cip-dims/suncombe.pdf — Suncombe CIP+Plus Datasheet v4.0 (https://suncombe.com/files/cleaning-in-place/cip-plus-.pdf)"
    evidences: >
      THE load-bearing source. Publishes a real dimension table whose caption states "Dimensions with
      2 tanks, one chemical and one rinse": 600 L -> 3.200 x 1.000 x 1.800 m; 1000 L -> 4.000 x 1.000
      x 1.800; 2000 L -> 4.500 x 1.250 x 2.100; 3000 L -> 5.000 x 1.500 x 2.350; 10000 L -> 6.000 x
      2.000 x 3.000. Also: 1, 2, 3 or 4 chemical tanks available; flows 0-250 L/min (1000 L) and
      0-500 L/min (2000 L); 304 stainless framework with 316L pipework; "sanitary components with no
      threads and triclamp connections"; Siemens PLC with 6" or 12" colour HMI; utilities 400 V
      3ph+N 50 Hz >18 kW; pump roles named as Variable Duty Delivery Pump (316L, VSD + PID) plus
      Vessel Mixing Pumps (plural, one per tank).
    suitability: pass
  - source: "research/sources/B101-cip-dims/alfalaval-din-fittings-tubes.pdf — Alfa Laval DIN fittings and tubes catalogue, product 5108, EN 10357-A (DIN 11850 Reihe 2)"
    evidences: >
      The hardest numbers in the spec. OD/ID/wall in mm: DN25 29/26/1.5 · DN32 35/32/1.5 · DN40
      41/38/1.5 · DN50 53/50/1.5 · DN65 70/66/2.0 · DN80 85/81/2.0 · DN100 104/100/2.0. The
      catalogue warns explicitly that "nominal size is not always equal to inner diameter (see DN15,
      DN25, DN40, DN65 and DN80)" — DN65 bores 66 mm, DN80 bores 81 mm. Grades 1.4301/1.4307/1.4404.
      Corroborated independently: the Alfa Laval LKB butterfly-valve leaflet prints the identical
      OD/ID/t triples against its own DN column.
    suitability: pass
  - source: "research/sources/B101-cip-dims/lkh.pdf — Alfa Laval LKH Centrifugal Pumps leaflet ESE00263 (states verbatim: designed for Cleaning-in-Place)"
    evidences: >
      Pump table (mm) LKH-20: A 180, B 88, C 27, D 253, E 63; ports J1 suction 63.5 (2.5in), J2
      discharge 51 (2in). Motor table IEC 90: F(max) 262, G 157, H 288, I 434; IEC 112: F 285, G 198,
      H 359, I 497. Wetted parts W. 1.4404 (316L) — casing, impeller, impeller nut, backplate;
      elastomers EPDM; four adjustable stainless legs; stainless shroud over the motor as the
      standard option. Weight LKH-20 + 4 kW = 77 kg.
    suitability: partial
    assumptions: >
      The leaflet prints letters A-I against a line drawing with NO legend, and the drawing is vector
      art that cannot be read as text. The VALUES are certain to the millimetre; which feature each
      letter measures is INFERRED. Only F is anchored: its footnote says F "can be reduced by min.
      59 mm", and on a pump with adjustable legs the only reducible dimension is the shaft
      centreline height. Everything derived from H or I is therefore carried at LOW confidence.
  - source: "research/sources/B101-cip-dims/lkb.pdf — Alfa Laval LKB / LKB-F hygienic butterfly valve leaflet"
    evidences: >
      DN50 valve: A 61.0, C 63.0, E 46.6, F 105.7, H1 52.0, H2 92.0, J 88.0, K 120.0 mm. DN65:
      A 61.0, C 75.0, E 57.3, F 125.0, H1 62.0, H2 114.0, J 98.0, K 162.0 mm. Handle span K is what
      sets the visual footprint of a manual valve on the skid.
    suitability: pass
  - source: "research/sources/B101-cip-dims/promag.pdf — Endress+Hauser Proline Promag H 300, TI01223D (3-A + EHEDG certified)"
    evidences: >
      DN50 hygienic mag meter: bore 47.5, H 249, I 309, K 60, face-to-face L 140 mm. Transmitter
      head 200 x 141 x 59 mm. So an in-line flowmeter is a 140 mm body with a ~309 mm overall stack —
      it is a HEAD on the pipe, not a bulge in it.
    suitability: pass
  - source: "Ullmer's Dairy Equipment, Three Tank CIP Skid #3542 — https://ullmers.com/store/316-CIP-Skid-3542-p560689115"
    evidences: >
      A REAL second-hand unit, and the only source that dimensions the tanks themselves: 3 x 250 US
      gal (946 L), 38in (0.965 m) inside diameter x 54.5in (1.384 m) inside depth -> H/D 1.43;
      12 gauge (2.78 mm) 316 construction with a No.4 brushed finish INSIDE AND OUT; 304 stainless
      frame; EIGHT adjustable ball feet. Skid 152 x 39 x 86.5 in = 3.861 x 0.991 x 2.197 m.
      Cross-checks the Suncombe envelope from an independent builder.
    suitability: pass
  - source: "ASME BPE CIP velocity guidance (1.5 m/s minimum, Re >= 10,000) — industry consensus, multiple secondary sources"
    evidences: >
      The sizing bridge that fixes the pipe DN. At 1.5 m/s: DN50 carries 10.6 m3/h = 177 L/min;
      DN65 18.5 m3/h = 308 L/min; DN80 27.8 m3/h = 464 L/min. Back-solving Suncombe's PUBLISHED
      flows against the DIN 11850 bores closes two independent documents on each other: 250 L/min in
      DN65 = 1.22 m/s and 500 L/min in DN80 = 1.62 m/s, so the 1000 L class runs a DN65 main and the
      2000 L class a DN80. Scaling down, the 600 L class at ~175 L/min in DN50 = 1.49 m/s — DN50 is
      the smallest bore that still meets the 1.5 m/s floor at this duty, so it is the sized main.
    suitability: pass
  - source: "research/sources/B101-cip-dims/sartorius-cip-essential.pdf — Sartorius CIP Essential Range datasheet DIR 2648566 (10/2020), surface finish and frame"
    evidences: >
      Ra specification is what justifies the roughness value, not a guess: inner surface Ra < 0.8 um,
      welded seam area Ra < 1.6 um, OUTER surface Ra < 1.0 um. The outer figure is the one the camera
      sees. Also: "Frame design: Square pipes structure", anti-slip feet, 304L, electric immersion
      heating 2 x 12 kW (1000 L) / 2 x 18 kW (1500-2000 L).
    suitability: pass
  - source: "research/sources/B101-cip-dims/suncombe-cip-skid-photo.png — Suncombe CIP+Plus product photograph (925x827, extracted with pdfimages from suncombe.pdf), sampled with ImageMagick"
    evidences: >
      MEASURED colour, not estimated. Painted pump motor #3B4D6A (59,77,106) — two independent
      motors in the frame measured within 1 LSB of each other (#3B4D6A / #3C4D6B), shadow side
      #2B374B. Tank lit flank #C0BCAE; whole-tank block mean #D1D0CB with sd 45.7 (min 38, max 255)
      — that spread IS the finding: brushed stainless is a GRADIENT, not a colour. Cool reflection
      band #9898AB (bluer than base), horizon-side dark band #7F7C82. HMI screen face #BCD3D8.
      Also the part census: two decks, tanks above and pumps below, long-radius discharge loops,
      three dial gauges, a stainless cabinet with an E-stop on a yellow backing plate.
    suitability: conditional
    assumptions: >
      Used for COLOUR, PART CENSUS and ARRANGEMENT only — never for dimensions. The photo's own
      proportions (H/L ~ 0.90) contradict the dimension table printed in the same PDF (H/L 0.45 at
      1000 L), so it depicts a different unit. Treating it as dimensional evidence would import a
      tower-format silhouette onto a linear-format envelope.
  - source: "DIN 28011 torispherical (Klopper) head profile — crown 1.0 D, knuckle 0.1 D, depth 0.1935 D"
    evidences: >
      CARRIED OVER from disenos/catalog/proceso/tanque-agitador and utilities/tanque-pulmon, where it
      was validated against a different vessel. No CIP-tank source reached states its head profile.
      Declared here as reuse rather than as new evidence, and held at med confidence for that reason.
    suitability: conditional

dimensions_real:
  skid_l_m:            {value: 3.200, confidence: high}   # [CERT-doc] Suncombe 600 L row
  skid_w_m:            {value: 1.000, confidence: high}   # [CERT-doc] same row
  skid_h_m:            {value: 1.800, confidence: high}   # [CERT-doc] same row
  tank_count:          {value: 2,     confidence: high}   # [CERT-doc] table caption: one chemical + one rinse
  tank_vol_l:          {value: 600,   confidence: high}   # [CERT-doc] the row's class
  tank_d_m:            {value: 0.850, confidence: med}    # [CERT-a] largest bore that clears the 1.000 m frame width
  tank_barrel_h_m:     {value: 1.057, confidence: med}    # [CERT-a] 0.600 m3 / (pi/4 * 0.85^2)
  tank_head_depth_m:   {value: 0.164, confidence: med}    # [CERT-a] DIN 28011 depth 0.1935 * 0.850
  tank_cone_depth_m:   {value: 0.114, confidence: low}    # [CERT-a] 15 deg cone: (0.850/2) * tan(15)
  tank_total_h_m:      {value: 1.335, confidence: med}    # [CERT-a] barrel + head + cone
  tank_aspect_hd:      {value: 1.243, confidence: med}    # [CERT-a] inside the 1.24-1.43 observed band
  upper_deck_h_m:      {value: 0.450, confidence: low}    # [INFER] 1.800 - 1.335; forced by the envelope
  tank_wall_t_m:       {value: 0.00278, confidence: med}  # [CERT-web] Ullmer 12 gauge 316
  main_dn:             {value: "DN50", confidence: med}   # [CERT-a] 175 L/min at 1.49 m/s, ASME BPE floor
  main_od_m:           {value: 0.053, confidence: high}   # [CERT-doc] DIN 11850 DN50 OD
  main_id_m:           {value: 0.050, confidence: high}   # [CERT-doc] DIN 11850 DN50 ID
  main_wall_t_m:       {value: 0.0015, confidence: high}  # [CERT-doc] DIN 11850 DN50 wall
  branch_dn:           {value: "DN40", confidence: low}   # [INFER] dosing/branch lines step down one size
  branch_od_m:         {value: 0.041, confidence: high}   # [CERT-doc] DIN 11850 DN40 OD
  pump_count:          {value: 3,     confidence: med}    # [CERT-doc] 1 delivery + 1 mixing per tank
  pump_model:          {value: "LKH-20 / IEC 90", confidence: low}  # [INFER] IEC 90 is the frame that fits the 0.450 m bay
  pump_head_len_m:     {value: 0.253, confidence: med}    # [CERT-doc] LKH-20 column D
  pump_motor_len_m:    {value: 0.434, confidence: low}    # [INFER] LKH column I read as overall length — see gap G-1
  pump_motor_d_m:      {value: 0.157, confidence: low}    # [INFER] LKH column G read as motor body diameter
  pump_shaft_h_m:      {value: 0.262, confidence: med}    # [CERT-doc] F(max), IEC 90; anchored by its own footnote
  pump_suction_od_m:   {value: 0.0635, confidence: high}  # [CERT-doc] LKH-20 J1
  pump_discharge_od_m: {value: 0.051, confidence: high}   # [CERT-doc] LKH-20 J2
  valve_dn50_k_m:      {value: 0.120, confidence: high}   # [CERT-doc] LKB DN50 handle span K
  valve_dn50_h2_m:     {value: 0.092, confidence: high}   # [CERT-doc] LKB DN50 H2
  valve_dn50_f_m:      {value: 0.1057, confidence: high}  # [CERT-doc] LKB DN50 F
  flowmeter_face_m:    {value: 0.140, confidence: high}   # [CERT-doc] Promag H 300 DN50 face-to-face
  flowmeter_stack_m:   {value: 0.309, confidence: high}   # [CERT-doc] Promag H 300 DN50 I
  flowmeter_head_m:    {value: [0.200, 0.141, 0.059], confidence: high}  # [CERT-doc] transmitter housing
  panel_w_m:           {value: 0.760, confidence: low}    # [CERT-web] Rittal AE1014.600 — a catalogue enclosure, NOT a CIP-specific panel
  panel_h_m:           {value: 0.760, confidence: low}    # [CERT-web] same
  panel_d_m:           {value: 0.300, confidence: low}    # [CERT-web] same
  feet_count:          {value: 8,     confidence: high}   # [CERT-web] Ullmer "(8) adjustable ball-feet"
  frame_section_m:     {value: 0.050, confidence: low}    # [INFER] "square pipes" is published; the SECTION is not

hierarchy:
  - name: root
    children:
      - name: frame            # welded 304 SHS two-deck frame + cladding panel + 8 adjustable feet
        pivot: [0, 0, 0]
        animation: none
      - name: tankChemical     # 600 L, Klopper head + 15 deg cone bottom, manway, vent, sight tube
        pivot: [-0.80, 0.45, 0]
        animation: none
      - name: tankRinse        # identical vessel, second position on the upper deck
        pivot: [0.30, 0.45, 0]
        animation: none
      - name: pumpBay          # 3 LKH sets on the lower deck: stainless head + PAINTED IEC motor
        pivot: [0, 0.13, 0]
        animation: none
      - name: piping           # DN50 316L main, long-radius elbows, discharge loops, tri-clamp collars
        pivot: [0, 0, 0]
        animation: none
      - name: valveTrain       # LKB butterfly valves, manual handles + pneumatic actuators
        pivot: [0, 0, 0]
        animation: none
      - name: instruments      # Promag flowmeter, conductivity + temperature probes, 3 dial gauges
        pivot: [0, 0, 0]
        animation: none
      - name: controlPanel     # stainless cabinet at the far end: HMI, lamps, E-stop on yellow plate
        pivot: [1.30, 0.55, 0]
        animation: none

materials:
  - id: steel-brushed
    family: bare-metal
    color: "#c6cbcd"
    metalness: 0.92
    roughness: 0.30
    evidence: >
      HANDBOOK §3 brushed-304 house value, already validated on tanque-agitador. Justified
      independently by Sartorius outer-surface Ra < 1.0 um and Ullmer's explicit No.4 brushed finish
      inside and out. Counter-intuitive but load-bearing: 2B mill is NUMERICALLY smoother than No.4
      yet LOOKS duller, because No.4 is directionally polished. A CIP skid is No.4, so it reads
      satin with a broad soft gradient — not a mirror, and not flat matte grey.
    source: table
    confidence: 0.9
  - id: steel-frame
    family: bare-metal
    color: "#b7bbbc"
    metalness: 0.90
    roughness: 0.42
    evidence: "304 frame is not polished to shell level; measured rail #A5A79C in the reference photo. Kept duller so the frame reads BEHIND the vessels instead of merging into them."
    source: extracted
    confidence: 0.75
  - id: motor-blue
    family: painted-metal
    color: "#3b4d6a"
    metalness: 0.0
    roughness: 0.52
    evidence: >
      MEASURED from the Suncombe photograph: two independent motors sampled within 1 LSB
      (#3B4D6A / #3C4D6B), shadow side #2B374B. PAINTED = dielectric 0.0; a metalness-blue motor is
      the predictable error here. This is the material contrast that makes the stainless claim
      legible — same reasoning as bomba-centrifuga's painted-casting-vs-bare-shaft.
    source: extracted
    confidence: 0.9
  - id: epdm-seal
    family: rubber
    color: "#23262a"
    metalness: 0.0
    roughness: 0.85
    evidence: "[CERT-doc] LKH leaflet: product-wetted elastomers EPDM. House value reused from tanque-agitador."
    source: table
    confidence: 0.85
  - id: hmi-screen
    family: emissive-glass
    color: "#bcd3d8"
    metalness: 0.0
    roughness: 0.15
    evidence: "MEASURED off the touchscreen face in the reference photo. Emissive so the panel reads as powered."
    source: extracted
    confidence: 0.85
  - id: guard-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0
    roughness: 0.60
    evidence: "E-stop backing plate, visible in the reference photo. House guard-yellow, reused from bomba-centrifuga."
    source: table
    confidence: 0.75
  - id: gauge-glass
    family: glass
    color: "#dde3e5"
    metalness: 0.0
    roughness: 0.10
    evidence: >
      Dial-gauge lenses. Rendered with MeshStandardMaterial opacity ~0.4, deliberately NOT
      MeshPhysicalMaterial.transmission — transmission stalls the SwiftShader shader compile
      (library recipe: materials-textures/transmission-free-glass).
    source: estimated
    confidence: 0.6

critical_features:
  - id: two-deck-linear-arrangement
    desc: >
      TWO vertical vessels stand in a row on an UPPER deck, and the pump bay lives UNDERNEATH them
      on a lower deck. That two-storey split is the whole identity of a linear CIP skid and the
      first thing a lazy model flattens into "tanks sitting on a floor". The vessels are carried BY
      the frame, not on their own legs — legs are the free-standing-tank pattern.
    threshold: 0.80
  - id: tri-clamp-sanitary-piping
    desc: >
      Polished DN50 tube with tri-clamp collars at every joint, long-radius elbows, and the
      pump-discharge U-loops rising from the bay into the header. No threads, no sharp mitres. The
      loops are the visual signature of a CIP skid and are what separates it from a water-treatment
      frame.
    threshold: 0.78
  - id: painted-motor-vs-bare-stainless
    desc: >
      Each pump reads as TWO materials bolted together: a bare 316L wetted head (metal, glinting)
      and a PAINTED blue IEC motor (dielectric, no metal glint). If the motor reads metallic the
      whole material claim collapses into one grey mass.
    threshold: 0.78
  - id: dished-head-and-cone-bottom
    desc: >
      Each vessel closes with a torispherical Klopper head on top and a shallow 15 deg cone at the
      bottom running to a low-point outlet valve. Flat discs top and bottom read as a drum, not a
      process vessel — and a CylinderGeometry end cap IS a flat disc.
    threshold: 0.75
  - id: brushed-stainless-reads-satin
    desc: >
      The stainless reads as SATIN with a vertical gradient — bright where it catches the key,
      cooler and bluer where it takes the environment, darker toward the horizon side. Measured
      spread on the real photo was sd 45.7 across a single tank. Flat grey is a fail; black is the
      known failure mode of bare metal under the house rig.
    threshold: 0.78

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 100         # block54 catalog budget; instanced runs are feet + tri-clamp collars only
    tris: 250000

camera:
  azimuth_deg: 44
  elevation_deg: 18
  fov: 38
  target_y_m: 0.85
  radius_m: 5.20
  notes: >
    A 3.2 m subject does not fit the shell's default R 4.4 / target 0.42. Radius and target are
    lifted to frame the full length with the two-deck split readable. MANDATORY before gating
    (ONBOARD: the gate does NOT see the frame edge): project the 8 corners of the root world
    bounding box to NDC and require |ndc| <= 0.93 with the top below +0.75, leaving the 4-line HUD
    clear. Reframe by MOVING THE CAMERA, never by sinking the subject to dodge the HUD.

lighting: house-rig-plus-fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # Per the library brushed-stainless recipe (an ACTIVE, binding kit rule, proven on 16/18 assets):
  # scene.environmentIntensity ~ 2.15 + HemisphereLight + a FRONTAL DirectionalLight fill + a
  # brushed roughnessMap. Bare metal at metalness 0.9 otherwise reflects the dark house horizon and
  # reads BLACK on exactly the vertical faces this subject is made of.
  # DELIBERATE CHOICE, recorded because the two house documents disagree: ONBOARD-SESSION.md points
  # CURVED bare metal at the HANDBOOK §3.3 STUDIO rig (RectAreaLight), and these tanks are curved.
  # But a staged kit observation reports RectAreaLight stalling the SwiftShader shader compile
  # (probe returns 0 draws, capture times out). Staged entries are NOT binding, so the plan is to
  # MEASURE rather than pick a side: build on the recipe, and if the vertical gradient on the
  # tank flanks fails its critical feature, try the studio variant and record which one this
  # subject actually needed. Never lower metalness to fake the read — that breaks HANDBOOK §3.1.

ui_controls:
  - "AUTO-ROTATE"
  - "CORTE"                    # section the chemical tank: shows the spray ball and the cone bottom
  - "VALVULAS"                 # highlight the valve train + actuators
  - "FLUJO"                    # flow-path overlay: supply main vs return line

colorTarget:
  # MEASURED from the gate capture (headless SwiftShader, 1280x800, default camera), not authored
  # from the albedo hex — the rendered value differs from #c6cbcd after ACESFilmic tonemapping.
  # The crop is the LEFT VESSEL FLANK, chosen because brushed-stainless-reads-satin is the material
  # claim most likely to regress.
  # Crop size matters here and is a deliberate choice: 20x20 samples of this flank ranged from
  # (113,118,120) to (224,226,227) — the vertical gradient IS the subject, so a small crop is an
  # unstable anchor that would drift with any lighting change. A 60x120 crop averages the gradient.
  # Measured sd 57 across the block, ABOVE the reference photograph's sd 45.7 — the render is not
  # flat grey, which is the known failure mode for bare vertical metal here.
  srgb: [168, 172, 173]
  deltaE00Max: 6
  crop: "60x120+490+280"

# (historical note, kept on purpose) colorTarget was DELIBERATELY ABSENT until the first render existed.
# The catalog contract requires it MEASURED from a QA capture crop, never authored from the albedo
