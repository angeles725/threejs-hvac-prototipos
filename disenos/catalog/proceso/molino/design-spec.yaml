# DesignSpec — large-chamber hammer mill (GD class)
# Evidence: research/sources/B102-proceso-cooling/hammer-mill-gd.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# The datasheet decides the layout, and it decides it twice over:
#   · the rotor turns inside a 1200 mm chamber, and the SCREEN WRAPS ~275 deg of it — derived from
#     the published chamber area / screen width, which gives the same 2.88 m arc on all three models.
#     So the screen is not a grate under the rotor; it nearly surrounds it, leaving one ~85 deg gap
#     at the top where the inlet with "hardened impact plates on both sides" has to be.
#   · the motor drives through a "Flexible cam coupling (N-EUPEX) with coupling guard", so motor and
#     rotor are COAXIAL on one base. A belt-driven mill with the motor slung underneath is a
#     different machine that fits the same envelope.

design: molino
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex
  notes: >
    19/24. Repetition and occlusion carry it. Everything that makes this a hammer mill — the beaters
    on their frames, the 4-part screen and the 275 deg wrap — lives inside a pressure-shock-resistant
    steel housing, so the DEFAULT state can only show an envelope, a coupling guard and a motor. That
    forces two things: the outside must carry enough identity on its own (wide-opening doors, inlet
    flap, coaxial drive on vibration dampers), and CORTE must cut BOTH concentric envelopes, because
    the screen is itself a closed shell around the rotor.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B102-proceso-cooling/hammer-mill-gd.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3 — painted machine housing is a DIELECTRIC, not bare metal"
    sibling_spec: "disenos/catalog/proceso/tunel-enfriamiento/design-spec.yaml — same session, same evidence grading"
    envelope_pair: "disenos/catalog/fluidos/skid-hidroneumatico/design-spec.yaml — the two-concentric-envelopes precedent"

references:
  - source: "research/sources/B102-proceso-cooling/hammer-mill-gd.md §1 (Tietjen GD datasheet, 09/2023)"
    evidences: >
      Grinding chamber diameter 1200 mm on all three models; GD 12 screen width 640 mm; envelope
      2610 x 1600 x [height printed as 16000] mm; weight 1900 kg; motor 160-250 kW; 1500/1800 rpm.
      A real manufacturer datasheet read from the PDF on disk, not a reseller summary.
    suitability: pass
  - source: "research/sources/B102-proceso-cooling/hammer-mill-gd.md §2 (same datasheet, named parts)"
    evidences: >
      "4-part screen segments without frame", "Wide-opening doors allow easy and quick access to the
      machine interior", beaters "ready mounted on beater frames", "hardened impact plates on both
      sides of the inlet", "Manually operated inlet flap", "Sealing flange for the grist outlet",
      "Flexible cam coupling (N-EUPEX) with coupling guard", "Vibration dampers, height adjustable".
      Every one of these is a part with a position, which is why the model has them.
    suitability: pass
  - source: "research/sources/B102-proceso-cooling/hammer-mill-gd.md §3 (screen wrap, DERIVED)"
    evidences: >
      chamber area / screen width = 2.875 / 2.880 / 2.880 m on GD 12 / 20 / 25 — one constant arc,
      as it must be for one chamber diameter. Against pi x 1.2 = 3.770 m that is 76.4%, about 275 deg.
      Used ONLY to place the screen segments and the inlet gap; nothing else is stacked on it.
    suitability: conditional
  - source: "not found — beater count, hammer-circle diameter, screen perforation and thickness, door hinge layout, inlet chute size"
    evidences: >
      No source in reach publishes them. [INFER], sized against the 1200 mm chamber and the stated
      envelope, declared low.
    suitability: partial

dimensions_real:
  overall_len_m:        {value: 2.610, confidence: high}  # [CERT-doc] GD 12 length (motor included)
  overall_width_m:      {value: 1.600, confidence: high}  # [CERT-doc] GD 12 width
  overall_height_m:     {value: 1.600, confidence: med}   # [CERT-doc] printed "16000" — a typo; 1600 is the only reading consistent with a 1200 mm chamber. Judgement, not a datasheet value.
  chamber_dia_m:        {value: 1.200, confidence: high}  # [CERT-doc] all three models
  screen_width_m:       {value: 0.640, confidence: high}  # [CERT-doc] GD 12
  screen_wrap_deg:      {value: 275, confidence: med}     # [INFER] 2.88 m arc / 3.770 m circumference = 76.4%
  inlet_gap_deg:        {value: 85, confidence: med}      # [INFER] the complement; the inlet sits in it
  screen_segments:      {value: 4, confidence: high}      # [CERT-doc] "4-part screen segments without frame"
  rotor_speed_rpm:      {value: 1500, confidence: high}   # [CERT-doc] 50 Hz
  motor_kw:             {value: 160, confidence: high}    # [CERT-doc] bottom of the 160-250 kW range
  weight_kg:            {value: 1900, confidence: high}   # [CERT-doc] without motor
  hammer_circle_dia_m:  {value: 1.040, confidence: low}   # [INFER] inside the screen bore with working clearance
  beater_rows:          {value: 6, confidence: low}       # [INFER] no source publishes the count
  beaters_per_row:      {value: 5, confidence: low}       # [INFER] across the 640 mm screen width

hierarchy:
  - name: root
    children:
      - name: base              # welded base frame on height-adjustable vibration dampers
        pivot: [0, 0, 0]
        animation: none
      - name: dampers           # the machine stands on them — a hammer mill bolted flat is wrong
        pivot: [0, 0.05, 0]
        animation: none
      - name: housing           # pressure-shock-resistant chamber shell, ENVELOPE 1
        pivot: [-0.55, 0.88, 0]
        animation: none
      - name: doors             # wide-opening maintenance doors on the chamber face, hinge FAR side
        pivot: [-0.55, 0.88, 0.42]
        animation: none
      - name: screen            # 4 segments wrapping 275 deg, ENVELOPE 2 (concentric with housing)
        pivot: [-0.55, 0.88, 0]
        animation: none
      - name: rotor             # shaft + beater frames + beaters
        pivot: [-0.55, 0.88, 0]
        animation: spin-x            # about its own axis while MARCHA
      - name: inlet             # chute + manually operated inlet flap, in the 85 deg screen gap
        pivot: [-0.55, 1.50, 0]
        animation: none
      - name: outlet            # grist outlet with its sealing flange, under the chamber
        pivot: [-0.55, 0.24, 0]
        animation: none
      - name: coupling-guard    # the cam coupling lives inside it, between chamber and motor
        pivot: [0.10, 0.88, 0]
        animation: none
      - name: motor             # 160 kW B3 motor, COAXIAL with the rotor, on the same base
        pivot: [0.72, 0.88, 0]
        animation: none
      - name: cotas
        pivot: [0, 0, 0]
        animation: none

attachments:
  - node: motor
    parent_socket: base
    local_start: [0.22, 0.30, 0]
    local_end:   [0.22, 0.62, 0]
    contact_type: bolted-pedestal
    overlap: 0.040
    gap_tolerance: 0.000
  - node: outlet
    parent_socket: housing
    local_start: [-0.55, 0.34, 0]
    local_end:   [-0.55, 0.12, 0]
    contact_type: sealing-flange
    overlap: 0.030
    gap_tolerance: 0.000
  - node: inlet
    parent_socket: housing
    local_start: [-0.55, 1.62, 0]
    local_end:   [-0.55, 1.40, 0]
    contact_type: flanged-chute
    overlap: 0.030
    gap_tolerance: 0.000

materials:
  - id: housing-paint
    family: painted-metal
    color: "#56636e"
    metalness: 0.0
    roughness: 0.55
    source: table
    evidence: >
      "Multi-layer coating" on a welded steel housing — a COATED surface is a dielectric, so
      metalness is 0 (HANDBOOK §3.1 near-binary). This asset is mostly painted, so the scene runs a
      LOWER environmentIntensity than its stainless siblings: the house note is that painted panels
      burn out at env 1.9-2.2 with exposure 1.15, which is calibrated for bare metal.
    confidence: 0.8
  - id: frame-dark
    family: painted-metal
    color: "#2f353b"
    metalness: 0.0
    roughness: 0.62
    source: table
    evidence: "base frame, motor pedestal and door furniture — darker so the housing reads against it"
    confidence: 0.8
  - id: rotor-steel
    family: bare-metal
    color: "#b9c0c4"
    metalness: 0.92
    roughness: 0.35
    source: table
    evidence: "shaft, beater frames and coupling — bare machined steel, only ever seen through CORTE"
    confidence: 0.8
  - id: beater-hardened
    family: bare-metal
    color: "#9aa2a8"
    metalness: 0.95
    roughness: 0.45
    source: table
    evidence: "hardened beaters and impact plates — bare, duller and darker than the machined shaft"
    confidence: 0.8
  - id: screen-steel
    family: bare-metal
    color: "#a8b0b6"
    metalness: 0.90
    roughness: 0.42
    source: table
    evidence: "perforated screen segments — bare steel; kept distinct in value from the beaters so the two envelopes do not merge into one grey mass under CORTE"
    confidence: 0.75

critical_features:
  - id: screen-wraps-the-rotor
    desc: >
      The screen is an arc of roughly 275 deg around the rotor, in FOUR segments, with a single gap
      at the TOP where the inlet enters between impact plates. A grate lying under the rotor covering
      the bottom half is the intuitive shape and it is the WRONG one: the published chamber area
      divided by the screen width gives the same 2.88 m arc on all three models, which is 76% of the
      circumference. Visible in CORTE.
    threshold: 0.80
  - id: beaters-on-frames-not-loose-hammers
    desc: >
      The rotor carries beaters MOUNTED ON FRAMES that lift out as a unit — rows of hardened bars held
      in carriers, not free-swinging hammers threaded on a bare pin. This is the machine's stated
      service feature ("beaters can be changed outside the mill") and it changes the shape of the rotor.
      Visible in CORTE.
    threshold: 0.78
  - id: coaxial-drive-through-the-guard
    desc: >
      The motor sits on the SAME base, its shaft in line with the rotor, joined by a cam coupling
      inside a guard. Nothing crosses between them. A belt drive, an offset motor, or a coupling guard
      that does not line up with both shafts is a machine that cannot be assembled.
    threshold: 0.78
  - id: doors-and-inlet-read-from-outside
    desc: >
      In the DEFAULT state the only identity available is the outside: wide-opening doors with visible
      hinges and latches on the chamber face, the inlet chute with its manual flap on top, and the
      grist outlet flange underneath. Without them the asset is a painted drum next to a motor.
    threshold: 0.75

important_features:
  - id: stands-on-vibration-dampers
    desc: "The base sits on height-adjustable dampers, not flat on the floor — a 1500 rpm rotor is why they exist."
  - id: outlet-flange-under-the-chamber
    desc: >
      The grist leaves downward through a flanged outlet under the chamber, so the reduction path is
      complete end to end. KNOWN VIEW LIMIT: it is built and correct but largely hidden behind the
      near base rail at the spec camera. That occlusion is PHYSICALLY REAL — a 1200 mm chamber inside
      a 1600 mm envelope leaves about 200 mm under the chamber, so the discharge sits at floor level
      and no camera above the horizon can see it. Declared rather than fixed: raising the machine or
      shrinking the rail to expose it would model a mill that does not exist.

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 70
    tris: 200000

camera:
  # A compact, tall subject: 2.61 x 1.60 x 1.60 is nearly cubic, so the VERTICAL extent binds, not the
  # horizontal one — the opposite of tunel-enfriamiento. At az 42 the plan projects 2.61*sin42 +
  # 1.60*cos42 = 2.94 m wide, but the elevation adds the plan depth to the height, so at el 12 the
  # vertical extent is about 1.60 + (2.61*cos42 + 1.60*sin42)*sin12 = 2.23 m. R 4.70 gives a
  # 5.18 x 3.24 m frame: 57% horizontal, 69% vertical, with the top clear of the 4-line HUD.
  # Asserted in-page against the projected bbox, never assumed.
  azimuth_deg: 42
  elevation_deg: 12
  fov: 38
  target_y_m: 0.82
  radius_m: 4.70

lighting: house-rig-lowered-env
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DEVIATION, and the opposite one from this family's stainless assets: the subject is a painted
  # machine, so environmentIntensity drops to 1.55 and exposure to 1.05. The stainless recipe
  # (env ~2.3) is calibrated for bare metal and blows out coated panels. The bare metal here (rotor,
  # beaters, screen) is INSIDE the housing and is only ever seen through CORTE, where the ghosted
  # shell dims it anyway — so the rig is tuned for the surface the default capture actually shows.

ui_controls:
  - "AUTO-ROTATE"
  - "MARCHA"      # the rotor spins inside the chamber
  - "CORTE"       # housing AND screen go translucent — the pair, never just the outer shell
  - "COTAS"       # marks the 2.61 m length, the 1.60 m height and the Ø1.20 m chamber

# CORTE is a MATERIAL swap, never a geometry substitution.
#
# And it cuts a PAIR. This subject has TWO concentric closed envelopes: the housing and, inside it,
# the screen wrapping 275 deg of the rotor. Ghosting only the housing would expose the OUTSIDE of the
# screen, the rotor would stay hidden, and the capture would look like a successful cutaway — the
# exact failure the skid-hidroneumatico shell/bladder pair documented. Both envelopes are in the
# cuttable registry. The rotor, the beaters and the impact plates are CONTENTS, not envelopes: they
# stay fully opaque in both states, so the cut only ever OPENS things and never creates geometry.

colorTarget:
  # MEASURED off the gate capture (headless SwiftShader, 1280x800, spec camera).
  srgb: [120, 138, 153]
  deltaE00Max: 8
  crop: "24x24+424+475"      # the RIGHT door leaf: the largest painted plane facing the camera
  # Anchored by projected geometry, not by picking a plausible colour. The door leaves are the +Z
  # face of the housing at z = 0.762, so world points (-0.77, 0.53) and (-0.33, 0.53) — chosen
  # between the hinge line and the centre latch, where nothing else lives — were projected through
  # this camera to pixels (379,465) and (436,487): both read 119.6-119.8 / 138.0 / 152.9-153.0 at
  # standard deviation 0.0-0.5, and a third probe higher up the same leaf agrees. The housing's +X
  # end face was rejected as an anchor even though it is equally uniform (sd 0.0): at 84,101,115 it
  # is a differently-lit plane of the SAME paint, so anchoring there would gate the light rig rather
  # than the material.
