# DesignSpec — horizontal flow wrapper (HFFS / flow-pack)
# Evidence: research/sources/B100-proceso-pack/flow-wrapper-hffs.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# Unlike tolva-dosificador (where the sources fix an ANGLE) this subject's sources fix a SEQUENCE:
# infeed -> former -> longitudinal fin seal -> rotary cross-seal-and-cut -> discharge. The order is
# the identity of the machine. A flow wrapper drawn as a conveyor with a box on it is a different
# machine that happens to occupy the same volume.

design: empacadora-flowwrap
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 3}
  tier: complex
  notes: >
    Scored complex, and the driver is the SEQUENCE, not the part count. Five stations must appear in
    the right order along one axis, each visibly doing its own job, and three of them are in motion
    at once (product chain, film web, rotary jaws). The occlusion score is what forces the CORTE
    control: the formed tube and the folding box live INSIDE the frame, so the feature that makes
    this a flow wrapper is the one the default camera cannot see.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B100-proceso-pack/flow-wrapper-hffs.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3 — brushed 304 stainless 0.9-1.0 / 0.30-0.34"
    sibling_spec: "disenos/catalog/proceso/tolva-dosificador/design-spec.yaml — same evidence-grading pattern"
    stainless_recipe: "~/.claude/skills/design3d/library/materials-textures/brushed-stainless-recipe.md"

references:
  - source: "research/sources/B100-proceso-pack/flow-wrapper-hffs.md §1 (CHLB flow-wrapping guide)"
    evidences: >
      The film web wraps the product into "a continuous tube" that is "sealed longitudinally, and
      subsequently cross-sealed and cut to create individual, 3-side sealed packages"; the guide
      names the "folding box" that forms the tube, the "fin seals" made by "3 pairs of rollers",
      and the "Rotary or box motion cross-sealing jaws" that apply "hermetic end seals while
      cutting packages". This is a SHAPE fact chain: no former means the film never closes, and a
      separate cutter after the jaws would be a different machine.
    suitability: pass
  - source: "research/sources/B100-proceso-pack/flow-wrapper-hffs.md §2 (Hayssen X850 datasheet)"
    evidences: >
      length 162" = 4115 mm, width 55" = 1397 mm, height 85" = 2159 mm, max reel diameter 18" =
      457 mm. The only source in reach giving a complete L x W x H from ONE machine, so it anchors
      the envelope.
    suitability: pass
  - source: "research/sources/B100-proceso-pack/flow-wrapper-hffs.md §2 (ReeFlow 50 / RPMI Pack 102 / Cavanna)"
    evidences: >
      Three independent vendors state a max film reel diameter of 400 mm; CHLB states "roughly
      320 mm max" as a general figure and up to 610 mm film width. 400 mm is adopted over the
      X850's 457 mm because three sources converge on it.
    suitability: pass
  - source: "not found — jaw diameter, former geometry, fin-roller stack, frame members"
    evidences: >
      No source in reach dimensions the rotary jaw, the folding box, or the frame profiles. These
      are [INFER], sized for kinematic plausibility (the jaw must sweep the pack height) and are
      declared low confidence rather than dressed up.
    suitability: partial

dimensions_real:
  overall_len_m:      {value: 4.100, confidence: high}   # [CERT-web] Hayssen X850 4115 mm
  overall_height_m:   {value: 2.150, confidence: high}   # [CERT-web] Hayssen X850 2159 mm (incl. reel mast)
  frame_width_m:      {value: 1.000, confidence: med}    # [CERT-web] inside the stated 0.8-1.2 m band
  working_height_m:   {value: 0.900, confidence: low}    # [INFER] bench height; X850's figure is TOTAL height
  reel_dia_m:         {value: 0.400, confidence: high}   # [CERT-web] ReeFlow 50 / Pack 102 / Cavanna agree
  reel_width_m:       {value: 0.600, confidence: med}    # [CERT-web] inside 370-650 mm, under the 610 mm film cap
  flight_pitch_m:     {value: 0.400, confidence: med}    # [CERT-web] = max stated bag length, one flight per pack
  product_m:          {value: [0.240, 0.090, 0.050], confidence: med}  # [CERT-web] inside 130-400 x 30-140 x 35-70 mm
  jaw_dia_m:          {value: 0.200, confidence: low}    # [INFER] sized to sweep the pack height
  former_len_m:       {value: 0.360, confidence: low}    # [INFER] folding box, no source
  fin_roller_pairs:   {value: 3, confidence: high}       # [CERT-web] "3 pairs of rollers"

hierarchy:
  - name: root
    children:
      - name: frame            # painted base frame, legs, side panels, control column
        pivot: [0, 0, 0]
        animation: none
      - name: infeed           # flighted chain conveyor feeding the former
        pivot: [-1.55, 0.90, 0]
        animation: chain-advance-x    # flights translate +X, recycled at the end (MARCHA)
      - name: reel-mast        # vertical mast + film reel + idler rollers + web path
        pivot: [-0.30, 1.55, 0]
        animation: none
      - name: film-reel        # the 0.40 m roll itself
        pivot: [-0.30, 1.72, 0]
        animation: spin-z             # unwinds while MARCHA
      - name: former           # folding box: flat web -> tube around the product
        pivot: [0.15, 0.92, 0]
        animation: none
      - name: fin-sealer       # 3 pairs of rollers under the tube, the longitudinal seal
        pivot: [0.62, 0.80, 0]
        animation: spin-z             # roller pairs counter-rotate while MARCHA
      - name: cross-jaws       # rotary crimping jaws: seal both ends AND cut, one motion
        pivot: [1.15, 0.90, 0]
        animation: spin-z             # two counter-rotating jaw carriers (MARCHA)
      - name: discharge        # outfeed belt carrying finished pillow packs
        pivot: [1.75, 0.90, 0]
        animation: none

materials:
  - id: shell-stainless
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.90
    roughness: 0.30
    evidence: "HANDBOOK §3 brushed 304 stainless — food-contact frame and guarding rails"
    confidence: 0.85
  - id: jaw-steel
    family: bare-metal
    color: "#b9c0c4"
    metalness: 0.92
    roughness: 0.38
    evidence: "hardened sealing jaws and fin rollers — bare tool steel, duller than the shell"
    confidence: 0.8
  - id: frame-dark
    family: painted-metal
    color: "#333a40"
    metalness: 0.0
    roughness: 0.60
    evidence: "painted base frame and legs — dielectric; darker so the stainless reads against it"
    confidence: 0.8
  - id: film-clear
    family: film
    color: "#cfe6e2"
    metalness: 0.0
    roughness: 0.18
    opacity: 0.42
    evidence: >
      Packaging film is a thin dielectric. Deliberately MeshStandardMaterial with opacity, NOT
      MeshPhysicalMaterial.transmission — transmission stalls the SwiftShader shader compile in this
      headless gate (library/materials-textures/transmission-free-glass.md).
    confidence: 0.8
  - id: product-biscuit
    family: dielectric
    color: "#c08a4e"
    metalness: 0.0
    roughness: 0.85
    evidence: "the wrapped product; warm tone so it reads through the film and against the steel"
    confidence: 0.7
  - id: guard-poly
    family: dielectric
    color: "#7fb8c8"
    metalness: 0.0
    roughness: 0.12
    opacity: 0.22
    evidence: "polycarbonate safety guard panels — present on every machine of this class"
    confidence: 0.7

critical_features:
  - id: film-becomes-a-tube
    desc: >
      The flat web leaves the reel, runs down the mast, and the FORMER closes it into a continuous
      tube around the product stream. Film that merely lies on top of the product, or a former drawn
      as a plain box with no web threaded through it, is the single defect that makes this not a flow
      wrapper. Visible in the CORTE state, where the folding box goes translucent.
    threshold: 0.80
  - id: fin-seal-under-the-pack
    desc: >
      The longitudinal seal is a FIN hanging BELOW the tube, produced by a stack of three roller
      pairs — not a seam painted on the top face. This is what makes the pack 3-side sealed.
    threshold: 0.80
  - id: rotary-jaws-seal-and-cut
    desc: >
      Two counter-rotating jaw carriers meet on the tube axis between products, sealing both pack
      ends and cutting in ONE motion. Two separate stations, or jaws that never meet on the axis,
      would be a machine that cannot produce a sealed pack.
    threshold: 0.80
  - id: infeed-flights-space-the-product
    desc: >
      The infeed is a FLIGHTED chain: upstanding pushers at one pitch, one product per flight. A
      plain flat belt cannot phase product to the jaws, so the machine would jam every cycle.
    threshold: 0.75

important_features:
  - id: reel-on-the-mast
    desc: "A 0.40 m film roll sits on the mast above the former, with the web path visibly threaded over idlers."
  - id: finished-packs-at-discharge
    desc: "Sealed pillow packs with crimped ends leave on the outfeed — the output of the sequence is visible."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 70
    tris: 220000

camera:
  # A 4.1 m subject is the longest in the family; framing is measured, not guessed — the root bbox
  # is projected to NDC and every corner must satisfy |ndc| <= 1 before the gate is spent.
  azimuth_deg: 46
  elevation_deg: 14
  fov: 38
  target_y_m: 1.05
  radius_m: 4.90
  # 4.90 is MEASURED, not chosen. At the first value (6.80) the subject's projected extent was
  # ~3.64 m horizontal and 2.15 m vertical inside a 7.49 x 4.68 m visible frustum at target
  # distance — about 48% of frame, i.e. half the capture was empty background. At 4.90 the visible
  # frame is 5.40 x 3.37 m, so the subject fills ~67% with margin on every side.

lighting: house-rig-plus-fill
  # Same deviation as the other stainless subjects: large bright metal planes need a camera-side
  # fill and a raised environmentIntensity for the specular term. metalness stays at 0.90 —
  # HANDBOOK §3.1 is not negotiable for bare metal.

ui_controls:
  - "AUTO-ROTATE"
  - "MARCHA"      # chain advances, reel unwinds, fin rollers and cross jaws counter-rotate
  - "CORTE"       # former + guards + film go translucent to expose the formed tube inside
  - "COTAS"       # marks overall length, working height and the 0.40 m reel

# CORTE is implemented as a MATERIAL swap (opaque -> translucent), never as a geometry substitution.
# That is a deliberate structural choice: a hide-list and a restore-list are two different lists and
# they diverge silently (suavizador-agua left a head floating with a 0.117 m gap). A material swap
# removes no geometry, so the whole defect class cannot occur here and the audit reduces to reading
# one flag per material.

colorTarget:
  # MEASURED off the passing capture (headless SwiftShader, 1280x800, default camera) — not estimated.
  srgb: [110, 114, 116]
  deltaE00Max: 8
  crop: "24x24+520+485"      # the stainless SKIRT PANEL: the large vertical bare-metal plane
  # Anchor choice is the finding, as it was for tolva-dosificador. Four consecutive 24x24 crops
  # along the skirt (x 470/520/570/620) all measured 110,114,116-117 at standard deviation 0 — a
  # genuinely uniform vertical face, which is what makes it a usable anchor. The three obvious
  # candidates were all rejected by LOOKING at an annotated crop first: x520,y430 straddles the
  # deck/skirt edge, x700,y430 lands on the film tube (not steel at all), and x900,y470 sits on the
  # discharge belt beside a pack. A crop is only as good as the surface it actually covers, and the
  # only way to know which surface that is, is to draw the rectangle and look at it.
  # A fifth probe at x680 measured sd=34 — an edge — and was discarded rather than averaged in.
