  cabinet_m:           {value: [0.420, 0.360, 0.560], confidence: low}   # [INFER] control enclosure
  overall_m:           {value: [2.10, 0.92, 1.62], confidence: low}      # [INFER] envelope incl. HMI arm

hierarchy:
  - name: root
    children:
      - name: frame            # legs, feet, longitudinal rails, cross members
        pivot: [0, 0, 0]
        animation: none
      - name: conveyor         # bed, side guides, drive/idler end pulleys, belt surface
        pivot: [0, 0.914, 0]
        animation: belt-scroll        # texture offset only while MARCHA is on
      - name: separator        # vertical-axis spacing wheel upstream of the wrap station
        pivot: [-0.560, 0.914, 0.160]
        animation: spin-y
        attachment: {parent_socket: frame-rail-near, local_start: [0, 0, 0], local_end: [0, 0.230, 0],
                     contact_type: bolted-post, embed_depth: 0.030, gap_tolerance: 0.000}
      - name: head-plate       # the vertical plate that CARRIES the whole web path
        pivot: [0.140, 0.980, -0.300]
        animation: none
        attachment: {parent_socket: frame-rail-far, local_start: [0, 0, 0], local_end: [0, 0.620, 0],
                     contact_type: bolted-column, embed_depth: 0.040, gap_tolerance: 0.000}
      - name: unwind-reel      # 350 mm OD label roll on a 76 mm core hub
        pivot: [-0.060, 1.290, -0.330]
        animation: spin-z
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0, 0, 0.090],
                     contact_type: stub-shaft, embed_depth: 0.025, gap_tolerance: 0.000}
      - name: dancer-roller    # sprung tension control roller, first contact after the unwind
        pivot: [0.190, 1.170, -0.300]
        animation: none
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0, 0, 0.070],
                     contact_type: stub-shaft, embed_depth: 0.020, gap_tolerance: 0.000}
      - name: guide-rollers    # three idlers steering the web down to the applicator nose
        pivot: [0.240, 1.040, -0.300]
        animation: none
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0, 0, 0.070],
                     contact_type: stub-shaft, embed_depth: 0.020, gap_tolerance: 0.000}
      - name: peel-plate       # the knife edge: label goes straight on, liner folds back acutely
        pivot: [0.120, 0.985, -0.190]
        animation: none
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0.170, 0, 0],
                     contact_type: welded-bracket, embed_depth: 0.018, gap_tolerance: 0.000}
      - name: nip-pair         # driven nip roll + rubber pressure roll that PULL the liner
        pivot: [-0.130, 0.960, -0.300]
        animation: spin-z
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0, 0, 0.075],
                     contact_type: stub-shaft, embed_depth: 0.022, gap_tolerance: 0.000}
      - name: rewind-reel      # spent liner spool
        pivot: [-0.330, 1.130, -0.320]
        animation: spin-z
        attachment: {parent_socket: head-plate-front, local_start: [0, 0, 0], local_end: [0, 0, 0.085],
                     contact_type: stub-shaft, embed_depth: 0.025, gap_tolerance: 0.000}
      - name: web              # the threaded liner ribbon itself, unwind -> ... -> rewind
        pivot: [0, 1.100, -0.300]
        animation: web-scroll         # texture offset only while MARCHA is on
      - name: wrap-station     # driven wrap belt + opposed backing/pressure plate
        pivot: [0.300, 0.914, 0]
        animation: belt-scroll
      - name: bottles          # four containers on the bed: pre-label, in the wrap, labelled
        pivot: [0, 0.914, 0]
        animation: translate-x        # plus spin-y for the one inside the wrap station
      - name: cabinet          # control enclosure + HMI on a swing arm
        pivot: [-0.760, 0.914, -0.230]
        animation: none
      - name: guard            # polycarbonate guard over the head, hidden by the CORTE toggle
        pivot: [0.140, 1.000, -0.230]
        animation: none

materials:
  - id: shell-stainless
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.92
    roughness: 0.32
    evidence: "HANDBOOK §3.1 brushed 304 stainless; datasheet states 'stainless steel construction'"
    source: table
    confidence: 0.85
  - id: frame-stainless
    family: bare-metal
    color: "#bcc2c5"
    metalness: 0.92
    roughness: 0.36
    evidence: "same 304, duller finish on the structural tube so the head reads against the frame"
    source: table
    confidence: 0.8
  - id: cabinet-grey
    family: painted-metal
    color: "#4e565c"
    metalness: 0.0
    roughness: 0.55
    evidence: "HANDBOOK §3.1 — painted enclosure is a DIELECTRIC, metalness 0"
    source: table
    confidence: 0.85
  - id: belt-black
    family: rubber
    color: "#14171a"
    metalness: 0.0
    roughness: 0.85
    evidence: "HANDBOOK §3.1 — rubber/hose is dielectric, metalness 0; conveyor and wrap belts"
    source: table
    confidence: 0.85
  - id: label-white
    family: paper
    color: "#e9e5dd"
    metalness: 0.0
    roughness: 0.78
    evidence: "pressure-sensitive facestock — matte paper, dielectric"
    source: estimated
    confidence: 0.75
    assumptions: "no facestock datasheet in reach; value chosen so the label reads against stainless"
  - id: liner-amber
    family: paper
    color: "#c9b88f"
    metalness: 0.0
    roughness: 0.70
    evidence: "silicone-coated glassine release liner is amber/translucent, visibly NOT the label"
    source: estimated
    confidence: 0.7
    assumptions: "colour chosen to separate liner from facestock at the peel plate, which is the point"
  - id: roller-steel
    family: bare-metal
    color: "#9aa0a3"
    metalness: 0.90
    roughness: 0.40
    evidence: "idler and nip rolls, bare turned steel"
    source: table
    confidence: 0.8
  - id: roller-rubber
    family: rubber
    color: "#26282b"
    metalness: 0.0
    roughness: 0.80
    evidence: "the pressure half of the nip pair is rubber-covered — dielectric"
    source: table
    confidence: 0.8
  - id: bottle-amber
    family: transparent
    color: "#b4762f"
    metalness: 0.0
    roughness: 0.12
    evidence: >
      library/materials-textures/transmission-free-glass — MeshStandardMaterial with opacity, NOT
      MeshPhysicalMaterial.transmission, which stalls the SwiftShader shader-compile (LEARNINGS
      active row, nave-panccadia horno-rotativo).
    source: table
    confidence: 0.85
  - id: hmi-screen
    family: emissive
    color: "#0d1a18"
    metalness: 0.0
    roughness: 0.35
    evidence: "HANDBOOK §3.1 — HMI bezel is plastic/glass, metalness 0; screen carries the emissive"
    source: table
    confidence: 0.8
  - id: guard-poly
    family: transparent
    color: "#8fb6c6"
    metalness: 0.0
    roughness: 0.10
    evidence: "polycarbonate machine guard, tinted; same transmission-free approach as the bottles"
    source: estimated
    confidence: 0.7
    assumptions: "opacity ~0.22 so the web path stays readable through it in the default state"

critical_features:
  - id: peel-plate-reverses-the-web
    desc: >
      At the knife edge the liner turns back on itself at an ACUTE angle toward the rewind, while the
      label continues straight on to the bottle. Two ribbons must be visibly distinct at that point:
      white facestock going forward, amber liner folding back. A web that curves smoothly past the
      plate renders fine and depicts a machine that cannot dispense a label.
    threshold: 0.80
  - id: web-path-is-an-ordered-chain
    desc: >
      The liner is threaded, not decorative: unwind reel -> dancer/tension roller -> guide idlers ->
      peel plate -> nip pair -> rewind reel, in that order, each roller actually WRAPPED by the
      ribbon rather than floating beside it. A lazy model draws the reels and skips the thread.
    threshold: 0.78
  - id: wrap-station-is-a-three-body-contact
    desc: >
      The bottle is captured BETWEEN a driven wrap belt and an opposed backing plate, with both in
      contact at the bottle diameter. A belt alone, or a belt with a visible gap to the bottle,
      is not a wrap station — nothing would spin the container.
    threshold: 0.78
  - id: bottles-spaced-before-the-wrap
    desc: >
      A separator wheel stands upstream of the wrap station and the bottles on the bed are SPACED,
      not touching. Unspaced containers arriving at a labeler is the failure the wheel exists to
      prevent, and it is visible from the spec camera.
    threshold: 0.72

important_features:
  - id: roll-format-reads-correct
    desc: "The label roll reads as a large-diameter roll (350 mm OD) on a small core (76 mm), not a solid disc."
    threshold: 0.65
  - id: bed-height-reads-human
    desc: "The 0.914 m bed height and 0.22 m bottles read at human working height — a 1.8 m person would stand correctly beside it."
    threshold: 0.65
  - id: stainless-vs-painted-separate
    desc: "Bare stainless (frame, head, rollers) is visibly a different family from the painted cabinet — near-binary metalness doing its job."
    threshold: 0.65

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 120         # MEASURED 95. HANDBOOK §3.2 puts the mid-range-mobile floor at ~300, so the
                       # headroom is real, not a relaxed threshold. The first draft said 90 — under
                       # the as-built figure — which would have failed the gate for a budget the
                       # device table never asked for.
    tris: 250000       # MEASURED 5,930

camera:
  azimuth_deg: 52
  elevation_deg: 11
  fov: 38
  target_m: [0, 0.80, -0.05]
  radius_m: 3.55
  rationale: >
    DERIVED BY PROJECTION, not by eye. The first framing (az 46 / el 16 / r 3.40 / target_y 0.95) put
    the near-front leg at y_ndc -1.16 — cropped off the bottom — while the whole asset used only 37%
    of the frame width. Projecting the corner set again for az 52 / el 11 / r 3.55 / target
    (0, 0.80, -0.05) lands the near leg at y_ndc -0.94 and the head top at +0.69. The higher azimuth
    swings the 2.0 m bed toward the camera so its LENGTH reads instead of foreshortening away, and
    the lower elevation stops the empty floor from taking the lower third.

lighting: house-rig-plus-frontal-fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # AMENDED at P5 after MEASURING the first capture. The original entry claimed a deliberate
  # non-deviation on the grounds that this subject is horizontal and cylindrical, the class the
  # vertical-plane fix is known to FLATTEN. The measurement contradicted the premise, so the spec
  # changed before the code did.
  #
  # Measured on the az52/el11 capture, mean sRGB of the crop (ImageMagick), house rig unmodified:
  #     head plate    (vertical, bare 304)      74.6, 78.1, 80.2
  #     frame leg     (vertical, bare 304)      46.3, 49.9, 52.1
  #     conveyor side (vertical, bare 304)      78.3, 81.9, 84.2
  #     label roll    (cylindrical, paper)     121.0, 131.4, 136.5
  #     bottle        (amber, translucent)      90.0, 71.2, 46.8
  # The sibling that PASSED this family's material gate (tolva-dosificador) anchors its stainless at
  # 95,101,105. Every VERTICAL bare-metal member here sits below that; every CYLINDRICAL one sits
  # above it. That split is the diagnosis: this asset is MIXED-class, not horizontal, and the frame
  # is exactly the flat-vertical-bare-metal case the ONBOARD gotcha describes.
  #
  # Applied: environmentIntensity 1.9 -> 2.30 (the specular term on a vertical face comes from the
  # IBL, never from an elevated key — reflection geometry forbids it) + ONE camera-side frontal
  # DirectionalLight (0.55, no shadow) for the diffuse term. metalness UNCHANGED at 0.92: lowering it
  # would fix the pixel and break HANDBOOK §3.1. The cylindrical members are re-measured after the
  # change specifically to prove the fix did not flatten them — that is the risk this deviation runs.

ui_controls:
  - "AUTO-ROTATE"
  - "MARCHA"        # scrolls conveyor + wrap belt + web, spins separator, advances and rolls bottles
  - "CORTE"         # removes the polycarbonate guard AND the near backing plate of the wrap station
  - "COTAS"         # marks bed height 0.914 m, roll OD 0.350 m, bottle 0.075 x 0.220 m
  # CORTE is a pure REMOVAL, not a substitution. Nothing rests on the guard or on the backing plate,
  # so there is no restore-list that can diverge from the hide-list — the asymmetry that leaves
  # pieces floating in a cutaway cannot arise here. Recorded because "no substitute group" is the
  # reason it is safe, not an oversight.

colorTarget:
  # MEASURED from the gate capture (headless SwiftShader, 1280x800, DPR 1, default camera).
  # NOT invented: authored only after the render existed, per DESIGNSPEC (target is the RENDERED
  # value, which differs from the albedo hex after ACES tonemapping).
  srgb: [80, 83, 86]
  deltaE00Max: 8
  crop: "24x24+812+155"   # head plate, clear of the roll and of the guard mullions
  # WHY THE HEAD PLATE: it is the largest single stainless surface and the machine's face — the
  # thing a viewer actually judges "is this stainless". Not the brightest crop available: the label
  # roll measures 125,136,141 but it is PAPER, and anchoring a steel target on paper would certify
  # nothing.
  measured_limit_vertical_faces: >
    Every VERTICAL bare-metal member reads below the family's passing anchor (tolva-dosificador,
    95,101,105) and no amount of rig work closed the gap: head plate 74.6 -> 80.6, conveyor side
    78.3 -> 83.6, frame leg 46.3 -> 50.3 after environmentIntensity 1.9 -> 2.30 plus a camera-side
    frontal fill. That is +5 sRGB, matching the +7 the sibling spec recorded for the same move. The
    physics is the reason: a vertical face cannot receive a specular reflection from an elevated
    key at any camera height, so its highlight depends on the IBL alone. Recorded as a MEASURED
    LIMIT. Lowering metalness would have closed the number and broken HANDBOOK 3.1.
  cylindrical_control: [125, 136, 141]
    # the label roll, re-measured AFTER the rig change specifically to prove the vertical fix did not
    # flatten the curved members (121 -> 125: it did not, and it did not blow out either).
