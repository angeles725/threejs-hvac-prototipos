                                                                  # from 0.760x0.620 so the rewind
                                                                  # spool sits ON the plate instead
                                                                  # of cantilevered past its edge
                                                                  # (low-confidence value, amendable
                                                                  # at P4/P5 per DESIGNSPEC rule 1)
  idler_dia_m:         {value: 0.048, confidence: low}    # [INFER] guide/tension rollers
