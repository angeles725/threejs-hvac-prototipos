  conveyor_bed_h_m:    {value: 0.914, confidence: high}   # [CERT-web] 36" +/- 2"
  label_roll_od_m:     {value: 0.350, confidence: high}   # [CERT-web] max OD
  label_roll_core_m:   {value: 0.076, confidence: high}   # [CERT-web] 3" core
  label_height_m:      {value: 0.120, confidence: high}   # [CERT-web] inside the 0.015-0.220 band
  bottle_dia_m:        {value: 0.075, confidence: high}   # [CERT-web] inside the 0.025-0.102 band
  bottle_h_m:          {value: 0.220, confidence: high}   # [CERT-web] inside the 0.050-0.320 band
