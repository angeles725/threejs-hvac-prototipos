# DesignSpec — wrap-around pressure-sensitive labeling machine
# Evidence: research/sources/B59-proceso-dims/wraparound-labeler.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# Unlike the sibling proceso specs (tanque-agitador, tolva-dosificador) whose sources fix only
# RATIOS or ANGLES, this one has a real manufacturer datasheet (CVC-300) that fixes the ENVELOPE:
# conveyor bed height, conveyor width, label roll OD/core and the label format band are [CERT-web].
# What the datasheet does NOT fix — reel spool and idler diameters, head-plate size, cabinet, guard —
# is marked low confidence and labelled [INFER], never dressed up as measured.
#
# The identity of this machine is a PATH, not a volume. A labeler is a threaded web running
# unwind -> tension -> guides -> peel plate -> nip roll -> rewind, and the peel plate is where the
# label leaves the liner. Model the boxes and skip the thread and you have modelled a cabinet.

design: etiquetadora
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 2}
  tier: complex          # sum 16 (15-24 = complex)
  notes: >
    The component count and the occlusion drive the tier, not the silhouette. The silhouette is
    plain — a long low conveyor with a vertical head beside it — but the machine only reads as a
    LABELER through a chain of small parts (two reels, three idlers, a dancer, a knife edge, a nip
    pair) that partly hide behind their own head plate. That is the occlusion cost: the web path is
    the identity and it lives in the one plane most likely to be covered by the plate that carries
    it. Repetition scores LOW on purpose: three idlers and four bottles are not a repetition system
    worth instancing, and instancing them would be the wrong lesson from the sibling assets.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/wraparound-labeler.md
    qa_gate: disenos/catalog/tools/verify-catalog-asset.mjs
    state_probe: disenos/catalog/tools/probe-state.mjs
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — near-binary metalness; brushed 304 stainless 0.9-1.0 / 0.30-0.34"
    light_rig: "research/HANDBOOK.md §3.3 — house key/fill/rim, UNMODIFIED (horizontal subject)"
    sibling_spec: "disenos/catalog/proceso/tolva-dosificador/design-spec.yaml — same evidence-grading pattern"

references:
  - source: "research/sources/B59-proceso-dims/wraparound-labeler.md §1 (CVC-300 datasheet, CVC Technologies)"
    evidences: >
      Conveyor bed height 36" +/- 2" (914 mm), conveyor length 79" (2007 mm), conveyor width 4"
      (102 mm), label roll "Max 13-3/4" (350mm) outside diameter with 3" (76mm) core", label
      width/height 15-220 mm, bottle diameter 25-102 mm, bottle height 50-320 mm, >100 BPM,
      "variable speed separator wheel", stainless steel construction. These fix the ENVELOPE and the
      format band; the model uses them directly rather than choosing round numbers.
    suitability: pass
  - source: "research/sources/B59-proceso-dims/wraparound-labeler.md §2 (SigmaEquipment wraparound PS labeler guide)"
    evidences: >
      The web path is an ORDERED chain: unwind reel -> tension control roller -> guide rollers ->
      peel plate ("sometimes called a knife edge, reverses the web direction, causing the label to
      separate from the web") -> nip-and-pressure roll ("pulls the web through the labeler") ->
      rewind reel ("the empty web is collected on the rewind reel"). The ORDER is the fact.
    suitability: pass
  - source: "research/sources/B59-proceso-dims/wraparound-labeler.md §2 (US 11958653, peel-off dispenser)"
    evidences: >
      The web "abruptly changes direction at an acute angle" over the peeling edge, and that is what
      exceeds the adhesive-to-release bond. So the liner must leave the knife edge FOLDED BACK at an
      acute angle while the label continues straight on; a web curving smoothly past the plate
      depicts a machine that cannot dispense.
    suitability: pass
  - source: "research/sources/B59-proceso-dims/wraparound-labeler.md §3 (same guide, wrap station)"
    evidences: >
      The wrap operation conveys "a cylindrical container or bottle between a rotating belt and a
      pressure plate", with "spacing wheels or worm screws" upstream. A wrap station is therefore a
      THREE-body contact (driven belt / bottle / backing plate), not a belt alone.
    suitability: pass
  - source: "absolute sizing of everything the datasheet omits — chosen, not measured"
    evidences: >
      Frame footprint and leg section, reel spool flange and idler diameters, head-plate size, peel
      plate length, nip-roll diameter, separator-wheel diameter, control cabinet and HMI arm,
      polycarbonate guard: all [INFER], sized as a plausible small in-line labeler consistent with
      the datasheet envelope. No source in reach fixes them.
    suitability: partial
  - source: "p6_comparison"
    evidences: >
      spec-only. There are NO reference photographs for this build — P1 evidence is textual
      (datasheet + engineering guides). No `reference-match` view is in the evidence contract, and
      the gate must not be presented as reference-backed.
    suitability: pass

p6_comparison: spec-only

