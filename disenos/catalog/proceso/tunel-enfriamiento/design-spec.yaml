# DesignSpec — belt cooling tunnel (chocolate / bakery)
# Evidence: research/sources/B102-proceso-cooling/cooling-tunnel.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# The subject's identity is NOT "an insulated box with a conveyor". Both measured sources describe
# the same decomposition, and it is the opposite of a box: the insulated part is a LIFT-OFF LID in
# 1 m sections, and the belt runs continuously underneath it, emerging onto OPEN tables at both ends.
#   open table (1 m) -> 3 insulated top sections (3 m) -> open table (1 m) = 5.00 m
# A tunnel drawn as a sealed crate with the belt stopping at each face is a different machine, and it
# is exactly the machine a lazy model produces — which is why two of the four critical features below
# exist to forbid it.

design: tunel-enfriamiento
family: proceso
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 2}
  tier: complex
  notes: >
    17/24. The silhouette is the WEAKEST axis (a long low deck on legs) and the occlusion axis is the
    strongest, which is unusual and decides the whole build: everything that makes this a cooling
    tunnel — the belt passing through, the evaporator over it, the return run below — is hidden by
    the hood in the DEFAULT state, and the default state is the only one the catalog gate captures.
    So the hood must be short enough (3 of 5 m) that the open ends carry the read on their own, and
    CORTE must expose the covered span. A spec that scored occlusion low here would authorise a
    sealed box and never notice.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B102-proceso-cooling/cooling-tunnel.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3 — brushed 304 stainless 0.9-1.0 / 0.30-0.34"
    sibling_spec: "disenos/catalog/proceso/empacadora-flowwrap/design-spec.yaml — same evidence-grading and CORTE-as-material-swap pattern"
    stainless_recipe: "~/.claude/skills/design3d/library/materials-textures/brushed-stainless-recipe.md"

references:
  - source: "research/sources/B102-proceso-cooling/cooling-tunnel.md §1 (Selmi Tunnel 300/400)"
    evidences: >
      "Working width: 320/420 mm" and "Dimensions: l. 4/5/8/12/16 m, d. 1000 mm". Fixes the cross
      section outright: 1.00 m wide whatever the length, with a belt under half that width. The
      length list is DISCRETE, so 5.00 m is a published length, not an average of a range.
    suitability: pass
  - source: "research/sources/B102-proceso-cooling/cooling-tunnel.md §2 (ChocoMa DS 60_030)"
    evidences: >
      An "open decorating table" (1 m) at the front and an "open packing table" (1 m) at the rear,
      with "insulated top sections of 1 meter" between them, "easy to handle without use of tools";
      insulation 25 mm on the conveyor table and 50 mm on the top covers. This is the shape fact
      chain: covers that lift off by hand cannot be structural walls, so the hood sits ON the table
      and the belt is continuous underneath.
    suitability: pass
  - source: "research/sources/B102-proceso-cooling/cooling-tunnel.md §3 (KeyChoc / AkayGAM, via search summary)"
    evidences: >
      One independent thermo-regulated cooling unit every 6 m, up to six zones; standard 70 mm
      product clearance. Graded [CERT-a], NOT [CERT-web]: akaygam.com returned HTTP 403 and
      keychoc.com failed TLS with a self-signed certificate, so neither page was read at the source.
      Consequence taken honestly: at 5.00 m this machine is under the 6 m spacing and carries
      exactly ONE cooling unit. Drawing a row of evaporators would contradict the only figure in reach.
    suitability: conditional
  - source: "not found — working height, hood section height, evaporator/fan sizes, drum diameters"
    evidences: >
      Every page in reach publishes length, width and belt width; none publishes a height. These are
      [INFER], sized against the two measured envelopes, and declared low rather than dressed up.
    suitability: partial

dimensions_real:
  overall_len_m:       {value: 5.000, confidence: high}  # [CERT-web] Selmi stock length 4/5/8/12/16 m
  overall_width_m:     {value: 1.000, confidence: high}  # [CERT-web] Selmi "d. 1000 mm"
  belt_width_m:        {value: 0.420, confidence: high}  # [CERT-web] Selmi working width 320/420 mm
  hood_len_m:          {value: 3.000, confidence: med}   # [CERT-web] 3 x ChocoMa 1 m top sections; the COUNT is derived from 5.00 - 2 x 1.00
  open_table_len_m:    {value: 1.000, confidence: high}  # [CERT-web] ChocoMa open decorating / packing tables
  hood_insulation_m:   {value: 0.050, confidence: high}  # [CERT-web] ChocoMa top covers 50 mm
  table_insulation_m:  {value: 0.025, confidence: high}  # [CERT-web] ChocoMa conveyor table 25 mm
  product_clearance_m: {value: 0.070, confidence: med}   # [CERT-a] "standard 70 mm product height"
  cooling_zones:       {value: 1, confidence: med}       # [CERT-a] one unit per 6 m -> 5 m carries one
  belt_speed_m_min:    {value: 3.000, confidence: high}  # [CERT-web] ChocoMa "0.0-3.0 m/min"; Selmi 30-200 cm/min agrees
  working_height_m:    {value: 0.900, confidence: low}   # [INFER] bench height; NO source publishes it
  hood_height_m:       {value: 0.320, confidence: low}   # [INFER] must clear the 70 mm product plus the evaporator
  drum_dia_m:          {value: 0.200, confidence: low}   # [INFER] amended from 0.120 at build time (low values are pre-authorised): the drum radius sets how far the return strand hangs below the carrying strand, and at Ø0.12 the loop closed 0.12 m below the belt — inside the deck, invisible
  product_m:           {value: [0.055, 0.020, 0.040], confidence: low}  # [INFER] praline under the 70 mm clearance

hierarchy:
  - name: root
    children:
      - name: frame              # painted legs + base rails + cross members
        pivot: [0, 0, 0]
        animation: none
      - name: belt-table         # the insulated conveyor table the whole belt path sits on
        pivot: [0, 0.90, 0]
        animation: none
      - name: belt-upper         # carrying run: open table -> under the hood -> open table
        pivot: [0, 0.90, 0]
        animation: product-advance-x   # product translates +X, recycled at the end (MARCHA, CONTINUOUS)
      - name: belt-return        # return run BELOW the table — proves the belt is a loop, not a strip
        pivot: [0, 0.78, 0]
        animation: none
      - name: drum-head          # driven drum at the outfeed end
        pivot: [2.44, 0.84, 0]
        animation: spin-z
      - name: drum-tail          # idler drum at the infeed end
        pivot: [-2.44, 0.84, 0]
        animation: spin-z
      - name: drive-motor        # gearmotor hung off the outfeed end, under the table
        pivot: [2.30, 0.60, 0]
        animation: none
      - name: hood               # 3 lift-off insulated top sections, OPEN at both ends
        pivot: [0, 1.02, 0]
        animation: none
      - name: evaporator         # finned block inside the hood, over the belt
        pivot: [0, 1.20, 0]
        animation: none
      - name: hood-fans          # axial fans under the evaporator, discharging DOWN onto the belt
        pivot: [0, 1.14, 0]
        animation: spin-y              # spin while MARCHA
      - name: cotas              # dimension marks, hidden by default
        pivot: [0, 0, 0]
        animation: none

# Attachment contract — the only appendage-like parts here
attachments:
  - node: drive-motor
    parent_socket: belt-table
    local_start: [2.30, 0.72, -0.34]
    local_end:   [2.30, 0.72,  0.34]
    contact_type: bolted-flange
    overlap: 0.030
    gap_tolerance: 0.000
  - node: evaporator
    parent_socket: hood
    local_start: [-0.90, 1.24, 0]
    local_end:   [ 0.90, 1.24, 0]
    contact_type: hung-from-cover
    overlap: 0.020
    gap_tolerance: 0.000

materials:
  - id: shell-stainless
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.90
    roughness: 0.30
    source: table
    evidence: "HANDBOOK §3 brushed 304 stainless — food-contact table, drums, side rails"
    confidence: 0.85
  - id: panel-insulated
    family: painted-metal
    color: "#8c979c"
    metalness: 0.0
    roughness: 0.55
    source: estimated
    evidence: >
      The 50 mm lift-off covers are a coated insulated sandwich panel — a DIELECTRIC, not bare metal,
      so metalness is 0 (HANDBOOK §3.1 is near-binary). The albedo was chosen as a MID value to keep
      the panel off near-white under ACESFilmic at exposure 1.15 with this scene's raised
      environmentIntensity, and THAT PART OF THE REASONING WAS MEASURED WRONG: #8c979c (140,151,156)
      renders at 195,203,206 — a light panel anyway, just short of clipping. Recorded as measured
      rather than re-tuned, because the thing the mid value was supposed to protect turned out not to
      depend on it: what makes the three 1 m sections read is the DARK BATTEN at each joint, not the
      panel value. The albedo stays; the claim is corrected.
    confidence: 0.75
  - id: frame-dark
    family: painted-metal
    color: "#333a40"
    metalness: 0.0
    roughness: 0.60
    source: table
    evidence: "painted legs, base rails and motor housing — dielectric; dark so the stainless reads against it"
    confidence: 0.8
  - id: belt-poly
    family: dielectric
    color: "#4a7f9e"
    metalness: 0.0
    roughness: 0.55
    source: estimated
    evidence: >
      Food conveyor belting is a polymer, dielectric. Blue is the food-industry convention precisely
      because it does not occur in food, so a fragment is visible; it also separates the belt from the
      stainless around it, which matters here because the belt IS the critical feature. Assumption:
      colour is conventional, not read from a datasheet.
    confidence: 0.7
  - id: chocolate
    family: dielectric
    color: "#4a2f1e"
    metalness: 0.0
    roughness: 0.45
    source: estimated
    evidence: "set chocolate: dark, slightly glossy after crystallisation; warm tone reads against the blue belt"
    confidence: 0.7
  - id: coil-alu
    family: bare-metal
    color: "#b9c0c4"
    metalness: 0.92
    roughness: 0.38
    source: table
    evidence: "evaporator fin block and fan hubs — bare aluminium/steel, duller than the food-contact stainless"
    confidence: 0.8

critical_features:
  - id: belt-runs-through-the-tunnel
    desc: >
      ONE continuous belt enters at the open infeed table, passes UNDER the insulated hood, and comes
      out on the open outfeed table — the same belt, at the same height, visible on both sides of the
      covered span. A belt that starts and stops at the hood faces, or a hood whose ends are closed
      panels, is the defect that turns this into a box with a conveyor next to it.
    threshold: 0.80
  - id: hood-is-a-liftoff-lid
    desc: >
      The insulated part reads as a LID resting on the table — 3 separate 1 m sections with visible
      joints, ending well above the floor with the table and its legs continuing past it at both
      ends. Walls that reach the floor, or a single 3 m slab with no section joints, contradict
      "insulated top sections of 1 meter, easy to handle without use of tools".
    threshold: 0.80
  - id: evaporator-over-the-belt
    desc: >
      Inside the hood, a finned evaporator block with axial fans below it sits directly over the belt,
      discharging down onto the product. Visible in the CORTE state. A tunnel with no cooling element
      inside is a covered conveyor; this part is what makes the enclosure worth having.
    threshold: 0.75
  - id: return-run-under-the-table
    desc: >
      The belt is a LOOP: the return strand runs back below the table between the two drums. Without
      it the top strand is a sheet of material lying on a bench, and the drums have nothing to drive.
    threshold: 0.75

important_features:
  - id: open-tables-carry-product
    desc: "Product sits on the bare open tables at both ends — entering at the infeed, set and spaced at the outfeed."
  - id: drive-end-reads-as-driven
    desc: "The outfeed end shows a drum plus a gearmotor hung under the table, so the loop has an obvious driver."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 70
    tris: 200000

camera:
  # The RADIUS is derived from the frustum and asserted in-page; the AZIMUTH was corrected by looking.
  # At fov 38 and 16:10 the visible frame is 1.1019*d wide. At az 64 the 5.00 x 1.00 m plan projects
  # to 5.00*sin64 + 1.00*cos64 = 4.93 m, so R 6.35 (frame 7.00 m) fills ~70% with margin for the HUD.
  # az 46 was the first value and it FAILED on the pre-look, not on a count: the infeed table fell
  # deep into foreshortening, so `belt-runs-through-the-tunnel`, `hood-is-a-liftoff-lid` and
  # `return-run-under-the-table` — three of the four critical features — were only readable at the
  # outfeed end. Swinging toward side-on shows both open tables, the three section joints and the
  # return strand at once. What it costs is the view INTO the hood mouth, and that state is CORTE's job.
  # The build asserts the framing instead of trusting it: every corner of the root bbox is projected
  # to NDC and console.error fires outside |x| <= 0.93 / -0.93 <= y <= 0.75. The gate cannot see the
  # frame edge (two sessions shipped cropped subjects at exit 0), so the page has to.
  azimuth_deg: 64
  elevation_deg: 14
  fov: 38
  target_y_m: 0.80
  radius_m: 6.35

lighting: house-rig-plus-fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # Same deviation as the other stainless subjects in this family: raised environmentIntensity for
  # the specular term on large bare-metal planes plus a camera-side fill for the diffuse term.
  # metalness stays 0.90 on the stainless — HANDBOOK §3.1 is not negotiable. The insulated panel is
  # dielectric and is protected from the raised environment by its mid-value albedo, not by a second rig.

ui_controls:
  - "AUTO-ROTATE"
  - "MARCHA"      # product advances along the belt, drums and hood fans spin
  - "CORTE"       # hood covers go translucent, exposing the evaporator, fans, belt and product inside
  - "COTAS"       # marks the 5.00 m length, the 0.90 m working height and the 3.00 m covered span

colorTarget:
  # MEASURED off the gate capture (headless SwiftShader, 1280x800, spec camera) — not estimated.
  srgb: [195, 203, 206]
  deltaE00Max: 8
  crop: "24x24+586+364"      # the INSULATED COVER's side face: the largest uniform surface in frame
  # The crop is anchored by PROJECTED GEOMETRY, not by picking a plausible-looking colour: the panel
  # side face lives at z = +0.48, y 0.89..1.16, so world points (-0.9 / 0.0 / +0.9, 1.03, 0.48) were
  # projected through this exact camera to pixels (451,360) / (598,377) / (767,395) and all three
  # 24x24 crops measured 195,203,206 at standard deviation 0.0-0.5. Two obvious-looking alternatives
  # were rejected BY MEASUREMENT, not by eye: the cover's top face reads sd 15 (it straddles a lift
  # handle and a joint batten) and the stainless deck edge reads sd 19 (it straddles the belt line).
  # A crop is only worth what the surface under it is, and the cheap way to know which surface that
  # is, is to project the geometry rather than to trust the hue.

# CORTE is a MATERIAL swap, never a geometry substitution — inherited from empacadora-flowwrap. A
# hide-list and a restore-list are two different lists and they diverge silently. Nothing is hidden
# here, so that defect class cannot occur. Note this subject has ONE envelope (the hood), not two
# concentric ones: the evaporator inside it is an object, not a second closed shell, so there is no
# inner surface left reading solid after the cut.
