# DesignSpec — vertical compressed-air receiver, 500 L / 11 bar
# First asset of the catalog `utilities` family. Dimensional evidence is a preserved manufacturer
# product page: research/sources/B59-proceso-dims/atlas-copco-lv511-500l-receiver.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# WHY THIS ASSET IS THE HOUSE GOTCHA IN PURE FORM: it is one big BARE GALVANISED vertical cylinder.
# That is exactly the subject that reflects the dark horizon and reads as flat grey. The fix is
# light (fill toward the normal + environmentIntensity), never dropping metalness. See §lighting.

design: tanque-pulmon
family: utilities
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 0, action_readiness: 0}
  tier: simple
  notes: >
    A pressure vessel is a body of revolution, so the whole shell is ONE LatheGeometry driven by a
    real DIN 28011 Klöpper profile. Repetition is only the legs and the flange bolting — well under
    the [Block 54] instancing threshold, so almost nothing is instanced.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/atlas-copco-lv511-500l-receiver.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — galvanized steel = bare metal 0.9-1.0, roughness ~0.45 (spangle)"
    sibling_spec: "disenos/catalog/fluidos/bomba-centrifuga/design-spec.yaml (same evidence discipline)"
    lighting_precedent: "memory: vertical-subject-lighting — the house rig was calibrated on horizontal equipment"

references:
  - source: "research/sources/B59-proceso-dims/atlas-copco-lv511-500l-receiver.md (Atlas Copco LV511)"
    evidences: >
      500 L vertical receiver: diameter 600 mm, overall height 2,185 mm, max working pressure 11 bar,
      inlet and outlet G2", inlet 799 mm from base, outlet 1,799 mm from base, galvanised finish,
      114 kg, certified to 2014/29/EU (simple pressure vessels).
    suitability: pass
  - source: "DIN 28011 torispherical (Klöpper) end + the capacity arithmetic"
    evidences: >
      DERIVED and self-checking: with Klöpper ends (crown 1.0 D, knuckle 0.1 D, depth 0.1935 D =
      116 mm on Ø600) the shell closes at 2,188 mm overall for a 1,655 mm barrel on a 300 mm leg
      stand — against the published 2,185 mm. That barrel plus two ends encloses
      pi*0.30^2*1.655 + 2*0.0216 = 0.511 m3, i.e. a 500 L nominal vessel. Two independent published
      numbers (Ø600 and 2,185) and the nameplate capacity all agree, so the end geometry is not free
      invention — it is the only shape that makes the three fit.
    suitability: pass
  - source: "EN 286-1 / 2014/29/EU vessel fittings practice"
    evidences: >
      A receiver in service carries a safety valve, a pressure gauge, a drain at the LOW point and a
      nameplate. Positions are not published per model, so their placement is [INFER] — but their
      PRESENCE is not optional equipment, it is what makes the vessel legal to operate.
    suitability: partial

dimensions_real:
  shell_od_m:      {value: 0.600, confidence: high}   # [CERT-web] diameter
  overall_h_m:     {value: 2.185, confidence: high}   # [CERT-web] overall height
  barrel_h_m:      {value: 1.655, confidence: med}    # [INFER] derived so the ends + stand close on 2.185
  end_depth_m:     {value: 0.116, confidence: med}    # [INFER] DIN 28011 Klöpper 0.1935 D
  knuckle_r_m:     {value: 0.060, confidence: med}    # [INFER] DIN 28011 knuckle 0.1 D
  crown_r_m:       {value: 0.600, confidence: med}    # [INFER] DIN 28011 crown 1.0 D
  stand_h_m:       {value: 0.300, confidence: low}    # [INFER] leg stand, set by the 2.185 closure
  inlet_y_m:       {value: 0.799, confidence: high}   # [CERT-web] inlet 799 mm from base
  outlet_y_m:      {value: 1.799, confidence: high}   # [CERT-web] outlet 1,799 mm from base
  port_size:       {value: "G2\"", confidence: high}  # [CERT-web]
  legs:            {value: 3, confidence: low}        # [INFER] not published; 3 is the common stand for this size
  design_p_bar:    {value: 11, confidence: high}      # [CERT-web]
  capacity_l:      {value: 500, confidence: high}     # [CERT-web] nameplate

hierarchy:
  - name: root
    children:
      - name: shell          # one LatheGeometry: lower Klöpper end + barrel + upper Klöpper end
        pivot: [0, 0, 0]
        animation: none
      - name: stand          # 3 legs + base plates
        pivot: [0, 0, 0]
        animation: none
      - name: fittings       # safety valve, gauge, drain, inspection plate, nameplate
        pivot: [0, 0, 0]
        animation: none
      - name: piping         # inlet at 799 and outlet at 1,799 with their unions
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: shell-galvanized
    family: bare-metal
    color: "#b9bdbe"
    metalness: 0.90
    roughness: 0.45            # galvanized spangle — duller than polished stainless
    evidence: "[CERT-web] 'galvanised steel'; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.9
  - id: fitting-brass
    family: bare-metal
    color: "#b08d57"
    metalness: 0.85
    roughness: 0.35
    evidence: "safety valve / drain cock bodies are brass on this class of vessel"
    confidence: 0.7
  - id: gauge-black
    family: painted-metal
    color: "#1a1d21"
    metalness: 0.0
    roughness: 0.55
    evidence: "pressure-gauge case — painted, dielectric"
    confidence: 0.7
  - id: gauge-face
    family: paper
    color: "#e8e6df"
    metalness: 0.0
    roughness: 0.9
    evidence: "gauge dial face; also the nameplate ground"
    confidence: 0.7
  - id: pipe-steel
    family: bare-metal
    color: "#9aa0a3"
    metalness: 0.88
    roughness: 0.40
    evidence: "G2\" carbon-steel connections"
    confidence: 0.75

critical_features:
  - id: torispherical-ends
    desc: >
      Both ends are DISHED (knuckle then crown), not flat plates and not hemispheres. A pressure
      vessel with flat ends is the single most common modelling error — and here the dished depth is
      load-bearing evidence: it is what makes Ø600 + 2,185 mm come out at 500 L.
    threshold: 0.80
  - id: ports-at-published-heights
    desc: >
      Inlet at 799 mm and outlet at 1,799 mm above the BASE (not above the tangent line), both on the
      barrel. The 1 m separation is the whole point of a receiver: air enters low and leaves high so
      condensate drops out.
    threshold: 0.75
  - id: drain-at-the-low-point
    desc: >
      The drain sits at the LOWEST point of the lower dished end. A drain anywhere else cannot empty
      the vessel, which is the reason the end is dished downward at all.
    threshold: 0.75
  - id: galvanized-reads-as-metal
    desc: >
      The shell reads as BARE galvanized metal with a bright horizon-side gradient — not as flat grey
      paint. If it goes flat, the fix is the fill light and environmentIntensity, NOT metalness.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40
    tris: 120000

camera:
  azimuth_deg: 44
  elevation_deg: 10            # a 2.2 m tall, 0.6 m wide subject — near-level framing
  fov: 38
  target_y_m: 1.05
  radius_m: 4.30

lighting: house-rig-plus-fill
  # DEVIATION, and it is the point of this asset: a bare vertical cylinder shows the house rig's
  # calibration gap. environmentIntensity is lifted to 2.7 and a fill light is placed on the camera
  # side so the curved flank carries a gradient. metalness stays at 0.90 — dropping it would fake
  # the look by breaking the "galvanized = bare metal" material claim.

ui_controls:
  - "AUTO-ROTATE"
  - "ACCESORIOS"               # safety valve / gauge / drain / plates
  - "TUBERÍA"                  # inlet + outlet connections
  - "COTAS"                    # marks the 799 / 1,799 mm port heights against the shell

colorTarget:
  # MEASURED from the rendered galvanized flank (headless SwiftShader capture at 1280x800).
  # The SHELL is the target: "galvanized reads as metal, not flat grey" is the claim at risk.
  srgb: [144, 149, 152]
  deltaE00Max: 8
  crop: "24x24+600+420"   # lit flank at 1280x800, default camera.
  # Corroborating reads from the same capture, kept because the CLAIM is a gradient, not a colour:
  # mid flank (133,139,144) and shadow side (60,63,66). A flat-grey regression would collapse that
  # spread even while the lit patch still passed dE00.
