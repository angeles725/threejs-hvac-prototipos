# DesignSpec — reverse-osmosis skid, 6 x 4040 pressure vessels (2 elements each)
# Evidence: research/sources/B59-proceso-dims/ro-membrane-elements.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# The nicest evidence in this family group: the element designation IS its dimension, so vessel
# length is an integer multiple of a 1,016 mm standard part plus closures. There is no styling
# freedom in the main axis of this asset.

design: osmosis-inversa
family: utilities
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    Repetition 3 and it is finally the clean instancing case in this family: six identical pressure
    vessels in a 2 x 3 array, plus their end closures and clamps. Everything else is unique.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/ro-membrane-elements.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — FRP wrap is a dielectric; pump/piping stainless 0.9+"
    sibling_spec: "disenos/catalog/fluidos/filtro-arena/design-spec.yaml — same water-treatment train"

references:
  - source: "research/sources/B59-proceso-dims/ro-membrane-elements.md"
    evidences: >
      "The designation '4040' describes the physical dimensions of the element: 4.0 inches in
      diameter and 40 inches in length" — 101.6 x 1016 mm, actual element diameter 3.9 in (99 mm).
      8040 = 203 x 1016 mm. 4040 membranes fit standard 4-inch pressure vessels rated 300 psi and
      up, outer wrap FRP. Membrane area 78-85 ft2; BW-4040 ~2,400 GPD at 225 psi, 99.5 % rejection.
    suitability: pass
  - source: "vessel length — derived from the element count"
    evidences: >
      A 2-element vessel is 2 x 1,016 mm of membrane plus end closures: 2,210 mm modelled with
      2 x 89 mm closures. This is a DERIVED length, not a chosen one — a different vessel length
      would contradict an integer count of a standard part.
    suitability: pass
  - source: "skid arrangement — chosen, not measured"
    evidences: >
      Frame size, 2 x 3 vessel array, high-pressure pump, cartridge prefilter, instrument and piping
      layout are all [INFER]. Nothing in the sources fixes them.
    suitability: partial

dimensions_real:
  element_d_m:     {value: 0.099, confidence: high}   # [CERT-web] 3.9 in actual element diameter
  element_l_m:     {value: 1.016, confidence: high}   # [CERT-web] 40 in
  elements_per_vessel: {value: 2, confidence: low}    # [INFER] chosen; sets the vessel length
  vessel_l_m:      {value: 2.210, confidence: high}   # [CERT-web] derived: 2 x 1.016 + 2 x 0.089
  vessel_od_m:     {value: 0.125, confidence: med}    # [CERT-web] 4-inch FRP housing outside diameter
  vessels:         {value: 6, confidence: low}        # [INFER] 2 rows x 3
  press_psi:       {value: 300, confidence: high}     # [CERT-web] vessel rating floor
  duty_gpd:        {value: 2400, confidence: high}    # [CERT-web] BW-4040 at 225 psi
  frame_m:         {value: [2.50, 0.95, 1.65], confidence: low}   # [INFER]

hierarchy:
  - name: root
    children:
      - name: frame        # welded skid frame + feet
        pivot: [0, 0, 0]
        animation: none
      - name: vessels      # 6 FRP pressure vessels + closures + saddle clamps (instanced)
        pivot: [0, 0, 0]
        animation: none
      - name: pump         # high-pressure multistage pump + motor
        pivot: [-0.95, 0.45, 0]
        animation: none
      - name: prefilter    # cartridge filter housing ahead of the pump
        pivot: [-0.95, 0.75, 0.34]
        animation: none
      - name: piping       # feed / concentrate / permeate headers and instruments
        pivot: [0, 0, 0]
        animation: none
      - name: panel        # control panel + gauges + flow meters
        pivot: [1.05, 1.15, 0]
        animation: none

materials:
  - id: vessel-frp
    family: plastic
    color: "#d6d2c8"
    metalness: 0.0
    roughness: 0.42
    evidence: "[CERT-web] FRP (fibreglass reinforced plastic) outer wrap — dielectric, semi-gloss"
    confidence: 0.85
  - id: closure-grey
    family: plastic
    color: "#575e64"
    metalness: 0.0
    roughness: 0.5
    evidence: "moulded end closures and permeate ports"
    confidence: 0.7
  - id: frame-painted
    family: painted-metal
    color: "#2f6b8a"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted steel skid frame — dielectric"
    confidence: 0.8
  - id: pipe-stainless
    family: bare-metal
    color: "#c2c7c9"
    metalness: 0.92
    roughness: 0.32
    evidence: "high-pressure stainless piping and pump body; HANDBOOK §3"
    confidence: 0.85
  - id: motor-grey
    family: painted-metal
    color: "#5c646a"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted pump motor frame — dielectric"
    confidence: 0.75
  - id: panel-face
    family: painted-metal
    color: "#e6e4de"
    metalness: 0.0
    roughness: 0.6
    evidence: "control panel face and instrument dials"
    confidence: 0.7

critical_features:
  - id: vessel-length-is-an-element-count
    desc: >
      Each vessel is 2 x 1,016 mm of membrane plus closures. The length is derived from an integer
      count of a standard part, so an arbitrary vessel length silently contradicts the evidence even
      though it would render fine.
    threshold: 0.80
  - id: permeate-out-both-ends-concentrate-one
    desc: >
      Each vessel takes feed at one end, gives concentrate at the other, and permeate from the
      centre port of both closures. Piping that treats a vessel as a plain pipe misses what the
      machine does.
    threshold: 0.75
  - id: frp-reads-dielectric-against-stainless
    desc: >
      FRP wrap is a semi-gloss DIELECTRIC and must not read as metal, while the high-pressure pump
      and piping read as bare stainless. Two material families in one frame.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60          # measured 56
    tris: 200000       # measured 8,634

camera:
  azimuth_deg: 46
  elevation_deg: 14
  fov: 38
  target_y_m: 0.90
  radius_m: 5.40

lighting: house-rig
  # No deviation: the dominant surfaces are horizontal FRP cylinders and a painted frame, both of
  # which the house rig handles. The stainless pump is small and cylindrical, so it self-highlights.

ui_controls:
  - "AUTO-ROTATE"
  - "TUBERÍA"                  # feed / concentrate / permeate headers
  - "MEMBRANAS"                # slide the elements out of one vessel to show the 2 x 40 in stack
  - "COTAS"                    # marks the 1,016 mm element pitch along a vessel

colorTarget:
  # MEASURED from a rendered FRP vessel wrap (headless SwiftShader capture at 1280x800).
  srgb: [200, 213, 217]
  deltaE00Max: 8
  crop: "20x20+620+380"   # FRP wrap of an upper-row vessel at 1280x800, default camera.
  # The FRP is the claim at risk: at 200,213,217 it reads as a bright semi-gloss DIELECTRIC against
  # the stainless pump and piping. If a later edit made it metal it would darken toward the shaded
  # environment instead of holding this near-white value.
