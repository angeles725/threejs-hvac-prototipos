# DesignSpec — duplex water softener: two FRP columns, brine tank, three-valve bypass
# Catalog family `utilities` (worktree catalog-proceso, taken by the catalog-retail-lab session).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# ASSET SIN FICHA DE FABRICANTE. Por la política del ONBOARD (precedente barrera-vehicular):
# todas las confidences van en LOW, la lista de fuentes intentadas queda documentada abajo, y el HUD
# avisa que las cotas no están certificadas. No hay ninguna cifra declarada como high o med.

design: suavizador-agua
family: utilities
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # el tubo de salmuera de 10 mm es material, no vóxel

complexity:
  # Evaluación previa de 8 ejes (0-3 cada uno). Suma 12 -> moderate.
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    La identidad es DÚPLEX: dos columnas idénticas que alternan servicio y regeneración, por eso cada
    una lleva su propia válvula de control y ambas se atan a un solo tanque de salmuera. repetition 1:
    dos columnas no son repetición real, así que NO se usa instancing (block54 §2.3 es licencia, no
    obligación). occlusion 2: el lecho de resina solo existe en el estado de corte.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    coated_exposure: "acero/plástico recubierto: env ~1.7, sin refuerzo de metal desnudo (ONBOARD)"
    routed_lines: >
      disenos/catalog/instrumentacion/transmisor-tuberia/ — una línea tiene que aterrizar en algo;
      un tramo horizontal suelto a media altura se lee como tubería flotando.

references:
  - source: "SIN FICHA — fuentes intentadas, ninguna preservada en research/sources/"
    evidences: >
      [INFER] Busqué evidencia dimensional en el corpus del repo antes de modelar y NO existe para
      este asset. Fuentes intentadas: (1) research/sources/B59-proceso-dims/ — contiene fichas de
      bomba EN733 (Pedrollo FG, KOP KDIN), compresor de tornillo Atlas Copco G15-22, secador Hertz
      HRD, tanque pulmón LV511, membranas de OI, filtro de arena, mariposa wafer DN100, tolva de flujo
      másico y proporciones de mezclador de cinta: ninguna cubre un suavizador; (2) research/SOURCES.md
      y research/sources/datasheets/ — sin entrada de intercambio iónico; (3) los bloques de research
      existentes (B57-B65) — ninguno trata ablandamiento.
      Lo modelado sigue el MÓDULO de mercado 12x52 in de vaso FRP con válvula multipuerto superior,
      tanque de salmuera separado y bypass de tres válvulas. Es una convención de producto, no una
      hoja de datos: por eso todo va en low y el HUD lo declara.
    suitability: partial

dimensions_real:
  # TODAS en low a propósito: ver el bloque de política arriba.
  vessel_d_m:     {value: 0.30, confidence: low}    # [INFER] vaso FRP 12 in
  vessel_h_m:     {value: 1.32, confidence: low}    # [INFER] 52 in
  vessels:        {value: 2,    confidence: low}    # [INFER] configuración dúplex
  vessel_pitch_m: {value: 0.42, confidence: low}    # [INFER] separación entre columnas
  valve_h_m:      {value: 0.22, confidence: low}    # [INFER] válvula multipuerto sobre el cuello
  brine_d_m:      {value: 0.46, confidence: low}    # [INFER] tanque de salmuera
  brine_h_m:      {value: 0.84, confidence: low}    # [INFER]
  header_y_m:     {value: 1.86, confidence: low}    # [INFER] altura de cabezales
  bypass_valves:  {value: 3,    confidence: low}    # [INFER] entrada, salida y puente
  resin_fraction: {value: 0.62, confidence: low}    # [INFER] lecho de resina sobre la altura del vaso
  base_ring_h_m:  {value: 0.06, confidence: low}    # [INFER] base moldeada

hierarchy:
  - name: root
    children:
      - name: columnas        # base, envolvente FRP, domo, cuello, válvula de control, cabezal
        pivot: [0, 0, 0]
        animation: none
      - name: cut             # medio casco + grava + resina + tubo montante + distribuidor (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: brine           # tanque, tapa, pozo de salmuera con su flotador (togglable)
        pivot: [0.78, 0, 0]
        animation: none
      - name: bypass          # cabezales, bajantes, puente de 3 válvulas, líneas de salmuera (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: drenaje         # de la válvula derecha al embudo de piso
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: frp-vessel
    family: composite
    color: "#dfe3e2"
    metalness: 0.0             # FRP bobinado: DIELÉCTRICO
    roughness: 0.42
    evidence: "HANDBOOK §3.1 — superficie recubierta/compuesta 0.0-0.05"
    confidence: 0.8
  - id: valve-polyamide
    family: plastic
    color: "#39434c"
    metalness: 0.0
    roughness: 0.48
    evidence: "HANDBOOK §3.1 — cuerpo de válvula moldeado"
    confidence: 0.75
  - id: header-brass
    family: bare-metal
    color: "#b08b3e"
    metalness: 0.90
    roughness: 0.34
    evidence: "HANDBOOK §3.1 metal desnudo 0.9-1.0"
    confidence: 0.8
  - id: pipe-steel
    family: bare-metal
    color: "#c2c7cb"
    metalness: 0.92
    roughness: 0.30
    evidence: "HANDBOOK §3.1"
    confidence: 0.8
  - id: brine-pe
    family: plastic
    color: "#8f9aa2"
    metalness: 0.0
    roughness: 0.55
    evidence: "[INFER] tanque de polietileno — dieléctrico"
    confidence: 0.75
  - id: resin-bed
    family: granular
    color: "#a8763f"
    metalness: 0.0
    roughness: 0.80
    evidence: "[INFER] resina catiónica ámbar; solo visible en el corte"
    confidence: 0.7

critical_features:
  - id: duplex-legible
    desc: >
      Dos columnas iguales, cada una con su válvula de control, atadas a un único tanque de salmuera.
      Una sola columna sería otro producto (símplex) y dos tanques de salmuera serían un error.
    threshold: 0.78
  - id: lineas-que-aterrizan
    desc: >
      Cada línea de salmuera baja por el costado de su columna y llega al pozo del tanque; el drenaje
      va de la válvula al embudo de piso. Ningún tramo termina en el aire.
    threshold: 0.78
  - id: corte-muestra-el-lecho
    desc: >
      El estado CORTE cambia el casco por medio casco y deja ver grava, resina, tubo montante y
      distribuidor inferior. Es un estado de visibilidad, no geometría destruida: la columna se
      vuelve a cerrar.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60
    tris: 20000
  measured:             # captura headless SwiftShader 1280x800 — los CONTEOS valen, el frame time NO
    draws: 42
    tris: 3098
    geometries: 43
    root_meshes: 52

camera:
  azimuth_deg: 54
  elevation_deg: 8
  fov: 38
  target_y_m: 1.02
  radius_m: 4.35

lighting: house-rig + fill lateral (exposición de superficie recubierta)
  # DESVIACIÓN DOCUMENTADA: FRP y poliamida son dieléctricos, así que NO llevan el refuerzo de IBL del
  # metal desnudo: environmentIntensity 1.7 y exposure 1.10, con fill lateral 0.95 para las dos
  # columnas verticales. Metalness/roughness sin tocar (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "CORTE DE COLUMNA"   # intercambia el casco izquierdo por el medio casco con el lecho
  - "SALMUERA"           # tanque de salmuera
  - "BYPASS"             # cabezales, bajantes y puente de 3 válvulas

colorTarget:
  # MEDIDO del casco FRP renderizado (captura headless SwiftShader a 1280x800): parche más plano
  # hallado por barrido sobre la columna derecha, desviación por canal ~0.5. No es un valor inventado.
  srgb: [233, 234, 234]
  deltaE00Max: 8
  crop: "20x24+605+306"
