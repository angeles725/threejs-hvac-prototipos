<!doctype html>
<!--
  CATALOG ASSET — utilities/suavizador-agua · twin-tank water softener with brine tank and bypass.
  Built from disenos/catalog/shell-template.html. Contract: __suavizadorAguaApp.runtime +
  __qaRenderInfo + data-app-ready, render-on-demand, shadows frozen (autoUpdate=false, 1024), DPR<=2.
  NO instancing: nothing here repeats enough to earn a batch (block54 §2.3 is a licence, not a rule).
  The identity is DUPLEX: two identical vessels alternating service and regeneration, which is why
  both carry their own control valve and both are tied to one brine tank.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suavizador de agua dúplex — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">SUAVIZADOR DE AGUA DÚPLEX — 2 columnas + tanque de salmuera</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· FRP bobinado · válvulas de poliamida · cabezal de latón</span></div>
  <div><span class="dim">columnas Ø 0.30 × 1.32 m · salmuera Ø 0.46 × 0.84 m · bypass de 3 válvulas</span></div>
  <div><span class="dim">SIN FICHA: cotas no certificadas — módulo 12×52" del mercado, no una hoja de fabricante</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnCut">CORTE DE COLUMNA</button>
  <button id="btnBrine" class="on">SALMUERA</button>
  <button id="btnBypass" class="on">BYPASS</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
// [INFER] no preserved datasheet for this asset: the sizes follow the 12x52 in FRP vessel module
// that the domestic/light-commercial softener market is built on.
const V_R = 0.152, V_H = 1.32;         // 12 in x 52 in FRP vessel
const V_DX = 0.42;                     // spacing between the two columns
const BASE_Y = 0.06;                   // moulded base ring
const VALVE_H = 0.22;                  // multiport control valve on the vessel neck
const BRINE_R = 0.23, BRINE_H = 0.84;  // brine tank
const BRINE_X = 0.78;
const HDR_Y = 1.86;                    // inlet / outlet header height
const RESIN_FRAC = 0.62;               // resin bed as a fraction of the vessel height

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 6, 20);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 4.35, AZ = 0.95, EL = 0.14;   // el cabezal y el bypass viven a 1.9 m: con R=3.55
                                        // el encuadre los cortaba por arriba
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 1.10 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0.22, 1.02, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0.22, 1.02, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.7;   // FRP and polyamide are COATED/dielectric: no bare-metal boost

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5.5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.shadow.camera.left=-2.2; sun.shadow.camera.right=2.2; sun.shadow.camera.top=2.4; sun.shadow.camera.bottom=-2.4;
scene.add(sun);
// VERTICAL-SUBJECT FILL: two 1.3 m columns are vertical cylinders facing the dark horizon.
const fill = new THREE.DirectionalLight(0xf2f6ff, 0.95);
fill.position.set(-2.8, 2.2, 4.0);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(16,16),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1: filament-wound FRP, polyamide valve bodies and PE brine tank
// are all DIELECTRIC; only the brass header fittings and the tubing are bare metal.
// ============================================================================
const matVessel = new THREE.MeshStandardMaterial({ color:0xdfe3e2, metalness:0.0, roughness:0.42 });
const matBase   = new THREE.MeshStandardMaterial({ color:0x2f3439, metalness:0.0, roughness:0.62 });
const matValve  = new THREE.MeshStandardMaterial({ color:0x39434c, metalness:0.0, roughness:0.48 });
const matHead   = new THREE.MeshStandardMaterial({ color:0xb08b3e, metalness:0.90, roughness:0.34 });
const matPipe   = new THREE.MeshStandardMaterial({ color:0xc2c7cb, metalness:0.92, roughness:0.30 });
const matBrine  = new THREE.MeshStandardMaterial({ color:0x8f9aa2, metalness:0.0, roughness:0.55 });
const matLid    = new THREE.MeshStandardMaterial({ color:0x7b858c, metalness:0.0, roughness:0.58 });
const matTube   = new THREE.MeshStandardMaterial({ color:0xd8dcde, metalness:0.0, roughness:0.35 });
const matResin  = new THREE.MeshStandardMaterial({ color:0xa8763f, metalness:0.0, roughness:0.80 });
const matGravel = new THREE.MeshStandardMaterial({ color:0x6d6a63, metalness:0.0, roughness:0.90 });
const matScreen = new THREE.MeshStandardMaterial({ color:0x0b2130, metalness:0.0, roughness:0.30,
                                                   emissive:0x1663a0, emissiveIntensity:1.2 });
const matHandle = new THREE.MeshStandardMaterial({ color:0xb02a1e, metalness:0.0, roughness:0.50 });

// ============================================================================
// ZONE 2 — GEOMETRY
// ============================================================================
const root = new THREE.Group();
const box = (parent,w,h,d,mat,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); parent.add(m); return m; };
const cyl = (parent, r0, r1, h, seg, mat, x,y,z, rx=0, rz=0, open=false)=>{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg, 1, open), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); m.rotation.set(rx,0,rz);
  parent.add(m); return m;
};

// --- two columns: base ring, filament-wound shell, domed top, control valve, riser ---
const cutParts = [];        // the halves swapped in by the CORTE toggle
const colX = [-V_DX/2, V_DX/2];
for(const cx of colX){
  cyl(root, V_R + 0.012, V_R + 0.012, BASE_Y, 26, matBase, cx, BASE_Y/2, 0);
  const shell = cyl(root, V_R, V_R, V_H, 26, matVessel, cx, BASE_Y + V_H/2, 0);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(V_R, 26, 12, 0, Math.PI*2, 0, Math.PI/2), matVessel);
  dome.castShadow = dome.receiveShadow = true; dome.position.set(cx, BASE_Y + V_H, 0);
  root.add(dome);
  cutParts.push(shell, dome);
  // neck + multiport control valve + electronic head
  cyl(root, 0.055, 0.055, 0.05, 16, matVessel, cx, BASE_Y + V_H + V_R - 0.01, 0);
  box(root, 0.17, VALVE_H, 0.15, matValve, cx, BASE_Y + V_H + V_R + VALVE_H/2, 0);
  box(root, 0.13, 0.09, 0.03, matScreen, cx, BASE_Y + V_H + V_R + VALVE_H - 0.05, 0.085);
  cyl(root, 0.026, 0.026, 0.05, 12, matHead, cx, BASE_Y + V_H + V_R + VALVE_H + 0.02, 0);
}

// --- cutaway internals: resin bed, gravel underbed, riser tube and lower distributor ---
// Hidden by default; the CORTE toggle swaps the left shell for these. Nothing is deleted, so the
// vessel can be closed again — the cut is a visibility state, not destructive geometry.
const cut = new THREE.Group();
{
  const cx = colX[0];
  const inner = V_R - 0.008;
  // half shell so the bed is visible from the camera side: a full cylinder would hide it
  const half = new THREE.Mesh(new THREE.CylinderGeometry(V_R, V_R, V_H, 26, 1, true, Math.PI*0.5, Math.PI),
                              new THREE.MeshStandardMaterial({ color:0xdfe3e2, metalness:0.0, roughness:0.42,
                                                               side:THREE.DoubleSide }));
  half.castShadow = true; half.position.set(cx, BASE_Y + V_H/2, 0); cut.add(half);
  cyl(cut, inner, inner, 0.09, 24, matGravel, cx, BASE_Y + 0.045, 0);
  cyl(cut, inner, inner, V_H*RESIN_FRAC, 24, matResin, cx, BASE_Y + 0.09 + V_H*RESIN_FRAC/2, 0);
  cyl(cut, 0.016, 0.016, V_H - 0.06, 12, matTube, cx, BASE_Y + V_H/2, 0);          // riser
  cyl(cut, 0.045, 0.045, 0.05, 14, matTube, cx, BASE_Y + 0.055, 0);                // lower distributor
  for(let i=0;i<6;i++){
    const a = (i/6)*Math.PI*2;
    cyl(cut, 0.008, 0.008, inner*0.8, 8, matTube,
        cx + Math.cos(a)*inner*0.4, BASE_Y + 0.055, Math.sin(a)*inner*0.4, 0, Math.PI/2);
  }
}
cut.visible = false;
root.add(cut);

// --- brine tank: body, lid, brine well with its safety float, salt fill ---
const brine = new THREE.Group();
cyl(brine, BRINE_R, BRINE_R*0.94, BRINE_H, 28, matBrine, BRINE_X, BRINE_H/2, 0);
cyl(brine, BRINE_R + 0.015, BRINE_R + 0.015, 0.035, 28, matLid, BRINE_X, BRINE_H + 0.017, 0);
cyl(brine, 0.055, 0.055, BRINE_H + 0.10, 16, matTube, BRINE_X - BRINE_R*0.55, (BRINE_H + 0.10)/2, 0.02);
cyl(brine, 0.062, 0.062, 0.03, 16, matLid, BRINE_X - BRINE_R*0.55, BRINE_H + 0.12, 0.02);
box(brine, 0.10, 0.04, 0.06, matLid, BRINE_X, BRINE_H + 0.05, BRINE_R*0.55);       // lid handle
root.add(brine);

// --- headers and bypass: inlet, outlet and the three-valve bypass loop ---
const bypass = new THREE.Group();
cyl(bypass, 0.024, 0.024, 1.05, 16, matPipe, 0, HDR_Y, -0.16, 0, Math.PI/2);        // inlet header
cyl(bypass, 0.024, 0.024, 1.05, 16, matPipe, 0, HDR_Y - 0.14, 0.16, 0, Math.PI/2);  // outlet header
for(const cx of colX){                                                              // drops to each valve
  cyl(bypass, 0.020, 0.020, HDR_Y - (BASE_Y + V_H + V_R + VALVE_H) + 0.02, 12, matPipe,
      cx, (HDR_Y + BASE_Y + V_H + V_R + VALVE_H)/2, -0.16);
  cyl(bypass, 0.020, 0.020, HDR_Y - 0.14 - (BASE_Y + V_H + V_R + VALVE_H) + 0.02, 12, matPipe,
      cx, (HDR_Y - 0.14 + BASE_Y + V_H + V_R + VALVE_H)/2, 0.16);
}
// the bypass leg itself: a pipe joining inlet and outlet, with three quarter-turn valves
cyl(bypass, 0.024, 0.024, 0.32, 16, matPipe, -0.62, HDR_Y - 0.07, 0, Math.PI/2);
for(const [vx, vz] of [[-0.34, -0.16], [-0.34, 0.16], [-0.62, 0]]){
  box(bypass, 0.07, 0.07, 0.07, matPipe, vx, HDR_Y - (vz === 0 ? 0.07 : (vz < 0 ? 0 : 0.14)), vz);
  box(bypass, 0.11, 0.018, 0.022, matHandle, vx, HDR_Y - (vz === 0 ? 0.07 : (vz < 0 ? 0 : 0.14)) + 0.055, vz);
}
// brine line from each control valve: DOWN the side of its column, then across to the brine well.
// A single horizontal stub at valve height (the first version) ended in mid-air — a line has to land.
{
  const wellX = BRINE_X - BRINE_R*0.55, wellTopY = BRINE_H + 0.12;
  const valveY = BASE_Y + V_H + V_R + VALVE_H*0.5;
  for(const cx of colX){
    const sideX = cx + 0.115;
    cyl(bypass, 0.010, 0.010, 0.23, 10, matTube, (cx + sideX)/2, valveY, 0.02, 0, Math.PI/2);
    cyl(bypass, 0.010, 0.010, valveY - wellTopY, 10, matTube, sideX, (valveY + wellTopY)/2, 0.02);
    cyl(bypass, 0.010, 0.010, Math.abs(wellX - sideX), 10, matTube, (sideX + wellX)/2, wellTopY, 0.02, 0, Math.PI/2);
  }
}
root.add(bypass);

// --- drain line to a floor funnel ---
{
  const dx = colX[1] + 0.20, top = BASE_Y + V_H + V_R + VALVE_H*0.35, funnelY = 0.07;
  cyl(root, 0.016, 0.016, 0.10, 12, matTube, (colX[1] + dx)/2 + 0.02, top, -0.02, 0, Math.PI/2);
  cyl(root, 0.016, 0.016, top - funnelY, 12, matTube, dx, (top + funnelY)/2, -0.02);
  cyl(root, 0.06, 0.035, 0.07, 14, matBase, dx, 0.035, -0.02);
}

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. render is GATED: every handler calls requestRender().
// ============================================================================
const btnRot    = document.getElementById('btnRot');
const btnCut    = document.getElementById('btnCut');
const btnBrine  = document.getElementById('btnBrine');
const btnBypass = document.getElementById('btnBypass');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
btnCut.onclick = ()=>{ const on = !cut.visible;
  cut.visible = on;
  cutParts[0].visible = !on; cutParts[1].visible = !on;   // swap the left shell + dome for the cut
  btnCut.classList.toggle('on', on);
  renderer.shadowMap.needsUpdate = true; requestRender(); };
const toggle = (btn, obj)=>{ btn.onclick = ()=>{ obj.visible = !obj.visible; btn.classList.toggle('on', obj.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); }; };
toggle(btnBrine, brine);
toggle(btnBypass, bypass);

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__suavizadorAguaApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__suavizador-aguaApp'] = globalThis.__suavizadorAguaApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
