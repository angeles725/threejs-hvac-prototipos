# DesignSpec — oil-injected rotary screw compressor package, 22 kW / 10 bar, full-feature canopy
# Evidence: research/sources/B59-proceso-dims/atlas-copco-g15-22-screw.pdf (G 15L-22 datasheet)
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# The interesting modelling problem here is that the subject is a BOX. Everything that says
# "compressor" rather than "cabinet" is inside it, so the asset lives or dies on the PANELES state,
# not on the default view. That is why the panels come off for real instead of going translucent:
# on bomba-centrifuga a translucent cut turned out to reveal nothing, and a removable panel is also
# what actually happens to this machine in service.

design: compresor-tornillo
family: utilities
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 3, action_readiness: 1}
  tier: moderate
  notes: >
    Occlusion 3 is the highest in the family so far and it is the whole design problem: a sound-
    attenuating canopy exists precisely to hide the machine. Repetition is the louvre slats and the
    cooler fins; both are instanced, everything else is unique.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/atlas-copco-g15-22-screw.pdf
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted sheet-steel canopy = dielectric 0.0"
    sibling_spec: "disenos/catalog/utilities/tanque-pulmon/design-spec.yaml"
    prior_vocabulary: "disenos/compresor-tornillo-aire/ — geometry vocabulary only, ARBITRARY units"

references:
  - source: "research/sources/B59-proceso-dims/atlas-copco-g15-22-screw.pdf :Technical specifications + Dimensions"
    evidences: >
      G 22 at 10 bar(e) (145 psig): FAD 54.1 l/s = 194.7 m3/hr = 114.5 cfm, installed motor power
      22 kW / 30 hp, noise level 70 dB(A). Package dimensions, floor-mounted: FM Standard
      L 1130 x W 833 x H 1220 mm (344 kg); FM Full Feature, i.e. with integrated refrigerant dryer,
      L 1280 x W 833 x H 1220 mm (408 kg). Tank-mounted variant L 1921 x W 833 x H 1832 mm.
      Max working pressures offered: 7.5 / 10 / 13 bar(e).
    suitability: pass
  - source: "same datasheet, §features"
    evidences: >
      'Full feature version with integrated refrigerant dryer and filters'; 'Main components, oil
      separator and filter are easily accessible'. The second line is why the canopy is modelled
      with REMOVABLE side panels rather than as a sealed box: serviceability is a stated feature of
      the machine, so the internals must be reachable.
    suitability: pass
  - source: "internal layout — oil-injected screw package practice"
    evidences: >
      NOT dimensioned by any source: the arrangement of motor, airend, oil separator vessel,
      combined cooler and fan inside the canopy. Their PRESENCE and their connection order (motor →
      airend → separator → cooler → outlet) are what an oil-injected package is; their individual
      sizes here are [INFER], scaled to fill the evidenced 1280 x 833 x 1220 envelope.
    suitability: partial

dimensions_real:
  canopy_l_m:      {value: 1.280, confidence: high}   # [CERT-doc] FM Full Feature L
  canopy_w_m:      {value: 0.833, confidence: high}   # [CERT-doc] W
  canopy_h_m:      {value: 1.220, confidence: high}   # [CERT-doc] H
  motor_kw:        {value: 22, confidence: high}      # [CERT-doc] installed motor power
  pressure_bar:    {value: 10, confidence: high}      # [CERT-doc] max working pressure
  fad_m3h:         {value: 194.7, confidence: high}   # [CERT-doc] capacity FAD at 10 bar
  noise_dba:       {value: 70, confidence: high}      # [CERT-doc] — the reason there IS a canopy
  weight_kg:       {value: 408, confidence: high}     # [CERT-doc] FM FF
  motor_body_d_m:  {value: 0.300, confidence: low}    # [INFER] IEC 180 class for 22 kW
  airend_d_m:      {value: 0.240, confidence: low}    # [INFER]
  separator_d_m:   {value: 0.280, confidence: low}    # [INFER]
  base_h_m:        {value: 0.120, confidence: low}    # [INFER] frame + anti-vibration feet

hierarchy:
  - name: root
    children:
      - name: base           # frame, feet, forklift channels
        pivot: [0, 0, 0]
        animation: none
      - name: canopy         # roof, end walls, back wall, corner posts, louvres — never comes off
        pivot: [0, 0, 0]
        animation: none
      - name: panels         # removable service panels AND the control panel mounted on one of them
        pivot: [0, 0, 0]
        animation: none
      - name: internals      # dryer module, motor, airend, separator, control cubicle, cooler, piping
        pivot: [0, 0, 0]
        animation: none
      - name: fan            # cooling fan; spins when OPERANDO
        pivot: [0.52, 0.86, 0]
        animation: spin-x

materials:
  - id: canopy-painted
    family: painted-metal
    color: "#b4babd"
    metalness: 0.0
    roughness: 0.52
    evidence: "painted sheet-steel canopy — dielectric; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.85
  - id: trim-dark
    family: painted-metal
    color: "#2c3237"
    metalness: 0.0
    roughness: 0.6
    evidence: "louvre recesses, base frame and control-panel surround"
    confidence: 0.8
  - id: motor-blue
    family: painted-metal
    color: "#24506b"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted motor frame — dielectric"
    confidence: 0.75
  - id: casting-grey
    family: painted-metal
    color: "#565e63"
    metalness: 0.0
    roughness: 0.58
    evidence: "airend housing / separator vessel — painted castings"
    confidence: 0.75
  - id: pipe-metal
    family: bare-metal
    color: "#a8aeb1"
    metalness: 0.88
    roughness: 0.38
    evidence: "bare steel interconnecting pipework and the cooler core"
    confidence: 0.8
  - id: hose-black
    family: rubber
    color: "#1c1f22"
    metalness: 0.0
    roughness: 0.85
    evidence: "flexible hoses between airend and separator"
    confidence: 0.7

critical_features:
  - id: envelope-is-the-evidence
    desc: >
      1,280 x 833 x 1,220 mm exactly. This is the one thing the datasheet fixes absolutely, and it
      is the whole reason the internals are sized the way they are — they must fit it.
    threshold: 0.80
  - id: internals-legible-with-panels-off
    desc: >
      With PANELES off the machine must READ as an oil-injected screw package: motor coupled to the
      airend, airend piped to the oil separator vessel, separator to the cooler, cooler to the
      outlet. A cabinet full of unrecognisable blocks fails this even if every block is present.
    threshold: 0.80
  - id: canopy-is-acoustic
    desc: >
      70 dB(A) is achieved by an enclosure, so the panels read as thick lined sheet with recessed
      louvres, not as a bare frame with cladding. Intake and discharge louvres are on OPPOSITE ends,
      because the cooling air has to cross the machine.
    threshold: 0.75
  - id: painted-canopy-vs-bare-pipework
    desc: >
      Canopy and castings read as PAINTED (dielectric); only the interconnecting pipework and cooler
      core read as bare metal.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 70
    tris: 200000

camera:
  azimuth_deg: 46
  elevation_deg: 14
  fov: 38
  target_y_m: 0.60
  radius_m: 3.60

lighting: house-rig
  # No deviation needed: the subject is a box with flat painted faces at several orientations, which
  # is exactly what the house rig was calibrated on. The vertical-metal fill is NOT applied here —
  # adding it would wash out the panel-to-panel value separation the silhouette depends on.

ui_controls:
  - "AUTO-ROTATE"
  - "PANELES"                  # remove the two service panels — the state this asset exists for
  - "OPERANDO"                 # spins the cooling fan
  - "COTAS"                    # 1,280 x 833 x 1,220 envelope markers

colorTarget:
  # MEASURED from the rendered canopy panel (headless SwiftShader capture at 1280x800).
  srgb: [215, 218, 219]
  deltaE00Max: 8
  crop: "24x24+500+430"   # front service panel at 1280x800, default camera
  # Corroborating read: the end wall in shade measures 128,133,136. That 87-point spread across two
  # faces of the SAME painted material is the panel-to-panel separation the silhouette depends on,
  # and it is why the vertical-metal fill is deliberately NOT applied to this asset.
