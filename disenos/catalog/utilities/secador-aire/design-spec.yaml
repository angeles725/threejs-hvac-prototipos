# DesignSpec — refrigerated compressed-air dryer, Hertz HRD 70 (3.30 m3/min, 16 bar)
# Evidence: research/sources/B59-proceso-dims/hertz-hrd-refrigerated-dryer.pdf
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# SIZE CHOSEN FOR TRAIN COHERENCE, and the numbers happen to prove it: the catalog already has
# utilities/compresor-tornillo (Atlas Copco G 22, 194.7 m3/hr = 3.245 m3/min) and
# utilities/tanque-pulmon (500 L receiver). HRD 70 is rated 3.30 m3/min — the smallest model in the
# range that actually covers the G 22. The three assets are therefore a real compressed-air train,
# not three unrelated boxes that happen to share a family folder.

design: secador-aire
family: utilities
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 2, occlusion: 3, action_readiness: 0}
  tier: simple
  notes: >
    Same shape problem as compresor-tornillo — a cabinet whose contents are the machine — but at a
    third of the size, so PANELES matters even more: at 553 x 503 mm there is very little silhouette
    to carry the asset on its own.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/hertz-hrd-refrigerated-dryer.pdf
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted sheet cabinet = dielectric 0.0"
    train_siblings: "utilities/compresor-tornillo (source) and utilities/tanque-pulmon (buffer)"

references:
  - source: "research/sources/B59-proceso-dims/hertz-hrd-refrigerated-dryer.pdf :model table, row HRD 70"
    evidences: >
      HRD 70: capacity 3.30 m3/min (117 cfm); connection size G 1 1/2"; 230V/1/50 Hz; refrigerant
      R-134a; maximum working pressure 16 bar; maximum ambient 50 C; maximum inlet 60 C; included
      filter HGKON 405 MX+MY; dimensions 553 x 503 x 874 mm (L x W x H); weight 78 kg.
    suitability: pass
  - source: "same table — the range steps, which fix what is and is not styling"
    evidences: >
      The range moves in fixed cabinet sizes: 423x393x567 for HRD 10-35, 473x453x832 for 40-60,
      553x503x874 for 70-90, 678x648x1157 for 100-110, 948x728x1370 for 120-130. So the envelope is
      a discrete catalogue value, not a continuum — three consecutive models share one cabinet.
    suitability: pass
  - source: "internal layout — refrigerated dryer practice"
    evidences: >
      NOT dimensioned: placement of the hermetic refrigerant compressor, air-to-air and
      air-to-refrigerant heat exchangers, condenser with fan, and the condensate separator/drain.
      Their presence and order are what a refrigerated dryer IS; the individual sizes are [INFER],
      scaled to the evidenced 553 x 503 x 874 envelope.
    suitability: partial

dimensions_real:
  cabinet_l_m:     {value: 0.553, confidence: high}   # [CERT-doc] length
  cabinet_w_m:     {value: 0.503, confidence: high}   # [CERT-doc] width
  cabinet_h_m:     {value: 0.874, confidence: high}   # [CERT-doc] height
  capacity_m3min:  {value: 3.30, confidence: high}    # [CERT-doc] covers the G 22 at 3.245
  connection:      {value: "G 1 1/2\"", confidence: high}   # [CERT-doc]
  press_bar:       {value: 16, confidence: high}      # [CERT-doc] max working pressure
  refrigerant:     {value: "R-134a", confidence: high}     # [CERT-doc]
  weight_kg:       {value: 78, confidence: high}      # [CERT-doc]
  max_ambient_c:   {value: 50, confidence: high}      # [CERT-doc]
  max_inlet_c:     {value: 60, confidence: high}      # [CERT-doc]

hierarchy:
  - name: root
    children:
      - name: base         # plinth + feet
        pivot: [0, 0, 0]
        animation: none
      - name: cabinet      # roof, back, corner posts, louvres — never comes off
        pivot: [0, 0, 0]
        animation: none
      - name: panels       # removable front/side service panels + control fascia
        pivot: [0, 0, 0]
        animation: none
      - name: internals    # refrigerant compressor, condenser, exchanger block, separator
        pivot: [0, 0, 0]
        animation: none
      - name: piping       # G 1 1/2" inlet/outlet and the condensate drain
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: cabinet-painted
    family: painted-metal
    color: "#aeb4b8"
    metalness: 0.0
    roughness: 0.52
    evidence: "painted sheet-steel cabinet — dielectric; HANDBOOK §3.1"
    confidence: 0.85
  - id: trim-dark
    family: painted-metal
    color: "#2b3136"
    metalness: 0.0
    roughness: 0.6
    evidence: "louvre recess, plinth and fascia surround"
    confidence: 0.8
  - id: compressor-black
    family: painted-metal
    color: "#26292d"
    metalness: 0.0
    roughness: 0.5
    evidence: "hermetic refrigerant compressor shell — painted"
    confidence: 0.75
  - id: coil-copper
    family: bare-metal
    color: "#9a6b45"
    metalness: 0.85
    roughness: 0.45
    evidence: "condenser and exchanger tubing — bare copper, the one warm metal in the cabinet"
    confidence: 0.7
  - id: fin-alu
    family: bare-metal
    color: "#a9aeb1"
    metalness: 0.9
    roughness: 0.45
    evidence: "aluminium condenser fins"
    confidence: 0.75
  - id: pipe-steel
    family: bare-metal
    color: "#9ea4a7"
    metalness: 0.88
    roughness: 0.40
    evidence: "G 1 1/2\" air connections"
    confidence: 0.8

critical_features:
  - id: envelope-is-a-catalogue-step
    desc: >
      553 x 503 x 874 mm exactly. The range moves in discrete cabinet sizes shared by three
      consecutive models, so the envelope is a catalogue value and not something to nudge for looks.
    threshold: 0.80
  - id: refrigeration-circuit-present
    desc: >
      With PANELES off the cabinet must read as a REFRIGERATION machine: hermetic compressor,
      finned condenser with its fan, the exchanger block and a condensate separator. A cabinet with
      only air pipes in it is a filter, not a dryer.
    threshold: 0.80
  - id: air-in-and-out-at-the-rated-size
    desc: >
      Both air connections are G 1 1/2" and sit on the same face, with the condensate drain at the
      bottom — the lowest point, for the same reason as the receiver's drain.
    threshold: 0.70

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 55          # measured 47
    tris: 150000       # measured 1,818

camera:
  azimuth_deg: 46
  elevation_deg: 14
  fov: 38
  target_y_m: 0.45
  radius_m: 2.30

lighting: house-rig
  # No deviation: flat painted faces at several orientations, which is what the house rig was
  # calibrated on — same reasoning as compresor-tornillo.

ui_controls:
  - "AUTO-ROTATE"
  - "PANELES"                  # remove the service panels — the state this asset exists for
  - "CIRCUITO"                 # highlight the refrigerant circuit against the air path
  - "COTAS"                    # 553 x 503 x 874 envelope

colorTarget:
  # MEASURED from the rendered cabinet panel (headless SwiftShader capture at 1280x800).
  srgb: [212, 215, 217]
  deltaE00Max: 8
  crop: "20x20+560+420"   # front service panel at 1280x800, default camera
  # End wall in shade reads 126,130,135 — the same painted material 86 sRGB apart by face angle,
  # the panel-to-panel separation this silhouette depends on (same reasoning as compresor-tornillo).
