# DesignSpec — single-sided pharmacy shelving, 2 bays x 7 tilted levels
# Catalog family `retail` (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: estante-farmacia
family: retail
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # a 6 mm divider fin and a 30 mm label strip are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 13 -> moderate.
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    detail 3 / repetition 3: the object is a grid of small channels. What separates it from
    retail/gondola is the DIVIDED facing — transparent fins splitting every shelf into channels —
    plus the forward shelf tilt and the shallow 0.40 m depth. Nothing moves (action_readiness 0).

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    coated_steel_lighting: "disenos/catalog/retail/gondola/design-spec.yaml (exposure 1.02 / env 1.5)"
    instancing: "block54 §2.3 — shelves, lips, labels, dividers, bins and ~300 cartons"

references:
  - source: "pharmacy shelving class (shallow single-sided bay, tilted shelves, divider channels)"
    evidences: >
      [INFER] No manufacturer datasheet was preserved for this family (retail is procedural-direct,
      not needs-research). The envelope follows the pharmacy back-wall class: ~1.0 m bay pitch,
      0.35-0.45 m depth, ~2.0 m height, shelves tilted a few degrees forward, transparent dividers
      forming single-facing channels, tilt bins on the lowest levels. Values are med/low confidence.
    suitability: partial
  - source: "disenos/catalog/retail/gondola/design-spec.yaml"
    evidences: >
      Coated-steel lighting already calibrated in this repo: exposure 1.02 and environmentIntensity
      1.5 keep white shelving from clipping, unlike bare-metal practice.
    suitability: pass

dimensions_real:
  bay_w_m:      {value: 1.00, confidence: med}    # [INFER] bay pitch
  bays:         {value: 2,    confidence: med}    # [INFER] one run, two bays
  width_m:      {value: 2.00, confidence: med}    # derived
  depth_m:      {value: 0.40, confidence: med}    # [INFER] shallow, single-sided
  height_m:     {value: 2.00, confidence: med}    # [INFER] plus a 0.14 m header
  shelf_levels: {value: 7,    confidence: low}    # [INFER] the lowest sits on the plinth
  shelf_pitch_m: {value: 0.26, confidence: low}    # [INFER]
  shelf_depth_m: {value: 0.34, confidence: low}    # [INFER]
  shelf_t_m:    {value: 0.018, confidence: low}   # [INFER]
  shelf_tilt_deg: {value: 6.0, confidence: low}    # [INFER] forward tilt so facings present themselves
  divider_pitch_m: {value: 0.184, confidence: low} # [INFER] 5 channels per bay
  label_h_m:    {value: 0.030, confidence: low}   # [INFER] front label strip
  plinth_h_m:   {value: 0.10, confidence: low}    # [INFER]
  header_h_m:   {value: 0.14, confidence: low}    # [INFER]

hierarchy:
  - name: root
    children:
      - name: plinth
        pivot: [0, 0, 0]
        animation: none
      - name: back_panel      # slotted sheet with horizontal joints
        pivot: [0, 0, 0]
        animation: none
      - name: uprights        # bay-joint verticals + closed end panels
        pivot: [0, 0, 0]
        animation: none
      - name: shelves         # InstancedMesh, tilted; lips and labels are separate upright batches
        pivot: [0, 0, 0]
        animation: none
      - name: dividers        # transparent polymer fins, 6 per bay per level (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: bins            # tilt bins on the two lowest levels (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: products        # instanced cartons standing in the channels (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: header          # front-plane band + full-depth cap
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: steel-epoxy-frame
    family: painted-metal
    color: "#dfe2e5"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.1 painted/coated panel 0.0-0.05"
    confidence: 0.85
  - id: steel-epoxy-shelf
    family: painted-metal
    color: "#d6dade"
    metalness: 0.0
    roughness: 0.56
    evidence: "HANDBOOK §3.1"
    confidence: 0.8
  - id: back-panel
    family: painted-metal
    color: "#bfc4c9"
    metalness: 0.0
    roughness: 0.66
    evidence: "HANDBOOK §3.1 — darker coat keeps the shelf line legible against the back"
    confidence: 0.75
  - id: divider-polymer
    family: plastic
    color: "#c9d3da"
    metalness: 0.0
    roughness: 0.28
    evidence: "[INFER] translucent PET/PS divider fin — dielectric, semi-transparent by design"
    confidence: 0.75
  - id: bin-polymer
    family: plastic
    color: "per-instance (blue/green/red/amber)"
    metalness: 0.0
    roughness: 0.52
    evidence: "[INFER] moulded tilt bins, colour-coded by category"
    confidence: 0.7
  - id: label-strip
    family: plastic
    color: "#f3efe4"
    metalness: 0.0
    roughness: 0.40
    evidence: "[INFER] paper ticket in a clip strip — warm white, off the shelf white so it reads"
    confidence: 0.7
  - id: header-band
    family: painted-metal
    color: "#1f6b5c"
    metalness: 0.0
    roughness: 0.44
    evidence: "[INFER] printed category header — coated, dielectric"
    confidence: 0.7

critical_features:
  - id: divided-facings
    desc: >
      Every shelf is split into channels by transparent fins, with one carton line per channel. This
      is what makes the object a PHARMACY shelf rather than the retail gondola in the same family.
    threshold: 0.78
  - id: tilted-shelf-presentation
    desc: >
      Shelves tilt forward a few degrees with an upright front lip and a label strip below it, so the
      product faces the customer instead of hiding behind the lip.
    threshold: 0.75
  - id: single-sided-shallow
    desc: >
      A 0.40 m deep, 2 m tall run against a back panel with closed end panels — not a double-sided
      island. Depth and back panel are the silhouette difference.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40
    tris: 30000
  measured:             # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 21
    tris: 5474
    geometries: 20
    root_meshes: 19

camera:
  azimuth_deg: 58
  elevation_deg: 11.5
  fov: 38
  target_y_m: 1.02
  radius_m: 4.6

lighting: house-rig + vertical-subject fill (coated-steel exposure)
  # DOCUMENTED DEVIATION: same as retail/gondola — the subject is a 2 m vertical wall of COATED
  # steel, so it needs a camera-side fill (0.8) but NOT the bare-metal IBL boost: exposure 1.02 and
  # environmentIntensity 1.5. Metalness/roughness unchanged (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "PRODUCTO"    # instanced cartons
  - "DIVISORES"   # the channel fins
  - "CAJONES"     # tilt bins on the lowest levels

colorTarget:
  # MEASURED from the rendered end panel (headless SwiftShader capture at 1280x800): the flattest
  # 40x40 patch of painted steel found by scan, per-channel std ~5. Not a guessed value.
  srgb: [201, 203, 205]
  deltaE00Max: 8
  crop: "40x40+866+272"   # right end panel at 1280x800
