# DesignSpec — double-sided supermarket gondola run (3 sections of 1.22 m)
# First asset of the catalog `retail` family (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: gondola
family: retail
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # the 22 mm shelf deck and the price rail are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 13 -> moderate.
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    The identity is a MODULE repeated: one section (uprights + shelves + facings) tiled three times
    and mirrored back to back. repetition 3 is why this asset uses InstancedMesh for shelves, price
    rails, brackets and products; the plinth, spine and end frames stay unique meshes.
    action_readiness 0: a gondola has no moving part — the toggles are visibility, not kinematics.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    painted_steel: "research/HANDBOOK.md §3.1 (coated surfaces are dielectric, metalness 0)"
    reference_asset: "disenos/catalog/estructuras/supermercado-layout/ (gondola rows in context)"
    instancing: "block54 §2.3 — instance only where the repetition is real"

references:
  - source: "retail shopfitting trade module (Lozier / Madix style gondola), imperial base grid"
    evidences: >
      [INFER] No manufacturer datasheet was preserved for this family (retail is procedural-direct,
      not needs-research), so the dimensional basis is the industry module rather than a cited page:
      4 ft (1.22 m) section pitch, 22 in (0.56 m) base deck, upper shelves shallower than the base,
      upright heights in the 54-84 in band with 72 in (1.80 m) the common grocery height.
      Every value below is therefore marked med/low confidence — none is claimed as certified.
    suitability: partial
  - source: "disenos/catalog/estructuras/supermercado-layout/supermercado-layout.html"
    evidences: "Existing gondola rows in this repo — the run length and aisle scale this unit must match."
    suitability: pass

dimensions_real:
  section_w_m:   {value: 1.22, confidence: med}    # [INFER] 4 ft trade module
  sections:      {value: 3,    confidence: med}    # [INFER] a standalone run, not a single bay
  run_w_m:       {value: 3.66, confidence: med}    # derived: section_w x sections
  height_m:      {value: 1.80, confidence: med}    # [INFER] 72 in upright, the common grocery height
  base_deck_d_m: {value: 0.56, confidence: med}    # [INFER] 22 in base shelf, per side
  base_deck_y_m: {value: 0.20, confidence: low}    # [INFER] deck height over the plinth
  total_depth_m: {value: 1.17, confidence: med}    # derived: 2 x base deck + spine
  spine_t_m:     {value: 0.05, confidence: low}    # [INFER] back-to-back slotted panel pair
  upright_w_m:   {value: 0.055, confidence: low}   # [INFER] slotted upright profile
  shelf_t_m:     {value: 0.022, confidence: low}   # [INFER] deck sheet + return
  shelf_levels:  {value: 3,    confidence: med}    # [INFER] above the base deck -> 4 facing levels
  shelf_depths_m: {value: [0.48, 0.44, 0.40], confidence: low}   # [INFER] shallower going up
  shelf_pitch_m: {value: 0.38, confidence: low}    # [INFER] level spacing
  kick_h_m:      {value: 0.13, confidence: low}    # [INFER] recessed toe kick
  rail_h_m:      {value: 0.038, confidence: low}   # [INFER] price-rail / data-strip face
  sign_h_m:      {value: 0.16, confidence: low}    # [INFER] header canopy band

hierarchy:
  - name: root
    children:
      - name: plinth          # closed base + recessed toe kick
        pivot: [0, 0, 0]
        animation: none
      - name: spine           # back-to-back slotted panels — the double-sided identity
        pivot: [0, 0, 0]
        animation: none
      - name: uprights        # slotted verticals at every section joint, both faces
        pivot: [0, 0, 0]
        animation: none
      - name: shelves         # InstancedMesh per depth: 3 sections x 2 faces
        pivot: [0, 0, 0]
        animation: none
      - name: rails           # price rails, one instanced batch per level (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: products        # instanced facings, deterministic seeded planogram (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: sign            # header canopy band (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: steel-epoxy-frame
    family: painted-metal
    color: "#d6d9dd"
    metalness: 0.0             # epoxy powder coat is a COATED surface -> dielectric
    roughness: 0.52
    evidence: "HANDBOOK §3.1 painted/coated panel 0.0-0.05"
    confidence: 0.85
  - id: steel-epoxy-deck
    family: painted-metal
    color: "#cdd1d5"
    metalness: 0.0
    roughness: 0.58            # shelf decks scuff: duller than the frame
    evidence: "HANDBOOK §3.1"
    confidence: 0.8
  - id: back-panel
    family: painted-metal
    color: "#b9bec4"
    metalness: 0.0
    roughness: 0.66
    evidence: "HANDBOOK §3.1 — the back panel sits in shadow, a darker coat keeps the shelf line legible"
    confidence: 0.75
  - id: price-rail
    family: plastic
    color: "#e8e2d2"
    metalness: 0.0
    roughness: 0.42
    evidence: >
      [INFER] Warm ticket white, deliberately OFF the shelf white — a pure-white rail on a white
      shelf vanishes at catalogue distance (observed in the first QA capture of this asset).
    confidence: 0.7
  - id: bracket-alu
    family: bare-metal
    color: "#a8adb2"
    metalness: 0.90
    roughness: 0.42
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0"
    confidence: 0.7
  - id: sign-band
    family: painted-metal
    color: "#1c4f8a"
    metalness: 0.0
    roughness: 0.44
    evidence: "[INFER] printed canopy band — coated, dielectric"
    confidence: 0.7
  - id: toe-kick
    family: painted-metal
    color: "#353a41"
    metalness: 0.0
    roughness: 0.72
    evidence: "[INFER] dark kick strip, the standard shopfitting contrast at floor level"
    confidence: 0.7

critical_features:
  - id: double-sided-read
    desc: >
      The unit reads as ONE back-to-back run, not two shelves parked together: a single plinth, a
      shared spine, shelves cantilevering both ways from the same uprights, and end frames closing
      the full 1.17 m depth.
    threshold: 0.78
  - id: module-repetition
    desc: >
      Three identical 1.22 m sections separated by visible uprights, with the shelf line continuous
      across them — the tiling is legible as a module, not as one long shelf.
    threshold: 0.75
  - id: merchandised-shelf
    desc: >
      Facings stand ON the deck with a price rail at the front edge, upper shelves shallower than
      the base deck, and the toe kick recessed — the shopfitting vocabulary that separates a gondola
      from generic industrial shelving.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60
    tris: 40000
  measured:                      # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 41
    tris: 10966
    geometries: 42
    root_meshes: 40

camera:
  azimuth_deg: 52
  elevation_deg: 17
  fov: 38
  target_y_m: 0.95
  radius_m: 6.4

lighting: house-rig + vertical-subject fill (reduced exposure)
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DOCUMENTED DEVIATION: the subject is a 3.7 m vertical wall, so it needs the same fill the
  # cold-room door needed — but it is COATED steel, not bare metal. Bare-metal practice (env 1.9-2.2)
  # clipped the shelf faces to white in the first capture, so here exposure goes 1.15 -> 1.02,
  # environmentIntensity 1.9 -> 1.5 and the fill is 0.7 instead of 1.25. Metalness/roughness unchanged.

ui_controls:
  - "AUTO-ROTATE"
  - "PRODUCTOS"        # instanced planogram on/off
  - "CENEFA"           # header canopy band
  - "PORTA-PRECIOS"    # price rails

colorTarget:
  # MEASURED from the rendered end frame (headless SwiftShader capture at 1280x800): a flat,
  # unoccluded patch of painted steel, per-channel std ~5. Not a guessed value.
  srgb: [198, 200, 203]
  deltaE00Max: 8
  crop: "30x300+905+300"   # end-frame face at 1280x800
