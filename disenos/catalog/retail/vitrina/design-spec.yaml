# DesignSpec — serve-over deli / bakery display case with curved front glass
# Catalog family `retail` (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: vitrina
family: retail
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # the 12 mm pane and the LED batten are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 15 -> moderate.
  scores: {silhouette: 3, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 3, detail: 2, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    silhouette 3: the identity is the CURVED sweep from the nose rail to the canopy — a straight
    slanted pane reads as a bench lid, not a serve-over case. material_layers 3: bare 304, tinted
    glass, granite band and lit interior have to coexist. action_readiness 0: nothing moves.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    stainless: "research/HANDBOOK.md §3.1 (bare 304: metalness 0.9-1.0, roughness 0.30-0.34)"
    lit_interior: "disenos/catalog/retail/refrigerador-vertical/ (real point lamps, not emissive-only)"
    instancing: "block54 §2.3 — trays, pieces and price cards instanced; the case shell is unique"

references:
  - source: "serve-over deli/bakery case class (1.25-3.75 m modules, curved front glass)"
    evidences: >
      [INFER] No manufacturer datasheet was preserved for this family (retail is procedural-direct,
      not needs-research). The envelope follows the serve-over class: ~1.1 m deep, ~1.25-1.35 m tall,
      display deck at 0.85-0.90 m, curved front pane springing from a nose rail up to a lit canopy,
      operator sliding doors on the back. All values are med/low confidence.
    suitability: partial
  - source: "disenos/catalog/retail/refrigerador-vertical/design-spec.yaml"
    evidences: >
      Lit-glass-cabinet lesson certified in this repo: an emissive strip illuminates nothing, so a
      case needs real lamps inside for the product to read through the pane.
    suitability: pass

dimensions_real:
  length_m:      {value: 1.60, confidence: med}    # [INFER] one serve-over module
  depth_m:       {value: 1.10, confidence: med}    # [INFER]
  height_m:      {value: 1.28, confidence: med}    # [INFER] top of canopy
  deck_y_m:      {value: 0.90, confidence: med}    # [INFER] display deck / working plane
  kick_h_m:      {value: 0.12, confidence: low}    # [INFER] recessed toe kick
  glass_radius_m: {value: 0.34, confidence: low}    # [INFER] curved-front sweep radius
  arc_centre_z_m: {value: 0.24, confidence: low}    # [INFER] pane springs from the nose rail
  pan_depth_m:   {value: 0.66, confidence: low}    # [INFER] refrigerated display well
  pan_wall_m:    {value: 0.05, confidence: low}    # [INFER]
  rear_door_h_m: {value: 0.34, confidence: low}    # [INFER] operator sliding doors
  granite_band_m: {value: 0.16, confidence: low}    # [INFER] customer-side stone band
  trays:         {value: 5,    confidence: low}    # [INFER] gastronorm-style trays along the deck

hierarchy:
  - name: root
    children:
      - name: base            # stainless carcase + toe kick + granite customer band
        pivot: [0, 0, 0]
        animation: none
      - name: pan             # refrigerated display well
        pivot: [0, 0, 0]
        animation: none
      - name: glass           # curved quarter-cylinder pane + quarter-disc ends + rails (togglable)
        pivot: [0, 0.88, 0.24]
        animation: none
      - name: canopy          # roof from the top of the sweep back to the operator wall
        pivot: [0, 0, 0]
        animation: none
      - name: leds            # LED batten + 3 point lamps (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: rear            # operator sliding doors + spandrel
        pivot: [0, 0, 0]
        animation: none
      - name: products        # instanced trays, pieces and price cards (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: stainless-304
    family: bare-metal
    color: "#c9cdcf"
    metalness: 0.93
    roughness: 0.32
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0, brushed 304 roughness 0.30-0.34"
    confidence: 0.9
  - id: display-pan
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.93
    roughness: 0.24            # the well is polished, brighter than the carcase
    evidence: "HANDBOOK §3.1"
    confidence: 0.85
  - id: pane-curved
    family: glass
    color: "#daebf2"
    metalness: 0.0
    roughness: 0.02
    transmission: 0.72
    evidence: >
      [CERT] Verified in this asset's own QA captures: at transmission 0.96 the curved sweep was
      INVISIBLE in the render (no specular, no edge). 0.72 with a faint tint keeps the product
      legible and makes the curve read as a surface. Documented as a deliberate deviation from
      physical glass, which really is near-invisible.
    confidence: 0.85
  - id: granite-band
    family: stone
    color: "#23262a"
    metalness: 0.0
    roughness: 0.35
    evidence: "[INFER] polished stone customer band — dielectric, low roughness"
    confidence: 0.7
  - id: toe-kick
    family: painted-metal
    color: "#2b2f34"
    metalness: 0.0
    roughness: 0.70
    evidence: "[INFER] dark recessed kick, standard shopfitting detail"
    confidence: 0.7
  - id: tray-gn
    family: bare-metal
    color: "#b9bec2"
    metalness: 0.90
    roughness: 0.35
    evidence: "HANDBOOK §3.1 bare-metal — gastronorm trays"
    confidence: 0.8

critical_features:
  - id: curved-front-sweep
    desc: >
      The front pane is a real quarter-cylinder sweeping from the nose rail up to the canopy, closed
      at both ends by quarter-disc panels — the geometry that identifies a serve-over case.
    threshold: 0.80
  - id: lit-display-well
    desc: >
      A stainless well below the deck line, lit from a batten under the canopy, with trays, product
      and price cards inside — the case reads as merchandised, not as an empty counter.
    threshold: 0.75
  - id: two-sided-service
    desc: >
      Customer side (granite band, curved glass) and operator side (sliding doors, spandrel) are
      different — the asset is not symmetric, and that asymmetry is the service logic.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80
    tris: 30000
  measured:             # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 61
    tris: 1636
    geometries: 30
    root_meshes: 27

camera:
  azimuth_deg: 53
  elevation_deg: 7.5     # deliberately low: a higher eye looks DOWN into the well and the sweep flattens
  fov: 38
  target_y_m: 0.92
  radius_m: 3.7

lighting: house-rig + vertical-subject fill + 3 canopy lamps
  # DOCUMENTED DEVIATION: the 0.9 m stainless front is a vertical bare-metal plane, so it gets the
  # same fill the cold-room door needed (environmentIntensity 2.0, fill 1.0, metalness untouched).
  # Three PointLights under the canopy stand for the LED batten — an emissive strip alone leaves the
  # well dark, the failure already certified on retail/refrigerador-vertical.

ui_controls:
  - "AUTO-ROTATE"
  - "PRODUCTO"      # trays, pieces and price cards
  - "CRISTAL"       # the whole glass group, to inspect the well
  - "ILUMINACIÓN"   # LED batten + canopy lamps

colorTarget:
  # MEASURED from the rendered stainless front panel (headless SwiftShader capture at 1280x800),
  # per-channel std ~2.2. Not a guessed value.
  srgb: [107, 112, 115]
  deltaE00Max: 8
  crop: "280x100+420+520"   # front carcase panel at 1280x800
