<!doctype html>
<!--
  CATALOG ASSET — instrumentacion/estacion-hmi · pedestal operator station with a touch HMI.
  Built from disenos/catalog/shell-template.html. Contract: __estacionHmiApp.runtime + __qaRenderInfo +
  data-app-ready, render-on-demand, shadows frozen (autoUpdate=false, 1024), DPR<=2.
  Instancing (block54 §2.3): the illuminated pushbutton row. Everything else is unique.
  The E-stop is modelled with TWO real states (armed / latched) rather than painted permanently red:
  a safety control that cannot change state is a decal.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación HMI de operador — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">ESTACIÓN HMI DE OPERADOR — pedestal + panel inclinado 20°</div>
  <div><span class="dim">pantalla 15" a 1.35 m · paro de emergencia enclavable · pulsadores iluminados</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnScreen" class="on">PANTALLA</button>
  <button id="btnEstop">PARO DE EMERGENCIA</button>
  <button id="btnTray">TECLADO</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const COL = 0.14, COL_H = 1.06;        // pedestal column
const HEAD_W = 0.58, HEAD_H = 0.46, HEAD_D = 0.17;
const TILT = 20 * Math.PI/180;         // console tilt: the screen faces a standing operator
const HEAD_Y = 1.34;                   // screen centre height
const SCREEN_W = 0.34, SCREEN_H = 0.205;   // 15 in 4:3 active area
const BTNS = 4;

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 18);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 3.15, AZ = 1.24, EL = 0.12;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 0.95 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, 0.88, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.88, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.0;   // the pedestal and console are bare 304

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.5, 5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.shadow.camera.left=-1.6; sun.shadow.camera.right=1.6; sun.shadow.camera.top=1.8; sun.shadow.camera.bottom=-1.8;
scene.add(sun);
// VERTICAL-SUBJECT FILL: the column and the console face are vertical bare-metal planes.
const fill = new THREE.DirectionalLight(0xf2f6ff, 1.05);
fill.position.set(-2.6, 2.0, 3.4);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14,14),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1: the 304 pedestal and console shell are BARE metal; the bezel,
// buttons, E-stop and screen are polymer/glass dielectrics.
// ============================================================================
const matSteel  = new THREE.MeshStandardMaterial({ color:0xc4c8cb, metalness:0.93, roughness:0.32 });
const matHead   = new THREE.MeshStandardMaterial({ color:0xccd0d3, metalness:0.93, roughness:0.28 });
const matBezel  = new THREE.MeshStandardMaterial({ color:0x22262b, metalness:0.0,  roughness:0.5 });
const matScreen = new THREE.MeshStandardMaterial({ color:0x0a1622, metalness:0.0,  roughness:0.14,
                                                   emissive:0x123f66, emissiveIntensity:1.5 });
const matEstopY = new THREE.MeshStandardMaterial({ color:0xd8b41e, metalness:0.0,  roughness:0.45 });
const matEstopR = new THREE.MeshStandardMaterial({ color:0xb02a1e, metalness:0.0,  roughness:0.42,
                                                   emissive:0x000000, emissiveIntensity:0.0 });
const matBtn    = new THREE.MeshStandardMaterial({ color:0x2f6fb0, metalness:0.0,  roughness:0.42,
                                                   emissive:0x0d3a63, emissiveIntensity:0.8 });
const matSel    = new THREE.MeshStandardMaterial({ color:0x1c1f23, metalness:0.0,  roughness:0.5 });
const matKey    = new THREE.MeshStandardMaterial({ color:0x2b2f34, metalness:0.0,  roughness:0.55 });
const matLabel  = new THREE.MeshStandardMaterial({ color:0xe8eaec, metalness:0.0,  roughness:0.55 });

// ============================================================================
// ZONE 2 — GEOMETRY
// ============================================================================
const root = new THREE.Group();
const dummy = new THREE.Object3D();
const box = (parent,w,h,d,mat,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); parent.add(m); return m; };

// --- base plate + anchor bolts + pedestal column with a cable gland ---
box(root, 0.30, 0.014, 0.30, matSteel, 0, 0.007, 0);
for(const sx of [-1,1]) for(const sz of [-1,1]){
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.026, 8), matSel);
  b.castShadow = true; b.position.set(sx*0.11, 0.020, sz*0.11); root.add(b);
}
box(root, COL, COL_H, COL, matSteel, 0, 0.014 + COL_H/2, 0);
const gland = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 0.05, 12), matSel);
gland.castShadow = true; gland.rotation.x = Math.PI/2; gland.position.set(0, 0.16, COL/2 + 0.01);
root.add(gland);

// --- console head: a tilted enclosure. Everything on its face lives in this rotated group, so the
// tilt is real geometry rather than a fake offset per element.
const head = new THREE.Group();
head.position.set(0, HEAD_Y, 0);
head.rotation.x = -TILT;
box(head, HEAD_W, HEAD_H, HEAD_D, matHead, 0, 0, 0);
box(head, HEAD_W + 0.012, 0.02, HEAD_D + 0.012, matSteel, 0, HEAD_H/2 + 0.01, 0);   // top cap
// screen: bezel + active area
box(head, SCREEN_W + 0.05, SCREEN_H + 0.05, 0.012, matBezel, 0, 0.075, HEAD_D/2 + 0.006);
const screen = new THREE.Mesh(new THREE.BoxGeometry(SCREEN_W, SCREEN_H, 0.006), matScreen);
screen.position.set(0, 0.075, HEAD_D/2 + 0.014); head.add(screen);
// E-stop: yellow backing plate + mushroom head, on its own group so it can latch DOWN
const estop = new THREE.Group();
estop.position.set(-HEAD_W/2 + 0.085, -0.115, HEAD_D/2);
box(estop, 0.075, 0.075, 0.008, matEstopY, 0, 0, 0.004);
const mushroom = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.016, 20), matEstopR);
mushroom.rotation.x = Math.PI/2; mushroom.position.set(0, 0, 0.020); mushroom.castShadow = true;
estop.add(mushroom);
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.014, 16), matSel);
collar.rotation.x = Math.PI/2; collar.position.set(0, 0, 0.010); estop.add(collar);
head.add(estop);
// illuminated pushbutton row (instanced) + a selector switch + a keyswitch
{
  const geo = new THREE.CylinderGeometry(0.0145, 0.0145, 0.012, 16);
  const im = new THREE.InstancedMesh(geo, matBtn, BTNS);
  im.castShadow = true;
  for(let i=0;i<BTNS;i++){
    dummy.position.set(-0.045 + i*0.052, -0.115, HEAD_D/2 + 0.008);
    dummy.rotation.set(Math.PI/2, 0, 0); dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  head.add(im);
}
const sel = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.012, 16), matSel);
sel.rotation.x = Math.PI/2; sel.position.set(HEAD_W/2 - 0.075, -0.115, HEAD_D/2 + 0.008);
sel.castShadow = true; head.add(sel);
box(head, 0.008, 0.030, 0.014, matSteel, HEAD_W/2 - 0.075, -0.115, HEAD_D/2 + 0.020);   // selector lever
box(head, 0.11, 0.016, 0.004, matLabel, -0.045 + 0.078, -0.155, HEAD_D/2 + 0.004);      // legend strip
root.add(head);

// --- support arm from the column to the head ---
box(root, 0.09, 0.22, 0.09, matSteel, 0, HEAD_Y - HEAD_H/2 - 0.06, -0.01);

// --- keyboard tray on its own hinge under the console ---
const trayPivot = new THREE.Group();
trayPivot.position.set(0, HEAD_Y - HEAD_H/2 - 0.10, 0.06);
const tray = new THREE.Group();
box(tray, 0.44, 0.016, 0.20, matKey, 0, 0, 0.10);
box(tray, 0.40, 0.010, 0.15, matSel, 0, 0.012, 0.09);
tray.rotation.x = -1.35;                       // stowed vertical against the pedestal
trayPivot.add(tray);
root.add(trayPivot);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. render is GATED: every handler and both animations call requestRender().
// ============================================================================
const btnRot    = document.getElementById('btnRot');
const btnScreen = document.getElementById('btnScreen');
const btnEstop  = document.getElementById('btnEstop');
const btnTray   = document.getElementById('btnTray');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
btnScreen.onclick = ()=>{ const on = matScreen.emissiveIntensity > 0.1;
  matScreen.emissiveIntensity = on ? 0.0 : 1.5;
  matBtn.emissiveIntensity = on ? 0.0 : 0.8;
  btnScreen.classList.toggle('on', !on); requestRender(); };
let estopTarget = 0, estopPos = 0;
btnEstop.onclick = ()=>{ estopTarget = estopTarget ? 0 : 1; btnEstop.classList.toggle('on', !!estopTarget);
  // latched: the mushroom sits DOWN and the head lights up
  matEstopR.emissive.setHex(estopTarget ? 0xff2a17 : 0x000000);
  matEstopR.emissiveIntensity = estopTarget ? 1.8 : 0.0;
  requestRender(); };
let trayTarget = -1.35, trayAngle = -1.35;
btnTray.onclick = ()=>{ trayTarget = trayTarget < -1 ? 0 : -1.35;
  btnTray.classList.toggle('on', trayTarget > -1); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(estopPos - estopTarget) > 0.001){                 // per-frame branch -> keep rendering
    estopPos += (estopTarget - estopPos) * 0.25;
    mushroom.position.z = 0.020 - 0.009*estopPos;               // it TRAVELS: a latched E-stop is pushed in
    needsRender = true;
  }
  if(Math.abs(trayAngle - trayTarget) > 0.001){
    trayAngle += (trayTarget - trayAngle) * 0.15;
    tray.rotation.x = trayAngle;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__estacionHmiApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__estacion-hmiApp'] = globalThis.__estacionHmiApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
