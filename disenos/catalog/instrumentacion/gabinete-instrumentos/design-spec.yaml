# DesignSpec — field marshalling cabinet on posts (316L, IP66, sunshade)
# Catalog family `instrumentacion` (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: gabinete-instrumentos
family: instrumentacion
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # a 7.5 mm terminal and a 28 mm gland are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 12 -> moderate.
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    The design question is what makes this different from instrumentacion/gabinete-plc in the same
    family: this one lives OUTDOORS. Hence posts with base plates instead of a plinth, 316L instead
    of RAL coating, a sunshade on standoffs, a bottom gland plate with cables dropping away, and a
    breather — not a bigger version of the same box.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    shell_not_solid: "disenos/catalog/laboratorio/autoclave/"
    hinge_side: "disenos/catalog/laboratorio/refrigerador-lab/"
    cavity_lamp: "disenos/catalog/instrumentacion/gabinete-plc/ (and keep it weak — see lighting)"

references:
  - source: "field junction / marshalling cabinet class (stand-mounted, IP66)"
    evidences: >
      [INFER] No manufacturer datasheet is preserved in sources/ — treat every value as inference.
      The arrangement modelled: a stainless enclosure on two posts at working height, a gasketed
      door with quarter-turn latches, a back plate with DIN rails of marshalling terminals, a bottom
      gland plate with a row of cable glands, a breather/drain, a sunshade over the roof, and a tag
      plate on the door.
    suitability: partial

dimensions_real:
  width_m:      {value: 0.60, confidence: low}    # [INFER]
  depth_m:      {value: 0.30, confidence: low}    # [INFER]
  height_m:     {value: 0.75, confidence: low}    # [INFER]
  bottom_y_m:   {value: 0.95, confidence: med}    # [INFER] glands worked from below, standing
  sheet_t_m:    {value: 0.014, confidence: low}   # [INFER]
  post_mm:      {value: 60,   confidence: low}    # [INFER] square posts
  rails:        {value: 2,    confidence: low}    # [INFER] marshalling rails
  terminals:    {value: 60,   confidence: low}    # [INFER] 30 per rail
  glands:       {value: 8,    confidence: low}    # [INFER] gland row
  latches:      {value: 3,    confidence: med}    # [INFER] quarter-turn latches
  sunshade_gap_m:{value: 0.055, confidence: low}  # [INFER] standoff height — the shade must not touch the roof

hierarchy:
  - name: root
    children:
      - name: posts           # two posts, base plates, anchor bolts, mounting brackets
        pivot: [0, 0, 0]
        animation: none
      - name: enclosure       # SHELL + gland plate floor + perimeter gasket seat + breather
        pivot: [0, 0, 0]
        animation: none
      - name: backplate_rails # back plate, 2 DIN rails, InstancedMesh of 60 terminals
        pivot: [0, 0, 0]
        animation: none
      - name: glands          # instanced glands + instanced field cables (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: shade           # sunshade panel + drip edge on 4 standoffs (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: doorPivot       # hinge on the LEFT, away from the catalogue camera
        pivot: [-0.296, 0, 0.153]
        animation: swing
        attachment:
          parent_socket: enclosure_face
          contact_type: hinge
          gap_tolerance: 0.002

materials:
  - id: enclosure-316l
    family: bare-metal
    color: "#c2c7cb"
    metalness: 0.93
    roughness: 0.30
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0"
    confidence: 0.85
  - id: sunshade
    family: bare-metal
    color: "#b6bbc0"
    metalness: 0.92
    roughness: 0.38
    evidence: "HANDBOOK §3.1 — slightly duller: it is the weathered face of the assembly"
    confidence: 0.8
  - id: gland-brass
    family: bare-metal
    color: "#b3a06a"
    metalness: 0.92
    roughness: 0.34
    evidence: "HANDBOOK §3.1 — nickel-plated brass reads warmer than the stainless around it"
    confidence: 0.8
  - id: terminal
    family: plastic
    color: "#9fb0c2"
    metalness: 0.0
    roughness: 0.50
    evidence: "[INFER] moulded marshalling terminal — dielectric"
    confidence: 0.75
  - id: gasket
    family: rubber
    color: "#15181b"
    metalness: 0.0
    roughness: 0.88
    evidence: "HANDBOOK §3.1 — PERIMETER seat, never a panel (IP66 depends on it)"
    confidence: 0.85
  - id: field-cable
    family: rubber
    color: "#1c1f23"
    metalness: 0.0
    roughness: 0.70
    evidence: "[INFER] sheathed field cables dropping from the glands"
    confidence: 0.75

critical_features:
  - id: outdoor-vocabulary
    desc: >
      Posts with base plates, a sunshade on standoffs, a bottom gland plate and a breather. Remove
      those and this becomes an indoor panel: they are the whole differentiator inside the family.
    threshold: 0.78
  - id: marshalling-interior
    desc: >
      Two DIN rails of terminals on a back plate, readable with the door open, with cables entering
      from below — the wiring logic of a field junction.
    threshold: 0.75
  - id: sealed-door
    desc: >
      Three quarter-turn latches against a perimeter gasket seat, plus a tag plate: the door reads
      as a sealed cover, not a cupboard door.
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60
    tris: 20000
  measured:             # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 48
    tris: 2258
    geometries: 49
    root_meshes: 47

camera:
  azimuth_deg: 74
  elevation_deg: 9.7
  fov: 38
  target_y_m: 1.02
  radius_m: 3.25

lighting: house-rig + camera-side fill + a WEAK cavity lamp
  # DOCUMENTED DEVIATION: environmentIntensity 2.2 for the 316L skin, a camera-side fill at 1.05 for
  # the vertical faces, and a deliberately weak PointLight (0.35, 1.1 m) inside. The cabinet cavity
  # is small: at the intensity that suited the PLC bay, the back plate became a hotspot and the
  # terminals vanished into it. Same lesson as the autoclave chamber, opposite direction.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR PUERTA"    # damped swing, hinged left
  - "PARASOL"         # sunshade
  - "PRENSAESTOPAS"   # glands and field cables

colorTarget:
  # MEASURED from the rendered enclosure flank (headless SwiftShader capture at 1280x800): flattest
  # 20x20 patch found by scan, per-channel std ~0.5. Dark because bare 316L reflects the dark
  # catalogue room — the honest read of the material in this rig.
  srgb: [95, 100, 105]
  deltaE00Max: 8
  crop: "20x20+712+394"   # enclosure right flank at 1280x800
