<!doctype html>
<!--
  CATALOG ASSET — instrumentacion/gabinete-instrumentos · field marshalling cabinet on posts.
  Built from disenos/catalog/shell-template.html. Contract: __gabineteInstrumentosApp.runtime +
  __qaRenderInfo + data-app-ready, render-on-demand, shadows frozen (autoUpdate=false, 1024), DPR<=2.
  Instancing (block54 §2.3): marshalling terminals and the cable-gland row.
  Deliberately DIFFERENT from instrumentacion/gabinete-plc: this one is OUTDOORS — stand-mounted on
  posts, stainless rather than RAL-coated, with a sunshade, a bottom gland plate and a breather.
  Enclosure is a SHELL and the door hinges away from the camera (both rules certified earlier here).
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabinete de instrumentos de campo — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">GABINETE DE INSTRUMENTOS DE CAMPO — 316L, IP66, sobre postes</div>
  <div><span class="dim">0.60 × 0.30 × 0.75 m · borneras de marshalling · placa de prensaestopas</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">ABRIR PUERTA</button>
  <button id="btnShade" class="on">PARASOL</button>
  <button id="btnGland" class="on">PRENSAESTOPAS</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const W = 0.60, D = 0.30, H = 0.75;
const BOT_Y = 0.95;                    // bottom of the enclosure — glands worked from below
const SHEET = 0.014;
const DOOR_T = 0.022;
const POST = 0.06, POST_H = BOT_Y + 0.10;
const RAILS = [BOT_Y + 0.50, BOT_Y + 0.30];    // two marshalling rails
const TERMS = 30;                      // terminals per rail
const GLANDS = 8;

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 18);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 3.25, AZ = 1.30, EL = 0.17;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 1.00 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, 1.02, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.02, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.2;   // 316L enclosure: a metal is lit by the IBL, not by a lamp

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.5, 5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.shadow.camera.left=-1.6; sun.shadow.camera.right=1.6; sun.shadow.camera.top=1.6; sun.shadow.camera.bottom=-1.6;
scene.add(sun);
// VERTICAL-SUBJECT FILL: the door and both flanks are vertical bare-metal planes.
const fill = new THREE.DirectionalLight(0xf2f6ff, 1.05);
fill.position.set(-2.6, 1.8, 3.2);
scene.add(fill);
// Short-range lamp for the cavity: a shadowed interior swallows the terminals (autoclave lesson).
const bayLamp = new THREE.PointLight(0xf2f6ff, 0.35, 1.1, 2);   // low: a close lamp in a small
// cavity turns the back plate into a hotspot and the terminals disappear into it
bayLamp.position.set(0, BOT_Y + 0.42, 0.10);
scene.add(bayLamp);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14,14),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1: enclosure, sunshade, posts and glands are BARE metal (316L /
// nickel-plated brass); the terminals, gasket and tag plate are dielectrics.
// ============================================================================
const matSteel = new THREE.MeshStandardMaterial({ color:0xc2c7cb, metalness:0.93, roughness:0.30 });
const matShade = new THREE.MeshStandardMaterial({ color:0xb6bbc0, metalness:0.92, roughness:0.38 });
const matPost  = new THREE.MeshStandardMaterial({ color:0xa8adb2, metalness:0.90, roughness:0.44 });
const matPlate = new THREE.MeshStandardMaterial({ color:0x9aa0a6, metalness:0.88, roughness:0.46 });
const matRail  = new THREE.MeshStandardMaterial({ color:0xd0d4d7, metalness:0.90, roughness:0.32 });
const matTerm  = new THREE.MeshStandardMaterial({ color:0x9fb0c2, metalness:0.0,  roughness:0.50 });
const matGask  = new THREE.MeshStandardMaterial({ color:0x15181b, metalness:0.0,  roughness:0.88 });
const matGland = new THREE.MeshStandardMaterial({ color:0xb3a06a, metalness:0.92, roughness:0.34 });
const matCable = new THREE.MeshStandardMaterial({ color:0x1c1f23, metalness:0.0,  roughness:0.70 });
const matTag   = new THREE.MeshStandardMaterial({ color:0xe6e9eb, metalness:0.0,  roughness:0.5 });
const matLatch = new THREE.MeshStandardMaterial({ color:0x22262b, metalness:0.0,  roughness:0.5 });

// ============================================================================
// ZONE 2 — GEOMETRY
// ============================================================================
const root = new THREE.Group();
const dummy = new THREE.Object3D();
const box = (parent,w,h,d,mat,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); parent.add(m); return m; };
const cyl = (parent, r0, r1, h, seg, mat, x,y,z, rx=0, rz=0)=>{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); m.rotation.set(rx,0,rz);
  parent.add(m); return m;
};

// --- two support posts on base plates, with the mounting brackets ---
for(const sx of [-1,1]){
  const px = sx*(W/2 - 0.10);
  box(root, POST, POST_H, POST, matPost, px, POST_H/2, -(D/2 + 0.03));
  box(root, 0.18, 0.014, 0.18, matPost, px, 0.007, -(D/2 + 0.03));
  for(const sz of [-1,1]) cyl(root, 0.008, 0.008, 0.026, 8, matLatch, px + sz*0.06, 0.02, -(D/2 + 0.03));
  box(root, 0.07, 0.045, 0.075, matPost, px, BOT_Y + 0.10, -(D/2 + 0.005));
  box(root, 0.07, 0.045, 0.075, matPost, px, BOT_Y + H - 0.14, -(D/2 + 0.005));
}

// --- enclosure SHELL ---
{
  box(root, W, H, SHEET, matSteel, 0, BOT_Y + H/2, -(D/2 - SHEET/2));          // back
  for(const sx of [-1,1]) box(root, SHEET, H, D, matSteel, sx*(W/2 - SHEET/2), BOT_Y + H/2, 0);
  box(root, W, SHEET, D, matSteel, 0, BOT_Y + H - SHEET/2, 0);                 // roof
  box(root, W, SHEET, D, matPlate, 0, BOT_Y + SHEET/2, 0);                     // gland plate (floor)
  const fr = 0.022;
  box(root, W, fr, SHEET, matSteel, 0, BOT_Y + H - fr/2, D/2 - SHEET/2);
  box(root, W, fr, SHEET, matSteel, 0, BOT_Y + fr/2, D/2 - SHEET/2);
  for(const sx of [-1,1]) box(root, fr, H - 2*fr, SHEET, matSteel, sx*(W/2 - fr/2), BOT_Y + H/2, D/2 - SHEET/2);
  // door gasket seat: PERIMETER, never a panel
  const gz = D/2 - SHEET - 0.004, gw = 0.016;
  box(root, W - 0.06, gw, 0.008, matGask, 0, BOT_Y + 0.035, gz);
  box(root, W - 0.06, gw, 0.008, matGask, 0, BOT_Y + H - 0.035, gz);
  for(const sx of [-1,1]) box(root, gw, H - 0.10, 0.008, matGask, sx*(W/2 - 0.03), BOT_Y + H/2, gz);
}
// breather/drain on the underside + a rain hood over the roof entry
cyl(root, 0.013, 0.013, 0.030, 12, matGland, W/2 - 0.09, BOT_Y - 0.012, 0.02);

// --- back plate + DIN rails + marshalling terminals (instanced) ---
box(root, W - 0.08, H - 0.10, 0.008, matPlate, 0, BOT_Y + H/2, -(D/2 - SHEET - 0.008));
for(const y of RAILS){
  box(root, W - 0.12, 0.010, 0.028, matRail, 0, y - 0.035, -(D/2 - SHEET - 0.026));
}
{
  const geo = new THREE.BoxGeometry(0.0075, 0.055, 0.050);
  const im = new THREE.InstancedMesh(geo, matTerm, TERMS*RAILS.length);
  im.castShadow = im.receiveShadow = true;
  let k = 0;
  for(const y of RAILS) for(let i=0;i<TERMS;i++){
    dummy.position.set(-(TERMS*0.0105)/2 + 0.0105*(i + 0.5), y, -(D/2 - SHEET - 0.052));
    dummy.rotation.set(0,0,0); dummy.updateMatrix();
    im.setMatrixAt(k++, dummy.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  root.add(im);
}

// --- cable glands under the gland plate, with the field cables dropping away (togglable) ---
const glands = new THREE.Group();
{
  const gGeo = new THREE.CylinderGeometry(0.014, 0.017, 0.05, 12);
  const im = new THREE.InstancedMesh(gGeo, matGland, GLANDS);
  im.castShadow = im.receiveShadow = true;
  const cGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.30, 10);
  const ic = new THREE.InstancedMesh(cGeo, matCable, GLANDS);
  ic.castShadow = ic.receiveShadow = true;
  for(let i=0;i<GLANDS;i++){
    const gx = -(GLANDS*0.058)/2 + 0.058*(i + 0.5);
    dummy.position.set(gx, BOT_Y - 0.025, -0.02); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    dummy.position.set(gx, BOT_Y - 0.20, -0.02); dummy.updateMatrix();
    ic.setMatrixAt(i, dummy.matrix);
  }
  im.instanceMatrix.needsUpdate = true; ic.instanceMatrix.needsUpdate = true;
  glands.add(im, ic);
}
root.add(glands);

// --- sunshade: a raised canopy on standoffs, the outdoor tell (togglable) ---
const shade = new THREE.Group();
box(shade, W + 0.10, 0.012, D + 0.10, matShade, 0, BOT_Y + H + 0.055, 0.01);
box(shade, W + 0.10, 0.030, 0.012, matShade, 0, BOT_Y + H + 0.040, D/2 + 0.055);
for(const sx of [-1,1]) for(const sz of [-1,1]){
  cyl(shade, 0.010, 0.010, 0.055, 8, matShade, sx*(W/2 - 0.06), BOT_Y + H + 0.027, sz*(D/2 - 0.06));
}
root.add(shade);

// --- door: hinged LEFT (away from the catalogue camera), 3 quarter-turn latches + tag plate ---
const doorPivot = new THREE.Group();
doorPivot.position.set(-(W/2 - 0.004), 0, D/2 + 0.003);
const door = new THREE.Group();
door.position.set(W/2 - 0.004, 0, 0);                         // leaf at local +X -> NEGATIVE opens it
const dcy = BOT_Y + H/2;
box(door, W - 0.008, H - 0.008, DOOR_T, matSteel, 0, dcy, DOOR_T/2);
box(door, W - 0.07, H - 0.07, 0.006, matPlate, 0, dcy, -0.004);           // inner stiffener
for(let i=0;i<3;i++){
  const ly = dcy - 0.22 + i*0.22;
  cyl(door, 0.014, 0.014, 0.016, 12, matLatch, W/2 - 0.035, ly, DOOR_T + 0.008, Math.PI/2);
  box(door, 0.030, 0.008, 0.010, matLatch, W/2 - 0.035, ly, DOOR_T + 0.016);
}
box(door, 0.14, 0.045, 0.004, matTag, 0, BOT_Y + 0.10, DOOR_T + 0.003);   // tag plate
doorPivot.add(door);
root.add(doorPivot);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. render is GATED: every handler and the swing call requestRender().
// ============================================================================
const btnRot   = document.getElementById('btnRot');
const btnDoor  = document.getElementById('btnDoor');
const btnShade = document.getElementById('btnShade');
const btnGland = document.getElementById('btnGland');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
let doorTarget = 0, doorAngle = 0;
btnDoor.onclick = ()=>{ doorTarget = doorTarget ? 0 : 1; btnDoor.classList.toggle('on', !!doorTarget); requestRender(); };
const toggle = (btn, obj)=>{ btn.onclick = ()=>{ obj.visible = !obj.visible; btn.classList.toggle('on', obj.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); }; };
toggle(btnShade, shade);
toggle(btnGland, glands);

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(doorAngle - doorTarget) > 0.001){                 // per-frame branch -> keep rendering
    doorAngle += (doorTarget - doorAngle) * 0.13;
    doorPivot.rotation.y = -1.9 * doorAngle;                    // leaf at local +X -> NEGATIVE opens outward
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__gabineteInstrumentosApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__gabinete-instrumentosApp'] = globalThis.__gabineteInstrumentosApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
