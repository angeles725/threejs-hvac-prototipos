# DesignSpec — 4-way ceiling cassette fan-coil (with its T-bar ceiling context)
# Sixth asset of the catalog `hvac` family.
# EVIDENCE: no preserved datasheet; research/HANDBOOK.md §3.0 anchors the family
# ("Minisplit (evaporadora) | ~0.9 m") and the 600 mm ceiling module fixes the panel size.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: fan-coil
family: hvac
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

variant_choice:
  # The catalog row says "fan-coil unit / cassette". Both exist; the cassette was chosen because a
  # horizontal ducted fan-coil is a featureless sheet-metal box once it is in a ceiling void,
  # whereas the cassette has a soffit that reads at thumbnail size: square panel, central return,
  # four supply slots with swing louvres. A ducted variant remains a possible sibling asset.
  chosen: "4-way ceiling cassette"
  rejected: "horizontal ducted fan-coil (no readable silhouette in a catalog thumbnail)"

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 15 -> moderate.
  scores: {silhouette: 1, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    detail 3 and silhouette 1: the massing is a flat square, so ALL of the identity is in the
    soffit detail and in the ceiling context. Without the T-bar ceiling the asset would read as a
    floating panel with no sense of what it is mounted in.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html

references:
  - source: "research/HANDBOOK.md §3.0"
    evidences: "[CERT] 'Minisplit (evaporadora) | ~0.9 m' — the indoor-unit family this cassette belongs to."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1"
    evidences: >
      [CERT] The decorative panel, louvre blades, ceiling tiles and drain pan are plastics/coated
      steel -> dielectric. Only the chassis sheet, hanger rods and copper stubs are bare metal.
    suitability: pass

dimensions_real:
  ceiling_height_m: {value: 2.60, confidence: low}   # [INFER] typical finished ceiling
  panel_side_m:     {value: 0.95, confidence: low}   # [INFER] decorative panel over a 600 mm module grid
  panel_thickness_m:{value: 0.055, confidence: low}  # [INFER]
  body_side_m:      {value: 0.84, confidence: low}   # [INFER] chassis fits the ceiling opening
  body_height_m:    {value: 0.30, confidence: low}   # [INFER] plenum depth needed above the tile
  return_grille_m:  {value: 0.44, confidence: low}   # [INFER] central return
  supply_slot_w_m:  {value: 0.13, confidence: low}   # [INFER] one slot per side
  hanger_drop_m:    {value: 0.34, confidence: low}   # [INFER] chassis top to slab soffit

hierarchy:
  - name: root
    children:
      - name: ceiling         # tiles around the opening + exposed T-bar grid (togglable context)
        pivot: [0, 2.60, 0]
        animation: none
      - name: chassis         # sheet-metal box above the tile, insulated top, 4 hanger rods, slab soffit
        pivot: [0, 2.60, 0]
        animation: none
      - name: guts            # 4-sided coil ring, centrifugal turbine, drain pan, condensate pump, control box
        pivot: [0, 2.60, 0]
        animation: none
        children:
          - name: turbine
            pivot: [0, 2.77, 0]         # vertical spin axis
            animation: spin
      - name: pipes           # lagged chilled-water pair with isolation valves + condensate line
        pivot: [0, 0, 0]
        animation: none
      - name: face            # decorative panel: frame ring, return RING + grille bars + filter, 4 slots
        pivot: [0, 2.57, 0]
        animation: none
        children:
          - name: louvre[0..3]
            pivot: ["slot inner edge, one per side"]   # HINGE LINE, not the blade centre
            animation: swing

materials:
  - id: panel-abs
    family: plastic
    color: "#eceef0"
    metalness: 0.0
    roughness: 0.42
    evidence: "HANDBOOK §3.1 dielectric — the decorative panel is moulded plastic"
    confidence: 0.85
  - id: louvre-blade
    family: plastic
    color: "#dadde0"
    metalness: 0.0
    roughness: 0.46
    evidence: "HANDBOOK §3.1 dielectric"
    confidence: 0.85
  - id: tbar-painted
    family: painted-metal
    color: "#dfe2e4"
    metalness: 0.0
    roughness: 0.55
    evidence: "HANDBOOK §3.1 painted steel -> 0.0-0.05"
    confidence: 0.85
    note: >
      Modelled as BARE metal in the first pass, the T-grid reflected the dark room below and
      rendered as black bands across the ceiling. A suspended-ceiling tee is painted steel; the
      fix was the correct dielectric value, not a lighting patch.
  - id: chassis-galv
    family: bare-metal
    color: "#b6bdc1"
    metalness: 0.95
    roughness: 0.44
    evidence: "HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.85
  - id: aluminium-fin
    family: bare-metal
    color: "#d2dade"
    metalness: 1.0
    roughness: 0.42
    map: "procedural canvas: fin ribbing, repeat 14x1"
    evidence: "HANDBOOK §3.1 `coil` -> 0.9-1.0"
    confidence: 0.8
  - id: mineral-tile
    family: fibre
    color: "#dcdcd6"
    metalness: 0.0
    roughness: 0.92
    evidence: "HANDBOOK §3.1 dielectric"
    confidence: 0.8
  - id: copper-stub
    family: bare-metal
    color: "#f0a67a"
    metalness: 1.0
    roughness: 0.30
    evidence: "HANDBOOK §3.1 `copper` correction"
    confidence: 0.8

critical_features:
  - id: cassette-soffit
    desc: >
      The soffit reads as a cassette: square frame, a central RETURN OPENING with grille bars and
      a filter visible behind them, and four supply slots. A solid plate over the return is a fail
      — it is what the first build shipped.
    threshold: 0.82
  - id: ceiling-context
    desc: "The unit sits IN a T-bar ceiling: tiles around the opening and a light painted grid, so its mounting is legible."
    threshold: 0.78
  - id: swing-louvres
    desc: "Four blades hinged on the inner edge of their slot; ALETAS swings all four to the down-blow position."
    threshold: 0.75
  - id: plenum-truth
    desc: >
      With FALSO TECHO off, the chassis, hanger rods, coil ring, turbine, drain pan, condensate
      pump and the lagged connections are all present above the ceiling line.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80       # measured 63 at the review camera (SwiftShader headless, DPR 1)
    tris: 8000      # measured ~1,400

camera:
  azimuth_deg: 49
  elevation_deg: -17     # NEGATIVE: the camera is in the room, looking UP at the soffit
  fov: 38
  target_y_m: 2.46
  radius_m: 2.35

lighting: house-rig + room uplight + plenum lamp
  # DEVIATION 1: the house rig lights from above, but the face that carries the identity here
  # points DOWN. A DirectionalLight from the room floor supplies the bounce a real room gives.
  # DEVIATION 2: a shadowless PointLight in the plenum for the FALSO TECHO state.
  # PBR values are unchanged in both cases (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "ALETAS"        # 4 louvres swing to down-blow on their hinge lines
  - "TURBINA"       # centrifugal impeller spins on the vertical axis
  - "FALSO TECHO"   # hides the tiles and grid, exposing the plenum and the chassis

instancing:
  - what: "return grille bars"
    count: 13
    draws_saved: "13 meshes -> 1"
  - what: "turbine blades"
    count: 18
    draws_saved: "18 meshes -> 1"
  # NOT instanced: the 4 louvres (each swings on its own hinge group) and the 4 coil faces.

colorTarget:
  # MEASURED from the rendered decorative panel (headless SwiftShader capture at 1280x800).
  srgb: [182, 185, 189]
  deltaE00Max: 8
  crop: "60x40+600+220"
  secondary_observed:
    ceiling_tile: [156, 160, 160]   # 90x60+300+180 — the panel must stay BRIGHTER than the tile,
                                    # or the cassette disappears into the ceiling
