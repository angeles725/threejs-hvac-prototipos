# DesignSpec — VRF outdoor condensing module (top discharge, wrap-around coil)
# Fifth asset of the catalog `hvac` family.
# EVIDENCE: no preserved datasheet; research/HANDBOOK.md §3.0 anchors the split-system family
# ("Minisplit (evaporadora) | ~0.9 m"). A VRF outdoor module is the large end of that family, so
# every dimension here is [INFER] inside a plausible band and marked low/med confidence.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: condensador-vrf
family: hvac
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 14 -> moderate.
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    A slim tall box whose whole identity is the pairing of a WRAP-AROUND finned coil on three
    faces with a TOP DISCHARGE fan pair, plus a lagged refrigerant line set leaving the base.
    repetition 3: 74 fins across three coil faces, plus the two guard sets, all instanced.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    finned_coil_recipe: "disenos/catalog/hvac/chiller-aircooled (same instanced-fin + fin-map recipe)"
    palette: "research/HANDBOOK.md §3.1"

references:
  - source: "research/HANDBOOK.md §3.0"
    evidences: "[CERT] 'Minisplit (evaporadora) | ~0.9 m' — the split family this module belongs to."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1"
    evidences: >
      [CERT] Painted casing panels -> dielectric 0.0-0.05; aluminium fins -> 0.9-1.0;
      copper corrected to #f0a67a. Elastomeric lagging is a dielectric.
    suitability: pass
  - source: "disenos/catalog/hvac/chiller-aircooled/design-spec.yaml"
    evidences: >
      [CERT] Sibling asset in this family: a dark fin map on a vertical metal coil collapses to
      black because the map tints F0. The same bright map is reused here.
    suitability: pass

dimensions_real:
  width_m:        {value: 1.00, confidence: low}   # [INFER] fits two top fans side by side
  depth_m:        {value: 0.78, confidence: low}   # [INFER] slim module, wall-adjacent install
  casing_h_m:     {value: 1.62, confidence: low}   # [INFER]
  overall_h_m:    {value: 1.72, confidence: low}   # [INFER] casing + base legs
  leg_h_m:        {value: 0.10, confidence: low}   # [INFER] bolted to plinths
  coil_band_m:    {value: [0.26, 1.42], confidence: low}   # [INFER] y0..y1 of the wrap-around coil
  coil_thickness_m: {value: 0.07, confidence: low}  # [INFER]
  fan_diameter_m: {value: 0.44, confidence: low}   # [INFER] two fans across a 1.00 m width
  fan_count:      {value: 2,    confidence: low}   # [INFER]
  line_set:       {value: ["liquid ~10 mm", "suction ~16 mm"], confidence: low}   # [INFER]

hierarchy:
  - name: root
    children:
      - name: base            # two channel legs + anti-vibration pads + tray
        pivot: [0, 0, 0]
        animation: none
      - name: coils           # rear + both side coil faces (instanced fins) + the fascia band above them
        pivot: [0, 0, 0]
        animation: none
      - name: casing          # corner posts, top deck FRAME, front panel (removable) with nameplate
        pivot: [0, 0, 0]
        animation: none
      - name: top             # 2 venturi rings, 2 rotors, instanced guard rings + bars
        pivot: [0, 0, 0]
        animation: none
        children:
          - name: rotor[0..1]
            pivot: [±0.25, 1.64, 0]
            animation: spin
      - name: guts            # inverter scroll compressor, accumulator, control box, internal lines
        pivot: [0, 0, 0]
        animation: none
      - name: pipes           # lagged liquid + suction risers with stop valves
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: painted-casing
    family: painted-metal
    color: "#d6dade"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.1 `panelBox` -> 0.0-0.05"
    confidence: 0.9
  - id: aluminium-fin
    family: bare-metal
    color: "#d2dade"
    metalness: 1.0
    roughness: 0.42
    map: "procedural canvas: vertical fin ribbing, repeat 22x1"
    evidence: "HANDBOOK §3.1 `coil` -> 0.9-1.0"
    confidence: 0.9
  - id: galvanised-chassis
    family: bare-metal
    color: "#b4bbbf"
    metalness: 0.95
    roughness: 0.42
    evidence: "HANDBOOK §3.1 `skid` -> 0.9-1.0"
    confidence: 0.85
  - id: copper-line
    family: bare-metal
    color: "#f0a67a"
    metalness: 1.0
    roughness: 0.30
    evidence: "HANDBOOK §3.1 `copper` correction (#f0a67a-#f7bc9e)"
    confidence: 0.85
  - id: elastomeric-lagging
    family: rubber
    color: "#191c20"
    metalness: 0.0
    roughness: 0.92
    evidence: "HANDBOOK §3.1 dielectric"
    confidence: 0.85
  - id: compressor-shell
    family: painted-metal
    color: "#39424c"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.1 `compBody` -> 0.0-0.05"
    confidence: 0.85

critical_features:
  - id: wrap-around-coil
    desc: "Finned coil on the rear AND both sides, with visible fin ribbing and a tube sheet at each edge."
    threshold: 0.80
  - id: open-top-discharge
    desc: >
      Two guarded fans discharge through a top deck built as a FRAME. A solid deck buries both
      fans and leaves a grille floating over a closed box — the first build did exactly that.
    threshold: 0.85
  - id: fan-fit
    desc: >
      The two fans fit side by side across the WIDTH without overlapping each other. At the first
      diameter they intersected, which no count could have caught.
    threshold: 0.80
  - id: service-front
    desc: "A removable front panel with nameplate and latch, and the lagged line set with stop valves leaving the base beside it."
    threshold: 0.75
  - id: proportion-scale
    desc: "At 1.00 x 0.78 x 1.72 m the unit is chest-to-eye height on a 1.8 m person — an outdoor module, not a chiller."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 90       # measured 67 at the review camera (SwiftShader headless, DPR 1)
    tris: 15000     # measured ~4,200

camera:
  azimuth_deg: 45
  elevation_deg: 17
  fov: 38
  target_y_m: 0.90
  radius_m: 3.9

lighting: house-rig + vertical-subject fill + interior lamp
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DEVIATION 1: nearly every visible surface is vertical (three coil faces, the front panel), so a
  # camera-side fill mirrored about the front normal (+X) and environmentIntensity 1.9 -> 2.1.
  # DEVIATION 2: a shadowless PointLight inside the machine compartment for the PANEL FRONTAL state.

ui_controls:
  - "AUTO-ROTATE"
  - "VENTILADORES"        # both rotors spin; holds needsRender while running
  - "PANEL FRONTAL"       # removes the front panel -> compressor, accumulator, control box
  - "LÍNEA FRIGORÍFICA"   # hides the lagged line set and its stop valves

instancing:
  - what: "condenser fins"
    count: "22 rear + 26 per side x 2"
    draws_saved: "74 meshes -> 3 (one InstancedMesh per coil face, since each face is its own group)"
  - what: "fan guard rings + bars"
    count: "3 rings + 3 bars x 2 fans"
    draws_saved: "12 meshes -> 2"
  - what: "fan blades"
    count: "3 per rotor x 2"
    draws_saved: "6 meshes -> 2 (each rotor spins independently)"

colorTarget:
  # MEASURED from the rendered front panel (headless SwiftShader capture at 1280x800).
  srgb: [216, 218, 221]
  deltaE00Max: 8
  crop: "80x80+720+400"
  secondary_observed:
    coil_face: [58, 67, 72]   # 90x150+520+350 — the fin band; if this drifts toward the panel
                              # value the coil has stopped reading as a coil
