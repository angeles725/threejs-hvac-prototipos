# DesignSpec — duty/standby pump skid (end-suction centrifugal pair)
# Fourth asset of the catalog `hvac` family.
# EVIDENCE: no manufacturer datasheet is preserved for this asset; the certified anchor is
# research/HANDBOOK.md §3.0 ("Bomba centrífuga | 1-1.5 m"). Everything narrower is [INFER].
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: skid-bombas
family: hvac
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 16 -> moderate.
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 2,
           material_layers: 3, detail: 3, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    The identity is PIPING LOGIC, not massing: two identical pump sets, a suction header and a
    discharge header, and one valve set per branch. material_layers 3: painted casting, bare
    steel pipe, caution-yellow guard, ISA-101 red valve and rubber flexible connector must all
    stay distinguishable in one frame.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 (near-binary metalness)"
    status_colors: "research/HANDBOOK.md §3.4 (ISA-101: grey is normal; colour is for the actionable)"

references:
  - source: "research/HANDBOOK.md §3.0"
    evidences: "[CERT] 'Bomba centrífuga | 1-1.5 m' — each pump set here is ~1.10 m motor-to-inlet."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1"
    evidences: >
      [CERT] Painted pump/motor castings are DIELECTRIC (`compBody` -> 0.0-0.05); pipe, flanges and
      skid channel are bare metal 0.9-1.0; the rubber flexible connector is a dielectric.
    suitability: pass

dimensions_real:
  skid_l_m:        {value: 1.90, confidence: low}    # [INFER] motor tail to header, plus working clearance
  skid_w_m:        {value: 1.50, confidence: low}    # [INFER] two pump centre lines at 0.72 m pitch
  overall_h_m:     {value: 1.78, confidence: low}    # [INFER] to the top of the discharge valve levers
  skid_frame_h_m:  {value: 0.16, confidence: low}    # [INFER] channel section
  shaft_height_m:  {value: 0.52, confidence: low}    # [INFER] pump/motor centre line over the baseplate
  pump_pitch_m:    {value: 0.72, confidence: low}    # [INFER] side-by-side spacing
  pump_set_l_m:    {value: 1.10, confidence: med}    # [CERT] inside the 1-1.5 m band, §3.0
  volute_d_m:      {value: 0.38, confidence: low}    # [INFER]
  suction_header_d_m:  {value: 0.21, confidence: low}  # [INFER] sized above the branch diameter
  discharge_header_d_m: {value: 0.17, confidence: low}  # [INFER]
  motor_frame_d_m: {value: 0.31, confidence: low}    # [INFER] TEFC frame

hierarchy:
  - name: root
    children:
      - name: skid            # channel perimeter, cross members, levelling pads, lifting lugs
        pivot: [0, 0, 0]
        animation: none
      - name: pumpSet[0..1]   # baseplate, motor (instanced cooling fins), volute, nozzles, pedestal
        pivot: [0, 0.52, ±0.36]
        animation: none
        children:
          - name: motorFan
            pivot: [-0.545, 0.52, ±0.36]   # cowl fan, spins on the shaft axis (X)
            animation: spin
          - name: guard                    # coupling guard, removable
            pivot: [0.02, 0.52, ±0.36]
            animation: none
      - name: pipes           # both headers, header stands, per-pump suction and discharge branches
        pivot: [0, 0, 0]
        animation: none
      - name: ctrl            # control enclosure, HMI, ISA-101 lamps, conduit to each motor
        pivot: [-0.77, 0, 0]
        animation: none

materials:
  - id: pump-paint
    family: painted-metal
    color: "#2f5d6b"
    metalness: 0.0
    roughness: 0.45
    evidence: "HANDBOOK §3.1 `compBody` -> 0.0-0.05 (carcasa pintada, dieléctrico)"
    confidence: 0.9
  - id: motor-paint
    family: painted-metal
    color: "#37414c"
    metalness: 0.0
    roughness: 0.52
    evidence: "HANDBOOK §3.1 painted casting, dielectric"
    confidence: 0.9
  - id: steel-pipe
    family: bare-metal
    color: "#c3cacd"
    metalness: 0.95
    roughness: 0.36
    evidence: "HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.85
  - id: skid-channel
    family: bare-metal
    color: "#b7bec2"
    metalness: 0.95
    roughness: 0.42
    evidence: "HANDBOOK §3.1 `skid` -> 0.9-1.0"
    confidence: 0.9
  - id: guard-yellow
    family: painted-metal
    color: "#c9a227"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.4 — colour reserved for the actionable; a coupling guard is a guarding element"
    confidence: 0.8
  - id: valve-red
    family: painted-metal
    color: "#8f3b2a"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.1 painted body + §3.4 (operable item)"
    confidence: 0.8
  - id: flex-connector
    family: rubber
    color: "#101316"
    metalness: 0.0
    roughness: 0.95
    evidence: "HANDBOOK §3.1 `hose` -> metalness 0 (caucho, dieléctrico)"
    confidence: 0.85

critical_features:
  - id: parallel-pump-layout
    desc: >
      The two pumps sit SIDE BY SIDE across the skid, both inlets facing the same end. In line,
      each pump's axial suction lands in its neighbour's motor and the suction branches have
      nowhere to go — that was the first build and the pipework read as floating.
    threshold: 0.82
  - id: two-header-logic
    desc: >
      A suction header at shaft height and a discharge header above the volutes, both running
      ACROSS the skid on stands, each with a terminating flange — the connection points are
      readable without reading the model.
    threshold: 0.80
  - id: valve-train-per-branch
    desc: >
      Every branch carries its valve set: butterfly on the suction, and flexible connector ->
      check valve -> butterfly on the discharge, plus a gauge at each side of the pump.
    threshold: 0.78
  - id: guarded-coupling
    desc: "A caution-yellow coupling guard between motor and pump; GUARDAS off shows the coupling it protects."
    threshold: 0.72
  - id: proportion-scale
    desc: "At 1.90 x 1.50 x 1.78 m a 1.8 m person stands just above the discharge header — a real machine-room skid."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 110      # measured 92 at the review camera (SwiftShader headless, DPR 1)
    tris: 20000     # measured 3,926

camera:
  azimuth_deg: 52
  elevation_deg: 19
  fov: 38
  target_y_m: 0.75
  radius_m: 4.7

lighting: house-rig + vertical-subject fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DOCUMENTED DEVIATION: the headers and motor frames are bare-metal cylinders whose flanks
  # reflect the dark horizon. A camera-side DirectionalLight plus environmentIntensity 1.9 -> 2.0
  # gives them something bright to reflect. Metalness/roughness unchanged (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "BOMBAS"      # motor cowl fans spin; holds needsRender while running
  - "GUARDAS"     # removes both coupling guards, revealing the couplings
  - "CABEZALES"   # hides both headers and every branch, leaving the bare pump sets on the skid

instancing:
  # block54 §2.3 — instancing ONLY where the repetition is real.
  - what: "motor cooling fins"
    count: "14 per motor x 2 motors"
    draws_saved: "28 meshes -> 2 (one InstancedMesh per motor, since each set is its own group)"
  - what: "cowl fan blades"
    count: "8 per fan x 2 fans"
    draws_saved: "16 meshes -> 2 (each fan spins independently)"
  # NOT instanced: valves, gauges, headers, skid members — 2 of each is below the threshold where
  # an InstancedMesh pays for itself.

colorTarget:
  # MEASURED from the rendered pump volute (headless SwiftShader capture at 1280x800), then frozen
  # as the regression anchor. The volute paint is the identity colour of the asset.
  srgb: [113, 165, 180]
  deltaE00Max: 8
  crop: "60x45+600+480"     # clean volute barrel, at 1280x800
  secondary_observed:
    motor_paint:  [109, 123, 140]   # 45x40+480+420
    guard_yellow: [213, 196, 104]   # 30x60+560+430 — must stay clearly separated from the volute
