<!doctype html>
<!--
  intercambiador — catalog asset, family `hvac`.
  Built from disenos/catalog/shell-template.html (render-on-demand baked in, block56).
  Type: GASKETED PLATE heat exchanger. Chosen over shell-and-tube because the plate pack is the
  one heat-exchanger silhouette that cannot be mistaken for a tank, and because a 44-plate pack is
  honest instancing (block54 §2.3) rather than instancing for its own sake.
  Spec: ./design-spec.yaml
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercambiador de placas — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Intercambiador de placas — bastidor con paquete empacado</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· 44 placas · tirantes · 4 boquillas</span></div>
  <div class="dim">1.34 × 0.66 × 1.46 m</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnOpen">ABRIR PAQUETE</button>
  <button id="btnRods">TIRANTES</button>
  <button id="btnNoz">BOQUILLAS</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const PL_W = 0.50, PL_H = 1.02;            // plate width (Z) x height (Y)
const N_PLATES = 44, PL_T = 0.0075;        // pack: plate count and pitch
const PACK_L = N_PLATES * PL_T;            // packed length along X
const FIX_X = -0.34;                       // fixed cover plate (carries the 4 nozzles)
const COVER_T = 0.075;
const PACK_X0 = FIX_X + COVER_T/2;         // pack starts against the fixed cover
const BASE_H = 0.14;
const CENTRE_Y = BASE_H + 0.22 + PL_H/2;   // plate centre height
const COL_X = 0.62;                        // support column at the free end

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 7, 24);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 3.6, AZ = 0.88, EL = 0.24;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 0.80 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, 0.80, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.80, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.1;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.5, 6, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0003;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-2; sun.shadow.camera.right=2; sun.shadow.camera.top=2.5; sun.shadow.camera.bottom=-1;
scene.add(sun);
// Vertical-subject fill (design-spec.yaml `lighting`): the covers and every plate edge are
// vertical bare stainless. Camera-side fill; PBR values unchanged (HANDBOOK §3.1).
const fill = new THREE.DirectionalLight(0xf2f6ff, 1.15);
fill.position.set(-3.0, 2.4, 5.0);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1 near-binary metalness.
//   Plates are bare AISI 316 (0.95). Frame covers are PAINTED carbon steel (dielectric).
//   Gaskets are NBR — dielectric, and deliberately dark so the pack reads as plate/gasket/plate.
// ============================================================================
const matPlate  = new THREE.MeshStandardMaterial({ color:0xc9ced1, metalness:0.95, roughness:0.34 });
const matGasket = new THREE.MeshStandardMaterial({ color:0x1d1f22, metalness:0.0,  roughness:0.90 });
const matCover  = new THREE.MeshStandardMaterial({ color:0x27506b, metalness:0.0,  roughness:0.46 });
const matCovDk  = new THREE.MeshStandardMaterial({ color:0x1e3d53, metalness:0.0,  roughness:0.52 });
const matBar    = new THREE.MeshStandardMaterial({ color:0xb7bec2, metalness:0.95, roughness:0.42 });
const matRod    = new THREE.MeshStandardMaterial({ color:0xa2a9ae, metalness:0.95, roughness:0.46 });
const matNozzle = new THREE.MeshStandardMaterial({ color:0xc3cacd, metalness:0.95, roughness:0.36 });
const matPlaque = new THREE.MeshStandardMaterial({ color:0xdfe3e6, metalness:0.9,  roughness:0.30 });
const matPad    = new THREE.MeshStandardMaterial({ color:0x101316, metalness:0.0,  roughness:0.95 });

// ============================================================================
// ZONE 2 — GEOMETRY.
// ============================================================================
const root = new THREE.Group();
const box = (w,h,d,mat)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; return m; };
const put = (p,w,h,d,mat,x,y,z)=>{ const m = box(w,h,d,mat); m.position.set(x,y,z); p.add(m); return m; };
const cyl = (p,r,h,mat,x,y,z,rx=0,rz=0,seg=18)=>{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); m.rotation.set(rx,0,rz); p.add(m); return m; };
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);

// --- base frame + anti-vibration pads ---
const base = new THREE.Group();
for(const sz of [-1,1]) put(base, 1.24, BASE_H, 0.10, matBar, 0.10, BASE_H/2, sz*(PL_W/2 - 0.02));
put(base, 0.14, BASE_H, PL_W - 0.06, matBar, FIX_X, BASE_H/2, 0);
put(base, 0.14, BASE_H, PL_W - 0.06, matBar, COL_X, BASE_H/2, 0);
for(const sx of [FIX_X, COL_X]) for(const sz of [-1,1])
  put(base, 0.16, 0.03, 0.14, matPad, sx, 0.015, sz*(PL_W/2 - 0.05));
root.add(base);

// --- frame: fixed cover (nozzle end), support column, carrying and guide bars ---
const frame = new THREE.Group();
put(frame, COVER_T, PL_H + 0.16, PL_W + 0.14, matCover, FIX_X, CENTRE_Y, 0);           // fixed cover
put(frame, 0.10, PL_H + 0.30, 0.14, matCover, COL_X, CENTRE_Y - 0.02, 0);              // support column
put(frame, 0.14, 0.06, PL_W + 0.10, matCovDk, COL_X, CENTRE_Y + PL_H/2 + 0.13, 0);
const BAR_Y_TOP = CENTRE_Y + PL_H/2 + 0.10, BAR_Y_BOT = CENTRE_Y - PL_H/2 - 0.08;
put(frame, COL_X - FIX_X, 0.055, 0.055, matBar, (FIX_X + COL_X)/2, BAR_Y_TOP, 0);      // carrying bar
put(frame, COL_X - FIX_X, 0.045, 0.045, matBar, (FIX_X + COL_X)/2, BAR_Y_BOT, 0);      // guide bar
// Pedestals: the cover and the column stopped 0.15 m above the base frame and the whole machine
// read as floating. A PHE frame is continuous down to its feet.
put(frame, COVER_T + 0.02, CENTRE_Y - PL_H/2 - 0.08 - BASE_H, PL_W + 0.10, matCovDk,
    FIX_X, (BASE_H + CENTRE_Y - PL_H/2 - 0.08)/2, 0);
put(frame, 0.12, CENTRE_Y - PL_H/2 - 0.08 - BASE_H, 0.16, matCovDk,
    COL_X, (BASE_H + CENTRE_Y - PL_H/2 - 0.08)/2, 0);
root.add(frame);

// --- plate pack: 44 instanced plates + 44 instanced gasket edges, plus the pressure plate ---
const pack = new THREE.Group();
const plateGeo  = new THREE.BoxGeometry(PL_T * 0.62, PL_H, PL_W);
const gasketGeo = new THREE.BoxGeometry(PL_T * 0.34, PL_H + 0.012, PL_W + 0.012);
const plates  = new THREE.InstancedMesh(plateGeo,  matPlate,  N_PLATES);
const gaskets = new THREE.InstancedMesh(gasketGeo, matGasket, N_PLATES);
plates.castShadow = plates.receiveShadow = true; gaskets.castShadow = true;
pack.add(plates); pack.add(gaskets);
const pressurePlate = put(pack, COVER_T * 0.8, PL_H + 0.16, PL_W + 0.14, matCover, 0, CENTRE_Y, 0);
// `spread` 0 = packed (operating), 1 = opened for service. Rebuilding the instance matrices is the
// whole point of the toggle: an InstancedMesh is not frozen geometry.
function layoutPack(spread){
  // The travel is bounded so the OPEN pack still ends before the support column. At the first
  // multiplier the pressure plate slid straight past the frame it is supposed to run inside —
  // a physically impossible state that the counts scored green.
  const pitch = PL_T * (1 + spread * 1.35);
  for(let i=0;i<N_PLATES;i++){
    const x = PACK_X0 + (i + 0.5) * pitch;
    _q.setFromEuler(new THREE.Euler(0, 0, 0));
    _p.set(x, CENTRE_Y, 0); plates.setMatrixAt(i, _m.compose(_p, _q, _s));
    _p.set(x + pitch * 0.42, CENTRE_Y, 0); gaskets.setMatrixAt(i, _m.compose(_p, _q, _s));
  }
  plates.instanceMatrix.needsUpdate = true;
  gaskets.instanceMatrix.needsUpdate = true;
  const end = PACK_X0 + N_PLATES * pitch;
  pressurePlate.position.x = end + COVER_T * 0.5;
  return end;
}
let packEnd = layoutPack(0);
root.add(pack);

// --- tie rods with nuts: fixed cover -> pressure plate, above and below the pack ---
const rods = new THREE.Group();
const ROD_POS = [[ 0.0,  PL_H/2 + 0.055], [ 0.0, -PL_H/2 - 0.045],
                 [ PL_W/2 + 0.045, 0.16], [ PL_W/2 + 0.045, -0.16],
                 [-PL_W/2 - 0.045, 0.16], [-PL_W/2 - 0.045, -0.16]];
const rodMeshes = [];
for(const [rz, ry] of ROD_POS){
  const r = cyl(rods, 0.016, 1.0, matRod, 0, CENTRE_Y + ry, rz, 0, Math.PI/2, 10);
  const n1 = put(rods, 0.045, 0.05, 0.05, matRod, 0, CENTRE_Y + ry, rz);
  const n2 = put(rods, 0.045, 0.05, 0.05, matRod, 0, CENTRE_Y + ry, rz);
  rodMeshes.push([r, n1, n2]);
}
function layoutRods(end){
  const x0 = FIX_X - COVER_T/2 - 0.03, x1 = end + COVER_T + 0.03;
  for(const [r, n1, n2] of rodMeshes){
    r.scale.y = (x1 - x0);           // the cylinder is rotated, so its LOCAL y is the run direction
    r.position.x = (x0 + x1)/2;
    n1.position.x = x0 + 0.03; n2.position.x = x1 - 0.03;
  }
}
layoutRods(packEnd);
root.add(rods);

// --- nozzles: 4 on the fixed cover (hot/cold in and out) with flanges and bolt rings ---
const nozzles = new THREE.Group();
for(const [ny, nz] of [[PL_H/2 - 0.16, PL_W/2 - 0.14], [PL_H/2 - 0.16, -(PL_W/2 - 0.14)],
                       [-(PL_H/2 - 0.16), PL_W/2 - 0.14], [-(PL_H/2 - 0.16), -(PL_W/2 - 0.14)]]){
  cyl(nozzles, 0.058, 0.22, matNozzle, FIX_X - 0.14, CENTRE_Y + ny, nz, 0, Math.PI/2, 16);
  cyl(nozzles, 0.092, 0.030, matNozzle, FIX_X - 0.25, CENTRE_Y + ny, nz, 0, Math.PI/2, 16);
  cyl(nozzles, 0.075, 0.020, matNozzle, FIX_X - 0.05, CENTRE_Y + ny, nz, 0, Math.PI/2, 16);
}
put(nozzles, 0.012, 0.11, 0.18, matPlaque, FIX_X - 0.04, CENTRE_Y, 0);                 // nameplate
root.add(nozzles);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

// ============================================================================
// ZONE 3 — UI. Render is GATED: every handler calls requestRender().
// ============================================================================
let spread = 0, spreadTarget = 0;

const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

const btnOpen = document.getElementById('btnOpen');
btnOpen.onclick = ()=>{ spreadTarget = spreadTarget === 0 ? 1 : 0;
  btnOpen.classList.toggle('on', spreadTarget !== 0); requestRender(); };

const btnRods = document.getElementById('btnRods');
btnRods.onclick = ()=>{ rods.visible = !rods.visible; btnRods.classList.toggle('on', !rods.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); };

const btnNoz = document.getElementById('btnNoz');
btnNoz.onclick = ()=>{ nozzles.visible = !nozzles.visible; btnNoz.classList.toggle('on', !nozzles.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

function animate(){
  requestAnimationFrame(animate);
  const d = spreadTarget - spread;
  if(Math.abs(d) > 0.0015){
    spread += d * 0.10;
    packEnd = layoutPack(spread);
    layoutRods(packEnd);
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
const __app = { runtime:{ scene, renderer, camera, root } };
globalThis.__intercambiadorApp = __app;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
