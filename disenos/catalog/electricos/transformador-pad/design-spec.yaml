# DesignSpec — pad-mounted distribution transformer, 3-phase, deadfront, oil-filled
# Third asset of the catalog `electricos` family.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# EVIDENCE DISCIPLINE: no manufacturer datasheet and no ANSI copy was preserved for this asset.
# Unlike its two siblings there is no repo voxel study for a pad-mount either, so this asset has
# NO [CERT] dimensional source at all. Every dimension below is [INFER] from distribution practice
# and none is given confidence above 0.7. Treat the envelope as plausible, not certified.

design: transformador-pad
family: electricos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    A green box on a slab, and everything that makes it a pad-mount is trim: the corrugated fin
    wall, the drip hood, the pentahead bolts, the deadfront elbows behind the doors. detail 3 for
    that reason. This asset's real job in the catalog is to NOT converge with transformador-seco —
    same word, opposite machine.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    copper_correction: "research/HANDBOOK.md §3.1"
    sibling_contrast: "disenos/catalog/electricos/transformador-seco/ (the dry-type it must not resemble)"

references:
  - source: "research/HANDBOOK.md §3.0 (scale norm) + §3.1 (PBR palette)"
    evidences: >
      [CERT] 1 unit = 1 m; near-binary metalness; painted enclosures are dielectrics; the corrected
      warm copper F0.
    suitability: pass
  - source: "pad-mounted distribution practice (ANSI C57.12.28 family; no copy preserved in sources/)"
    evidences: >
      [INFER] deadfront construction with a single front compartment split HV | LV by a barrier;
      loadbreak elbows on bushing wells; bayonet fuse; corrugated tank walls acting as the radiator;
      Munsell 7GY green as the conventional utility finish; a housekeeping pad with a cable window.
      NOTE the colour claim in particular is stated from practice, not from a fetched standard.
    suitability: partial

dimensions_real:
  tank_w_m:   {value: 1.70, confidence: low}    # [INFER] ~300 kVA class
  tank_d_m:   {value: 1.30, confidence: low}    # [INFER]
  tank_h_m:   {value: 1.42, confidence: low}    # [INFER]
  cab_depth_m: {value: 0.34, confidence: low}    # [INFER] front terminal compartment
  cab_h_m:    {value: 1.00, confidence: low}    # [INFER]
  pad_w_m:    {value: 2.20, confidence: low}    # [INFER]
  pad_d_m:    {value: 2.15, confidence: low}    # must cover tank depth + compartment, not tank alone
  pad_h_m:    {value: 0.16, confidence: low}    # [INFER]
  fin_pitch_m: {value: 0.062, confidence: low}   # [INFER] corrugation pitch
  hv_share:   {value: 0.42, confidence: low}    # [INFER] HV share of the compartment width

hierarchy:
  - name: root
    children:
      - name: pad             # concrete housekeeping pad + cable window (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: tank            # sealed oil tank + corrugated fin walls + cover seam + base skirt
        pivot: [0, 0, 0]
        animation: none
      - name: trim            # pressure relief, liquid level and oil temperature gauges, fill plug
        pivot: [0, 0, 0]
        animation: none
      - name: cab             # front compartment SHELL — floor, roof, ends, HV|LV barrier, drip hood
        pivot: [0, 0, 0]
        animation: none
        notes: >
          Built as a shell, never as a filled box. A solid compartment renders identically with the
          doors shut and hides every bushing, elbow and fuse the moment they open.
      - name: guts            # deadfront bushing wells + loadbreak elbows, bayonet fuse, LV spades
        pivot: [0, 0, 0]
        animation: none
      - name: doors           # 2 leaves, each hinged on its OUTBOARD edge, swinging away from the barrier
        pivot: per-leaf outboard edge
        animation: swing
        attachment:
          parent_socket: cab_end_wall
          contact_type: hinge
          gap_tolerance: 0.006

materials:
  - id: munsell-7gy-green
    family: painted-metal
    color: "#5c6b52"
    metalness: 0.0             # painted tank steel is a DIELECTRIC. A bare-metal tank would be
    roughness: 0.58            # wrong twice: wrong surface family AND wrong colour.
    evidence: "HANDBOOK §3.1 painted enclosure 0.0-0.05; [INFER] Munsell 7GY utility green"
    confidence: 0.7
  - id: concrete-pad
    family: mineral
    color: "#6e7069"
    metalness: 0.0
    roughness: 0.92
    evidence: "HANDBOOK §3.1 dielectric; roughness 1 for an unfinished mineral surface"
    confidence: 0.8
  - id: elbow-epdm
    family: rubber
    color: "#14171a"
    metalness: 0.0             # loadbreak elbows are moulded EPDM — must NOT inherit tank metal
    roughness: 0.72
    evidence: "HANDBOOK §3.1 dielectric metalness 0"
    confidence: 0.8
  - id: copper-spade
    family: bare-metal
    color: "#f0a67a"
    metalness: 1.0
    roughness: 0.36
    evidence: "HANDBOOK §3.1 copper correction"
    confidence: 0.9
  - id: steel-galvanised
    family: bare-metal
    color: "#b6babc"
    metalness: 0.92
    roughness: 0.42
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0 — hinges, pentahead bolts, switch handle"
    confidence: 0.9

critical_features:
  - id: oil-not-dry
    desc: >
      A sealed corrugated tank with liquid-level and oil-temperature gauges and a pressure relief
      device. No ventilation louvre, no exposed winding, no wheeled base anywhere. This is the exact
      inverse of transformador-seco and the two must remain unmistakable for each other.
    threshold: 0.85
  - id: deadfront-compartment
    desc: >
      One front compartment, split HV | LV by a barrier, closed by two outboard-hinged doors with
      pentahead bolts. Behind them: bushing wells with loadbreak elbows hanging down, a bayonet
      fuse, a loadbreak switch handle, LV spades on a landing pad and a ground bar.
    threshold: 0.80
  - id: corrugation-is-the-radiator
    desc: >
      The fin walls on both sides and the rear are the cooling surface. A smooth-walled tank
      silently deletes the machine's entire heat-rejection capacity.
    threshold: 0.78
  - id: pad-covers-the-footprint
    desc: >
      The pad extends under the front compartment and both open doors, not just under the tank.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 90           # measured 60
    tris: 8000          # measured 2,198

camera:
  azimuth_deg: 42
  elevation_deg: 15
  fov: 38
  target_y_m: 0.78
  radius_m: 5.7

lighting: house-rig + vertical-subject fill
  # DOCUMENTED DEVIATION: the tank is a large VERTICAL coated plane; the house rig was calibrated on
  # horizontal equipment tops, so it reflects the dark lower hemisphere and reads flat. Fix is LIGHT:
  # DirectionalLight(0xdce6f2, 0.85) along the panel normal (+Z), environmentIntensity 1.9 -> 2.2.
  # metalness/roughness unchanged per HANDBOOK §3.1.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR COMPARTIMENTO"   # eased mirrored swing, ~120° so the leaves fold back off the compartment
  - "PAD DE CONCRETO"

colorTarget:
  # MEASURED from the headless SwiftShader capture at 1280x800; crop chosen by scanning the door band
  # for the most uniform patch, per-channel standard deviation 0.00.
  srgb: [142, 162, 131]
  deltaE00Max: 8
  crop: "24x18+470+340"   # clean LV door face, at 1280x800

verification:
  gate: "node disenos/catalog/tools/verify-catalog-asset.mjs electricos/transformador-pad"
  measured: {ready: true, calls: 60, triangles: 2198, console_errors: 0, shadowAuto: false}
  # Defects that passed a green gate and were caught only by capturing the doors-open state:
  #   1. the front compartment was one FILLED box, so opening the doors revealed solid green metal
  #      where the entire deadfront termination should be;
  #   2. the pad was sized to the tank, leaving the compartment and both doors cantilevered off it;
  #   3. the leaves stopped square at 90° and stood across the compartment they were revealing.
  # None of the three moves ready, calls or triangles. Capture the toggled state.
  known_flake: >
    The gate fetches three.js from unpkg. A CDN hiccup surfaces as ready:false / error:'no-renderer'
    with an EMPTY console-error list and zero __ globals — infra failure dressed as a broken asset.
    Re-run before believing it.
