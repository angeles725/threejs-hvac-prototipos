# DesignSpec — motor control centre (MCC), 4 sections of withdrawable buckets
# Fourth asset of the catalog `electricos` family.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# EVIDENCE DISCIPLINE: no manufacturer datasheet was preserved. The 0.15 m (6 in) unit module and
# the 2.20 m lineup height are stated from MCC practice, not from a fetched standard, and are
# marked [INFER] accordingly. Nothing here is presented as [CERT-doc].

design: ccm-motores
family: electricos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"

complexity:
  scores: {silhouette: 1, components: 3, hierarchy: 3, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 2, action_readiness: 2}
  tier: complex
  notes: >
    hierarchy 3 and action_readiness 2 are the load-bearing axes: a bucket is a real assembly that
    TRAVELS — door, starter and stabs all move together — so the door cannot belong to the carcass.
    repetition 3 with a catch: the units repeat in construction but NOT in height, and flattening
    them to an even grid is the single change that would stop this reading as an MCC.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    sibling_contrast: "disenos/catalog/electricos/tablero-switchgear/ (shares sheet vocabulary, different machine)"
    isa101_states: "research/HANDBOOK.md §3.4"

references:
  - source: "research/HANDBOOK.md §3.0 (scale norm) + §3.1 (PBR palette) + §3.4 (ISA-101)"
    evidences: >
      [CERT] 1 unit = 1 m; near-binary metalness; coated sheet is dielectric; corrected warm copper;
      neutral grey as the normal operating state with colour reserved for the actionable one.
    suitability: pass
  - source: "MCC construction practice (NEMA ICS 18 / IEC 61439-2 family; no copy preserved)"
    evidences: >
      [INFER] units stacked on a 6-inch module in mixed heights; a pistol-grip disconnect operator
      per unit, interlocked to its door; a full-height vertical wireway beside each bucket stack;
      a horizontal bus compartment across the top feeding vertical buses that the units stab onto.
    suitability: partial

dimensions_real:
  unit_module_m:  {value: 0.15, confidence: low}   # [INFER] the 6-inch module every height multiplies
  section_w_m:    {value: 0.60, confidence: low}   # [INFER]
  wireway_w_m:    {value: 0.15, confidence: low}   # [INFER]
  bucket_face_w_m:{value: 0.45, confidence: low}   # section width minus the wireway
  lineup_w_m:     {value: 2.40, confidence: low}   # 4 sections
  depth_m:        {value: 0.60, confidence: low}   # [INFER] front-access MCC, much shallower than switchgear
  body_h_m:       {value: 2.10, confidence: low}   # [INFER]
  plinth_h_m:     {value: 0.10, confidence: low}   # [INFER]
  overall_h_m:    {value: 2.20, confidence: low}
  bus_compartment_h_m: {value: 0.25, confidence: low}
  stack_h_m:      {value: 1.65, confidence: low}   # exactly 11 modules
  withdraw_travel_m: {value: 0.52, confidence: low}

hierarchy:
  - name: root
    children:
      - name: carcass         # plinth, rear, roof, floor, end panels, division panels
        pivot: [0, 0, 0]
        animation: none
        notes: >
          Internal division panels STOP at the bus compartment floor, or the continuous horizontal
          bus is cut into four unconnected stubs.
      - name: busbars         # 3 horizontal copper bars + insulator standoffs
        pivot: [0, 0, 0]
        animation: none
      - name: busCover        # bolted cover over the bus compartment (cutaway toggle)
        pivot: [0, 0, 0]
        animation: none
      - name: wireways        # per-section vertical wireway cover, latches, cable bundle, vertical bus
        pivot: [0, 0, 0]
        animation: none
      - name: buckets         # 16 withdrawable units, EACH ITS OWN GROUP: door + starter + stabs
        pivot: per-unit, travel along +Z
        animation: withdraw
        attachment:
          parent_socket: section_rails
          contact_type: slide
          gap_tolerance: 0.008
        notes: >
          The door is a CHILD of the bucket, not of the carcass. A bucket whose starter stays behind
          when the unit travels is not a withdrawable unit, it is a picture of one.

materials:
  - id: paint-ral7035
    family: painted-metal
    color: "#cfd2cc"
    metalness: 0.0
    roughness: 0.55
    evidence: "HANDBOOK §3.1 'panelBox -> 0.0-0.05, panel de gabinete pintado'"
    confidence: 0.9
  - id: copper-bus
    family: bare-metal
    color: "#f0a67a"
    metalness: 1.0
    roughness: 0.34
    evidence: "HANDBOOK §3.1 copper correction"
    confidence: 0.9
  - id: operator-handle
    family: plastic
    color: "#1d1f22"
    metalness: 0.0
    roughness: 0.46
    evidence: "moulded pistol-grip operator — dielectric per HANDBOOK §3.1"
    confidence: 0.8
  - id: steel-galvanised
    family: bare-metal
    color: "#b6babc"
    metalness: 0.92
    roughness: 0.42
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0 — withdrawal rails, bolts, lifting eyes"
    confidence: 0.9
  - id: lamp-isa101
    family: emissive
    color: "#5a6878"
    metalness: 0.0
    roughness: 0.40
    evidence: "HANDBOOK §3.4 — unlit neutral is normal; red is reserved for the tripped starter"
    confidence: 0.9

critical_features:
  - id: mixed-height-units
    desc: >
      The 16 units are 2, 3 and 4 modules tall in an irregular arrangement across the four sections.
      A starter, a feeder and a soft-start are physically different sizes, so an MCC front is never
      an even grid. Flattening the heights is the fastest way to turn this back into a locker bank.
    threshold: 0.82
  - id: withdrawable-bucket
    desc: >
      Pulling a unit takes its door, its breaker, its contactor, its overload relay and its stab
      connectors out together, exposing the empty cell and its rails behind.
    threshold: 0.80
  - id: pistol-grip-and-wireway
    desc: >
      A pistol-grip disconnect operator on the left edge of every unit door, and a full-height
      hinged wireway cover with latches beside each bucket stack. These two details separate an MCC
      from a switchgear lineup at a glance.
    threshold: 0.78
  - id: proportion-scale
    desc: "A 1.8 m person reads correct beside a 2.20 m lineup; a 0.30 m unit door is hand-sized."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 400          # measured 347
    tris: 16000         # measured 8,154

camera:
  azimuth_deg: 42
  elevation_deg: 11
  fov: 38
  target_y_m: 1.12
  radius_m: 5.6

lighting: house-rig + vertical-subject fill
  # DOCUMENTED DEVIATION: an MCC front is one large VERTICAL coated plane and the house rig was
  # calibrated on horizontal equipment tops, so it reflects the dark lower hemisphere and reads
  # flat. Fix is LIGHT: DirectionalLight(0xdce6f2, 0.85) along the panel normal (+Z) and
  # environmentIntensity 1.9 -> 2.2. metalness/roughness unchanged per HANDBOOK §3.1.

ui_controls:
  - "AUTO-ROTATE"
  - "EXTRAER GAVETA"      # withdraws THREE units at staggered travel, leaving neighbours in frame
                          # as the reference the travel is read against
  - "TAPA DE BARRAS"
  - "DISPARO (ISA-101)"   # ONE starter goes red; the other 15 units stay neutral grey

colorTarget:
  # MEASURED from the headless SwiftShader capture at 1280x800; crop chosen by scanning the bucket
  # band for the most uniform patch, per-channel standard deviation 0.00.
  srgb: [231, 232, 231]
  deltaE00Max: 8
  crop: "24x18+523+260"   # clean bucket door face, at 1280x800

verification:
  gate: "node disenos/catalog/tools/verify-catalog-asset.mjs electricos/ccm-motores"
  measured: {ready: true, calls: 347, triangles: 8154, console_errors: 0, shadowAuto: false}
  # Caught only by capturing the withdrawn state: full-height division panels chopped the continuous
  # horizontal bus into four stubs — the same defect this family produced in tablero-switchgear, and
  # equally invisible to ready/calls/triangles. Capture the toggled state.
  known_flake: >
    The gate fetches three.js from unpkg. A CDN hiccup surfaces as ready:false / error:'no-renderer'
    with an EMPTY console-error list and zero __ globals — infra failure dressed as a broken asset.
    Re-run before believing it.
