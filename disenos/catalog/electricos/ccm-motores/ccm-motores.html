<!doctype html>
<!--
  ccm-motores — catalog asset, family `electricos`.
  Built from disenos/catalog/shell-template.html (render-on-demand baked in, block56).
  Spec: ./design-spec.yaml
  NOTE: an MCC is NOT a narrow switchgear lineup. Its identity is the withdrawable BUCKET: units
  stacked on a 6-inch (0.15 m) module in MIXED heights, each with its own door, its own pistol-grip
  disconnect operator interlocked to that door, and a full-height vertical wireway beside them.
  Equal-height compartments and no wireway would make this a distribution board with extra steps.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCM — centro de control de motores — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.025 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">CCM — centro de control de motores, 4 secciones</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· chapa RAL 7035 (dieléctrico) · barra de cobre</span></div>
  <div class="dim">2.40 × 0.60 × 2.20 m · gavetas extraíbles en módulo de 0.15 m · canaleta vertical</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnPull">EXTRAER GAVETA</button>
  <button id="btnBus" class="on">TAPA DE BARRAS</button>
  <button id="btnTrip">DISPARO (ISA-101)</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const MODULE   = 0.15;                     // the 6-inch bucket module every height is a multiple of
const NSEC     = 4;
const SEC_W    = 0.60;
const WIRE_W   = 0.15;                     // vertical wireway, right of each section's bucket stack
const BKT_W    = SEC_W - WIRE_W;           // 0.45 bucket face width
const TOTAL_W  = NSEC * SEC_W;             // 2.40
const DEPTH    = 0.60;                     // front-access MCC is far shallower than switchgear
const PLINTH_H = 0.10;
const BODY_H   = 2.10;
const TOP_Y    = PLINTH_H + BODY_H;        // 2.20
const BUS_H    = 0.25;                     // horizontal bus compartment at the top
const BUS_Y0   = TOP_Y - BUS_H;
const STACK_Y0 = PLINTH_H + 0.10;          // bottom of the bucket stack
const STACK_H  = BUS_Y0 - STACK_Y0 - 0.05; // 1.65 → 11 modules
const FRONT_Z  = DEPTH/2;
// MIXED unit heights, in modules, per section. This is the MCC signature: a starter, a feeder and a
// soft-start are physically different sizes, so an MCC front is never an even grid.
const UNITS = [[2,2,3,2,2], [3,3,2,3], [2,2,2,2,3], [4,3,4]];
const secX  = i => -TOTAL_W/2 + (i + 0.5)*SEC_W;
const secL  = i => -TOTAL_W/2 + i*SEC_W;

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 10, 36);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 5.6, AZ = 0.73, EL = 0.20, TGT_Y = 1.12;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TGT_Y + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TGT_Y, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TGT_Y, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.2;        // vertical-subject deviation — see design-spec §lighting

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.8, 5.6, 4.4); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-3.2; sun.shadow.camera.right=3.2; sun.shadow.camera.top=3.2; sun.shadow.camera.bottom=-3.2;
sun.shadow.camera.far = 18;
scene.add(sun);
const faceFill = new THREE.DirectionalLight(0xdce6f2, 0.85);    // panel-normal fill (the deviation)
faceFill.position.set(0.7, 1.5, 5.2);
scene.add(faceFill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(26,26),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1 near-binary metalness.
// ============================================================================
const matPaint  = new THREE.MeshStandardMaterial({ color:0xcfd2cc, metalness:0.0, roughness:0.55 });
const matPaintD = new THREE.MeshStandardMaterial({ color:0xb9bdb8, metalness:0.0, roughness:0.58 });
const matPlinth = new THREE.MeshStandardMaterial({ color:0x3b4046, metalness:0.0, roughness:0.62 });
const matSteel  = new THREE.MeshStandardMaterial({ color:0xb6babc, metalness:0.92, roughness:0.42 });
const matCopper = new THREE.MeshStandardMaterial({ color:0xf0a67a, metalness:1.0,  roughness:0.34 });
const matPlastic= new THREE.MeshStandardMaterial({ color:0x1a1d21, metalness:0.0,  roughness:0.52 });
const matHandle = new THREE.MeshStandardMaterial({ color:0x1d1f22, metalness:0.0,  roughness:0.46 });
const matDevice = new THREE.MeshStandardMaterial({ color:0x2a2e33, metalness:0.0,  roughness:0.60 });
const matDevFace= new THREE.MeshStandardMaterial({ color:0x8d9298, metalness:0.0,  roughness:0.58 });
const matInsul  = new THREE.MeshStandardMaterial({ color:0x6b4d2a, metalness:0.0,  roughness:0.65 });
const matLabel  = new THREE.MeshStandardMaterial({ color:0xf2f3ef, metalness:0.0,  roughness:0.70 });
const matWire   = new THREE.MeshStandardMaterial({ color:0x24272b, metalness:0.0,  roughness:0.72 });
// ISA-101 §3.4: grey is NORMAL. Only the tripped starter earns colour.
const matLampOff = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4 });
const matLampRun = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0x0d3a2a, emissiveIntensity:1.0 });
const matLampTrp = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0xff2233, emissiveIntensity:1.6 });

// ============================================================================
// ZONE 2 — GEOMETRY.
// ============================================================================
const root = new THREE.Group();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);
function instanced(geo, mat, xforms, parent){
  const im = new THREE.InstancedMesh(geo, mat, xforms.length);
  im.castShadow = im.receiveShadow = true;
  xforms.forEach((t,i)=>{
    _p.set(t[0], t[1], t[2]);
    _q.setFromEuler(new THREE.Euler(t[3]||0, t[4]||0, t[5]||0));
    _s.set(t[6]??1, t[7]??1, t[8]??1);
    im.setMatrixAt(i, _m.compose(_p,_q,_s));
  });
  im.instanceMatrix.needsUpdate = true;
  parent.add(im); return im;
}
function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}

// --- plinth + carcass ---
box(TOTAL_W - 0.05, PLINTH_H, DEPTH - 0.05, matPlinth, 0, PLINTH_H/2, 0);
box(TOTAL_W, BODY_H, 0.015, matPaintD, 0, PLINTH_H + BODY_H/2, -DEPTH/2 + 0.008);   // rear
box(TOTAL_W, 0.015, DEPTH, matPaint, 0, TOP_Y - 0.008, 0);                          // roof
box(TOTAL_W, 0.015, DEPTH, matPaintD, 0, PLINTH_H + 0.008, 0);                      // floor
for(let i=0;i<=NSEC;i++){                                                           // side / division panels
  // Internal dividers STOP at the bus compartment floor. The horizontal bus is one continuous run
  // over all four sections; a full-height divider chops it into unconnected stubs, which is the
  // difference between an MCC lineup and four boards standing in a row.
  const end = (i===0 || i===NSEC), ph = end ? BODY_H : (BUS_Y0 - PLINTH_H);
  box(0.015, ph, DEPTH, matPaintD, secL(i) + (i===0 ? 0.008 : (i===NSEC ? -0.008 : 0)),
      PLINTH_H + ph/2, 0);
}

// --- horizontal bus compartment + its bolted cover ---
const busbars = new THREE.Group();
const BAR_H = 0.045, BAR_PITCH = 0.058;
const barY = k => BUS_Y0 + 0.045 + k*BAR_PITCH;
for(let k=0;k<3;k++) box(TOTAL_W - 0.08, BAR_H, 0.010, matCopper, 0, barY(k), 0.04, busbars);
const stand = [];
for(let i=0;i<=NSEC;i++) for(let k=0;k<3;k++)
  stand.push([secL(i) + (i===0 ? 0.05 : (i===NSEC ? -0.05 : 0)), barY(k), 0.005, Math.PI/2, 0, 0]);
instanced(new THREE.CylinderGeometry(0.016, 0.018, 0.055, 10), matInsul, stand, busbars);
root.add(busbars);

const busCover = new THREE.Group();
box(TOTAL_W - 0.01, BUS_H - 0.01, 0.018, matPaint, 0, BUS_Y0 + BUS_H/2, FRONT_Z + 0.004, busCover);
const bolts = [];
for(let i=0;i<NSEC*2+1;i++){
  const x = -TOTAL_W/2 + 0.07 + i*((TOTAL_W - 0.14)/(NSEC*2));
  bolts.push([x, BUS_Y0 + 0.045, FRONT_Z + 0.015, Math.PI/2, 0, 0]);
  bolts.push([x, BUS_Y0 + BUS_H - 0.045, FRONT_Z + 0.015, Math.PI/2, 0, 0]);
}
instanced(new THREE.CylinderGeometry(0.007, 0.007, 0.008, 8), matSteel, bolts, busCover);
root.add(busCover);

// --- vertical wireway: full-height, hinged cover, cable bundles behind it ---
const wireways = new THREE.Group();
for(let i=0;i<NSEC;i++){
  const wx = secL(i) + BKT_W + WIRE_W/2;
  box(WIRE_W - 0.02, STACK_H + 0.10, 0.018, matPaint, wx, STACK_Y0 + STACK_H/2, FRONT_Z + 0.005, wireways);
  for(const hy of [STACK_Y0 + 0.14, STACK_Y0 + STACK_H/2, STACK_Y0 + STACK_H - 0.14])   // latches
    box(0.030, 0.055, 0.020, matPlastic, wx + WIRE_W/2 - 0.035, hy, FRONT_Z + 0.020, wireways);
  // cable bundles + the vertical bus that drops from the horizontal bus into the stabs
  box(WIRE_W - 0.05, STACK_H, 0.07, matWire, wx, STACK_Y0 + STACK_H/2, FRONT_Z - 0.09, wireways);
  for(let k=0;k<3;k++)
    box(0.030, BUS_Y0 - STACK_Y0, 0.008, matCopper,
        secL(i) + BKT_W - 0.055 + k*0.022, (STACK_Y0 + BUS_Y0)/2, -0.10, wireways);
}
root.add(wireways);

// ---------- buckets ----------
// Each bucket is a Group holding its own door + the starter behind it, translated in +Z when pulled.
// Modelling the starter as part of the fixed carcass would make the withdrawal a lie.
const buckets = [], lamps = [];
function makeBucket(cx, y0, mods, tag){
  const h = mods*MODULE, cy = y0 + h/2;
  const g = new THREE.Group();
  const REVEAL = 0.008;                                   // shadow gap — without it the stack fuses
  const w = BKT_W - 2*REVEAL, dh = h - 2*REVEAL;

  // starter guts, sitting at the FRONT of the unit where a real bucket's gear lives
  const gz = 0.02;
  box(w - 0.06, dh - 0.05, 0.012, matDevFace, cx, cy, gz - 0.02, g);          // bucket back plate
  if(mods >= 3){                                                              // breaker + contactor + OL
    box(0.10, Math.min(0.22, dh*0.5), 0.11, matDevice, cx - 0.11, cy + 0.03, gz + 0.06, g);
    box(0.13, Math.min(0.20, dh*0.45), 0.13, matDevice, cx + 0.07, cy + 0.02, gz + 0.07, g);
    box(0.12, 0.07, 0.09, matDevice, cx + 0.07, cy - 0.13, gz + 0.05, g);
  } else {
    box(0.10, dh*0.42, 0.10, matDevice, cx - 0.10, cy + 0.02, gz + 0.06, g);
    box(0.12, dh*0.36, 0.12, matDevice, cx + 0.07, cy, gz + 0.07, g);
  }
  for(const sy of [-1, 1])                                                    // stab-on line connectors
    box(0.055, 0.020, 0.05, matCopper, cx + 0.14, cy + sy*(dh/2 - 0.06), gz - 0.05, g);
  box(0.030, dh - 0.10, 0.030, matWire, cx + BKT_W/2 - 0.03, cy, gz + 0.02, g);   // control harness

  // door: hinged look, but a bucket door travels WITH the unit, so it is a child of the bucket
  const door = new THREE.Group();
  box(w, dh, 0.018, matPaint, cx, cy, FRONT_Z + 0.006, door);
  // pistol-grip disconnect operator on the LEFT edge — the single clearest MCC tell
  box(0.055, 0.16, 0.028, matPlastic, cx - w/2 + 0.045, cy + 0.02, FRONT_Z + 0.026, door);
  box(0.030, 0.075, 0.055, matHandle, cx - w/2 + 0.045, cy - 0.05, FRONT_Z + 0.052, door);
  // start / stop pushbuttons + one pilot light + the engraved circuit label
  cyl(0.017, 0.017, 0.014, 12, matPlastic, cx + 0.02, cy + 0.03, FRONT_Z + 0.022, door).rotation.x = Math.PI/2;
  cyl(0.021, 0.021, 0.016, 12, matHandle,  cx + 0.09, cy + 0.03, FRONT_Z + 0.023, door).rotation.x = Math.PI/2;
  const l = cyl(0.014, 0.014, 0.014, 12, matLampOff, cx + 0.055, cy - 0.05, FRONT_Z + 0.022, door);
  l.rotation.x = Math.PI/2; l.userData.role = tag; lamps.push(l);
  box(w*0.60 + 0.008, 0.030, 0.004, matPlastic, cx, cy - dh/2 + 0.035, FRONT_Z + 0.017, door);
  box(w*0.60, 0.018, 0.004, matLabel,           cx, cy - dh/2 + 0.035, FRONT_Z + 0.020, door);
  g.add(door);

  root.add(g);
  buckets.push(g);
  return g;
}

for(let i=0;i<NSEC;i++){
  const cx = secL(i) + BKT_W/2;
  let y = STACK_Y0;
  UNITS[i].forEach((mods, k)=>{
    makeBucket(cx, y, mods, (i===1 && k===1) ? 'trip' : (i===0 && k===0 ? 'run' : 'unit'));
    y += mods*MODULE;
    if(y < STACK_Y0 + STACK_H)                                     // horizontal pan between units
      box(BKT_W, 0.012, 0.03, matPaintD, cx, y, FRONT_Z - 0.010);
  });
}

// --- withdrawal rails, visible once a bucket travels out ---
for(let i=0;i<NSEC;i++){
  const cx = secL(i) + BKT_W/2;
  let y = STACK_Y0;
  for(const mods of UNITS[i]){
    for(const sx of [-1, 1])
      box(0.020, 0.012, DEPTH - 0.10, matSteel, cx + sx*(BKT_W/2 - 0.03), y + 0.010, 0.02);
    y += mods*MODULE;
  }
}

// --- nameplate band across the top and lifting angles ---
box(TOTAL_W - 0.20, 0.055, 0.006, matLabel, 0, BUS_Y0 - 0.05, FRONT_Z + 0.010);
const eyes = [];
for(const sx of [-1, 1]) for(const sz of [-1, 1])
  eyes.push([sx*(TOTAL_W/2 - 0.12), TOP_Y + 0.022, sz*(DEPTH/2 - 0.12)]);
instanced(new THREE.TorusGeometry(0.026, 0.007, 8, 16), matSteel, eyes, root);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

// ============================================================================
// ZONE 3 — UI. Render is GATED: every handler calls requestRender().
// ============================================================================
const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

// Withdraw ONE unit, not the whole column: that is what maintenance actually looks like, and it
// keeps the neighbouring buckets in frame as the reference the travel is read against.
const PULLED = [1, 2, 5];                    // indices into `buckets`
const PULL_Z = 0.52;
let pullTarget = 0, pullPos = 0;
const btnPull = document.getElementById('btnPull');
btnPull.onclick = ()=>{ pullTarget = pullTarget ? 0 : 1;
  btnPull.classList.toggle('on', !!pullTarget); requestRender(); };

const btnBus = document.getElementById('btnBus');
btnBus.onclick = ()=>{ busCover.visible = !busCover.visible;
  btnBus.classList.toggle('on', busCover.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); };

const btnTrip = document.getElementById('btnTrip');
let tripped = false;
btnTrip.onclick = ()=>{
  tripped = !tripped; btnTrip.classList.toggle('on', tripped);
  // ISA-101 §3.4: one starter running is green, ONE tripped starter is red, and the other 14 units
  // stay neutral grey. A wall of coloured lamps trains the operator to ignore colour.
  lamps.forEach(l=>{
    const r = l.userData.role;
    l.material = tripped ? (r === 'trip' ? matLampTrp : matLampOff)
                         : (r === 'run'  ? matLampRun : matLampOff);
  });
  requestRender();
};

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(pullPos - pullTarget) > 0.001){
    pullPos += (pullTarget - pullPos) * 0.10;
    if(Math.abs(pullPos - pullTarget) <= 0.001){
      pullPos = pullTarget;
      renderer.shadowMap.needsUpdate = true;   // re-bake once the travel settles, not every frame
    }
    PULLED.forEach((idx, n)=>{ const b = buckets[idx];
      if(b) b.position.z = PULL_Z * pullPos * (1 - n*0.18); });
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
const __app = { runtime:{ scene, renderer, camera, root } };
globalThis.__ccmMotoresApp = __app;
globalThis['__ccm-motoresApp'] = __app;            // slug-exact alias for the catalog QA probe
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
