<!doctype html>
<!--
  banco-capacitores — catalog asset, family `electricos`.
  Built from disenos/catalog/shell-template.html (render-on-demand baked in, block56).
  Spec: ./design-spec.yaml
  NOTE: a DETUNED bank. The reactor section is not optional dressing — on any installation with
  harmonics a plain capacitor-and-contactor bank goes into resonance, so real banks carry a
  detuning reactor per step. Modelling only the cans would be modelling the failure mode.
  Capacitors are also heat-limited, so the ventilation path is part of the machine, not decoration.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de capacitores con reactores de sintonía — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.025 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Banco de capacitores desintonizado — 2 secciones, 6 escalones</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· latas de aluminio · reactores de hierro laminado</span></div>
  <div class="dim">1.60 × 0.50 × 2.10 m · capacitores + contactores | reactores de sintonía</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">ABRIR PUERTAS</button>
  <button id="btnFan">EXTRACCIÓN</button>
  <button id="btnStep">ESCALONES (ISA-101)</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const SEC_W = 0.80, NSEC = 2, TOTAL_W = SEC_W*NSEC;   // 1.60
const DEPTH = 0.50, PLINTH_H = 0.10, BODY_H = 2.00;
const TOP_Y = PLINTH_H + BODY_H;                       // 2.10
const FRONT_Z = DEPTH/2;
const DOOR_Y0 = PLINTH_H + 0.05, DOOR_Y1 = TOP_Y - 0.16;
const NSTEP = 6;
// The capacitor section is at the RIGHT end, nearest the catalog camera. Left-hinged doors each
// cover the section to their left, so the reverse order buries the cans behind the reactor door.
const CAP_CX =  TOTAL_W/2 - SEC_W/2;
const RCT_CX = -TOTAL_W/2 + SEC_W/2;

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 5.0, AZ = 0.73, EL = 0.20, TGT_Y = 1.06;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TGT_Y + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TGT_Y, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TGT_Y, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.2;        // vertical-subject deviation — see design-spec §lighting

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.4, 5.2, 4.0); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-2.6; sun.shadow.camera.right=2.6; sun.shadow.camera.top=2.6; sun.shadow.camera.bottom=-2.6;
sun.shadow.camera.far = 16;
scene.add(sun);
const faceFill = new THREE.DirectionalLight(0xdce6f2, 0.85);    // panel-normal fill (the deviation)
faceFill.position.set(0.6, 1.3, 4.6);
scene.add(faceFill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(22,22),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1 near-binary metalness.
//   Capacitor cans are BARE extruded aluminium. Reactor laminations are bare steel, but the coil
//   wound over them is enamelled copper and the coil formers are dielectric — three families in
//   one component, and collapsing them is what makes a reactor read as a grey brick.
// ============================================================================
const matPaint  = new THREE.MeshStandardMaterial({ color:0xcfd2cc, metalness:0.0, roughness:0.55 });
const matPaintD = new THREE.MeshStandardMaterial({ color:0xb9bdb8, metalness:0.0, roughness:0.58 });
const matPlinth = new THREE.MeshStandardMaterial({ color:0x3b4046, metalness:0.0, roughness:0.62 });
const matSteel  = new THREE.MeshStandardMaterial({ color:0xb6babc, metalness:0.92, roughness:0.42 });
const matCan    = new THREE.MeshStandardMaterial({ color:0xc4c9cc, metalness:0.95, roughness:0.36 });
const matCanTop = new THREE.MeshStandardMaterial({ color:0x9aa0a4, metalness:0.90, roughness:0.48 });
const matLamCore= new THREE.MeshStandardMaterial({ color:0xa4aaae, metalness:0.95, roughness:0.42 });
const matCoil   = new THREE.MeshStandardMaterial({ color:0xd8894f, metalness:0.85, roughness:0.52 });
const matFormer = new THREE.MeshStandardMaterial({ color:0x6b4d2a, metalness:0.0,  roughness:0.66 });
const matCopper = new THREE.MeshStandardMaterial({ color:0xf0a67a, metalness:1.0,  roughness:0.34 });
const matDevice = new THREE.MeshStandardMaterial({ color:0x2a2e33, metalness:0.0,  roughness:0.60 });
const matDevFace= new THREE.MeshStandardMaterial({ color:0x8d9298, metalness:0.0,  roughness:0.58 });
const matPlastic= new THREE.MeshStandardMaterial({ color:0x1a1d21, metalness:0.0,  roughness:0.52 });
const matLabel  = new THREE.MeshStandardMaterial({ color:0xf2f3ef, metalness:0.0,  roughness:0.70 });
const matScreen = new THREE.MeshStandardMaterial({ color:0x0d1a16, metalness:0.0,  roughness:0.16,
                                                   emissive:0x0a2a22, emissiveIntensity:0.9 });
// ISA-101 §3.4 — an engaged step is a NORMAL condition, so it gets the neutral-green "on", not red.
const matLampOff = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4 });
const matLampOn  = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0x0d3a2a, emissiveIntensity:1.1 });

// ============================================================================
// ZONE 2 — GEOMETRY.
// ============================================================================
const root = new THREE.Group();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);
function instanced(geo, mat, xforms, parent){
  const im = new THREE.InstancedMesh(geo, mat, xforms.length);
  im.castShadow = im.receiveShadow = true;
  xforms.forEach((t,i)=>{
    _p.set(t[0], t[1], t[2]);
    _q.setFromEuler(new THREE.Euler(t[3]||0, t[4]||0, t[5]||0));
    _s.set(t[6]??1, t[7]??1, t[8]??1);
    im.setMatrixAt(i, _m.compose(_p,_q,_s));
  });
  im.instanceMatrix.needsUpdate = true;
  parent.add(im); return im;
}
function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}

// --- plinth + carcass shell ---
box(TOTAL_W - 0.05, PLINTH_H, DEPTH - 0.05, matPlinth, 0, PLINTH_H/2, 0);
box(TOTAL_W, BODY_H, 0.015, matPaintD, 0, PLINTH_H + BODY_H/2, -DEPTH/2 + 0.008);
for(let i=0;i<=NSEC;i++){
  const x = -TOTAL_W/2 + i*SEC_W;
  box(0.015, BODY_H, DEPTH, matPaintD, x + (i===0 ? 0.008 : (i===NSEC ? -0.008 : 0)), PLINTH_H + BODY_H/2, 0);
}
box(TOTAL_W, 0.015, DEPTH, matPaint, 0, TOP_Y - 0.008, 0);
box(TOTAL_W, 0.015, DEPTH, matPaintD, 0, PLINTH_H + 0.008, 0);
box(TOTAL_W, DOOR_Y0 - PLINTH_H, 0.030, matPaint, 0, (PLINTH_H + DOOR_Y0)/2, FRONT_Z - 0.015);
box(TOTAL_W, TOP_Y - DOOR_Y1,    0.030, matPaint, 0, (DOOR_Y1 + TOP_Y)/2,    FRONT_Z - 0.015);
for(let i=0;i<=NSEC;i++){
  const x = -TOTAL_W/2 + i*SEC_W;
  box(0.034, DOOR_Y1 - DOOR_Y0, 0.030, matPaint,
      x + (i===0 ? 0.017 : (i===NSEC ? -0.017 : 0)), (DOOR_Y0 + DOOR_Y1)/2, FRONT_Z - 0.015);
}

// --- roof extraction fans + hoods. Capacitor life halves per ~10 K of overtemperature, so this
//     is a functional part of the bank, not trim. ---
const fans = [];
for(const cx of [CAP_CX, RCT_CX]){
  box(SEC_W - 0.14, 0.10, DEPTH - 0.12, matPaint, cx, TOP_Y + 0.05, 0);
  const hub = new THREE.Group(); hub.position.set(cx, TOP_Y + 0.03, 0);
  cyl(0.028, 0.028, 0.036, 12, matPlastic, 0, 0, 0, hub);
  for(let b=0;b<7;b++){
    const a = b*Math.PI*2/7;
    const bl = box(0.070, 0.010, 0.028, matPlastic, 0, 0, 0, hub);
    bl.position.set(Math.cos(a)*0.048, 0, Math.sin(a)*0.048);
    bl.rotation.set(0.5, a, 0);
  }
  root.add(hub); fans.push(hub);
  const bars = [];
  for(let k=0;k<7;k++) bars.push([cx, TOP_Y + 0.098, -0.09 + k*0.030]);
  instanced(new THREE.BoxGeometry(SEC_W - 0.20, 0.006, 0.006), matSteel, bars, root);
}

// --- capacitor section interior: NSTEP cans over their contactors and fuses ---
const capGuts = new THREE.Group();
const CAN_R = 0.043, CAN_H = 0.26, GZ = 0.02;
box(SEC_W - 0.06, DOOR_Y1 - DOOR_Y0, 0.012, matDevFace, CAP_CX, (DOOR_Y0 + DOOR_Y1)/2, GZ - 0.02, capGuts);
const cans = [], canTops = [], bushings = [], contactors = [], ctFaces = [], fuses = [];
for(let s=0;s<NSTEP;s++){
  const row = Math.floor(s/3), col = s % 3;
  const cx = CAP_CX - 0.24 + col*0.24;
  const cy = DOOR_Y1 - 0.30 - row*0.52;
  cans.push([cx, cy, GZ + 0.10]);
  canTops.push([cx, cy + CAN_H/2 + 0.010, GZ + 0.10]);
  for(const dx of [-0.018, 0, 0.018]) bushings.push([cx + dx, cy + CAN_H/2 + 0.036, GZ + 0.10]);
  contactors.push([cx, cy - CAN_H/2 - 0.11, GZ + 0.07]);
  ctFaces.push([cx, cy - CAN_H/2 - 0.11, GZ + 0.135]);
  fuses.push([cx, cy - CAN_H/2 - 0.23, GZ + 0.06]);
}
instanced(new THREE.CylinderGeometry(CAN_R, CAN_R, CAN_H, 18), matCan, cans, capGuts);
instanced(new THREE.CylinderGeometry(CAN_R + 0.004, CAN_R + 0.004, 0.020, 18), matCanTop, canTops, capGuts);
instanced(new THREE.CylinderGeometry(0.008, 0.008, 0.032, 8), matCopper, bushings, capGuts);
instanced(new THREE.BoxGeometry(0.13, 0.15, 0.11), matDevice, contactors, capGuts);
instanced(new THREE.BoxGeometry(0.10, 0.05, 0.014), matDevFace, ctFaces, capGuts);
instanced(new THREE.BoxGeometry(0.15, 0.07, 0.09), matPlastic, fuses, capGuts);
// step wiring dropping to the vertical bus
for(let k=0;k<3;k++)
  box(0.030, DOOR_Y1 - DOOR_Y0 - 0.10, 0.010, matCopper,
      CAP_CX + 0.30 + (k-1)*0.022, (DOOR_Y0 + DOOR_Y1)/2, GZ + 0.02, capGuts);
// Bottom of the section: control transformer, discharge resistors and the terminal rail. Real
// banks fill this space and the geometry needs it too — the two step rows left ~0.5 m of bare
// backplate under them, which reads as an unfinished cabinet rather than a compact one.
{
  const by = DOOR_Y0 + 0.22;
  box(0.17, 0.17, 0.14, matLamCore, CAP_CX - 0.24, by + 0.08, GZ + 0.07, capGuts);      // control transformer
  box(0.19, 0.05, 0.16, matSteel,   CAP_CX - 0.24, by - 0.02, GZ + 0.07, capGuts);
  const res = [];                                                                        // discharge resistors
  for(let k=0;k<4;k++) res.push([CAP_CX + 0.02 + (k%2)*0.10, by + 0.16 - Math.floor(k/2)*0.09, GZ + 0.06,
                                 0, 0, Math.PI/2]);
  instanced(new THREE.CylinderGeometry(0.016, 0.016, 0.10, 10), matFormer, res, capGuts);
  box(SEC_W - 0.16, 0.030, 0.05, matSteel, CAP_CX, by - 0.13, GZ + 0.05, capGuts);       // DIN rail
  const terms = [];
  for(let k=0;k<14;k++) terms.push([CAP_CX - (SEC_W - 0.22)/2 + k*((SEC_W - 0.22)/13), by - 0.09, GZ + 0.05]);
  instanced(new THREE.BoxGeometry(0.020, 0.055, 0.045), matPlastic, terms, capGuts);     // terminal blocks
}
root.add(capGuts);

// --- reactor section interior: 3 detuning reactors, laminated core + copper coil on a former ---
const rctGuts = new THREE.Group();
box(SEC_W - 0.06, DOOR_Y1 - DOOR_Y0, 0.012, matDevFace, RCT_CX, (DOOR_Y0 + DOOR_Y1)/2, GZ - 0.02, rctGuts);
for(let r=0;r<3;r++){
  const ry = DOOR_Y0 + 0.34 + r*0.46;
  // laminated core: yokes top and bottom, 3 limbs, exactly like a small transformer
  for(const sy of [-1, 1]) box(SEC_W - 0.24, 0.055, 0.16, matLamCore, RCT_CX, ry + sy*0.145, GZ + 0.08, rctGuts);
  for(const dx of [-0.19, 0, 0.19]){
    box(0.055, 0.24, 0.16, matLamCore, RCT_CX + dx, ry, GZ + 0.08, rctGuts);
    cyl(0.062, 0.062, 0.17, 16, matCoil,  RCT_CX + dx, ry, GZ + 0.08, rctGuts).rotation.x = Math.PI/2;
    for(const sz of [-1, 1])
      cyl(0.068, 0.068, 0.014, 16, matFormer, RCT_CX + dx, ry, GZ + 0.08 + sz*0.088, rctGuts).rotation.x = Math.PI/2;
    box(0.030, 0.030, 0.05, matCopper, RCT_CX + dx, ry + 0.175, GZ + 0.08, rctGuts);   // coil tail
  }
  for(const sz of [-1, 1])                                                              // clamping angles
    box(SEC_W - 0.22, 0.30, 0.020, matSteel, RCT_CX, ry, GZ + 0.08 + sz*0.095, rctGuts);
}
// main breaker above the reactor stack
box(0.24, 0.20, 0.14, matDevice, RCT_CX, DOOR_Y1 - 0.16, GZ + 0.06, rctGuts);
box(0.06, 0.06, 0.035, matPlastic, RCT_CX, DOOR_Y1 - 0.16, GZ + 0.14, rctGuts);
root.add(rctGuts);

// ---------- doors ----------
const doors = [], stepLamps = [];
function makeDoor(cx, kind){
  const REVEAL = 0.010;
  const w = SEC_W - 0.068 - 2*REVEAL, h = DOOR_Y1 - DOOR_Y0 - 2*REVEAL;
  const cy = (DOOR_Y0 + DOOR_Y1)/2, x0 = cx - SEC_W/2 + 0.034;
  const g = new THREE.Group(); g.position.set(x0, 0, FRONT_Z + 0.006);
  const lx = REVEAL + w/2;
  box(w, h, 0.020, matPaint, lx, cy, 0, g);
  for(const sy of [-1, 1]) box(w, 0.020, 0.045, matPaintD, lx, cy + sy*(h/2 - 0.010), -0.030, g);
  for(const hy of [cy - h/2 + 0.10, cy, cy + h/2 - 0.10])
    box(0.020, 0.070, 0.026, matSteel, 0.012, hy, -0.008, g);
  box(0.045, 0.120, 0.012, matPlastic, lx + w/2 - 0.045, cy, 0.016, g);
  box(0.016, 0.075, 0.030, matPlastic, lx + w/2 - 0.045, cy - 0.02, 0.032, g);
  box(w*0.55 + 0.008, 0.032, 0.004, matPlastic, lx, cy - h/2 + 0.06, 0.012, g);
  box(w*0.55, 0.020, 0.004, matLabel,           lx, cy - h/2 + 0.06, 0.015, g);
  // recessed intake louvres low on every door — the bottom of the ventilation path
  box(w*0.68 + 0.012, 0.20 + 0.012, 0.005, matPaintD, lx, cy - h/2 + 0.30, 0.006, g);
  box(w*0.68, 0.20, 0.004, matPlastic, lx, cy - h/2 + 0.30, 0.009, g);
  const slats = [];
  for(let k=0;k<5;k++) slats.push([lx, cy - h/2 + 0.38 - k*0.040, 0.016, -0.42, 0, 0, w*0.68, 1, 1]);
  instanced(new THREE.BoxGeometry(1.0, 0.019, 0.012), matPaint, slats, g);

  if(kind === 'cap'){
    // power-factor regulator: display + one lamp PER STEP. The step row is the readout that makes
    // this a regulated bank rather than a fixed one.
    box(0.26, 0.22, 0.024, matPlastic, lx, cy + 0.52, 0.022, g);
    box(0.20, 0.115, 0.008, matScreen, lx, cy + 0.555, 0.036, g);
    for(let s=0;s<NSTEP;s++){
      const l = cyl(0.011, 0.011, 0.012, 12, matLampOff, lx - 0.075 + s*0.030, cy + 0.475, 0.037, g);
      l.rotation.x = Math.PI/2; l.userData.step = s;
      stepLamps.push(l);
    }
    for(const dx of [-0.06, 0.06])
      cyl(0.018, 0.018, 0.014, 12, matPlastic, lx + dx, cy + 0.36, 0.022, g).rotation.x = Math.PI/2;
  } else {
    box(0.18, 0.18, 0.005, matLabel, lx, cy + 0.50, 0.012, g);      // harmonic/detuning data plate
  }
  root.add(g); doors.push(g);
}
makeDoor(RCT_CX, 'rct');
makeDoor(CAP_CX, 'cap');

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

// ============================================================================
// ZONE 3 — UI. Render is GATED: every handler calls requestRender().
// ============================================================================
const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

const OPEN_ANGLE = -2.05;
let doorTarget = 0, doorPos = 0;
const btnDoor = document.getElementById('btnDoor');
btnDoor.onclick = ()=>{ doorTarget = doorTarget ? 0 : 1;
  btnDoor.classList.toggle('on', !!doorTarget); requestRender(); };

let fanOn = false;
const btnFan = document.getElementById('btnFan');
btnFan.onclick = ()=>{ fanOn = !fanOn; btnFan.classList.toggle('on', fanOn); requestRender(); };

const btnStep = document.getElementById('btnStep');
let engaged = false;
btnStep.onclick = ()=>{
  engaged = !engaged; btnStep.classList.toggle('on', engaged);
  // ISA-101 §3.4: engaging steps is NORMAL operation, so it takes the neutral-green "on" state,
  // never red. Red here would train the operator to read routine correction as a fault.
  stepLamps.forEach(l=>{ l.material = (engaged && l.userData.step < 4) ? matLampOn : matLampOff; });
  requestRender();
};

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(doorPos - doorTarget) > 0.001){
    doorPos += (doorTarget - doorPos) * 0.10;
    if(Math.abs(doorPos - doorTarget) <= 0.001){
      doorPos = doorTarget;
      renderer.shadowMap.needsUpdate = true;   // re-bake once the swing settles, not every frame
    }
    doors.forEach((d,i)=>{ d.rotation.y = OPEN_ANGLE * doorPos * (1 - i*0.08); });
    needsRender = true;
  }
  if(fanOn){ fans.forEach((f,i)=>{ f.rotation.y += 0.24 + i*0.02; }); needsRender = true; }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();
