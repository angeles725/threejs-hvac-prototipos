<!doctype html>
<!--
  variador-vfd — catalog asset, family `electricos`.
  Built from disenos/catalog/shell-template.html (render-on-demand baked in, block56).
  Spec: ./design-spec.yaml
  NOTE: a VFD cabinet is defined by its THERMAL path, not by its box. Roughly 3% of throughput is
  dissipated in the drive, so the asset must show the whole chain: bottom intake filter, finned
  heatsink, top exhaust fans, cowl. A sealed VFD cabinet is a thermal impossibility.
  The fan animation is the shell's per-frame case: it is gated on a state flag and only then does
  it hold needsRender true — a free-running spin would defeat render-on-demand entirely.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variador de frecuencia (VFD) — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.025 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Variador de frecuencia — gabinete con disipador y extracción</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· chapa RAL 7035 · disipador de aluminio</span></div>
  <div class="dim">0.80 × 0.60 × 2.10 m · admisión inferior filtrada → disipador → extracción superior</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">ABRIR PUERTA</button>
  <button id="btnFan">VENTILADORES</button>
  <button id="btnTrip">FALLA (ISA-101)</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const W = 0.80, D = 0.60, PLINTH_H = 0.10, BODY_H = 2.00;
const TOP_Y = PLINTH_H + BODY_H;                 // 2.10
const FRONT_Z = D/2;
const DOOR_Y0 = PLINTH_H + 0.05, DOOR_Y1 = TOP_Y - 0.18;
const COWL_H = 0.16;                             // roof exhaust cowl

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 7, 28);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 4.4, AZ = 0.73, EL = 0.20, TGT_Y = 1.08;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TGT_Y + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TGT_Y, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TGT_Y, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.2;        // vertical-subject deviation — see design-spec §lighting

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.0, 5.0, 3.6); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-2.2; sun.shadow.camera.right=2.2; sun.shadow.camera.top=2.6; sun.shadow.camera.bottom=-2.6;
sun.shadow.camera.far = 14;
scene.add(sun);
const faceFill = new THREE.DirectionalLight(0xdce6f2, 0.85);    // panel-normal fill (the deviation)
faceFill.position.set(0.5, 1.3, 4.2);
scene.add(faceFill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1 near-binary metalness.
//   Extruded aluminium heatsink = BARE METAL. Cabinet sheet = coated DIELECTRIC. Capacitor cans
//   are aluminium but sleeved in printed PVC, so they are dielectric too — a detail that is easy
//   to get wrong precisely because the can underneath is metal.
// ============================================================================
const matPaint  = new THREE.MeshStandardMaterial({ color:0xcfd2cc, metalness:0.0, roughness:0.55 });
const matPaintD = new THREE.MeshStandardMaterial({ color:0xb9bdb8, metalness:0.0, roughness:0.58 });
const matPlinth = new THREE.MeshStandardMaterial({ color:0x3b4046, metalness:0.0, roughness:0.62 });
const matAlu    = new THREE.MeshStandardMaterial({ color:0xc2c7ca, metalness:0.95, roughness:0.40 });
const matSteel  = new THREE.MeshStandardMaterial({ color:0xb6babc, metalness:0.92, roughness:0.42 });
const matCopper = new THREE.MeshStandardMaterial({ color:0xf0a67a, metalness:1.0,  roughness:0.34 });
const matPlastic= new THREE.MeshStandardMaterial({ color:0x1a1d21, metalness:0.0,  roughness:0.52 });
const matDrive  = new THREE.MeshStandardMaterial({ color:0x24282c, metalness:0.0,  roughness:0.58 });
const matDriveF = new THREE.MeshStandardMaterial({ color:0x4a5057, metalness:0.0,  roughness:0.52 });
const matCapSlv = new THREE.MeshStandardMaterial({ color:0x2b3a6a, metalness:0.0,  roughness:0.46 });
const matPcb    = new THREE.MeshStandardMaterial({ color:0x1d4536, metalness:0.0,  roughness:0.70 });
const matFilter = new THREE.MeshStandardMaterial({ color:0x5b5f52, metalness:0.0,  roughness:0.95 });
const matLabel  = new THREE.MeshStandardMaterial({ color:0xf2f3ef, metalness:0.0,  roughness:0.70 });
const matScreen = new THREE.MeshStandardMaterial({ color:0x0d1a16, metalness:0.0,  roughness:0.16,
                                                   emissive:0x0a2a22, emissiveIntensity:0.9 });
// ISA-101 §3.4
const matLampOff = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4 });
const matLampRun = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0x0d3a2a, emissiveIntensity:1.0 });
const matLampTrp = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0xff2233, emissiveIntensity:1.6 });

// ============================================================================
// ZONE 2 — GEOMETRY.
// ============================================================================
const root = new THREE.Group();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);
function instanced(geo, mat, xforms, parent){
  const im = new THREE.InstancedMesh(geo, mat, xforms.length);
  im.castShadow = im.receiveShadow = true;
  xforms.forEach((t,i)=>{
    _p.set(t[0], t[1], t[2]);
    _q.setFromEuler(new THREE.Euler(t[3]||0, t[4]||0, t[5]||0));
    _s.set(t[6]??1, t[7]??1, t[8]??1);
    im.setMatrixAt(i, _m.compose(_p,_q,_s));
  });
  im.instanceMatrix.needsUpdate = true;
  parent.add(im); return im;
}
function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}

// --- plinth + carcass shell (walls only — the inside has to be reachable) ---
box(W - 0.05, PLINTH_H, D - 0.05, matPlinth, 0, PLINTH_H/2, 0);
box(W, BODY_H, 0.015, matPaintD, 0, PLINTH_H + BODY_H/2, -D/2 + 0.008);          // rear
for(const sx of [-1, 1]) box(0.015, BODY_H, D, matPaintD, sx*(W/2 - 0.008), PLINTH_H + BODY_H/2, 0);
box(W, 0.015, D, matPaint, 0, TOP_Y - 0.008, 0);                                  // roof
box(W, 0.015, D, matPaintD, 0, PLINTH_H + 0.008, 0);                              // floor
// front frame around the door opening
box(W, DOOR_Y0 - PLINTH_H, 0.030, matPaint, 0, (PLINTH_H + DOOR_Y0)/2, FRONT_Z - 0.015);
box(W, TOP_Y - DOOR_Y1,    0.030, matPaint, 0, (DOOR_Y1 + TOP_Y)/2,    FRONT_Z - 0.015);
for(const sx of [-1, 1])
  box(0.035, DOOR_Y1 - DOOR_Y0, 0.030, matPaint, sx*(W/2 - 0.018), (DOOR_Y0 + DOOR_Y1)/2, FRONT_Z - 0.015);

// ---------- the thermal path, bottom to top ----------
// 1) bottom intake: a filter pad behind a recessed louvre bank
const intakeY = PLINTH_H + 0.16;
box(W*0.66 + 0.012, 0.22 + 0.012, 0.006, matPaintD, 0, intakeY, FRONT_Z - 0.014);
box(W*0.66, 0.22, 0.006, matPlastic, 0, intakeY, FRONT_Z - 0.011);                // dark cavity
box(W*0.60, 0.19, 0.020, matFilter, 0, intakeY, FRONT_Z - 0.035);                 // filter pad
const intakeSlats = [];
for(let k=0;k<6;k++) intakeSlats.push([0, intakeY + 0.09 - k*0.036, FRONT_Z - 0.006, -0.42, 0, 0, W*0.66, 1, 1]);
instanced(new THREE.BoxGeometry(1.0, 0.020, 0.014), matPaint, intakeSlats, root);

// 2) the drive itself: finned heatsink at the back, power stack and DC bus in front of it
const drive = new THREE.Group();
const HS_Y0 = PLINTH_H + 0.62, HS_H = 0.94;
// Dark mounting plate: a drive bolted straight onto the light rear sheet loses all its contrast.
box(W - 0.06, HS_H + 0.34, 0.010, matDrive, 0, HS_Y0 + HS_H/2, -D/2 + 0.028, drive);
box(W - 0.12, HS_H, 0.045, matAlu, 0, HS_Y0 + HS_H/2, -D/2 + 0.075, drive);       // heatsink base
const finXs = [];
for(let x = -(W - 0.16)/2; x <= (W - 0.16)/2 + 1e-6; x += 0.028)
  finXs.push([x, HS_Y0 + HS_H/2, -D/2 + 0.135]);
instanced(new THREE.BoxGeometry(0.008, HS_H, 0.075), matAlu, finXs, drive);       // extruded fins
// The power stack is deliberately SHORTER AND NARROWER than the fin block, so the fins stay visible
// above, below and either side of it. Sized flush, the heatsink disappears behind the module and
// the asset's whole thermal story becomes invisible from the only angle anyone looks at it from.
const PS_H = HS_H - 0.30, PS_W = W - 0.30;
box(PS_W, PS_H, 0.10, matDrive, 0, HS_Y0 + HS_H/2, -D/2 + 0.245, drive);          // power stack
// lighter moulded front bezel + its vent slots: without it the stack and the dark mounting plate
// merge into one undifferentiated grey mass in every open-door view
box(PS_W - 0.03, PS_H - 0.04, 0.014, matDriveF, 0, HS_Y0 + HS_H/2, -D/2 + 0.300, drive);
const psVents = [];
for(let k=0;k<6;k++)
  psVents.push([0, HS_Y0 + HS_H/2 - PS_H/2 + 0.09 + k*0.055, -D/2 + 0.308, 0, 0, 0, PS_W - 0.14, 1, 1]);
instanced(new THREE.BoxGeometry(1.0, 0.020, 0.006), matDrive, psVents, drive);
box(PS_W - 0.10, 0.040, 0.012, matLabel, 0, HS_Y0 + HS_H/2 + PS_H/2 - 0.05, -D/2 + 0.308, drive);
for(const sx of [-1, 0, 1])                                                       // DC bus capacitors
  cyl(0.045, 0.045, 0.20, 16, matCapSlv, sx*0.20, HS_Y0 + HS_H - 0.16, -D/2 + 0.36, drive);
box(W - 0.22, 0.020, 0.055, matCopper, 0, HS_Y0 + HS_H - 0.03, -D/2 + 0.36, drive);  // DC link bar
box(W - 0.24, 0.24, 0.012, matPcb, 0, HS_Y0 + 0.22, -D/2 + 0.40, drive);          // control card
for(let k=0;k<8;k++)                                                              // card components
  box(0.030, 0.030, 0.016, matPlastic, -0.26 + k*0.075, HS_Y0 + 0.22, -D/2 + 0.414, drive);
root.add(drive);

// 3) input reactor + output terminals at the bottom, cable gland plate below them
box(0.26, 0.22, 0.20, matDrive, -0.18, PLINTH_H + 0.44, -D/2 + 0.20);             // line reactor
for(let k=0;k<3;k++)
  box(0.035, 0.05, 0.05, matCopper, 0.10 + k*0.075, PLINTH_H + 0.40, -D/2 + 0.16);// output terminals
box(W - 0.14, 0.010, 0.24, matSteel, 0, PLINTH_H + 0.02, -D/2 + 0.20);            // gland plate

// 4) top exhaust: 2 fans under a cowl. THE FAN BLADES ARE THE ANIMATED PART.
const fans = [];
const FAN_Y = TOP_Y + COWL_H*0.45;
box(W - 0.04, COWL_H, D - 0.10, matPaint, 0, TOP_Y + COWL_H/2, 0.02);             // cowl
// cowl discharge louvres, front and both sides — otherwise the cowl reads as a blank white lid
{ const cz = 0.02 + (D - 0.10)/2, cw = W - 0.16, cd = D - 0.20, cySlat = [], cxSlat = [];
  box(cw + 0.012, COWL_H - 0.03, 0.005, matPlastic, 0, TOP_Y + COWL_H/2, cz - 0.004);
  for(let k=0;k<4;k++){
    const y = TOP_Y + COWL_H - 0.036 - k*0.032;
    cySlat.push([0, y, cz + 0.004, -0.42, 0, 0, cw, 1, 1]);
    for(const sx of [-1, 1]) cxSlat.push([sx*(W/2 - 0.026), y, 0.02, 0, 0, -0.42, 1, 1, cd]);
  }
  instanced(new THREE.BoxGeometry(1.0, 0.018, 0.012), matPaintD, cySlat, root);
  instanced(new THREE.BoxGeometry(0.012, 0.018, 1.0), matPaintD, cxSlat, root);
}
for(const sx of [-1, 1]){
  const fx = sx*0.19;
  cyl(0.085, 0.085, 0.030, 20, matPaintD, fx, TOP_Y + 0.004, 0.02).rotation.x = 0; // fan throat ring
  const hub = new THREE.Group(); hub.position.set(fx, FAN_Y, 0.02);
  cyl(0.030, 0.030, 0.040, 12, matPlastic, 0, 0, 0, hub);
  for(let b=0;b<7;b++){                                                            // 7 blades
    const bl = box(0.075, 0.010, 0.030, matPlastic, 0.052, 0, 0, hub);
    bl.rotation.set(0.5, b*Math.PI*2/7, 0);
    bl.position.set(Math.cos(b*Math.PI*2/7)*0.052, 0, Math.sin(b*Math.PI*2/7)*0.052);
  }
  root.add(hub); fans.push(hub);
  // protective grille bars over the cowl opening
  const bars = [];
  for(let k=0;k<7;k++) bars.push([fx, TOP_Y + COWL_H - 0.006, 0.02 - 0.09 + k*0.030]);
  instanced(new THREE.BoxGeometry(0.19, 0.006, 0.006), matSteel, bars, root);
}

// ---------- door (togglable swing) ----------
const doors = [];
{
  const REVEAL = 0.010;
  const w = W - 0.07 - 2*REVEAL, h = DOOR_Y1 - DOOR_Y0 - 2*REVEAL;
  const cy = (DOOR_Y0 + DOOR_Y1)/2, x0 = -W/2 + 0.035;
  const g = new THREE.Group(); g.position.set(x0, 0, FRONT_Z + 0.006);
  const lx = REVEAL + w/2;
  box(w, h, 0.020, matPaint, lx, cy, 0, g);
  for(const sy of [-1, 1]) box(w, 0.020, 0.045, matPaintD, lx, cy + sy*(h/2 - 0.010), -0.030, g);
  // HMI keypad: bezel, screen, key cluster — the tell that this cabinet is a DRIVE
  box(0.20, 0.30, 0.022, matPlastic, lx, cy + 0.42, 0.021, g);
  box(0.155, 0.105, 0.008, matScreen, lx, cy + 0.50, 0.034, g);
  for(let r=0;r<3;r++) for(let c=0;c<3;c++)
    box(0.030, 0.022, 0.010, matPaintD, lx - 0.05 + c*0.05, cy + 0.40 - r*0.035, 0.033, g);
  // pilot lamps + local/remote selector + door handle + label
  const lamps = [];
  for(let k=0;k<3;k++){
    const l = cyl(0.014, 0.014, 0.014, 12, matLampOff, lx - 0.06 + k*0.06, cy + 0.20, 0.022, g);
    l.rotation.x = Math.PI/2;
    l.userData.role = k===0 ? 'run' : (k===2 ? 'trip' : 'aux');
    lamps.push(l);
  }
  globalThis.__vfdLamps = lamps;
  cyl(0.024, 0.024, 0.018, 14, matPlastic, lx, cy + 0.11, 0.022, g).rotation.x = Math.PI/2;
  box(0.045, 0.120, 0.012, matPlastic, lx + w/2 - 0.045, cy, 0.016, g);
  box(0.016, 0.075, 0.030, matPlastic, lx + w/2 - 0.045, cy - 0.02, 0.032, g);
  for(const hy of [cy - h/2 + 0.10, cy, cy + h/2 - 0.10])
    box(0.020, 0.070, 0.026, matSteel, 0.012, hy, -0.008, g);
  box(w*0.55 + 0.008, 0.032, 0.004, matPlastic, lx, cy - h/2 + 0.06, 0.012, g);
  box(w*0.55, 0.020, 0.004, matLabel,           lx, cy - h/2 + 0.06, 0.015, g);
  root.add(g); doors.push(g);
}
const lamps = globalThis.__vfdLamps; delete globalThis.__vfdLamps;

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

// ============================================================================
// ZONE 3 — UI. Render is GATED: every handler calls requestRender(), and the two moving things
//          (door swing, fan spin) hold needsRender true ONLY while they are actually running.
// ============================================================================
const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

const OPEN_ANGLE = -2.00;
let doorTarget = 0, doorPos = 0;
const btnDoor = document.getElementById('btnDoor');
btnDoor.onclick = ()=>{ doorTarget = doorTarget ? 0 : 1;
  btnDoor.classList.toggle('on', !!doorTarget); requestRender(); };

let fanOn = false;
const btnFan = document.getElementById('btnFan');
btnFan.onclick = ()=>{ fanOn = !fanOn; btnFan.classList.toggle('on', fanOn); requestRender(); };

const btnTrip = document.getElementById('btnTrip');
let tripped = false;
btnTrip.onclick = ()=>{
  tripped = !tripped; btnTrip.classList.toggle('on', tripped);
  lamps.forEach(l=>{ const r = l.userData.role;
    l.material = tripped ? (r === 'trip' ? matLampTrp : matLampOff)
                         : (r === 'run'  ? matLampRun : matLampOff); });
  requestRender();
};

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(doorPos - doorTarget) > 0.001){
    doorPos += (doorTarget - doorPos) * 0.10;
    if(Math.abs(doorPos - doorTarget) <= 0.001){
      doorPos = doorTarget;
      renderer.shadowMap.needsUpdate = true;   // re-bake once the swing settles, not every frame
    }
    doors.forEach(d=>{ d.rotation.y = OPEN_ANGLE * doorPos; });
    needsRender = true;
  }
  if(fanOn){ fans.forEach((f,i)=>{ f.rotation.y += 0.22 + i*0.01; }); needsRender = true; }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
const __app = { runtime:{ scene, renderer, camera, root } };
globalThis.__variadorVfdApp = __app;
globalThis['__variador-vfdApp'] = __app;           // slug-exact alias for the catalog QA probe
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
