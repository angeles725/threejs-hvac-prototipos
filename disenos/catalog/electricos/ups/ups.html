<!doctype html>
<!--
  ups — catalog asset, family `electricos`.
  Built from disenos/catalog/shell-template.html (render-on-demand baked in, block56).
  Spec: ./design-spec.yaml
  NOTE ON SCOPE, so this does not collide with datacenter/banco-baterias: THIS asset is the POWER
  cabinet — modular rectifier/inverter, static bypass, HMI — with ONE coupled battery cabinet to
  show the DC link. The datacenter asset is the opposite emphasis: a multi-cabinet battery bank
  with no power conversion in it at all.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPS modular + gabinete de baterías — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.025 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">UPS modular + gabinete de baterías VRLA</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· chapa RAL 7035 · barra de cobre · ABS de batería</span></div>
  <div class="dim">1.62 × 0.85 × 2.00 m · 3 módulos hot-swap + bypass estático · 20 bloques VRLA</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">ABRIR PUERTAS</button>
  <button id="btnBat">MODO BATERÍA (ISA-101)</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const UPS_W = 0.90, BAT_W = 0.70, GAP = 0.02;
const DEPTH = 0.85, PLINTH_H = 0.10, BODY_H = 1.90;
const TOP_Y = PLINTH_H + BODY_H;                    // 2.00
const TOTAL_W = UPS_W + GAP + BAT_W;                // 1.62
// The POWER cabinet sits at the right-hand end, nearest the catalog camera, and the battery
// cabinet outboard of it. Left-hinged doors each cover the cabinet to their left, so the reverse
// order buries the module stack — the thing this asset exists to show — behind its neighbour's
// door in every open view. Same occlusion rule that placed the incomer in tablero-switchgear.
const UPS_CX =  TOTAL_W/2 - UPS_W/2;
const BAT_CX = -TOTAL_W/2 + BAT_W/2;
const FRONT_Z = DEPTH/2;
const DOOR_Y0 = PLINTH_H + 0.05, DOOR_Y1 = TOP_Y - 0.14;
const NMOD = 3, NSLOT = 5, MOD_H = 0.22;             // 5 slots, 3 populated, 2 blanked (N+1 spare)

// ---------- scene / renderer / camera (proven config from the 18-equipo library) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 5.0, AZ = 0.73, EL = 0.20, TGT_Y = 1.02;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TGT_Y + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TGT_Y, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TGT_Y, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.2;        // vertical-subject deviation — see design-spec §lighting

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.4, 5.2, 4.0); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-2.6; sun.shadow.camera.right=2.6; sun.shadow.camera.top=2.6; sun.shadow.camera.bottom=-2.6;
sun.shadow.camera.far = 16;
scene.add(sun);
const faceFill = new THREE.DirectionalLight(0xdce6f2, 0.85);    // panel-normal fill (the deviation)
faceFill.position.set(0.6, 1.3, 4.6);
scene.add(faceFill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(22,22),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1 near-binary metalness.
//   Battery jars are moulded ABS/SAN -> dielectric. Their POSTS and the interconnect straps are
//   lead/copper -> bare metal. Painting a whole battery as one material is the giveaway error.
// ============================================================================
const matPaint  = new THREE.MeshStandardMaterial({ color:0xcfd2cc, metalness:0.0, roughness:0.55 });
const matPaintD = new THREE.MeshStandardMaterial({ color:0xb9bdb8, metalness:0.0, roughness:0.58 });
const matPlinth = new THREE.MeshStandardMaterial({ color:0x3b4046, metalness:0.0, roughness:0.62 });
const matSteel  = new THREE.MeshStandardMaterial({ color:0xb6babc, metalness:0.92, roughness:0.42 });
const matCopper = new THREE.MeshStandardMaterial({ color:0xf0a67a, metalness:1.0,  roughness:0.34 });
const matPlastic= new THREE.MeshStandardMaterial({ color:0x1a1d21, metalness:0.0,  roughness:0.52 });
const matModule = new THREE.MeshStandardMaterial({ color:0x30353a, metalness:0.0,  roughness:0.58 });
const matModuleF= new THREE.MeshStandardMaterial({ color:0x596068, metalness:0.0,  roughness:0.52 });
const matBatJar = new THREE.MeshStandardMaterial({ color:0x22262b, metalness:0.0,  roughness:0.44 });
const matBatLid = new THREE.MeshStandardMaterial({ color:0x3a4046, metalness:0.0,  roughness:0.40 });
const matLead   = new THREE.MeshStandardMaterial({ color:0x9aa0a6, metalness:0.9,  roughness:0.48 });
const matLabel  = new THREE.MeshStandardMaterial({ color:0xf2f3ef, metalness:0.0,  roughness:0.70 });
const matEpo    = new THREE.MeshStandardMaterial({ color:0xb02020, metalness:0.0,  roughness:0.44 });
const matScreen = new THREE.MeshStandardMaterial({ color:0x0d1a16, metalness:0.0,  roughness:0.16,
                                                   emissive:0x0a2a22, emissiveIntensity:0.9 });
// ISA-101 §3.4 — the mimic reads neutral on mains and amber-red only on battery
const matLampOff = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4 });
const matLampRun = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0x0d3a2a, emissiveIntensity:1.0 });
const matLampAlm = new THREE.MeshStandardMaterial({ color:0x5a6878, metalness:0.0, roughness:0.4,
                                                    emissive:0xd8760f, emissiveIntensity:1.5 });

// ============================================================================
// ZONE 2 — GEOMETRY.
// ============================================================================
const root = new THREE.Group();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);
function instanced(geo, mat, xforms, parent){
  const im = new THREE.InstancedMesh(geo, mat, xforms.length);
  im.castShadow = im.receiveShadow = true;
  xforms.forEach((t,i)=>{
    _p.set(t[0], t[1], t[2]);
    _q.setFromEuler(new THREE.Euler(t[3]||0, t[4]||0, t[5]||0));
    _s.set(t[6]??1, t[7]??1, t[8]??1);
    im.setMatrixAt(i, _m.compose(_p,_q,_s));
  });
  im.instanceMatrix.needsUpdate = true;
  parent.add(im); return im;
}
function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z);
  (parent||root).add(m); return m;
}

// --- one carcass shell per cabinet (walls only, so the insides stay reachable) ---
function carcass(cx, w){
  box(w - 0.04, PLINTH_H, DEPTH - 0.04, matPlinth, cx, PLINTH_H/2, 0);
  box(w, BODY_H, 0.015, matPaintD, cx, PLINTH_H + BODY_H/2, -DEPTH/2 + 0.008);
  for(const sx of [-1, 1]) box(0.015, BODY_H, DEPTH, matPaintD, cx + sx*(w/2 - 0.008), PLINTH_H + BODY_H/2, 0);
  box(w, 0.015, DEPTH, matPaint, cx, TOP_Y - 0.008, 0);
  box(w, 0.015, DEPTH, matPaintD, cx, PLINTH_H + 0.008, 0);
  box(w, DOOR_Y0 - PLINTH_H, 0.030, matPaint, cx, (PLINTH_H + DOOR_Y0)/2, FRONT_Z - 0.015);
  box(w, TOP_Y - DOOR_Y1,    0.030, matPaint, cx, (DOOR_Y1 + TOP_Y)/2,    FRONT_Z - 0.015);
  for(const sx of [-1, 1])
    box(0.032, DOOR_Y1 - DOOR_Y0, 0.030, matPaint, cx + sx*(w/2 - 0.016), (DOOR_Y0 + DOOR_Y1)/2, FRONT_Z - 0.015);
}
carcass(UPS_CX, UPS_W);
carcass(BAT_CX, BAT_W);
// roof exhaust louvres over the UPS only — the battery cabinet has no forced-air load
{ const slats = [];
  for(let k=0;k<5;k++) slats.push([UPS_CX, TOP_Y - 0.03, -0.22 + k*0.05, 0, 0, -0.30, UPS_W - 0.16, 1, 1]);
  instanced(new THREE.BoxGeometry(1.0, 0.016, 0.030), matPaintD, slats, root);
}

// --- UPS interior: N hot-swap power modules over a static-bypass module and a control shelf ---
const upsGuts = new THREE.Group();
const RACK_X = UPS_CX, RACK_Z = -0.02;
box(UPS_W - 0.06, DOOR_Y1 - DOOR_Y0, 0.012, matPaintD, RACK_X, (DOOR_Y0 + DOOR_Y1)/2, RACK_Z - 0.20, upsGuts);
for(let k=0;k<NSLOT;k++){
  const my = DOOR_Y1 - 0.20 - k*(MOD_H + 0.02);
  // The frame is sized for NSLOT modules and populated with NMOD. The spare slot gets a blanking
  // plate — that IS what a modular UPS looks like in service, and it also stops the rack reading
  // as a half-empty cabinet with an unexplained void in the middle.
  for(const sx of [-1, 1])                                            // slot guide rails
    box(0.020, 0.012, 0.42, matSteel, RACK_X + sx*(UPS_W/2 - 0.08), my - MOD_H/2, RACK_Z, upsGuts);
  if(k >= NMOD){
    box(UPS_W - 0.14, MOD_H - 0.02, 0.012, matPaintD, RACK_X, my, RACK_Z + 0.222, upsGuts);
    box(0.08, 0.022, 0.020, matPlastic, RACK_X, my, RACK_Z + 0.234, upsGuts);
    continue;
  }
  box(UPS_W - 0.12, MOD_H, 0.44, matModule,  RACK_X, my, RACK_Z, upsGuts);
  box(UPS_W - 0.14, MOD_H - 0.03, 0.014, matModuleF, RACK_X, my, RACK_Z + 0.228, upsGuts);
  for(const sx of [-1, 1])                                            // hot-swap pull handles
    box(0.030, MOD_H - 0.09, 0.045, matPlastic, RACK_X + sx*(UPS_W/2 - 0.10), my, RACK_Z + 0.252, upsGuts);
  const vents = [];                                                   // module face vent slots
  for(let v=0;v<4;v++) vents.push([RACK_X, my + 0.055 - v*0.035, RACK_Z + 0.238, 0, 0, 0, UPS_W - 0.30, 1, 1]);
  instanced(new THREE.BoxGeometry(1.0, 0.016, 0.006), matModule, vents, upsGuts);
  box(0.10, 0.026, 0.010, matLabel, RACK_X - 0.16, my + 0.085, RACK_Z + 0.238, upsGuts);
}
// static bypass + control shelf under the module stack
box(UPS_W - 0.12, 0.20, 0.40, matModule, RACK_X, DOOR_Y0 + 0.34, RACK_Z, upsGuts);
box(UPS_W - 0.16, 0.06, 0.012, matModuleF, RACK_X, DOOR_Y0 + 0.40, RACK_Z + 0.208, upsGuts);
box(UPS_W - 0.14, 0.14, 0.30, matModule, RACK_X, DOOR_Y0 + 0.13, RACK_Z - 0.02, upsGuts);
// DC link busbars crossing INTO the battery cabinet — the reason the two cabinets stand together.
// They must run toward BAT_CX; hard-coding a side leaves them pointing at open air the moment the
// cabinet order changes, which is exactly what happened when the power cabinet moved to the end.
const linkSign = Math.sign(BAT_CX - UPS_CX);
for(const sy of [-1, 1])
  box(0.40, 0.030, 0.010, matCopper, UPS_CX + linkSign*(UPS_W/2 + 0.02),
      DOOR_Y0 + 0.62 + sy*0.06, -0.22, upsGuts);
root.add(upsGuts);

// --- battery cabinet interior: 4 shelves x 5 VRLA blocks, strap-linked, with a DC breaker ---
const batGuts = new THREE.Group();
const SHELF_Y = [DOOR_Y0 + 0.14, DOOR_Y0 + 0.46, DOOR_Y0 + 0.78, DOOR_Y0 + 1.10];
const jars = [], lids = [], posts = [], straps = [];
for(const sy of SHELF_Y){
  box(BAT_W - 0.08, 0.014, DEPTH - 0.14, matSteel, BAT_CX, sy, -0.02, batGuts);   // shelf
  for(let k=0;k<5;k++){
    const bx = BAT_CX - (BAT_W - 0.20)/2 + k*((BAT_W - 0.20)/4);
    jars.push([bx, sy + 0.007 + 0.105, -0.02]);
    lids.push([bx, sy + 0.007 + 0.212, -0.02]);
    for(const sz of [-0.055, 0.055]) posts.push([bx, sy + 0.232, -0.02 + sz]);
    if(k < 4) straps.push([bx + (BAT_W - 0.20)/8, sy + 0.238, -0.02 + (k%2 ? -0.055 : 0.055)]);
  }
}
instanced(new THREE.BoxGeometry(0.105, 0.21, 0.17), matBatJar, jars,  batGuts);
instanced(new THREE.BoxGeometry(0.108, 0.014, 0.174), matBatLid, lids, batGuts);
instanced(new THREE.CylinderGeometry(0.010, 0.010, 0.024, 8), matLead, posts, batGuts);
instanced(new THREE.BoxGeometry((BAT_W - 0.20)/4, 0.008, 0.020), matLead, straps, batGuts);
box(0.16, 0.22, 0.14, matModule, BAT_CX, DOOR_Y1 - 0.18, -0.02, batGuts);          // DC breaker
box(0.05, 0.05, 0.03, matPlastic, BAT_CX, DOOR_Y1 - 0.18, 0.06, batGuts);
root.add(batGuts);

// ---------- doors ----------
const doors = [], lamps = [];
function makeDoor(cx, w, kind){
  const REVEAL = 0.010;
  const dw = w - 0.064 - 2*REVEAL, h = DOOR_Y1 - DOOR_Y0 - 2*REVEAL;
  const cy = (DOOR_Y0 + DOOR_Y1)/2, x0 = cx - w/2 + 0.032;
  const g = new THREE.Group(); g.position.set(x0, 0, FRONT_Z + 0.006);
  const lx = REVEAL + dw/2;
  box(dw, h, 0.020, matPaint, lx, cy, 0, g);
  for(const sy of [-1, 1]) box(dw, 0.020, 0.045, matPaintD, lx, cy + sy*(h/2 - 0.010), -0.030, g);
  for(const hy of [cy - h/2 + 0.10, cy, cy + h/2 - 0.10])
    box(0.020, 0.070, 0.026, matSteel, 0.012, hy, -0.008, g);
  box(0.045, 0.120, 0.012, matPlastic, lx + dw/2 - 0.045, cy, 0.016, g);
  box(0.016, 0.075, 0.030, matPlastic, lx + dw/2 - 0.045, cy - 0.02, 0.032, g);
  box(dw*0.55 + 0.008, 0.032, 0.004, matPlastic, lx, cy - h/2 + 0.06, 0.012, g);
  box(dw*0.55, 0.020, 0.004, matLabel,           lx, cy - h/2 + 0.06, 0.015, g);

  if(kind === 'ups'){
    // colour touch display + mimic lamp row + EPO. The EPO mushroom is the single detail that says
    // "UPS" rather than "some cabinet with a screen".
    box(0.34, 0.26, 0.024, matPlastic, lx, cy + 0.52, 0.022, g);
    box(0.29, 0.185, 0.008, matScreen, lx, cy + 0.53, 0.036, g);
    for(let k=0;k<4;k++){
      const l = cyl(0.013, 0.013, 0.014, 12, matLampOff, lx - 0.105 + k*0.07, cy + 0.34, 0.022, g);
      l.rotation.x = Math.PI/2;
      l.userData.role = k===0 ? 'mains' : (k===2 ? 'battery' : 'aux');
      lamps.push(l);
    }
    cyl(0.030, 0.034, 0.020, 16, matPlastic, lx + 0.16, cy + 0.20, 0.022, g).rotation.x = Math.PI/2;
    cyl(0.026, 0.026, 0.016, 16, matEpo,     lx + 0.16, cy + 0.20, 0.036, g).rotation.x = Math.PI/2;
    // recessed intake grille over the lower half of the door
    box(dw*0.72 + 0.012, 0.42 + 0.012, 0.005, matPaintD, lx, cy - 0.22, 0.006, g);
    box(dw*0.72, 0.42, 0.004, matPlastic, lx, cy - 0.22, 0.009, g);
    const slats = [];
    for(let k=0;k<11;k++) slats.push([lx, cy - 0.22 + 0.19 - k*0.038, 0.016, -0.42, 0, 0, dw*0.72, 1, 1]);
    instanced(new THREE.BoxGeometry(1.0, 0.019, 0.012), matPaint, slats, g);
  } else {
    // battery door: no grille (a VRLA cabinet is not force-cooled), just a warning plate and vents
    box(0.20, 0.20, 0.005, matLabel, lx, cy + 0.50, 0.012, g);
    const slats = [];
    for(let k=0;k<3;k++) slats.push([lx, cy - 0.52 + k*0.040, 0.014, -0.42, 0, 0, dw*0.55, 1, 1]);
    instanced(new THREE.BoxGeometry(1.0, 0.018, 0.012), matPaintD, slats, g);
  }
  root.add(g); doors.push(g);
}
makeDoor(UPS_CX, UPS_W, 'ups');
makeDoor(BAT_CX, BAT_W, 'bat');

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ---------- render-on-demand (block56): gate render(), keep rAF + controls.update() ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

// ============================================================================
// ZONE 3 — UI. Render is GATED: every handler calls requestRender().
// ============================================================================
const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };

const OPEN_ANGLE = -2.05;
let doorTarget = 0, doorPos = 0;
const btnDoor = document.getElementById('btnDoor');
btnDoor.onclick = ()=>{ doorTarget = doorTarget ? 0 : 1;
  btnDoor.classList.toggle('on', !!doorTarget); requestRender(); };

const btnBat = document.getElementById('btnBat');
let onBattery = false;
btnBat.onclick = ()=>{
  onBattery = !onBattery; btnBat.classList.toggle('on', onBattery);
  // ISA-101 §3.4: on mains the mimic is one neutral-green "supply healthy" lamp and nothing else.
  // Running on battery is an ABNORMAL, time-limited state, so it gets the amber.
  lamps.forEach(l=>{ const r = l.userData.role;
    l.material = onBattery ? (r === 'battery' ? matLampAlm : matLampOff)
                           : (r === 'mains'   ? matLampRun : matLampOff); });
  requestRender();
};

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(doorPos - doorTarget) > 0.001){
    doorPos += (doorTarget - doorPos) * 0.10;
    if(Math.abs(doorPos - doorTarget) <= 0.001){
      doorPos = doorTarget;
      renderer.shadowMap.needsUpdate = true;   // re-bake once the swing settles, not every frame
    }
    doors.forEach((d,i)=>{ d.rotation.y = OPEN_ANGLE * doorPos * (1 - i*0.08); });
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__upsApp = { runtime:{ scene, renderer, camera, root } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
