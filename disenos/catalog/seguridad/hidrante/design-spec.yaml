# DesignSpec — dry-barrel pillar fire hydrant with traffic (breakaway) flange
# Catalog family `seguridad` (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: hidrante
family: seguridad
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # the 11 mm chain link and the 22 mm flange are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 12 -> moderate.
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    detail 3: a hydrant is recognised by its FITTINGS — pentagon operating nut, breakaway flange
    with its bolt circle, three capped outlets and their retaining chains. repetition 2 justifies
    two instanced batches (6 bolts, 45 chain links); everything else is unique.
    action_readiness 1: the caps come off and expose the outlet threads.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    painted_casting: "research/HANDBOOK.md §3.1 — a painted hydrant is DIELECTRIC, not bare metal"
    instanced_segments: "disenos/catalog/retail/carrito-compras/ (composed-matrix segment batches)"

references:
  - source: "dry-barrel pillar hydrant class (AWWA C502-style layout)"
    evidences: >
      [INFER] The standard is RECALLED, not preserved as a document in sources/ — treat every value
      as inference. The layout modelled: a barrel that breaks away at a flange just above grade
      (the shut-off valve sits below grade, so a vehicle strike does not open the main), one large
      pumper outlet plus two smaller hose outlets, caps on retaining chains, and a pentagon
      operating nut on the bonnet.
    suitability: partial

dimensions_real:
  height_above_grade_m: {value: 0.90, confidence: low}   # [INFER] to the top of the operating nut
  barrel_d_m:      {value: 0.21, confidence: low}        # [INFER] upper barrel
  flange_y_m:      {value: 0.14, confidence: low}        # [INFER] breakaway flange above grade
  flange_d_m:      {value: 0.33, confidence: low}        # [INFER]
  flange_bolts:    {value: 6,    confidence: low}        # [INFER] breakaway bolt circle
  pumper_d_m:      {value: 0.115, confidence: med}       # [INFER] large steamer/pumper outlet
  pumper_y_m:      {value: 0.56, confidence: low}        # [INFER]
  hose_d_m:        {value: 0.064, confidence: med}       # [INFER] 2 1/2 in hose outlets
  hose_y_m:        {value: 0.47, confidence: low}        # [INFER] lowest outlet, kept well clear of grade
  outlet_len_m:    {value: 0.10, confidence: low}        # [INFER] spigot projection
  pad_m:           {value: 1.05, confidence: low}        # [INFER] concrete pad
  bollard_h_m:     {value: 0.95, confidence: low}        # [INFER] protective bollards (context)

hierarchy:
  - name: root
    children:
      - name: pad             # concrete pad
        pivot: [0, 0, 0]
        animation: none
      - name: barrel          # lower barrel, flange pair + instanced bolt circle, upper barrel, rib
        pivot: [0, 0, 0]
        animation: none
      - name: bonnet          # dome, weather ring, pentagon operating nut
        pivot: [0, 0, 0]
        animation: none
      - name: outlets         # 3 spigots + exposed thread rings (revealed when the caps come off)
        pivot: [0, 0, 0]
        animation: none
      - name: caps            # 3 caps + lugs (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: chains          # InstancedMesh, 15 links per cap on a sagging path (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: bollards        # protective posts, set back (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: hydrant-red
    family: painted-metal
    color: "#b4231a"
    metalness: 0.0             # painted cast iron -> DIELECTRIC
    roughness: 0.52
    evidence: "HANDBOOK §3.1 painted/coated 0.0-0.05; raising metalness here is the classic error"
    confidence: 0.85
  - id: bonnet-yellow
    family: painted-metal
    color: "#d8b41e"
    metalness: 0.0
    roughness: 0.50
    evidence: "[INFER] bonnet/cap colour coding — coated"
    confidence: 0.75
  - id: bolt-steel
    family: bare-metal
    color: "#b9bec2"
    metalness: 0.92
    roughness: 0.36
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0 — breakaway bolts and exposed outlet threads"
    confidence: 0.8
  - id: chain-steel
    family: bare-metal
    color: "#8f959a"
    metalness: 0.90
    roughness: 0.42
    evidence: "HANDBOOK §3.1 — galvanised retaining chain, duller than the bolts"
    confidence: 0.8
  - id: concrete-pad
    family: concrete
    color: "#40454b"
    metalness: 0.0
    roughness: 0.94
    evidence: "HANDBOOK §3.1 dielectric mineral surface"
    confidence: 0.8

critical_features:
  - id: breakaway-flange
    desc: >
      A double flange with a visible bolt circle sits just above grade — the feature that makes this
      a DRY-barrel hydrant rather than a decorative post.
    threshold: 0.78
  - id: three-outlet-set
    desc: >
      One large pumper outlet and two smaller hose outlets at different heights, each with a lugged
      cap on a retaining chain, and a real thread underneath when the cap comes off.
    threshold: 0.78
  - id: operating-nut
    desc: >
      A pentagon operating nut crowns the bonnet — a hex or round nut would read as generic plumbing.
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 50
    tris: 20000
  measured:             # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 32
    tris: 8178
    geometries: 33
    root_meshes: 31

camera:
  azimuth_deg: 45
  elevation_deg: 13.7
  fov: 38
  target_y_m: 0.48
  radius_m: 2.3

lighting: house-rig + camera-side fill
  # DOCUMENTED DEVIATION: the barrel is a vertical cylinder, so only its lit half reads under the
  # house rig; a camera-side fill (0.85) with environmentIntensity 1.6 restores the casting shape.
  # Metalness/roughness untouched (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "TAPAS"      # remove the caps to expose the outlet threads (chains follow the caps)
  - "CADENAS"    # retaining chains
  - "BOLARDOS"   # protective posts

colorTarget:
  # MEASURED from the rendered barrel (headless SwiftShader capture at 1280x800): flattest patch
  # found by scan on the lit face, per-channel std ~1.6. Not a guessed value.
  srgb: [178, 1, 20]
  deltaE00Max: 8
  crop: "24x24+655+515"   # barrel lit face at 1280x800
