<!doctype html>
<!--
  CATALOG ASSET — seguridad/barandal · industrial guardrail run with toe board and a safety gate.
  Built from disenos/catalog/shell-template.html. Contract: __barandalApp.runtime + __qaRenderInfo +
  data-app-ready, render-on-demand, shadows frozen (autoUpdate=false, 1024), DPR<=2.
  Instancing (block54 §2.3): the grating bearing bars (~78) and the baseplate anchor bolts repeat
  for real. The posts, rails, toe board and gate are unique meshes.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barandal industrial — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">BARANDAL INDUSTRIAL — tubo galvanizado + rodapié</div>
  <div><span class="dim">6.00 m · pasamanos 1.10 m · larguero 0.55 m · rodapié 0.10 m · postes cada 1.50 m</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnGate">PUERTA DE SEGURIDAD</button>
  <button id="btnToe" class="on">RODAPIÉ</button>
  <button id="btnGrid" class="on">REJILLA</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
const RUN = 6.00, BAY = 1.50;              // 4 bays at 1.50 m post pitch
const TOP_Y = 1.10;                        // handrail height
const KNEE_Y = 0.55;                       // knee rail — the gap rule, not decoration
const TOE_H = 0.10, TOE_GAP = 0.010;       // toe board and its drainage gap
const POST = 0.048;                        // 48 mm post tube
const RAIL_R = 0.021;                      // 42 mm rail tube
const DECK_D = 1.30, DECK_T = 0.05;        // platform stub the railing stands on
const GATE_W = 0.90;                       // self-closing safety gate over the ladder opening
const BAR_PITCH = 0.033;                   // grating bearing-bar pitch

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 10, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 6.4, AZ = 1.05, EL = 0.26;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 0.85 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, 0.72, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.72, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.0;   // bare galvanised tube: almost pure silhouette, the IBL shapes it

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 6, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-4; sun.shadow.camera.right=4; sun.shadow.camera.top=3; sun.shadow.camera.bottom=-3;
scene.add(sun);
// VERTICAL-SUBJECT FILL: tube railing has no flat face to catch the upper IBL.
const fill = new THREE.DirectionalLight(0xf2f6ff, 1.1);
fill.position.set(-4.5, 2.6, 5.5);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(24,24),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1: hot-dip galvanised steel is BARE metal; the gate is painted
// safety yellow (dielectric) so it reads as the opening.
// ============================================================================
const matTube = new THREE.MeshStandardMaterial({ color:0xc4c8cb, metalness:0.93, roughness:0.33 });
const matPost = new THREE.MeshStandardMaterial({ color:0xbabfc3, metalness:0.93, roughness:0.38 });
const matToe  = new THREE.MeshStandardMaterial({ color:0x9ea3a8, metalness:0.92, roughness:0.46 });   // darker
  // than the rails on purpose: at rail tone the 100 mm plate vanished into the deck in the QA capture
const matGrid = new THREE.MeshStandardMaterial({ color:0xa9aeb2, metalness:0.90, roughness:0.46 });
const matBolt = new THREE.MeshStandardMaterial({ color:0x9aa0a5, metalness:0.92, roughness:0.40 });
const matGate = new THREE.MeshStandardMaterial({ color:0xd8b41e, metalness:0.0,  roughness:0.50 });
const matDeck = new THREE.MeshStandardMaterial({ color:0x4a5057, metalness:0.0,  roughness:0.85 });

// ============================================================================
// ZONE 2 — GEOMETRY
// ============================================================================
const root = new THREE.Group();
const dummy = new THREE.Object3D();
const box = (parent,w,h,d,mat,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); parent.add(m); return m; };
const tube = (parent, len, r, mat, x,y,z, rx=0, rz=0)=>{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); m.rotation.set(rx,0,rz);
  parent.add(m); return m;
};

// --- platform stub + edge channel (the railing has to stand on something to read as edge protection)
box(root, RUN + 0.20, DECK_T, DECK_D, matDeck, 0, -DECK_T/2, -DECK_D/2 + 0.06);
box(root, RUN + 0.20, 0.11, 0.05, matGrid, 0, -0.055, 0.055);

// --- grating deck: bearing bars along Z at a 33 mm pitch -> REAL repetition, one instanced batch
const grid = new THREE.Group();
{
  const n = Math.floor((RUN - 0.10) / BAR_PITCH);
  const barGeo = new THREE.BoxGeometry(0.005, 0.030, DECK_D - 0.12);
  const bars = new THREE.InstancedMesh(barGeo, matGrid, n);
  bars.castShadow = bars.receiveShadow = true;
  for(let i=0;i<n;i++){
    dummy.position.set(-RUN/2 + 0.05 + BAR_PITCH*(i + 0.5), -0.014, -DECK_D/2 + 0.06);
    dummy.rotation.set(0,0,0); dummy.updateMatrix();
    bars.setMatrixAt(i, dummy.matrix);
  }
  bars.instanceMatrix.needsUpdate = true;
  grid.add(bars);
  // cross rods every 100 mm, the other half of a grating panel
  const rodGeo = new THREE.BoxGeometry(RUN - 0.10, 0.006, 0.006);
  const m = Math.floor((DECK_D - 0.12) / 0.10);
  const rods = new THREE.InstancedMesh(rodGeo, matGrid, m);
  rods.castShadow = rods.receiveShadow = true;
  for(let i=0;i<m;i++){
    dummy.position.set(0, -0.004, -DECK_D + 0.12 + 0.10*(i + 0.5));
    dummy.updateMatrix(); rods.setMatrixAt(i, dummy.matrix);
  }
  rods.instanceMatrix.needsUpdate = true;
  grid.add(rods);
}
root.add(grid);

// --- posts on baseplates, with instanced anchor bolts ---
const postX = [];
for(let i=0;i*BAY <= RUN + 1e-6;i++) postX.push(-RUN/2 + i*BAY);
for(const x of postX){
  box(root, POST, TOP_Y, POST, matPost, x, TOP_Y/2, 0);
  box(root, 0.14, 0.012, 0.14, matPost, x, 0.006, 0);          // baseplate
}
{
  const boltGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.030, 8);
  const bolts = new THREE.InstancedMesh(boltGeo, matBolt, postX.length*2);
  bolts.castShadow = bolts.receiveShadow = true;
  let bi = 0;
  for(const x of postX) for(const sz of [-1,1]){
    dummy.position.set(x, 0.020, sz*0.048); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    bolts.setMatrixAt(bi++, dummy.matrix);
  }
  bolts.instanceMatrix.needsUpdate = true;
  root.add(bolts);
}

// --- rails: handrail at 1.10 m and knee rail at 0.55 m, both continuous across the run ---
// The GATE bay is left open in both rails; the gate itself carries its own pair.
const GATE_X0 = 0.0, GATE_X1 = GATE_W;
const railSpans = [[-RUN/2, GATE_X0], [GATE_X1, RUN/2]];
for(const y of [TOP_Y, KNEE_Y]){
  for(const [a,b] of railSpans){
    tube(root, b - a, RAIL_R, matTube, (a + b)/2, y, 0, 0, Math.PI/2);
  }
}
// end returns: a handrail that stops in mid-air is a snag hazard, so both ends turn down to the post
for(const sx of [-1,1]){
  tube(root, TOP_Y - KNEE_Y, RAIL_R, matTube, sx*RUN/2, (TOP_Y + KNEE_Y)/2, 0);
}

// --- toe board: 100 mm plate held clear of the deck for drainage ---
const toe = new THREE.Group();
for(const [a,b] of railSpans){
  box(toe, b - a, TOE_H, 0.006, matToe, (a + b)/2, TOE_GAP + TOE_H/2, 0.026);
}
root.add(toe);

// --- self-closing safety gate over the ladder opening ---
const gatePivot = new THREE.Group();
gatePivot.position.set(GATE_X1, 0, 0);
const gate = new THREE.Group();
gate.position.set(-GATE_W/2, 0, 0);
for(const y of [TOP_Y, KNEE_Y]) tube(gate, GATE_W - 0.03, RAIL_R*0.9, matGate, 0, y, 0, 0, Math.PI/2);
for(const sx of [-1,1]) tube(gate, TOP_Y - KNEE_Y + 0.06, RAIL_R*0.9, matGate, sx*(GATE_W/2 - 0.02), (TOP_Y + KNEE_Y)/2 + 0.02, 0);
box(gate, GATE_W - 0.03, TOE_H, 0.006, matGate, 0, TOE_GAP + TOE_H/2, 0.026);
// spring hinge barrel on the closing post
tube(gate, 0.10, 0.018, matGate, GATE_W/2 - 0.02, TOP_Y - 0.08, 0);
gatePivot.add(gate);
root.add(gatePivot);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. render is GATED: every handler and the swing call requestRender().
// ============================================================================
const btnRot  = document.getElementById('btnRot');
const btnGate = document.getElementById('btnGate');
const btnToe  = document.getElementById('btnToe');
const btnGrid = document.getElementById('btnGrid');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
let gateTarget = 0, gateAngle = 0;
// A safety gate opens INWARD (away from the drop): outward it would swing over the edge it protects.
btnGate.onclick = ()=>{ gateTarget = gateTarget ? 0 : 1; btnGate.classList.toggle('on', !!gateTarget); requestRender(); };
const toggle = (btn, obj)=>{ btn.onclick = ()=>{ obj.visible = !obj.visible; btn.classList.toggle('on', obj.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); }; };
toggle(btnToe, toe);
toggle(btnGrid, grid);

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(gateAngle - gateTarget) > 0.001){                 // per-frame branch -> keep rendering
    gateAngle += (gateTarget - gateAngle) * 0.13;
    // The leaf hangs at local -X, so +Y swings it toward +Z — over the DROP the gate is protecting.
    // Negative swings it back over the deck, which is the only safe direction.
    gatePivot.rotation.y = -1.4 * gateAngle;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__barandalApp = { runtime:{ scene, renderer, camera, root } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
