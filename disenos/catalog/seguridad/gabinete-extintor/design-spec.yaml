# DesignSpec — wall fire-extinguisher cabinet with a 9 kg ABC portable unit
# Catalog family `seguridad` (worktree catalog-retail-lab).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: gabinete-extintor
family: seguridad
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # the 12 mm carcase sheet and the 6 mm pane are material, not voxels

complexity:
  # Pre-spec 8-axis assessment (0-3 each). Sum 13 -> moderate.
  scores: {silhouette: 1, components: 3, hierarchy: 2, repetition: 0,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    repetition 0 — nothing on this asset repeats, so it uses NO instancing (block54 §2.3 is a
    licence, not an obligation). detail 3: the read depends on the extinguisher hardware being
    right — valve, squeeze lever, gauge, pull pin, hose and horn. action_readiness 1: the door
    swings on a real hinge edge.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    lit_glazing: "disenos/catalog/retail/refrigerador-vertical/ (a glazed door needs a real lamp behind it)"
    hinge_sign: >
      disenos/catalog/retail/refrigerador-vertical/ — a +Y rotation carries a leaf at local -sign*w/2
      INTO the wall. Both assets shipped that bug first; only a door-open capture shows it.

references:
  - source: "portable fire extinguisher mounting practice (NFPA 10 class rules)"
    evidences: >
      [INFER] The standard is RECALLED, not preserved as a document in sources/ — treat every value
      below as inference, not as a citation. The rule modelled: the controlling dimension is the
      extinguisher CARRYING HANDLE height, not the cabinet; units up to ~18 kg are mounted with the
      handle no higher than ~1.5 m, heavier units lower, and the base kept clear of the floor. The
      cabinet here places the handle at 1.20 m and its own top at 1.50 m.
    suitability: partial
  - source: "9 kg ABC dry-powder extinguisher body class"
    evidences: >
      [INFER] Body ~160 mm diameter, ~500 mm cylinder plus domed ends, valve/handle assembly above
      the neck, hose and horn clipped along the body, wrapping rating label.
    suitability: partial

dimensions_real:
  cab_w_m:      {value: 0.32, confidence: low}    # [INFER] sized to clear the cylinder + hose
  cab_d_m:      {value: 0.24, confidence: low}    # [INFER]
  cab_h_m:      {value: 0.78, confidence: low}    # [INFER]
  cab_base_y_m: {value: 0.72, confidence: med}    # [INFER] derived from the handle-height rule
  cab_top_y_m:  {value: 1.50, confidence: med}    # derived: base + height
  handle_y_m:   {value: 1.20, confidence: med}    # [INFER] the controlling dimension
  sheet_t_m:    {value: 0.012, confidence: low}   # [INFER] folded sheet carcase
  door_t_m:     {value: 0.028, confidence: low}   # [INFER] framed glazed leaf
  ext_body_d_m: {value: 0.16, confidence: med}    # [INFER] 9 kg ABC body diameter
  ext_body_h_m: {value: 0.50, confidence: med}    # [INFER] cylinder length without domes
  sign_side_m:  {value: 0.22, confidence: low}    # [INFER] photoluminescent location sign
  floor_mark_m: {value: [0.90, 0.70], confidence: low}   # [INFER] keep-clear floor marking

hierarchy:
  - name: root
    children:
      - name: wall            # context stub the cabinet is fixed to (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: cab             # folded carcase: back, sides, top, bottom + white liner
        pivot: [0, 0, 0]
        animation: none
      - name: ext             # cylinder, domes, label band, valve, lever, gauge, pin, hose, horn, bracket
        pivot: [0, 0, 0]
        animation: none
      - name: lamp            # interior point lamp — without it the glazed door reads black
        pivot: [0, 0, 0]
        animation: none
      - name: doorPivot       # hinge ON the left edge of the opening
        pivot: [-0.16, 1.11, 0.12]
        animation: swing
        attachment:
          parent_socket: cabinet_face
          contact_type: hinge
          gap_tolerance: 0.002
      - name: signs           # photoluminescent sign above + floor keep-clear marking (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: cabinet-red
    family: painted-metal
    color: "#b02a1e"
    metalness: 0.0             # powder-coated sheet -> dielectric
    roughness: 0.42
    evidence: "HANDBOOK §3.1 painted/coated panel 0.0-0.05"
    confidence: 0.85
  - id: extinguisher-red
    family: painted-metal
    color: "#c0281b"
    metalness: 0.0             # the cylinder is PAINTED steel, not bare metal
    roughness: 0.36
    evidence: "HANDBOOK §3.1 — coated pressure vessel; a metalness bump here would be the classic error"
    confidence: 0.85
  - id: valve-brass
    family: bare-metal
    color: "#b08b3e"
    metalness: 0.90
    roughness: 0.34
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0"
    confidence: 0.8
  - id: hardware-steel
    family: bare-metal
    color: "#c0c4c7"
    metalness: 0.92
    roughness: 0.32
    evidence: "HANDBOOK §3.1 — lever, pin, gauge ring, bracket"
    confidence: 0.8
  - id: hose-rubber
    family: rubber
    color: "#1c1f23"
    metalness: 0.0
    roughness: 0.78
    evidence: "HANDBOOK §3.1 dielectric rubber"
    confidence: 0.8
  - id: pane
    family: glass
    color: "#dfeef4"
    metalness: 0.0
    roughness: 0.03
    transmission: 0.75
    evidence: "[CERT] same tuning as retail/vitrina: 0.72-0.75 keeps the pane visible AND see-through"
    confidence: 0.8
  - id: sign-photoluminescent
    family: plastic
    color: "#d8e86a"
    metalness: 0.0
    roughness: 0.55
    evidence: "[INFER] photoluminescent backing, modelled with a low emissive so it reads in the dark rig"
    confidence: 0.7

critical_features:
  - id: handle-height-rule
    desc: >
      The cabinet is positioned by the extinguisher HANDLE (1.20 m), not by its own centre. A viewer
      who knows the rule should read the mounting as correct rather than arbitrary.
    threshold: 0.75
  - id: extinguisher-hardware
    desc: >
      Valve body, carry handle, squeeze lever, pressure gauge, pull pin, hose and horn are all
      present and in the right relation — the detail set that makes it an extinguisher and not a
      red cylinder.
    threshold: 0.78
  - id: door-opens-outward
    desc: >
      The glazed leaf swings OUT into the room on its hinge edge, clearing the opening. Certified by
      review-abierto.png, not by the draw-call counts.
    threshold: 0.78

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80          # transmission adds a second scene pass
    tris: 20000
  measured:            # SwiftShader headless capture, 1280x800 — COUNTS are valid, frame time is NOT
    draws: 63
    tris: 3240
    geometries: 33
    root_meshes: 31

camera:
  azimuth_deg: 49
  elevation_deg: 8.6
  fov: 38
  target_y_m: 1.02
  radius_m: 2.75

lighting: house-rig + vertical-subject fill + interior lamp
  # DOCUMENTED DEVIATION: cabinet, wall and door are all vertical planes, so the rig gets a
  # camera-side fill (0.9) and environmentIntensity 1.45. The wall is a small STUB, not a room: at
  # 1.9 x 2.6 m it filled the whole frame and blew out the exposure in the first capture.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR PUERTA"   # damped swing on the hinge edge
  - "MURO"           # context wall stub
  - "SEÑALIZACIÓN"   # location sign + floor keep-clear marking

colorTarget:
  # MEASURED from the rendered cabinet side panel (headless SwiftShader capture at 1280x800):
  # flattest patch found by scan, per-channel std 0.0. Not a guessed value.
  srgb: [164, 5, 18]
  deltaE00Max: 8
  crop: "20x30+660+196"   # cabinet right side panel at 1280x800
