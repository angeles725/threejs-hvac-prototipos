<!doctype html>
<!--
  CATALOG ASSET — seguridad/gabinete-extintor · wall fire-extinguisher cabinet with a 9 kg ABC unit.
  Built from disenos/catalog/shell-template.html. Contract: __gabineteExtintorApp.runtime +
  __qaRenderInfo + data-app-ready, render-on-demand, shadows frozen (autoUpdate=false, 1024), DPR<=2.
  No instancing: nothing on this asset repeats (block54 §2.3 — instance only real repetition).
  Lesson carried from retail/refrigerador-vertical: the glazed door needs something LIT behind it,
  so the cabinet interior gets its own lamp instead of a bare emissive panel.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabinete de extintor — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">GABINETE DE EXTINTOR — lámina pintada + extintor ABC 9 kg</div>
  <div><span class="dim">0.32 × 0.24 × 0.78 m · manija del extintor a 1.20 m · tope superior 1.50 m</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnDoor">ABRIR PUERTA</button>
  <button id="btnWall" class="on">MURO</button>
  <button id="btnSign" class="on">SEÑALIZACIÓN</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensions (design-spec.yaml) ----------
// The controlling height is the extinguisher HANDLE, not the cabinet: a portable unit over 18 kg
// must have its handle no higher than ~1.07 m, and lighter units no higher than ~1.53 m, with a
// clearance above the floor. The cabinet is positioned so the handle lands at 1.20 m.
const CAB_W = 0.32, CAB_D = 0.24, CAB_H = 0.78;
const CAB_Y0 = 0.72;                       // cabinet floor height -> top at 1.50 m
const SHEET = 0.012;                       // folded sheet-steel carcase
const DOOR_T = 0.028;
const EXT_R = 0.080, EXT_H = 0.50;         // 9 kg ABC body
const WALL_T = 0.12, WALL_W = 1.15, WALL_H = 2.15;   // a context stub, not a room: a large bright
                                                     // wall filled the whole frame in the first capture

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 16);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: DPR cap
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: frozen static-rig shadow
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 2.75, AZ = 0.86, EL = 0.15;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), 1.05 + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, 1.02, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.02, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.45;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.5, 4, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;   // block54 §5-d: key light ≤1024
sun.shadow.camera.left=-1.6; sun.shadow.camera.right=1.6; sun.shadow.camera.top=2; sun.shadow.camera.bottom=-2;
scene.add(sun);
// VERTICAL-SUBJECT FILL: cabinet, wall and door are all vertical planes facing a dark horizon.
const fill = new THREE.DirectionalLight(0xf2f6ff, 0.9);
fill.position.set(-2.2, 1.8, 3.4);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS. HANDBOOK §3.1: the cabinet, the wall and the cylinder are all PAINTED
// (dielectric); only the valve body and the pin are bare metal.
// ============================================================================
const matCabinet = new THREE.MeshStandardMaterial({ color:0xb02a1e, metalness:0.0, roughness:0.42 });
const matInner   = new THREE.MeshStandardMaterial({ color:0xe4e6e8, metalness:0.0, roughness:0.62 });
const matBody    = new THREE.MeshStandardMaterial({ color:0xc0281b, metalness:0.0, roughness:0.36 });
const matBrass   = new THREE.MeshStandardMaterial({ color:0xb08b3e, metalness:0.90, roughness:0.34 });
const matSteel   = new THREE.MeshStandardMaterial({ color:0xc0c4c7, metalness:0.92, roughness:0.32 });
const matHose    = new THREE.MeshStandardMaterial({ color:0x1c1f23, metalness:0.0, roughness:0.78 });
const matLabel   = new THREE.MeshStandardMaterial({ color:0xf2f0e8, metalness:0.0, roughness:0.55 });
const matWall    = new THREE.MeshStandardMaterial({ color:0x6e747a, metalness:0.0, roughness:0.85 });
const matSign    = new THREE.MeshStandardMaterial({ color:0xc0281b, metalness:0.0, roughness:0.45 });
const matSignG   = new THREE.MeshStandardMaterial({ color:0xd8e86a, metalness:0.0, roughness:0.55,
                                                    emissive:0x5a6b12, emissiveIntensity:0.6 });
const matGlass   = new THREE.MeshPhysicalMaterial({ color:0xdfeef4, metalness:0.0, roughness:0.03,
                                                    transmission:0.75, thickness:0.006, ior:1.5,
                                                    transparent:true, opacity:0.42 });

// ============================================================================
// ZONE 2 — GEOMETRY
// ============================================================================
const root = new THREE.Group();
const box = (w,h,d,mat)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; return m; };
const put = (parent,w,h,d,mat,x,y,z)=>{ const m = box(w,h,d,mat); m.position.set(x,y,z); parent.add(m); return m; };

// --- context wall the cabinet is fixed to ---
const wall = new THREE.Group();
put(wall, WALL_W, WALL_H, WALL_T, matWall, 0, WALL_H/2, -(CAB_D/2 + WALL_T/2));
root.add(wall);

// --- cabinet carcase: back, sides, top, bottom (an open box facing the room) ---
const cab = new THREE.Group();
const cy = CAB_Y0 + CAB_H/2;
put(cab, CAB_W, CAB_H, SHEET, matCabinet, 0, cy, -(CAB_D/2 - SHEET/2));
put(cab, CAB_W - 2*SHEET, CAB_H - 2*SHEET, SHEET*0.5, matInner, 0, cy, -(CAB_D/2 - SHEET*1.3));
for(const sx of [-1,1]) put(cab, SHEET, CAB_H, CAB_D, matCabinet, sx*(CAB_W/2 - SHEET/2), cy, 0);
put(cab, CAB_W, SHEET, CAB_D, matCabinet, 0, CAB_Y0 + CAB_H - SHEET/2, 0);
put(cab, CAB_W, SHEET, CAB_D, matCabinet, 0, CAB_Y0 + SHEET/2, 0);
root.add(cab);

// --- extinguisher: 9 kg ABC cylinder, valve, gauge, hose and the sticker band ---
const ext = new THREE.Group();
const bodyY = CAB_Y0 + SHEET + EXT_H/2 + 0.02;
const body = new THREE.Mesh(new THREE.CylinderGeometry(EXT_R, EXT_R, EXT_H, 22), matBody);
body.castShadow = body.receiveShadow = true; body.position.set(0, bodyY, 0);
ext.add(body);
for(const sy of [-1,1]){                                   // domed ends
  const cap = new THREE.Mesh(new THREE.SphereGeometry(EXT_R, 20, 10, 0, Math.PI*2, 0, Math.PI/2), matBody);
  cap.castShadow = true; cap.position.set(0, bodyY + sy*EXT_H/2, 0);
  cap.rotation.x = sy > 0 ? 0 : Math.PI;
  ext.add(cap);
}
// label band — the ABC rating sticker wrapping the cylinder
const band = new THREE.Mesh(new THREE.CylinderGeometry(EXT_R + 0.002, EXT_R + 0.002, 0.17, 22, 1, true), matLabel);
band.position.set(0, bodyY + 0.02, 0); ext.add(band);
// neck + valve + carry handle + squeeze lever + gauge
const neckY = bodyY + EXT_H/2 + EXT_R;
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.030, 0.05, 14), matBrass);
neck.castShadow = true; neck.position.set(0, neckY + 0.02, 0); ext.add(neck);
put(ext, 0.055, 0.055, 0.075, matBrass, 0, neckY + 0.065, 0);          // valve body
put(ext, 0.022, 0.016, 0.10, matSteel, 0, neckY + 0.10, -0.035);       // carry handle
put(ext, 0.020, 0.014, 0.085, matSteel, 0, neckY + 0.078, -0.028);     // squeeze lever
const gauge = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.012, 14), matSteel);
gauge.rotation.x = Math.PI/2; gauge.position.set(0.03, neckY + 0.062, 0.036); ext.add(gauge);
const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.06, 8), matSteel);
pin.rotation.z = Math.PI/2; pin.position.set(0, neckY + 0.095, -0.005); ext.add(pin);
// hose + horn, clipped along the cylinder
const hose = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.010, 8, 20, Math.PI*1.25), matHose);
hose.castShadow = true; hose.position.set(0.02, bodyY + 0.10, 0.02); hose.rotation.y = 0.6; ext.add(hose);
const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.016, 0.075, 12, 1, true), matHose);
horn.castShadow = true; horn.position.set(0.075, bodyY - 0.06, 0.055); horn.rotation.set(0.25, 0, 0.35);
ext.add(horn);
// wall bracket holding the cylinder
put(ext, 0.10, 0.03, 0.05, matSteel, 0, bodyY + 0.06, -(EXT_R + 0.012));
root.add(ext);

// --- interior lamp: the glazed door needs something lit behind it or the cabinet reads black ---
const lamp = new THREE.PointLight(0xfff2e2, 0.9, 0.9, 2);
lamp.position.set(0, CAB_Y0 + CAB_H - 0.14, 0.09);
root.add(lamp);

// --- door: framed glazing on a real hinge edge, with a lever latch ---
const doorPivot = new THREE.Group();
doorPivot.position.set(-CAB_W/2, cy, CAB_D/2);
const door = new THREE.Group();
const dw = CAB_W, dh = CAB_H, rail = 0.045;
door.position.set(dw/2, 0, 0);
put(door, dw, rail, DOOR_T, matCabinet, 0, -(dh/2 - rail/2), 0);
put(door, dw, rail, DOOR_T, matCabinet, 0,  (dh/2 - rail/2), 0);
put(door, rail, dh - 2*rail, DOOR_T, matCabinet, -(dw/2 - rail/2), 0, 0);
put(door, rail, dh - 2*rail, DOOR_T, matCabinet,  (dw/2 - rail/2), 0, 0);
const pane = new THREE.Mesh(new THREE.BoxGeometry(dw - 2*rail, dh - 2*rail, 0.006), matGlass);
pane.position.set(0,0,0); door.add(pane);
put(door, 0.020, 0.075, 0.022, matSteel, dw/2 - 0.035, -0.03, DOOR_T/2 + 0.010);   // lever latch
// the pictogram on the glass — a fire-extinguisher sign, red field
put(door, 0.11, 0.11, 0.004, matSign, 0, dh/2 - 0.16, DOOR_T/2 + 0.004);
doorPivot.add(door);
root.add(doorPivot);

// --- signage: photoluminescent location sign above, floor keep-clear marking below ---
const signs = new THREE.Group();
put(signs, 0.22, 0.22, 0.006, matSignG, 0, CAB_Y0 + CAB_H + 0.20, -(CAB_D/2 - 0.004));
put(signs, 0.15, 0.15, 0.004, matSign, 0, CAB_Y0 + CAB_H + 0.20, -(CAB_D/2 - 0.010));
const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.90, 0.70),
  new THREE.MeshStandardMaterial({ color:0xc0281b, metalness:0.0, roughness:0.85 }));
mark.rotation.x = -Math.PI/2; mark.position.set(0, 0.004, 0.20); mark.receiveShadow = true;
signs.add(mark);
const markIn = new THREE.Mesh(new THREE.PlaneGeometry(0.76, 0.56),
  new THREE.MeshStandardMaterial({ color:0x11151b, metalness:0.0, roughness:0.9 }));
markIn.rotation.x = -Math.PI/2; markIn.position.set(0, 0.006, 0.20);
signs.add(markIn);
root.add(signs);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // bake the frozen shadow once

// ============================================================================
// ZONE 3 — UI. render is GATED: every handler and the swing call requestRender().
// ============================================================================
const btnRot  = document.getElementById('btnRot');
const btnDoor = document.getElementById('btnDoor');
const btnWall = document.getElementById('btnWall');
const btnSign = document.getElementById('btnSign');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
let doorTarget = 0, doorAngle = 0;
btnDoor.onclick = ()=>{ doorTarget = doorTarget ? 0 : 1; btnDoor.classList.toggle('on', !!doorTarget); requestRender(); };
const toggle = (btn, obj)=>{ btn.onclick = ()=>{ obj.visible = !obj.visible; btn.classList.toggle('on', obj.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); }; };
toggle(btnWall, wall);
toggle(btnSign, signs);

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  if(Math.abs(doorAngle - doorTarget) > 0.001){                 // per-frame branch -> keep rendering
    doorAngle += (doorTarget - doorAngle) * 0.13;
    // NEGATIVE: a +Y rotation takes the leaf's local +X toward -Z, i.e. straight into the wall.
    // The counts pass either way — only the door-open capture shows it.
    doorPivot.rotation.y = -1.9 * doorAngle;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract (do not remove) ----------
globalThis.__gabineteExtintorApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__gabinete-extintorApp'] = globalThis.__gabineteExtintorApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
