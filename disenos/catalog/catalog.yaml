      - { slug: skid-hidroneumatico,     status: done   , notes: "pressure-boosting hydropneumatic skid: 2 bombas EN 733 65/160 duty/standby LADO A LADO (succión axial: en línea la boca de una entra en el motor de la otra) + tanque a membrana 500 L cuya envolvente Ø0.60 x 2.185 m se hereda de una ficha y se VERIFICA aritméticamente contra los 500 L. DOS envolventes concéntricas: cortar solo el casco enseña el exterior de la vejiga y el tanque se lee macizo, así que el par entero/mitad se aplica a las dos (medido: 4 huecos = 0.00000 m en ambos estados, 12 uuid disjuntos)" }
