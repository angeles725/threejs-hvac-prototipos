# ============================================================================
# CATALOG MANIFEST — coordination source of truth for the parallel 3D asset build.
# One row per target asset. Parallel sessions read this to claim work and avoid duplication.
#
# CONTRACT (every asset must satisfy, or it is NOT integrable):
#   · lives at            disenos/catalog/<family>/<slug>/<slug>.html  (+ design-spec.yaml)
#   · starts from         disenos/catalog/shell-template.html          (render-on-demand baked in)
#   · exposes             globalThis.__<slug>App.runtime + __qaRenderInfo + data-app-ready
#                          (hyphenated slug → camelCase global, e.g. mi-asset → __miAssetApp, since
#                           __mi-assetApp is not a valid identifier; the QA probe finds any /^__.*App$/
#                           with .runtime.renderer. Optional exact-slug alias: globalThis['__mi-assetApp'])
#   · follows             HANDBOOK.md §3 (materials) · DESIGNSPEC.md · EQUIPOS-PENDIENTES.md house rules
#   · declares            a colorTarget in its design-spec.yaml so the ΔE00 gate can score it
#
# track:   procedural-direct  → build now with the shell (static/simple geometry)
#          needs-research     → run /research-sdd FIRST (kinematics/animation/physics), THEN /design3d
# status:  pending | claimed | building | gated | done
# owner:   session tag that claimed it (edit when you start; keep it truthful)
# ISOLATION: each owner works in its OWN git worktree + its OWN family folder. Never edit another
#            owner's files. Commit per asset; merge to master with review (do not push over a peer).
# ============================================================================

meta:
  scale: "1 unit = 1 m"
  shell: disenos/catalog/shell-template.html
