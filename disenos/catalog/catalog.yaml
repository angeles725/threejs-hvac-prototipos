  transporte:
    track: needs-research   # per-frame motion → /research-sdd first (animated belt/texture scroll)
    owner: session-A (main, esta)
    assets:
      - { slug: banda-rodillos,          status: pending, notes: "roller conveyor section, powered rollers" }
      - { slug: banda-cinta,             status: pending, notes: "belt conveyor, scrolling belt surface animation" }
      - { slug: transportador-cadena,    status: pending, notes: "chain/slat conveyor" }
