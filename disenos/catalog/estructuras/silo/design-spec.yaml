# DesignSpec — cone-bottom material silo on braced legs
# Fourth asset of my run in the catalog `estructuras` family.
# EVIDENCE: no silo standard is preserved; dimensions are [INFER]. The 60 deg hopper angle is the
# one number with a functional reason (mass-flow discharge for a free-flowing solid), not taste.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: silo
family: estructuras
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 0, action_readiness: 1}
  tier: moderate
  notes: >
    silhouette 3: barrel + hopper + legs is the most recognisable outline in the family, and it
    is also the one that breaks most obviously if the hopper is built the wrong way up.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    lighting: "disenos/catalog/estructuras/tanque-almacenamiento (same curved bare-metal studio rig)"
    cage_ladder: "disenos/catalog/estructuras/tanque-almacenamiento (same hoop composition)"

references:
  - source: "research/HANDBOOK.md §3.3"
    evidences: "[CERT] Studio variant for binary metal: large soft sources reveal curvature. Reused from the tank."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1"
    evidences: "[CERT] Bare metal 0.9-1.0; concrete footings and the painted gate are dielectrics."
    suitability: pass
  - source: "NEGATIVE — no silo source"
    evidences: "No silo/hopper standard or datasheet is preserved. The 60 deg hopper is a functional choice, not a citation."
    suitability: fail

dimensions_real:
  diameter_m:       {value: 2.20, confidence: low}
  barrel_height_m:  {value: 2.80, confidence: low}
  hopper_angle_deg: {value: 60,   confidence: low}   # [INFER] mass-flow angle for free-flowing solids
  hopper_height_m:  {value: 1.90, confidence: low}   # derived: RAD * tan(60)
  leg_height_m:     {value: 1.50, confidence: low}   # outlet flange clearance for a truck/screw
  outlet_d_m:       {value: 0.30, confidence: low}
  overall_height_m: {value: 6.55, confidence: low}
  leg_count:        {value: 4,    confidence: low}

hierarchy:
  - name: root
    children:
      - name: legs      # 4 legs on pad footings + base plates + support ring under the hopper
      - name: brace     # cross bracing + horizontal ties between adjacent legs (togglable)
      - name: body      # hopper FRUSTUM + outlet spout + flange
      - name: gate      # slide-gate frame, plate, stem and handwheel
        animation: slide      # the plate TRANSLATES; a guillotine gate that swung would be the wrong machine
      - name: barrel    # cylindrical barrel, weld seams, cone joint, inspection hatch, level indicator
      - name: roof      # roof cone, venting filter, fill pipe + elbow, instanced handrail
      - name: ladder    # caged access ladder to the roof rail

materials:
  - id: stainless-shell
    family: bare-metal
    color: "#c4cacd"
    metalness: 0.95
    roughness: 0.34
    evidence: "HANDBOOK §3.1 bare metal"
    confidence: 0.9
  - id: galvanised-frame
    family: bare-metal
    color: "#b7bec2"
    metalness: 0.95
    roughness: 0.46
    evidence: "HANDBOOK §3.1 `skid` -> 0.9-1.0"
    confidence: 0.85
  - id: gate-paint
    family: painted-metal
    color: "#8f3b2a"
    metalness: 0.0
    roughness: 0.50
    evidence: "HANDBOOK §3.4 — the gate is the operable item on this asset"
    confidence: 0.8
  - id: concrete-footing
    family: concrete
    color: "#8e8d88"
    metalness: 0.0
    roughness: 0.95
    evidence: "HANDBOOK §3.1 dielectric"
    confidence: 0.85

critical_features:
  - id: hopper-narrows-downward
    desc: >
      The hopper is a FRUSTUM narrowing to the outlet, built as such. Two failures were caught by
      captures here: ConeGeometry's apex is at +Y so the first build funnelled upward, and
      flipping it with rotation.x = PI also flipped the NORMALS, which made the hopper render
      charcoal beside a bright barrel. Neither was visible to the counts.
    threshold: 0.85
  - id: hopper-reads-as-metal
    desc: >
      A 60 deg hopper is a downward-tilted mirror, so it reflects the ground and goes dark even
      with correct normals. A low bounce card is part of the rig for this reason. The hopper is
      legitimately darker than the barrel, but it must still show a gradient, not a silhouette.
    threshold: 0.78
  - id: braced-legs
    desc: "Four legs on pad footings with cross bracing and horizontal ties, plus a support ring taking the hopper."
    threshold: 0.78
  - id: sliding-gate
    desc: "The gate plate translates across the outlet under COMPUERTA; frame, stem and handwheel stay put."
    threshold: 0.75
  - id: top-works
    desc: "Venting filter, fill pipe with elbow, roof handrail and a caged ladder that actually reaches it."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80     # measured 60 at the review camera
    tris: 12000   # measured ~5,520

camera: {azimuth_deg: 48, elevation_deg: 11, fov: 38, target_y_m: 3.30, radius_m: 13.6}
  # pulled back from the first framing, which cropped the roof rail and the vent filter.

lighting: house-rig + §3.3 studio variant + bounce card
  # Same curved-metal reasoning as tanque-almacenamiento, plus a low RectAreaLight aimed up into
  # the hopper. Explicitly NOT the flat-panel camera-side fill used on the sandwich-panel assets.

ui_controls: ["AUTO-ROTATE", "COMPUERTA", "ESCALERA", "ARRIOSTRE"]

instancing:
  - {what: "roof handrail posts", count: 10, draws_saved: "10 -> 1"}
  - {what: "ladder rungs", count: 18, draws_saved: "18 -> 1"}
  - {what: "cage hoops", count: 8, draws_saved: "8 -> 1"}

colorTarget:
  srgb: [175, 181, 186]
  deltaE00Max: 8
  crop: "80x120+600+220"     # barrel, between weld seams, at 1280x800
  secondary_observed:
    hopper_face: [60, 65, 69]   # 60x60+620+450 — the hopper is expected to sit well below the
                                # barrel. If it collapses toward 0 the bounce card has stopped
                                # working or the normals were flipped again.
