# DesignSpec — loading dock (platform, leveler, bumpers, shelter)
# Seventh asset of my run in the catalog `estructuras` family.
# EVIDENCE: no dock standard is preserved. The one number that carries real design weight is the
# platform height vs the trailer bed height, and the asset is built so those two DISAGREE — which
# is the entire reason a leveler exists.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: muelle-carga
family: estructuras
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 3, occlusion: 2, action_readiness: 2}
  tier: moderate
  notes: >
    action_readiness 2: the leveler is a two-hinge mechanism (deck at the pit, lip at the deck
    nose) and it has a target angle that is DERIVED, not chosen — atan((trailer bed - platform)/
    deck length). Getting that from the geometry instead of eyeballing it is the point.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html

references:
  - source: "research/HANDBOOK.md §3.0"
    evidences: "[CERT] The 1.8 m person: a 1.20 m platform is chest height from the apron, which is why the access stair exists and why the dock reads at a glance."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1 / §3.4"
    evidences: "[CERT] Concrete, rubber bumpers and shelter fabric are dielectrics; the only colour is the guide/guard yellow and the dock traffic light, both actionable items."
    suitability: pass
  - source: "NEGATIVE — no dock source"
    evidences: "No dock-equipment datasheet or standard is preserved in research/sources/."
    suitability: fail

dimensions_real:
  platform_height_m: {value: 1.20, confidence: low}
  trailer_bed_m:     {value: 1.24, confidence: low}   # [INFER] deliberately != platform height
  dock_face_m:       {value: 8.00, confidence: low}
  door_opening_m:    {value: [2.60, 3.00], confidence: low}
  leveler_m:         {value: [1.80, 2.00], confidence: low}
  lip_m:             {value: 0.40, confidence: low}
  bumper_m:          {value: [0.30, 0.46, 0.14], confidence: low}

hierarchy:
  - name: root
    children:
      - name: platform   # dock slab, edge kerb, apron
      - name: wall       # dock face built AROUND the door opening, with lintel
      - name: door       # sectional door parked up under the lintel (the dock is in use)
      - name: leveler    # pit, deck on a rear hinge, lip on a nose hinge
        animation: two-stage tilt
      - name: trim       # bumpers, approach guides, dock traffic light, control station
      - name: shelter    # head and side curtains + door guards (togglable)
      - name: stair      # access stair from apron to platform with handrail
      - name: trailer    # berthed trailer — DEFAULT OFF (togglable)

materials:
  - id: concrete
    family: concrete
    color: "#8e8d88"
    metalness: 0.0
    roughness: 0.95
    evidence: "HANDBOOK §3.1 dielectric"
    confidence: 0.9
  - id: laminated-bumper
    family: rubber
    color: "#14171a"
    metalness: 0.0
    roughness: 0.95
    evidence: "HANDBOOK §3.1 `hose`-class dielectric"
    confidence: 0.85
  - id: leveler-deck
    family: bare-metal
    color: "#9aa2a7"
    metalness: 0.95
    roughness: 0.60
    evidence: "HANDBOOK §3.1 bare metal; rough because a leveler deck is tread plate"
    confidence: 0.85
  - id: guard-yellow
    family: painted-metal
    color: "#c9a227"
    metalness: 0.0
    roughness: 0.60
    evidence: "HANDBOOK §3.4 — colour for the actionable: approach guides and door guards"
    confidence: 0.8

critical_features:
  - id: height-mismatch-is-the-point
    desc: >
      The trailer bed and the platform are NOT at the same height, and the leveler angle is derived
      from that difference rather than picked. A dock modelled with both flush has removed its own
      reason to exist.
    threshold: 0.82
  - id: dock-is-the-subject
    desc: >
      The trailer is DEFAULT OFF. Berthed at the door it stands between the camera and the whole
      dock — the first capture was a white box with a yellow line beside it.
    threshold: 0.80
  - id: opening-into-a-lit-building
    desc: "The door opening is a real hole with a lit interior behind it; unlit it reads as a sticker on a wall."
    threshold: 0.75
  - id: dock-equipment-set
    desc: "Leveler with lip, two laminated bumpers, shelter curtains, approach guides, traffic light and a control station."
    threshold: 0.78

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 80    # measured 42 with the trailer off, 57 with it on
    tris: 8000   # measured ~1,150

camera: {azimuth_deg: 60, elevation_deg: 19, fov: 38, target_y_m: 1.90, radius_m: 14.5}

lighting: house-rig + FLAT-panel fill + warehouse-side lamp
  # FLAT case of the family decision tree. The interior lamp is not decoration: a dock door is a
  # hole into a building, and an unlit hole reads as a painted rectangle.

ui_controls: ["AUTO-ROTATE", "NIVELADOR", "REMOLQUE", "ABRIGO"]

instancing:
  # NONE. repetition 1 — nothing here repeats enough to earn an InstancedMesh.

colorTarget:
  srgb: [234, 235, 236]
  deltaE00Max: 8
  crop: "80x90+840+300"     # dock face wall, at 1280x800
  secondary_observed:
    apron_concrete: [179, 181, 179]   # 90x60+300+640
