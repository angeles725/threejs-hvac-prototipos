# DesignSpec — nave almacén (warehouse shell)
# First estructuras-family asset of the catalog. A steel portal-frame industrial building shell:
# gable roof, trapezoidal-sheet cladding, sectional entry door. Unlike the single-equipment
# inspectors, this scene HAS high structural repetition → InstancedMesh applies here (block54 §2.3).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: nave-almacen-shell
family: estructuras
track: threejs
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.10 m"

complexity:
  # 8-axis assessment (0-3 each).
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 1, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    A portal-frame nave: repeated gable frames (columns + rafters), roof purlins, wall girts,
    trapezoidal cladding on 2 side walls + 2 gable ends, a gable-mounted sectional door.
    Identity is the STRUCTURE rhythm + galvanized/painted-steel material read, not fine detail.
    High repetition → the structural members are instanced; cladding/roof are flat panels.

envelope:
  length_x: 24.0            # ridge runs along X
  width_z: 12.0             # frames span Z
  eave_h: 6.0
  ridge_h: 8.0             # ~18.4° roof pitch
  frame_spacing: 4.0       # 7 frames
  door: { on: "gable -X", width: 4.0, height: 4.5, kind: sectional }

references:
  - source: "Steel portal-frame industrial building standard practice (Eurocode/AISC brand-neutral single-storey nave)"
    evidences: >
      eave height 5-7 m typical for distribution naves; portal frames at 4-6 m centres;
      cold-formed Z/C purlins + girts; trapezoidal steel cladding (0.5-0.7 mm) on structure;
      low-slope gable 6-20 deg. Sectional overhead door ~4 x 4.5 m at a gable end.
    suitability: pass
  - source: "disenos/nave-panccadia — the real bakery nave this catalog serves"
    evidences: "gives the domain (industrial food-plant naves); geometry here is a generic shell, not that CAD"
    suitability: context

materials:
  # Bare/painted galvanized steel structure + light-gray cladding + concrete floor.
  structure: { desc: "galvanized steel frame", color_srgb: [139,147,154], metalness: 0.8, roughness: 0.45 }
  cladding:  { desc: "light-gray trapezoidal sheet", color_srgb: [214,217,219], metalness: 0.30, roughness: 0.6 }
  roof:      { desc: "gray roof sheet", color_srgb: [184,188,192], metalness: 0.35, roughness: 0.55 }
  floor:     { desc: "concrete slab", color_srgb: [154,154,149], metalness: 0.0, roughness: 0.95 }

colorTarget:
  # Objective ΔE00 anchor (block53). Crop a flat cladding wall panel.
  part: cladding
  srgb: [214,217,219]
  deltaE00Max: 8
  crop: "center of the +Z long side-wall cladding panel"
