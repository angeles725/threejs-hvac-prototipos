# DesignSpec — guard booth (glazed on three sides)
# Sixth asset of my run in the catalog `estructuras` family.
# EVIDENCE: no source is preserved for booth sizing; all dimensions are [INFER].
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: caseta-vigilancia
family: estructuras
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 1,
           material_layers: 3, detail: 2, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    material_layers 3 and repetition 1: this asset has almost no repetition to instance, and its
    difficulty is entirely in the glass — transmissive glazing over a LIT interior, which is the
    only way a guard booth reads as a guard booth rather than as a shed with dark panels.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html

references:
  - source: "research/HANDBOOK.md §3.1"
    evidences: "[CERT] Coated panel and painted mullions are dielectrics; glass is metalness 0 with transmission, never a tinted opaque plane."
    suitability: pass
  - source: "research/HANDBOOK.md §3.0"
    evidences: "[CERT] A 1.8 m person against a 2.10 m plan and a 2.05 m door: the booth is a one-person post, and the counter at 0.92 m is a working height."
    suitability: pass
  - source: "NEGATIVE — no booth source"
    evidences: "No vendor or standard document for guard booths is preserved."
    suitability: fail

dimensions_real:
  plan_m:        {value: [2.10, 2.10], confidence: low}
  eave_height_m: {value: 2.55, confidence: low}
  overall_h_m:   {value: 2.75, confidence: low}
  overhang_m:    {value: 0.25, confidence: low}
  spandrel_h_m:  {value: 0.95, confidence: low}   # solid below the glazing
  counter_h_m:   {value: 0.92, confidence: low}
  door_m:        {value: [0.85, 2.05], confidence: low}

hierarchy:
  - name: root
    children:
      - name: plinth+floor
      - name: shellG     # spandrel band (interrupted at the door), corner posts, head/signage beam
      - name: glazing    # three fully glazed elevations + transom over the door, with mullions
      - name: roof       # slab with overhang, fascia, soffit luminaire, rooftop condenser
      - name: interior   # counter, monitor, radio, chair, cabinet
      - name: doorFrame / doorPivot
        animation: swing

materials:
  - id: coated-panel
    family: painted-metal
    color: "#dfe3e6"
    metalness: 0.0
    roughness: 0.55
    evidence: "HANDBOOK §3.1 coated panel -> dielectric"
    confidence: 0.9
  - id: glazing
    family: glass
    color: "#d4e6ec"
    metalness: 0.0
    roughness: 0.04
    evidence: "HANDBOOK §3.1 glass is a dielectric; transmission 0.92 so the interior is actually legible"
    confidence: 0.85
  - id: luminaire-on
    family: emissive
    color: "#fff3d6"
    metalness: 0.0
    roughness: 0.30
    evidence: >
      HANDBOOK §3.4 — light is state, and the LUZ toggle switches the emissive material AND the
      interior point light together, so the two never disagree.
    confidence: 0.8

critical_features:
  - id: see-through-booth
    desc: >
      The interior is visible through the glazing: counter, monitor, radio, chair. A guard booth
      whose glass reads as a dark panel has lost the only thing that defines it.
    threshold: 0.82
  - id: light-is-consistent
    desc: "LUZ switches the soffit luminaire's emissive material and the interior lamp together; neither can be on while the other is off."
    threshold: 0.78
  - id: overhang-and-fascia
    desc: "A roof slab that oversails all four sides with a fascia and a soffit luminaire — the detail that says 'booth' rather than 'box'."
    threshold: 0.75
  - id: spandrel-logic
    desc: "Solid below counter height, glazed above, and the spandrel is interrupted only where the door is."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 120    # measured 101 at the review camera
    tris: 6000    # measured ~1,350

camera: {azimuth_deg: 47, elevation_deg: 13, fov: 38, target_y_m: 1.35, radius_m: 6.6}

lighting: house-rig + FLAT-panel fill + interior lamp
  # FLAT case of the family decision tree (see oficina-modular). The interior lamp is not a
  # workaround here — it is the subject: a lit booth is what makes transmissive glass read.

ui_controls: ["AUTO-ROTATE", "PUERTA", "LUZ", "TECHO"]

instancing:
  # NONE. repetition 1: nothing in this asset repeats enough to earn an InstancedMesh.

colorTarget:
  srgb: [205, 207, 209]
  deltaE00Max: 8
  crop: "90x60+700+560"     # spandrel panel, at 1280x800
  secondary_observed:
    glazing_over_interior: [86, 94, 99]   # 80x60+700+300 — the glass must stay well below the
                                          # spandrel value (it is a window, not a panel) but well
                                          # above black (the interior is lit and must show through)
