# DesignSpec — industrial access stair + elevated platform
# Second asset of my run in the catalog `estructuras` family.
# EVIDENCE NOTE: the proportions of this asset are governed by ACCESS GEOMETRY, and no access
# standard is preserved in research/sources/. The values used sit inside the band that industrial
# stair standards share (rise 0.15-0.20, going 0.21-0.30, pitch 30-45 deg, guard rail ~1.1 m,
# toe board ~0.1 m), but they are [INFER] until a standard is preserved and cited.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: escalera-plataforma
family: estructuras
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 0, action_readiness: 0}
  tier: moderate
  notes: >
    repetition 3, occlusion 0: everything is visible from outside and almost everything repeats —
    16 treads, 16 nosings, 42 grating bars, 9 cross rods, and the handrail posts. This is the
    asset where instancing earns the most and where a wrong pitch would be visible immediately.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html

references:
  - source: "research/HANDBOOK.md §3.0 (norma de mundo, persona 1.8 m)"
    evidences: >
      [CERT] The 1.8 m person is the sanity check this asset is built around: a 0.19 m rise and a
      1.10 m rail must read correctly against it, and the platform at 3.04 m is a real storey.
    suitability: pass
  - source: "research/HANDBOOK.md §3.1"
    evidences: "[CERT] Hot-dip galvanised steel is BARE metal 0.9-1.0; the safety nosing is painted, i.e. dielectric."
    suitability: pass
  - source: "NEGATIVE — no access standard preserved"
    evidences: >
      No stair/guard-rail standard exists in research/sources/. Rise 0.19 / going 0.24 / pitch
      38.4 deg / rail 1.10 m / toe 0.10 m are conventional values inside the usual band, and are
      marked [INFER] rather than cited. A future session should preserve one and re-anchor these.
    suitability: fail

dimensions_real:
  rise_m:          {value: 0.19, confidence: low}    # [INFER] inside the usual 0.15-0.20 band
  going_m:         {value: 0.24, confidence: low}    # [INFER] inside the usual 0.21-0.30 band
  pitch_deg:       {value: 38.4, confidence: low}    # derived from rise/going
  riser_count:     {value: 16,   confidence: low}
  platform_level_m: {value: 3.04, confidence: low}    # 16 x 0.19, derived
  platform_plan_m: {value: [2.60, 1.60], confidence: low}
  stair_width_m:   {value: 0.90, confidence: low}
  guard_rail_h_m:  {value: 1.10, confidence: low}    # [INFER] conventional guard height
  mid_rail_h_m:    {value: 0.55, confidence: low}
  toe_board_h_m:   {value: 0.10, confidence: low}
  post_pitch_m:    {value: 1.15, confidence: low}

hierarchy:
  - name: root
    children:
      - name: struct    # 4 columns on base plates with bedding pads, perimeter beams, bearers, knee braces
      - name: grating   # instanced bearing bars + instanced cross rods + banding frame
      - name: stair     # 2 raking stringers, instanced treads, instanced safety nosings, bottom landing plate
      - name: rails     # 3 platform runs (the stair side is left OPEN) + 2 raking stair runs, posts on both
      - name: toes      # platform toe boards + raking toe boards on both stringers

materials:
  - id: galvanised-steel
    family: bare-metal
    color: "#bcc3c7"
    metalness: 0.95
    roughness: 0.42
    evidence: "HANDBOOK §3.1 `skid` family -> 0.9-1.0. Explicitly NOT the 0.35-0.7 used by the three estructuras assets already in the catalog."
    confidence: 0.9
  - id: open-grating
    family: bare-metal
    color: "#a7aeb3"
    metalness: 0.95
    roughness: 0.55
    evidence: "HANDBOOK §3.1 bare metal; rougher than the rails because grating is not polished"
    confidence: 0.85
  - id: handrail-tube
    family: bare-metal
    color: "#c6ccd0"
    metalness: 0.95
    roughness: 0.38
    evidence: "HANDBOOK §3.1 bare metal; a handled rail is the cleanest surface on the asset"
    confidence: 0.85
  - id: safety-nosing
    family: painted-metal
    color: "#c9a227"
    metalness: 0.0
    roughness: 0.52
    evidence: "HANDBOOK §3.4 — colour is reserved for what matters; on a stair that is the step edge"
    confidence: 0.8

critical_features:
  - id: consistent-access-geometry
    desc: >
      Rise, going and pitch agree with each other and with the platform level: 16 x 0.19 = 3.04 m,
      and the flight run 16 x 0.24 = 3.84 m lands exactly on the platform edge. A stair whose
      last step does not meet the deck is the classic failure here and it is invisible to counts.
    threshold: 0.85
  - id: complete-guarding
    desc: >
      Guard rail with mid rail on the three closed platform sides and on both sides of the flight,
      posts at ~1.15 m, plus toe boards on the platform and along both stringers. The three
      toggles exist to show that a compliant stair needs all of it.
    threshold: 0.80
  - id: open-stair-side
    desc: "The platform rail is OPEN exactly where the stair lands — a rail across the stair opening would be a wall."
    threshold: 0.80
  - id: real-grating
    desc: "The deck is open grating with bearing bars and cross rods at different pitches, not a solid plate."
    threshold: 0.75
  - id: braced-frame
    desc: "Columns on base plates with bedding pads, perimeter beams, bearers and knee braces — a frame, not four sticks under a slab."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 90     # measured 65 at the review camera (SwiftShader headless, DPR 1)
    tris: 8000    # measured ~1,700

camera: {azimuth_deg: 39, elevation_deg: 17, fov: 38, target_y_m: 1.70, radius_m: 9.8}

lighting: house-rig + vertical-subject fill
  # DEVIATION: this asset is almost entirely thin VERTICAL galvanised members. Their flanks
  # reflect the dark horizon and the structure collapses into a flat grey lattice, so a
  # camera-side fill is added. PBR values unchanged (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "BARANDA"    # removes every guard rail
  - "REJILLA"    # removes the platform grating
  - "RODAPIÉ"    # removes the toe boards
  # All three only HIDE existing geometry — there is no hidden interior to reveal — so unlike the
  # cold room, these states cannot hide a "reveal shows nothing" defect and the default capture
  # is sufficient review evidence.

instancing:
  - {what: "treads", count: 16, draws_saved: "16 -> 1"}
  - {what: "safety nosings", count: 16, draws_saved: "16 -> 1"}
  - {what: "grating bearing bars", count: 42, draws_saved: "42 -> 1"}
  - {what: "grating cross rods", count: 9, draws_saved: "9 -> 1"}
  # NOT instanced: handrail posts and bars — each run has its own length and rake, so they are
  # built per run rather than forced into one buffer.

colorTarget:
  srgb: [126, 134, 140]
  deltaE00Max: 8
  crop: "90x14+760+255"      # platform perimeter beam, at 1280x800
  secondary_observed:
    safety_nosing: [152, 150, 123]   # 60x12+430+410 — the nosings must stay clearly warmer than
                                     # the galvanised steel or the step edges disappear
