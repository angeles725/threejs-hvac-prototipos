# DesignSpec — outdoor substation compound
# Eighth and last asset of my run in the catalog `estructuras` family.
# EVIDENCE: no electrical standard or transformer datasheet is preserved; all dimensions [INFER].
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: subestacion-electrica
family: estructuras
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 1}
  tier: complex
  notes: >
    The most component-dense asset in the family: transformer, gantry, switchgear, bus run and
    fence are five separate systems that have to agree with each other. repetition 3: radiator
    fins, insulator sheds and fence pickets are all genuine repetition and all instanced.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html

references:
  - source: "research/HANDBOOK.md §3.1"
    evidences: >
      [CERT] Transformer tank, radiators and cubicles are PAINTED -> dielectric; bus bars, fence
      mesh and the gantry lattice are bare metal. Porcelain is a dielectric with its own value.
    suitability: pass
  - source: "research/HANDBOOK.md §3.4"
    evidences: >
      [CERT] ISA-101: colour is reserved for the actionable. In this compound the ONLY colour is
      the warning signage — everything else stays in the neutral band.
    suitability: pass
  - source: "NEGATIVE — no electrical source"
    evidences: "No transformer datasheet or substation standard is preserved; clearances and sizes are plausible, not cited."
    suitability: fail

dimensions_real:
  yard_m:          {value: [11.0, 8.0], confidence: low}
  fence_height_m:  {value: 2.40, confidence: low}
  transformer_m:   {value: [2.60, 1.70, 2.30], confidence: low}
  gantry_height_m: {value: 5.20, confidence: low}
  gantry_span_m:   {value: 4.60, confidence: low}
  bus_height_m:    {value: 3.45, confidence: low}
  cubicle_m:       {value: [0.90, 2.20, 1.00], confidence: low}
  hv_bushing_h_m:  {value: 1.15, confidence: low}
  lv_bushing_h_m:  {value: 0.55, confidence: low}

hierarchy:
  - name: root
    children:
      - name: yard      # gravel pad + equipment plinths
      - name: tr        # tank, cover flange, instanced radiator banks, header pipes, cooling fans,
                        # conservator + oil gauge, Buchholz, control cabinet, rating plate,
                        # 3 HV bushings on the cover, 3 LV bushings across the +X end
        children:
          - name: radFan[0..3]
            animation: spin
      - name: gantry    # 2 lattice columns, head beam, strain insulators, HV drops to the bushings
      - name: cells     # 3 switchgear cubicles with louvres, handles and warning labels
      - name: bus       # 3-phase run from the LV bushings to the switchgear roof, on post insulators
      - name: fence     # posts, rails, instanced mesh pickets, gate posts, warning sign

materials:
  - id: transformer-paint
    family: painted-metal
    color: "#4a5a63"
    metalness: 0.0
    roughness: 0.52
    evidence: "HANDBOOK §3.1 painted tank -> dielectric"
    confidence: 0.9
  - id: porcelain
    family: ceramic
    color: "#cfc9ba"
    metalness: 0.0
    roughness: 0.30
    evidence: "HANDBOOK §3.1 — porcelain is a dielectric; the shed stack is what reads as high voltage"
    confidence: 0.85
  - id: copper-bus
    family: bare-metal
    color: "#c9a06a"
    metalness: 0.95
    roughness: 0.34
    evidence: "HANDBOOK §3.1 `copper` correction — warm, not the old brown"
    confidence: 0.8
  - id: fence-mesh
    family: bare-metal
    color: "#9aa2a7"
    metalness: 0.95
    roughness: 0.60
    evidence: "HANDBOOK §3.1 bare galvanised"
    confidence: 0.85

critical_features:
  - id: closed-electrical-path
    desc: >
      The bus run STARTS on the LV bushings and ENDS on post insulators on the switchgear roof.
      In the first build the LV bushings were spread along the tank length while the three bars
      were spread across its width, so every bar began and ended in mid-air. Nothing in the
      counts can see an electrical path that does not connect.
    threshold: 0.85
  - id: transformer-is-a-transformer
    desc: >
      Radiator banks with header pipes and cooling fans, a conservator with an oil gauge, a
      Buchholz relay, HV bushings on the cover and LV bushings on the end. Without the radiators
      and bushings the tank is a skip.
    threshold: 0.82
  - id: gantry-terminates
    desc: "Strain insulators on the head beam with drops that land on the HV bushings, not lines that stop in space."
    threshold: 0.78
  - id: compound-not-yard
    desc: "A closed perimeter fence with real mesh, gate posts and warning signage — what makes it a substation rather than a machine outdoors."
    threshold: 0.75
  - id: isa-colour-discipline
    desc: "Only the warning signage carries colour; everything else stays neutral, per §3.4."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 170    # measured 150 at the review camera
    tris: 20000   # measured ~9,400

camera: {azimuth_deg: 52, elevation_deg: 17, fov: 38, target_y_m: 2.20, radius_m: 15.0}

lighting: house-rig + FLAT-panel fill
  # FLAT case: tank walls, radiator fins and cubicle doors are flat painted steel. The §3.3 studio
  # rig is reserved in this family for the curved metal bodies (tanque, silo).

ui_controls: ["AUTO-ROTATE", "CERCA", "BARRAS", "VENTILADORES"]

instancing:
  - {what: "radiator fins", count: "11 per bank x 2 banks", draws_saved: "22 -> 2"}
  - {what: "insulator sheds", count: "3-7 per insulator, 18 insulators", draws_saved: "~80 -> 18"}
  - {what: "fence mesh pickets", count: "~230 around the perimeter", draws_saved: "230 -> 1"}
  - {what: "cooling fan blades", count: "4 per fan x 4 fans", draws_saved: "16 -> 4"}

colorTarget:
  srgb: [115, 125, 132]
  deltaE00Max: 8
  crop: "50x60+620+430"     # transformer tank flank, at 1280x800
  secondary_observed:
    porcelain_stack: [147, 154, 156]   # 22x40+548+300 — porcelain must stay clearly lighter than
                                       # the tank, or the bushings stop reading as insulators
