# DesignSpec — bodega (storeroom shell)
# Second estructuras asset. A small masonry storeroom: painted concrete-block walls, mono-slope
# metal-deck roof, roll-up shutter door, and interior shelving so it reads as storage (not an empty box).
# Deliberately distinct from nave-almacen-shell (big steel portal-frame + trapezoidal cladding).
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: bodega-shell
family: estructuras
track: threejs
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.10 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 2, detail: 1, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    Masonry storeroom: 4 block walls (front has the shutter opening), mono-slope metal roof,
    roll-up shutter, and 2 interior boltless shelving units with a few stored boxes/pallets.
    Roof toggles off to inspect the interior footprint. Identity = block-wall material read +
    the "small storeroom" proportion.

envelope:
  length_x: 8.0
  width_z: 6.0
  wall_h_front: 3.0
  wall_h_back: 3.7        # mono-slope roof rises toward the back
  wall_t: 0.2
  door: { on: "front +Z... no, -Z? front = -Z gable-side", width: 2.4, height: 2.5, kind: roll-up-shutter }

references:
  - source: "Small masonry storeroom / bodega standard practice (concrete block + mono-slope deck)"
    evidences: >
      painted CMU block walls ~0.2 m; mono-slope (shed) metal deck roof for drainage; roll-up
      steel shutter 2-2.5 m opening; interior boltless shelving 5 levels ~2 m tall.
    suitability: pass

materials:
  block:   { desc: "painted concrete block", color_srgb: [201,196,183], metalness: 0.0, roughness: 0.9 }
  roof:    { desc: "gray metal deck", color_srgb: [176,180,184], metalness: 0.35, roughness: 0.55 }
  shutter: { desc: "corrugated steel shutter", color_srgb: [184,188,191], metalness: 0.4, roughness: 0.5 }
  shelf:   { desc: "galvanized shelving", color_srgb: [154,161,166], metalness: 0.7, roughness: 0.45 }
  floor:   { desc: "concrete slab", color_srgb: [154,154,149], metalness: 0.0, roughness: 0.95 }

colorTarget:
  part: block
  srgb: [201,196,183]
  deltaE00Max: 8
  crop: "center of a side block wall, above the shelving"
