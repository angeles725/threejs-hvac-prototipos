<!doctype html>
<!-- Retail floor layout block — supermarket. Catalog/estructuras. Built from shell-template.html.
     QA: globalThis.__superApp.runtime + __qaRenderInfo + data-app-ready. Render-on-demand (block56).
     Product facings = ONE InstancedMesh with per-instance color (block54 §2.3). Deterministic LCG. -->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supermercado — retail floor layout</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Supermercado — retail floor layout</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· góndolas · cadena de frío · checkout</span></div>
  <div class="dim">16.0 × 12.0 m · 3 góndolas · 3 cajas</div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnProd" class="on">PRODUCTS ON-OFF</button>
  <button id="btnPlan">PLAN VIEW</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const FX=16, FZ=12, HX=FX/2, HZ=FZ/2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 30, 90);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
const HOME=[14,10.5,16];
camera.position.set(...HOME);
camera.lookAt(0, 1, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI*0.5 - 0.02;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.6;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(14, 22, 12); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;
sun.shadow.camera.left=-13; sun.shadow.camera.right=13; sun.shadow.camera.top=13; sun.shadow.camera.bottom=-13;
sun.shadow.camera.near=1; sun.shadow.camera.far=60;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.35));
scene.add(new THREE.AmbientLight(0xffffff, 0.34));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ---- materials ----
const matFloor  = new THREE.MeshStandardMaterial({ color:0xe8e6e0, metalness:0.0, roughness:0.7 });
const matWall   = new THREE.MeshStandardMaterial({ color:0xeef0f2, metalness:0.0, roughness:0.85, side:THREE.DoubleSide });
const matGond   = new THREE.MeshStandardMaterial({ color:0xb8bcc0, metalness:0.0, roughness:0.5 });    // powder-coated gondola
const matBase   = new THREE.MeshStandardMaterial({ color:0x5f666b, metalness:0.0, roughness:0.6 });    // painted base/kick
const matCooler = new THREE.MeshStandardMaterial({ color:0xe2e6e9, metalness:0.0, roughness:0.4 });    // coated case panels
const matGlass  = new THREE.MeshStandardMaterial({ color:0xbfe0ea, metalness:0.0, roughness:0.08, transparent:true, opacity:0.22 });
const matCounter= new THREE.MeshStandardMaterial({ color:0xd2d6dc, metalness:0.0, roughness:0.6 });    // laminate counter
const matBelt   = new THREE.MeshStandardMaterial({ color:0x23262b, metalness:0.0, roughness:0.7 });    // rubber belt
const matSteel  = new THREE.MeshStandardMaterial({ color:0x9aa1a6, metalness:0.95, roughness:0.45 });  // bare steel
const matDark   = new THREE.MeshStandardMaterial({ color:0x2a2e33, metalness:0.0, roughness:0.6 });    // painted dark trim
const PALETTE = [0xd0453f,0x3f6fd0,0xe0b83f,0x4fae5a,0xdd8a3a,0x3fae9e,0x8a5cc0,0xd85c86].map(c=>new THREE.Color(c));

// deterministic LCG (stable across loads → stable QA captures)
let seed=987654321; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };

const root = new THREE.Group();
const box=(w,h,d,mat,x,y,z,g)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (g||root).add(m); return m; };

// ---- floor + perimeter (front open) ----
box(FX, 0.1, FZ, matFloor, 0, 0.05, 0);
box(FX+0.2, 2.6, 0.2, matWall, 0, 1.3, -HZ);          // back wall
for(const sx of [-1,1]) box(0.2, 2.6, FZ, matWall, sx*HX, 1.3, 0);  // side walls

// ---- gondola runs (3) with instanced product facings ----
const RUN_Z=[-2.5, 0, 2.5], RUN_LEN=6, SHELF_Y=[0.55,0.95,1.35];
const prodMats=[], prodCols=[];
const dummy=new THREE.Object3D();
for(const cz of RUN_Z){
  box(RUN_LEN, 0.25, 1.0, matBase, 0, 0.125, cz);              // base/kick
  box(RUN_LEN, 1.55, 0.06, matGond, 0, 0.9, cz);              // center back panel
  for(const sgn of [-1,1]){ const sz=cz+sgn*0.28;
    for(const sy of SHELF_Y){ box(RUN_LEN, 0.03, 0.42, matGond, 0, sy, sz);
      for(let x=-2.7; x<=2.7; x+=0.42){                         // product facings
        const h=0.22+rnd()*0.16, w=0.30+rnd()*0.06;
        dummy.position.set(x, sy+0.02+h/2, sz+sgn*0.02); dummy.scale.set(w,h,0.34); dummy.rotation.set(0,0,0); dummy.updateMatrix();
        prodMats.push(dummy.matrix.clone()); prodCols.push(PALETTE[(Math.floor(rnd()*PALETTE.length))%PALETTE.length]);
      }
    }
  }
}
const prodGeo=new THREE.BoxGeometry(1,1,1);
const products=new THREE.InstancedMesh(prodGeo, new THREE.MeshStandardMaterial({metalness:0.0,roughness:0.7}), prodMats.length);
products.castShadow=true;
prodMats.forEach((m,i)=>{ products.setMatrixAt(i,m); products.setColorAt(i, prodCols[i]); });
products.instanceMatrix.needsUpdate=true; if(products.instanceColor) products.instanceColor.needsUpdate=true;
root.add(products);

// ---- back-wall upright glass-door coolers ----
box(12, 2.2, 0.7, matCooler, 0, 1.15, -HZ+0.4);
for(let x=-5; x<=5; x+=2){ const d=box(1.9,1.9,0.04, matGlass, x, 1.2, -HZ+0.77); d.castShadow=false;
  box(0.06,1.9,0.06, matSteel, x-0.97, 1.2, -HZ+0.77); }   // door mullions
box(12,0.06,0.66, matSteel, 0, 2.24, -HZ+0.4);              // top valance

// ---- refrigerated chest-freezer island (left of gondolas) ----
for(const z of [-1.2,1.2]){ box(1.7,0.9,1.0, matCooler, -5.6, 0.45, z);
  const g=box(1.55,0.05,0.85, matGlass, -5.6, 0.93, z); g.castShadow=false;
  box(1.75,0.12,1.05, matSteel, -5.6, 0.86, z); }

// ---- checkout lanes (front, z=+4.5) ----
for(const x of [-3.5,0,3.5]){ box(0.8,0.9,2.0, matCounter, x, 0.45, 4.4);
  box(0.5,0.05,1.5, matBelt, x, 0.92, 4.4);
  box(0.32,0.4,0.32, matDark, x+0.32, 1.15, 3.7);           // POS
  box(0.06,1.7,0.06, matSteel, x-0.42, 0.85, 5.2);          // lane light pole
  box(0.2,0.28,0.2, PALETTE[0]===undefined?matDark:new THREE.MeshStandardMaterial({color:0x00d4aa,emissive:0x0a5a4a}), x-0.42, 1.75, 5.2); }

scene.add(root);
renderer.shadowMap.needsUpdate = true;

// ---- UI ----
const btnRot=document.getElementById('btnRot');
btnRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; btnRot.classList.toggle('on',controls.autoRotate); requestRender(); };
const btnProd=document.getElementById('btnProd');
btnProd.onclick=()=>{ products.visible=!products.visible; btnProd.classList.toggle('on',products.visible);
  renderer.shadowMap.needsUpdate=true; requestRender(); };
const btnPlan=document.getElementById('btnPlan');
let plan=false;
btnPlan.onclick=()=>{ plan=!plan; btnPlan.classList.toggle('on',plan);
  if(plan){ camera.position.set(0.01,24,0.01); } else { camera.position.set(...HOME); }
  camera.lookAt(0,0,0); controls.target.set(0,0,0); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---- render-on-demand (block56) ----
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){ requestAnimationFrame(animate); controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; } }
animate();

// ---- QA contract ----
globalThis.__superApp = { runtime:{ scene, renderer, camera, root } };
globalThis.__supermercadoLayoutApp = globalThis.__superApp;   // alias slug-exacto: el contrato pide __<slug>App y una herramienta que busque por slug no encontraria el nombre corto
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
