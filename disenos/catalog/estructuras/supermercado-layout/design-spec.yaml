# DesignSpec — supermercado (retail floor layout block)
# Third estructuras asset. NOT a building shell: a section of retail sales floor with fixtures —
# gondola aisles (with product facings), a refrigerated island + back-wall upright coolers, and a
# front checkout bank. Demonstrates high-repetition instancing (block54 §2.3): all product facings
# are ONE InstancedMesh with per-instance color.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: supermercado-layout
family: estructuras
track: threejs
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.10 m"

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    Retail floor block: 3 double-sided gondola runs with instanced product facings, a run of
    glass-door upright coolers on the back wall, a refrigerated chest-freezer island, and a
    3-lane checkout bank at the open front. Identity = the retail LAYOUT rhythm + fixture read.
    Deterministic product colors (LCG) so headless captures are stable.

envelope:
  floor_x: 16.0
  floor_z: 12.0
  walls: "back (z-) + 2 sides; front open (entrance/checkout)"
  gondola_runs: 3
  checkout_lanes: 3

references:
  - source: "Supermarket sales-floor merchandising standard practice (gondola + cold-chain + front-end)"
    evidences: >
      gondola runs ~1.2-1.5 m tall double-sided, aisles ~1.2-1.8 m; multideck / glass-door reach-in
      coolers on perimeter; open chest-freezer islands; front-end checkout lanes with belt + POS.
    suitability: pass

materials:
  floor:    { desc: "light retail tile", color_srgb: [232,230,224], metalness: 0.0, roughness: 0.7 }
  wall:     { desc: "painted retail wall", color_srgb: [238,240,242], metalness: 0.0, roughness: 0.85 }
  gondola:  { desc: "gray shelving steel", color_srgb: [184,188,192], metalness: 0.55, roughness: 0.5 }
  cooler:   { desc: "stainless/white cooler cabinet", color_srgb: [226,230,233], metalness: 0.6, roughness: 0.4 }
  counter:  { desc: "laminate checkout counter", color_srgb: [210,214,220], metalness: 0.1, roughness: 0.6 }

colorTarget:
  part: floor
  srgb: [232,230,224]
  deltaE00Max: 8
  crop: "center aisle floor tile"
