# DesignSpec — pressure sand filter vessel, Ø900, top-mounted multiport valve
# Evidence: research/sources/B59-proceso-dims/sand-filter-vessel.md
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: filtro-arena
family: fluidos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 3, detail: 2, occlusion: 3, action_readiness: 1}
  tier: moderate
  notes: >
    material_layers 3 is the highest of the group: the whole content of this asset is a STACK of
    graded media with distinct grain and colour, and it is entirely inside the vessel. CORTE is not
    a bonus view here, it is the asset.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/sand-filter-vessel.md
  reuse_pointers:
    klopper_solver: "disenos/catalog/utilities/tanque-pulmon — validated DIN 28011 head profile"
    palette: "research/HANDBOOK.md §3.1 — painted vessel = dielectric 0.0"

references:
  - source: "research/sources/B59-proceso-dims/sand-filter-vessel.md"
    evidences: >
      Vessel diameter 200-3000 mm, shell height 1000-2000 mm; sand bed 600-1200 mm; graded silica
      0.5-1.2 mm over a support bed of 3-4 layers of graded gravel; working pressure 2.5-6.0 kg/cm2;
      filtration 10-30 m3/hr/m2 against backwash 30-40 m3/hr/m2; multiport valve top- or side-mounted.
    suitability: pass
  - source: "same file — the freeboard consequence"
    evidences: >
      Backwash runs at up to 4x the filtration rate, which FLUIDISES the bed and expands it. The
      empty volume above the media is therefore the expansion room the backwash cycle requires, not
      spare space: a vessel modelled full of sand to the top head could not be backwashed. Modelled as 600 mm of freeboard over a 1,000 mm media stack measured from the tangent line, with
      the dished floor below it gravel-filled.
    suitability: pass
  - source: "vessel and internals sizing — chosen, not measured"
    evidences: >
      Ø900 with a 1.60 m shell, 3 legs, the underdrain lateral arrangement and the valve model are
      [INFER]. Head geometry reuses the DIN 28011 Klopper solver validated on tanque-pulmon.
    suitability: partial

dimensions_real:
  shell_od_m:      {value: 0.900, confidence: med}    # [CERT-web] inside the 200-3000 range
  shell_h_m:       {value: 1.600, confidence: med}    # [CERT-web] inside the 1000-2000 range
  sand_bed_m:      {value: 0.800, confidence: high}   # [CERT-web] inside the 600-1200 range
  gravel_bed_m:    {value: 0.200, confidence: high}   # [CERT-web] 3-4 graded layers
  gravel_layers:   {value: 3, confidence: high}       # [CERT-web]
  freeboard_m:     {value: 0.600, confidence: high}   # [CERT-web] derived from the backwash rule
  end_depth_m:     {value: 0.174, confidence: med}    # [INFER] DIN 28011 Klopper 0.1935 D
  press_bar:       {value: 6.0, confidence: high}     # [CERT-web] top of the working range
  legs:            {value: 3, confidence: low}        # [INFER]

hierarchy:
  - name: root
    children:
      - name: shell        # one LatheGeometry: Klopper bottom + barrel + Klopper top
        pivot: [0, 0, 0]
        animation: none
      - name: media        # gravel layers + sand bed + the freeboard they sit under
        pivot: [0, 0, 0]
        animation: none
      - name: internals    # top distributor + underdrain laterals
        pivot: [0, 0, 0]
        animation: none
      - name: valve        # top-mounted multiport valve, gauge, sight glass
        pivot: [0, 2.25, 0]
        animation: none
      - name: piping       # inlet / outlet / drain and their unions
        pivot: [0, 0, 0]
        animation: none
      - name: stand        # 3 legs
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: vessel-painted
    family: painted-metal
    color: "#1f4e6e"
    metalness: 0.0
    roughness: 0.50
    evidence: "painted carbon-steel pressure vessel — dielectric; HANDBOOK §3.1"
    confidence: 0.8
  - id: sand-media
    family: mineral
    color: "#c2a878"
    metalness: 0.0
    roughness: 0.98
    evidence: "[CERT-web] graded silica sand 0.5-1.2 mm — fully matt, no specular"
    confidence: 0.85
  - id: gravel-coarse
    family: mineral
    color: "#8b8377"
    metalness: 0.0
    roughness: 0.95
    evidence: "[CERT-web] graded gravel support layers, darker and coarser than the sand"
    confidence: 0.8
  - id: gravel-fine
    family: mineral
    color: "#a49a8c"
    metalness: 0.0
    roughness: 0.96
    evidence: "[CERT-web] intermediate graded layer"
    confidence: 0.75
  - id: valve-grey
    family: plastic
    color: "#5a6168"
    metalness: 0.0
    roughness: 0.45
    evidence: "moulded multiport valve body"
    confidence: 0.7
  - id: pipe-steel
    family: bare-metal
    color: "#9ea4a7"
    metalness: 0.88
    roughness: 0.40
    evidence: "bare steel connections and laterals"
    confidence: 0.8

critical_features:
  - id: freeboard-above-the-bed
    desc: >
      The vessel is about twice the height of its media. That empty upper volume is the bed
      EXPANSION room backwash needs — a filter drawn full of sand to the top head is a filter that
      cannot be backwashed, and it is the most common way to draw this wrong.
    threshold: 0.80
  - id: graded-media-stack
    desc: >
      Sand sits on 3 graded gravel layers, each visibly coarser and darker downward, not on bare
      vessel floor. The gravel is what stops sand entering the underdrain.
    threshold: 0.75
  - id: distributor-above-underdrain-below
    desc: >
      Flow enters through a top distributor and leaves through laterals buried in the gravel. Both
      must be present or the vessel is just a drum of sand.
    threshold: 0.75
  - id: matt-media-vs-painted-shell
    desc: >
      Media read fully matt (roughness ~0.98, no specular) against a painted dielectric shell.
      Shiny sand is the giveaway of a material copied from the vessel.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60          # measured 56
    tris: 120000       # measured 9,462

camera:
  azimuth_deg: 44
  elevation_deg: 11
  fov: 38
  target_y_m: 1.10
  radius_m: 4.20

lighting: house-rig-plus-fill
  # Same deviation as the other vertical vessels. The media are dielectric and matt, so they are lit
  # by the diffuse terms and are unaffected by the downward-facing-metal limit.

ui_controls:
  - "AUTO-ROTATE"
  - "CORTE"                    # translucent shell — exposes the graded stack and the freeboard
  - "INTERNOS"                 # distributor + underdrain laterals
  - "COTAS"                    # marks bed depth against freeboard

colorTarget:
  # MEASURED from the rendered painted shell (headless SwiftShader capture at 1280x800).
  srgb: [34, 102, 148]
  deltaE00Max: 8
  crop: "24x24+590+400"   # lit shell flank at 1280x800, default camera (shaded side reads 0,66,108)
