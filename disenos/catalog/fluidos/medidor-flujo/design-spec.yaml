# DesignSpec — medidor de flujo electromagnético en línea, DN100 PN16, versión compacta
# Familia `fluidos` (worktree catalog-proceso, tomado por la sesión catalog-retail-lab).
# Reglas de autoría: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# CONFIANZA MIXTA A PROPÓSITO. Las cotas de BRIDA y TUBO se reutilizan de fluidos/valvula-motorizada,
# que ya las estableció como [CERT-a] media (norma recordada, no tabla preservada). El MEDIDOR en sí
# no tiene ficha: cara a cara, envolvente de bobinas y convertidor van [INFER]/low, y el HUD lo dice.

design: medidor-flujo
family: fluidos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # el electrodo de 7 mm y el liner son material, no vóxel

complexity:
  # Evaluación previa de 8 ejes (0-3 cada uno). Suma 12 -> moderate.
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 2, action_readiness: 0}
  tier: moderate
  notes: >
    detail 3 y occlusion 2 apuntan al mismo sitio: un medidor electromagnético se reconoce por lo que
    lleva DENTRO — liner aislante, dos electrodos enfrentados y bobinas arriba y abajo — y eso solo
    existe en el estado de corte. Por fuera es un carrete bridado con una caja encima.
    repetition 2: los dos círculos de 8 pernos son la única repetición real -> un solo batch.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    brida_dn100: >
      disenos/catalog/fluidos/valvula-motorizada/ — misma línea DN100 PN16: OD 220, PCD 180, 8 x M16,
      tubo OD 114.3. Reutilizar esas cifras es lo que hace que los dos assets se atornillen entre sí.
    convencion_familia: "eje de tubería a 0.45 m y medio tramo corto para que domine el equipo, no el tubo"
    corte_no_destructivo: "disenos/catalog/utilities/suavizador-agua/ — el corte es visibilidad, no borrado"

references:
  - source: "fluidos/valvula-motorizada design-spec — cifras DN100 PN16 ya establecidas en este repo"
    evidences: >
      [CERT-a] EN 1092-2 PN16 DN100: brida OD 220 mm, 8 x M16 sobre PCD 180 mm; tubo DN100 OD 114.3 mm.
      El asset hermano las declara como valores de norma RECORDADOS, sin página de fabricante
      preservada, y las lleva en confianza media. Aquí se heredan con la misma etiqueta y la misma
      advertencia: reverificar antes de usar el asset para comprobaciones reales de ajuste o choque.
    suitability: partial
  - source: "SIN FICHA para el medidor — fuentes intentadas, ninguna preservada"
    evidences: >
      [INFER] Busqué en research/sources/B59-proceso-dims/ (bombas EN733, compresor de tornillo,
      secador, tanque pulmón, membranas de OI, filtro de arena, mariposa wafer DN100, tolva, mezclador
      de cinta), en research/SOURCES.md y en los bloques B57-B65: ninguna cubre caudalímetros. La cara
      a cara de 200 mm, la envolvente de bobinas y el tamaño del convertidor son convención de producto
      para DN100 compacto, no una hoja de datos.
    suitability: partial

dimensions_real:
  dn:            {value: 100,    confidence: high}   # [CERT-web] diámetro nominal
  pipe_od_m:     {value: 0.1143, confidence: med}    # [CERT-a] heredado del asset hermano
  flange_od_m:   {value: 0.220,  confidence: med}    # [CERT-a] EN 1092-2 PN16
  bolt_pcd_m:    {value: 0.180,  confidence: med}    # [CERT-a]
  bolts_per_flange: {value: 8,   confidence: med}    # [CERT-a]
  flange_t_m:    {value: 0.020,  confidence: low}    # [INFER]
  face_to_face_m: {value: 0.200,  confidence: low}    # [INFER] sin ficha
  coil_housing_od_m: {value: 0.205, confidence: low} # [INFER]
  coil_housing_l_m:  {value: 0.135, confidence: low} # [INFER]
  bore_m:        {value: 0.100,  confidence: low}    # [INFER] paso libre = DN
  axis_y_m:      {value: 0.450,  confidence: low}    # convención de la familia fluidos
  converter_neck_m: {value: 0.16, confidence: low}   # [INFER]
  electrodes:    {value: 2,      confidence: low}    # [INFER] par enfrentado, perpendicular al campo

hierarchy:
  - name: root
    children:
      - name: pipeRun         # tramo adyacente, bridas de línea y dos soportes con silleta (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: meter           # bridas propias, conos de transición, envolvente de bobinas, placa
        pivot: [0, 0, 0]
        animation: none
      - name: bolts           # InstancedMesh, 8 + 8 pernos de brida
        pivot: [0, 0, 0]
        animation: none
      - name: cut             # medio cuerpo + liner + 2 electrodos + 2 bobinas (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: conv            # cuello, caja del convertidor, display, prensaestopas (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: pipe-steel
    family: bare-metal
    color: "#b8bdc1"
    metalness: 0.92
    roughness: 0.38
    evidence: "HANDBOOK §3.1 metal desnudo 0.9-1.0"
    confidence: 0.85
  - id: flange-steel
    family: bare-metal
    color: "#a9aeb3"
    metalness: 0.92
    roughness: 0.44
    evidence: "HANDBOOK §3.1 — cara mecanizada, más mate que el cuerpo del tubo"
    confidence: 0.8
  - id: meter-body-paint
    family: painted-metal
    color: "#2f6a86"
    metalness: 0.0             # cuerpo pintado -> DIELÉCTRICO
    roughness: 0.46
    evidence: "HANDBOOK §3.1 pintado/recubierto 0.0-0.05"
    confidence: 0.8
  - id: liner-ptfe
    family: plastic
    color: "#e8e6df"
    metalness: 0.0
    roughness: 0.30
    evidence: >
      [INFER] Liner aislante, renderizado DoubleSide: es un cilindro abierto y sin DoubleSide su pared
      interior no se dibuja, que es justo lo que el corte debe enseñar.
    confidence: 0.75
  - id: electrode
    family: bare-metal
    color: "#c9a227"
    metalness: 0.90
    roughness: 0.32
    evidence: "HANDBOOK §3.1 metal desnudo — electrodos en contacto con el fluido"
    confidence: 0.75
  - id: coil-winding
    family: plastic
    color: "#8a5a2b"
    metalness: 0.0
    roughness: 0.52
    evidence: >
      [CERT] Alambre ESMALTADO: conductor recubierto, o sea dieléctrico. Iba en metalness 0.60 y
      lint-asset-source lo marcó como intermedio no registrado (§3.1 pide casi binaria). Corregido a
      0.0 en vez de declararlo desviación, porque el material real es recubierto.
    confidence: 0.8
  - id: converter-alu
    family: painted-metal
    color: "#d2d6d9"
    metalness: 0.0
    roughness: 0.44
    evidence: "[INFER] carcasa de aluminio con recubrimiento — dieléctrica"
    confidence: 0.75

critical_features:
  - id: internals-del-corte
    desc: >
      El estado CORTE cambia cuerpo Y CONOS DE TRANSICIÓN por medio cuerpo y MEDIOS CONOS, y deja ver
      liner, los dos electrodos enfrentados y las dos bobinas. Sin eso el asset es un carrete bridado.
      CRITERIO MEDIBLE de continuidad: el cuerpo opaco visible debe llegar hasta la cara interior de
      la brida, o sea huecoHastaBrida <= 0 en AMBOS estados. Medido: cerrado 0.000, en corte 0.000.
      HISTORIA: la primera versión ocultaba los conos completos y solo reponía el medio cuerpo,
      dejando 0.032 m de hueco por lado. Es el mismo defecto que la auditoría encontró en
      utilities/suavizador-agua (allí el domo); aquí lo busqué a propósito y lo medí antes de corregir.
      Regla que deja este par de casos: cuando un corte SUSTITUYE geometría, enumerar lo que se oculta
      y lo que se repone son dos listas distintas, y la asimetría no la ve ni el gate ni los conteos.
    threshold: 0.80
  - id: brida-que-empalma
    desc: >
      Bridas OD 220 con 8 pernos sobre PCD 180 y tubo OD 114.3: las mismas cifras que
      fluidos/valvula-motorizada, de modo que los dos assets de la familia empalman en la misma línea.
    threshold: 0.78
  - id: convertidor-compacto
    desc: >
      Convertidor montado sobre su cuello encima del cuerpo, con display y dos prensaestopas — la
      versión compacta, no una remota con caja de conexiones separada.
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 50
    tris: 20000
  measured:             # captura headless SwiftShader 1280x800 — los CONTEOS valen, el frame time NO
    draws: 27
    tris: 1670
    geometries: 28
    root_meshes: 32

camera:
  azimuth_deg: 46
  elevation_deg: 12
  fov: 38
  target_y_m: 0.55
  radius_m: 1.95

lighting: house-rig + fill lateral
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DESVIACIÓN DOCUMENTADA: bridas y tubo son metal DESNUDO. Una cara vertical no puede recibir el
  # especular de una luz elevada, así que el brillo lo da el IBL: env 2.6. El fill lateral (0.85) solo
  # aporta al término DIFUSO del cuerpo pintado. Metalness/roughness sin tocar (HANDBOOK §3.1).

ui_controls:
  - "AUTO-ROTATE"
  - "CORTE DEL TUBO"      # medio cuerpo + liner + electrodos + bobinas
  - "CONVERTIDOR"         # cabezal compacto
  - "TRAMO Y SOPORTES"    # tubería adyacente con silletas

colorTarget:
  # MEDIDO del cuerpo pintado del medidor (captura headless SwiftShader a 1280x800): parche más plano
  # hallado por barrido, desviación por canal ~1.5. No es un valor inventado.
  srgb: [149, 199, 218]
  deltaE00Max: 8
  crop: "14x16+590+404"
