# DesignSpec — end-suction centrifugal pump set (EN 733 / DIN 24255), size 65-160
# First asset of the catalog `fluidos` family. Dimensional evidence is a preserved manufacturer
# catalogue whose dimension table IS the EN 733 table (the standard fixes these dimensions, so any
# compliant maker prints the same numbers): research/sources/B59-proceso-dims/pedrollo-fg-en733.pdf
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# WHY THIS SIZE: 65/160 is the mid-range industrial workhorse and its row is fully populated in the
# catalogue table (h1/h2/b/m/n all printed), so almost nothing has to be inferred.

design: bomba-centrifuga
family: fluidos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 1}
  tier: moderate
  notes: >
    Repetition is LOW (motor cooling fins, flange bolts) — under the [Block 54] low-repetition
    caveat only those two runs are instanced; every casting is a unique mesh. The silhouette score
    is driven by the volute: a real spiral casing is an extruded Archimedean spiral, not a cylinder,
    and that is what separates a pump from a drum on a frame.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/pedrollo-fg-en733.pdf
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — PAINTED cast iron = dielectric 0.0; bare shaft steel = 0.9"
    sibling_spec: "disenos/catalog/almacenamiento/rack-pallet/design-spec.yaml (same evidence discipline)"
    prior_vocabulary: "disenos/bomba-centrifuga/ — geometry vocabulary only; that model is in ARBITRARY units, not metres"

references:
  - source: "research/sources/B59-proceso-dims/pedrollo-fg-en733.pdf :p.'DIMENSIONS AND WEIGHT' (FG 50 Hz)"
    evidences: >
      Row FG 65/160: ports DN1 (suction) 80, DN2 (discharge) 65; h1 = 160 mm, h2 = 200 mm, b = 65 mm,
      m1 = 125, m2 = 95, n1 = 280, n2 = 212 mm; dry weight 48.0 kg. Neighbouring 160-frame rows give
      the shared columns: f = 360 mm (suction flange face to shaft end), s1 = 14 mm fixing holes,
      w = 260, l = 50, d = 24 k6 shaft extension, c = 8, e = 27 mm. Column `a` (suction face to the
      discharge centreline) = 100 mm for the 65 series.
    suitability: pass
  - source: "research/sources/B59-proceso-dims/kop-kdin-en733.pdf (KOP KDIN, DIN 24255)"
    evidences: >
      Corroborates the family envelope: DIN 24255/EN 733 end-suction, 2-1,100 m3/h, head 2-150 m,
      1,450 / 2,900 rpm, 10 bar working pressure, seal to DIN 24960. Confirms the pump TYPE, not the
      table (its dimension pages are raster images and could not be read).
    suitability: partial
  - source: "IEC 60072-1 frame designation (standard motor mounting), applied to the h1/h2 pair"
    evidences: >
      DERIVED, and the derivation is the interesting part: h2 - h1 = 200 - 160 = 40 mm is the
      baseplate thickness, because both the pump foot and the motor feet bolt to the same plate.
      A shaft 200 mm above the floor on a 40 mm plate needs a motor whose own shaft height is
      160 mm — i.e. an IEC 160 frame. The table therefore fixes the motor size without naming it.
    suitability: pass

dimensions_real:
  suction_dn_m:    {value: 0.080, confidence: high}   # [CERT-doc] DN1
  discharge_dn_m:  {value: 0.065, confidence: high}   # [CERT-doc] DN2
  shaft_h1_m:      {value: 0.160, confidence: high}   # [CERT-doc] shaft over the pump foot
  shaft_h2_m:      {value: 0.200, confidence: high}   # [CERT-doc] shaft over the baseplate underside
  baseplate_t_m:   {value: 0.040, confidence: high}   # [CERT-doc] derived h2 - h1
  pump_len_f_m:    {value: 0.360, confidence: med}    # [CERT-doc] shared 160-frame column
  suction_to_disch_a_m: {value: 0.100, confidence: med}  # [CERT-doc] column a, 65 series
  foot_bolt_m1_m:  {value: 0.125, confidence: high}   # [CERT-doc]
  foot_bolt_m2_m:  {value: 0.095, confidence: high}   # [CERT-doc]
  base_bolt_n1_m:  {value: 0.280, confidence: high}   # [CERT-doc]
  base_bolt_n2_m:  {value: 0.212, confidence: high}   # [CERT-doc]
  shaft_d_m:       {value: 0.024, confidence: high}   # [CERT-doc] d (k6)
  shaft_ext_l_m:   {value: 0.050, confidence: high}   # [CERT-doc] l
  impeller_d_m:    {value: 0.160, confidence: high}   # [CERT-doc] the "160" in 65/160 IS the impeller
  volute_r_out_m:  {value: 0.145, confidence: low}    # [INFER] impeller radius + volute passage + wall
  volute_w_m:      {value: 0.105, confidence: low}    # [INFER] casing width, not published
  flange_od_dn80_m: {value: 0.200, confidence: med}    # [CERT-a] EN 1092-2 PN16 DN80, 8 x M16 on 160 PCD
  flange_od_dn65_m: {value: 0.185, confidence: med}    # [CERT-a] EN 1092-2 PN16 DN65, 4 x M16 on 145 PCD
  motor_frame:     {value: "IEC 160", confidence: med}    # [INFER] forced by h2 - baseplate, see references
  motor_body_d_m:  {value: 0.300, confidence: low}    # [INFER] typical IEC 160 aluminium/cast frame
  motor_len_m:     {value: 0.620, confidence: low}    # [INFER] body + fan cowl, IEC 160M
  baseplate_m:     {value: [1.25, 0.40], confidence: low}  # [INFER] set to carry both feet + grout lip

hierarchy:
  - name: root
    children:
      - name: baseplate       # 40 mm folded-steel plate — the h2 - h1 datum for the whole set
        pivot: [0, 0, 0]
        animation: none
      - name: pumpEnd         # volute + suction cone + discharge nozzle + bearing bracket + foot
        pivot: [-0.52, 0.20, 0]
        animation: none
      - name: coupling        # spacer coupling hubs + shaft; spins when RUNNING
        pivot: [-0.21, 0.20, 0]
        animation: spin-x
      - name: guard           # coupling guard (safety yellow) — hides to expose the coupling
        pivot: [-0.21, 0.20, 0]
        animation: none
      - name: motor           # IEC 160 frame: finned body, terminal box, fan cowl, feet
        pivot: [0.15, 0.20, 0]
        animation: none

materials:
  - id: casting-blue
    family: painted-metal
    color: "#1d5f8a"
    metalness: 0.0             # PAINTED cast iron — dielectric. Metal-blue is the predictable error.
    roughness: 0.50
    evidence: "HANDBOOK §3.1 painted 0.0-0.05; EN 733 sets no colour, the maker's blue is the house read"
    confidence: 0.85
  - id: motor-grey
    family: painted-metal
    color: "#5f676c"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted IEC motor frame — dielectric; kept distinct from the pump so the two bodies read apart"
    confidence: 0.8
  - id: baseplate-steel
    family: painted-metal
    color: "#3d444a"
    metalness: 0.0
    roughness: 0.62
    evidence: "painted folded-steel baseplate; darker so the two machines sit on it rather than merge into it"
    confidence: 0.75
  - id: shaft-steel
    family: bare-metal
    color: "#c9ced1"
    metalness: 0.92
    roughness: 0.28
    evidence: "[CERT-doc] shaft extension d 24 k6 — machined bare steel; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.9
  - id: flange-steel
    family: bare-metal
    color: "#b3b8ba"
    metalness: 0.88
    roughness: 0.42
    evidence: "machined flange faces and bolting; bare metal"
    confidence: 0.8
  - id: guard-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0
    roughness: 0.6
    evidence: "coupling guard — a rotating coupling must be guarded; safety yellow is the house convention"
    confidence: 0.75

critical_features:
  - id: axial-suction-radial-discharge
    desc: >
      Suction enters AXIALLY, concentric with the shaft, through the front face of the volute;
      discharge leaves RADIALLY upward, its centreline 100 mm behind the suction flange face. That
      L-shaped flow path is the whole definition of "end-suction" and is the detail a modeller
      reverses first.
    threshold: 0.80
  - id: spiral-volute
    desc: >
      The casing is a true spiral: the passage radius grows continuously from the cutwater around to
      the discharge throat. A concentric cylinder reads as a drum, not a volute.
    threshold: 0.75
  - id: one-baseplate-two-machines
    desc: >
      Pump and motor bolt to ONE 40 mm baseplate with their shafts collinear at 200 mm, joined by a
      guarded spacer coupling. The 40 mm plate is not decoration — it is h2 - h1 from the table.
    threshold: 0.75
  - id: painted-casting-vs-bare-shaft
    desc: >
      Castings read as PAINTED (dielectric, no metal glint); only the shaft, coupling and machined
      flange faces read as bare metal.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60          # measured 57 (incl. ground + the fin/bolt/grille instanced runs)
    tris: 200000       # measured 5,262 — a machine this size is draw-bound, never triangle-bound

camera:
  azimuth_deg: 46
  elevation_deg: 14
  fov: 38
  target_y_m: 0.26
  radius_m: 2.55

lighting: house-rig-plus-fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DEVIATION, and it is required: the volute and the motor are large vertical-ish metal bodies. A
  # bare cylinder facing the camera reflects the dark horizon and reads as flat grey. Fix per the
  # house gotcha: add a fill light from the camera side and lift environmentIntensity — do NOT
  # lower metalness to fake it, that breaks the painted/bare material claim above.

ui_controls:
  - "AUTO-ROTATE"
  - "RUNNING"                  # spins the coupling — gated per-frame animation
  - "GUARD"                    # coupling guard on/off, exposes the spacer coupling
  - "CORTE"                    # section the volute to show the impeller inside

colorTarget:
  # MEASURED from the rendered painted volute (headless SwiftShader capture at 1280x800), frozen as
  # the regression anchor. The VOLUTE is the target: painted-casting-vs-bare-metal is the material
  # claim most likely to regress. Note the measured value is far more saturated than the authored
  # 0x1d5f8a — ACESFilmic plus environmentIntensity 2.4 do that, and the ANCHOR IS THE MEASUREMENT.
  srgb: [5, 103, 158]
  deltaE00Max: 8
  crop: "20x20+450+395"   # lit flank of the volute at 1280x800, default camera
