# DesignSpec — motor-operated wafer butterfly valve DN100 PN16 on a pipe run
# Evidence: research/sources/B59-proceso-dims/wafer-butterfly-dn100-pn16.md (preserved extracts)
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# HONESTY NOTE, up front: this asset has WEAKER dimensional evidence than the other four in this
# family group. The valve class, rating, standards and materials are confirmed from manufacturer
# pages, but no vendor exposed a dimension table in HTML — the numbers live in downloadable PDFs
# and CAD zips. So the face-to-face length and the flange drilling below are cited as STANDARD
# values ([CERT-a]), not as measured evidence, and are flagged as the first thing to re-check if
# this asset is ever used dimensionally rather than as a scale cue.

design: valvula-motorizada
family: fluidos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 3}
  tier: simple
  notes: >
    action_readiness is the highest score in the group: a valve's whole reason to exist is that it
    moves, and the disc travelling 90 degrees between open and shut is the asset's main statement.
    The hierarchy therefore has to put the disc and stem on one pivot that the actuator drives.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/sources/B59-proceso-dims/wafer-butterfly-dn100-pn16.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted cast-iron body = dielectric; bare pipe/disc = 0.88-0.92"
    sibling_spec: "disenos/catalog/fluidos/bomba-centrifuga/design-spec.yaml — same family, same flange logic"

references:
  - source: "research/sources/B59-proceso-dims/wafer-butterfly-dn100-pn16.md (Tameson BFLW-100-16-ABA + END TA532010)"
    evidences: >
      DN100 (4"), PN16, rated 16 bar, wafer body, cast iron GG25 housing with stainless steel disc
      and EPDM seat, temperature range -10 to +110 C, ISO 5211 actuator mounting flange, face-to-face
      length to EN 558 series 20. Catalogue weight 5.757 kg for the bare valve.
    suitability: pass
  - source: "EN 558 series 20 and EN 1092-2 PN16 — standard values, NOT a preserved document"
    evidences: >
      Face-to-face 52 mm for DN100 in EN 558 series 20; EN 1092-2 PN16 DN100 flange OD 220 mm with
      8 x M16 on a 180 mm bolt circle; pipe OD 114.3 mm for DN100. These are the standard figures the
      valve is built to, but no vendor page in reach published the table, so they carry [CERT-a] and
      medium confidence. Re-verify before using this asset for real clash or fit checking.
    suitability: partial
  - source: "ISO 5211 mounting + electric actuator practice"
    evidences: >
      The ISO 5211 top flange is confirmed by the vendor; the specific F-code, the actuator envelope,
      its handwheel and position indicator are [INFER]. F07 is the usual code for DN100 in this class.
    suitability: partial

dimensions_real:
  dn:              {value: 100, confidence: high}     # [CERT-web] nominal diameter
  pn_bar:          {value: 16, confidence: high}      # [CERT-web] PN16 / 16 bar
  face_to_face_m:  {value: 0.052, confidence: med}    # [CERT-a] EN 558 series 20, DN100
  pipe_od_m:       {value: 0.1143, confidence: med}   # [CERT-a] DN100 steel pipe OD
  flange_od_m:     {value: 0.220, confidence: med}    # [CERT-a] EN 1092-2 PN16 DN100
  flange_pcd_m:    {value: 0.180, confidence: med}    # [CERT-a] 8 x M16
  flange_bolts:    {value: 8, confidence: med}        # [CERT-a]
  body_od_m:       {value: 0.175, confidence: low}    # [INFER] must pass INSIDE the bolt circle
  disc_d_m:        {value: 0.098, confidence: low}    # [INFER] just under bore
  iso5211:         {value: "F07", confidence: low}    # [INFER] usual code at DN100
  valve_weight_kg: {value: 5.757, confidence: high}   # [CERT-web] bare valve
  temp_range_c:    {value: [-10, 110], confidence: high}  # [CERT-web] EPDM seat limit

hierarchy:
  - name: root
    children:
      - name: pipeRun        # two pipe lengths + their flanges + supports
        pivot: [0, 0, 0]
        animation: none
      - name: body           # wafer body, seat, ISO 5211 neck, clamping studs
        pivot: [0, 0.45, 0]
        animation: none
      - name: closure        # disc + stem — ONE pivot, driven by the actuator
        pivot: [0, 0.45, 0]
        animation: rotate-y-90
      - name: actuator       # electric actuator, handwheel, position indicator, gland
        pivot: [0, 0.62, 0]
        animation: none

materials:
  - id: body-painted
    family: painted-metal
    color: "#2f6b57"
    metalness: 0.0
    roughness: 0.52
    evidence: "[CERT-web] GG25 cast-iron body — painted, therefore dielectric; HANDBOOK §3.1"
    confidence: 0.85
  - id: disc-stainless
    family: bare-metal
    color: "#c4c9cb"
    metalness: 0.92
    roughness: 0.30
    evidence: "[CERT-web] stainless steel disc — bare machined metal"
    confidence: 0.9
  - id: pipe-steel
    family: bare-metal
    color: "#9ea4a7"
    metalness: 0.88
    roughness: 0.42
    evidence: "carbon-steel pipe and flanges; kept bare so the painted body reads against it"
    confidence: 0.8
  - id: seat-epdm
    family: rubber
    color: "#1b1e21"
    metalness: 0.0
    roughness: 0.88
    evidence: "[CERT-web] EPDM seat — the black liner visible in the bore"
    confidence: 0.85
  - id: actuator-grey
    family: painted-metal
    color: "#7d848a"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted actuator enclosure — dielectric"
    confidence: 0.75
  - id: indicator-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0
    roughness: 0.6
    evidence: "position indicator / handwheel — safety yellow, house convention"
    confidence: 0.7

critical_features:
  - id: wafer-is-clamped-not-flanged
    desc: >
      A WAFER body has no flanges of its own — it is clamped BETWEEN two pipe flanges by studs that
      run past it. Modelling the valve with its own bolted flanges turns it into a lugged or
      double-flanged valve, a different product. The body OD must also pass inside the bolt circle.
    threshold: 0.80
  - id: disc-travels-ninety-degrees
    desc: >
      Open = disc edge-on to the flow, shut = disc square across the bore, and the same stem carries
      it. Both end states must read correctly, not just the default one.
    threshold: 0.80
  - id: painted-body-vs-bare-disc
    desc: >
      Cast body reads as PAINTED (dielectric), the disc and pipe as bare metal, and the seat as matt
      black rubber. Three material families meeting in 52 mm is the whole material story here.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 45          # measured 42
    tris: 120000       # measured 3,706

camera:
  azimuth_deg: 46
  elevation_deg: 12
  fov: 38
  target_y_m: 0.52
  radius_m: 1.90

lighting: house-rig
  # No deviation: the subject is small, mixed-orientation and mostly painted. The vertical-metal
  # fill is not needed and would flatten the disc-against-body contrast.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR"                    # drives the disc through its 90 degrees
  - "CORTE"                    # translucent pipe + body to expose disc and seat
  - "COTAS"                    # DN100 bore and the EN 558-20 face-to-face

colorTarget:
  # MEASURED from the rendered painted valve body (headless SwiftShader capture at 1280x800).
  srgb: [51, 136, 110]
  deltaE00Max: 8
  crop: "12x12+616+368"   # painted body neck at 1280x800, default camera. Small crop on purpose:
  # a wafer body is only 52 mm between two flanges, so the largest uninterrupted patch of the
  # painted casting in frame IS the neck. A wider crop would sample the flanges instead and the
  # anchor would then be measuring bare steel, not the painted-vs-bare claim it exists to guard.
