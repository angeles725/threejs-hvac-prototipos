# DesignSpec — bomba de turbina vertical de eje lineal (pozo profundo), 3 etapas
# Familia `fluidos` (worktree catalog-proceso).
# Reglas de autoría: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# ASSET SIN FICHA. Ninguna cota viene de una hoja de fabricante preservada. Se aplica la política del
# ONBOARD (precedente barrera-vehicular): modelar con confianza LOW, listar las fuentes intentadas y
# declararlo en el HUD, en vez de inventar cifras y etiquetarlas high. La única cota que sube a `med`
# es el DN de la columna, y se explica abajo por qué.

design: bomba-vertical-pozo
family: fluidos
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # el eje de 38 mm y los álabes de 8 mm son material, no vóxel

complexity:
  # Evaluación previa de 8 ejes (0-3 cada uno). Suma 15 -> complex (umbral 15 en DESIGNSPEC.md).
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 2,
           material_layers: 2, detail: 3, occlusion: 3, action_readiness: 0}
  tier: complex
  notes: >
    occlusion 3 es el eje que manda y es DOBLE, que es lo que distingue a este asset del resto de la
    familia: la hidráulica no está tapada por una carcasa, está tapada por DOS envolventes concéntricas
    — los tazones por dentro y el casing del pozo por fuera. detail 3 va con ello: una bomba de turbina
    vertical se reconoce por las etapas de tazones con sus impulsores y el eje lineal con arañas, y
    nada de eso existe fuera del estado CORTE. action_readiness 0 a propósito: el eje gira en la
    máquina real, pero aquí no hay animación, así que la sombra congelada del shell es correcta
    (ONBOARD: la clase de movimiento decide, y aquí no hay ninguna).

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    corte_no_destructivo: >
      disenos/catalog/utilities/suavizador-agua/ y disenos/catalog/fluidos/medidor-flujo/ — en los dos
      el corte es VISIBILIDAD, no borrado, y en los dos el defecto real fue que la lista de lo que se
      oculta y la de lo que se repone divergieron. Aquí esa divergencia se hizo IMPOSIBLE por
      construcción; ver critical_features/salvaguarda-shellpair.
    familia_fluidos: >
      disenos/catalog/fluidos/bomba-centrifuga/ — la otra bomba de la familia es de eje HORIZONTAL con
      succión axial. Este asset es su inverso deliberado: la misma función hidráulica resuelta en
      vertical, con la hidráulica sumergida y el motor fuera del líquido.

references:
  - source: "SIN FICHA — no existe fuente de turbina vertical en el corpus de este repo"
    evidences: >
      [INFER] Fuentes intentadas y su resultado, reproducible:
      (1) `research/sources/B59-proceso-dims/` — es el único directorio de cotas de proceso del repo y
          contiene 11 documentos: kop-kdin-en733.pdf y pedrollo-fg-en733.pdf (bombas centrífugas
          HORIZONTALES EN 733), atlas-copco-g15-22-screw.pdf, atlas-copco-lv511-500l-receiver.md,
          hertz-hrd-refrigerated-dryer.pdf, ro-membrane-elements.md, sand-filter-vessel.md,
          wafer-butterfly-dn100-pn16.md, mass-flow-hopper-screw-feeder.md, ribbon-blender-proportions.md
          y arpn-stirred-tank-rushton.pdf. NINGUNA cubre bombas verticales de turbina.
      (2) Barrido sobre TODO `research/sources/` con
          `rg -il 'turbina vertical|vertical turbine|lineshaft|line shaft|bomba de pozo|well pump|VS1|sumergible'`
          → 2 aciertos, ambos ruido léxico (un contenedor euro en B61-storage-dims y extracted/E24.md);
          ninguno habla de bombas.
      Conclusión: las proporciones de este asset son convención de producto, no hoja de datos. Todas
      las cotas van `low` salvo el DN de columna. El HUD lo dice en pantalla ("SIN FICHA — ninguna cota
      certificada") para que nadie tome una medida de aquí para un ajuste real.
    suitability: partial
  - source: "DN150 de la columna — norma RECORDADA, misma etiqueta que usan los assets hermanos"
    evidences: >
      [CERT-a] Tubo DN150 tiene OD 168.3 mm. Es el mismo tipo de valor que fluidos/valvula-motorizada y
      fluidos/medidor-flujo declaran para DN100 (OD 114.3 mm): norma recordada, SIN página preservada
      en `research/sources/`, y por eso `med` y no `high`. El modelo lleva OD 0.168 m exactos; la
      diferencia con la norma es 0.3 mm, un orden por debajo del vóxel de blockout (50 mm) y por debajo
      de cualquier umbral visible, así que se documenta en vez de retocarse.
      REVERIFICAR contra tabla antes de usar este asset para comprobaciones de ajuste o choque.
    suitability: partial

dimensions_real:
  # Todas [INFER] salvo lo indicado. El sujeto completo mide 4.89 m: NO es una estimación, es el
  # bounding box mundo medido sobre la escena (mín -0.02 m en el colador, máx 4.89 m en el cono del
  # motor). El HUD declaraba 4.67 m y era falso; ver critical_features/encuadre-completo.
  total_height_m:      {value: 4.890, confidence: high}   # [CERT] medido: bbox mundo del root
  bowl_od_m:           {value: 0.260, confidence: low}    # [INFER] Ø de tazones
  stages:              {value: 3,     confidence: low}    # [INFER] 3 etapas
  stage_height_m:      {value: 0.280, confidence: low}    # [INFER]
  bowl_stack_span_m:   {value: [0.30, 1.14], confidence: low}
  suction_bell_span_m: {value: [0.05, 0.30], confidence: low}
  strainer_od_m:       {value: 0.307, confidence: low}    # [INFER] colador de succión
  column_od_m:         {value: 0.168, confidence: med}    # [CERT-a] DN150 (ver references)
  column_span_m:       {value: [1.14, 3.30], confidence: low}
  column_joint_y_m:    {value: 2.220, confidence: low}    # [INFER] junta bridada intermedia
  lineshaft_od_m:      {value: 0.038, confidence: low}    # [INFER] eje lineal
  shaft_bearings:      {value: 2,     confidence: low}    # [INFER] arañas a 1.74 y 2.64 m
  impeller_blades:     {value: 18,    confidence: low}    # [INFER] 6 por etapa, instanciados
  head_span_m:         {value: [3.30, 3.95], confidence: low}   # cabezal de descarga
  discharge_axis_y_m:  {value: 3.600, confidence: low}    # [INFER] eje de la boca lateral
  discharge_od_m:      {value: 0.168, confidence: low}    # [INFER] boca al mismo DN que la columna
  discharge_reach_m:   {value: 0.410, confidence: low}    # [INFER] cara de brida desde el eje
  discharge_bolts:     {value: 8,     confidence: low}    # [INFER] instanciados
  motor_od_m:          {value: 0.420, confidence: low}    # [INFER] motor vertical de eje hueco
  motor_body_span_m:   {value: [4.03, 4.75], confidence: low}
  well_casing_id_m:    {value: 0.480, confidence: low}    # [INFER] casing del pozo (CONTEXTO)
  water_level_y_m:     {value: 2.050, confidence: low}    # [INFER] nivel dinámico (CONTEXTO)

hierarchy:
  - name: root
    children:
      - name: envelope        # 5 cuerpos de fundición creados por shellPair (campana + 3 tazones + columna)
        pivot: [0, 0, 0]
        animation: none
      - name: hydraulics      # eje lineal + 3 cubos de impulsor + 18 álabes instanciados + 2 arañas
        pivot: [0, 0, 0]      # SIEMPRE presente: es lo que el corte debe dejar ver, no algo que aparece
        animation: none
      - name: head            # cabezal de descarga, brida de montaje, boca lateral, 8 pernos, placa
        pivot: [0, 0, 0]
        animation: none
      - name: motor           # pedestal, cuerpo, 10 aletas, cono superior, caja de bornes (togglable)
        pivot: [0, 0, 0]
        animation: none
      - name: well            # casing seccionado + columna de agua + disco de nivel (togglable, CONTEXTO)
        pivot: [0, 0, 0]
        animation: none
      - name: cut             # las 5 MITADES que sustituyen a envelope en CORTE (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: cast-iron-paint
    family: painted-metal
    color: "#35566b"
    metalness: 0.0             # fundición PINTADA -> dieléctrico
    roughness: 0.50
    evidence: "HANDBOOK §3.1 pintado/recubierto 0.0-0.05 — tazones, campana y columna"
    confidence: 0.8
  - id: head-paint
    family: painted-metal
    color: "#2c4a5c"
    metalness: 0.0
    roughness: 0.48
    evidence: >
      HANDBOOK §3.1 — el cabezal va un valor más oscuro que el cuerpo sumergido a propósito: es la
      pieza que queda a la vista sobre el brocal y separa visualmente la máquina del pozo.
    confidence: 0.78
  - id: lineshaft-steel
    family: bare-metal
    color: "#c8ccd0"
    metalness: 0.93
    roughness: 0.26
    evidence: "HANDBOOK §3.1 metal desnudo 0.9-1.0 — eje lineal rectificado"
    confidence: 0.85
  - id: impeller-bronze
    family: bare-metal
    color: "#b08b3e"
    metalness: 0.90
    roughness: 0.34
    evidence: >
      HANDBOOK §3.1 metal desnudo. El bronce es la señal de lectura del estado CORTE: contra el azul
      de la fundición, los 3 rodetes se identifican de un vistazo. Sin ese contraste el corte enseña
      geometría pero no COMUNICA cuántas etapas hay.
    confidence: 0.8
  - id: flange-steel
    family: bare-metal
    color: "#a9aeb3"
    metalness: 0.92
    roughness: 0.44
    evidence: "HANDBOOK §3.1 — caras mecanizadas de brida, más mate que el eje"
    confidence: 0.8
  - id: motor-paint
    family: painted-metal
    color: "#445a6b"
    metalness: 0.0
    roughness: 0.52
    evidence: "HANDBOOK §3.1 pintado — carcasa de motor vertical de eje hueco"
    confidence: 0.78
  - id: well-casing
    family: concrete
    color: "#6b6f74"
    metalness: 0.0
    roughness: 0.85
    evidence: >
      [INFER] Casing del pozo, renderizado DoubleSide y ya seccionado a media caña: es CONTEXTO, no
      equipo. Sin DoubleSide su pared interior no se dibuja, que es justo la cara que da profundidad
      al pozo.
    confidence: 0.7
  - id: well-water
    family: liquid
    color: "#bfe6f5"
    metalness: 0.0
    roughness: 0.10
    evidence: >
      [INFER] transmission 0.80 con opacity 0.35, no 0.96: a transmisión alta el agua desaparece del
      render (gotcha del ONBOARD) y el nivel dinámico —que es la razón de ser de una bomba de pozo—
      dejaría de leerse.
    confidence: 0.7

critical_features:
  - id: salvaguarda-shellpair
    desc: >
      LO QUE SE OCULTA Y LO QUE SE REPONE SON LA MISMA LLAMADA. Cada cuerpo de envolvente se crea con
      `shellPair(r0,r1,h,y)`, que fabrica la pieza ENTERA y su MEDIA exacta con los mismos parámetros
      y las registra en las dos listas (solidParts / cut). No son dos listas escritas a mano, así que
      no pueden divergir: es la contraparte de CONSTRUCCIÓN del defecto que la auditoría encontró en
      utilities/suavizador-agua (medio casco repuesto -> cabezal flotando con 0.117 m de hueco) y en
      fluidos/medidor-flujo (conos completos ocultos, medio cuerpo repuesto).
      VALIDADO POR MEDICIÓN, no por el comentario del código: 5 piezas de envolvente en AMBOS estados,
      span idéntico [0.05, 3.30] m, y los 4 huecos entre piezas consecutivas = 0.00000 m en los dos
      (criterio del ONBOARD: continuidad = hueco <= 0).
      Y la medición DISCRIMINA, que es la otra mitad de la regla: en estado por defecto las 5 piezas
      son thetaLength 2pi (WHOLE) y en CORTE son thetaLength pi (HALF), con los 5 uuid completamente
      disjuntos entre estados. O sea que la igualdad de las cotas es un resultado real y no una sonda
      que agarró la misma malla dos veces.
    threshold: 0.85
  - id: encuadre-completo
    desc: >
      EL GATE NO VE EL ENCUADRE. Una versión anterior bajaba el sujeto para que no chocara con el HUD y
      dejaba el MOTOR FUERA DEL CUADRO por arriba, con el gate en verde (ready true, 0 excepciones,
      conteos correctos). Medido proyectando la bbox mundo a NDC: el grupo del motor daba ndcY 1.172,
      o sea 0.38 m de máquina recortados. El mismo encuadre publicaba en el HUD "altura total 4.67 m"
      sobre un sujeto de 4.89 m: un número en pantalla que nadie comparaba con la escena.
      REGLA QUE DEJA ESTE ASSET: el sujeto no se recorta para hacerle sitio al texto — se encuadra
      entero y es el HUD el que se acorta. Corregido a R 8.0 con objetivo en 2.44 m (el centro real del
      sujeto, no un valor elegido a ojo) y líneas de HUD cortas para que el texto no cruce la columna
      central. Verificado tras el fix: bbox del root en ndcY [-0.896, 0.925] y ndcX [-0.075, 0.090],
      ningún grupo fuera de [-1, 1]. CHEQUEO BARATO Y REPRODUCIBLE para cualquier asset: proyectar la
      bbox mundo del root a NDC y exigir |ndc| <= 1; el PNG a ojo no discrimina un recorte pequeño.
    threshold: 0.85
  - id: hidraulica-de-3-etapas
    desc: >
      El estado CORTE es el asset. Deja ver el eje lineal entero, los 3 rodetes de bronce dentro de sus
      tazones y las 2 arañas de cojinete que guían el eje en la columna. Sin él, una bomba de turbina
      vertical es un tubo con un motor encima e indistinguible de una columna cualquiera. La hidráulica
      NO aparece con el corte: está construida siempre presente y es la envolvente la que se abre.
    threshold: 0.80
  - id: pozo-como-contexto
    desc: >
      El casing y el nivel dinámico de agua explican POR QUÉ la máquina tiene esta forma: la hidráulica
      trabaja sumergida y el motor vive fuera del líquido, a 4 m por encima. Es CONTEXTO y por eso es
      togglable (POZO) y ya viene seccionado a media caña — un casing cerrado taparía el sujeto entero.
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 120
    tris: 25000
  measured:             # captura headless SwiftShader 1280x800 — los CONTEOS valen, el frame time NO
    draws: 86
    tris: 5612
    geometries: 43
    root_meshes: 46
    # Antes del fix de encuadre eran 84 draws / 5452 tris. La subida es la consecuencia coherente de
    # meter el motor entero dentro del frustum: geometría que antes se descartaba por culling.

camera:
  azimuth_deg: 49.3       # AZ 0.86 rad
  elevation_deg: 5.2      # EL 0.09 rad — sujeto muy alto: elevación baja o el escorzo lo aplasta
  fov: 38
  target_y_m: 2.44        # centro real del sujeto (bbox -0.02..4.89), no un valor a ojo
  radius_m: 8.0

lighting: house-rig + fill lateral
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DESVIACIÓN DOCUMENTADA: el eje y las camisas son metal DESNUDO sobre cilindros VERTICALES. Una cara
  # vertical no puede recibir el especular de una luz elevada (la geometría de reflexión lo impide a
  # cualquier altura de cámara), así que el brillo lo da el IBL: environmentIntensity 2.4. El fill
  # lateral (0.9) solo aporta al término DIFUSO de la fundición pintada. Metalness/roughness sin tocar
  # (HANDBOOK §3.1): bajar metalness para "arreglar" el gris plano es el error que el ONBOARD prohíbe.

ui_controls:
  - "AUTO-ROTATE"
  - "CORTE HIDRÁULICO"    # 5 envolventes -> sus 5 mitades; deja ver eje, rodetes y arañas
  - "POZO"                # casing + agua + nivel (contexto), encendido por defecto
  - "MOTOR"               # motor vertical de eje hueco, encendido por defecto

colorTarget:
  # MEDIDO sobre el cabezal de descarga en la captura headless SwiftShader 1280x800, en la banda
  # y 180-212 que está LIMPIA (por encima de donde asoma la boca de descarga, que a partir de y 214
  # contamina el barrido con otra pieza). Parche más plano hallado por barrido de ventanas 6x24:
  # desviación media por canal 2.53. Ventana estrecha a propósito: el cabezal es un cilindro de solo
  # ~42 px de ancho con un lóbulo especular, y una ventana ancha mide el GRADIENTE, no el color.
  # No es un valor estimado ni tomado del material fuente.
  srgb: [37, 71, 94]
  deltaE00Max: 8
  crop: "6x24+642+180"
