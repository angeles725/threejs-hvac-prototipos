<!doctype html>
<!--
  CATALOG ASSET — fluidos/skid-hidroneumatico · grupo de presurización hidroneumático (2 bombas + tanque
  a membrana). Construido desde disenos/catalog/shell-template.html. Contrato:
  __skidHidroneumaticoApp.runtime + __qaRenderInfo + data-app-ready, render-on-demand, sombras
  congeladas (autoUpdate=false, 1024), DPR<=2.

  SALVAGUARDA ESTRUCTURAL CONTRA EL DEFECTO DE CORTE (heredada de fluidos/bomba-vertical-pozo, y antes
  de utilities/suavizador-agua y fluidos/medidor-flujo): la envolvente del tanque se crea con
  shellCyl()/shellCap(), que fabrican la pieza ENTERA y su MEDIA exacta en la MISMA llamada y las
  registran en las dos listas. "Lo que se oculta" y "lo que se repone" no son dos listas escritas a
  mano, así que no pueden divergir.

  POR QUÉ ESTE ASSET NO ES "SIN FICHA": las bombas son EN 733 y sus cotas ya están establecidas con
  ficha real en fluidos/bomba-centrifuga ([CERT-doc]); las válvulas de mariposa wafer DN100 PN16 y la
  envolvente del recipiente a presión de 500 L salen del corpus preservado. Ver design-spec.yaml.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skid hidroneumático de presurización — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">SKID HIDRONEUMÁTICO — 2 bombas + tanque a membrana</div>
  <div><span class="pass">PASS: MATERIALS</span> <span class="dim">· acero pintado · colectores desnudos</span></div>
  <div><span class="dim">patín 2.30 × 1.05 m · tanque 500 L Ø 0.60 × 2.185 m</span></div>
  <div><span class="dim">bombas EN 733 65/160 · colectores DN100 PN16</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnCut">CORTE DEL TANQUE</button>
  <button id="btnTab" class="on">TABLERO</button>
  <button id="btnMan" class="on">COLECTORES</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- dimensiones (design-spec.yaml) ----------
// Patín
const SKID_X = 2.30, SKID_Z = 1.05, SKID_H = 0.14;   // [INFER] dimensionado para alojar ambos trenes
const DECK = SKID_H;                                  // cara superior del patín
// Bombas EN 733 65/160 — [CERT-doc] heredado de fluidos/bomba-centrifuga
const SHAFT_Y = DECK + 0.200;        // h2: eje sobre la cara inferior de la placa base
const VOL_R = 0.145, VOL_W = 0.105;  // voluta
const IMP_D = 0.160;                 // el "160" de 65/160 ES el rodete
const SUC_OD = 0.0889, DIS_OD = 0.0761;              // DN80 / DN65
const FLG_DN80 = 0.200, FLG_DN65 = 0.185;            // EN 1092-2 PN16
const MOT_D = 0.300, MOT_L = 0.620;                  // IEC 160
const PUMP_X = -0.62;                                 // eje de voluta de ambas bombas
const PUMP_Z = 0.26;                                  // duty/standby LADO A LADO (la succión es AXIAL:
                                                      // en línea, la boca de una queda dentro del motor
                                                      // de la otra — gotcha de disposición imposible)
// Colectores DN100 PN16
const MAN_OD = 0.1143, FLG_DN100 = 0.220;
const SUC_MAN_X = -1.02, SUC_MAN_Y = DECK + 0.16;
const DIS_MAN_Y = 0.95;
// Tanque a membrana 500 L — envolvente [CERT-a], ver design-spec
const TK_X = 0.85, TK_R = 0.300, TK_LEG = 0.337, TK_HEAD = 0.116, TK_SHELL = 1.616;
const TK_Y0 = DECK + TK_LEG;                 // arranque del fondo bombeado
const TK_SHELL_Y0 = TK_Y0 + TK_HEAD;         // arranque de la virola
const TK_SHELL_Y1 = TK_SHELL_Y0 + TK_SHELL;  // fin de la virola
const TK_TOP = TK_SHELL_Y1 + TK_HEAD;        // 2.325 desde el suelo = 2.185 desde la cara del patín
const WATER_Y = TK_SHELL_Y0 + TK_SHELL*0.52; // nivel de agua dentro de la membrana
const DROP_X = TK_X - TK_R - 0.12;           // el montante baja FUERA de la envolvente del tanque
const TIE_Y  = 0.30;                         // tramo de amarre bajo el fondo bombeado

// ---------- escena / renderer / cámara ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 12, 34);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));           // block54 §5-b: tope de DPR
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                          // block54 §5-d: sombra estática congelada
document.body.appendChild(renderer.domElement);

// El sujeto es ANCHO (2.4 m) y ALTO (2.33 m) a la vez: el encuadre se verifica proyectando la bbox
// mundo del root a NDC y exigiendo |ndc| <= 1, no mirando el PNG (el gate no ve el encuadre).
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 4.95, AZ = 0.82, EL = 0.20, TGT_Y = 1.12;
camera.position.set(R*Math.cos(AZ)*Math.cos(EL), TGT_Y + R*Math.sin(EL), R*Math.sin(AZ)*Math.cos(EL));
camera.lookAt(0, TGT_Y, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, TGT_Y, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 2.3;   // colectores y bridas son metal DESNUDO en cilindros: el especular
                                    // lo da el IBL, no una luz de relleno (ONBOARD / familia fluidos)

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
sun.shadow.camera.left=-3; sun.shadow.camera.right=3; sun.shadow.camera.top=4; sun.shadow.camera.bottom=-3;
scene.add(sun);
// El fill lateral solo aporta al término DIFUSO del acero pintado.
const fill = new THREE.DirectionalLight(0xf2f6ff, 0.9);
fill.position.set(-3, 3.5, 6);
scene.add(fill);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONA 1 — MATERIALES. HANDBOOK §3.1: metalness casi BINARIO. Pintado -> 0.0 (dieléctrico);
// desnudo -> ~0.9. Nada intermedio en superficie lisa sin textura.
// ============================================================================
const matSkid  = new THREE.MeshStandardMaterial({ color:0x2b3440, metalness:0.0,  roughness:0.62 });
const matPump  = new THREE.MeshStandardMaterial({ color:0x2f6a86, metalness:0.0,  roughness:0.46 });
const matMotor = new THREE.MeshStandardMaterial({ color:0x445a6b, metalness:0.0,  roughness:0.52 });
const matTank  = new THREE.MeshStandardMaterial({ color:0x35566b, metalness:0.0,  roughness:0.50 });
const matPipe  = new THREE.MeshStandardMaterial({ color:0xb8bdc1, metalness:0.92, roughness:0.38 });
const matFlg   = new THREE.MeshStandardMaterial({ color:0xa9aeb3, metalness:0.92, roughness:0.44 });
const matBolt  = new THREE.MeshStandardMaterial({ color:0x9aa0a5, metalness:0.92, roughness:0.40 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x22262b, metalness:0.0,  roughness:0.55 });
const matValve = new THREE.MeshStandardMaterial({ color:0x8d5a2b, metalness:0.0,  roughness:0.48 });
const matPanel = new THREE.MeshStandardMaterial({ color:0x3d4a55, metalness:0.0,  roughness:0.44 });
const matHmi   = new THREE.MeshStandardMaterial({ color:0x0a1a16, metalness:0.0,  roughness:0.30,
                                                  emissive:0x0a3d33, emissiveIntensity:1.0 });
// Membrana de butilo: elastómero, DIELÉCTRICO. DoubleSide porque el corte enseña su cara interior.
const matMemb  = new THREE.MeshStandardMaterial({ color:0x1c1f24, metalness:0.0,  roughness:0.80,
                                                  side:THREE.DoubleSide });
const matWater = new THREE.MeshPhysicalMaterial({ color:0xbfe6f5, metalness:0.0, roughness:0.10,
                                                  transmission:0.78, thickness:0.20, ior:1.33,
                                                  transparent:true, opacity:0.38, side:THREE.DoubleSide });
const matTag   = new THREE.MeshStandardMaterial({ color:0xe6e9eb, metalness:0.0,  roughness:0.5 });

// ============================================================================
// ZONA 2 — GEOMETRÍA
// ============================================================================
const root = new THREE.Group();
const dummy = new THREE.Object3D();
const cut = new THREE.Group();          // mitades del tanque: se muestran en CORTE
const solidParts = [];                  // enteras: se ocultan en CORTE
const manifolds = new THREE.Group();    // colectores + válvulas (togglable)
const cabinet = new THREE.Group();      // tablero (togglable)

const box = (parent,w,h,d,mat,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); parent.add(m); return m; };
const cyl = (parent, r0, r1, h, seg, mat, x,y,z, rx=0, rz=0, open=false)=>{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg, 1, open), mat);
  m.castShadow = m.receiveShadow = true; m.position.set(x,y,z); m.rotation.set(rx,0,rz);
  parent.add(m); return m;
};
// Brida: un ANILLO real. Un cilindro macizo aquí es correcto porque la brida NO rodea una boca abierta;
// donde hay que dejar ver el interior (tapas, sellos) el ONBOARD exige Ring/Torus, y así se hace abajo.
const flange = (parent, od, x,y,z, axis='x')=>{
  const rx = axis==='y' ? 0 : (axis==='x' ? 0 : Math.PI/2);
  const rz = axis==='x' ? Math.PI/2 : 0;
  return cyl(parent, od/2, od/2, 0.022, 20, matFlg, x,y,z, rx, rz);
};

// --- shellCyl / shellCap — LA salvaguarda, en sus dos formas -----------------------------------
// Una sola llamada produce la pieza entera y su media exacta y las registra en las dos listas. Si
// alguien añade una envolvente nueva usando esto, es imposible que el corte retire más de lo que
// repone: son la misma llamada, no dos listas paralelas.
// ENVOLVENTES CONCÉNTRICAS: el casco NO es la única. La membrana es una segunda envolvente cerrada,
// así que cortar solo el casco deja ver el EXTERIOR de la membrana — un interior tapado por otro
// cuerpo, que es la trampa de la "tapa invisible" con un cuerpo más. Por eso el mismo par se aplica a
// las DOS, y por eso los helpers reciben material: la disciplina no es del tanque, es de la envolvente.
function shellCyl(r, h, y, mat = matTank, seg = 30, openEnded = false){
  const whole = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg, 1, openEnded), mat);
  whole.castShadow = whole.receiveShadow = true; whole.position.set(TK_X, y, 0);
  root.add(whole); solidParts.push(whole);
  const halfMat = mat.clone(); halfMat.side = THREE.DoubleSide;
  const half = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg, 1, true, Math.PI*0.5, Math.PI), halfMat);
  half.castShadow = true; half.position.set(TK_X, y, 0);
  cut.add(half);
  return { whole, half };
}
// Fondo/tapa bombeados: casquete esférico ESCALADO en Y para clavar la profundidad Klöpper (0.1935 D).
// `up=true` = tapa superior; `up=false` = fondo. La media usa phiLength PI, igual que el cilindro.
function shellCap(r, depth, yBase, up, mat = matTank, seg = 30){
  const mk = (phiLen)=> new THREE.SphereGeometry(r, seg, 12, Math.PI*0.5, phiLen,
                                                 up ? 0 : Math.PI*0.5, Math.PI*0.5);
  const place = (m)=>{
    m.scale.set(1, depth / r, 1);                      // esfera -> casquete de profundidad Klöpper
    m.position.set(TK_X, up ? yBase : yBase + depth, 0);
    m.castShadow = true;
  };
  const whole = new THREE.Mesh(mk(Math.PI*2), mat);
  whole.receiveShadow = true; place(whole); root.add(whole); solidParts.push(whole);
  const halfMat = mat.clone(); halfMat.side = THREE.DoubleSide;
  const half = new THREE.Mesh(mk(Math.PI), halfMat); place(half); cut.add(half);
  return { whole, half };
}

// --- patín: dos largueros en U, tres travesaños, cuatro cartelas de anclaje ---
{
  for(const z of [-SKID_Z/2 + 0.06, SKID_Z/2 - 0.06]){
    box(root, SKID_X, SKID_H, 0.12, matSkid, 0, SKID_H/2, z);
    box(root, SKID_X, 0.014, 0.05, matSkid, 0, SKID_H - 0.007, z + 0.035);   // ala superior de la U
  }
  for(const x of [-SKID_X/2 + 0.09, 0, SKID_X/2 - 0.09])
    box(root, 0.09, SKID_H*0.8, SKID_Z - 0.12, matSkid, x, SKID_H*0.4, 0);
  const padGeo = new THREE.BoxGeometry(0.16, 0.018, 0.16);
  const pads = new THREE.InstancedMesh(padGeo, matSkid, 4);
  pads.castShadow = pads.receiveShadow = true;
  let pi = 0;
  for(const x of [-SKID_X/2 + 0.10, SKID_X/2 - 0.10]) for(const z of [-SKID_Z/2 + 0.06, SKID_Z/2 - 0.06]){
    dummy.position.set(x, 0.009, z); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    pads.setMatrixAt(pi++, dummy.matrix);
  }
  pads.instanceMatrix.needsUpdate = true; root.add(pads);
}

// --- 2 bombas EN 733 65/160, DUTY/STANDBY LADO A LADO ---
const buildPump = (z)=>{
  const g = new THREE.Group();
  // placa base + soportes
  box(g, 1.05, 0.040, 0.34, matSkid, PUMP_X + 0.28, DECK + 0.020, z);
  // voluta (eje X) + su tapa de aspiración
  cyl(g, VOL_R, VOL_R, VOL_W, 26, matPump, PUMP_X, SHAFT_Y, z, 0, Math.PI/2);
  cyl(g, VOL_R*0.62, VOL_R*0.62, 0.05, 20, matPump, PUMP_X - VOL_W/2 - 0.025, SHAFT_Y, z, 0, Math.PI/2);
  // boca de ASPIRACIÓN axial DN80 hacia -X (por esto las bombas van lado a lado)
  cyl(g, SUC_OD/2, SUC_OD/2, 0.16, 18, matPipe, PUMP_X - 0.13, SHAFT_Y, z, 0, Math.PI/2);
  flange(g, FLG_DN80, PUMP_X - 0.21, SHAFT_Y, z, 'x');
  // boca de IMPULSIÓN DN65 vertical hacia arriba + montante hasta el colector
  cyl(g, DIS_OD/2, DIS_OD/2, 0.16, 18, matPipe, PUMP_X, SHAFT_Y + VOL_R + 0.06, z);
  flange(g, FLG_DN65, PUMP_X, SHAFT_Y + VOL_R + 0.15, z, 'y');
  // linterna + motor IEC 160 + capota de ventilador
  cyl(g, 0.075, 0.075, 0.14, 16, matPump, PUMP_X + VOL_W/2 + 0.07, SHAFT_Y, z, 0, Math.PI/2);
  cyl(g, MOT_D/2, MOT_D/2, MOT_L, 24, matMotor, PUMP_X + VOL_W/2 + 0.14 + MOT_L/2, SHAFT_Y, z, 0, Math.PI/2);
  {                                                        // aletas de refrigeración
    // Instancing (block54 §2.3): 10 aletas idénticas por motor son repetición REAL -> 1 draw en vez
    // de 10. En las piezas únicas de este asset (voluta, cabezal, tanque) no aplica y no se fuerza.
    const finGeo = new THREE.BoxGeometry(MOT_L*0.80, 0.012, 0.045);
    const fins = new THREE.InstancedMesh(finGeo, matMotor, 10);
    fins.castShadow = fins.receiveShadow = true;
    for(let i=0;i<10;i++){
      const a = (i/10)*Math.PI*2;
      dummy.position.set(PUMP_X + VOL_W/2 + 0.14 + MOT_L/2,
                         SHAFT_Y + Math.cos(a)*(MOT_D/2 + 0.020), z + Math.sin(a)*(MOT_D/2 + 0.020));
      dummy.rotation.set(a, 0, 0); dummy.updateMatrix();
      fins.setMatrixAt(i, dummy.matrix);
    }
    fins.instanceMatrix.needsUpdate = true; g.add(fins);
  }
  cyl(g, MOT_D/2*0.86, MOT_D/2*0.72, 0.13, 20, matDark,
      PUMP_X + VOL_W/2 + 0.14 + MOT_L + 0.065, SHAFT_Y, z, 0, Math.PI/2);
  box(g, 0.15, 0.11, 0.13, matDark, PUMP_X + VOL_W/2 + 0.32, SHAFT_Y + MOT_D/2 + 0.05, z);  // bornera
  box(g, 0.09, 0.05, 0.005, matTag, PUMP_X + 0.02, SHAFT_Y - 0.02, z + VOL_W/2 + 0.003);    // placa
  return g;
};
const pumps = new THREE.Group();
pumps.add(buildPump(+PUMP_Z));
pumps.add(buildPump(-PUMP_Z));
root.add(pumps);

// --- colectores DN100 + tren de válvulas (togglable) ---
{
  // ASPIRACIÓN: cabezal transversal + una derivación por bomba, con mariposa wafer DN100
  cyl(manifolds, MAN_OD/2, MAN_OD/2, SKID_Z - 0.05, 22, matPipe, SUC_MAN_X, SUC_MAN_Y, 0, Math.PI/2, 0);
  flange(manifolds, FLG_DN100, SUC_MAN_X, SUC_MAN_Y, -(SKID_Z - 0.05)/2, 'z');
  for(const z of [+PUMP_Z, -PUMP_Z]){
    cyl(manifolds, MAN_OD/2, MAN_OD/2, 0.30, 18, matPipe, SUC_MAN_X + 0.15, SUC_MAN_Y, z, 0, Math.PI/2);
    cyl(manifolds, MAN_OD/2, MAN_OD/2, (SHAFT_Y - SUC_MAN_Y), 18, matPipe,
        SUC_MAN_X + 0.30, (SUC_MAN_Y + SHAFT_Y)/2, z);
    cyl(manifolds, SUC_OD/2, SUC_OD/2, 0.28, 18, matPipe, SUC_MAN_X + 0.44, SHAFT_Y, z, 0, Math.PI/2);
    // válvula de mariposa WAFER: cuerpo corto entre dos bridas + actuador de palanca
    cyl(manifolds, MAN_OD/2 + 0.018, MAN_OD/2 + 0.018, 0.052, 20, matValve,
        SUC_MAN_X + 0.15, SUC_MAN_Y, z, 0, Math.PI/2);
    box(manifolds, 0.05, 0.16, 0.05, matValve, SUC_MAN_X + 0.15, SUC_MAN_Y + 0.13, z);
    box(manifolds, 0.03, 0.03, 0.20, matDark, SUC_MAN_X + 0.15, SUC_MAN_Y + 0.21, z + 0.06);
  }
  // IMPULSIÓN: cabezal transversal sobre las bombas + montantes con retención
  cyl(manifolds, MAN_OD/2, MAN_OD/2, SKID_Z + 0.10, 22, matPipe, PUMP_X, DIS_MAN_Y, 0, Math.PI/2, 0);
  for(const z of [+PUMP_Z, -PUMP_Z]){
    cyl(manifolds, DIS_OD/2, DIS_OD/2, DIS_MAN_Y - (SHAFT_Y + VOL_R + 0.15), 18, matPipe,
        PUMP_X, (DIS_MAN_Y + SHAFT_Y + VOL_R + 0.15)/2, z);
    cyl(manifolds, DIS_OD/2 + 0.020, DIS_OD/2 + 0.020, 0.09, 18, matValve,
        PUMP_X, SHAFT_Y + VOL_R + 0.30, z);                                  // retención
    cyl(manifolds, DIS_OD/2 + 0.016, DIS_OD/2 + 0.016, 0.06, 18, matValve,
        PUMP_X, DIS_MAN_Y - 0.13, z);                                        // seccionamiento
  }
  // Línea principal al tanque. Baja ANTES del recipiente y entra por su boca INFERIOR: un montante
  // sobre el EJE del tanque quedaría metido DENTRO de la envolvente — disposición físicamente
  // imposible, y de las que ningún conteo ve (gotcha del ONBOARD, cazado abriendo el PNG).
  cyl(manifolds, MAN_OD/2, MAN_OD/2, DROP_X - PUMP_X, 22, matPipe,
      (PUMP_X + DROP_X)/2, DIS_MAN_Y, 0, 0, Math.PI/2);
  cyl(manifolds, MAN_OD/2, MAN_OD/2, DIS_MAN_Y - TIE_Y, 22, matPipe, DROP_X, (DIS_MAN_Y + TIE_Y)/2, 0);
  cyl(manifolds, MAN_OD/2, MAN_OD/2, TK_X - DROP_X, 22, matPipe, (DROP_X + TK_X)/2, TIE_Y, 0, 0, Math.PI/2);
  flange(manifolds, FLG_DN100, PUMP_X, DIS_MAN_Y, (SKID_Z + 0.10)/2, 'z');
  // instrumentación en el cabezal de impulsión: transmisor + manómetro
  cyl(manifolds, 0.020, 0.020, 0.10, 12, matPipe, PUMP_X + 0.34, DIS_MAN_Y + 0.07, 0);
  cyl(manifolds, 0.045, 0.045, 0.05, 16, matDark, PUMP_X + 0.34, DIS_MAN_Y + 0.14, 0);
  cyl(manifolds, 0.020, 0.020, 0.09, 12, matPipe, PUMP_X + 0.52, DIS_MAN_Y + 0.06, 0);
  cyl(manifolds, 0.038, 0.038, 0.022, 16, matTag, PUMP_X + 0.52, DIS_MAN_Y + 0.12, 0);
  // pernos de las 3 bridas de conexión a obra (repetición real -> un solo batch)
  {
    const geo = new THREE.CylinderGeometry(0.008, 0.008, 0.048, 6);
    const im = new THREE.InstancedMesh(geo, matBolt, 24);
    im.castShadow = true;
    const seats = [ [SUC_MAN_X, SUC_MAN_Y, -(SKID_Z - 0.05)/2, 'z'],
                    [PUMP_X, DIS_MAN_Y, (SKID_Z + 0.10)/2, 'z'],
                    [TK_X, TIE_Y + 0.11, 0, 'y'] ];
    let bi = 0;
    for(const [sx, sy, sz] of seats) for(let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2 + Math.PI/8, pcd = 0.090;
      if(bi < 16){ dummy.position.set(sx + Math.cos(a)*pcd, sy + Math.sin(a)*pcd, sz); dummy.rotation.set(Math.PI/2,0,0); }
      else       { dummy.position.set(sx + Math.cos(a)*pcd, sy, sz + Math.sin(a)*pcd); dummy.rotation.set(0,0,0); }
      dummy.updateMatrix(); im.setMatrixAt(bi++, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true; manifolds.add(im);
  }
}
root.add(manifolds);

// --- tanque a membrana 500 L: 3 patas + fondo bombeado + virola + tapa bombeada ---
{
  for(let i=0;i<3;i++){
    const a = (i/3)*Math.PI*2 + Math.PI/6;
    box(root, 0.055, TK_LEG, 0.055, matTank,
        TK_X + Math.cos(a)*(TK_R - 0.05), DECK + TK_LEG/2, Math.sin(a)*(TK_R - 0.05));
  }
  shellCap(TK_R, TK_HEAD, TK_Y0, false);        // fondo bombeado (Klöpper)
  shellCyl(TK_R, TK_SHELL, (TK_SHELL_Y0 + TK_SHELL_Y1)/2);
  shellCap(TK_R, TK_HEAD, TK_SHELL_Y1, true);   // tapa bombeada (Klöpper)
  // costura de virola, siempre visible (no es envolvente que se corte)
  cyl(root, TK_R + 0.006, TK_R + 0.006, 0.014, 30, matTank, TK_X, TK_SHELL_Y0 + TK_SHELL*0.5, 0);
  // válvula de precarga de aire en la tapa + placa de datos
  cyl(root, 0.016, 0.016, 0.07, 10, matPipe, TK_X, TK_TOP + 0.03, 0);
  cyl(root, 0.026, 0.026, 0.02, 12, matDark, TK_X, TK_TOP + 0.075, 0);
  box(root, 0.12, 0.07, 0.005, matTag, TK_X + TK_R*0.72, TK_SHELL_Y0 + 0.75, TK_R*0.66);
  // boca de conexión inferior: por aquí entra Y sale el agua (un tanque a membrana tiene UNA sola
  // conexión hidráulica; dos bocas serían un acumulador de paso, que es otro equipo).
  cyl(root, MAN_OD/2, MAN_OD/2, TK_Y0 - TIE_Y, 18, matPipe, TK_X, (TK_Y0 + TIE_Y)/2, 0);
  flange(root, FLG_DN100, TK_X, TIE_Y + 0.11, 0, 'y');
}

// --- interior del tanque -----------------------------------------------------------------------
// La MEMBRANA es una envolvente, no relleno: entra en la MISMA disciplina de pares que el casco.
// Si solo se cortara el casco, el corte enseñaría el exterior negro de la membrana y el tanque se
// leería macizo — el defecto se vio en la captura de estado, no en los conteos (224 draws, exit 0).
// El AGUA, en cambio, va siempre presente sin par: no envuelve nada, y al retirarse las dos mitades
// queda expuesta. Así el corte nunca CREA geometría, solo abre envolventes.
{
  const MR = TK_R - 0.028;                       // membrana de butilo, holgura de precarga
  // La vejiga LLEGA HASTA EL NIVEL, no hasta la tapa: en un tanque a membrana el agua va DENTRO de la
  // vejiga y el aire de precarga FUERA, entre vejiga y casco. Una vejiga a toda altura con el agua a
  // media altura dibujaría aire ENCERRADO dentro de la vejiga, que es el circuito al revés. Lo que
  // se expande y contrae es la vejiga, y por eso su altura ES la lectura del nivel.
  const MEMB_H = WATER_Y - TK_SHELL_Y0;
  shellCap(MR, TK_HEAD, TK_SHELL_Y0 - TK_HEAD, false, matMemb, 28);   // fondo de la vejiga
  shellCyl(MR, MEMB_H, TK_SHELL_Y0 + MEMB_H/2, matMemb, 28, true);
  shellCap(MR, MR*0.34, TK_SHELL_Y0 + MEMB_H, true, matMemb, 28);     // cúpula de la vejiga

  // Agua DENTRO de la membrana (tanque de vejiga: el agua nunca toca el acero) + superficie libre.
  const water = new THREE.Mesh(new THREE.CylinderGeometry(MR - 0.008, MR - 0.008,
                               WATER_Y - TK_SHELL_Y0, 28, 1, true), matWater);
  water.position.set(TK_X, (TK_SHELL_Y0 + WATER_Y)/2, 0); root.add(water);
  // Superficie libre como DISCO fino: es el nivel, no una tapa (regla de la tapa invisible).
  const surf = new THREE.Mesh(new THREE.CircleGeometry(MR - 0.008, 28), matWater);
  surf.rotation.x = -Math.PI/2; surf.position.set(TK_X, WATER_Y, 0); root.add(surf);
  // Tubo de conexión interior desde la boca inferior hasta la vejiga
  cyl(root, 0.030, 0.030, TK_HEAD + 0.06, 12, matPipe, TK_X, TK_Y0 + TK_HEAD/2, 0);
}

// --- tablero de control (togglable): dos postes + gabinete + HMI ---
{
  const PX = -0.30, PZ = -SKID_Z/2 - 0.10;
  for(const dx of [-0.24, 0.24]) box(cabinet, 0.055, 0.72, 0.055, matSkid, PX + dx, DECK + 0.36, PZ);
  box(cabinet, 0.62, 0.80, 0.24, matPanel, PX, DECK + 0.72 + 0.40, PZ);
  box(cabinet, 0.60, 0.78, 0.012, matPanel, PX, DECK + 1.12, PZ + 0.126);   // puerta
  box(cabinet, 0.18, 0.13, 0.010, matHmi, PX - 0.14, DECK + 1.30, PZ + 0.134);
  for(let i=0;i<3;i++)                                                       // pilotos
    cyl(cabinet, 0.014, 0.014, 0.012, 10, matHmi, PX + 0.12 + i*0.055, DECK + 1.34, PZ + 0.134, Math.PI/2, 0);
  box(cabinet, 0.05, 0.05, 0.014, matDark, PX + 0.16, DECK + 1.10, PZ + 0.135);  // seccionador
  box(cabinet, 0.66, 0.030, 0.28, matPanel, PX, DECK + 1.53, PZ);               // visera
  box(cabinet, 0.09, 0.05, 0.005, matTag, PX - 0.20, DECK + 0.95, PZ + 0.132);
  root.add(cabinet);
}

cut.visible = false;
root.add(cut);

scene.add(root);
renderer.shadowMap.needsUpdate = true;                          // hornea la sombra congelada una vez

// ============================================================================
// ZONA 3 — UI. El render está GATEADO: cada handler llama requestRender().
// ============================================================================
const btnRot = document.getElementById('btnRot');
const btnCut = document.getElementById('btnCut');
const btnTab = document.getElementById('btnTab');
const btnMan = document.getElementById('btnMan');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
btnCut.onclick = ()=>{ const on = !cut.visible;
  cut.visible = on;
  solidParts.forEach(m=>{ m.visible = !on; });     // 1:1 con las mitades, por construcción
  btnCut.classList.toggle('on', on);
  renderer.shadowMap.needsUpdate = true; requestRender(); };
const toggle = (btn, obj)=>{ btn.onclick = ()=>{ obj.visible = !obj.visible; btn.classList.toggle('on', obj.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); }; };
toggle(btnTab, cabinet);
toggle(btnMan, manifolds);

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

// ---------- render-on-demand (block56) ----------
let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- contrato de QA (no quitar) ----------
globalThis.__skidHidroneumaticoApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__skid-hidroneumaticoApp'] = globalThis.__skidHidroneumaticoApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
