# DesignSpec — industrial security door on an escape route, EN 1125 panic hardware
# Eighth and last asset of the `puertas` family. Evidence: [Block 121] research/threejs-block121.md.
#
# DATASHEET-LESS ASSET. Built under the policy the USER authorised directly in this session's channel
# (the precedent barrera-vehicular set). The rule that policy imposes, and that this spec keeps:
# nothing about the DOOR is written at high confidence, because nothing about the door is published.
# The one exception is the panic hardware, which has a standard.

design: puerta-seguridad
family: puertas
track: threejs
mode: standard
gate_passes: [materials]
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"
p6_comparison: spec-only

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 0,
           material_layers: 1, detail: 2, occlusion: 2, action_readiness: 2}
  tier: simple
  notes: >
    The simplest subject in this family and deliberately so: a leaf, a frame, a hole in a wall and one
    piece of certified hardware. 30 draws / 1,806 tris. occlusion 2 because the whole asset turns on
    whether the opening is a real hole — a leaf hung on a solid wall looks identical shut and reveals
    nothing open. What makes this asset hard is not the geometry, it is the EVIDENCE discipline.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    harness: research/tools/
    catalog_gate: disenos/catalog/tools/
    dimensional_evidence: research/threejs-block121.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — PAINTED steel = dielectric 0.0; the panic bar is the only bare metal"
    sibling_spec: "disenos/catalog/puertas/barrera-vehicular/design-spec.yaml (the datasheet-less precedent this asset follows)"

references:
  - source: "sources/B121-security-door-dims/ekin-en1125-vs-en179 (sha256 94c0311e…, fetched 2026-08-09)"
    evidences: >
      EN 1125 governs panic exit devices operated by a horizontal push or touch bar, for public spaces
      where users may be UNFAMILIAR with the building; EN 179 is the lever/pad device for non-public
      doors. Bar mounting height "900-1100 mm AFF per EN 1125 guidance and manufacturer templates".
      Type A push bar / type B touch bar, classified by a 10-digit code, CE/UKCA marked under the CPR.
      Also: "The actuating portion must extend at least one-half of the door leaf width".
    suitability: pass
    image: none
  - source: "HOPPE BS EN 1125 standards page"
    evidences: "Stated 60% of door leaf width for the actuating portion — CONTRADICTING the preserved source's one-half. Could NOT be preserved: HTTP 403. Its zero-byte file was deleted rather than left on disk pretending to be evidence, so this figure is recorded but NOT citable."
    suitability: reject
  - source: "EN 1125:2008 full text (BSI / iTeh / ANSI webstore)"
    evidences: "The primary text that would settle the bar-length rule. PAYWALLED; not purchased. No primary source was obtained for this asset."
    suitability: reject
  - source: "Intertek EN 1125 summary · rim panic device product pages"
    evidences: "Scope, testing and pricing only. No leaf width/height, no sheet gauge, no frame profile, no hinge specification — the figures this asset actually needs."
    suitability: reject

dimensions_real:
  # NOTHING here about the leaf, frame or wall is certified. Every one is [INFER] at LOW confidence,
  # from generic knowledge of an industrial door. The sources-tried table above is why.
  leaf_w_m:     {value: 0.950, confidence: low}
  leaf_h_m:     {value: 2.050, confidence: low}
  leaf_t_m:     {value: 0.055, confidence: low}
  opening_w_m:  {value: 1.000, confidence: low}
  opening_h_m:  {value: 2.100, confidence: low}
  frame_d_m:    {value: 0.070, confidence: low}
  wall_m:       {value: [4.200, 2.800, 0.200], confidence: low}   # context, not the subject
  # THE ONE EXCEPTION — the hardware has a standard:
  bar_y_m:      {value: 1.000, confidence: med}    # [CERT-a] EN 1125 band 0.900-1.100 m AFF; midpoint
  bar_frac:     {value: 0.60,  confidence: low}    # [UNRESOLVED] preserved source says >=0.50, the
                                                   # unpreservable one said 0.60. Modelled at 0.60
                                                   # BECAUSE THE STRICTER READING SATISFIES BOTH —
                                                   # a stated choice, not a number invented to look sure
  bar_l_m:      {value: 0.570, confidence: low}    # derived: 0.950 x 0.60
  open_angle_deg: {value: 82,  confidence: low}    # [INFER] outward, in the direction of escape travel

hierarchy:
  - name: root
    children:
      - name: wall                     # with the opening CUT OUT (Shape + hole), plus the corridor beyond
        pivot: [0, 0, 0]
        animation: none
      - name: frame                    # welded frame in the opening
        pivot: [0, 0, 0]
        animation: none
      - name: door-leaf
        pivot: [-0.475, 0, 0]          # hinge on the FAR jamb from the review camera
        animation: {channel: "rotation.y", travel_deg: "0..82", direction: outward}
        children:
          - name: panic-bar
            attachment:
              parent_socket: leaf-face
              local_start: [0.190, 1.000, 0.0275]
              local_end:   [0.760, 1.000, 0.0275]
              contact_type: bolted-through
              overlap: 0.012
              gap_tolerance: 0.001
          - name: hinges
            attachment:
              parent_socket: hinge-stile
              local_start: [0.006, 0.320, -0.0375]
              local_end:   [0.006, 1.730, -0.0375]
              contact_type: welded
              embed_depth: 0.008
              gap_tolerance: 0.001
          - name: closer
            attachment:
              parent_socket: leaf-head
              local_start: [0.475, 1.960, 0.0555]
              local_end:   [0.475, 1.960, 0.0795]
              contact_type: bolted
              overlap: 0.010
              gap_tolerance: 0.001
      - name: exit-signage             # WHY this door carries EN 1125 hardware at all
        pivot: [0, 0, 0]
        animation: none
      - name: figure                   # 1.8 m scale reference
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: leaf-painted-steel
    family: painted-metal
    color: "#556472"
    metalness: 0.0
    roughness: 0.52
    evidence: "[INFER] a security door leaf is painted steel; HANDBOOK §3.1 painted = dielectric 0.0. No finish is published for this product"
    source: estimated
    confidence: 0.70   # assumption stated: paint system inferred from product class, not a datasheet
  - id: frame-painted-steel
    family: painted-metal
    color: "#47535e"
    metalness: 0.0
    roughness: 0.50
    evidence: "[INFER] same finish family as the leaf, a half-step darker so the frame separates"
    source: estimated
    confidence: 0.70
  - id: panic-bar-stainless
    family: bare-metal
    color: "#c9ced2"
    metalness: 0.94
    roughness: 0.26
    evidence: "[CERT-a] EN 1125 devices are stainless/plated hardware; the only bare metal here, which is what makes the painted leaf read as painted"
    source: table
    confidence: 0.75
  - id: kick-plate
    family: bare-metal
    color: "#b9bec2"
    metalness: 0.92
    roughness: 0.40
    evidence: "[INFER] a kick plate is standard on a door in a traffic route"
    source: estimated
    confidence: 0.65   # assumption stated: presence inferred from use, dimensions not published
  - id: exit-sign
    family: emissive-sign
    color: "#1f9d55"
    metalness: 0.0
    roughness: 0.45
    evidence: "[INFER] ISO 7010 escape-route green; emissive so it reads as a maintained sign"
    source: estimated
    confidence: 0.70
  - id: wall-concrete
    family: mineral
    color: "#3b4149"
    metalness: 0.0
    roughness: 0.90
    evidence: "[INFER] context surface, not a claim about the product"
    source: estimated
    confidence: 0.60

critical_features:
  - id: the-opening-is-a-real-hole
    desc: >
      The opening is CUT OUT of the wall (Shape with a hole), with a reveal lining and a lit corridor
      beyond, so opening the leaf shows somewhere to escape TO. A leaf hung on a solid wall looks
      identical when shut and reveals nothing when open — the ONBOARD names it, and it is the single
      most likely way to build this asset wrong.
    threshold: 0.80
  - id: en1125-bar-at-a-certified-height
    desc: >
      A horizontal panic bar across the leaf at 1.00 m, inside the published 0.90-1.10 m band, with
      end brackets and a latch case. This is the only evidence-backed placement on the asset and the
      reason it is an EN 1125 door rather than a lockable steel door.
    threshold: 0.78
  - id: opens-outward-hinged-far-side
    desc: >
      The leaf swings OUTWARD, in the direction of escape travel, hinged on the jamb FAR from the
      review camera so the open leaf never swings across the opening it exists to reveal.
    threshold: 0.75
  - id: painted-leaf-not-bare-metal
    desc: >
      The leaf reads as PAINTED steel — a dielectric with no metal glint — against the stainless
      panic bar and kick plate. Measured [120,141,160] on the leaf face; the coated-surface lighting
      rule (env ~1.55, exposure 1.04, lateral fill) rather than the bare-metal env-2.15 recipe.
    threshold: 0.75
  - id: honest-about-what-is-not-known
    desc: >
      The HUD states SIN FICHA for every leaf dimension and SIN RESOLVER for the bar-length rule,
      with both readings shown. An asset built on inference must SAY so on screen; a confident-looking
      datasheet-less model is the failure this policy exists to prevent.
    threshold: 0.75

important_features:
  - id: escape-signage
    desc: "ISO-7010-style green running-man sign above the opening — why this door has this hardware."
  - id: scale-figure
    desc: "1.8 m occupant beside the door, showing the leaf is a person-sized escape route."

quality_contract:
  global_min: 0.72          # LOWERED from 0.75, and the HUD says why: this is a datasheet-less asset
                            # whose leaf dimensions are all [INFER]/low. The family precedent for
                            # lowering on heavy inference is barrera-vehicular and estanteria (0.72).
  perf_budget:
    draws: 40               # measured 30
    tris: 200000            # measured 1,806

camera:
  azimuth_deg: -3.0
  elevation_deg: 19.5
  fov: 36
  target_y_m: 1.20
  radius_m: 7.50
  framing_check: >
    MEASURED over the envelope that INCLUDES the open leaf and the figure, not just the shut door:
    ndcX -0.61..+0.57, ndcY -0.64..+0.68, centred, top 129 px clear of the 6-line HUD. A second
    measurement was needed after the pre-look: the corridor's far wall at 2.4 m projected to ndcY
    0.663 against the main wall's top at 0.661 and poked into the HUD band, so it was SOLVED down to
    2.2 m (ndcY 0.600) rather than nudged by eye.
  evidence_views:
    - {id: neutral, url: "?view=neutral", role: "hero / mechanical + colorTarget anchor"}
    - {id: grazing, url: "?view=grazing", role: "close on the panic bar and the painted sheet"}
    - {id: abierta, url: "?view=abierta", role: "KINEMATIC: boots with the leaf open, proving the opening is a real hole with a corridor beyond"}

lighting: house-rig
  # TWO declared deviations, both required by the subject:
  #  · COATED surface, so the ONBOARD's painted-steel rule applies: environmentIntensity 1.55 and
  #    exposure 1.04 with a lateral fill, NOT the bare-metal env-2.15 recipe, which would blow out a
  #    light-painted leaf. The bar and kick plate are the only bare metal and they still read.
  #  · An interior PointLight in the corridor BEYOND the opening. Note the ordering that matters: the
  #    light was added first and showed nothing, because there was no surface behind the hole to
  #    illuminate. A lamp lighting nothing is not a fix — the corridor floor and back wall are.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR"                 # outward, 0..82 deg
  - "MURO"                  # wall + corridor context
  - "FIGURA 1.8 m"

colorTarget:
  # MEASURED from the gated neutral capture (2880x2160, DPR 3), anchored BY PROJECTED GEOMETRY on the
  # painted leaf face above the bar. THREE independent points on that face agree within one unit:
  # [120,141,160] at y=1.45, [121,141,160] at y=1.70, [119,140,160] at y=0.75, all at deviation ~0.
  # The leaf is the right anchor because "painted steel, not bare metal" is this asset's material
  # claim, and it is the value that would regress if someone reached for metalness to make it shinier.
  srgb: [120, 141, 160]
  deltaE00Max: 6
  crop: "34x24+1401+966"
