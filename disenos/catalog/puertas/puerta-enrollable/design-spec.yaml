# DesignSpec — industrial roll-up shutter door (100 mm lath, G135 guides, boxed drum)
# Dimensional evidence: [Block 59] (research/threejs-block59.md), from the preserved Angel Mir
# roller-shutter catalogue. Sibling of puerta-fabrica-seccional.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: puerta-enrollable
family: puertas
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 1, action_readiness: 3}
  tier: moderate
  notes: >
    repetition 3 (a curtain of ~30 identical laths, instanced) and action_readiness 3 (the curtain
    does not slide — it COILS, so the wrapped part follows a spiral whose radius grows with every
    turn). Both are modelled, not faked.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block59.md
  reuse_pointers:
    sibling_spec: "disenos/catalog/puertas/puerta-fabrica-seccional/design-spec.yaml"

references:
  - source: "sources/B59-door-dims/angelmir-roller-shutter.pdf :p.11-17"
    evidences: >
      Lath profiles 80 mm and 100 mm (double aluminium or single micro-perforated); guide profiles
      G105 and G135 with G = 55/85 and J = 110/135; drum-box flag B = 300 / 365-435 / 415-485 /
      465-535 mm with coil R = 320 / 340 / 450 / 500 mm; box cover T1/T2; assembly margins C1 =
      50/70/100, C2 = 80/150/200, C3 = 30/50/120 mm; maximum dimensions 5,000 x 5,000 mm (6,000 x
      6,000 on the intensive model); crank operation below H = 3000 mm, chain at or above it;
      "Minimum total height = H + B + C1"; drum cover COMPULSORY for doors under 2,500 mm high.
    suitability: pass
  - source: "web search consensus on roller-shutter bottom rails (secondary, not preserved)"
    evidences: "The bottom rail is a rigid inverted-T section — modelled, marked low confidence."
    suitability: partial

dimensions_real:
  lath_pitch_m:     {value: 0.100, confidence: high}   # [CERT-doc] 100 mm lath (80 mm is the alternative)
  lath_thickness_m: {value: 0.014, confidence: low}    # [INFER] not published in the extract
  guide_w_m:        {value: 0.135, confidence: high}   # [CERT-doc] G135 profile width
  guide_depth_m:    {value: 0.085, confidence: high}   # [CERT-doc] G135 "G" value
  guide_j_m:        {value: 0.135, confidence: high}   # [CERT-doc] G135 "J" value
  box_b_m:          {value: 0.435, confidence: high}   # [CERT-doc] small flag B
  coil_r_m:         {value: 0.340, confidence: med}    # [CERT-doc] catalogue "R" for the small flag,
                                                       # read as the coil ENVELOPE DIAMETER — see note
  margin_c1_m:      {value: 0.070, confidence: high}   # [CERT-doc] small flag C1
  opening_w_m:      {value: 3.50,  confidence: med}    # [INFER] inside the 5,000 x 5,000 maximum
  opening_h_m:      {value: 3.00,  confidence: med}    # [INFER]
  min_wall_h_m:     {value: 3.505, confidence: high}   # [CERT-doc] DERIVED: H + B + C1 = 3.00+0.435+0.070
  max_size_m:       {value: [5.00, 5.00], confidence: high}  # [CERT-doc]
  # NOTE on coil_r_m: the catalogue prints B = 435 mm for the same flag whose R is 340 mm. A coil of
  # 340 mm RADIUS (680 mm across) cannot fit a 435 mm box, so R is read here as the coil envelope
  # DIAMETER. That reading is [INFER] from an internal consistency check, not from the document text.

hierarchy:
  - name: root
    children:
      - name: wall
        pivot: [0, 0, 0]
        animation: none
      - name: guides         # G135 side guides, both jambs
        pivot: [0, 0, 0]
        animation: none
      - name: drumbox        # barrel, shaft, end plates + optional cover
        pivot: [0, 0, 0]
        animation: none
      - name: curtain        # ~30 instanced laths; straight in the guides, spiral on the barrel
        pivot: [0, 0, 0]
        animation: coil
      - name: bottom_rail    # rigid inverted-T section
        pivot: [0, 0, 0]
        animation: coil      # travels with the curtain's leading edge

materials:
  - id: lath-aluminium
    family: bare-metal
    color: "#b9bec1"
    metalness: 0.90
    roughness: 0.42
    evidence: "[CERT-doc] 'double aluminium' lath; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.8
  - id: guide-galvanized
    family: bare-metal
    color: "#a9aeb1"
    metalness: 0.90
    roughness: 0.48
    evidence: "[CERT-doc] steel side guides"
    confidence: 0.8
  - id: box-painted
    family: painted-metal
    color: "#d9dcdc"
    metalness: 0.0
    roughness: 0.6
    evidence: "[CERT-doc] drum cover as an option/compulsory item; coated sheet — dielectric"
    confidence: 0.7
  - id: rail-steel
    family: bare-metal
    color: "#8f9498"
    metalness: 0.92
    roughness: 0.45
    evidence: "bottom rail, cold-rolled galvanised section (secondary source)"
    confidence: 0.6

critical_features:
  - id: coil-is-a-spiral
    desc: >
      With the door part-open the wrapped laths form a SPIRAL on the barrel whose radius grows turn
      by turn, and the straight part hangs in the guides — the curtain must not vanish into the box
      or stack as a cylinder of fixed radius.
    threshold: 0.78
  - id: guide-and-box-proportion
    desc: >
      G135 side guides that visibly capture the lath edges, and a drum box tall enough for the coil
      (B = 435 mm) sitting above the opening — the wall above the lintel must be at least
      H + B + C1, not flush with the opening.
    threshold: 0.78
  - id: lath-pitch
    desc: "A curtain of ~100 mm horizontal laths, evenly pitched, over a heavier inverted-T bottom rail."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 30                   # MEASURED 19 — laths are one InstancedMesh whose matrices update
                                # while coiling, which is what keeps the count this low
    tris: 40000                 # measured 642

camera:
  view: exterior
  azimuth_deg: 42
  elevation_deg: 13
  fov: 38
  target_y_m: 1.75
  radius_m: 9.5

lighting: house-rig + vertical-subject fill
  # Same deviation as puerta-cuarto-frio and for the same reason: the lath curtain is BARE aluminium
  # on a vertical plane, so it reflects the dark horizon and reads flat under the unmodified rig.
  # Metalness/roughness unchanged (HANDBOOK §3.1) — the fix is a fill toward the curtain normal.

ui_controls:
  - "AUTO-ROTATE"
  - "OPEN / CLOSE"          # coils the curtain; holds needsRender while moving
  - "BOX COVER"             # compulsory under H = 2500 mm per the catalogue
  - "WALL"

colorTarget:
  # MEASURED from the rendered lath curtain (headless capture at 1280x800).
  srgb: [125, 131, 136]
  deltaE00Max: 8
  crop: "60x40+600+400"   # lath curtain mid-height, at 1280x800
