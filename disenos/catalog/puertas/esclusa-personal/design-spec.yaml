# DesignSpec — cylindrical personnel interlock portal (mantrap)
# Seventh asset of the `puertas` family. Dimensional evidence: [Block 120]
# research/threejs-block120.md, from two preserved vendor specifications (CoMETA Co135, rectangular;
# Boon Edam Circlelock Solo, cylindrical, manufacturer-verified BIM entry).
# The thesis: the INTERLOCK is the product, and it has to be enforced in code. Two independent door
# toggles depict a vestibule — a different and much cheaper thing — and nothing in the gate can tell.

design: esclusa-personal
family: puertas
track: threejs
mode: standard
gate_passes: [materials]
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"
p6_comparison: spec-only

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 2, repetition: 1,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 3}
  tier: moderate
  notes: >
    action_readiness 3 is the defining axis and the reason this asset exists: the behaviour IS the
    product. material_layers 2 because transmissive glass over a lit interior is a two-layer read —
    an unlit version is a black cylinder. silhouette is only 1 (a glazed drum), so, as with the cage,
    the identity has to live in the parts, the material and the interaction.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    harness: research/tools/
    catalog_gate: disenos/catalog/tools/
    dimensional_evidence: research/threejs-block120.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — aluminium/stainless = bare metal; laminated glass transmissive ~0.72, never 0.96"
    sibling_spec: "disenos/catalog/puertas/porton-corredizo/design-spec.yaml (same family, same evidence discipline)"

references:
  - source: "sources/B120-airlock-dims/boonedam-circlelock-nbs (NBS Source, manufacturer-verified, sha256 3f6c9f2c…, fetched 2026-08-09)"
    evidences: >
      "1000 mm diameter"; width options "1000 mm" / "1500 mm"; height "2100 mm" minimum to "2600 mm"
      maximum; canopy height "200 mm" / "300 mm" / "400 mm" / "500 mm"; glazing "8.76 mm laminated
      glass (vandal-resistant to BS EN 356, P2A)" and "10.28 mm laminated glass (… P5A)";
      "Circular glazing manifestations at 900 mm and 1500 mm"; materials aluminium / stainless steel /
      glass. Names what the product defends against: tailgating, piggybacking; bullet-resistant and
      biometric options.
    suitability: pass
    image: none
  - source: "sources/B120-airlock-dims/cometa-co135-security-portal (sha256 696bf13b…, fetched 2026-08-09)"
    evidences: >
      Rectangular counterpart, used ONLY for the passage width and as a cross-check on the envelope:
      "60: W 1050 * D 1050 * H 2400 mm | Passage: L 600 * H 2000 mm" and the lowered variant
      "R60: W 1050 * D 1050 * H 2340 mm | Passage: L 600 * H2010 mm". `interlock` appears 10 times.
    suitability: pass
    image: none

dimensions_real:
  diameter_m:     {value: 1.000, confidence: high}   # [CERT-web] "1000 mm diameter"
  height_m:       {value: 2.100, confidence: high}   # [CERT-web] specification minimum = standard headroom
  canopy_m:       {value: 0.300, confidence: high}   # [CERT-web] from the published ladder
  passage_w_m:    {value: 0.600, confidence: high}   # [CERT-web] CoMETA "Passage: L 600"
  passage_arc_deg: {value: 73.7,  confidence: high}   # DERIVED: 2*asin(300/500) — the chord decides it
  manifestation_y_m: {value: [0.900, 1.500], confidence: high}  # [CERT-web] published heights
  glass_t_m:      {value: 0.00876, confidence: high} # [CERT-web] 8.76 mm laminated, EN 356 P2A
  leaf_travel_deg: {value: 79.4,  confidence: low}    # [INFER] passage arc + 0.10 rad, so the leaf tucks
                                                     # fully behind its 106.3 deg fixed segment
  figure_h_m:     {value: 1.800, confidence: high}   # the ONBOARD scale figure — and here also the SPEC:
                                                     # this product is defined by fitting exactly one person

hierarchy:
  - name: root
    children:
      - name: fixed-glazing            # two segments of 106.3 deg, diametrically opposite
        pivot: [0, 0, 0]
        animation: none
      - name: mullions-and-rings       # doorway edges + head and sill rings
        pivot: [0, 0, 0]
        animation: none
      - name: manifestations           # the two published bands
        pivot: [0, 0, 0]
        animation: none
      - name: door-A
        pivot: [0, 0, 0]               # rotates about the cylinder axis
        animation: {channel: "rotation.y", travel_deg: "0..79.4", interlock: "opening A forces B closed"}
      - name: door-B
        pivot: [0, 0, 0]
        animation: {channel: "rotation.y", travel_deg: "0..79.4", interlock: "opening B forces A closed"}
      - name: canopy                   # with the sensor head that does the occupancy counting
        pivot: [0, 0, 0]
        animation: none
      - name: floor-plate              # the weight/occupancy sensor lives under it
        pivot: [0, 0, 0]
        animation: none
      - name: readers
        pivot: [0, 0, 0]
        animation: none
        attachment:
          parent_socket: ground
          local_start: [0.62, 0.00, -0.42]
          local_end:   [0.62, 1.05, -0.42]
          contact_type: floor-mounted
          embed_depth: 0.010
          gap_tolerance: 0.002
      - name: figure                   # 1.8 m occupant
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: aluminium
    family: bare-metal
    color: "#c3c8cc"
    metalness: 0.92
    roughness: 0.32
    evidence: "[CERT-web] materials list: aluminium / stainless steel / glass; HANDBOOK §3.1 bare metal"
    source: table
    confidence: 0.85
  - id: stainless
    family: bare-metal
    color: "#b6bbbf"
    metalness: 0.94
    roughness: 0.28
    evidence: "[CERT-web] same materials list; floor plate"
    source: table
    confidence: 0.82
  - id: laminated-glass
    family: glass
    color: "#dff0f5"
    metalness: 0.0
    roughness: 0.06
    evidence: "[CERT-web] 8.76 mm laminated, EN 356 P2A. transmission 0.72, NOT 0.96 — at 0.96 the glass disappears from the render (ONBOARD); depthWrite:false so it never masks the interior"
    source: table
    confidence: 0.85
  - id: manifestation
    family: applied-film
    color: "#e8eef2"
    metalness: 0.0
    roughness: 0.85
    evidence: "[CERT-web] 'Circular glazing manifestations at 900 mm and 1500 mm'"
    source: table
    confidence: 0.80
  - id: reader
    family: painted-metal
    color: "#1d5f52"
    metalness: 0.0
    roughness: 0.45
    evidence: "[CERT-web] biometric / card readers are named options; emissive face so the access point reads"
    source: estimated
    confidence: 0.70   # assumption stated: the source names the component, not its finish
  - id: dark-trim
    family: painted-metal
    color: "#23272c"
    metalness: 0.0
    roughness: 0.60
    evidence: "[INFER] sensor head, tread mat — dark machine parts"
    source: estimated
    confidence: 0.70

critical_features:
  - id: interlock-is-enforced
    desc: >
      Opening either leaf CLOSES the other. There is no reachable state with both doors open, and the
      code asserts it. Two independent toggles would depict a vestibule, not an airlock — and no
      count, no render and no static check can tell the difference. Verified by DRIVING both toggles
      in sequence with a clean console, not by reading the source.
    threshold: 0.80
  - id: one-person-envelope
    desc: >
      A 1.000 m drum with a 600 mm passage, with the 1.8 m figure inside showing that it fits exactly
      one person and that a second could not hide. The envelope is the anti-piggybacking argument.
    threshold: 0.78
  - id: manifestations-at-published-heights
    desc: >
      Two bands on the glazing at 900 mm and 1500 mm. This is the visual signature of the product and
      the detail a modeller does not invent.
    threshold: 0.75
  - id: glass-over-a-lit-interior
    desc: >
      Transmissive laminated glass at ~0.72 over a LIT interior, so the occupant and the far glazing
      read through it. At 0.96 the glass vanishes; unlit, the booth is a black cylinder.
    threshold: 0.75
  - id: leaf-tucks-behind-the-fixed-segment
    desc: >
      In the open state the leaf is PARKED behind its fixed segment, not deleted: the doorway is clear
      and the leaf is still on the drum. An asset that hides the door instead of moving it looks the
      same in a still and is wrong.
    threshold: 0.72

important_features:
  - id: canopy-and-sensor-head
    desc: "300 mm canopy with the overhead sensor that does the occupancy counting."
  - id: access-pedestal
    desc: "Card/biometric reader on a pedestal outside door A, and an exit button inside."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 90                   # measured 74
    tris: 200000                # measured 8,268

camera:
  azimuth_deg: 45.0
  elevation_deg: 12.5
  fov: 36
  target_y_m: 1.15
  radius_m: 5.80
  framing_check: >
    MEASURED: the envelope corners project to ndcX -0.30..+0.30 and ndcY -0.77..+0.68, centred, with
    the top 128 px clear of the 6-line HUD. Occupancy is 22% and that number is HONEST rather than
    inflated: a subject 1.21 m wide and 2.40 m tall cannot fill a landscape frame, and forcing it
    would mean the diagonal composition that porton-corredizo's spec documents as the trap.
  evidence_views:
    - {id: neutral, url: "?view=neutral", role: "hero / mechanical + colorTarget anchor"}
    - {id: grazing, url: "?view=grazing", role: "close on the glazing, the bands and the aluminium"}
    - {id: abierta, url: "?view=abierta", role: "KINEMATIC evidence: boots with door A open, so a reviewer driving by URL on a cold load sees the state a human sees after clicking"}

lighting: house-rig
  # ONE declared deviation: an interior PointLight (4.2, range 4.0). Glass over an unlit volume is a
  # black cylinder and the occupant — the subject of the whole machine — disappears. This is the
  # vitrine rule from the ONBOARD: an emissive strip lights nothing, a real light does.
  # NOT applied: the bare-metal env-2.15 rescue. The aluminium here is on a CURVED drum under a
  # canopy, not a flat vertical plane, and it reads at the house intensity. Deliberate NON-deviation.

ui_controls:
  - "AUTO-ROTATE"
  - "PUERTA A"                  # interlocked with B
  - "PUERTA B"                  # interlocked with A
  - "FIGURA 1.8 m"

colorTarget:
  # MEASURED from the gated neutral capture (2880x2160, DPR 3), anchored BY PROJECTED GEOMETRY on the
  # aluminium canopy at the camera-facing azimuth (45 deg). Two nested crops agree:
  # [72.0,75.8,79.4] over 40x40 and [71.1,75.0,78.5] over the 30x24 recorded here.
  # The canopy is the right anchor because it is the largest UNGLAZED metal surface: the glass is
  # transmissive and its rendered value depends on what happens to be behind it, so a glass crop would
  # be a regression anchor that moves whenever the interior does.
  srgb: [71, 75, 79]
  deltaE00Max: 6
  crop: "30x24+1425+487"
