# DesignSpec — cantilever sliding gate, 5.00 m clear opening
# Sixth asset of the `puertas` family. Dimensional evidence: [Block 69] research/threejs-block69.md,
# from two preserved sources — an imperial installation manual (the MECHANISM and the sizing ladder)
# and a metric design guide (the numbers that transfer to a EUR-scale asset).
# The thesis: half of this product is the half that is not the gate. The counterbalance is 50% of the
# opening, it carries no infill, and nothing touches the ground across the opening.

design: porton-corredizo
family: puertas
track: threejs
mode: standard
gate_passes: [materials]
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"
p6_comparison: spec-only        # evidence is two textual installation documents, no photographs

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 2,
           material_layers: 1, detail: 2, occlusion: 1, action_readiness: 2}
  tier: moderate
  notes: >
    action_readiness 2 is what separates this from a fence: the leaf translates by exactly the clear
    opening, and the OPEN state is the only one in which the 50% counterbalance rule can be read, so
    the evidence contract owes a kinematic capture. silhouette 2 because the identity is a CHANGE of
    texture along one long member — infilled for 5.00 m, open frame for 2.50 m — rather than an
    outline. 41 draw calls, 13,738 tris.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    harness: research/tools/
    catalog_gate: disenos/catalog/tools/
    dimensional_evidence: research/threejs-block69.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — galvanized steel = bare metal 0.9-1.0; concrete and the painted gear motor = dielectric 0.0"
    mechanism: "disenos/catalog/almacenamiento/jaula-seguridad/jaula-seguridad.html §diamond mesh — the meshPanel() generator is reused verbatim here, second use"

references:
  - source: "sources/B69-gate-dims/hoover-cantilever-gate-installation.pdf (sha256 1c4971ef…, fetched 2026-08-09)"
    evidences: >
      "The gate counter balance should be 1/2 the length of the gate opening." · "Minimum counter
      balance should be 4' long." · "The counterbalance is not stretched with chain link as it is
      typically behind the rest of the fence" and is "designed for structural integrity only." ·
      "The vertical bracing should be spaced 4 to 6' apart", "5' spacing is adequate" with 2-1/2"
      sch. 40 pipe. Roller-post ladder: "3" O.D. … for widths up to 10' opening size", "4" O.D. posts
      up to 20'", "6 5/8" O.D. posts up to 32'", "These specifications are for 6' high gates and
      shorter." Footings "18" diameter x 42" deep … for 3-4" O.D. posts". Contrast with the competing
      product: a ROLLING gate is the one that has "a track in the gate opening and/or a leading edge
      wheel attached to the latch side of the gate which rides on the ground."
    suitability: pass
    image: none
  - source: "sources/B69-gate-dims/quiko-cantilever-guide (sha256 4df67dd4…, fetched 2026-08-09)"
    evidences: >
      Metric counterpart. "a counterbalance section equal to 40-50% of the opening width" ·
      excavation "400-500mm deep and 350-400mm wide, running the entire gate travel path including
      counterbalance section" · "For gates up to 5 meters wide, 60x40x3mm RHS typically suffices for
      the main frame perimeter" · "Weld rail to gate frame's lower structural member" · "Attach drive
      rack to gate frame at 500-600mm intervals" · carriage roller alignment "tolerance: 1-2mm" ·
      "panel weights from 400 kg to over 2000 kg, with opening widths extending beyond 12 meters".
    suitability: pass
    image: none

dimensions_real:
  opening_w_m:      {value: 5.000, confidence: high}  # [CERT-web] exactly the ceiling of the certified
                                                      # 60x40x3 RHS rule, so the section is evidence
  counterbalance_m: {value: 2.500, confidence: high}  # [CERT-doc] "1/2 the length of the gate opening";
                                                      # [CERT-web] top of the 40-50% band. Both agree
  leaf_len_m:       {value: 7.500, confidence: high}  # derived: 5.00 + 2.50
  leaf_h_m:         {value: 2.000, confidence: med}   # [INFER] inside "6' high gates and shorter"
  ground_clear_m:   {value: 0.100, confidence: low}   # [INFER] the daylight under the leaf IS the product
  rhs_m:            {value: [0.060, 0.040], confidence: high}   # [CERT-web] "60x40x3mm RHS"
  brace_pitch_m:    {value: 1.500, confidence: med}   # [CERT-doc] "5' spacing" = 1.524 m, rounded
  post_od_m:        {value: 0.102, confidence: high}  # [CERT-doc] 4" O.D. for openings up to 20 ft
  post_h_m:         {value: 2.400, confidence: low}   # [INFER]
  foundation_m:     {value: [0.450, 0.380], confidence: high}   # [CERT-web] 400-500 deep x 350-400 wide
  foundation_len_m: {value: 7.700, confidence: high}  # [CERT-web] "the entire gate travel path
                                                      # INCLUDING counterbalance" — not just the opening
  rack_pitch_m:     {value: 0.01257, confidence: low} # [INFER] module-4 rack, pi x 4 mm
  mesh_aperture_m:  {value: 0.050, confidence: low}   # [INFER] chain-link infill
  wire_dia_m:       {value: 0.0030, confidence: low}  # [INFER] true chain-link gauge — kept thin so the
                                                      # infill stays see-through (block68 §68.4)
  travel_m:         {value: 5.000, confidence: high}  # derived: the leaf travels exactly the clear opening

hierarchy:
  - name: root
    children:
      - name: gate-leaf
        pivot: [2.50, 0.10, 0.00]        # the leading edge, at the catch post when closed
        animation: {channel: "position.x", travel_m: "0..-5.00", note: "exactly the clear opening"}
        children:
          - name: infill                 # chain-link on the LEADING 5.00 m ONLY
            pivot: [0, 0, 0]
            animation: none
          - name: counterbalance-frame   # braced, NOT filled (block69 §69.2)
            pivot: [0, 0, 0]
            animation: none
          - name: bottom-rail
            attachment:
              parent_socket: leaf-lower-member
              local_start: [0.00, 0.025, 0.00]
              local_end:   [-7.50, 0.025, 0.00]
              contact_type: welded
              embed_depth: 0.010
              gap_tolerance: 0.001
          - name: drive-rack
            attachment:
              parent_socket: bottom-rail
              local_start: [-0.05, -0.02, 0.045]
              local_end:   [-7.45, -0.02, 0.045]
              contact_type: bolted
              overlap: 0.006
              gap_tolerance: 0.001
      - name: posts                      # gate post + catch post, 4" O.D.
        pivot: [0, 0, 0]
        animation: none
      - name: guide-rollers              # at the TOP of the gate post; without them the panel falls over
        pivot: [0, 0, 0]
        animation: none
        attachment:
          parent_socket: gate-post
          local_start: [-2.50, 1.98, -0.075]
          local_end:   [-2.50, 1.98,  0.075]
          contact_type: bolted
          overlap: 0.020
          gap_tolerance: 0.002
      - name: carriages                  # two, inside the span the leaf covers in BOTH states
        pivot: [0, 0, 0]
        animation: none
      - name: foundation                 # runs the FULL travel path, opening plus counterbalance
        pivot: [0, 0, 0]
        animation: none
      - name: gear-motor
        pivot: [0, 0, 0]
        animation: none
      - name: fence-line                 # context: what the counterbalance hides behind
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: steel-galvanized
    family: bare-metal
    color: "#bfc4c6"
    metalness: 0.92
    roughness: 0.30
    evidence: "[CERT-doc] chain-link cantilever gate hardware; HANDBOOK §3.1 bare metal 0.9-1.0"
    source: table
    confidence: 0.85
  - id: mesh-galvanized
    family: bare-metal
    color: "#b2b7ba"
    metalness: 0.92
    roughness: 0.34
    evidence: "[CERT-doc] the infill is chain link; wire kept at a true thin gauge so it stays see-through"
    source: table
    confidence: 0.80
  - id: rail-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.92
    roughness: 0.38
    evidence: "[CERT-web] the rail is welded to the frame's lower member and the carriage rollers run in it"
    source: table
    confidence: 0.78
  - id: concrete
    family: mineral
    color: "#6d7176"
    metalness: 0.0
    roughness: 0.92
    evidence: "[CERT-web] reinforced concrete foundation 400-500 x 350-400 mm; dielectric"
    source: table
    confidence: 0.85
  - id: motor-housing
    family: painted-metal
    color: "#d9a21c"
    metalness: 0.0
    roughness: 0.55
    evidence: "[CERT-web] 'Modern gear motors integrate electronic control boards'; housing colour is house convention, dielectric per §3.1"
    source: estimated
    confidence: 0.70   # assumption stated: the guide names the component, not its finish
  - id: dark-steel
    family: painted-metal
    color: "#2b3036"
    metalness: 0.0
    roughness: 0.65
    evidence: "[INFER] carriage housings, guide rollers and the rack — dark machine parts"
    source: estimated
    confidence: 0.70   # assumption stated: sub-components, no published finish

critical_features:
  - id: nothing-touches-the-ground
    desc: >
      There is continuous daylight under the leading half of the leaf, and NO track across the
      opening and NO wheel under the leading edge. Those belong to a ROLLING gate, which the source
      defines explicitly as the competing product. This gap IS the product.
    threshold: 0.80
  - id: counterbalance-is-half-and-open
    desc: >
      The tail is 2.50 m against a 5.00 m opening (50%) and carries NO infill — a braced open frame,
      because it lives behind the fence and exists only for structural integrity. Filling it doubles
      the visual mass and hides the bracing that is its only reason to exist.
    threshold: 0.78
  - id: carriages-and-foundation
    desc: >
      Two carriages on a concrete beam that runs the WHOLE travel path (opening plus counterbalance),
      with the rail welded along the leaf's lower member and the rollers inside it. A foundation that
      stops at the opening is the second-most-likely error after filling in the tail.
    threshold: 0.75
  - id: galvanized-reads-as-metal
    desc: >
      Bare galvanized steel on a VERTICAL subject that does NOT collapse to flat grey or to black.
      Measured [78,84,90] on the top rail: the headless bare-metal recipe (env 2.15 + hemisphere +
      frontal fill, roughness 0.30, metalness held at 0.92) is doing its job.
    threshold: 0.75
  - id: caught-not-landed
    desc: >
      The leading edge meets a catch post with a receiving fork, and guide rollers at the top of the
      gate post hold the panel upright. A bottom-supported panel with no top guide simply falls over.
    threshold: 0.72

important_features:
  - id: fence-context
    desc: "A fence line behind the counterbalance — the thing the tail hides behind, which is why it is unfilled."
  - id: drive-rack-and-motor
    desc: "A module-4 rack under the rail and a gear motor beside the first carriage."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60                   # measured 41
    tris: 200000                # measured 13,738

camera:
  azimuth_deg: -10.0            # from the perpendicular, on the APPROACH side
  elevation_deg: 19.5
  fov: 32
  target_y_m: 1.00
  radius_m: 10.25
  framing_check: >
    MEASURED, then measured AGAIN after the pre-look, because the first framing was arithmetically
    green on a bad picture. Two corrections the numbers alone did not catch. (1) SIDE: the camera sat
    on the FENCE side, so the fence stood between the eye and the counterbalance. (2) CRITERION:
    maximising the bbox rectangle in NDC rewards a steep DIAGONAL — a long thin subject seen end-on
    has a huge bbox and a thin real footprint, so the frame scored 61% while reading as a fence
    receding to the horizon. The search now forces a near-perpendicular azimuth and an explicitly
    CENTRED result, and takes 41% honestly. Framing envelope = the leaf and its posts (7.60 x 2.45 m);
    the foundation beam and the fence are a ground-level STRIP allowed to run out of frame, like a
    road. Result ndcX -0.80..+0.90, ndcY -0.43..+0.54, centre (+0.05,+0.06), top 183 px clear of the
    6-line HUD.
  evidence_views:
    - {id: neutral, url: "?view=neutral", role: "hero / mechanical + colorTarget anchor"}
    - {id: grazing, url: "?view=grazing", role: "low tangent on the leading edge: ground clearance + galvanized read"}
    - {id: abierto, url: "?view=abierto", role: "KINEMATIC evidence, boots with the leaf parked; framed on the FULL 12.60 m travel envelope because the hero camera cuts the parked leaf off. The only state in which the 50% rule is legible"}

lighting: house-rig
  # ONE declared deviation, and it is the documented recipe rather than an invention: BARE galvanized
  # steel on a vertical subject reflects the dark house scene and reads black (ONBOARD; LEARNINGS
  # §Active 2026-08-07, equipos-library). Applied as written — environmentIntensity 2.15 + a
  # HemisphereLight + a FRONTAL DirectionalLight fill on the camera side + roughness 0.30 — with
  # metalness held at 0.92. Verified by measurement, not by eye: the top rail renders [78,84,90].
  # The key and the frontal fill were moved to the APPROACH side (z negative) with the camera; a key
  # left on the fence side would have backlit the whole subject.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR"                     # translation of exactly the clear opening
  - "MALLA"                     # chain-link infill
  - "CERCA"                     # the fence line the counterbalance hides behind

colorTarget:
  # MEASURED from the gated neutral capture (2880x2160, DPR 3) and anchored BY PROJECTED GEOMETRY:
  # the mouth-facing web of the leaf's TOP RAIL at world x = +0.60, mid-infill. Deviation 0.32.
  # The rail is deliberately sampled at a NAMED x because the value runs down a smooth gradient along
  # the leaf — [86,92,99] at x=+1.60, [78,84,90] at +0.60, [62,67,71] at -1.40 — as the frontal fill
  # falls off. "Some grey pixel on the gate" would not be reproducible; this point is.
  srgb: [78, 84, 90]
  deltaE00Max: 6
  crop: "26x12+750+652"
