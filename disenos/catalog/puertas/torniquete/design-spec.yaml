# DesignSpec — tripod turnstile (waist-height pedestal, 3 arms at 120°)
# Dimensional evidence: [Block 60] (research/threejs-block60.md). This is the BEST-SOURCED asset of
# the family: the datasheet publishes a complete dimensional table, so almost nothing is inferred.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: torniquete
family: puertas
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 1,
           material_layers: 1, detail: 2, occlusion: 0, action_readiness: 3}
  tier: moderate
  notes: >
    action_readiness 3: the head rotates 120° per passage about an axis INCLINED from horizontal,
    and on power loss the whole arm assembly drops so the lane opens. Both states are modelled —
    the drop is a certified behaviour, not a flourish.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block60.md
  reuse_pointers:
    stainless_palette: "research/HANDBOOK.md §3.1 — 304 stainless = bare metal 0.9-1.0"
    sibling_spec: "disenos/catalog/puertas/puerta-cuarto-frio/design-spec.yaml (same 304 read)"

references:
  - source: "sources/B60-access-dims/shancharm-tripod-at103.pdf :p.1"
    evidences: >
      Product dimensions 450*420*980mm (standard, customizable); channel width 500mm-550mm; arm
      length 510 mm; net weight 25KG; 304 stainless steel (316 customizable); brushed / polished /
      electroplating finish; DC 24V driven solenoid valve; front LED green when the lane is
      available and red when it is not; two-way standard, one-way optional; "Automatically lowers
      the swing arm after a power outage"; anti-reverse and automatic reset functions.
    suitability: pass

dimensions_real:
  housing_w_m:   {value: 0.450, confidence: high}   # [CERT-doc] 450*420*980
  housing_d_m:   {value: 0.420, confidence: high}   # [CERT-doc]
  housing_h_m:   {value: 0.980, confidence: high}   # [CERT-doc] WAIST height — not a full-height cage
  channel_w_m:   {value: 0.520, confidence: high}   # [CERT-doc] published 500-550 band
  arm_len_m:     {value: 0.510, confidence: high}   # [CERT-doc] ≈ the channel width, so arms sweep it fully
  arm_count:     {value: 3,     confidence: high}   # tripod, arms at 120°
  arm_dia_m:     {value: 0.032, confidence: low}    # [INFER] tube diameter not published
  head_tilt_deg: {value: 30,    confidence: low}    # [INFER] the inclined axis is not dimensioned
  net_weight_kg: {value: 25,    confidence: high}   # [CERT-doc]
  material:      {value: "304 stainless, brushed", confidence: high}   # [CERT-doc]

hierarchy:
  - name: root
    children:
      - name: pedestal       # 450 x 420 x 980 housing + top cap + front LED
        pivot: [0, 0, 0]
        animation: none
      - name: head           # inclined hub carrying the 3 arms
        pivot: [0, 0.98, 0]
        animation: rotate-120   # one passage = 120°; drops on power loss
      - name: railing        # opposite side of the lane — defines the 520 mm channel
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: stainless-304-brushed
    family: bare-metal
    color: "#c4c8ca"
    metalness: 0.95
    roughness: 0.36
    evidence: "[CERT-doc] '304 stainless steel', 'Brushed finish'; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.9
  - id: cap-dark
    family: plastic
    color: "#26292c"
    metalness: 0.0
    roughness: 0.7
    evidence: "moulded top cap / card-reader bezel — dielectric per HANDBOOK §3.1"
    confidence: 0.7
  - id: led-green
    family: emissive
    color: "#28d07a"
    metalness: 0.0
    roughness: 0.4
    evidence: "[CERT-doc] 'The front LED remains green to indicate that the lane is available'"
    confidence: 0.85

critical_features:
  - id: waist-height-pedestal
    desc: >
      A 980 mm waist-height pedestal — NOT a full-height cage. Next to the 1.8 m scale figure the
      housing must reach roughly hip/waist level, or a different product has been modelled.
    threshold: 0.78
  - id: three-arms-sweep-the-lane
    desc: >
      Three 510 mm arms at 120° on an inclined hub, with the lower arm crossing a ~520 mm channel:
      arm length ≈ channel width, so the barrier actually blocks the gap.
    threshold: 0.78
  - id: brushed-304-read
    desc: >
      Housing and arms read as brushed 304 stainless — satin, mid-grey, soft reflections; not chrome
      and not plastic.
    threshold: 0.75

quality_contract:
  global_min: 0.78          # higher than its siblings: this asset is almost entirely [CERT-doc]
  perf_budget:
    draws: 30                 # measured 20
    tris: 30000               # measured 2766

camera:
  view: exterior
  azimuth_deg: 42
  elevation_deg: 16
  fov: 38
  target_y_m: 0.70
  radius_m: 3.6

lighting: house-rig + vertical-subject fill + IBL 2.8
  # Same deviation as puerta-cuarto-frio: bare 304 on vertical housing faces reflects the dark
  # horizon and reads flat. Fixed with a fill toward the face normal; metalness unchanged.

ui_controls:
  - "AUTO-ROTATE"
  - "PASSAGE"               # one 120° rotation, the certified per-passage step
  - "POWER FAIL"            # arms drop — [CERT-doc] behaviour on power outage
  - "SCALE 1.8 m"           # HANDBOOK §3.0 check: the pedestal must read waist-high

colorTarget:
  srgb: [100, 105, 109]     # MEASURED on the 304 housing face
  deltaE00Max: 8
  crop: "60x90+470+380"   # pedestal front face, at 1280x800
