# DesignSpec — selective (adjustable) pallet racking, 3-bay row
# First asset of the catalog `almacenamiento` family. Dimensional evidence is [Block 58]
# (research/threejs-block58.md), from preserved SSI SCHÄFER general-catalogue extracts and the
# EUR-pallet standard. A rack has no dimensions of its own — it is sized by the pallet it carries.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: rack-pallet
family: almacenamiento
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # matches the 50:50 mm system hole pattern

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    repetition 3 is the defining axis: 4 frames x 3 levels x 3 pallets x N deck wires. This is the
    first catalog asset with real repetition, so it is the first genuine InstancedMesh candidate
    under the [Block 54] low-repetition caveat — decks, diagonals, beams, footplates and pallets
    are instanced, uprights are not.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block58.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — galvanized steel = bare metal 0.9-1.0; PAINTED beam = dielectric 0.0"
    sibling_spec: "disenos/catalog/puertas/puerta-cuarto-frio/design-spec.yaml (same evidence discipline)"

references:
  - source: "sources/B57-catalog-dims/ssi-schaefer-pallet-racking-2018.pdf :p.5 (system PR 350)"
    evidences: >
      Rack depth 1,050 mm for an 800x1,200 or 1,000x1,200 pallet stored in depth (insertion depth
      1,200 mm) — the pallet OVERHANGS the frame; 850 mm for transverse 800x1,200. Beam lengths
      1,800 / 2,200 / 2,700 / 2,900 / 3,300 / 3,600 / 3,900 mm. Beam profiles INP 80/100/120 and
      CE 80/100/110/120/140, load per pair at 2,700 mm from 1,700 kg (CE 80) to 4,500 kg (INP 120).
      System hole pattern 50:50 mm; bolt-free beams with welded 5-hook rear lips. Support profiles
      RAL 7037 dust gray, beams RAL 5010 gentian blue.
    suitability: pass
  - source: "sources/B57-catalog-dims/ssi-schaefer-pallet-racking-2022.pdf :p.4-5 (system PR 600 + DGUV 108-007)"
    evidences: >
      Upright profile widths 75, 90, 100, 120 mm; frame load to 30,000 kg; beam to 4,500 kg/pair;
      frame galvanized, beam painted RAL 5010. DGUV: a rack row must have at least 3 bays; at least
      2 beam levels per bay; compartment heights must not differ by more than 200 mm and the maximum
      is 2,500 mm; corner protectors at all free-standing end frames; clear passage >= 2,000 mm.
    suitability: pass
  - source: "mecalux euro-pallet page + sources/B57-catalog-dims/wikipedia-eur-pallet"
    evidences: "UNE-EN 13698-1 euro pallet 800 x 1,200 mm, height 144 mm, ~25 kg, 1.5 t dynamic / 4 t static."
    suitability: pass

dimensions_real:
  bay_width_m:     {value: 2.70,  confidence: high}   # [CERT-doc] catalogue beam length
  frame_depth_m:   {value: 1.05,  confidence: high}   # [CERT-doc] rack depth for a 1,200 mm pallet
  upright_w_m:     {value: 0.090, confidence: high}   # [CERT-doc] PR 600 profile widths
  upright_d_m:     {value: 0.075, confidence: low}    # [INFER] depth of the section not published
  beam_h_m:        {value: 0.110, confidence: high}   # [CERT-doc] CE 110 — profile number IS the height
  beam_d_m:        {value: 0.050, confidence: low}    # [INFER] box-section depth not published
  hole_pitch_m:    {value: 0.050, confidence: high}   # [CERT-doc] 50 : 50 system hole pattern
  bays:            {value: 3,     confidence: high}   # [CERT-doc] DGUV 108-007 minimum row
  levels:          {value: 3,     confidence: high}   # [CERT-doc] DGUV minimum is 2; 3 modelled
  level_pitch_m:   {value: 1.60,  confidence: med}    # [INFER] under the 2,500 mm compartment maximum
  frame_height_m:  {value: 6.10,  confidence: low}    # [INFER] "10 frame heights" exist, none enumerated;
                                                      # set so the top load clears and DGUV §1.1 (+500 mm) holds
  pallet_m:        {value: [1.20, 0.80, 0.144], confidence: high}   # [CERT-web]/[CERT-a] EN 13698-1
  pallet_overhang_m: {value: 0.075, confidence: high} # [CERT-doc] derived: (1.200 - 1.050) / 2
  pallets_per_level: {value: 3,   confidence: med}    # [INFER] 3 x 800 + 4 x 75 clearance = 2,700

hierarchy:
  - name: root
    children:
      - name: frames          # 4 upright frames: 2 posts + brace lattice + footplates each
        pivot: [0, 0, 0]
        animation: none
      - name: beams           # 3 levels x 3 bays x 2 (front/rear) — painted RAL 5010
        pivot: [0, 0, 0]
        animation: none
      - name: decks           # wire mesh decks (instanced) — DGUV §1.6 support case
        pivot: [0, 0, 0]
        animation: none
      - name: pallets         # EUR pallets + load, instanced
        pivot: [0, 0, 0]
        animation: none
      - name: guards          # corner protectors at the free-standing end frames (DGUV §1.4)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: upright-galvanized
    family: bare-metal
    color: "#b9bdbe"
    metalness: 0.92
    roughness: 0.46            # galvanized spangle — duller than polished stainless
    evidence: "[CERT-doc] PR 600 'Frame surface: Galvanized'; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.9
  - id: beam-ral5010
    family: painted-metal
    color: "#15597f"           # RAL 5010 Gentian Blue, lifted for ACESFilmic
    metalness: 0.0             # PAINTED — dielectric. Block 58 §58.3: metal-blue is the predictable error
    roughness: 0.55
    evidence: "[CERT-doc] 'Beam surface: Painted RAL 5010, Gentian Blue'; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.9
  - id: deck-wire
    family: bare-metal
    color: "#9fa4a6"
    metalness: 0.9
    roughness: 0.52
    evidence: "[CERT-doc] DGUV §1.6 'mesh grates or similar'"
    confidence: 0.8
  - id: pallet-wood
    family: wood
    color: "#a8814f"
    metalness: 0.0
    roughness: 0.82
    evidence: "EN 13698-1 spruce/pine EPAL pallet; HANDBOOK §3.1 dielectric"
    confidence: 0.85
  - id: guard-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0
    roughness: 0.6
    evidence: "[CERT-doc] DGUV §1.4 corner protectors — safety yellow is the house convention"
    confidence: 0.7
  - id: load-carton
    family: paper
    color: "#b8a184"
    metalness: 0.0
    roughness: 0.9
    evidence: "generic palletised load — not a certified dimension, purely a scale cue"
    confidence: 0.6

critical_features:
  - id: pallet-overhang
    desc: >
      The 1.20 m pallet visibly OVERHANGS the 1.05 m deep frame by ~75 mm front and back, resting on
      two beams — not sitting inside a shelf. This is the single detail that separates pallet racking
      from shelving, and the one a modeller gets backwards.
    threshold: 0.78
  - id: legal-row-geometry
    desc: >
      At least 3 bays and at least 2 beam levels (DGUV 108-007), with corner protectors at the
      free-standing end frames and a braced lattice between the front and rear uprights.
    threshold: 0.75
  - id: painted-beam-vs-galvanized-frame
    desc: >
      Beams read as PAINTED gentian-blue box sections (dielectric, no metal glint) against galvanized
      grey uprights with a visible 50 mm perforation pitch — a uniform grey rack fails this.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40                   # instancing does the heavy lifting: decks/pallets/beams/braces
    tris: 200000

camera:
  azimuth_deg: 42
  elevation_deg: 12            # the subject is 8.1 m wide and 5.3 m tall — a low, wide framing
  fov: 38
  target_y_m: 2.85
  radius_m: 16.5

lighting: house-rig
  # No deviation needed here: a rack is a lattice, not a flat vertical plane — the galvanized
  # sections catch the key from many angles, unlike the door leaf of the puertas family.

ui_controls:
  - "AUTO-ROTATE"
  - "PALLETS"                  # load in / empty rack
  - "WIRE DECKS"               # DGUV §1.6 mesh decking
  - "GUARDS"                   # corner protectors

colorTarget:
  # MEASURED from the rendered painted beam (headless SwiftShader capture at 1280x800), frozen as
  # the regression anchor. The BEAM is the target, not the upright: the painted-vs-galvanized
  # separation is the material claim most likely to regress.
  srgb: [27, 115, 158]
  deltaE00Max: 8
  crop: "30x7+690+273"   # lit face of a RAL 5010 beam at 1280x800 (narrow: the beam is foreshortened)
