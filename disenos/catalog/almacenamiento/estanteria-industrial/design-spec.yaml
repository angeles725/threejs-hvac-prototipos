# DesignSpec — boltless (rivet) industrial shelving, 5 levels
# Dimensional evidence: [Block 61]. IMPORTANT: the construction system and the load bands are
# certified; the UNIT SIZE is not — the distributor page carrying it returned 0 bytes and was
# deleted rather than registered as a phantom source (B61 §61.3). Sizes below are [INFER].
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: estanteria-industrial
family: almacenamiento
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 2, occlusion: 0, action_readiness: 0}
  tier: simple
  notes: >
    repetition 3 (4 posts x 5 levels x 4 beams + keyhole slots) so beams and slots are instanced.
    The identity is the JOINT: rivets into keyholes in an L-section post, which is what separates
    light shelving from the perforated box columns of rack-pallet.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block61.md
  reuse_pointers:
    contrast_asset: "disenos/catalog/almacenamiento/rack-pallet/ — the heavy sibling, 90 mm columns"

references:
  - source: "sources/B61-storage-dims/shelving-rivet-specs (shelving.com, fetched 2026-08-08)"
    evidences: >
      14-gauge angle posts (standard duty); 1-7/8" heavy-duty angle posts; up to 350 lbs per shelf
      (standard duty), up to 1,500 lbs (heavy duty); Double Rivet Channel beams; wire decking among
      metal / wood / solid-steel options; boltless — riveted beams lock into the posts.
      All six tokens verified present in the preserved copy (B61 §61.3).
    suitability: pass
  - source: "unit dimension table"
    evidences: >
      NOT PRESERVED. A distributor listing (1800 x 900 x 400 mm, 100 kg/level, 1-1/2" adjustment)
      appeared in search but the fetch returned 0 bytes; the empty file and its SOURCES.md row were
      deleted. Those numbers are NOT cited and the modelled sizes are [INFER].
    suitability: fail

dimensions_real:
  post_gauge:      {value: "14-gauge", confidence: high}   # [CERT-web]
  post_profile:    {value: "angle (L)", confidence: high}  # [CERT-web]
  capacity_kg:     {value: 159, confidence: high}          # [CERT-web] 350 lbs standard duty
  joint:           {value: "riveted into keyholes, boltless", confidence: high}  # [CERT-web]
  decking:         {value: "wire / wood / metal / solid steel", confidence: high} # [CERT-web]
  height_m:        {value: 1.80, confidence: low}          # [INFER] source not preserved
  width_m:         {value: 0.90, confidence: low}          # [INFER]
  depth_m:         {value: 0.40, confidence: low}          # [INFER]
  levels:          {value: 5,    confidence: low}          # [INFER]
  post_leg_m:      {value: 0.040, confidence: low}         # [INFER] L leg length not published
  post_t_m:        {value: 0.0019, confidence: high}       # 14-gauge sheet ≈ 1.9 mm [CERT-web gauge]

hierarchy:
  - name: root
    children:
      - name: posts        # 4 L-section angle posts with keyhole slots
        pivot: [0, 0, 0]
        animation: none
      - name: beams        # rivet beams, 4 per level (instanced)
        pivot: [0, 0, 0]
        animation: none
      - name: decks        # shelf panels (togglable, to expose the frame)
        pivot: [0, 0, 0]
        animation: none
      - name: load         # cartons, scale cue only
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: post-grey-powdercoat
    family: painted-metal
    color: "#7f8589"
    metalness: 0.0            # powder-coated shelving is PAINTED — dielectric per HANDBOOK §3.1
    roughness: 0.62
    evidence: "industrial shelving is powder-coated; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.7
  - id: deck-particleboard
    family: wood
    color: "#b09a78"
    metalness: 0.0
    roughness: 0.85
    evidence: "[CERT-web] wood decking is one of the listed options"
    confidence: 0.75
  - id: carton
    family: paper
    color: "#b8a184"
    metalness: 0.0
    roughness: 0.9
    evidence: "generic load — a scale cue, not a certified dimension"
    confidence: 0.5

critical_features:
  - id: angle-post-and-rivet-joint
    desc: >
      Corner posts are L-section ANGLE with a visible keyhole slot pattern, and the beams enter
      them as rivets — no bolt heads, no nuts. This is the silhouette cue that separates light
      shelving from the 90 mm perforated box columns of rack-pallet.
    threshold: 0.78
  - id: five-level-frame
    desc: "Five evenly pitched deck levels on a boltless frame, with feet on the floor."
    threshold: 0.72
  - id: honest-size
    desc: >
      The unit size is plausible but NOT certified: the spec and the block both say the source was
      lost. It must not be presented as measured.
    threshold: 0.70

quality_contract:
  global_min: 0.72          # like barrera-vehicular: the envelope is [INFER], so the bar is lower
  perf_budget:                # NOTE: measured 34 draws vs the 30 budgeted. Left visible rather
                              # than quietly raised: the overrun is the 4 separate L-flange meshes
                              # per post (8 total) that make the ANGLE profile real instead of a
                              # square tube. Worth the 4 calls; the budget line records the tradeoff.
    draws: 30                 # measured 34 — see note
    tris: 40000               # measured 4734

camera:
  view: exterior
  azimuth_deg: 42
  elevation_deg: 15
  fov: 38
  target_y_m: 0.95
  radius_m: 4.4

lighting: house-rig
  # Powder-coated dielectric surfaces — no vertical-metal rescue needed here. Recorded as a
  # DELIBERATE NON-DEVIATION so the counterexample survives: the fill is not a global preset.

ui_controls:
  - "AUTO-ROTATE"
  - "DECKS"                 # hide the shelves to expose the boltless frame
  - "LOAD"                  # cartons
  - "SCALE 1.8 m"

colorTarget:
  srgb: [136, 138, 137]     # MEASURED on a powder-coated post
  deltaE00Max: 8
  crop: "12x100+686+320"   # a front post, at 1280x800
