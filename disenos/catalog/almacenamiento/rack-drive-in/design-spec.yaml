# DesignSpec — drive-in (LIFO) deep-lane pallet racking, 3 lanes x 4 deep x 3 levels
# Fourth asset of the `almacenamiento` family. Dimensional evidence is [Block 67]
# (research/threejs-block67.md). Siblings: [Block 58] selective racking, [Block 64] cantilever.
# The finding that shapes this asset: a drive-in lane is NOT a published dimension. The vendor
# publishes RULES (clearance per unit load, level height as a function of pallet height, forklift
# clearance to the uprights) and leaves the lane itself "configurable". So the lane is DERIVED, and
# the spec records the derivation rather than pretending the number is certified.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: rack-drive-in
family: almacenamiento
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"   # matches the 50 mm system slot pitch

complexity:
  scores: {silhouette: 2, components: 3, hierarchy: 1, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 3, action_readiness: 0}
  tier: moderate
  notes: >
    occlusion 3 is the defining axis here, and it is the opposite of a problem: the subject IS a
    tunnel, so what the camera can and cannot see through the mouth is the whole design question.
    repetition 3 justifies instancing throughout (20 uprights, 292 slot marks, 60 brackets, 27
    pallets); 14 draw calls total. components 3 because the manufacturer's own assembly diagram
    names seven distinct parts, three of which a modeller would not invent (attachment bracket,
    end stop, floor guide rail).

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block67.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — galvanized steel = bare metal 0.9-1.0; safety-yellow guard = dielectric 0.0"
    sibling_spec: "disenos/catalog/almacenamiento/rack-pallet/design-spec.yaml (same evidence discipline, same EUR pallet)"

references:
  - source: "sources/B67-drive-in-dims/mecalux-drive-in-racking (fetched 2026-08-08, sha256 aa78e193…)"
    evidences: >
      Uprights are "slotted every 50 mm". With GP rails "the height of the storage level is equal to
      the height of the pallet plus 150 mm"; with C rails, plus 200 mm. Lane depth is "the sum of the
      depth of all the pallets … plus a clearance per unit load of at least 25 mm". Forklift needs "a
      minimum clearance of 75 mm between each side of the forklift and the vertical elements".
      All five strings token-checked present after stripping markup AND soft hyphens (block67 §67.1).
    suitability: pass
  - source: "sources/B57-catalog-dims/ssi-schaefer-pallet-racking-2018.pdf :pD26-D27"
    evidences: >
      Labelled drive-in / drive-through assembly: attachment bracket, drive-in channel, end stop,
      horizontal brace, horizontal cross brace, buffer, guard and floor rails. Prose: racks "are
      loaded and unloaded from one side", "the channels can only be accessed in one direction"
      (drive-in, LIFO) versus drive-through "accessed from both" sides; channels "should be equipped
      with floor rails to protect the rack supports and provide forklift drivers with better guidance".
    suitability: pass
  - source: "hedaracking drive-in dimensions page (consulted, NOT preserved)"
    evidences: "Lanes run 2-10 pallet positions deep. Everything else on the page is imperial and North-American (48x40 in pallet, bay width in feet), so it does not transfer to a EUR-pallet system."
    suitability: partial   # used ONLY for the 2-10 deep range; rejected for every metric dimension

dimensions_real:
  pallet_m:         {value: [0.800, 1.200, 0.144], confidence: high}  # [CERT-web] EUR, entered on the 800 mm face
  clearance_depth_m: {value: 0.025, confidence: high}   # [CERT-web] ">= 25 mm per unit load" — it ACCUMULATES
  depth_pitch_m:    {value: 1.225, confidence: high}    # [CERT-web] derived: 1.200 + 0.025, per pallet
  pallets_deep:     {value: 4,     confidence: med}     # [CERT-a] inside the published 2-10 range
  lane_depth_m:     {value: 4.900, confidence: high}    # [CERT-web] derived: 4 x 1.225
  slot_pitch_m:     {value: 0.050, confidence: high}    # [CERT-web] "slotted every 50 mm"
  level_rule_m:     {value: 0.150, confidence: high}    # [CERT-web] GP rail: level height = pallet height + 150 mm
  load_h_m:         {value: 1.000, confidence: low}     # [INFER] a scale cue; nothing certifies this load
  level_pitch_m:    {value: 1.294, confidence: med}     # [CERT-web] rule applied to an [INFER] load: 1.144 + 0.150
  lane_clear_w_m:   {value: 1.300, confidence: low}     # [INFER] §67.3 — truck ~1.15 m + 2 x 0.075. NOT pallet-derived
  upright_m:        {value: 0.100, confidence: med}     # [CERT-doc] within the 75-120 mm profiles published for the
                                                        # sibling PR 600 system; not published for drive-in itself
  lanes:            {value: 3,     confidence: low}     # [INFER] enough to read as a block, not a published figure
  levels:           {value: 3,     confidence: low}     # [INFER] floor row + 2 rail levels
  frame_h_m:        {value: 3.950, confidence: low}     # [INFER] set so the top unit load clears; asserted in code
  rail_offset_m:    {value: 0.350, confidence: low}     # [INFER] under the pallet, inboard of its 0.400 edge
  bracket_arm_m:    {value: 0.270, confidence: low}     # [CERT-web]/[INFER] consequence of the derived lane width:
                                                        # (1.300/2) - (0.350 + 0.030). A truck-sized lane FORCES a
                                                        # long bracket; a pallet-sized lane would not, and would be wrong

hierarchy:
  - name: root
    children:
      - name: uprights        # 4 lines x 5 transverse frames, instanced
        pivot: [0, 0, 0]
        animation: none
      - name: rails           # 2 per lane per elevated level, spanning the full channel depth
        pivot: [0, 0, 0]
        animation: none
      - name: brackets        # attachment brackets — the rail never touches the upright
        pivot: [0, 0, 0]
        animation: none
      - name: endstops        # at the FAR end: this is what makes it drive-IN, not drive-THROUGH
        pivot: [0, 0, 0]
        animation: none
      - name: pallets         # EUR pallets + unit loads, PARTIAL fill (LIFO), instanced
        pivot: [0, 0, 0]
        animation: none
      - name: guides          # floor guide rails + entry buffers — guidance, not support
        pivot: [0, 0, 0]
        animation: none
      - name: braces          # horizontal runs, spines and back cross bracing
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: frame-galvanized
    family: bare-metal
    color: "#b9bdbe"
    metalness: 0.92
    roughness: 0.46            # galvanized spangle — duller than polished stainless
    evidence: "[CERT-doc] PR 600 'Frame surface: Galvanized'; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.9
  - id: rail-galvanized
    family: bare-metal
    color: "#a9aeb1"
    metalness: 0.92
    roughness: 0.42
    evidence: "[INFER] support rails are structural steel like the frame; no finish is published for them"
    confidence: 0.7
  - id: bracket-galvanized
    family: bare-metal
    color: "#9fa4a7"
    metalness: 0.92
    roughness: 0.50
    evidence: "[CERT-doc] 'Attachment bracket' in the Schäfer assembly; same finish family as the frame"
    confidence: 0.7
  - id: guard-yellow
    family: painted-metal
    color: "#d8a413"
    metalness: 0.0             # PAINTED — dielectric. A metal guard is the predictable error here
    roughness: 0.60
    evidence: "[CERT-doc] 'Buffer', 'guard and floor rails'; safety yellow is the house convention (rack-pallet §guards)"
    confidence: 0.8
  - id: pallet-wood
    family: wood
    color: "#a8814f"
    metalness: 0.0
    roughness: 0.82
    evidence: "EN 13698-1 spruce/pine EPAL pallet; HANDBOOK §3.1 dielectric"
    confidence: 0.85
  - id: load-carton
    family: paper
    color: "#b8a184"
    metalness: 0.0
    roughness: 0.90
    evidence: "generic palletised load — a scale cue, not a certified dimension"
    confidence: 0.6
  - id: slot-mark
    family: painted-metal
    color: "#2a3037"
    metalness: 0.0
    roughness: 0.85
    evidence: "the 50 mm perforation read as recessed shadow, on the mouth-facing posts only"
    confidence: 0.6

critical_features:
  - id: open-channel
    desc: >
      The camera sits at the MOUTH and at least one lane is open, so the channel reads as a
      truck-sized tunnel with its rails, brackets and floor guides visible down its length. A
      fully-loaded block photographed from the mouth is a wall of cartons and hides every part that
      makes this a drive-in — the first framing of this asset did exactly that, at exit 0.
    threshold: 0.80
  - id: end-stop-at-the-far-end
    desc: >
      Each lane is STOPPED at the back (9 stops: 3 lanes x 3 rows). Without them the asset depicts a
      drive-THROUGH, a different product with different logistics. See known_view_limits.
    threshold: 0.78
  - id: rails-on-brackets
    desc: >
      Support rails hang on attachment brackets offset 0.27 m inboard of the upright face, never
      flush against the post. The offset is not decoration: it is what a truck-sized lane costs.
    threshold: 0.75
  - id: partial-lifo-load
    desc: >
      Lanes are filled from the BACK forward and left open at the mouth in unequal amounts (0 / 2 / 1
      positions free). A uniformly full or uniformly empty block does not read as LIFO.
    threshold: 0.72

known_view_limits:
  - id: end-stops-hidden-when-full
    desc: >
      In the DEFAULT state the end stops sit behind the rear unit loads and are not visible — which
      is physically correct, since they are at the back of a loaded lane. They are captured and
      verified in the PALLETS-off state (probe-state.mjs), not forced into the default view by
      moving them somewhere they do not belong.

quality_contract:
  global_min: 0.73             # lowered from 0.75, and the HUD says so: the lane width, the load
                               # height and the frame height are [INFER]. What IS certified is the
                               # set of RULES the geometry obeys, not the resulting numbers.
  perf_budget:
    draws: 20                  # measured 14
    tris: 200000               # measured 6,758

camera:
  azimuth_deg: 173.6           # measured from +Z; the eye sits almost ON the lane axis, at the MOUTH
  elevation_deg: 15.7
  fov: 38
  target_y_m: 1.70
  radius_m: 9.26
  framing_check: >
    MEASURED, not eyeballed. The eight world corners of the envelope project to ndcX -0.61..+0.59 and
    ndcY -0.92..+0.75 at 1280x800, putting the top of the frame 100 px below the edge and CLEARING
    the 4-line HUD. The gate scores neither crop nor HUD collision: an earlier camera here ran the
    top bracing straight through the HUD text with exit 0, ready true and zero console errors.

lighting: house-rig
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # ONE declared deviation: a 0.85 directional fill at (0.8, 2.2, -8), i.e. FROM THE MOUTH, plus the
  # key moved to the mouth side (5, 9, -4). Reason: the subject is a tunnel, and a tunnel lit only
  # from above and behind reads as a black slot — the end stops and the far rails disappear into it.
  # This is NOT the vertical-flat-metal rescue (that one raises environmentIntensity and is wrong
  # here); env stays at the house 1.9. A lattice catches the key from many angles, so no other
  # deviation is needed — deliberate NON-deviation, same as rack-pallet.

ui_controls:
  - "AUTO-ROTATE"
  - "PALLETS"                  # unit loads in / block empty (reveals rails, brackets and end stops)
  - "GUÍAS Y TOPES"            # floor guide rails + entry buffers
  - "ARRIOSTRAMIENTO"          # horizontal runs, spines and back cross bracing

colorTarget:
  # MEASURED from the default headless capture (SwiftShader, 1280x800), anchored BY PROJECTED
  # GEOMETRY, not by hue: a hue-based search for "safety yellow" locked onto the WOODEN PALLET
  # instead (rendered [162,126,77] versus wood #a8814f — the same B/R ratio). The crop below is the
  # entry buffer at the right-hand mouth upright, found by projecting its world position to pixels;
  # two independent buffers measured [199,162,41] with standard deviation 0.0.
  # The guard is the right anchor because dielectric-vs-metal is the material claim most likely to
  # regress, exactly as the painted beam is for rack-pallet.
  srgb: [199, 162, 41]
  deltaE00Max: 8
  crop: "10x10+310+739"
