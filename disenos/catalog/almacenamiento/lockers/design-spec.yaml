# DesignSpec — steel lockers, nest of 3, BS 4680:1996 Standard Duty
# Dimensional evidence: [Block 66]. The size ladder is NORMATIVE (not commercial) and the handbook
# publishes the outside→inside relationships, which is what makes the door frame margin correct.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: lockers
family: almacenamiento
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 1, action_readiness: 2}
  tier: simple
  notes: >
    repetition 3 (3 bays x 2 tiers of doors + vents + hardware). action_readiness 2: doors swing.
    The detail that matters is not the box but the 50 mm frame margin around each door opening.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block66.md

references:
  - source: "sources/B66-locker-dims/link51-locker-handbook.pdf (Link 51 handbook, issue 1.18)"
    evidences: >
      Conforms to BS 4680:1996 'Standard Duty'. Widths 225/300/380/450 mm; depths 300/380/450 mm;
      height excluding legs "in the region of 1700mm to 1850mm"; minimum internal clear height of any
      compartment 200 mm. Derived rules: internal width = overall width -3mm; clear opening = overall
      width -50mm; internal depth = overall depth -21mm. Nest availability Initial/2/3/4/5 with
      example weights 6/13/19/26/32 kg at 300 x 450. All nine strings token-checked (B66 §66.1-66.2).
    suitability: pass

dimensions_real:
  standard:            {value: "BS 4680:1996 Standard Duty", confidence: high}  # [CERT-doc]
  height_m:            {value: 1.80,  confidence: high}   # [CERT-doc] inside the 1700-1850 band
  bay_width_m:         {value: 0.300, confidence: high}   # [CERT-doc] a ladder width
  depth_m:             {value: 0.450, confidence: high}   # [CERT-doc] a ladder depth
  internal_w_m:        {value: 0.297, confidence: high}   # [CERT-doc] overall -3 mm
  clear_opening_m:     {value: 0.250, confidence: high}   # [CERT-doc] overall -50 mm — the frame margin
  internal_d_m:        {value: 0.429, confidence: high}   # [CERT-doc] overall -21 mm
  nest:                {value: 3,     confidence: high}   # [CERT-doc] a listed availability
  min_compartment_clear_h_m: {value: 0.200, confidence: high}  # [CERT-doc] BS 4680
  tiers:               {value: 2,     confidence: med}    # [INFER] a common configuration
  leg_h_m:             {value: 0.100, confidence: low}    # [INFER] the band is "excluding legs"

hierarchy:
  - name: root
    children:
      - name: carcass      # 3 nested bays sharing side panels + base legs
        pivot: [0, 0, 0]
        animation: none
      - name: doors        # 6 doors, each inset by the 25 mm frame margin per side
        pivot: per-door hinge edge
        animation: swing
      - name: hardware     # camlocks, vents, number plates
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: carcass-grey
    family: painted-metal
    color: "#8f9599"
    metalness: 0.0            # powder-coated steel — dielectric per HANDBOOK §3.1
    roughness: 0.60
    evidence: "standard steel locker, coated finish"
    confidence: 0.7
  - id: door-blue
    family: painted-metal
    color: "#3a5f86"
    metalness: 0.0
    roughness: 0.55
    evidence: "coloured doors on a grey carcass is the standard product presentation"
    confidence: 0.6
  - id: hardware-steel
    family: bare-metal
    color: "#b9bec1"
    metalness: 0.9
    roughness: 0.42
    evidence: "camlock and vent louvres in bare steel"
    confidence: 0.6

critical_features:
  - id: frame-margin
    desc: >
      Each door opening is 50 mm narrower than the bay (25 mm of frame each side), so a visible
      margin runs down both sides of every door. A full-width door face is the obvious error and the
      handbook's own derived rule contradicts it.
    threshold: 0.80
  - id: nest-shares-sides
    desc: >
      Three bays as ONE carcass sharing internal side panels — not three separate lockers pushed
      together. The shared-panel weight increments in the handbook are the evidence.
    threshold: 0.75
  - id: ladder-proportion
    desc: "1800 tall x 300 wide x 450 deep per bay: tall, narrow and deep, straight off the BS ladder."
    threshold: 0.75

quality_contract:
  global_min: 0.78          # like torniquete: nearly every dimension is [CERT-doc]
  perf_budget:
    draws: 80                 # measured 73 — doors are individual meshes so they can swing
    tris: 30000               # measured 2942

camera:
  view: exterior
  azimuth_deg: 42
  elevation_deg: 14
  fov: 38
  target_y_m: 0.95
  radius_m: 3.8

lighting: house-rig
  # Coated dielectric carcass and doors — deliberate non-deviation, as in the other painted assets.

ui_controls:
  - "AUTO-ROTATE"
  - "OPEN DOORS"            # swings the upper tier
  - "NEST 3 / SINGLE"       # shows that a nest is not three lockers side by side
  - "SCALE 1.8 m"           # the carcass and the figure are the same height

colorTarget:
  srgb: [90, 134, 174]      # MEASURED on a door face
  deltaE00Max: 8
  crop: "60x40+600+220"   # upper-tier door face, at 1280x800
