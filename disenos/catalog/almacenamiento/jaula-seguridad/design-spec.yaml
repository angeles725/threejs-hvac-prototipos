# DesignSpec — wire-mesh security cage / caged store area
# Fifth asset of the `almacenamiento` family, and the first catalog asset gated through the
# design3d P0-P8 pipeline (flat-catalog shape: one declared gate pass, see gate_passes).
# Dimensional evidence: [Block 68] research/threejs-block68.md, from UFGS 10 22 13 (preserved).
# The spec's thesis: a security cage is decided by three numbers a modeller would otherwise guess —
# the wire gauge (which decides whether you can SEE through it), the post section (read off a table
# indexed by partition height), and the 64 mm it stands off the slab.

design: jaula-seguridad
family: almacenamiento
track: threejs
mode: standard
gate_passes: [materials]        # flat-catalog: a mesh partition closes on ONE materials gate
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"
p6_comparison: spec-only        # NO reference photographs exist — evidence is a textual federal
                                # specification. The evidence set therefore carries NO
                                # `reference-match` view: a preset that matches nothing is a lie.

complexity:
  scores: {silhouette: 1, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 1, detail: 2, occlusion: 2, action_readiness: 1}
  tier: moderate
  notes: >
    repetition 3 and components 3 carry this subject. 1,169 instances across 28 meshes, of which
    1,062 are mesh wires in two families at +-45 degrees; the part census comes from the
    manufacturer's own assembly vocabulary (panel frame, corner post, line post, post shoe, base
    plate, capping bar, door opening frame, service window, shelf). silhouette is only 1 — a cage
    is a box — which is exactly why the identity has to live in the parts and the material, not the
    outline. action_readiness 1: one hinged leaf, no linked mechanism.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    harness: research/tools/            # probe.mjs · capture.mjs · preflight.mjs · material-color-probe.mjs
    catalog_gate: disenos/catalog/tools/  # verify-catalog-asset.mjs · probe-state.mjs · qa-lock.sh
    dimensional_evidence: research/threejs-block68.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted enamel = dielectric 0.0; the padlock is the only bare metal"
    sibling_spec: "disenos/catalog/almacenamiento/rack-drive-in/design-spec.yaml (same family, same evidence discipline)"

references:
  - source: "sources/B68-cage-dims/ufgs-10-22-13-wire-mesh-partitions.pdf (UFGS 10 22 13, sha256 bc55c482…, fetched 2026-08-09)"
    evidences: >
      Dual-unit, duty-graded federal guide specification. HEAVY duty: "6 gage wire, 50 mm 2 inch
      mesh"; panel frames "38 by 20 by 3 mm"; corner post "Structural steel channel, 75 mm by 1.9 kg";
      line post for a 2100-3600 mm partition "62 by 7.9 mm"; framing angles "45 by 45 by 3 mm";
      "10 mm bolts 450 mm o.c.". Post shoes "adjustable, approximately 64 mm 2-1/2 inches high" over a
      "225 by 225 mm 9 by 9 inch steel base plate anchored to the floor with four" anchors; top frames
      secured "to a continuous capping bar" with U bolts "not more than 650 mm 28 inches o.c.".
      Service window "600 mm wide by 450 mm high", shelf "300 mm deep by 625 mm wide"; cut-outs framed
      with "25.4 mm 1 inch box channel". Door frames "32 by 13 by 3 mm" channels with a flat-bar cover
      on the top and bottom rails "and on hinge stile". Finish §2.8.8: "clean ferrous metal, treat with
      phosphate, and paint with [green][black][gray] enamel over suitable primer".
      The mesh is "woven diamond mesh" of "ASTM A510/A510M carbon steel wire".
      Every string above token-checked present in the preserved extract (block68 §68.1-§68.3).
    suitability: pass
    image: none        # a specification document, not a photograph — hence p6_comparison: spec-only
  - source: "wovenwire.org heavy-duty partition arch specs"
    evidences: "Second candidate source; download FAILED (connection reset, 0 bytes). Deleted rather than left on disk as an empty file pretending to be evidence. Nothing in this spec cites it."
    suitability: reject

dimensions_real:
  mesh_aperture_m: {value: 0.050, confidence: high}   # [CERT-doc] heavy duty "50 mm 2 inch mesh"
  wire_dia_m:      {value: 0.0049, confidence: high}  # [CERT-doc] 6 gage — modelled at TRUE diameter
  panel_frame_m:   {value: [0.038, 0.020], confidence: high}   # [CERT-doc] "38 by 20 by 3 mm" channel
  corner_post_m:   {value: 0.075, confidence: high}   # [CERT-doc] structural channel 75 mm
  line_post_m:     {value: 0.062, confidence: high}   # [CERT-doc] table row "2100 to 3600 mm | 62 by 7.9 mm"
  shoe_h_m:        {value: 0.064, confidence: high}   # [CERT-doc] "approximately 64 mm 2-1/2 inches high"
  base_plate_m:    {value: 0.225, confidence: high}   # [CERT-doc] "225 by 225 mm 9 by 9 inch steel base plate"
  window_m:        {value: [0.600, 0.450], confidence: high}   # [CERT-doc] service window opening
  shelf_m:         {value: [0.625, 0.300], confidence: high}   # [CERT-doc] "300 mm deep by 625 mm wide"
  window_frame_m:  {value: 0.0254, confidence: high} # [CERT-doc] cut-outs framed with 25.4 mm box channel
  door_frame_m:    {value: [0.032, 0.013], confidence: high}   # [CERT-doc] "32 by 13 by 3 mm" channels
  cage_w_m:        {value: 3.600, confidence: low}    # [INFER] a store-area footprint; not published
  cage_d_m:        {value: 2.400, confidence: low}    # [INFER] idem
  partition_h_m:   {value: 2.400, confidence: med}    # [INFER] chosen INSIDE the 2100-3600 mm band so
                                                      # the certified line-post row actually applies
  door_w_m:        {value: 0.900, confidence: low}    # [INFER] a single leaf a person walks through
  door_h_m:        {value: 2.050, confidence: low}    # [INFER]
  open_area_pct:   {value: 82, confidence: med}       # [CERT-doc]/[INFER] derived: (50/54.9)^2

hierarchy:
  - name: root
    children:
      - name: panels              # 9 framed mesh panels: front (built around 2 openings), back, 2 sides
        pivot: [0, 0, 0]
        animation: none
      - name: roof                # own group so TECHO can lift it; nothing rests on it
        pivot: [0, 0, 0]
        animation: none
      - name: posts               # 4 corner (75 mm) + 5 line/jamb (62 mm)
        pivot: [0, 0, 0]
        animation: none
      - name: shoes-and-plates    # 64 mm adjustable shoes over 225x225 base plates
        pivot: [0, 0, 0]
        animation: none
      - name: capping-bar         # continuous, over the top frames
        pivot: [0, 0, 0]
        animation: none
      - name: service-window      # framed cut-out + shelf + brackets
        pivot: [0, 0, 0]
        animation: none
        attachment:
          parent_socket: front-panel
          local_start: [0.85, 1.00, -1.20]
          local_end:   [0.85, 1.00, -1.48]
          contact_type: bolted-bracket
          overlap: 0.020
          gap_tolerance: 0.002
      - name: door-leaf           # the only moving part
        pivot: [-1.05, 0.064, -1.20]     # hinge axis: the FAR jamb, so the open leaf never crosses
        animation: {channel: "rotation.y", travel_deg: "0..90", direction: outward}
        children:
          - name: hinges
            attachment:
              parent_socket: door-stile
              local_start: [0.004, 0.28, -0.012]
              local_end:   [0.004, 1.77, -0.012]
              contact_type: welded
              embed_depth: 0.006
              gap_tolerance: 0.001
          - name: hasp-and-padlock
            attachment:
              parent_socket: door-leading-stile
              local_start: [0.84, 1.05, -0.014]
              local_end:   [0.88, 1.03, -0.020]
              contact_type: bolted
              overlap: 0.008
              gap_tolerance: 0.001
      - name: stored-load         # the interior, because 82% open area means it WILL be seen
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: cage-enamel
    family: painted-metal
    color: "#2f5d46"
    metalness: 0.0
    roughness: 0.55
    evidence: "[CERT-doc] UFGS §2.8.8 'paint with [green][black][gray] enamel over suitable primer'; HANDBOOK §3.1 painted = dielectric"
    source: table
    confidence: 0.88
  - id: frame-enamel
    family: painted-metal
    color: "#27503c"
    metalness: 0.0
    roughness: 0.52
    evidence: "[CERT-doc] same finish clause; frames read a half-step darker so the framing separates from the mesh field"
    source: table
    confidence: 0.82
  - id: base-steel
    family: painted-metal
    color: "#2a2f33"
    metalness: 0.0
    roughness: 0.70
    evidence: "[INFER] shoes/base plates are cast or forged steel (§2.8.6), left dark and unpainted-looking at the floor"
    source: estimated
    confidence: 0.72   # assumption stated: the clause names the material, not the finish
  - id: padlock-steel
    family: bare-metal
    color: "#c6cbcf"
    metalness: 0.95
    roughness: 0.28
    evidence: "[INFER] hardware; the ONLY bare metal on the asset, which is what makes the enamel read as enamel by contrast"
    source: estimated
    confidence: 0.75
  - id: pallet-wood
    family: wood
    color: "#a8814f"
    metalness: 0.0
    roughness: 0.82
    evidence: "EN 13698-1 EPAL pallet, reused from [Block 58]"
    source: table
    confidence: 0.85
  - id: load-carton
    family: paper
    color: "#b8a184"
    metalness: 0.0
    roughness: 0.90
    evidence: "generic stored load — a scale cue, not a certified dimension"
    source: estimated
    confidence: 0.60   # assumption stated: purely a scale/occupancy cue, no dimensional claim

critical_features:
  - id: diamond-mesh-stays-open
    desc: >
      Two wire families at +-45 degrees on a 50 mm aperture, at the TRUE 4.9 mm gauge, reading as a
      woven diamond partition — and still SEE-THROUGH at the 3/4 gate angle, with the stored pallets
      legible behind it. A fattened wire would read "safer" and go opaque; that is exactly how
      datacenter/rack-servidores hid 42U of equipment at exit 0.
    threshold: 0.78
  - id: enamel-not-galvanized
    desc: >
      The cage reads as PAINTED green enamel — a dielectric with no metal glint — against a single
      bare-metal padlock. A uniformly grey, shiny cage fails this: the source specifies enamel over
      primer, not galvanizing.
    threshold: 0.75
  - id: stands-off-the-slab
    desc: >
      Posts land on 64 mm adjustable shoes over 225x225 mm base plates, so there is a visible gap
      between the bottom frame and the floor. Mesh running into the slab is the cheap error and it
      deletes the reason the shoes exist (levelling).
    threshold: 0.75
  - id: service-window-is-an-interface
    desc: >
      A framed 600x450 mm opening with its 300x625 mm shelf on brackets. This is the detail that says
      a caged store is a counter you hand parts through, not a fence.
    threshold: 0.72
  - id: framed-door-with-hasp
    desc: >
      A framed door opening with a leaf whose hinge stile is reinforced differently from the rest,
      three hinges, and a hasp with a padlock. Hinged on the FAR jamb and swinging outward, so the
      open state reveals the interior instead of blanking it.
    threshold: 0.72

important_features:
  - id: capping-bar
    desc: "A continuous bar over the top frames along the whole perimeter (§2.8 U-bolt clause)."
  - id: interior-furnished
    desc: "Stored pallets and unit loads inside, placed clear of the door approach."

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 40                   # measured 27
    tris: 200000                # measured 14,666

camera:
  azimuth_deg: 144.4            # measured from +Z
  elevation_deg: 13.0
  fov: 38
  target_y_m: 0.90
  radius_m: 6.69
  framing_check: >
    MEASURED: the eight world corners of the default-state envelope — including the service shelf,
    which projects 0.28 m out of the front wall — land at ndcX -0.69..+0.68 and ndcY -0.93..+0.75 at
    1280x800, clearing the 4-line HUD by 102 px. An earlier camera had the base plates sitting ON the
    bottom edge at ndcY -0.981 with the gate green: the gate does not score the frame edge.
  evidence_views:
    - {id: neutral, url: "?view=neutral", role: "hero / mechanical + colorTarget anchor"}
    - {id: grazing, url: "?view=grazing", role: "low tangent on the front panel: enamel roll-off and wire depth"}

lighting: house-rig
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # Declared deviations, both from the ONBOARD coated-surface rule (painted steel burns at env 1.9 /
  # exposure 1.15; the rule is env ~1.5 / exposure ~1.02 + lateral fill):
  #   · environmentIntensity 1.60 and exposure 1.06 — nudged UP from the rule because this enamel is
  #     dark green and the subject is 82% open, so there is little surface to blow out;
  #   · one interior PointLight (6.0, range 7.0). Without it the enclosure reads as a dark box behind
  #     a grid and the open area — the entire point of a mesh partition — is wasted.
  # NOT applied: the vertical-bare-metal rescue (env ~2.15 + frontal fill). This subject is a painted
  # dielectric, so that recipe would only wash it out. Deliberate NON-deviation, recorded so the
  # counterexample survives (same discipline as the puertas family).

ui_controls:
  - "AUTO-ROTATE"
  - "PUERTA"                    # hinged leaf, 0..90 deg outward
  - "TECHO"                     # roof panel on/off
  - "CONTENIDO"                 # stored pallets and loads

colorTarget:
  # MEASURED from the gated neutral capture (materials-attempt1.png, SwiftShader, DPR 3, 2880x2160)
  # and anchored BY PROJECTED GEOMETRY: the mouth-facing web of the +X corner post, located by
  # projecting its world position to pixels rather than by hunting for a colour. Two samples on that
  # post (y=0.30 and y=1.60) read [17,67,46] and [18,68,46] at standard deviation 0.00.
  # Why the enamel and not the padlock: the enamel IS the material claim of this asset (a painted
  # dielectric, not galvanized steel), and it is the value that would silently regress if someone
  # "fixed" the dark green by reaching for metalness.
  # Cross-check that is worth recording: two jamb posts read [26.7,80.1,57.0] and [50.9,105.4,80.9].
  # That spread is REAL — the padlock practical lights the door bay — which is exactly why the anchor
  # is a named post at a named height and not "some green pixel".
  srgb: [17, 67, 46]
  deltaE00Max: 6
  crop: "12x40+861+1797"
