# DesignSpec — stackable Euro-format container (600 x 400 x 220 mm)
# Dimensional evidence: [Block 61] (research/threejs-block61.md).
# NOT a free-form bin: 600 x 400 is a MODULE of the 1200 x 800 EUR pallet modelled in rack-pallet
# ([Block 58]) — exactly 4 per layer. The two assets are dimensionally locked.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: contenedor-metalico
family: almacenamiento
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.02 m"   # a 0.05 m voxel cannot resolve a 220 mm-tall box

complexity:
  scores: {silhouette: 1, components: 1, hierarchy: 1, repetition: 2,
           material_layers: 1, detail: 2, occlusion: 0, action_readiness: 0}
  tier: simple
  notes: >
    A single box whose value is DIMENSIONAL, not geometric: it proves the module relationship with
    the pallet. repetition 2 because the asset shows a stack and a full pallet layer.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block61.md
  reuse_pointers:
    pallet_source: "disenos/catalog/almacenamiento/rack-pallet/ — same EUR pallet, same numbers"

references:
  - source: "sources/B61-storage-dims/utz-euro-container (George Utz, fetched 2026-08-08)"
    evidences: "600x400x220 mm; solid sidewalls; solid base; two shell handles; stacking."
    suitability: pass
  - source: "sources/B61-storage-dims/wikipedia-euro-container"
    evidences: >
      The standard is VDA 4500 and the object is a Kleinladungsträger (KLT); example labelled
      "R-KLT Euro 600 x 400 mm stackable container (tall version, 280 mm high)".
      NOTE: the gap premise "EN 13199" was REFUTED — that token appears zero times. See B61 §61.1.
    suitability: pass

dimensions_real:
  plan_l_m:      {value: 0.600, confidence: high}   # [CERT-web]
  plan_w_m:      {value: 0.400, confidence: high}   # [CERT-web]
  height_m:      {value: 0.220, confidence: high}   # [CERT-web] (tall variant 0.280)
  height_tall_m: {value: 0.280, confidence: high}   # [CERT-a] Wikipedia caption
  wall_t_m:      {value: 0.004, confidence: low}    # [INFER] sheet gauge not published
  rim_m:         {value: 0.018, confidence: low}    # [INFER] top rim/lip
  per_pallet_layer: {value: 4,  confidence: high}   # [INFER] arithmetic: 1200/600 x 800/400
  standard:      {value: "VDA 4500 KLT", confidence: high}   # [CERT-a] — NOT EN 13199

hierarchy:
  - name: root
    children:
      - name: container      # walls + base + rim + stamped end handles + stacking corners
        pivot: [0, 0, 0]
        animation: none
      - name: stack          # 3 stacked units, to show the stacking corners engage
        pivot: [0, 0, 0]
        animation: none
      - name: palletlayer    # 4 units on an EUR pallet — the module proof
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: steel-galvanized
    family: bare-metal
    color: "#c6cbcd"           # raised from #b4b9bb after the render read too dark
    metalness: 0.90
    roughness: 0.44
    evidence: "the manifest asks for a STEEL tote; euro footprint from [CERT-web]. HANDBOOK §3.1 bare metal"
    confidence: 0.75
  - id: pallet-wood
    family: wood
    color: "#a8814f"
    metalness: 0.0
    roughness: 0.82
    evidence: "same EUR pallet material as rack-pallet"
    confidence: 0.85

critical_features:
  - id: euro-module
    desc: >
      Four containers cover an EUR pallet exactly, with no gap and no overhang. This is the whole
      point of the asset — if the footprint is wrong the layer will not close.
    threshold: 0.80
  - id: stacking-corners
    desc: "Units stack on their rim/corner features, not by floating one box above another."
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 25                 # measured 16
    tris: 30000               # measured 182

camera:
  view: exterior
  azimuth_deg: 42
  elevation_deg: 22
  fov: 38
  target_y_m: 0.28
  radius_m: 2.6

lighting: house-rig + vertical-subject fill + IBL 3.2
  # Bare galvanized steel on vertical box walls — same reflection geometry as the other bare-metal
  # assets, so the IBL carries the read (see torniquete spec for the full reasoning).

ui_controls:
  - "AUTO-ROTATE"
  - "STACK"                 # 3 units stacked
  - "PALLET LAYER"          # 4 units on a EUR pallet — proves the 600x400 module
  - "TALL 280"              # the tall KLT variant

colorTarget:
  srgb: [105, 110, 113]     # MEASURED on the front wall
  deltaE00Max: 8
  crop: "80x50+620+470"   # front wall, at 1280x800
