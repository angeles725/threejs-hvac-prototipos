# DesignSpec — 42U server rack, perforated front and rear doors
# First asset of the catalog `datacenter` family.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# EVIDENCE DISCIPLINE: this asset has ONE hard [CERT] number, the EIA rack unit, taken from the
# repo's own rack study. The 600 mm width follows from it by convention; depth, base height and
# the equipment fill are [INFER] at confidence <= 0.7.

design: rack-servidores
family: datacenter
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"

complexity:
  scores: {silhouette: 1, components: 3, hierarchy: 2, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 3, action_readiness: 1}
  tier: complex
  notes: >
    occlusion 3 with an unusual twist: the doors are meant to be SEEN THROUGH, so the occluder is
    itself the feature. repetition 3 — 42 U positions, 4 punched rails, 40 PDU outlets, hundreds of
    mesh bars, all instanced.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    dimensional_study: "disenos/datacenter-hotspot/rack-detail.html :L494"
    isa101_states: "research/HANDBOOK.md §3.4"

references:
  - source: "disenos/datacenter-hotspot/rack-detail.html :L494,L511 (repo primary)"
    evidences: >
      [CERT] `const HW=0.30, HD=0.425, RH=2.0, U=0.04445, BASE_Y=0.11, RAIL_X=0.232` with a 42U
      stack. U = 0.04445 m is the real EIA rack unit (1.75 in) and carries over unchanged, as do
      the 0.60 m frame width (2 x HW) and the ~0.232 m rail centres.
    suitability: pass
  - source: "research/HANDBOOK.md §3.1 (PBR palette) + §3.4 (ISA-101)"
    evidences: "[CERT] near-binary metalness; powder-coated frame is dielectric; neutral grey normal."
    suitability: pass
  - source: "rack practice (no document preserved in sources/)"
    evidences: >
      [INFER] 1000 mm depth for a modern server rack (the repo study models 850, which suits a
      network rack better); blanking panels in unused Us because an open U short-circuits the cold
      aisle into the hot one; two 0U vertical PDU strips at the rear corners.
    suitability: partial

dimensions_real:
  rack_unit_m:  {value: 0.04445, confidence: high}  # [CERT] EIA U, 1.75 in
  units:        {value: 42,     confidence: high}   # [CERT] the study's stack
  width_m:      {value: 0.60,   confidence: high}   # [CERT] 2 x HW from the study
  rail_centres_m: {value: 0.465, confidence: high}  # [CERT] 2 x RAIL_X; the 19 in mounting standard
  depth_m:      {value: 1.00,   confidence: low}    # [INFER] deeper than the study's 0.85
  base_h_m:     {value: 0.10,   confidence: low}    # [INFER]
  stack_h_m:    {value: 1.867,  confidence: high}   # 42 x U, derived
  overall_h_m:  {value: 2.02,   confidence: med}

hierarchy:
  - name: root
    children:
      - name: frame           # base, 4 corner posts, top frame, roof plate, brush entry, feet
        pivot: [0, 0, 0]
        animation: none
      - name: rails           # 4 punched 19 in mounting rails + U numbering strip
        pivot: [0, 0, 0]
        animation: none
      - name: equip           # servers, switches, patch panels, blanking panels, status LEDs
        pivot: [0, 0, 0]
        animation: none
      - name: pdus            # 2 vertical 0U strips + outlets + rear cable bundles
        pivot: [0, 0, 0]
        animation: none
      - name: doors           # front and rear PERFORATED leaves, hinged on opposite sides
        pivot: per-leaf, outboard stile
        animation: swing
      - name: sides           # side panels (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: frame-powdercoat
    family: painted-metal
    color: "#2f343b"
    metalness: 0.0             # a black rack is COATED. Making it metallic is the obvious slip and
    roughness: 0.52            # it destroys the read: black metal facing a dark hemisphere returns
    evidence: "HANDBOOK §3.1 painted enclosure 0.0-0.05"   # nothing at all.
    confidence: 0.9
  - id: chassis-steel
    family: bare-metal
    color: "#a5abb0"
    metalness: 0.88
    roughness: 0.46
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0 — plated server chassis"
    confidence: 0.85
  - id: rail-zinc
    family: bare-metal
    color: "#b0b5b8"
    metalness: 0.92
    roughness: 0.44
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0"
    confidence: 0.85
  - id: led-isa101
    family: emissive
    color: "#5a6878"
    metalness: 0.0
    roughness: 0.40
    evidence: "HANDBOOK §3.4 — populated units idle neutral-green; red marks only the hot top"
    confidence: 0.9

critical_features:
  - id: mesh-you-can-see-through
    desc: >
      The perforated door is a real screen, and its web is SHALLOW (2.5 mm). Modelled with 10 mm
      deep bars the grid self-occludes off-axis and the door goes solid at exactly the 3/4 view the
      catalog camera uses: the equipment behind it disappears while every count says it is present.
    threshold: 0.82
  - id: non-uniform-fill-with-blanks
    desc: >
      A mixture of 1U and 2U servers, switches, patch panels and blanking panels. Blanks are
      functional — an open U short-circuits cold air into the hot aisle — not filler.
    threshold: 0.80
  - id: real-U-pitch
    desc: >
      Everything lands on the 44.45 mm module: rail punches in threes per U, equipment heights as
      integer U, the numbering strip stepping every 2U.
    threshold: 0.85
  - id: front-to-back-airflow-story
    desc: "Perforated front AND rear, brush cable entry on top, 0U PDUs at the rear corners."
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 400          # measured 355
    tris: 20000         # measured 14,150

camera:
  azimuth_deg: 44
  elevation_deg: 11
  fov: 38
  target_y_m: 1.02
  radius_m: 4.3

lighting: house-rig + vertical-subject fill, RAISED
  # DOCUMENTED DEVIATION, stronger than the electricos cabinets needed. This subject is both a large
  # VERTICAL plane and near-BLACK, so it suffers the flat-plane problem twice over: a dark vertical
  # face reflecting a dark lower hemisphere returns almost nothing. Panel-normal fill goes to 1.70
  # (cabinets used 0.85), environmentIntensity to 2.6, ambient to 0.34. metalness/roughness
  # unchanged per HANDBOOK §3.1 — the frame stays a dielectric at 0.0.

ui_controls:
  - "AUTO-ROTATE"
  - "ABRIR PUERTAS"              # front and rear leaves, hinged on opposite sides
  - "PANELES LATERALES"
  - "ALARMA TÉRMICA (ISA-101)"   # red marks the TOP of the stack, where hot air collects

colorTarget:
  srgb: [33, 38, 46]
  deltaE00Max: 8
  crop: "22x18+680+160"   # clean side panel at 1280x800, per-channel std 0.00

verification:
  gate: "node disenos/catalog/tools/verify-catalog-asset.mjs datacenter/rack-servidores"
  state_probe: "node disenos/catalog/tools/probe-state.mjs datacenter/rack-servidores btnDoor open"
  measured: {ready: true, calls: 355, triangles: 14150, console_errors: 0, shadowAuto: false}
  # Caught by reading the capture, not the counts: the mesh door's bars were 10 mm deep and stacked
  # visually at the catalog's 3/4 angle, turning the perforated door opaque. Every server, switch
  # and patch panel behind it was in the scene graph and in the draw calls, and none of it was
  # visible. Thinning the web to 2.5 mm restored the see-through.
  known_flake: >
    The gate fetches three.js from unpkg. A CDN hiccup surfaces as ready:false / error:'no-renderer'
    with an EMPTY console-error list and zero __ globals. Re-run before believing it.
