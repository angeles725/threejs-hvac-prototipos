# DesignSpec — 0U vertical rack PDU (metered outlet strip)
# Fourth asset of the catalog `datacenter` family.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md
#
# EVIDENCE DISCIPLINE: no manufacturer datasheet was preserved. The EIA rack unit is inherited from
# the same repo source as rack-servidores; everything else is [INFER] at confidence <= 0.7.
#
# SCOPE BOUNDARY vs electricos/pdu — three shared letters, two machines three orders of magnitude
# apart. THIS is the 0U strip that clips into a rack upright. That one is a floor-standing cabinet
# with a K-rated isolation transformer in its base.

design: pdu-rack
family: datacenter
track: procedural-direct
gate_passes: [materials]
mode: standard
scale: "1 unit = 1 m"

complexity:
  scores: {silhouette: 1, components: 2, hierarchy: 1, repetition: 3,
           material_layers: 2, detail: 3, occlusion: 1, action_readiness: 0}
  tier: moderate
  notes: >
    detail 3 on an object 55 mm across: 30 outlets, 3 breakers, a metering head, mount buttons. The
    real difficulty is SCALE LEGIBILITY, not geometry — see the rack-upright note in hierarchy.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
  reuse_pointers:
    rack_unit_source: "disenos/catalog/datacenter/rack-servidores/design-spec.yaml"
    scope_boundary: "disenos/catalog/electricos/pdu/ (the floor-standing cabinet)"

references:
  - source: "disenos/datacenter-hotspot/rack-detail.html :L494 (repo primary, via rack-servidores)"
    evidences: "[CERT] U = 0.04445 m; the rack upright context is built on the same module."
    suitability: pass
  - source: "research/HANDBOOK.md §3.1 (PBR palette) + §3.4 (ISA-101)"
    evidences: >
      [CERT] near-binary metalness; the extrusion is bare aluminium, the outlet bodies are moulded
      PC/ABS dielectrics; amber for an abnormal-but-not-tripped condition.
    suitability: pass
  - source: "rack PDU practice (no document preserved in sources/)"
    evidences: >
      [INFER] ~55 mm square extrusion, 1.6-1.8 m long; outlets grouped into breaker-protected
      banks; C19 outlets low in each bank where high-current loads sit; a metering head with
      display and network ports at the top; tool-less 0U mounting buttons on the rear.
    suitability: partial

dimensions_real:
  rack_unit_m:  {value: 0.04445, confidence: high}  # [CERT], inherited
  bar_section_m: {value: 0.055, confidence: low}
  bar_length_m: {value: 1.70,  confidence: low}
  c13_outlets:  {value: 24,    confidence: low}
  c19_outlets:  {value: 6,     confidence: low}
  banks:        {value: 3,     confidence: low}

hierarchy:
  - name: root
    children:
      - name: frameGrp        # rack corner posts, cross members, 0U mounting channel, mount buttons
        pivot: [0, 0, 0]
        animation: none
        notes: >
          CONTEXT, and deliberate. A 55 mm x 1.7 m strip alone in frame has no scale cue whatsoever
          — it could be a 200 mm desk accessory. And "0U" is a statement about WHERE it mounts, so
          the upright is part of what the asset has to communicate.
      - name: strip           # extrusion, end caps, rear brackets, metering head, banks, outlets
        pivot: [0, 0, 0]
        animation: none
      - name: cords           # patch cords plugged into alternate outlets (togglable)
        pivot: [0, 0, 0]
        animation: none

materials:
  - id: extrusion-aluminium
    family: bare-metal
    color: "#8f959b"
    metalness: 0.93
    roughness: 0.42
    evidence: "HANDBOOK §3.1 bare-metal 0.9-1.0"
    confidence: 0.85
  - id: outlet-body-pc-abs
    family: plastic
    color: "#1c1f24"
    metalness: 0.0             # the outlet body and the extrusion it is set into live 2 mm apart
    roughness: 0.48            # and are OPPOSITE surface families. Single most likely error here.
    evidence: "HANDBOOK §3.1 dielectric metalness 0"
    confidence: 0.85
  - id: outlet-contact
    family: bare-metal
    color: "#b9bec1"
    metalness: 0.92
    roughness: 0.40
    evidence: "HANDBOOK §3.1 bare-metal — plated contacts inside the moulded body"
    confidence: 0.8
  - id: breaker-toggle
    family: plastic
    color: "#b03a2a"
    metalness: 0.0
    roughness: 0.50
    evidence: "moulded toggle — dielectric"
    confidence: 0.8
  - id: led-isa101
    family: emissive
    color: "#5a6878"
    metalness: 0.0
    roughness: 0.40
    evidence: "HANDBOOK §3.4 — amber for an overloaded bank, abnormal but not a trip"
    confidence: 0.9

critical_features:
  - id: scale-is-legible
    desc: >
      The rack upright, cross members and 0U channel are in frame so the strip reads at its true
      55 mm section. Without them the object has no size at all.
    threshold: 0.82
  - id: banked-with-breakers
    desc: >
      Three banks, each with its own breaker at its head and its own outlet group. An unbroken run
      of identical outlets would be an unmetered basic strip, a different product.
    threshold: 0.78
  - id: two-outlet-types
    desc: "C19 outlets low in each bank for high-current loads, C13 filling the rest."
    threshold: 0.75
  - id: body-and-outlets-are-different-families
    desc: "Bare aluminium extrusion, moulded dielectric outlet bodies, plated contacts inside them."
    threshold: 0.78

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 60           # measured 36
    tris: 4000          # measured 1,562

camera:
  azimuth_deg: 46
  elevation_deg: 9
  fov: 38
  target_y_m: 1.02
  radius_m: 4.0

lighting: house-rig + vertical-subject fill
  # r160 NO-OP (swept 2026-08-09; root documented in shell-template.html, b7282f8): the
  # environmentIntensity figure quoted in this section is INERT. Scene.environmentIntensity does
  # not exist before r163, so assigning it only sets an expando the renderer never reads (measured
  # on r160: absent from Scene.prototype, every material still at envMapIntensity 1). The render
  # this spec's colorTarget and counts were measured from comes from the EXPLICIT lights alone.
  # The wording below is kept as authored and is corrected by this note, not rewritten.
  # DOCUMENTED DEVIATION: a dark, narrow VERTICAL subject. Panel-normal fill 1.30,
  # environmentIntensity 2.4. metalness/roughness unchanged per HANDBOOK §3.1.

ui_controls:
  - "AUTO-ROTATE"
  - "POSTE DEL RACK"          # the scale context; off, the strip is unreadable in size
  - "CORDONES"
  - "SOBRECARGA (ISA-101)"

colorTarget:
  # MEASURED from the capture. NOTE the honest limitation: at 55 mm section and this camera
  # distance the strip is only ~10 px wide, so there is no large uniform area of the identity
  # material available. The crop below is small but has a per-channel standard deviation of 0.00,
  # which is the criterion that matters — a big crop straddling an outlet edge would certify
  # nothing. Larger crops on this asset were measured at std 18.7 and rejected.
  srgb: [67, 74, 82]
  deltaE00Max: 8
  crop: "5x10+618+470"   # clean extrusion side face at 1280x800, per-channel std 0.00

verification:
  gate: "node disenos/catalog/tools/verify-catalog-asset.mjs datacenter/pdu-rack"
  state_probe: "node disenos/catalog/tools/probe-state.mjs datacenter/pdu-rack btnCord,btnAlm cords"
  measured: {ready: true, calls: 36, triangles: 1562, console_errors: 0, shadowAuto: false}
  # Caught by reading the capture: the first camera at radius 2.9 cropped the top of the strip and
  # the rack post, so the framing lost both the metering head and the scale context in one go.
  known_flake: >
    The gate fetches three.js from unpkg. A CDN hiccup surfaces as ready:false / error:'no-renderer'
    with an EMPTY console-error list and zero __ globals. Re-run before believing it.
