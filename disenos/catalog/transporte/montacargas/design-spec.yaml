# DesignSpec — electric counterbalance forklift (1,6-2,0 t class)
# Dimensional evidence is [Block 72] §72.2 (research/threejs-block72.md) from a preserved VDI 2198
# type sheet. This is the best-evidenced asset in the whole catalog axis: VDI 2198 PRESCRIBES a
# numbered dimensional disclosure, so nearly every number here is [CERT-doc] with its row.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: montacargas
family: transporte
track: needs-research
gate_passes: [materials, motion]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 3, components: 3, hierarchy: 2, repetition: 0,
           material_layers: 2, detail: 2, occlusion: 2, action_readiness: 3}
  tier: complex
  notes: >
    repetition 0 — there is nothing to instance here, so InstancedMesh is correctly ABSENT
    ([Block 54] low-repetition caveat). hierarchy 2 and action_readiness 3: the mast is a real
    kinematic chain (tilt pivot → outer mast → inner mast → carriage → forks → load), with free lift
    modelled as the 100 mm the carriage travels alone before the inner mast follows.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block72.md
    motion_evidence: research/threejs-block70.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted bodywork = dielectric 0.0; forged forks = bare metal 0.9"
    pallet: "[Block 58] EUR pallet 800 x 1,200 x 144 mm — the load this machine is dimensioned around"

references:
  - source: "sources/datasheets/220991868-erp16-20vf-a955-spec-sheet-rev-00-en-low-res.pdf :p.4"
    evidences: >
      VDI 2198 type sheet, Yale ERP16-20VF (1,600-2,000 kg, 4-wheel electric). Rows used verbatim:
      1.6 load centre c = 500; 1.9 wheelbase y = 1431/1539; 3.6 tread front b10 = 889/908;
      4.1 tilt 5°/5°; 4.2 mast lowered h1 = 2230/2180; 4.3 free lift h2 = 100; 4.5 mast extended
      h4 = 3868/4006; 4.7 overhead guard h6 = 2070; 4.8 seat height h7 = 1017; 4.19 overall length
      l11 = 2980/3088; 4.20 length to fork face l2 = 1980/2088; 4.21 overall width b1 = 1050 (1116
      with the wider tyres required for masts >= 5000); 4.22 fork dimensions ISO 2331 s/e/l =
      40/80/1000; 4.31 m1 = 70; 4.32 m2 = 100; 4.33 load 1000 x 1200; 4.35 turning radius Wa = 1654.
    suitability: pass
  - source: "research/threejs-block72.md §72.2"
    evidences: >
      l11 - l2 ≈ 1000 mm is the fork length, leaving ~2000 mm of body and counterweight BEHIND the
      front axle — the counterbalance principle, which must read in the silhouette. Forks are 1000 mm,
      so a 1200 mm EUR pallet overhangs the tips by 200 mm. Free lift is only 100 mm, so animating
      lift must move mast STAGES, not just the carriage.
    suitability: pass

dimensions_real:
  overall_length_m:   {value: 2.980, confidence: high}   # [CERT-doc] VDI 4.19 (l11)
  length_to_forks_m:  {value: 1.980, confidence: high}   # [CERT-doc] VDI 4.20 (l2)
  overall_width_m:    {value: 1.050, confidence: high}   # [CERT-doc] VDI 4.21 (b1)
  wheelbase_m:        {value: 1.431, confidence: high}   # [CERT-doc] VDI 1.9 (y)
  tread_front_m:      {value: 0.889, confidence: high}   # [CERT-doc] VDI 3.6 (b10)
  mast_lowered_m:     {value: 2.230, confidence: high}   # [CERT-doc] VDI 4.2 (h1)
  mast_extended_m:    {value: 3.868, confidence: high}   # [CERT-doc] VDI 4.5 (h4)
  free_lift_m:        {value: 0.100, confidence: high}   # [CERT-doc] VDI 4.3 (h2)
  guard_height_m:     {value: 2.070, confidence: high}   # [CERT-doc] VDI 4.7 (h6)
  seat_height_m:      {value: 1.017, confidence: high}   # [CERT-doc] VDI 4.8 (h7)
  ground_clear_m:     {value: 0.100, confidence: high}   # [CERT-doc] VDI 4.32 (m2)
  fork_s_e_l_m:       {value: [0.040, 0.080, 1.000], confidence: high}  # [CERT-doc] VDI 4.22, ISO 2331
  tilt_deg:           {value: [5, 5], confidence: high}  # [CERT-doc] VDI 4.1 forward/backward
  load_centre_m:      {value: 0.500, confidence: high}   # [CERT-doc] VDI 1.6 (c)
  turning_radius_m:   {value: 1.654, confidence: high}   # [CERT-doc] VDI 4.35 (Wa)
  fork_spread_m:      {value: 0.380, confidence: low}    # [INFER] not a VDI row; set to a EUR pallet's stringers
  wheel_r_front_m:    {value: 0.235, confidence: low}    # [INFER] tyre size given as a code, not a diameter
  wheel_r_rear_m:     {value: 0.195, confidence: low}    # [INFER]
  mast_stages:        {value: 2,     confidence: low}    # [INFER] B72 §72.6: the sheet fixes heights, not stages

hierarchy:
  - name: root
    children:
      - name: chassis         # one continuous frame, tail to just behind the mast
        pivot: [0, 0, 0]
        animation: none
      - name: counterweight   # painted with the machine, rising above the deck at the tail
        pivot: [0, 0, 0]
        animation: none
      - name: cowl            # battery/motor cowl carrying the seat at h7
        pivot: [0, 0, 0]
        animation: none
      - name: wheels          # 2 front driven (larger) + 2 rear steer, wheelbase 1,431 exactly
        pivot: [0, 0, 0]
        animation: none
      - name: guard           # 4 posts + SLATTED roof at h6
        pivot: [0, 0, 0]
        animation: none
      - name: mast            # TILT pivot (±5°)
        pivot: [0.43, 0.20, 0]
        animation: tilt-z
        children:
          - name: inner       # inner mast + chromed ram — moves at half the carriage stroke
            animation: translate-y
          - name: carriage    # backrest + fork shanks + blades
            animation: translate-y
            children:
              - name: load    # EUR pallet + cargo, parented so it rides the lift
                animation: inherited

materials:
  - id: body-painted
    family: painted-metal
    color: "#b4531c"
    metalness: 0.0
    roughness: 0.48
    evidence: "painted bodywork is a DIELECTRIC; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.85
  - id: counterweight-painted
    family: painted-metal
    color: "#8f3f14"
    metalness: 0.0
    roughness: 0.58
    evidence: >
      A counterweight is painted with the machine, not left as bare cast iron. First modelled as dark
      grey, which read as a separate object bolted to the truck — corrected to a darker shade of the
      body colour, which is both truer and legible as one machine.
    confidence: 0.75
  - id: fork-steel
    family: bare-metal
    color: "#b9bec1"
    metalness: 0.92
    roughness: 0.36
    evidence: "forged fork blades are BARE steel — the one bare-metal element on a painted machine"
    confidence: 0.85
  - id: lift-ram
    family: bare-metal
    color: "#d2d6d8"
    metalness: 0.95
    roughness: 0.16
    evidence: "chromed hydraulic ram — the lowest roughness on the asset; HANDBOOK §3.1"
    confidence: 0.75
  - id: mast-painted
    family: painted-metal
    color: "#2f3439"
    metalness: 0.0
    roughness: 0.50
    evidence: "mast channels painted dark; dielectric"
    confidence: 0.8
  - id: tyre
    family: rubber
    color: "#15171a"
    metalness: 0.0
    roughness: 0.92
    evidence: "cushion/pneumatic tyre; HANDBOOK §3.1 dielectric"
    confidence: 0.85

critical_features:
  - id: counterbalance-silhouette
    desc: >
      ~2 m of body and counterweight behind the front axle against ~1 m of fork ahead of it. The mass
      distribution IS the machine; a forklift modelled with a short tail is a different vehicle.
    threshold: 0.80
  - id: pallet-overhangs-the-forks
    desc: >
      Forks are 1,000 mm (ISO 2331) under a 1,200 mm EUR pallet, so the pallet overhangs the tips by
      200 mm. The same overhang lesson as [Block 58]'s rack, on a different machine — and the detail a
      modeller gets backwards by making the forks reach the far edge.
    threshold: 0.78
  - id: free-lift-then-stages
    desc: >
      The carriage rises 100 mm alone (VDI 4.3) before the inner mast starts to follow, and full
      travel takes the mast from 2,230 to 3,868 mm. A carriage sliding up a static mast is wrong.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 50          # measured 43 — no instancing, correctly: repetition score is 0
    tris: 20000        # measured 1 342

camera:
  azimuth_deg: 33.2
  elevation_deg: 12.6
  fov: 38
  target_y_m: 1.05
  radius_m: 5.0

lighting: house-rig
  # No material deviation. The painted bodywork is dielectric, so the flat-grey-vertical-metal problem
  # of the `puertas` family does not apply; the bare forks are small and horizontal.
  deviation:
    id: shadow-rebake-while-lifting
    what: "`shadowMap.autoUpdate` stays false; `needsUpdate` is re-fired per frame only while lift/tilt are in flight."
    why: >
      [Block 70] §70.4 names a mast lifting and a fork rising as the motion class that DOES invalidate
      a frozen shadow (unlike the belt's UV scroll). The re-bake is bounded by the easing: it stops as
      soon as the motion settles.

ui_controls:
  - "AUTO-ROTATE"
  - "ELEVAR"     # full travel h1 → h4, with free lift before the inner mast follows
  - "CARGA"      # EUR pallet + cargo on the forks
  - "INCLINAR"   # back-tilt 5° (VDI 4.1)

colorTarget:
  # MEASURED from the rendered painted bodywork (headless SwiftShader capture at 1280x800).
  # The BODY is the target: painted-as-dielectric on a machine that also carries bare steel forks is
  # the material claim most likely to regress.
  srgb: [188, 83, 37]
  deltaE00Max: 8
  crop: "18x6+430+430"
  secondary:
    - {id: guard-painted, srgb: [53, 57, 61], crop: "18x6+560+300"}
