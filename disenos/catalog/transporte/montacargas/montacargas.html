<!doctype html>
<!--
  montacargas — electric counterbalance forklift (1,6-2,0 t class), catalog/transporte.
  Dimensional evidence: [Block 72] §72.2 from sources/datasheets/220991868-erp16-20vf-...pdf :p.4,
  a VDI 2198 type sheet — the one standard in this whole catalog axis that PRESCRIBES a full
  dimensional disclosure. Every number below carries its VDI row.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montacargas contrabalanceado — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Montacargas eléctrico contrabalanceado (1,6-2,0 t)</div>
  <div><span class="dim">l11 2,980 × b1 1,050 × h6 2,070 m · centro de carga c 500 mm</span></div>
  <div><span class="dim">VDI 2198 · y 1,431 · h1 2,230 → h4 3,868 · horquillas 40/80/1000</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnLift">ELEVAR</button>
  <button id="btnLoad">CARGA</button>
  <button id="btnTilt">INCLINAR</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 12, 34);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 5.0;
camera.position.set(R*Math.cos(0.58)*Math.cos(0.22), 1.05 + R*Math.sin(0.22), R*Math.sin(0.58)*Math.cos(0.22));
camera.lookAt(0, 1.05, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 1.05, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.9;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.6, 6.2, 3.2); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;
sun.shadow.camera.left=-3.2; sun.shadow.camera.right=3.2;
sun.shadow.camera.top=3.6; sun.shadow.camera.bottom=-3.6;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(26,26),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS
// ============================================================================
const matBody   = new THREE.MeshStandardMaterial({ color:0xb4531c, metalness:0.0, roughness:0.48 });  // PAINTED bodywork
const matCw     = new THREE.MeshStandardMaterial({ color:0x8f3f14, metalness:0.0, roughness:0.58 });  // counterweight: PAINTED with the machine, darker shade
const matMast   = new THREE.MeshStandardMaterial({ color:0x2f3439, metalness:0.0, roughness:0.5 });   // painted mast channels
const matFork   = new THREE.MeshStandardMaterial({ color:0xb9bec1, metalness:0.92, roughness:0.36 }); // BARE forged steel
const matRam    = new THREE.MeshStandardMaterial({ color:0xd2d6d8, metalness:0.95, roughness:0.16 }); // chromed lift ram
const matTyre   = new THREE.MeshStandardMaterial({ color:0x15171a, metalness:0.0, roughness:0.92 });
const matRim    = new THREE.MeshStandardMaterial({ color:0x8b9095, metalness:0.9, roughness:0.42 });
const matGuard  = new THREE.MeshStandardMaterial({ color:0x33383d, metalness:0.0, roughness:0.55 });
const matSeat   = new THREE.MeshStandardMaterial({ color:0x1c1f23, metalness:0.0, roughness:0.85 });
const matWood   = new THREE.MeshStandardMaterial({ color:0xa8814f, metalness:0.0, roughness:0.82 });
const matBox    = new THREE.MeshStandardMaterial({ color:0xb8a184, metalness:0.0, roughness:0.9 });

// ============================================================================
// ZONE 2 — GEOMETRY.  Every dimension carries its VDI 2198 row — [Block 72] §72.2.
// ============================================================================
const L11   = 2.980;   // 4.19 overall length            [CERT-doc]
const L2    = 1.980;   // 4.20 length to face of forks    [CERT-doc]
const B1    = 1.050;   // 4.21 overall width              [CERT-doc]
const Y     = 1.431;   // 1.9  wheelbase                  [CERT-doc]
const H1    = 2.230;   // 4.2  mast lowered               [CERT-doc]
const H4    = 3.868;   // 4.5  mast extended              [CERT-doc]
const H2    = 0.100;   // 4.3  free lift                  [CERT-doc]
const H6    = 2.070;   // 4.7  overhead guard height      [CERT-doc]
const H7    = 1.017;   // 4.8  seat height                [CERT-doc]
const B10   = 0.889;   // 3.6  tread, front               [CERT-doc]
const M2    = 0.100;   // 4.32 ground clearance at wheelbase centre [CERT-doc]
const FORK_S = 0.040, FORK_E = 0.080, FORK_L = 1.000;   // 4.22 ISO 2331   [CERT-doc]
const TILT  = 5*Math.PI/180;                             // 4.1 ±5°        [CERT-doc]
const FORK_SPREAD = 0.380;   // [INFER] not on the sheet; a EUR pallet's stringer spacing
const LIFT_MAX = H4 - H1;    // the carriage travel implied by rows 4.2 and 4.5

const FORK_FACE = L11/2 - L2;            // = +0.49 : forks reach to +1.49, body back to -1.49
const AXLE_F = FORK_FACE - 0.19;         // [INFER] drive axle just behind the mast
const AXLE_R = AXLE_F - Y;               // wheelbase 1.431 exactly
const WH_F_R = 0.235, WH_R_R = 0.195;    // [INFER] wheel radii — not on the sheet

const root = new THREE.Group();

// --- chassis: ONE continuous frame from the tail to just behind the mast, then the raised
//     battery cowl, then the counterweight. Modelled as abutting spans (no gaps): a chassis built
//     from floating blocks reads as parts, not as a machine.
const CH_BACK = -L11/2;                    // -1.49 : the tail face
const CH_FRONT = FORK_FACE - 0.15;         // +0.34 : just behind the mast
const CH_TOP = M2 + 0.52;                  // 0.62  : deck level

const chassis = new THREE.Mesh(new THREE.BoxGeometry(CH_FRONT - CH_BACK, CH_TOP - M2, B1 - 0.06), matBody);
chassis.position.set((CH_FRONT + CH_BACK)/2, (CH_TOP + M2)/2, 0);
chassis.castShadow = true; chassis.receiveShadow = true; root.add(chassis);

// The counterweight is the machine's reason for existing: mass BEHIND the rear axle. It rises above
// the deck and closes the tail — l11 - l2 is its length budget ([Block 72] §72.2).
const CW_FRONT = -0.86;
const cw = new THREE.Mesh(new THREE.BoxGeometry(CW_FRONT - CH_BACK, 0.98 - M2, B1), matCw);
cw.position.set((CW_FRONT + CH_BACK)/2, (0.98 + M2)/2, 0);
cw.castShadow = true; cw.receiveShadow = true; root.add(cw);

// battery / motor cowl: abuts the counterweight, carries the seat at h7
const cowl = new THREE.Mesh(new THREE.BoxGeometry(CW_FRONT - (-0.16), 0.95 - CH_TOP, B1 - 0.14), matBody);
cowl.position.set((CW_FRONT + (-0.16))/2, (0.95 + CH_TOP)/2, 0);
cowl.castShadow = true; cowl.receiveShadow = true; root.add(cowl);

// --- wheels: front driven (larger), rear steer
function wheel(x, z, r, w){
  const g = new THREE.Group();
  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 20), matTyre);
  tyre.rotation.x = Math.PI/2; g.add(tyre);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(r*0.55, r*0.55, w + 0.008, 16), matRim);
  rim.rotation.x = Math.PI/2; g.add(rim);
  g.position.set(x, r, z);
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}
for(const sz of [1,-1]) root.add(wheel(AXLE_F, sz*(B10/2), WH_F_R, 0.16));
for(const sz of [1,-1]) root.add(wheel(AXLE_R, sz*(B10/2 - 0.10), WH_R_R, 0.13));

// --- overhead guard: 4 posts + a slatted roof at h6 = 2,070
const guard = new THREE.Group();
const POST_F = 0.16, POST_R = -1.02;
for(const gx of [POST_F, POST_R]){
  for(const gz of [1,-1]){
    const base = (gx === POST_R) ? 0.98 : CH_TOP;      // the rear posts stand on the counterweight
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.055, H6 - base, 0.055), matGuard);
    post.position.set(gx, base + (H6 - base)/2, gz*(B1/2 - 0.05));
    post.castShadow = true; post.receiveShadow = true; guard.add(post);
  }
}
const roofCx = (POST_F + POST_R)/2;
const roofFrame = new THREE.Mesh(new THREE.BoxGeometry(POST_F - POST_R + 0.10, 0.05, B1 - 0.02), matGuard);
roofFrame.position.set(roofCx, H6 - 0.025, 0);
roofFrame.castShadow = true; guard.add(roofFrame);
for(let i=0;i<5;i++){          // the roof is SLATTED — a solid slab reads as a truck cab
  const slat = new THREE.Mesh(new THREE.BoxGeometry(POST_F - POST_R, 0.03, 0.075), matGuard);
  slat.position.set(roofCx, H6 - 0.06, -0.36 + i*0.18);
  slat.castShadow = true; guard.add(slat);
}
root.add(guard);

// --- operator station
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.10, 0.46), matSeat);
seat.position.set(-0.62, H7, 0);
seat.castShadow = true; seat.receiveShadow = true; root.add(seat);
const back = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.42, 0.44), matSeat);
back.position.set(-0.84, H7 + 0.21, 0);
back.castShadow = true; root.add(back);
const steer = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.018, 8, 20), matGuard);
steer.position.set(-0.12, H7 + 0.30, 0);
steer.rotation.y = Math.PI/2; steer.rotation.x = -0.5;
steer.castShadow = true; root.add(steer);

// --- MAST assembly: tilts about the axle line, carriage lifts inside it -------
const mast = new THREE.Group();                 // tilt pivot
mast.position.set(FORK_FACE - 0.06, M2 + 0.10, 0);

const OUT_H = H1 - M2 - 0.10;                   // outer mast height when lowered
for(const sz of [1,-1]){
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.075, OUT_H, 0.055), matMast);
  ch.position.set(0, OUT_H/2, sz*0.30);
  ch.castShadow = true; ch.receiveShadow = true; mast.add(ch);
}
const mastTie = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.60), matMast);
mastTie.position.set(0, OUT_H - 0.05, 0);
mastTie.castShadow = true; mast.add(mastTie);

// inner mast — travels half the carriage stroke, which is what a 2-stage mast does
const inner = new THREE.Group();
for(const sz of [1,-1]){
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.055, OUT_H - 0.10, 0.042), matMast);
  ch.position.set(0.02, (OUT_H - 0.10)/2, sz*0.225);
  ch.castShadow = true; ch.receiveShadow = true; inner.add(ch);
}
const ram = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, OUT_H - 0.20, 12), matRam);
ram.position.set(0.02, (OUT_H - 0.20)/2, 0);
ram.castShadow = true; inner.add(ram);
mast.add(inner);

// carriage + forks
const carriage = new THREE.Group();
const backrest = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.70, 0.86), matFork);
backrest.position.set(0.07, 0.42, 0);
backrest.castShadow = true; backrest.receiveShadow = true; carriage.add(backrest);
const carrPlate = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.34, 0.90), matMast);
carrPlate.position.set(0.045, 0.24, 0);
carrPlate.castShadow = true; carriage.add(carrPlate);
for(const sz of [1,-1]){
  const shank = new THREE.Mesh(new THREE.BoxGeometry(FORK_S, 0.34, FORK_E), matFork);
  shank.position.set(0.10, 0.17, sz*FORK_SPREAD/2);
  shank.castShadow = true; shank.receiveShadow = true; carriage.add(shank);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(FORK_L, FORK_S, FORK_E), matFork);
  blade.position.set(0.10 + FORK_L/2, FORK_S/2, sz*FORK_SPREAD/2);
  blade.castShadow = true; blade.receiveShadow = true; carriage.add(blade);
}
carriage.position.set(0, 0, 0);
mast.add(carriage);
root.add(mast);

// --- load: EUR pallet + cartons, parented to the carriage so it rides the lift
const load = new THREE.Group();
{
  const deckTop = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.022, 0.80), matWood);
  deckTop.position.set(0, 0.122, 0); load.add(deckTop);
  const deckBot = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.022, 0.80), matWood);
  deckBot.position.set(0, 0.011, 0); load.add(deckBot);
  for(const bz of [-0.34, 0, 0.34]){
    const block = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.078, 0.10), matWood);
    block.position.set(0, 0.061, bz); load.add(block);
  }
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(1.00, 0.62, 0.72), matBox);
  cargo.position.set(0, 0.144 + 0.31, 0); load.add(cargo);
  load.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
}
// The pallet is 1,200 deep on 1,000 mm forks ⇒ it OVERHANGS the fork tips by 200 mm ([Block 72] §72.2).
load.position.set(0.10 + FORK_L/2, FORK_S, 0);
carriage.add(load);

scene.add(root);
renderer.shadowMap.needsUpdate = true;

// ============================================================================
// ZONE 3 — UI
// ============================================================================
let lifted = false, tilted = false;
let lift = 0, tilt = 0;

const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
const btnLift = document.getElementById('btnLift');
btnLift.onclick = ()=>{ lifted = !lifted; btnLift.classList.toggle('on', lifted); requestRender(); };
const btnLoad = document.getElementById('btnLoad');
btnLoad.onclick = ()=>{ load.visible = !load.visible; btnLoad.classList.toggle('on', load.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); };
btnLoad.classList.add('on');
const btnTilt = document.getElementById('btnTilt');
btnTilt.onclick = ()=>{ tilted = !tilted; btnTilt.classList.toggle('on', tilted); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

const _clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(_clock.getDelta(), 0.05);
  const targetLift = lifted ? LIFT_MAX : 0;
  const targetTilt = tilted ? -TILT : 0;                 // back-tilt: VDI row 4.1 is ±5°
  if(Math.abs(lift - targetLift) > 1e-4 || Math.abs(tilt - targetTilt) > 1e-5){
    lift += (targetLift - lift)*Math.min(1, dt*2.2);
    tilt += (targetTilt - tilt)*Math.min(1, dt*3.0);
    // free lift (VDI 4.3): the carriage rises 100 mm alone before the inner mast starts to move.
    carriage.position.y = lift;
    inner.position.y = Math.max(0, (lift - H2)) * 0.5;
    mast.rotation.z = tilt;
    // A mast lifting and a fork rising CHANGE the silhouette — [Block 70] §70.4's motion class that
    // genuinely invalidates a frozen shadow. Re-bake only while the motion is in flight.
    renderer.shadowMap.needsUpdate = true;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract ----------
globalThis.__montacargasApp = { runtime:{ scene, renderer, camera, root } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
