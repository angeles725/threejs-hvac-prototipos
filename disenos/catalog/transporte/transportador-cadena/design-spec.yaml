# DesignSpec — slat (apron) conveyor
# Third asset of the catalog `transporte` family. Dimensional evidence is [Block 60] §60.4
# (research/threejs-block60.md) from the preserved Sedis conveyor-chain catalogue.
# This asset is the counter-case to `banda-cinta`: [Block 60] §60.4 establishes that a chain conveyor
# CANNOT honestly be faked with the [Block 59] texture scroll, so its surface is real geometry.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: transportador-cadena
family: transporte
track: needs-research
gate_passes: [materials, motion]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 1, components: 3, hierarchy: 1, repetition: 3,
           material_layers: 1, detail: 3, occlusion: 1, action_readiness: 3}
  tier: moderate
  notes: >
    repetition 3 and detail 3: the chain is 30 links per strand per run (120 link plates + 120 pins)
    plus 30 slats, all instanced. action_readiness 3 because the carrying surface is real translating
    geometry rather than a scrolled texture — the honest consequence of [Block 60] §60.4.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block60.md
    motion_evidence: research/threejs-block59.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — steel slats and chain = bare metal 0.9-1.0; frame = painted 0.0"
    sibling_spec: "disenos/catalog/transporte/banda-cinta/design-spec.yaml (the scroll case this one is NOT)"

references:
  - source: "sources/datasheets/sedis-conveyor-chains-catalogue.pdf :p.12-15"
    evidences: >
      "The SEDIS chains conform to ISO 1977 standard. This range is based on the minimum tensile
      strength, the pitch…"; "their pitch, which is generally considerable, is not unique but can be
      chosen from a wide range"; pitch series 40*/53/63/80/100/125/160 mm, extending through
      200/250/315/400/500 mm on the heavier series; sprocket wheels supplied for the common pitches.
    suitability: pass
  - source: "research/threejs-block60.md §60.4"
    evidences: >
      Conveyor chain is ISO 1977, NOT ISO 606 (transmission roller chain, 6-76.2 mm). At a 100-200 mm
      pitch individual links READ at inspection distance, so a chain conveyor cannot be faked with a
      scrolling texture — the correction that shaped this asset.
    suitability: pass

dimensions_real:
  chain_pitch_m:    {value: 0.100, confidence: high}   # [CERT-doc] ISO 1977 preferred-series member
  sprocket_teeth:   {value: 8,     confidence: low}    # [INFER] within the 8-15 range cited for large-pitch chain
  sprocket_pitch_d_m: {value: 0.261, confidence: high} # derived exactly: p / sin(180/z) — a consequence, not a choice
  slat_every_pitches: {value: 2,   confidence: low}    # [INFER] attachment frequency
  slat_pitch_m:     {value: 0.200, confidence: low}    # [INFER] derived from the two above
  slat_width_m:     {value: 0.600, confidence: low}    # [INFER] B60 §60.5: NO standard slat-width series exists
  slat_thickness_m: {value: 0.006, confidence: low}    # [INFER] formed steel slat
  length_m:         {value: 3.00,  confidence: low}    # [INFER] section length
  top_run_y_m:      {value: 0.720, confidence: low}    # [INFER]
  speed_ms:         {value: 0.30,  confidence: low}    # [INFER] slat conveyors are slow, heavy-duty machines

hierarchy:
  - name: root
    children:
      - name: slats           # 15 carrying + 15 return, InstancedMesh
        pivot: [0, 0.72, 0]
        animation: translate-x-wrapped     # CHANGES silhouette ⇒ shadow re-bake while running
      - name: links           # chain side plates, 2 strands x 2 runs, InstancedMesh
        pivot: [0, 0.70, 0]
        animation: translate-x-wrapped
      - name: pins            # chain pins, InstancedMesh
        pivot: [0, 0.70, 0]
        animation: translate-x-wrapped
      - name: sprockets       # 4 (2 ends x 2 strands), real tooth count
        pivot: [0, 0.60, 0]
        animation: spin-about-own-axis     # silhouette invariant
      - name: driveShaft      # head shaft + painted gearmotor
        pivot: [0, 0.60, 0]
        animation: none
      - name: frame           # upper + lower rails, legs, feet
        pivot: [0, 0, 0]
        animation: none
      - name: markGroup       # pitch markers (toggle) — 6 chain pitches made measurable
        pivot: [0, 0, 0]
        animation: none
      - name: parts           # heavy unit load riding the slats
        pivot: [0, 0.83, 0]
        animation: translate-x-wrapped

materials:
  - id: slat-steel
    family: bare-metal
    color: "#c2c7ca"
    metalness: 0.9
    roughness: 0.42
    evidence: "formed steel slat; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.85
  - id: chain-plate
    family: bare-metal
    color: "#8d9296"
    metalness: 0.95
    roughness: 0.34
    evidence: "oiled chain side plates read darker and glossier than the slats; HANDBOOK §3.1"
    confidence: 0.8
  - id: sprocket-steel
    family: bare-metal
    color: "#9aa0a4"
    metalness: 0.9
    roughness: 0.38
    evidence: "machined sprocket; HANDBOOK §3.1"
    confidence: 0.8
  - id: frame-painted
    family: painted-metal
    color: "#3b4750"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted structure — dielectric; HANDBOOK §3.1"
    confidence: 0.85
  - id: gearmotor-painted
    family: painted-metal
    color: "#1d5f7f"
    metalness: 0.0
    roughness: 0.50
    evidence: "painted gearmotor housing"
    confidence: 0.7

critical_features:
  - id: pitch-is-a-catalogue-value
    desc: >
      The chain pitch is 100 mm — a member of the ISO 1977 preferred series, not a rounded guess — and
      the sprocket pitch diameter (261 mm) is DERIVED from it as p / sin(180/z) with z = 8. A modelled
      pitch of, say, 90 mm is a value no catalogue offers.
    threshold: 0.80
  - id: slats-not-a-texture
    desc: >
      The carrying surface is discrete slats every 200 mm with visible gaps between them, riding two
      chain strands with individual link plates and pins. This is the point of [Block 60] §60.4: at
      this pitch the links read, so the scrolling-texture shortcut used by `banda-cinta` would be a
      misrepresentation here.
    threshold: 0.80
  - id: painted-frame-vs-bare-chain
    desc: >
      Painted (dielectric) structure against bare-metal slats, chain and sprockets — the same
      separation rack-pallet and banda-rodillos enforce.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 35          # measured 29
    tris: 20000        # measured 5 690

camera:
  azimuth_deg: 41.3
  elevation_deg: 16.0
  fov: 38
  target_y_m: 0.62
  radius_m: 3.7

lighting: house-rig
  # No material deviation. The slat mat is a horizontal metal surface caught cleanly by the key.
  deviation:
    id: shadow-rebake-while-running
    what: "`shadowMap.autoUpdate` stays false, but the loop re-fires `needsUpdate` per frame while RUN is on."
    why: >
      Unlike `banda-cinta`, whose belt only scrolls its UVs, here the slats, chain links and load all
      TRANSLATE — [Block 59] §59.4's motion class that genuinely invalidates a frozen shadow. The cost
      is paid only while the conveyor is running; an idle inspection costs what a static asset costs.

ui_controls:
  - "AUTO-ROTATE"
  - "RUN"        # slats + chain + load translate; sprockets spin
  - "CARGA"      # heavy parts riding the slats
  - "CADENA"     # pitch markers — the 100 mm ISO 1977 pitch made measurable

colorTarget:
  # MEASURED from a lit steel slat on the carrying run (headless SwiftShader capture at 1280x800).
  # The SLAT is the target: it is the asset's defining surface and carries the bare-metal claim.
  srgb: [127, 136, 142]
  deltaE00Max: 8
  crop: "20x6+950+430"
  secondary:
    - {id: frame-painted, srgb: [73, 91, 105], crop: "20x6+560+420"}
