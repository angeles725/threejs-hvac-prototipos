<!doctype html>
<!--
  apilador — pedestrian straddle-leg stacker, catalog/transporte.
  Dimensional evidence: [Block 73] from sources/datasheets/en-br_msc12-15-sl-a5l1-spec-sheet.pdf
  (Yale MSC12-15 SL, 1.200-1.500 kg). Core rule from §73.2: the straddle outer/inner widths come as
  matched PAIRS differing by exactly 150 mm ⇒ ~75 mm of leg per side; the clear span between the legs
  is what lets an 800 x 1.200 EUR pallet sit BETWEEN them — why this machine needs no counterweight.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apilador peatonal de patas — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Apilador peatonal de patas (1,2-1,5 t)</div>
  <div><span class="dim">l1 1,778 × b1 0,820 m · patas 1,275 ext / 1,125 int</span></div>
  <div><span class="dim">h1 2,020 → h3 3,000 m · horquillas 40/100/1150 · y 1,218</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnLift">ELEVAR</button>
  <button id="btnLoad">CARGA</button>
  <button id="btnLegs">PATAS</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 10, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const R = 5.1;
camera.position.set(R*Math.cos(2.30)*Math.cos(0.28), 0.95 + R*Math.sin(0.28), R*Math.sin(2.30)*Math.cos(0.28));
camera.lookAt(0, 0.95, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0.95, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.9;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3.2, 5.6, 2.8); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0004;
sun.shadow.camera.left=-2.8; sun.shadow.camera.right=2.8;
sun.shadow.camera.top=3.4; sun.shadow.camera.bottom=-3.4;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(22,22),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS
// ============================================================================
const matBody  = new THREE.MeshStandardMaterial({ color:0x1b4f74, metalness:0.0, roughness:0.48 }); // PAINTED chassis
const matMast  = new THREE.MeshStandardMaterial({ color:0x2b3036, metalness:0.0, roughness:0.5 });
const matLeg   = new THREE.MeshStandardMaterial({ color:0x2b3036, metalness:0.0, roughness:0.55 });
const matFork  = new THREE.MeshStandardMaterial({ color:0xb4b9bc, metalness:0.92, roughness:0.38 }); // BARE steel
const matRam   = new THREE.MeshStandardMaterial({ color:0xd6dadd, metalness:0.95, roughness:0.16 });
const matRoll  = new THREE.MeshStandardMaterial({ color:0x24272b, metalness:0.0, roughness:0.72 });
const matGrip  = new THREE.MeshStandardMaterial({ color:0x141619, metalness:0.0, roughness:0.9 });
const matWood  = new THREE.MeshStandardMaterial({ color:0xa8814f, metalness:0.0, roughness:0.82 });
const matBox   = new THREE.MeshStandardMaterial({ color:0xb8a184, metalness:0.0, roughness:0.9 });
const matSpan  = new THREE.MeshStandardMaterial({ color:0x00d4aa, metalness:0.0, roughness:0.5,
                                                  emissive:0x00d4aa, emissiveIntensity:0.30 });

// ============================================================================
// ZONE 2 — GEOMETRY. Rows from [Block 73] §73.1 unless marked [INFER].
// ============================================================================
const FORK_L = 1.150;    // 4-11 l (of the 1070/1150/1220 options)     [CERT-doc]
const FORK_E = 0.100;    // 4-11 e                                     [CERT-doc]
const FORK_S = 0.040;    // 4-11 s                                     [CERT-doc]
const L1     = 1.778;    // 4-6 l1 = 1698 with the 1070 fork ⇒ +80 for the 1150 fork
const B1     = 0.820;    // 4-8 overall width across chassis            [CERT-doc]
const B2     = 1.275;    // 4-9 outer straddle width (middle option)    [CERT-doc]
const B14    = 1.125;    // 4-10 inner straddle width (its matched pair)[CERT-doc]
const LEG_W  = (B2 - B14)/2;   // = 0,075 m — §73.2's constant, DERIVED not guessed
const H1     = 2.020;    // 4-1 lowered mast height (middle option)     [CERT-doc]
const H3     = 3.000;    // 4-2 lift height (its usual pair)            [CERT-doc]
const H14    = 0.080;    // 4-5 height, lowered                         [CERT-doc]
const TILLER = 1.290;    // 4-4 tiller height, max                      [CERT-doc]
const Y      = 1.218;    // 1-8 wheelbase                               [CERT-doc]
const M2     = 0.040;    // 4-13 ground clearance                       [CERT-doc]
const LEG_H  = 0.145;    // [INFER] leg section height — not published
const DRIVE_R = 0.115;   // [INFER] drive wheel radius
const LOAD_R  = 0.043;   // [INFER] load wheel radius

const TAIL_X = L1/2;                     // chassis rear face
const FACE_X = TAIL_X - (L1 - FORK_L);   // fork face
const TIP_X  = FACE_X - FORK_L;          // fork tips
const DRIVE_X = TAIL_X - 0.28;           // [INFER]
const LOADW_X = DRIVE_X - Y;             // wheelbase 1,218 exactly

const root = new THREE.Group();

// --- straddle legs: the defining feature. 75 mm of section per side, and a CLEAR SPAN of
//     1,125 mm between them so an 800 mm EUR pallet passes through ([Block 73] §73.2).
for(const s of [1,-1]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(FORK_L + 0.16, LEG_H, LEG_W), matLeg);
  leg.position.set(FACE_X - (FORK_L + 0.16)/2 + 0.08, M2 + LEG_H/2, s*(B2/2 - LEG_W/2));
  leg.castShadow = true; leg.receiveShadow = true; root.add(leg);
  // load wheel at the leg's front end
  const w = new THREE.Mesh(new THREE.CylinderGeometry(LOAD_R, LOAD_R, 0.05, 14), matRoll);
  w.rotation.x = Math.PI/2;
  w.position.set(LOADW_X, LOAD_R, s*(B2/2 - LEG_W/2));
  w.castShadow = true; w.receiveShadow = true; root.add(w);
}

// --- chassis: 820 mm wide, narrower than the straddle it sits behind
const chassis = new THREE.Mesh(new THREE.BoxGeometry(L1 - FORK_L - 0.04, 0.62, B1), matBody);
chassis.position.set(FACE_X + (L1 - FORK_L - 0.04)/2, M2 + 0.31, 0);
chassis.castShadow = true; chassis.receiveShadow = true; root.add(chassis);
const hood = new THREE.Mesh(new THREE.BoxGeometry(L1 - FORK_L - 0.18, 0.16, B1 - 0.10), matBody);
hood.position.set(FACE_X + (L1 - FORK_L - 0.18)/2 + 0.02, M2 + 0.70, 0);
hood.castShadow = true; root.add(hood);

const dw = new THREE.Mesh(new THREE.CylinderGeometry(DRIVE_R, DRIVE_R, 0.09, 18), matRoll);
dw.rotation.x = Math.PI/2;
dw.position.set(DRIVE_X, DRIVE_R, 0);
dw.castShadow = true; dw.receiveShadow = true; root.add(dw);

// --- tiller
const tiller = new THREE.Group();
tiller.position.set(TAIL_X - 0.10, M2 + 0.62, 0);
const armLen = TILLER - (M2 + 0.62);
const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, armLen, 0.08), matMast);
arm.position.set(0, armLen/2, 0);
arm.castShadow = true; tiller.add(arm);
const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 0.40, 12), matGrip);
bar.rotation.x = Math.PI/2;
bar.position.set(0, armLen, 0);
bar.castShadow = true; tiller.add(bar);
tiller.rotation.z = -0.26;
root.add(tiller);

// --- mast: outer channels to h1, inner stage + ram, carriage on the forks
const MAST_X = FACE_X + 0.05;
const mastBaseY = M2;
for(const s of [1,-1]){
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.07, H1 - mastBaseY, 0.05), matMast);
  ch.position.set(MAST_X, mastBaseY + (H1 - mastBaseY)/2, s*0.20);
  ch.castShadow = true; ch.receiveShadow = true; root.add(ch);
}
const mastTie = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.45), matMast);
mastTie.position.set(MAST_X, H1 - 0.04, 0);
mastTie.castShadow = true; root.add(mastTie);

const inner = new THREE.Group();
for(const s of [1,-1]){
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.05, H1 - mastBaseY - 0.12, 0.038), matMast);
  ch.position.set(MAST_X - 0.035, mastBaseY + (H1 - mastBaseY - 0.12)/2, s*0.145);
  ch.castShadow = true; inner.add(ch);
}
const ram = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.030, H1 - mastBaseY - 0.24, 12), matRam);
ram.position.set(MAST_X - 0.035, mastBaseY + (H1 - mastBaseY - 0.24)/2, 0);
ram.castShadow = true; inner.add(ram);
root.add(inner);

// --- carriage + forks (the forks lift; the legs do NOT)
const carriage = new THREE.Group();
const backplate = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.44, 0.62), matFork);
backplate.position.set(MAST_X - 0.075, H14 + 0.22, 0);
backplate.castShadow = true; backplate.receiveShadow = true; carriage.add(backplate);
for(const s of [1,-1]){
  const blade = new THREE.Mesh(new THREE.BoxGeometry(FORK_L, FORK_S, FORK_E), matFork);
  blade.position.set(FACE_X - FORK_L/2, H14 - FORK_S/2, s*0.28);
  blade.castShadow = true; blade.receiveShadow = true; carriage.add(blade);
}
root.add(carriage);

// --- load: EUR pallet, entering BETWEEN the legs
const load = new THREE.Group();
{
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.022, 0.80), matWood);
  top.position.set(0, 0.133, 0); load.add(top);
  const bot = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.022, 0.80), matWood);
  bot.position.set(0, 0.011, 0); load.add(bot);
  for(const bz of [-0.34, 0, 0.34]){
    const blk = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.078, 0.10), matWood);
    blk.position.set(0, 0.061, bz); load.add(blk);
  }
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.55, 0.70), matBox);
  cargo.position.set(0, 0.144 + 0.275, 0); load.add(cargo);
  load.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
}
load.position.set(FACE_X - 0.62, H14, 0);
load.visible = false;          // OFF by default: the straddle geometry is this asset's critical read
carriage.add(load);

// --- clear-span markers: the 1,125 mm between the legs, made visible
const spanGroup = new THREE.Group();
for(const s of [1,-1]){
  const mk = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, B14), matSpan);
  mk.position.set(LOADW_X + s*0.22, M2 + 0.005, 0);
  spanGroup.add(mk);
}
spanGroup.visible = false;
root.add(spanGroup);

scene.add(root);
renderer.shadowMap.needsUpdate = true;

// ============================================================================
// ZONE 3 — UI
// ============================================================================
let lifted = false, lift = 0;
const LIFT_MAX = H3 - H14;

const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
const btnLift = document.getElementById('btnLift');
btnLift.onclick = ()=>{ lifted = !lifted; btnLift.classList.toggle('on', lifted); requestRender(); };
const btnLoad = document.getElementById('btnLoad');
btnLoad.onclick = ()=>{ load.visible = !load.visible; btnLoad.classList.toggle('on', load.visible);
  renderer.shadowMap.needsUpdate = true; requestRender(); };
// btnLoad starts OFF — see the load.visible note above
const btnLegs = document.getElementById('btnLegs');
btnLegs.onclick = ()=>{ spanGroup.visible = !spanGroup.visible; btnLegs.classList.toggle('on', spanGroup.visible); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

const _clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(_clock.getDelta(), 0.05);
  const target = lifted ? LIFT_MAX : 0;
  if(Math.abs(lift - target) > 1e-4){
    lift += (target - lift)*Math.min(1, dt*2.0);
    carriage.position.y = lift;
    // The inner stage follows the carriage beyond the outer mast's own height.
    inner.position.y = Math.max(0, lift - (H1 - H14 - 0.44));
    // Lifting geometry ⇒ [Block 70] §70.4's shadow-invalidating motion class.
    renderer.shadowMap.needsUpdate = true;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract ----------
globalThis.__apiladorApp = { runtime:{ scene, renderer, camera, root } };
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
