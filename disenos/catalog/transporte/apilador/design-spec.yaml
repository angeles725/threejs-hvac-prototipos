# DesignSpec — pedestrian straddle-leg stacker (1,2-1,5 t)
# Dimensional evidence is [Block 73] (research/threejs-block73.md) from a preserved Yale MSC12-15 SL
# type sheet. This asset only exists because [Block 72] §72.5 REFUSED to model it without a source
# and opened gap G74 instead; B73 closed it.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: apilador
family: transporte
track: needs-research
gate_passes: [materials, motion]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 2, repetition: 0,
           material_layers: 1, detail: 2, occlusion: 2, action_readiness: 2}
  tier: moderate
  notes: >
    occlusion 2 drove a real authoring decision: from a rear three-quarter view the chassis hides the
    far leg, so the asset's defining feature — the straddle PAIR — was invisible. The camera was moved
    to the fork side and the load defaults to OFF (see ui_controls) so the two legs and the two forks
    between them read on load.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block73.md
    motion_evidence: research/threejs-block70.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — painted chassis dielectric 0.0; bare steel forks 0.9"
    pallet: "[Block 58] EUR pallet 800 x 1,200 mm — what the 1,125 mm clear span is sized around"

references:
  - source: "sources/datasheets/en-br_msc12-15-sl-a5l1-spec-sheet.pdf (Yale MSC12-15 SL)"
    evidences: >
      Rows used verbatim: 1-5 capacity 1200/1500 kg; 1-8 wheelbase y = 1218; 4-1 lowered mast height
      h1 = 1520/1770/2020/2170/2270; 4-2 lift height h3 = 2000/2500/3000/3300/3500; 4-4 tiller height
      910/1290; 4-5 height lowered = 80; 4-6 overall length l1 = 1698 with the standard 1070 fork;
      4-8 width across chassis b1 = 820; 4-9 outer straddle b2 = 1135/1275/1415; 4-10 inner straddle
      b14 = 985/1125/1265; 4-11 fork dimensions s/e/l = 40 x 100 x 1070 (1150/1220); 4-13 ground
      clearance m2 = 40.
    suitability: pass
  - source: "research/threejs-block73.md §73.2-73.4"
    evidences: >
      The straddle widths are MATCHED PAIRS differing by exactly 150 mm ⇒ 75 mm of leg per side,
      constant across the range; h1 and h3 are independent option columns, not a ratio; and the SYMBOL
      TRAP — this sheet labels tiller h13 / lowered h14, the opposite of the Toyota sheet in B72 §72.3.
    suitability: pass

dimensions_real:
  capacity_kg:        {value: [1200, 1500], confidence: high}  # [CERT-doc] row 1-5
  wheelbase_m:        {value: 1.218, confidence: high}   # [CERT-doc] row 1-8
  mast_lowered_m:     {value: 2.020, confidence: high}   # [CERT-doc] row 4-1, middle option
  lift_height_m:      {value: 3.000, confidence: high}   # [CERT-doc] row 4-2
  tiller_height_m:    {value: 1.290, confidence: high}   # [CERT-doc] row 4-4 max
  fork_lowered_m:     {value: 0.080, confidence: high}   # [CERT-doc] row 4-5
  chassis_width_m:    {value: 0.820, confidence: high}   # [CERT-doc] row 4-8
  straddle_outer_m:   {value: 1.275, confidence: high}   # [CERT-doc] row 4-9, middle option
  straddle_inner_m:   {value: 1.125, confidence: high}   # [CERT-doc] row 4-10, its matched pair
  leg_section_w_m:    {value: 0.075, confidence: high}   # DERIVED (b2-b14)/2 — B73 §73.2's constant
  fork_s_e_l_m:       {value: [0.040, 0.100, 1.150], confidence: high}  # [CERT-doc] row 4-11
  overall_length_m:   {value: 1.778, confidence: med}    # [CERT-doc] 1698 with the 1070 fork, +80 for 1150
  ground_clear_m:     {value: 0.040, confidence: high}   # [CERT-doc] row 4-13
  leg_section_h_m:    {value: 0.145, confidence: low}    # [INFER] B73 §73.5 — not published
  drive_wheel_r_m:    {value: 0.115, confidence: low}    # [INFER]
  load_wheel_r_m:     {value: 0.043, confidence: low}    # [INFER]

hierarchy:
  - name: root
    children:
      - name: legs            # 2 straddle legs (75 mm section) + load wheels — these do NOT lift
        pivot: [0, 0, 0]
        animation: none
      - name: chassis         # painted body, 820 wide, + hood + drive wheel
        pivot: [0, 0, 0]
        animation: none
      - name: tiller          # arm to 1,290 + grip bar
        pivot: [0.789, 0.66, 0]
        animation: none
      - name: mast            # outer channels to h1 = 2,020
        pivot: [0, 0, 0]
        animation: none
      - name: inner           # inner stage + ram — follows once the carriage passes the outer height
        pivot: [0, 0, 0]
        animation: translate-y
      - name: carriage        # backplate + the two forks
        pivot: [0, 0.08, 0]
        animation: translate-y
        children:
          - name: load        # EUR pallet, entering BETWEEN the legs (default OFF)
            animation: inherited

materials:
  - id: chassis-painted
    family: painted-metal
    color: "#1b4f74"
    metalness: 0.0
    roughness: 0.48
    evidence: "painted chassis — DIELECTRIC; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.85
  - id: leg-painted
    family: painted-metal
    color: "#2b3036"
    metalness: 0.0
    roughness: 0.55
    evidence: "straddle legs painted dark, as the mast is"
    confidence: 0.8
  - id: fork-steel
    family: bare-metal
    color: "#b4b9bc"
    metalness: 0.92
    roughness: 0.38
    evidence: "bare steel forks — the contrast that separates fork from leg at a glance"
    confidence: 0.85
  - id: lift-ram
    family: bare-metal
    color: "#d6dadd"
    metalness: 0.95
    roughness: 0.16
    evidence: "chromed lift ram"
    confidence: 0.75
  - id: wheel-pu
    family: plastic
    color: "#24272b"
    metalness: 0.0
    roughness: 0.72
    evidence: "polyurethane drive and load wheels — dielectric"
    confidence: 0.8

critical_features:
  - id: straddle-pair
    desc: >
      Two legs of 75 mm section with a 1,125 mm CLEAR SPAN between them, and the forks running inside
      that span. The clear span is what lets an 800 mm EUR pallet sit BETWEEN the legs — the reason
      this machine needs no counterweight, unlike the `montacargas` sibling. Legs at a token width, or
      a pallet resting on top of them, misses the whole principle.
    threshold: 0.80
  - id: legs-do-not-lift
    desc: >
      The forks and carriage lift; the legs and their load wheels stay on the floor. A stacker whose
      legs rise with the forks is a different (and impossible) machine.
    threshold: 0.78
  - id: mast-taller-than-lowered-height
    desc: >
      h1 = 2,020 lowered against h3 = 3,000 of lift means the mast MUST telescope; the inner stage and
      ram are visible inside the outer channels.
    threshold: 0.72

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 25          # measured 19
    tris: 20000        # measured 510

camera:
  azimuth_deg: 131.8
  elevation_deg: 16.0
  fov: 38
  target_y_m: 0.95
  radius_m: 5.1
  # Deliberately on the FORK side, not the tiller side: from behind, the chassis occludes the far leg
  # and the straddle pair — the asset's critical read — disappears.

lighting: house-rig
  deviation:
    id: shadow-rebake-while-lifting
    what: "`autoUpdate` stays false; `needsUpdate` re-fires only while the carriage is moving."
    why: "[Block 70] §70.4 — lifting forks change the silhouette."

ui_controls:
  - "AUTO-ROTATE"
  - "ELEVAR"    # 80 mm → 3,000 mm, inner stage following past the outer mast height
  - "CARGA"     # EUR pallet between the legs — DEFAULT OFF, see below
  - "PATAS"     # clear-span markers: the 1,125 mm between the legs, made visible

omissions:
  - id: load-defaults-off
    what: "Unlike every sibling in this family, the load starts hidden."
    why: >
      The pallet sits exactly where the straddle geometry reads, and with it visible the two legs and
      the two forks between them are occluded. The asset's critical feature won the default; the load
      is one click away.
  - id: reach-truck-not-modelled
    what: "`catalog.yaml` names this row 'walkie stacker / reach truck'; only the walkie stacker is modelled."
    why: "[Block 73] §73.5 — a reach truck is a different machine (pantograph/moving mast, stand-in operator) and has no preserved source here."

colorTarget:
  # MEASURED from the rendered painted chassis (headless SwiftShader capture at 1280x800).
  srgb: [1, 101, 155]
  deltaE00Max: 8
  crop: "16x5+790+500"
  secondary:
    - {id: hood-painted, srgb: [83, 137, 181], crop: "16x5+760+420"}
