<!doctype html>
<!--
  grua-puente — single-girder overhead travelling (EOT) crane, catalog/transporte.
  Evidence: [Block 72] §72.4. What is PUBLISHED for this class is only SWL <= 16 t and spans up to
  38,5 m (ABUS, [CERT-web]); the girder proportion (depth = span/14..1/18, web >= 6 mm, stiffeners at
  <= one beam height, deflection <= span/700..1/1000) comes from a supplier engineering guide and is
  [CERT-a]. End-carriage wheelbase, hook approach and runway section are an HONEST NEGATIVE — EN 15011
  and CMAA 70 are paywalled. Every such number below is marked [INFER] in the design-spec.
-->
<html lang="es" data-app-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grúa puente monoviga — catálogo</title>
<link rel="icon" href="data:,">
<!-- SCALE: 1 voxel = 0.05 m · 1 unit = 1 m -->
<style>
  :root{ --bg:#06080d; --surface:rgba(10,14,22,.86); --border:rgba(0,212,170,.18);
         --text:#c8d4dc; --text-muted:#8fa0ab; --accent:#00d4aa;
         --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #hud{position:absolute;left:14px;top:12px;font-family:var(--font-mono);color:var(--text);
       font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud .name{font-size:13px;color:#fff;font-weight:700}
  #hud .pass{color:var(--accent)} #hud .dim{color:var(--text-muted)}
  #panel{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;
         background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
         color:var(--text);display:flex;flex-direction:column;gap:6px}
  #panel button{font-family:inherit;font-size:11px;background:#0d1420;color:var(--text);
         border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer}
  #panel button.on{background:#0a2a24;border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="name">Grúa puente monoviga (EOT)</div>
  <div><span class="dim">luz 16,0 m · viga 1,00 m de canto (luz/16) · vía a 7,00 m</span></div>
  <div><span class="dim">SWL ≤ 16 t · luz ≤ 38,5 m (catálogo)</span></div>
</div>
<div id="panel">
  <button id="btnRot">AUTO-ROTATE</button>
  <button id="btnBridge">PUENTE</button>
  <button id="btnTrolley">CARRO</button>
  <button id="btnHoist">GANCHO</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- scene / renderer / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 26, 90);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 400);
const R = 33;
camera.position.set(R*Math.cos(0.70)*Math.cos(0.42), 3.6 + R*Math.sin(0.42), R*Math.sin(0.70)*Math.cos(0.42));
camera.lookAt(0, 3.6, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 3.6, 0);
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
scene.environmentIntensity = 1.9;

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(14, 22, 12); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.0009;
sun.shadow.camera.left=-16; sun.shadow.camera.right=16;
sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
sun.shadow.camera.far = 60;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
scene.add(new THREE.HemisphereLight(0xeaf0ff, 0x2a3038, 0.7));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(90,90),
  new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ============================================================================
// ZONE 1 — MATERIALS
// ============================================================================
const matGirder = new THREE.MeshStandardMaterial({ color:0xd8a413, metalness:0.0, roughness:0.52 }); // PAINTED crane yellow
const matSteel  = new THREE.MeshStandardMaterial({ color:0x4a545c, metalness:0.0, roughness:0.55 }); // painted structure
const matRail   = new THREE.MeshStandardMaterial({ color:0xa7acb0, metalness:0.92, roughness:0.34 }); // BARE rail head
const matHoist  = new THREE.MeshStandardMaterial({ color:0x2f353a, metalness:0.0, roughness:0.5 });
const matRope   = new THREE.MeshStandardMaterial({ color:0x8b9095, metalness:0.9, roughness:0.42 });
const matHook   = new THREE.MeshStandardMaterial({ color:0xb9bec1, metalness:0.93, roughness:0.32 });
const matLoad   = new THREE.MeshStandardMaterial({ color:0x6c7278, metalness:0.85, roughness:0.5 });

// ============================================================================
// ZONE 2 — GEOMETRY.  [Block 72] §72.4 — proportions, not certified sections.
// ============================================================================
const SPAN     = 16.00;               // [INFER] within the published <= 38,5 m envelope
const GIRD_H   = SPAN/16;             // [CERT-a] depth/span ratio 1/14..1/18 → 1,00 m
const GIRD_W   = 0.42;                // [INFER] box-girder width
const RUNWAY_Y = 7.00;                // [INFER] rail level
const RUNWAY_L = 22.0;                // [INFER] travel length shown
const EC_WB    = 2.60;                // [INFER] end-carriage wheelbase — HONEST NEGATIVE in B72 §72.4
const RAIL_H   = 0.10;
const STIFF_N  = Math.round(SPAN/GIRD_H);   // [CERT-a] stiffeners spaced <= one beam height

const root = new THREE.Group();

// --- runway beams on brackets + columns ------------------------------------
const runway = new THREE.Group();
for(const s of [1,-1]){
  const beam = new THREE.Mesh(new THREE.BoxGeometry(RUNWAY_L, 0.70, 0.34), matSteel);
  beam.position.set(0, RUNWAY_Y - 0.35 - RAIL_H, s*SPAN/2);
  beam.castShadow = true; beam.receiveShadow = true; runway.add(beam);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(RUNWAY_L, RAIL_H, 0.075), matRail);
  rail.position.set(0, RUNWAY_Y - RAIL_H/2, s*SPAN/2);
  rail.castShadow = true; rail.receiveShadow = true; runway.add(rail);
  for(let x = -RUNWAY_L/2 + 2.0; x <= RUNWAY_L/2 - 1.5; x += 6.0){
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.34, RUNWAY_Y - 0.70 - RAIL_H, 0.34), matSteel);
    col.position.set(x, (RUNWAY_Y - 0.70 - RAIL_H)/2, s*(SPAN/2 + 0.30));
    col.castShadow = true; col.receiveShadow = true; runway.add(col);
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.62), matSteel);
    bracket.position.set(x, RUNWAY_Y - 0.84, s*(SPAN/2 + 0.10));
    bracket.castShadow = true; runway.add(bracket);
  }
}
root.add(runway);

// --- BRIDGE: the whole crane travels along the runway ----------------------
const bridge = new THREE.Group();

// main girder: a box section with the stiffener pitch the guide prescribes
const girder = new THREE.Mesh(new THREE.BoxGeometry(GIRD_W, GIRD_H, SPAN - 0.6), matGirder);
girder.position.set(0, RUNWAY_Y + 0.42 + GIRD_H/2, 0);
girder.castShadow = true; girder.receiveShadow = true; bridge.add(girder);
for(let i=1;i<STIFF_N;i++){
  const z = -SPAN/2 + 0.3 + i*(SPAN - 0.6)/STIFF_N;
  const st = new THREE.Mesh(new THREE.BoxGeometry(GIRD_W + 0.05, GIRD_H - 0.10, 0.02), matGirder);
  st.position.set(0, RUNWAY_Y + 0.42 + GIRD_H/2, z);
  st.castShadow = true; bridge.add(st);
}
// the lower flange the trolley hangs from — what makes it a SINGLE-girder crane
const flange = new THREE.Mesh(new THREE.BoxGeometry(GIRD_W + 0.28, 0.05, SPAN - 0.6), matGirder);
flange.position.set(0, RUNWAY_Y + 0.42, 0);
flange.castShadow = true; flange.receiveShadow = true; bridge.add(flange);

// end carriages: wheelbase EC_WB along the runway, wheels on the rail
for(const s of [1,-1]){
  const ec = new THREE.Mesh(new THREE.BoxGeometry(EC_WB, 0.44, 0.36), matSteel);
  ec.position.set(0, RUNWAY_Y + 0.22, s*(SPAN/2 - 0.15));
  ec.castShadow = true; ec.receiveShadow = true; bridge.add(ec);
  for(const wx of [-EC_WB/2 + 0.22, EC_WB/2 - 0.22]){
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.09, 16), matRail);
    wheel.rotation.x = Math.PI/2;
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(wx, RUNWAY_Y + 0.02, s*(SPAN/2 - 0.15));
    wheel.castShadow = true; bridge.add(wheel);
  }
  const dr = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.24), matHoist);
  dr.position.set(-EC_WB/2 - 0.08, RUNWAY_Y + 0.24, s*(SPAN/2 - 0.15));
  dr.castShadow = true; bridge.add(dr);
}

// --- TROLLEY: travels along the girder; the hoist hangs under it -----------
const trolley = new THREE.Group();
const tBody = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.34, 0.80), matHoist);
tBody.position.set(0, RUNWAY_Y + 0.42 - 0.20, 0);
tBody.castShadow = true; tBody.receiveShadow = true; trolley.add(tBody);
const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.60, 18), matHoist);
drum.rotation.x = Math.PI/2;
drum.position.set(0, RUNWAY_Y + 0.42 - 0.22, 0);
drum.castShadow = true; trolley.add(drum);
const tMotor = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.26), matSteel);
tMotor.position.set(0, RUNWAY_Y + 0.42 - 0.20, 0.52);
tMotor.castShadow = true; trolley.add(tMotor);

// rope + hook block: one group so hoisting is a single transform
const hoist = new THREE.Group();
const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), matRope);
rope.position.set(0, 0, 0);
hoist.add(rope);
const block = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.34), matHook);
block.castShadow = true; hoist.add(block);
const hookShank = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.24, 10), matHook);
hookShank.castShadow = true; hoist.add(hookShank);
const hookCurve = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.045, 8, 16, Math.PI*1.4), matHook);
hookCurve.castShadow = true; hoist.add(hookCurve);
trolley.add(hoist);
bridge.add(trolley);
root.add(bridge);

// suspended load
const load = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 1.2), matLoad);
load.castShadow = true; load.receiveShadow = true;
hoist.add(load);

scene.add(root);

// ============================================================================
// ZONE 3 — UI + kinematics
// ============================================================================
let bridgePos = 0, trolleyPos = 0, hookDrop = 3.8;
let bridgeOn = false, trolleyOn = false, hoistOn = false;
const BRIDGE_TRAVEL = RUNWAY_L/2 - EC_WB/2 - 1.0;
const TROLLEY_TRAVEL = SPAN/2 - 1.6;
const HOOK_MIN = 1.2, HOOK_MAX = 3.8;

function place(){
  bridge.position.x = bridgePos;
  trolley.position.z = trolleyPos;
  const top = RUNWAY_Y + 0.42 - 0.36;      // rope leaves the drum here
  const blockY = top - hookDrop;
  rope.scale.y = Math.max(0.02, hookDrop - 0.13);
  rope.position.y = (top + blockY + 0.13)/2;
  block.position.y = blockY;
  hookShank.position.y = blockY - 0.24;
  hookCurve.position.y = blockY - 0.40;
  hookCurve.rotation.z = Math.PI*0.8;
  load.position.y = blockY - 0.95;
}
place();
renderer.shadowMap.needsUpdate = true;

const btnRot = document.getElementById('btnRot');
btnRot.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRot.classList.toggle('on', controls.autoRotate); requestRender(); };
const btnBridge = document.getElementById('btnBridge');
btnBridge.onclick = ()=>{ bridgeOn = !bridgeOn; btnBridge.classList.toggle('on', bridgeOn); requestRender(); };
const btnTrolley = document.getElementById('btnTrolley');
btnTrolley.onclick = ()=>{ trolleyOn = !trolleyOn; btnTrolley.classList.toggle('on', trolleyOn); requestRender(); };
const btnHoist = document.getElementById('btnHoist');
btnHoist.onclick = ()=>{ hoistOn = !hoistOn; btnHoist.classList.toggle('on', hoistOn); requestRender(); };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); requestRender(); });

let needsRender = true;
const requestRender = ()=>{ needsRender = true; };
controls.addEventListener('change', requestRender);

const _clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(_clock.getDelta(), 0.05);
  const tb = bridgeOn ? BRIDGE_TRAVEL : 0;
  const tt = trolleyOn ? TROLLEY_TRAVEL : 0;
  const th = hoistOn ? HOOK_MIN : HOOK_MAX;
  if(Math.abs(bridgePos-tb) > 1e-3 || Math.abs(trolleyPos-tt) > 1e-3 || Math.abs(hookDrop-th) > 1e-3){
    bridgePos  += (tb - bridgePos)*Math.min(1, dt*0.9);
    trolleyPos += (tt - trolleyPos)*Math.min(1, dt*1.1);
    hookDrop   += (th - hookDrop)*Math.min(1, dt*1.3);
    place();
    // Bridge travel, trolley travel and hoisting all MOVE geometry ⇒ [Block 70] §70.4's motion class
    // that invalidates a frozen shadow. Re-bake only while something is actually moving.
    renderer.shadowMap.needsUpdate = true;
    needsRender = true;
  }
  controls.update();
  if(needsRender){ renderer.render(scene,camera); needsRender = false; }
}
animate();

// ---------- QA contract ----------
globalThis.__gruaPuenteApp = { runtime:{ scene, renderer, camera, root } };
globalThis['__grua-puenteApp'] = globalThis.__gruaPuenteApp;
globalThis.__qaRenderInfo = ()=>renderer.info.render;
requestAnimationFrame(()=>document.documentElement.setAttribute('data-app-ready','true'));
</script>
</body>
</html>
