# DesignSpec — hand pallet truck (3,0 t)
# Dimensional evidence is [Block 72] §72.3 (research/threejs-block72.md) from a preserved Toyota
# LHM300 datasheet — an unusually complete VDI-style envelope for so simple a machine.
# Authoring rules: ~/.claude/skills/design3d/references/DESIGNSPEC.md

design: transpaleta
family: transporte
track: needs-research
gate_passes: [materials, motion]
mode: standard
scale: "1 unit = 1 m"
blockout_scale: "1 voxel = 0.05 m"

complexity:
  scores: {silhouette: 2, components: 2, hierarchy: 1, repetition: 0,
           material_layers: 1, detail: 2, occlusion: 1, action_readiness: 2}
  tier: simple
  notes: >
    repetition 0 — nothing to instance, so InstancedMesh is correctly absent. The whole machine is
    one lifting group (forks + rollers + push rods) over a pump housing; its 115 mm of stroke is the
    entire kinematics.

environment:
  overlays:
    handbook: research/HANDBOOK.md
    house_rules: "EQUIPOS-PENDIENTES.md §REGLAS DE CASA"
    shell: disenos/catalog/shell-template.html
    dimensional_evidence: research/threejs-block72.md
    motion_evidence: research/threejs-block70.md
  reuse_pointers:
    palette: "research/HANDBOOK.md §3.1 — bare steel forks 0.9; painted pump housing 0.0"
    pallet: "[Block 58] EUR pallet 800 x 1,200 x 144 mm"
    sibling_spec: "disenos/catalog/transporte/montacargas/design-spec.yaml"

references:
  - source: "sources/datasheets/24114_Original document_toyota mh.pdf :p.2 (Toyota LHM300 L-series, 3,0 t)"
    evidences: >
      Rows used verbatim: 1.8 load distance x = 970 (forks raised); 1.9 wheelbase y = 1185;
      3.2 steer wheel 175 x 60; 3.3 load rollers 85 x 75; 3.5 wheels front/rear = 2/4;
      3.6/3.7 track b10 = 132, b11 = 340; 4.4 lift h3 = 115 and lift height h23 = 200;
      4.9 tiller height h14 = 1220; 4.15 height lowered h13 = 85; 4.19 overall length l1 = 1510;
      4.20 length to fork face l2 = 365; 4.21 overall width b1/b2 = 520/685; 4.22 fork dimensions
      s/e/l = 45/175/1150 (1220 also available); 4.25 width over forks b5 = 520/685;
      4.32 ground clearance m2 = 40; 4.33/4.34 aisle width Ast = 1540 / 1740.
    suitability: pass
  - source: "research/threejs-block72.md §72.3"
    evidences: >
      The 85 → 200 mm lift is the whole machine: 115 mm of stroke is all that separates a pallet on
      the floor from a pallet clear of it. And the "EU 520 vs US 686 width conflict" reported by a web
      sweep is refuted by the primary source: b1/b2 = b5 = 520/685 are two fork spreads of the SAME
      model, narrow for entering an 800 mm EUR pallet from its long side, wide for 1000/1200 pallets.
    suitability: pass

dimensions_real:
  overall_length_m:  {value: 1.510, confidence: high}   # [CERT-doc] VDI 4.19 (l1)
  to_fork_face_m:    {value: 0.365, confidence: high}   # [CERT-doc] VDI 4.20 (l2)
  fork_s_e_l_m:      {value: [0.045, 0.175, 1.150], confidence: high}  # [CERT-doc] VDI 4.22
  width_narrow_m:    {value: 0.520, confidence: high}   # [CERT-doc] VDI 4.21/4.25 option A
  width_wide_m:      {value: 0.685, confidence: high}   # [CERT-doc] VDI 4.21/4.25 option B — same model
  lowered_m:         {value: 0.085, confidence: high}   # [CERT-doc] VDI 4.15 (h13)
  raised_m:          {value: 0.200, confidence: high}   # [CERT-doc] h23
  stroke_m:          {value: 0.115, confidence: high}   # [CERT-doc] VDI 4.4 (h3)
  tiller_height_m:   {value: 1.220, confidence: high}   # [CERT-doc] VDI 4.9 (h14)
  wheelbase_m:       {value: 1.185, confidence: high}   # [CERT-doc] VDI 1.9 (y)
  steer_wheel_m:     {value: [0.175, 0.060], confidence: high}  # [CERT-doc] VDI 3.2
  load_roller_m:     {value: [0.085, 0.075], confidence: high}  # [CERT-doc] VDI 3.3
  wheels_front_rear: {value: [2, 4], confidence: high}  # [CERT-doc] VDI 3.5 — tandem load rollers
  track_front_m:     {value: 0.132, confidence: high}   # [CERT-doc] VDI 3.6 (b10)
  ground_clear_m:    {value: 0.040, confidence: high}   # [CERT-doc] VDI 4.32 (m2)
  tiller_rake_rad:   {value: 0.20,  confidence: low}    # [INFER] parked rake, not a datasheet row

hierarchy:
  - name: root
    children:
      - name: forkAsm         # the entire lifting assembly: blades, roller cradles, push rods
        pivot: [0, 0.085, 0]
        animation: translate-y      # 115 mm — the machine's whole vertical travel
        children:
          - name: load        # EUR pallet + cargo, parented so it rides the stroke
            animation: inherited
      - name: housing         # painted pump housing
        pivot: [0, 0, 0]
        animation: none
      - name: steerWheels     # 2 wheels Ø175 + yoke
        pivot: [0, 0, 0]
        animation: none
      - name: tiller          # arm to h14 + grip bar + control lever
        pivot: [0.595, 0.248, 0]
        animation: none

materials:
  - id: fork-steel
    family: bare-metal
    color: "#b0b5b8"
    metalness: 0.92
    roughness: 0.38
    evidence: "bare steel fork blades; HANDBOOK §3.1 bare metal 0.9-1.0"
    confidence: 0.85
  - id: housing-painted
    family: painted-metal
    color: "#c23a24"
    metalness: 0.0
    roughness: 0.46
    evidence: "painted pump housing — DIELECTRIC; HANDBOOK §3.1 painted 0.0-0.05"
    confidence: 0.85
  - id: pump-ram
    family: bare-metal
    color: "#d6dadd"
    metalness: 0.95
    roughness: 0.15
    evidence: "chromed pump ram — lowest roughness on the asset"
    confidence: 0.75
  - id: roller-pu
    family: plastic
    color: "#26292d"
    metalness: 0.0
    roughness: 0.70
    evidence: "polyurethane load rollers and steer wheel — dielectric"
    confidence: 0.8
  - id: tiller-painted
    family: painted-metal
    color: "#2c3035"
    metalness: 0.0
    roughness: 0.55
    evidence: "painted tiller arm"
    confidence: 0.8

critical_features:
  - id: the-stroke-is-115mm
    desc: >
      Forks sit at 85 mm and rise to 200 mm — 115 mm of travel, no more. Modelled with anything like a
      forklift's lift, the asset stops being a pallet truck. This single number is the machine.
    threshold: 0.80
  - id: two-spreads-one-machine
    desc: >
      The 520 mm and 685 mm widths are both offered on this model, and the ANCHO toggle shows both
      rather than picking one — the correction [Block 72] §72.3 makes against the "EU vs US" reading.
    threshold: 0.75
  - id: tandem-load-rollers
    desc: >
      Four load rollers (two per fork, VDI 3.5 "2/4") of Ø85 in cradles at the tip end, against two
      Ø175 steer wheels at the housing. The size difference is what lets the fork sit at 85 mm.
    threshold: 0.75

quality_contract:
  global_min: 0.75
  perf_budget:
    draws: 30          # measured 25
    tris: 20000        # measured 698

camera:
  azimuth_deg: 34.4
  elevation_deg: 18.3
  fov: 38
  target_y_m: 0.50
  radius_m: 4.0

lighting: house-rig
# No material deviation.
deviation:
  id: shadow-rebake-while-lifting
  what: "`autoUpdate` stays false; `needsUpdate` re-fires only while the 115 mm stroke is in flight."
  why: "[Block 70] §70.4 — translating forks change the silhouette; the belt's UV-scroll exemption does not apply."

ui_controls:
  - "AUTO-ROTATE"
  - "ELEVAR"      # 85 → 200 mm
  - "CARGA"       # EUR pallet + cargo on the forks
  - "ANCHO 685"   # the second published fork spread of the same model

colorTarget:
  # MEASURED from the rendered painted pump housing (headless SwiftShader capture at 1280x800).
  # The HOUSING is the target: painted-as-dielectric against the bare steel forks is the material
  # claim most likely to regress.
  srgb: [218, 66, 41]
  deltaE00Max: 8
  crop: "18x6+700+520"
  secondary:
    - {id: tiller-painted, srgb: [17, 20, 24], crop: "18x6+780+350"}
