<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; font-family:'Outfit',sans-serif; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; border-radius:2px; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:250px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; font-family:'Outfit',sans-serif; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.06em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 12px; border:1px solid; background:transparent; cursor:pointer; min-width:62px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
  #panel button.standby { color:#06080d; border-color:#3aa6ff; background:#3aa6ff; box-shadow:0 0 12px #3aa6ff55; }
  #panel button.alarm   { color:#06080d; border-color:#ff2233; background:#ff2233; box-shadow:0 0 12px #ff223388; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.55; } }

<body>
<div id="info">
  <b>SISTEMA DIVIDIDO DE REFRIGERACIÓN</b><br>
  <span>Semi-Realista · Vista de corte · Condensador + Evaporador</span>
</div>
<div id="legend">
  <div><i style="background:#e0962e"></i> Línea de líquido</div>

</div>

  <div class="row"><label>COMPRESOR</label><button id="bComp" class="standby">STANDBY</button></div>
  <div class="row"><label>VENTILADORES</label><button id="bFans" class="standby">STANDBY</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script>
(function(){
  const AT = String.fromCharCode(64);
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({
    imports: {
      "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PI2 = Math.PI * 2, HP = Math.PI / 2;

// ============================================================ SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 210, 470);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(160, 118, 158);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // perf: static sun -> bake shadows once (B5 §5.4)
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(54, 20, 9);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.6;

// ============================================================ LIGHTS
scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(90, 150, 110);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-160; sc.right=160; sc.top=160; sc.bottom=-160; sc.near=1; sc.far=420;
sun.shadow.bias = -0.0003;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35); fill.position.set(-60, 60, -60); scene.add(fill);
const rim  = new THREE.DirectionalLight(0x00d4aa, 0.18); rim.position.set(20, 30, -80);  scene.add(rim);

// ============================================================ GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 900),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -HP; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(900, 150, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12; grid.material.transparent = true; grid.position.y = 0.01; scene.add(grid);

// ============================================================ MATERIALS (PBR)
const M = {
  shell:    new THREE.MeshStandardMaterial({ color:0xc8c2a8, roughness:0.62, metalness:0.25, transparent:true, opacity:0.20, depthWrite:false, side:THREE.DoubleSide }),
  shellSolid:new THREE.MeshStandardMaterial({ color:0xc8c2a8, roughness:0.58, metalness:0.28 }),
  shellTrim: new THREE.MeshStandardMaterial({ color:0xa8a290, roughness:0.55, metalness:0.35 }),
  shellEdge: new THREE.MeshStandardMaterial({ color:0x7a7466, roughness:0.6,  metalness:0.4 }),
  galvShell: new THREE.MeshStandardMaterial({ color:0xb0b4b8, roughness:0.5,  metalness:0.7, transparent:true, opacity:0.22, depthWrite:false, side:THREE.DoubleSide }),
  galv:     new THREE.MeshStandardMaterial({ color:0xb0b4b8, roughness:0.5,  metalness:0.7 }),
  galvDark: new THREE.MeshStandardMaterial({ color:0x6a6e74, roughness:0.55, metalness:0.65 }),
  skid:     new THREE.MeshStandardMaterial({ color:0x8a8a90, roughness:0.7,  metalness:0.5 }),
  skidDark: new THREE.MeshStandardMaterial({ color:0x3a3a40, roughness:0.75, metalness:0.4 }),
  black:    new THREE.MeshStandardMaterial({ color:0x1e1e22, roughness:0.38, metalness:0.85 }),
  blackMatte:new THREE.MeshStandardMaterial({ color:0x15151a, roughness:0.75, metalness:0.3 }),
  grille:   new THREE.MeshStandardMaterial({ color:0x0a0a0e, roughness:0.85, metalness:0.2 }),
  copper:   new THREE.MeshStandardMaterial({ color:0xb87333, roughness:0.32, metalness:0.92 }),
  copperDark:new THREE.MeshStandardMaterial({ color:0x7a4a1f, roughness:0.45, metalness:0.85 }),
  aluminum: new THREE.MeshStandardMaterial({ color:0xc0c4c8, roughness:0.35, metalness:0.9, side:THREE.DoubleSide }),
  coilFace: new THREE.MeshStandardMaterial({ color:0x4a6878, roughness:0.68, metalness:0.55 }),
  ecoilFace:new THREE.MeshStandardMaterial({ color:0x2b5fa8, roughness:0.6,  metalness:0.5 }),
  filter:   new THREE.MeshStandardMaterial({ color:0xd0c090, roughness:0.95, metalness:0.02 }),
  insulation:new THREE.MeshStandardMaterial({ color:0x30363e, roughness:0.95, metalness:0.0 }),
  plate:    new THREE.MeshStandardMaterial({ color:0x2a2f36, roughness:0.5,  metalness:0.6 }),
  bolt:     new THREE.MeshStandardMaterial({ color:0x40444a, roughness:0.4,  metalness:0.85 }),
};

// ============================================================ HELPERS
function box(w,h,d, mat, x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m; }
function panel(w,h,d, mat, x,y,z){ const m=box(w,h,d,mat,x,y,z); m.castShadow=false; return m; }
function cyl(r1,r2,h, mat, x,y,z, seg=20){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m; }
function tube(p0,p1,r,mat,seg=12){
  const a=new THREE.Vector3(...p0), b=new THREE.Vector3(...p1);
  const dir=new THREE.Vector3().subVectors(b,a); const len=dir.length();
  if(len < 1e-4) return new THREE.Group();   // evita cilindros degenerados (NaN)
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg),mat);
  m.position.copy(a).add(dir.clone().multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  m.castShadow=true; m.receiveShadow=true; return m;
}

const root = new THREE.Group();
scene.add(root);

// =================================================================
//  CONDENSADOR (unidad exterior · descarga horizontal frontal)
// =================================================================
const CD_LEN = 26, CD_W = 26, CD_H = 28;

(function buildCondenserCabinet(){
  const yC = CD_H/2+1, hWall = CD_H-2;
  // skid
  root.add(box(CD_LEN+2, 1.2, CD_W+2, M.skid, CD_LEN/2, 0.6, CD_W/2));
  root.add(box(CD_LEN+2, 0.9, 0.9, M.skidDark, CD_LEN/2, 1.4, 0.4));
  root.add(box(CD_LEN+2, 0.9, 0.9, M.skidDark, CD_LEN/2, 1.4, CD_W-0.4));
  // techo sólido + remate (el ventilador va encima)
  root.add(panel(CD_LEN+0.4, 0.6, CD_W+0.4, M.shellSolid, CD_LEN/2, CD_H+0.3, CD_W/2));
  root.add(panel(CD_LEN+0.7, 0.35, CD_W+0.7, M.shellTrim, CD_LEN/2, CD_H+0.65, CD_W/2));
  // 4 paredes sólidas (unidad cerrada)
  root.add(panel(0.5, hWall, CD_W, M.shellSolid, CD_LEN+0.25, yC, CD_W/2));   // derecha
  root.add(panel(0.5, hWall, CD_W, M.shellSolid, -0.25,       yC, CD_W/2));   // izquierda
  root.add(panel(CD_LEN, hWall, 0.5, M.shellSolid, CD_LEN/2, yC, -0.25));     // trasera (z=0)
  root.add(panel(CD_LEN, hWall, 0.5, M.shellSolid, CD_LEN/2, yC, CD_W+0.25)); // frontal (z=CD_W)
  // trim vertical en las 4 esquinas
  for(const [x,z] of [[0.3,0.3],[CD_LEN-0.3,0.3],[0.3,CD_W-0.3],[CD_LEN-0.3,CD_W-0.3]])
    root.add(box(0.7, hWall, 0.7, M.shellEdge, x, yC, z));
  // persianas horizontales en las caras visibles (look de condensador)
  for(let i=0;i<14;i++){ const y=4+i*1.5;
    root.add(box(CD_LEN-3, 0.35, 0.3, M.shellEdge, CD_LEN/2, y, CD_W+0.45));  // frontal
    root.add(box(0.3, 0.35, CD_W-3, M.shellEdge, CD_LEN+0.45, y, CD_W/2));    // derecha
  }
  // placa de datos
  root.add(panel(0.2, 3, 6, M.plate, CD_LEN+0.7, CD_H-7, 6));
})();

// (serpentín interior omitido — el condensador queda cerrado, solo se ve el abanico)

// --- válvulas de servicio (cara derecha) — conexión del line set
root.add(cyl(0.55,0.55,2.4, M.copper, CD_LEN+1, 4, 15, 12)); // succión
root.add(cyl(0.4,0.4,2.4, M.copper, CD_LEN+1, 4, 18, 12));   // líquido
root.add(box(1.6,1.6,1.2, M.blackMatte, CD_LEN+0.6, 4, 16.5));

// (compresor omitido — el botón COMPRESOR controla el flujo de refrigerante por el line set)

// =================================================================
//  VENTILADOR AXIAL (pala scimitar) — eje Z, descarga frontal
// =================================================================
function makeAeroBlade(){
  const s=new THREE.Shape();
  s.moveTo(0.5,-0.30);
  s.quadraticCurveTo(1.6,-0.75,3.1,-0.55);
  s.quadraticCurveTo(3.9,-0.35,4.15,0.05);
  s.quadraticCurveTo(4.25,0.38,3.85,0.58);
  s.quadraticCurveTo(2.8,0.88,1.4,0.55);
  s.quadraticCurveTo(0.8,0.35,0.5,0.20);
  s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{ depth:0.2, bevelEnabled:true, bevelSegments:2, bevelSize:0.04, bevelThickness:0.04, steps:1 });
  g.translate(0,0,-0.1);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const tp=Math.max(0,Math.min(1,(x-0.5)/3.7));
    const tw=0.70 - tp*0.48;
    pos.setXYZ(i, x, y*Math.cos(tw)-z*Math.sin(tw), y*Math.sin(tw)+z*Math.cos(tw));
  }
  pos.needsUpdate=true; g.computeVertexNormals(); return g;
}
const aeroBladeGeo = makeAeroBlade();

function makeAxialFanY(cx,cy,cz){
  // shroud venturi (eje Y, descarga hacia arriba)
  const shroud=new THREE.Mesh(new THREE.CylinderGeometry(5,5,1.8,28,1,true), M.galv);
  shroud.position.set(cx,cy,cz); shroud.castShadow=true; root.add(shroud);
  const lip=new THREE.Mesh(new THREE.TorusGeometry(5,0.35,8,32), M.galvDark);
  lip.position.set(cx,cy+0.95,cz); lip.rotation.x=HP; root.add(lip);
  // deck/base alrededor del ventilador (sobre el techo)
  const deck=new THREE.Mesh(new THREE.TorusGeometry(5.4,0.5,8,32), M.shellTrim);
  deck.position.set(cx,cy-0.9,cz); deck.rotation.x=HP; root.add(deck);
  // guarda de alambre (anillos + rayos) arriba
  for(const r of [1.5,3,4.5]){ const ring=new THREE.Mesh(new THREE.TorusGeometry(r,0.08,4,24), M.bolt); ring.position.set(cx,cy+1.3,cz); ring.rotation.x=HP; root.add(ring); }
  for(let i=0;i<8;i++){ const a=i/8*PI2; const sp=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,4.8), M.bolt); sp.position.set(cx,cy+1.3,cz); sp.rotation.y=a; root.add(sp); }
  // rotor (palas scimitar, gira en Y)
  const spin=new THREE.Group(); spin.position.set(cx,cy-0.1,cz);
  const hub=cyl(1.0,1.2,1.2, new THREE.MeshStandardMaterial({color:0x45454a,roughness:0.4,metalness:0.85}), 0,0,0,16); spin.add(hub);
  const mat=new THREE.MeshStandardMaterial({ color:0x3aa6ff, roughness:0.4, metalness:0.65, emissive:0x3aa6ff, emissiveIntensity:0.35, side:THREE.DoubleSide });
  for(let i=0;i<5;i++){ const a=i/5*PI2; const b=new THREE.Mesh(aeroBladeGeo, mat); b.rotation.y=a; b.castShadow=true; spin.add(b); }
  root.add(spin);
  spin.traverse(o => o.castShadow = false); // perf: animated fan excluded from baked shadow map (B5 §5.4)
  return { spin, mat };
}
const condFan = makeAxialFanY(CD_LEN/2, CD_H+2, CD_W/2);

// =================================================================
//  EVAPORADOR (fan coil de ducto · colgado del techo)
// =================================================================
const EV_X0=56, EV_LEN=52, EV_W=22, EV_H=16, EV_LIFT=22;
const EV_X1=EV_X0+EV_LEN, EB=2+EV_LIFT, ET=EV_H+EV_LIFT, eyC=(EB+ET)/2;

(function buildEvaporatorCabinet(){
  // varillas roscadas de suspensión
  for(const [lx,lz] of [[EV_X0+2,2],[EV_X0+2,EV_W-2],[EV_X1-2,2],[EV_X1-2,EV_W-2]]){
    root.add(cyl(0.3,0.3,8, M.bolt, lx, ET+4, lz, 8));
    root.add(box(1.2,0.4,1.2, M.skidDark, lx, ET+0.2, lz));
  }
  // gabinete (galvanizado semi-transparente): techo, piso, pared trasera
  root.add(panel(EV_LEN, 0.5, EV_W, M.galvShell, (EV_X0+EV_X1)/2, ET, EV_W/2));
  root.add(panel(EV_LEN, 0.5, EV_W, M.galvShell, (EV_X0+EV_X1)/2, EB, EV_W/2));
  root.add(panel(EV_LEN, EV_H-1, 0.4, M.galvShell, (EV_X0+EV_X1)/2, eyC, 0.2));
  // marco de la cara de corte (cercana, z=EV_W)
  root.add(box(0.5, EV_H, 0.5, M.shellEdge, EV_X0, eyC, EV_W-0.25));
  root.add(box(0.5, EV_H, 0.5, M.shellEdge, EV_X1, eyC, EV_W-0.25));
  root.add(box(EV_LEN, 0.5, 0.5, M.shellEdge, (EV_X0+EV_X1)/2, ET, EV_W-0.25));
  root.add(box(EV_LEN, 0.5, 0.5, M.shellEdge, (EV_X0+EV_X1)/2, EB, EV_W-0.25));
  // reja de retorno + filtro (extremo izquierdo)
  root.add(panel(0.3, EV_H-2, EV_W-2, M.grille, EV_X0+0.1, eyC, EV_W/2));
  for(let i=0;i<7;i++){ const y=EB+2+i*((EV_H-3)/6); root.add(box(0.4,0.25,EV_W-2.5, M.shellEdge, EV_X0+0.2, y, EV_W/2)); }
  root.add(panel(1.2, EV_H-3, EV_W-3, M.filter, EV_X0+1.2, eyC, EV_W/2));
  // collarín / plenum de descarga (extremo derecho)
  root.add(box(0.5, EV_H-2, EV_W-2, M.galvDark, EV_X1-0.1, eyC, EV_W/2));
  root.add(box(2.0, EV_H-5, EV_W-6, M.grille, EV_X1+1.0, eyC, EV_W/2));
  root.add(box(2.2, EV_H-4, EV_W-5, M.galvDark, EV_X1+1.0, eyC, EV_W/2));
  // caja de control (cara cercana, extremo izquierdo)
  root.add(box(6, 5, 1.0, M.blackMatte, EV_X0+5, EB+3, EV_W-0.4));
  root.add(box(2.5, 1.2, 0.4, M.bolt, EV_X0+5, EB+3, EV_W+0.2));
  // conexiones de refrigerante (extremo izquierdo)
  root.add(cyl(0.55,0.55,2.0, M.copper, EV_X0-1.0, EB+5, 15, 12)); // succión
  root.add(cyl(0.4,0.4,2.0, M.copper, EV_X0-1.0, EB+6, 18, 12));   // líquido
})();

// --- serpentín del evaporador (slab azul con fins + cobre + charola)
(function buildEvapCoil(){
  const cX=EV_X0+8, y0=EB+1, y1=ET-1, yC=(y0+y1)/2, yH=y1-y0;
  root.add(panel(0.15, yH, EV_W-4, M.ecoilFace, cX+0.9, yC, EV_W/2));
  root.add(panel(0.15, yH, EV_W-4, M.ecoilFace, cX-0.9, yC, EV_W/2));
  const nb=18, z0=2.5, z1=EV_W-2.5;
  for(let i=0;i<nb;i++){
    const z=z0+(z1-z0)*(i/(nb-1));
    const fin=new THREE.Mesh(new THREE.PlaneGeometry(1.8, yH-0.4), M.aluminum);
    fin.position.set(cX, yC, z); root.add(fin);
  }
  for(let r=0;r<5;r++){
    const y=y0+1+r*((yH-2)/4);
    const t=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,EV_W-4,12), M.copper);
    t.rotation.x=HP; t.position.set(cX, y, EV_W/2); root.add(t);
    if(r<4){ const ny=y0+1+(r+1)*((yH-2)/4); const ub=new THREE.Mesh(new THREE.TorusGeometry((ny-y)/2,0.24,8,16,Math.PI), M.copper); ub.position.set(cX, (y+ny)/2, EV_W-2.2); ub.rotation.y=HP; ub.rotation.z=-HP; root.add(ub); }
  }
  // charola de condensados
  root.add(box(4, 0.4, EV_W-3, M.galv, cX, y0-0.4, EV_W/2));
})();

// --- soplador centrífugo (scroll + jaula de ardilla) — eje Z, rotor expuesto al corte
let blowerRefs;
(function buildBlower(){
  const bx=EV_X0+34, by=EB+7, bz=EV_W/2, sR=5, sD=8;
  const zNear = bz + sD/2;   // lado cámara (z alto, cara de corte)
  const zFar  = bz - sD/2;   // lado fondo
  // voluta (anillo parcial, coaxial al rotor — no tapa el frente)
  const scroll=new THREE.Mesh(new THREE.TorusGeometry(sR,1.0,12,32,Math.PI), M.galvDark);
  scroll.position.set(bx,by,bz); scroll.rotation.z=Math.PI; scroll.castShadow=true; root.add(scroll);
  // placa trasera + motor del lado del fondo (no estorban a la cámara)
  const back=new THREE.Mesh(new THREE.CylinderGeometry(sR,sR,0.3,32), M.galvDark);
  back.rotation.x=HP; back.position.set(bx,by,zFar-0.2); root.add(back);
  root.add(cyl(1.6,1.6,3, M.black, bx, by, zFar-2, 16));
  // aro venturi de entrada (ABIERTO) del lado de la cámara — deja ver las aspas
  const inlet=new THREE.Mesh(new THREE.RingGeometry(sR-1.6, sR-0.2, 32), M.galv);
  inlet.position.set(bx,by,zNear+0.3); root.add(inlet);
  // cuello de salida hacia +X (al plenum)
  root.add(box(4, 4, sD-1, M.galvDark, bx+sR+1.5, by+1, bz));
  // rotor (jaula de ardilla), centrado y expuesto hacia el corte
  const spin=new THREE.Group(); spin.position.set(bx,by,bz);
  const mat=new THREE.MeshStandardMaterial({ color:0x3aa6ff, roughness:0.45, metalness:0.6, emissive:0x3aa6ff, emissiveIntensity:0.5, side:THREE.DoubleSide });
  const hub=cyl(1.1,1.1,sD-1, M.bolt, 0,0,0,16); hub.rotation.x=HP; spin.add(hub);
  const NB=16, bR=sR-1.5, bLen=sD-1.4;
  for(let i=0;i<NB;i++){ const a=i/NB*PI2; const b=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.25,bLen), mat); b.position.set(Math.cos(a)*bR, Math.sin(a)*bR, 0); b.rotation.z=a+HP+0.3; b.castShadow=true; spin.add(b); }
  for(const z of [-(bLen/2), bLen/2]){ const tr=new THREE.Mesh(new THREE.TorusGeometry(bR+0.2,0.16,6,36), mat); tr.position.set(0,0,z); spin.add(tr); }
  // marcadores trazadores (color fijo) en la cara cercana — para PERCIBIR el giro
  const traceMat=new THREE.MeshStandardMaterial({ color:0xffb020, emissive:0xffb020, emissiveIntensity:0.9, roughness:0.4, metalness:0.5 });
  for(let i=0;i<3;i++){ const a=i/3*PI2; const sp=new THREE.Mesh(new THREE.BoxGeometry(0.4, bR*1.9, 0.4), traceMat); sp.position.set(0,0,bLen/2+0.25); sp.rotation.z=a; spin.add(sp); }
  const cap=new THREE.Mesh(new THREE.SphereGeometry(1.0,12,8), traceMat); cap.position.set(0,0,bLen/2+0.25); spin.add(cap);
  root.add(spin);
  spin.traverse(o => o.castShadow = false); // perf: animated blower excluded from baked shadow map (B5 §5.4)
  blowerRefs={ spin, mat };
})();

// =================================================================
//  LINE SET (succión aislada + línea de líquido)
// =================================================================
const suctionPts = [[CD_LEN,4,15],[CD_LEN,EB+5,15],[EV_X0,EB+5,15]];
const liquidPts  = [[CD_LEN,4,18],[CD_LEN,EB+6,18],[EV_X0,EB+6,18]];
// codos como esferas en los vértices (suaviza las esquinas)
function elbows(pts, r, mat){
  for(let i=1;i<pts.length-1;i++){ const s=new THREE.Mesh(new THREE.SphereGeometry(r,12,8), mat); s.position.set(...pts[i]); root.add(s); }
}
// succión (cobre + funda de aislante)
for(let i=0;i<suctionPts.length-1;i++){ root.add(tube(suctionPts[i],suctionPts[i+1],0.9,M.insulation,14)); }
elbows(suctionPts,0.9,M.insulation);
// líquido (cobre desnudo)
for(let i=0;i<liquidPts.length-1;i++){ root.add(tube(liquidPts[i],liquidPts[i+1],0.4,M.copper,12)); }
elbows(liquidPts,0.4,M.copper);

// =================================================================
//  MÁQUINA DE ESTADOS (STANDBY → ON → ALARM)
// =================================================================
const COLOR_STANDBY=new THREE.Color(0x3aa6ff), COLOR_ON=new THREE.Color(0x00ff66), COLOR_ALARM=new THREE.Color(0xff2233);
const colorFor=s=> s==='on'?COLOR_ON : s==='alarm'?COLOR_ALARM : COLOR_STANDBY;
const intFor  =s=> s==='on'?0.65 : s==='alarm'?0.7 : 0.45;
const state={ comp:'standby', fans:'standby' };

function applyState(){
  // ventiladores
  [condFan.mat, blowerRefs.mat].forEach(m=>{ m.color.copy(colorFor(state.fans)); m.emissive.copy(colorFor(state.fans)); m.emissiveIntensity=intFor(state.fans); });
}
applyState();

const CYCLE={ standby:'on', on:'alarm', alarm:'standby' };
function bind(id,key){ const b=document.getElementById(id); b.onclick=()=>{ state[key]=CYCLE[state[key]]; b.className=state[key]; b.textContent=state[key].toUpperCase(); applyState(); }; }
bind('bComp','comp');
bind('bFans','fans');
const bRot=document.getElementById('bRot');
bRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; bRot.className=controls.autoRotate?'on':'off'; bRot.textContent=controls.autoRotate?'ON':'OFF'; };

// =================================================================
//  PARTÍCULAS
// =================================================================
function makePath(pts){
  const segs=[]; let total=0;
  for(let i=0;i<pts.length-1;i++){ const a=new THREE.Vector3(...pts[i]), b=new THREE.Vector3(...pts[i+1]); const len=a.distanceTo(b); segs.push({a,b,len,acc:total}); total+=len; }
  return { segs, total:Math.max(total,1e-6) };
}
function pathPos(path,t,out){
  const d=t*path.total;
  for(let i=0;i<path.segs.length;i++){ const s=path.segs[i]; if(d<=s.acc+s.len || i===path.segs.length-1){ out.lerpVectors(s.a,s.b,Math.min(1,(d-s.acc)/Math.max(s.len,1e-6))); return; } }
}
const liquidPath=makePath(liquidPts);
const suctionPath=makePath([...suctionPts].reverse());

const pGeo=new THREE.SphereGeometry(0.45,7,5);
function mkP(n,color){ const arr=[]; const bm=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.85}); for(let i=0;i<n;i++){ const m=new THREE.Mesh(pGeo, bm.clone()); m.userData={t:i/n, seed:Math.random()*10}; root.add(m); arr.push(m);} return arr; }
const liquidP=mkP(26,0xe0962e), suctionP=mkP(26,0x33d6e0), returnP=mkP(28,0xff5533), supplyP=mkP(28,0x44bbff);
const tmp=new THREE.Vector3();

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// =================================================================
//  ANIMATE
// =================================================================
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  if(state.fans==='on'){ condFan.spin.rotation.y += dt*9; blowerRefs.spin.rotation.z += dt*8; }

  const flow=state.comp==='on';
  liquidP.forEach(p=>{ if(!flow){p.material.opacity=0;return;} p.userData.t+=dt*0.22; if(p.userData.t>1)p.userData.t-=1; pathPos(liquidPath,p.userData.t,tmp); p.position.copy(tmp); p.material.opacity=0.9; });
  suctionP.forEach(p=>{ if(!flow){p.material.opacity=0;return;} p.userData.t+=dt*0.2; if(p.userData.t>1)p.userData.t-=1; pathPos(suctionPath,p.userData.t,tmp); p.position.copy(tmp); p.material.opacity=0.9; });

  const air=state.fans==='on';
  const eby=EB+7, ecoilX=EV_X0+8, ebx=EV_X0+34;
  returnP.forEach((p,i)=>{ if(!air){p.material.opacity=0;return;} p.userData.t+=dt*0.3; if(p.userData.t>1)p.userData.t=0; const tt=p.userData.t,seed=p.userData.seed; const zo=((i%5)-2)*2.2, yo=((Math.floor(i/5)%3)-1)*2.2;
    p.position.x=(EV_X0-9)+tt*(ecoilX-EV_X0+9); p.position.y=eby+yo+Math.sin(tt*6+seed)*0.5; p.position.z=EV_W/2+zo+Math.cos(tt*4+seed)*0.5; p.material.opacity=Math.sin(tt*Math.PI)*0.85; });
  supplyP.forEach((p,i)=>{ if(!air){p.material.opacity=0;return;} p.userData.t+=dt*0.32; if(p.userData.t>1)p.userData.t=0; const tt=p.userData.t,seed=p.userData.seed; const zo=((i%5)-2)*2.0, yo=((Math.floor(i/5)%3)-1)*2.0;
    p.position.x=(ebx+5)+tt*(EV_X1+11-ebx-5); p.position.y=eby+yo+Math.sin(tt*5+seed)*0.6; p.position.z=EV_W/2+zo+Math.cos(tt*4+seed)*0.6; p.material.opacity=Math.sin(tt*Math.PI)*0.85; });

  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
