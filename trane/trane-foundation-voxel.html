<style>

  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }

  #panel button.off { color:#ff4455; border-color:#ff4455; }

<body>
<div id="info">
  <b>TRANE FOUNDATION&trade; EAC180-300</b><br>
  <span>Voxel Art · Cut-away View · 15&ndash;25 Toneladas</span>
</div>
<div id="legend">
  <div><i style="background:#ff4422"></i> Aire de retorno</div>
  <div><i style="background:#44aaff"></i> Aire de suministro</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>SUPPLY FAN</label><button id="bFan" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 1</label><button id="bC1" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 2</label><button id="bC2" class="standby">STANDBY</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 100, 280);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 800);
camera.position.set(95, 70, 90);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // perf: static sun -> bake shadows once (B5 §5.4)
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(29, 12, 14);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(60, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-100; sc.right=100; sc.top=100; sc.bottom=-100; sc.near=1; sc.far=300;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 50));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 50));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(600, 100, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}

const COL = {
  BEIGE:    0xc8c2a8,
  BEIGE_D:  0xa8a290,
  SKID:     0xa8a8ac,
  DARK:     0x2a2a2e,
  HOUSING:  0x6a6a72,
  HOUSING_D:0x4a4a52,
  COIL:     0x4a6878,
  COIL_H:   0x6080a0,
  COPPER:   0xb87333,
  COMP:     0x3a3a40,
  COMP_L:   0x55555c,
  MOTOR:    0x55555c,
  FRAME:    0x3a3a3e,
  GRILLE:   0x1a1a1e,
  PANEL:    0xb0aa92,
  FILTER:   0x5a5048,
  FILTER_H: 0x6a5e54,
};

// ====== DIMENSIONS (voxel units) ======
// Foundation EAC180-300 proportions: 123" × 80" × 72" (L × W × H)
// Single rectangular cabinet, no hood
const AH_LEN   = 32;          // Air handler section (filter + coil + blower)
const COMP_LEN = 26;          // Compressor / condenser section
const W = 28;                 // Width / depth
const H = 24;                 // Height (squatter than Voyager H=28)
const compX0  = AH_LEN;
const compX1  = AH_LEN + COMP_LEN;
const TOTAL   = compX1;       // 58

// ====== SKID (base) ======
for (let x=-1; x<=TOTAL; x++)
  for (let z=-1; z<=W; z++) {
    vox(x, 0, z, COL.SKID);
    if (x===-1 || x===TOTAL || z===-1 || z===W)
      vox(x, 1, z, COL.DARK);
  }

// ====== AIR HANDLER CABINET SHELL (transparent) ======
// Left wall (intake side) - solid with louvers
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(0, y, z, COL.BEIGE);
// Roof for AH section (extended to AH_LEN inclusive — caps the partition)
for (let x=0; x<=AH_LEN; x++) {
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);     // roof
    vox(x, H+1, z, COL.BEIGE_D);   // roof edge cap
  }
}
// Back wall for AH section
for (let x=0; x<AH_LEN; x++)
  for (let y=2; y<H; y++)
    vox(x, y, W-1, COL.BEIGE);

// ====== LOUVERS on left intake wall (fresh air / side return) ======
for (let i=0; i<7; i++) {
  const y = 6 + i*2;
  for (let z=4; z<W-4; z++) vox(0, y, z, COL.FRAME);
}
// Vertical louver frame stiffeners
for (let y=4; y<H-2; y++) {
  vox(0, y, 4,    COL.BEIGE_D);
  vox(0, y, W-5,  COL.BEIGE_D);
}

// ====== INTERNAL PARTITION between AH and Compressor sections ======
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(AH_LEN, y, z, COL.BEIGE_D);

// ====== COMPRESSOR CABINET SHELL ======
// Roof only — back wall and right wall are replaced by condenser coil + frame below
for (let x=AH_LEN+1; x<=compX1; x++) {
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);
    vox(x, H+1, z, COL.BEIGE_D);
  }
}
// Back-wall frame for compressor section (around the condenser coil opening)
for (let x=AH_LEN+1; x<compX1; x++) {
  vox(x, 2,   W-1, COL.BEIGE_D);  // bottom rail
  vox(x, H-2, W-1, COL.BEIGE_D);  // top rail
  vox(x, H-1, W-1, COL.BEIGE_D);  // top cap under roof
}
// Right end wall — frame only (condenser coil fills interior below)
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++) {
    const isFrame = (y<3 || y>=H-2 || z<2 || z>=W-2);
    if (isFrame) vox(compX1, y, z, COL.BEIGE_D);
  }

// Upper-front control-panel solid panel (electrical compartment cover)
for (let x=AH_LEN+1; x<compX1; x++)
  for (let y=Math.floor(H*0.55); y<H; y++)
    vox(x, y, 0, COL.BEIGE);
// Door seam (vertical)
const doorX = AH_LEN + Math.floor(COMP_LEN/2);
for (let y=Math.floor(H*0.55); y<H-1; y++)
  vox(doorX, y, 0, COL.DARK);
// Door handles
const handleY = Math.floor(H*0.7);
vox(doorX-3, handleY, 0, COL.SKID);
vox(doorX-2, handleY, 0, COL.SKID);
vox(doorX+2, handleY, 0, COL.SKID);
vox(doorX+3, handleY, 0, COL.SKID);

// ====== CONDENSER COIL (slats on back wall + right end wall) ======
// Back wall of compressor section — interior only, edges are FRAME posts
for (let x=AH_LEN+2; x<compX1-1; x++)
  for (let y=3; y<H-2; y++) {
    vox(x, y, W-1, (y%2===0) ? COL.COIL : COL.COIL_H);
  }
// Back-wall vertical edge posts (left + right)
for (let y=3; y<H-2; y++) {
  vox(AH_LEN+1, y, W-1, COL.FRAME);
  vox(compX1-1, y, W-1, COL.FRAME);
}
// Right end wall coil — fills the BEIGE_D frame opening
for (let z=2; z<W-2; z++)
  for (let y=3; y<H-2; y++) {
    vox(compX1, y, z, (y%2===0) ? COL.COIL : COL.COIL_H);
  }

// ====== SLANTED FILTER RACK (Foundation signature) ======
// Filter tilts in X axis as Z increases — diagonal panel from front (low X) to back (high X)
const filterBaseX = 4;
const filterTiltPerZ = 0.18;   // X-shift per unit Z
const filterTopY = H - 4;
const filterBotY = 4;
for (let z=2; z<W-2; z++) {
  const dx = Math.floor((z - 2) * filterTiltPerZ);
  // Frame top + bottom rails
  vox(filterBaseX + dx,     filterBotY, z, COL.FRAME);
  vox(filterBaseX + dx + 3, filterBotY, z, COL.FRAME);
  vox(filterBaseX + dx,     filterTopY, z, COL.FRAME);
  vox(filterBaseX + dx + 3, filterTopY, z, COL.FRAME);
  // Filter media (3 voxels thick, alternating media pattern)
  for (let y=filterBotY+1; y<filterTopY; y++) {
    for (let dxx=0; dxx<3; dxx++) {
      const x = filterBaseX + dx + dxx;
      const k = (x + y + z) % 3;
      if      (k === 0) vox(x, y, z, COL.FILTER);
      else if (k === 1) vox(x, y, z, COL.FILTER_H);
      // k===2 left empty for see-through filter look
    }
  }
}
// Filter rack vertical end-caps
for (let y=filterBotY; y<=filterTopY; y++) {
  vox(filterBaseX,                 y, 2,   COL.FRAME);
  vox(filterBaseX + 3,             y, 2,   COL.FRAME);
  const dxEnd = Math.floor((W-3 - 2) * filterTiltPerZ);
  vox(filterBaseX + dxEnd,         y, W-3, COL.FRAME);
  vox(filterBaseX + dxEnd + 3,     y, W-3, COL.FRAME);
}

// ====== COOLING COIL (downstream of filter, vertical 4-thick) ======
const coilX = 12;
for (let x=coilX; x<coilX+4; x++)
  for (let y=3; y<H-2; y++)
    for (let z=2; z<W-2; z++) {
      const isEdge = (x===coilX || x===coilX+3);
      vox(x, y, z, isEdge ? COL.COIL : COL.COIL_H);
    }
// Coil frame
for (let y=3; y<H-2; y++) {
  vox(coilX-1, y, 2,    COL.FRAME); vox(coilX-1, y, W-3, COL.FRAME);
  vox(coilX+4, y, 2,    COL.FRAME); vox(coilX+4, y, W-3, COL.FRAME);
}
for (let x=coilX-1; x<=coilX+4; x++) {
  vox(x, 3,   2, COL.FRAME); vox(x, H-3, 2, COL.FRAME);
  vox(x, 3, W-3, COL.FRAME); vox(x, H-3, W-3, COL.FRAME);
}
// Copper U-bends on left side of coil
for (let i=0; i<6; i++) {
  const y = 5 + i*3;
  vox(coilX-1, y,   1, COL.COPPER);
  vox(coilX-1, y+1, 1, COL.COPPER);
  vox(coilX-2, y,   1, COL.COPPER);
  vox(coilX-2, y+1, 1, COL.COPPER);
}
// Drain pan under coil
for (let x=coilX-1; x<coilX+5; x++)
  for (let z=2; z<W-2; z++)
    vox(x, 2, z, COL.SKID);

// ====== BLOWER SCROLL HOUSING (rear half open, front for cut-away) ======
const bcx = 23;
const bcy = Math.floor(H/2);
const bcz = Math.floor(W/2);
const brOut = 8, brIn = 6;
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    const r2 = dx*dx + dy*dy;
    if (r2 <= brOut*brOut && r2 >= brIn*brIn) {
      for (let dz=0; dz<=8; dz++) vox(x, y, bcz+dz, COL.HOUSING);
    }
  }
// Back side plate
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    if (dx*dx + dy*dy <= brOut*brOut)
      vox(x, y, bcz+9, COL.HOUSING_D);
  }
// Outlet duct on top
for (let x=bcx-3; x<=bcx+3; x++)
  for (let y=bcy+brOut; y<bcy+brOut+3; y++)
    for (let z=bcz-6; z<=bcz+6; z++)
      if (x===bcx-3 || x===bcx+3 || z===bcz-6 || z===bcz+6 || y===bcy+brOut+2)
        vox(x, y, z, COL.HOUSING);
// Belt guard on right (z-side)
for (let x=bcx+brOut-1; x<=bcx+brOut+3; x++)
  for (let y=bcy-6; y<bcy-2; y++)
    vox(x, y, bcz-7, COL.DARK);
// Motor block (right of scroll, drives via belt)
for (let x=bcx+brOut+1; x<=bcx+brOut+5; x++)
  for (let y=bcy-3; y<=bcy; y++)
    for (let z=bcz-8; z<=bcz-5; z++)
      vox(x, y, z, COL.MOTOR);

// ====== COMPRESSORS (2 scroll cylinders, tandem) ======
function buildCompressor(cx, cz) {
  const r = 4;
  // Base flange
  for (let x=cx-r-1; x<=cx+r+1; x++)
    for (let z=cz-r-1; z<=cz+r+1; z++) {
      const dx=x-cx, dz=z-cz;
      if (dx*dx+dz*dz <= (r+1)*(r+1))
        vox(x, 2, z, COL.DARK);
    }
  // Cylindrical body
  for (let y=3; y<=11; y++)
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= r*r) {
          const isShell = (d2 >= (r-1)*(r-1));
          vox(x, y, z, isShell ? COL.COMP : COL.DARK);
        }
      }
  // Hemispheric top dome
  for (let dy=0; dy<=r; dy++) {
    const rr = Math.sqrt(r*r - dy*dy);
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= rr*rr) {
          const isShell = (d2 >= (rr-1)*(rr-1));
          if (isShell || dy===r) vox(x, 12+dy, z, COL.COMP);
        }
      }
  }
  // Copper suction + discharge lines
  for (let y=16; y<=19; y++) {
    vox(cx+1, y, cz, COL.COPPER);
    vox(cx-1, y, cz, COL.COPPER);
  }
  // Junction box on front
  for (let y=6; y<=9; y++)
    for (let x=cx-1; x<=cx+1; x++)
      vox(x, y, cz-r-1, COL.DARK);
}
buildCompressor(compX0 + 7,  Math.floor(W/2));
buildCompressor(compX0 + 19, Math.floor(W/2));

// ====== INTERCONNECTING REFRIGERANT MANIFOLD (copper between compressors) ======
for (let x=compX0+7; x<=compX0+19; x++) {
  vox(x, 17, Math.floor(W/2)+1, COL.COPPER); // suction header
  vox(x, 18, Math.floor(W/2)+1, COL.COPPER);
  vox(x, 17, Math.floor(W/2)-1, COL.COPPER); // discharge header
  vox(x, 18, Math.floor(W/2)-1, COL.COPPER);
}
// Risers from compressor section heading toward coil (back wall)
for (let z=Math.floor(W/2)+1; z<W-2; z++) {
  vox(compX0+7,  18, z, COL.COPPER);
  vox(compX0+19, 18, z, COL.COPPER);
}

// ====== CONDENSER FAN DECK ======
// Raised deck on top of compressor cabinet
for (let x=compX0+1; x<compX1; x++)
  for (let z=1; z<W-1; z++)
    vox(x, H+2, z, COL.BEIGE_D);

// 2 fan housings (front + back along Z, single column along X)
function fanHousingVox(cx, cz) {
  const r = 5;
  for (let x=cx-r; x<=cx+r; x++)
    for (let z=cz-r; z<=cz+r; z++) {
      const dx=x-cx, dz=z-cz;
      const d2 = dx*dx+dz*dz;
      if (d2 <= r*r && d2 >= (r-1)*(r-1)) {
        vox(x, H+3, z, COL.HOUSING);
        vox(x, H+4, z, COL.HOUSING);
        vox(x, H+5, z, COL.HOUSING_D);
      }
      if (d2 < (r-1)*(r-1) && d2 >= (r-2)*(r-2)) {
        vox(x, H+3, z, COL.DARK);
      }
    }
}
const fanPositions = [
  [compX0 + Math.floor(COMP_LEN/2),  7],     // front fan
  [compX0 + Math.floor(COMP_LEN/2),  W-8],   // back fan
];
fanPositions.forEach(([cx,cz]) => fanHousingVox(cx, cz));

// ====== ELECTRICAL PANEL (control compartment hint) ======
// Visible interior representation behind upper-front cover (compressor section)
for (let x=compX0+2; x<compX0+Math.floor(COMP_LEN/2)-1; x++)
  for (let y=Math.floor(H*0.6); y<H-1; y++)
    if ((x+y)%2===0) vox(x, y, 1, COL.GRILLE);
// Contactor block + breaker hint
for (let x=compX0+Math.floor(COMP_LEN/2)+2; x<compX1-1; x++)
  for (let y=Math.floor(H*0.62); y<Math.floor(H*0.85); y++)
    if ((x+y)%3===0) vox(x, y, 1, COL.COMP_L);

// ====== INSTANCED MESHES ======
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const SHELL_COLORS = new Set([COL.BEIGE, COL.BEIGE_D]);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const isShell = SHELL_COLORS.has(color);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: isShell ? 0.55 : 0.5,
    metalness: isShell ? 0.15 : 0.55,
    transparent: isShell,
    opacity: isShell ? 0.2 : 1.0,
    depthWrite: !isShell,
    side: isShell ? THREE.DoubleSide : THREE.FrontSide,
  });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !isShell;
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ====== ANIMATED BLOWER WHEEL (squirrel cage, voxel blades) ======
const blowerGroup = new THREE.Group();
blowerGroup.position.set(bcx+0.5, bcy+0.5, bcz+4.5);
const wheelMat = new THREE.MeshStandardMaterial({
  color:0xff2233, roughness:0.45, metalness:0.6,
  emissive:0xff2233, emissiveIntensity:0.4
});
const bladeGeo = new THREE.BoxGeometry(0.55, 1.1, 0.55);
const bladeR = 4.2;
for (let i=0; i<16; i++) {
  const a = (i/16) * Math.PI*2;
  for (let zOff=-4; zOff<=4; zOff++) {
    const blade = new THREE.Mesh(bladeGeo, wheelMat);
    blade.position.set(Math.cos(a)*bladeR, Math.sin(a)*bladeR, zOff);
    blade.rotation.z = a;
    blade.castShadow = true;
    blowerGroup.add(blade);
  }
}
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(1.3, 1.3, 9, 14),
  wheelMat
);
hub.rotation.x = Math.PI/2;
blowerGroup.add(hub);
scene.add(blowerGroup);
blowerGroup.traverse(o => o.castShadow = false); // perf: animated blower excluded from baked shadow map (B5 §5.4)

// ====== COMPRESSOR MOTOR TOPS (voxel disks, rotating) ======
const compTops = [];
function buildCompTop(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, 17.5, cz+0.5);
  const topMat = new THREE.MeshStandardMaterial({
    color:0x55555c, roughness:0.35, metalness:0.85
  });
  for (let ax=-2; ax<=2; ax++)
    for (let az=-2; az<=2; az++)
      if (ax*ax + az*az <= 5) {
        const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.6,0.9), topMat);
        c.position.set(ax, 0, az);
        c.castShadow = true;
        g.add(c);
      }
  // Bolts
  for (let i=0; i<4; i++) {
    const a = (i/4)*Math.PI*2;
    const bolt = new THREE.Mesh(
      new THREE.BoxGeometry(0.5,0.5,0.5),
      new THREE.MeshStandardMaterial({ color:0x202024, metalness:0.7 })
    );
    bolt.position.set(Math.cos(a)*1.4, 0.5, Math.sin(a)*1.4);
    g.add(bolt);
  }
  scene.add(g);
  g.traverse(o => o.castShadow = false); // perf: animated compressor top excluded from baked shadow map (B5 §5.4)
  compTops.push(g);
}
buildCompTop(compX0 + 7,  Math.floor(W/2));
buildCompTop(compX0 + 19, Math.floor(W/2));

// ====== COMPRESSOR LED INDICATORS ======
const ledMats = [];
function makeLed(cx, cz) {
  const mat = new THREE.MeshStandardMaterial({
    color:0xff2233, emissive:0xff2233, emissiveIntensity:1.4,
    roughness:0.25, metalness:0.3
  });
  const led = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), mat);
  led.position.set(cx+0.5, 20, cz+0.5);
  scene.add(led);
  const pl = new THREE.PointLight(0xff2233, 1.2, 10);
  pl.position.copy(led.position);
  scene.add(pl);
  ledMats.push({ mat, light: pl });
}
makeLed(compX0 + 7,  Math.floor(W/2));
makeLed(compX0 + 19, Math.floor(W/2));

// ====== CONDENSER FAN BLADES (voxel, rotating) ======
const fanGroups = [];
const fanMats = [];
function makeCondenserFan(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, H + 5.8, cz+0.5);
  const bladeMat = new THREE.MeshStandardMaterial({
    color:0xff2233, roughness:0.45, metalness:0.6,
    emissive:0xff2233, emissiveIntensity:0.4
  });
  // 5 voxel blades
  for (let i=0; i<5; i++) {
    const a = (i/5)*Math.PI*2;
    for (let rr=0; rr<=4; rr++) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.45,0.9), bladeMat);
      c.position.set(Math.cos(a)*rr, 0, Math.sin(a)*rr);
      c.castShadow = true;
      g.add(c);
    }
  }
  // Hub
  const hub = new THREE.Mesh(
    new THREE.BoxGeometry(1.4,0.7,1.4),
    new THREE.MeshStandardMaterial({ color:0x55555c, metalness:0.8 })
  );
  g.add(hub);
  scene.add(g);
  g.traverse(o => o.castShadow = false); // perf: animated fan excluded from baked shadow map (B5 §5.4)
  fanGroups.push(g);
  fanMats.push(bladeMat);
}
fanPositions.forEach(([cx,cz]) => makeCondenserFan(cx, cz));

// ====== STATE MACHINE ======
const COLOR_STANDBY = new THREE.Color(0x3aa6ff);
const COLOR_ON      = new THREE.Color(0x00ff66);
const COLOR_ALARM   = new THREE.Color(0xff2233);
const colorFor = s => s==='on' ? COLOR_ON : s==='alarm' ? COLOR_ALARM : COLOR_STANDBY;
const intensityFor = s => s==='on' ? 0.65 : s==='alarm' ? 0.7 : 0.45;
const state = { fan:'standby', c1:'standby', c2:'standby' };

function applyState() {
  wheelMat.color.copy(colorFor(state.fan));
  wheelMat.emissive.copy(colorFor(state.fan));
  wheelMat.emissiveIntensity = intensityFor(state.fan);

  // Compressor 1 → fan 0 (front)   |   Compressor 2 → fan 1 (back)
  const fanStates = [state.c1, state.c2];
  fanMats.forEach((m, i) => {
    m.color.copy(colorFor(fanStates[i]));
    m.emissive.copy(colorFor(fanStates[i]));
    m.emissiveIntensity = intensityFor(fanStates[i]);
  });

  [state.c1, state.c2].forEach((s, i) => {
    ledMats[i].mat.color.copy(colorFor(s));
    ledMats[i].mat.emissive.copy(colorFor(s));
    ledMats[i].mat.emissiveIntensity = s==='standby' ? 1.2 : 1.7;
    ledMats[i].light.color.copy(colorFor(s));
    ledMats[i].light.intensity = s==='standby' ? 1.0 : 1.5;
  });
}
applyState();

// UI — click cycles STANDBY → ON → ALARM → STANDBY
const CYCLE = { standby:'on', on:'alarm', alarm:'standby' };
function bind(id, key) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    state[key] = CYCLE[state[key]];
    btn.className = state[key];
    btn.textContent = state[key].toUpperCase();
    applyState();
  };
}
bind('bFan','fan');
bind('bC1','c1');
bind('bC2','c2');
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// ====== AIRFLOW PARTICLES ======
const N = 60;
const returnP = [], supplyP = [];
const pGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
const redMat  = new THREE.MeshBasicMaterial({ color:0xff5533, transparent:true, opacity:0.85 });
const blueMat = new THREE.MeshBasicMaterial({ color:0x44bbff, transparent:true, opacity:0.85 });

for (let i=0; i<N; i++) {
  const r = new THREE.Mesh(pGeo, redMat.clone());
  r.userData = { t: Math.random(), seed: Math.random()*10 };
  scene.add(r); returnP.push(r);

  const s = new THREE.Mesh(pGeo, blueMat.clone());
  s.userData = { t: Math.random(), seed: Math.random()*10 };
  scene.add(s); supplyP.push(s);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (state.fan==='on') blowerGroup.rotation.z += dt * 7;

  const fanOn = [state.c1==='on', state.c2==='on'];
  fanGroups.forEach((g, i) => { if (fanOn[i]) g.rotation.y += dt * (9 + i*0.4); });

  const compOn = [state.c1==='on', state.c2==='on'];
  compTops.forEach((m, i) => {
    if (compOn[i]) {
      m.rotation.y += dt * 12;
      m.position.y = 17.5 + Math.sin(t*30 + i)*0.15;
    } else {
      m.position.y = 17.5;
    }
  });

  // Return air: enters from left wall (louvers), passes through filter rack and coil
  returnP.forEach((p, i) => {
    if (state.fan!=='on') { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.16;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t;
    const seed = p.userData.seed;
    const yOff = ((i % 5) - 2) * 1.6;
    const zOff = ((Math.floor(i/5) % 5) - 2) * 1.6;
    p.position.x = -4 + tt * 26;                         // moves -4 → 22 (through filter+coil to blower intake)
    p.position.y = bcy + yOff + Math.sin(tt*7 + seed)*0.6;
    p.position.z = W/2 + zOff + Math.cos(tt*4 + seed)*0.6;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });

  // Supply air: emerges from blower outlet (top of scroll) and rises through plenum
  supplyP.forEach((p, i) => {
    if (state.fan!=='on') { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.18;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t;
    const seed = p.userData.seed;
    const xOff = ((i % 5) - 2) * 0.9;
    const zOff = ((Math.floor(i/5) % 5) - 2) * 0.9;
    p.position.x = bcx + xOff + Math.sin(tt*5 + seed)*0.5;
    p.position.y = bcy + brOut + tt * 12;            // 20 → 32 (out blower top through roof)
    p.position.z = bcz + zOff + Math.cos(tt*4 + seed)*0.5;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
