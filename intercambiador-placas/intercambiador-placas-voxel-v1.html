<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERCAMBIADOR DE CALOR DE PLACAS · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; color:#c8d4dc; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:230px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:54px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
</head>
<body>
<div id="info">
  <b>INTERCAMBIADOR DE CALOR DE PLACAS</b><br>
  <span>Bastidor · Paquete de placas · Voxel Art · 1.5 × 0.6 × 1.4 m</span>
</div>
<div id="legend">
  <div><i style="background:#d0342c"></i> Circuito primario (caliente)</div>
  <div><i style="background:#2f6fd0"></i> Circuito secundario (frío)</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>FLUJO</label><button id="bFlow" class="on">ON</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script>
// Inyección dinámica del importmap (evita el mangling de "@" por Cloudflare)
(function(){
  var AT = String.fromCharCode(64);
  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three" + AT + "0.160.0/examples/jsm/"
  }});
  document.currentScript.after(im);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================
// INTERCAMBIADOR DE CALOR DE PLACAS CON BASTIDOR · VOXEL ART
// SCALE: 1 voxel = 0.025 m  (micro-voxel de alta densidad)
// Equipo: 60 x 24 x 56 voxeles = 1.5 m (L) x 0.6 m (W) x 1.4 m (H)
// Nota: la regla base de 0.1 m/voxel se sustituyó por 0.025 m/voxel
// para lograr la densidad de micro-voxeles solicitada respetando
// las dimensiones reales del equipo.
// Configuración: 1 paso — 4 bocas en la placa fija (contraflujo).
// ============================================================

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 160, 420);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 900);
camera.position.set(100, 62, 92);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 130, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;   sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 10;  sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0004;
sun.target.position.set(25, 22, 12);
scene.add(sun, sun.target);

const fillL = new THREE.DirectionalLight(0x88aaff, 0.4);
fillL.position.set(-60, 50, -40);
scene.add(fillL);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-30, 25, 90);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color:0x0a0e14, roughness:1, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);
const gridH = new THREE.GridHelper(400, 40, 0x12202c, 0x0b121b);
gridH.position.y = 0.02;
scene.add(gridH);

// ====== PALETA ======
const PALETTE = {
  FRAME:   { c:0x2e3a47, rough:0.62, metal:0.35 },  // placas de bastidor / columna
  FRAME_D: { c:0x1e2731, rough:0.70, metal:0.30 },  // bordes, base
  STEEL_L: { c:0xdde3e8, rough:0.32, metal:0.60 },  // lámina inox clara
  STEEL_M: { c:0xaab4bd, rough:0.38, metal:0.60 },  // lámina inox media
  GASKET:  { c:0x11151b, rough:0.95, metal:0.00 },  // juntas perimetrales
  BAR:     { c:0x4a5866, rough:0.50, metal:0.45 },  // barra de carga / guía
  ROD:     { c:0x646f7a, rough:0.42, metal:0.70 },  // espárragos
  ZINC:    { c:0xc9a94f, rough:0.35, metal:0.75 },  // tuercas / pernos / anclas
  RED:     { c:0xd0342c, rough:0.42, metal:0.35 },  // circuito primario (caliente)
  RED_D:   { c:0x8e241f, rough:0.50, metal:0.35 },
  BLUE:    { c:0x2f6fd0, rough:0.42, metal:0.35 },  // circuito secundario (frío)
  BLUE_D:  { c:0x1f4b93, rough:0.50, metal:0.35 },
  WHITE:   { c:0xe9edf0, rough:0.55, metal:0.10 },  // carátula termómetro
  DARK:    { c:0x0d1117, rough:0.85, metal:0.10 },  // vástagos, barrenos, aros
  ACCENT:  { c:0x00d4aa, rough:0.40, metal:0.30, emis:0x00d4aa, ei:0.45 } // placa de datos
};

// ====== CONSTRUCTOR DE VOXELES (Map => 0 celdas duplicadas garantizado) ======
const grid = new Map();
const vox = (x,y,z,k) => grid.set(x+','+y+','+z, k);
const box = (x0,x1,y0,y1,z0,z1,k) => {
  for (let x=x0; x<=x1; x++)
    for (let y=y0; y<=y1; y++)
      for (let z=z0; z<=z1; z++) vox(x,y,z,k);
};

// ---- Base metálica (pies) + anclas ----
box(-2, 6, 0, 1, 1, 22, 'FRAME_D');            // pie placa fija
box(50, 59, 0, 1, 4, 19, 'FRAME_D');           // pie columna soporte
[[-2,2],[-2,21],[6,2],[6,21]].forEach(([x,z]) => vox(x,2,z,'ZINC'));
[[50,5],[50,18],[59,5],[59,18]].forEach(([x,z]) => vox(x,2,z,'ZINC'));

// ---- Placa fija (bastidor frontal) ----
box(0, 3, 2, 52, 0, 23, 'FRAME');
for (let y=2; y<=52; y++)
  for (let z=0; z<=23; z++)
    if (y===2 || y===52 || z===0 || z===23) vox(0,y,z,'FRAME_D');

// ---- Placa móvil (seguidora) ----
box(45, 48, 8, 50, 0, 23, 'FRAME');
for (let y=8; y<=50; y++)
  for (let z=0; z<=23; z++)
    if (y===8 || y===50 || z===0 || z===23) vox(48,y,z,'FRAME_D');

// ---- Columna de soporte trasera ----
box(51, 55, 2, 52, 8, 15, 'FRAME');
box(51, 55, 53, 53, 8, 15, 'FRAME_D');         // tapa

// ---- Paquete de placas corrugadas (20 láminas, patrón de aletas) ----
// Vistas de canto: 1 voxel de espesor + 1 voxel de separación.
// Perímetro oscuro = junta (gasket); interior con bandas diagonales
// alternadas (espina de pescado) que sugieren la corrugación.
for (let k=0; k<20; k++) {
  const px = 5 + k*2;
  const dir = (k % 2 === 0) ? 1 : -1;
  for (let y=11; y<=49; y++) {
    for (let z=3; z<=20; z++) {
      let key;
      if (y===11 || y===49 || z===3 || z===20) key = 'GASKET';
      else key = (((y + dir*z) % 4 + 4) % 4) < 2 ? 'STEEL_L' : 'STEEL_M';
      vox(px, y, z, key);
    }
  }
  vox(px, 50, 11, 'ROD');                       // pestañas de colgado
  vox(px, 50, 12, 'ROD');
}

// ---- Barra de carga (superior) y barra guía (inferior) ----
box(4, 52, 51, 52, 10, 13, 'BAR');
box(4, 52, 6, 7, 10, 13, 'BAR');

// ---- Colgador y zapata de la placa móvil (envuelven las barras) ----
box(45, 48, 51, 52, 9, 14, 'FRAME');
box(45, 48, 5, 7, 9, 14, 'FRAME');

// ---- Espárragos de apriete (6) con tuercas ----
const rodY = [14, 30, 44], rodZ = [1, 22];
for (const y of rodY) {
  for (const z of rodZ) {
    for (let x=-3; x<=50; x++) vox(x, y, z, 'ROD');
    box(-3, -2, y-1, y+1, z-1, z+1, 'ZINC');   // tuerca frontal
    box(49, 50, y-1, y+1, z-1, z+1, 'ZINC');   // tuerca trasera
  }
}

// ---- 4 bocas bridadas + tubería + termómetros (placa fija, 1 paso) ----
// Caliente: entra arriba-izq, sale abajo-izq. Frío: entra abajo-der,
// sale arriba-der (contraflujo).
const PORTS = [
  { y:42, z:6,  k:'RED',  kd:'RED_D'  },   // primario IN
  { y:16, z:6,  k:'RED',  kd:'RED_D'  },   // primario OUT
  { y:16, z:17, k:'BLUE', kd:'BLUE_D' },   // secundario IN
  { y:42, z:17, k:'BLUE', kd:'BLUE_D' },   // secundario OUT
];
for (const p of PORTS) {
  for (let dy=-4; dy<=4; dy++) {
    for (let dz=-4; dz<=4; dz++) {
      const d = dy*dy + dz*dz, y = p.y+dy, z = p.z+dz;
      if (d > 10.5 && d <= 16.5) vox(0, y, z, p.k);              // aro pintado en placa
      if (d <= 10.5) vox(-1, y, z, d <= 6 ? p.k : p.kd);         // brida de cuello
      if (d <= 5) for (let x=-7; x<=-2; x++) vox(x, y, z, p.k);  // tramo de tubería
      if (d <= 10.5) vox(-8, y, z, d <= 6 ? p.k : p.kd);         // brida extremo
    }
  }
  vox(-8, p.y, p.z, 'DARK');                                     // barreno de la boca
  [[3,0],[-3,0],[0,3],[0,-3]].forEach(([dy,dz]) => vox(-9, p.y+dy, p.z+dz, 'ZINC')); // pernos
  // Termómetro: vástago + carátula
  vox(-5, p.y+3, p.z, 'DARK');
  vox(-5, p.y+4, p.z, 'DARK');
  for (let dy=5; dy<=7; dy++)
    for (let dz=-1; dz<=1; dz++) vox(-5, p.y+dy, p.z+dz, 'WHITE');
  [[5,-1],[5,1],[7,-1],[7,1]].forEach(([dy,dz]) => vox(-5, p.y+dy, p.z+dz, 'DARK'));
  vox(-5, p.y+6, p.z, p.k);                                      // aguja color circuito
}

// ---- Placa de identificación (acento SCADA) ----
box(-1, -1, 26, 29, 10, 13, 'ACCENT');

// ====== INSTANCED MESH POR COLOR ======
const counts = {};
grid.forEach(k => counts[k] = (counts[k] || 0) + 1);

const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const m4 = new THREE.Matrix4();
const meshes = {};
for (const key in counts) {
  const p = PALETTE[key];
  const mat = new THREE.MeshStandardMaterial({ color:p.c, roughness:p.rough, metalness:p.metal });
  if (p.emis) { mat.emissive = new THREE.Color(p.emis); mat.emissiveIntensity = p.ei; }
  const im = new THREE.InstancedMesh(cubeGeo, mat, counts[key]);
  im.castShadow = true;
  im.receiveShadow = true;
  meshes[key] = { im, i:0 };
  scene.add(im);
}
grid.forEach((key, kstr) => {
  const [x,y,z] = kstr.split(',').map(Number);
  m4.makeTranslation(x+0.5, y+0.5, z+0.5);
  const rec = meshes[key];
  rec.im.setMatrixAt(rec.i++, m4);
});
for (const key in meshes) meshes[key].im.instanceMatrix.needsUpdate = true;

// Estadísticas para auditoría (inocuo en navegador)
window.__VOXEL_STATS = { total: grid.size, counts };
window.__VOXEL_DUMP = (() => {
  const a = [];
  grid.forEach((k, s) => { const [x,y,z] = s.split(',').map(Number); a.push([x,y,z,k]); });
  return a;
})();

// ====== PARTÍCULAS DE FLUJO (Groups separados, fuera del InstancedMesh) ======
const flowGroup = new THREE.Group();
scene.add(flowGroup);

const pGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
const hotMat  = new THREE.MeshStandardMaterial({ color:0xff6644, emissive:0xff2211, emissiveIntensity:1.6, roughness:0.4, metalness:0, transparent:true, opacity:0.95 });
const coldMat = new THREE.MeshStandardMaterial({ color:0x55aaff, emissive:0x1166ff, emissiveIntensity:1.6, roughness:0.4, metalness:0, transparent:true, opacity:0.95 });

const PATHS = [
  { y:42.5, z:6.5,  dirIn:true,  mat:hotMat  },  // primario entra
  { y:16.5, z:6.5,  dirIn:false, mat:hotMat  },  // primario sale
  { y:16.5, z:17.5, dirIn:true,  mat:coldMat },  // secundario entra
  { y:42.5, z:17.5, dirIn:false, mat:coldMat },  // secundario sale
];
const X0 = -15.5, X1 = -0.5, LEN = X1 - X0;
const particles = [];
for (const path of PATHS) {
  for (let i=0; i<20; i++) {
    const m = new THREE.Mesh(pGeo, path.mat);
    const a = Math.random() * Math.PI * 2, r = Math.random() * 1.1;
    m.userData = { off:(i/20)*LEN + Math.random()*0.4, path, jy:Math.sin(a)*r, jz:Math.cos(a)*r };
    flowGroup.add(m);
    particles.push(m);
  }
}
function updateFlow(t) {
  for (const m of particles) {
    const u = m.userData, s = (t*7 + u.off) % LEN;
    const x = u.path.dirIn ? (X0 + s) : (X1 - s);
    m.position.set(x, u.path.y + u.jy, u.path.z + u.jz);
  }
}

// ====== CONTROLES / ESTADO ======
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(25, 24, 12);
controls.minDistance = 25;
controls.maxDistance = 300;
controls.maxPolarAngle = Math.PI * 0.52;

const state = { flow:true, rot:true };
const bFlow = document.getElementById('bFlow');
const bRot  = document.getElementById('bRot');
function setBtn(b, on) {
  b.classList.toggle('on', on);
  b.classList.toggle('off', !on);
  b.textContent = on ? 'ON' : 'OFF';
}
bFlow.addEventListener('click', () => {
  state.flow = !state.flow;
  setBtn(bFlow, state.flow);
  flowGroup.visible = state.flow;
});
bRot.addEventListener('click', () => {
  state.rot = !state.rot;
  setBtn(bRot, state.rot);
  controls.autoRotate = state.rot;
});
setBtn(bFlow, true);
setBtn(bRot, true);

// ====== LOOP ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  updateFlow(t);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
