<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAJA VAV (TERMINAL) · 1.20 × 0.36 × 0.44 m · Realistic</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter:blur(6px); }

  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.lo  { color:#00ff66; border-color:#00ff66; background:transparent; box-shadow:0 0 8px #00ff6633; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
<script>
// Inyeccion dinamica de importmap: String.fromCharCode(64) evita el mangling de '@' (package@version) por Cloudflare.
(function(){
  var AT = String.fromCharCode(64);
  var tag = document.createElement('script');
  tag.type = 'importmap';
  tag.textContent = JSON.stringify({ imports: {
    "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three" + AT + "0.160.0/examples/jsm/"
  }});
  document.head.appendChild(tag);
})();
</script>
</head>
<body>
<div id="info">
  <b>CAJA VAV (TERMINAL)</b><br>
  <span>1.20 × 0.36 × 0.44 m · Realistic PBR · 1 unidad = 1 m</span>
</div>
<div id="legend">
  <div><i style="background:#66ccff"></i> Aire primario</div>
  <div><i style="background:#7fd94f"></i> Aire suministro</div>

</div>

  <div class="ph">CONTROL DE EQUIPO</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 unidad = 1 m. Spec dimensional: voxel/vav-box-voxel.html (64 x 22 x 22).
// El voxel no declara metros -> se adopta 1 voxel = 0.02 m (mismo hermano FCU): 1.28 x 0.44 x 0.44 m.
// Se construye como CAJA VAV rectangular real ~1.20 (X, largo) x 0.36 (Y, alto) x 0.44 (Z, fondo).
// Tren de aire (-X -> +X): COLLARIN DE ENTRADA redondo + SONDA DE FLUJO -> COMPUERTA (mariposa,
// UNICA parte movil, con ACTUADOR externo) -> VENTILADOR (caja fan-powered, del voxel) ->
// SERPENTIN DE RECALENTAMIENTO agua caliente -> DESCARGA rect -> DUCTO -> DIFUSOR de plafon.
// Controlador DDC en el gabinete, cableado al actuador. Suspendida de plafon.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5.5, 30);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 200);
camera.position.set(1.7, 2.0, 1.75);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // sombras horneadas: un solo horneado tras construir
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 0.9;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0.02, 1.30, 0.02);
// Ground clamp (regla de la casa): ni el target ni la camara bajan del piso
controls.addEventListener('change', () => {
  if (controls.target.y < 0) controls.target.y = 0;
  if (camera.position.y < 0.25) camera.position.y = 0.25;
});

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.6, 4.6, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1.4; sun.shadow.camera.right = 1.4;
sun.shadow.camera.top = 1.4; sun.shadow.camera.bottom = -1.4;
sun.shadow.camera.near = 1.5; sun.shadow.camera.far = 10;
sun.shadow.bias = -0.0004;
sun.target.position.set(0, 1.28, 0);
scene.add(sun); scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-3.2, 2.4, -2.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-1.8, 1.8, 3.2);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x123f35, 0x0c1d1a);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ====== TEXTURAS PROCEDURALES (CanvasTexture) ======
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function dataTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// Chapa GALVANIZADA clara con lentejuela (spangle) y juntas suaves
const galvTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#cfd3d8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++){
    const v = 190 + Math.floor(Math.random() * 55);
    g.fillStyle = `rgba(${v},${v+3},${v+8},0.16)`;
    g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 7, 2 + Math.random() * 7);
  }
  for (let i = 0; i < 900; i++){
    g.fillStyle = 'rgba(150,156,164,0.12)';
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1 + Math.random() * 2);
  }
  g.strokeStyle = 'rgba(150,156,164,0.55)'; g.lineWidth = 2;
  for (let x = 0; x <= w; x += 170){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
});
galvTex.wrapS = galvTex.wrapT = THREE.RepeatWrapping;

// Variacion de rugosidad de la chapa (mapa lineal; escalar 1.0 * mapa ~0.55 cae en la banda percibida)
const galvRoughTex = dataTex(256, 256, (g) => {
  g.fillStyle = '#8f8f8f'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2400; i++){
    const v = 120 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
});
galvRoughTex.wrapS = galvRoughTex.wrapT = THREE.RepeatWrapping;
galvRoughTex.repeat.set(2, 1);

// Placa de datos
const nameplateTex = canvasTex(512, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#d8dade'); grad.addColorStop(0.5, '#b8bcc2'); grad.addColorStop(1, '#c8ccd2');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3a3f46'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = '#22262c';
  g.font = 'bold 30px monospace'; g.textAlign = 'center';
  g.fillText('CAJA VAV TERMINAL', w/2, 56);
  g.font = '22px monospace';
  g.fillText('SIMPLE DUCTO · RECALENT.', w/2, 90);
  g.font = '20px monospace'; g.textAlign = 'left';
  g.fillText('MODELO      VAV-08-RH', 40, 134);
  g.fillText('ENTRADA     290 mm DIA', 40, 164);
  g.fillText('CAUDAL      120-560 m3/h', 40, 194);
  g.fillText('RECALENT.   AGUA 60/50 C', 40, 224);
  for (const [bx, by] of [[26, 26], [w-26, 26], [26, h-26], [w-26, h-26]]){
    g.beginPath(); g.arc(bx, by, 7, 0, Math.PI*2); g.fillStyle = '#787c82'; g.fill();
  }
});

// ====== PALETA PBR (metalness 0 = pintado/chapa clara · metalness 1 = metal desnudo) ======
// Leccion documentada (torre/bomba/AHU/FCU): gris medio + metalness 1 lee NEGRO en este entorno.
// Chapa galvanizada clara -> metalness 0. Metal que debe leer metal (valvulas, cobre, bridas,
// pernos, alabes) -> metalness 1 con tonos claros/oscuros deliberados.
// Agua CALIENTE de recalentamiento -> bandas rojas/naranjas coherentes (SI es caliente).
const M = {
  GALV:    new THREE.MeshStandardMaterial({ map:galvTex, roughness:1.0, metalness:0, roughnessMap:galvRoughTex }),
  GALV_D:  new THREE.MeshStandardMaterial({ color:0xa6acb3, roughness:0.6, metalness:0 }),
  FRAME:   new THREE.MeshStandardMaterial({ color:0x33353b, roughness:0.6, metalness:0 }),
  DARK:    new THREE.MeshStandardMaterial({ color:0x22252a, roughness:0.7, metalness:0 }),
  DUCT:    new THREE.MeshStandardMaterial({ color:0xb9bfc6, roughness:0.55, metalness:0, side:THREE.DoubleSide }),
  COIL_T:  new THREE.MeshStandardMaterial({ color:0x2f8f86, roughness:0.5, metalness:0.1 }),
  COIL_T2: new THREE.MeshStandardMaterial({ color:0x3fae9f, roughness:0.5, metalness:0.1 }),
  COPPER:  new THREE.MeshStandardMaterial({ color:0xb87333, roughness:0.35, metalness:1, emissive:0x000000, emissiveIntensity:0 }),
  PIPE:    new THREE.MeshStandardMaterial({ color:0xd0d5db, roughness:0.5, metalness:0 }),
  HOTBAND: new THREE.MeshStandardMaterial({ color:0xb0342a, roughness:0.5, metalness:0 }),
  VALVE:   new THREE.MeshStandardMaterial({ color:0x40464e, roughness:0.45, metalness:0.6 }),
  FLANGE:  new THREE.MeshStandardMaterial({ color:0x8a949c, roughness:0.35, metalness:1 }),
  BOLT:    new THREE.MeshStandardMaterial({ color:0x33363c, roughness:0.4, metalness:1 }),
  MOTOR:   new THREE.MeshStandardMaterial({ color:0x1a3388, roughness:0.5, metalness:0 }),
  MOTOR_D: new THREE.MeshStandardMaterial({ color:0x112266, roughness:0.55, metalness:0 }),
  HOUSING: new THREE.MeshStandardMaterial({ color:0x6a6d75, roughness:0.5, metalness:0.3, side:THREE.DoubleSide }),
  HOUSING_D:new THREE.MeshStandardMaterial({ color:0x4a4d55, roughness:0.55, metalness:0.3, side:THREE.DoubleSide }),
  STEEL:   new THREE.MeshStandardMaterial({ color:0x50555e, roughness:0.42, metalness:0.6 }),
  HUB:     new THREE.MeshStandardMaterial({ color:0x55555c, roughness:0.45, metalness:0.4 }),
  BLADE:   new THREE.MeshStandardMaterial({ color:0xaeb4bb, roughness:0.32, metalness:1 }),  // paleta de compuerta (acero)
  GRILLE:  new THREE.MeshStandardMaterial({ color:0xe2e6ea, roughness:0.5, metalness:0 }),
  ACT:     new THREE.MeshStandardMaterial({ color:0xe2e2df, roughness:0.55, metalness:0 }),  // actuador (plastico claro)
  ACT_D:   new THREE.MeshStandardMaterial({ color:0x3a3d42, roughness:0.5, metalness:0.2 }),
  ROD:     new THREE.MeshStandardMaterial({ color:0x8a929c, roughness:0.4, metalness:1 })
};
// Rodete del ventilador fan-powered (animado: material propio, emisivo modulado por flujo)
const wheelMat = new THREE.MeshStandardMaterial({ color:0x3a7bd5, roughness:0.4, metalness:0.5, emissive:0x1f5fc0, emissiveIntensity:0.12 });

// ====== HELPERS DE GEOMETRIA PARAMETRICA ======
const staticG = new THREE.Group();       // todo lo estatico (sombras horneadas)
scene.add(staticG);
const accessGroup = new THREE.Group();   // panel de acceso removible (toggle CORTE): frente +Z
staticG.add(accessGroup);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = staticG){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = staticG){
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function cylX(r, len, mat, x, y, z, seg = 16, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.z = Math.PI / 2;
  return m;
}
function cylY(r, len, mat, x, y, z, seg = 16, parent = staticG){
  return mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
}
// Tuberia con codos suavizados: polilinea -> CurvePath con filetes bezier
function makePipe(points, r, mat, bend = 0.05, parent = staticG, seg = 10){
  const path = new THREE.CurvePath();
  const P = points.map(p => new THREE.Vector3(...p));
  let prev = P[0];
  for (let i = 1; i < P.length - 1; i++){
    const a = P[i], b = P[i+1];
    const dIn = a.clone().sub(prev).normalize();
    const dOut = b.clone().sub(a).normalize();
    const tIn = a.clone().sub(dIn.clone().multiplyScalar(bend));
    const tOut = a.clone().add(dOut.clone().multiplyScalar(bend));
    path.add(new THREE.LineCurve3(prev, tIn));
    path.add(new THREE.QuadraticBezierCurve3(tIn, a, tOut));
    prev = tOut;
  }
  path.add(new THREE.LineCurve3(prev, P[P.length - 1]));
  const len = path.getLength();
  const g = new THREE.TubeGeometry(path, Math.max(16, Math.round(len * 18)), r, seg);
  return mesh(g, mat, 0, 0, 0, parent);
}

// Pernos instanciados globales (una sola draw call)
const boltMatrices = [];
const _bm = new THREE.Matrix4(), _bs = new THREE.Vector3(1,1,1);
const AXQ = {
  x: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI/2)),
  y: new THREE.Quaternion(),
  z: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0))
};
function boltRing(cx, cy, cz, axis, radius, n){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + Math.PI / n;
    const u = Math.cos(a) * radius, v = Math.sin(a) * radius;
    let px = cx, py = cy, pz = cz;
    if (axis === 'x'){ py += u; pz += v; }
    else if (axis === 'y'){ px += u; pz += v; }
    else { px += u; py += v; }
    _bm.compose(new THREE.Vector3(px, py, pz), AXQ[axis], _bs);
    boltMatrices.push(_bm.clone());
  }
}
// Brida (disco delgado) a ras + anillo de esparragos (leccion torre/bomba/AHU/FCU: brida flush)
function flangeY(R, thick, x, y, z, nBolts, boltR){
  cylY(R, thick, M.FLANGE, x, y, z, 18);
  if (nBolts) boltRing(x, y + thick/2 + 0.005, z, 'y', boltR, nBolts);
}
// InstancedMesh util
function makeIM(geo, mat, mats, parent = staticG, cast = true){
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = cast; im.receiveShadow = true;
  parent.add(im);
  return im;
}
const _q0 = new THREE.Quaternion();
function tMat(x, y, z, q = _q0, s = _bs){
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), q, s);
}

// ==================================================================
// COTAS GLOBALES (metros) — gabinete rectangular VAV
// ==================================================================
const HX = 0.60, HZ = 0.22;                // medio largo (X) / medio fondo (Z)
const YB = 1.15, HT = 0.36, YT = YB + HT;  // base (suspendida) / alto / techo = 1.51
const CY = YB + HT/2;                       // centro vertical = 1.33
const PT = 0.012;                           // espesor de chapa
const ZB = -HZ, ZF = HZ;                    // trasera (-Z) / frente removible (+Z)
const RIN = 0.145;                          // radio del collarin de entrada
// Compuerta (mariposa) — UNICA parte movil
const DAMP_X = -HX + 0.10;                  // plano de la compuerta (dentro del collarin)
// Ventilador fan-powered (del voxel: modulo con ventilador)
const WX = -0.12, WY = YB + 0.145, WZ = -0.02, WR = 0.10;
// Serpentin de recalentamiento (cerca de la descarga +X)
const COIL_X0 = 0.22, COIL_X1 = 0.50, COIL_XC = (COIL_X0 + COIL_X1)/2;
const COIL_Y0 = YB + 0.05, COIL_Y1 = YT - 0.05, COIL_YC = (COIL_Y0 + COIL_Y1)/2;
const COIL_ZC = 0.0, COIL_ZD = 0.30;        // centro y fondo (Z) del serpentin

// ==================================================================
// GABINETE FIJO (chapa galvanizada): techo, piso, trasera, tapas de extremo con
// entrada redonda (-X, ShapeGeometry con agujero) y descarga rect (+X)
// ==================================================================
{
  box(HX*2, PT, HZ*2, M.GALV, 0, YT, 0);                       // techo
  box(HX*2, PT, HZ*2, M.GALV, 0, YB, 0);                       // piso
  box(HX*2, HT, PT, M.GALV, 0, CY, ZB);                        // trasera (-Z)

  // TAPA -X con agujero de entrada redondo
  const capIn = new THREE.Shape();
  capIn.moveTo(-HZ, -HT/2); capIn.lineTo(HZ, -HT/2); capIn.lineTo(HZ, HT/2); capIn.lineTo(-HZ, HT/2); capIn.lineTo(-HZ, -HT/2);
  const holeIn = new THREE.Path(); holeIn.absarc(0, 0, RIN + 0.004, 0, Math.PI*2, true);
  capIn.holes.push(holeIn);
  const capInM = mesh(new THREE.ShapeGeometry(capIn), M.GALV_D, -HX, CY, 0);
  capInM.rotation.y = -Math.PI / 2;
  capInM.material = new THREE.MeshStandardMaterial({ map:galvTex, roughness:1.0, metalness:0, side:THREE.DoubleSide });

  // placa de datos en la tapa -X (esquina)
  const np = mesh(new THREE.PlaneGeometry(0.20, 0.10),
    new THREE.MeshStandardMaterial({ map:nameplateTex, roughness:0.4, metalness:0 }),
    -HX - 0.007, CY - 0.12, -0.11);
  np.rotation.y = -Math.PI / 2;
  np.castShadow = false;

  // TAPA +X con agujero de descarga rectangular
  const capOut = new THREE.Shape();
  capOut.moveTo(-HZ, -HT/2); capOut.lineTo(HZ, -HT/2); capOut.lineTo(HZ, HT/2); capOut.lineTo(-HZ, HT/2); capOut.lineTo(-HZ, -HT/2);
  const dW = 0.13, dH = 0.13;                                  // medio hueco de descarga (Z, Y)
  const holeOut = new THREE.Path();
  holeOut.moveTo(-dW, -dH); holeOut.lineTo(-dW, dH); holeOut.lineTo(dW, dH); holeOut.lineTo(dW, -dH); holeOut.lineTo(-dW, -dH);
  capOut.holes.push(holeOut);
  const capOutM = mesh(new THREE.ShapeGeometry(capOut), M.GALV_D, HX, CY, 0);
  capOutM.rotation.y = Math.PI / 2;
  capOutM.material = new THREE.MeshStandardMaterial({ map:galvTex, roughness:1.0, metalness:0, side:THREE.DoubleSide });

  // costillas de refuerzo del techo (instanciadas)
  const ribMats = [];
  for (const rx of [-0.36, -0.12, 0.12, 0.36]) ribMats.push(tMat(rx, YT + 0.012, 0));
  makeIM(new THREE.BoxGeometry(0.02, 0.02, HZ*2 - 0.04), M.GALV_D, ribMats);
}

// ==================================================================
// MARCO ESTRUCTURAL INTERNO (postes de esquina + largueros) — instanciado
// ==================================================================
{

// ====== DISPLAY DEL DDC (canvas; se redibuja solo en applyState) ======
const FLOW_PCT = ['0%', '50%', '100%'];
function drawDDC(flow, heat){
  const g = ddcTex._ctx;
  const on = flow > 0;
  g.fillStyle = '#0b0f14'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#00d4aa66'; g.lineWidth = 3; g.strokeRect(3, 3, 250, 122);
  g.textAlign = 'left';
  g.fillStyle = '#5f7a86';
  g.font = '600 18px "JetBrains Mono", ui-monospace, monospace';
  g.fillText('FLUJO', 18, 34);
  g.fillStyle = on ? '#7fe8ff' : '#54626c';
  g.font = '700 40px "JetBrains Mono", ui-monospace, monospace';
  g.fillText(FLOW_PCT[flow], 18, 78);
  g.font = '600 18px "JetBrains Mono", ui-monospace, monospace';
  g.fillStyle = heat ? '#ff7a4a' : '#54626c';
  g.fillText('RECALENT ' + (heat ? 'ON' : 'OFF'), 18, 108);
  ddcTex.needsUpdate = true;
}

// ====== ESTADO / CONTROL DE EQUIPO ======
const COLOR_ON = 0x00ff66, COLOR_OFF = 0xff2233;
const state = { flow: 2, heat: false, corte: true, rot: true };   // flow: 0=CERRADA 1=50% 2=ABIERTA
const FLOW_FRAC = [0, 0.5, 1];                                     // fraccion de apertura -> angulo/velocidad
let damperTarget = FLOW_FRAC[state.flow] * (Math.PI / 2);         // 0=cerrada (bloquea), PI/2=abierta

function applyState(){
  // Solo emisivos/visibilidad/angulo objetivo: NO se rehornean sombras aqui
  const frac = FLOW_FRAC[state.flow];
  const on = frac > 0;
  damperTarget = frac * (Math.PI / 2);
  // LED de flujo
  ledFlow.mat.color.setHex(on ? COLOR_ON : COLOR_OFF);
  ledFlow.mat.emissive.setHex(on ? COLOR_ON : COLOR_OFF);
  ledFlow.mat.emissiveIntensity = on ? 1.7 : 1.3;
  ledFlow.light.color.setHex(on ? COLOR_ON : COLOR_OFF);
  ledFlow.light.intensity = on ? 0.55 : 0.32;
  // velocidad emisiva del rodete por flujo
  wheelMat.emissiveIntensity = frac === 0 ? 0.12 : (frac < 1 ? 0.4 : 0.65);
  // RECALENTAMIENTO: glow del serpentin (cobre + aletas)
  for (const im of coilCopperIMs){
    im.material.emissive.setHex(state.heat ? 0xff5a20 : 0x000000);
    im.material.emissiveIntensity = state.heat ? 0.6 : 0;
    im.material.color.setHex(state.heat ? 0xff8c3a : 0xb87333);
  }
  coilFinIMs[0].material.emissive.setHex(state.heat ? 0x6a1c00 : 0x000000);
  coilFinIMs[0].material.emissiveIntensity = state.heat ? 0.35 : 0;
  coilFinIMs[1].material.emissive.setHex(state.heat ? 0x7a2400 : 0x000000);
  coilFinIMs[1].material.emissiveIntensity = state.heat ? 0.35 : 0;
  // CORTE: oculta el panel de acceso frontal
  accessGroup.visible = !state.corte;
  drawDDC(state.flow, state.heat);
}

// ====== UI ======
const FLOW_LBL = ['CERRADA', '50%', 'ABIERTA'];
const bFlow = document.getElementById('bFlow');
bFlow.addEventListener('click', () => {
  state.flow = (state.flow + 1) % 3;
  bFlow.textContent = FLOW_LBL[state.flow];
  bFlow.className = state.flow === 0 ? 'off' : (state.flow === 1 ? 'lo' : 'on');
  applyState();
});
const bHeat = document.getElementById('bHeat');
bHeat.addEventListener('click', () => {
  state.heat = !state.heat;
  bHeat.className = state.heat ? 'on' : 'off';
  bHeat.textContent = state.heat ? 'ON' : 'OFF';
  applyState();
});
const bCorte = document.getElementById('bCorte');
bCorte.addEventListener('click', () => {
  state.corte = !state.corte;
  bCorte.className = state.corte ? 'on' : 'off';
  bCorte.textContent = state.corte ? 'ON' : 'OFF';
  applyState();
});
const bRot = document.getElementById('bRot');
bRot.addEventListener('click', () => {
  state.rot = !state.rot;
  bRot.className = state.rot ? 'on' : 'off';
  bRot.textContent = state.rot ? 'ON' : 'OFF';
});

applyState();                                   // panel visible (corte=true) antes del horneado
renderer.shadowMap.needsUpdate = true;          // horneado unico tras construir la escena

// ====== LOOP DE ANIMACION ======
let damperAngle = damperTarget;                 // angulo actual de la compuerta
let fanSpd = 0;                                 // velocidad angular actual del rodete (inercia)
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Modulacion de la compuerta (lerp visible hacia el angulo objetivo)
  damperAngle += (damperTarget - damperAngle) * Math.min(1, dt * 3.2);
  damperGroup.rotation.y = damperAngle;

  // Ventilador fan-powered: velocidad ligada al flujo, inercia asimetrica (arranque rapido / coast lento)
  const target = FLOW_FRAC[state.flow] * 13;
  const kk = target > fanSpd ? 1.6 : 0.5;
  fanSpd += (target - fanSpd) * Math.min(1, dt * kk);
  if (Math.abs(fanSpd - target) < 0.01) fanSpd = target;
  wheels[0].rotation.x -= dt * fanSpd;

  controls.autoRotate = state.rot;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
