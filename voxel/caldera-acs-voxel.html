<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Caldera Pirotubular + Tanque ACS · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:230px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:54px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
</head>
<body>
<div id="info">
  <b>CALDERA DE TUBOS DE HUMO + TANQUE ACS</b><br>
  <span>Voxel Art · Cut-away · 1 voxel = 5 cm</span>
</div>
<div id="legend">
  <div><i style="background:#ffc832"></i> Gas</div>
  <div><i style="background:#ff6a33"></i> Agua caliente</div>
  <div><i style="background:#ffb066"></i> Recirculación</div>
  <div><i style="background:#9aa0a8"></i> Gases de combustión</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>QUEMADOR</label><button id="bQ" class="off">OFF</button></div>
  <div class="row"><label>BOMBA RECIRC</label><button id="bP" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================
// SCALE: 1 voxel = 0.05 m  (alta densidad micro-voxel)
// Caldera: 50 vox = 2.50 m largo · Ø26 vox = 1.30 m (~1.5 m alto con silletas)
// Tanque ACS: Ø20 vox = 1.00 m · 40 vox = 2.00 m alto
// ============================================================

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 200, 700);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1400);
camera.position.set(-72, 56, 122);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(28, 22, 30);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(120, 180, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-140; sc.right=140; sc.top=140; sc.bottom=-140; sc.near=1; sc.far=600;
sun.shadow.bias = -0.0004;
sun.target.position.set(28, 0, 30);
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-80, 70, -60);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(28, 40, -120);
scene.add(rim);

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200,1200),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.position.set(26, 0, 30);
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(1200, 200, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.set(26, 0.02, 30);
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}

const COL = {
  BODY:   0x24507c,  // shell caldera azul oscuro (translúcido)
  BODY_D: 0x18365a,  // cordones de soldadura (translúcido)
  HOGAR:  0x3a3f4a,  // tubo hogar (translúcido, deja ver la flama)
  FRONT:  0x141419,  // tapa frontal negra
  DARK:   0x2a2a2e,
  METAL:  0x8a8a92,
  METAL_D:0x55555c,
  TUBE:   0x707078,  // tubos de humo
  SKID:   0xa8a8ac,
  FRAME:  0x3a3a3e,
  GRILLE: 0x1a1a1e,
  GAS:    0xdfaf28,  // tren de gas amarillo
  HOTP:   0xb03a16,  // tubería agua caliente
  RECP:   0xcf7a3a,  // tubería recirculación
  TANK:   0xd9d3c4,  // aislamiento del tanque
  BAND:   0xd96a26,  // bandas de color del tanque
  BRASS:  0xb8952e,  // válvula de seguridad, T&P
  CHIM:   0x565660,  // chimenea
  RED:    0xa32424,  // volantes de válvula
  WHITE:  0xe8e4da,  // carátulas de instrumentos
};

// ====== DIMENSIONES ======
const BX0=6, BX1=56, CY=16, CZ=20, R=13;   // caldera
const HY=CY-5, HR=4;                        // hogar
const TX=24, TZ=52, TR=10;                  // tanque ACS
const SX=59, SZ=CZ;                         // chimenea

// ====== LOSA / HOUSEKEEPING PAD ======
for (let x=-14; x<=66; x++)
  for (let z=-4; z<=66; z++) {
    vox(x, 0, z, COL.SKID);
    if (x===-14 || x===66 || z===-4 || z===66) vox(x, 1, z, COL.DARK);
  }

// ====== SILLETAS (soportes de la caldera) ======
for (const sx of [13, 43]) {
  for (let x=sx; x<=sx+4; x++)
    for (let dz=-10; dz<=10; dz++) {
      const z = CZ + dz;
      const yTop = Math.ceil(CY - Math.sqrt(Math.max(R*R - dz*dz, 0))) - 1;
      for (let y=1; y<=yTop; y++) vox(x, y, z, COL.FRAME);
    }
  for (let x=sx-1; x<=sx+5; x++)
    for (let dz=-11; dz<=11; dz++)
      vox(x, 1, CZ+dz, COL.DARK);
}

// ====== CUERPO CILÍNDRICO (shell translúcido con soldaduras) ======
for (let x=BX0; x<=BX1; x++)
  for (let y=CY-R; y<=CY+R; y++)
    for (let z=CZ-R; z<=CZ+R; z++) {
      const dy=y-CY, dz=z-CZ, d2=dy*dy+dz*dz;
      if (d2 <= R*R && d2 > (R-1)*(R-1)) {
        const weld = ((x-BX0) % 12 === 0) || x===BX1;
        vox(x, y, z, weld ? COL.BODY_D : COL.BODY);
      }
    }
// Espejos (tube sheets) frontal y trasero
for (const sxp of [BX0, BX1])
  for (let y=CY-R; y<=CY+R; y++)
    for (let z=CZ-R; z<=CZ+R; z++) {
      const dy=y-CY, dz=z-CZ;
      if (dy*dy+dz*dz <= (R-1)*(R-1)) vox(sxp, y, z, COL.DARK);
    }

// ====== HOGAR (tubo central de fuego, translúcido) ======
for (let x=BX0+1; x<BX1; x++)
  for (let y=HY-HR; y<=HY+HR; y++)
    for (let z=CZ-HR; z<=CZ+HR; z++) {
      const dy=y-HY, dz=z-CZ, d2=dy*dy+dz*dz;
      if (d2 <= HR*HR && d2 > (HR-1)*(HR-1)) vox(x, y, z, COL.HOGAR);
    }

// ====== HAZ DE TUBOS DE HUMO ======
const tubeOff = [];
for (let dy=-8; dy<=10; dy+=3)
  for (let dz=-9; dz<=9; dz+=3) {
    if (dy*dy + dz*dz > (R-3)*(R-3)) continue;
    const hy = dy + 5;                        // relativo al hogar
    if (hy*hy + dz*dz <= 34) continue;        // fuera del hogar
    tubeOff.push([dy,dz]);
  }
tubeOff.forEach(([dy,dz]) => {
  for (let x=BX0+1; x<BX1; x++) vox(x, CY+dy, CZ+dz, COL.TUBE);
});

// ====== TAPA FRONTAL ABISAGRADA (bombeada) ======
[[5,R],[4,R],[3,R-3],[2,R-6]].forEach(([xp,rr]) => {
  for (let y=CY-rr; y<=CY+rr; y++)
    for (let z=CZ-rr; z<=CZ+rr; z++) {
      const dy=y-CY, dz=z-CZ, d2=dy*dy+dz*dz;
      if (d2 <= rr*rr) vox(xp, y, z, d2 > (rr-1)*(rr-1) ? COL.DARK : COL.FRONT);
    }
});
// Pernos del brida (studs)
for (let k=0; k<14; k++) {
  const a = k/14 * Math.PI*2;
  vox(5, CY + Math.round(Math.cos(a)*(R+1)), CZ + Math.round(Math.sin(a)*(R+1)), COL.METAL);
}
// Bisagras (lado +z) con barra vertical
for (const hy of [CY-7, CY+6])
  for (let x=3; x<=6; x++)
    for (let y=hy; y<=hy+1; y++)
      for (let z=CZ+R; z<=CZ+R+2; z++)
        vox(x, y, z, COL.METAL_D);
for (let y=CY-7; y<=CY+7; y++) vox(4, y, CZ+R+2, COL.METAL_D);
// Grapas de cierre (lado -z)
for (const cyc of [CY-6, CY, CY+6]) { vox(3, cyc, CZ-R-1, COL.METAL); vox(4, cyc, CZ-R-1, COL.METAL); }

// ====== MIRILLA (anillo, el vidrio es mesh aparte) ======
const MY = 21;
for (let dy=-2; dy<=2; dy++)
  for (let dz=-2; dz<=2; dz++) {
    const d2 = dy*dy + dz*dz;
    if (d2 >= 3 && d2 <= 5) vox(1, MY+dy, CZ+dz, COL.DARK);
  }

// ====== QUEMADOR FRONTAL ======
// Placa de montaje sobre la tapa
for (let y=HY-5; y<=HY+5; y++)
  for (let z=CZ-5; z<=CZ+5; z++) {
    const dy=y-HY, dz=z-CZ;
    if (dy*dy+dz*dz <= 25) vox(1, y, z, COL.DARK);
  }
// Cuerpo cilíndrico del quemador
for (let x=-5; x<=0; x++)
  for (let y=HY-4; y<=HY+4; y++)
    for (let z=CZ-4; z<=CZ+4; z++) {
      const dy=y-HY, dz=z-CZ, d2=dy*dy+dz*dz;
      if (d2 <= 16) vox(x, y, z, d2 > 9 ? COL.METAL : COL.DARK);
    }
// Nariz
for (let y=HY-2; y<=HY+2; y++)
  for (let z=CZ-2; z<=CZ+2; z++) {
    const dy=y-HY, dz=z-CZ, d2=dy*dy+dz*dz;
    if (d2 <= 6) vox(-6, y, z, d2 <= 1 ? COL.DARK : COL.METAL_D);
  }
// Caja del soplador (arriba)
for (let x=-4; x<=-1; x++)
  for (let y=16; y<=21; y++)
    for (let z=16; z<=24; z++)
      vox(x, y, z, COL.METAL_D);
// Anillo de la toma de aire (el ventilador es grupo animado)
for (let x=-5; x<=1; x++)
  for (let y=14; y<=22; y++) {
    const dx=x+2, dy=y-18, d2=dx*dx+dy*dy;
    if (d2 >= 4 && d2 <= 9) vox(x, y, 15, COL.DARK);
  }
// Caja de conexiones
for (let x=-3; x<=-2; x++)
  for (let y=9; y<=12; y++)
    vox(x, y, 25, COL.DARK);

// ====== TREN DE GAS (amarillo) ======
function pipeRun(a, b, color) {
  const dx=Math.sign(b[0]-a[0]), dy=Math.sign(b[1]-a[1]), dz=Math.sign(b[2]-a[2]);
  const len = Math.max(Math.abs(b[0]-a[0]), Math.abs(b[1]-a[1]), Math.abs(b[2]-a[2]));
  for (let i=0; i<=len; i++)
    vox(a[0]+dx*i, a[1]+dy*i, a[2]+dz*i, color);
}
pipeRun([-3,2,-2],[-3,2,14], COL.GAS);        // línea horizontal
pipeRun([-3,3,14],[-3,11,14], COL.GAS);       // riser
vox(-3,11,15, COL.GAS);                        // stub al quemador
vox(-3,1,-1, COL.FRAME); vox(-3,1,8, COL.FRAME); // soportes
// Válvula manual con volante
vox(-3,3,0, COL.DARK); vox(-3,4,0, COL.DARK);
vox(-4,4,0, COL.RED); vox(-2,4,0, COL.RED); vox(-3,4,-1, COL.RED); vox(-3,4,1, COL.RED);
// Regulador
for (let x=-4; x<=-2; x++)
  for (let y=1; y<=4; y++)
    for (let z=4; z<=6; z++) {
      if (x===-3 && y===2) continue;   // no duplicar la tubería
      vox(x, y, z, COL.DARK);
    }
vox(-3,5,5, COL.BRASS);
// Doble válvula solenoide
for (const sz of [9, 12]) {
  vox(-3,3,sz, COL.DARK); vox(-3,4,sz, COL.DARK); vox(-3,5,sz, COL.GAS);
}

// ====== CAJA DE HUMOS TRASERA + CHIMENEA ======
for (let x=57; x<=63; x++)
  for (let y=3; y<=31; y++)
    for (let z=12; z<=28; z++) {
      const isWall = (x===63 || y===3 || y===31 || z===12 || z===28);
      if (!isWall) continue;
      if (y===31) {
        const dx=x-SX, dz=z-SZ;
        if (dx*dx+dz*dz <= 9) continue;        // hueco para la chimenea
      }
      let c = COL.METAL_D;
      if (x===63 && y>=8 && y<=16 && z>=16 && z<=24) c = COL.DARK;  // puerta de registro
      vox(x, y, z, c);
    }
vox(64,12,20, COL.METAL);                       // manija del registro
// Collar de la chimenea
for (let x=SX-4; x<=SX+4; x++)
  for (let z=SZ-4; z<=SZ+4; z++) {
    const dx=x-SX, dz=z-SZ, d2=dx*dx+dz*dz;
    if (d2 > 9 && d2 <= 14) vox(x, 32, z, COL.DARK);
  }
// Fuste vertical
for (let y=31; y<=70; y++)
  for (let x=SX-3; x<=SX+3; x++)
    for (let z=SZ-3; z<=SZ+3; z++) {
      const dx=x-SX, dz=z-SZ, d2=dx*dx+dz*dz;
      if (d2 > 4 && d2 <= 9) {
        let c = (y % 10 === 1) ? COL.METAL_D : COL.CHIM;
        if (y===70) c = COL.DARK;
        vox(x, y, z, c);
      }
    }
// Sombrerete
for (const [px,pz] of [[SX-2,SZ-2],[SX+2,SZ-2],[SX-2,SZ+2],[SX+2,SZ+2]])
  for (let y=71; y<=72; y++) vox(px, y, pz, COL.DARK);
for (let x=SX-5; x<=SX+5; x++)
  for (let z=SZ-5; z<=SZ+5; z++) {
    const dx=x-SX, dz=z-SZ, d2=dx*dx+dz*dz;
    if (d2 <= 25) vox(x, 73, z, COL.METAL_D);
    if (d2 <= 9)  vox(x, 74, z, COL.METAL_D);
    if (d2 <= 2)  vox(x, 75, z, COL.DARK);
  }

// ====== VÁLVULA DE SEGURIDAD + MANÓMETRO (lomo de la caldera) ======
for (let y=30; y<=32; y++) vox(34, y, 20, COL.BRASS);
vox(35,32,20, COL.METAL);                       // palanca
vox(34,32,21, COL.BRASS); vox(34,33,21, COL.BRASS); // venteo
vox(12,30,20, COL.DARK); vox(12,31,20, COL.DARK);   // pedestal del manómetro
for (let x=11; x<=12; x++)
  for (let y=32; y<=34; y++)
    for (let z=19; z<=21; z++) {
      let c = COL.DARK;
      if (x===11 && y===33 && z===20) c = COL.WHITE;
      if (x===11 && y===34 && z===20) c = COL.RED;
      vox(x, y, z, c);
    }

// ====== PANEL DE CONTROL (gabinete con display) ======
for (let x=4; x<=9; x++)
  for (let y=1; y<=24; y++)
    for (let z=38; z<=46; z++) {
      const isShell = (x===4 || x===9 || y===1 || y===24 || z===38 || z===46);
      if (!isShell) continue;
      let c = COL.FRAME;
      if (x===4 && z===42 && y>=2 && y<=23) c = COL.DARK;               // seam de puerta
      else if (x===4 && y>=3 && y<=8 && (y+z)%2===0) c = COL.GRILLE;    // louvers
      vox(x, y, z, c);
    }

// ====== TANQUE ACS VERTICAL (aislado con bandas) ======
for (let y=2; y<=42; y++)
  for (let x=TX-TR; x<=TX+TR; x++)
    for (let z=TZ-TR; z<=TZ+TR; z++) {
      const dx=x-TX, dz=z-TZ, d2=dx*dx+dz*dz;
      if (d2 <= TR*TR && d2 > (TR-1)*(TR-1)) {
        let c = COL.TANK;
        if (y <= 3) c = COL.DARK;                       // faldón
        else if (y >= 12 && y <= 15) c = COL.BAND;      // banda 1
        else if (y >= 28 && y <= 31) c = COL.BAND;      // banda 2
        vox(x, y, z, c);
      }
    }
// Domo superior
for (let dy=1; dy<=4; dy++) {
  const rr = Math.sqrt(Math.max(TR*TR - (dy*2.3)*(dy*2.3), 0.1));
  for (let x=TX-TR; x<=TX+TR; x++)
    for (let z=TZ-TR; z<=TZ+TR; z++) {
      const dx=x-TX, dz=z-TZ, d2=dx*dx+dz*dz;
      if (dy < 4) { if (d2 <= rr*rr && d2 > (rr-1.6)*(rr-1.6)) vox(x, 42+dy, z, COL.TANK); }
      else { if (d2 <= rr*rr + 2) vox(x, 42+dy, z, COL.TANK); }
    }
}
// Válvula T&P en el domo
vox(TX,47,TZ, COL.BRASS); vox(TX,48,TZ, COL.BRASS); vox(TX+1,48,TZ, COL.BRASS);
// Termómetro (carátula con aguja)
vox(13,30,TZ, COL.DARK);
for (let dy=-2; dy<=2; dy++)
  for (let dz=-2; dz<=2; dz++) {
    const d2 = dy*dy + dz*dz;
    if (d2 > 6) continue;
    let c = d2 >= 3 ? COL.DARK : COL.WHITE;
    if (dy===1 && dz===1) c = COL.RED;               // aguja
    vox(12, 30+dy, TZ+dz, c);
  }

// ====== BOMBA DE RECIRCULACIÓN (entre caldera y tanque) ======
for (let x=TX-3; x<=TX+3; x++)
  for (let z=33; z<=40; z++)
    vox(x, 1, z, COL.DARK);                            // base
for (let x=TX-1; x<=TX+1; x++)
  for (let z=34; z<=37; z++)
    vox(x, 2, z, COL.DARK);                            // pedestal del motor
// Voluta (plano x-y en z=39)
for (let x=TX-3; x<=TX+3; x++)
  for (let y=1; y<=7; y++) {
    const dx=x-TX, dy=y-4, r2=dx*dx+dy*dy;
    if (r2 <= 6.8 && r2 >= 2) vox(x, y, 39, COL.METAL);
    else if (r2 < 2) vox(x, y, 39, COL.DARK);
  }
// Motor
for (let z=34; z<=37; z++)
  for (let x=TX-1; x<=TX+1; x++)
    for (let y=3; y<=5; y++)
      vox(x, y, z, z===34 ? COL.DARK : COL.METAL_D);

// ====== TUBERÍA AGUA CALIENTE (caldera → tanque) ======
pipeRun([44,30,20],[44,36,20], COL.HOTP);            // riser desde el lomo
pipeRun([44,36,21],[44,36,51], COL.HOTP);            // tramo horizontal
pipeRun([44,36,52],[35,36,52], COL.HOTP);            // entrada lateral al tanque
// Válvula de compuerta con volante (en el riser)
vox(43,33,20, COL.DARK); vox(45,33,20, COL.DARK); vox(44,33,19, COL.DARK); vox(44,33,21, COL.DARK);
vox(46,33,20, COL.DARK);
vox(47,32,20, COL.RED); vox(47,34,20, COL.RED); vox(47,33,19, COL.RED); vox(47,33,21, COL.RED);

// ====== TRAYECTORIAS ======
function polyline(points) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const segs = []; let total = 0;
  for (let i=0; i<pts.length-1; i++) {
    const l = pts[i].distanceTo(pts[i+1]);
    segs.push({ a:pts[i], b:pts[i+1], l0:total, l });
    total += l;
  }
  const v = new THREE.Vector3();
  return {
    at(t) {
      const d = Math.min(t,1) * total;
      for (const s of segs)
        if (d <= s.l0 + s.l) return v.lerpVectors(s.a, s.b, s.l ? (d-s.l0)/s.l : 0);
      return v.copy(pts[pts.length-1]);
    }
  };
}

function spawn(n, colorHex, size) {
  const arr = [];
  const geo = new THREE.BoxGeometry(size||0.6, size||0.6, size||0.6);
  for (let i=0; i<n; i++) {
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0 }));
    p.userData = { t: Math.random(), seed: Math.random()*10 };
    scene.add(p);
    arr.push(p);
  }
  return arr;
}

function updateFlow(list, path, speed, active, dt, jit) {
  const j = jit || 0.15;
  for (const p of list) {
    if (!active) { p.material.opacity = 0; continue; }
    p.userData.t += dt * speed;
    if (p.userData.t > 1) p.userData.t -= 1;
    const tt = p.userData.t, s = p.userData.seed;
    const pos = path.at(tt);
    p.position.set(
      pos.x + Math.sin(tt*9 + s)*j,
      pos.y + Math.cos(tt*7 + s)*j,
      pos.z + Math.sin(tt*5 + s)*j
    );
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  }
}

  gr.addColorStop(1, 'rgba(200,205,212,0)');
  g.fillStyle = gr;
  g.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

}
function updateSmoke(list, active, dt) {
  for (const p of list) {
    if (!active) { p.material.opacity = 0; continue; }
    p.userData.t += dt * (0.09 + p.userData.seed*0.004);
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, s = p.userData.seed;
    p.position.set(
      SX+0.5 + Math.sin(tt*4 + s)*1.4 + tt*4,
      75 + tt*32,
      SZ+0.5 + Math.cos(tt*3 + s)*1.4
    );
    const scl = 2.2 + tt*7;
    p.scale.set(scl, scl, 1);
    p.material.opacity = Math.min(tt*6, 1) * (1-tt) * 0.30;
  }
}

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (state.q) burnFanG.rotation.z += dt * 11;
  if (state.p) pumpCoupG.rotation.z += dt * 14;

  // Flama con flicker
  if (state.q) {
    flameLayers.forEach((f, i) => {
      const n = 1 + Math.sin(t*(15 + i*7))*0.08 + Math.sin(t*(27 + i*5) + i*2)*0.06;
      f.mesh.scale.set(n, 1 + (n-1)*0.5, 1 + (n-1)*0.5);
      f.mesh.material.emissiveIntensity = f.base * (0.85 + Math.sin(t*23 + i*3)*0.25);
    });
    mirillaMat.emissiveIntensity = 1.3 + Math.sin(t*17)*0.35 + Math.sin(t*29)*0.2;
    mirLight.intensity  = 1.0 + Math.sin(t*21)*0.4;
    firelight.intensity = 2.2 + Math.sin(t*19)*0.6 + Math.sin(t*31)*0.3;
  }

  // Pulso sutil del display
  dispMat.emissiveIntensity = 0.5 + Math.sin(t*2)*0.1;

  updateFlow(gasP,  gasPath,  0.16, state.q, dt, 0.12);
  updateFlow(hotP,  hotPath,  0.10, state.q, dt);
  updateFlow(recP,  recPath,  0.12, state.p, dt);
  updateFlow(flueP, fluePath, 0.10, state.q, dt, 0.3);
  updateSmoke(smoke, state.q, dt);

  controls.update();
  renderer.render(scene, camera);
}
