{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== MATERIALS — CHILLER_MATS (M01–M21) ======
const CHILLER_MATS = {};

// M01: copper — suction/discharge lines, headers, ports
CHILLER_MATS.M01 = new THREE.MeshStandardMaterial({ color: 0xb87333, roughness: 0.32, metalness: 0.92 });

// M02: aluminum — skid frame, structural
CHILLER_MATS.M02 = new THREE.MeshStandardMaterial({ color: 0x909098, roughness: 0.35, metalness: 0.90 });

// M03: steel — compressor shells, fan housings
CHILLER_MATS.M03 = new THREE.MeshStandardMaterial({ color: 0x505058, roughness: 0.40, metalness: 0.85 });

// M04: concrete — base/skid
const concTex = (() => {
  const c = Object.assign(document.createElement('canvas'), {width:512, height:512});
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#bdb6a6'; ctx.fillRect(0,0,512,512);
  const id = ctx.getImageData(0,0,512,512);
  const d = id.data;
  for (let i=0; i<d.length; i+=4) {
    const n = (Math.random()-0.5)*76;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  for (let i=0; i<18; i++) {
    const x=Math.random()*512, y=Math.random()*512, r=Math.random()*14+4;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(60,50,40,0.35)'); g.addColorStop(1,'rgba(60,50,40,0)');
    ctx.fillStyle=g; ctx.fillRect(x-r-2,y-r-2,r*2+4,r*2+4);
  }
  for (let i=0; i<14; i++) {
    const x=Math.random()*512, y=Math.random()*512, r=Math.random()*8+2;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(220,215,205,0.3)'); g.addColorStop(1,'rgba(220,215,205,0)');
    ctx.fillStyle=g; ctx.fillRect(x-r-2,y-r-2,r*2+4,r*2+4);
  }
  for (let i=0; i<220; i++) {
    const x=Math.random()*512, y=Math.random()*512;
    ctx.fillStyle=`rgba(${Math.random()>0.5?180:100},${Math.random()>0.5?170:90},${Math.random()>0.5?160:80},0.25)`;
    ctx.fillRect(x,x,1,1);
  }
  ctx.putImageData(id,0,0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; // feeds .map (color data)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.5,1.5);
  return t;
})();
CHILLER_MATS.M04 = new THREE.MeshStandardMaterial({ color: 0x0a0e16, roughness: 0.85, metalness: 0.05, map: concTex });
CHILLER_MATS.M04.bumpMap = concTex; CHILLER_MATS.M04.bumpScale = 0.6;

// M05: insulation — refrigerant pipe wrap
const insTex = (() => {
  const c = Object.assign(document.createElement('canvas'), {width:256, height:256});
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a5058'; ctx.fillRect(0,0,256,256);
  for (let y=0; y<256; y+=4) {
    const g = ctx.createLinearGradient(0,y,256,y);
    g.addColorStop(0,'rgba(80,85,93,0)');
    g.addColorStop(0.2,'rgba(80,85,93,0.5)');
    g.addColorStop(0.5,'rgba(90,96,105,0.6)');
    g.addColorStop(0.8,'rgba(80,85,93,0.5)');
    g.addColorStop(1,'rgba(80,85,93,0)');
    ctx.fillStyle=g; ctx.fillRect(0,y-1,256,3);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; // feeds .map (color data)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3,3);
  return t;
})();
CHILLER_MATS.M05 = new THREE.MeshStandardMaterial({ color: 0x4a6878, roughness: 0.75, metalness: 0.10, map: insTex });
CHILLER_MATS.M05.bumpMap = insTex; CHILLER_MATS.M05.bumpScale = 0.15;

// M06: shell_transparent — roof panels
CHILLER_MATS.M06 = new THREE.MeshStandardMaterial({ color: 0xc8c2a8, roughness: 0.45, metalness: 0.55, transparent: true, opacity: 0.16, side: THREE.DoubleSide });

// M07: plastic_black — junction boxes, control panel body
CHILLER_MATS.M07 = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.60, metalness: 0.20 });

// M08: glass — sight glasses (MeshPhysicalMaterial)
// opacity:1 required alongside transmission (see MeshPhysicalMaterial docs)
CHILLER_MATS.M08 = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0.0, transmission: 0.92, ior: 1.45, thickness: 0.1, transparent: true, opacity: 1 });

// M09: fan_blade
CHILLER_MATS.M09 = new THREE.MeshStandardMaterial({ color: 0xff2233, roughness: 0.50, metalness: 0.65, emissive: 0xff2233, emissiveIntensity: 0.4 });

// M10: compressor_housing
CHILLER_MATS.M10 = new THREE.MeshStandardMaterial({ color: 0x38383e, roughness: 0.38, metalness: 0.88 });

// M11: copper_header — with concrete texture (used as copper with slight texture)
CHILLER_MATS.M11 = new THREE.MeshStandardMaterial({ color: 0x8a5522, roughness: 0.32, metalness: 0.92 });

// M12: condenser_coil
CHILLER_MATS.M12 = new THREE.MeshStandardMaterial({ color: 0x6888a8, roughness: 0.30, metalness: 0.92 });

// M13: filter_drier — valve brass
CHILLER_MATS.M13 = new THREE.MeshStandardMaterial({ color: 0x998844, roughness: 0.45, metalness: 0.60 });

// M14: insulation_wrap — with insulation texture (same as M05 but slightly different tint)
CHILLER_MATS.M14 = new THREE.MeshStandardMaterial({ color: 0x4a6878, roughness: 0.75, metalness: 0.10, map: insTex });
CHILLER_MATS.M14.bumpMap = insTex; CHILLER_MATS.M14.bumpScale = 0.15;

// M15: coil_base / control panel
CHILLER_MATS.M15 = new THREE.MeshStandardMaterial({ color: 0x5a7888, roughness: 0.55, metalness: 0.45 });

// M16: exp_valve / grille
CHILLER_MATS.M16 = new THREE.MeshStandardMaterial({ color: 0x18181e, roughness: 0.80, metalness: 0.30 });

// M17: motor_housing
CHILLER_MATS.M17 = new THREE.MeshStandardMaterial({ color: 0x505058, roughness: 0.42, metalness: 0.80 });

// M18: frame_steel
CHILLER_MATS.M18 = new THREE.MeshStandardMaterial({ color: 0x727278, roughness: 0.40, metalness: 0.85 });

// M19: bolt
CHILLER_MATS.M19 = new THREE.MeshStandardMaterial({ color: 0x808084, roughness: 0.35, metalness: 0.90 });

// M20: paint_white — roof panels opaque
CHILLER_MATS.M20 = new THREE.MeshStandardMaterial({ color: 0xc8c2a8, roughness: 0.50, metalness: 0.30 });

// M21: paint_yellow — BAFFLE end caps
CHILLER_MATS.M21 = new THREE.MeshStandardMaterial({ color: 0xd0cabb, roughness: 0.50, metalness: 0.30 });

// Color → material key mapping for instanced voxels
const COL_MAT = {
  [0xb0b0b4]: 'M02', // SKID
  [0x808084]: 'M02', // SKID_D
  [0x22222a]: 'M07', // DARK
  [0x333340]: 'M07', // DARK_L
  [0x707078]: 'M10', // HOUSING
  [0x505058]: 'M10', // HOUSING_D
  [0x4a6878]: 'M05', // COIL
  [0x6888a8]: 'M12', // COIL_H
  [0x5a7888]: 'M15', // COIL_FIN
  [0xb87333]: 'M01', // COPPER
  [0x8a5522]: 'M11', // COPPER_D
  [0x38383e]: 'M10', // COMP
  [0x50505a]: 'M18', // COMP_L
  [0x48484e]: 'M03', // COMP_RIB
  [0x505058]: 'M17', // MOTOR
  [0x3a3a42]: 'M17', // MOTOR_D
  [0x727278]: 'M18', // FRAME
  [0x505058]: 'M03', // FRAME_D
  [0x18181e]: 'M16', // GRILLE
  [0xd0cabb]: 'M21', // BAFFLE
  [0x1a1a1a]: 'M05', // RUBBER
  [0x998844]: 'M13', // VALVE
  [0x909098]: 'M15', // PANEL_F
  [0xc8c2a8]: 'M20', // BEIGE
  [0xa8a290]: 'M20', // BEIGE_D
};
// Shell-transparent materials (BEIGE, BAFFLE use M06)
const SHELL_MATS = { [0xc8c2a8]: true, [0xa8a290]: true, [0xd0cabb]: true };

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 160, 420);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 900);
camera.position.set(140, 95, 120);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Canvas appended via container div in ResizeObserver section below

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
// Apply environment to metallic materials M01–M08, M18
['M01','M02','M03','M04','M05','M06','M07','M08','M18'].forEach(k => {
  if (CHILLER_MATS[k]) CHILLER_MATS[k].environment = scene.environment;
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(42, 18, 28);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(80, 140, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
const sc = sun.shadow.camera;
sc.left=-140; sc.right=140; sc.top=140; sc.bottom=-140; sc.near=1; sc.far=350;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.35).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 60));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.18).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 60));
// Warm underlight to show compressor bay
const under = new THREE.PointLight(0xffaa44, 0.3, 80);
under.position.set(42, 5, 28);
scene.add(under);

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700,700),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const gridH = new THREE.GridHelper(700, 120, 0x00d4aa, 0x142028);
gridH.material.opacity = 0.1;
gridH.material.transparent = true;
gridH.position.y = 0.01;
scene.add(gridH);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,c) {
  const k = c.toString();
  if (!voxData[k]) voxData[k] = { color:c, positions:[] };
  voxData[k].positions.push([x,y,z]);
}

const C = {
  BEIGE:    0xc8c2a8,
  BEIGE_D:  0xa8a290,
  SKID:     0xb0b0b4,
  SKID_D:   0x808084,
  DARK:     0x22222a,
  DARK_L:   0x333340,
  HOUSING:  0x707078,
  HOUSING_D:0x505058,
  COIL:     0x4a6878,
  COIL_H:   0x6888a8,
  COIL_FIN: 0x5a7888,
  COPPER:   0xb87333,
  COPPER_D: 0x8a5522,
  COMP:     0x38383e,
  COMP_L:   0x50505a,
  COMP_RIB: 0x48484e,
  MOTOR:    0x505058,
  MOTOR_D:  0x3a3a42,
  FRAME:    0x727278,
  FRAME_D:  0x505058,
  GRILLE:   0x18181e,
  BAFFLE:   0xd0cabb,
  RUBBER:   0x1a1a1a,
  VALVE:    0x998844,
  PANEL_F:  0x909098,
  GREEN_L:  0x00cc44,
};

// ====== DIMENSIONS ======
const L = 84;
const W = 56;
const H = 34;
const midY = 17;
const compR = 6;
const compCy = 10;
const comp1Cz = 18;
const comp2Cz = 38;
const compXs = 6;
const compXe = 77;
const thirdX = 28;
const twoThirdX = 56;

// ====== SKID / BASE with vibration isolators ======
for (let x=-1; x<=L+1; x++)
  for (let z=-1; z<=W+1; z++) {
    vox(x, 0, z, C.SKID);
    if (x===-1||x===L+1||z===-1||z===W+1) { vox(x,1,z,C.SKID_D); vox(x,2,z,C.DARK); }
  }
// Channel base rails
for (let x=0; x<=L; x++) {
  for (const zz of [4, W-5, Math.floor(W/2)-1, Math.floor(W/2)+1]) {
    vox(x,1,zz,C.FRAME_D); vox(x,2,zz,C.FRAME_D);
  }
}
// Cross rails
for (let z=4; z<=W-5; z++) {
  for (const xx of [0, thirdX, twoThirdX, L]) {
    vox(xx,1,z,C.FRAME_D); vox(xx,2,z,C.FRAME_D);
  }
}
// Vibration isolator pads (rubber blocks under compressors)
function isopad(x,z) {
  for (let dx=0;dx<3;dx++) for (let dz=0;dz<3;dz++) {
    vox(x+dx,1,z+dz,C.RUBBER); vox(x+dx,2,z+dz,C.RUBBER);
    vox(x+dx,3,z+dz,C.SKID_D);
  }
}
// Pads under comp 1
isopad(compXs+2, comp1Cz-1); isopad(compXs+20, comp1Cz-1); isopad(compXs+38, comp1Cz-1);
isopad(compXe-10, comp1Cz-1);
// Pads under comp 2
isopad(compXs+2, comp2Cz-1); isopad(compXs+20, comp2Cz-1); isopad(compXs+38, comp2Cz-1);
isopad(compXe-10, comp2Cz-1);

// ====== STRUCTURAL FRAME ======
function vPost(x,z,y0,y1) {
  for (let y=y0;y<=y1;y++) {
    vox(x,y,z,C.FRAME); vox(x+1,y,z,C.FRAME); vox(x,y,z+1,C.FRAME);
  }
}
// 4 corner posts
vPost(0,0,3,H); vPost(L-1,0,3,H); vPost(0,W-2,3,H); vPost(L-1,W-2,3,H);
// Intermediate posts at thirds
vPost(thirdX,0,3,H); vPost(thirdX,W-2,3,H);
vPost(twoThirdX,0,3,H); vPost(twoThirdX,W-2,3,H);

// Top perimeter rails
for (let x=0;x<=L;x++) { vox(x,H,0,C.FRAME); vox(x,H,W-1,C.FRAME); }
for (let z=0;z<=W-1;z++) { vox(0,H,z,C.FRAME); vox(L,H,z,C.FRAME); vox(thirdX,H,z,C.FRAME); vox(twoThirdX,H,z,C.FRAME); }
// Mid-height perimeter rails
for (let x=0;x<=L;x++) { vox(x,midY,0,C.FRAME); vox(x,midY,W-1,C.FRAME); }
for (let z=0;z<=W-1;z++) { vox(0,midY,z,C.FRAME); vox(L,midY,z,C.FRAME); }
// Bottom perimeter rails
for (let x=0;x<=L;x++) { vox(x,3,0,C.FRAME); vox(x,3,W-1,C.FRAME); }
for (let z=0;z<=W-1;z++) { vox(0,3,z,C.FRAME); vox(L,3,z,C.FRAME); }

// Diagonal cross-bracing on end frames
function xBrace(x, z0, z1, y0, y1) {
  const steps = Math.max(Math.abs(z1-z0), Math.abs(y1-y0));
  for (let s=0;s<=steps;s++) {
    const z = Math.round(z0 + (z1-z0)*s/steps);
    const y = Math.round(y0 + (y1-y0)*s/steps);
    vox(x,y,z,C.FRAME_D);
  }
}
// Left end X-braces
xBrace(0, 3, W-3, 4, midY-1);
xBrace(0, W-3, 3, 4, midY-1);
// Right end X-braces
xBrace(L, 3, W-3, 4, midY-1);
xBrace(L, W-3, 3, 4, midY-1);

// ====== ROOF (transparent shell) ======
for (let x=1;x<L;x++)
  for (let z=1;z<W-1;z++) {
    vox(x,H,z,C.BEIGE); vox(x,H+1,z,C.BEIGE_D);
  }

// ====== COMPRESSORS (2 parallel, highly detailed) ======
function buildComp(xs,xe,cy,cz,r) {
  // Mounting feet / cradle brackets
  for (let x=xs; x<=xe; x+=10) {
    for (let z=cz-r-2; z<=cz+r+2; z++) {
      vox(x,3,z,C.SKID_D); vox(x+1,3,z,C.SKID_D); vox(x+2,3,z,C.SKID_D);
    }
    for (let y=3;y<=cy-r;y++) {
      vox(x,y,cz-r-1,C.FRAME_D); vox(x,y,cz+r+1,C.FRAME_D);
      vox(x+2,y,cz-r-1,C.FRAME_D); vox(x+2,y,cz+r+1,C.FRAME_D);
    }
  }
  // Main cylinder body
  for (let x=xs;x<=xe;x++)
    for (let y=cy-r;y<=cy+r;y++)
      for (let z=cz-r;z<=cz+r;z++) {
        const dy=y-cy, dz=z-cz, d2=dy*dy+dz*dz;
        if (d2<=r*r) {
          const isShell = d2>=(r-1)*(r-1);
          // Rib bands every 6 voxels
          const isRib = isShell && (x%6===0);
          vox(x,y,z, isRib ? C.COMP_RIB : (isShell ? C.COMP_L : C.COMP));
        }
      }
  // Right hemispheric dome
  for (let dx=0;dx<=r;dx++) {
    const rr=Math.round(Math.sqrt(r*r-dx*dx));
    for (let y=cy-rr;y<=cy+rr;y++)
      for (let z=cz-rr;z<=cz+rr;z++)
        if ((y-cy)**2+(z-cz)**2<=rr*rr)
          vox(xe+1+dx,y,z,C.COMP);
  }
  // Left end plate with bolt ring
  for (let y=cy-r;y<=cy+r;y++)
    for (let z=cz-r;z<=cz+r;z++) {
      const dy=y-cy,dz=z-cz,d2=dy*dy+dz*dz;
      if (d2<=r*r) vox(xs-1,y,z,C.DARK);
      if (d2>=(r-1)*(r-1) && d2<=r*r) vox(xs-1,y,z,C.DARK_L);
    }
  // Bolt pattern on end plate
  for (let i=0;i<8;i++) {
    const a=(i/8)*Math.PI*2;
    const by=cy+Math.round(Math.cos(a)*(r-1));
    const bz=cz+Math.round(Math.sin(a)*(r-1));
    vox(xs-1,by,bz,C.SKID);
  }

  // Motor housing on left end
  for (let y=cy-4;y<=cy+4;y++)
    for (let z=cz-4;z<=cz+4;z++) {
      const dy=y-cy,dz=z-cz;
      if (dy*dy+dz*dz<=16) {

  const p=new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({color:0xaa55ff, transparent:true, opacity:0.9}));
  p.userData={t:Math.random(), seed:Math.random()*10, circ:i<N_REF/2?0:1};
  scene.add(p); refP.push(p);
}

// ====== LIFECYCLE / DISPOSAL (Phase 5) ======
let resizeObs = null;
let disposed = false;
let rafId = 0;

function destroy() {
  disposed = true;
  cancelAnimationFrame(rafId);
  // Dispose instanced meshes (geometries + materials via traverse)
  scene.traverse(obj => {
    if (obj.geometry && obj.geometry !== cubeGeo) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else if (obj.material.dispose) obj.material.dispose();
    }
  });
  // Dispose standalone geometries
  [cylCompBodyGeo, cylCompDomeGeo, ribRingGeo, portGeo, portGeoSm, hdrGeo,
   liqPipeGeo, drierGeo, expGeo, glassGeo, fanRingGeo, fanRingGeoInner,
   cubeGeo].forEach(g => g.dispose());
  // Dispose canvas textures
  [concTex, insTex].forEach(t => t.dispose());
  // Remove resize listener
  window.removeEventListener('resize', resizeHandler);
  if (resizeObs) resizeObs.disconnect();
  // Dispose renderer
  renderer.dispose();
  if (renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
}

// ====== RESIZE (ResizeObserver) ======
function resizeHandler() {
  const w = container.clientWidth || innerWidth;
  const h = container.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
// Wrap canvas in container for ResizeObserver
const container = document.createElement('div');
container.style.cssText = 'position:fixed;inset:0;';
document.body.insertBefore(container, document.body.firstChild);
container.appendChild(renderer.domElement);
resizeObs = new ResizeObserver(resizeHandler);
resizeObs.observe(container);

// ====== ANIMATE ======
const clock=new THREE.Clock();
function animate(){
  if (disposed) return;
  rafId = requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // Fans
  const fOn=getFanOn();
  fanGroups.forEach((g,i)=>{ if(fOn[i]) g.rotation.y+=dt*(7+i*0.25); });

  // Compressor motor tops
  [state.c1,state.c2].forEach((on,i)=>{
    const baseY=compCy+compR+2;
    if(on){
      compTops[i].rotation.y+=dt*14;
      compTops[i].position.y=baseY+Math.sin(t*35+i)*0.1;
    } else compTops[i].position.y=baseY;
  });

  // Air particles — opacity couples to fan/compressor state
  const czArr=[comp1Cz, comp2Cz];
  airP.forEach((p,i)=>{
    const ci=p.userData.circ;
    if(![state.c1,state.c2][ci]){ p.material.opacity=0; return; }
    p.userData.t+=dt*0.12;
    if(p.userData.t>1)p.userData.t=0;
    const tt=p.userData.t, seed=p.userData.seed;
    const col=fanCols[i%3];
    const tZ=fanRowZ[ci];
    const sideZ=ci===0?2:W-3;

    if(tt<0.3){
      const u=tt/0.3;
      p.position.x=col+Math.sin(u*3+seed)*2.5;
      p.position.y=midY+3+u*9+Math.sin(u*5+seed)*0.5;
      p.position.z=sideZ+(tZ-sideZ)*u+Math.cos(u*4+seed)*0.5;
    } else {
      const u=(tt-0.3)/0.7;
      p.position.x=col+Math.sin(u*4+seed)*2;
      p.position.y=midY+12+u*30;
      p.position.z=tZ+Math.cos(u*3+seed)*2;
    }
    p.material.opacity=Math.sin(tt*Math.PI)*0.9;
  });

  // Refrigerant particles — opacity couples to fan/compressor state
  refP.forEach((p,i)=>{
    const ci=p.userData.circ;
    if(![state.c1,state.c2][ci]){ p.material.opacity=0; return; }
    p.userData.t+=dt*0.09;
    if(p.userData.t>1)p.userData.t=0;
    const tt=p.userData.t, seed=p.userData.seed;
    const cz=czArr[ci];

    if(tt<0.35){
      const u=tt/0.35;
      p.position.x=compXs+u*(compXe-compXs)+Math.sin(u*8+seed)*0.6;
      p.position.y=compCy+Math.sin(u*6+seed)*3;
      p.position.z=cz+Math.cos(u*4+seed)*3;
    } else if(tt<0.55){
      const u=(tt-0.35)/0.2;
      p.position.x=compXs+10+(i%3)*22+Math.sin(u*3+seed)*0.5;
      p.position.y=compCy+compR+u*(midY-compCy-compR+6);
      p.position.z=cz+Math.cos(u*5+seed)*0.8;
    } else {
      const u=(tt-0.55)/0.45;
      p.position.x=compXs+10+(i%3)*22+Math.sin(u*4+seed)*7;
      p.position.y=midY+3+u*12+Math.sin(u*6+seed)*2.5;
      p.position.z=cz+Math.cos(u*3+seed)*10;
    }
    p.material.opacity=Math.sin(tt*Math.PI)*0.85;
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
