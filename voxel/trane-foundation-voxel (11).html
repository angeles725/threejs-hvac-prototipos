<style>

  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }

  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }

  #panel button.off { color:#ff4455; border-color:#ff4455; }

<body>
<div id="info">
  <b>TRANE FOUNDATION&trade; EAC180-300</b><br>
  <span>Voxel Art &middot; Cut-away View &middot; 15&ndash;25 Toneladas</span>
</div>
<div id="legend">
  <div><i style="background:#ff4422"></i> Aire de retorno</div>
  <div><i style="background:#44aaff"></i> Aire de suministro</div>
</div>

  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>SUPPLY FAN</label><button id="bFan" class="off">OFF</button></div>
  <div class="row"><label>COMPRESOR 1</label><button id="bC1" class="off">OFF</button></div>
  <div class="row"><label>COMPRESOR 2</label><button id="bC2" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 100, 280);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 800);
camera.position.set(95, 70, 90);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(29, 12, 14);
controls.autoRotate = false;       // Start OFF — toggleable
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(60, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-100; sc.right=100; sc.top=100; sc.bottom=-100; sc.near=1; sc.far=300;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 50));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 50));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(600, 100, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}

const COL = {
  BEIGE:    0xc8c2a8,
  BEIGE_D:  0xa8a290,
  SKID:     0xa8a8ac,
  DARK:     0x2a2a2e,
  HOUSING:  0x6a6a72,
  HOUSING_D:0x4a4a52,
  COIL:     0x4a6878,
  COIL_H:   0x6080a0,
  COPPER:   0xb87333,
  COMP:     0x3a3a40,
  COMP_L:   0x55555c,
  MOTOR:    0x55555c,
  FRAME:    0x3a3a3e,
  GRILLE:   0x1a1a1e,
  PANEL:    0xb0aa92,
  FILTER:   0x5a5048,
  FILTER_H: 0x6a5e54,
};

// ====== DIMENSIONS (voxel units) ======
// Foundation EAC180-300 (123" x 80" x 72" L x W x H, single rectangular cabinet)
//
// Layout in CODE  (left -> right on screen with camera at +Z):
//   x=0..6   RETURN chamber (empty, side intake louvers on x=0 wall)
//   x=6..14  SLANTED FILTER + COIL ASSEMBLY (Foundation signature, X-vs-Y tilt)
//   x=14..32 BLOWER SCROLL + WHEEL + MOTOR
//   x=32     PARTITION
//   x=32..58 COMPRESSORS + ELECTRICAL + CONDENSER + FAN DECK
//
// CRITICAL ORIENTATION:
//   Z_FRONT = W-1 = cutaway face (toward camera at +Z=90)
//   Z_BACK  = 0   = back wall (condenser coil, away from camera)
//   This way camera sees the open cut-away with +X (compressors) on the RIGHT.
const AH_LEN   = 32;
const COMP_LEN = 26;
const W = 28;
const H = 24;
const compX0  = AH_LEN;
const compX1  = AH_LEN + COMP_LEN;
const TOTAL   = compX1;        // 58
const Z_FRONT = W - 1;         // cutaway (camera-facing)
const Z_BACK  = 0;             // back wall (condenser side)

// ====== SKID (base) ======
for (let x=-1; x<=TOTAL; x++)
  for (let z=-1; z<=W; z++) {
    vox(x, 0, z, COL.SKID);
    if (x===-1 || x===TOTAL || z===-1 || z===W)
      vox(x, 1, z, COL.DARK);
  }

// ====== AIR-HANDLER CABINET SHELL ======
// Left wall (intake side, with louvers below)
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(0, y, z, COL.BEIGE);
// Roof for AH section
for (let x=0; x<=AH_LEN; x++)
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);
    vox(x, H+1, z, COL.BEIGE_D);
  }
// BACK wall for AH section (z=Z_BACK = away from camera)
for (let x=0; x<AH_LEN; x++)
  for (let y=2; y<H; y++)
    vox(x, y, Z_BACK, COL.BEIGE);

// ====== LOUVERS on left intake wall ======
for (let i=0; i<7; i++) {
  const y = 6 + i*2;
  for (let z=4; z<W-4; z++) vox(0, y, z, COL.FRAME);
}
for (let y=4; y<H-2; y++) {
  vox(0, y, 4,    COL.BEIGE_D);
  vox(0, y, W-5,  COL.BEIGE_D);
}

// ====== INTERNAL PARTITION ======
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(AH_LEN, y, z, COL.BEIGE_D);

// ====== COMPRESSOR CABINET SHELL ======
// Roof
for (let x=AH_LEN+1; x<=compX1; x++)
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);
    vox(x, H+1, z, COL.BEIGE_D);
  }
// Frame around BACK wall (condenser fills the interior of that face)
for (let x=AH_LEN+1; x<compX1; x++) {
  vox(x, 2,   Z_BACK, COL.BEIGE_D);
  vox(x, H-2, Z_BACK, COL.BEIGE_D);
  vox(x, H-1, Z_BACK, COL.BEIGE_D);
}
// Right end wall (frame only — condenser fills inside)
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++) {
    const isFrame = (y<3 || y>=H-2 || z<2 || z>=W-2);
    if (isFrame) vox(compX1, y, z, COL.BEIGE_D);
  }

// ====== UPPER-FRONT ELECTRICAL PANEL COVER (cutaway side, z=Z_FRONT) ======
for (let x=AH_LEN+1; x<compX1; x++)
  for (let y=Math.floor(H*0.55); y<H; y++)
    vox(x, y, Z_FRONT, COL.BEIGE);
// Door seam (vertical, on cutaway face)
const doorX = AH_LEN + Math.floor(COMP_LEN/2);
for (let y=Math.floor(H*0.55); y<H-1; y++)
  vox(doorX, y, Z_FRONT, COL.DARK);
// Door handles
const handleY = Math.floor(H*0.7);
vox(doorX-3, handleY, Z_FRONT, COL.SKID);
vox(doorX-2, handleY, Z_FRONT, COL.SKID);
vox(doorX+2, handleY, Z_FRONT, COL.SKID);
vox(doorX+3, handleY, Z_FRONT, COL.SKID);

// ====== CONDENSER COIL (back wall + right end wall) ======
// Back wall slats (interior of compressor section)
for (let x=AH_LEN+2; x<compX1-1; x++)
  for (let y=3; y<H-2; y++)
    vox(x, y, Z_BACK, (y%2===0) ? COL.COIL : COL.COIL_H);
// Vertical posts at edges of back wall coil
for (let y=3; y<H-2; y++) {
  vox(AH_LEN+1, y, Z_BACK, COL.FRAME);
  vox(compX1-1, y, Z_BACK, COL.FRAME);
}
// Right-end wall coil (fills the BEIGE_D frame opening)
for (let z=2; z<W-2; z++)
  for (let y=3; y<H-2; y++)
    vox(compX1, y, z, (y%2===0) ? COL.COIL : COL.COIL_H);

// ====== SLANTED FILTER + COIL ASSEMBLY (Foundation signature) ======
// Tilt in X-vs-Y: bottom near return (low X), top toward blower (high X).
// 2 voxels thick — outer face = filter media, inner face = coil pattern.
const fcBaseBotX = 6;
const fcBotY     = 4;
const fcTopY     = H - 4;
const fcHeight   = fcTopY - fcBotY;
const fcTiltDX   = 6;          // top is 6 X-units to the right of bottom

function fcXatY(y) {
  const fy = y - fcBotY;
  return fcBaseBotX + Math.round((fy / fcHeight) * fcTiltDX);
}

for (let y=fcBotY; y<=fcTopY; y++) {
  const baseX = fcXatY(y);
  for (let z=2; z<W-2; z++) {
    // Filter face (toward return, low-X side)
    vox(baseX,     y, z, ((y+z)%2===0) ? COL.FILTER : COL.FILTER_H);
    // Coil face (toward blower, high-X side)
    vox(baseX + 1, y, z, (y%2===0) ? COL.COIL : COL.COIL_H);
  }
  // Side frame caps
  vox(baseX-1, y, 2,    COL.FRAME);
  vox(baseX+2, y, 2,    COL.FRAME);
  vox(baseX-1, y, W-3,  COL.FRAME);
  vox(baseX+2, y, W-3,  COL.FRAME);
}
// Top + bottom horizontal rails of the filter rack
for (let z=2; z<=W-3; z++) {
  vox(fcXatY(fcBotY),     fcBotY, z, COL.FRAME);
  vox(fcXatY(fcBotY)+1,   fcBotY, z, COL.FRAME);
  vox(fcXatY(fcTopY),     fcTopY, z, COL.FRAME);
  vox(fcXatY(fcTopY)+1,   fcTopY, z, COL.FRAME);
}
// Copper U-bend headers on cutaway side (visible to camera)
for (let i=0; i<6; i++) {
  const y = fcBotY + 2 + i*3;
  if (y > fcTopY-1) break;
  const baseX = fcXatY(y);
  vox(baseX+2, y,   W-2, COL.COPPER);
  vox(baseX+2, y+1, W-2, COL.COPPER);
  vox(baseX+3, y,   W-2, COL.COPPER);
  vox(baseX+3, y+1, W-2, COL.COPPER);
}
// Drain pan beneath the assembly
for (let x=fcBaseBotX-1; x<=fcBaseBotX+fcTiltDX+2; x++)
  for (let z=2; z<W-2; z++)
    vox(x, 2, z, COL.SKID);

// ====== BLOWER SCROLL HOUSING ======
// Scroll ring lives in the BACK half (z=bcz-8 .. bcz) so the open eye + wheel
// face the cutaway camera at +Z.
const bcx = 23;
const bcy = Math.floor(H/2);
const bcz = Math.floor(W/2);
const brOut = 8, brIn = 6;
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    const r2 = dx*dx + dy*dy;
    if (r2 <= brOut*brOut && r2 >= brIn*brIn) {
      // Back-half only (dz=-8..0) — open eye toward +Z (camera)
      for (let dz=-8; dz<=0; dz++) vox(x, y, bcz+dz, COL.HOUSING);
    }
  }
// Back side plate (deep back, away from camera)
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    if (dx*dx + dy*dy <= brOut*brOut)
      vox(x, y, bcz-9, COL.HOUSING_D);
  }
// Outlet duct on top of scroll (rises through roof area)
for (let x=bcx-3; x<=bcx+3; x++)
  for (let y=bcy+brOut; y<bcy+brOut+3; y++)
    for (let z=bcz-6; z<=bcz+2; z++)
      if (x===bcx-3 || x===bcx+3 || z===bcz-6 || z===bcz+2 || y===bcy+brOut+2)
        vox(x, y, z, COL.HOUSING);
// Belt guard on +X side (cutaway-visible)
for (let x=bcx+brOut-1; x<=bcx+brOut+3; x++)
  for (let y=bcy-6; y<bcy-2; y++)
    vox(x, y, bcz+5, COL.DARK);
// Motor block (right of scroll, drives via belt) — on cutaway side for visibility
for (let x=bcx+brOut+1; x<=Math.min(bcx+brOut+4, AH_LEN-1); x++)
  for (let y=bcy-3; y<=bcy; y++)
    for (let z=bcz+3; z<=bcz+7; z++)
      vox(x, y, z, COL.MOTOR);

// ====== COMPRESSORS (2 scroll cylinders, vertical, side-by-side) ======
function buildCompressor(cx, cz) {
  const r = 4;
  // Base flange
  for (let x=cx-r-1; x<=cx+r+1; x++)
    for (let z=cz-r-1; z<=cz+r+1; z++) {
      const dx=x-cx, dz=z-cz;
      if (dx*dx+dz*dz <= (r+1)*(r+1))
        vox(x, 2, z, COL.DARK);
    }
  // Cylindrical body
  for (let y=3; y<=11; y++)
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= r*r) {
          const isShell = (d2 >= (r-1)*(r-1));
          vox(x, y, z, isShell ? COL.COMP : COL.DARK);
        }
      }
  // Hemispheric top dome
  for (let dy=0; dy<=r; dy++) {
    const rr = Math.sqrt(r*r - dy*dy);
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= rr*rr) {
          const isShell = (d2 >= (rr-1)*(rr-1));
          if (isShell || dy===r) vox(x, 12+dy, z, COL.COMP);
        }
      }
  }
  // Copper suction + discharge lines rising from compressor top
  for (let y=16; y<=20; y++) {
    vox(cx+1, y, cz, COL.COPPER);
    vox(cx-1, y, cz, COL.COPPER);
  }
  // Junction box on FRONT (cutaway side, z=cz+r+1)
  for (let y=6; y<=9; y++)
    for (let x=cx-1; x<=cx+1; x++)
      vox(x, y, cz+r+1, COL.DARK);
}
buildCompressor(compX0 + 7,  Math.floor(W/2));
buildCompressor(compX0 + 19, Math.floor(W/2));

// ====== INTERCONNECTING REFRIGERANT MANIFOLD ======
// Headers between compressors, then risers heading BACK toward condenser coil at z=0
const cz_ = Math.floor(W/2);
for (let x=compX0+7; x<=compX0+19; x++) {
  vox(x, 19, cz_+1, COL.COPPER);  // suction header
  vox(x, 20, cz_+1, COL.COPPER);
  vox(x, 19, cz_-1, COL.COPPER);  // discharge header
  vox(x, 20, cz_-1, COL.COPPER);
}
// Risers from each compressor heading back toward condenser coil (z=0)
for (let z=cz_-1; z>2; z--) {
  vox(compX0+7,  20, z, COL.COPPER);
  vox(compX0+19, 20, z, COL.COPPER);
}
// Vertical risers up from compressor to header (cz_+2 = next to junction box)
for (let y=12; y<=18; y++) {
  vox(compX0+7,  y, cz_+2, COL.COPPER);
  vox(compX0+19, y, cz_+2, COL.COPPER);
}

// ====== CONDENSER FAN DECK ======
// Raised deck on top of compressor cabinet
for (let x=compX0+1; x<compX1; x++)
  for (let z=1; z<W-1; z++)
    vox(x, H+2, z, COL.BEIGE_D);

// 2 fan housings — aligned along X axis at center Z (one above each compressor)
function fanHousingVox(cx, cz) {
  const r = 5;
  for (let x=cx-r; x<=cx+r; x++)
    for (let z=cz-r; z<=cz+r; z++) {
      const dx=x-cx, dz=z-cz;
      const d2 = dx*dx+dz*dz;
      if (d2 <= r*r && d2 >= (r-1)*(r-1)) {
        vox(x, H+3, z, COL.HOUSING);
        vox(x, H+4, z, COL.HOUSING);
        vox(x, H+5, z, COL.HOUSING_D);
      }
      if (d2 < (r-1)*(r-1) && d2 >= (r-2)*(r-2)) {
        vox(x, H+3, z, COL.DARK);
      }
    }
}
const fanPositions = [
  [compX0 + 7,  Math.floor(W/2)],   // above compressor 1
  [compX0 + 19, Math.floor(W/2)],   // above compressor 2
];
fanPositions.forEach(([cx,cz]) => fanHousingVox(cx, cz));

// ====== ELECTRICAL PANEL hint (interior blocks behind cutaway-side cover) ======
// At z=W-2, just inside the BEIGE upper-front cover, on the cutaway side
for (let x=compX0+2; x<compX0+Math.floor(COMP_LEN/2)-1; x++)
  for (let y=Math.floor(H*0.6); y<H-1; y++)
    if ((x+y)%2===0) vox(x, y, W-2, COL.GRILLE);
// Contactor block + breaker hint
for (let x=compX0+Math.floor(COMP_LEN/2)+2; x<compX1-1; x++)
  for (let y=Math.floor(H*0.62); y<Math.floor(H*0.85); y++)
    if ((x+y)%3===0) vox(x, y, W-2, COL.COMP_L);
// Terminal strip (small accent dots)
for (let x=compX0+3; x<compX1-2; x+=2)
  vox(x, Math.floor(H*0.92), W-2, COL.COPPER);

// ====== INSTANCED MESHES ======
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const SHELL_COLORS = new Set([COL.BEIGE, COL.BEIGE_D]);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const isShell = SHELL_COLORS.has(color);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: isShell ? 0.55 : 0.5,
    metalness: isShell ? 0.15 : 0.55,
    transparent: isShell,
    opacity: isShell ? 0.2 : 1.0,
    depthWrite: !isShell,
    side: isShell ? THREE.DoubleSide : THREE.FrontSide,
  });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !isShell;
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ====== ANIMATED BLOWER WHEEL (squirrel cage, voxel blades) ======
// Centered inside scroll (back-half), wheel axis along Z so eye faces camera
const blowerGroup = new THREE.Group();
blowerGroup.position.set(bcx+0.5, bcy+0.5, bcz-4.5);
const wheelMat = new THREE.MeshStandardMaterial({
  color:0xff2233, roughness:0.45, metalness:0.6,
  emissive:0xff2233, emissiveIntensity:0.4
});
const bladeGeo = new THREE.BoxGeometry(0.55, 1.1, 0.55);
const bladeR = 4.2;
for (let i=0; i<16; i++) {
  const a = (i/16) * Math.PI*2;
  for (let zOff=-3; zOff<=3; zOff++) {
    const blade = new THREE.Mesh(bladeGeo, wheelMat);
    blade.position.set(Math.cos(a)*bladeR, Math.sin(a)*bladeR, zOff);
    blade.rotation.z = a;
    blade.castShadow = true;
    blowerGroup.add(blade);
  }
}
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(1.3, 1.3, 7, 14),
  wheelMat
);
hub.rotation.x = Math.PI/2;
blowerGroup.add(hub);
scene.add(blowerGroup);

// ====== COMPRESSOR MOTOR TOPS (rotate + vibrate when ON) ======
const compTops = [];
function buildCompTop(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, 17.5, cz+0.5);
  const topMat = new THREE.MeshStandardMaterial({
    color:0x55555c, roughness:0.35, metalness:0.85
  });
  for (let ax=-2; ax<=2; ax++)
    for (let az=-2; az<=2; az++)
      if (ax*ax + az*az <= 5) {
        const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.6,0.9), topMat);
        c.position.set(ax, 0, az);
        c.castShadow = true;
        g.add(c);
      }
  for (let i=0; i<4; i++) {
    const a = (i/4)*Math.PI*2;
    const bolt = new THREE.Mesh(
      new THREE.BoxGeometry(0.5,0.5,0.5),
      new THREE.MeshStandardMaterial({ color:0x202024, metalness:0.7 })
    );
    bolt.position.set(Math.cos(a)*1.4, 0.5, Math.sin(a)*1.4);
    g.add(bolt);
  }
  scene.add(g);
  return g;
}
compTops.push(buildCompTop(compX0+7,  Math.floor(W/2)));
compTops.push(buildCompTop(compX0+19, Math.floor(W/2)));

// ====== CONDENSER FAN BLADES (animated) ======
const fanGroups = [];
function buildFanBlades(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, H+5+0.5, cz+0.5);
  const bladeMat = new THREE.MeshStandardMaterial({
    color:0x252528, roughness:0.55, metalness:0.7
  });
  const bladeGeoF = new THREE.BoxGeometry(0.7, 0.3, 0.7);
  for (let i=0; i<5; i++) {
    const a = (i/5) * Math.PI*2;
    for (let r=1; r<=4; r++) {
      const b = new THREE.Mesh(bladeGeoF, bladeMat);
      b.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
      b.rotation.y = a;
      b.castShadow = true;
      g.add(b);
    }
  }
  const fanHub = new THREE.Mesh(
    new THREE.CylinderGeometry(1, 1, 0.6, 12),
    new THREE.MeshStandardMaterial({ color:0x3a3a3e, metalness:0.8, roughness:0.4 })
  );
  g.add(fanHub);
  scene.add(g);
  return g;
}
fanPositions.forEach(([cx,cz]) => fanGroups.push(buildFanBlades(cx, cz)));

// ====== STATUS LEDs (on cutaway-side electrical panel, one per compressor) ======
function buildLED(x, y, z) {
  const ledGeo = new THREE.BoxGeometry(0.8, 0.8, 0.4);
  const led = new THREE.Mesh(ledGeo, new THREE.MeshStandardMaterial({
    color: 0xff2233, emissive: 0xff2233, emissiveIntensity: 1.0
  }));
  led.position.set(x+0.5, y+0.5, z+0.5);
  scene.add(led);
  const light = new THREE.PointLight(0xff2233, 1.0, 8);
  light.position.copy(led.position);
  scene.add(light);
  return { mesh: led, light };
}
const led1 = buildLED(compX0+8,  H-3, W-2);
const led2 = buildLED(compX0+20, H-3, W-2);

// ====== AIRFLOW PARTICLES ======
const partGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
const partMatRet = new THREE.MeshBasicMaterial({ color:0xff4422, transparent:true, opacity:0.9 });
const partMatSup = new THREE.MeshBasicMaterial({ color:0x44aaff, transparent:true, opacity:0.9 });

const returnParticles = [];
const supplyParticles = [];

// Return: enter from left louvers (x<0), travel +X through filter/coil, into blower
for (let i=0; i<60; i++) {
  const p = new THREE.Mesh(partGeo, partMatRet.clone());
  p.position.set(-2 - Math.random()*5, 4 + Math.random()*16, 2 + Math.random()*(W-4));
  p.userData = { speed: 0.15 + Math.random()*0.10 };
  scene.add(p);
  returnParticles.push(p);
}
// Supply: emerge from blower outlet (top of scroll), exit upward through duct
for (let i=0; i<60; i++) {
  const p = new THREE.Mesh(partGeo, partMatSup.clone());
  p.position.set(bcx-2 + Math.random()*5, bcy+brOut + Math.random()*4, bcz-6 + Math.random()*8);
  p.userData = { speed: 0.20 + Math.random()*0.10 };
  scene.add(p);
  supplyParticles.push(p);
}

// ====== STATE MACHINE ======
const state = { fan:false, c1:false, c2:false };

function setBtn(btn, on, label) {
  btn.classList.remove('off','on');
  btn.classList.add(on ? 'on' : 'off');
  btn.textContent = label != null ? label : (on ? 'ON' : 'OFF');
}

const COLOR_ON  = 0x00ff66;
const COLOR_OFF = 0xff2233;

function updateLEDs() {
  const apply = (led, on) => {
    led.mesh.material.color.setHex(on ? COLOR_ON : COLOR_OFF);
    led.mesh.material.emissive.setHex(on ? COLOR_ON : COLOR_OFF);
    led.mesh.material.emissiveIntensity = on ? 1.5 : 1.0;
    led.light.color.setHex(on ? COLOR_ON : COLOR_OFF);
    led.light.intensity = on ? 1.5 : 1.0;
  };
  apply(led1, state.c1);
  apply(led2, state.c2);
}
updateLEDs();

const bFan = document.getElementById('bFan');
const bC1  = document.getElementById('bC1');
const bC2  = document.getElementById('bC2');
const bRot = document.getElementById('bRot');

bFan.onclick = () => { state.fan = !state.fan; setBtn(bFan, state.fan); };
bC1.onclick  = () => { state.c1  = !state.c1;  setBtn(bC1,  state.c1);  updateLEDs(); };
bC2.onclick  = () => { state.c2  = !state.c2;  setBtn(bC2,  state.c2);  updateLEDs(); };
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  setBtn(bRot, controls.autoRotate);
};

// ====== ANIMATION LOOP ======
const clock = new THREE.Clock();
function animate() {
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  // Blower wheel
  if (state.fan) blowerGroup.rotation.z -= dt * 7;

  // Condenser fans (each tied to its compressor)
  if (state.c1) fanGroups[0].rotation.y -= dt * 9;
  if (state.c2) fanGroups[1].rotation.y -= dt * 9.5;

  // Compressor tops — rotate + Y-vibration when ON
  if (state.c1) {
    compTops[0].rotation.y += dt * 12;
    compTops[0].position.y = 17.5 + Math.sin(t*30) * 0.15;
  } else compTops[0].position.y = 17.5;
  if (state.c2) {
    compTops[1].rotation.y += dt * 12.5;
    compTops[1].position.y = 17.5 + Math.cos(t*30) * 0.15;
  } else compTops[1].position.y = 17.5;

  // Particles — return air (flowing +X from left intake to blower)
  for (const p of returnParticles) {
    if (state.fan) {
      p.material.opacity = 0.9;
      p.position.x += p.userData.speed * dt * 60;
      if (p.position.x > bcx) {
        p.position.set(-2 - Math.random()*5, 4 + Math.random()*16, 2 + Math.random()*(W-4));
      }
    } else {
      p.material.opacity = 0;
    }
  }
  // Supply air (rising from blower outlet, exits upward)
  for (const p of supplyParticles) {
    if (state.fan) {
      p.material.opacity = 0.9;
      p.position.y += p.userData.speed * dt * 60;
      if (p.position.y > H+10) {
        p.position.set(bcx-2 + Math.random()*5, bcy+brOut + Math.random()*4, bcz-6 + Math.random()*8);
      }
    } else {
      p.material.opacity = 0;
    }
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
