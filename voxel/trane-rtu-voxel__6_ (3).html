<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TRANE RTU · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:230px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:54px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
  #panel button.standby { color:#06080d; border-color:#3aa6ff; background:#3aa6ff; box-shadow:0 0 12px #3aa6ff55; }
  #panel button.alarm   { color:#06080d; border-color:#ff2233; background:#ff2233; box-shadow:0 0 12px #ff223388; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.55; } }
</style>
</head>
<body>
<div id="info">
  <b>TRANE PACKAGED ROOFTOP UNIT</b><br>
  <span>Voxel Art · Cut-away View</span>
</div>
<div id="legend">
  <div><i style="background:#ff4422"></i> Aire de retorno</div>
  <div><i style="background:#44aaff"></i> Aire de suministro</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>SUPPLY FAN</label><button id="bFan" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 1</label><button id="bC1" class="standby">STANDBY</button></div>
  <div class="row"><label>COMPRESOR 2</label><button id="bC2" class="standby">STANDBY</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 120, 320);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 800);
camera.position.set(120, 80, 100);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(55, 18, 15);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(60, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-120; sc.right=120; sc.top=120; sc.bottom=-120; sc.near=1; sc.far=300;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 50));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 50));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(600, 100, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}

const COL = {
  BEIGE:    0xc8c2a8,
  BEIGE_D:  0xa8a290,
  SKID:     0xa8a8ac,
  DARK:     0x2a2a2e,
  HOUSING:  0x6a6a72,
  HOUSING_D:0x4a4a52,
  COIL:     0x4a6878,
  COIL_H:   0x6080a0,
  COPPER:   0xb87333,
  COMP:     0x3a3a40,
  COMP_L:   0x55555c,
  MOTOR:    0x55555c,
  FRAME:    0x3a3a3e,
  GRILLE:   0x1a1a1e,
  PANEL:    0xb0aa92,
};

// ====== DIMENSIONS (voxel units) ======
const HOOD_LEN = 22;
const CAB_LEN  = 48;
const COMP_LEN = 28;
const W = 28;
const H = 28;
const cabX0 = HOOD_LEN;
const cabX1 = cabX0 + CAB_LEN;
const compX0 = cabX1;
const compX1 = compX0 + COMP_LEN;
const TOTAL = compX1;

// ====== SKID (base) ======
for (let x=-1; x<=TOTAL; x++)
  for (let z=-1; z<=W; z++) {
    vox(x, 0, z, COL.SKID);
    if (x===-1 || x===TOTAL || z===-1 || z===W)
      vox(x, 1, z, COL.DARK);
  }

// ====== HOOD (stair-stepped trapezoid) ======
for (let x=0; x<HOOD_LEN; x++) {
  const p = x / HOOD_LEN;                    // 0 at outer tip, 1 at cabinet
  const yLow  = Math.round(5 - p*4);         // tip floor higher, slopes down
  const yHigh = Math.round(H - 2 - (1-p)*4); // tip top lower, slopes up
  const inset = Math.round((1-p)*3);         // walls inset at tip
  const z0 = inset, z1 = W - inset - 1;
  for (let y=yLow; y<=yHigh; y++)
    for (let z=z0; z<=z1; z++) {
      const isShell = (y===yLow || y===yHigh || z===z0 || z===z1);
      if (isShell) vox(x, y, z, COL.BEIGE);
    }
}
// Hood intake louvers (visible slats on outer face)
for (let i=0; i<5; i++) {
  const y = 8 + i*3;
  for (let z=8; z<W-8; z++) vox(0, y, z, COL.FRAME);
}
// Hood-to-cabinet flange (solid band)
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    if (y===2 || y===H-1 || z===0 || z===W-1)
      vox(HOOD_LEN, y, z, COL.BEIGE_D);

// ====== MAIN CABINET SHELL (transparent) ======
// Top + back walls only; front cut-away
for (let x=cabX0; x<cabX1; x++) {
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);     // roof
    vox(x, H+1, z, COL.BEIGE_D);   // roof edge cap
  }
  for (let y=2; y<H; y++) vox(x, y, W-1, COL.BEIGE);  // back wall
}
// Internal partition between blower and plenum
for (let y=2; y<H-1; y++)
  for (let z=2; z<W-2; z++)
    vox(cabX0 + 33, y, z, COL.PANEL);
// Full partition between cabinet and compressor bay
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(compX0, y, z, COL.BEIGE_D);

// ====== COMPRESSOR CABINET SHELL ======
for (let x=compX0; x<compX1; x++) {
  for (let z=0; z<W; z++) {
    vox(x, H,   z, COL.BEIGE);
    vox(x, H+1, z, COL.BEIGE_D);
  }
  for (let y=2; y<H; y++) vox(x, y, W-1, COL.BEIGE);
}
// Right end wall
for (let y=2; y<H; y++)
  for (let z=0; z<W; z++)
    vox(compX1, y, z, COL.BEIGE);
// Upper-front door panel (solid)
for (let x=compX0+1; x<compX1; x++)
  for (let y=Math.floor(H*0.55); y<H; y++)
    vox(x, y, 0, COL.BEIGE);
// Door seam
for (let y=Math.floor(H*0.55); y<H-1; y++)
  vox(compX0 + Math.floor(COMP_LEN/2), y, 0, COL.DARK);
// Door handles
vox(compX0 + 9,  Math.floor(H*0.72), 0, COL.SKID);
vox(compX0 + 10, Math.floor(H*0.72), 0, COL.SKID);
vox(compX0 + 18, Math.floor(H*0.72), 0, COL.SKID);
vox(compX0 + 19, Math.floor(H*0.72), 0, COL.SKID);
// Lower rear grille pattern
for (let y=3; y<Math.floor(H*0.5); y++)
  for (let x=compX0+2; x<compX1-1; x++)
    if ((x+y) % 2 === 0) vox(x, y, W-2, COL.GRILLE);

// ====== COOLING COIL (stack of plates with fins) ======
const coilX = cabX0 + 5;
for (let x=coilX; x<coilX+4; x++)
  for (let y=3; y<H-2; y++)
    for (let z=2; z<W-2; z++) {
      const isEdge = (x===coilX || x===coilX+3);
      vox(x, y, z, isEdge ? COL.COIL : COL.COIL_H);
    }
// Coil frame edges
for (let y=3; y<H-2; y++) {
  vox(coilX-1, y, 2,    COL.FRAME); vox(coilX-1, y, W-3, COL.FRAME);
  vox(coilX+4, y, 2,    COL.FRAME); vox(coilX+4, y, W-3, COL.FRAME);
}
for (let x=coilX-1; x<=coilX+4; x++) {
  vox(x, 3,   2, COL.FRAME); vox(x, H-3, 2, COL.FRAME);
  vox(x, 3, W-3, COL.FRAME); vox(x, H-3, W-3, COL.FRAME);
}
// Copper U-bends on left side
for (let i=0; i<6; i++) {
  const y = 5 + i*3;
  vox(coilX-1, y,   1, COL.COPPER);
  vox(coilX-1, y+1, 1, COL.COPPER);
  vox(coilX-2, y,   1, COL.COPPER);
  vox(coilX-2, y+1, 1, COL.COPPER);
}
// Drain pan
for (let x=coilX-1; x<coilX+5; x++)
  for (let z=2; z<W-2; z++)
    vox(x, 2, z, COL.SKID);

// ====== BLOWER SCROLL HOUSING (voxel ring, front open) ======
const bcx = cabX0 + 22;
const bcy = Math.floor(H/2) + 1;
const bcz = Math.floor(W/2);
const brOut = 9, brIn = 7;
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    const r2 = dx*dx + dy*dy;
    if (r2 <= brOut*brOut && r2 >= brIn*brIn) {
      // Only rear half of the scroll (dz >= 0) so wheel is visible
      for (let dz=0; dz<=8; dz++) vox(x, y, bcz+dz, COL.HOUSING);
    }
  }
// Back side plate
for (let x=bcx-brOut; x<=bcx+brOut; x++)
  for (let y=bcy-brOut; y<=bcy+brOut; y++) {
    const dx = x-bcx, dy = y-bcy;
    if (dx*dx + dy*dy <= brOut*brOut)
      vox(x, y, bcz+9, COL.HOUSING_D);
  }
// Outlet duct on top
for (let x=bcx-3; x<=bcx+3; x++)
  for (let y=bcy+brOut; y<bcy+brOut+4; y++)
    for (let z=bcz-6; z<=bcz+6; z++)
      if (x===bcx-3 || x===bcx+3 || z===bcz-6 || z===bcz+6 || y===bcy+brOut+3)
        vox(x, y, z, COL.HOUSING);
// Belt guard on right
for (let x=bcx+brOut-1; x<=bcx+brOut+3; x++)
  for (let y=bcy-6; y<bcy-2; y++)
    vox(x, y, bcz-7, COL.DARK);
// Motor block
for (let x=bcx+brOut+1; x<=bcx+brOut+5; x++)
  for (let y=bcy-3; y<=bcy; y++)
    for (let z=bcz-8; z<=bcz-5; z++)
      vox(x, y, z, COL.MOTOR);

// ====== COMPRESSORS (2 cylinders) ======
function buildCompressor(cx, cz) {
  const r = 4;
  // Base flange
  for (let x=cx-r-1; x<=cx+r+1; x++)
    for (let z=cz-r-1; z<=cz+r+1; z++) {
      const dx=x-cx, dz=z-cz;
      if (dx*dx+dz*dz <= (r+1)*(r+1))
        vox(x, 2, z, COL.DARK);
    }
  // Cylindrical body
  for (let y=3; y<=12; y++)
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= r*r) {
          const isShell = (d2 >= (r-1)*(r-1));
          vox(x, y, z, isShell ? COL.COMP : COL.DARK);
        }
      }
  // Hemispheric top dome
  for (let dy=0; dy<=r; dy++) {
    const rr = Math.sqrt(r*r - dy*dy);
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz;
        const d2 = dx*dx+dz*dz;
        if (d2 <= rr*rr) {
          const isShell = (d2 >= (rr-1)*(rr-1));
          if (isShell || dy===r) vox(x, 13+dy, z, COL.COMP);
        }
      }
  }
  // Copper suction + discharge lines
  for (let y=17; y<=20; y++) {
    vox(cx+1, y, cz, COL.COPPER);
    vox(cx-1, y, cz, COL.COPPER);
  }
  // Junction box on front
  for (let y=7; y<=10; y++)
    for (let x=cx-1; x<=cx+1; x++)
      vox(x, y, cz-r-1, COL.DARK);
}
buildCompressor(compX0 + 8,  Math.floor(W/2));
buildCompressor(compX0 + 20, Math.floor(W/2));

// ====== CONDENSER FAN DECK + STATIC HOUSINGS ======
// Raised deck on top of compressor cabinet
for (let x=compX0+1; x<compX1; x++)
  for (let z=1; z<W-1; z++)
    vox(x, H+2, z, COL.BEIGE_D);

function fanHousingVox(cx, cz) {
  const r = 5;
  for (let x=cx-r; x<=cx+r; x++)
    for (let z=cz-r; z<=cz+r; z++) {
      const dx=x-cx, dz=z-cz;
      const d2 = dx*dx+dz*dz;
      if (d2 <= r*r && d2 >= (r-1)*(r-1)) {
        vox(x, H+3, z, COL.HOUSING);
        vox(x, H+4, z, COL.HOUSING);
        vox(x, H+5, z, COL.HOUSING_D);
      }
      if (d2 < (r-1)*(r-1) && d2 >= (r-2)*(r-2)) {
        vox(x, H+3, z, COL.DARK);
      }
    }
}
const fanPositions = [
  [compX0 + 7,  7],
  [compX0 + 7,  W-8],
  [compX0 + 20, 7],
  [compX0 + 20, W-8],
];
fanPositions.forEach(([cx,cz]) => fanHousingVox(cx, cz));

// ====== INSTANCED MESHES ======
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const SHELL_COLORS = new Set([COL.BEIGE, COL.BEIGE_D]);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const isShell = SHELL_COLORS.has(color);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: isShell ? 0.55 : 0.5,
    metalness: isShell ? 0.15 : 0.55,
    transparent: isShell,
    opacity: isShell ? 0.2 : 1.0,
    depthWrite: !isShell,
    side: isShell ? THREE.DoubleSide : THREE.FrontSide,
  });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !isShell;
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ====== ANIMATED BLOWER WHEEL (voxel blades) ======
const blowerGroup = new THREE.Group();
blowerGroup.position.set(bcx+0.5, bcy+0.5, bcz+4.5);
const wheelMat = new THREE.MeshStandardMaterial({
  color:0xff2233, roughness:0.45, metalness:0.6,
  emissive:0xff2233, emissiveIntensity:0.4
});
// Simple squirrel cage — 16 rectangular blades around a cylindrical hub
const bladeGeo = new THREE.BoxGeometry(0.55, 1.1, 0.55);
const bladeR = 4.4;
for (let i=0; i<16; i++) {
  const a = (i/16) * Math.PI*2;
  for (let zOff=-4; zOff<=4; zOff++) {
    const blade = new THREE.Mesh(bladeGeo, wheelMat);
    blade.position.set(Math.cos(a)*bladeR, Math.sin(a)*bladeR, zOff);
    blade.rotation.z = a;
    blade.castShadow = true;
    blowerGroup.add(blade);
  }
}
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(1.4, 1.4, 9, 14),
  wheelMat
);
hub.rotation.x = Math.PI/2;
blowerGroup.add(hub);
scene.add(blowerGroup);

// ====== COMPRESSOR MOTOR TOPS (voxel, rotating) ======
const compTops = [];
function buildCompTop(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, 18.5, cz+0.5);
  const topMat = new THREE.MeshStandardMaterial({
    color:0x55555c, roughness:0.35, metalness:0.85
  });
  // Disk as ring of cubes
  for (let ax=-2; ax<=2; ax++)
    for (let az=-2; az<=2; az++)
      if (ax*ax + az*az <= 5) {
        const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.6,0.9), topMat);
        c.position.set(ax, 0, az);
        c.castShadow = true;
        g.add(c);
      }
  // Bolts
  for (let i=0; i<4; i++) {
    const a = (i/4)*Math.PI*2;
    const bolt = new THREE.Mesh(
      new THREE.BoxGeometry(0.5,0.5,0.5),
      new THREE.MeshStandardMaterial({ color:0x202024, metalness:0.7 })
    );
    bolt.position.set(Math.cos(a)*1.4, 0.5, Math.sin(a)*1.4);
    g.add(bolt);
  }
  scene.add(g);
  compTops.push(g);
}
buildCompTop(compX0 + 8,  Math.floor(W/2));
buildCompTop(compX0 + 20, Math.floor(W/2));

// ====== COMPRESSOR LED INDICATORS ======
const ledMats = [];
function makeLed(cx, cz) {
  const mat = new THREE.MeshStandardMaterial({
    color:0xff2233, emissive:0xff2233, emissiveIntensity:1.4,
    roughness:0.25, metalness:0.3
  });
  const led = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), mat);
  led.position.set(cx+0.5, 21, cz+0.5);
  scene.add(led);
  const pl = new THREE.PointLight(0xff2233, 1.2, 10);
  pl.position.copy(led.position);
  scene.add(pl);
  ledMats.push({ mat, light: pl });
}
makeLed(compX0 + 8,  Math.floor(W/2));
makeLed(compX0 + 20, Math.floor(W/2));

// ====== CONDENSER FAN BLADES (voxel, rotating) ======
const fanGroups = [];
const fanMats = [];
function makeCondenserFan(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx+0.5, H + 5.8, cz+0.5);
  const bladeMat = new THREE.MeshStandardMaterial({
    color:0xff2233, roughness:0.45, metalness:0.6,
    emissive:0xff2233, emissiveIntensity:0.4
  });
  // 5 voxel blades
  for (let i=0; i<5; i++) {
    const a = (i/5)*Math.PI*2;
    for (let rr=0; rr<=4; rr++) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.45,0.9), bladeMat);
      c.position.set(Math.cos(a)*rr, 0, Math.sin(a)*rr);
      c.castShadow = true;
      g.add(c);
    }
  }
  // Hub
  const hub = new THREE.Mesh(
    new THREE.BoxGeometry(1.4,0.7,1.4),
    new THREE.MeshStandardMaterial({ color:0x55555c, metalness:0.8 })
  );
  g.add(hub);
  scene.add(g);
  fanGroups.push(g);
  fanMats.push(bladeMat);
}
fanPositions.forEach(([cx,cz]) => makeCondenserFan(cx, cz));

// ====== STATE MACHINE ======
const COLOR_STANDBY = new THREE.Color(0x3aa6ff);
const COLOR_ON      = new THREE.Color(0x00ff66);
const COLOR_ALARM   = new THREE.Color(0xff2233);
const colorFor = s => s==='on' ? COLOR_ON : s==='alarm' ? COLOR_ALARM : COLOR_STANDBY;
const intensityFor = s => s==='on' ? 0.65 : s==='alarm' ? 0.7 : 0.45;
const state = { fan:'standby', c1:'standby', c2:'standby' };

function applyState() {
  wheelMat.color.copy(colorFor(state.fan));
  wheelMat.emissive.copy(colorFor(state.fan));
  wheelMat.emissiveIntensity = intensityFor(state.fan);

  const fanStates = [state.c1, state.c1, state.c2, state.c2];
  fanMats.forEach((m, i) => {
    m.color.copy(colorFor(fanStates[i]));
    m.emissive.copy(colorFor(fanStates[i]));
    m.emissiveIntensity = intensityFor(fanStates[i]);
  });

  [state.c1, state.c2].forEach((s, i) => {
    ledMats[i].mat.color.copy(colorFor(s));
    ledMats[i].mat.emissive.copy(colorFor(s));
    ledMats[i].mat.emissiveIntensity = s==='standby' ? 1.2 : 1.7;
    ledMats[i].light.color.copy(colorFor(s));
    ledMats[i].light.intensity = s==='standby' ? 1.0 : 1.5;
  });
}
applyState();

// UI — click cycles STANDBY → ON → ALARM → STANDBY
const CYCLE = { standby:'on', on:'alarm', alarm:'standby' };
function bind(id, key) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    state[key] = CYCLE[state[key]];
    btn.className = state[key];
    btn.textContent = state[key].toUpperCase();
    applyState();
  };
}
bind('bFan','fan');
bind('bC1','c1');
bind('bC2','c2');
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// ====== AIRFLOW PARTICLES ======
const N = 60;
const returnP = [], supplyP = [];
const pGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
const redMat  = new THREE.MeshBasicMaterial({ color:0xff5533, transparent:true, opacity:0.85 });
const blueMat = new THREE.MeshBasicMaterial({ color:0x44bbff, transparent:true, opacity:0.85 });

for (let i=0; i<N; i++) {
  const r = new THREE.Mesh(pGeo, redMat.clone());
  r.userData = { t: Math.random(), seed: Math.random()*10 };
  scene.add(r); returnP.push(r);

  const s = new THREE.Mesh(pGeo, blueMat.clone());
  s.userData = { t: Math.random(), seed: Math.random()*10 };
  scene.add(s); supplyP.push(s);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (state.fan==='on') blowerGroup.rotation.z += dt * 7;

  const fanOn = [state.c1==='on', state.c1==='on', state.c2==='on', state.c2==='on'];
  fanGroups.forEach((g, i) => { if (fanOn[i]) g.rotation.y += dt * (9 + i*0.4); });

  const compOn = [state.c1==='on', state.c2==='on'];
  compTops.forEach((m, i) => {
    if (compOn[i]) {
      m.rotation.y += dt * 12;
      m.position.y = 18.5 + Math.sin(t*30 + i)*0.15;
    } else {
      m.position.y = 18.5;
    }
  });

  returnP.forEach((p, i) => {
    if (state.fan!=='on') { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.16;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t;
    const seed = p.userData.seed;
    const yOff = ((i % 5) - 2) * 1.6;
    const zOff = ((Math.floor(i/5) % 5) - 2) * 1.6;
    p.position.x = -6 + tt * 36;
    p.position.y = 14 + yOff + Math.sin(tt*7 + seed)*0.6;
    p.position.z = W/2 + zOff + Math.cos(tt*4 + seed)*0.6;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });

  supplyP.forEach((p, i) => {
    if (state.fan!=='on') { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.18;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t;
    const seed = p.userData.seed;
    const zOff = ((i % 5) - 2) * 1.6;
    if (tt < 0.45) {
      const u = tt / 0.45;
      p.position.x = bcx + u * 24;
      p.position.y = bcy + 2 + Math.sin(u*5 + seed)*0.8;
    } else {
      const u = (tt - 0.45) / 0.55;
      p.position.x = bcx + 24 + Math.sin(u*3 + seed)*0.8;
      p.position.y = bcy + 2 + u * 12;
    }
    p.position.z = W/2 + zOff + Math.cos(tt*4 + seed)*0.6;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
