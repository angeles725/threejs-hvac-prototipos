<link rel="preconnect" href="https://fonts.googleapis.com">

  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; font-family:'Outfit',sans-serif; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:250px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; font-family:'Outfit',sans-serif; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }

  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 12px; border:1px solid; background:transparent; cursor:pointer; min-width:60px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }

<body>
<div id="info">
  <b>SISTEMA DIVIDIDO DE REFRIGERACIÓN</b><br>
  <span>Voxel Art · Vista de corte · Condensador + Evaporador</span>
</div>
<div id="legend">
  <div><i style="background:#e0962e"></i> Línea de líquido</div>
  <div><i style="background:#33d6e0"></i> Línea de succión (gas)</div>
  <div><i style="background:#ff5533"></i> Aire de retorno</div>
  <div><i style="background:#44bbff"></i> Aire de suministro</div>
</div>

  <div class="row"><label>COMPRESOR</label><button id="bComp" class="standby">STANDBY</button></div>

  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script>
// Inyectar importmap dinámicamente para evitar que middleware (Cloudflare email-protection)
// altere la cadena "paquete@version". String.fromCharCode(64) === "@".
(function(){
  const AT = String.fromCharCode(64);
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({
    imports: {
      "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three" + AT + "0.160.0/examples/jsm/"
    }
  });
  document.head.appendChild(im);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PI2 = Math.PI * 2;

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 200, 460);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(160, 118, 158);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(54, 20, 9);
controls.autoRotate = false;          // arranca OFF (evita verse espejeado al llegar atrás)
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(90, 150, 110);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-160; sc.right=160; sc.top=160; sc.bottom=-160; sc.near=1; sc.far=420;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateOnAxis(new THREE.Vector3(-1,0.5,-1).normalize(), 60));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.2).translateOnAxis(new THREE.Vector3(0,0.3,-1).normalize(), 60));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(900,900),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(900, 150, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x,y,z,color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x,y,z]);
}

const COL = {
  // chapas / shells (transparentes)
  GALV:    0xb8bcc2, GALV_D: 0x9aa0a8,
  BEIGE:   0xc8c2a8, BEIGE_D:0xa8a290,
  // estructura / detalle
  SKID:    0x9a9aa0, DARK: 0x26262b, PANEL: 0x33343c, FRAME: 0x3a3a40,
  GRILLE:  0x1a1a1e,
  // serpentines
  COIL:    0x3a6a86, COIL_H: 0x5a90b0, FIN: 0x6a7a86,
  ECOIL:   0x2b5fa8, ECOIL_H:0x4a8ad8,
  // mecánicos
  COMP:    0x3a3a42, COMP_L: 0x55555c, MOTOR: 0x4a4a52,
  HOUSING: 0x6a6a72, HOUSING_D:0x4a4a52,
  // tuberías
  COPPER:  0xb87333, INSUL: 0x2c3038,
};
const SHELL_COLORS = new Set([COL.GALV, COL.GALV_D, COL.BEIGE, COL.BEIGE_D]);

// ====== compresor reutilizable ======
function buildCompressor(cx, cz, base) {
  const r = 4;
  for (let x=cx-r-1; x<=cx+r+1; x++)
    for (let z=cz-r-1; z<=cz+r+1; z++) {
      const dx=x-cx, dz=z-cz;
      if (dx*dx+dz*dz <= (r+1)*(r+1)) vox(x, base, z, COL.DARK);
    }
  for (let y=base+1; y<=base+9; y++)
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz, d2=dx*dx+dz*dz;
        if (d2 <= r*r) { const shell = d2 >= (r-1)*(r-1); vox(x, y, z, shell?COL.COMP:COL.DARK); }
      }
  for (let dy=0; dy<=r; dy++) {
    const rr = Math.sqrt(r*r - dy*dy);
    for (let x=cx-r; x<=cx+r; x++)
      for (let z=cz-r; z<=cz+r; z++) {
        const dx=x-cx, dz=z-cz, d2=dx*dx+dz*dz;
        if (d2 <= rr*rr) { const shell = d2 >= (rr-1)*(rr-1); if (shell || dy===r) vox(x, base+10+dy, z, COL.COMP); }
      }
  }
  for (let y=base+14; y<=base+17; y++) { vox(cx+1, y, cz, COL.COPPER); vox(cx-1, y, cz, COL.COPPER); }
  for (let y=base+4; y<=base+7; y++) for (let x=cx-1; x<=cx+1; x++) vox(x, y, cz-r-1, COL.DARK);
}

// ====== tendido de tubería (line set) sin segmentos degenerados ======
function tubeRun(points, color, radius) {
  for (let i=0; i<points.length-1; i++) {
    const [ax,ay,az] = points[i], [bx,by,bz] = points[i+1];
    const dx=Math.sign(bx-ax), dy=Math.sign(by-ay), dz=Math.sign(bz-az);
    let x=ax, y=ay, z=az, guard=0;
    while ((x!==bx || y!==by || z!==bz) && guard<700) {
      for (let r=0; r<radius; r++) for (let s=0; s<radius; s++) vox(x, y+r, z+s, color);
      if (x!==bx) x+=dx; else if (y!==by) y+=dy; else if (z!==bz) z+=dz;
      guard++;
    }
    for (let r=0; r<radius; r++) for (let s=0; s<radius; s++) vox(bx, by+r, bz+s, color);
  }
}

// =================================================================
//  CONDENSADOR (unidad exterior · descarga horizontal)
// =================================================================
const CD_LEN = 26, CD_W = 26, CD_H = 28;

// base / skid
for (let x=-1; x<=CD_LEN; x++)
  for (let z=-1; z<=CD_W; z++) {
    vox(x, 0, z, COL.SKID);
    if (x===-1 || x===CD_LEN || z===-1 || z===CD_W) vox(x, 1, z, COL.DARK);
  }

// techo (chapa transparente) + remate
for (let x=0; x<CD_LEN; x++)
  for (let z=0; z<CD_W; z++) vox(x, CD_H, z, COL.BEIGE);
for (let x=0; x<CD_LEN; x++) { vox(x, CD_H+1, 0, COL.BEIGE_D); vox(x, CD_H+1, CD_W-1, COL.BEIGE_D); }

// panel sólido derecho (tapa de servicio)
for (let y=2; y<CD_H; y++) for (let z=0; z<CD_W; z++) vox(CD_LEN-1, y, z, COL.BEIGE);

// serpentín del condensador: cara trasera (z=0,1) + lateral izquierdo (x=0,1) -> coil en L
for (let x=1; x<CD_LEN-1; x++)
  for (let y=3; y<CD_H-1; y++) {
    vox(x, y, 0, (y%2===0)?COL.COIL:COL.COIL_H);
    vox(x, y, 1, COL.FIN);
  }
for (let z=2; z<CD_W-2; z++)
  for (let y=3; y<CD_H-1; y++) {
    vox(0, y, z, (y%2===0)?COL.COIL:COL.COIL_H);
    vox(1, y, z, COL.FIN);
  }

// marco de la cara de corte (cercana, z=CD_W-1)
for (let y=1; y<=CD_H; y++) { vox(0, y, CD_W-1, COL.FRAME); vox(CD_LEN-1, y, CD_W-1, COL.FRAME); }
for (let x=0; x<CD_LEN; x++) { vox(x, CD_H, CD_W-1, COL.FRAME); vox(x, 1, CD_W-1, COL.FRAME); }

// rejilla de descarga del ventilador en la cara cercana
const cfx = 13, cfy = 17, fanR = 8;
for (let x=cfx-fanR; x<=cfx+fanR; x++)
  for (let y=cfy-fanR; y<=cfy+fanR; y++) {
    const dx=x-cfx, dy=y-cfy, d2=dx*dx+dy*dy;
    if (d2 <= fanR*fanR && d2 >= (fanR-1)*(fanR-1)) vox(x, y, CD_W-1, COL.FRAME);
  }
for (let a=0; a<6; a++) {
  const ang = a/6*PI2;
  for (let rr=2; rr<fanR; rr++) {
    const x = Math.round(cfx+Math.cos(ang)*rr), y = Math.round(cfy+Math.sin(ang)*rr);
    vox(x, y, CD_W-1, COL.GRILLE);
  }
}

// compresor scroll (al fondo, sobre el piso)
const compCX=9, compCZ=9, compBase=2;
buildCompressor(compCX, compCZ, compBase);
const compTopY = compBase + 10 + 4 + 1;

// válvulas de servicio (cara derecha) -> punto de conexión del line set
for (let y=3; y<=6; y++) { vox(CD_LEN-1, y, 15, COL.COPPER); vox(CD_LEN, y, 15, COL.COPPER); } // succión
for (let y=3; y<=5; y++) { vox(CD_LEN-1, y, 18, COL.COPPER); vox(CD_LEN, y, 18, COL.COPPER); } // líquido

// =================================================================
//  EVAPORADOR (unidad interior · fan coil de ducto)
// =================================================================
const EV_X0 = 56, EV_LEN = 52, EV_W = 22, EV_H = 16;
const EV_X1 = EV_X0 + EV_LEN;     // 108
const EV_LIFT = 22;                       // elevación: colgado del techo
const EB = 2 + EV_LIFT, ET = EV_H + EV_LIFT;   // piso y techo del gabinete (suspendido)

// varillas roscadas de suspensión (4 esquinas, hacia el techo)
[[EV_X0+1,1],[EV_X0+1,EV_W-2],[EV_X1-2,1],[EV_X1-2,EV_W-2]].forEach(([lx,lz])=>{
  for (let y=ET+1; y<=ET+7; y++) vox(lx, y, lz, COL.HOUSING_D);
});

// techo + piso (chapa transparente)
for (let x=EV_X0; x<EV_X1; x++)
  for (let z=0; z<EV_W; z++) { vox(x, ET, z, COL.GALV); vox(x, EB, z, COL.GALV); }
// pared trasera (z=0)
for (let x=EV_X0; x<EV_X1; x++)
  for (let y=EB+1; y<ET; y++) vox(x, y, 0, COL.GALV);

// marco de la cara de corte (cercana, z=EV_W-1)
for (let y=EB; y<=ET; y++) { vox(EV_X0, y, EV_W-1, COL.FRAME); vox(EV_X1-1, y, EV_W-1, COL.FRAME); }
for (let x=EV_X0; x<EV_X1; x++) { vox(x, ET, EV_W-1, COL.FRAME); vox(x, EB, EV_W-1, COL.FRAME); }

// reja de retorno (extremo izquierdo) — patrón de filtro
for (let y=EB+1; y<ET; y++)
  for (let z=1; z<EV_W-1; z++)
    if ((y+z)%2===0) vox(EV_X0, y, z, COL.FRAME);

// serpentín del evaporador (slab azul) + charola + cobre
const ecoilX = EV_X0 + 6;
for (let x=ecoilX; x<ecoilX+3; x++)
  for (let y=EB+1; y<ET; y++)
    for (let z=2; z<EV_W-2; z++)
      vox(x, y, z, (y%2===0)?COL.ECOIL:COL.ECOIL_H);
for (let x=ecoilX-1; x<ecoilX+4; x++)
  for (let z=2; z<EV_W-2; z++) vox(x, EB, z, COL.SKID);          // charola
for (let i=0; i<4; i++) {
  const y = EB+2 + i*3;
  vox(ecoilX-1, y, EV_W-2, COL.COPPER); vox(ecoilX-1, y+1, EV_W-2, COL.COPPER);
}

// soplador centrífugo (jaula de ardilla) en la mitad de descarga
const ebx = EV_X0 + 34, eby = EB + 7, ebz = Math.floor(EV_W/2);
const ebRout = 6, ebRin = 4;
for (let x=ebx-ebRout; x<=ebx+ebRout; x++)
  for (let y=eby-ebRout; y<=eby+ebRout; y++) {
    const dx=x-ebx, dy=y-eby, r2=dx*dx+dy*dy;
    if (r2 <= ebRout*ebRout && r2 >= ebRin*ebRin) {
      const ang = Math.atan2(dy, dx);
      const isOutlet = (ang > -0.2 && ang < 1.1);     // sector de salida hacia +X / arriba: abierto
      if (!isOutlet) for (let z=0; z<=ebz; z++) vox(x, y, z, COL.HOUSING);
    }
  }
for (let x=ebx-ebRout; x<=ebx+ebRout; x++)
  for (let y=eby-ebRout; y<=eby+ebRout; y++) {
    const dx=x-ebx, dy=y-eby;
    if (dx*dx+dy*dy <= ebRout*ebRout) vox(x, y, 0, COL.HOUSING_D);   // placa trasera
  }
// motor (bloque detrás de la placa)
for (let x=ebx-2; x<=ebx+2; x++)
  for (let y=eby-2; y<=eby+2; y++) vox(x, y, -1, COL.MOTOR);

// plenum / collarín de descarga (extremo derecho)
for (let y=EB+2; y<ET-1; y++)
  for (let z=2; z<EV_W-2; z++)
    if (y===EB+2 || y===ET-2 || z===2 || z===EV_W-3) vox(EV_X1-1, y, z, COL.GALV_D);
for (let y=EB+3; y<ET-2; y++)
  for (let z=3; z<EV_W-3; z++) vox(EV_X1, y, z, COL.DARK);

// caja de control (cara cercana, extremo izquierdo)
for (let x=EV_X0+1; x<=EV_X0+6; x++)
  for (let y=EB+1; y<=EB+5; y++) vox(x, y, EV_W-1, COL.PANEL);

// conexiones de refrigerante (extremo izquierdo, hacia el line set)
for (let y=EB+4; y<=EB+6; y++) { vox(EV_X0-1, y, 15, COL.COPPER); }
for (let y=EB+5; y<=EB+7; y++) { vox(EV_X0-1, y, 18, COL.COPPER); }

// =================================================================
//  LINE SET (succión aislada + línea de líquido)
// =================================================================
const suctionPts = [[CD_LEN,4,15],[CD_LEN,EB+5,15],[EV_X0-1,EB+5,15],[EV_X0,EB+5,15]];
const liquidPts  = [[CD_LEN,4,18],[CD_LEN,EB+6,18],[EV_X0-1,EB+6,18],[EV_X0,EB+6,18]];
tubeRun(suctionPts, COL.INSUL, 2);
tubeRun(liquidPts,  COL.COPPER, 1);

// =================================================================
//  INSTANCED MESHES (voxels estáticos)
// =================================================================
const cubeGeo = new THREE.BoxGeometry(1,1,1);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  const isShell = SHELL_COLORS.has(color);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: isShell ? 0.55 : 0.5,
    metalness: isShell ? 0.12 : 0.55,
    transparent: isShell,
    opacity: isShell ? 0.22 : 1.0,
    depthWrite: !isShell,
    side: isShell ? THREE.DoubleSide : THREE.FrontSide,
  });
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !isShell;
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => { m.setPosition(p[0]+0.5, p[1]+0.5, p[2]+0.5); mesh.setMatrixAt(i, m); });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// =================================================================
//  PARTES ANIMADAS (Mesh regular, fuera del InstancedMesh)
// =================================================================
// --- ventilador axial del condensador (eje Z) ---
const condFanGroup = new THREE.Group();
condFanGroup.position.set(cfx+0.5, cfy+0.5, CD_W-3.5);
const condFanMat = new THREE.MeshStandardMaterial({ color:0xff2233, roughness:0.45, metalness:0.6, emissive:0xff2233, emissiveIntensity:0.4 });
for (let i=0; i<6; i++) {
  const a = i/6*PI2;
  for (let rr=1; rr<=fanR-2; rr++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.9,0.45), condFanMat);
    c.position.set(Math.cos(a)*rr, Math.sin(a)*rr, 0);
    c.rotation.z = a + 0.5;
    c.castShadow = true;
    condFanGroup.add(c);
  }
}
condFanGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,0.9), new THREE.MeshStandardMaterial({ color:0x55555c, metalness:0.8 })));
scene.add(condFanGroup);

// --- rotor del compresor (eje Y, con vibración) ---
const compTop = new THREE.Group();
compTop.position.set(compCX+0.5, compTopY, compCZ+0.5);
const compTopMat = new THREE.MeshStandardMaterial({ color:0x55555c, roughness:0.35, metalness:0.85, emissive:0x000000, emissiveIntensity:0.0 });
for (let ax=-2; ax<=2; ax++)
  for (let az=-2; az<=2; az++)
    if (ax*ax+az*az <= 5) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.6,0.9), compTopMat);
      c.position.set(ax, 0, az); c.castShadow = true; compTop.add(c);
    }
scene.add(compTop);

// LED indicador del compresor
const compLedMat = new THREE.MeshStandardMaterial({ color:0x3aa6ff, emissive:0x3aa6ff, emissiveIntensity:1.2, roughness:0.25, metalness:0.3 });
const compLed = new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1), compLedMat);
compLed.position.set(compCX+0.5, compTopY+2.5, compCZ+0.5);
scene.add(compLed);
const compLight = new THREE.PointLight(0x3aa6ff, 1.0, 14);
compLight.position.copy(compLed.position);
scene.add(compLight);

// --- rotor del soplador del evaporador (jaula de ardilla, eje Z) ---
const blowerGroup = new THREE.Group();
blowerGroup.position.set(ebx+0.5, eby+0.5, ebz+2.5);
const blowerMat = new THREE.MeshStandardMaterial({ color:0xff2233, roughness:0.45, metalness:0.6, emissive:0xff2233, emissiveIntensity:0.4 });
const bladeGeo = new THREE.BoxGeometry(0.5,1.0,0.5);
const wR = 3.6;
for (let i=0; i<16; i++) {
  const a = i/16*PI2;
  for (let zo=-3; zo<=3; zo++) {
    const b = new THREE.Mesh(bladeGeo, blowerMat);
    b.position.set(Math.cos(a)*wR, Math.sin(a)*wR, zo);
    b.rotation.z = a; b.castShadow = true;
    blowerGroup.add(b);
  }
}
const bhub = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,7,14), blowerMat);
bhub.rotation.x = Math.PI/2;
blowerGroup.add(bhub);
scene.add(blowerGroup);

// =================================================================
//  MÁQUINA DE ESTADOS (STANDBY → ON → ALARM)
// =================================================================
const COLOR_STANDBY = new THREE.Color(0x3aa6ff);
const COLOR_ON      = new THREE.Color(0x00ff66);
const COLOR_ALARM   = new THREE.Color(0xff2233);
const colorFor = s => s==='on' ? COLOR_ON : s==='alarm' ? COLOR_ALARM : COLOR_STANDBY;
const intensityFor = s => s==='on' ? 0.65 : s==='alarm' ? 0.7 : 0.45;
const state = { comp:'standby', fans:'standby' };

function applyState() {
  // ventilador del condensador
  condFanMat.color.copy(colorFor(state.fans));
  condFanMat.emissive.copy(colorFor(state.fans));
  condFanMat.emissiveIntensity = intensityFor(state.fans);
  // soplador del evaporador
  blowerMat.color.copy(colorFor(state.fans));
  blowerMat.emissive.copy(colorFor(state.fans));
  blowerMat.emissiveIntensity = intensityFor(state.fans);
  // compresor (LED + rotor brilla un poco)
  compLedMat.color.copy(colorFor(state.comp));
  compLedMat.emissive.copy(colorFor(state.comp));
  compLedMat.emissiveIntensity = state.comp==='standby' ? 1.2 : 1.7;
  compLight.color.copy(colorFor(state.comp));
  compLight.intensity = state.comp==='standby' ? 1.0 : 1.6;
  compTopMat.emissive.copy(colorFor(state.comp));
  compTopMat.emissiveIntensity = state.comp==='standby' ? 0.0 : 0.25;
}
applyState();

const CYCLE = { standby:'on', on:'alarm', alarm:'standby' };
function bind(id, key) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    state[key] = CYCLE[state[key]];
    btn.className = state[key];
    btn.textContent = state[key].toUpperCase();
    applyState();
  };
}
bind('bComp','comp');
bind('bFans','fans');
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// =================================================================
//  PARTÍCULAS
// =================================================================
function makePath(pts) {
  const segs = []; let total = 0;
  for (let i=0; i<pts.length-1; i++) {
    const a = new THREE.Vector3(pts[i][0]+0.5,   pts[i][1]+0.5,   pts[i][2]+0.5);
    const b = new THREE.Vector3(pts[i+1][0]+0.5, pts[i+1][1]+0.5, pts[i+1][2]+0.5);
    const len = a.distanceTo(b);
    segs.push({ a, b, len, acc: total }); total += len;
  }
  return { segs, total: Math.max(total, 1e-6) };
}
function pathPos(path, t, out) {
  const d = t * path.total;
  for (let i=0; i<path.segs.length; i++) {
    const s = path.segs[i];
    if (d <= s.acc + s.len || i === path.segs.length-1) {
      const u = Math.min(1, (d - s.acc) / Math.max(s.len, 1e-6));
      out.lerpVectors(s.a, s.b, u); return;
    }
  }
}
const liquidPath  = makePath(liquidPts);                     // condensador -> evaporador
const suctionPath = makePath([...suctionPts].reverse());     // evaporador -> condensador

const pGeo = new THREE.BoxGeometry(0.6,0.6,0.6);
function mkParticles(n, color) {
  const arr = [];
  const baseMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.85 });
  for (let i=0; i<n; i++) {
    const m = new THREE.Mesh(pGeo, baseMat.clone());
    m.userData = { t: i/n, seed: Math.random()*10 };
    scene.add(m); arr.push(m);
  }
  return arr;
}
const liquidP  = mkParticles(28, 0xe0962e);
const suctionP = mkParticles(28, 0x33d6e0);
const returnP  = mkParticles(30, 0xff5533);
const supplyP  = mkParticles(30, 0x44bbff);
const tmp = new THREE.Vector3();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// =================================================================
//  ANIMATE
// =================================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (state.fans==='on') { condFanGroup.rotation.z += dt * 9; blowerGroup.rotation.z += dt * 8; }
  if (state.comp==='on') {
    compTop.rotation.y += dt * 12;
    compTop.position.y = compTopY + Math.sin(t*30)*0.15;
  } else {
    compTop.position.y = compTopY;
  }

  // refrigerante (gated por compresor)
  const flow = state.comp==='on';
  liquidP.forEach(p => {
    if (!flow) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.22; if (p.userData.t > 1) p.userData.t -= 1;
    pathPos(liquidPath, p.userData.t, tmp); p.position.copy(tmp);
    p.material.opacity = 0.9;
  });
  suctionP.forEach(p => {
    if (!flow) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.2; if (p.userData.t > 1) p.userData.t -= 1;
    pathPos(suctionPath, p.userData.t, tmp); p.position.copy(tmp);
    p.material.opacity = 0.9;
  });

  // aire interior (gated por ventilador del evaporador)
  const air = state.fans==='on';
  returnP.forEach((p, i) => {
    if (!air) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.3; if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const zo = ((i % 5) - 2) * 2.2, yo = ((Math.floor(i/5) % 3) - 1) * 2.2;
    p.position.x = (EV_X0 - 8) + tt * (ecoilX - EV_X0 + 8);
    p.position.y = eby + yo + Math.sin(tt*6 + seed)*0.5;
    p.position.z = ebz + zo + Math.cos(tt*4 + seed)*0.5;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });
  supplyP.forEach((p, i) => {
    if (!air) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.32; if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const zo = ((i % 5) - 2) * 2.0, yo = ((Math.floor(i/5) % 3) - 1) * 2.0;
    p.position.x = (ebx + 4) + tt * (EV_X1 + 10 - ebx - 4);
    p.position.y = eby + yo + Math.sin(tt*5 + seed)*0.6;
    p.position.z = ebz + zo + Math.cos(tt*4 + seed)*0.6;
    p.material.opacity = Math.sin(tt*Math.PI) * 0.85;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
