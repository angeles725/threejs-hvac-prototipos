<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CAJA VAV · Voxel Art</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter:blur(6px); z-index:10; }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter:blur(6px); z-index:10; }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter:blur(6px); z-index:10; }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:230px; font-size:11px; backdrop-filter:blur(6px); z-index:10; }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:54px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
</head>
<body>
<div id="info">
  <b>CAJA VAV FAN-POWERED</b><br>
  <span>Voxel Art · Vista en Corte · Cooling Coil</span>
</div>
<div id="legend">
  <div><i style="background:#ff4422"></i> Aire primario (entrada)</div>
  <div><i style="background:#44aaff"></i> Aire de suministro (salida)</div>
  <div><i style="background:#66ccff"></i> Agua helada (cooling)</div>
</div>
<div id="ctl">DRAG: Rotar &middot; WHEEL: Zoom &middot; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>DAMPER</label><button id="bDamp" class="off">CLOSED</button></div>
  <div class="row"><label>SUPPLY FAN</label><button id="bFan" class="off">OFF</button></div>
  <div class="row"><label>COOLING COIL</label><button id="bCool" class="off">OFF</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ====== PHASE 1: VAV_MATS PALETTE (M01–M15) ======
const VAV_MATS = {};

// M01: galvanized steel — casing
VAV_MATS.M01 = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.45, metalness: 0.85 });

// M02: aluminum — fan wheel
VAV_MATS.M02 = new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.35, metalness: 0.90 });

// M03: copper coil — coil tubes/pipes with procedural fin texture
const coilFinTex = (() => {
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 });
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a7090'; ctx.fillRect(0, 0, 256, 256);
  // Horizontal fin ridges
  for (let y = 0; y < 256; y += 6) {
    const g = ctx.createLinearGradient(0, y, 0, y + 3);
    g.addColorStop(0, 'rgba(70, 110, 140, 0)');
    g.addColorStop(0.4, 'rgba(80, 125, 160, 0.6)');
    g.addColorStop(0.6, 'rgba(90, 135, 170, 0.7)');
    g.addColorStop(1, 'rgba(70, 110, 140, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, y, 256, 3);
  }
  // Vertical tube hints
  for (let x = 16; x < 256; x += 32) {
    const g = ctx.createLinearGradient(x, 0, x + 4, 0);
    g.addColorStop(0, 'rgba(184, 115, 51, 0)');
    g.addColorStop(0.5, 'rgba(184, 115, 51, 0.35)');
    g.addColorStop(1, 'rgba(184, 115, 51, 0)');
    ctx.fillStyle = g; ctx.fillRect(x - 2, 0, 4, 256);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; // feeds .map (color data)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  return t;
})();
VAV_MATS.M03 = new THREE.MeshStandardMaterial({ color: 0xb87333, roughness: 0.32, metalness: 0.92, map: coilFinTex });
VAV_MATS.M03.bumpMap = coilFinTex; VAV_MATS.M03.bumpScale = 0.2;

// M04: insulation — foam panels with fibrous ridge texture
const insulationTex = (() => {
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 });
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#dddddd'; ctx.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 8) {
    const g = ctx.createLinearGradient(0, y, 0, y + 5);
    g.addColorStop(0, 'rgba(220, 220, 220, 0)');
    g.addColorStop(0.3, 'rgba(200, 200, 200, 0.5)');
    g.addColorStop(0.6, 'rgba(190, 190, 190, 0.55)');
    g.addColorStop(1, 'rgba(220, 220, 220, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, y, 256, 6);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; // feeds .map (color data)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  return t;
})();
VAV_MATS.M04 = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.75, metalness: 0.10, map: insulationTex });
VAV_MATS.M04.bumpMap = insulationTex; VAV_MATS.M04.bumpScale = 0.15;

// M05: plastic — controller box
VAV_MATS.M05 = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.60, metalness: 0.20 });

// M06: glass — MeshPhysicalMaterial viewport
// opacity:1 required alongside transmission (see MeshPhysicalMaterial docs)
VAV_MATS.M06 = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.05, metalness: 0.0,
  transmission: 0.92, ior: 1.45, thickness: 0.1,
  transparent: true, opacity: 1
});

// M07: steel damper blades
VAV_MATS.M07 = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.40, metalness: 0.85 });

// M08: aluminum duct — inlet/outlet
VAV_MATS.M08 = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.40, metalness: 0.85 });

// M09: rubber gasket
VAV_MATS.M09 = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.65, metalness: 0.15 });

// M10: brass actuator — damper motor
VAV_MATS.M10 = new THREE.MeshStandardMaterial({ color: 0xddaa44, roughness: 0.35, metalness: 0.85 });

// M11: structural steel — frame, hanging rods
VAV_MATS.M11 = new THREE.MeshStandardMaterial({ color: 0x606068, roughness: 0.42, metalness: 0.85 });

// M12: bolt — rivet detail
VAV_MATS.M12 = new THREE.MeshStandardMaterial({ color: 0x505058, roughness: 0.35, metalness: 0.90 });

// M13: paint — access panel
VAV_MATS.M13 = new THREE.MeshStandardMaterial({ color: 0x9a9488, roughness: 0.50, metalness: 0.30 });

// M14: LED emissive
VAV_MATS.M14 = new THREE.MeshStandardMaterial({
  color: 0xff2233, emissive: 0xff2233, emissiveIntensity: 1.4,
  roughness: 0.20, metalness: 0.30
});

// M15: concrete base — drain pan
VAV_MATS.M15 = new THREE.MeshStandardMaterial({ color: 0x505058, roughness: 0.85, metalness: 0.05 });

// ====== COLOR → MATERIAL KEY MAPPING ======
const COL_MAT = {
  [0xb8b2a0]: 'M01', // SHELL
  [0x9a9488]: 'M01', // SHELL_D
  [0xa8a296]: 'M01', // SHELL_TOP
  [0x8a8a90]: 'M08', // DUCT
  [0x6a6a72]: 'M08', // DUCT_D
  [0x606068]: 'M11', // FLANGE
  [0x404048]: 'M12', // RIVET
  [0x2a2a2e]: 'M11', // DARK
  [0x3a3a3e]: 'M11', // FRAME
  [0x6a6a72]: 'M01', // HOUSING
  [0x4a4a52]: 'M01', // HOUSING_D
  [0x55555c]: 'M10', // MOTOR
  [0x404048]: 'M12', // MOTOR_D
  [0x2a5a72]: 'M04', // COIL (insulation blue-grey)
  [0x3a7090]: 'M04', // COIL_H
  [0x5088a8]: 'M04', // COIL_FIN
  [0xb87333]: 'M03', // COPPER
  [0x8a5522]: 'M03', // COPPER_D
  [0xc49520]: 'M10', // ACT (brass)
  [0x906d18]: 'M10', // ACT_D
  [0xd4a830]: 'M10', // ACT_L
  [0x3a3a44]: 'M05', // CTRL
  [0x555560]: 'M05', // CTRL_L
  [0x707078]: 'M05', // SENSOR
  [0x1a1a1e]: 'M07', // GRILLE
  [0x4a4a50]: 'M04', // INSUL
  [0x9a9488]: 'M13', // PANEL
  [0x222228]: 'M09', // GASKET
  [0x505058]: 'M15', // DRAIN
};

// Shell-transparent colors (opacity < 1.0)
const SHELL_COLORS = new Set([0xb8b2a0, 0x9a9488, 0xa8a296]);

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 130, 340);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 800);
camera.position.set(85, 60, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05; // Phase 4: upgraded from 1.1
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Canvas appended via container div in ResizeObserver section below

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
// Apply environment to metallic materials M01–M10, M11
['M01','M02','M03','M04','M05','M07','M08','M09','M10','M11'].forEach(k => {
  if (VAV_MATS[k]) VAV_MATS[k].environment = scene.environment;
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(32, 14, 14);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// ====== LIGHTS ======
scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(50, 100, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -100; sc.right = 100; sc.top = 100; sc.bottom = -100; sc.near = 1; sc.far = 300;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.35).translateOnAxis(new THREE.Vector3(-1, 0.5, -1).normalize(), 50));
scene.add(new THREE.DirectionalLight(0x00d4aa, 0.18).translateOnAxis(new THREE.Vector3(0, 0.3, -1).normalize(), 50));

// ====== GROUND ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x0a0e16, roughness: 0.92, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(500, 100, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12; grid.material.transparent = true; grid.position.y = -0.49;
scene.add(grid);

// ====== VOXEL BUILDER ======
const voxData = {};
function vox(x, y, z, color) {
  const k = color.toString();
  if (!voxData[k]) voxData[k] = { color, positions: [] };
  voxData[k].positions.push([x, y, z]);
}

const COL = {
  SHELL:     0xb8b2a0,
  SHELL_D:   0x9a9488,
  SHELL_TOP: 0xa8a296,
  DUCT:      0x8a8a90,
  DUCT_D:    0x6a6a72,
  FLANGE:    0x606068,
  RIVET:     0x404048,
  DARK:      0x2a2a2e,
  FRAME:     0x3a3a3e,
  HOUSING:   0x6a6a72,
  HOUSING_D: 0x4a4a52,
  MOTOR:     0x55555c,
  MOTOR_D:   0x404048,
  COIL:      0x2a5a72,
  COIL_H:    0x3a7090,
  COIL_FIN:  0x5088a8,
  COPPER:    0xb87333,
  COPPER_D:  0x8a5522,
  ACT:       0xc49520,
  ACT_D:     0x906d18,
  ACT_L:     0xd4a830,
  CTRL:      0x3a3a44,
  CTRL_L:    0x555560,
  SENSOR:    0x707078,
  GRILLE:    0x1a1a1e,
  INSUL:     0x4a4a50,
  PANEL:     0x9a9488,
  GASKET:    0x222228,
  DRAIN:     0x505058,
};

const W = 28, H = 28, DUCT_R = 8, DCY = 14, DCZ = 14;
const IN_X0 = 52, IN_X1 = 65, DM_X0 = 38, DM_X1 = 52, CL_X0 = 26, CL_X1 = 38;
const FN_X0 = 12, FN_X1 = 26, OT_X0 = 0, OT_X1 = 12;
const CASE_X0 = OT_X1, CASE_X1 = IN_X0;

// INLET DUCT
for (let x = IN_X0; x < IN_X1; x++)
  for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
    for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
      const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
      if (d2 <= DUCT_R * DUCT_R && d2 >= (DUCT_R - 1) * (DUCT_R - 1)) vox(x, y, z, COL.DUCT);
      if (d2 < (DUCT_R - 1) * (DUCT_R - 1) && d2 >= (DUCT_R - 2) * (DUCT_R - 2) && x % 8 < 1) vox(x, y, z, COL.DUCT_D);
    }
for (const sx of [IN_X0 + 2, IN_X0 + 7])
  for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
    for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
      const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
      if (d2 <= (DUCT_R + 1) * (DUCT_R + 1) && d2 >= DUCT_R * DUCT_R) vox(sx, y, z, COL.DUCT_D);
    }
for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
  for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
    const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
    if (d2 <= (DUCT_R + 1) * (DUCT_R + 1) && d2 >= (DUCT_R - 1) * (DUCT_R - 1)) {
      vox(IN_X1 - 1, y, z, COL.FLANGE); vox(IN_X1 - 2, y, z, COL.FLANGE);
    }
    if (d2 >= DUCT_R * DUCT_R && d2 <= (DUCT_R + 1) * (DUCT_R + 1)) {
      const ang = Math.atan2(z - DCZ, y - DCY);
      const idx = Math.round((ang + Math.PI) / (Math.PI * 2) * 12);
      if (idx % 3 === 0) vox(IN_X1 - 1, y, z, COL.RIVET);
    }
  }

// OUTLET DUCT
for (let x = OT_X0; x < OT_X1; x++)
  for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
    for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
      const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
      if (d2 <= DUCT_R * DUCT_R && d2 >= (DUCT_R - 1) * (DUCT_R - 1)) vox(x, y, z, COL.DUCT);
      if (d2 < (DUCT_R - 1) * (DUCT_R - 1) && d2 >= (DUCT_R - 2) * (DUCT_R - 2) && x % 8 < 1) vox(x, y, z, COL.DUCT_D);
    }
for (const sx of [OT_X0 + 3, OT_X0 + 8])
  for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
    for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
      const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
      if (d2 <= (DUCT_R + 1) * (DUCT_R + 1) && d2 >= DUCT_R * DUCT_R) vox(sx, y, z, COL.DUCT_D);
    }
for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
  for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
    const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
    if (d2 <= (DUCT_R + 1) * (DUCT_R + 1) && d2 >= (DUCT_R - 1) * (DUCT_R - 1)) {
      vox(OT_X0, y, z, COL.FLANGE); vox(OT_X0 + 1, y, z, COL.FLANGE);
    }
  }

// CASING
for (let x = CASE_X0; x <= CASE_X1; x++) {
  for (let z = 0; z < W; z++) {
    vox(x, 0, z, COL.SHELL_D); vox(x, 1, z, COL.FRAME);
    vox(x, H - 1, z, COL.SHELL_TOP); vox(x, H, z, COL.SHELL_D);
  }
  vox(x, H - 1, 0, COL.FRAME);
}
for (let y = 2; y < H - 1; y++)
  for (let z = 0; z < W; z++) { vox(CASE_X0, y, z, COL.SHELL_D); vox(CASE_X1, y, z, COL.SHELL_D); }
for (let x = CASE_X0; x <= CASE_X1; x++) { vox(x, 1, 0, COL.FRAME); }

// ACCESS PANEL
for (let x = FN_X0 + 2; x < FN_X1 - 2; x++)
  for (let y = 3; y < 8; y++) {
    const isE = (x === FN_X0 + 2 || x === FN_X1 - 3 || y === 3 || y === 7);
    vox(x, y, 0, isE ? COL.FRAME : COL.SHELL);
  }
vox(FN_X0 + 6, 5, 0, COL.DUCT_D); vox(FN_X0 + 7, 5, 0, COL.DUCT_D);
vox(FN_X0 + 2, 5, 0, COL.RIVET); vox(FN_X1 - 3, 5, 0, COL.RIVET);

// TRANSITION COLLARS
function collar(xP) {
  for (let y = DCY - DUCT_R - 1; y <= DCY + DUCT_R + 1; y++)
    for (let z = DCZ - DUCT_R - 1; z <= DCZ + DUCT_R + 1; z++) {
      const d2 = (y - DCY) ** 2 + (z - DCZ) ** 2;
      if (d2 <= (DUCT_R + 1) * (DUCT_R + 1) && d2 >= (DUCT_R - 1) * (DUCT_R - 1)) {
        vox(xP, y, z, COL.FLANGE); vox(xP + 1, y, z, COL.GASKET);
      }
    }
}
collar(IN_X0 - 1); collar(OT_X1 - 1);

// INTERNAL PARTITIONS
for (let y = 2; y < H - 1; y++)
  for (let z = Math.floor(W * 0.55); z < W - 2; z++) {
    vox(CL_X1, y, z, COL.PANEL); vox(FN_X1, y, z, COL.PANEL);
  }

// DAMPER FRAME
const dampCX = Math.floor((DM_X0 + DM_X1) / 2);
for (let y = 4; y < H - 4; y++) {
  vox(dampCX - 1, y, 3, COL.FRAME); vox(dampCX, y, 3, COL.FRAME);
  vox(dampCX - 1, y, W - 4, COL.FRAME); vox(dampCX, y, W - 4, COL.FRAME);
}
for (let z = 3; z < W - 3; z++) {
  vox(dampCX - 1, 4, z, COL.FRAME); vox(dampCX, 4, z, COL.FRAME);
  vox(dampCX - 1, H - 5, z, COL.FRAME); vox(dampCX, H - 5, z, COL.FRAME);
}
for (let y = 4; y < H - 4; y++) {
  vox(dampCX + 1, y, 3, COL.GASKET); vox(dampCX + 1, y, W - 4, COL.GASKET);
  vox(dampCX - 2, y, 3, COL.GASKET); vox(dampCX - 2, y, W - 4, COL.GASKET);
}

// ACTUATOR
const actCX = dampCX, actCZ = Math.floor(W / 2);
for (let x = actCX - 3; x <= actCX + 3; x++)
  for (let z = actCZ - 3; z <= actCZ + 3; z++) vox(x, H - 1, z, COL.FRAME);
for (let y = H - 2; y <= H + 1; y++) { vox(actCX, y, actCZ, COL.MOTOR_D); vox(actCX, y, actCZ + 1, COL.MOTOR_D); }
for (let x = actCX - 3; x <= actCX + 3; x++)
  for (let y = H + 1; y <= H + 5; y++)
    for (let z = actCZ - 3; z <= actCZ + 3; z++) {
      const isC = (x === actCX - 3 || x === actCX + 3) && (z === actCZ - 3 || z === actCZ + 3);
      const isT = y === H + 5;
      const isS = (x === actCX - 3 || x === actCX + 3 || z === actCZ - 3 || z === actCZ + 3 || isT);
      vox(x, y, z, isC ? COL.ACT_D : isS ? COL.ACT : COL.ACT_D);
    }
for (let x = actCX - 1; x <= actCX + 1; x++) vox(x, H + 3, actCZ - 3, COL.ACT_L);
for (const [dx, dz] of [[-3, -3], [-3, 3], [3, -3], [3, 3]]) vox(actCX + dx, H + 1, actCZ + dz, COL.RIVET);
for (let y = H; y <= H + 1; y++) vox(actCX + 4, y, actCZ, COL.CTRL);

// COOLING COIL
const coilCX = Math.floor((CL_X0 + CL_X1) / 2);
for (let x = coilCX - 2; x <= coilCX + 2; x++)
  for (let y = 5; y < H - 5; y++)
    for (let z = 4; z < W - 4; z++) {
      const layer = x - (coilCX - 2);
      if (layer === 0 || layer === 4) vox(x, y, z, COL.COIL);
      else if (y % 2 === 0) vox(x, y, z, COL.COIL_FIN);
      else vox(x, y, z, COL.COIL_H);
    }
for (let y = 4; y < H - 4; y++) {
  vox(coilCX - 3, y, 4, COL.FRAME); vox(coilCX - 3, y, W - 5, COL.FRAME);
  vox(coilCX + 3, y, 4, COL.FRAME); vox(coilCX + 3, y, W - 5, COL.FRAME);
}
for (let x = coilCX - 3; x <= coilCX + 3; x++) {
  vox(x, 4, 4, COL.FRAME); vox(x, H - 5, 4, COL.FRAME);
  vox(x, 4, W - 5, COL.FRAME); vox(x, H - 5, W - 5, COL.FRAME);
}
for (let i = 0; i < 7; i++) {
  const y = 6 + i * 2;
  vox(coilCX - 3, y, 3, COL.COPPER); vox(coilCX - 3, y + 1, 3, COL.COPPER);
  vox(coilCX - 4, y, 3, COL.COPPER); vox(coilCX - 4, y + 1, 3, COL.COPPER);
  vox(coilCX - 4, y, 2, COL.COPPER); vox(coilCX - 4, y + 1, 2, COL.COPPER);
  vox(coilCX + 3, y, 3, COL.COPPER); vox(coilCX + 3, y + 1, 3, COL.COPPER);
  vox(coilCX + 4, y, 3, COL.COPPER); vox(coilCX + 4, y + 1, 3, COL.COPPER);
}
for (let y = 2; y <= H - 4; y++) { vox(coilCX + 3, y, 5, COL.COPPER); vox(coilCX + 3, y, 8, COL.COPPER); }
for (const z of [5, 8]) {
  vox(coilCX + 3, 1, z, COL.COPPER_D); vox(coilCX + 3, 0, z, COL.COPPER_D);
  vox(coilCX + 4, 1, z, COL.MOTOR_D); vox(coilCX + 4, 0, z, COL.MOTOR_D);
  vox(coilCX + 5, 0, z, COL.MOTOR);
}
for (let x = coilCX - 3; x <= coilCX + 3; x++)
  for (let z = 4; z < W - 4; z++) {
    vox(x, 2, z, COL.DRAIN);
    if (x === coilCX - 3 || x === coilCX + 3 || z === 4 || z === W - 5) vox(x, 3, z, COL.DRAIN);
  }
for (let y = 0; y <= 2; y++) vox(coilCX - 3, y, W - 6, COL.DRAIN);
vox(coilCX - 4, 0, W - 6, COL.DRAIN); vox(coilCX - 5, 0, W - 6, COL.DRAIN);

// FAN SCROLL HOUSING
const fanCX = Math.floor((FN_X0 + FN_X1) / 2), fanCY = DCY, fanCZ = DCZ;
const fRout = 8, fRin = 6;
for (let y = fanCY - fRout; y <= fanCY + fRout; y++)
  for (let z = fanCZ - fRout; z <= fanCZ + fRout; z++) {
    const dy = y - fanCY, dz = z - fanCZ, d2 = dy * dy + dz * dz;
    if (d2 <= fRout * fRout && d2 >= fRin * fRin)
      for (let dx = 1; dx <= 6; dx++) vox(fanCX + dx, y, z, COL.HOUSING);
    if (dy > 3 && d2 <= (fRout + 2) * (fRout + 2) && d2 >= fRout * fRout && Math.abs(dz) < 3)
      for (let dx = 1; dx <= 5; dx++) vox(fanCX + dx, y, z, COL.HOUSING);
  }
for (let y = fanCY - fRout; y <= fanCY + fRout; y++)
  for (let z = fanCZ - fRout; z <= fanCZ + fRout; z++) {
    if ((y - fanCY) ** 2 + (z - fanCZ) ** 2 <= fRout * fRout) vox(fanCX + 7, y, z, COL.HOUSING_D);
  }
for (let y = fanCY - fRout; y <= fanCY + fRout; y++)
  for (let z = fanCZ - fRout; z <= fanCZ + fRout; z++) {
    const dy = y - fanCY, dz = z - fanCZ, d2 = dy * dy + dz * dz;
    if (d2 <= fRout * fRout && d2 >= (fRout - 1) * (fRout - 1) && Math.abs(dz) > 4)
      vox(fanCX, y, z, COL.HOUSING_D);
  }
for (let x = fanCX + 8; x <= fanCX + 11; x++)
  for (let y = fanCY - 3; y <= fanCY + 3; y++)
    for (let z = fanCZ - 3; z <= fanCZ + 3; z++) {
      const isS = (x === fanCX + 8 || x === fanCX + 11 || y === fanCY - 3 || y === fanCY + 3 || z === fanCZ - 3 || z === fanCZ + 3);
      vox(x, y, z, isS ? COL.MOTOR : COL.MOTOR_D);
    }
for (let y = fanCY - 4; y <= fanCY + 4; y++)
  for (let z = fanCZ - 4; z <= fanCZ + 4; z++)
    if (Math.abs(y - fanCY) === 4 || Math.abs(z - fanCZ) === 4) vox(fanCX + 8, y, z, COL.FRAME);
vox(fanCX + 7, fanCY, fanCZ, COL.MOTOR_D); vox(fanCX + 7, fanCY, fanCZ + 1, COL.MOTOR_D);
for (let x = fanCX + 6; x <= fanCX + 9; x++)
  for (let y = fanCY - fRout; y <= fanCY - fRout + 2; y++) {
    vox(x, y, fanCZ + 4, COL.DARK); vox(x, y, fanCZ + 5, COL.DARK);
  }
for (let x = fanCX - 3; x <= fanCX + 3; x++)
  for (let y = fanCY + fRout; y <= fanCY + fRout + 3; y++)
    for (let z = fanCZ - 7; z <= fanCZ + 7; z++) {
      const isS = (x === fanCX - 3 || x === fanCX + 3 || z === fanCZ - 7 || z === fanCZ + 7 || y === fanCY + fRout + 3);
      if (isS) vox(x, y, z, COL.HOUSING);
    }

// CONTROLLER BOX
const ctrlX = DM_X0 + 2, ctrlY = H - 6;
for (let x = ctrlX; x <= ctrlX + 4; x++)
  for (let y = ctrlY; y <= ctrlY + 5; y++)
    for (let z = 0; z >= -2; z--) {
      const isS = (x === ctrlX || x === ctrlX + 4 || y === ctrlY || y === ctrlY + 5 || z === 0 || z === -2);
      vox(x, y, z, isS ? COL.CTRL : COL.CTRL_L);
    }
vox(ctrlX + 2, ctrlY + 4, -2, COL.SENSOR);
for (let z = 0; z <= 2; z++) vox(ctrlX + 2, ctrlY + 1, z, COL.DARK);

// SENSORS
for (let z = 1; z <= 4; z++) vox(FN_X0 + 3, DCY + 2, z, COL.SENSOR);
vox(FN_X0 + 3, DCY + 2, 0, COL.CTRL);
for (let z = 1; z <= 3; z++) vox(CL_X0 + 2, DCY - 3, z, COL.SENSOR);
vox(CL_X0 + 2, DCY - 3, 0, COL.CTRL);
vox(DM_X0 + 2, H - 2, 1, COL.SENSOR); vox(DM_X0 + 2, H - 2, 0, COL.CTRL);
for (let x = DM_X0 + 2; x <= ctrlX + 2; x++) vox(x, H - 2, 0, COL.SENSOR);

// HANGING RODS
for (let y = H; y <= H + 8; y++) {
  vox(CASE_X0 + 3, y, 2, COL.FRAME); vox(CASE_X0 + 3, y, W - 3, COL.FRAME);
  vox(CASE_X1 - 3, y, 2, COL.FRAME); vox(CASE_X1 - 3, y, W - 3, COL.FRAME);
}
for (const xp of [CASE_X0 + 3, CASE_X1 - 3])
  for (const zp of [2, W - 3]) {
    vox(xp - 1, H + 8, zp, COL.FRAME); vox(xp + 1, H + 8, zp, COL.FRAME);
    vox(xp, H + 8, zp - 1, COL.FRAME); vox(xp, H + 8, zp + 1, COL.FRAME);
  }

// ====== PHASE 2: INSTANCED MESHES with COL_MAT lookup ======
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
for (const k in voxData) {
  const { color, positions } = voxData[k];
  let mat;
  if (SHELL_COLORS.has(color)) {
    // Shell-transparent: galvanized steel casing
    mat = VAV_MATS.M01.clone();
    mat.transparent = true;
    mat.opacity = 0.18;
    mat.depthWrite = false;
    mat.side = THREE.DoubleSide;
  } else {
    const matKey = COL_MAT[color];
    if (matKey) {
      mat = VAV_MATS[matKey];
    } else {
      // Fallback for unhandled colors
      mat = new THREE.MeshStandardMaterial({ color, roughness: 0.48, metalness: 0.55 });
    }
  }
  const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
  mesh.castShadow = !SHELL_COLORS.has(color);
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    m.setPosition(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ====== PHASE 2b: GLASS VIEWPORT (M06 MeshPhysicalMaterial) ======
// Inspection window on the fan section access panel area
const glassGeo = new THREE.BoxGeometry(8, 4, 0.1);
const glassMesh = new THREE.Mesh(glassGeo, VAV_MATS.M06);
glassMesh.position.set((FN_X0 + FN_X1) / 2 + 0.5, 14, 0.2);
glassMesh.castShadow = false;
scene.add(glassMesh);

// ====== PHASE 3: ANIMATED FAN WHEEL (CylinderGeometry hub + radial blades) ======
const fanGroup = new THREE.Group();
fanGroup.position.set(fanCX + 0.5, fanCY + 0.5, fanCZ + 0.5);

// CylinderGeometry hub
const hubGeo = new THREE.CylinderGeometry(1.2, 1.2, 9, 24);
hubGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
const hubMesh = new THREE.Mesh(hubGeo, VAV_MATS.M02);
hubMesh.castShadow = true;
fanGroup.add(hubMesh);

// 18 radial blades — flat BoxGeometry slabs arranged radially
const blR = 4.8;
const bladeGeo = new THREE.BoxGeometry(0.5, 1.0, 0.5);
for (let i = 0; i < 18; i++) {
  const a = (i / 18) * Math.PI * 2;
  for (let zOff = -4; zOff <= 4; zOff++) {
    const bl = new THREE.Mesh(bladeGeo, VAV_MATS.M02);
    bl.position.set(Math.cos(a) * blR, Math.sin(a) * blR, zOff);
    bl.rotation.z = a;
    bl.castShadow = true;
    fanGroup.add(bl);
  }
}

// Side disks
for (const zz of [-4.5, 4.5]) {
  const disk = new THREE.Mesh(
    new THREE.CylinderGeometry(blR + 0.5, blR + 0.5, 0.3, 20),
    VAV_MATS.M11
  );
  disk.rotation.x = Math.PI / 2;
  disk.position.z = zz;
  disk.castShadow = true;
  fanGroup.add(disk);
}
scene.add(fanGroup);

// ====== PHASE 3: ANIMATED DAMPER BLADES (BoxGeometry with VAV_MATS.M07) ======
const damperGroup = new THREE.Group();
damperGroup.position.set(dampCX + 0.5, DCY + 0.5, DCZ + 0.5);
const damperBlades = [];
const nBl = 6, bSpan = H - 12, bSpc = bSpan / (nBl - 1);

// Phase 3: damper blade material upgraded to M07 (steel, not LED-red)
for (let i = 0; i < nBl; i++) {
  const bg = new THREE.Group();
  bg.position.y = -(bSpan / 2) + i * bSpc;
  for (let z = -7; z <= 7; z++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.4, 0.85), VAV_MATS.M07);
    c.position.z = z; c.castShadow = true; bg.add(c);
  }
  const rod = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 16),
    VAV_MATS.M11
  );
  bg.add(rod); damperGroup.add(bg); damperBlades.push(bg);
}
const linkBar = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, bSpan + 2, 0.35),
  VAV_MATS.M11
);
linkBar.position.z = -8; damperGroup.add(linkBar);
const crank = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 4, 0.35),
  VAV_MATS.M11
);
crank.position.set(0, bSpan / 2 + 3, -8); damperGroup.add(crank);
scene.add(damperGroup);

// ====== PHASE 3: FAN WHEEL STATE MATERIAL (emissive LED state) ======
// Override fan wheel with emissive state material for LED behavior
const fanStateMat = new THREE.MeshStandardMaterial({
  color: 0xff2233, emissive: 0xff2233, emissiveIntensity: 0.4,
  roughness: 0.35, metalness: 0.90
});
// Replace hub material for state changes
hubMesh.material = fanStateMat;
fanGroup.children.forEach(child => {
  if (child !== hubMesh && child.material === VAV_MATS.M02) {
    child.material = fanStateMat;
  }
});

// ====== PHASE 1/3: LEDs with M14 emissive ======
function makeLed(px, py, pz) {
  const mat = VAV_MATS.M14.clone();
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), mat);
  led.position.set(px, py, pz); scene.add(led);
  const pl = new THREE.PointLight(0xff2233, 1.0, 10);
  pl.position.copy(led.position); scene.add(pl);
  return { mat, light: pl };
}
const ledFan   = makeLed(fanCX + 9.5, fanCY + 3.5, fanCZ - 3.5);
const ledDamper = makeLed(actCX + 0.5, H + 6, actCZ + 0.5);
const ledCool  = makeLed(coilCX + 0.5, H - 2.5, 3.5);

// ====== STATE MACHINE ======
const C_OFF  = new THREE.Color(0xff2233);
const C_ON   = new THREE.Color(0x00ff66);
const C_COOL = new THREE.Color(0x33aaff);
const state  = { damper: false, fan: false, cool: false };
let damperAngle = 0;

function applyState() {
  // Fan wheel state
  fanStateMat.color.copy(state.fan ? C_ON : C_OFF);
  fanStateMat.emissive.copy(state.fan ? C_ON : C_OFF);
  fanStateMat.emissiveIntensity = state.fan ? 0.65 : 0.4;
  ledFan.mat.color.copy(state.fan ? C_ON : C_OFF);
  ledFan.mat.emissive.copy(state.fan ? C_ON : C_OFF);
  ledFan.mat.emissiveIntensity = state.fan ? 1.7 : 1.2;
  ledFan.light.color.copy(state.fan ? C_ON : C_OFF);
  ledFan.light.intensity = state.fan ? 1.5 : 1.0;

  // Damper blade state
  VAV_MATS.M07.color.copy(state.damper ? C_ON : C_OFF);
  VAV_MATS.M07.emissive.copy(state.damper ? C_ON : C_OFF);
  VAV_MATS.M07.emissiveIntensity = state.damper ? 0.6 : 0.0;
  ledDamper.mat.color.copy(state.damper ? C_ON : C_OFF);
  ledDamper.mat.emissive.copy(state.damper ? C_ON : C_OFF);
  ledDamper.mat.emissiveIntensity = state.damper ? 1.7 : 1.2;
  ledDamper.light.color.copy(state.damper ? C_ON : C_OFF);
  ledDamper.light.intensity = state.damper ? 1.2 : 0.8;

  // Cooling coil state
  const cc = state.cool ? C_COOL : C_OFF;
  ledCool.mat.color.copy(cc);
  ledCool.mat.emissive.copy(cc);
  ledCool.mat.emissiveIntensity = state.cool ? 1.8 : 1.2;
  ledCool.light.color.copy(cc);
  ledCool.light.intensity = state.cool ? 2.0 : 1.0;
}
applyState();

// ====== UI ======
const bDamp = document.getElementById('bDamp');
bDamp.onclick = () => {
  state.damper = !state.damper;
  bDamp.className = state.damper ? 'on' : 'off';
  bDamp.textContent = state.damper ? 'OPEN' : 'CLOSED';
  applyState();
};
function bind(id, key) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    state[key] = !state[key];
    btn.className = state[key] ? 'on' : 'off';
    btn.textContent = state[key] ? 'ON' : 'OFF';
    applyState();
  };
}
bind('bFan', 'fan'); bind('bCool', 'cool');
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// ====== PARTICLES (opacity coupled to state — Phase requirement) ======
const N = 55;
const primaryP = [], supplyP = [];
const pGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
const redMat  = new THREE.MeshBasicMaterial({ color: 0xff5533, transparent: true, opacity: 0.85 });
const blueMat = new THREE.MeshBasicMaterial({ color: 0x44bbff, transparent: true, opacity: 0.85 });
for (let i = 0; i < N; i++) {
  const r = new THREE.Mesh(pGeo, redMat.clone());
  r.userData = { t: Math.random(), seed: Math.random() * 10 };
  scene.add(r); primaryP.push(r);
  const s = new THREE.Mesh(pGeo, blueMat.clone());
  s.userData = { t: Math.random(), seed: Math.random() * 10 };
  scene.add(s); supplyP.push(s);
}
const cwN = 24, cwP = [];
const cwMat = new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.85 });
for (let i = 0; i < cwN; i++) {
  const p = new THREE.Mesh(pGeo, cwMat.clone());
  p.userData = { t: Math.random(), seed: Math.random() * 10 };
  scene.add(p); cwP.push(p);
}

// ====== PHASE 5: LIFECYCLE — ResizeObserver + full disposal ======
let resizeObs = null;
let disposed = false;
let rafId = 0;

function destroy() {
  disposed = true;
  cancelAnimationFrame(rafId);
  // Dispose instanced meshes (geometries + materials via traverse)
  scene.traverse(obj => {
    if (obj.geometry && obj.geometry !== cubeGeo && obj.geometry !== glassGeo) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else if (obj.material.dispose) obj.material.dispose();
    }
  });
  // Dispose standalone geometries
  [cubeGeo, glassGeo, hubGeo, bladeGeo].forEach(g => g.dispose());
  // Dispose procedural canvas textures
  [coilFinTex, insulationTex].forEach(t => t.dispose());
  // Remove resize listener
  if (resizeObs) resizeObs.disconnect();
  // Dispose renderer
  renderer.dispose();
  if (renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
  pmrem.dispose();
}

// Wrap canvas in container div for ResizeObserver
const container = document.createElement('div');
container.style.cssText = 'position:fixed;inset:0;';
document.body.insertBefore(container, document.body.firstChild);
container.appendChild(renderer.domElement);

function resizeHandler() {
  const w = container.clientWidth || innerWidth;
  const h = container.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizeObs = new ResizeObserver(resizeHandler);
resizeObs.observe(container);

// ====== ANIMATE ======
const clock = new THREE.Clock();
function animate() {
  if (disposed) return;
  rafId = requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (state.fan) fanGroup.rotation.z += dt * 8;

  const tgtA = state.damper ? Math.PI / 2 : 0;
  damperAngle += (tgtA - damperAngle) * Math.min(dt * 3.5, 1);
  damperBlades.forEach(b => { b.rotation.z = damperAngle; });

  // Primary air particles — opacity 0 when damper OFF
  primaryP.forEach((p, i) => {
    if (!state.damper) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.13;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const yOff = ((i % 6) - 2.5) * 1.3, zOff = ((Math.floor(i / 6) % 5) - 2) * 1.3;
    p.position.x = IN_X1 - tt * (IN_X1 - CL_X0);
    p.position.y = DCY + yOff + Math.sin(tt * 7 + seed) * 0.5;
    p.position.z = DCZ + zOff + Math.cos(tt * 4 + seed) * 0.5;
    p.material.opacity = Math.sin(tt * Math.PI) * 0.85;
  });

  // Supply air particles — opacity 0 when fan OFF
  supplyP.forEach((p, i) => {
    if (!state.fan) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.15;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const yOff = ((i % 6) - 2.5) * 1.2, zOff = ((Math.floor(i / 6) % 5) - 2) * 1.2;
    p.position.x = CL_X0 - tt * (CL_X0 - OT_X0);
    p.position.y = DCY + yOff + Math.sin(tt * 6 + seed) * 0.6;
    p.position.z = DCZ + zOff + Math.cos(tt * 5 + seed) * 0.6;
    p.material.opacity = Math.sin(tt * Math.PI) * 0.85;
  });

  // Cooling water particles — opacity 0 when coil OFF
  cwP.forEach((p, i) => {
    if (!state.cool) { p.material.opacity = 0; return; }
    p.userData.t += dt * 0.22;
    if (p.userData.t > 1) p.userData.t = 0;
    const tt = p.userData.t, seed = p.userData.seed;
    const phase = (tt + seed * 0.1) % 1;
    const coilH = H - 10;
    if (phase < 0.45) {
      const u = phase / 0.45;
      p.position.x = coilCX + 3.5;
      p.position.y = 5 + u * coilH;
      p.position.z = 5.5 + (i % 5) * 2.8;
    } else if (phase < 0.55) {
      const u = (phase - 0.45) / 0.1;
      p.position.x = coilCX + 3.5 - u * 7;
      p.position.y = 5 + coilH;
      p.position.z = 5.5 + (i % 5) * 2.8;
    } else {
      const u = (phase - 0.55) / 0.45;
      p.position.x = coilCX - 3.5;
      p.position.y = 5 + coilH - u * coilH;
      p.position.z = 5.5 + (i % 5) * 2.8;
    }
    p.material.opacity = 0.7 + Math.sin(tt * Math.PI * 2) * 0.15;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
