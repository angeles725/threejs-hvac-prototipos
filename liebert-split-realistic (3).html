<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LIEBERT SPLIT DX · Semi-Realistic</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter: blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter: blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter: blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #legend i { width:10px; height:10px; display:inline-block; border-radius:2px; }
  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:250px; font-size:11px; backdrop-filter: blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }
  #panel label { color:#7a8a98; letter-spacing:0.08em; }
  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:64px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
  #panel button.standby { color:#06080d; border-color:#3aa6ff; background:#3aa6ff; box-shadow:0 0 12px #3aa6ff55; }
  #panel button.alarm   { color:#06080d; border-color:#ff2233; background:#ff2233; box-shadow:0 0 12px #ff223388; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.55; } }
</style>
</head>
<body>
<div id="info">
  <b>LIEBERT · SPLIT DX</b><br>
  <span>Semi-Realistic · Evaporador (cut-away) + Condensador</span>
</div>
<div id="legend">
  <div><i style="background:#ff4422"></i> Aire de retorno</div>
  <div><i style="background:#44aaff"></i> Aire de suministro</div>
  <div><i style="background:#9fb8c4"></i> Descarga de condensaci&oacute;n</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>VENTILADOR EVAP</label><button id="bEvap" class="standby">STANDBY</button></div>
  <div class="row"><label>ABANICO COND</label><button id="bCond" class="standby">STANDBY</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="off">OFF</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================
// SCENE / RENDERER
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 240, 560);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 900);
camera.position.set(140, 68, -130);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // perf: static sun -> bake shadows once (B5 §5.4)
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(74, 16, 8);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.6;

// ============================================================
// LIGHTS
// ============================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.26));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(70, 140, -90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-160; sc.right=160; sc.top=160; sc.bottom=-160; sc.near=1; sc.far=380;
sun.shadow.bias = -0.0003;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-60, 50, 80);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00d4aa, 0.18);
rim.position.set(60, 20, 90);
scene.add(rim);

// ============================================================
// GROUND
// ============================================================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshStandardMaterial({ color:0x0a0e16, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(800, 120, 0x00d4aa, 0x142028);
grid.material.opacity = 0.12;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ============================================================
// MATERIALS (PBR palette — Liebert negro)
// ============================================================
const M = {
  // Gabinete negro semi-transparente (cut-away del evaporador)
  shellGhost: new THREE.MeshStandardMaterial({
    color:0x303137, roughness:0.5, metalness:0.45,
    transparent:true, opacity:0.20, depthWrite:false, side:THREE.DoubleSide
  }),
  // Negro mate sólido (condensador opaco, paneles)
  shellBlack: new THREE.MeshStandardMaterial({
    color:0x202126, roughness:0.55, metalness:0.45
  }),
  shellTrim: new THREE.MeshStandardMaterial({
    color:0x35363c, roughness:0.45, metalness:0.55
  }),
  shellEdge: new THREE.MeshStandardMaterial({
    color:0x44454c, roughness:0.4, metalness:0.6
  }),
  // Louvers de descarga superior (negro, semi)
  louver: new THREE.MeshStandardMaterial({
    color:0x2a2b30, roughness:0.5, metalness:0.5, side:THREE.DoubleSide
  }),
  // Rejillas / grille
  grille: new THREE.MeshStandardMaterial({
    color:0x0c0c10, roughness:0.85, metalness:0.2
  }),
  skid: new THREE.MeshStandardMaterial({
    color:0x6a6c72, roughness:0.7, metalness:0.5
  }),
  skidDark: new THREE.MeshStandardMaterial({
    color:0x303036, roughness:0.75, metalness:0.4
  }),
  galv: new THREE.MeshStandardMaterial({
    color:0xb0b4b8, roughness:0.5, metalness:0.7
  }),
  galvDark: new THREE.MeshStandardMaterial({
    color:0x6a6e74, roughness:0.55, metalness:0.65
  }),
  coilFace: new THREE.MeshStandardMaterial({
    color:0x4a6878, roughness:0.68, metalness:0.55
  }),
  aluminum: new THREE.MeshStandardMaterial({
    color:0xc0c4c8, roughness:0.35, metalness:0.9, side:THREE.DoubleSide
  }),
  aluminumBright: new THREE.MeshStandardMaterial({
    color:0xd8dce0, roughness:0.25, metalness:0.95
  }),
  copper: new THREE.MeshStandardMaterial({
    color:0xb87333, roughness:0.32, metalness:0.92
  }),
  insulation: new THREE.MeshStandardMaterial({
    color:0x2b2b30, roughness:0.95, metalness:0.0
  }),
  black: new THREE.MeshStandardMaterial({
    color:0x1e1e22, roughness:0.38, metalness:0.85
  }),
  blackMatte: new THREE.MeshStandardMaterial({
    color:0x15151a, roughness:0.75, metalness:0.3
  }),
  plate: new THREE.MeshStandardMaterial({
    color:0x111114, roughness:0.5, metalness:0.6
  }),
  bolt: new THREE.MeshStandardMaterial({
    color:0x40444a, roughness:0.4, metalness:0.85
  }),
  ledOrange: new THREE.MeshStandardMaterial({
    color:0xe8531c, emissive:0xe8531c, emissiveIntensity:1.5, roughness:0.3, metalness:0.3
  }),
};
// resplandor interno que indica operacion (se asoma por rejillas y descarga)
const ventMat = new THREE.MeshStandardMaterial({
  color:0x070709, emissive:0x3aa6ff, emissiveIntensity:0.25, roughness:0.6, metalness:0.15
});

// ============================================================
// HELPERS
// ============================================================
function box(w,h,d, mat, x,y,z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function panel(w,h,d, mat, x,y,z) {
  const m = box(w,h,d, mat, x,y,z);
  m.castShadow = false;
  return m;
}
function tube(p0, p1, r, mat, seg=12) {
  const dir = new THREE.Vector3().subVectors(p1,p0);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg), mat);
  m.position.copy(p0).add(dir.clone().multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

const root = new THREE.Group();
scene.add(root);

// ============================================================
// DIMENSIONS (world units, coincide con el voxel aprobado)
// ============================================================
const EVAP_W = 84, EVAP_D = 42, BODY_H = 33, TOP_H = 5, EVAP_H = BODY_H + TOP_H;
const GAP = 30;
const CON_X0 = EVAP_W + GAP, CON_W = 30, CON_D = 34, CON_H = 30;
const CON_X1 = CON_X0 + CON_W;
const conCX = CON_X0 + CON_W/2, conCZ = CON_D/2, conBaseY = 3, conTopY = conBaseY + CON_H;

// ============================================================
// EVAPORADOR — SKID
// ============================================================
(function buildEvapSkid() {
  root.add(box(EVAP_W+2, 1.2, EVAP_D+2, M.skid, EVAP_W/2, 0.6, EVAP_D/2));
  const edge = (x,z,w,d) => root.add(box(w,2.0,d, M.skidDark, x,1.5,z));
  edge(EVAP_W/2, -0.3, EVAP_W+2, 0.8);
  edge(EVAP_W/2, EVAP_D+0.3, EVAP_W+2, 0.8);
  edge(-0.4, EVAP_D/2, 0.8, EVAP_D+2);
  edge(EVAP_W+0.4, EVAP_D/2, 0.8, EVAP_D+2);
  // pies
  for (const px of [6, EVAP_W-6])
    for (const pz of [5, EVAP_D-5])
      root.add(box(3,1.4,3, M.skidDark, px, 0.7, pz));
})();

// ============================================================
// EVAPORADOR — SHELL (negro semi-transparente, cut-away)
// ============================================================
(function buildEvapShell() {
  const yC = (2+BODY_H)/2, hC = BODY_H-2;
  // gabinete OPACO (negro solido, como el equipo real)
  root.add(panel(EVAP_W, hC, 0.5, M.shellBlack, EVAP_W/2, yC, EVAP_D-0.25));        // trasera
  root.add(panel(0.5, hC, EVAP_D, M.shellBlack, 0.25, yC, EVAP_D/2));               // lateral izq
  root.add(panel(0.5, hC, EVAP_D, M.shellBlack, EVAP_W-0.25, yC, EVAP_D/2));        // lateral der
  // frente solido sobre la zona de rejillas
  root.add(panel(EVAP_W, BODY_H-16, 0.5, M.shellBlack, EVAP_W/2, 16+(BODY_H-16)/2, 0.25));
  // frente: franja inferior izquierda (junto a las rejillas)
  root.add(panel(16, 12, 0.5, M.shellBlack, 8, 10, 0.25));

  // aristas verticales (definen la silueta)
  for (const [x,z] of [[0,0],[EVAP_W,0],[0,EVAP_D],[EVAP_W,EVAP_D]])
    root.add(box(0.7, EVAP_H-2, 0.7, M.shellEdge, x, (2+EVAP_H)/2, z));
  // arista superior frontal/trasera del cuerpo
  root.add(box(EVAP_W, 0.6, 0.6, M.shellEdge, EVAP_W/2, BODY_H, 0.3));

  // ----- Frente inferior SÓLIDO (tapa el interior por completo) -----
  root.add(panel(EVAP_W-1.4, 14, 0.5, M.shellBlack, EVAP_W/2, 11, 0.3));

  // ----- Rejillas de retorno (pantalla emisiva + lamas) -----
  const grW = EVAP_W-22, grH = 11, grX = 18 + grW/2;
  // pantalla emisiva DELANTE del frente sólido: brilla cuando el equipo trabaja
  root.add(panel(grW, grH, 0.25, ventMat, grX, 9.5, 0.08));
  // lamas horizontales de la rejilla
  for (let i=0; i<9; i++)
    root.add(box(grW-0.6, 0.4, 0.4, M.shellEdge, grX, 5 + i*1.05, -0.05));
  // divisiones verticales (6 celdas)
  for (let i=1; i<6; i++)
    root.add(box(0.5, grH, 0.42, M.shellEdge, 18 + (grW/6)*i, 9.5, -0.08));
  // marco de la rejilla
  root.add(box(grW+1, 0.5, 0.5, M.shellEdge, grX, 9.5+grH/2, -0.05));
  root.add(box(grW+1, 0.5, 0.5, M.shellEdge, grX, 9.5-grH/2, -0.05));

  // ----- Logo Liebert + LED naranja (izquierda) -----
  root.add(box(11, 4.5, 0.4, M.plate, 9, 18, 0.1));
  const led = box(1.3, 1.3, 0.8, M.ledOrange, 4.5, 17, -0.3);
  root.add(led);
  const lp = new THREE.PointLight(0xe8531c, 0.8, 9);
  lp.position.set(4.5, 17, -1);
  root.add(lp);
})();

// ============================================================
// EVAPORADOR — TAPA SUPERIOR (rejilla de descarga plana, en celdas)
// ============================================================
(function buildTopGrille() {
  const NC = 5;                          // celdas de descarga
  const inset = 3;
  const gx0 = inset, gx1 = EVAP_W - inset;
  const gz0 = inset, gz1 = EVAP_D - inset;
  const cellW = (gx1 - gx0) / NC;
  const topY = BODY_H;                    // techo del cuerpo = piso de la tapa
  const ry = topY + TOP_H/2;

  // base emisiva bajo la rejilla (resplandor de operacion)
  root.add(panel(EVAP_W-2, 0.4, EVAP_D-2, ventMat, EVAP_W/2, topY+0.2, EVAP_D/2));

  // reborde perimetral elevado (sobresale ligeramente del cuerpo)
  root.add(box(EVAP_W+1.5, TOP_H, 1.6, M.shellTrim, EVAP_W/2, ry, gz0-1.1));   // frente
  root.add(box(EVAP_W+1.5, TOP_H, 1.6, M.shellTrim, EVAP_W/2, ry, gz1+1.1));   // atras
  root.add(box(1.6, TOP_H, EVAP_D+1.5, M.shellTrim, gx0-1.1, ry, EVAP_D/2));   // izq
  root.add(box(1.6, TOP_H, EVAP_D+1.5, M.shellTrim, gx1+1.1, ry, EVAP_D/2));   // der
  // cantos del labio
  for (const zz of [gz0-1.1, gz1+1.1])
    root.add(box(EVAP_W+2, 0.6, 0.5, M.shellEdge, EVAP_W/2, topY+TOP_H, zz));

  // tabiques divisorios entre celdas (rectos)
  for (let i=0; i<=NC; i++) {
    const x = gx0 + i*cellW;
    root.add(box(0.9, TOP_H-0.5, gz1-gz0, M.shellTrim, x, topY+(TOP_H-0.5)/2, EVAP_D/2));
  }
  // lamas de rejilla dentro de cada celda
  for (let c=0; c<NC; c++) {
    const cx = gx0 + c*cellW + cellW/2;
    for (let j=0; j<5; j++) {
      const z = gz0 + 2 + j*((gz1-gz0-4)/4);
      root.add(box(cellW-1.8, 0.5, 0.5, M.grille, cx, topY+1.3, z));
    }
  }
})();

// ============================================================
// EVAPORADOR — BOBINA (fins de aluminio + tubos de cobre)
// ============================================================
const COIL_X0 = 12, COIL_X1 = 72, COIL_Y0 = 5, COIL_Y1 = 18, COIL_Z0 = 6, COIL_Z1 = 11;
(function buildCoil() {
  const cw = COIL_X1-COIL_X0, ch = COIL_Y1-COIL_Y0, cd = COIL_Z1-COIL_Z0;
  const cxC = (COIL_X0+COIL_X1)/2, cyC = (COIL_Y0+COIL_Y1)/2, czC = (COIL_Z0+COIL_Z1)/2;
  // marco de la bobina
  for (const zz of [COIL_Z0, COIL_Z1]) {
    root.add(box(0.4, ch+1, 0.4, M.galvDark, COIL_X0, cyC, zz));
    root.add(box(0.4, ch+1, 0.4, M.galvDark, COIL_X1, cyC, zz));
  }
  root.add(box(cw+0.8, 0.4, cd+0.8, M.galvDark, cxC, COIL_Y0, czC));
  root.add(box(cw+0.8, 0.4, cd+0.8, M.galvDark, cxC, COIL_Y1, czC));
  // fins de aluminio (planos verticales apilados a lo largo de X)
  const FIN = 46, gap = cw/FIN;
  for (let i=0; i<FIN; i++) {
    const fx = COIL_X0 + gap/2 + i*gap;
    const fin = new THREE.Mesh(new THREE.PlaneGeometry(cd-0.2, ch-0.3), M.aluminum);
    fin.rotation.y = Math.PI/2;
    fin.position.set(fx, cyC, czC);
    fin.receiveShadow = true;
    root.add(fin);
  }
  // cara teñida azul-verde
  root.add(panel(cw-0.3, ch-0.4, 0.12, M.coilFace, cxC, cyC, COIL_Z0+0.06));
  root.add(panel(cw-0.3, ch-0.4, 0.12, M.coilFace, cxC, cyC, COIL_Z1-0.06));
  // tubos de cobre horizontales (eje X) en 5 filas + U-bends al extremo derecho
  const rows = 5;
  for (let r=0; r<rows; r++) {
    const y = COIL_Y0 + 1.2 + r*((ch-2)/(rows-1));
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26, cw+1.2, 12), M.copper);
    t.rotation.z = Math.PI/2;
    t.position.set(cxC, y, czC);
    t.castShadow = true;
    root.add(t);
    if (r < rows-1) {
      const y2 = COIL_Y0 + 1.2 + (r+1)*((ch-2)/(rows-1));
      const u = new THREE.Mesh(new THREE.TorusGeometry((y2-y)/2, 0.26, 8, 16, Math.PI), M.copper);
      u.position.set(COIL_X1+0.6, (y+y2)/2, czC);
      u.rotation.y = Math.PI/2;
      root.add(u);
    }
  }
  // charola de condensados
  root.add(box(cw+2, 0.4, cd+2, M.galv, cxC, COIL_Y0-1.5, czC));
})();

// ============================================================
// EVAPORADOR — BLOWERS CENTRÍFUGOS (scroll + squirrel cage)
// ============================================================
const blowerCenters = [ {x:26,y:20,z:24}, {x:58,y:20,z:24} ];
const blowerGroups = [];
const blowerMats = [];
const scrollR = 6.5, scrollDepth = 9;
function buildBlower(cx, cy, cz) {
  // scroll: medio-toro trasero + disco trasero + aro frontal (abierto al frente -Z)
  const scrollGeo = new THREE.TorusGeometry(scrollR, 1.1, 12, 30, Math.PI);
  const scroll = new THREE.Mesh(scrollGeo, M.galvDark);
  scroll.position.set(cx, cy, cz + scrollDepth/2);
  scroll.rotation.x = Math.PI/2;
  scroll.rotation.z = -Math.PI/2;   // mitad faltante hacia el frente (-Z)
  root.add(scroll);
  const backDisk = new THREE.Mesh(new THREE.CylinderGeometry(scrollR, scrollR, 0.3, 30), M.galv);
  backDisk.position.set(cx, cy, cz + scrollDepth);
  backDisk.rotation.x = Math.PI/2;
  root.add(backDisk);
  const frontRing = new THREE.Mesh(new THREE.RingGeometry(scrollR-0.8, scrollR, 30), M.galvDark);
  frontRing.position.set(cx, cy, cz);
  root.add(frontRing);
  // boca de salida hacia arriba
  root.add(box(scrollR*1.4, 3, scrollDepth-1, M.galvDark, cx, cy+scrollR+0.8, cz+scrollDepth/2-0.5));

  // rueda squirrel cage (gira en eje Z)
  const wheelMat = new THREE.MeshStandardMaterial({
    color:0x3aa6ff, roughness:0.38, metalness:0.7, emissive:0x3aa6ff, emissiveIntensity:0.35
  });
  const g = new THREE.Group();
  g.position.set(cx, cy, cz + 2.5);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2, scrollDepth-1, 16),
    new THREE.MeshStandardMaterial({ color:0x55555c, roughness:0.4, metalness:0.85 }));
  hub.rotation.x = Math.PI/2;
  g.add(hub);
  const BL = 26, bR = scrollR-2;
  const bladeGeo = new THREE.BoxGeometry(0.7, 0.22, scrollDepth-1.4);
  for (let i=0; i<BL; i++) {
    const a = (i/BL)*Math.PI*2;
    const b = new THREE.Mesh(bladeGeo, wheelMat);
    b.position.set(Math.cos(a)*bR, Math.sin(a)*bR, 0);
    b.rotation.z = a + Math.PI/2 + 0.25;
    b.castShadow = true;
    g.add(b);
  }
  for (const dz of [-(scrollDepth/2-1), scrollDepth/2-1]) {
    const rim = new THREE.Mesh(new THREE.TorusGeometry(bR+0.2, 0.16, 6, 32),
      new THREE.MeshStandardMaterial({ color:0x55555c, roughness:0.4, metalness:0.9 }));
    rim.position.set(0,0,dz);
    g.add(rim);
  }
  root.add(g);
  g.traverse(o => o.castShadow = false); // perf: animated blower excluded from baked shadow map (B5 §5.4)
  blowerGroups.push(g);
  blowerMats.push(wheelMat);

  // motor lateral
  const mb = new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,4,18),
    new THREE.MeshStandardMaterial({ color:0x2a2a2e, roughness:0.5, metalness:0.7 }));
  mb.rotation.z = Math.PI/2;
  mb.position.set(cx+scrollR+2.5, cy-2, cz+scrollDepth/2);
  root.add(mb);
}
blowerCenters.forEach(c => buildBlower(c.x, c.y, c.z));

// ============================================================
// CONDENSADOR — CAJA OPACA (solo el abanico superior visible)
// ============================================================
(function buildCondenser() {
  const cyC = conBaseY + CON_H/2;
  // plinto
  root.add(box(CON_W+3, 2.2, CON_D+3, M.skidDark, conCX, 1.1, conCZ));
  // cuerpo opaco (5 caras sólidas; el techo lleva el hueco del abanico)
  root.add(panel(0.5, CON_H, CON_D, M.shellBlack, CON_X0, cyC, conCZ));        // izq
  root.add(panel(0.5, CON_H, CON_D, M.shellBlack, CON_X1, cyC, conCZ));        // der
  root.add(panel(CON_W, CON_H, 0.5, M.shellBlack, conCX, cyC, conCZ+CON_D/2)); // atrás
  root.add(panel(CON_W, CON_H, 0.5, M.shellBlack, conCX, cyC, conCZ-CON_D/2)); // frente
  // techo opaco con agujero circular para el abanico
  const topShape = new THREE.Shape();
  topShape.moveTo(-CON_W/2, -CON_D/2);
  topShape.lineTo(CON_W/2, -CON_D/2);
  topShape.lineTo(CON_W/2, CON_D/2);
  topShape.lineTo(-CON_W/2, CON_D/2);
  topShape.closePath();
  const topHole = new THREE.Path();
  topHole.absarc(0, 0, 10.5, 0, Math.PI*2, true);
  topShape.holes.push(topHole);
  const topPlate = new THREE.Mesh(new THREE.ShapeGeometry(topShape), M.shellBlack);
  topPlate.rotation.x = -Math.PI/2;
  topPlate.position.set(conCX, conTopY, conCZ);
  topPlate.receiveShadow = true;
  root.add(topPlate);
  // esquinas / aristas verticales
  for (const sx of [CON_X0, CON_X1])
    for (const sz of [conCZ-CON_D/2, conCZ+CON_D/2])
      root.add(box(0.8, CON_H, 0.8, M.shellEdge, sx, cyC, sz));

  // rejillas de aire (louvers horizontales) en frente y costados
  const louverFace = (x,z,w,d,n) => {
    for (let i=0; i<n; i++) {
      const y = conBaseY + 3 + i*((CON_H-6)/n);
      root.add(box(w, 0.5, d, M.shellEdge, x, y, z));
    }
  };
  louverFace(conCX, conCZ-CON_D/2-0.1, CON_W-3, 0.3, 12);     // frente
  louverFace(CON_X0-0.1, conCZ, 0.3, CON_D-3, 12);            // izq
  louverFace(CON_X1+0.1, conCZ, 0.3, CON_D-3, 12);            // der

  // bobina de condensador (anillo de aletas dentro, visible por las rejillas)
  for (let i=0; i<10; i++) {
    const y = conBaseY + 4 + i*((CON_H-8)/10);
    root.add(box(CON_W-4, 0.12, CON_D-4, M.coilFace, conCX, y, conCZ));
  }
})();

// ============================================================
// CONDENSADOR — ABANICO AXIAL ARRIBA (scimitar blades, descarga +Y)
// ============================================================
function makeAeroBlade() {
  const shape = new THREE.Shape();
  shape.moveTo(0.5, -0.30);
  shape.quadraticCurveTo(1.6, -0.75, 3.1, -0.55);
  shape.quadraticCurveTo(3.9, -0.35, 4.15, 0.05);
  shape.quadraticCurveTo(4.25, 0.38, 3.85, 0.58);
  shape.quadraticCurveTo(2.8, 0.88, 1.4, 0.55);
  shape.quadraticCurveTo(0.8, 0.35, 0.5, 0.20);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth:0.2, bevelEnabled:true, bevelSegments:2, bevelSize:0.04, bevelThickness:0.04, steps:1
  });
  geo.translate(0,0,-0.1);
  const pos = geo.attributes.position;
  for (let i=0; i<pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const tP = Math.max(0, Math.min(1, (x-0.5)/3.7));
    const tw = 0.70 - tP*0.48;
    pos.setXYZ(i, x, y*Math.cos(tw) - z*Math.sin(tw), y*Math.sin(tw) + z*Math.cos(tw));
  }
  pos.needsUpdate = true; geo.computeVertexNormals();
  return geo;
}
const aeroBladeGeo = makeAeroBlade();
const condFanGroup = new THREE.Group();
const condFanMat = new THREE.MeshStandardMaterial({
  color:0x3aa6ff, roughness:0.4, metalness:0.65,
  emissive:0x3aa6ff, emissiveIntensity:0.35, side:THREE.DoubleSide
});
(function buildCondFan() {
  const fanY = conTopY + 1.2;
  // venturi shroud (embebido en el techo)
  const shroud = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 2.4, 30, 1, true), M.galv);
  shroud.position.set(conCX, conTopY+0.6, conCZ);
  shroud.castShadow = true;
  root.add(shroud);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(10, 0.5, 8, 36), M.galvDark);
  lip.rotation.x = Math.PI/2;
  lip.position.set(conCX, fanY+1.0, conCZ);
  root.add(lip);
  // rejilla de protección (anillos + radios)
  for (const r of [3, 6, 9]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.12, 4, 28), M.bolt);
    ring.rotation.x = Math.PI/2;
    ring.position.set(conCX, fanY+1.4, conCZ);
    root.add(ring);
  }
  for (let i=0; i<8; i++) {
    const a = (i/8)*Math.PI*2;
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 19), M.bolt);
    sp.rotation.y = a;
    sp.position.set(conCX, fanY+1.4, conCZ);
    root.add(sp);
  }
  // ensamble giratorio (eje Y) — aspas escaladas a este abanico grande
  condFanGroup.position.set(conCX, fanY, conCZ);
  const fhub = new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.1,1.6,18),
    new THREE.MeshStandardMaterial({ color:0x45454a, roughness:0.4, metalness:0.85 }));
  condFanGroup.add(fhub);
  const BL = 6;
  for (let i=0; i<BL; i++) {
    const blade = new THREE.Mesh(aeroBladeGeo, condFanMat);
    blade.scale.set(2.0, 2.0, 2.0);
    blade.rotation.y = (i/BL)*Math.PI*2;
    blade.castShadow = true;
    condFanGroup.add(blade);
  }
  root.add(condFanGroup);
  condFanGroup.traverse(o => o.castShadow = false); // perf: animated fan excluded from baked shadow map (B5 §5.4)
})();

// ============================================================
// LINE SET (líquido cobre + succión aislada)
// ============================================================
(function buildLineSet() {
  const yL = 5, yS = 7;
  const x0 = EVAP_W-2, x1 = CON_X0+2, zRun = EVAP_D-5;
  // líquido (cobre delgado)
  root.add(tube(new THREE.Vector3(x0,yL,zRun), new THREE.Vector3(x1,yL,zRun), 0.5, M.copper));
  root.add(tube(new THREE.Vector3(x1,yL,zRun), new THREE.Vector3(x1,yL,conCZ), 0.5, M.copper));
  // succión (aislada, gruesa)
  root.add(tube(new THREE.Vector3(x0,yS,zRun-2), new THREE.Vector3(x1+0.5,yS,zRun-2), 1.2, M.insulation));
  root.add(tube(new THREE.Vector3(x1+0.5,yS,zRun-2), new THREE.Vector3(x1+0.5,yS,conCZ), 1.2, M.insulation));
  // soportes
  for (let x=x0; x<x1; x+=12) root.add(box(0.6, yS+1, 0.6, M.skidDark, x, (yS+1)/2, zRun-1));
})();

// ============================================================
// LEDS DE ESTADO
// ============================================================
const ledMats = [];
function makeLed(x,y,z) {
  const mat = new THREE.MeshStandardMaterial({
    color:0x3aa6ff, emissive:0x3aa6ff, emissiveIntensity:1.3, roughness:0.3, metalness:0.3
  });
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.7,12,8), mat);
  led.position.set(x,y,z);
  root.add(led);
  const pl = new THREE.PointLight(0x3aa6ff, 1.0, 12);
  pl.position.set(x,y,z);
  root.add(pl);
  ledMats.push({ mat, light: pl });
}
makeLed(13, 18, -0.6);                   // evaporador
makeLed(CON_X0+2, conBaseY+CON_H-3, conCZ-CON_D/2-0.8);  // condensador

// ============================================================
// STATE MACHINE
// ============================================================
const COLOR_STANDBY = new THREE.Color(0x3aa6ff);
const COLOR_ON      = new THREE.Color(0x00ff66);
const COLOR_ALARM   = new THREE.Color(0xff2233);
const colorFor = s => s==='on' ? COLOR_ON : s==='alarm' ? COLOR_ALARM : COLOR_STANDBY;
const intensityFor = s => s==='on' ? 0.65 : s==='alarm' ? 0.7 : 0.4;
const state = { evap:'standby', cond:'standby' };

function applyState() {
  blowerMats.forEach(m => {
    m.color.copy(colorFor(state.evap));
    m.emissive.copy(colorFor(state.evap));
    m.emissiveIntensity = intensityFor(state.evap);
  });
  // resplandor de operacion del evaporador (visible por rejillas y descarga)
  ventMat.emissive.copy(colorFor(state.evap));
  ventMat.emissiveIntensity = state.evap==='on' ? 1.5 : state.evap==='alarm' ? 1.2 : 0.22;
  condFanMat.color.copy(colorFor(state.cond));
  condFanMat.emissive.copy(colorFor(state.cond));
  condFanMat.emissiveIntensity = intensityFor(state.cond);
  [state.evap, state.cond].forEach((s,i) => {
    ledMats[i].mat.color.copy(colorFor(s));
    ledMats[i].mat.emissive.copy(colorFor(s));
    ledMats[i].mat.emissiveIntensity = s==='standby' ? 1.2 : 1.7;
    ledMats[i].light.color.copy(colorFor(s));
    ledMats[i].light.intensity = s==='standby' ? 1.0 : 1.6;
  });
}
applyState();

const CYCLE = { standby:'on', on:'alarm', alarm:'standby' };
function bind(id, key) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    state[key] = CYCLE[state[key]];
    btn.className = state[key];
    btn.textContent = state[key].toUpperCase();
    applyState();
  };
}
bind('bEvap','evap');
bind('bCond','cond');
const bRot = document.getElementById('bRot');
bRot.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  bRot.className = controls.autoRotate ? 'on' : 'off';
  bRot.textContent = controls.autoRotate ? 'ON' : 'OFF';
};

// ============================================================
// PARTÍCULAS DE AIRE
// ============================================================
const N = 46;
const pGeo = new THREE.SphereGeometry(0.34, 6, 4);
const retP = [], supP = [], conP = [];
const mk = c => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:0 });
for (let i=0; i<N; i++) {
  const r = new THREE.Mesh(pGeo, mk(0xff5533)); r.userData={t:Math.random(),s:Math.random()*10}; root.add(r); retP.push(r);
  const s = new THREE.Mesh(pGeo, mk(0x44bbff)); s.userData={t:Math.random(),s:Math.random()*10}; root.add(s); supP.push(s);
  const c = new THREE.Mesh(pGeo, mk(0x9fb8c4)); c.userData={t:Math.random(),s:Math.random()*10}; root.add(c); conP.push(c);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// ANIMATE
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.evap==='on') blowerGroups.forEach((g,i)=> g.rotation.z += dt*(7+i*0.5));
  if (state.cond==='on') condFanGroup.rotation.y += dt*8;

  retP.forEach((p,i) => {
    if (state.evap!=='on') { p.material.opacity=0; return; }
    p.userData.t += dt*0.2; if (p.userData.t>1) p.userData.t=0;
    const tt=p.userData.t, sd=p.userData.s;
    const xb = 20 + (i%6)*9;
    p.position.x = xb + Math.sin(tt*3+sd)*1.0;
    p.position.z = -9 + tt*9;                 // se acerca y es succionado por la rejilla
    p.position.y = 5 + (i%5)*1.7 + Math.sin(tt*5+sd)*0.4;
    p.material.opacity = Math.sin(tt*Math.PI)*0.8;
  });
  supP.forEach((p,i) => {
    if (state.evap!=='on') { p.material.opacity=0; return; }
    p.userData.t += dt*0.2; if (p.userData.t>1) p.userData.t=0;
    const tt=p.userData.t, sd=p.userData.s;
    const xb = 8 + (i%6)*13;
    p.position.x = xb + Math.sin(tt*3+sd)*1.0;
    p.position.z = 8 + (Math.floor(i/6)%4)*7 + Math.sin(tt*4+sd)*1.0;
    p.position.y = BODY_H + tt*16 + Math.sin(tt*5+sd)*0.5;
    p.material.opacity = Math.sin(tt*Math.PI)*0.8;
  });
  conP.forEach((p,i) => {
    if (state.cond!=='on') { p.material.opacity=0; return; }
    p.userData.t += dt*0.22; if (p.userData.t>1) p.userData.t=0;
    const tt=p.userData.t, sd=p.userData.s;
    const a = sd*0.63, rr = 2 + tt*7;
    p.position.x = conCX + Math.cos(a)*rr;
    p.position.z = conCZ + Math.sin(a)*rr;
    p.position.y = (conTopY+2) + tt*28;
    p.material.opacity = Math.sin(tt*Math.PI)*0.7;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
