<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHILLER DE TORNILLO · CONDENSADO POR AGUA · Realistic</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter:blur(6px); }

<body>
<div id="info">
  <b>CHILLER DE TORNILLO · CONDENSADO POR AGUA</b><br>

</div>
<div id="legend">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 unidad = 1 m. Spec dimensional: voxel/chiller-tornillo-agua-voxel-v1.html
// Envolvente 4.5 (X) x 1.8 (Z) x 2.2 (Y) m. Eje de barriles en Z=0, unidad centrada en X=0.
// Evaporador (abajo) eje Y=0.8 · Condensador (arriba) eje Y=1.6 · Compresor+motor eje Y=1.95, Z=+0.35.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 16, 44);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 120);
camera.position.set(4.8, 3.2, 4.6);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // sombras horneadas: se rehornean solo al cambiar estado
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 1.05, 0);
// Ground clamp (regla de la casa): ni el target ni la camara bajan del piso
controls.addEventListener('change', () => {
  if (controls.target.y < 0) controls.target.y = 0;
  if (camera.position.y < 0.4) camera.position.y = 0.4;
});

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(6, 9, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-5, 4, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-3, 2.5, 5.5);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(26, 26, 0x123f35, 0x0c1d1a);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ====== TEXTURAS PROCEDURALES (CanvasTexture) ======
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// Variacion sutil de rugosidad para pintura de barriles (mapa lineal, no sRGB)
const paintRoughTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#8c8c8c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++){
    const v = 120 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 2);
  return t;
})();

// Franja de peligro amarillo/negro (riel del skid)
const hazardTex = canvasTex(256, 32, (g, w, h) => {
  g.fillStyle = '#141414'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffc22e';
  for (let x = -h; x < w + h; x += 32){
    g.beginPath();
    g.moveTo(x, h); g.lineTo(x + 16, h); g.lineTo(x + 16 + h, 0); g.lineTo(x + h, 0);
    g.closePath(); g.fill();
  }
});
hazardTex.wrapS = THREE.RepeatWrapping;
hazardTex.repeat.set(6, 1);

// Placa de datos del equipo
const nameplateTex = canvasTex(512, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#d8dade'); grad.addColorStop(0.5, '#b8bcc2'); grad.addColorStop(1, '#c8ccd2');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3a3f46'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = '#22262c';
  g.font = 'bold 30px monospace'; g.textAlign = 'center';
  g.fillText('CHILLER DE TORNILLO', w/2, 56);
  g.font = '22px monospace';
  g.fillText('CONDENSADO POR AGUA', w/2, 90);
  g.font = '20px monospace'; g.textAlign = 'left';
  g.fillText('MODELO      CT-380W-S2', 40, 134);
  g.fillText('CAPACIDAD   380 TR (1336 kW)', 40, 164);
  g.fillText('REFRIG.     R-134a · 460V/3F/60Hz', 40, 194);
  g.fillText('DIMS        4.5 x 1.8 x 2.2 m', 40, 224);
  for (const [bx, by] of [[26, 26], [w-26, 26], [26, h-26], [w-26, h-26]]){
    g.beginPath(); g.arc(bx, by, 7, 0, Math.PI*2); g.fillStyle = '#787c82'; g.fill();
  }
});

// Etiqueta de riesgo electrico (gabinete)
const hazardLabelTex = canvasTex(128, 160, (g, w, h) => {
  g.fillStyle = '#ffc22e'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#141414'; g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
  g.fillStyle = '#141414';
  g.beginPath(); g.moveTo(w/2, 22); g.lineTo(w - 18, h - 52); g.lineTo(18, h - 52); g.closePath();
  g.stroke();
  // rayo
  g.beginPath();
  g.moveTo(w/2 + 6, 46); g.lineTo(w/2 - 12, 84); g.lineTo(w/2 - 1, 84);
  g.lineTo(w/2 - 8, 112); g.lineTo(w/2 + 13, 74); g.lineTo(w/2 + 2, 74); g.closePath();
  g.fill();
  g.font = 'bold 20px monospace'; g.textAlign = 'center';
  g.fillText('PELIGRO', w/2, h - 24);
});

// ====== PALETA PBR (metalness 0 = pintado · metalness 1 = metal desnudo) ======
const M = {
  // roughnessMap MULTIPLIES scalar roughness (map base ~0.55) -> 1.0 lands the
  // product at ~0.55, inside the painted-metal band (review F2)
  GREEN:    new THREE.MeshStandardMaterial({ color:0x2e6b52, roughness:1.0, metalness:0, roughnessMap:paintRoughTex }),
  GREEN_D:  new THREE.MeshStandardMaterial({ color:0x224e3c, roughness:0.6,  metalness:0 }),
  STEEL:    new THREE.MeshStandardMaterial({ color:0x9aa8b0, roughness:0.38, metalness:1 }),   // compresor (acero maquinado)
  STEEL_D:  new THREE.MeshStandardMaterial({ color:0x6b747e, roughness:0.45, metalness:1 }),   // motor
  FLANGE:   new THREE.MeshStandardMaterial({ color:0x8a949c, roughness:0.35, metalness:1 }),   // caras de brida
  BOLT:     new THREE.MeshStandardMaterial({ color:0x40444a, roughness:0.4,  metalness:1 }),
  COPPER:   new THREE.MeshStandardMaterial({ color:0xc07a3c, roughness:0.35, metalness:1 }),
  BRASS:    new THREE.MeshStandardMaterial({ color:0xb08d3e, roughness:0.4,  metalness:1 }),
  DARK:     new THREE.MeshStandardMaterial({ color:0x2b3036, roughness:0.65, metalness:0 }),   // estructura pintada
  BLACK:    new THREE.MeshStandardMaterial({ color:0x15181c, roughness:0.9,  metalness:0 }),   // neopreno / hule
  BLUE:     new THREE.MeshStandardMaterial({ color:0x1f6dff, roughness:0.5,  metalness:0 }),   // agua helada
  RED:      new THREE.MeshStandardMaterial({ color:0xd93b34, roughness:0.5,  metalness:0 }),   // agua de condensados
  YELLOW:   new THREE.MeshStandardMaterial({ color:0xffc22e, roughness:0.5,  metalness:0 }),   // volantes / seguridad
  PANEL:    new THREE.MeshStandardMaterial({ color:0x3a4149, roughness:0.55, metalness:0 }),
  PANEL_D:  new THREE.MeshStandardMaterial({ color:0x262c33, roughness:0.6,  metalness:0 }),
  WHITE:    new THREE.MeshStandardMaterial({ color:0xe9eae4, roughness:0.4,  metalness:0 }),
  GRILLE:   new THREE.MeshStandardMaterial({ color:0x0d0f12, roughness:0.85, metalness:0 }),
  GLASS:    new THREE.MeshPhysicalMaterial({ color:0xd8f0e8, roughness:0.08, metalness:0,
              transmission:0.92, thickness:0.04, ior:1.45 })
};

// ====== HELPERS DE GEOMETRIA PARAMETRICA ======
const root = new THREE.Group();          // equipo completo, centrado en el origen
const staticG = new THREE.Group();       // partes estaticas (sombras horneadas)
const compG = new THREE.Group();         // ensamble compresor+motor (vibra, castShadow=false)
root.add(staticG, compG);
scene.add(root);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = staticG){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Cilindros orientados por eje (CylinderGeometry nativo apunta en Y)
function cylX(r, len, mat, x, y, z, seg = 24, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.z = Math.PI / 2;
  return m;
}
function cylY(r, len, mat, x, y, z, seg = 24, parent = staticG){
  return mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
}
function cylZ(r, len, mat, x, y, z, seg = 24, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.x = Math.PI / 2;
  return m;
}
// Caja con canto biselado (perfil achaflanado extruido) — sustituto de RoundedBox
function bevelBox(w, h, d, mat, x, y, z, bevel = 0.012, parent = staticG){
  const s = new THREE.Shape();
  const hw = w/2 - bevel, hh = h/2 - bevel;
  s.moveTo(-hw, -h/2); s.lineTo(hw, -h/2);
  s.lineTo(w/2, -hh);  s.lineTo(w/2, hh);
  s.lineTo(hw, h/2);   s.lineTo(-hw, h/2);
  s.lineTo(-w/2, hh);  s.lineTo(-w/2, -hh);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d - bevel*2, bevelEnabled: true,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1 });
  g.translate(0, 0, -(d - bevel*2)/2);
  return mesh(g, mat, x, y, z, parent);
}
// Cabeza abombada (casquete torisferico aproximado) via LatheGeometry, apunta en +X
function dishedHead(R, depth, mat, x, y, z, sign = 1, seg = 32, parent = staticG){
  const pts = [];
  for (let i = 0; i <= 10; i++){
    const a = i / 10 * Math.PI / 2;
    pts.push(new THREE.Vector2(R * Math.cos(a), depth * Math.sin(a)));
  }
  const m = mesh(new THREE.LatheGeometry(pts, seg), mat, x, y, z, parent);
  m.rotation.z = sign > 0 ? -Math.PI/2 : Math.PI/2;
  return m;
}
// Tuberia con codos suavizados: puntos de polilinea -> CurvePath con filetes bezier
function makePipe(points, r, mat, bend = 0.1, parent = staticG, seg = 12){
  const path = new THREE.CurvePath();
  const P = points.map(p => new THREE.Vector3(...p));
  let prev = P[0];
  for (let i = 1; i < P.length - 1; i++){
    const a = P[i], b = P[i+1];
    const dIn = a.clone().sub(prev).normalize();
    const dOut = b.clone().sub(a).normalize();
    const tIn = a.clone().sub(dIn.clone().multiplyScalar(bend));
    const tOut = a.clone().add(dOut.clone().multiplyScalar(bend));
    path.add(new THREE.LineCurve3(prev, tIn));
    path.add(new THREE.QuadraticBezierCurve3(tIn, a, tOut));
    prev = tOut;
  }
  path.add(new THREE.LineCurve3(prev, P[P.length - 1]));
  const len = path.getLength();
  const g = new THREE.TubeGeometry(path, Math.max(16, Math.round(len * 22)), r, seg);
  return mesh(g, mat, 0, 0, 0, parent);
}

// Pernos instanciados globales (una sola draw call)
const boltMatrices = [];
const _bm = new THREE.Matrix4(), _bq = new THREE.Quaternion(), _bs = new THREE.Vector3(1,1,1);
const AXQ = {
  x: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI/2)),
  y: new THREE.Quaternion(),
  z: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0))
};
// Anillo de pernos alrededor de una brida con eje 'x'|'y'|'z'
function boltRing(cx, cy, cz, axis, radius, n){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2;
    const u = Math.cos(a) * radius, v = Math.sin(a) * radius;
    let px = cx, py = cy, pz = cz;
    if (axis === 'x'){ py += u; pz += v; }
    else if (axis === 'y'){ px += u; pz += v; }
    else { px += u; py += v; }
    _bm.compose(new THREE.Vector3(px, py, pz), AXQ[axis], _bs);
    boltMatrices.push(_bm.clone());
  }
}
// Brida (anillo grueso) + anillo de pernos en la cara
function flangeX(R, thick, x, y, z, nBolts, boltR){
  cylX(R, thick, M.FLANGE, x, y, z, 28);
  if (nBolts) boltRing(x + thick/2 + 0.012, y, z, 'x', boltR, nBolts);
}
function flangeZ(R, thick, x, y, z, nBolts, boltR){
  cylZ(R, thick, M.FLANGE, x, y, z, 24);
  if (nBolts) boltRing(x, y, z - thick/2 - 0.012, 'z', boltR, nBolts);
}
function flangeY(R, thick, x, y, z, nBolts, boltR, boltSide = -1){
  cylY(R, thick, M.FLANGE, x, y, z, 24);
  if (nBolts) boltRing(x, y + boltSide * (thick/2 + 0.012), z, 'y', boltR, nBolts);
}

// ==================================================================
// GEOMETRIA DEL EQUIPO (todas las cotas en metros, del spec voxel)
// ==================================================================
const EV = { cy:0.8, r:0.44, half:1.95 };   // evaporador (abajo)
const CO = { cy:1.6, r:0.38, half:1.70 };   // condensador (arriba)
const CP = { cy:1.95, cz:0.35 };            // eje compresor / motor

// ---- Skid estructural + aisladores de neopreno
for (const zr of [-0.55, 0.55]){
  bevelBox(4.4, 0.2, 0.2, M.DARK, 0, 0.2, zr, 0.015);
  // franja de peligro en la cara exterior del riel
  const stripe = mesh(new THREE.PlaneGeometry(4.4, 0.14),
    new THREE.MeshStandardMaterial({ map:hazardTex, roughness:0.6, metalness:0 }),
    0, 0.2, zr + Math.sign(zr) * 0.101);
  if (zr < 0) stripe.rotation.y = Math.PI;
  stripe.castShadow = false;
}
for (const xc of [-2.0, 0, 2.0]) bevelBox(0.2, 0.18, 0.9, M.DARK, xc, 0.2, 0, 0.012);
// aisladores: base de neopreno + placa superior
{
  const isoGeo = new THREE.CylinderGeometry(0.09, 0.11, 0.08, 16);
  const plateGeo = new THREE.CylinderGeometry(0.105, 0.105, 0.02, 16);
  const isoIM = new THREE.InstancedMesh(isoGeo, M.BLACK, 6);
  const plIM = new THREE.InstancedMesh(plateGeo, M.DARK, 6);
  let i = 0;
  for (const xc of [-2.0, 0, 2.0]) for (const zr of [-0.55, 0.55]){
    _bm.setPosition(xc, 0.04, zr); isoIM.setMatrixAt(i, _bm);
    _bm.setPosition(xc, 0.09, zr); plIM.setMatrixAt(i, _bm);
    i++;
  }
  isoIM.castShadow = isoIM.receiveShadow = true;
  plIM.castShadow = plIM.receiveShadow = true;
  staticG.add(isoIM, plIM);
}

// ---- Silletas del evaporador (perfil con muesca circular, extruido)
function saddle(x){
  const s = new THREE.Shape();
  const yTop = 0.35, c = { y: 0.5, r: EV.r + 0.005 };     // coords locales: base en y=0 (mundo y=0.3)
  const xt = Math.sqrt(c.r * c.r - (c.y - yTop) * (c.y - yTop));
  s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0.5, yTop); s.lineTo(xt, yTop);
  s.absarc(0, c.y, c.r, Math.atan2(yTop - c.y, xt), Math.atan2(yTop - c.y, -xt), false);
  s.lineTo(-0.5, yTop); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.24, bevelEnabled: false });
  g.translate(0, 0, -0.12);
  const m = mesh(g, M.DARK, x, 0.3, 0);
  m.rotation.y = Math.PI / 2;
  return m;
}
saddle(-1.55); saddle(1.35);

// ---- EVAPORADOR (barril inferior)
{
  cylX(EV.r, EV.half * 2, M.GREEN, 0, EV.cy, 0, 32);
  // cordones de soldadura (anillos torus instanciados)
  const weldGeo = new THREE.TorusGeometry(EV.r + 0.003, 0.011, 8, 40);
  const weldIM = new THREE.InstancedMesh(weldGeo, M.GREEN_D, 5);
  const wq = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI/2, 0));
  [-1.2, -0.5, 0.2, 0.9, 1.6].forEach((wx, i) => {
    _bm.compose(new THREE.Vector3(wx, EV.cy, 0), wq, _bs);
    weldIM.setMatrixAt(i, _bm);
  });

function waterNozzle(cx, barrelY, barrelR, mat, goesUp){
  const spoolZ = -(barrelR + 0.18);                 // centro del spool horizontal
  const elbowZ = -0.8;
  const endY = goesUp ? 2.06 : 0.16;
  // corrida: sale del barril en -Z, codo, vertical (arriba o abajo)
  makePipe([
    [cx, barrelY, -barrelR + 0.05],
    [cx, barrelY, elbowZ],
    [cx, endY, elbowZ]
  ], 0.15, mat, 0.14);
  // refuerzo en la penetracion del casco
  cylZ(0.185, 0.06, mat, cx, barrelY, -barrelR - 0.01, 20);
  // brida principal del spool + pernos
  flangeZ(0.24, 0.06, cx, barrelY, spoolZ, 8, 0.2);
  // brida del extremo (a piso o a torres) + pernos
  flangeY(0.24, 0.05, cx, endY + (goesUp ? 0.03 : -0.03), elbowZ, 8, 0.2, goesUp ? 1 : -1);
  // valvula de servicio: bonete vertical + volante amarillo (instanciados entre las 4 bocas)
  const vy = barrelY + 0.15;
  valveSpots.push([cx, vy, spoolZ + 0.02]);
  spokeRing(cx, vy + 0.31, spoolZ + 0.02, 'y', 0.1);
  return { cx, spoolZ };
}
const valveSpots = [];
function buildNozzleValves(){
  const n = valveSpots.length;
  const bonnetIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.065, 0.065, 0.24, 16), M.DARK, n);
  const stemIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.02, 0.02, 0.1, 8), M.STEEL, n);
  const wheelIM = new THREE.InstancedMesh(new THREE.TorusGeometry(0.11, 0.018, 8, 24), M.YELLOW, n);
  const wq = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0));
  valveSpots.forEach(([cx, vy, cz], i) => {
    _bm.setPosition(cx, vy + 0.1, cz);  bonnetIM.setMatrixAt(i, _bm);
    _bm.setPosition(cx, vy + 0.27, cz); stemIM.setMatrixAt(i, _bm);
    _bm.compose(new THREE.Vector3(cx, vy + 0.31, cz), wq, _bs); wheelIM.setMatrixAt(i, _bm);
  });
  for (const im of [bonnetIM, stemIM, wheelIM]){
    im.castShadow = im.receiveShadow = true;
    staticG.add(im);
  }
}
// rayos de volante instanciados (todas las valvulas comparten geometria)
const spokeMats = [];
function spokeRing(cx, cy, cz, axis, r){
  for (let i = 0; i < 3; i++){
    const a = i * Math.PI / 3;
    const pos = new THREE.Vector3(cx, cy, cz);
    const q = new THREE.Quaternion();
    if (axis === 'y') q.setFromEuler(new THREE.Euler(Math.PI/2, a, 0, 'YXZ'));
    else if (axis === 'z') q.setFromEuler(new THREE.Euler(0, 0, a));
    else q.setFromEuler(new THREE.Euler(a, 0, Math.PI/2, 'XYZ'));
    _bm.compose(pos, q, _bs);
    spokeMats.push(_bm.clone());
  }
}

function drawScreen(){
  const g = screenCanvas.getContext('2d');
  const on = state.comp, k = state.load / 100;
  const W = 512, H = 320;
  g.fillStyle = '#04100b'; g.fillRect(0, 0, W, H);
  g.strokeStyle = on ? '#0e5c46' : '#0a2c22'; g.lineWidth = 3;
  g.strokeRect(8, 8, W - 16, H - 16);
  // encabezado
  g.font = 'bold 26px monospace'; g.textAlign = 'left';
  g.fillStyle = on ? '#8ef5d9' : '#2c5c4c';
  g.fillText(on ? `CARGA ${state.load}%` : 'STANDBY', 26, 46);
  g.textAlign = 'right';
  g.fillText(on ? 'EVAP 6.7°C' : '--.-°C', W - 26, 46);
  // rejilla de tendencia
  g.strokeStyle = on ? '#0d3c2e' : '#082018'; g.lineWidth = 1;
  for (let y = 70; y <= 210; y += 35){ g.beginPath(); g.moveTo(26, y); g.lineTo(W - 26, y); g.stroke(); }
  // curva de tendencia (matriz LED del voxel -> polilinea con nodos)
  const pts = trendData.map((v, i) => [40 + i * (W - 80) / (trendData.length - 1), 205 - v * 32]);
  g.strokeStyle = on ? '#00d4aa' : '#124035'; g.lineWidth = 4; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.stroke();
  g.fillStyle = on ? '#7dffe0' : '#1a5040';
  for (const p of pts){ g.beginPath(); g.arc(p[0], p[1], 6, 0, Math.PI * 2); g.fill(); }
  // barra de % de carga (4 segmentos como el voxel)
  for (let i = 0; i < 4; i++){
    const lit = on && (i + 1) <= state.load / 25;
    g.fillStyle = lit ? '#00ff66' : '#0a2c1e';
    g.fillRect(30 + i * 116, 236, 100, 36);
    g.fillStyle = lit ? '#04100b' : '#1c4534';
    g.font = 'bold 20px monospace'; g.textAlign = 'center';
    g.fillText(`${(i + 1) * 25}`, 80 + i * 116, 261);
  }
  screenTex.needsUpdate = true;
}

  boltMatrices.forEach((m, i) => boltIM.setMatrixAt(i, m));
  boltIM.castShadow = false; boltIM.receiveShadow = true;
  staticG.add(boltIM);

  const spokeGeo = new THREE.CylinderGeometry(0.011, 0.011, 0.19, 6);
  const spokeIM = new THREE.InstancedMesh(spokeGeo, M.YELLOW, spokeMats.length);
  spokeMats.forEach((m, i) => spokeIM.setMatrixAt(i, m));
  spokeIM.castShadow = false; spokeIM.receiveShadow = true;
  staticG.add(spokeIM);
}

// Partes animadas no proyectan sombra (sombras horneadas estaticas)
compG.traverse(o => { o.castShadow = false; });

// ====== ESTADO / CONTROL DE EQUIPO ======
const state = { comp:false, load:50, rot:true };
const bComp = document.getElementById('bComp');
const bLoad = document.getElementById('bLoad');
const bRot  = document.getElementById('bRot');

function applyState(){
  const on = state.comp, k = state.load / 100;
  ledMat.color.setHex(on ? 0x00ff66 : 0xff2233);
  ledMat.emissive.setHex(on ? 0x00ff66 : 0xff2233);
  ledMat.emissiveIntensity = on ? 1.4 : 1.0;
  statusLight.color.setHex(on ? 0x00ff66 : 0xff2233);
  statusLight.intensity = on ? 0.65 : 0.45;
  screenMat.emissiveIntensity = on ? 0.45 + 0.85 * k : 0.15;
  drawScreen();
  bComp.textContent = on ? 'ENCENDIDO' : 'APAGADO';
  bComp.className = on ? 'on' : 'off';
  bLoad.textContent = state.load + '%';
  bRot.textContent = state.rot ? 'ON' : 'OFF';
  bRot.className = state.rot ? 'on' : 'off';
  renderer.shadowMap.needsUpdate = true;      // re-hornear sombras al cambiar estado
}
bComp.addEventListener('click', () => { state.comp = !state.comp; applyState(); });
bLoad.addEventListener('click', () => { state.load = state.load >= 100 ? 25 : state.load + 25; applyState(); });
bRot.addEventListener('click', () => { state.rot = !state.rot; applyState(); });
applyState();
renderer.shadowMap.needsUpdate = true;        // horneado inicial tras construir la escena

// ====== LOOP DE ANIMACION ======
const clock = new THREE.Clock();
let spin = 0, trendT = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (state.comp){
    spin += dt * (6 + state.load * 0.14);            // velocidad del acople segun carga
    spinner.rotation.x = -spin;
    const amp = 0.0045 * (0.35 + 0.65 * state.load / 100);
    compG.position.y = Math.sin(t * 30) * amp;       // vibracion sutil del ensamble
    compG.position.z = Math.cos(t * 22.7) * amp * 0.6;
    beaconMat.emissiveIntensity = 0.55 + 0.45 * Math.sin(t * 5.5);
    trendT += dt;                                    // tendencia LED en vivo
    if (trendT > 0.6){
      trendT = 0;
      const last = trendData[trendData.length - 1];
      const target = 1 + Math.round(3 * state.load / 100);
      let next = last + (Math.random() < 0.5 ? -1 : 1);
      if (Math.random() < 0.5) next = last + Math.sign(target - last);
      trendData.push(Math.max(1, Math.min(4, next)));
      trendData.shift();
      drawScreen();
    }
  } else {
    compG.position.y *= 0.9;
    compG.position.z *= 0.9;
    beaconMat.emissiveIntensity = 0.12;
  }
  controls.autoRotate = state.rot;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
