<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERCAMBIADOR DE PLACAS · 1.5 × 0.6 × 1.4 m · Realistic</title>
<style>
  body { margin:0; background:#06080d; font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; color:#00d4aa; overflow:hidden; }
  #info { position:fixed; top:14px; left:14px; font-size:11px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; letter-spacing:0.05em; backdrop-filter:blur(6px); }
  #info b { color:#fff; font-size:13px; letter-spacing:0.1em; }
  #info span { color:#7a8a98; }
  #ctl { position:fixed; bottom:14px; left:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:8px 12px; border:1px solid #00d4aa44; color:#7a8a98; backdrop-filter:blur(6px); }
  #legend { position:fixed; top:14px; right:14px; font-size:10px; background:rgba(6,8,13,0.78); padding:10px 14px; border:1px solid #00d4aa44; backdrop-filter:blur(6px); }
  #legend div { display:flex; align-items:center; gap:8px; margin:3px 0; color:#cfe0da; }

  #panel { position:fixed; bottom:14px; right:14px; background:rgba(6,8,13,0.85); border:1px solid #00d4aa44; padding:12px 14px; min-width:240px; font-size:11px; backdrop-filter:blur(6px); }
  #panel .ph { color:#fff; font-size:11px; letter-spacing:0.15em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #00d4aa33; }
  #panel .row { display:flex; justify-content:space-between; align-items:center; margin:7px 0; }

  #panel button { font-family:inherit; font-size:10px; letter-spacing:0.1em; padding:5px 14px; border:1px solid; background:transparent; cursor:pointer; min-width:60px; transition:all 0.2s; }
  #panel button.off { color:#ff4455; border-color:#ff4455; }
  #panel button.on  { color:#06080d; border-color:#00ff66; background:#00ff66; box-shadow:0 0 12px #00ff6655; }
</style>
<script>
// Inyeccion dinamica de importmap: String.fromCharCode(64) evita el mangling de '@' (package@version) por Cloudflare.

  tag.type = 'importmap';
  tag.textContent = JSON.stringify({ imports: {
    "three": "https://unpkg.com/three" + AT + "0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three" + AT + "0.160.0/examples/jsm/"
  }});
  document.head.appendChild(tag);
})();
</script>
</head>
<body>
<div id="info">
  <b>INTERCAMBIADOR DE PLACAS</b><br>
  <span>1.5 × 0.6 × 1.4 m · Realistic PBR · 1 unidad = 1 m</span>
</div>
<div id="legend">
  <div><i style="background:#c0392b"></i> Circuito primario (caliente)</div>
  <div><i style="background:#1f5fa8"></i> Circuito secundario (frío)</div>
</div>
<div id="ctl">DRAG: Rotar &nbsp;·&nbsp; WHEEL: Zoom &nbsp;·&nbsp; RIGHT-DRAG: Pan</div>
<div id="panel">
  <div class="ph">CONTROL DE EQUIPO</div>
  <div class="row"><label>FLUJO</label><button id="bFlow" class="on">ON</button></div>
  <div class="row"><label>AUTO-ROTATE</label><button id="bRot" class="on">ON</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 unidad = 1 m. Spec dimensional: voxel/intercambiador-placas-voxel-v1.html (1 voxel = 0.025 m).
// Equipo: ~1.5 m (L, eje X) x 0.6 m (W, eje Z) x 1.4 m (H, eje Y). Config: 1 paso, 4 bocas en la placa fija (contraflujo).
// HERO: paquete de placas corrugadas (herringbone/espina de pescado) via ripple geometrico + placas alternas
//   (chevron +/-) instanciadas -> 2 draw calls, con juntas oscuras interpuestas.
// FRAME: placa fija (bastidor) + placa movil (seguidora) + columna soporte + barra de carga + barra guia + pies.
// TIE RODS: esparragos roscados con tuercas hexagonales + arandelas (instanciados).
// PORTS: 2 caliente (ROJO) + 2 frio (AZUL), cada uno con stub + brida flush + banda ID + termometro.
// FLUJO: textura de flechas (chevron) que hace scroll por .offset (sin allocations, sin needsUpdate) — como el bump
//   del agua en la torre de enfriamiento. Caliente entra->paquete, sale->fuera; frio en contraflujo.

// ====== SCENE / RENDERER ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 5, 26);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 200);
camera.position.set(1.55, 1.05, 1.65);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // sombras horneadas: un solo horneado tras construir
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 0.8;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0.55, 0.66, 0.0);
// Ground clamp (regla de la casa): ni el target ni la camara bajan del piso
controls.addEventListener('change', () => {
  if (controls.target.y < 0) controls.target.y = 0;
  if (camera.position.y < 0.12) camera.position.y = 0.12;
});

// ====== RIG DE LUCES ======
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(1.9, 4.6, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1.6; sun.shadow.camera.right = 1.9;
sun.shadow.camera.top = 1.7; sun.shadow.camera.bottom = -0.35;
sun.shadow.camera.near = 1.5; sun.shadow.camera.far = 13;
sun.shadow.bias = -0.0004;
sun.target.position.set(0.5, 0.6, 0);
scene.add(sun); scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-2.6, 2.4, -2.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00d4aa, 0.2);
rim.position.set(-1.4, 1.5, 3.0);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ====== PISO ======
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x123f35, 0x0c1d1a);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ====== TEXTURAS PROCEDURALES (CanvasTexture) ======
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function dataTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// Variacion sutil de rugosidad para pintura (mapa lineal). roughnessMap MULTIPLICA el escalar:
// escalar 1.0 * mapa (~0.55 medio) deja el producto en la banda de pintura percibida (0.5-0.6).
const paintRoughTex = dataTex(256, 256, (g) => {
  g.fillStyle = '#8c8c8c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++){
    const v = 120 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
});
paintRoughTex.wrapS = paintRoughTex.wrapT = THREE.RepeatWrapping;
paintRoughTex.repeat.set(2, 3);

// Textura de FLUJO: flechas chevron apuntando a lo largo del eje del tubo (V del cilindro).
// base = color pintado del circuito; flechas mas claras. Se anima con .offset.y (scroll, sin allocations).
function flowTex(base, arrow){
  const t = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.strokeStyle = arrow; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
    for (let cy = 24; cy < h + 20; cy += 44){
      g.beginPath();
      g.moveTo(12, cy + 20); g.lineTo(w / 2, cy); g.lineTo(w - 12, cy + 20);
      g.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 4);
  return t;
}

// Placa de datos
function nameplateTex(title, sub, rows){
  return canvasTex(512, 256, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#d8dade'); grad.addColorStop(0.5, '#b8bcc2'); grad.addColorStop(1, '#c8ccd2');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#3a3f46'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
    g.fillStyle = '#22262c';
    g.font = 'bold 30px monospace'; g.textAlign = 'center';
    g.fillText(title, w/2, 54);
    g.font = '20px monospace';
    g.fillText(sub, w/2, 86);
    g.font = '19px monospace'; g.textAlign = 'left';
    rows.forEach((r, i) => g.fillText(r, 40, 128 + i * 30));
    for (const [bx, by] of [[26, 26], [w-26, 26], [26, h-26], [w-26, h-26]]){
      g.beginPath(); g.arc(bx, by, 7, 0, Math.PI*2); g.fillStyle = '#787c82'; g.fill();
    }
  });
}
const plateTex = nameplateTex('INTERCAMBIADOR PLACAS', 'GASKETED · 1 PASO · CONTRAFLUJO', [
  'MODELO      IP-M10-BFG', 'PLACAS      44 · AISI 316', 'SERV.       90/70 · 12/6 C']);

// Caratula de gauge (fondo segun servicio, escala 270°, aguja horneada)
function gaugeTex(bg, unit, label, frac, needleCol){
  return canvasTex(256, 256, (g, w, h) => {
    const cx = w/2, cy = h/2;
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#22262c'; g.lineWidth = 8;
    g.beginPath(); g.arc(cx, cy, 118, 0, Math.PI*2); g.stroke();
    const a0 = Math.PI * 0.75, sweep = Math.PI * 1.5;
    for (let i = 0; i <= 30; i++){
      const a = a0 + sweep * i / 30, major = i % 5 === 0;
      const r1 = 108, r0 = major ? 90 : 99;
      g.strokeStyle = '#22262c'; g.lineWidth = major ? 5 : 2;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.stroke();
      if (major){
        g.fillStyle = '#22262c'; g.font = 'bold 20px monospace'; g.textAlign = 'center';
        g.fillText(String(i / 5 * 20), cx + Math.cos(a) * 70, cy + Math.sin(a) * 70 + 7);
      }
    }
    g.fillStyle = '#22262c'; g.font = 'bold 17px monospace'; g.textAlign = 'center';
    g.fillText(unit, cx, cy + 46);
    g.font = '13px monospace';
    g.fillText(label, cx, cy + 66);
    const na = a0 + sweep * frac;
    g.strokeStyle = needleCol; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - Math.cos(na) * 18, cy - Math.sin(na) * 18);
    g.lineTo(cx + Math.cos(na) * 92, cy + Math.sin(na) * 92); g.stroke();
    g.fillStyle = '#22262c';
    g.beginPath(); g.arc(cx, cy, 12, 0, Math.PI*2); g.fill();
    g.fillStyle = needleCol;
    g.beginPath(); g.arc(cx, cy, 6, 0, Math.PI*2); g.fill();
  });
}
// Termometros: caliente = caratula calida, aguja alta; frio = caratula azul, aguja baja.
const faceHot  = gaugeTex('#f3ded0', 'C', 'PRIMARIO',   0.78, '#c0392b');
const faceCold = gaugeTex('#cfe3f6', 'C', 'SECUNDARIO', 0.18, '#1f5fa8');

// ====== PALETA PBR (metalness 0 = pintado · metalness 1 = metal desnudo) ======
// Leccion documentada (torre/bomba/vav/tanques): gris medio + metalness 1 lee NEGRO en este entorno.
// Bastidor pintado -> metalness 0 + roughnessMap. Paquete de placas, bridas, esparragos, tuercas, barras
// -> metal desnudo (metalness 1, roughness 0.3-0.4): es el look de un intercambiador de placas.
const M = {
  PLATE_A:  new THREE.MeshStandardMaterial({ color:0xd7dce1, roughness:0.32, metalness:1, side:THREE.DoubleSide }), // inox claro
  PLATE_B:  new THREE.MeshStandardMaterial({ color:0xbfc7cf, roughness:0.37, metalness:1, side:THREE.DoubleSide }), // inox medio
  GASKET:   new THREE.MeshStandardMaterial({ color:0x13171d, roughness:0.95, metalness:0 }),                       // juntas
  FRAME:    new THREE.MeshStandardMaterial({ color:0x33414f, roughness:1.0, metalness:0, roughnessMap:paintRoughTex }), // bastidor pintado
  FRAME_D:  new THREE.MeshStandardMaterial({ color:0x232d37, roughness:0.85, metalness:0 }),                       // bordes/base
  BAR:      new THREE.MeshStandardMaterial({ color:0x9198a0, roughness:0.4, metalness:1 }),                        // barras de carga/guia
  ROD:      new THREE.MeshStandardMaterial({ color:0x9aa1a9, roughness:0.38, metalness:1 }),                       // esparragos
  ZINC:     new THREE.MeshStandardMaterial({ color:0xcaa94f, roughness:0.35, metalness:1 }),                       // tuercas/arandelas (zincado)
  STEEL:    new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.34, metalness:1 }),                       // bridas / metal desnudo
  BOLT:     new THREE.MeshStandardMaterial({ color:0x22242a, roughness:0.4, metalness:1 }),
  BRASS:    new THREE.MeshStandardMaterial({ color:0xb87333, roughness:0.35, metalness:1 }),                       // stub / termopozo del gauge
  RED:      new THREE.MeshStandardMaterial({ color:0xc0392b, roughness:0.85, metalness:0 }),                       // ID caliente (pintado)
  BLUE:     new THREE.MeshStandardMaterial({ color:0x1f5fa8, roughness:0.85, metalness:0 }),                       // ID frio (pintado)
  DARK:     new THREE.MeshStandardMaterial({ color:0x1a1d22, roughness:0.8, metalness:0 }),                        // barrenos
  GLASS:    new THREE.MeshPhysicalMaterial({ color:0xeef4ff, roughness:0.06, metalness:0,
              transmission:0.92, thickness:0.01, ior:1.45 })
};

// ====== HELPERS DE GEOMETRIA ======
const staticG = new THREE.Group();      // todo estatico (sombras horneadas una vez)
scene.add(staticG);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = staticG){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = staticG){
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function cylX(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.z = Math.PI / 2;
  return m;
}
function cylY(r, len, mat, x, y, z, seg = 20, parent = staticG){
  return mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
}
function cylZ(r, len, mat, x, y, z, seg = 20, parent = staticG){
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, parent);
  m.rotation.x = Math.PI / 2;
  return m;
}

// Pernos instanciados globales (bridas + anclas) -> una sola draw call
const boltMatrices = [];
const _bm = new THREE.Matrix4(), _bs = new THREE.Vector3(1,1,1);
const AXQ = {
  x: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI/2)),
  y: new THREE.Quaternion(),
  z: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2, 0, 0))
};
function boltRing(cx, cy, cz, axis, radius, n){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + Math.PI / n;
    const u = Math.cos(a) * radius, v = Math.sin(a) * radius;
    let px = cx, py = cy, pz = cz;
    if (axis === 'x'){ py += u; pz += v; }
    else if (axis === 'y'){ px += u; pz += v; }
    else { px += u; py += v; }
    _bm.compose(new THREE.Vector3(px, py, pz), AXQ[axis], _bs);
    boltMatrices.push(_bm.clone());
  }
}
// Brida a ras (flush) + anillo de esparragos
function flangeX(R, thick, x, y, z, nBolts, boltR, boltSide = -1){
  cylX(R, thick, M.STEEL, x, y, z, 24);
  if (nBolts) boltRing(x + boltSide * (thick/2 + 0.006), y, z, 'x', boltR, nBolts);
}
// InstancedMesh util
function makeIM(geo, mat, mats, parent = staticG, cast = true){
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = cast; im.receiveShadow = true;
  parent.add(im);
  return im;
}
const _q0 = new THREE.Quaternion();
function tMat(x, y, z, q = _q0, s = _bs){
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), q, s);
}
// Gauge (dial en canvas) mirando a +Z: stub laton + bisel + caratula + lente
function gaugeZ(x, y, z, faceTex, parent = staticG){
  cylZ(0.011, 0.05, M.BRASS, x, y, z - 0.03, 12, parent);
  cylZ(0.05, 0.032, M.DARK, x, y, z, 22, parent);
  mesh(new THREE.TorusGeometry(0.045, 0.006, 8, 24), M.BRASS, x, y, z + 0.018, parent);
  const face = mesh(new THREE.CircleGeometry(0.042, 24),
    new THREE.MeshStandardMaterial({ map:faceTex, emissiveMap:faceTex, emissive:0xffffff,
      emissiveIntensity:0.2, roughness:0.35, metalness:0 }), x, y, z + 0.019, parent);
  face.castShadow = false;
  const lens = cylZ(0.043, 0.006, M.GLASS, x, y, z + 0.022, 24, parent);
  lens.castShadow = false;
}

// ==================================================================
// COTAS (metros).  X = largo (0 = placa fija) · Y = alto · Z = ancho (centrado en 0)
// ==================================================================
const HEAD_X = 0.04, HEAD_TH = 0.08, HEAD_H = 1.24, HEAD_W = 0.58, HEAD_CY = 0.68;
const FOLL_X = 1.09, FOLL_TH = 0.08, FOLL_H = 1.02, FOLL_W = 0.54, FOLL_CY = 0.70;
const COL_X  = 1.34;
const BAR_TY = 1.30, BAR_BY = 0.13;
// paquete de placas
const PACK_X0 = 0.095, PACK_LEN = 0.95, N_PLATES = 44;
const PACK_CY = 0.72, PACK_H = 0.92, PACK_W = 0.50, PITCH = PACK_LEN / N_PLATES;

// ==================================================================
// PAQUETE DE PLACAS CORRUGADAS (HERO)
// Ripple geometrico: plano en XY, desplazamiento sinusoidal en Z (normal), luego rotateY(90)
// -> la normal apunta a +X (eje de apilado). Crestas diagonales (chevron) via fase mixta Y/Z.
// Placas alternas usan dir +/- -> patron de espina de pescado (herringbone) entre vecinas.
// ==================================================================
const AMP = 0.006, KY = 72, KZ = 42;
function plateGeo(dir){
  const g = new THREE.PlaneGeometry(PACK_W, PACK_H, 6, 18);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const u = pos.getX(i), v = pos.getY(i);
    pos.setZ(i, AMP * Math.sin(KY * v + dir * KZ * u));
  }
  g.computeVertexNormals();
  g.rotateY(Math.PI / 2);   // normal +Z -> +X (eje de apilado)
  return g;
}
{
  const geoA = plateGeo(1), geoB = plateGeo(-1);
  const matsA = [], matsB = [];
  for (let i = 0; i < N_PLATES; i++){
    const x = PACK_X0 + (i + 0.5) * PITCH;
    (i % 2 === 0 ? matsA : matsB).push(tMat(x, PACK_CY, 0));
  }
  makeIM(geoA, M.PLATE_A, matsA);
  makeIM(geoB, M.PLATE_B, matsB);
  // Juntas (gaskets) oscuras interpuestas: bloquean el "see-through" y dan la linea oscura entre placas.
  const gaskGeo = new THREE.BoxGeometry(0.005, PACK_H * 0.985, PACK_W * 0.985);
  const gMats = [];
  for (let i = 0; i < N_PLATES - 1; i++) gMats.push(tMat(PACK_X0 + (i + 1) * PITCH, PACK_CY, 0));
  makeIM(gaskGeo, M.GASKET, gMats);
}

// ==================================================================
// BASTIDOR: placa fija + placa movil + columna + barras + pies
// ==================================================================
{
  // --- Pies / canales base ---
  box(0.14, 0.06, HEAD_W + 0.06, M.FRAME_D, HEAD_X, 0.03, 0);            // pie placa fija
  box(0.14, 0.06, 0.30, M.FRAME_D, COL_X, 0.03, 0);                     // pie columna
  for (const [ax, az] of [[HEAD_X, HEAD_W/2 - 0.03], [HEAD_X, -HEAD_W/2 + 0.03],
                          [COL_X, 0.11], [COL_X, -0.11]])
    boltRing(ax, 0.055, az, 'y', 0.0001, 1);

  // --- Placa fija (bastidor frontal, pesado) ---
  box(HEAD_TH, HEAD_H, HEAD_W, M.FRAME, HEAD_X, HEAD_CY, 0);
  box(HEAD_TH + 0.015, 0.05, HEAD_W + 0.015, M.FRAME_D, HEAD_X, HEAD_CY + HEAD_H/2, 0);  // ceja superior
  box(HEAD_TH + 0.015, 0.05, HEAD_W + 0.015, M.FRAME_D, HEAD_X, HEAD_CY - HEAD_H/2, 0);  // ceja inferior

  // --- Placa movil (seguidora / de presion) ---
  box(FOLL_TH, FOLL_H, FOLL_W, M.FRAME, FOLL_X, FOLL_CY, 0);
  box(FOLL_TH + 0.015, 0.045, FOLL_W + 0.015, M.FRAME_D, FOLL_X, FOLL_CY + FOLL_H/2, 0);
  box(0.12, 0.11, 0.12, M.FRAME_D, FOLL_X, BAR_TY, 0);                  // colgador sobre la barra

  // --- Columna de soporte trasera ---
  box(0.07, 1.20, 0.16, M.FRAME, COL_X, 0.66, 0);
  box(0.09, 0.05, 0.20, M.FRAME_D, COL_X, 1.24, 0);                     // tapa

  // --- Barra de carga (superior) y barra guia (inferior) ---
  const barLen = COL_X - HEAD_X + 0.02;
  const barCx = (HEAD_X + COL_X) / 2;
  box(barLen, 0.055, 0.06, M.BAR, barCx, BAR_TY, 0);                    // barra de carga
  box(barLen, 0.05, 0.05, M.BAR, barCx, BAR_BY, 0);                     // barra guia
}

// ==================================================================
// ESPARRAGOS DE APRIETE (tie rods) + tuercas hex + arandelas (instanciados)
// ==================================================================
{
  const rodX0 = -0.045, rodX1 = FOLL_X + 0.075;   // frente de la placa fija -> detras de la seguidora
  const rodLen = rodX1 - rodX0, rodCx = (rodX0 + rodX1) / 2;
  const rodYs = [0.32, 0.68, 1.04], rodZs = [0.27, -0.27];
  const rodMats = [], nutMats = [], washMats = [];
  for (const ry of rodYs){
    for (const rz of rodZs){
      rodMats.push(tMat(rodCx, ry, rz, AXQ.x));
      for (const nx of [rodX0 + 0.012, rodX1 - 0.012]) nutMats.push(tMat(nx, ry, rz, AXQ.x));
      for (const wx of [rodX0 + 0.028, rodX1 - 0.028]) washMats.push(tMat(wx, ry, rz, AXQ.x));
    }
  }
  makeIM(new THREE.CylinderGeometry(0.011, 0.011, rodLen, 10), M.ROD, rodMats);
  makeIM(new THREE.CylinderGeometry(0.02, 0.02, 0.024, 6), M.ZINC, nutMats);       // tuercas hexagonales
  makeIM(new THREE.CylinderGeometry(0.026, 0.026, 0.006, 12), M.ZINC, washMats);   // arandelas
}

// ==================================================================
// 4 BOCAS BRIDADAS + TERMOMETROS (placa fija, contraflujo)
// Caliente (ROJO): entra arriba-izq (-Z), sale abajo-izq. Frio (AZUL): entra abajo-der (+Z), sale arriba-der.
// FLUJO: cada stub lleva textura de flechas que hace scroll por .offset.y (sin allocations).
// ==================================================================
const pipes = [];   // { tex, mat, dir } — se animan en el loop
function flowPort(y, z, hot, dir){
  const base = hot ? '#8e241f' : '#173f6e';
  const arrow = hot ? '#ff6a4d' : '#5fa8ff';
  const emis  = hot ? 0xff3b1e : 0x2f7fff;
  const idMat = hot ? M.RED : M.BLUE;
  const face  = hot ? faceHot : faceCold;

  const stubR = 0.052, stubL = 0.17;
  const stubCx = -0.005 - stubL / 2;                 // arranca en la cara de la placa fija (x=0)

  // aro de identificacion pintado en la placa (cara -X)
  const ring = mesh(new THREE.TorusGeometry(0.075, 0.016, 10, 24), idMat, 0.001, y, z);
  ring.rotation.y = Math.PI / 2;

  // stub con textura de flujo (tubo pintado + flechas)
  const tex = flowTex(base, arrow);
  const mat = new THREE.MeshStandardMaterial({ map:tex, emissive:new THREE.Color(emis),
    emissiveMap:tex, emissiveIntensity:0.0, roughness:0.55, metalness:0 });
  const stub = mesh(new THREE.CylinderGeometry(stubR, stubR, stubL, 20), mat, stubCx, y, z);
  stub.rotation.z = Math.PI / 2;
  stub.castShadow = false;                                     // parte animada (offset de textura): fuera del horneado
  pipes.push({ tex, mat, dir });

  // banda ID de color junto a la brida
  const band = cylX(stubR + 0.006, 0.03, idMat, stubCx - stubL / 2 + 0.03, y, z, 20);
  band.castShadow = false;

  // brida flush en el extremo + contrabrida enterrada (sin air gap) + barreno + pernos
  const fx = stubCx - stubL / 2 - 0.012;
  flangeX(0.088, 0.024, fx, y, z, 6, 0.066, -1);
  cylX(0.088, 0.024, M.STEEL, fx - 0.023, y, z, 24);            // contrabrida flush
  cylX(0.03, 0.055, M.DARK, fx - 0.01, y, z, 16);              // barreno de la boca

  // termometro en termopozo (offset simetrico hacia afuera del eje)
  const gs = Math.sign(z) || 1, gx = stubCx + 0.02, gz = z + gs * 0.055;
  cylZ(0.009, 0.06, M.BRASS, gx, y, z + gs * 0.03, 10);        // termopozo
  gaugeZ(gx, y, gz, face);
}
flowPort(1.02, -0.15, true,  1);    // primario IN  (caliente, entra al paquete)
flowPort(0.30, -0.15, true, -1);    // primario OUT (caliente, sale)
flowPort(0.30,  0.15, false, 1);    // secundario IN  (frio, entra) — contraflujo
flowPort(1.02,  0.15, false, -1);   // secundario OUT (frio, sale)

// --- Placa de datos (cara frontal -X de la placa fija) ---
const np = mesh(new THREE.PlaneGeometry(0.20, 0.10),
  new THREE.MeshStandardMaterial({ map:plateTex, roughness:0.4, metalness:0 }),
  -0.004, 0.66, 0.0);
np.rotation.y = -Math.PI / 2;
np.castShadow = false;

// ==================================================================
// INSTANCIADO GLOBAL (esparragos de bridas + anclas)
// ==================================================================
makeIM(new THREE.CylinderGeometry(0.007, 0.007, 0.02, 6), M.BOLT, boltMatrices, staticG, false);

// ====== ESTADO / CONTROL DE EQUIPO ======
const state = { flow:true, rot:true };
const bFlow = document.getElementById('bFlow');
const bRot  = document.getElementById('bRot');
function setBtn(b, on){ b.className = on ? 'on' : 'off'; b.textContent = on ? 'ON' : 'OFF'; }

function applyState(){
  // FLUJO off -> congela scroll y apaga emisivo (solo muta emissiveIntensity)
  if (!state.flow) for (const p of pipes) p.mat.emissiveIntensity = 0.0;
  controls.autoRotate = state.rot;
}
bFlow.addEventListener('click', () => { state.flow = !state.flow; setBtn(bFlow, state.flow); applyState(); });
bRot.addEventListener('click',  () => { state.rot  = !state.rot;  setBtn(bRot,  state.rot);  applyState(); });

applyState();
renderer.shadowMap.needsUpdate = true;          // horneado unico tras construir la escena

// ====== LOOP DE ANIMACION ======
const clock = new THREE.Clock();
let simT = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.flow){
    simT += dt;
    const pulse = 0.45 + 0.18 * Math.sin(simT * 3.0);   // solo muta escalares — sin allocations
    for (const p of pipes){
      p.tex.offset.y += p.dir * dt * 0.4;               // scroll de flechas (sin needsUpdate)
      p.mat.emissiveIntensity = pulse;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
