<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cárcamo de Agua · Visualización 3D</title>
<style>
:root {
  --bg: #06080d;
  --panel-bg: rgba(10, 14, 22, 0.92);
  --border: #1a2332;
  --border-strong: #2a3b4f;
  --text: #e6f7f1;
  --text-dim: #8a9aab;
  --text-faint: #4a5d70;
  --accent: #00d4aa;
  --accent-dim: rgba(0, 212, 170, 0.25);
  --warn: #f5a742;
  --danger: #ff4757;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#scene { position: fixed; inset: 0; }

#header {
  position: fixed;
  top: 16px; left: 16px;
  padding: 10px 18px;
  background: var(--panel-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 6px;
  letter-spacing: 0.18em;
  z-index: 10;
}
#header .title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
#header .sub {
  font-size: 9px;
  color: var(--text-faint);
  margin-top: 3px;
  letter-spacing: 0.22em;
}

#panel {
  position: fixed;
  right: 16px; bottom: 16px;
  width: 340px;
  padding: 16px;
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 8px;
  z-index: 10;
}
.label {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-faint);
  margin-bottom: 6px;
  font-weight: 500;
}
.display-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.display-card {
  padding: 10px 12px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.display-value {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1;
  display: flex;
  align-items: baseline;
}
.display-card.real .display-value { color: var(--text); }
.display-card.state .display-value { color: var(--accent); transition: color 0.3s ease; }
.display-suffix {
  font-size: 12px;
  color: var(--text-faint);
  margin-left: 4px;
  font-weight: 400;
}

.slider-row { margin-bottom: 0; }
input[type="range"] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-strong);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  margin-top: 6px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  background: var(--accent);
  border: 2px solid #06080d;
  border-radius: 50%;
  cursor: grab;
  box-shadow: 0 0 0 4px var(--accent-dim);
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px;
  background: var(--accent);
  border: 2px solid #06080d;
  border-radius: 50%;
  cursor: grab;
  box-shadow: 0 0 0 4px var(--accent-dim);
}
.ticks {
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  color: var(--text-faint);
  margin-top: 8px;
  padding: 0 4px;
  letter-spacing: 0.1em;
}

.level-bar {
  position: fixed;
  left: 16px; bottom: 60px;
  width: 36px; height: 280px;
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px;
  z-index: 10;
}
.level-bar-inner {
  position: relative;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  border-radius: 3px;
  overflow: hidden;
}
.level-fill {
  position: absolute;
  left: 0; bottom: 0; width: 100%;
  background: linear-gradient(180deg, var(--accent), rgba(0, 212, 170, 0.4));
  transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s;
  height: 50%;
}
.level-marks {
  position: absolute; inset: 0;
  pointer-events: none;
}
.level-mark {
  position: absolute; left: 0; right: 0;
  height: 1px;
  background: rgba(255,255,255,0.10);
}
.level-bar-label {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  bottom: -22px;
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--text-faint);
}

#footer {
  position: fixed;
  bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-faint);
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>
<div id="scene"></div>

<div id="header">
  <div class="title">CÁRCAMO DE AGUA</div>
  <div class="sub">DESECHOS · MONITOREO DE DESBORDAMIENTO</div>
</div>

<div class="level-bar">
  <div class="level-bar-inner">
    <div class="level-fill" id="levelFill"></div>
    <div class="level-marks" id="levelMarks"></div>
  </div>
  <div class="level-bar-label">NIVEL</div>
</div>

<div id="panel">
  <div class="display-row">
    <div class="display-card real">
      <div class="label">VALOR REAL</div>
      <div class="display-value"><span id="rawValue">50</span><span class="display-suffix">%</span></div>
    </div>
    <div class="display-card state">
      <div class="label">ESTADO</div>
      <div class="display-value"><span id="stateValue">50</span><span class="display-suffix">%</span></div>
    </div>
  </div>

  <div class="slider-row">
    <div class="label">CONTROL · 0–100</div>
    <input type="range" min="0" max="100" value="50" id="slider">
    <div class="ticks">
      <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
    </div>
  </div>
</div>

<div id="footer">CLICK Y ARRASTRA PARA ROTAR · SCROLL PARA ZOOM</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================
// SETUP
// ============================================================
const sceneEl = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
sceneEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);
scene.fog = new THREE.Fog(0x06080d, 22, 40);

// PBR environment from RoomEnvironment
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8, 4.5, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);
controls.minDistance = 5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minAzimuthAngle = -Math.PI * 0.6;   // limita rotación para mantener cutaway visible
controls.maxAzimuthAngle = Math.PI * 0.6;
controls.autoRotate = false;

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(8, 14, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 35;
dirLight.shadow.bias = -0.0003;
dirLight.shadow.normalBias = 0.02;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x9ab8d8, 0.35);
fillLight.position.set(-6, 6, -4);
scene.add(fillLight);

scene.add(new THREE.AmbientLight(0x4a5a6e, 0.3));

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.4;
ground.receiveShadow = true;
scene.add(ground);

// ============================================================
// DIMENSIONS
// ============================================================
const PIT_W = 6;
const PIT_D = 6;
const PIT_H = 5;
const WALL = 0.4;
const TOP_T = 0.4;

const HOLE_W = 1.0;
const HOLE_D = 1.0;

const TANK_R = 1.45;
const TANK_H = 4.0;
const TANK_BASE_Y = -PIT_H / 2 + 0.08;
const TANK_TOP_Y = TANK_BASE_Y + TANK_H;

// ============================================================
// PROCEDURAL CONCRETE TEXTURE
// ============================================================
function makeConcreteTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#bdb6a6';
  ctx.fillRect(0, 0, size, size);

  // Fine noise
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * 38;
    data[i]     = Math.max(0, Math.min(255, data[i]     + n));
    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + n));
    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  // Dark stains
  for (let i = 0; i < 18; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 15 + Math.random() * 50;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(50, 40, 30, 0.55)');
    g.addColorStop(1, 'rgba(50, 40, 30, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Light spots
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 8 + Math.random() * 25;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(230, 225, 210, 0.40)');
    g.addColorStop(1, 'rgba(230, 225, 210, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Aggregate dots
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 1 + Math.random() * 2.5;
    ctx.fillStyle = `rgba(${30 + Math.random() * 40}, ${25 + Math.random() * 30}, ${20 + Math.random() * 30}, 0.55)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repeat.set(1.5, 1.5);
  return tex;
}

// ============================================================
// MATERIALS
// ============================================================
const concreteMat = new THREE.MeshStandardMaterial({
  map: makeConcreteTexture(),
  color: 0xc8c0b0,
  roughness: 0.92,
  metalness: 0.04,
});

const yellowMat = new THREE.MeshStandardMaterial({
  color: 0xf2c33d,
  roughness: 0.45,
  metalness: 0.2,
});

const metalMat = new THREE.MeshStandardMaterial({
  color: 0xa0a8b0,
  roughness: 0.32,
  metalness: 0.88,
});

const tankWallMat = new THREE.MeshPhysicalMaterial({
  color: 0xb8c8d4,
  roughness: 0.04,
  metalness: 0.0,
  transmission: 0.92,
  thickness: 0.15,
  ior: 1.45,
  side: THREE.DoubleSide,
  envMapIntensity: 1.4,
  attenuationDistance: 5,
  attenuationColor: 0xeaf2f8,
});

const tankCapMat = new THREE.MeshStandardMaterial({
  color: 0x8a8e92,
  roughness: 0.55,
  metalness: 0.55,
});

const sensorBodyMat = new THREE.MeshStandardMaterial({
  color: 0x252830,
  roughness: 0.55,
  metalness: 0.35,
});

const sensorScreenMat = new THREE.MeshStandardMaterial({
  color: 0x101418,
  roughness: 0.2,
  metalness: 0.1,
  emissive: 0x003322,
  emissiveIntensity: 0.4,
});

const sensorLEDMat = new THREE.MeshStandardMaterial({
  color: 0xff3344,
  roughness: 0.4,
  metalness: 0.1,
  emissive: 0xff1122,
  emissiveIntensity: 0.8,
});

// ============================================================
// PIT (concrete cutaway)
// ============================================================
const pitGroup = new THREE.Group();
scene.add(pitGroup);

function meshConcrete(geo, x, y, z) {
  const m = new THREE.Mesh(geo, concreteMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Floor
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(PIT_W + WALL * 2, WALL, PIT_D + WALL * 2),
  0, -PIT_H / 2 - WALL / 2, 0
));

// Back wall
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(PIT_W + WALL * 2, PIT_H, WALL),
  0, 0, -PIT_D / 2 - WALL / 2
));

// Left wall
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(WALL, PIT_H, PIT_D + WALL * 2),
  -PIT_W / 2 - WALL / 2, 0, 0
));

// Right wall
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(WALL, PIT_H, PIT_D + WALL * 2),
  PIT_W / 2 + WALL / 2, 0, 0
));

// Front wall: CUTAWAY (omitido)

// Top: 4 paneles formando un marco con orificio para chimenea
const TOP_OUT_W = PIT_W + WALL * 2;
const TOP_OUT_D = PIT_D + WALL * 2;
const topY = PIT_H / 2 + TOP_T / 2;

// back panel
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(TOP_OUT_W, TOP_T, (TOP_OUT_D - HOLE_D) / 2),
  0, topY, -(HOLE_D / 2 + (TOP_OUT_D - HOLE_D) / 4)
));
// front panel
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry(TOP_OUT_W, TOP_T, (TOP_OUT_D - HOLE_D) / 2),
  0, topY, +(HOLE_D / 2 + (TOP_OUT_D - HOLE_D) / 4)
));
// left panel
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry((TOP_OUT_W - HOLE_W) / 2, TOP_T, HOLE_D),
  -(HOLE_W / 2 + (TOP_OUT_W - HOLE_W) / 4), topY, 0
));
// right panel
pitGroup.add(meshConcrete(
  new THREE.BoxGeometry((TOP_OUT_W - HOLE_W) / 2, TOP_T, HOLE_D),
  (HOLE_W / 2 + (TOP_OUT_W - HOLE_W) / 4), topY, 0
));

// Yellow safety band en el perímetro de la tapa
const bandH = 0.06;
const bandT = 0.16;
const bandY = topY + TOP_T / 2 + bandH / 2;

function addYellow(geo, x, y, z) {
  const m = new THREE.Mesh(geo, yellowMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  pitGroup.add(m);
  return m;
}

addYellow(
  new THREE.BoxGeometry(TOP_OUT_W, bandH, bandT),
  0, bandY, TOP_OUT_D / 2 - bandT / 2
);
addYellow(
  new THREE.BoxGeometry(TOP_OUT_W, bandH, bandT),
  0, bandY, -TOP_OUT_D / 2 + bandT / 2
);
addYellow(
  new THREE.BoxGeometry(bandT, bandH, TOP_OUT_D - bandT * 2),
  -TOP_OUT_W / 2 + bandT / 2, bandY, 0
);
addYellow(
  new THREE.BoxGeometry(bandT, bandH, TOP_OUT_D - bandT * 2),
  TOP_OUT_W / 2 - bandT / 2, bandY, 0
);

// Yellow band rodeando el orificio de la chimenea
const innerT = 0.08;
addYellow(
  new THREE.BoxGeometry(HOLE_W + innerT * 2, bandH, innerT),
  0, bandY, HOLE_D / 2 + innerT / 2
);
addYellow(
  new THREE.BoxGeometry(HOLE_W + innerT * 2, bandH, innerT),
  0, bandY, -HOLE_D / 2 - innerT / 2
);
addYellow(
  new THREE.BoxGeometry(innerT, bandH, HOLE_D),
  -HOLE_W / 2 - innerT / 2, bandY, 0
);
addYellow(
  new THREE.BoxGeometry(innerT, bandH, HOLE_D),
  HOLE_W / 2 + innerT / 2, bandY, 0
);

// ============================================================
// TANK INTERIOR
// ============================================================
const tankGroup = new THREE.Group();
scene.add(tankGroup);

// Tank wall (open cylinder, glass-like)
const tankWall = new THREE.Mesh(
  new THREE.CylinderGeometry(TANK_R, TANK_R, TANK_H, 64, 1, true),
  tankWallMat
);
tankWall.position.y = TANK_BASE_Y + TANK_H / 2;
tankGroup.add(tankWall);

// Tank base disc
const tankBase = new THREE.Mesh(
  new THREE.CylinderGeometry(TANK_R + 0.05, TANK_R + 0.05, 0.08, 48),
  tankCapMat
);
tankBase.position.y = TANK_BASE_Y - 0.04;
tankBase.castShadow = true;
tankBase.receiveShadow = true;
tankGroup.add(tankBase);

// Tank cap: stepped (disc + cone above)
const capDisc = new THREE.Mesh(
  new THREE.CylinderGeometry(TANK_R + 0.18, TANK_R + 0.18, 0.1, 48),
  tankCapMat
);
capDisc.position.y = TANK_TOP_Y + 0.05;
capDisc.castShadow = true;
tankGroup.add(capDisc);

const capCone = new THREE.Mesh(
  new THREE.ConeGeometry(TANK_R * 0.85, 0.45, 48),
  tankCapMat
);
capCone.position.y = TANK_TOP_Y + 0.1 + 0.225;
capCone.castShadow = true;
tankGroup.add(capCone);

// ============================================================
// SENSOR (mounted on tank exterior)
// ============================================================
const sensorGroup = new THREE.Group();

const sBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.4, 0.18),
  sensorBodyMat
);
sBody.castShadow = true;
sensorGroup.add(sBody);

const sScreen = new THREE.Mesh(
  new THREE.BoxGeometry(0.36, 0.22, 0.005),
  sensorScreenMat
);
sScreen.position.set(0, 0.05, 0.092);
sensorGroup.add(sScreen);

const sLED = new THREE.Mesh(
  new THREE.SphereGeometry(0.025, 16, 12),
  sensorLEDMat
);
sLED.position.set(0.15, -0.13, 0.092);
sensorGroup.add(sLED);

const sLEDLight = new THREE.PointLight(0xff3344, 0.5, 1.2);
sLEDLight.position.copy(sLED.position).add(new THREE.Vector3(0, 0, 0.05));
sensorGroup.add(sLEDLight);

// Mounting bracket
const sBracket = new THREE.Mesh(
  new THREE.BoxGeometry(0.05, 0.3, 0.08),
  metalMat
);
sBracket.position.set(0, 0, -0.13);
sensorGroup.add(sBracket);

// Posición: lado frente-derecho del tanque
const sensorAngle = Math.PI * 0.18;
sensorGroup.position.set(
  Math.sin(sensorAngle) * (TANK_R + 0.12),
  TANK_TOP_Y - 0.6,
  Math.cos(sensorAngle) * (TANK_R + 0.12)
);
sensorGroup.rotation.y = sensorAngle;
scene.add(sensorGroup);

// ============================================================
// CHIMNEY (vent stack)
// ============================================================
const CHIMNEY_BASE_Y = TANK_TOP_Y + 0.55;
const CHIMNEY_TOP_Y = topY + TOP_T / 2 + 1.6;
const CHIMNEY_LEN = CHIMNEY_TOP_Y - CHIMNEY_BASE_Y;

const chimney = new THREE.Mesh(
  new THREE.CylinderGeometry(0.16, 0.16, CHIMNEY_LEN, 24),
  metalMat
);
chimney.position.y = CHIMNEY_BASE_Y + CHIMNEY_LEN / 2;
chimney.castShadow = true;
scene.add(chimney);

const chimneyHat = new THREE.Mesh(
  new THREE.CylinderGeometry(0.28, 0.28, 0.05, 24),
  metalMat
);
chimneyHat.position.y = CHIMNEY_TOP_Y + 0.05;
chimneyHat.castShadow = true;
scene.add(chimneyHat);

const chimneyFlange = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.22, 0.05, 24),
  metalMat
);
chimneyFlange.position.y = CHIMNEY_BASE_Y + 0.025;
scene.add(chimneyFlange);

// ============================================================
// WATER: column + animated surface
// ============================================================
const WATER_R = TANK_R - 0.025;
const WATER_MAX_H = TANK_H * 0.95;

const waterBodyMat = new THREE.MeshPhysicalMaterial({
  color: 0x1a5a8c,
  roughness: 0.06,
  metalness: 0.0,
  transmission: 0.4,
  thickness: 1.2,
  ior: 1.33,
  transparent: true,
  opacity: 0.92,
  side: THREE.DoubleSide,
  envMapIntensity: 1.3,
});

// Column (open cylinder, scaled in Y)
const waterColumn = new THREE.Mesh(
  new THREE.CylinderGeometry(WATER_R, WATER_R, 1, 48, 1, true),
  waterBodyMat
);
waterColumn.position.y = TANK_BASE_Y + 0.5;
scene.add(waterColumn);

// Bottom disc (closes the cylinder so se vea agua azul abajo en lugar del piso gris)
const waterBottom = new THREE.Mesh(
  new THREE.CircleGeometry(WATER_R, 48),
  waterBodyMat
);
waterBottom.rotation.x = Math.PI / 2;
waterBottom.position.y = TANK_BASE_Y + 0.005;
scene.add(waterBottom);

// Polar grid for animated surface
function makePolarGrid(radius, rings, segments) {
  const positions = [0, 0, 0];
  const indices = [];
  for (let r = 1; r <= rings; r++) {
    const rad = (r / rings) * radius;
    for (let s = 0; s < segments; s++) {
      const a = (s / segments) * Math.PI * 2;
      positions.push(Math.cos(a) * rad, 0, Math.sin(a) * rad);
    }
  }
  // Inner ring (center → first ring)
  for (let s = 0; s < segments; s++) {
    const next = (s + 1) % segments;
    indices.push(0, 1 + s, 1 + next);
  }
  // Outer rings
  for (let r = 1; r < rings; r++) {
    const ringStart = 1 + (r - 1) * segments;
    const nextRingStart = 1 + r * segments;
    for (let s = 0; s < segments; s++) {
      const next = (s + 1) % segments;
      const a = ringStart + s, b = ringStart + next;
      const c = nextRingStart + s, d = nextRingStart + next;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

const surfaceGeo = makePolarGrid(WATER_R, 10, 40);
const origPositions = new Float32Array(surfaceGeo.attributes.position.array);

const surfaceMat = new THREE.MeshPhysicalMaterial({
  color: 0x2c8fc4,
  roughness: 0.04,
  metalness: 0.0,
  transmission: 0.25,
  thickness: 0.6,
  ior: 1.33,
  transparent: true,
  opacity: 0.95,
  side: THREE.DoubleSide,
  envMapIntensity: 1.6,
  clearcoat: 0.9,
  clearcoatRoughness: 0.06,
});

const waterSurface = new THREE.Mesh(surfaceGeo, surfaceMat);
scene.add(waterSurface);

// ============================================================
// STATE & UI LOGIC
// ============================================================
let rawValue = 50;
let stateValue = 50;
let currentLevel = 0.5;
let targetLevel = 0.5;

function computeState(raw) {
  if (raw <= 0) return 0;
  return Math.min(100, Math.ceil(raw / 10) * 10);
}

const slider = document.getElementById('slider');
const rawDisplay = document.getElementById('rawValue');
const stateDisplay = document.getElementById('stateValue');
const levelFill = document.getElementById('levelFill');
const stateValueEl = document.querySelector('.display-card.state .display-value');

function levelColor(percent) {
  // Cárcamo de desechos: nivel alto = peligro de desbordamiento
  if (percent >= 69) return '#ff4757';  // límite crítico (desbordamiento)
  if (percent >= 45) return '#f5a742';  // rango crítico
  return '#00d4aa';                      // operación normal
}

function updateUI() {
  rawDisplay.textContent = rawValue;
  stateDisplay.textContent = stateValue;

  const c = levelColor(stateValue);
  stateValueEl.style.color = c;

  levelFill.style.height = stateValue + '%';
  levelFill.style.background = `linear-gradient(180deg, ${c}, ${c}55)`;

  // Sensor LED: cárcamo de desechos (nivel alto = peligro)
  if (stateValue >= 69) {
    sensorLEDMat.color.setHex(0xff3344);
    sensorLEDMat.emissive.setHex(0xff1122);
    sLEDLight.color.setHex(0xff3344);
  } else if (stateValue >= 45) {
    sensorLEDMat.color.setHex(0xf5a742);
    sensorLEDMat.emissive.setHex(0xe09020);
    sLEDLight.color.setHex(0xf5a742);
  } else {
    sensorLEDMat.color.setHex(0x44ff77);
    sensorLEDMat.emissive.setHex(0x22dd55);
    sLEDLight.color.setHex(0x44ff77);
  }
}

function setRawValue(v) {
  rawValue = v;
  stateValue = computeState(rawValue);
  targetLevel = stateValue / 100;
  updateUI();
}

slider.addEventListener('input', (e) => {
  setRawValue(parseInt(e.target.value, 10));
});

// Tick marks on level bar
const marksEl = document.getElementById('levelMarks');
for (let p = 10; p < 100; p += 10) {
  const m = document.createElement('div');
  m.className = 'level-mark';
  m.style.bottom = p + '%';
  marksEl.appendChild(m);
}

setRawValue(50);

// ============================================================
// ANIMATION
// ============================================================
const clock = new THREE.Clock();
const surfPosAttr = waterSurface.geometry.attributes.position;

function tick() {
  const t = clock.getElapsedTime();

  // Smooth level transition
  currentLevel += (targetLevel - currentLevel) * 0.07;
  if (Math.abs(targetLevel - currentLevel) < 0.0005) currentLevel = targetLevel;

  const waterH = currentLevel * WATER_MAX_H;
  const showWater = waterH > 0.01;

  waterColumn.visible = showWater;
  waterSurface.visible = showWater;
  waterBottom.visible = showWater;

  if (showWater) {
    waterColumn.scale.y = waterH;
    waterColumn.position.y = TANK_BASE_Y + waterH / 2;
    waterSurface.position.y = TANK_BASE_Y + waterH;
  }

  // Animate surface waves
  if (showWater) {
    for (let i = 0; i < surfPosAttr.count; i++) {
      const ox = origPositions[i * 3];
      const oz = origPositions[i * 3 + 2];
      const wave =
        Math.sin(t * 1.8 + ox * 4.0) * 0.030 +
        Math.cos(t * 1.4 + oz * 5.0) * 0.025 +
        Math.sin(t * 2.6 + (ox + oz) * 3.5) * 0.018;
      surfPosAttr.setY(i, wave);
    }
    surfPosAttr.needsUpdate = true;
    waterSurface.geometry.computeVertexNormals();
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
